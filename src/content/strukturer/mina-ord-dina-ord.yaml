# Mina ord – Dina ord. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: Mina ord – Dina ord
andra:
  - Ordjakten
syfte: Eleverna samlar egna ord och byter till sig andras
steg:
  - Läraren väljer om eleverna ska tänka enskilt eller i par.
  - Läraren ställer *frågan*, som ska vara öppen.
  - Eleverna får tanketid och skriver det de vet i spalten Mina ord.
  - Eleverna går runt i rummet och söker en kamrat när timern ringer.
  - Eleverna hälsar, sätter sig ned och fyller i varandras ord i spalten Dina ord.
  - Eleverna tackar varandra och söker upp en ny kamrat.
  - Läraren samlar alla ord i helklass.
