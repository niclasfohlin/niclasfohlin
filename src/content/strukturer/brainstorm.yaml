# Brainstorm. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: Brainstorm
andra: []
syfte: Gruppen samlar många svar samtidigt och ser sin gemensamma kunskap
steg:
  - Läraren delar in eleverna i grupper om två till fyra.
  - Läraren delar ut lappar eller miniwhiteboards till alla.
  - Läraren ställer *frågan*, som ska vara öppen.
  - Läraren sätter en timer på en till tre minuter.
  - Eleverna skriver alla sina svar på var sin lapp och lägger dem på bordet.
  - Eleverna diskuterar kort sina svar inom gruppen när timern ringer.
  - Eleverna vandrar runt och tittar på de andra gruppernas lösningar.
  - Läraren lyfter några svar i helklass.
slag: grupp
kalla:
  rubrik: Brainstorm
  commit: b492447
  summa: 100fb0bf
bild:
  scen: brainstorm
  alt: "Fyra elever sitter runt ett bord, och mitt på bordet står en stor klocka. Framför klockan ligger en hög gröna lappar med var sitt svar: en triangel, en cirkel, en stjärna, ett hjärta och en cirkel till. Tre av eleverna skriver samtidigt, var och en med en penna på en egen lapp. Den fjärde, bakom bordet till höger, lägger en skriven lapp med en kvadrat i högen. De två bakom bordet har var sin tankebubbla med flera svar, den ena en triangel, en stjärna och ett hjärta och den andra en cirkel och en kvadrat."
forslag:
  - omrade: lasning
    arskurs: F–3
    amne: svenska
    text: "Klassen ska läsa en bilderbok om en rävunge som går vilse i skogen. Du delar in eleverna i grupper om tre och frågar: Vad kan hända med rävungen på vägen hem? Under två minuter skriver eller ritar eleverna varje idé på en egen lapp och lägger den på bordet. När timern ringer pratar gruppen kort om lapparna, och sedan går eleverna runt och tittar på de andra gruppernas idéer. Du lyfter några idéer i helklass och börjar läsa boken."
  - omrade: skrivning
    arskurs: 7–9
    amne: svenska
    text: "Klassen ska skriva debattartiklar om skoldagens längd. Du delar in eleverna i grupper om fyra och frågar: Vilka argument finns för och emot en längre skoldag? Under tre minuter skriver eleverna varje argument på en egen lapp och lägger lappen på bordet. När timern ringer pratar gruppen kort om lapparna, och sedan går eleverna runt och tittar på de andra gruppernas argument. Du lyfter några argument i helklass, både sådana som flera grupper hittade och sådana som bara en grupp kom på."
  - omrade: matematik
    arskurs: 4–6
    amne: matematik
    text: "Klassen ska börja arbeta med bråk. Du delar in eleverna i grupper om tre och frågar: Vad vet ni om bråk? Under två minuter skriver eleverna varje sak de vet på en egen lapp, som ett exempel, en bild eller en regel, och lägger lappen på bordet. När timern ringer pratar gruppen kort om lapparna, och sedan går eleverna runt och tittar på de andra gruppernas lappar. Du lyfter några lappar i helklass och ser vad klassen redan kan inför arbetet."
  - omrade: socialt
    arskurs: 4–6
    amne: klassens råd
    text: "Klassen ska komma överens om hur de vill ha det på rasten. Du delar in eleverna i grupper om fyra och frågar: Vad kan vi göra för att alla ska få vara med? Under tre minuter skriver eleverna varje idé på en egen lapp och lägger den på bordet. När timern ringer pratar gruppen kort om idéerna, och sedan går eleverna runt och läser de andra gruppernas lappar. Du lyfter de idéer som flera grupper har kommit på."
utkast: false
