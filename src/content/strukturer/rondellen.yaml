syfte: Alla i gruppen säger sitt i tur och ordning
steg:
  - Läraren delar in eleverna i grupper om fyra.
  - Läraren ställer *frågan*, som ska vara öppen.
  - Eleverna får tid att tänka själva.
  - Eleverna turas om att säga sitt svar eller sin tanke.
  - Eleverna fortsätter varv efter varv tills läraren säger stopp.
  - Läraren låter grupperna sammanfatta vad som kom fram.
