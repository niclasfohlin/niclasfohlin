# Inre–yttre cirkel. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: Inre–yttre cirkel
andra:
  - Karusellsamtal
syfte: Två cirklar roterar så att alla möter många partner
steg:
  - Läraren delar klassen i två halvor.
  - Den ena halvan ställer sig i en inre cirkel med ansiktet utåt.
  - Den andra halvan ställer sig i en yttre cirkel, mitt emot var sin kamrat.
  - Läraren ger *frågan* och säger vilken cirkel som frågar.
  - Den som frågar ställer frågan och ger återkoppling på kamratens svar.
  - Den yttre cirkeln går ett steg åt höger inför nästa fråga.
  - Läraren avslutar och låter några berätta vad de hört.
slag: klass
kalla:
  rubrik: Inre–yttre cirkel
  commit: a79a53f
  summa: "04619007"
bild:
  scen: inre-yttre-cirkel
  alt: Två ringar är ritade på golvet, en inre och en yttre, och fyra par står snett fram och bak, en i den inre ringen och en i den yttre, vända mot varandra. I paret närmast till vänster ställer den yttre, som syns bakifrån, en fråga med ett frågetecken i pratbubblan, och den inre svarar med en kvadrat i pratbubblan. En pil längs den yttre ringen visar att den flyttar ett steg.
forslag:
  - omrade: lasning
    arskurs: F–3
    amne: svenska
    text: "Klassen har läst en saga, och du delar upp eleverna i en inre cirkel med ryggen inåt och en yttre cirkel, så att alla har en partner mittemot sig. Du bestämmer att den yttre cirkeln frågar och säger frågan högt inför varje varv, som: Vem var snällast i sagan, och hur märktes det? Eleven i den yttre cirkeln frågar den mittemot, lyssnar och säger vad hen tyckte var bra i svaret, och sedan tar den yttre cirkeln ett steg åt höger. Du avslutar och låter några par berätta vad de hörde."
  - omrade: skrivning
    arskurs: 7–9
    amne: svenska
    text: "Eleverna har med sig ett utkast till en novell, och du delar upp dem i en inre och en yttre cirkel med en partner mittemot varje elev. Du bestämmer att den yttre cirkeln frågar och delar ut frågekort, som: Vad vill du att läsaren ska känna i första stycket? Den mittemot svarar, frågeställaren säger vad hen vill läsa mer om, och den yttre cirkeln tar ett steg inför nästa fråga. Efter några varv bestämmer du att den inre cirkeln frågar, och till sist låter du några par berätta vad de hört."
  - omrade: matematik
    arskurs: 4–6
    amne: matematik
    text: "Klassen repeterar bråk, och du delar upp eleverna i en inre cirkel med ryggen inåt och en yttre cirkel, vända mot en partner. Du bestämmer att den yttre cirkeln frågar och delar ut frågekort med frågor som: Hur räknar du ut 3/4 av 36? Den som frågar ställer frågan till den mittemot, som svarar, och ger sedan återkoppling med hjälp av facit på kortets baksida. Den yttre cirkeln tar ett steg inför nästa fråga, och du avslutar med att låta några par berätta vilka sätt de hörde."
  - omrade: socialt
    arskurs: 4–6
    amne: klassens råd
    text: "Klassen ska lära känna varandra bättre, och du delar upp eleverna i två halvor som bildar en inre och en yttre cirkel med en partner mittemot varje elev. Du bestämmer att den yttre cirkeln frågar och delar ut frågekort som: Berätta om en gång då en kompis gjorde dig glad. Den som frågar lyssnar och säger vad hen hörde, och sedan tar den yttre cirkeln ett steg inför nästa fråga. Efter några varv bestämmer du att den inre cirkeln frågar, och till sist låter du några par berätta vad de hört."
