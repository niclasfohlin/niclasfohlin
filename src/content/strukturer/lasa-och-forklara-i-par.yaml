# Läsa och förklara i par. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: Läsa och förklara i par
andra: []
syfte: Den ena sammanfattar stycket med egna ord och den andra kontrollerar och fyller på
steg:
  - Läraren delar in eleverna i par och ger dem *texten*.
  - Eleverna läser rubrikerna tillsammans för att få en överblick.
  - Eleverna läser det första stycket tyst var för sig.
  - Den ena sammanfattar stycket med egna ord.
  - Den andra rättar det som blev fel, lägger till det som saknades och knyter till det de kan sedan.
  - Eleverna byter roller och gör om steg tre till fem med nästa stycke.
  - Eleverna enas om vad hela texten betyder och formulerar en gemensam sammanfattning.
slag: par
kalla:
  rubrik: Läsa och förklara i par
  commit: b492447
