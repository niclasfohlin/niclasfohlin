syfte: Var och en skriver på ett papper med egen rubrik och byter mot det i mitten
steg:
  - Läraren delar in eleverna i grupper och ger var och en ett papper med en egen *rubrik*.
  - Läraren lägger ett extra papper i mitten av varje bord.
  - Eleverna skriver ett svar på sitt papper.
  - Eleverna byter genom att ta papperet i mitten och lägga sitt där.
  - Eleverna läser vad som redan står och skriver ett nytt svar.
  - Eleverna fortsätter byta tills läraren bryter och väljer sedan svar att dela.
