namn: Speed-dating
andra:
  - Snabbmöten
  - Speed-dejting
syfte: Eleverna byter partner efter varje uppgift
steg:
  - Läraren ställer fram ett långbord, och eleverna sätter sig mitt emot varandra med något att anteckna på.
  - Läraren ger *uppgiften*.
  - Eleverna tänker trettio sekunder och löser uppgiften var för sig.
  - Paret diskuterar sina lösningar en minut.
  - Läraren lyfter några lösningar i helklass.
  - Eleverna på ena sidan flyttar en stol åt höger, och den sista går till första stolen.
  - Läraren ger en ny uppgift, och klassen gör om steg 3 till 6.
slag: klass
kalla:
  rubrik: Speed-dating
