namn: Speed-dating
andra:
  - Snabbmöten
  - Speed-dejting
syfte: Eleverna byter partner efter varje uppgift
steg:
  - Läraren ställer fram ett långbord med stolar på båda sidor.
  - Eleverna sätter sig så att de ser varandra.
  - Läraren ger varje elev något att anteckna på.
  - Läraren ger *uppgiften*.
  - Eleverna får trettio sekunders tanketid och löser sedan uppgiften var för sig.
  - Paret diskuterar sina lösningar med varandra en minut.
  - Läraren lyfter lösningar i helgrupp.
  - Eleverna flyttar en stol åt sidan och får en ny partner.
