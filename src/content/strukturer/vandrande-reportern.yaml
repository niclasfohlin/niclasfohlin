# Vandrande reportern. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: Vandrande reportern
andra:
  - Reportern
syfte: En från varje grupp hämtar idéer hos de andra
steg:
  - Läraren delar in eleverna i par eller fyrgrupper och ger anteckningsmaterial.
  - Läraren ställer *frågan* och ger trettio sekunders tanketid.
  - Läraren sätter en timer, och grupperna börjar skriva ett gemensamt svar.
  - Eleverna lägger ned pennorna när timern ringer.
  - Läraren utser en reporter i varje grupp.
  - Reportern går till en annan grupp och hör hur de har tänkt.
  - Reportern berättar för sin grupp, som skriver klart sitt svar.
slag: grupp
kalla:
  rubrik: Vandrande reportern
  commit: f8e8717
  summa: 1131a9d8
bild:
  scen: vandrande-reportern
  alt: Två grupper sitter vid var sitt bord. Vid bordet till vänster sitter tre elever med sitt papper, där det står en triangel, och pennan ligger bredvid på bordet. De tittar mot en elev i grön tröja som står vid bordet till höger med ett block och en penna i händerna och frågar, och pratbubblan visar ett frågetecken. Vid det bordet sitter tre elever, och eleven i ljusgrön tröja pekar på gruppens papper och berättar, med en kvadrat i pratbubblan. En pil går från bordet till vänster till eleven med blocket, och en annan pil går tillbaka.
forslag:
  - omrade: lasning
    arskurs: F–3
    amne: svenska
    text: "Klassen har läst en faktatext om igelkotten, och eleverna sitter i par med en lapp och en penna. Du frågar: Hur klarar sig igelkotten på vintern, och var i texten står det? Alla får trettio sekunders egen tanketid, och sedan enas paret om ett svar medan timern räknar ned och du går runt och stöttar. När timern ringer släpper alla pennan, och du utser en reporter i varje par som går till ett annat par, frågar hur de har svarat och lyssnar. Reportern går tillbaka och berättar, och paret skriver klart sitt svar."
  - omrade: skrivning
    arskurs: 7–9
    amne: NO
    text: "Klassen ska skriva labbrapporter, och eleverna sitter i fyrgrupper med papper och penna. Du frågar: Vilka av socker, salt, sand och matolja löser sig i vatten, och varför tror ni det? Alla får trettio sekunders egen tanketid, och sedan skriver gruppen en gemensam hypotes medan timern räknar ned och du går runt och stöttar. När timern ringer släpper alla pennan, och du utser en reporter i varje grupp som går till en annan grupp och lyssnar på hur de motiverar sin hypotes. Reportern går tillbaka och berättar, och gruppen skriver klart sin hypotes."
  - omrade: matematik
    arskurs: 4–6
    amne: matematik
    text: "Klassen arbetar med area, och eleverna sitter i fyrgrupper med papper och penna. Du frågar: Vilka olika rektanglar kan ha arean 24 kvadratcentimeter? Alla får trettio sekunders egen tanketid, och sedan enas gruppen om ett svar medan timern räknar ned och du går runt och stöttar. När timern ringer släpper alla pennan, och du utser en reporter i varje grupp som går till en annan grupp, frågar hur de har löst uppgiften och lyssnar. Reportern går tillbaka och berättar, och gruppen skriver klart sin lösning."
  - omrade: socialt
    arskurs: 4–6
    amne: klassens råd
    text: "På klassens råd sitter eleverna i fyrgrupper med papper och penna. Du frågar: Hur kan två lag dela på fotbollsplanen på rasten så att det blir rättvist? Alla får trettio sekunders egen tanketid, och sedan enas gruppen om ett förslag medan timern räknar ned och du går runt och stöttar. När timern ringer släpper alla pennan, och du utser en reporter i varje grupp som går till en annan grupp, frågar vad de har kommit fram till och lyssnar. Reportern går tillbaka och berättar, och gruppen skriver klart sitt förslag."
provad:
