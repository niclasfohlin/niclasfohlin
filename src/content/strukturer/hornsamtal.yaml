namn: Hörnsamtal
andra: []
syfte: Rummets fyra hörn får var sin fråga och eleverna går till den de vill tala om
steg:
  - Läraren sätter en *fråga* i vart och ett av rummets fyra hörn.
  - Eleverna tänker enskilt på vilket hörn de vill gå till.
  - Eleverna går till sitt hörn på lärarens signal.
  - Eleverna delar in sig i mindre grupper och samtalar om hörnets fråga.
  - Läraren slumpar en elev ur varje hörn som delar en tanke.
