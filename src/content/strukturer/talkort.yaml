namn: Talkort
andra:
  - Samtalskort
  - Talking chips
syfte: Var och en lägger ett kort för att tala, och alla ska ha talat
steg:
  - Läraren introducerar *samtalsämnet* som gruppen ska diskutera.
  - Läraren delar ut markörer och bestämmer reglerna för hur de används.
  - Läraren kan fördela roller som tidshållare, fokushållare och ordfördelare.
  - Eleverna påbörjar diskussionen.
  - Eleven som talar lägger sin markör i mitten, och ingen får ordet igen förrän alla lagt sin.
  - Eleverna utvärderar samarbetet genom att se om alla markörer ligger där.
