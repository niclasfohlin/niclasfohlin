namn: Multisvar i par
andra: []
syfte: Paret enas om ett svar och alla par håller upp det samtidigt
steg:
  - Läraren ställer *frågan* och delar in eleverna i par.
  - Eleverna får egen tanketid.
  - Eleverna samtalar i paret om frågan.
  - Eleverna enas om ett svar och skriver eller ritar det på en gemensam yta.
  - Läraren räknar till tre och alla par håller upp sitt svar.
  - Läraren ber några par berätta hur de tänkte.
  - Läraren sammanfattar de svar hen ser för hela klassen.
