namn: Kontraster
andra: []
syfte: Eleverna söker upp någon som tänkt annorlunda än de själva
steg:
  - Läraren ställer *den öppna frågan*.
  - Eleverna får tanketid och skriver sitt svar.
  - Eleverna går runt i rummet och letar efter någon som tänkt annorlunda.
  - Eleverna bildar par eller små grupper om tre till fyra.
  - Eleverna berättar för varandra vad de tänkt och varför.
  - Eleverna talar om varför de har tänkt på olika sätt.
  - Eleverna skriver enskilt ned vad de tycker nu.
