namn: På sightseeing
andra:
  - Vernissage
  - Galleri-redovisning
syfte: Grupperna går runt och kommenterar varandras arbeten
steg:
  - Läraren låter alla grupper hänga upp sina *arbeten* på väggarna.
  - Eleverna vandrar tillsammans med sin grupp medsols förbi alla arbeten.
  - Eleverna skriver positiva kommentarer eller frågor på lappar och sätter upp dem.
  - Eleverna läser och bearbetar de kommentarer den egna gruppen fått.
  - Grupperna redovisar vad de ändrade och varför.
