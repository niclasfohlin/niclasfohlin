syfte: Var och en skriver fem ord, paret väljer tre och gruppen enas om ett
steg:
  - Läraren ger *innehållet* som ska sammanfattas.
  - Eleverna skriver enskilt fem ord eller korta meningar om det.
  - Eleverna bildar par och delar sina fem ord med varandra.
  - Eleverna väljer tillsammans ut de tre bästa.
  - Två par bildar en grupp och delar sina tre.
  - Eleverna enas i gruppen om det bästa av dem.
  - Eleverna redovisar gruppens val för klassen.
