namn: Läs med roller
andra: []
syfte: Var och en i gruppen läser samma text med ett eget fokus och berättar vad de såg
steg:
  - Läraren delar in eleverna i grupper och ger alla *samma text*.
  - Läraren ger varje elev i gruppen ett eget fokus att läsa efter.
  - Eleverna läser texten, högt i tur och ordning eller var för sig.
  - Eleverna antecknar stödord utifrån sitt eget fokus medan de läser.
  - Eleverna sammanfattar en i taget vad de fick syn på.
  - Gruppen för ett öppet samtal om vad texten säger.
  - Grupperna berättar för klassen vad de kom fram till.
