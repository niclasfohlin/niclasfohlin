# Lär klassen. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: Lär klassen
andra: []
syfte: Varje grupp sätter sig in i ett delområde och håller sedan ett lärtillfälle om det
steg:
  - Läraren ger *temat* och delar det i lika många delområden som det finns grupper.
  - Eleverna sätter sig in i sitt delområde och lär varandra inom gruppen.
  - Eleverna sammanfattar det viktigaste i sitt område.
  - Eleverna planerar hur de ska lära resten av klassen om det.
  - Läraren talar med klassen om olika sätt att lära ut.
  - Eleverna håller sitt lärtillfälle för klassen eller i tvärgrupper.
  - Läraren leder ett avslutande samtal om vad klassen lärt sig.
slag: grupp
kalla:
  rubrik: Lär klassen
  commit: b492447
  summa: 200bf997
bild:
  scen: lar-klassen
  alt: Tre elever i orange tröjor står framme vid tavlan. Den ena pekar på ett kort med en stjärna på tavlan och förklarar, och pratbubblan visar en stjärna. De två andra tittar ut mot klassen, och den ena håller ett papper med anteckningar. Fyra elever sitter med ryggen mot oss och lyssnar, och eleven i lila tröja räcker upp handen och frågar, med ett frågetecken i pratbubblan.
forslag:
  - omrade: lasning
    arskurs: F–3
    amne: NO
    text: Temat är djur i skogen, och du delar det så att varje grupp får ett djur, som älgen, räven, igelkotten och ugglan. Varje grupp läser en kort faktatext om sitt djur, och eleverna lär varandra i gruppen vad som står i den. Gruppen väljer tre saker som klassen ska få veta och planerar hur de ska lära ut dem, till exempel med en bild och en fråga. Du pratar med klassen om olika sätt att lära ut, och sedan håller varje grupp sitt lärtillfälle. Du avslutar med ett samtal om vad klassen har lärt sig.
  - omrade: skrivning
    arskurs: 4–6
    amne: svenska
    text: "Temat är texttyper, och du delar det i fyra delområden: berättande, beskrivande, instruerande och argumenterande text. Varje grupp läser två korta exempel på sin texttyp och lär varandra i gruppen hur den är byggd. Gruppen skriver tre kännetecken och planerar hur de ska lära klassen, till exempel med en text där klassen letar efter kännetecknen. Du pratar med klassen om olika sätt att lära ut, och sedan håller grupperna sina lärtillfällen. Du avslutar med ett samtal om vad klassen ska tänka på när de skriver varje texttyp."
  - omrade: matematik
    arskurs: 7–9
    amne: matematik
    text: "Temat är statistik, och du delar det i fyra delområden: medelvärde, median, typvärde och variationsbredd. Varje grupp läser om sitt delområde i boken och lär varandra hur man räknar ut det på en datamängd. Gruppen sammanfattar det de har lärt sig och planerar hur de ska lära resten av klassen, till exempel med ett räknat exempel och en övningsuppgift. Du pratar med klassen om olika sätt att lära ut. Sedan håller grupperna sina lärtillfällen i tvärgrupper, och du avslutar med ett samtal om vad klassen har lärt sig."
  - omrade: socialt
    arskurs: 4–6
    amne: livskunskap
    text: "Temat är hur vi är en bra grupp, och du delar det i fyra delområden: lyssna, turas om, uppmuntra och be om hjälp. Varje grupp pratar om sitt delområde och lär varandra hur det ser ut och låter, till exempel vad man säger när man behöver hjälp. Gruppen väljer det som klassen ska få veta och planerar hur de ska lära ut det, till exempel med en kort scen som de spelar upp. Du pratar med klassen om olika sätt att lära ut. Sedan håller varje grupp sitt lärtillfälle, och du avslutar med ett samtal om vad klassen har lärt sig."
