syfte: Varje grupp sätter sig in i ett delområde och håller sedan ett lärtillfälle om det
steg:
  - Läraren ger *temat* och delar det i lika många delområden som det finns grupper.
  - Eleverna sätter sig in i sitt delområde och lär varandra inom gruppen.
  - Eleverna sammanfattar det viktigaste i sitt område.
  - Eleverna planerar hur de ska lära resten av klassen om det.
  - Läraren talar med klassen om olika sätt att lära ut.
  - Eleverna håller sitt lärtillfälle för klassen eller i tvärgrupper.
  - Läraren leder ett avslutande samtal om vad klassen lärt sig.
