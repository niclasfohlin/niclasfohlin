syfte: Läraren läser ett stycke i taget och eleverna skriver nyckelord och jämför
steg:
  - Läraren delar *texten* i tre eller fyra delar och eleverna i grupper om tre till fyra.
  - Eleverna lägger ned pennorna och lyssnar på första delen utan att anteckna.
  - Eleverna skriver enskilt tre eller fyra nyckelord i den första rutan.
  - Eleverna delar sina nyckelord i gruppen och jämför dem.
  - Läraren läser nästa del och eleverna gör om steg tre och fyra.
  - Eleverna sammanfattar hela texten tillsammans.
