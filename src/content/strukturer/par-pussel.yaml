namn: Par-pussel
andra:
  - Kvadraten
  - Pairs compare
syfte: Två par i fyrgruppen löser var sin uppgift och lär sedan varandra hur de gjorde
steg:
  - Läraren delar in eleverna i fyrgrupper med två par i varje.
  - Eleverna går med sitt par till var sin plats i rummet.
  - Eleverna löser sin *uppgift* i paret och skriver eller ritar lösningen.
  - Paren återförenas i sin fyrgrupp.
  - Eleverna visar sitt problem och lär det andra paret hur de löste det.
  - Eleverna talar om hur samarbetet gick.
