namn: Solfjäder
andra: []
syfte: Fyra elever har var sin uppgift kring ett frågekort, och rollerna vandrar
steg:
  - Läraren ger varje grupp en uppsättning *frågekort*.
  - Gruppen låter den förste hålla korten som en solfjäder med baksidan utåt.
  - Gruppen låter den andre dra ett kort och läsa frågan högt.
  - Gruppen ger den tredje fem sekunders tanketid att svara.
  - Gruppen låter den fjärde kontrollera svaret och berömma eller coacha.
  - Gruppen låter den fjärde sammanfatta tankegången i stället, när frågan är öppen.
  - Gruppen flyttar rollerna ett steg och tar ett nytt kort.
