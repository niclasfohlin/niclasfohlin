namn: Rösta!
andra: []
syfte: Var och en fördelar sina markörer mellan flera förslag i stället för ett
steg:
  - Läraren ger *frågan* som gruppen ska enas om och låter förslagen samlas synligt.
  - Läraren ger varje elev fem markörer i en egen färg.
  - Eleverna funderar enskilt på vilka förslag som håller.
  - Eleverna lägger sina markörer på minst två av förslagen.
  - Eleverna räknar tillsammans vilket förslag som fick flest.
  - Eleverna talar om varför just det förslaget vann.
