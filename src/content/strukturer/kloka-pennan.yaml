# Kloka pennan. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: Kloka pennan
andra:
  - Tänkare och skrivare
syfte: En tänker och en skriver, och rollerna växlar
steg:
  - Läraren delar in eleverna i par.
  - Läraren ger *uppgiften*, som ska kräva anteckningar eller en skiss.
  - Paret bestämmer vem som tänker och vem som skriver.
  - Tänkaren löser uppgiften högt, och den med Kloka pennan skriver ned utan att ändra.
  - Paret växlar roller på lärarens signal och sammanfattar sitt svar.
