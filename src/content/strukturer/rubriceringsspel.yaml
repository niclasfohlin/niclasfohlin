namn: Rubriceringsspel
andra: []
syfte: Gruppen hittar på egna rubriker att sortera korten efter, och gör sedan om det
steg:
  - Läraren ger varje grupp en uppsättning *kort*.
  - Eleverna talar sig samman om vilka rubriker korten kan sorteras under.
  - Eleverna sorterar korten och skriver upp rubrikerna och vad som hamnade var.
  - Eleverna blandar korten och hittar på nya rubriker.
  - Eleverna gör om sorteringen efter de nya rubrikerna.
  - Läraren jämför gruppernas lösningar i helklass och söker likheter.
slag: grupp
kalla:
  rubrik: Rubriceringsspel
  commit: b492447
  summa: 976347d8
bild:
  scen: rubriceringsspel
  alt: Fyra elever sitter runt ett bord. Överst på bordet står tre gula rubrikskyltar upprätt i en rad, gruppens egna rubriker, med en cirkel, en stjärna och ett hjärta. Under varje skylt ligger kort med skrivna ord i en spalt. Eleven bakom bordet till höger ställer upp den nya skylten med hjärtat och säger rubriken, och pratbubblan visar ett hjärta. Eleven vid bordets högra kortsida har ett kort med ord i handen och tänker att det hör dit, med ett hjärta i tankebubblan. De två till vänster tittar på den nya rubriken.
forslag:
  - omrade: lasning
    arskurs: 7–9
    amne: svenska
    text: Klassen har läst en novell och ska tolka huvudpersonen. Du ger varje grupp tolv kort med korta citat ur novellen som visar hur huvudpersonen är. Eleverna talar sig samman om rubriker som korten kan sorteras under, sorterar dem och skriver upp rubrikerna och vad som hamnade var. Sedan blandar de korten, hittar på nya rubriker och sorterar om. Du jämför gruppernas lösningar i helklass och söker likheter i hur grupperna läste huvudpersonen.
  - omrade: skrivning
    arskurs: F–3
    amne: svenska
    text: Klassen ska skriva egna sagor. Du ger varje grupp tolv ordkort ur sagor, som drake, slott, skog, trollkarl, mörker och svärd, som sedan blir gruppens ordbank när eleverna skriver. Eleverna talar sig samman om rubriker att sortera orden under, sorterar dem och skriver upp rubrikerna och vad som hamnade var. Sedan blandar de korten, hittar på nya rubriker och sorterar om. Du jämför gruppernas lösningar i helklass och söker likheter, till exempel vilka som sorterade efter platser och varelser.
  - omrade: matematik
    arskurs: 4–6
    amne: matematik
    text: Klassen arbetar med olika slags tal. Du ger varje grupp tio kort med tal, som 2, 3, 9, 12, 15, 16, 25 och 36. Eleverna talar sig samman om rubriker att sortera talen under, sorterar dem och skriver upp rubrikerna och vad som hamnade var. Sedan blandar de korten, hittar på nya rubriker och sorterar om. Du jämför gruppernas lösningar i helklass och söker likheter, till exempel vilka som hittade kvadrattalen.
  - omrade: socialt
    arskurs: 7–9
    amne: mentorstid
    text: Mentorsgruppen pratar om hur de vill ha det i klassen. Du ger varje grupp tolv kort med korta situationer, som ”ingen vill sitta med mig”, ”vi hjälper varandra inför provet” och ”någon skrattar åt ett svar”. Eleverna talar sig samman om rubriker som situationerna kan sorteras under, sorterar dem och skriver upp rubrikerna och vad som hamnade var. Sedan blandar de korten, hittar på nya rubriker och sorterar om. Du jämför gruppernas lösningar i helklass och söker likheter i vad grupperna tycker är viktigt.
utkast: false
