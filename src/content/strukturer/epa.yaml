# EPA. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: EPA
andra:
  - Enskilt, par, alla
  - Think-Pair-Share
syfte: Var och en tänker först, sedan par, sedan helklass
steg:
  - Läraren ställer *frågan*, som ska vara öppen.
  - Eleverna får tanketid och funderar på svaret enskilt.
  - Eleverna diskuterar svaret i par.
  - Eleverna delar sina svar med hela klassen.
slag: par
kalla:
  rubrik: EPA
  commit: b492447
  summa: 7a8e7d63
bild:
  scen: epa
  alt: Tre par sitter vid var sin bänk i en rad, och i varje par vänder sig de två mot varandra och talar. Över paret i mitten har var och en en egen tankebubbla, en triangel hos den ena och en kvadrat hos den andra, och mellan dem står en pratbubbla med både triangeln och kvadraten. Den till vänster i mittparet visar med handen mot sin bänkkamrat.
forslag:
  - omrade: lasning
    arskurs: F–3
    amne: svenska
    text: "Du läser högt ur en saga om en räv som är rädd för mörkret och stannar mitt i. Du frågar: Vad tror du att räven gör sedan, och vad i sagan får dig att tänka så? Var och en tänker en stund, sedan berättar eleverna sin gissning för varandra i paren. Du låter några par berätta för klassen vad de kom fram till."
  - omrade: skrivning
    arskurs: 7–9
    amne: svenska
    text: "Klassen ska skriva en debattartikel om skolmaten. Du frågar: Vilket är det starkaste argumentet för din åsikt, och vilken invändning måste du bemöta? Var och en tänker och skriver några stolpar, sedan prövar eleverna sina argument på varandra i paren. Du låter fyra par berätta för klassen vilket argument de skulle börja med."
  - omrade: matematik
    arskurs: 4–6
    amne: matematik
    text: "Klassen arbetar med area. Du frågar: Vilka rektanglar med hela centimeter som sidor har arean 24 kvadratcentimeter, och hur vet du att du har hittat alla? Var och en tänker och ritar en stund, sedan jämför eleverna i paren sina rektanglar och hur de vet att ingen fattas. Du låter några par visa sitt sätt på tavlan för klassen."
  - omrade: socialt
    arskurs: 4–6
    amne: klassens råd
    text: "Klassen har klassråd, och rasterna har blivit stökiga. Du frågar: Vad skulle få rasten att fungera för alla, och vad kan du göra själv? Var och en tänker en stund, sedan pratar eleverna i paren och väljer ett förslag. Du låter paren berätta sina förslag för klassen och skriver dem på tavlan."
provad:
  datum: "2026-11-01"
  svar: underlag/prov/strukturer/provning/avgorande.md
utkast: false
