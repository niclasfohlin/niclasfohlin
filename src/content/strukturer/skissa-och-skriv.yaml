bild: { scen: skissa-och-skriv, alt: "Tre elever sitter bakom ett bord där fyra papper ligger i en rad med pilar mellan sig: en bild av en gul stjärna, en text, en teckning av en gul triangel och en text till. Eleven till vänster pekar på stjärnan och har en stjärna i pratbubblan. Eleven i mitten lutar sig fram och pekar på den första texten. Eleven till höger pekar på triangeln och har en triangel och ett utropstecken i pratbubblan." }
