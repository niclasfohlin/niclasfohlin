namn: Berätta mera!
andra:
  - Berättaren
syfte: Alla samtalar parvis om samma innehåll, med nya partner varje runda
steg:
  - Läraren bestämmer *innehållet* som alla ska berätta om.
  - Eleverna rör sig fritt i rummet med en hand uppsträckt, vilket betyder att de är lediga för samtal.
  - Eleverna som möts med uppsträckt hand ger varandra en high five.
  - Eleverna turas om att kort berätta om innehållet.
  - Eleverna tackar för samtalet och sträcker upp handen igen.
  - Eleverna söker upp en ny kamrat och gör om det.
  - Läraren avbryter och låter varje elev sammanfatta något hen minns från samtalen.
