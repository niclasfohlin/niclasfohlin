# En för alla. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: En för alla
andra:
  - En för alla, alla för en
syfte: Var och en bidrar, och gruppen samlar allas idéer i cirklar
steg:
  - Läraren ställer *frågan* eller ber eleverna skriva ned sina tankar om ett område.
  - Eleverna skriver på tid alla exempel de kommer på i den innersta cirkeln.
  - Eleverna bildar par.
  - Paret delar sina idéer och lägger till kamratens tankar i cirkeln Par.
  - Paren bildar fyrgrupper, utbyter idéer och lägger till nya tankar i cirkeln Grupp.
  - Läraren summerar alla gruppers idéer, och eleverna lägger till det de saknar.
  - Eleverna tackar varandra för att de lärt varandra något nytt.
