# Samtalspromenad. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: Samtalspromenad
andra: []
syfte: Paret samtalar om frågan under en promenad och berättar sedan för andra
steg:
  - Läraren delar in eleverna i par eller grupper och låter dem hälsa på varandra.
  - Läraren ger *frågan* och säger hur lång promenaden är.
  - Eleverna går sin promenad och samtalar om frågan hela vägen.
  - Läraren kallar tillbaka dem med en signal när tiden är slut.
  - Eleverna berättar om sina tankar i en ny gruppering eller inför klassen.
slag: par
kalla:
  rubrik: Samtalspromenad
  commit: b492447
  summa: c5741d86
bild:
  scen: samtalspromenad
  alt: Två elever går sida vid sida mitt på en väg som är markerad med streckade linjer, och de vänder sig mot varandra. Den ena talar, och pratbubblan visar en triangel. Den andra har en triangel och en kvadrat i tankebubblan. Längre fram på vägen går två andra elever och samtalar.
forslag:
  - omrade: lasning
    arskurs: 7–9
    amne: svenska
    text: "Klassen har läst tre kapitel i romanen. Du delar in eleverna i par, låter dem hälsa på varandra och ger frågan: Vem i boken har det svårast just nu, och vad får dig att tro det? Paren går en promenad på tio minuter, ute eller i korridoren, och samtalar om frågan hela vägen. När du ger signalen kommer alla tillbaka, och paren berättar sina tankar för ett annat par."
  - omrade: skrivning
    arskurs: F–3
    amne: svenska
    text: "Klassen ska skriva om sin helg. Du delar in eleverna i par, låter dem hälsa på varandra och ger frågan: Vad gjorde du i helgen som du vill berätta om? Paren går en promenad på åtta minuter och samtalar om frågan hela vägen, och de turas om att berätta och lyssna. Du kallar tillbaka dem med en signal, och eleverna berättar för ett annat par vad kompisen berättade innan var och en skriver om sin helg."
  - omrade: matematik
    arskurs: 7–9
    amne: matematik
    text: "Klassen har arbetat med procent. Du delar in eleverna i par, låter dem hälsa på varandra och ger frågan: Kan tio procent av ett tal vara större än tjugo procent av ett annat tal, och när? Paren går en promenad på tio minuter och samtalar om frågan hela vägen. När du ger signalen kommer alla tillbaka, och paren berättar sina exempel för klassen."
  - omrade: socialt
    arskurs: 4–6
    amne: klassens råd
    text: "Klassen pratar om rasten. Du delar in eleverna i par, låter dem hälsa på varandra och ger frågan: Vad kan du göra när du ser att någon står själv och vill vara med? Paren går en promenad på åtta minuter och samtalar om frågan hela vägen. När du ger signalen kommer alla tillbaka, och varje par berättar sina tankar för ett annat par."
utkast: false
