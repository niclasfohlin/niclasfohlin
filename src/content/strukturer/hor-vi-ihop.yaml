namn: Hör vi ihop?
andra:
  - Para ihop
syfte: Eleverna söker upp de kort som hör ihop med deras eget
steg:
  - Läraren delar ut ett kort med ett *begrepp* till varje elev.
  - Eleverna tittar först på sitt eget kort och försöker lista ut vad de har.
  - Eleverna visar kortet för bänkgrannen och berättar hur de tänkt.
  - Eleverna går omkring i rummet och hittar dem vars kort hör ihop med deras.
  - Gruppen som hittat varandra funderar på vad de har gemensamt.
  - Grupperna sammanfattar lärdomarna tillsammans med läraren.
