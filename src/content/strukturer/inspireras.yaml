# Inspireras. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: Inspireras
andra:
  - Galleri
syfte: Grupperna tittar på varandras lösningar mitt i arbetet
steg:
  - Läraren delar in eleverna i par eller mindre grupper och ger anteckningsmaterial.
  - Läraren ger *frågan* och sätter en timer.
  - Eleverna börjar lösa uppgiften i sin grupp.
  - Läraren går runt, observerar och stöttar bara vid behov.
  - Eleverna går tillsammans med sin grupp runt och tittar på de andras lösningar när timern ringer.
  - Eleverna pekar på den lösning de förstod bäst när de är tillbaka på plats.
  - Läraren slumpar fram några som berättar varför.
  - Grupperna arbetar klart och delar sina färdiga lösningar.
slag: grupp
