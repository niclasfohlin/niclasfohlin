bild: { scen: inspireras, alt: "Längst fram står ett bord utan elever, med ett papper med en triangel, en penna och en stor klocka som ringer. En pil går från bordet till ett bord längre bak, där tre elever i lila tröjor står runt om och tittar på ett papper med en grön cirkel. Den till vänster pekar på cirkeln och talar. Den till höger har handen på bordet och en triangel och en grön cirkel i tankebubblan. Den tredje står framför bordet och syns bakifrån." }
