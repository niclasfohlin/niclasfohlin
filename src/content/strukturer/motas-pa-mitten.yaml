# Mötas på mitten. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: Mötas på mitten
andra:
  - Placemat
syfte: Var och en skriver i sitt fält, gruppen enas i mitten
steg:
  - Läraren delar ut ett gemensamt papper eller en whiteboard per grupp.
  - Läraren ställer *frågan*, som ska vara öppen.
  - Eleverna funderar först själva och skriver i sitt eget fält.
  - Eleverna delar sina tankar med gruppen när läraren bryter.
  - Eleverna väljer ut sina bästa gemensamma argument och skriver dem i mitten.
  - Grupperna jämför sina mittfält med varandra eller i helklass.
slag: grupp
kalla:
  rubrik: Mötas på mitten
  commit: b492447
  summa: 6fa539ad
bild:
  scen: motas-pa-mitten
  alt: Fyra elever sitter runt ett bord med ett stort papper som har fyra fält och en ruta i mitten. I fälten står en stjärna, en grön cirkel, en kvadrat och en stjärna till. Två av eleverna har en stjärna i pratbubblan, och den ena pekar på stjärnan i sitt fält. En tredje skriver stjärnan i rutan i mitten med en blå penna.
forslag:
  - omrade: lasning
    arskurs: 7–9
    amne: svenska
    text: "Klassen har läst en roman om vänskap, och du delar ut ett stort papper med ett fält per elev och en ruta i mitten till varje grupp. Du ställer den öppna frågan: Vad vill författaren säga om vänskap, och vilka scener visar det? Eleverna funderar först själva och skriver i sitt eget fält. När du bryter delar de sina tankar med gruppen, väljer ut de bästa gemensamma argumenten och skriver dem i mitten. Grupperna jämför sina mittfält i helklass."
  - omrade: skrivning
    arskurs: 4–6
    amne: svenska
    text: "Klassen ska skriva instruktioner, och du delar ut ett stort papper med ett fält per elev och en ruta i mitten till varje grupp. Du ställer den öppna frågan: Vad behöver en instruktion ha för att man ska kunna följa den? Eleverna funderar först själva och skriver i sitt eget fält. När du bryter delar de sina tankar med gruppen och skriver de bästa gemensamma svaren i mitten. Grupperna jämför sina mittfält med varandra."
  - omrade: matematik
    arskurs: F–3
    amne: matematik
    text: "Klassen arbetar med talet 12, och du delar ut ett stort papper med ett fält per elev och en ruta i mitten till varje grupp. Du ställer den öppna frågan: Vilka uträkningar kan du hitta som blir 12? Eleverna funderar först själva och skriver sina uträkningar i sitt eget fält, till exempel 6 + 6 eller 2 × 6. När du bryter visar de sina uträkningar för gruppen och skriver i mitten tre som alla i gruppen kan förklara. Grupperna jämför sina mittfält i helklass."
  - omrade: socialt
    arskurs: 7–9
    amne: mentorstid
    text: "Det har varit stökigt i korridoren, och du delar ut ett stort papper med ett fält per elev och en ruta i mitten till varje grupp. Du ställer den öppna frågan: Vad får korridoren att kännas trygg för alla, och vad kan vi göra själva? Eleverna funderar först själva och skriver i sitt eget fält. När du bryter delar de sina tankar med gruppen, väljer ut de förslag som alla kan stå för och skriver dem i mitten. Grupperna jämför sina mittfält med varandra."
