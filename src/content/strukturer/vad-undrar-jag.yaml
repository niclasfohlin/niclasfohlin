namn: Vad undrar jag?
andra: []
syfte: Eleverna skriver var sin fråga och gruppen drar dem en i taget ur högen
steg:
  - Läraren presenterar *innehållet*.
  - Eleverna skriver på en lapp vad de undrar över.
  - Eleverna viker lapparna och lägger dem i en hög mitt på bordet.
  - En i gruppen drar en lapp och läser frågan högt.
  - Gruppen talar om vad de tänker och kan om frågan.
  - Gruppen drar en ny lapp när de är klara med den förra.
  - Läraren bryter efter en stund och låter varje grupp dela en fråga.
