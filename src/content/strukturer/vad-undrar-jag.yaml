namn: Vad undrar jag?
andra: []
syfte: Eleverna skriver var sin fråga och gruppen drar dem en i taget ur högen
steg:
  - Läraren presenterar *innehållet* och eleverna tar del av det.
  - Eleverna skriver på en lapp vad de undrar över.
  - Eleverna skrynklar ihop lappen eller lägger den upp och ned mitt på bordet.
  - Eleverna låter en i gruppen dra en lapp och läsa frågan högt.
  - Eleverna talar om vad de tänker och vad de kan om frågan.
  - Eleverna drar en ny lapp när de är klara med den förra.
  - Läraren bryter efter lämplig tid och låter varje grupp dela en fråga.
