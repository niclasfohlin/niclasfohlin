namn: Frågerundan
andra: []
syfte: Fyra elever turas om att fråga, svara, upprepa och stötta
steg:
  - Läraren delar in eleverna i grupper om fyra som sitter nära varandra.
  - Eleverna numreras ett till fyra, och elev ett får högen med *frågekort*.
  - Eleven med korten håller fram dem med baksidan upp.
  - Elev två drar ett kort, läser frågan för elev tre och ser till att hen förstår den.
  - Elev tre funderar och svarar efter förmåga.
  - Elev fyra upprepar svaret och ger beröm om det var rätt.
  - Elev fyra förklarar och ger exempel i stället, om elev tre hade svårt att svara.
  - Eleverna roterar rollerna och gör om det med nästa kort.
