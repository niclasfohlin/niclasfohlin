syfte: Var och en ritar en bild och skriver sedan en berättelse till kamratens bild
steg:
  - Läraren ger *temat*, säger att en kamrat ska skriva till bilden, och eleverna ritar var sin.
  - Eleverna byter teckningar med sin kamrat.
  - Eleverna funderar ut en berättelse som passar till bilden de fått.
  - Eleverna berättar sin idé för varandra i paret.
  - Eleverna skriver berättelsen med början, mitt och slut.
  - Eleverna läser upp den för den som ritade bilden.
  - Läraren samlar bilder och texter till en gemensam samling som klassen kan läsa.
