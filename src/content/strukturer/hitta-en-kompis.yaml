namn: Hitta en kompis
andra: []
syfte: Eleverna söker upp en partner och löser en uppgift tillsammans
steg:
  - Läraren ber eleverna ställa sig upp och sträcka upp handen.
  - Eleverna rör sig i rummet, söker ögonkontakt och ger varandra en high five.
  - Eleverna sätter sig ned tillsammans två och två.
  - Läraren ger *uppgiften* eller ställer en öppen fråga.
  - Paret bestämmer vem som är stjärna och vem som är hjärta.
  - Paret löser uppgiften tillsammans.
  - Läraren slumpar frågor till paren och riktar dem till stjärnan eller hjärtan.
  - Eleverna tackar varandra och gör om det med en ny partner.
