namn: Läs-rita-redovisa
andra: []
syfte: Varje grupp läser sin egen text stycke för stycke och ritar den på en karta
steg:
  - Läraren ger varje grupp en egen *text* och delar den i två till fyra stycken.
  - Eleverna läser första stycket var för sig och antecknar en tanke.
  - Eleverna talar om stycket och vad det betyder.
  - Eleverna ritar och skriver stycket på gruppens gemensamma karta.
  - Eleverna gör om steg två till fyra för varje stycke.
  - Eleverna redovisar sin karta för de andra grupperna.
