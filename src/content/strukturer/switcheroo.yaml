namn: Switcheroo!
andra: []
syfte: En numrerad elev går vidare och sammanfattar sin grupps samtal i nästa grupp
steg:
  - Läraren delar in eleverna i grupper om tre till fyra och numrerar dem.
  - Eleverna löser *uppgiften* i sin grupp med en annan struktur.
  - Läraren säger switcheroo, och nummer ett går vidare till nästa grupp.
  - Eleverna som bytt sammanfattar sin egen grupps samtal för den nya gruppen.
  - Eleverna talar vidare om det som kom in i gruppen.
  - Eleverna går tillbaka till sin hemgrupp och får nästa uppgift.
  - Läraren låter nummer två byta nästa gång, tills alla har bytt.
