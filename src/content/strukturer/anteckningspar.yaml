namn: Anteckningspar
andra: []
syfte: Paret jämför sina anteckningar under genomgången och var och en tar med sig något ur kamratens
steg:
  - Läraren delar in eleverna i par innan genomgången börjar.
  - Eleverna antecknar var för sig medan läraren talar.
  - Läraren stannar efter omkring tio minuter.
  - Den ena sammanfattar sina anteckningar för den andra.
  - Den andra gör samma sak.
  - Eleverna för in något ur kamratens anteckningar i sina egna.
  - Eleverna gör om steg två till sex tills genomgången är slut.
  - Eleverna skriver under varandras anteckningar när de är fullständiga.
