namn: Kommunicera
andra:
  - Beskriv och rita
syfte: En beskriver, en lyssnar, en observerar kommunikationen
steg:
  - Läraren delar in eleverna i grupper om tre och fördelar rollerna berättare, lyssnare och observatör.
  - Läraren placerar berättaren och lyssnaren mitt emot varandra med ett skydd emellan.
  - Läraren ger observatören något att anteckna på.
  - Berättaren får ett *innehåll* att beskriva, som lyssnaren inte ser.
  - Berättaren beskriver innehållet så tydligt hen kan.
  - Lyssnaren ställer motfrågor för att förstå bättre.
  - Observatören antecknar vad som fungerar och vad som kan bli bättre.
  - Observatören ger återkoppling, och berättaren fortsätter med de tipsen.
