bild: { scen: samtalsbingo, alt: "En elev håller fram en bricka med nio rutor mot en kamrat och håller den i nederkanten. I rutorna finns bilder: ett hjärta, en cirkel, ett kugghjul, en bok, en stjärna, en triangel, en kvadrat, en penna och en hand. De två första rutorna i den översta raden är färgade gröna. Eleven frågar, och pratbubblan visar ett frågetecken. Kamraten pekar på rutan med kugghjulet och förklarar, och pratbubblan visar samma kugghjul. Till höger går en elev med handen uppsträckt och en bricka med rutor i den andra handen." }
