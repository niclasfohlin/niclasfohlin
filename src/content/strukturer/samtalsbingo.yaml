namn: Samtalsbingo
andra:
  - Bingo
  - Hitta någon som
syfte: Var och en samlar kamraternas förklaringar tills en rad på brickan är full
steg:
  - Läraren delar ut en bricka med *bilderna* eller *orden* till varje elev.
  - Eleverna går runt i rummet med handen uppsträckt.
  - Eleverna möts två och två och gör en hälsning.
  - Eleverna frågar varandra vad en ruta föreställer och berättar vad de tror.
  - Eleverna skriver kamratens namn i den ruta de fått förklarad.
  - Eleverna går vidare till en ny kamrat.
  - Eleverna som fått en rad full berättar för läraren vad som står på raden.
