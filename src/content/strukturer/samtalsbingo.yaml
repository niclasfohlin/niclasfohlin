# Samtalsbingo. Namnet, andra namn, syftet och stegen kommer ur grundbokens bank (docs/strukturer.md) och skrivs om av
# node scripts/strukturer/intag.mjs: ändra dem i banken. Slaget, bilden och förslagen är sajtens.
namn: Samtalsbingo
andra:
  - Bingo
  - Hitta någon som
syfte: Var och en samlar kamraternas förklaringar tills en rad på brickan är full
steg:
  - Läraren ger varje elev en bingobricka med *bilderna* eller *orden* i rutorna.
  - Eleverna går runt i rummet med handen uppsträckt.
  - Två som möts hälsar, frågar varandra vad en ruta föreställer och berättar vad de tror.
  - Eleverna skriver kamratens namn i den ruta de fått förklarad.
  - Eleverna går vidare till en ny kamrat.
  - Den som fått en rad full berättar för läraren vad som står på raden.
slag: klass
kalla:
  rubrik: Samtalsbingo
  commit: f8e8717
  summa: 24d8a62f
bild:
  scen: samtalsbingo
  alt: "En elev håller fram en bricka med nio rutor mot en kamrat och håller den i nederkanten. I rutorna finns bilder: ett hjärta, en cirkel, ett kugghjul, en bok, en stjärna, en triangel, en kvadrat, en penna och en hand. De två första rutorna i den översta raden är färgade gröna. Eleven frågar, och pratbubblan visar ett frågetecken. Kamraten pekar på rutan med kugghjulet och förklarar, och pratbubblan visar samma kugghjul. Till höger går en elev med handen uppsträckt och en bricka med rutor i den andra handen."
forslag:
  - omrade: lasning
    arskurs: 4–6
    amne: NO
    text: Klassen har läst en faktatext om vattnets kretslopp, och du delar ut en bricka med nio ord ur texten, som avdunstning, moln, regn och grundvatten. Eleverna går runt med handen uppsträckt och hälsar när de möts två och två. De frågar varandra vad ett ord betyder och berättar vad de tror. Eleverna skriver kamratens namn i rutan som hen förklarade och går vidare till en ny kamrat. Den som får en rad full berättar för dig vad orden på raden betyder.
  - omrade: skrivning
    arskurs: 7–9
    amne: svenska
    text: Klassen ska skriva argumenterande texter, och du delar ut en bricka med nio begrepp, som tes, argument, motargument, sambandsord och slutsats. Eleverna går runt med handen uppsträckt och hälsar när de möts två och två. De frågar varandra vad ett begrepp betyder, berättar vad de tror och skriver kamratens namn i rutan som hen förklarade. Sedan går de vidare till en ny kamrat. Den som får en rad full berättar för dig vad begreppen på raden betyder.
  - omrade: matematik
    arskurs: F–3
    amne: matematik
    text: Klassen arbetar med geometriska former, och du delar ut en bricka med nio bilder, som cirkel, triangel, rektangel, kub och klot. Eleverna går runt med handen uppsträckt och hälsar när de möts två och två. De frågar varandra vad en bild föreställer, berättar vad de tror och skriver kamratens namn i rutan som hen förklarade. Sedan går de vidare till en ny kamrat. Den som får en rad full berättar för dig vad formerna på raden heter.
  - omrade: socialt
    arskurs: F–3
    amne: klassens råd
    text: Klassen pratar om känslor, och du delar ut en bricka med nio ansikten som visar olika känslor, som glad, arg, rädd och stolt. Eleverna går runt med handen uppsträckt och hälsar när de möts två och två. De frågar varandra vad ett ansikte visar och berättar vad de tror och när man kan känna så. Eleverna skriver kamratens namn i rutan som hen förklarade och går vidare till en ny kamrat. Den som får en rad full berättar för dig vilka känslor raden har.
