  - rubrik: "Lärarens sida: Medel, text 7, Pompejis sista dygn"
    text:
      - År 79 begravde Vesuvius Pompeji på mindre än ett dygn, först under pimpsten och sist under glödheta moln, och det som dödade var tak som rasade och de glödheta molnen. Texten är byggd i tidsordning, och modellen är Tidslinjen, blad 2. I vecka 2 tänker du högt i avsnitt 1.
    delar:
      - rubrik: "Läspasset: de fyra avsnitten"
        falt:
          - rubrik: Textens fråga
            text: Vad hände timme för timme när Vesuvius fick utbrott, och var det lavan som var farligast?
          - rubrik: Ord före läsningen
            text: pimpsten (som i badrummet, men från vulkanen) · glödhett moln (het aska och gas, inget regnmoln) · Plinius (två män med samma namn)
          - rubrik: Tänk högt
            kursiv: true
            text: "”När han gav sig av, valde Plinius att stanna hemma och studera.” Han, vem är det? Det skaver. Jag läser meningen före: det är amiralen. Vem eller vad? Ett moln ur Vesuvius. Det viktigaste? Strax efter tolv steg ett jättemoln upp. Skakningarna dagarna före är spännande, men de är en detalj."
          - rubrik: 1 Ett moln som en pinje
            text: |-
              Red ut: pinjeträd: ett träd, säger ordet själv · han: amiralen, se meningen före
              Lyssna efter: strax efter tolv · jättemoln · ur Vesuvius
              Lockar: skakningarna dagarna före. ”Vad såg Plinius, och när?”
              Bilden: Strecket vid kl. 12. Misenum och Vesuvius på kartan
          - rubrik: 2 Det regnar sten
            text: |-
              Red ut: pimpsten: stelnad lava som föll · i metervis: flera meter
              Lyssna efter: pimpsten i timmar · tunga tak · taken rasade
              Lockar: 15 centimeter i timmen. ”Varför rasade taken, när pimpsten är lätt?”
              Sambandet: ”Omkring klockan 13, en timme senare”: efter molnet
              Bilden: Stapeln som börjar växa vid kl. 13
          - rubrik: 3 Natten
            text: |-
              Red ut: glödhett moln: het aska och gas · föll ihop: pelaren rasade
              Lyssna efter: klockan ett · glödhett moln · Herculaneum
              Lockar: Plinius läser en bok. ”Vad hände mitt i natten?”
              Sambandet: ”Omkring klockan ett på natten, tolv timmar senare”: sedan stenregnet började
              Bilden: Strecket vid kl. 1, och Herculaneum på kartan
          - rubrik: 4 Morgonen
            text: |-
              Red ut: strax efter: kort efter klockan sju · två andra saker: taken och molnen
              Lyssna efter: klockan sju · glödheta moln · ingen rinnande lava
              Lockar: mörkare än en natt utan måne. ”Vad dödade människorna i Pompeji?”
              Sambandet: ”Omkring klockan sju på morgonen, sex timmar senare”: molnet når till sist Pompeji
              Bilden: Stapeln vid kl. 7, högre än figuren
          - rubrik: Om någon frågar
            text: Hur många dog? Ingen vet säkert. Arkeologerna har hittat drygt 1 000 döda i Pompeji, och fler kan ligga kvar. Vad hände med amiralen? Han dog under utbrottet. Enligt Plinius hittades han när det blev ljust igen. Finns benen kvar i gipsfigurerna? Ja, ofta finns skelettet kvar. Hur blev det hål i askan? Askan hårdnade runt kroppen, som sedan förmultnade.
      - rubrik: "Modellpasset: Tidslinjen för Pompejis sista dygn"
        falt:
          - rubrik: Fördjupningen
            text: |-
              Red ut: motsvarar: betyder samma dag som · kol: svart av bränt trä
              Lyssna efter: 24 augusti i brevet · kolraden 2018 · kolet satt kvar
              Lockar: tio månader på en vägg. ”Varför är forskarna inte överens om datumet?”
              Sambandet: ”I Plinius brev”: tillbaka till ögonvittnet i avsnitt 1
          - rubrik: Modellen
            text: "Lägg först fram gruppens tankekarta från vecka 1 och fråga: ”Vad kommer först här?” Den visar delar men ingen ordning. Ta sedan fram Tidslinjen, blad 2. Gruppen lägger fördjupningens post-it-lapp på En lapp till och drar ett streck till steg 1. Fördjupningen frågar vilken dag dygnet började, och dagen hör till det första steget."
          - rubrik: Orden
            text: |-
              strax efter kl. 12 (molnet) · omkring kl. 13 (stenregnet) · omkring kl. 1 (natten) · omkring kl. 7 (morgonen)
              Tiden emellan: omkring en timme · omkring tolv timmar · omkring sex timmar
              Utan flik: gruppen skriver ”vet ingen säkert” vid En lapp till.
          - rubrik: Svaret
            text: |-
              Lyssna efter: moln, sten, natt och morgon · tak som rasade · glödheta moln, ingen rinnande lava
              Så kan det låta: ”Vid tolv steg ett moln upp, och sedan regnade pimpsten i timmar. På natten kom glödheta moln, och på morgonen nådde de Pompeji. Det farligaste var tak som rasade och glödheta moln.”
          - rubrik: Rutan
            text: "Visste du att: intressant, för tidslinjen och svaret håller utan gipsfigurerna."
          - rubrik: Samtala
            text: "Varför står klockslaget först i varje avsnitt? Varför berättar texten om Plinius? Ett svar: klockslagen visar ordningen, och Plinius är ögonvittnet som gör att vi vet."
  - rubrik: "Medel, text 7: Pompejis sista dygn"
    tema: Vulkaner och jordbävningar
    text:
      - Vulkaner och jordbävningar · text 2 av 5
    delar:
      - rubrik: Till läraren
        falt:
          - rubrik: Hör till
            text: Lärarens sida till texten.
    listor:
      - rubrik: Pompejis sista dygn
        rader:
          - - En dag år 79 var Pompeji en stad full av liv nära berget Vesuvius. Mindre än ett dygn senare låg staden begravd. En 17-åring såg utbrottet och skrev om det. Vad hände timme för timme när Vesuvius fick utbrott, och var det lavan som var farligast?
      - rubrik: Siffran
        rader:
          - - 3 meter
            - Ungefär så mycket pimpsten låg på gatorna i Pompeji efter en eftermiddag och en natt av stenregn.
      - rubrik: "Bild: Dygnet i Pompeji"
        rader:
          - - Dygnet i Pompeji. Stapeln visar hur högt pimpstenen låg på gatorna, timme för timme. Siffrorna är avsnittens nummer.
      - rubrik: Ett moln som en pinje
        rader:
          - - Strax efter klockan tolv på dagen steg ett jättelikt moln upp ur Vesuvius. Det syntes ända till staden Misenum, på andra sidan **bukten**. Där fanns Plinius, som var 17 år. Molnet liknade mest av allt ett pinjeträd, skrev Plinius. Det steg upp som en lång, hög stam och bredde sedan ut sig i grenar.
          - - I Misenum fanns också den äldre Plinius. Han ledde **flottan**, och därför kallar vi honom amiralen. När han gav sig av, valde Plinius att stanna hemma och studera.
          - - Plinius skrev senare två brev om dygnet. I det ena berättar han att marken hade skakat lätt i många dagar före utbrottet.
      - rubrik: Ord i texten
        rader:
          - - bukt
            - del av havet som går in i land
          - - flotta
            - många krigsskepp som hör ihop
      - rubrik: Det regnar sten
        rader:
          - - Omkring klockan 13, en timme senare, började det regna sten över Pompeji. Molnpelaren över Vesuvius växte till mer än 20 kilometers höjd, och den var full av aska och pimpsten. Pimpsten är lava som har stelnat full av gasbubblor, och därför är den lätt. Den föll som regn och rann inte.
          - - Stenen föll timme efter timme. På öppna platser växte lagret med omkring 15 centimeter i timmen. Framåt kvällen låg det omkring en meter sten på marken.
          - - En enda pimpsten är lätt, men när stenen låg i metervis på taken blev den tung. Till slut orkade vissa tak inte bära tyngden, och de rasade. En del av dem som hade sökt skydd inomhus dog när taken föll in.
      - rubrik: Natten
        rader:
          - - Omkring klockan ett på natten, tolv timmar senare, förändrades utbrottet. Delar av den höga molnpelaren föll ihop, och ett glödhett moln rusade nerför berget. Vanliga moln består av små vattendroppar eller iskristaller. Det här molnet var av het aska och gas, och det vällde fram längs marken.
          - - Det första glödheta molnet nådde staden Herculaneum, och efter det kom fler. I Pompeji föll stenen fortfarande, och husen började skaka av jordskalv.
          - - Samma natt skakade marken också i Misenum, på andra sidan bukten. Skalven blev så kraftiga att Plinius och hans mamma satte sig ute på gården. Där bad Plinius om en bok och läste i den, som om han var helt lugn. Det berättar han själv i breven.
      - rubrik: "Bild: Bukten och berget"
        rader:
          - - Bukten och berget. Plinius såg utbrottet från Misenum, på andra sidan Neapelbukten. Siffrorna är avsnittens nummer.
      - rubrik: Morgonen
        rader:
          - - Omkring klockan sju på morgonen, sex timmar senare, nådde ett glödhett moln Pompeji. Då låg pimpstenen omkring 3 meter hög på gatorna, högre än en vuxen människa. Strax efter kom fler moln, och de nådde människor både på gatorna och inne i husen.
          - - "Många tror att människorna i Pompeji dog i rinnande lava. Det är lätt att tro, eftersom Vesuvius är en vulkan. Men det var framför allt två andra saker som dödade: tak och väggar som rasade, och sist de glödheta molnen. De flesta döda som **arkeologerna** har hittat låg i askan från molnen."
          - - Samma morgon flydde Plinius och hans mamma från Misenum. Ute på vägen blev det mörkare än en natt utan måne, men båda klarade sig.
      - rubrik: Ord i texten
        rader:
          - - arkeologer
            - forskare som gräver fram spår från förr
      - rubrik: "Fakta: Stenregnet i tal"
        rader:
          - - Molnpelarens höjd
            - mer än 20 kilometer
          - - Pimpsten varje timme
            - omkring 15 centimeter
          - - Pimpsten på kvällen
            - omkring 1 meter
          - - Pimpsten på morgonen
            - omkring 3 meter
      - rubrik: "Fördjupning: Augusti eller oktober?"
        rader:
          - - I Plinius brev står det att utbrottet började den 24 augusti. Det datumet står fortfarande i en del faktatexter.
          - - År 2018 grävde arkeologerna fram en rad som någon hade skrivit med kol på en vägg i Pompeji. Raden börjar med ett datum som motsvarar den 17 oktober. Skrift med kol håller inte länge, menade arkeologerna, så raden skrevs troligen hösten år 79. Då kan staden inte ha legat begravd sedan augusti, och därför trodde de att utbrottet kom den 24 oktober.
          - - Men senare prövade forskare att skriva med kol på väggar i Pompeji. Skriften satt kvar i mer än tio månader, så raden kan också ha skrivits året före utbrottet. Forskarna är fortfarande inte överens, och vilket datum som är rätt vet ingen säkert.
      - rubrik: Visste du att …
        rader:
          - - omkring 100
            - gipsfigurer har arkeologerna gjort i Pompeji genom att fylla hålrum i askan med gips. Hur kan ett hål i askan visa hur en människa såg ut för nästan 2 000 år sedan?
      - rubrik: Läs mer
        rader:
          - - SO-rummet har lätta fakta om Pompeji. Där står oktober. Där står också att lava begravde staden, och det säger den här texten emot.
            - https://so-rummet.se/fakta-artiklar/latta-fakta-om-pompeji
          - - Unga Fakta berättar om kända vulkanutbrott. Där står augusti för Pompeji, så jämför gärna med SO-rummet.
            - https://www.ungafakta.se/vulkaner/kanda/
          - - Naturhistoriska riksmuseet förklarar vulkaner och berättar kort om Pompeji. Sidan är skriven för vuxna.
            - https://www.nrm.se/fakta-om-naturen/jorden-geologi/vulkaner-och-jordbavningar/vulkaner-och-vulkanism
