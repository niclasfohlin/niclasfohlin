  - rubrik: "Lärarens sida: Medel, text 8, Lugn eller explosiv"
    text:
      - Vulkanerna på Hawaii och Mount St. Helens får båda sin magma från djupet, men i St. Helens gör mer kisel magman och lavan seg, så att gasen fastnar och berget blir brant, explosivt och farligare för människor. Texten jämför två saker, och modellen är Venndiagrammet, blad 2. I vecka 3 har två elever i taget jobbkorten från avsnitt 2.
    delar:
      - rubrik: "Läspasset: de fyra avsnitten"
        falt:
          - rubrik: Textens fråga
            text: Varför är en del vulkaner breda och lugna och andra branta och explosiva, och vilken sort är farligast?
          - rubrik: Ord före läsningen
            text: magma (smält berg, innan det kommer upp) · seg (trögflytande, inte trött) · kisel (ett ämne, inga småstenar)
          - rubrik: 1 Bred eller brant
            text: |-
              Red ut: magma och lava: samma sak, olika ställen · kon: formad som en strut
              Lyssna efter: båda av magma · svaga sluttningar · brant kon
              Lockar: 17 kilometer hög räknad från foten. ”Vad är lika, och hur skiljer sig formen?”
              Bilden: De två bergen bredvid varandra i Bred och brant
          - rubrik: 2 Tunn eller seg lava
            text: |-
              Red ut: kisel i marginalen, kiseldioxid i meningen efter · ju mer, desto: mer kisel, segare lava
              Lyssna efter: kisel · tunn eller seg · rinner långt
              Lockar: det vanligaste ämnet i berget. ”Vad gör kislet med lavan?”
              Sambandet: ”Lavan skiljer sig också åt”: från formen till lavan
              Bilden: Den tunna lavan långt ut, den sega vid toppen
          - rubrik: 3 Bubblorna avgör
            text: |-
              Red ut: gasbubblor: bubblor av vattenånga · sliter sönder: spränger magman i bitar
              Lyssna efter: gasbubblor · fastnar i seg magma · trycket spränger
              Lockar: den skakade läskflaskan. ”Varför exploderar St. Helens men sällan vulkanerna på Hawaii?”
              Sambandet: ”Medan den tunna magman släpper ut sin gas”: från lavan till gasen
              Bilden: Bubblorna som går ut, och bubblorna som fastnar
          - rubrik: 4 Farligast
            text: |-
              Red ut: där den rinner fram: där lavan når · en sådan explosiv vulkan: som St. Helens
              Lyssna efter: hinner oftast gå undan · aska långt bort · Vesuvius samma sort
              Lockar: runt jorden på 15 dagar. ”Vilken sort hotar människor mest, och varför?”
              Sambandet: ”hotar också människor på olika sätt”: från gasen till faran
          - rubrik: Om någon frågar
            text: Finns det vulkaner i Sverige? Inga aktiva. De senast aktiva fanns i Skåne för drygt 100 miljoner år sedan. Hur ofta får Island vulkanutbrott? I genomsnitt vart femte år. När hade Mauna Loa utbrott senast? Det senaste började den 27 november 2022, enligt USGS hösten 2026. Varnar en vulkan före ett utbrott? Ofta kommer det fler skalv än vanligt.
      - rubrik: "Modellpasset: Venndiagrammet för Lugn eller explosiv"
        falt:
          - rubrik: Fördjupningen
            text: |-
              Red ut: svälla ut: bukta ut som en bula · jätteskred: bergssidan gled ner
              Lyssna efter: skalv och bula · skredet släppte trycket · gasen sprängde
              Lockar: en meter om dagen. ”Varför exploderade berget just när sidan rasade?”
              Sambandet: ”höll trycket på magman”: flaskan i avsnitt 3
          - rubrik: Modellen
            text: "Lägg först fram gruppens tankekarta från vecka 1 och fråga: ”Vad ska stå i mitten?” Texten jämför två saker, och kartan visar inte vad som är lika och olika. Ta sedan fram Venndiagrammet, blad 2. Exemplet om skolan har ringar, men det här bladet har inga: varje avsnitt är en punkt, med en ruta för post-it-lappen och en för textens ord. På raderna A och B skriver en grupp som bara är ett par. Gruppen lägger fördjupningens lapp på En lapp till och kallar platsen Hör till gasen. I fördjupningen händer det som avsnitt 3 säger: instängd gas spränger när trycket släpper."
          - rubrik: Orden
            text: formen är däremot mycket olika (formen) · lavan i St. Helens är däremot seg (lavan) · medan den tunna magman släpper ut sin gas (gasen) · hotar också människor på olika sätt (faran)
          - rubrik: Svaret
            text: |-
              Lyssna efter: kisel gör lavan seg · gasen fastnar och spränger · explosiva farligast
              Så kan det låta: ”Mer kisel gör lavan seg. Tunn lava rinner långt och bygger breda berg, och seg lava bygger branta. Gasen smiter ur tunn magma men spränger den sega. De explosiva är farligast: glödheta moln kan döda.”
          - rubrik: Rutan
            text: "Visste du att: intressant, för svaret om vulkanernas sorter håller utan flygen."
          - rubrik: Samtala
            text: "Varför tar texten Hawaii först i varje avsnitt? Varför slutar den med St. Helens 1980? Ett svar: samma ordning gör skillnaden lätt att se, och 1980 visar flaskan som öppnas."
  - rubrik: "Medel, text 8: Lugn eller explosiv"
    tema: Vulkaner och jordbävningar
    text:
      - Vulkaner och jordbävningar · text 3 av 5
    delar:
      - rubrik: Till läraren
        falt:
          - rubrik: Hör till
            text: Lärarens sida till texten.
    listor:
      - rubrik: Lugn eller explosiv
        rader:
          - - Vulkaner kan bete sig mycket olika. På Hawaii väller lavan ut och rinner nerför berget. Mount St. Helens exploderade i stället år 1980. Varför är en del vulkaner breda och lugna och andra branta och explosiva, och vilken sort är farligast?
      - rubrik: Siffran
        rader:
          - - 17 km
            - hög är Mauna Loa på Hawaii, räknad från sin fot långt under havsytan.
      - rubrik: "Bild: Bred och brant"
        rader:
          - - Bred och brant. Till vänster en sköldvulkan som på Hawaii, till höger en stratovulkan som Mount St. Helens. Höjderna är inte i skala.
      - rubrik: Bred eller brant
        rader:
          - - Både vulkanerna på Hawaii och Mount St. Helens har byggts upp av magma som har kommit upp ur djupet. Magma är smält berg under jorden. När magman väller ut ur vulkanen kallas den lava. Det är alltså samma sak på två olika ställen.
          - - Formen är däremot mycket olika. Vulkanerna på Hawaii är breda och har svaga sluttningar. De kallas sköldvulkaner, eftersom de från sidan liknar en krigares sköld. Mauna Loa på Hawaii är en sådan. Räknad från sin fot är den omkring 17 kilometer hög, och den täcker ungefär halva ön Hawaii.
          - - Mount St. Helens är i stället en brant kon, byggd av lager på lager av lava och aska. En sådan vulkan kallas stratovulkan.
      - rubrik: Tunn eller seg lava
        rader:
          - - Lavan skiljer sig också åt mellan vulkanerna. Det beror till stor del på hur mycket **kisel** den innehåller. I lavan sitter kislet ihop med syre och bildar ämnet kiseldioxid. Det är det vanligaste ämnet i jordens berg. Lavan från Kilauea på Hawaii har omkring 52 procent kiseldioxid, medan lavan från Mount St. Helens år 1980 hade omkring 64 procent.
          - - Ju mer kisel, desto segare blir lavan. Lavan på Hawaii är tunn och rinner lätt. Den hinner rinna långt innan den **stelnar**, och därför blir berget brett med svaga sluttningar.
          - - Lavan i St. Helens är däremot seg och trög. Den rinner inte långt innan den stelnar, och berget blir brant. Utbrott efter utbrott lägger nya lager ovanpå de gamla.
      - rubrik: Ord i texten
        rader:
          - - kisel
            - ett ämne i berget som gör lavan seg
          - - stelnar
            - blir hård när den svalnar
      - rubrik: Bubblorna avgör
        rader:
          - - Medan den tunna magman släpper ut sin gas, håller den sega magman kvar gasen. Det är gasen som får en vulkan att explodera. Djupt nere finns vatten löst i magman. När magman stiger, blir vattnet till gasbubblor.
          - - Magman i Kilauea har omkring 0,5 procent vatten, medan magman i St. Helens år 1980 hade omkring 4 procent, alltså åtta gånger så mycket. Mer vatten ger mer gas. I den tunna magman på Hawaii stiger bubblorna lätt upp och försvinner ut i luften. Därför blir utbrotten oftast lugna.
          - - I den sega magman fastnar bubblorna däremot. Trycket växer, som i en skakad läskflaska. När trycket till sist släpper, sliter gasen sönder magman till aska och **pimpsten**, sådan som föll över Pompeji år 79.
      - rubrik: Ord i texten
        rader:
          - - pimpsten
            - lätt sten full av små hål
      - rubrik: "Bild: Bubblorna i magman"
        rader:
          - - Bubblorna i magman. I tunn magma går bubblorna lugnt ut. I seg magma fastnar de, och trycket växer som i en skakad läskflaska.
      - rubrik: Farligast
        rader:
          - - De två sorterna av vulkaner hotar också människor på olika sätt. På Hawaii rinner lavan längs marken. Den kan förstöra hus och vägar där den rinner fram, men den rör sig oftast så långsamt att människor hinner gå undan. Därför dör sällan någon av lavan.
          - - En explosiv vulkan som St. Helens slungar däremot ut aska och pimpsten högt upp i luften. Askan kan färdas mycket långt. Askmolnet från utbrottet 1980 gick tvärs över USA på tre dagar och runt jorden på 15 dagar.
          - - Vesuvius i Italien, som begravde Pompeji år 79, är en sådan explosiv vulkan. Glödheta moln av het aska och gas dödade människor i staden. Därför är de explosiva vulkanerna farligast för människor.
      - rubrik: "Fakta: Två slags vulkaner"
        rader:
          - - Namnet
            - "Hawaii: sköldvulkan. St. Helens: stratovulkan"
          - - Formen
            - "Hawaii: bred, med svaga sluttningar. St. Helens: brant"
          - - Kiseldioxid i lavan
            - "Kilauea: 52 procent. St. Helens 1980: 64 procent"
          - - Vatten i magman
            - "Kilauea: 0,5 procent. St. Helens 1980: 4 procent"
          - - Exempel
            - "Sköldvulkaner: Mauna Loa och Kilauea. Stratovulkaner: St. Helens och Vesuvius"
      - rubrik: "Fördjupning: Den 18 maj 1980"
        rader:
          - - Våren 1980 började Mount St. Helens att röra på sig. Från mitten av mars kom små skalv under berget. Sedan började bergets norra sida svälla ut med mer än en meter om dagen. Magma trängde upp inne i berget och tryckte på.
          - - Den 18 maj klockan 8.32 kom ett skalv. Då rasade den uppsvällda sidan och toppen i ett jätteskred, där en hel bergssida gled ner på en gång. Plötsligt fanns inget kvar som höll trycket på magman. Gasen i magman sprängde berget åt sidan, som när korken åker av en skakad läskflaska.
          - - Askan steg mer än 24 kilometer upp i luften på mindre än en kvart. Utbrottet förstörde skog på 600 kvadratkilometer. Det visade vad instängd gas kan göra med ett berg.
      - rubrik: Visste du att …
        rader:
          - - Eyjafjallajökull
            - heter vulkanen på Island vars aska stoppade nästan alla flyg i Sverige den 17 och 18 april 2010. Hur hade du tagit dig hem om alla flyg stod still?
      - rubrik: Läs mer
        rader:
          - - Svenska nationella seismiska nätet berättar om vulkaner, också på Island och i Sverige för länge sedan.
            - https://www.uu.se/forskning/svenska-nationella-seismiska-natet/vulkaner
          - - Unga Fakta visar olika sorters vulkaner, med sköldvulkaner som på Hawaii och stratovulkaner som Vesuvius.
            - https://www.ungafakta.se/vulkaner/olika/
          - - USGS visar fotografier av sidan som svällde ut, askmolnet och skogen som föll när Mount St. Helens fick utbrott 1980. Texten är på engelska.
            - https://www.usgs.gov/volcanoes/mount-st.-helens/science/1980-cataclysmic-eruption
