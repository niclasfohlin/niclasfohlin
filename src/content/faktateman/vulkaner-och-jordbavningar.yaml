pabordet:
  - nr: 130
    rubrik: Jorden i genomskärning
    text: Halva jordklotet i genomskärning, med lagren i rätt tjocklek jämfört med varandra. Ytterst är skorpan bara ett tunt streck. Sedan kommer manteln, som är tjockast, och den yttre kärnan, som är flytande. Innerst är den lilla inre kärnan, som är fast. En pil från ytan till mitten visar 6 400 km.
    efter: "ram: Medel, text 6: Under dina fötter"
  - nr: 131
    rubrik: Skorpan i förstoring
    text: En bit av marken i genomskärning, förstorad. Överst ligger två tjocka plattor med en spricka mellan sig. Varje platta är skorpan och hårt berg under den, och under plattorna finns mjukt berg. En pil på den ena plattan visar att den glider 2–⁠12 cm om året.
    efter: "ram: Medel, text 6: Under dina fötter"
  - nr: 133
    rubrik: "Blad: Tankekartan för Under dina fötter"
    text: Så kan bladet se ut efter modellpasset, med en grupps kärnor på post-it-lappar och textens ord i flikarna. Titta på det ihop med raden Modellen på lärarens sida när du förbereder passet. Din grupp skriver sina egna kärnor.
    alt: Tankekartan, blad 2, för Under dina fötter, med en grupps kärnor och textens ord. Era kärnor blir andra.
    efter: "ram: Modellen: Medel, text 6, Under dina fötter"
  - nr: 134
    rubrik: Dygnet i Pompeji
    text: En tidslinje från klockan tolv på dagen till sju på morgonen. Strax efter tolv steg ett moln som en pinje upp, från klockan 13 växer en stapel av pimpsten timme för timme, och klockan ett på natten for ett glödhett moln mot Herculaneum. Klockan sju nådde ett glödhett moln Pompeji, och då var pimpstenen omkring 3 meter hög, högre än en vuxen.
    efter: "ram: Medel, text 7: Pompejis sista dygn"
  - nr: 135
    rubrik: Bukten och berget
    text: En förenklad karta över Neapelbukten. Misenum ligger på buktens västra udde, och därifrån såg Plinius molnet över Vesuvius på andra sidan bukten. Herculaneum ligger vid kusten väster om berget och Pompeji sydost om det.
    efter: "ram: Medel, text 7: Pompejis sista dygn"
  - nr: 137
    rubrik: "Blad: Tidslinjen för Pompejis sista dygn"
    text: Så kan bladet se ut efter modellpasset, med en grupps kärnor på post-it-lappar och textens ord i flikarna. Titta på det ihop med raden Modellen på lärarens sida när du förbereder passet. Din grupp skriver sina egna kärnor.
    alt: Tidslinjen, blad 2, för Pompejis sista dygn, med en grupps kärnor och textens ord. Era kärnor blir andra.
    efter: "ram: Modellen: Medel, text 7, Pompejis sista dygn"
  - nr: 138
    rubrik: Bred och brant
    text: Två vulkaner i genomskärning, med magma under båda. Höjderna är inte i skala. Till vänster står en sköldvulkan som på Hawaii, bred och låg, och tunn lava har runnit långt ut på marken. Till höger står en stratovulkan som St. Helens, brant och byggd av lager, och seg lava ligger kvar vid toppen.
    efter: "ram: Medel, text 8: Lugn eller explosiv"
  - nr: 139
    rubrik: Bubblorna i magman
    text: "I en öppen läskflaska med tunn magma, som på Hawaii, stiger några få bubblor och går ut i luften. I en flaska med seg magma, som i St. Helens, sitter åtta gånger så många bubblor fast under korken, och trycket växer. Till höger syns samma flaska igen: korken åker av, och gasen sliter sönder magman till aska."
    efter: "ram: Medel, text 8: Lugn eller explosiv"
  - nr: 141
    rubrik: "Blad: Venndiagrammet för Lugn eller explosiv"
    text: Så kan bladet se ut efter modellpasset, med en grupps kärnor på post-it-lappar och textens ord i flikarna. Titta på det ihop med raden Modellen på lärarens sida när du förbereder passet. Din grupp skriver sina egna kärnor.
