    efter: "ram: Modellen: Medel, text 8, Lugn eller explosiv"
  - nr: 142
    rubrik: Från skalv till våg
    text: Havet och berget under det i genomskärning. Till vänster har två plattor hakat i varandra, och där brister berget i ett skalv, så att havsbottnen rycker till och havsytan buktar upp. En låg våg färdas ut över djupt vatten, och vid kusten, där havet är grunt, står vattnet högt och väller in över stranden.
    efter: "ram: Medel, text 9: Vågen som kom"
  - nr: 143
    rubrik: Indiska oceanen 2004
    text: En förenklad karta över Indiska oceanen, med Somalia till vänster, Indien och Sri Lanka i mitten och Thailand och Sumatra till höger. En stjärna utanför Sumatras nordvästkust är skalvet. Pilar från stjärnan visar hur vågen färdas ut åt olika håll över havet, till Thailand, till Sri Lanka och ända till Somalia, mer än 5 000 kilometer bort.
    efter: "ram: Medel, text 9: Vågen som kom"
