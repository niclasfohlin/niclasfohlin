# Temat Vulkaner och jordbävningar på nivån Medel i Faktatextsamtal i grupp, en post i sajtens databas över faktatexter
# (src/content/faktateman/). Riggen samlar filen med methods/faktatextsamtal-i-grupp/samla.mjs.
metod: faktatextsamtal-i-grupp
tema: Vulkaner och jordbävningar
niva: Medel
ramar:
  - rubrik: "Lärarhandledning: Medel, Vulkaner och jordbävningar"
    tema: Vulkaner och jordbävningar
    text:
      - Temat Vulkaner och jordbävningar har en faktatext för var och en av de fem strukturerna, som brukar passa i åk 6–7. Varje vecka har klassen en läslektion och en modellektion om veckans text, så temat tar fem veckor. Varje elev har texten, en penna och papper till svaret. Du har tavlan, magneter, A4-ark och en tjock tuschpenna.
    delar:
      - rubrik: "1 Under dina fötter: Tankekartan"
        falt:
          - rubrik: Frågan
            text: Vad finns mellan dig och jordens mitt, och är det mesta där nere flytande?
          - rubrik: Ord före
            text: skorpa (av berg, inget bröd) · mantel (ett lager berg, ingen kappa) · platta (jättebit av skorpan och berget under)
          - rubrik: Tänk högt
            kursiv: true
            text: "”Ytterst ligger jordens skorpa …” Skorpa, som på ett bröd? Det skaver. Jag läser vidare: här är skorpan av hårt berg. Vem eller vad? Skorpan. Det viktigaste? Ytterst finns ett tunt skal av berg. Skorpan under Sverige är spännande, men det är en detalj."
          - rubrik: Det brukar skava
            text: "”formbart”: berget i manteln är så varmt att det kan röra sig långsamt, men det är inte flytande (avsnitt 2)"
          - rubrik: Modellen
            text: "skorpan: ”ytterst” · manteln: ”under skorpan” · yttre kärnan: ”under manteln” · inre kärnan: ”längst in”. I mitten står jordens inre. Fördjupningens kärna, om Inge Lehmann, hör till den inre kärnan och visar hur forskarna vet att jordens mitt är fast."
          - rubrik: Lyssna efter
            text: fyra lager · mest fast berg och järn · yttre kärnan flytande
      - rubrik: "2 Pompejis sista dygn: Tidslinjen"
        falt:
          - rubrik: Frågan
            text: Vad hände timme för timme när Vesuvius fick utbrott, och var det lavan som var farligast?
          - rubrik: Ord före
            text: pimpsten (som i badrummet, men från vulkanen) · glödhett moln (het aska och gas, inget regnmoln) · Plinius (två män med samma namn)
          - rubrik: Tänk högt om
            text: "han: ”När han gav sig av, valde Plinius att stanna hemma och studera. Han, vem är det? Jag läser meningen före. Det är amiralen. Vem eller vad? Ett moln ur Vesuvius. Det viktigaste? Strax efter tolv steg ett jättemoln upp.” (avsnitt 1)"
          - rubrik: Det brukar skava
            text: "”Pimpsten är lava”: stelnad lava som föll från himlen, och ingen lava rann över staden (avsnitt 2)"
          - rubrik: Modellen
            text: "molnet: strax efter kl. 12 · stenregnet: omkring kl. 13 · natten: omkring kl. 1 · morgonen: omkring kl. 7. Skriv tiden mellan stegen: omkring en timme, tolv timmar och sex timmar. Fördjupningens kärna om datumet står vid steg 1, för fördjupningen frågar vilken dag dygnet började."
          - rubrik: Lyssna efter
            text: moln, sten, natt och morgon · tak som rasade · glödheta moln, ingen rinnande lava
      - rubrik: "3 Lugn eller explosiv: Venndiagrammet"
        falt:
          - rubrik: Frågan
            text: Varför är en del vulkaner breda och lugna och andra branta och explosiva, och vilken sort är farligast?
          - rubrik: Ord före
            text: magma (smält berg, innan det kommer upp) · seg (trögflytande, inte trött) · kisel (ett ämne, inga småstenar)
          - rubrik: Det brukar skava
            text: "”Ju mer kisel, desto segare”: mer kisel gör lavan segare, och mindre kisel gör den tunnare (avsnitt 2)"
          - rubrik: Modellen
            text: "formen: ”formen är däremot mycket olika” · lavan: ”lavan i St. Helens är däremot seg” · gasen: ”medan den tunna magman släpper ut sin gas” · faran: ”hotar också människor på olika sätt”. Här ritar du en ruta för varje avsnitt i stället för ringar, och klassen jämför Hawaii och St. Helens punkt för punkt. Fördjupningens kärna hör till gasen, på St. Helens sida."
          - rubrik: Lyssna efter
            text: kisel gör lavan seg · gasen fastnar och spränger · explosiva farligast
      - rubrik: "4 Vågen som kom: Kedjan"
        falt:
          - rubrik: Frågan
            text: Hur kan ett skalv under havet döda människor på en strand tusentals kilometer bort?
          - rubrik: Ord före
            text: tsunami (kallas också flodvåg, men ingen flod) · spänning (berget trycks och dras, inget spännande) · platta (jättebit av skorpan och berget under)
          - rubrik: Det brukar skava
            text: "”Det gör att”: att havsbottnen ryckte till lyfter vattnet (avsnitt 3)"
          - rubrik: Modellen
            text: "skalvet: ”därför” · havet lyfts: ”det gör att” · vågen växer: ”när”. Det första ledet har inget ord, för kedjan börjar där. Fördjupningens kärna, om Tilly Smith, är ingen följd. Den står bredvid kedjan med ett streck till led 4."
          - rubrik: Lyssna efter
            text: plattorna fastnar, berget brister · vattnet lyfts, en låg och snabb våg · vid kusten bromsas den och växer
      - rubrik: "5 Skalvsäkra hus: Problem och lösning"
        falt:
          - rubrik: Frågan
            text: Varför dog så många fler i Haiti än i Chile, och hur kan ett hus klara ett skalv?
          - rubrik: Ord före
            text: magnitud (skalvets energi, mycket mer per steg) · isolator (stötdämpare, ingen isolering mot kyla) · byggregel (hur hus ska byggas, inget spel)
          - rubrik: Det brukar skava
            text: "”hur nära och djupt det börjar”: därför kan ett större skalv skaka svagare (avsnitt 2)"
          - rubrik: Modellen
            text: "husen rasar: ”problemet är” · sårbar plats: ”beror också på” · byggregler: ”en lösning är att” · isolatorer: ”en annan lösning är att”. Fördjupningens kärna är resultatet i Chile och står bredvid lösning 1, med ”långt färre”. Den säger också att vågen var en annan fara."
          - rubrik: Lyssna efter
            text: "Haitis hus tålde inte skalv · Chile: regler och svagare skakning · byggregler och isolatorer"
  - rubrik: "Lärarens sida: Medel, text 6, Under dina fötter"
    text:
      - Av jordens fyra lager, skorpan, manteln, den yttre och den inre kärnan, är bara den yttre kärnan flytande. Texten är en beskrivning, och modellen är Tankekartan, blad 2. I vecka 1 tänker du högt i avsnitt 1.
    delar:
      - rubrik: "Läspasset: de fyra avsnitten"
        falt:
          - rubrik: Textens fråga
            text: Vad finns mellan dig och jordens mitt, och är det mesta där nere flytande?
          - rubrik: Ord före läsningen
            text: skorpa (av berg, inget bröd) · mantel (ett lager berg, ingen kappa) · platta (jättebit av skorpan och berget under)
          - rubrik: Tänk högt
            kursiv: true
            text: "”Ytterst ligger jordens skorpa …” Skorpa, som på ett bröd? Det skaver. Jag läser vidare: här är skorpan av hårt berg. Vem eller vad? Skorpan. Det viktigaste? Ytterst finns ett tunt skal av berg. Skorpan under Sverige är spännande, men det är en detalj."
          - rubrik: 1 Ett tunt skal
            text: |-
              Red ut: skorpa: berg, inget bröd · plattor: skorpan och berget under, i marginalen
              Lyssna efter: ytterst · hårt berg · tunn som ett skal
              Lockar: skorpan under Sverige. ”Hur tjock är skorpan jämfört med hela jorden?”
              Bilden: Det tunna strecket runt jorden, vid siffran 1
          - rubrik: 2 Fast berg som rör sig
            text: |-
              Red ut: mantel: ett lager berg · formbart: mjukt men inte flytande
              Lyssna efter: tjockast · fast berg, inget lavahav · rör sig långsamt
              Lockar: naglarna som växer. ”Finns det ett hav av lava under skorpan?”
              Sambandet: ”Under skorpan”: nästa lager inåt
              Bilden: Skorpan i förstoring: pilen på plattan
          - rubrik: 3 Flytande järn
            text: |-
              Red ut: kärna, i marginalen: två lager · ägget slutar stämma: gulan är fast
              Lyssna efter: yttre kärnan · smält järn · enda flytande lagret
              Lockar: magnetfältet. ”Var slutar ägget att stämma, och varför?”
              Sambandet: ”Under manteln”: nästa lager inåt, kärnan
              Bilden: Det tjocka flytande lagret vid siffran 3
          - rubrik: 4 Fast trots hettan
            text: |-
              Red ut: tryck: allt ovanpå pressar · av ett helt annat skäl: inte kokt
              Lyssna efter: inre kärnan · hetast · fast av trycket
              Lockar: hetast i hela jorden. ”Varför är den hetaste delen fast?”
              Sambandet: ”Längst in”: det innersta lagret
              Bilden: Den lilla mitten vid siffran 4
          - rubrik: Om någon frågar
            text: Hur varmt är det i mitten? Flera tusen grader. Källorna säger 4 000 till nära 6 000. Kommer lavan från kärnan? Nej. Berget smälter på vissa platser i manteln och skorpan. Blir det varmare längre ner? Ja, omkring 25 grader per kilometer de första kilometrarna. Hur länge tar det att gå till mitten? 160 dagar, åtta timmar om dagen.
      - rubrik: "Modellpasset: Tankekartan för Under dina fötter"
        falt:
          - rubrik: Fördjupningen
            text: |-
              Red ut: skalv: jordbävning · erkännande: att andra godtar upptäckten
              Lyssna efter: Inge Lehmann · skalvens kurvor · fast inre kärna
              Lockar: 104 år gammal. ”Hur kunde Lehmann veta något om kärnan?”
              Sambandet: ”att den inre kärnan är fast”: belägget för avsnitt 4
          - rubrik: Modellen
            text: Ta fram Tankekartan, blad 2. I vecka 1 lägger du den första post-it-lappen och skriver det första ordet. Nederst i varje fält har bladet rader med ledtexten Hit hör. Där skriver paren det som hör till delen, efter ordet i fliken. Ge då Orden två minuter till, och korta Samtala lika mycket. Gruppen lägger fördjupningens lapp på En lapp till, som får namnet Hör till den inre kärnan. Fördjupningen berättar hur forskarna vet det som avsnitt 4 säger om den inre kärnan.
          - rubrik: Orden
            text: ytterst (skorpan) · under skorpan (manteln) · under manteln (yttre kärnan) · längst in (inre kärnan)
          - rubrik: Svaret
            text: |-
              Lyssna efter: fyra lager · mest fast berg och järn · yttre kärnan flytande
              Så kan det låta: ”Mellan mig och mitten finns skorpan, manteln, den yttre kärnan och den inre kärnan. Nej, det mesta är fast. Bara den yttre kärnan är flytande. Där är järnet smält.”
          - rubrik: Rutan
            text: "Visste du att: intressant, för svaret om lagren håller utan borrhålet."
          - rubrik: Samtala
            text: "Varför börjar texten med ett ägg? Varför går texten utifrån och in? Ett svar: ägget gör lagren lätta att se, och texten går lager för lager, som kniven genom ägget."
  - rubrik: "Medel, text 6: Under dina fötter"
    tema: Vulkaner och jordbävningar
    text:
      - Vulkaner och jordbävningar · text 1 av 5
    delar:
      - rubrik: Till läraren
        falt:
          - rubrik: Hör till
            text: Lärarens sida till texten.
    listor:
      - rubrik: Under dina fötter
        rader:
          - - Skär ett hårdkokt ägg på mitten. Ytterst ser du ett tunt skal, sedan vitan och i mitten gulan. Jorden är också byggd i lager, men ingen har kunnat skära itu den och titta. Vad finns mellan dig och jordens mitt, och är det mesta där nere flytande?
      - rubrik: Siffran
        rader:
          - - 6 400 km
            - är det ungefär rakt ner till jordens mitt.
      - rubrik: "Bild: Jorden i genomskärning"
        rader:
          - - Jorden i genomskärning. Lagren har rätt tjocklek jämfört med varandra, men skorpan är ännu tunnare än strecket. Siffrorna är avsnittens nummer.
      - rubrik: Ett tunt skal
        rader:
          - - Ytterst ligger jordens **skorpa**, och det är på den du står. Ordet kan få dig att tänka på ett bröd, men den här skorpan är av hårt berg. Under gräset, sanden och havet finns berget överallt.
          - - Skorpan är olika tjock på olika ställen. Under haven är den bara 5 till 10 kilometer tjock, och under land är den oftast 30 till 70 kilometer. Under Sverige är den vanligen 40 till 50 kilometer tjock.
          - - Det låter mycket, men jämfört med hela jorden är skorpan som ett tunt skal. Den är också hård och kan spricka, precis som skalet på ett ägg. Skorpan och det hårda berget närmast under den är spruckna i stora bitar som kallas **plattor**.
      - rubrik: Ord i texten
        rader:
          - - skorpa
            - jordens yttersta lager, av hårt berg
          - - plattor
            - stora bitar av skorpan och berget under
      - rubrik: Fast berg som rör sig
        rader:
          - - Under skorpan ligger **manteln**. Den är också av berg och är jordens tjockaste lager, omkring 2 900 kilometer tjockt. I ägget är manteln vitan.
          - - Många tror att det finns ett hav av glödande lava under skorpan. Det låter rimligt, eftersom lava väller upp ur vulkanerna. Men manteln är till största delen fast berg. Berget smälter bara på vissa platser, och det är därifrån lavan kommer.
          - - En bit ner i manteln är berget ändå så varmt att det är mjukt och **formbart**. Det rör sig mycket långsamt, och plattorna ovanpå glider 2 till 12 centimeter om året. Det är ungefär lika fort som dina naglar växer.
      - rubrik: Ord i texten
        rader:
          - - mantel
            - lagret av berg under skorpan
          - - formbart
            - går att forma utan att gå sönder
      - rubrik: "Bild: Skorpan i förstoring"
        rader:
          - - Skorpan i förstoring. Plattorna glider några centimeter om året på det mjuka berget under dem. Siffrorna är avsnittens nummer.
      - rubrik: Flytande järn
        rader:
          - - Under manteln, nästan 3 000 kilometer ner, börjar jordens **kärna**. Den har två lager och består troligen mest av järn med lite nickel. Där kärnan börjar är det omkring 4 000 grader varmt. Så hett är det att järnet i det yttre lagret har smält. Den yttre kärnan, omkring 2 200 kilometer tjock, är alltså flytande.
          - - Här slutar ägget att stämma. I ett hårdkokt ägg är gulan fast ända in till mitten. Jordens kärna har däremot ett flytande lager runt en fast mitt. Av jordens fyra lager är den yttre kärnan det enda som är flytande.
          - - Det är också i den yttre kärnan som jordens **magnetfält** uppstår, när det flytande järnet strömmar.
      - rubrik: Ord i texten
        rader:
          - - kärna
            - jordens innersta del
          - - magnetfält
            - en osynlig magnetisk kraft runt jorden
      - rubrik: Fast trots hettan
        rader:
          - - Längst in, i jordens mitt, ligger den inre kärnan. Den är ett klot, troligen mest av järn, och från mitten ut till kanten är det omkring 1 200 kilometer. Här är det hetast i hela jorden, ännu varmare än där kärnan börjar.
          - - Ändå är den inre kärnan fast. Det beror på **trycket**. Ovanpå den ligger skorpan, manteln och den yttre kärnan. Allt det berget och järnet trycker på från alla håll. Trycket är så stort att järnet inte smälter, trots hettan.
          - - Gulan i ett ägg blir fast när den kokas. Den inre kärnan är däremot fast av ett helt annat skäl, nämligen trycket från allt som ligger ovanpå den.
      - rubrik: Ord i texten
        rader:
          - - tryck
            - kraft som pressar på något
      - rubrik: "Fakta: Jordens fyra lager"
        rader:
          - - Skorpan
            - 5–70 km tjock, fast berg
          - - Manteln
            - omkring 2 900 km tjock, mest fast berg
          - - Yttre kärnan
            - omkring 2 200 km tjock, flytande järn
          - - Inre kärnan
            - omkring 1 200 km till mitten, fast järn
      - rubrik: "Fördjupning: Hon som läste skalven"
        rader:
          - - Ingen människa har varit nere i jordens kärna. Ändå vet forskarna att den inre kärnan är fast. Det vet de tack vare **skalv**, alltså jordbävningar.
          - - När berget skakar vid ett stort skalv, går skakningarna som vågor genom hela jorden, ungefär som ringar på vattnet när du kastar i en sten. Vågorna böjer av och studsar när de når ett nytt lager. Mätare långt bort ritar dem som kurvor. Inge Lehmann var en dansk forskare som läste sådana kurvor. Forskarna trodde då att kärnan var flytande rakt igenom. Men i kurvorna såg hon att en del vågor böjde av inne i kärnan, som om de mötte ännu en gräns.
          - - År 1936 föreslog hon att kärnan har en fast del längst in. Det dröjde länge innan hon fick erkännande för sin upptäckt. I dag vet forskarna att hon hade rätt. Inge Lehmann blev 104 år gammal.
      - rubrik: Ord i texten
        rader:
          - - skalv
            - när berget skakar, en jordbävning
      - rubrik: Visste du att …
        rader:
          - - drygt 12 km
            - djupt är det djupaste hål som människor har borrat. Det är inte ens en tredjedel av skorpans tjocklek under Sverige. Hur många dagar skulle det ta att gå 6 400 kilometer till jordens mitt?
      - rubrik: Läs mer
        rader:
          - - Sveriges geologiska undersökning, SGU, förklarar jordens lager och hur tjock skorpan är under Sverige.
            - https://www.sgu.se/om-geologi/jordklotets-uppbyggnad/
          - - Naturhistoriska riksmuseet går djupare in i lagren. Sidan är skriven för vuxna.
            - https://www.nrm.se/fakta-om-naturen/jorden-geologi/jordklotet-och-jordskorpan/jordklotets-byggnad
          - - Svenska nationella seismiska nätet berättar om skalven i Sverige, där mätarna hittar minst ett skalv varje dag.
            - https://www.uu.se/forskning/svenska-nationella-seismiska-natet/jordbavningar
