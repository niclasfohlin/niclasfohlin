  - rubrik: "Lärarens sida: Medel, text 9, Vågen som kom"
    text:
      - Plattor som fastnar bygger upp spänning tills berget brister, havsbottnen lyfter vattnet, och på havet är vågen låg och snabb tills den bromsas vid kusten och växer. Texten förklarar orsak och verkan, och modellen är Kedjan, blad 1. I vecka 4 har två elever i taget jobbkorten från avsnitt 2.
    delar:
      - rubrik: "Läspasset: de fyra avsnitten"
        falt:
          - rubrik: Textens fråga
            text: Hur kan ett skalv under havet döda människor på en strand tusentals kilometer bort?
          - rubrik: Ord före läsningen
            text: tsunami (kallas också flodvåg, men ingen flod) · spänning (berget trycks och dras, inget spännande) · platta (jättebit av skorpan och berget under)
          - rubrik: 1 Plattorna fastnar
            text: |-
              Red ut: haka i: fastna i varandra · linjalen: berget som böjs
              Lyssna efter: plattorna fastnar · spänning i berget · år efter år
              Lockar: naglarna som växer. ”Vad händer när plattorna fastnar men fortsätter röra sig?”
              Bilden: Vid siffran 1 hakar plattornas kanter i varandra
          - rubrik: 2 Berget brister
            text: |-
              Red ut: magnitud, i marginalen · ”Så gick det till”: samma sak hände 2004
              Lyssna efter: berget brister · skalv under havet · havsbottnen rycker till
              Lockar: annandag jul och 9,1. ”Varför ryckte också havsbottnen till, enligt sista meningen?”
              Sambandet: ”därför brister berget”: spänningen från avsnitt 1 blir för stor
              Bilden: Vid siffran 2 brister berget, och havsbottnen rycker till
          - rubrik: 3 Havet lyfts
            text: |-
              Red ut: ”Det” i första meningen: att havsbottnen ryckte till · buktar uppåt: blir som en kulle
              Lyssna efter: vattnet lyfts · låg och snabb våg · allt vatten rör sig
              Lockar: lika fort som ett jetplan. ”Hur hög är vågen ute på djupt hav?”
              Sambandet: ”Det gör att”: havsbottnen sätter vattnet i rörelse
              Bilden: Vid siffran 3 är vågen låg, under 1 meter
          - rubrik: 4 Vågen växer
            text: |-
              Red ut: grunt, i marginalen · ”väller in”: strömmar in med kraft
              Lyssna efter: grunt vatten · bromsas och växer · in över land
              Lockar: botten som syns. ”Vad händer med vågen när havet blir grunt?”
              Sambandet: ”När vågen når grunt vatten”: vågen från avsnitt 3 når kusten
              Bilden: Vid siffran 4 står vattnet högt. På kartan: kusterna runt havet
          - rubrik: Om någon frågar
            text: Dog det svenskar? Ja, 543 svenskar omkom. Kan skalv komma av vädret? Nej, de flesta skalv börjar flera kilometer ner i berget, dit regnvattnet inte lätt når. Har det kommit fler stora tsunamier? Ja, till exempel i Japan 2011. Där nådde vattnet som högst nära 40 meter över havet.
      - rubrik: "Modellpasset: Kedjan för Vågen som kom"
        falt:
          - rubrik: Fördjupningen
            text: |-
              Red ut: tecknen: det som visar att en tsunami kommer · ”sägs ha”: så berättas det
              Lyssna efter: Tilly kände igen tecknen · havet drar sig undan · upp på en höjd
              Lockar: hundra som klarade sig. ”Vad ska man göra om havet drar sig undan?”
              Sambandet: ”kände igen tecknen”: tecknen vid stranden i avsnitt 4
              Bilden: Thailand på kartan, där Tilly var
          - rubrik: Modellen
            text: "Lägg först fram gruppens tidslinje från vecka 2 och fråga: ”Flikarna säger när. Var skriver vi varför?” Den visar när, men inte varför. Ta sedan fram Kedjan, blad 1. Gruppen lägger fördjupningens post-it-lapp på En lapp till, som får namnet Tecknen, och drar ett streck till led 4. Tilly kände igen det som händer i led 4, när havet drar sig undan. Lappen är ingen följd i kedjan."
          - rubrik: Orden
            text: |-
              därför (skalvet) · det gör att (havet lyfts) · när (vågen växer)
              Utan flik: gruppen skriver ”kände igen tecknen” vid En lapp till.
          - rubrik: Svaret
            text: |-
              Lyssna efter: plattorna fastnar, berget brister · vattnet lyfts, en låg och snabb våg · vid kusten bromsas den och växer
              Så kan det låta: ”Plattorna fastnar, och spänningen växer tills berget brister. Havsbottnen rycker till och lyfter vattnet. På havet är vågen låg och snabb, och vid kusten bromsas den och blir högre. Vattnet stiger snabbt upp över stranden.”
          - rubrik: Rutan
            text: "Visste du att: intressant, för svaret håller utan Plinius, men rutan visar Tillys tecken."
          - rubrik: Samtala
            text: "Varför börjar författaren med en våg som knappt märks? Varför slutar texten med Tilly Smith? Ett svar: den låga vågen är gåtan, och Tilly visar att den som vet kan hinna undan."
  - rubrik: "Medel, text 9: Vågen som kom"
    tema: Vulkaner och jordbävningar
    text:
      - Vulkaner och jordbävningar · text 4 av 5
    delar:
      - rubrik: Till läraren
        falt:
          - rubrik: Hör till
            text: Lärarens sida till texten.
    listor:
      - rubrik: Vågen som kom
        rader:
          - - Den 26 december 2004 färdades en våg ut över Indiska oceanen. Långt ute på havet märktes den knappt. Ändå slog den samma dag in över stränder i flera länder runt havet. Hur kan ett skalv under havet döda människor på en strand tusentals kilometer bort?
      - rubrik: Siffran
        rader:
          - - 1 meter
            - Högre än så är en tsunami sällan ute på djupt hav.
      - rubrik: "Bild: Från skalv till våg"
        rader:
          - - Från skalv till våg. Siffrorna är avsnittens nummer. Bilden visar inte rätt storlekar.
      - rubrik: Plattorna fastnar
        rader:
          - - Jordens yttersta lager, skorpan, är av hårt berg. Skorpan och berget närmast under den är spruckna i stora bitar som kallas plattor. Plattorna rör sig hela tiden, några centimeter om året. Det är ungefär lika fort som naglarna växer på dina fingrar.
          - - Där två plattor möts kan kanterna haka i varandra och fastna. Plattorna fortsätter ändå att röra sig, och berget vid gränsen trycks och dras. Det kallas spänning, och ordet betyder här något annat än i en spännande film. Tänk på en linjal som du böjer mer och mer.
          - - Under Indiska oceanen hade två plattor fastnat i varandra på det sättet, och spänningen i berget växte år efter år.
      - rubrik: Berget brister
        rader:
          - - Till sist blir spänningen för stor, och därför brister berget. Plattorna rycker till och flyttar sig på en gång, ungefär som när en linjal knäcks om du böjer den för mycket. Då skakar marken. Det kallas en jordbävning eller ett jordskalv, eller bara ett skalv. De flesta skalv börjar flera kilometer ner i berget.
          - - Så gick det till den 26 december 2004, på annandag jul. Klockan var strax före åtta på morgonen vid ön Sumatra. Skalvet började 30 kilometer ner, och det hade **magnituden** 9,1. Det är ett av de största skalv som har mätts sedan år 1900. Skalvet skedde under havet, så också havsbottnen ryckte till.
      - rubrik: Ord i texten
        rader:
          - - magnitud
            - mått på hur mycket energi ett skalv frigör
      - rubrik: Havet lyfts
        rader:
          - - Det gör att också vattnet ovanför havsbottnen lyfts. Havsytan buktar uppåt, och därifrån färdas vågor ut över havet åt olika håll. En sådan våg kallas tsunami.
          - - Många tror att en tsunami är en jättevåg ute på havet, som en våg att surfa på. Det låter rimligt. Men på djupt vatten är vågen sällan högre än en meter, och den märks knappt. Den färdas däremot ungefär lika fort som ett jetplan.
          - - När vinden gör vågor, rör de bara vattnet närmast ytan. En tsunami rör allt vatten, från ytan ända ner till botten. Den flyttar alltså mycket mer vatten än vindens vågor.
      - rubrik: Vågen växer
        rader:
          - - När vågen når **grunt** vatten nära kusten bromsas den, och det börjar längst fram. Vattnet bakom hinner då ikapp, och vattnet vid kusten blir högre. Oftast ser det ut som om havet stiger mycket snabbt och väller in över stranden och långt upp på land. Det är därför vågen blir farlig först nära land. Ibland drar sig havet undan från stranden innan vågen kommer, så att botten syns.
          - - En tsunami kommer som flera vågor efter varandra, och den första är inte alltid störst. Tsunamin år 2004 nådde kuster runt Indiska oceanen, från Thailand och Sri Lanka ända bort till Somalia, mer än 5 000 kilometer från skalvet.
          - - Mer än 220 000 människor dog eller försvann. Bland dem fanns turister från många länder, också från Sverige.
      - rubrik: Ord i texten
        rader:
          - - grunt
            - inte djupt, botten är nära
      - rubrik: "Bild: Indiska oceanen 2004"
        rader:
          - - Indiska oceanen 2004. Stjärnan är skalvet. Vågen nådde kuster runt havet, ända till Somalia, mer än 5 000 kilometer bort. Kartan är förenklad.
      - rubrik: "Fakta: Så högt upp på land nådde vattnet år 2004"
        rader:
          - - Aceh på Sumatra
            - 51 meter över havet
          - - Thailand
            - 5–20 meter över havet
          - - Somalia, mer än 5 000 kilometer bort
            - nästan 10 meter över havet
      - rubrik: "Fördjupning: Flickan som kände igen tecknen"
        rader:
          - - Den 26 december 2004 var tioåriga Tilly Smith på en strand i Thailand. Två veckor före resan dit hade hon läst om tsunamier på geografin i skolan. På lektionen hade hon fått lära sig vilka tecken som visar att en tsunami kan vara på väg.
          - - Den dagen såg Tilly att havet ändrades, och hon kände igen tecknen från lektionen. Hon varnade sina föräldrar, men först trodde de henne inte. Tilly gav sig inte, och familjen bad de andra på stranden att gå därifrån. Omkring hundra människor sägs ha klarat sig tack vare henne.
          - - Det Tilly hade lärt sig gäller än i dag. Drar sig havet plötsligt undan ska man genast gå upp på en höjd eller långt in på land. Man ska inte vänta på en varning. Efter den första vågen kan fler komma.
      - rubrik: Visste du att …
        rader:
          - - År 79
            - såg den 17-årige Plinius havet dra sig undan vid Neapelbukten medan vulkanen Vesuvius hade utbrott, som om skalven tryckte bort vattnet. Vad skulle du göra om du såg havet dra sig undan?
      - rubrik: Läs mer
        rader:
          - - Svenska nationella seismiska nätet förklarar hur en tsunami börjar och sprids.
            - https://www.uu.se/forskning/svenska-nationella-seismiska-natet/tsunamier
          - - Naturhistoriska riksmuseet berättar om tsunamier, också den i Japan 2011. Sidan är skriven för vuxna.
            - https://www.nrm.se/fakta-om-naturen/jorden-geologi/vulkaner-och-jordbavningar/tsunamis
          - - SMHI förklarar varför vågen växer nära land och vad du gör om havet plötsligt drar sig undan.
            - https://www.smhi.se/kunskapsbanken/oceanografi/vagor/tsunami
  - rubrik: "Modellen: Medel, text 9, Vågen som kom"
    tema: Vulkaner och jordbävningar
    text:
      - Kedjan, blad 1, ifylld för Vågen som kom.
    delar:
      - rubrik: Frågan och svaret
        falt:
          - rubrik: Textens fråga
            text: Hur kan ett skalv under havet döda människor på en strand tusentals kilometer bort?
          - rubrik: Lyssna efter
            text: plattorna fastnar, berget brister · vattnet lyfts, en låg och snabb våg · vid kusten bromsas den och växer
          - rubrik: Så kan svaret låta
            text: Plattorna fastnar, och spänningen växer tills berget brister. Havsbottnen rycker till och lyfter vattnet. På havet är vågen låg och snabb, och vid kusten bromsas den och blir högre. Vattnet stiger snabbt upp över stranden.
  - rubrik: "Lärarens sida: Medel, text 10, Skalvsäkra hus"
    text:
      - Det är husen som rasar och skadar människorna i ett skalv, och hus som byggs efter stränga regler eller står på isolatorer kan klara skakningen. Texten har ett problem och en lösning, och modellen är Problem och lösning, blad 2. I vecka 5 har två elever i taget jobbkorten från avsnitt 2, och de två som har dem i avsnitt 4 leder hela avsnittet.
    delar:
      - rubrik: "Läspasset: de fyra avsnitten"
        falt:
          - rubrik: Textens fråga
            text: Varför dog så många fler i Haiti än i Chile, och hur kan ett hus klara ett skalv?
          - rubrik: Ord före läsningen
            text: magnitud (skalvets energi, mycket mer per steg) · isolator (stötdämpare, ingen isolering mot kyla) · byggregel (hur hus ska byggas, inget spel)
          - rubrik: 1 Det är husen som rasar
            text: |-
              Red ut: ”Ungefär så”: bordet är marken, tornet huset · ”det” i ”inne i det”: huset
              Lyssna efter: skakningen fäller husen · människorna i husen skadas
              Lockar: tornet av klossar. ”Vad är problemet, enligt sista stycket?”
          - rubrik: 2 Haiti 2010
            text: |-
              Red ut: ”nära och djupt”: var skalvet börjar · ”följderna”: det som hände efter skalvet
              Lyssna efter: kraftig skakning · hus som inte tålde skalv · många på liten yta
              Lockar: kanske mer än 200 000 döda. ”Vilka tre saker gjorde skalvet så farligt?”
              Sambandet: ”beror också på husen”: varför så många dog i Haiti
              Bilden: Rutan för Haiti, vid siffran 2: en enda liten ruta
          - rubrik: 3 Regler för hus
            text: |-
              Red ut: förebygga, i marginalen · ”för sent att bygga om”: när marken skakar finns ingen tid
              Lyssna efter: byggregler · huset står kvar · reglerna följs
              Lockar: hus med sprickor. ”Vad kan byggreglerna säga, enligt andra stycket?”
              Sambandet: ”En lösning är att”: från orsaken till det man gör
          - rubrik: 4 Hus på stötdämpare
            text: |-
              Red ut: stötdämpare, i marginalen · ”den” i ”under den”: skateboarden
              Lyssna efter: isolatorer som stötdämpare · tar upp rörelsen · sjukhuset klarade sig
              Lockar: skateboarden på mattan. ”Vad gör isolatorerna när marken skakar?”
              Sambandet: ”En annan lösning är att”: lösning 2, huset skakar inte med
              Bilden: Vid siffran 4 rör sig marken mycket och huset lite
          - rubrik: Om någon frågar
            text: Hur många dog i Haiti? Ingen vet säkert. Regeringen sa 316 000, och andra har räknat fram färre än 100 000. Drabbas fattiga länder hårdare? Ja, skriver Skolverket, för husen där är mindre robusta. Har Sverige haft stora skalv? När isen smälte för omkring 10 000 år sedan kom skalv upp till magnitud 8. Kosteröskalvet 1904 hade 5,4.
      - rubrik: "Modellpasset: Problem och lösning för Skalvsäkra hus"
        falt:
          - rubrik: Fördjupningen
            text: |-
              Red ut: ”helt steg”: till exempel från 7 till 8 · USGS: en myndighet i USA
              Lyssna efter: mer än 500 gånger energin · färre döda, två skäl · tsunamin dödade många
              Lockar: 32 gånger per steg. ”Vilka två skäl ger USGS?”
              Sambandet: ”Vad reglerna kan göra”: resultatet av lösning 1. ”svagare än i Haiti”: jämför avsnitt 2
              Bilden: Rutorna: en för Haiti, mer än 500 för Chile
          - rubrik: Modellen
            text: "Lägg först fram gruppens kedja från vecka 4 och fråga: ”Var skriver vi det någon gör åt problemet?” Den visar vad som leder till vad, men inte vad någon gör åt problemet. Ta sedan fram Problem och lösning, blad 2. Gruppen lägger fördjupningens post-it-lapp på En lapp till, som får namnet Resultatet, och drar ett streck till lösning 1. Chile visar vad lösning 1 ledde till, och att vågen var en annan fara. På blad 2 har resultatet ingen egen plats."
          - rubrik: Orden
            text: |-
              problemet är (husen rasar) · beror också på (sårbar plats) · en lösning är att (byggregler) · en annan lösning är att (isolatorer)
              Utan flik: gruppen skriver ”långt färre” vid En lapp till.
          - rubrik: Svaret
            text: |-
              Lyssna efter: Haitis hus tålde inte skalv · Chile: regler och svagare skakning · byggregler och isolatorer
              Så kan det låta: ”I Haiti rasade hus som inte var byggda för skalv. I Chile var skalvet större, men byggregler och svagare skakning hjälpte. Ett hus kan klara skalv om det byggs efter regler eller står på isolatorer.”
          - rubrik: Rutan
            text: "Visste du att: intressant, för svaret håller utan skalven i Sverige."
          - rubrik: Samtala
            text: "Varför börjar författaren med ett torn av klossar? Varför kommer Chile sist? Ett svar: tornet visar att det är husen som rasar, och Chile visar vad reglerna kan göra."
  - rubrik: "Medel, text 10: Skalvsäkra hus"
    tema: Vulkaner och jordbävningar
    text:
      - Vulkaner och jordbävningar · text 5 av 5
    delar:
      - rubrik: Till läraren
        falt:
          - rubrik: Hör till
            text: Lärarens sida till texten.
    listor:
      - rubrik: Skalvsäkra hus
        rader:
          - - I januari 2010 kom ett jordskalv i Haiti, och drygt sex veckor senare ett i Chile. Skalvet i Chile var mycket större, men det var i Haiti som flest dog. Varför dog så många fler i Haiti än i Chile, och hur kan ett hus klara ett skalv?
      - rubrik: Siffran
        rader:
          - - Mer än 500
            - gånger så mycket energi frigjorde skalvet i Chile som skalvet i Haiti år 2010.
      - rubrik: "Bild: Energin i två skalv"
        rader:
          - - Energin i två skalv. En ruta är energin i skalvet i Haiti, och skalvet i Chile hade mer än 500 sådana. Siffran är avsnittets nummer.
      - rubrik: Det är husen som rasar
        rader:
          - - Bygg ett högt torn av klossar på ett bord och skaka bordet. Bordet står kvar, men tornet rasar, eftersom inget håller ihop klossarna. Ungefär så går det till i ett jordskalv.
          - - I ett jordskalv är det skakningen som gör de flesta skadorna. Hus som inte tål skakningen kan spricka och rasa. Ett hus är mycket tyngre än klossar, och när det rasar skadas människorna inne i det. Många som dör i jordskalv dör för att husen är dåligt byggda.
          - - Problemet är alltså husen. En plats där ett skalv kan skada många människor kallas sårbar. Ingen kan stoppa ett skalv, men det går att göra en plats mindre sårbar.
      - rubrik: Haiti 2010
        rader:
          - - Hur många som dör i ett skalv beror på skalvets storlek. Det beror också på husen och på hur tätt människor bor. Det syntes i Haiti den 12 januari 2010. Då kom ett skalv med **magnituden** 7,0.
          - - Tre saker gjorde skalvet så farligt. Skakningen var kraftig. Hur hårt marken skakar beror både på skalvets storlek och på hur nära och djupt det börjar. Skalvet i Haiti började omkring 25 kilometer från huvudstaden Port-au-Prince. Många hus var inte byggda för att klara skalv, och de rasade. Dessutom bodde många människor tätt, alltså många på en liten yta.
          - - Ingen vet säkert hur många som dog. Det var tiotusentals, kanske mer än 200 000. Haiti var en sårbar plats, och därför blev följderna så svåra.
      - rubrik: Ord i texten
        rader:
          - - magnitud
            - mått på hur mycket energi ett skalv frigör
      - rubrik: Regler för hus
        rader:
          - - En lösning är att bygga husen så att de klarar skakningen. Därför finns det byggregler. Reglerna säger hur ett hus ska byggas för att stå kvar när marken skakar.
          - - Reglerna kan till exempel säga hur starka väggarna ska vara och hur väggar, golv och tak ska sitta ihop. Ett hus som är byggt så kan få sprickor och andra skador, men det ska inte rasa över dem som är inne.
          - - Byggregler är ett sätt att **förebygga** olyckor. Med reglerna är husen redo innan skalvet kommer, för när marken väl skakar är det för sent att bygga om. Men reglerna måste också följas. I Haiti var reglerna gamla och användes sällan. I Chile fanns det stränga byggregler år 2010.
      - rubrik: Ord i texten
        rader:
          - - förebygga
            - göra något i förväg, innan det händer
      - rubrik: Hus på stötdämpare
        rader:
          - - En annan lösning är att låta marken skaka under huset, utan att huset följer med lika mycket. Då ställs huset på isolatorer. De sitter mellan huset och marken och fungerar som **stötdämpare**. När marken rör sig fram och tillbaka tar isolatorerna upp en stor del av rörelsen.
          - - Det är som att stå på en skateboard medan någon drar en matta fram och tillbaka under den. Mattan åker fram och tillbaka, men du rör dig mycket mindre.
          - - Ett sjukhus i Los Angeles i USA står på 149 isolatorer. Där kom år 1994 ett skalv med magnituden 6,7. Isolatorerna minskade då rörelsen med omkring två tredjedelar innan den nådde huset. Sjukhuset fick inga skador.
      - rubrik: Ord i texten
        rader:
          - - stötdämpare
            - del som tar emot och dämpar stötar
      - rubrik: "Bild: Hus på isolatorer"
        rader:
          - - Hus på isolatorer. Marken skakar fram och tillbaka, och isolatorerna tar upp en stor del av rörelsen. Siffran är avsnittets nummer.
      - rubrik: "Fördjupning: Chile 2010"
        rader:
          - - Vad reglerna kan göra syntes i Chile den 27 februari 2010. Där kom ett skalv med magnituden 8,8. Det är lätt att tro att det bara är lite mer än Haitis 7,0, för talen ligger nära varandra. Men varje helt steg på skalan betyder ungefär 32 gånger mer energi. Två steg betyder 32 gånger 32, alltså omkring 1 000 gånger. Från 7,0 till 8,8 är nästan två steg, och skalvet i Chile frigjorde mer än 500 gånger så mycket energi som skalvet i Haiti.
          - - Ändå dog under tusen människor i Chile, långt färre än i Haiti. Den amerikanska myndigheten USGS ger två skäl. Chile hade stränga byggregler, och den starkaste skakningen var svagare än i Haiti.
          - - Många av dem som dog i Chile dog i en tsunami, en våg som skalvet satte igång. Reglerna hjälpte alltså mot skakningen, men vattnet var en annan fara.
      - rubrik: "Fakta: Haiti och Chile 2010"
        rader:
          - - Datum
            - Haiti 12 januari och Chile 27 februari
          - - Magnitud
            - Haiti 7,0 och Chile 8,8
          - - Döda
            - Haiti kanske mer än 200 000 och Chile under tusen
      - rubrik: Visste du att …
        rader:
          - - Minst ett
            - jordskalv sker varje dag i Sverige, men bara tio till tjugo om året känns. Spänningen i berget kommer från plattgränsen mitt i Atlanten. Var i Sverige kom de senaste skalven?
      - rubrik: Läs mer
        rader:
          - - Svenska nationella seismiska nätet har en karta över de senaste skalven i och nära Sverige.
            - https://www.uu.se/forskning/svenska-nationella-seismiska-natet/skalvkartor/analyserade-skalv
          - - Svenska nationella seismiska nätet berättar om de största skalven i Sverige, som Kosteröskalvet 1904.
            - https://www.uu.se/forskning/svenska-nationella-seismiska-natet/jordbavningar/stora-svenska-skalv
          - - Svenska nationella seismiska nätet svarar på vanliga frågor om jordskalv, till exempel hur skalven gör skada.
            - https://www.uu.se/forskning/svenska-nationella-seismiska-natet/jordbavningar/vanliga-fragor
  - rubrik: "Modellen: Medel, text 10, Skalvsäkra hus"
