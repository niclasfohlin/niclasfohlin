    efter: "ram: Modellen: Medel, text 9, Vågen som kom"
  - nr: 146
    rubrik: Energin i två skalv
    text: Till vänster står skalvet i Haiti 2010, magnitud 7,0, med en liten ruta för energin. Till höger står skalvet i Chile 2010, magnitud 8,8, med 500 lika stora rutor i fem block om hundra. Skalvet i Chile frigjorde mer än 500 gånger så mycket energi.
    efter: "ram: Medel, text 10: Skalvsäkra hus"
  - nr: 147
    rubrik: Hus på isolatorer
    text: Ett hus sett från sidan står på en rad isolatorer ovanpå marken. En lång pil i marken visar att marken skakar fram och tillbaka. En pil över huset, en tredjedel så lång, visar att huset rör sig mindre.
    efter: "ram: Medel, text 10: Skalvsäkra hus"
