  - rubrik: "Lärarens sida: Bas, text 9, Skatten i åkern"
    text:
      - Kalifatet långt bort hade mycket silver. Nordborna fick det genom handel längs floderna, och på Gotland vägdes det. Mycket grävdes ner och blev kvar, och ingen vet säkert varför. Texten förklarar orsak och verkan, och modellen är Kedjan, blad 1. I vecka 4 har två elever i taget jobbkorten från avsnitt 2.
    delar:
      - rubrik: "Läspasset: de fyra avsnitten"
        falt:
          - rubrik: Textens fråga
            text: Hur kom så mycket silver från ett rike långt bort till Gotland, och varför blev det kvar i jorden?
          - rubrik: Ord före läsningen
            text: skatt (gömt silver, inte det man betalar) · handel (byta varor mot silver)
          - rubrik: 1 Silver från långt bort
            text: |-
              Red ut: kalifat, i marginalen · ”Sådana mynt”: mynt av silver
              Lyssna efter: ett rike långt bort · mycket silver · mynt
              Lockar: myntet från år 740. ”Var gjordes mynten, och av vad?”
              Bilden: Kalifatet på kartan Silvrets väg, vid siffran 1
          - rubrik: 2 Handel längs floderna
            text: |-
              Red ut: ”till fånga”: fångat dem · träl, i marginalen
              Lyssna efter: handel längs floderna · pälsar och trälar · fick silver
              Lockar: att vikingarna stal silvret. ”Vad fick nordborna silvret för?”
              Sambandet: ”därför”: silvret i kalifatet lockade
              Bilden: Pilarna längs floderna: varor åt ena hållet, silver tillbaka
          - rubrik: 3 Silvret vägdes
            text: |-
              Red ut: ”värt så mycket som det vägde”: tyngre, mer värt · ”lagom mycket”: rätt mängd
              Lyssna efter: till Gotland · vägdes · hackades sönder
              Lockar: vackra armringar i bitar. ”Varför hackade man sönder silvret?”
              Sambandet: ”Det gjorde att”: handeln förde silvret till Gotland
              Bilden: Gotland på kartan, vid siffran 3
          - rubrik: 4 Silvret i jorden
            text: |-
              Red ut: ”Eftersom” först: orsaken före följden · ”hämtades aldrig”: ingen grävde upp det
              Lyssna efter: gömdes i jorden · hämtades aldrig · skatter än i dag
              Lockar: säckar av tyg under golvet. ”Varför hittar man skatter på Gotland än i dag?”
              Sambandet: ”Eftersom”: silvret var värdefullt och gömdes
              Bilden: Spillingsskatten, 67 paket, och den lilla vanliga skatten
          - rubrik: Om någon frågar
            text: Vad hette mynten? Dirhamer. Kom nordborna ända till kalifatet? Mest mötte de muslimska köpmän vid floderna Volga och Don. Hur många mynt fanns i Spillingsskatten? Omkring 14 300, de flesta från kalifatet. Vilken skatt var Sveriges största förut? Burgeskatten, 10,4 kilo.
      - rubrik: "Modellpasset: Kedjan för Skatten i åkern"
        falt:
          - rubrik: Fördjupningen
            text: |-
              Red ut: ”då eller senare”: inte före 870-talet · ”Kanske”: en av forskarnas förklaringar
              Lyssna efter: ingen vet säkert · det yngsta myntet · flera förklaringar
              Lockar: Ynglingasagan och livet efter döden. ”Vad vet forskarna, och vad tror de?”
              Sambandet: ”Ingen vet säkert”: varför silvret i avsnitt 4 blev kvar
          - rubrik: Modellen
            text: "Lägg först fram gruppens tidslinje från vecka 2 och fråga: ”Flikarna säger när. Var skriver vi varför?” Den visar när, men inte varför. Ta sedan fram Kedjan, blad 1. Gruppen lägger fördjupningens post-it-lapp på En lapp till, kallar platsen Förklaringarna och drar ett streck till led 4. Led 4 säger att silvret blev kvar. Fördjupningen säger att ingen vet säkert varför, och det är svarets sista led."
          - rubrik: Orden
            text: därför (handeln) · det gjorde att (vägt silver) · eftersom (gömt i jorden)
          - rubrik: Svaret
            text: |-
              Lyssna efter: silver från kalifatet · handel längs floderna, vägt på Gotland · gömt och kvar, ingen vet varför
              Så kan det låta: ”Kalifatet hade mycket silver. Nordborna sålde varor längs floderna och fick silver, som kom till Gotland och vägdes. Eftersom silvret var värdefullt, grävde många ner det. Mycket blev kvar, och ingen vet säkert varför.”
          - rubrik: Rutan
            text: "Visste du att: intressant, för svaret håller utan tv-teamet på åkern."
          - rubrik: Samtala
            text: "Var skriver författaren vad forskarna tror, och varför där? Varför börjar texten med ett mynt? Ett svar: där spåren inte räcker, om trälarna och silvret som blev kvar. Ett mynt går att känna i handen."
  - rubrik: "Bas, text 9: Skatten i åkern"
    tema: Vikingarna
    text:
      - Vikingarna · text 4 av 5
    delar:
      - rubrik: Till läraren
        falt:
          - rubrik: Hör till
            text: Lärarens sida till texten.
    listor:
      - rubrik: Skatten i åkern
        rader:
          - - Under en åker på Gotland låg tusentals silvermynt. Skatt betyder här silver som någon har gömt i jorden. Hur kom så mycket silver från ett rike långt bort till Gotland, och varför blev det kvar i jorden?
      - rubrik: Siffran
        rader:
          - - 67 kilo
            - silver låg i Spillingsskatten. Den kom fram ur en åker på Gotland år 1999.
      - rubrik: Silver från långt bort
        rader:
          - - Tänk dig ett mynt av silver i din hand. Det väger ungefär tre gram, så du känner det knappt. Sådana mynt gjordes i **kalifatet**, ett rike långt bort.
          - - I kalifatet fanns mycket silver, och där gjordes många mynt. Ett mynt på Historiska museet gjordes omkring år 740 i dagens Irak. Det är nästan 1 300 år sedan.
          - - De flesta mynten i den stora skatten i åkern kom från kalifatet.
      - rubrik: Ord i texten
        rader:
          - - kalifat
            - ett rike där ledaren kallades kalif
      - rubrik: "Bild: Silvrets väg"
        rader:
          - - Silvrets väg. Följ silvret från kalifatet längs floderna till Gotland. Kartan är förenklad, och Gotland är förstorad. Siffrorna är avsnittens nummer.
      - rubrik: Handel längs floderna
        rader:
          - - Silvret lockade, och därför reste många nordbor österut. De for över Östersjön och sedan längs floderna. Där bytte de varor mot silver. Ett sådant byte kallas handel.
          - - Nordborna sålde pälsar, och de sålde **trälar**. De hade tagit många av trälarna till fånga när de plundrade. Forskarna tror att en del av silvret var betalning för trälar.
          - - Det är lätt att tänka sig att vikingarna stal silvret. Men mycket av det fick de genom handel, som betalning för det de sålde.
      - rubrik: Ord i texten
        rader:
          - - träl
            - en människa som ägdes av en annan
      - rubrik: Silvret vägdes
        rader:
          - - Det gjorde att mycket silver kom till Gotland, en ö i Östersjön. Där fanns silvret som mynt, armringar och bitar.
          - - Silvret var värt så mycket som det vägde. Det spelade ingen roll om det var ett mynt eller en armring. En tyngre bit var värd mer än en lättare.
          - - Därför hackade man sönder silvret i mindre bitar. Man hackade till och med sönder vackra armringar. Bitarna vägdes, så att man betalade lagom mycket silver.
      - rubrik: Silvret i jorden
        rader:
          - - Eftersom silvret var så värdefullt, gömde många det i jorden. Det var vanligt att gömma sina värdesaker.
          - - Men mycket av silvret hämtades aldrig, och ingen vet säkert varför. Det blev kvar i jorden. Därför hittar man skatter på Gotland än i dag. Fler än 700 silverskatter har hittats på ön.
          - - Den största av dem heter Spillingsskatten. Den låg under golvet i ett stort hus, troligen i säckar av tyg. I dag är platsen en åker.
      - rubrik: "Bild: Skatterna i kilopaket"
        rader:
          - - Skatterna i kilopaket. Varje paket väger ett kilo. Spillingsskatten är 67 paket, och en vanlig skatt är en fjärdedel av ett paket. Siffrorna är avsnittens nummer.
      - rubrik: "Fakta: Silvret i gram och kilo"
        rader:
          - - Ett mynt
            - ungefär 3 gram
          - - En vanlig skatt på Gotland
            - 200 till 300 gram, ungefär en fjärdedel av ett kilo
          - - Spillingsskatten
            - 67 kilo silver, lika mycket som 67 paket socker på ett kilo
          - - Silverskatter på Gotland
            - fler än 700
      - rubrik: "Fördjupning: Varför blev silvret kvar?"
        rader:
          - - Ingen vet säkert varför så många skatter aldrig hämtades. Men forskarna vet en del. Det yngsta myntet i Spillingsskatten är från 870-talet, för mer än 1 100 år sedan. Därför vet de att skatten grävdes ner då eller senare.
          - - Forskarna har flera förklaringar. Kanske gömde ägaren silvret för att spara det och kunde sedan inte hämta det. Kanske handlade det om religion. Enligt en gammal berättelse, Ynglingasagan, fick den döde ha med sig sitt nedgrävda silver till livet efter döden.
      - rubrik: Visste du att …
        rader:
          - - Strax efter
            - att ett tv-team hade filmat på åkern och åkt därifrån, kom den första skatten fram. Hur tror du att tv-teamet kände sig?
      - rubrik: Läs mer
        rader:
          - - Historiska museet berättar om Spillingsskatten och om dagen då den hittades.
            - https://historiska.se/utforska-historien/kunskapsbank/varldens-storsta-vikingatida-skatt/
          - - Gotlands museum visar silverskatterna i utställningen Skattkammaren.
            - https://www.gotlandsmuseum.se/utstallning/skattkammaren/
          - - Historiska museet har bilder på föremål ur Gotlands gömda silverskatter.
            - https://vikingar.historiska.se/objects.php?showcase=60479fe5-6817-470f-b941-ffcf45aff182&e=&l=sv
  - rubrik: "Modellen: Bas, text 9, Skatten i åkern"
    tema: Vikingarna
    text:
      - Kedjan, blad 1, ifylld för Skatten i åkern.
    delar:
      - rubrik: Frågan och svaret
        falt:
          - rubrik: Textens fråga
            text: Hur kom så mycket silver från ett rike långt bort till Gotland, och varför blev det kvar i jorden?
          - rubrik: Lyssna efter
            text: silver från kalifatet · handel längs floderna, vägt på Gotland · gömt och kvar, ingen vet varför
          - rubrik: Så kan svaret låta
            text: Kalifatet hade mycket silver. Nordborna sålde varor längs floderna och fick silver, som kom till Gotland och vägdes. Eftersom silvret var värdefullt, grävde många ner det. Mycket blev kvar, och ingen vet säkert varför.
  - rubrik: "Lärarens sida: Bas, text 10, Vikingarnas spår"
    text:
      - Vikingarna skrev inga böcker, och det mesta de ristade i trä har ruttnat. Forskarna läser därför spåren i marken, det som skrevs och nya mätningar. En del vet vi, och annat tror forskarna. Texten har ett problem och en lösning, och modellen är Problem och lösning, blad 1. I vecka 5 har två elever i taget jobbkorten från avsnitt 2, och de två som har dem i avsnitt 4 leder hela avsnittet.
    delar:
      - rubrik: "Läspasset: de fyra avsnitten"
        falt:
          - rubrik: Textens fråga
            text: Hur kan vi veta något om vikingarna när de inte skrev några böcker, och hur säkert är det vi vet?
          - rubrik: Ord före läsningen
            text: källa (spår från förr, ingen vattenkälla) · spår (det som finns kvar, inga fotspår) · troligen (forskarna tror, men vet inte säkert)
          - rubrik: 1 Inga böcker
            text: |-
              Red ut: ”någon sådan bok”: där en viking berättar · källa: förklaras i texten
              Lyssna efter: inga böcker · hur de levde
              Lockar: källan där vatten kommer upp. ”Vilken bok finns inte?”
          - rubrik: 2 Trä ruttnar
            text: |-
              Red ut: ”vad vikingarna skrev på”: trä och sten · ”till minne av vem”: den döde
              Lyssna efter: runor i trä · har ruttnat · korta texter på sten
              Lockar: Jarlabankes stenar om sig själv. ”Varför finns så lite av vikingarnas skrift kvar?”
              Sambandet: ”Problemet beror på”: varför det inte finns någon sådan bok
              Bilden: Pinnen som har ruttnat och runstenen som står kvar
          - rubrik: 3 Forskarna läser spåren
            text: |-
              Red ut: arkeolog, i marginalen · ”En annan sorts”: ett andra slags spår
              Lyssna efter: spår i marken · det som skrevs · nya sätt att mäta
              Lockar: DNA från 442 människor. ”Vilka tre sorters spår läser forskarna?”
              Sambandet: ”En lösning är”: svaret på att skriften saknas
              Bilden: Siffran 3 vid graven, skatten och nedre raden i Vikingatiden och forskningen
          - rubrik: 4 Vad vi vet och tror
            text: |-
              Red ut: ”for sällan eller aldrig i väg”: stannade oftast hemma · ”troligen eller kanske”: inte säkert
              Lyssna efter: de flesta var bönder · en del tror forskarna · troligen
              Lockar: krigare som slogs hela tiden. ”När skriver forskarna troligen?”
              Sambandet: ”har lett till”: det som spåren har gett
              Bilden: Vikingatiden och forskningen, med vikingatiden till vänster och ny kunskap till höger
          - rubrik: Om någon frågar
            text: Finns det inga sagor? Jo, men de skrevs ner på Island, tidigast på 1200-talet. Hur många gravar på Birka är utgrävda? Omkring 1 100. Visste ingen förut att det var en kvinna? En benanalys på 1970-talet sa det, men ingen visste säkert att benen hörde till graven. Vem skrev brevet om Lindisfarne? Alcuin, som bodde långt därifrån.
      - rubrik: "Modellpasset: Problem och lösning för Vikingarnas spår"
        falt:
          - rubrik: Fördjupningen
            text: |-
              Red ut: Birka: en handelsplats, i Siffran · ”Det vet vi nu”: DNA är säkert
              Lyssna efter: vapen i graven · DNA: en kvinna · krigare är osäkert
              Lockar: två hästar och spelpjäser. ”Vad vet vi om graven, och vad tror forskarna?”
              Sambandet: ”både det vi vet och det forskarna tror”: resultatet i avsnitt 4
          - rubrik: Modellen
            text: "Lägg först fram gruppens kedja från vecka 4 och fråga: ”Var skriver vi det någon gör åt problemet?” Den visar vad som leder till vad, men inte vad någon gör åt problemet. Ta sedan fram Problem och lösning, blad 1. Gruppen lägger fördjupningens post-it-lapp på En lapp till, kallar platsen Graven Bj 581 och drar ett streck till resultatet. Graven är ett exempel på resultatet: att det var en kvinna vet vi, men om hon var krigare är en tolkning."
          - rubrik: Orden
            text: problemet är (inga böcker) · beror på (trä ruttnar) · en lösning är (spåren) · har lett till (vet och tror)
          - rubrik: Svaret
            text: |-
              Lyssna efter: inga böcker, runorna i trä har ruttnat · spår i marken, texter och mätningar · en del vet vi, en del tror forskarna
              Så kan det låta: ”Vikingarna skrev inga böcker, och runorna i trä har ruttnat. Forskarna läser spåren: fynd, runstenar och DNA. En del vet vi, som att de flesta var bönder, och en del tror forskarna.”
          - rubrik: Rutan
            text: "Visste du att: intressant, för svaret håller utan hornen, men rutan visar hur en myt blev till."
          - rubrik: Samtala
            text: "Var skriver författaren ”vi vet”, och var ”forskarna tror”? Varför handlar fördjupningen om graven Bj 581? Ett svar: graven visar båda, för DNA är säkert, men att hon var krigare är en tolkning."
  - rubrik: "Bas, text 10: Vikingarnas spår"
    tema: Vikingarna
    text:
      - Vikingarna · text 5 av 5
    delar:
      - rubrik: Till läraren
        falt:
          - rubrik: Hör till
            text: Lärarens sida till texten.
    listor:
      - rubrik: Vikingarnas spår
        rader:
          - - Du har läst om ett skepp, en runsten, två vägar och en skatt. Ingen av dagens forskare var där. Hur kan vi veta något om vikingarna när de inte skrev några böcker, och hur säkert är det vi vet?
      - rubrik: Siffran
        rader:
          - - Över 3 000
            - gravar är kända på Birka, en handelsplats på vikingatiden. En av dem kallas Bj 581.
      - rubrik: Inga böcker
        rader:
          - - Tänk dig att du vill veta hur vikingarna levde. Du letar efter en bok där en viking berättar om sitt liv. Problemet är att det inte finns någon sådan bok. Vikingarna skrev inga böcker om hur de levde.
          - - Forskarna måste leta efter andra källor. En källa är här ett spår från förr, som berättar något. Du känner kanske igen ordet från vatten. Då är en källa ett ställe där vatten kommer upp ur marken. Ur en källa om förr kommer kunskap.
      - rubrik: Trä ruttnar
        rader:
          - - Problemet beror på vad vikingarna skrev på. De ristade runor, oftast i trä, och träet har ruttnat. Texterna försvann med det.
          - - Många runstenar står kvar, eftersom sten inte ruttnar. Omkring 2 500 har hittats i dagens Sverige. Men texterna på dem är oftast korta. De säger vem som lät resa stenen och till minne av vem. Jarlabanke lät till och med resa stenar till minne av sig själv, medan han levde.
      - rubrik: "Bild: Spåren i marken"
        rader:
          - - Spåren i marken. Runstenen, graven och skatten finns kvar. Pinnen av trä med runor har ruttnat bort. Siffrorna är avsnittens nummer.
      - rubrik: Forskarna läser spåren
        rader:
          - - En lösning är att läsa spåren efter vikingarna. En sorts spår finns i marken. Där letar en **arkeolog** efter det som finns kvar. Spillingsskatten berättar om handeln österut.
          - - En annan sorts spår är det som skrevs. Runstenarna berättar om döda och om resor. Andra folk skrev också om vikingarna. Efter anfallet på Lindisfarne år 793, för mer än 1 200 år sedan, skrev en man ett brev om det.
          - - En tredje sorts spår får forskarna genom att mäta på nya sätt. Årsringarna i skeppets trä visar var Skuldelev 2 byggdes. DNA från 442 människor visar vart vikingarna reste.
      - rubrik: Ord i texten
        rader:
          - - arkeolog
            - forskare som gräver fram spår från förr
      - rubrik: "Fakta: Spåren och vad de berättar"
        rader:
          - - Runsten
            - vem som dog, och ibland vart hen hade rest
          - - Grav
            - vad den döde fick med sig i graven
          - - Fynd i marken
            - vad människor ägde, som silvret i Spillingsskatten
          - - Andras texter
            - vad andra folk berättade, som om anfallet på Lindisfarne
          - - DNA
            - om den döde var man eller kvinna, och var släkten kom ifrån
      - rubrik: Vad vi vet och tror
        rader:
          - - Spåren har lett till att vi vet mycket om vikingarna, men inte allt. En del vet vi, och en del tror forskarna.
          - - Många tänker sig att alla vikingar var krigare som slogs hela tiden. Men spåren visar att de flesta människor på vikingatiden var bönder. De arbetade på sina gårdar och for sällan eller aldrig i väg. Bara en del av dem for ut i viking.
          - - Annat vet ingen säkert, till exempel varför Spillingsskatten blev kvar i jorden. När spåren inte räcker, skriver forskarna ord som troligen eller kanske. Då vet läsaren att forskarna tror, men inte vet säkert.
      - rubrik: "Bild: Vikingatiden och forskningen"
        rader:
          - - Vikingatiden och forskningen. Den övre raden är vikingatiden, omkring 800 till 1050. Den nedre visar när forskarna fick veta något nytt.
      - rubrik: "Fördjupning: Vem låg i graven Bj 581?"
        rader:
          - - Graven Bj 581 på Birka visar både det vi vet och det forskarna tror. I graven låg en människa med svärd, yxa, spjut, pilar och två sköldar. Där låg också två hästar och pjäser till ett brädspel. Länge trodde forskarna att det var en manlig krigare.
          - - Med DNA från skelettet visade forskare år 2017 att det var en kvinna. Det vet vi nu.
          - - Forskarna som undersökte graven frågade sig om vapnen betydde att hon var krigare. De har prövat andra svar, men tror att hon var det. Saken har diskuterats mycket.
      - rubrik: Visste du att …
        rader:
          - - 0 hjälmar
            - med horn från vikingatiden har hittats. Hornen kom till på 1800-talet, bland annat i dräkter till en opera. Var har du sett en viking med horn?
      - rubrik: Läs mer
        rader:
          - - SO-rummet har en text för mellanstadiet om källorna och spåren efter vikingatiden.
            - https://www.so-rummet.se/fakta-artiklar/kallor-och-spar-efter-vikingatiden
          - - Historiska museet berättar om Birkaflickan och andra barn på vikingatiden.
            - https://historiska.se/utforska-historien/kunskapsbank/birkaflickan-och-andra-barn-under-vikingatiden/
          - - UR förklarar vikingatiden i en film på elva minuter, på teckenspråk med svensk text.
            - https://urplay.se/program/236915-vi-forklarar-historia-vikingatiden
