  - rubrik: "Lärarens sida: Avancerat, text 10, Klockan i tonåren"
    text:
      - Många tonåringar sover för lite på skoldagar, delvis för att den inre klockan går senare i tonåren, och när skolorna i Seattle började senare sov eleverna längre. Texten har ett problem och en lösning, och modellen är Problem och lösning, blad 1. I vecka 5 har två elever i taget jobbkorten från avsnitt 2, och de två som har dem i avsnitt 4 leder hela avsnittet.
    delar:
      - rubrik: "Läspasset: de fyra avsnitten"
        falt:
          - rubrik: Textens fråga
            text: Är tonåringar trötta på morgonen för att de är lata, och vad händer när skolan börjar senare?
          - rubrik: Ord före läsningen
            text: klocka (kroppens inre klocka, ingen väckarklocka) · hormon (ett ämne i kroppen, inga känslor) · eleven i mitten (mitt i raden, inget genomsnitt)
          - rubrik: 1 Problemet
            text: |-
              Red ut: rekommenderar: råder · ”hantera känslor”: klara av det man känner
              Lyssna efter: 46 procent · mindre än rekommenderat · skoldagar
              Lockar: längre sömn på helgerna. ”Hur många sov mindre än åtta timmar?”
          - rubrik: 2 Orsaken
            text: |-
              Red ut: ”släpper hjärnan ut”: gör och sänder ut · ”kommer igång”: börjar verka
              Lyssna efter: den inre klockan · sömnig senare på kvällen · ingen lathet
              Lockar: melatoninet som finns kvar på morgonen. ”Vad händer med melatoninet i tonåren?”
              Sambandet: ”beror delvis på”, alltså en del av orsaken
              Bilden: Kroppens klocka har flyttats, skolans står kvar
          - rubrik: 3 Lösningen
            text: |-
              Red ut: läsåret 2016/17: hösten 2016 till sommaren 2017 · anser: tycker, efter vad de vet
              Lyssna efter: senare skolstart · nästan en timme · skolans klocka flyttas
              Lockar: rektorn bestämmer. ”När började skolorna i Seattle, före och efter?”
              Sambandet: ”En lösning är”, alltså ett svar på orsaken
          - rubrik: 4 Resultatet
            text: |-
              Red ut: ”märkbart”: så tydligt att forskarna kan lita på det · frånvarande: borta från lektionen
              Lyssna efter: längre sömn · mindre sömniga · betygen osäkra
              Lockar: betygen i biologi. ”Hur mycket längre sov eleven i mitten?”
              Sambandet: ”Resultatet var”, alltså vad som hände efter ändringen
              Bilden: Staplarna 2016 och 2017, och linjen vid åtta timmar
          - rubrik: Om någon frågar
            text: "Är det inte mobilen? Klockan förklarar inte allt: umgänge, skolkrav och skärmtid kan också skjuta läggdags senare, enligt KI. Folkhälsomyndigheten råder: undvik skärmar minst 30–60 minuter före läggdags, och lämna mobilen utanför sovrummet. Hjälper lektioner om sömn? Det är oklart: i studierna var effekterna små eller motstridiga, enligt SBU. Gäller det alla tonåringar? Nej, men hos många ligger sömnen senare."
      - rubrik: "Modellpasset: Problem och lösning för Klockan i tonåren"
        falt:
          - rubrik: Fördjupningen
            text: |-
              Red ut: ”utvalda”: bara några av klasserna · ”vanliga scheman”: den gamla starttiden
              Lyssna efter: ingen grupp att jämföra med · samband, inte orsak · Sverige prövar nu
              Lockar: tre gymnasieskolor i Stockholms län. ”Varför kan Seattlestudien inte säkert visa orsaken?”
              Sambandet: ”Seattlestudien visar”, alltså resultatet i avsnitt 4
          - rubrik: Modellen
            text: "Lägg först fram gruppens kedja från vecka 4 och fråga: ”Var skriver vi det någon gör åt problemet?” Den visar vad som leder till vad, men inte vad någon gör åt problemet. Ta sedan fram Problem och lösning, blad 1. Gruppen lägger fördjupningens post-it-lapp på En lapp till, med ett streck till fältet Resultatet. Lappen säger hur säkert resultatet är och är ingen ny lösning."
          - rubrik: Orden
            text: problemet är (för lite sömn) · beror delvis på (inre klockan) · en lösning är (senare start) · resultatet var (mer sömn)
          - rubrik: Svaret
            text: |-
              Lyssna efter: den inre klockan · melatoninet senare · mer sömn i Seattle
              Så kan det låta: ”Nej. I tonåren kommer melatoninet senare, så kroppens klocka går senare än skolans. När skolorna i Seattle började 8.45 sov eleven i mitten 34 minuter mer, och eleverna var mindre sömniga.”
          - rubrik: Rutan
            text: "Visste du att: viktig, eftersom talet visar att klockorna krockar för nästan alla eleverna."
          - rubrik: Samtala
            text: "Varför berättar författaren hur forskarna fick veta det? Varför står ordet lata i frågan? Ett svar: utan jämförelse vet vi inte säkert vad som orsakade vad, och texten motsäger att de är lata."
  - rubrik: "Avancerat, text 10: Klockan i tonåren"
    tema: Hjärnan
    text:
      - Hjärnan · text 5 av 5
    delar:
      - rubrik: Till läraren
        falt:
          - rubrik: Hör till
            text: Lärarens sida till texten.
    listor:
      - rubrik: Klockan i tonåren
        rader:
          - - Väckarklockan ringer, det är mörkt ute och första lektionen börjar om en timme. Kroppen känns tung, och tankarna går trögt. Forskare har undersökt varför tonåringar ofta har det så, och vad som händer när skolan ändrar sina tider. Är tonåringar trötta på morgonen för att de är lata, och vad händer när skolan börjar senare?
      - rubrik: Siffran
        rader:
          - - 46 procent
            - av 8 449 elever i årskurs 7–9 i Stockholms län sov mindre än åtta timmar på skoldagar åren 2016 till 2018.
      - rubrik: För lite sömn
        rader:
          - - Problemet är att många tonåringar sover mindre än de behöver på skoldagar. I sina råd från 2026 rekommenderar Folkhälsomyndigheten 8 till 10 timmars sömn per natt för den som är mellan 13 och 17 år. Enligt myndigheten gör god sömn det lättare att koncentrera sig och att hantera känslor.
          - - Hur många som sover för lite har forskare mätt med en **enkät** i Stockholms län. Den besvarades åren 2016 till 2018 av 8 449 högstadieelever på 116 skolor. Nästan hälften av eleverna, 46 procent, sov mindre än åtta timmar på skoldagar, och 18 procent sov mindre än sju timmar. Åtta timmar är den nedre gränsen i Folkhälsomyndighetens råd, så de här eleverna sov mindre än vad myndigheten rekommenderar för deras ålder. På helgerna sov eleverna längre. Sömnen var alltså kortast just de dagar då eleverna skulle till skolan.
      - rubrik: Ord i texten
        rader:
          - - enkät
            - frågor som många människor svarar på
      - rubrik: Klockan går senare
        rader:
          - - Att sömnen blir för kort beror delvis på kroppens inre klocka. Den inre klockan är kroppens eget sätt att följa dygnet, och den gör att du blir sömnig på kvällen och pigg på morgonen. När det blir kväll släpper hjärnan ut melatonin, ett **hormon** som gör dig sömnig.
          - - Ibland sägs det att tonåringar är trötta på morgonen för att de är lata. Det stämmer dåligt med det forskarna har mätt. I tonåren släpper hjärnan ut melatonin senare på kvällen, och det som väcker hjärnan kommer igång senare på morgonen. Melatoninet finns också kvar längre in på morgonen. Hos många tonåringar ligger sömnen därför senare.
          - - Skolans klocka följer däremot inte med när kroppens klocka går senare, och skolan börjar lika tidigt som förut. Då blir natten kort för den som inte kan somna tidigare.
      - rubrik: Ord i texten
        rader:
          - - hormon
            - ett ämne kroppen gör, som påverkar andra organ
      - rubrik: "Bild: Två klockor"
        rader:
          - - Två klockor. Kroppens klocka går senare i tonåren, men skolans klocka går som förut. Siffran är avsnittets nummer.
      - rubrik: Senare skolstart
        rader:
          - - En lösning är att låta skolan börja senare, så att skolans klocka kommer närmare kroppens. Det har prövats i Seattle i USA. Där började skolorna i studien klockan 7.50 på morgonen, och från läsåret 2016/17 började de i stället klockan 8.45. Starten flyttades alltså nästan en timme. En amerikansk förening för sömnmedicin rekommenderade 2017 att högstadier och gymnasier börjar klockan 8.30 eller senare, och Seattles nya tid var senare än så.
          - - Forskare följde elever på två av skolorna för att se vad som hände. Det var inte självklart att eleverna skulle sova mer. De kunde i stället lägga sig senare och vakna lika trötta som förut.
          - - I Sverige är det rektorn som bestämmer när skoldagen börjar. Enligt Karolinska institutet anser experter att elever från årskurs 7 helst inte bör börja före klockan 9. Lösningen är alltså något som skolan kan ändra för alla elever på en gång.
      - rubrik: Resultatet i Seattle
        rader:
          - - Resultatet var att eleverna sov längre. Eleverna i studien bar ett armband som mätte sömnen i två veckor, en grupp våren före ändringen och en annan våren efter. Om alla eleverna ställer sig på en rad efter hur länge de sov, är eleven i mitten den som står mitt i raden. Våren 2016 sov eleven i mitten 6 timmar och 50 minuter, och våren 2017 sov eleven i mitten 7 timmar och 24 minuter. Det är 34 minuter mer, men fortfarande mindre än åtta timmar.
          - - Eleverna vaknade senare men somnade inte märkbart senare, och de var mindre sömniga än förut. Betygen i biologi blev också högre, men forskarna skriver själva att det är svårt att säga om den längre sömnen var orsaken till det. På den ena skolan var eleverna mer sällan sena eller frånvarande på första lektionen. På den andra syntes ingen skillnad.
      - rubrik: "Bild: Sömnen i Seattle"
        rader:
          - - Sömnen i Seattle. Staplarna visar sömnen för eleven i mitten före och efter ändringen. Den streckade linjen visar åtta timmar.
      - rubrik: "Fördjupning: Det en studie kan visa"
        rader:
          - - Seattlestudien visar att eleverna sov längre efter ändringen. Forskarna mätte sömnen med armband hos 94 elever våren 2016 och 84 elever våren 2017, men det var olika elever de två åren. Det fanns dessutom ingen grupp att jämföra med, alltså elever som hade kvar den gamla tiden. Utan en sådan grupp går det inte att veta säkert vad skillnaden berodde på, eftersom något annat också kan ha skilt de två åren åt.
          - - Enkäten i Stockholms län är ett annat slags studie. Den är stor, med 8 449 elever, men varje elev svarade en enda gång. Då kan den visa att två saker hänger ihop, som sömnen och hur eleverna mår. Den kan däremot inte visa vilken av sakerna som orsakar den andra, och det skriver forskarna bakom enkäten själva.
          - - "Nu prövas en senare start också i Sverige. Sedan läsåret 2025/26 börjar utvalda klasser på tre gymnasieskolor i Stockholms län tidigast klockan 9, och de jämförs med klasser som har sina vanliga scheman. Där finns alltså en grupp att jämföra med, men svaret är inte klart än. Seattlestudien mätte en förändring utan grupp att jämföra med: den visar vad som hände, men inte säkert varför."
      - rubrik: "Fakta: Seattle före och efter"
        rader:
          - - Skolstart
            - 7.50 före, 8.45 efter
          - - Sömn för eleven i mitten
            - 6 timmar 50 minuter före, 7 timmar 24 minuter efter
          - - Skillnad
            - 34 minuter mer sömn
          - - Sömnighet
            - lägre efter än före
          - - Mätningen
            - två veckor våren 2016 och två veckor våren 2017
      - rubrik: Visste du att …
        rader:
          - - 93 av 100
            - elever i enkäten i Stockholms län skulle vakna medan kroppen fortfarande var inställd på natt, om skolan började klockan 8. Vilken tid börjar din första lektion?
      - rubrik: Läs mer
        rader:
          - - UMO skriver för unga mellan 13 och 25 år om sömn och varför den behövs.
            - https://www.umo.se/ma-bra/somn-och-trotthet/somn/
          - - Folkhälsomyndigheten berättar hur mycket barn och unga behöver sova.
            - https://www.folkhalsomyndigheten.se/vara-amnesomraden/psykisk-halsa/forebyggande-och-framjande-arbete-inom-psykisk-halsa/god-somn-for-barn-och-unga/
          - - 1177 förklarar vad hormoner är, och hur melatoninet gör dig sömnig.
            - https://www.1177.se/liv--halsa/sa-fungerar-kroppen/hormonsystemet/
  - rubrik: "Modellen: Avancerat, text 10, Klockan i tonåren"
    tema: Hjärnan
    text:
      - Problem och lösning, blad 1, ifylld för Klockan i tonåren.
    delar:
      - rubrik: Frågan och svaret
        falt:
          - rubrik: Textens fråga
            text: Är tonåringar trötta på morgonen för att de är lata, och vad händer när skolan börjar senare?
          - rubrik: Lyssna efter
            text: den inre klockan · melatoninet senare · mer sömn i Seattle
          - rubrik: Så kan svaret låta
            text: Nej. I tonåren kommer melatoninet senare, så kroppens klocka går senare än skolans. När skolorna i Seattle började 8.45 sov eleven i mitten 34 minuter mer, och eleverna var mindre sömniga.
