# Temat Hjärnan på nivån Avancerat i Faktatextsamtal i grupp, en post i sajtens databas över faktatexter
# (src/content/faktateman/). Riggen samlar filen med methods/faktatextsamtal-i-grupp/samla.mjs.
metod: faktatextsamtal-i-grupp
tema: Hjärnan
niva: Avancerat
ramar:
  - rubrik: "Lärarhandledning: Avancerat, Hjärnan"
    tema: Hjärnan
    text:
      - Temat Hjärnan har en faktatext för var och en av de fem strukturerna, som brukar passa i åk 8–9. Varje vecka har klassen en läslektion och en modellektion om veckans text, så temat tar fem veckor. Varje elev har texten, en penna och papper till svaret. Du har tavlan, magneter, A4-ark och en tjock tuschpenna. Läs ett avsnitt till högt.
    delar:
      - rubrik: "1 Hjärnans karta: Tankekartan"
        falt:
          - rubrik: Frågan
            text: Använder vi bara tio procent av hjärnan, och vad gör hjärnans olika delar?
          - rubrik: Ord före
            text: bark (hjärnans yttre lager, inte trädets) · nervcell (en levande cell, inget rum) · signal (ett meddelande mellan celler, ingen mobilsignal)
          - rubrik: Tänk högt
            kursiv: true
            text: ”Hjärnbarken. Bark, som på ett träd? Jag läser vidare. Det yttre lagret, ytterst på storhjärnan. Vem eller vad? Storhjärnan och barken. Det viktigaste? Barken tar emot intryck från sinnena och styr rörelser. Att pannlobens främre del mognar sent är spännande, men det är en detalj.”
          - rubrik: Det brukar skava
            text: "”går den över i ryggmärgen”: hjärnstammen fortsätter nedåt som ryggmärgen, och signalerna går genom båda (avsnitt 3)"
          - rubrik: Modellen
            text: "storhjärnan: ”den största delen” · lillhjärnan: ”också” · hjärnstammen: ”kvar blir” · nervcellerna: ”i alla tre”. I mitten står hjärnan. Fördjupningens kärna, räkningen av nervcellerna, hör till nervcellerna och är ingen femte del."
          - rubrik: Lyssna efter
            text: nej, hela hjärnan arbetar · varje del har ett jobb · 2 procent av vikten, 20 procent av syret
      - rubrik: "2 Hjärnans nattskift: Tidslinjen"
        falt:
          - rubrik: Frågan
            text: Sover du lika djupt hela natten, och vad händer i hjärnan medan du sover?
          - rubrik: Ord före
            text: djup (svår att väcka, inte bättre) · cykel (en runda som börjar om) · hjärnvåg (en kurva ur mätningen, inget hav)
          - rubrik: Tänk högt om
            text: "ytlig: ”Ytlig, som vattenytan? Jag läser vidare. Här betyder det att jag vaknar lätt, och djup blir motsatsen: svår att väcka. Vem eller vad? Insomningen. Det viktigaste? Den är kort, och sömnen är ytlig.” (avsnitt 1)"
          - rubrik: Det brukar skava
            text: "”något oväntat”: du sover, men på mätningen liknar hjärnan en vaken hjärna (avsnitt 4)"
          - rubrik: Modellen
            text: "insomningen: ”först” · bassömnen: ”sedan” · djupsömnen: ”efter det” · drömsömnen: ”till sist”. Fördjupningens kärna om städningen hos möss står bredvid tidslinjen, för den är inget steg i natten."
          - rubrik: Lyssna efter
            text: "nej, natten går i cykler · djupast i djupsömnen, mest tidigt · drömsömnen: hjärnan aktiv som vaken"
      - rubrik: "3 Två slags minne: Venndiagrammet"
        falt:
          - rubrik: Frågan
            text: Varför kan ett namn försvinna på några sekunder medan en låt sitter kvar i flera år, och vad har de två minnena gemensamt?
          - rubrik: Ord före
            text: minne (nätverk av nervceller, ingen hårddisk) · arbetsminne (inget minne av ett arbete) · hippocampus (behövs för nya minnen av händelser)
          - rubrik: Det brukar skava
            text: "”Själva minnet”: minnet finns i nätverket i hjärnbarken, och hippocampus behövs när det bildas (avsnitt 3)"
          - rubrik: Modellen
            text: "båda: ”båda” · arbetsminnet: ”av de två” · långtidsminnet: ”till skillnad från”. Arbetsminnets och långtidsminnets ringar får två ark var: ett om hur mycket och hur länge, och ett om hur de glömmer. Fördjupningens kärna, H.M., hör till långtidsminnet, för hans arbetsminne fungerade."
          - rubrik: Lyssna efter
            text: "arbetsminnet: få saker, ofta sekunder · långtidsminnet: det som upprepas · båda: nätverk av nervceller"
      - rubrik: "4 Natten bygger minnet: Kedjan"
        falt:
          - rubrik: Frågan
            text: Lönar det sig att plugga hela natten före ett prov, och vad gör sömnen med det du har lärt dig?
          - rubrik: Ord före
            text: minne (nätverk av nervceller, ingen hårddisk) · hjärnbarken (hjärnans yttre lager, ingen trädbark) · djupsömn (svår att väcka, inte bättre sömn)
          - rubrik: Det brukar skava
            text: "”i samma ordning”: nervcellerna arbetar på natten i samma ordning som när råttan lärde sig (avsnitt 2)"
          - rubrik: Modellen
            text: "natten: ”eftersom” · hållbart: ”det gör att” · minns mer: ”därför”. Kedjan börjar med ”först”: det nya är bräckligt. Fördjupningens kärna, försöket med för lite sömn, står bredvid kedjan med ett streck till led 4, för den visar vad som händer utan sömn."
          - rubrik: Lyssna efter
            text: först bräckligt · troligen hållbart i djupsömnen · utan sömn sämre
      - rubrik: "5 Klockan i tonåren: Problem och lösning"
        falt:
          - rubrik: Frågan
            text: Är tonåringar trötta på morgonen för att de är lata, och vad händer när skolan börjar senare?
          - rubrik: Ord före
            text: klocka (kroppens inre klocka, ingen väckarklocka) · hormon (ett ämne i kroppen, inga känslor) · eleven i mitten (mitt i raden, inget genomsnitt)
          - rubrik: Det brukar skava
            text: "”inte märkbart senare”: eleverna somnade ungefär som förut, men vaknade senare (avsnitt 4)"
          - rubrik: Modellen
            text: "för lite sömn: ”problemet är” · inre klockan: ”beror delvis på” · senare start: ”en lösning är” · mer sömn: ”resultatet var”. Fördjupningens kärna hör till resultatet och säger hur säkert det är: Seattle visar vad som hände, men inte säkert varför."
          - rubrik: Lyssna efter
            text: den inre klockan · melatoninet senare · mer sömn i Seattle
  - rubrik: "Lärarens sida: Avancerat, text 6, Hjärnans karta"
    text:
      - Hjärnan har tre delar med var sitt jobb, och i alla tre arbetar nervceller, så hjärnan gör av med omkring 20 procent av syret, fast den väger 2 procent av kroppen. Texten är en beskrivning, och modellen är Tankekartan, blad 2. I vecka 1 tänker du högt i avsnitt 1.
    delar:
      - rubrik: "Läspasset: de fyra avsnitten"
        falt:
          - rubrik: Textens fråga
            text: Använder vi bara tio procent av hjärnan, och vad gör hjärnans olika delar?
          - rubrik: Ord före läsningen
            text: bark (hjärnans yttre lager, inte trädets) · nervcell (en levande cell, inget rum) · signal (ett meddelande mellan celler, ingen mobilsignal)
          - rubrik: Tänk högt
            kursiv: true
            text: ”Hjärnbarken. Bark, som på ett träd? Jag läser vidare. Det yttre lagret, ytterst på storhjärnan. Vem eller vad? Storhjärnan och barken. Det viktigaste? Barken tar emot intryck från sinnena och styr rörelser. Att pannlobens främre del mognar sent är spännande, men det är en detalj.”
          - rubrik: 1 Storhjärnan och barken
            text: |-
              Red ut: ”med viljan”: rörelser du själv väljer · mognar: blir färdig
              Lyssna efter: storhjärnan med barken · fyra lober · syn, hörsel, känsel, rörelser
              Lockar: främre pannloben mognar sent. ”Vad tar barkens fyra lober emot, och vad styr pannloben?”
              Bilden: Siffran 1: de fyra loberna, uppkallade efter huvudets delar
          - rubrik: 2 Lillhjärnan
            text: |-
              Red ut: ”där bakhuvudet möter nacken”: längst bak, nertill · jämn: utan ryck
              Lyssna efter: balansen · jämna rörelser
              Lockar: sparken mot bollen. ”Vilka två saker är lillhjärnan viktig för?”
              Sambandet: ”också en mindre del”: en del till, utöver storhjärnan
              Bilden: Siffran 2: lillhjärnan längst bak, under storhjärnan
          - rubrik: 3 Hjärnstammen
            text: |-
              Red ut: ”som en stam”: bara en bild för namnet · ”går den över i”: fortsätter som
              Lyssna efter: andning och hjärtslag · vägen till ryggmärgen
              Lockar: något vasst under foten. ”Vad styr hjärnstammen, och vart leder den?”
              Sambandet: ”Kvar blir”: den sista av de tre platserna
              Bilden: Siffran 3: hjärnstammen, som går över i ryggmärgen
          - rubrik: 4 Ett nät av nervceller
            text: |-
              Red ut: utskott: en del som sticker ut · ”gör av med”: förbrukar
              Lyssna efter: 2 procent av vikten · 20 procent av syret · nervceller i alla delar
              Lockar: synapsen där signalen går över. ”Varför tar hjärnan så mycket syre, fast den väger lite?”
              Sambandet: ”i alla tre”: det som arbetar på alla platserna
              Bilden: Signalen genom nervcellen och vidare till nästa
          - rubrik: Om någon frågar
            text: Finns det höger- och vänsterhjärnade människor? Nej. I en studie av hjärnorna hos 1 011 personer dominerade ingen halva. Halvorna samarbetar. Tror vuxna på tio procent? Ja, nästan hälften av de brittiska lärarna i en studie gjorde det. Har kvinnor lika många nervceller? Räkningen 2009 gällde män, så det säger den inte.
      - rubrik: "Modellpasset: Tankekartan för Hjärnans karta"
        falt:
          - rubrik: Fördjupningen
            text: |-
              Red ut: ”i genomsnitt”: talens summa delad med fyra · kärna: en liten del inne i cellen
              Lyssna efter: 100 miljarder utan källa · hjärnan löstes upp · 86 miljarder
              Lockar: hjärnan som soppa. ”Hur räknade forskarna nervcellerna, och vad blev svaret?”
              Sambandet: ”hur många nervceller nätet har”: nätet i avsnitt 4, räknat
              Bilden: Kärnan i nervcellen: det forskarna räknade
          - rubrik: Modellen
            text: Ta fram Tankekartan, blad 2. I vecka 1 lägger du den första post-it-lappen och skriver det första ordet. Nederst i varje fält har bladet rader med ledtexten Hit hör. Där skriver paren det som hör till delen. Gruppen lägger fördjupningens lapp på En lapp till, som får namnet Hör till nervcellerna. Lappen gäller nervcellerna i avsnitt 4 och är ingen femte del av hjärnan.
          - rubrik: Orden
            text: den största delen (storhjärnan) · också (lillhjärnan) · kvar blir (hjärnstammen) · i alla tre (nervcellerna)
          - rubrik: Svaret
            text: |-
              Lyssna efter: nej, hela hjärnan arbetar · varje del har ett jobb · 2 procent av vikten, 20 procent av syret
              Så kan det låta: ”Nej. Varje del har ett jobb: barken tar emot det vi ser, hör och känner, lillhjärnan sköter balansen och hjärnstammen andningen. Hjärnan väger 2 procent men tar 20 procent av syret, för alla delar arbetar.”
          - rubrik: Rutan
            text: "Visste du att: intressant, för svaret håller utan lillhjärnans många nervceller."
          - rubrik: Samtala
            text: "Varför berättar författaren hur forskarna fick veta det? Varför börjar texten vid bakhuvudet? Ett svar: talet blir lättare att lita på, och handen gör kartan till något du känner."
  - rubrik: "Avancerat, text 6: Hjärnans karta"
    tema: Hjärnan
    text:
      - Hjärnan · text 1 av 5
    delar:
      - rubrik: Till läraren
        falt:
          - rubrik: Hör till
            text: Lärarens sida till texten.
    listor:
      - rubrik: Hjärnans karta
        rader:
          - - Lägg handen på bakhuvudet. Precis innanför handen tar hjärnan emot det som dina ögon ser. Andra delar av hjärnan håller dig i balans eller sköter andningen. Ändå har många hört att det mesta av hjärnan står oanvänt. Använder vi bara tio procent av hjärnan, och vad gör hjärnans olika delar?
      - rubrik: Siffran
        rader:
          - - 86 miljarder
            - nervceller hade hjärnan hos vuxna män i genomsnitt, enligt en räkning från 2009.
      - rubrik: "Bild: Hjärnan från sidan"
        rader:
          - - Hjärnan från sidan. Loberna har namn efter platsen på huvudet. Siffrorna är avsnittens nummer.
      - rubrik: Storhjärnan och barken
        rader:
          - - Den största delen av hjärnan är storhjärnan. Den tar emot det du ser, hör och känner, och den styr dina rörelser. Storhjärnan är delad i en vänster och en höger halva, som hänger ihop på mitten. Halvorna samarbetar mycket, men de har delvis olika uppgifter.
          - - "Ytterst på storhjärnan sitter **hjärnbarken**. Namnet passar, för precis som barken på ett träd är den det yttre lagret. Barken på varje halva delas in i fyra stora områden som kallas lober, och de har fått namn efter var de sitter: vid pannan, hjässan, tinningen och nacken. I pannloben styrs de rörelser som du gör med viljan. Hjässloben tar emot känsel och smak, tinningloben hörsel och lukt, och nackloben synen."
          - - Den främre delen av pannloben, precis bakom pannan, är en av de sista delarna av hjärnan som mognar. Den mognar alltså fortfarande i tonåren, och hela hjärnan är färdigutvecklad först i mitten eller slutet av 20-årsåldern.
      - rubrik: Ord i texten
        rader:
          - - hjärnbarken
            - det yttre lagret av storhjärnan
      - rubrik: Lillhjärnan
        rader:
          - - "Under storhjärnans bakre del, där bakhuvudet möter nacken, finns också en mindre del. Den heter lillhjärnan, och namnet passar, för bredvid storhjärnan är den liten. Ändå har lillhjärnan ett stort jobb: balansen och rörelserna."
          - - Tänk på vad som händer när du sparkar på en boll. Sparken börjar i pannloben, där hjärnan styr de rörelser du gör med viljan. Lillhjärnan hjälper till så att rörelsen blir jämn och foten träffar rätt. Samtidigt måste du stå kvar på det andra benet utan att ramla, och för balansen är lillhjärnan också viktig. Samma sak gäller när du cyklar, dansar eller går i en trappa.
          - - Hur viktig lillhjärnan är märks när den inte fungerar. Den som har fått en skada i lillhjärnan kan få svårt att hålla balansen och att gå, och rörelserna kan bli ryckiga.
      - rubrik: Hjärnstammen
        rader:
          - - Kvar blir hjärnstammen, den del av hjärnan som sitter längst ner, under storhjärnan och framför lillhjärnan. Hjärnstammen styr andningen och hur fort hjärtat slår. Du andas och hjärtat slår medan du läser, springer och sover, och hjärnstammen styr båda också när du tänker på något annat.
          - - Namnet passar här också, för hjärnstammen sitter som en stam under storhjärnan, och nedåt går den över i **ryggmärgen**. Genom hjärnstammen och ryggmärgen går signaler mellan hjärnan och resten av kroppen. En signal är i biologin ett meddelande från en cell till en annan.
          - - När du tar ett steg går en signal från pannloben ner genom hjärnstammen och ryggmärgen till musklerna i benet. Trampar du på något vasst går en signal åt andra hållet, från foten upp till hjärnan, och först då känner du att det gör ont.
      - rubrik: Ord i texten
        rader:
          - - ryggmärgen
            - nervsträngen inne i ryggraden
      - rubrik: Ett nät av nervceller
        rader:
          - - Storhjärnan, lillhjärnan och hjärnstammen är tre platser i hjärnan, men i alla tre arbetar samma slags celler, **nervceller**. En nervcell har korta utskott som tar emot signaler och ett långt utskott som skickar dem vidare. Där en nervcell möter nästa cell finns en **synaps**, och där går signalen över. Så hänger nervcellerna ihop i ett nät genom hela hjärnan.
          - - Det sägs ofta att vi bara använder tio procent av hjärnan. Det stämmer inte. Hjärnan väger omkring 2 procent av kroppen och gör ändå av med omkring 20 procent av kroppens syre. Så mycket syre skulle inte behövas om det mesta av hjärnan stod stilla. Nervcellerna gör av med största delen av hjärnans syre när de arbetar, och de gör av med nästan lika mycket när du vilar som när du tänker hårt. Varje del på hjärnans karta har dessutom ett jobb. Vi använder alltså hela hjärnan, både när vi är vakna och när vi sover.
      - rubrik: Ord i texten
        rader:
          - - nervcell
            - en cell som tar emot och skickar signaler
          - - synaps
            - platsen där en nervcell möter en annan cell
      - rubrik: "Bild: En nervcell"
        rader:
          - - En nervcell. Signalen kommer in genom de korta utskotten och går ut genom det långa till nästa cell.
      - rubrik: "Fakta: Hjärnan och syret"
        rader:
          - - Hjärnans vikt
            - knappt 1,5 kilo hos en vuxen
          - - Andel av kroppens vikt
            - omkring 2 procent
          - - Andel av kroppens syre
            - omkring 20 procent
          - - Syret när du vilar
            - nästan lika mycket som när du tänker hårt
      - rubrik: "Fördjupning: Hjärnsoppan"
        rader:
          - - Länge gick det inte att säga hur många nervceller nätet har. I många böcker stod det 100 miljarder, men ingen kunde säga var talet kom ifrån. Ingen hade räknat alla nervcellerna i en hel hjärna, och att räkna miljarder små celler en och en går inte.
          - - År 2005 visade två forskare, Herculano-Houzel och Lent, ett annat sätt. De prövade det på hjärnor från råttor och löste upp hjärnvävnaden i en vätska tills den blev en jämn soppa. Cellerna gick sönder, men cellernas kärnor fanns kvar och flöt runt i soppan. Forskarna färgade kärnorna, så att de kunde se vilka som kom från nervceller, och räknade dem i små prover av soppan. Sedan räknade de ut hur många kärnor hela soppan hade. Svaret kom på ett dygn.
          - - År 2009 räknade en grupp forskare nervcellerna i fyra hjärnor från vuxna män på samma sätt. Hjärnorna hade inte exakt lika många, men i genomsnitt hade de 86 miljarder nervceller, omkring 14 miljarder färre än i böckerna. Räkningen gällde vuxna män, så en annan hjärna kan ha något fler eller färre. Talet 86 miljarder är alltså räknat, och det ersatte ett tal som ingen hade räknat.
      - rubrik: Visste du att …
        rader:
          - - Fyra av fem
            - nervceller i hjärnan sitter i lillhjärnan, fast den bara väger omkring en tiondel av hjärnan. Vilken del hade du gissat på?
      - rubrik: Läs mer
        rader:
          - - 1177 visar hjärnans delar och vad loberna, lillhjärnan och hjärnstammen gör.
            - https://www.1177.se/liv--halsa/sa-fungerar-kroppen/sa-fungerar-hjarnan/
          - - 1177 förklarar hur nervcellerna skickar signaler mellan hjärnan och kroppen.
            - https://www.1177.se/liv--halsa/sa-fungerar-kroppen/hjarna-ryggmarg-och-nerver/
          - - Hjärnfonden går igenom vanliga myter om hjärnan, också den om tio procent.
            - https://www.hjarnfonden.se/om-hjarnan/anatomi-och-fakta/neuromyter/
  - rubrik: "Modellen: Avancerat, text 6, Hjärnans karta"
    tema: Hjärnan
    text:
