niva: Bas
nr: 20
titel: Himlen
innehallstagg: Samband och förändring
kalla: Idén kommer ur nrich, Mixing Lemonade.
problem:
  text:
    - Ella, Malte och Nora målar en himmel. De blandar färgen i var sin burk och mäter med samma sked.
    - Ella tar 1 sked blått och 3 skedar vitt. Malte tar 2 skedar blått och 5 skedar vitt. Nora tar 3 skedar blått och 9 skedar vitt.
  fragor:
    - Vems färg blir mörkast?
    - Blir Noras färg ljusare eller mörkare än Ellas, eller blir de lika mörka?
  bild: En burk blå färg och en burk vit färg, en sked och tre tomma burkar med namnen Ella, Malte och Nora.
losningsforslag:
  svaret: Maltes färg blir mörkast, och Noras blir lika mörk som Ellas.
  kontroll: "Vitt per blått: Ella 3, Nora 9 / 3 = 3 och Malte 5 / 2 = 2,5."
  iden: Hur mörk färgen blir beror på hur många skedar vitt det är för varje sked blått.
  a:
    namn: göra lika mycket blått
    text: Eleven tar Ellas blandning två och tre gånger för att få lika mycket blått.
    bild: Lösning A, göra lika mycket blått. Skedarna ritade som ringar, blå och vita. Ellas blandning två gånger är 2 skedar blått och 6 skedar vitt, och Malte har 2 skedar blått och 5 skedar vitt, så hans färg har 1 sked vitt mindre och blir mörkare. Ellas blandning tre gånger är 3 skedar blått och 9 skedar vitt, precis som Noras, så de blir lika mörka. Maltes färg blir mörkast.
  b:
    namn: dela vitt med blått
    text: Eleven delar antalet skedar vitt med antalet skedar blått och får skedar vitt för varje sked blått.
    bild: "Lösning B, dela vitt med blått. Skedar vitt för varje sked blått: Ella 3 / 1 = 3, Malte 5 / 2 = 2,5 och Nora 9 / 3 = 3. Bredvid står en sked blått och tre skedar vitt hos Ella och Nora, och två och en halv hos Malte. Minst vitt för varje sked blått ger Maltes färg mörkast, och Ellas och Noras färger blir lika mörka. Kontroll: 2 · 2,5 = 5 och 3 · 3 = 9."
  c:
    rader:
      - Ella 3 − 1 = 2 mer vitt
      - Malte 5 − 2 = 3, Nora 9 − 3 = 6
      - "Svar: Ella mörkast, Nora ljusast"
    om: Eleven räknar hur många fler skedar vitt än blått det är, men färgen beror på vitt per blått.
    fraga: Vad säger elevens sätt om Ella gör sin blandning två gånger?
  fragor:
    - Varför tar eleven i lösning A Ellas blandning två gånger?
    - Varför delar eleven i lösning B 5 med 2?
    - Var syns det i båda lösningarna hur många skedar vitt det är för varje sked blått?
    - Vilken lösning liknar er egen? Vilken skulle ni välja med 4 skedar blått och 11 skedar vitt, och varför?
