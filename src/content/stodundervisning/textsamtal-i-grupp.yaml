        vad: "Läs lyssningsbladet och frågetecknen i pass 3. Gissar eleverna utan ledtråd, visar du Det står. Letar de bara efter ord, visar du Jag vet. Läser de förbi stoppet, visar du Stanna."
      - nar: "Efter sex till åtta veckor"
        vad: "Kartläggningens text efter. Får eleven två poäng utan h på fråga 2 och 3, och står ledtråden utan h på lyssningsbladet, är hen klar. Har hen fler poäng än före, går hen en period till. Annars tar du upp det med elevhälsan."
film:
  sekunder: 29.94
  beskrivning: "I pass 1 stannar läraren vid stoppet. Läraren säger: ”Vänta, här står inte vem som tog bullarna.” Läraren stryker under två ledtrådar. Läraren säger: ”Det står mormors stol, och hans händer är rena. Jag vet att den som äter bullar får kladdiga fingrar, och att man sätter sig där man äter. Alltså tror jag att det inte var lillebror.” Läraren läser vidare. Eleven säger: ”Jag tror att det var mormor! Hon torkar munnen.”"
  rubrik: "Så tänker du högt vid stoppet"
  ingress: "Fyra bilder ur filmen om pass 1: du stannar, stryker under ledtrådarna, säger vad du vet och drar slutsatsen att det inte var lillebror, och sedan säger en elev vad hen tror, med en ledtråd till. Filmen på metodens sida visar samma sak i rörelse. De blå bubblorna är lärarens och den gula elevens."
  stillbilder:
    - text: "Det står inte vem som tog bullarna, så läraren stannar."
    - text: "Läraren stryker under två ledtrådar och slår ihop dem."
    - text: "Läraren drar slutsatsen att det inte var lillebror."
    - text: "Läraren bjuder in, och en elev säger vad hen tror."
filmer:
  - nr: 2
    titel: "Veckans cykel: från det du hör till det du visar"
    sekunder: 23.84
    beskrivning: "Efter pass 3 läser du lyssningsbladet. Två elever gissade utan ledtråd. Steget som saknades var Det står. Du väljer tankesteget i Veckans cykel. I nästa veckas pass 1 visar du Det står extra noga. Du säger: ”Det står sågspån, och det står en blå fläck.” Du läser vidare, och Aron pekar själv på en ledtråd. Aron säger: ”Där står det ju!”"
    rubrik: "Veckans cykel: från det du hör till det du visar"
    ingress: "Fyra bilder ur filmen om det du gör efter pass 3: lyssningsbladet visar att två elever gissade utan ledtråd, och i nästa veckas pass 1 visar du därför Det står extra noga. Filmen på metodens sida visar samma sak i rörelse."
    efter: "tabell: Från det du hör till det du visar"
    stillbilder:
      - text: "Efter pass 3 läser du vad eleverna sa på bladet."
      - text: "Två svarade utan ledtråd, så du visar Det står."
      - text: "I nästa pass 1 visar läraren Det står extra noga."
      - text: "Aron hittar själv en ledtråd till."
  - nr: 3
    titel: "Pass 2: samtalet vid stoppet"
    sekunder: 29.81
    beskrivning: "I pass 2 får eleverna tanketid vid stoppet. A säger: ”Jag tror att hon vill hem.” B frågar: ”Hur vet du det?” A säger: ”Hon frågar hur många nätter.” I gruppen ger eleverna olika svar. En kamrat säger: ”Jag tror att den luktar hemma. Jag hade mammas tröja.” En annan säger: ”Jag tänker annorlunda. Jag tror att den är pappas.” En tredje säger: ”Tänk om hon smyger hem? Hon packar tyst.” Läraren säger: ”Spännande! Den håller.” Den tredje säger: ”Hon ställer ner ryggsäcken. Hon stannar nog.”"
    rubrik: "Pass 2: samtalet vid stoppet"
    ingress: "Fyra bilder ur filmen om pass 2, med texten Rum 4. Efter tio sekunders tyst tanketid säger eleven ”Jag tror att” och visar ledtråden när kamraten frågar ”Hur vet du det?” I gruppen tar en kamrat med det hen har varit med om, en annan tänker annorlunda, och en ny idé håller tills texten säger något nytt. Bubblorna i bilderna är elevernas, och de grå staplarna är text som inte visas."
    efter: "tabell: Parsamtalet vid stoppet"
    stillbilder:
      - text: "Eleven säger ”Jag tror att” och sedan sin ledtråd."
      - text: "En kamrat tar med det hen har varit med om."
      - text: "En annan tänker annorlunda med ledtråden ”stor”."
      - text: "Idén ”smyga hem” höll tills texten sa något nytt."
