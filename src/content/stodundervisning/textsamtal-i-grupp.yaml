# Metod i stödundervisning. Modellen står i src/content.config.ts och mallen i _mall.yaml.
# Källan är Niclas kapitel Inferensläsning med Mellan raderna i kompendiet Insatser åk 4–6 (Kungsholmen), med hans
# ändringar 2026-09-30, och samtalen ur hans och Jennie Wilsons bok LÄS! Nycklar till en god läsundervisning
# (Studentlitteratur 2025; i manuset kapitel 5, Läs tillsammans, och kapitel 6, Forma en läsande gemenskap). Metoden hette
# Mellan raderna till omtaget 2026-09-30, då samtalet blev dess kärna och Niclas gav den namnet Textsamtal i grupp
# (intake/textsamtal-i-grupp.md). Texterna är riggens egna (methods/textsamtal-i-grupp/texter/) och förs in med
# node build/texter.mjs textsamtal-i-grupp --yaml, mellan markörerna för texterna i ramarna.
titel: Textsamtal i grupp
undertitel: Lärarledd insats i liten grupp där eleverna samtalar om korta texter och lär sig läsa mellan raderna, för åk 2–9
ingress: Eleverna lär sig läsa mellan raderna genom att samtala om korta texter. De säger vad de tror och visar sin ledtråd, bygger vidare på varandras tankar och prövar nya idéer mot texten. De har varit med om olika saker och får därför svara olika. Metoden har tre nivåer, och på varje nivå finns femton texter med frågor.
omrade: Läsning
arskurs:
  - F-3
  - 4-6
  - 7-9
arskursText: åk 2–9
taggar:
  - lasforstaelse
  - textsamtal
  - sarskilt-stod
format:
  - liten grupp
tid: 30 minuter per pass, tre pass i veckan
period: Sex till åtta veckor
grupp: Två till åtta elever
material:
  - texter med frågor
  - korten vid bordet
  - ledtrådsbladet
  - lyssningsbladet
  - kartläggningen
uppdaterad: 2026-10-01
relaterade:
  - boksamtal-i-grupp
  - faktatextsamtal-i-grupp
  - upprepad-lasning
  - laslistor-i-grupp
utkast: false
inledning:
  - Textsamtal i grupp lär eleverna att läsa mellan raderna genom att samtala om texter. När människor samtalar blir tänkandet synligt. När en elev säger ”Jag tror att hon vill att de ska stanna, för det står att hon vinkade lite till”, hör de andra hur en läsare tänker, och de kan pröva tanken, bygga vidare på den eller vända den åt ett nytt håll. Eleverna tänker högt, prövar idéer också utanför frågorna och tänker i nya riktningar.
  - Det som samtalet handlar om står ofta inte utskrivet, som hur någon känner sig, varför hen gör som hen gör, var de är eller vad någon egentligen menar. Den som läser mellan raderna märker att något inte står, letar ledtrådar i texten och lägger till det hen redan vet. Det kallas att göra en inferens, och det är det metoden tränar.
  - Det finns inga rätta eller fel tankar. Ni prövar varje tanke mot texten, och ibland ändrar eleven sin tanke när nästa mening visar något nytt. Eleverna har varit med om olika saker och ser därför olika saker i en text. Den som har sovit borta en vecka känner igen hemlängtan, och den som har en katt vet var katter kan gömma sig. Två svar kan skilja sig och ändå båda stämma med texten, och det är okej. Du ställer frågor som du inte själv har svaret på, och du berömmer en ny idé som håller mot texten.
  - Du gör tre saker. Du tänker högt när du läser, så att eleverna hör ditt inre samtal. Du leder samtalet och lämnar över tänkandet till gruppen under veckan. Och du lyssnar på vad eleverna säger, så att du kan börja nästa vecka i det de behöver.
  - Varje vecka är en cykel med tre pass och en ny text i varje pass. I pass 1 läser du högt, stannar och tänker högt, och eleverna tänker med och säger sin tanke till en kamrat. I pass 2 tänker ni tillsammans. Vid stoppet samtalar eleverna i par, och sedan samtalar hela gruppen. I pass 3 läser eleverna själva eller i par och samtalar om frågorna medan du frågar ”Hur vet du det?” och lyssnar. Det du hör i pass 3 avgör vad du visar i nästa veckas pass 1, och så gör ni sex till åtta cykler.
  - Metoden har tre nivåer, Lättläst, Mellan och Avancerad, och på varje nivå femton texter med frågor och två texter för kartläggningen före och efter. Välj nivå efter gruppen, och blanda gärna nivåerna. Texterna räcker till ungefär fem veckors pass. Sedan tar du texter ur serien Mellan raderna eller skriver egna, som det står i avsnittet om var du hittar texterna.
upplagg:
  rubrik: Så fungerar insatsen
  text: Insatsen görs tre gånger i veckan under sex till åtta veckor, med två till åtta elever i gruppen. Varje pass är cirka 30 minuter och har en ny text, och alla i gruppen läser samma text. Veckans tre pass hänger ihop. I pass 1 visar du, i pass 2 samtalar ni, först i par och sedan i gruppen, och i pass 3 tänker eleverna mer själva. Stoppet är stället i texten där du stannar och tänker högt i pass 1 och där paren samtalar i pass 2, och det står under Lärarens sidor. Där står också två öppna frågor till varje text, frågor som du inte har svaret på. Vid bordet har eleverna tankekortet med tankestegen, samtalskortet med det man säger och frågar i samtalet och kortet med gruppens samtalsregler. Ledtrådsbladet har tre rutor, Det står, Jag vet och Alltså tror jag. Efter pass 3 läser du lyssningsbladet och elevernas ledtrådsblad och bestämmer vad du visar nästa vecka. Före första passet och efter det sista gör varje elev kartläggningen enskilt med dig, utanför passen, och sedan jämför du före med efter.
gruppen:
  rubrik: Så sätter du ihop gruppen
  text: Textsamtal i grupp är för elever som avkodar hyfsat men behöver stöd i att förstå det de läser, eller som läser vidare utan att tänka efter. Alla i gruppen läser samma text, på den nivå som passar gruppen, Lättläst, Mellan eller Avancerad. Välj efter hur eleverna läser och inte efter årskurs, och blanda gärna, till exempel en text på Lättläst när ni övar ett nytt tankesteg. En elev som ännu avkodar mödosamt behöver också träna avkodningen, till exempel i Upprepad läsning eller Läslistor i grupp. I Textsamtal i grupp läser du texten högt i pass 1 och 2, så att avkodningen inte står i vägen för tänkandet och samtalet. Vid stoppet och i Starten tänker eleverna i par innan hela gruppen samtalar. Är ni fler än fyra samtalar paren först om mellan raderna-frågorna, så att alla hinner säga sin tanke. Bestäm paren innan passet. Sätt inte de två som pratar mest i samma par, ge den tysta eleven en tålmodig kamrat och den som håller på att lära sig svenska gärna någon som har samma modersmål. Blir en elev över blir det en trio. Paren håller en vecka, och nästa vecka byter du. I pass 3 lyssnar du på hälften av paren och den andra hälften nästa vecka, och du läser allas ledtrådsblad. Ingen pratar en tredje gång förrän alla har pratat en gång. En elev som avkodar mödosamt läser i par i pass 3.
tabeller:
  - rubrik: "Veckans tre pass: vem som tänker"
    plats: efter-inledning
    text: Veckorna har samma rytm, med en ny text i varje pass. Det som ändras är vem som tänker och hur mycket eleverna samtalar med varandra.
    kolumner:
      - Pass
      - Vem tänker
      - Så läser ni
      - Du
      - Eleverna
    rader:
      - - Pass 1
        - Jag tänker högt, ni tänker med
        - Du läser högt och stannar vid stoppet
        - "Tänker högt och visar veckans tankesteg noga, också det du undrar. Fyller i ledtrådsbladet på tavlan och bjuder in: ”Så tänkte jag. Vem tänker annorlunda? Säg det till din kamrat.”"
        - Följer med, stryker under med dig och säger till sin kamrat om de tänker likadant eller annorlunda
      - - Pass 2
        - Vi tänker tillsammans
        - Du läser högt och stannar vid stoppet
        - Ger tanketid, låter paren samtala vid stoppet och leder sedan gruppens samtal med följdfrågor som ”Hur vet du det?” och ”Vem tänker annorlunda?”
        - Säger ”Jag tror att” och sin ledtråd till kamraten, bygger vidare på varandra och fyller i ledtrådsbladet i par
      - - Pass 3
        - Ni tänker, jag frågar och ger respons
        - Ni läser ledtrådsbladets fråga, och sedan läser eleverna själva eller i par
        - Frågar, lyssnar, ger respons på hur eleverna tänkte och skriver på lyssningsbladet
        - Sätter frågetecken där något inte står, stryker under, fyller i ledtrådsbladet och samtalar om frågorna
    not: Efter pass 3 bestämmer du vad du visar i nästa veckas pass 1, med tabellen Från det du hör till det du visar.
  - rubrik: "Samtalet: tänkandet mellan er"
    plats: efter-inledning
    meny: true
    text: Samtalet är metodens kärna. Där säger eleverna vad de tror, prövar det mot texten och bygger vidare på varandra, och tänkandet blir synligt för alla. Raderna i tabellen är samtalsdragen, och eleverna har dragens fraser på samtalskortet. Du visar ett drag i veckan. Ordningen står i tabellen Progression över insatsperioden, och stegen står i tabellen Så lär du gruppen att samtala. Exemplen kommer ur texten Rum 4, där Hiba sitter uppe mitt i natten med ryggsäcken i knät.
    kolumner:
      - I samtalet
      - Så låter det
      - Det gör att
    rader:
      - - Säga det jag tror
        - ”Jag tror att Hiba vill åka hem, för det står att hon frågar hur många nätter det är kvar.”
        - en ofärdig tanke går att säga, och alla ser ledtråden
      - - Fråga en kamrat
        - ”Vad tror du? Hur vet du det?”
        - alla kommer till tals, och ingen behöver vänta på dig
      - - Ta med det jag har varit med om
        - ”När jag var på läger sov jag med mammas tröja. Jag tror att tröjan luktar hemma, för hon trycker ner den i ryggsäcken.”
        - olika erfarenheter ger olika svar, och alla får pröva sina mot texten
      - - Bygga vidare
        - ”Jag håller med, och så packar hon mitt i natten.”
        - två tankar blir en ny
      - - Tänka annorlunda
        - ”Jag tänker annorlunda. Jag tror att tröjan är hennes pappas, för den är mycket större än hennes kläder.”
        - gruppen kan pröva fler än ett svar
      - - Pröva en ny riktning
        - ”Tänk om hon tänker smyga hem?”
        - ni går utanför frågorna och hittar det som ingen hade tänkt på
      - - Pröva mot texten
        - ”Stämmer det? Sist ställer hon ryggsäcken på golvet.”
        - eleven prövar tanken och får ändra den
    not: Det finns inga rätta eller fel tankar i samtalet. En tanke håller när den har en ledtråd i texten och inget i texten säger emot den. Säger texten emot, läser ni stället igen tillsammans, och eleven får ändra sig. En ny idé som håller mot texten är det bästa ett samtal kan ge.
  - rubrik: "Tankestegen: ditt inre samtal"
    plats: efter-inledning
    text: "Tankestegen är det inre samtalet, som du gör hörbart när du tänker högt. Eleverna har samma steg på tankekortet och tar över dem under veckan, och i samtalet blir stegen en mening: ”Jag tror att han har varit där någon målar, för det står en blå fläck.” Visa också när du tvekar eller undrar, och sluta ibland med frågan ”Så tänkte jag. Vem tänker annorlunda?” Du visar alla sex, och på nivån Lättläst börjar eleverna med Det står, Jag vet och Alltså tror jag. Exemplen kommer ur texten Skrapet på dörren, där katten Pricken kommer hem efter tre dagar."
    kolumner:
      - Tankesteget
      - Så låter det
      - Det hjälper eleven att
    rader:
      - - Stanna
        - ”Vänta, här står inte var Pricken har varit.”
        - märka när något saknas, när något upprepas, när någon säger en sak och gör en annan, när något är konstigt eller när någon ändrar sig
      - - Se det framför dig
        - ”Jag ser framför mig hur Elias kliar katten bakom örat.”
        - bygga en bild av scenen, med det man ser, hör och känner
      - - Det står
        - ”Det står sågspån, och det står en blå fläck som fortfarande var klibbig.”
        - peka på ledtrådarna och slå ihop två
      - - Jag vet
        - ”Jag vet att det finns sågspån där man bygger, och att färg tar tid att torka.”
        - använda det man redan vet om livet
      - - Alltså tror jag
        - ”Alltså tror jag att han har varit där någon bygger och målar.”
        - dra en slutsats ur ledtrådarna och det man vet
      - - Stämmer det?
        - ”Stämmer det? Jag läser vidare. Han luktar som en målarburk. Ja.”
        - pröva slutsatsen mot resten av texten och tänka om
    not: Tankestegen är ett sätt att säga hur man tänker om en text, och inget att bocka av. Samtalet handlar om människorna i texten.
  - rubrik: "Frågorna: på, mellan och bortom raderna"
    plats: efter-inledning
    text: "Frågorna till varje text kommer i den här ordningen och står numrerade på bladet, utan gruppernas namn. I vecka 1 förklarar du de tre grupperna. I pass 1 säger du före frågorna om svaret står i texten, om ni listar ut det eller om ni tänker utanför texten. I pass 2 och 3 frågar du eleverna vid den första frågan: ”Står svaret i texten, eller listar vi ut det?” Efter varje mellan raderna-fråga står följdfrågan ”Hur vet du det?” eller ”Vad i texten får dig att tro det?” Sist ställer du alltid minst en av textens två öppna frågor, som står på sidan för texten under Lärarens sidor, och frågar efter ledtråden också där."
    kolumner:
      - Gruppen
      - Var svaret finns
      - Så kan frågan låta
    rader:
      - - På raderna
        - I texten, på ett ställe och med nästan samma ord
        - Vad ligger kvar på plåten?
      - - Mellan raderna
        - Inte i texten. Eleven listar ut det ur ledtrådarna och det hen vet, och visar ledtråden
        - Vem tror du tog bullarna? Hur vet du det?
      - - Bortom raderna
        - "Utanför texten, med texten som grund: vad texten vill säga, vad eleven tycker om ett val eller vad hen hade gjort"
        - Amina står vid staketet. Vad hade du gjort i hennes ställe? Varför?
      - - Öppna frågor
        - Ingenstans. Du har inte svaret själv, och gruppen tänker tillsammans med texten som grund
        - Tröjan är mycket större än något Hiba har haft på sig. Vems kan den vara? Kan den vara någon annans?
    not: Frågorna på bladet kommer ur texterna Den tomma plåten och Staketet på nivån Lättläst, och den öppna frågan ur Rum 4 på Mellan. Både mellan och bortom raderna kan ha flera svar som texten stöder.
  - rubrik: "Slagen: det eleven listar ut"
    plats: efter-inledning
    text: Varje mellan raderna-fråga har ett slag, som säger vad eleven ska lista ut. Översikten under Lärarens sidor visar vilka slag varje text har. Exemplen är startmeningar på nivån Mellan.
    kolumner:
      - Slaget
      - Eleven listar ut
      - Startmeningen
      - Svaret
    rader:
      - - Vem
        - vem någon är, eller vem eller vad hon, han eller det syftar på (syftning)
        - "Mannen ställde sig framför tavlan och sa: ”Öppna böckerna på sidan tolv, och tyst där bak.”"
        - en lärare
      - - Var och när
        - platsen, tiden på dagen eller årstiden
        - Klockan var bara fyra, men lamporna i fönstren lyste redan och Jonas drog mössan över öronen.
        - vinter eller sen höst
      - - Känsla
        - hur någon känner sig, och hur känslan ändras
        - Emma stod kvar vid grinden och vinkade tills bilen bara var en liten prick, och sedan vinkade hon lite till.
        - hon saknar dem som åkte
      - - Varför
        - orsaken till något, eller vad någon vill
        - Lina packade två smörgåsar till skolan, fast hon aldrig brukade äta mer än en.
        - hon ska dela med någon
      - - Ordet
        - vad ett vanligt ord eller uttryck betyder just här
        - Alla ville sitta bredvid Johan, för han delade alltid med sig och hade ett hjärta av guld.
        - mycket snäll och generös
      - - Före och efter
        - det som hände innan, eller det som troligen händer sedan
        - Bredvid en kopp choklad som fortfarande var varm låg en uppslagen tidning, och stolen stod utdragen från bordet.
        - någon har nyss rest sig och gått därifrån
      - - Det som menas
        - vad någon egentligen menar när hen säger något annat
        - ”Jaja, den är bra”, sa Tim utan att lyfta blicken från spelet när lillasyster visade sin teckning.
        - han bryr sig inte om teckningen
    not: Svårigheten, från 1 till 3, säger hur långt ifrån varandra ledtrådarna står och hur lätt det är att avfärda ett svar som texten inte stöder. En text med vändning får läsaren att tänka om mot slutet.
  - rubrik: Från det du hör till det du visar
    plats: efter-inledning
    meny: true
    text: Efter pass 3 läser du lyssningsbladet, ledtrådsbladen och frågetecknen. Välj raden med det som flest elever gjorde, och visa det som står i kolumnen Visa i nästa pass 1, med en text vars slag passar raden. Översikten under Lärarens sidor visar varje texts slag, svårighet och vändning.
    kolumner:
      - Det du hör i pass 3
      - Så kan det låta
      - Visa i nästa pass 1
    rader:
      - - Eleven läser vidare utan att stanna
        - ”Den handlar om en kille som väntar.”
        - "Stanna: visa var du stannar och varför, och välj en text med ett tydligt stopp"
      - - Eleven letar bara efter ord i texten
        - ”Det står inte.”
        - "Jag vet: visa att man får använda det man vet, och ställ frågan Före läsningen tydligt"
      - - Eleven gissar utan ledtråd
        - ”Han är nog sjuk.”
        - "Det står: stryk under ledtrådarna innan du svarar"
      - - Eleven svarar på en mellan raderna-fråga bara med det hen själv har varit med om
        - ”Jag hade blivit glad.”
        - "Det står: ta vara på det eleven har varit med om, och fråga vad personen i texten gör och säger"
      - - Eleven ser inte scenen framför sig
        - Ett kort svar utan detaljer, eller ”vet inte” om var och när
        - "Se det framför dig: säg vad du ser, hör och känner, och välj en text med slaget Var och när"
      - - Eleven använder en ledtråd i taget
        - ”För att han tog ett steg fram.”
        - "Det står: slå ihop två ledtrådar, och välj en text med svårighet 2 eller 3"
      - - Eleven håller fast vid sin första tanke
        - Eleven säger samma sak också efter sista meningen
        - Stämmer det? Pröva och tänk om, och välj en text med vändning
      - - Eleven tror aldrig på det någon säger
        - ”Hon ljuger nog”, fast inget i texten pekar dit
        - Stämmer det? Pröva repliken mot det personen gör, och visa att den ibland stämmer, som i Hunden med glasögon (Lättläst), Vid samma bord (Mellan) och Kanelbullen (Avancerad)
      - - Eleven kopplar ordet hon eller han till fel person
        - ”Hon, det är mamma.”
        - "Det står: visa vem ordet syftar på, och välj en text med en fråga om syftning"
      - - Eleverna pratar med dig och inte med varandra
        - Varje svar går till dig, och ingen bygger vidare
        - "Fråga en kamrat: visa med en elev hur ni frågar varandra ”Vad tror du?” och bygger vidare, och låt paren samtala vid stoppet också i pass 1"
      - - Eleven väntar på det rätta svaret, eller säger inget
        - ”Är det rätt?”
        - "Säga det jag tror: säg att en tanke inte blir fel när den prövas mot texten, visa två tankar som båda håller, och låt eleven säga sin tanke till kamraten först"
      - - Eleven visar ledtråd och slutsats
        - ”Han väntar på någon, för han går fram mot bilen och ingen svarar.”
        - Låt eleven tänka högt vid stoppet i pass 2, och välj en svårare text
    not: Visa ett tankesteg eller ett samtalsdrag i taget, och visa samma i flera veckor om det behövs.
  - rubrik: Så skiljer sig nivåerna
    plats: efter-urval
    text: Passen, samtalet och cykeln är desamma på alla tre nivåer, och samtalsdragen kommer i samma ordning, vecka för vecka, på alla nivåer. Välj nivå efter gruppen, och blanda gärna. Det här skiljer nivåerna åt.
    kolumner:
      - Vad
      - Lättläst
      - Mellan
      - Avancerad
    rader:
      - - Texten
        - 6–10 korta rader, en mening eller en fras per rad
        - 2–3 stycken
        - 3 stycken
      - - Frågorna
        - fyra, två av dem mellan raderna
        - fyra eller fem
        - fem eller sex, tre eller fyra mellan raderna
      - - Tankestegen
        - du visar alla sex, eleverna börjar med tre
        - alla sex
        - alla sex
      - - Pass 3
        - eleverna läser i par, eller du läser högt för den som behöver
        - eleverna läser själva eller i par
        - eleverna läser själva, och den som avkodar mödosamt i par
      - - Ledtrådsbladet
        - ett ord eller en bild i varje ruta
        - en ledtråd ur texten, gärna två
        - två ledtrådar ur texten
      - - Kartläggningen
        - du läser texten högt först
        - eleven läser själv, och du läser högt för den som avkodar mödosamt
        - eleven läser själv, och du läser högt för den som avkodar mödosamt
  - rubrik: Så skriver du en egen text
    plats: efter-urval
    text: När metodens texter är slut kan du skriva egna. Gör så här.
    kolumner:
      - Vad
      - Så gör du
    rader:
      - - Huvudsaken
        - Bestäm det läsaren ska lista ut, som en känsla, en orsak, var de är eller vad någon egentligen menar. Det står aldrig i texten. Lämna gärna plats för mer än ett svar som texten stöder, så att eleverna har något att pröva i samtalet.
      - - Ledtrådarna
        - "Välj tre ledtrådar av olika sort: något personen gör, något hen säger eller inte säger och en sak, en plats eller en tid. Ingen avslöjar huvudsaken ensam."
      - - Scenen
        - Skriv en scen med människor som pratar, och lägg ledtrådarna tidigt, i mitten och sist. Låt något vara konstigt eller upprepas, så att läsaren stannar.
      - - Provet
        - Täck alla ledtrådar utom en. Går huvudsaken fortfarande att se, gör den ledtråden svagare. Med alla ledtrådar ska en elev på nivån kunna komma fram till huvudsaken.
      - - Frågorna
        - "Skriv fyra till sex frågor: en på raderna, två till fyra mellan raderna som slutar med ”Hur vet du det?” och en bortom raderna. Ingen fråga får avslöja svaret på en annan. Skriv också två öppna frågor som du inte själv har svaret på."
  - rubrik: "Följdfrågorna: så frågar du vidare i stunden"
    plats: efter-steg
    meny: true
    text: Samtalet lever av frågorna du ställer efter ett svar. Ställ gärna frågor som du inte själv har svaret på, och ge inga färdiga svar. Här är frågorna för de stunder som brukar komma, och varje text har också två öppna frågor på sin sida under Lärarens sidor.
    kolumner:
      - När
      - Fråga
      - Det gör att
    rader:
      - - Eleven säger en tanke utan ledtråd
        - ”Hur vet du det? Var i texten ser du det?”
        - eleven visar en ledtråd som alla kan pröva
      - - Tanken är kort eller ofärdig
        - ”Kan du säga mer? Hur tänkte du?”
        - eleven tänker vidare högt
      - - Alla ska höra tanken en gång till
        - ”Så du menar att Hiba vill hem, fast hon säger att allt är bra?”
        - eleven hör sin tanke och kan ändra den själv
      - - Samma elever pratar
        - ”Vad tror du, Ebba? Vad vill du lägga till?”
        - fler kommer till tals
      - - Någon har sagt något viktigt
        - ”Vem kan säga Livs tanke med egna ord?”
        - alla hör tanken, och den blir gruppens
      - - Eleven frågar om det är rätt
        - ”Jag säger vad jag tror sist. Först vill jag höra er. Vad tror du?”
        - eleven tänker själv och slutar vänta på ditt svar
      - - Gruppen är överens för fort
        - ”Finns det sätt det kan vara som vi inte har tänkt på?”
        - samtalet öppnar sig igen
      - - Två tänker olika, eller någon säger att en tanke är fel
        - ”Kan båda stämma? Vad i texten talar för var och en?”
        - gruppen prövar båda svaren mot texten
      - - Eleven tar med något hen har varit med om
        - ”Tack. Vad i texten påminner dig om det?”
        - eleven kopplar sin erfarenhet till texten
      - - Texten stöder inte tanken
        - ”Spännande tanke. Var i texten ser vi det? Vi läser stället igen.”
        - eleven prövar tanken och får ändra den
      - - Eleven hittar något nytt som håller
        - ”Det hade jag inte tänkt på, Liv. Vad i texten får dig att tro det?” Sedan säger du vad idén gav samtalet.
        - idén får elevens namn och en ledtråd, och alla ser den
      - - Det blir tyst
        - Räkna tyst till tio. Fråga sedan ”Vad undrar du?”, eller ge paren en minut. Sluta hellre för tidigt än att dra ut på samtalet.
        - alla får tanketid och en fråga som alla kan svara på
    not: Fråga ”Hur vet du det?” efter alla tankar, också när du håller med. Då hör eleverna att frågan är nyfiken. Säg hellre ”Berätta mer” och ”Hur tänkte du?” än ett naket ”Varför?”, som lätt låter som ett förhör, och fråga inte ”Håller alla med?”, som säger att det finns ett enda rätt svar.
  - rubrik: Parsamtalet vid stoppet
    plats: efter-arbetsform
    meny: true
    text: I pass 2 samtalar eleverna i par vid stoppet innan ni samtalar i hela gruppen. Är ni fler än fyra samtalar paren först också om mellan raderna-frågorna. Du bestämmer paren innan passet, och i varje pass byter paret vem som börjar som A. I en trio säger A sin tanke, B frågar och C bygger vidare eller tänker annorlunda. Är ni bara två eller tre är paret gruppen, och ni går direkt till gruppens samtal.
    kolumner:
      - Steget
      - Så gör ni
    rader:
      - - Tänk själv
        - "Du stannar vid stoppet, och eleverna lägger ett papper över texten nedanför. Du säger: ”Tänk själv en stund.” Alla får tanketid, och ingen säger något på tio sekunder. Sedan har paret ett par minuter."
      - - A säger
        - "A säger sin tanke till B och börjar med ”Jag tror att”: ”Jag tror att hon vill hem.”"
      - - B frågar
        - "B frågar ”Hur vet du det?”, och A visar ledtråden: ”För det står att hon frågar hur många nätter det är kvar.” I vecka 1 frågar B bara ”Hur vet du det?”, och från vecka 2 också ”Kan du säga mer?”"
      - - Byt
        - B säger sin tanke, och A frågar. Från vecka 3 svarar den som lyssnar med veckans samtalsdrag, som ”Jag håller med, och”.
      - - Till gruppen
        - "Du frågar ett par: ”Vad sa din kamrat?” Välj gärna en elev som sällan pratar men som du hörde säga något i paret. Eleven säger kamratens tanke med egna ord, och gruppen samtalar vidare."
    not: Under parsamtalet går du runt och lyssnar, och du säger inget om vad som är rätt. Det du hör tar du med när gruppen samtalar. Delar paret ett annat språk får de tänka på det, och sedan säger de tanken på svenska i gruppen. Det räcker att eleven pekar på ledtråden.
  - rubrik: Så lär du gruppen att samtala
    plats: efter-arbetsform
    text: "Att samtala om en text går att lära sig, när du visar och eleverna får pröva. Gruppen har fem samtalsregler på ett kort, Samtalsreglerna under Materialet: Vi säger vad vi tror. Vi visar var det står. Vi bygger vidare på varandra. Vi får tänka olika. Vi får ändra oss. Ni säger dem tillsammans i Starten i vecka 1 och tittar tillbaka på dem i Avsluta. Ta sedan ett samtalsdrag i veckan ur tabellen Samtalet: tänkandet mellan er, i den ordning som tabellen Progression över insatsperioden visar, och gör de fyra stegen."
    kolumner:
      - Steget
      - Så gör du
    rader:
      - - Tydliggör
        - "Säg vilket drag ni övar och varför det hjälper: ”I dag bygger vi vidare på varandras tankar. Då kan två tankar bli en ny.” Fråga gruppen vad som är viktigt när man pratar om en text."
      - - Visa hur det syns och hörs
        - Visa draget med en elev vid stoppet. Skriv på tavlan hur det syns, som att vända sig mot den som pratar, och hur det låter, som ”Jag håller med, och”.
      - - Prova på
        - Eleverna prövar draget i parsamtalet. Du går runt, lyssnar efter det och skriver ner det du hör, med elevernas ord.
      - - Reflektera och ge återkoppling
        - "I Avsluta frågar du: ”Vad sa din kamrat som fick dig att tänka nytt?” och ”Hur gick det att följa samtalsreglerna i dag?” Säg sedan vad du hörde, till exempel ”Mustafa byggde vidare på Livs tanke om garaget, och då förstod ni varför Pricken kom hem i dag.”"
    not: Beröm det eleverna gör i samtalet, med deras egna ord, och säg vad det gav, till paret eller till hela gruppen.
  - rubrik: Samtalet i olika former
    plats: efter-arbetsform
    text: Parsamtalet och gruppens samtal är grunden. Ibland behöver samtalet en annan form, när samma elever alltid pratar, när gruppen är ny eller när ni behöver röra på er. En form ersätter rundan och en av frågorna i Samtala om texten.
    kolumner:
      - Formen
      - Så gör ni
      - Passar när
    rader:
      - - Rondellen
        - Alla tänker en stund och skriver ett stödord. Sedan säger var och en en tanke om texten, i tur och ordning runt bordet, och nästa bygger vidare eller tänker annorlunda. Den som inte är redo säger ”Pass” och får ordet sist. Rundan i varje pass är en kort Rondell, och är ni fler än fyra gör ni den i par.
        - några brukar vara tysta, eller gruppen är ny
      - - Ping-pong med ledtrådar
        - Paret turas om att säga en ledtråd var ur texten, tills ingen hittar fler. Sedan lägger de ihop ledtrådarna och säger vad de visar.
        - ni övar Det står och att slå ihop ledtrådar
      - - Läs och fråga
        - Var och en skriver en egen fråga om något som inte står i texten, och gruppen samtalar om frågorna, en i taget.
        - eleverna är vana vid frågorna och kan ställa egna
      - - Fråga författaren
        - Ni frågar er vad författaren vill att ni ska lista ut, till exempel ”Varför skriver författaren att Hiba håller kvar ryggsäcken?”
        - texten har en vändning, eller slaget Det som menas
      - - Berätta mera!
        - Eleverna står upp och byter kamrat två eller tre gånger. Var och en säger sin tanke, och kamraten säger ”Berätta mera!”
        - gruppen är sex till åtta och behöver röra på sig
      - - Två svar
        - Du väljer en fråga där texten stöder flera svar. Två par kommer fram till var sitt svar, och gruppen prövar båda mot texten. Är ni två eller tre, kommer var och en fram till ett svar.
        - eleverna ska se att olika erfarenheter ger olika svar
    not: Byt form högst en gång i veckan, så att eleverna hinner lära sig den.
  - rubrik: "Samtalet i forskningen: det forskarna såg"
    plats: efter-grund
    text: Här står forskningen om samtal och läsande gemenskaper som den lät i klassrummen. Studierna om läsande gemenskaper följde lärare och elever utan kontrollgrupp, så de visar hur det kan bli och inte hur stor effekten är.
    kolumner:
      - Forskningen
      - Det forskarna såg
      - Så gör metoden
    rader:
      - - Chambers (1993)
        - En grupp åttaåringar kom inte vidare med en bilderbok förrän läraren frågade vad de inte förstod. Då sa en pojke att huvudpersonen drömde, och resten av gruppen tog tanken till sig. Chambers skriver att vi inte vet vad vi tänker förrän vi hör vad vi säger.
        - Eleverna säger sina tankar högt, också de ofärdiga, och börjar med ”Jag tror att”.
      - - Cremin m.fl. (2009)
        - Lärarna i studien läste mer själva och läste högt för klassen, och omkring 40 procent av dem berättade för eleverna om sin egen läsning och om vilka känslor en text väckte hos dem. Eleverna började prata om texterna med varandra på egen hand, och lärarna var med i samtalen och hade både något att säga och något att lära sig.
        - Du tänker högt som en läsare i pass 1, också när du undrar, och håller tillbaka din tolkning vid de öppna frågorna.
      - - Langer och Close (2001)
        - Elever som behövde stöd i läsningen läste mer som erfarna läsare i samtal där kamraternas tänkande blev synligt för dem.
        - Paren och gruppen tänker högt, så att alla hör hur de andra tänker.
      - - Murphy m.fl. (2009)
        - En sammanställning av studier om samtal kring texter visade att eleverna pratade mer och lärarna mindre i flera samtalsmodeller, och att eleverna förstod bättre. Att samtalet ger bättre slutsatser var svagare belagt.
        - Samtalet är formen, och tankestegen och ”Hur vet du det?” tränar slutsatserna.
      - - Wegerif, Mercer och Dawes (1999)
        - Barn som var åtta och nio år och lärde sig att säga vad de trodde, ge skäl och pröva varandras idéer resonerade bättre, också när de arbetade ensamma.
        - Du lär gruppen att samtala med ett samtalsdrag i veckan, som i tabellen Så lär du gruppen att samtala.
      - - Rosenblatt (1988)
        - En text har ingen enda rätt tolkning, men alla tolkningar håller inte. De som texten stöder kan stå bredvid varandra.
        - Eleverna får svara olika när de har varit med om olika saker, och ni prövar varje tanke mot texten.
      - - Hempel-Jorgensen m.fl. (2018)
        - I skolor där läsningen blev en prestation ställde lärarna frågor till utpekade elever om det som stod i texten, och forskarna såg ett informellt samtal om en text bara en gång. Där läraren ställde öppna frågor och lät eleverna prata i par först, pratade eleverna om personerna och handlingen.
        - Du ställer öppna frågor, paren pratar först, och ingen får poäng i samtalet.
principer:
  rubrik: Tre saker att hålla fast vid
  text: Tänk högt i varje pass 1, också när eleverna börjar klara sig själva, och visa hela vägen till slutsatsen. Låt eleverna tänka tillsammans i samtalet. Eleverna säger vad de tror, visar ledtråden och bygger vidare på varandra, och ingen tanke är fel när den prövas mot texten. Och låt det du hör i pass 3 bestämma vad du visar nästa vecka.
passrutin:
  kallas: delar
  text: Varje pass har samma fem delar. Det som skiljer passen åt är vem som tänker i Läs och tänk och hur mycket eleverna samtalar med varandra.
  steg:
    - text: Du skriver startmeningen på tavlan, och gruppen säger vad som står och vad de vet. Sedan säger var och en till sin kamrat vad hen tror.
      fas: Starten
    - text: Du säger titeln, ställer frågan Före läsningen och säger vad ni ska lyssna efter.
      fas: Möt texten
    - text: I pass 1 läser du högt och tänker högt vid stoppet, i pass 2 samtalar eleverna i par vid stoppet och sedan i gruppen, och i pass 3 läser eleverna själva eller i par och sätter ett frågetecken där de stannar.
      fas: Läs och tänk
    - text: Ni börjar med en runda där var och en säger en tanke om texten. Sedan tar ni frågorna i ordning, och den som säger en tanke visar sin ledtråd. Sist ställer du alltid minst en av textens öppna frågor, som du inte själv har svaret på.
      fas: Samtala om texten
    - text: Var och en säger vad hen kom fram till och hur, med sin ledtråd, och vad en kamrat sa som fick hen att tänka nytt.
      fas: Avsluta
  efterPasset: Skriv en kort notering efter pass 1 och 2 på raden Pass 1 och 2 i Veckans cykel. I pass 3 fyller du i lyssningsbladet, och efter pass 3 resten av Veckans cykel.
tidsschema:
  rubrik: 30 minuter, del för del
  text: Läs Veckans cykel från förra veckan innan du förbereder passet. Sedan följer du tidsschemat.
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: Välj veckans tankesteg och samtalsdrag ur Veckans cykel och en text vars slag passar. Läs texten och sidan om den under Lärarens sidor, bestäm var du stannar och öva på att tänka högt. Bestäm paren och vem som är A och B, och skriv startmeningen. Kopiera texten till varje elev och till dig. Kopiera också ledtrådsbladet, i pass 2 ett till varje par och i pass 3 ett till varje elev, och skriv numret på en mellan raderna-fråga på bladet.
    - tid: 0–3 min
      fas: Starten
      vad: Skriv meningen på tavlan och läs den högt. Låt gruppen säga vad som står och vad de vet, och sedan säger var och en ”Jag tror att” till sin kamrat. Starten är likadan i varje pass.
    - tid: 3–5 min
      fas: Möt texten
      vad: Knyt an till förra passet. Säg titeln och ställ frågan Före läsningen, som får eleverna att tänka på det de behöver veta. Förklara ett eller två ord som texten kräver, men aldrig ett ord som avslöjar svaret. Säg vilket tankesteg och vilket samtalsdrag ni ska öva.
    - tid: 5–13 min
      fas: Läs och tänk
      vad: I pass 1 läser du högt, stannar vid stoppet, sätter ett frågetecken i marginalen och tänker högt med tankestegen. Eleverna stryker under med dig, och du fyller i ledtrådsbladet på tavlan. Sedan frågar du ”Så tänkte jag. Vem tänker annorlunda?”, och eleverna säger sin tanke till en kamrat. I pass 2 läser du högt, eleverna sätter frågetecknet vid stoppet och lägger ett papper över texten nedanför, och paren samtalar vid stoppet innan gruppen tar det. I pass 3 läser ni först ledtrådsbladets fråga. Sedan läser eleverna själva eller i par, sätter ett frågetecken där något inte står och stryker under ledtrådar.
    - tid: 13–26 min
      fas: Samtala om texten
      vad: Börja med en runda där var och en säger en tanke om texten, gärna något som frågorna inte frågar om. Den som inte är redo säger ”Pass” och får ordet sist. Ta sedan frågorna på raderna, mellan raderna med ”Hur vet du det?” och bortom raderna. I pass 1 säger du före frågorna om svaret står i texten eller om ni listar ut det, och frågan du tänkte högt om tar ni kort, med frågan ”Vem tänker annorlunda?” I pass 2 och 3 frågar du eleverna vid den första frågan om svaret står i texten eller om ni listar ut det. Är ni fler än fyra samtalar paren först om mellan raderna-frågorna. Välkomna olika svar som texten stöder, och ställ sist alltid minst en av textens öppna frågor. I pass 2 fyller paren i ledtrådsbladet medan de samtalar om en mellan raderna-fråga, och i pass 3 fyller varje elev i det medan du skriver det du hör på lyssningsbladet.
    - tid: 26–30 min
      fas: Avsluta
      vad: Var och en säger vad hen kom fram till om personerna i texten och hur, med sin ledtråd, och vad en kamrat sa som fick hen att tänka nytt.
  efter: Ni hinner sällan allt, och det gör inget. I varje pass tar ni alltid rundan, mellan raderna-frågorna med veckans slag och en öppen fråga. Frågan på raderna tar ni snabbt i hela gruppen. De andra mellan raderna-frågorna tar ni när tiden räcker, och bortom raderna-frågan och den andra öppna frågan får vänta till Avsluta eller nästa pass. Är ni fler än fyra säger var och en sin tanke i rundan och i Avsluta till sin kamrat, och två säger sin till gruppen. Räcker inte tiden i pass 3, tar gruppen ledtrådsbladets fråga och en fråga till tillsammans. I vecka 1 tar samtalsreglerna och parsamtalet några minuter till, så välj korta texter med svårighet 1 den veckan. Blir gruppen klar tidigt kan eleverna leta efter en ledtråd som ingen har nämnt, pröva en ny riktning med ”Tänk om” eller skriva en egen mellan raderna-fråga till texten.
steg:
  rubrik: Vad du gör och säger i varje del
  text: Fraserna hjälper dig att tänka högt i pass 1, leda samtalet i pass 2 och lyssna i pass 3. Följdfrågorna för stunderna i samtalet står i tabellen Följdfrågorna.
  fraserRubrik: Exempelfraser
  rader:
    - namn: Starten
      fraga: Vad står det, och vad tror vi?
      gor: Skriv meningen, läs den och låt gruppen säga vad som står och vad de vet. Sedan säger alla sitt ”Jag tror att” till en kamrat. Håll det kort.
      fraser:
        - Vad står det?
        - Vad vet ni om det?
        - Säg till din kamrat vad du tror, och varför.
    - namn: Möt texten
      fraga: Vad behöver vi veta innan vi läser?
      gor: Ställ frågan Före läsningen, förklara ett ord och säg veckans tankesteg och samtalsdrag.
      fraser:
        - Hur kan man se var någon har varit, om ingen berättar det?
        - I dag lyssnar ni efter var jag stannar.
        - I dag frågar ni varandra vad ni tror.
    - namn: Läs och tänk
      fraga: Vad står inte här?
      gor: I pass 1 tänker du högt och visar veckans tankesteg noga. I pass 2 stannar du, ger tanketid och låter paren samtala. I pass 3 läser eleverna och stryker under själva.
      fraser:
        - Vänta, här står inte allt.
        - Jag ser framför mig hur han kliar katten bakom örat.
        - Det står sågspån, och det står en blå fläck. Jag stryker under båda.
        - Alltså tror jag att han har varit där någon bygger och målar.
        - Så tänkte jag. Vem tänker annorlunda?
        - Tänk själv en stund. Säg sedan till din kamrat vad du tror.
        - Vi tar det tillsammans, börja du.
        - Börja med ’Jag tror att’, och säg din ledtråd.
    - namn: Samtala om texten
      fraga: Hur vet du det?
      gor: Börja med en runda, ta sedan frågorna i ordning och ställ sist minst en av textens öppna frågor. Be om ledtråden till varje tanke, också till dem som håller. Välkomna olika svar som texten stöder, och beröm en ny idé som håller. Räcker inte tiden, tar ni mellan raderna-frågorna med veckans slag och en öppen fråga först. I pass 3 frågar du och ger respons på hur eleverna tänkte.
      fraser:
        - Säg en tanke var om texten. Börja med ’Jag tror att’.
        - Står svaret i texten, eller listar vi ut det?
        - Hur vet du det?
        - Vem tänker annorlunda?
        - Finns det sätt det kan vara som vi inte har tänkt på?
        - Det hade jag inte tänkt på, och det stämmer med texten.
        - Hur kom du fram till det?
        - Du slog ihop två ledtrådar med det du vet.
    - namn: Avsluta
      fraga: Vad listade vi ut, och hur?
      gor: Var och en säger vad hen kom fram till och hur, med sin ledtråd, och vad en kamrat sa som fick hen att tänka nytt.
      fraser:
        - Säg en sak du listade ut och din ledtråd.
        - Vad sa din kamrat som fick dig att tänka nytt?
        - Vad vet vi nu om personerna, som inte stod i texten?
arbetsform:
  rubrik: "Arbetsform: gemensamt, växlande, gemensamt igen"
  text: Passet börjar och slutar med hela gruppen, och samtalet finns med i varje del. I mitten växlar arbetsformen med veckan. I pass 1 visar du, och eleverna tänker med och säger sin tanke till en kamrat. I pass 2 samtalar eleverna först i par och sedan i gruppen. I pass 3 läser och tänker var och en själv eller i par innan ni samtalar. Är ni fler än fyra tänker eleverna i par innan gruppen tar en mellan raderna-fråga, och har du bara två elever är de varandras par.
  delar:
    - rubrik: 1. Gemensamt
      text: alla säger vad som står och vad de vet, och sedan ”Jag tror att” till en kamrat
      faser:
        - Starten
        - Möt texten
    - rubrik: 2. Växlande
      text: pass 1 du, pass 2 paren och hela gruppen, pass 3 var och en
      faser:
        - Läs och tänk
        - Samtala om texten
    - rubrik: 3. Gemensamt igen
      text: var och en säger sin tanke och sin ledtråd
      faser:
        - Avsluta
exempel:
  valt:
    rubrik: Texten läraren valt
    text: Det är pass 1 i vecka 2, och gruppen har fem elever i åk 5. Texten är Skrapet på dörren, text 2 på nivån Mellan, om katten Pricken som kommer hem efter tre dagar.
  text:
    - Förra veckans lyssningsblad visade att Aron och Ebba gissade utan ledtråd. Texten i pass 3 var Längst bak, och på frågan om varför berättaren inte hänger upp jackan sa Aron att hen fryser och Ebba att hen glömde, och ingen av dem pekade i texten. Därför visar läraren Det står extra noga den här veckan, och hon har valt en text med tre tydliga ledtrådar. Veckans samtalsdrag är att ta med det man har varit med om och att fråga ”Kan du säga mer?”
    - "Läraren skriver startmeningen på tavlan: ”Gungorna gungade fortfarande, och under rutschkanan låg en ensam sko.” Sanna säger att det står att gungorna gungar. Mustafa vet att en gunga fortsätter en stund när någon har hoppat av. Sedan säger var och en ”Jag tror att” till sin kamrat, och Liv säger till Aron: ”Jag tror att någon nyss har sprungit därifrån, för gungorna gungar.”"
    - "Läraren frågar hur man kan se var någon har varit, om ingen berättar det. Sedan läser hon högt och stannar vid den blå fläcken. ”Vänta, här står inte var Pricken har varit. Jag ser framför mig hur Elias kliar honom bakom örat. Det står sågspån, och det står en blå fläck som fortfarande var klibbig. Stryk under båda med mig. Jag vet att det finns sågspån där man bygger, och att färg tar tid att torka. Alltså tror jag att han har varit där någon bygger och målar.” Hon sätter ett frågetecken vid stoppet, skriver ledtrådarna i ledtrådsbladet på tavlan och säger: ”Så tänkte jag. Vem tänker annorlunda? Säg det till din kamrat.” Ebba säger till Sanna att han har varit i ett garage, för det står sågspån, och Sanna frågar: ”Kan du säga mer? Vad tror du om färgen?” Läraren läser vidare, och vid målarburken säger Aron: ”Där står det ju!”"
    - "Gruppen börjar delen Samtala om texten med en runda. Mustafa säger: ”Jag tror att pappa vet något, för han ler.” Ingen hade frågat om det, och läraren säger: ”Det hade jag inte tänkt på, Mustafa. Vi tar med oss det.” Vid fråga 3, varför Pricken kom hem just i morse, säger läraren att svaret inte står i texten och att de får lista ut det, och paren pratar först. Ebba säger att han var hungrig, och när läraren frågar ”Hur vet du det?” pekar hon på de två skålarna mat. Liv säger: ”Jag tänker annorlunda. Vår katt blev instängd i ett förråd en gång. Jag tror att Pricken var instängd hos grannen, för garagedörren står på glänt.” Mustafa bygger vidare med att grannen kom hem i går kväll. Läraren säger att tankarna håller ihop, för tre dagar i ett garage gör en katt hungrig. Sist frågar hon varför pappa vill baka en sockerkaka i dag, en fråga hon inte själv har svaret på. Sanna tror att det är för att fira att Pricken är hemma, och Aron att kakan är till grannen, för grannen kom hem i går."
    - "I Avsluta säger var och en en slutsats och sin ledtråd, och vad en kamrat sa som fick hen att tänka nytt. Aron säger: ”Han var i garaget, för sågspånet och färgen. Liv fick mig att tänka på garaget.” Efteråt skriver läraren att Aron och Ebba pekade på ledtrådar med hennes hjälp, att Mustafa slog ihop två och att Liv tog med något hon har varit med om. I pass 2 får Aron och Ebba börja vid stoppet."
fastnar:
  rubrik: När eleven fastnar
  text: Att läsa mellan raderna är svårt, och tystnad betyder ofta att eleven tänker. Ge tanketid först, och låt eleven säga sin tanke till en kamrat om det är lättare. Ge sedan minsta möjliga stöd.
  fragaForst:
    - Vad i texten får dig att tänka så?
    - Vad vet du sedan innan?
  trappa:
    - Läs om meningen strax före och strax efter.
    - Be eleven se scenen framför sig och säga vad hen ser och hör.
    - Peka på en ledtråd och fråga vad den kan betyda.
    - Koppla till något eleven själv har varit med om, och gå sedan tillbaka till texten.
    - Låt en kamrat säga sin tanke, och fråga vad eleven vill lägga till.
    - Erbjud två tolkningar och låt eleven välja och visa sin ledtråd.
    - Tänk högt en gång till, som i pass 1.
  motto: Låt eleven hitta ledtråden själv, också när det tar tid.
roll:
  rubrik: "Lärarens roll: tänka högt, leda samtalet, tona ut"
  text: Din roll ändras under veckan. I pass 1 gör du tänkandet synligt. I pass 2 leder du samtalet och låter eleverna prata med varandra. I pass 3 håller du dig tillbaka, frågar, lyssnar och ger respons på hur eleverna tänkte. Du är samtalsledaren som hjälper eleverna att utforska texten, och du ger dem inga färdiga svar. Fyll inte tystnaden med svaret.
  gor:
    - Tänk högt och visa hela vägen, också när du tvekar eller undrar.
    - Ge gott om tanketid.
    - Låt eleverna prata med varandra, och luta dig tillbaka.
    - Ställ frågor som du inte själv har svaret på.
    - Be om ledtråden till alla tankar, också till dem som håller.
    - Välkomna olika svar som texten stöder, och beröm en ny idé som håller.
    - Skriv ner det eleverna säger med deras ord.
    - Tona ut din hjälp över veckan.
  undvik:
    - Att ge svaret när eleven tvekar.
    - Att ställa en mellan raderna-fråga innan du har visat hur du tänker.
    - Att påminna om det eleven vet och sedan gå vidare.
    - Att rätta eleven utan att fråga hur hen tänkte.
    - Att låta varje svar gå till dig, som fråga och svar i tur och ordning.
    - Att fråga ”Håller alla med?”, som säger att det finns ett enda rätt svar.
    - Att bara fråga efter ledtråden när du tvivlar på svaret.
    - Att läsa svaren under Lärarens sidor som de enda rätta.
    - Att hålla kvar samma stöd hela vägen.
urval:
  rubrik: Var hittar du texterna?
  text:
    - Metodens texter står under Materialet. Varje nivå, Lättläst, Mellan och Avancerad, har femton texter, och varje text står på ett eget blad med frågorna under. Översikten under Lärarens sidor visar vad eleven listar ut i varje text, frågornas slag, svårigheten och om texten har en vändning. Varje text har en egen sida med stoppet, hur du kan tänka högt och två öppna frågor. Välj den text som passar veckans tankesteg. Texterna räcker till ungefär fem veckors pass, och du fyller på med texter ur serien eller egna. Två texter på nivån Avancerad, Kvart i åtta och Samma sak, handlar om en förälder som har det svårt, så ta dem inte samma vecka.
    - Sedan tar du texter ur serien Mellan raderna av Monica Karlsson och Liselotte Ståhl (Studentlitteratur). Serien består av fyra böcker med kopieringsunderlag. Efter nivån Lättläst passar Mellan raderna lättläst och sedan Vad står det mellan raderna? Efter Mellan passar Mycket mer mellan raderna, och efter Avancerad passar Mellan raderna avancerad. Facit finns hos förlaget eller i boken. Böckernas frågor står utan rubriker. Sortera dem i på, mellan och bortom raderna innan passet, och bestäm stoppet. Skriv sedan hur du tänker högt, med tankestegen och ledtrådar som står före stoppet, och två öppna frågor, som under Lärarens sidor. Byt till en svårare text eller bok när eleverna klarar slutsatsen med mindre stöd. Du kan också skriva egna texter, som tabellen Så skriver du en egen text visar.
  kravText: "Välj en text per pass som uppfyller tre krav:"
  krav:
    - rubrik: Lagom nivå
      text: Eleverna klarar frågan på raderna ganska lätt
    - rubrik: Något att samtala om
      text: Texten lämnar något osagt som ger mer än en tanke
    - rubrik: Rätt längd
      text: Texten hinns med i lugn takt på ett pass
progression:
  text: Varje vecka börjar i pass 1 med att du visar, och det du hörde i pass 3 bestämmer vad du visar. Tabellen är ett förslag på ordning när du inte har hört något annat. Varje vecka har också ett samtalsdrag, en rad på samtalskortet, som du visar i pass 1 och eleverna prövar i parsamtalet. Dragen kommer i samma ordning på alla nivåer, och en grupp som behöver mer tid tar samma drag en vecka till. Välj texter där frågorna har veckans slag, som översikten under Lärarens sidor visar.
  rader:
    - vecka: "1"
      fokus: Eleverna lär sig vad det är att läsa mellan raderna och övar Det står, Jag vet och Alltså tror jag med slagen Känsla och Vem. Samtalsdraget är samtalskortets två första rader, att säga ”Jag tror att” och en ledtråd och att fråga ”Vad tror du?” och ”Hur vet du det?”
      roll: Ni säger samtalsreglerna i Starten i pass 1, och du förklarar frågornas tre grupper vid den första frågan. I pass 2 visar du parsamtalet med en elev vid stoppet. Du tänker högt länge i pass 1
    - vecka: "2"
      fokus: Ni övar Stanna och Se det framför dig med slagen Var och när och Varför. Samtalsdraget är att ta med det man har varit med om och att fråga ”Kan du säga mer?”
      roll: Du visar var och varför du stannar. I pass 2 säger du vad paren ska samtala om vid stoppet
    - vecka: "3"
      fokus: Ni övar att slå ihop flera ledtrådar med slaget Före och efter. Samtalsdraget är att bygga vidare med ”Jag håller med, och”. På nivån Avancerad tar du Samma sak en annan vecka än Kvart i åtta
      roll: Du visar två ledtrådar som bara tillsammans ger svaret
    - vecka: 4–5
      fokus: Ni övar Stämmer det? och slaget Det som menas, med metodens texter med det slaget och texter ur serien Mellan raderna eller egna. Samtalsdragen är att tänka annorlunda och att pröva en ny riktning med ”Tänk om”
      roll: Du tänker högt kortare. I pass 2 säger en elev varför ni stannar, innan paren samtalar
    - vecka: 6–8
      fokus: Ni övar slaget Ordet, med texter ur serien eller egna och en sida ur elevens egen bänkbok. Eleverna leder parsamtalet själva, väljer samtalsdrag ur kortet och ställer egna frågor om texten
      roll: En elev tänker högt vid stoppet i pass 2, och eleverna leder gruppens samtal efter paren. Du följer upp om eleverna stannar själva
uppfoljning:
  text: Följ effekten varje vecka med lyssningsbladet, och gör kartläggningen före och efter med två lika svåra texter. Kartläggningen är inget samtal. Den mäter om eleven på egen hand drar en slutsats som texten stöder och visar ledtråden, och i passen ger du inga poäng.
  rader:
    - nar: Före insatsen
      vad: Varje elev gör kartläggningens text före, enskilt med dig, på fem till åtta minuter. Läs texten högt först på Lättläst och för den som avkodar mödosamt.
    - nar: Varje vecka
      vad: Du läser lyssningsbladet och frågetecknen i pass 3, också vem som byggde vidare. Nästa vecka visar du Det står om eleverna gissar utan ledtråd, Jag vet om de bara letar efter ord och Stanna om de läser förbi stoppet.
    - nar: Efter sex till åtta veckor
      vad: Varje elev gör kartläggningens text efter, som är lika svår. Jämför poängen med kartläggningen före, och lyssningsbladen med vecka 1 och 2. Se också om eleven sätter frågetecken i sin bänkbok.
mal:
  punkter:
    - Skilja på svar som står i texten och svar man måste lista ut
    - Stanna när något inte står
    - Visa en ledtråd i texten
    - Slå ihop flera ledtrådar
    - Använda det man vet för att dra en slutsats
    - Säga sin tanke med ”Jag tror att” och en ledtråd
    - Bygga vidare på en kamrats tanke, och säga när man tänker annorlunda
    - Göra en inferens med mindre stöd
    - Motivera sin slutsats när någon frågar ”Hur vet du det?”
    - Börja läsa mellan raderna i sin egen läsning
snabbmall:
  rubrik: Veckans cykel
  text: "En halv sida att fylla i. Delen Före passet fyller du i före pass 1, och delen Efter passet efter pass 1, 2 och 3. Det du hör i pass 3 bestämmer vad du visar nästa vecka."
  fore:
    - Det jag hörde förra veckan
    - Tankesteget jag visar i pass 1
    - Samtalsdraget vi övar
    - Slaget och texterna i pass 1, 2 och 3
    - Startmeningarna och paren
  efter:
    - "Pass 1 och 2: vem som byggde vidare, och vem som var tyst"
    - "Pass 3: det flest elever gjorde, ur lyssningsbladet"
    - "Klarade eleverna slutsatsen, och med hur mycket stöd?"
    - Nästa vecka visar jag
checklista:
  punkter:
    - Valt tankesteg och samtalsdrag ur Veckans cykel.
    - Läst texten och sidan om den, och övat på att tänka högt.
    - Bestämt paren och vem som är A och B.
    - Skrivit startmeningen och kopierat texten.
    - Lagt fram korten och ledtrådsbladen, med frågans nummer.
grund:
  text: "Att göra en inferens är att föra samman två eller fler uppgifter i en text, eller texten och det man vet, till något som inte står utskrivet, och frågan ”Hur vet du det?” får eleven att peka på ledtråden (Kispal, 2008). Elever som avkodar hyfsat men behöver stöd i att förstå det de läser vinner på undervisning i inferenser (Cain och Oakhill, 1999; Elleman, 2017), tydligast när de ser vad som kommer från texten och vad som kommer från läsaren själv (Elbro och Buch-Iversen, 2013). I flera modeller för samtal om texter pratar eleverna mer och förstår bättre, fast beläggen för att samtalet ensamt ger bättre inferenser är svagare (Murphy m.fl., 2009), och elever som behöver stöd läser mer som erfarna läsare när kamraternas tänkande blir synligt för dem (Langer och Close, 2001). Samtalet växer med autentiska frågor och en lärare som bygger vidare på elevens svar (Nystrand, 2006; Soter m.fl., 2008), utforskande samtal går att lära ut (Wegerif, Mercer och Dawes, 1999), och i en läsande gemenskap pratar eleverna om texter med varandra, där flera tolkningar kan hålla när texten stöder dem (Cremin m.fl., 2009; Rosenblatt, 1988). Metoden bygger därför på att läraren tänker högt och lämnar över tänkandet till samtalet steg för steg (Pearson och Gallagher, 1983; Fohlin och Wilson, 2025)."
  kallor: Bygger på Cain och Oakhill (1999), Chambers (1993), Cremin m.fl. (2009), Elbro och Buch-Iversen (2013), Elleman (2017), Fohlin och Wilson (2025), Hempel-Jorgensen m.fl. (2018), Kispal (2008), Langer och Close (2001), Murphy m.fl. (2009), Nystrand (2006), Pearson och Gallagher (1983), Rosenblatt (1988), Soter m.fl. (2008) och Wegerif, Mercer och Dawes (1999), samt Skolverkets Lärportalen om textsamtal och litteratursamtal och guiden UTFORSK från Karlstads universitet.
ramar:
  rubrik: Materialet
  text:
    - Här finns tankekortet, samtalskortet, samtalsreglerna, startmeningarna och metodens texter på varje nivå, med kartläggningens text före och efter. Varje text står på ett eget blad som en sida i en bok, med frågorna under texten och nivån längst ned, och svaren och de öppna frågorna står under Lärarens sidor för nivån, så att de inte kommer med på elevens kopia. Kopiera bladet till varje elev och till dig. Eleven skriver sitt namn på baksidan, så att du vet vems frågetecken och understrykningar du läser. Ledtrådsbladet, lyssningsbladet och kartläggningens protokoll står i planeringsmallarna.
    - I ledtrådsbladet skriver eleven ledtrådarna ur texten i rutan Det står, gärna två, det hen vet i rutan Jag vet och sin slutsats i rutan Alltså tror jag. På nivån Lättläst räcker ett ord eller en bild i varje ruta. I lyssningsbladet skriver du det eleven sa med elevens ord, ledtråden med ett h efter om den kom med din hjälp, och det tankesteg som saknades. Bygger eleven vidare på en kamrat, skriv ordet vidare och kamratens namn i kolumnen Det eleven sa, och tänker hen annorlunda, skriv ordet annorlunda och namnet. Lyssningsbladet kan också ligga framme i pass 2, när paren samtalar vid stoppet.
  ramar:
    - rubrik: Tankekortet
      text:
        - Varje elev har kortet vid bordet i varje pass. Skriv ut det till varje elev och laminera det gärna. Det står i elevens typsnitt, och samma rader står på lathundens tredje sida.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så använder ni kortet
              text: Kortet hjälper eleven med det inre samtalet. Peka på steget när du tänker högt i pass 1. I pass 2 och 3 pekar eleverna själva på steget de använder, och frågan bredvid är den de ställer sig själva. På nivån Lättläst börjar ni med Det står, Jag vet och Alltså tror jag.
      listor:
        - rubrik: Så tänker jag mellan raderna
          kolumner:
            - Tankesteget
            - Jag frågar mig
          rader:
            - - Stanna
              - Vad står inte här?
            - - Se det framför dig
              - Vad ser och hör jag?
            - - Det står
              - Vilka ord är ledtrådar?
            - - Jag vet
              - Vad vet jag om sådant?
            - - Alltså tror jag
              - Vad kan det betyda?
            - - Stämmer det?
              - Passar det med resten?
    - rubrik: Samtalskortet
      text:
        - Varje elev har kortet vid bordet i varje pass, bredvid tankekortet. Skriv ut det till varje elev och laminera det gärna. Det står i elevens typsnitt, och samma rader står på lathundens tredje sida.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så använder ni kortet
              text: Kortet hjälper eleverna att samtala med varandra. Under Jag säger står det man säger, och under Jag frågar det man frågar sin kamrat. Raderna är samtalsdragen. I vecka 1 börjar alla med de två första raderna, och sedan kommer en rad till i veckan, som tabellen Progression över insatsperioden visar. Visa raden med en elev, och låt paren använda den vid stoppet. Tankekortet hjälper eleven till en tanke, och samtalskortet hjälper hen att säga den.
      listor:
        - rubrik: Så pratar vi om texten
          kolumner:
            - Jag säger
            - Jag frågar
          rader:
            - - Jag tror att
              - Vad tror du?
            - - för det står
              - Hur vet du det?
            - - Jag har varit med om
              - Kan du säga mer?
            - - Jag håller med, och
              - Vad vill du lägga till?
            - - Jag tänker annorlunda
              - Kan det vara något annat?
            - - Tänk om
              - Stämmer det med texten?
    - rubrik: Samtalsreglerna
      text:
        - Gruppen har reglerna framför sig i varje pass, på ett kort till varje elev eller på tavlan hela veckan. Det står i elevens typsnitt, och samma rader står på lathundens tredje sida.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så använder ni reglerna
              text: Säg reglerna tillsammans i Starten i vecka 1, och fråga vad de betyder. Välj gärna en regel före samtalet, och titta tillbaka på den i Avsluta med frågan ”Hur gick det att följa samtalsreglerna i dag?”
      listor:
        - rubrik: Så samtalar vi
          rader:
            - - Vi säger vad vi tror.
            - - Vi visar var det står.
            - - Vi bygger vidare på varandra.
            - - Vi får tänka olika.
            - - Vi får ändra oss.
    # >>> texterna: node build/texter.mjs textsamtal-i-grupp --yaml skriver allt härifrån
    - rubrik: Startmeningarna
      text:
        - "Det finns 24 meningar för varje nivå, en för varje pass. Välj en mening med veckans slag. Meningarna är till dig, och eleverna ser dem bara på tavlan."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Så använder du meningarna, text: "Skriv meningen på tavlan i början av passet och läs den högt. Låt gruppen säga vad som står och vad de vet, och sedan säger var och en ”Jag tror att” till sin kamrat. Svaret i tabellen är ett exempel, och alla svar som meningen stöder går bra." }
      listor:
        - rubrik: "Startmeningarna: Lättläst, meningarna 1–8"
          larare: true
          kolumner: [Startmeningen, Slag och svar]
          rader:
            - ["1. Hon skrev på tavlan och sa: ”God morgon, allihop!”", "Vem: läraren"]
            - ["2. Bussen stannade. Hon öppnade dörren och sa: ”Varsågod, kliv på!”", "Vem: busschauffören"]
            - ["3. Det luktade hö, och en ko råmade bredvid oss.", "Var och när: på en bondgård eller i en lada"]
            - ["4. Glassen rann nedför handen, och vi hoppade i sjön.", "Var och när: en varm sommardag"]
            - ["5. Hon smällde igen dörren och sparkade till skon.", "Känsla: hon är arg"]
            - ["6. Han viftade med provet och sprang hela vägen hem.", "Känsla: han är glad och stolt"]
            - ["7. Pappa ställde en hink på golvet och tittade upp i taket.", "Varför: taket läcker och det droppar ner"]
            - ["8. Han tittade på klockan hela lektionen och packade väskan tidigt.", "Varför: han längtar efter att lektionen ska ta slut"]
        - rubrik: "Startmeningarna: Lättläst, meningarna 9–16"
          larare: true
          kolumner: [Startmeningen, Slag och svar]
          rader:
            - ["9. Vi spelade kort vid bordet, och mormor vann tre gånger.", "Ordet: kort betyder spelkort här"]
            - ["10. Cykeln låg på sidan i gruset, och han höll sig om knät.", "Före och efter: han har ramlat och slagit sig"]
            - ["11. Hon fyllde den stora grytan med vatten och satte på spisen.", "Före och efter: hon ska koka något"]
            - ["12. ”Ja, ja, jag kommer”, sa han, men han satt kvar.", "Det som menas: han vill egentligen inte komma"]
            - ["13. Mannen i den gula västen håller upp en skylt, och bilarna stannar.", "Vem: någon som stoppar trafiken, till exempel en skolvakt eller en vägarbetare"]
            - ["14. Hon sa godnatt, stoppade om Vera och släckte lampan.", "Vem: en vuxen som tar hand om Vera, till exempel hennes mamma"]
            - ["15. Fötterna sjunker ner i sanden, och det doftar solkräm.", "Var och när: på en strand en varm sommardag"]
            - ["16. Kassan piper, och Ali lägger mjölk och bröd på bandet.", "Var och när: i en affär"]
        - rubrik: "Startmeningarna: Lättläst, meningarna 17–24"
          larare: true
          kolumner: [Startmeningen, Slag och svar]
          rader:
            - ["17. Saga tittar på kompisens nya cykel och sparkar på sitt eget däck.", "Känsla: avundsjuk"]
            - ["18. Tuva bär hem teckningen med båda händerna och visar alla.", "Känsla: stolt"]
            - ["19. Ture håller handen bakom örat och lutar sig mot dörren.", "Varför: han vill höra vad någon säger bakom dörren"]
            - ["20. Siri bär skorna i handen och går på tå genom hallen.", "Varför: hon vill vara tyst så att ingen vaknar eller hör henne"]
            - ["21. Han höll ett öga på gröten och stod vid spisen hela tiden.", "Ordet: han passade gröten så att den inte skulle bränna vid"]
            - ["22. Blöta fotspår går från dörren fram till soffan och stannar där.", "Före och efter: någon kom in utifrån med blöta fötter och sitter nu i soffan"]
            - ["23. Cykeln ligger på gräset, och hjulet snurrar fortfarande.", "Före och efter: någon har just ramlat av eller lämnat cykeln"]
            - ["24. Leon säger ”Kul för dig” och vänder sig bort med sin ryggsäck.", "Det som menas: han låtsas vara glad men är avundsjuk eller besviken"]
        - rubrik: "Startmeningarna: Mellan, meningarna 1–8"
          larare: true
          kolumner: [Startmeningen, Slag och svar]
          rader:
            - ["1. Nora öppnade kylskåpet och såg att det bara fanns tomma förpackningar, medan hennes bror torkade bort choklad från munnen.", "Vem: brodern har ätit upp det som fanns"]
            - ["2. Mannen ställde sig framför tavlan och sa: ”Öppna böckerna på sidan tolv, och tyst där bak.”", "Vem: han är en lärare"]
            - ["3. Klockan var bara fyra, men lamporna i fönstren lyste redan och Jonas drog mössan över öronen.", "Var och när: det är vinter, eller sen höst"]
            - ["4. Alice la mjölken och brödet på bandet och väntade på att det skulle pipa.", "Var och när: i en affär, vid kassan"]
            - ["5. Filip läste resultatet på provet två gånger och vek sedan ihop pappret så litet det gick.", "Känsla: han är besviken eller orolig och vill gömma resultatet"]
            - ["6. Emma stod kvar vid grinden och vinkade tills bilen bara var en liten prick, och sedan vinkade hon lite till.", "Känsla: hon saknar dem som åkte, och det är svårt att släppa dem"]
            - ["7. Noak blev alldeles blek och slöt ögonen, och mamma skyndade sig att öppna fönstret på bussen.", "Varför: han mådde illa, som vid åksjuka"]
            - ["8. Lina packade två smörgåsar till skolan, fast hon aldrig brukade äta mer än en.", "Varför: hon ska dela med någon, till exempel en kompis som inte har någon mat"]
        - rubrik: "Startmeningarna: Mellan, meningarna 9–16"
          larare: true
          kolumner: [Startmeningen, Slag och svar]
          rader:
            - ["9. Alla ville sitta bredvid Johan, för han delade alltid med sig och hade ett hjärta av guld.", "Ordet: hjärta av guld betyder att någon är mycket snäll och generös"]
            - ["10. Bredvid en kopp choklad som fortfarande var varm låg en uppslagen tidning, och stolen stod utdragen från bordet.", "Före och efter: någon har nyss rest sig och gått därifrån"]
            - ["11. Bollen låg i rabatten under fönstret med det stora hålet, och vid middagen sa ingen något.", "Före och efter: någon sköt bollen genom rutan, och ingen vill erkänna det"]
            - ["12. ”Jaja, den är bra”, sa Tim utan att lyfta blicken från spelet när lillasyster visade sin teckning.", "Det som menas: han lyssnar inte och bryr sig inte om teckningen, fast han säger att den är bra"]
            - ["13. Små leriga fotspår ledde fram till den lilla stolen vid köksbordet.", "Vem: ett litet barn, till exempel ett småsyskon"]
            - ["14. Det knackade på dörren, och hela klassen reste sig och sa god morgon i kör.", "Vem: en lärare eller en annan vuxen kom in i klassrummet"]
            - ["15. Sanden klibbade mellan tårna, och alla plockade ihop sina handdukar medan solen gick ner.", "Var och när: på en strand på kvällen"]
            - ["16. Dörren gled upp med ett pip, och alla fick stå tätt medan en röst ropade ut nästa hållplats.", "Var och när: på en buss, en tunnelbana eller ett tåg"]
        - rubrik: "Startmeningarna: Mellan, meningarna 17–24"
          larare: true
          kolumner: [Startmeningen, Slag och svar]
          rader:
            - ["17. Hon klappade längst av alla och ropade hans namn tills läraren bad henne sluta.", "Känsla: stolt eller glad för hans skull, eller mycket entusiastisk"]
            - ["18. Alla andra hade redan hämtat sina jackor, men han stod kvar och fingrade på dragkedjan på väskan.", "Känsla: tveksam eller orolig inför något"]
            - ["19. Han ställde klockan tidigare än vanligt och la fram väskan och skorna vid dörren.", "Varför: han ska iväg tidigt i morgon, till exempel till träning eller en utflykt"]
            - ["20. Mamma stängde fönstret, drog för gardinen och sa åt dem att prata tyst.", "Varför: någon behöver ha det tyst och mörkt, till exempel en som sover"]
            - ["21. Provet var en baggis, så han behövde inte öva och hann se klart filmen.", "Ordet: baggis betyder något mycket lätt"]
            - ["22. Gungorna gungade fortfarande, och under rutschkanan låg en ensam sko.", "Före och efter: barn har nyss lekt där och har sprungit iväg i hast"]
            - ["23. Han fyllde vattenflaskan, packade en karta och en banan och tog på sig kängorna.", "Före och efter: han ska ut och vandra, till exempel i skogen"]
            - ["24. ”Det går bra att vänta”, sa han och tittade på klockan för tredje gången.", "Det som menas: han vill att den andra ska skynda sig"]
        - rubrik: "Startmeningarna: Avancerad, meningarna 1–8"
          larare: true
          kolumner: [Startmeningen, Slag och svar]
          rader:
            - ["1. Någon väckte honom med en våt nos, och han drog täcket över huvudet och mumlade: ”Fem minuter till.”", "Vem: ett husdjur, troligen en hund"]
            - ["2. Mannen i vit rock tryckte försiktigt på hennes knä och sa: ”Det här kommer göra lite ont.”", "Vem: en läkare eller en sjukgymnast"]
            - ["3. Gatlyktorna lyste redan när de gick hem, men klockan på kyrktornet visade bara fyra.", "Var och när: sen höst eller vinter, när det blir mörkt tidigt"]
            - ["4. I högtalaren sa en röst: ”Spår fyra”, och hela bänkraden reste sig med sina resväskor.", "Var och när: på en tågstation"]
            - ["5. Hon sa att hon inte brydde sig, men hon hade kollat mobilen sjutton gånger sedan lunch.", "Känsla: hon väntar på ett svar och är nervös eller orolig"]
            - ["6. Han klappade sin kompis på axeln och sa grattis, men lämnade tårtan orörd fast den var hans favorit.", "Känsla: han är avundsjuk eller besviken"]
            - ["7. Han la jackan på stolen bredvid och väskan på stolen mittemot, fast kaféet var nästan tomt.", "Varför: han håller platser åt någon som ska komma"]
            - ["8. När hon skulle hålla sitt tal tappade hon tråden och stod tyst i en halv minut, tills klassen började skratta.", "Ordet: hon glömde vad hon skulle säga"]
        - rubrik: "Startmeningarna: Avancerad, meningarna 9–16"
          larare: true
          kolumner: [Startmeningen, Slag och svar]
          rader:
            - ["9. Det låg sand i hallen, en blöt handduk på golvet och ett glasspapper på bänken.", "Före och efter: någon har nyss kommit hem från stranden"]
            - ["10. Han vred åt sista skruven, vände cykeln rätt och torkade händerna på byxorna.", "Före och efter: han har lagat cykeln och ska troligen provcykla den"]
            - ["11. ”Nej, gör som du vill”, sa pappa och smällde ner tidningen på bordet.", "Det som menas: han är irriterad och vill egentligen inte att hon gör så"]
            - ["12. ”Kul att du hann komma”, sa läraren och tittade på klockan medan de andra redan packade ihop.", "Det som menas: den som kommer är sen, och läraren säger det med ironi"]
            - ["13. Skon i hallen var sönderbiten, och på mattan bredvid låg något stort och lurvigt som sov med öppen mun.", "Vem: hunden har tuggat sönder skon"]
            - ["14. Expediten kom runt disken och kramade Gustav. ”Du har vuxit, vännen”, sa hon och strök honom över håret.", "Vem: hon är någon i Gustavs familj eller en vuxen som har känt honom länge"]
            - ["15. Löven låg i blöta högar på skolgården, och Tuva hoppade över pölarna på väg till bussen.", "Var och när: det är höst och det har regnat"]
            - ["16. Ljuset släcktes, alla tystnade, och Melker klev över folks fötter på väg till sin plats i raden.", "Var och när: på en biograf eller i en teatersalong"]
        - rubrik: "Startmeningarna: Avancerad, meningarna 17–24"
          larare: true
          kolumner: [Startmeningen, Slag och svar]
          rader:
            - ["17. Filip skrev ”Kul för er” i gruppchatten, raderade det, skrev det igen och tryckte aldrig på skicka.", "Känsla: han är avundsjuk eller sårad men vill inte visa det"]
            - ["18. Jenny bytte tröja för tredje gången medan mamma ropade att taxin väntade.", "Känsla: hon är nervös inför något och vill se bra ut"]
            - ["19. Axel smög runt huset och gick in genom källardörren i stället för genom dörren vid köksfönstret.", "Varför: han vill inte bli sedd av den som är i köket"]
            - ["20. Saga stoppade smörgåsen i fickan i stället för att äta upp den och gick mot gympasalen, där någon satt ensam på bänken.", "Varför: hon vill dela maten med den som sitter ensam"]
            - ["21. Filmen var så tung att ingen sa något på hemvägen.", "Ordet: sorglig eller allvarlig, något som tar på en"]
            - ["22. Skåpen var tomma, sängen var bäddad och på köksbordet låg en lapp med nyckeln ovanpå.", "Före och efter: någon har flyttat eller rest iväg och lämnat nyckeln"]
            - ["23. Det låg krossat glas på golvet i hallen, och katten gömde sig under soffan.", "Före och efter: något har just fallit och gått sönder och skrämt katten"]
            - ["24. ”Ja, visst, det var en intressant idé”, sa läraren och bläddrade vidare till nästa uppsats.", "Det som menas: läraren tycker inte att idén var bra men säger det artigt"]
    - rubrik: "Lärarens sidor: Lättläst"
      text:
        - "Här är de femton texterna på nivån Lättläst och kartläggningens två. Tabellen visar vad varje text handlar om, vad eleven ska lista ut, vilka slags frågor mellan raderna texten har, hur svår den är och om den har en vändning eller är känslig. Efter tabellen har varje text en egen sida med det du behöver i passet: det som står mellan raderna, var du stannar, vad du säger när du tänker högt, svaren och två öppna frågor till samtalet. Frågorna står på elevens blad, så ha din kopia bredvid."
      oversikt:
        kolumner: [Texten, Handlar om, Eleven listar ut, Frågornas slag, Svårighet]
        rader:
          - ["1. Staketet", "Amina på skolgården under rasten.", "hur någon känner sig", "Vem (syftning), Känsla", "1, enkel"]
          - ["2. Elva prickar", "Nils och en vuxen i ett rum, där Nils ligger i en stol som åker bakåt.", "var och när det händer", "Var och när, Känsla", "1, enkel"]
          - ["3. Tio minuter", "Sigrid öppnar en dörr hemma en stund innan mamma kommer.", "vad som hände innan, eller vad som händer sedan", "Före och efter, Vem", "1, enkel"]
          - ["4. Hunden med glasögon", "Theo och morfar en dag när Theo läser.", "var och när det händer", "Var och när, Känsla", "1, enkel"]
          - ["5. Bara vinden", "Elsa och Milo i ett tält en natt, när något låter utanför.", "vem någon är", "Känsla, Vem", "2, medel, vändning"]
          - ["6. Den nya luggen", "Tilde och Noel, när Tilde frågar vad Noel tycker.", "vad någon egentligen menar", "Det som menas (två frågor)", "2, medel, känslig"]
          - ["7. Den tomma plåten", "Juni och mormor hemma hos mormor.", "vem någon är", "Känsla, Vem", "2, medel"]
          - ["8. Den där strumpan", "Otto och hans syster Freja, vid dörren till Frejas rum.", "varför något händer, eller vad någon vill", "Varför, Känsla", "2, medel"]
          - ["9. Högst upp", "Kasper och Ester vid ett hopptorn en varm dag.", "vad ett ord betyder just här", "Ordet, Varför", "2, medel, känslig"]
          - ["10. Det blå papperet", "Ibrahim och farbror, när Ibrahim öppnar ett paket.", "vad någon egentligen menar", "Det som menas, Varför", "2, medel, känslig"]
          - ["11. Handskarna", "Hanna och farmor efter en match.", "hur någon känner sig", "Ordet, Känsla", "2, medel"]
          - ["12. Skramlet i hallen", "Lea skriver i sin dagbok en tidig morgon.", "varför något händer, eller vad någon vill", "Vem (syftning), Varför", "2, medel, känslig"]
          - ["13. Listan", "Jonna och jag-berättaren vid en lista på dörren till gympasalen.", "hur någon känner sig", "Känsla, Varför", "3, svår"]
          - ["14. Ny regel", "Yara skriver i sin dagbok om en kväll hemma med pappa.", "vad som hände innan, eller vad som händer sedan", "Före och efter, Det som menas", "3, svår"]
          - ["15. Hassans jacka", "En dagbokssida en kväll, dagen före en utflykt.", "vad som hände innan, eller vad som händer sedan", "Före och efter (två frågor)", "3, svår"]
          - ["Kartläggning före: Bland vagnarna", "Alva på ett stort ställe med mycket folk.", "hur någon känner sig", "Känsla, Var och när", "före insatsen"]
          - ["Kartläggning efter: Bilden till mormor", "Viggo på ett annat stort ställe med mycket folk.", "hur någon känner sig", "Känsla, Var och när", "efter insatsen"]
      delar:
        - rubrik: Så väljer du text
          falt:
            - { rubrik: "Veckans slag", text: "Välj en text med frågor av veckans slag, som progressionen visar: Känsla och Vem i vecka 1, Var och när och Varför i vecka 2, Före och efter i vecka 3, Det som menas i vecka 4–5 och Ordet i vecka 6–8. Metodens texter räcker till ungefär fem veckors pass. Texterna till resten av veckorna, också till Ordet i vecka 6–8, tar du ur serien Mellan raderna eller skriver själv." }
            - { rubrik: "Svårigheten", text: "Börja med svårighet 1, och ta 2 eller 3 när gruppen klarar slutsatsen med mindre stöd. En text med vändning får eleverna att tänka om mot slutet. En känslig text har en rad om det på sin sida. Läs raden före passet, och ta inte två texter om samma slags svåra sak samma vecka." }
            - { rubrik: "Nivåerna", text: "Välj nivå efter gruppen, och blanda gärna, till exempel en text på Lättläst när ni övar ett nytt tankesteg och en på Mellan när det sitter. Läser äldre elever på Lättläst, börja med Handskarna i vecka 1, fast den har svårighet 2, och ta Den nya luggen och Högst upp när veckans slag passar. Ta gärna en text från Mellan i pass 1 och 2, när du läser högt." }
    - rubrik: "Lärarens sida: Lättläst, text 1, Staketet"
      text:
        - "Det som står mellan raderna: Amina vill vara med i leken men törs inte säga ja, så hon svarar att hon inte kan. När hon väl är med glömmer hon allt annat. Först längtar hon och är osäker, och sedan blir hon glad."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad brukar hända på skolgården under rasten?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Sedan släpper hon staketet.” Någon säger en sak och gör en annan: hon säger att hon inte kan, men hon släpper staketet." }
            - { rubrik: "Tänka högt · fråga 3, Känsla", text: "”Vänta, här står inte hur Amina känner sig. Jag ser framför mig hur hon står vid staketet och tittar på elastiken. Det står ’gungar på tårna i takt, fast ingen ser det’, och det står ’Sedan släpper hon staketet’. Jag vet att man gungar i takt när man vill vara med. Och jag vet att man kan tveka fast man vill, när man är rädd att det ska gå fel. Alltså tror jag att Amina var osäker först, men nu törs hon. Stämmer det med resten? Jag läser vidare. Efter tre hopp hör hon inte ens att klockan ringer. Ja, nu är hon glad och helt med.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Hon gungar i takt." }
            - { rubrik: "Fråga 2 · mellan raderna, Vem, syftning", text: "Ledtrådarna: ”ropar en flicka”; ”Vi behöver en till”; ”Amina står vid staketet”.\nSvar som texten stöder: Amina, för flickan ropar ”Amina!” och frågar efter en till, och den som flickan ropar på är den som svarar att hon inte kan.\nEn tanke att pröva: ”Flickan, för hon pratade precis före.” Eleven väljer den som nämns närmast före ordet hon.\nFråga tillbaka: ”Vem ropar, och vad svarar den som hon ropar på?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”gungar på tårna i takt, fast ingen ser det”; ”Sedan släpper hon staketet”; ”hör hon inte ens att klockan ringer”.\nSvar som texten stöder: först osäker eller blyg, sedan glad; eller först rädd, sedan modig; eller först längtansfull, sedan helt med i leken. De håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hon är ledsen hela tiden.” Eleven ser bara början.\nFråga tillbaka: ”Vad gör Amina efter tre hopp, och vad hör hon inte?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att eleven svarar ja direkt, eller att hen provar ett hopp först och ser hur det går. Ett bra svar tar med att Amina står och gungar ensam eller att flickan ropar på henne, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Flickan ropar på Amina. Varför tror ni att hon väljer just Amina?”; ”Amina släpper staketet. Vad tror ni att flickan som ropar säger då?”" }
            - { rubrik: "Om eleven fastnar", text: "Vid fråga 2 pekar du på att flickan ropar ”Amina!” Vid fråga 3 pekar du på ”gungar på tårna i takt, fast ingen ser det”. Förklara gärna att en elastik är ett gummiband som man hoppar över. Visa vad ”i takt” betyder genom att gunga i takt." }
    - rubrik: "Lärarens sida: Lättläst, text 2, Elva prickar"
      text:
        - "Det som står mellan raderna: Nils ligger i en stol hos tandläkaren. Han är nervös men blir lättad när det går fort."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vet du några ställen där vuxna har saker och verktyg som man inte har hemma?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Hon har munskydd och blå handskar.” Något är konstigt: man ligger i en stol som åker bakåt, en vuxen har munskydd och handskar, och Nils räknar prickar i taket." }
            - { rubrik: "Tänka högt · fråga 2, Var och när", text: "”Vänta, här står inte var Nils är. Jag ser framför mig en stol som åker bakåt och en lampa som lyser rakt i ögonen. Det står ’Stolen surrar och åker bakåt’, och det står ’Hon har munskydd och blå handskar’. Jag vet att man inte ligger så i vilken stol som helst, och att den som tittar i munnar har munskydd och handskar. Alltså tror jag att Nils är hos tandläkaren. Stämmer det med resten? Jag läser vidare. ’Gapa stort’, säger hon. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Blå handskar." }
            - { rubrik: "Fråga 2 · mellan raderna, Var och när", text: "Ledtrådarna: ”Stolen surrar och åker bakåt”; ”Lampan lyser mig rakt i ögonen”; ”Hon har munskydd och blå handskar”; ”Gapa stort”.\nSvar som texten stöder: hos tandläkaren. Ge gärna orden tandläkare och mottagning.\nEn tanke att pröva: ”Hos frisören.” En stol kan åka bakåt hos frisören också, men där har ingen munskydd och handskar och säger ”Gapa stort”.\nFråga tillbaka: ”Vad ska Nils göra med munnen?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”Jag räknar prickarna i taket”; ”Jättebra”; ”säger jag till taket”; ”Redan?”\nSvar som texten stöder: nervös, orolig eller rädd, eller lättad när det är över. De håller när eleven visar en ledtråd. Ge gärna orden nervös, rädd och lättad.\nEn tanke att pröva: ”Glad eller lugn, för han säger jättebra och redan.” Eleven går på orden och missar att han säger det till taket och räknar prickar.\nFråga tillbaka: ”Varför säger Nils ’Jättebra’ till taket?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att räkna eller titta på något, tänka på något roligt, eller säga till att det är läskigt. Ett bra svar nämner att Nils räknar prickar eller säger ”Jättebra” till taket, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att Nils gör efter att stolen har surrat upp igen?”; ”Hon frågar ’Hur går det, Nils?’ Vad tror ni att hon vill få veta?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Stolen surrar och åker bakåt”." }
    - rubrik: "Lärarens sida: Lättläst, text 3, Tio minuter"
      text:
        - "Det som står mellan raderna: Någon har vält blomkrukan och grävt i jorden medan Sigrid var borta. Det kan ha varit katten, lillebror eller båda, och texten stöder alla tre."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad kan man se i ett rum om någon nyss har varit där?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Lillebrors spade ligger på mattan.” Något passar inte: en spade hör hemma i trädgården." }
            - { rubrik: "Tänka högt · fråga 3, Vem", text: "”Vänta, här står inte vem som har varit här. Jag ser framför mig små tassar och en spade. Det står ’Små tassavtryck går upp på soffan’, och det står ’Lillebrors spade ligger på mattan’. Jag vet att djur har tassar, och att man gräver med en spade. Alltså tror jag att både ett djur och lillebror kan ha varit här. Stämmer det med resten? Jag läser vidare. Katten sitter på hyllan, och det är tyst i lillebrors rum. Ja, både katten och lillebror kan ha varit här.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Jord." }
            - { rubrik: "Fråga 2 · mellan raderna, Före och efter", text: "Ledtrådarna: ”Blomkrukan ligger på sidan i en hög med jord”; ”Små tassavtryck går upp på soffan”.\nSvar som texten stöder: krukan har ramlat eller vält, jorden har spillts och något har gått omkring i den.\nEn tanke att pröva: ”Det vet man inte, för det står inte.” Eleven letar efter en mening som säger det.\nFråga tillbaka: ”Hur har jorden kommit ut ur krukan?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Vem", text: "Ledtrådarna: ”Små tassavtryck går upp på soffan”; ”Lillebrors spade ligger på mattan”; ”katten med jord på nosen”; ”Det är tyst i lillebrors rum”.\nSvar som texten stöder: katten, för tassavtrycken och jorden på nosen; lillebror, för spaden och tystnaden i hans rum; eller båda. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Bara katten, för den har jord på nosen.” Eleven ser en ledtråd och missar spaden.\nFråga tillbaka: ”Vems spade ligger på mattan?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att eleven städar upp själv innan mamma kommer, eller att hen väntar och berättar för mamma vad hen ser. Ett bra svar nämner tiden eller spåren i rummet och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Det är tyst i lillebrors rum. Vad tror ni att han gör där?”; ”Katten sitter uppe på hyllan. Varför tror ni att den har klättrat dit?”" }
            - { rubrik: "Om eleven fastnar", text: "Vid fråga 2 pekar du på ”Blomkrukan ligger på sidan i en hög med jord”. Vid fråga 3 pekar du på ”Lillebrors spade ligger på mattan”. Säg att tassavtryck är spår efter djurfötter." }
    - rubrik: "Lärarens sida: Lättläst, text 4, Hunden med glasögon"
      text:
        - "Det som står mellan raderna: Theo och morfar är på biblioteket, där man ska vara tyst. Theo skrattar för högt åt sin bok, och morfar försöker vara allvarlig men tycker att det är roligt."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad ska man tänka på när man är i ett rum med många andra?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Viska nu’, viskar morfar.” Något upprepas: först säger någon ”Schh!” och sedan säger morfar ”Viska nu”, och båda vill ha tyst." }
            - { rubrik: "Tänka högt · fråga 2, Var och när", text: "”Vänta, här står inte var Theo och morfar är. Jag ser framför mig långa rader av hyllor fulla med böcker, och huvuden som vänder sig om. Det står ’mellan höga hyllor’, och det står ’Viska nu’. Jag vet att man viskar och säger schh där det ska vara tyst. Först säger någon schh, och sedan säger morfar åt Theo att viska. Alltså tror jag att de är på ett ställe med många böcker, kanske biblioteket. Stämmer det med resten? Jag läser vidare. Vid disken piper lånekortet. Ja, det är biblioteket, för där lånar man böcker med ett kort.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Lånekortet." }
            - { rubrik: "Fråga 2 · mellan raderna, Var och när", text: "Ledtrådarna: ”läser i en bok mellan höga hyllor”; ”Schh”; ”Viska nu”; ”Vid disken piper lånekortet”.\nSvar som texten stöder: på biblioteket. Ge gärna ordet bibliotek och förklara att man visar sitt lånekort vid disken när man lånar böcker.\nEn tanke att pröva: ”I skolan, för där säger man schh.” Man ska vara tyst i skolan också, men där finns inga höga hyllor och ingen disk där ett lånekort piper.\nFråga tillbaka: ”Vad gör man med ett lånekort vid en disk?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”Fyra huvuden vänder sig om”; ”Viska nu”; ”Men hans axlar skakar”.\nSvar som texten stöder: road och skrattsugen, eller allvarlig och försöker vara tyst, eller lite generad för att alla tittar. De håller när eleven visar en ledtråd. Ge gärna orden road, skrattsugen och generad.\nEn tanke att pröva: ”Arg, för han säger åt Theo.” Eleven ser bara repliken och missar vad morfar gör samtidigt.\nFråga tillbaka: ”Vad gör morfars axlar medan han säger det?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att eleven håller för munnen och slutar skratta, eller att hen skrattar vidare men försöker viska. Ett bra svar tar med att någon säger ”Schh” och att Theo viskar för högt, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Theo skrattar åt hunden med glasögon. Vad tror ni att hunden gör i boken?”; ”Fyra huvuden vänder sig om. Vad kan de som tittar tycka? Kan de tycka något annat?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”mellan höga hyllor”." }
    - rubrik: "Lärarens sida: Lättläst, text 5, Bara vinden"
      text:
        - "Det som står mellan raderna: Ljudet kommer från ett litet djur som äter Milos äpple, till exempel en igelkott. Elsa är rädd, och Milo säger ändå att det bara är vinden."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad kan man höra på natten när man ligger i ett tält?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Vinden smackar inte.” Något passar inte: Milo säger att det är vinden, men vinden kan inte smacka." }
            - { rubrik: "Tänka högt · fråga 3, Vem", text: "”Vänta, här står inte vem eller vad som smackar. Jag ser framför mig ett mörkt tält och Elsa som lyssnar medan något sniffar utanför. Det står ’Sniff, sniff, smack.’ Och det står ’sitt halva äpple utanför tältet’. Jag vet att smack är ljudet av någon som äter, och att djur kommer till mat som ligger ute. Alltså tror jag att något äter Milos äpple, och att det inte är vinden. Stämmer det med resten? Jag läser vidare. Först trodde jag bara att något åt äpplet, men nu läser jag ’En liten nos sniffar på äpplet’. Det var ett litet djur, och det är inte farligt.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Sitt halva äpple." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”Hörde du det?”; ”Vinden smackar inte”; ”Elsa drar i blixtlåset en gång till, fast det är stängt”.\nSvar som texten stöder: rädd eller orolig, eller nyfiken och lite rädd. De håller när eleven visar en ledtråd. Ge gärna orden rädd, orolig och spänd.\nEn tanke att pröva: ”Arg på Milo.” Hon säger emot honom, men hon viskar och drar i ett blixtlås som redan är stängt.\nFråga tillbaka: ”Varför drar Elsa i blixtlåset fast det är stängt?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Vem", text: "Ledtrådarna: ”Sniff, sniff, smack.”; ”sitt halva äpple utanför tältet”; ”Vinden smackar inte”; ”En liten nos sniffar på äpplet”.\nSvar som texten stöder: det som smackar är ett litet djur som äter äpplet, till exempel en igelkott, en mus eller en hare, och det är ofarligt. Ge gärna ordet igelkott.\nEn tanke att pröva: ”Det var vinden, som Milo sa.” Eleven upprepar Milos ord, men vinden kan inte smacka eller ha en nos.\nFråga tillbaka: ”Vad har en nos och sniffar på äpplet?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att de lyser på djuret och skrattar, eller att de kryper ner och sover. Ett bra svar tar med att ljudet var ett djur eller att Elsa var rädd, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Milo säger ’Det är bara vinden’. Varför tror ni att han säger så?”; ”En liten nos sniffar på äpplet. Hur kan Milo och Elsa känna sig då? Kan de känna sig på något annat sätt?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Sniff, sniff, smack.” och på ”sitt halva äpple utanför tältet”." }
    - rubrik: "Lärarens sida: Lättläst, text 6, Den nya luggen"
      text:
        - "Det som står mellan raderna: Noel säger att luggen är bra men tycker inte det, och han sätter sin keps på Tilde för att dölja luggen. Tildes ”Jag vet” kan betyda att hon förstår honom eller att hon skojar."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Låt samtalet handla om Tilde och Noel, och fråga inte hur eleverna ser ut eller vad de tycker om sitt hår." }
            - { rubrik: "Före läsningen", text: "Vad säger man när en kompis frågar vad man tycker om något nytt?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Den är ny. Och bra, mycket bra’, säger han.” Något upprepas: han säger bra två gånger, men inte att den är fin." }
            - { rubrik: "Tänka högt · fråga 2, Det som menas", text: "”Vänta, här står inte vad Noel tycker. Jag ser framför mig en flicka med en lugg som är kortare på ena sidan och en pojke som tittar länge. Det står ’tittar väldigt länge på den’, och det står ’Och bra, mycket bra’. Jag vet att man stannar upp och säger för mycket när man vill vara snäll. Alltså tror jag att Noel inte tycker att luggen är bra. Stämmer det med resten? Jag läser vidare. Han sätter sin keps på hennes huvud. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Sin keps." }
            - { rubrik: "Fråga 2 · mellan raderna, Det som menas", text: "Ledtrådarna: ”kortare på ena sidan”; ”tittar väldigt länge”; ”Och bra, mycket bra”; ”sätter han sin keps på hennes huvud”.\nSvar som texten stöder: att han inte tycker att luggen är bra men vill vara snäll mot Tilde. Ge gärna orden snäll och ärlig.\nEn tanke att pröva: ”Han tycker att den är bra, för han säger det.” Eleven tror på orden och ser inte vad han gör.\nFråga tillbaka: ”Varför sätter han sin keps på hennes huvud?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Det som menas", text: "Ledtrådarna: ”Tack. Jag vet”; ”sätter han sin keps på hennes huvud”.\nSvar som texten stöder: hon förstår att Noel inte menar det han säger och att kepsen ska dölja luggen, eller hon skojar och tackar för att han är snäll. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hon är arg på Noel.” Eleven tar ”Jag vet” som ett kort svar och missar ”Tack”.\nFråga tillbaka: ”Vad säger Tilde först, och vad har Noel gjort för henne?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att det var rätt, för Noel var snäll och hjälpte Tilde, eller att det inte var rätt, för Tilde borde få veta sanningen. Ett bra svar nämner vad Noel säger eller gör, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att Tilde gör med luggen sedan?”; ”Noel börjar med ’Den är ny.’ Varför tror ni att han säger just det först?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Försiktigt sätter han sin keps på hennes huvud”." }
    - rubrik: "Lärarens sida: Lättläst, text 7, Den tomma plåten"
      text:
        - "Det som står mellan raderna: Någon har ätit upp bullarna. Mormor säger att det var lillebror, men det var hon själv. Det som hänt före texten syns på plåten."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad händer ofta med något gott som ligger framme?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Lillebror sover i soffan, och hans händer är rena.” Något passar inte: mormor sa att det var lillebror, men hans händer är rena." }
            - { rubrik: "Tänka högt · fråga 3, Vem", text: "”Vänta, här står inte vem som tog bullarna. Jag ser framför mig en tom plåt med smulor, och en lillebror som sover i soffan. Det står ’Strösockret ligger ända fram till mormors stol’, och det står ’hans händer är rena’. Jag vet att den som äter bullar får kladdiga fingrar, och att man sätter sig där man äter. Alltså tror jag att det inte var lillebror. Stämmer det med resten? Jag läser vidare. Mormor torkar sig snabbt om munnen. Ja, nu tror jag att mormor tog dem själv.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Smulor och strösocker." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”Plåten på bänken är tom”; ”Mormor, bullarna är borta!”; ”ropar Juni”.\nSvar som texten stöder: förvånad, besviken eller arg. De håller när eleven visar en ledtråd. Ge gärna orden förvånad och besviken.\nEn tanke att pröva: ”Det står inte hur hon känner.” Eleven letar efter ett ord som säger det.\nFråga tillbaka: ”Vad ser Juni på plåten, och hur ropar hon?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Vem", text: "Ledtrådarna: ”Strösockret ligger ända fram till mormors stol”; ”hans händer är rena”; ”Mormor torkar sig snabbt om munnen”.\nSvar som texten stöder: mormor, för strösockret ligger ända fram till hennes stol, lillebrors händer är rena och hon torkar sig om munnen.\nEn tanke att pröva: ”Lillebror, för mormor säger det.” Eleven bygger på en enda replik.\nFråga tillbaka: ”Vad har lillebror på händerna, och var tar strösockret slut?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att eleven säger emot mormor och pekar på strösockret, eller att hen skrattar och frågar om de kan baka nya. Ett bra svar tar med strösockret vid mormors stol eller att mormor torkar sig om munnen, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Mormor säger att det var lillebror. Vad tror ni att lillebror säger när han vaknar?”; ”Plåten är tom. Varför tror ni att mormor åt upp alla bullarna?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”hans händer är rena”." }
    - rubrik: "Lärarens sida: Lättläst, text 8, Den där strumpan"
      text:
        - "Det som står mellan raderna: Otto vill vara med och spela, men säger att han letar efter saker. Freja är road och släpper in honom."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vilka spel spelar man med en tärning?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Jag letar efter mitt glas.” Något upprepas: Otto kommer tillbaka med en ny ursäkt." }
            - { rubrik: "Tänka högt · fråga 2, Varför", text: "”Vänta, här står inte varför Otto står i dörren. Jag ser framför mig en kille som står och tittar på sin systers spel. Det står ’Jag letar efter min strumpa’, och Freja säger ’Du har den på foten’. Så han letar inte på riktigt. Jag vet att man ibland säger något annat när man inte vill fråga rakt ut. Alltså tror jag att Otto vill vara med och spela. Stämmer det med resten? Jag läser vidare. Freja säger att han håller i glaset, och sedan räcker hon honom tärningen. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Sin strumpa." }
            - { rubrik: "Fråga 2 · mellan raderna, Varför", text: "Ledtrådarna: ”tittar på sin systers spel”; ”Jag letar efter min strumpa”; ”Du har den på foten”; ”Freja flyttar sig åt sidan och räcker honom tärningen”.\nSvar som texten stöder: Otto vill vara med och spela. Ge gärna ordet ursäkt.\nEn tanke att pröva: ”Han är glömsk, han har tappat sin strumpa.” Det bygger på vad Otto säger, men Freja säger att han har strumpan på foten, och att han håller i glaset.\nFråga tillbaka: ”Varför kommer han tillbaka med en ny sak att leta efter?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”Du har den på foten”; ”Du håller ju i det”; ”Freja flyttar sig åt sidan och räcker honom tärningen”.\nSvar som texten stöder: hon är road, eller snäll, eller tålmodig med honom. De håller när eleven visar en ledtråd. Ge gärna ordet road.\nEn tanke att pröva: ”Arg, för hon säger emot honom.” Eleven går på orden och ser inte att hon flyttar sig och räcker honom tärningen.\nFråga tillbaka: ”Vad gör Freja i sista meningen?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att fråga Otto om han vill vara med, eller att skratta och släppa in honom. Ett bra svar tar med att Otto har strumpan på foten, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Otto säger att han letar efter sin strumpa. Varför tror ni att han väljer just en strumpa?”; ”Efter en stund är Otto tillbaka. Vad kan han ha gjort under tiden?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Du har den på foten”." }
    - rubrik: "Lärarens sida: Lättläst, text 9, Högst upp"
      text:
        - "Det som står mellan raderna: Kalla fötter betyder här att man tvekar och inte vågar, och Kasper tvekar inför hoppet fast han säger nej. Hans fötter är varma, så uttrycket gäller inte fötterna."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Höjder och vatten kan vara läskiga för en del elever. Låt samtalet handla om Kasper, och fråga inte vem som törs hoppa." }
            - { rubrik: "Före läsningen", text: "Vad kan man göra vid ett hopptorn en varm dag?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Nej!’ säger Kasper, men han backar ett steg.” Någon säger en sak och gör en annan: han säger nej men backar." }
            - { rubrik: "Tänka högt · fråga 2, Ordet", text: "”Vänta, här står inte vad kalla fötter betyder. Jag ser framför mig en pojke högst upp på ett hopptorn och kompisar som simmar långt nere. Det står ’Får du kalla fötter’, och det står ’backar ett steg’. Jag vet att man backar när man är rädd för något. Alltså tror jag att kalla fötter betyder att man tvekar. Stämmer det med resten? Jag läser vidare. Hans fötter är varma av solen. Ja, då är det bara ett uttryck.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Sina fötter." }
            - { rubrik: "Fråga 2 · mellan raderna, Ordet", text: "Ledtrådarna: ”står högst upp på hopptornet”; ”backar ett steg”; ”De är varma av solen”.\nSvar som texten stöder: att Kasper tvekar eller är rädd för att hoppa. Ge gärna orden tveka och våga.\nEn tanke att pröva: ”Att hans fötter är kalla.” Eleven tar orden bokstavligt, men texten säger att fötterna är varma.\nFråga tillbaka: ”Hur är Kaspers fötter, och vad gör han?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Nej!”; ”backar ett steg”; ”alla kompisarna”.\nSvar som texten stöder: han vill inte visa att han är rädd, eller han skäms för att alla andra redan har hoppat, eller han försöker övertyga sig själv. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”För att hans fötter inte är kalla.” Eleven tar ordet nej bokstavligt.\nFråga tillbaka: ”Varför backar han ett steg?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att eleven hoppar ändå, eller att hen går nerför trappan och väntar tills hen vågar. Ett bra svar nämner kompisarna eller att han backar, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Ester frågar om kalla fötter. Varför tror ni att hon frågar just så?”; ”Kasper tittar på sina fötter. Vad tänker han, tror ni?”" }
            - { rubrik: "Om eleven fastnar", text: "Vid fråga 2 pekar du på ”De är varma av solen”. Vid fråga 3 pekar du på ”backar ett steg”. Förklara gärna att ett hopptorn är ett högt torn att hoppa från." }
    - rubrik: "Lärarens sida: Lättläst, text 10, Det blå papperet"
      text:
        - "Det som står mellan raderna: Ibrahim önskade sig en fotboll men fick en mössa, och när han säger att den är jättefin menar han inte det. Han är besviken men vill inte såra farbror."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "En del elever får sällan stora presenter hemma. Låt samtalet handla om att man kan vara snäll fast man hade hoppats på något annat, och aldrig om vad presenten kostar." }
            - { rubrik: "Före läsningen", text: "Vad brukar man säga när man har fått en present?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Högst upp står det fotboll.” Något passar inte: han säger att mössan är jättefin, men han önskade sig något helt annat." }
            - { rubrik: "Tänka högt · fråga 2, Det som menas", text: "”Vänta, här står inte vad Ibrahim egentligen tycker. Jag ser framför mig en pojke som håller en grå mössa. Det står ’Jaha. Tack’, och det står ’Högst upp står det fotboll’. Jag vet att ett kort ’Jaha’ kan låta som att man är besviken, och att man kan önska sig en sak och få en annan. Alltså tror jag att han inte menar att mössan är jättefin. Stämmer det med resten? Jag läser vidare. Han drar på sig mössan och ler mot farbror. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Fotboll." }
            - { rubrik: "Fråga 2 · mellan raderna, Det som menas", text: "Ledtrådarna: ”Jaha. Tack”; ”Den är jättefin”; ”Högst upp står det fotboll”; ”I paketet ligger en grå mössa”.\nSvar som texten stöder: att han inte tycker att mössan är jättefin, att han hoppades på en fotboll och är besviken, men vill vara snäll mot farbror. Han kan också tycka att mössan är okej, men att en fotboll hade varit bättre. Ge gärna ordet besviken.\nEn tanke att pröva: ”Han tycker att den är fin, för han säger det.” Eleven tror på orden och hoppar över vad han har önskat.\nFråga tillbaka: ”Vad står högst upp på listan, och vad ligger i paketet?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Jaha. Tack”; ”Den är jättefin”; ”Högst upp står det fotboll”; ”Jag drar på mig mössan och ler mot farbror”.\nSvar som texten stöder: för att inte såra farbror, eller för att vara artig. De håller när eleven visar en ledtråd. Ge gärna ordet besviken.\nEn tanke att pröva: ”För att han är glad.” Eleven bygger på leendet och hoppar över önskelistan.\nFråga tillbaka: ”Vad hade han önskat sig, och vad fick han?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att eleven svarar snällt som Ibrahim, eller att hen säger att hen hade önskat sig en fotboll men tackar ändå. Ett bra svar tar med att Ibrahim inte säger vad han tycker, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Farbror har köpt en grå mössa. Varför tror ni att han valde just den?”; ”Ibrahim ler mot farbror. Vad kan farbror tänka då?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Högst upp står det fotboll”." }
    - rubrik: "Lärarens sida: Lättläst, text 11, Handskarna"
      text:
        - "Det som står mellan raderna: Hanna är glad eller stolt över sin räddning och ledsen eller besviken över att laget förlorade, båda på en gång. Hon tar inte av handskarna och står kvar i målet. Ordet straffen betyder här en straffspark som hon stoppade."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad brukar hända efter en match när lagen går av planen?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Men vi förlorade.” Något passar inte ihop: Hanna ler lite, men direkt efteråt säger hon att de förlorade." }
            - { rubrik: "Tänka högt · fråga 3, Känsla", text: "”Hmm, här står inte hur Hanna känner sig. Jag ser framför mig en målvakt som står kvar i målet. Det står ’Hanna ler lite’, och sedan står det ’Men vi förlorade’. Jag vet att man är stolt när man har gjort något bra, och att det känns tråkigt när laget förlorar. Alltså tror jag att Hanna känner båda sakerna på en gång. Stämmer det med resten? Jag läser vidare. Hon sparkar en tom flaska till bänken och tar inte av handskarna. Ja, hon är både stolt och besviken.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Att Hanna räddade straffen." }
            - { rubrik: "Fråga 2 · mellan raderna, Ordet", text: "Ledtrådarna: ”Matchen är slut”; ”Hanna står kvar i målet”; ”Du räddade straffen”.\nSvar som texten stöder: en straffspark i fotboll, ett skott på mål som Hanna stoppade när hon stod i mål. Visa gärna med en boll och ett mål.\nEn tanke att pröva: ”Att Hanna fick ett straff.” Eleven känner bara till straff som något man får när man har gjort fel. Här är det en spark i fotboll, och eleven ser inte att hon står i mål och räddar.\nFråga tillbaka: ”Vad gör den som står i mål, och vad betyder räddade?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”Hanna ler lite”; ”Men vi förlorade”; ”Hon sparkar en tom flaska hela vägen till bänken”.\nSvar som texten stöder: stolt eller glad över räddningen, eller ledsen, besviken eller arg över förlusten, eller båda på en gång. De håller när eleven visar en ledtråd, som ”Hanna ler lite” eller flaskan. Ge gärna orden stolt, besviken och ledsen.\nEn tanke att pröva: ”Bara glad, för hon ler.” Eleven ser leendet men missar vad hon säger direkt efter.\nFråga tillbaka: ”Vad säger Hanna direkt efter leendet?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att säga att hon ändå var bäst på planen, eller att säga att det är tråkigt att förlora. Ett bra svar nämner räddningen eller förlusten ur texten, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Hanna tar inte av sig handskarna. Varför tror ni att hon låter dem sitta kvar?”; ”Hanna säger ’Jag vet’. Vad kan hon mena? Kan hon mena något annat?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Hanna ler lite” och ”Men vi förlorade”. Vid fråga 2 pekar du på ”Matchen är slut”. Läs gärna ordet resultattavlan högt." }
    - rubrik: "Lärarens sida: Lättläst, text 12, Skramlet i hallen"
      text:
        - "Det som står mellan raderna: Familjen ska åka iväg i några dagar, och allt är annorlunda för att något stort väntar. Innan mamma väckte Lea hade någon lagt fram kläder och ställt väskan vid dörren."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Vissa elever har fått lämna sitt hem under lång tid. Peka på ”till söndag”, så att alla ser att resan är kort, och fråga inte om elevernas egna resor." }
            - { rubrik: "Före läsningen", text: "Vad kan en granne hjälpa till med?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Pappa gav grannen nyckeln.” Något är konstigt: varför ger man sin nyckel till grannen?" }
            - { rubrik: "Tänka högt · fråga 3, Varför", text: "”Vänta, här står inte vad familjen ska göra. Jag ser framför mig en mörk morgon, en väska vid dörren och pappa som räcker över en nyckel. Det står ’Det var mörkt ute’, och det står ’Pappa gav grannen nyckeln’. Jag vet att man lämnar nyckeln till grannen när man ska vara borta. Och jag vet att man går upp tidigt när man ska hinna med något. Alltså tror jag att familjen ska åka iväg. Stämmer det med resten? Jag läser vidare. Sedan står det ’Vattna blommorna till söndag’, så de är borta några dagar. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Nyckeln." }
            - { rubrik: "Fråga 2 · mellan raderna, Vem, syftning", text: "Ledtrådarna: ”Pappa gav grannen nyckeln”; ”Vattna blommorna till söndag”; ”sa han”.\nSvar som texten stöder: pappa, för det är han som ger bort nyckeln och ber grannen om hjälp.\nEn tanke att pröva: ”Grannen, för det står ’grannen’ precis innan.” Men det är grannen som får nyckeln, och pappa som ber om hjälp.\nFråga tillbaka: ”Vem ger bort nyckeln, och vem får den?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Det var mörkt ute”; ”Pappa gav grannen nyckeln”; ”Vattna blommorna till söndag”; ”väskan stod vid dörren”.\nSvar som texten stöder: de ska resa bort och komma tillbaka på söndag, eller åka långt bort till en fest eller ett bröllop. Svaren håller när eleven visar en ledtråd och säger att familjen åker bort.\nEn tanke att pröva: ”De ska till skolan.” Eleven ser bara väskan.\nFråga tillbaka: ”Varför ger man grannen nyckeln och ber hen vattna blommorna till söndag?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att Lea tar sin kanin och väskan och följer mamma och pappa ut genom dörren, eller att hon frågar vart de ska. Ett bra svar tar med kaninen, väskan eller att mamma frågar tre gånger om de har allt, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Lea smyger ner sin mjuka kanin i väskan. Varför tror ni att hon smyger?”; ”Mamma frågar ’Har vi allt?’ tre gånger. Varför tror ni att hon frågar så många gånger?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Vattna blommorna till söndag”." }
    - rubrik: "Lärarens sida: Lättläst, text 13, Listan"
      text:
        - "Det som står mellan raderna: Jonna fick rollen som drottning och berättaren bara ett träd. Berättaren är glad och stolt för Jonnas skull men också besviken och lite avundsjuk, och försöker trösta sig själv."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Hur kan man få veta vem som får vilken roll i en skolpjäs?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Träd är viktiga’, säger jag till alla.” Något är konstigt: varför försvarar någon ett träd?" }
            - { rubrik: "Tänka högt · fråga 2, Känsla", text: "”Vänta, här står inte hur berättaren känner sig. Jag ser framför mig en lista på en dörr och någon som kramar sin kompis länge. Det står ’träd nummer två’, och det står ’Träd är viktiga’. Jag vet att man kan vara glad för en kompis och ändå bli besviken. Alltså tror jag att berättaren är både glad och besviken. Stämmer det med resten? Jag läser vidare. Berättaren läser listan igen. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Drottning." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”kramar henne länge”; ”träd nummer två”; ”De står still och syns hela tiden”; ”läser listan igen”.\nSvar som texten stöder: glad och stolt för Jonnas skull och samtidigt besviken eller avundsjuk. Ge gärna orden stolt, besviken och avundsjuk. Svarar eleven bara besviken håller det också om hen visar en ledtråd. Fråga då efter kramen.\nEn tanke att pröva: ”Glad, för hen kramar Jonna.” Eleven ser kramen och missar att berättaren läser listan igen.\nFråga tillbaka: ”Varför läser berättaren listan igen?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Träd är viktiga”; ”De står still och syns hela tiden”; ”träd nummer två”.\nSvar som texten stöder: för att trösta sig själv eller dölja besvikelsen, eller för att hen vill se något bra i sin roll. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Bara för att träd är viktiga.” Eleven tar orden rakt av och ser inte att berättaren läser listan igen.\nFråga tillbaka: ”Vad gör berättaren när Jonna har gått hem?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att bara säga grattis, som berättaren gör, eller att säga grattis och också att det känns tråkigt att bli träd. Ett bra svar nämner något berättaren säger eller gör, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att berättaren gör på scenen som träd nummer två?”; ”Berättaren läser listan igen. Vad kan hen leta efter? Kan det vara något annat?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”träd nummer två”." }
    - rubrik: "Lärarens sida: Lättläst, text 14, Ny regel"
      text:
        - "Det som står mellan raderna: Innan texten börjar brände pappa middagen, och därför äter de flingor. Pappa kallar det en ny regel för att slippa säga att maten blev förstörd. Yara kan tro på det, eller förstå och spela med."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad kan pipa i taket i ett hem?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Pannan i diskhon var helt svart, och fönstret stod öppet.” Något är konstigt: ett pip i taket, en handduk och en svart panna hör inte till en vanlig middag." }
            - { rubrik: "Tänka högt · fråga 2, Före och efter", text: "”Vänta, här står inte vad som har hänt i köket. Jag ser framför mig pappa som viftar med en handduk mot taket. Det står ’Det pep i taket, och pappa viftade med en handduk’, och det står ’Pannan i diskhon var helt svart’. Jag vet att det piper när det är rök, och att en svart panna betyder bränd mat. Alltså tror jag att pappa brände middagen. Stämmer det med resten? Jag läser vidare. Pappa säger ’Flingor till middag’. Ja, det stämmer, för maten i pannan kan man inte äta.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "En handduk." }
            - { rubrik: "Fråga 2 · mellan raderna, Före och efter", text: "Ledtrådarna: ”Det pep i taket, och pappa viftade med en handduk”; ”Pannan i diskhon var helt svart”; ”fönstret stod öppet”.\nSvar som texten stöder: pappa har bränt middagen, röken fick det att pipa, och han öppnade fönstret och viftade bort röken. Ge gärna orden bränna, rök och brandvarnare.\nEn tanke att pröva: ”Pappa diskade pannan.” Eleven bygger på en enda ledtråd, pannan i diskhon, och missar pipet och handduken.\nFråga tillbaka: ”Varför viftar pappa med en handduk mot taket?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Det som menas", text: "Ledtrådarna: ”Ny regel, Yara”; ”Flingor till middag”; ”Pannan i diskhon var helt svart”.\nSvar som texten stöder: pappa vill inte säga att middagen blev förstörd, så han gör flingorna till något roligt och kallar det en regel, eller han vill göra det roligt så att Yara inte blir ledsen. De håller när eleven visar en ledtråd. Ge gärna ordet generad.\nEn tanke att pröva: ”För att pappa gillar flingor.” Eleven tar pappas ord rakt av och missar vad som hänt i köket.\nFråga tillbaka: ”Vad var det med pannan i diskhon?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att tycka att det var kul med flingor, eller att tycka att pappa borde ha sagt som det var. Ett bra svar tar med något ur texten, som regeln eller pannan, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Det piper i taket, och pappa viftar med en handduk. Vad tror ni att Yara gör då?”; ”Yara hoppas att pappa lagar mat varje dag. Varför kan hon hoppas det?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Pannan i diskhon var helt svart”." }
    - rubrik: "Lärarens sida: Lättläst, text 15, Hassans jacka"
      text:
        - "Det som står mellan raderna: Berättaren spillde saft på Hassans jacka och har försökt tvätta bort fläcken. Hassan vill ha jackan tillbaka i morgon, och berättaren säger bara tack för lånet och inget om fläcken."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad brukar man tänka på när man lånar något av en kompis?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Nu syns den nästan inte om man håller armen så här.” Något är konstigt: varför behöver man hålla armen på ett särskilt sätt?" }
            - { rubrik: "Tänka högt · fråga 2, Före och efter", text: "”Vänta, här står inte vad som har hänt med jackan. Jag ser framför mig en lila fläck på en ärm. Det står ’Fläcken på ärmen är lila, precis som saften jag drack’, och det står ’Nu syns den nästan inte’. Jag vet att lila saft ger lila fläckar. Alltså tror jag att berättaren spillde saft på jackan. Stämmer det med resten? Jag läser vidare. Hassan vill ha jackan tillbaka i morgon, och berättaren säger bara ’Tack för lånet!’ Ja, det stämmer, för hen säger inget om fläcken.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Lila." }
            - { rubrik: "Fråga 2 · mellan raderna, Före och efter", text: "Ledtrådarna: ”Jag fick låna Hassans jacka i går”; ”Fläcken på ärmen är lila, precis som saften jag drack”; ”Jag har tvättat den två gånger”.\nSvar som texten stöder: berättaren har spillt saft på ärmen och försökt tvätta bort fläcken.\nEn tanke att pröva: ”Fläcken fanns redan när berättaren fick jackan.” Eleven tror att berättaren bara hjälper till, men saften är lila som fläcken.\nFråga tillbaka: ”Vad mer är lila, och vem drack det?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Före och efter", text: "Ledtrådarna: ”I morgon åker vi på utflykt”; ”Hassan vill ha jackan tillbaka”; ”syns den nästan inte”; ”Tack för lånet”.\nSvar som texten stöder: Hassan ser fläcken och blir ledsen eller arg, eller berättaren erkänner före utflykten, eller fläcken syns inte och ingen märker något. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Ingenting, för hen sa tack för lånet.” Eleven tror på orden och ser inte att berättaren döljer fläcken.\nFråga tillbaka: ”Varför håller berättaren armen så här?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att eleven berättar för Hassan i förväg, eller att hen lämnar tillbaka jackan och hoppas att ingen ser fläcken. Ett bra svar nämner fläcken, utflykten eller Hassan, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Berättaren fick låna jackan i går. Vad tror ni att Hassan sa när han lånade ut den?”; ”Berättaren svarade ’Tack för lånet!’ Varför tror ni att hen inte sa som det var?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Fläcken på ärmen är lila, precis som saften jag drack”." }
    - rubrik: "Lärarens sida: Lättläst, kartläggning före, Bland vagnarna"
      text:
        - "Det som står mellan raderna: Alva har kommit bort från sin mamma och är rädd. Hon är i en stor affär."
      delar:
        - rubrik: Kartläggningen
          falt:
            - { rubrik: "Så gör du", text: "Eleven gör kartläggningen enskilt med dig utanför passen, på fem till åtta minuter. Ställ ingen fråga före läsningen, och stanna inte. Läs texten högt en gång, och låt sedan eleven läsa den själv. Eleven svarar muntligt, och du skriver i protokollet. Den första frågan ger 1 poäng, och fråga 2 och fråga 3 ger 0–2 poäng var, högst 5 poäng. Fråga tillbaka bara om eleven inte svarar, och skriv då ett h efter poängen." }
            - { rubrik: "Känsligt", text: "Att komma bort kan vara skrämmande, och en del elever kan ha varit med om det. Påminn om att man kan fråga en vuxen som jobbar där." }
            - { rubrik: "Fråga 1 · på raderna", text: "Sin nalle." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”Mammas röda jacka syns ingenstans”; ”kramar sin nalle”; ”så tyst att ingen hör”.\nSvar som texten stöder: rädd, orolig, ensam, vilsen eller ledsen, för att hon har kommit bort från mamma.\nEn tanke att pröva: ”Arg, för hon ropar.” Eleven ser att hon ropar men missar ”så tyst att ingen hör”.\nFråga tillbaka: ”Hur ropar hon, och vad håller hon i?”\nPoäng: 2 poäng för en slutsats som texten stöder, med ledtråd (”Rädd, för hon kramar nallen”). 1 poäng för ett svar som texten stöder utan ledtråd (”Rädd.”) eller en ledtråd utan slutsats (”Hon kramar sin nalle.”). 0 poäng för ett svar som texten inte stöder (”Glad.” eller ”Arg.”) eller inget svar. Samma poängregel gäller i kartläggningen efter." }
            - { rubrik: "Fråga 3 · mellan raderna, Var och när", text: "Ledtrådarna: ”en stor hög med apelsiner”; ”Vagnar rullar förbi”; ”En röst i taket säger att fisken är billig”.\nSvar som texten stöder: i en stor affär, en butik eller ett varuhus.\nEn tanke att pröva: ”På ett torg, för där finns apelsiner.” Eleven bygger på en enda ledtråd, och en röst i taket och vagnar hör inte hemma utomhus.\nFråga tillbaka: ”Var finns en röst i taket och vagnar som rullar förbi?”\nPoäng: 2 poäng för en affär, butik eller ett varuhus med minst en ledtråd. 1 poäng för rätt plats utan ledtråd, eller en ledtråd utan plats (”Det finns vagnar.”). 0 poäng för en plats som texten inte stöder eller inget svar." }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att eleven står kvar och väntar eller ber någon som jobbar där om hjälp, eller att eleven går och letar själv. Ett bra svar tar med att Alva ropar tyst eller att mamma inte syns, och ger ett eget skäl." }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Mammas röda jacka syns ingenstans”. Säg att apelsiner är en frukt, om eleven inte känner ordet." }
    - rubrik: "Lärarens sida: Lättläst, kartläggning efter, Bilden till mormor"
      text:
        - "Det som står mellan raderna: Viggo har en bild till mormor och väntar på en avgång som har flyttats, och han är otålig och lite orolig. Han är på en station eller en flygplats."
      delar:
        - rubrik: Kartläggningen
          falt:
            - { rubrik: "Så gör du", text: "Eleven gör kartläggningen enskilt med dig utanför passen, på fem till åtta minuter. Ställ ingen fråga före läsningen, och stanna inte. Läs texten högt en gång, och låt sedan eleven läsa den själv. Eleven svarar muntligt, och du skriver i protokollet. Den första frågan ger 1 poäng, och fråga 2 och fråga 3 ger 0–2 poäng var, högst 5 poäng. Fråga tillbaka bara om eleven inte svarar, och skriv då ett h efter poängen." }
            - { rubrik: "Fråga 1 · på raderna", text: "Bilden till mormor." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”Bilden till mormor är skrynklig i hans hand”; ”En röst i taket ropar ut en ny tid”; ”tittar på klockan, sedan på tavlan, sedan på klockan igen”.\nSvar som texten stöder: otålig, orolig, spänd, nervös, stressad eller ivrig, för att han väntar och tiden har ändrats.\nEn tanke att pröva: ”Glad, han ska ju träffa mormor.” Texten säger inte att han är glad, och att han tittar på klockan gång på gång visar att han är otålig.\nFråga tillbaka: ”Hur ofta tittar han på klockan, och varför gör man så?”\nPoäng: 2 poäng för en slutsats som texten stöder, med ledtråd (”Otålig, för han tittar på klockan om och om igen”). 1 poäng för ett svar som texten stöder utan ledtråd (”Otålig.”) eller en ledtråd utan slutsats (”Han tittar på klockan.”). 0 poäng för ett svar som texten inte stöder (”Glad.” eller ”Arg.”) eller inget svar. Samma poängregel gäller i kartläggningen före." }
            - { rubrik: "Fråga 3 · mellan raderna, Var och när", text: "Ledtrådarna: ”en tavla med tider”; ”Folk drar väskor förbi honom”; ”En röst i taket ropar ut en ny tid”.\nSvar som texten stöder: på en station eller en flygplats, till exempel en tågstation eller en busstation.\nEn tanke att pröva: ”Hos mormor, för bilden är till mormor.” Eleven tar ett ord ur en enda mening och ser inte tavlan med tider eller folket med väskor.\nFråga tillbaka: ”Vad visar en tavla med tider, och vart är folk på väg med väskor?”\nPoäng: 2 poäng för en station, en flygplats eller en busstation med minst en ledtråd. 1 poäng för rätt plats utan ledtråd, eller en ledtråd utan plats (”Folk har väskor.”). 0 poäng för en plats som texten inte stöder eller inget svar." }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att eleven väntar kvar och tittar på tavlan, eller att eleven sätter sig ner och slätar ut bilden till mormor. Ett bra svar tar med att tiden har ändrats eller att bilden är skrynklig, och ger ett eget skäl." }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”tittar på klockan, sedan på tavlan, sedan på klockan igen”. Ge gärna orden skrynklig (full av veck) och ”tavla med tider”." }
    - rubrik: "Lättläst, kartläggning före: Bland vagnarna"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Poängen", text: "Lärarens sida för kartläggningen före, och protokollet i planeringsmallarna." }
      listor:
        - rubrik: "Bland vagnarna"
          rader:
            - ["Alva står bredvid en stor hög med apelsiner.\nMammas röda jacka syns ingenstans.\nVagnar rullar förbi henne åt alla håll.\nEn röst i taket säger att fisken är billig.\nAlva kramar sin nalle\noch ropar ”Mamma?” så tyst att ingen hör."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad kramar Alva?"]
            - ["2. Hur känner sig Alva?\nHur vet du det?"]
            - ["3. Var är Alva?\nHur vet du det?"]
            - ["4. Vad hade du gjort i Alvas ställe?\nVarför?"]
    - rubrik: "Lättläst, text 1: Staketet"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 1." }
      listor:
        - rubrik: "Staketet"
          rader:
            - ["Amina står vid staketet\nmedan de andra hoppar elastik.\nHon gungar på tårna i takt, fast ingen ser det."]
            - ["”Amina!” ropar en flicka.\n”Vi behöver en till!”\n”Jag kan nog inte”, säger hon.\nSedan släpper hon staketet.\nEfter tre hopp hör hon inte ens\natt klockan ringer."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad gör Amina med tårna?"]
            - ["2. Vem säger ”Jag kan nog inte”?\nHur vet du det?"]
            - ["3. Hur känner sig Amina i början och i slutet?\nHur vet du det?"]
            - ["4. Amina står vid staketet.\nVad hade du gjort i hennes ställe?\nVarför?"]
    - rubrik: "Lättläst, text 2: Elva prickar"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 2." }
      listor:
        - rubrik: "Elva prickar"
          rader:
            - ["Stolen surrar och åker bakåt.\nLampan lyser mig rakt i ögonen.\nJag räknar prickarna i taket, och det är elva.\nHon har munskydd och blå handskar.\nHon frågar: ”Hur går det, Nils?”\n”Jättebra”, säger jag till taket.\n”Gapa stort”, säger hon, och det slurpar.\nStolen surrar upp igen, och jag säger: ”Redan?”"]
        - rubrik: Frågorna
          rader:
            - ["1. Vad har hon på händerna?"]
            - ["2. Var är Nils?\nHur vet du det?"]
            - ["3. Hur känner sig Nils i stolen?\nHur vet du det?"]
            - ["4. Nils räknar prickar i taket.\nVad hade du gjort i hans ställe?\nVarför?"]
    - rubrik: "Lättläst, text 3: Tio minuter"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 3." }
      listor:
        - rubrik: "Tio minuter"
          rader:
            - ["Sigrid öppnar dörren och stannar.\nBlomkrukan ligger på sidan i en hög med jord.\nSmå tassavtryck går upp på soffan.\nLillebrors spade ligger på mattan.\nPå hyllan sitter katten med jord på nosen.\nDet är tyst i lillebrors rum.\nOm tio minuter kommer mamma hem."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad har katten på nosen?"]
            - ["2. Vad har hänt i rummet innan Sigrid öppnar dörren?\nHur vet du det?"]
            - ["3. Vem eller vilka har varit i rummet före Sigrid?\nHur vet du det?"]
            - ["4. Mamma kommer snart hem.\nVad hade du gjort i Sigrids ställe?\nVarför?"]
    - rubrik: "Lättläst, text 4: Hunden med glasögon"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 4." }
      listor:
        - rubrik: "Hunden med glasögon"
          rader:
            - ["Theo läser i en bok mellan höga hyllor.\nPlötsligt skrattar han rakt ut.\nFyra huvuden vänder sig om,\noch någon säger ”Schh!”"]
            - ["”Viska nu”, viskar morfar.\nMen hans axlar skakar.\n”Hunden har glasögon!” viskar Theo för högt.\nVid disken piper lånekortet."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad piper vid disken?"]
            - ["2. Var är Theo och morfar?\nHur vet du det?"]
            - ["3. Hur känner sig morfar när Theo skrattar?\nHur vet du det?"]
            - ["4. Någon säger ”Schh!”\nVad hade du gjort i Theos ställe?\nVarför?"]
    - rubrik: "Lättläst, text 5: Bara vinden"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 5." }
      listor:
        - rubrik: "Bara vinden"
          rader:
            - ["Milo lägger sitt halva äpple utanför tältet\noch släcker ficklampan.\nSniff, sniff, smack.\n”Hörde du det?” viskar Elsa.\n”Det är bara vinden”, säger Milo.\n”Vinden smackar inte.”\nElsa drar i blixtlåset en gång till,\nfast det är stängt.\nMilo lyser ut.\nEn liten nos sniffar på äpplet."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad lägger Milo utanför tältet?"]
            - ["2. Hur känner sig Elsa när hon hör ljudet?\nHur vet du det?"]
            - ["3. Vem eller vad var det som smackade?\nHur vet du det?"]
            - ["4. Vad tror du att Milo och Elsa gör sedan?\nVarför?"]
    - rubrik: "Lättläst, text 6: Den nya luggen"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 6." }
      listor:
        - rubrik: "Den nya luggen"
          rader:
            - ["Tilde frågar: ”Vad tycker du om min nya lugg?”\nDen är kortare på ena sidan.\nNoel tittar väldigt länge på den.\n”Den är ny. Och bra, mycket bra”, säger han.\nFörsiktigt sätter han sin keps på hennes huvud.\n”Tack. Jag vet”, säger Tilde."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad sätter Noel på Tildes huvud?"]
            - ["2. Vad tycker Noel om Tildes lugg?\nHur vet du det?"]
            - ["3. Vad menar Tilde när hon säger ”Jag vet”?\nHur vet du det?"]
            - ["4. Var det rätt av Noel att svara som han gjorde?\nVarför?"]
    - rubrik: "Lättläst, text 7: Den tomma plåten"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 7." }
      listor:
        - rubrik: "Den tomma plåten"
          rader:
            - ["Plåten på bänken är tom,\noch kvar ligger bara smulor och strösocker."]
            - ["”Mormor, bullarna är borta!” ropar Juni.\n”Jaså? Det var nog lillebror”, säger mormor.\nStrösockret ligger ända fram till mormors stol.\nLillebror sover i soffan, och hans händer är rena.\nMormor torkar sig snabbt om munnen."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad ligger kvar på plåten?"]
            - ["2. Hur känner sig Juni när hon ropar på mormor?\nHur vet du det?"]
            - ["3. Vem tror du tog bullarna?\nHur vet du det?"]
            - ["4. Mormor säger ”Det var nog lillebror”.\nVad hade du sagt i Junis ställe?\nVarför?"]
    - rubrik: "Lättläst, text 8: Den där strumpan"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 8." }
      listor:
        - rubrik: "Den där strumpan"
          rader:
            - ["Otto står i dörren och tittar på sin systers spel.\n”Jag letar efter min strumpa”, säger han.\n”Du har den på foten”, säger Freja.\nEfter en stund är han tillbaka.\n”Jag letar efter mitt glas.”\n”Du håller ju i det”, säger hon.\nFreja flyttar sig åt sidan\noch räcker honom tärningen."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad säger Otto att han letar efter första gången?"]
            - ["2. Varför står Otto i dörren?\nHur vet du det?"]
            - ["3. Hur känner sig Freja när Otto kommer tillbaka?\nHur vet du det?"]
            - ["4. Freja säger ”Du har den på foten”.\nVad hade du sagt till Otto i hennes ställe?\nVarför?"]
    - rubrik: "Lättläst, text 9: Högst upp"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 9." }
      listor:
        - rubrik: "Högst upp"
          rader:
            - ["Kasper står högst upp på hopptornet.\nLångt nere i det blå vattnet\nsimmar alla kompisarna.\nEster ropar till honom: ”Får du kalla fötter?”\n”Nej!” säger Kasper, men han backar ett steg.\nHan tittar på sina fötter.\nDe är varma av solen."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad tittar Kasper på?"]
            - ["2. Vad menar Ester med ”kalla fötter”?\nHur vet du det?"]
            - ["3. Varför säger Kasper ”Nej!”?\nHur vet du det?"]
            - ["4. Kompisarna simmar redan i vattnet.\nVad hade du gjort i Kaspers ställe?\nVarför?"]
    - rubrik: "Lättläst, text 10: Det blå papperet"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 10." }
      listor:
        - rubrik: "Det blå papperet"
          rader:
            - ["Jag river av det blå papperet.\nI paketet ligger en grå mössa.\n”Jaha. Tack”, säger jag."]
            - ["”Gillar du den, Ibrahim?” frågar farbror.\n”Den är jättefin.”\nPå kylskåpet sitter min önskelista.\nHögst upp står det fotboll.\nJag drar på mig mössan och ler mot farbror."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad står högst upp på önskelistan?"]
            - ["2. Vad tänker Ibrahim\nnär han säger ”Den är jättefin”?\nHur vet du det?"]
            - ["3. Varför ler Ibrahim mot farbror?\nHur vet du det?"]
            - ["4. Farbror frågar om Ibrahim gillar mössan.\nVad hade du svarat?\nVarför?"]
    - rubrik: "Lättläst, text 11: Handskarna"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 11." }
      listor:
        - rubrik: "Handskarna"
          rader:
            - ["Matchen är slut.\nResultattavlan visar 2 mot 3.\nHanna står kvar i målet.\nFarmor ropar från sidan: ”Du räddade straffen!”\nHanna ler lite.\n”Jag vet”, säger hon.\n”Men vi förlorade.”\nHon sparkar en tom flaska hela vägen till bänken.\nHandskarna tar hon inte av."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad ropar farmor från sidan?"]
            - ["2. Vad menar farmor med ”straffen”?\nHur vet du det?"]
            - ["3. Hur känner sig Hanna efter matchen?\nHur vet du det?"]
            - ["4. Hanna säger ”Men vi förlorade”.\nVad hade du sagt till henne i farmors ställe?\nVarför?"]
    - rubrik: "Lättläst, text 12: Skramlet i hallen"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 12." }
      listor:
        - rubrik: "Skramlet i hallen"
          rader:
            - ["I dag blev jag väckt av skrammel i hallen.\n”Lea, dags att vakna”, viskade mamma.\nDet var mörkt ute.\nMina fina byxor låg framme på stolen,\noch väskan stod vid dörren.\nPappa gav grannen nyckeln.\n”Vattna blommorna till söndag”, sa han.\n”Har vi allt?” sa mamma tre gånger.\nJag smög ner min mjuka kanin i väskan."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad gav pappa till grannen?"]
            - ["2. Vem säger ”Vattna blommorna till söndag”?\nHur vet du det?"]
            - ["3. Vad ska familjen göra i dag?\nHur vet du det?"]
            - ["4. Vad tror du att Lea gör sedan?\nVarför?"]
    - rubrik: "Lättläst, text 13: Listan"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 13." }
      listor:
        - rubrik: "Listan"
          rader:
            - ["Listan sitter på dörren till gympasalen.\nJonna är drottning, och jag är träd nummer två.\n”Grattis!” säger jag och kramar henne länge.\n”Träd är viktiga”, säger jag till alla.\n”De står still och syns hela tiden.”\nSedan går Jonna hem, och jag läser listan igen."]
        - rubrik: Frågorna
          rader:
            - ["1. Vilken roll ska Jonna ha?"]
            - ["2. Hur känner sig den som berättar?\nHur vet du det?"]
            - ["3. Varför säger berättaren att träd är viktiga?\nHur vet du det?"]
            - ["4. Berättaren säger grattis till Jonna.\nVad hade du sagt i berättarens ställe?\nVarför?"]
    - rubrik: "Lättläst, text 14: Ny regel"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 14." }
      listor:
        - rubrik: "Ny regel"
          rader:
            - ["Onsdag.\nDet pep i taket, och pappa viftade med en handduk.\nPannan i diskhon var helt svart,\noch fönstret stod öppet.\nPappa sa: ”Ny regel, Yara. Flingor till middag.”\nDet var den bästa regeln någonsin.\nJag hoppas att pappa lagar mat varje dag."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad viftar pappa med?"]
            - ["2. Vad har hänt i köket innan de äter?\nHur vet du det?"]
            - ["3. Varför säger pappa ”Ny regel” om flingorna?\nHur vet du det?"]
            - ["4. Yara tycker att det är den bästa regeln någonsin.\nVad hade du tyckt?\nVarför?"]
    - rubrik: "Lättläst, text 15: Hassans jacka"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Lättläst, text 15." }
      listor:
        - rubrik: "Hassans jacka"
          rader:
            - ["Jag fick låna Hassans jacka i går.\nFläcken på ärmen är lila,\nprecis som saften jag drack.\nJag har tvättat den två gånger.\nNu syns den nästan inte\nom man håller armen så här.\nI morgon åker vi på utflykt,\noch Hassan vill ha jackan tillbaka.\nJag svarade: ”Tack för lånet!”"]
        - rubrik: Frågorna
          rader:
            - ["1. Vilken färg har fläcken på ärmen?"]
            - ["2. Vad har hänt med Hassans jacka\nmedan berättaren har haft den?\nHur vet du det?"]
            - ["3. Vad händer troligen\nnär Hassan får tillbaka jackan?\nHur vet du det?"]
            - ["4. Vad hade du gjort i berättarens ställe?\nVarför?"]
    - rubrik: "Lättläst, kartläggning efter: Bilden till mormor"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Poängen", text: "Lärarens sida för kartläggningen efter, och protokollet i planeringsmallarna." }
      listor:
        - rubrik: "Bilden till mormor"
          rader:
            - ["Viggo står bredvid en tavla med tider.\nBilden till mormor är skrynklig i hans hand.\nFolk drar väskor förbi honom åt alla håll.\nEn röst i taket ropar ut en ny tid.\nViggo tittar på klockan,\nsedan på tavlan, sedan på klockan igen."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad har Viggo i handen?"]
            - ["2. Hur känner sig Viggo?\nHur vet du det?"]
            - ["3. Var är Viggo?\nHur vet du det?"]
            - ["4. Vad hade du gjort i Viggos ställe?\nVarför?"]
    - rubrik: "Lärarens sidor: Mellan"
      text:
        - "Här är de femton texterna på nivån Mellan och kartläggningens två. Tabellen visar vad varje text handlar om, vad eleven ska lista ut, vilka slags frågor mellan raderna texten har, hur svår den är och om den har en vändning eller är känslig. Efter tabellen har varje text en egen sida med det du behöver i passet: det som står mellan raderna, var du stannar, vad du säger när du tänker högt, svaren och två öppna frågor till samtalet. Frågorna står på elevens blad, så ha din kopia bredvid."
      oversikt:
        kolumner: [Texten, Handlar om, Eleven listar ut, Frågornas slag, Svårighet]
        rader:
          - ["1. Längst bak", "Berättaren och pojken i bänken framför, i klassrummet och på skolgården under en dag.", "hur någon känner sig", "Varför, Känsla", "1, enkel, känslig"]
          - ["2. Skrapet på dörren", "Elias och pappa hemma en tidig morgon.", "var och när det händer", "Var och när, Före och efter", "1, enkel, känslig"]
          - ["3. Mössan", "Moa och Kian vid ett staket under en klassresa.", "vem någon är, eller vem ett ord syftar på", "Vem (syftning), Var och när, Känsla", "1, enkel"]
          - ["4. Vid samma bord", "Ines och Malte vid samma bord under en mattelektion.", "vad ett ord betyder just här", "Varför, Ordet", "1, enkel, känslig"]
          - ["5. Bänken", "Hedda, Tobias och Isak i ett klassrum.", "vem någon är", "Varför (två frågor), Vem", "2, medel, vändning"]
          - ["6. Till författaren", "Bilal skriver ett brev en kväll hemma.", "hur någon känner sig", "Känsla, Varför (två frågor)", "2, medel"]
          - ["7. Kartongen", "Samir och mormor vid en gammal kartong hemma hos mormor.", "vad som hände innan, eller vad som händer sedan", "Vem (syftning), Före och efter", "2, medel"]
          - ["8. Lördag klockan 14", "Nour, Arvid och Zahra skriver i sin gruppchatt en kväll.", "vad någon egentligen menar", "Vem (syftning), Känsla, Det som menas", "2, medel, känslig"]
          - ["9. Hinken i hallen", "Nova och pappa i hallen en morgon.", "vad som hände innan, eller vad som händer sedan", "Före och efter (två frågor), Känsla", "2, medel"]
          - ["10. Rum 4", "Ronja och Hiba i ett rum mitt i natten.", "vad någon egentligen menar", "Känsla, Det som menas", "2, medel, känslig"]
          - ["11. Torsdag hos farfar", "Selma och farfar i farfars kök en torsdag.", "varför något händer, eller vad någon vill", "Före och efter, Varför", "2, medel, känslig"]
          - ["12. Snöret", "Tyra och Ravi vid en bäck efter skolan.", "vad någon egentligen menar", "Känsla, Det som menas, Varför", "3, svår"]
          - ["13. Skollopp", "En elev som skriver i sin dagbok två kvällar i rad.", "varför något händer, eller vad någon vill", "Före och efter, Varför (två frågor)", "3, svår, vändning, känslig"]
          - ["14. En runda", "Vincent hemma och ute i kvarteret en förmiddag.", "varför något händer, eller vad någon vill", "Varför, Känsla", "3, svår, känslig"]
          - ["15. Någon har varit här", "Ruben hemma en kväll med storasyster och mamma.", "vad som hände innan, eller vad som händer sedan", "Det som menas, Varför, Före och efter", "3, svår, vändning"]
          - ["Kartläggning före: Fem minuter", "Oskar och hans tränare en stund innan något tar slut.", "hur någon känner sig", "Känsla, Var och när", "före insatsen"]
          - ["Kartläggning efter: Två minuter", "Elin och fröken en stund före något som ska börja.", "hur någon känner sig", "Känsla, Var och när", "efter insatsen"]
      delar:
        - rubrik: Så väljer du text
          falt:
            - { rubrik: "Veckans slag", text: "Välj en text med frågor av veckans slag, som progressionen visar: Känsla och Vem i vecka 1, Var och när och Varför i vecka 2, Före och efter i vecka 3, Det som menas i vecka 4–5 och Ordet i vecka 6–8. Metodens texter räcker till ungefär fem veckors pass. Texterna till resten av veckorna, också till Ordet i vecka 6–8, tar du ur serien Mellan raderna eller skriver själv." }
            - { rubrik: "Svårigheten", text: "Börja med svårighet 1, och ta 2 eller 3 när gruppen klarar slutsatsen med mindre stöd. En text med vändning får eleverna att tänka om mot slutet. En känslig text har en rad om det på sin sida. Läs raden före passet, och ta inte två texter om samma slags svåra sak samma vecka." }
            - { rubrik: "Nivåerna", text: "Välj nivå efter gruppen, och blanda gärna, till exempel en text på Lättläst när ni övar ett nytt tankesteg och en på Mellan när det sitter." }
    - rubrik: "Lärarens sida: Mellan, text 1, Längst bak"
      text:
        - "Det som står mellan raderna: Berättaren är ny i klassen, osäker och ensam, men vill egentligen höra till. Jackan som sitter kvar visar att hen inte känner sig hemma."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Elever som själva har bytt skola eller klass kan känna igen sig. Låt dem berätta om de vill, men fråga inte ut någon." }
            - { rubrik: "Före läsningen", text: "Vad gör man första dagen på ett ställe där man inte känner någon?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Jag slog upp matteboken på sidan fyra och läste första raden tre gånger.” Något upprepas, och hen säger en sak och gör en annan: ”Det spelar ingen roll”, men hen läser samma rad tre gånger." }
            - { rubrik: "Tänka högt · fråga 3, Känsla", text: "”Vänta, här står inte hur berättaren mår. Jag ser framför mig någon längst bak som läser samma rad om och om igen. Det står ’Det spelar ingen roll’, och det står ’läste första raden tre gånger’. Jag vet att man läser om samma rad när tankarna är någon annanstans. Alltså tror jag att berättaren är osäker och ensam men vill höra till. Stämmer det med resten? Jag läser vidare. På rasten räknar hen tyst med de andra. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Tre." }
            - { rubrik: "Fråga 2 · mellan raderna, Varför", text: "Ledtrådarna: ”Jackan hängde jag inte upp på kroken”; ”Den fick sitta kvar på ryggen”; ”Det spelar ingen roll”.\nSvar som texten stöder: hen känner sig inte hemma än, vill kunna gå när som helst och vill inte visa att hen bryr sig.\nEn tanke att pröva: ”Hen fryser.” Inget i texten handlar om kyla, och hen sitter inne.\nFråga tillbaka: ”Varför tar man av sig jackan när man sitter inne?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”läste första raden tre gånger”; ”räknade tyst med de andra”; ”Jag tog väskan så snabbt att stolen åkte med”.\nSvar som texten stöder: i början osäker eller ensam men vill vara med, och lättad, stressad eller överraskad när Adam frågar. De håller när eleven visar en ledtråd, som väskan och stolen. Ord att ge i samtalet: osäker, ensam, lättad.\nEn tanke att pröva: ”Hen bryr sig inte, för hen sa att det inte spelar någon roll.” Det bygger på en enda replik.\nFråga tillbaka: ”Vad gör berättaren på rasten och på lunchen, medan de andra leker och pratar?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett bra svar pekar på något i texten, som jackan eller väskan, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att Adam tänker när berättaren tar väskan så snabbt att stolen åker med?”; ”På lunchen håller berättaren på att skratta högt. Vad tror ni att de andra hade gjort om hen hade skrattat?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Jackan hängde jag inte upp på kroken”." }
    - rubrik: "Lärarens sida: Mellan, text 2, Skrapet på dörren"
      text:
        - "Det som står mellan raderna: Pricken har varit instängd i grannens garage eller verkstad medan grannen var bortrest, och kom hem när grannen kom tillbaka och öppnade. Mellan raderna står också varför han kom hem just i morse."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "En elev kan ha haft ett husdjur som inte kom tillbaka. Påminn om att Pricken kommer hem, och låt samtalet handla om Elias." }
            - { rubrik: "Före läsningen", text: "Hur kan man se var någon har varit, om ingen berättar det?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”På ena tassen fanns en blå fläck som fortfarande var klibbig.” Något är konstigt: en katt som har varit ute i naturen får inte färg på tassen." }
            - { rubrik: "Tänka högt · fråga 2, Var och när", text: "”Vänta, här står inte var Pricken har varit. Jag ser framför mig hur Elias kliar honom bakom örat och får något i fingrarna. Det står ’en liten tuss sågspån’, och det står ’en blå fläck som fortfarande var klibbig’. Jag vet att sågspån finns där man sågar, och att färg inte torkar på en gång. Alltså tror jag att han har varit någonstans där man bygger och målar, kanske i ett garage. Stämmer det med resten? Jag läser vidare. Elias säger att han luktar som en målarburk. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "En blå fläck, som fortfarande var klibbig." }
            - { rubrik: "Fråga 2 · mellan raderna, Var och när", text: "Ledtrådarna: ”en liten tuss sågspån”; ”en blå fläck som fortfarande var klibbig”; ”Han luktar som en målarburk”.\nSvar som texten stöder: i ett garage, en verkstad eller ett förråd där någon bygger och målar, kanske hos grannen. Svaren håller när eleven visar en ledtråd. Ord att ge i samtalet: sågspån, verkstad.\nEn tanke att pröva: ”I skogen, för katter är ute.” Men sågspån och färg finns inte i skogen.\nFråga tillbaka: ”Var hittar man sågspån och en målarburk?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Före och efter", text: "Ledtrådarna: ”Grannen kom hem från sin resa sent i går kväll”; ”På andra sidan gården stod grannens garagedörr på glänt”; ”Därifrån hördes radion”.\nSvar som texten stöder: grannen kom hem och öppnade garaget så att Pricken kunde gå ut. Pappa ler, som om han har förstått vad som har hänt.\nEn tanke att pröva: ”Han blev hungrig och kom hem.” Det förklarar inte färgen.\nFråga tillbaka: ”Vem kom hem i går kväll, och vad står på glänt?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att leta och sätta upp lappar, eller att fråga grannarna. Ett bra svar tar med de tre dagarna och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Pappa säger att han ska baka en sockerkaka i dag. Varför tror ni att han vill det?”; ”Pricken var borta i tre dagar. Hur kan han ha haft det, och finns det något vi inte har tänkt på?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Han luktar som en målarburk”. Är ordet sågspån nytt för eleven, förklara det (små bitar trä som blir kvar när man sågar) och peka sedan på ”en liten tuss sågspån”." }
    - rubrik: "Lärarens sida: Mellan, text 3, Mössan"
      text:
        - "Det som står mellan raderna: ”Hon” som tuggar på mössan är ett djur på gården, troligen en get, och mannen i gummistövlar arbetar där. Mellan raderna står också hur Moa känner sig i slutet: mössan är sönder, men hon tar ändå på sig den."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad kan man se och göra på en klassresa till en gård?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Nej, hon där borta, hon tuggar på den!’” Något är konstigt: Kian frågade om Frida, men vem tuggar på en mössa?" }
            - { rubrik: "Tänka högt · fråga 2, Vem", text: "”Vänta, här står inte vem ’hon’ är. Jag ser framför mig hur Moa står vid staketet med händerna i håret. Det står ’luktade hö’, och det står ’hon tuggar på den’. Jag vet att ingen i klassen tuggar på en mössa, men att djur kan göra det. Alltså tror jag att ’hon’ är ett djur. Stämmer det med resten? Jag läser vidare. Mannen säger att hon äter allt, till och med skor, och hon släpper mössan för morötterna. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Tuggar på den." }
            - { rubrik: "Fråga 2 · mellan raderna, Vem, syftning", text: "Ledtrådarna: ”hon tuggar på den”; ”till och med skor”; ”morötter gillar hon ännu mer”.\nSvar som texten stöder: ett djur på gården, till exempel en get.\nEn tanke att pröva: ”Frida.” Kian nämner Frida, men hon äter inte skor.\nFråga tillbaka: ”Vem äter skor och gillar morötter?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Var och när", text: "Ledtrådarna: ”luktade hö och fuktig jord”; ”En man i gummistövlar kom gående med en hink”; ”Han höll upp ett knippe morötter”.\nSvar som texten stöder: en gård med djur, till exempel en bondgård.\nEn tanke att pröva: ”En vanlig trädgård.” Men det luktar hö, och mannen har gummistövlar och en hink.\nFråga tillbaka: ”Var luktar det hö, och vem har gummistövlar och hink?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Känsla", text: "Ledtrådarna: ”Den är ju sönder”; ”Hon tog på sig den ändå”.\nSvar som texten stöder: besviken eller irriterad, eftersom mössan är sönder, eller lättad och road, eftersom hon får tillbaka den och tar på sig den. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Arg på Kian.” Moa säger inget till honom.\nFråga tillbaka: ”Vad gör Moa med mössan, fast hon har sagt att den är sönder?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett svar kan vara att det är okej, eftersom Moa får tillbaka mössan, eller att det inte är snällt, eftersom hon är rädd. Ett bra svar tar ställning, nämner något ur texten och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Mannen i gummistövlar skakar på huvudet. Vad tror ni att han tänker om Moa och Kian?”; ”Moa står med händerna i håret för att mössan har försvunnit. Varför tror ni att den är så viktig för henne?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”till och med skor”." }
    - rubrik: "Lärarens sida: Mellan, text 4, Vid samma bord"
      text:
        - "Det som står mellan raderna: Uttrycket ”ute och cyklar” betyder att man har fel, och Ines tar det bokstavligt. Malte hjälper henne att rätta svaret."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Elever som har lärt sig svenska som andraspråk kan känna igen sig i Ines. Säg att också vuxna missförstår uttryck på ett nytt språk." }
            - { rubrik: "Före läsningen", text: "Har du hört en vuxen säga något som du först inte förstod?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Du är ute och cyklar’, sa han.” Något är konstigt: Ines sitter ju inne." }
            - { rubrik: "Tänka högt · fråga 3, Ordet", text: "”Vänta, Ines sitter ju inne. Hur kan hon vara ute och cykla? Jag ser framför mig Malte vid hennes axel. Det står ’Sju gånger åtta är femtiofem’, och han ’skakade långsamt på huvudet’. Jag vet att svaret är femtiosex, och att man skakar på huvudet när något är fel. Alltså tror jag att ’ute och cyklar’ betyder att man har fel. Stämmer det med resten? Jag läser vidare. Hon suddar ut femman. Det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Femtiofem." }
            - { rubrik: "Fråga 2 · mellan raderna, Varför", text: "Ledtrådarna: ”Du är ute och cyklar”; ”Jag är inte ute”.\nSvar som texten stöder: hon tar orden bokstavligt och tittar ut, eller skämtar med flit. De håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hon vill gå ut på rast.” Det står ingenting om rast.\nFråga tillbaka: ”Vad sa Malte precis innan hon vände sig om?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Ordet", text: "Ledtrådarna: ”Räkna en gång till”; ”suddade ut femman och skrev en sexa”.\nSvar som texten stöder: att hon har fel eller har räknat fel, eller att hon tänker på annat. Ord att ge i samtalet: ha fel, ta miste.\nEn tanke att pröva: ”Att hon cyklar ute.” Men Ines sitter inne, och Malte pekar på svaret.\nFråga tillbaka: ”Vad gör Ines sedan med femman?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett bra svar tar ställning, nämner något ur texten och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Malte säger bara ’Räkna en gång till’. Varför tror ni att han inte säger rätt svar?”; ”Ines säger ’Då har jag väl cyklat klart.’ Vad kan hon mena?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”suddade ut femman och skrev en sexa”." }
    - rubrik: "Lärarens sida: Mellan, text 5, Bänken"
      text:
        - "Det som står mellan raderna: Isak har skrivit lappen, och den är vänligt menad. Hedda tror först att Tobias retar henne."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Hur kan man ta reda på vem som har gjort något när ingen vill säga det?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Inte jag heller’, sa han. ’Jag har ingen lila penna.’” Något är konstigt: ingen har frågat Isak." }
            - { rubrik: "Tänka högt · fråga 3, Vem", text: "”Vänta, varför säger Isak det? Jag tänker att det var Tobias, för han flinade. Jag ser framför mig Isak som plötsligt pratar. Det står ’Inte jag heller’, och det står ’Jag har ingen lila penna’. Jag vet att bara den som har sett lappen vet att bokstäverna är lila, och Hedda har inte visat den. Alltså tror jag att Isak skrev den. Stämmer det med resten? Jag läser vidare. Han har en lila strimma på långfingret. Först trodde jag på Tobias, men nu är jag säker på Isak.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Lila." }
            - { rubrik: "Fråga 2 · mellan raderna, Varför", text: "Ledtrådarna: ”I går hade han frågat vad hennes häst skulle föreställa”; ”nu satt han där och flinade”.\nSvar som texten stöder: Hedda tror att Tobias har skrivit lappen för att reta henne, eftersom han har retats förut. Ord att ge i samtalet: flina (le brett och elakt).\nEn tanke att pröva: ”Hon vill visa honom lappen.” Men Hedda gömmer lappen i fickan.\nFråga tillbaka: ”Vad gör Hedda med lappen? Vill hon visa den för någon?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Vem", text: "Ledtrådarna: ”Jag har ingen lila penna”; ”stoppade snabbt händerna i fickorna”; ”en lila strimma på hans långfinger”.\nSvar som texten stöder: Isak.\nEn tanke att pröva: ”Tobias, för han flinade.” Men Tobias har bara svarta och blå pennor.\nFråga tillbaka: ”Vem säger något om en lila penna, fast Hedda inte har visat lappen för någon?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Varför", text: "Ledtrådarna: ”Din teckning är bäst. Fortsätt rita.”; ”I går hade han frågat vad hennes häst skulle föreställa”.\nSvar som texten stöder: någon ville uppmuntra eller trösta Hedda efter Tobias fråga om hästen, eller tycker att teckningen är bäst. De håller när eleven visar en ledtråd.\nEn tanke att pröva: ”För att reta henne.” Men lappens text är vänlig.\nFråga tillbaka: ”Vad skriver man till någon man vill uppmuntra, och vad skriver man till någon man vill reta?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett bra svar tar ställning, pekar på något i texten och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Varför tror ni att Hedda gömmer lappen i fickan?”; ”Tobias frågade i går vad Heddas häst skulle föreställa. Vad tror ni att han menade med det?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Jag har ingen lila penna”." }
    - rubrik: "Lärarens sida: Mellan, text 6, Till författaren"
      text:
        - "Det som står mellan raderna: Bilal tycker mycket om boken och vill ha mer, men skriver som om det inte var någon stor sak. Han oroar sig också för huvudpersonen."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad skulle du vilja fråga en författare som har skrivit en bok du har läst?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Kapitlet med kistan läste jag sex gånger, men det var för att jag hade glömt vad som hände.” Han säger en sak och gör en annan: han säger att boken var väl okej men läser kapitlet sex gånger." }
            - { rubrik: "Tänka högt · fråga 2, Känsla", text: "”Vänta, här står inte vad Bilal tycker om boken. Jag ser framför mig Bilal med en bok som blev över när de andra hade valt. Det står ’Den var väl okej’, men det står också ’Kapitlet med kistan läste jag sex gånger’. Jag vet att man inte läser något sex gånger om man inte tycker om det. Alltså tror jag att Bilal tycker mycket om boken. Stämmer det med resten? Jag läser vidare. Han har tittat efter fler böcker på hyllan två gånger. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Sex." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”Kapitlet med kistan läste jag sex gånger”; ”lampan i mitt rum lyste klockan elva på kvällen”.\nSvar som texten stöder: han tycker mycket om boken och vill ha mer.\nEn tanke att pröva: ”Den var okej, det står ju.” Eleven litar på orden.\nFråga tillbaka: ”Vad gör Bilal på kvällen och vid hyllan?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Den var väl okej”; ”Det är inte så viktigt, jag undrar bara”.\nSvar som texten stöder: han skäms för att visa hur mycket han gillar boken, eller han vill inte verka för ivrig. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”För att det är sant, den låg kvar.” Eleven tar orden som de står.\nFråga tillbaka: ”Vad visar att det är viktigt för honom?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Varför", text: "Ledtrådarna: ”Det gick väl bra för honom i slutet”; ”ifall det hade ändrat sig”; ”Jag läste slutet tre gånger till”.\nSvar som texten stöder: han är orolig för huvudpersonen och hoppas på ett bättre slut, eller han vill inte släppa boken. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”För att han inte förstod slutet.” Han frågar ju om det gick bra.\nFråga tillbaka: ”Vad hoppas Bilal när han läser slutet igen?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett svar kan vara att han skickar brevet som det är, eller att han skriver om det så att det står hur mycket boken betyder. Ett bra svar nämner något ur brevet och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att författaren skriver tillbaka till Bilal?”; ”Bilal säger till mamma att han letade efter en strumpa. Vad tror ni att mamma tänker då?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Kapitlet med kistan läste jag sex gånger”." }
    - rubrik: "Lärarens sida: Mellan, text 7, Kartongen"
      text:
        - "Det som står mellan raderna: Mormor, som heter Gunvor, var målvakt i ett pojklag sommaren 1971 och gömde flätan under en keps för att få vara med. Med ”han” menar hon sig själv."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad kan man hitta i en gammal kartong, och vad kan sakerna berätta om den som har sparat dem?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Den fick aldrig tas av, inte ens när det regnade.” Något är konstigt: varför får en keps aldrig tas av?" }
            - { rubrik: "Tänka högt · fråga 3, Före och efter", text: "”Vänta, här står inte varför kepsen aldrig fick tas av. Jag ser framför mig målvakten med kepsen neddragen. Det står ’skymtade änden av en fläta’ och ’Den fick aldrig tas av’. Jag vet att man gömmer det man inte vill visa, och att lag förr var för pojkar. Alltså tror jag att målvakten var en flicka som gömde flätan. Stämmer det med resten? Jag läser vidare. På baksidan står tio pojknamn och Gunvor. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "En keps." }
            - { rubrik: "Fråga 2 · mellan raderna, Vem, syftning", text: "Ledtrådarna: ”skymtade änden av en fläta”; ”Det står ju på din brevlåda”.\nSvar som texten stöder: mormor själv, som var målvakten. Svaret ”målvakten” håller också, som ett första steg.\nEn tanke att pröva: ”En av pojkarna, för mormor säger ’han’.” Det bygger bara på ordet ”han”.\nFråga tillbaka: ”Vad skymtade bakom örat på målvakten, och vems namn står på brevlådan?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Före och efter", text: "Ledtrådarna: ”skymtade änden av en fläta”; ”Den fick aldrig tas av, inte ens när det regnade”.\nSvar som texten stöder: Gunvor gömde flätan för att få vara med i ett pojklag, eller för att inte sticka ut. De håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Kepsen var en lyckokeps.” Det förklarar inte flätan.\nFråga tillbaka: ”Vad skymtade under kepsen, och hur många av namnen var pojknamn?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett bra svar nämner handskarna, kepsen eller namnlistan och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att mormor tänker på när hon slår ihop handskarna, som om en boll var på väg?”; ”Samir frågar vad målvakten hette, och mormor svarar ’Det var länge sedan.’ Varför tror ni att hon svarar så?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”skymtade änden av en fläta”." }
    - rubrik: "Lärarens sida: Mellan, text 8, Lördag klockan 14"
      text:
        - "Det som står mellan raderna: Nour och Arvid har planerat utan Zahra. Läxorna är en ursäkt: hon hoppas att någon ber henne komma."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Många elever har känt sig utanför. Låt samtalet handla om Zahra, och fråga inte vem som känner igen sig." }
            - { rubrik: "Före läsningen", text: "Hur kan man se hur någon känner sig när man bara läser vad hen skriver?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Men jag har nog jättemycket läxor på lördag, så det blir svårt att hinna allting.” Hon ändrar sig plötsligt och skriver ”Men” efter ”Låter kul.”" }
            - { rubrik: "Tänka högt · fråga 4, Det som menas", text: "”Vänta, här stämmer inte allt. Jag ser framför mig hur Zahra läser att de redan har bestämt. Det står ’Låter kul’ och ’Men jag har nog jättemycket läxor’. Jag vet att man ibland säger att man är upptagen när man hoppas att någon ska fråga en. Alltså tror jag att läxorna är en ursäkt. Stämmer det med resten? Jag läser vidare. Nour skriver upp henne, och hon kommer. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Låter kul." }
            - { rubrik: "Fråga 2 · mellan raderna, Vem, syftning", text: "Ledtrådarna: ”Jag och Arvid har bokat en bana”; ”redan bestämt i vilken ordning vi ska kasta”.\nSvar som texten stöder: bowlingen som Nour och Arvid har planerat.\nEn tanke att pröva: ”Att Zahra ska komma.” Men Zahra har inte svarat än.\nFråga tillbaka: ”Vad skriver Nour precis före?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”Men jag har nog jättemycket läxor”; ”Kanske.”\nSvar som texten stöder: tveksam, osäker, utanför eller besviken. De håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Glad, för hon skriver ’Låter kul’.” Men hon ändrar sig i nästa meddelande.\nFråga tillbaka: ”Vad skriver Zahra efter ’Låter kul’?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Det som menas", text: "Ledtrådarna: ”Jag och Arvid har bokat en bana”; ”Då kommer jag!”\nSvar som texten stöder: hon hoppas att någon ber henne komma, så läxorna är en ursäkt.\nEn tanke att pröva: ”För att hon verkligen har mycket läxor.” Det förklarar inte att hon ändrar sig.\nFråga tillbaka: ”Vad skriver Zahra så fort Nour skriver upp henne?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett bra svar pekar på något i chatten och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Nour svarar bara ’Jaha.’ Vad tror ni att Nour tänker då?”; ”Arvid skriver att de kan vänta med första kastet. Varför tror ni att han erbjuder det?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Låter kul.” och sedan på ”Men jag har nog jättemycket läxor”." }
    - rubrik: "Lärarens sida: Mellan, text 9, Hinken i hallen"
      text:
        - "Det som står mellan raderna: Under natten rann grannens bad över på övervåningen, och vattnet läckte ner i Novas hall. Pappa gissar först på regn eller ett rör, men skummet och doften visar vad det är."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad kan göra att det droppar vatten inne i ett hus?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Det luktar lavendel’, sa hon.” Något är konstigt: regn och rör ger inget skum som luktar lavendel." }
            - { rubrik: "Tänka högt · fråga 2, Före och efter", text: "”Vänta, här står inte var vattnet kommer ifrån. Jag ser framför mig en hink under en mörk fläck i taket. Pappa säger ’nu läcker taket’, men det står också ’vitt av skum’ och ’Det luktar lavendel’. Jag vet att skum och lavendel finns i badvatten, och att Nova hörde grannen uppifrån. Alltså tror jag att grannen ovanför har låtit badet rinna över. Stämmer det med resten? Jag läser vidare. Pappa suckar och går upp och knackar. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Lavendel." }
            - { rubrik: "Fråga 2 · mellan raderna, Före och efter", text: "Ledtrådarna: ”grannen, som sjöng falskt”; ”vitt av skum”; ”Det luktar lavendel”.\nSvar som texten stöder: från grannen på våningen ovanför, där badet troligen rann över.\nEn tanke att pröva: ”Från taket, för det regnade.” Pappa säger så, men det regnar inte nu, och regn är inte vitt av skum.\nFråga tillbaka: ”Var har man vatten med skum som luktar lavendel?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”fortfarande i pyjamas”; ”tittade upp mot taket och suckade”; ”Ta med en handduk”.\nSvar som texten stöder: trött och lite irriterad, eller road och vänlig mot grannen. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Arg, för han suckar.” Det bygger på en enda ledtråd.\nFråga tillbaka: ”Vad säger pappa efter att han har suckat?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Före och efter", text: "Ledtrådarna: ”vitt av skum”; ”Jag går upp och knackar”; ”Ta med en handduk”.\nSvar som texten stöder: vattnet har också runnit ut hos grannen, så golvet där behöver torkas, eller grannen är blöt. De håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Han ska torka sig.” Men pappa har inte blivit blöt.\nFråga tillbaka: ”Vart ska pappa gå, och vad finns troligen på golvet där?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett svar kan vara att han är vänlig, eftersom det kan vara en olycka, eller att han säger ifrån, eftersom det blev stök. Ett bra svar nämner skummet eller handduken och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Pappa säger att han går upp och knackar. Vad tror ni händer sedan?”; ”Pappa kommer rusande med en mopp, fortfarande i pyjamas. Vad tror ni att han tänker då?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Det luktar lavendel”." }
    - rubrik: "Lärarens sida: Mellan, text 10, Rum 4"
      text:
        - "Det som står mellan raderna: Hiba har hemlängtan och vill åka hem, fast hon säger att allt är bra. Ronja märker det och bjuder in henne."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Elever som har varit borta från sin familj, eller som saknar någon, kan bli berörda. Visa att det är vanligt att sakna hemmet och låt dem berätta om de vill." }
            - { rubrik: "Före läsningen", text: "Vad kan kännas annorlunda när man sover på ett nytt ställe?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Jag var törstig’, sa Hiba, men hon höll kvar ryggsäcken i knät och frågade i stället hur många nätter det var kvar.” Hon säger en sak och gör en annan: hon säger att hon är törstig men sitter kvar med ryggsäcken." }
            - { rubrik: "Tänka högt · fråga 3, Det som menas", text: "”Vänta, här stämmer det inte. Hiba säger att allt är bra, men klockan är 01.20. Jag ser framför mig hur hon drar igen blixtlåset långsamt. Det står ’Jag var törstig’, och det står ’men hon höll kvar ryggsäcken i knät’. Jag vet att man inte behöver ryggsäcken när man bara ska dricka vatten. Alltså tror jag att ’allt är bra’ betyder att hon vill åka hem. Stämmer det med resten? Jag läser vidare. Hiba svarar ’Det är ju snart, det är bra’. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Tre." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”drog igen blixtlåset, långsamt, så att det inte skulle höras”; ”frågade i stället hur många nätter det var kvar”; ”den var mycket större än något Hiba hade haft på sig under dagarna”.\nSvar som texten stöder: ledsen, orolig eller full av saknad efter hemmet. De håller när eleven visar en ledtråd. Texten säger inte vems tröjan är, så olika förklaringar håller. Ord att ge i samtalet: saknad, hemlängtan.\nEn tanke att pröva: ”Hon är trött och vill sova.” Men hon är vaken och packar.\nFråga tillbaka: ”Vad gör Hiba med ryggsäcken mitt i natten?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Det som menas", text: "Ledtrådarna: ”Sov du, allt är bra”; ”höll kvar ryggsäcken i knät”; ”Det är ju snart, det är bra”.\nSvar som texten stöder: hon trivs inte och vill åka hem, tänker smyga hem eller tröstar sig med att det snart är över. De håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hon menar att det är bra, för hon säger det två gånger.” Eleven litar på orden och missar det hon gör.\nFråga tillbaka: ”Varför packar man en ryggsäck mitt i natten när allt är bra?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett bra svar pekar på något i texten, som ryggsäcken eller att Ronja bjöd in henne, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Om Hiba klättrar upp i sängen, vad tror ni att hon och Ronja pratar om?”; ”Tröjan är mycket större än något Hiba har haft på sig. Vems kan den vara? Kan den vara någon annans?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”’Jag var törstig’, sa Hiba, men hon höll kvar ryggsäcken i knät”." }
    - rubrik: "Lärarens sida: Mellan, text 11, Torsdag hos farfar"
      text:
        - "Det som står mellan raderna: Selma och farfar har redan fikat, men farfar har glömt det. Selma rättar honom inte, eftersom hon vill att han ska få en fin stund och slippa känna sig dum."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Texten kan väcka tankar hos elever som har en äldre släkting som glömmer, eller som saknar en farfar eller farmor. Texten nämner ingen sjukdom, och du behöver inte heller göra det. Låt Selmas vänlighet stå i centrum, och fråga inte eleverna om deras egna släktingar." }
            - { rubrik: "Före läsningen", text: "Vad kan man göra tillsammans när man hälsar på någon?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Nej, inte än’, sa hon.” Hon säger en sak och gör en annan: hon säger nej medan hon håller i kopparna som de nyss har druckit ur." }
            - { rubrik: "Tänka högt · fråga 3, Varför", text: "”Vänta, här står inte varför Selma säger så. Jag ser framför mig Selma vid diskhon och farfar som öppnar frysen. Det står ’Du har väl inte hunnit äta något’, och det står ’Nej, inte än’. Jag vet att man ibland säger ett litet nej för att skona någon som har glömt något. Alltså tror jag att Selma vill ge farfar en fin stund. Stämmer det med resten? Jag läser vidare. Farfar säger att det annars blir så tyst. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Två." }
            - { rubrik: "Fråga 2 · mellan raderna, Före och efter", text: "Ledtrådarna: ”sköljde två kaffekoppar”; ”En tallrik med smulor stod på bordet”; ”köket luktade kaffe och kanel”.\nSvar som texten stöder: Selma och farfar har redan fikat, med kaffe och något med kanel.\nEn tanke att pröva: ”Selma diskar bara, för hon är snäll.” Det förklarar inte de två kopparna.\nFråga tillbaka: ”Varför skulle hon skölja två koppar, och vad luktar det i köket?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Du har väl inte hunnit äta något”; ”Torsdag. Selma kommer. Bullar i frysen.”; ”Annars blir det så tyst här”.\nSvar som texten stöder: farfar har glömt att de nyss fikade, och Selma vill skona honom eller ge honom sällskap så att det inte blir tyst. De håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hon ljuger för hon vill ha mer bulle.” Det bygger på en enda replik.\nFråga tillbaka: ”Vad har farfar skrivit på lappen, och vad säger han sist till Selma?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett bra svar pekar på kopparna, lappen eller farfars ord och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Farfar säger att det annars blir så tyst. Vad tror ni att han gör de andra dagarna i veckan?”; ”Farfar nynnar medan han plockar fram bullarna. Vad tror ni att han tänker på?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”sköljde två kaffekoppar”." }
    - rubrik: "Lärarens sida: Mellan, text 12, Snöret"
      text:
        - "Det som står mellan raderna: När Tyra säger att det inte gör något, menar hon motsatsen. Hon är ledsen över båten men vill inte visa det för Ravi."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad kan man bygga en liten båt av, så att den flyter?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Hon torkade av händerna på tröjan, först den ena och sedan den andra, fast de inte var blöta.” Hon säger en sak och gör en annan: hon säger att det inte gör något men torkar händer som inte är blöta." }
            - { rubrik: "Tänka högt · fråga 3, Det som menas", text: "”Vänta, här stämmer inte orden med det Tyra gör. Jag ser framför mig hur båten försvinner under bron. Det står ’Det gör inget’ och ’fast de inte var blöta’. Jag vet att man gör onödiga saker när man vill dölja något. Alltså tror jag att det gör något, och att hon döljer det. Stämmer det med resten? Jag läser vidare. Hon säger ’Det behövs inte’ och står kvar vid bron och räknar sakta till tio. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Tre veckor." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”Förlåt, Tyra, det var bara snöret”; ”Jag kan bygga en ny åt dig”.\nSvar som texten stöder: han har dåligt samvete och vill ställa det till rätta.\nEn tanke att pröva: ”Han bryr sig inte, för han säger ’bara snöret’.” Men Ravi säger förlåt och erbjuder sig att bygga en ny.\nFråga tillbaka: ”Vad gör Ravi efter att båten har försvunnit?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Det som menas", text: "Ledtrådarna: ”arbetat med båten i tre veckor”; ”fast de inte var blöta”.\nSvar som texten stöder: att det gör något, och att hon är ledsen men döljer det.\nEn tanke att pröva: ”Hon menar det, för hon säger det två gånger.” Men hon torkar händer som inte är blöta.\nFråga tillbaka: ”Varför torkar man händer som inte är blöta?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Varför", text: "Ledtrådarna: ”Jag kan bygga en ny åt dig”; ”Ravi sprang längs bäcken och tittade efter båten i vassen”.\nSvar som texten stöder: han vill hitta båten åt Tyra, eller han tror inte på att det inte gör något. De håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Han springer iväg från Tyra.” Men han tittar efter båten i vassen och vill hitta den.\nFråga tillbaka: ”Vad gör Ravi efter att Tyra har sagt att det inte gör något?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett bra svar nämner något ur texten, som båten eller Ravis erbjudande, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Tyra har arbetat med båten i tre veckor. Vad tror ni att den betyder för henne?”; ”Tyra räknar sakta till tio innan hon springer efter Ravi. Vad kan hon ha tänkt? Kan hon ha tänkt något annat?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”fast de inte var blöta”." }
    - rubrik: "Lärarens sida: Mellan, text 13, Skollopp"
      text:
        - "Det som står mellan raderna: Berättaren sprang ifrån Loke fast de hade bestämt att springa tillsammans. Hen vann men har dåligt samvete."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Elever som själva har svikit en kompis, eller blivit svikna, kan känna igen sig. Låt det vara tillåtet att också vilja vinna, och håll er till texten." }
            - { rubrik: "Före läsningen", text: "Hur kan det kännas att springa ett lopp mot en kompis?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Det var jag inte.” Något är konstigt: hen sa nej till glass fast hen inte var mätt." }
            - { rubrik: "Tänka högt · fråga 3, Varför", text: "”Vänta, varför gömmer hen medaljen? Först tänker jag att det beror på att medaljen är av plast. Jag ser framför mig medaljen i strumplådan. Det står ’la jag medaljen längst ner’ och ’jag var alldeles för mätt’. Jag vet att man inte gömmer det man är stolt över. Alltså tror jag att något har gått snett. Stämmer det med resten? Jag läser vidare. Loke gick hem åt andra hållet. Först trodde jag att det var plasten, men nu tror jag att det handlar om Loke.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Två." }
            - { rubrik: "Fråga 2 · mellan raderna, Före och efter", text: "Ledtrådarna: ”Vi ska springa sida vid sida”; ”Loke kom in som fyra”.\nSvar som texten stöder: berättaren sprang ifrån Loke och vann.\nEn tanke att pröva: ”De sprang bredvid varandra hela vägen.” Men Loke kom in som fyra.\nFråga tillbaka: ”Vad bestämde de, och vem vann?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Han sa ’Grattis’ utan att titta på mig”; ”Det är inte mitt fel att jag springer fort”.\nSvar som texten stöder: hen har dåligt samvete för att hen inte höll det de hade bestämt.\nEn tanke att pröva: ”Hen är besviken för att medaljen är av plast.” Men plasten förklarar inte glassen, och Loke gick utan att titta på hen.\nFråga tillbaka: ”Vad bestämde de i torsdags?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Varför", text: "Ledtrådarna: ”äta varsin glass när vi kommer i mål”; ”Jag har inte öppnat frysen”.\nSvar som texten stöder: glassarna var till båda, så hen äter dem inte utan honom, eller sparar dem åt honom. De håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hen har bara glömt glassen.” Men hen sa nej till glass.\nFråga tillbaka: ”Varför köpte berättaren två glassar?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett bra svar pekar på något i texten och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att Loke tänker när han går hem åt andra hållet?”; ”Berättaren skriver ’Ett lopp är ju ett lopp.’ Vem tror ni att hen försöker övertyga?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Loke kom in som fyra”." }
    - rubrik: "Lärarens sida: Mellan, text 14, En runda"
      text:
        - "Det som står mellan raderna: Vincent ska flytta och tar avsked av kvarteret, fast han säger att det är en slump. Han saknar sitt hem men ser också fram emot något nytt."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Elever som har flyttat kan känna igen sig. Låt Vincents känslor vara som de är, och fråga inte om elevernas egna flyttar." }
            - { rubrik: "Före läsningen", text: "Varför kan man tycka särskilt mycket om en plats man ofta går till?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Det var också en slump att jag stannade vid fotbollsplanen och sparkade tre gånger på målstolpen, som vanligt.” Något upprepas: han säger slump två gånger." }
            - { rubrik: "Tänka högt · fråga 2, Varför", text: "”Vänta, här stämmer något inte. Han säger två gånger att det var en slump. Jag ser framför mig hur han sparkar på målstolpen. Det står ’en ren slump’ och ’Gå ut en stund innan vi åker’. Jag vet att man kan kalla något en slump fast man har gjort det med flit. Alltså tror jag att han tar farväl. Stämmer det med resten? Jag läser vidare. Grannen ber honom hälsa på i sommar. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "En slät sten." }
            - { rubrik: "Fråga 2 · mellan raderna, Varför", text: "Ledtrådarna: ”Mamma hade skrivit ’Vincents saker’ på kartongerna”; ”en ren slump att jag gick förbi skolan”.\nSvar som texten stöder: han tar farväl av platserna eftersom familjen ska flytta. Ord att ge i samtalet: slump (något oplanerat), ta avsked.\nEn tanke att pröva: ”Det var en slump, som det står.” Men han väljer just skolan och fotbollsplanen.\nFråga tillbaka: ”Varför säger han två gånger att det var en slump?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”tog jag en slät sten”; ”Jag lade cykelhjälmen överst”.\nSvar som texten stöder: han saknar sitt hem, ser fram emot något nytt, eller båda. De håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Bara ledsen, för han ska åka.” Men hjälmen överst visar att han också ser fram emot något.\nFråga tillbaka: ”Vad gör Vincent med cykelhjälmen?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett bra svar tar med att Vincent inte svarar grannen i texten, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Pappa säger ’Du är bara i vägen här.’ Vad tror ni att han egentligen vill?”; ”Vincent tar en slät sten och vet inte varför. Vad kan skälet vara?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”ljusa fyrkanter efter alla affischerna”." }
    - rubrik: "Lärarens sida: Mellan, text 15, Någon har varit här"
      text:
        - "Det som står mellan raderna: Emelie gör en riddarutstyrsel åt Ruben av hans tejp, sax och kartong. Ruben tror att hon tar hans saker."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Varför kan man vilja slippa en temadag i skolan?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Min storasyster Emelie tittade på mamma, och mamma tittade på taket.” Något är konstigt: de tittar bort." }
            - { rubrik: "Tänka högt · fråga 2, Det som menas", text: "”Vänta, varför tittar mamma på taket? Jag tänker att de är arga på Ruben för att han låtsas. Jag ser framför mig mamma som tittar upp i taket. Det står ’jag hade ont i magen’, och det står ’mamma tittade på taket’. Jag vet att man tittar bort när man inte tror någon. Alltså tror jag att de inte tror på magontet. Stämmer det med resten? Jag läser vidare. Emelie säger ’Gå och bli sjuk någon annanstans.’ Först trodde jag att de var arga, men det låter som ett skämt.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Tejpen, den stora saxen, silverpappret och kartongen." }
            - { rubrik: "Fråga 2 · mellan raderna, Det som menas", text: "Ledtrådarna: ”mamma tittade på taket”; ”Gå och bli sjuk någon annanstans”.\nSvar som texten stöder: hon vet att han inte är sjuk och håller tillbaka ett skratt, eller hon vet något om Emelie som hon inte vill avslöja. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hon är trött på honom.” Men mamma säger inget till honom.\nFråga tillbaka: ”Varför tittar man bort?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Nej, varför skulle jag det?”; ”Jag har mycket att göra, Ruben”.\nSvar som texten stöder: hon vill hålla det hemligt tills det är klart, eller hon vill inte bli avbruten medan hon arbetar. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hon skäms för att hon har stulit.” Men hon säger att hon har mycket att göra.\nFråga tillbaka: ”Vad gör Emelie med dörren?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Före och efter", text: "Ledtrådarna: ”medeltidsdag i min klass”; ”Skölden är klar”.\nSvar som texten stöder: Emelie gör en riddarutstyrsel av hans saker, så att han kan vara med på medeltidsdagen.\nEn tanke att pröva: ”Hon stjäl hans saker.” Men Emelie säger ”Skölden är klar”.\nFråga tillbaka: ”Vad händer i skolan i morgon?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett svar kan vara att han säger till Emelie vad han tror, eller att han väntar och ser. Ett bra svar nämner något ur texten och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att Ruben säger till Emelie på morgonen?”; ”Varför tror ni att Ruben inte ber om en utklädnad?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Skölden är klar”." }
    - rubrik: "Lärarens sida: Mellan, kartläggning före, Fem minuter"
      text:
        - "Det som står mellan raderna: Oskar är otålig och vill in på planen, men kanske också orolig för att inte få spela. Han är i en idrottshall nära slutet av en match."
      delar:
        - rubrik: Kartläggningen
          falt:
            - { rubrik: "Så gör du", text: "Eleven gör kartläggningen enskilt med dig utanför passen, på fem till åtta minuter. Ställ ingen fråga före läsningen, och stanna inte. Eleven läser själv, och för den som avkodar mödosamt läser du texten högt först. Eleven svarar muntligt, och du skriver i protokollet. Den första frågan ger 1 poäng, och fråga 2 och fråga 3 ger 0–2 poäng var, högst 5 poäng. Fråga tillbaka bara om eleven inte svarar, och skriv då ett h efter poängen." }
            - { rubrik: "Känsligt", text: "Elever som sällan får spela i laget kan känna igen sig. Låt eleven svara med sina egna ord och kommentera inte svaret vid kartläggningen." }
            - { rubrik: "Fråga 1 · på raderna", text: "Tre." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”knöt om skosnörena för tredje gången”; ”Jag är redo när du vill”; ”Oskars tröja var ren och torr, och han strök ut ett veck som redan var borta”.\nSvar som texten stöder: otålig, spänd, orolig eller lite nervös. Ord att ge i samtalet: otålig, nervös.\nEn tanke att pröva: ”Glad, för det är en match.” Eleven utgår från vad hen själv tycker om matcher och hittar inget stöd i texten.\nFråga tillbaka: ”Vad gör Oskar med skorna, och vad säger han till tränaren?”\nPoäng: 2 poäng för en slutsats som texten stöder med ledtråd, till exempel ”Otålig, för han har sagt att han är redo två gånger.” 1 poäng för en känsla som texten stöder utan ledtråd (”Otålig.”) eller en ledtråd utan slutsats (”Han knyter skorna.”). 0 poäng för en känsla som texten inte stöder, ett svar som bara upprepar en mening, eller inget svar." }
            - { rubrik: "Fråga 3 · mellan raderna, Var och när", text: "Ledtrådarna: ”Skor gnisslade mot golvet”; ”bollen träffade väggen”; ”siffrorna sju och nio”; ”Fem minuter kvar”.\nSvar som texten stöder: i en idrottshall eller gymnastiksal under en match, nära slutet.\nEn tanke att pröva: ”Utomhus på en fotbollsplan.” Bollen finns med, men väggen, taket och golvet visar att det är inomhus.\nFråga tillbaka: ”Vad träffar bollen, och vad gnisslar mot golvet?”\nPoäng: 2 poäng för en plats som texten stöder med ledtråd, till exempel ”I en idrottshall, för skorna gnisslar mot golvet och de spelar med boll.” 1 poäng för rätt plats utan ledtråd (”I en idrottshall.”) eller en ledtråd utan plats (”Skorna gnisslar.”). 0 poäng för en plats som texten inte stöder, som ”Hemma”, eller inget svar." }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att man säger något som lugnar, som att han snart får spela, eller något som skickar honom i väg, som att han ska värma upp. Ett bra svar nämner att Oskar har frågat flera gånger eller att hans tröja är torr, och ger ett eget skäl." }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”knöt om skosnörena för tredje gången”." }
    - rubrik: "Lärarens sida: Mellan, kartläggning efter, Två minuter"
      text:
        - "Det som står mellan raderna: Elin är nervös och vill få det överstökat. Hon är bakom en scen i en aula, strax före ett framträdande."
      delar:
        - rubrik: Kartläggningen
          falt:
            - { rubrik: "Så gör du", text: "Eleven gör kartläggningen enskilt med dig utanför passen, på fem till åtta minuter. Ställ ingen fråga före läsningen, och stanna inte. Eleven läser själv, och för den som avkodar mödosamt läser du texten högt först. Eleven svarar muntligt, och du skriver i protokollet. Den första frågan ger 1 poäng, och fråga 2 och fråga 3 ger 0–2 poäng var, högst 5 poäng. Fråga tillbaka bara om eleven inte svarar, och skriv då ett h efter poängen." }
            - { rubrik: "Fråga 1 · på raderna", text: "Tre." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”drog upp strumporna för tredje gången”; ”Jag kan gå först om du vill”; ”Elins lapp var mjuk och skrynklig i kanterna, och hon vek den en gång till”.\nSvar som texten stöder: nervös, spänd, stressad, eller otålig och vill få det överstökat.\nEn tanke att pröva: ”Glad, för det ska hända något roligt.” Det bygger inte på texten.\nFråga tillbaka: ”Hur många gånger drog Elin upp strumporna, och vad gör hon med lappen?”\nPoäng: 2 poäng för en slutsats som texten stöder med ledtråd, till exempel ”Nervös, för hon har dragit upp strumporna tre gånger.” 1 poäng för en känsla som texten stöder utan ledtråd (”Nervös.”) eller en ledtråd utan slutsats (”Hon drar upp strumporna.”). 0 poäng för en känsla som texten inte stöder, ett svar som bara upprepar en mening, eller inget svar." }
            - { rubrik: "Fråga 3 · mellan raderna, Var och när", text: "Ledtrådarna: ”Stolar skrapade mot golvet därute”; ”över dörren ut mot salen blinkade en röd lampa”; ”glittriga dräkter”.\nSvar som texten stöder: bakom en scen, i en aula eller på en teater, strax före ett framträdande.\nEn tanke att pröva: ”I klassrummet, för fröken är där.” Men stolarna, lampan och dräkterna pekar på en scen.\nFråga tillbaka: ”Vem sitter på stolarna som skrapar, och när har man glittriga dräkter på sig?”\nPoäng: 2 poäng för en plats som texten stöder med ledtråd, till exempel ”Bakom en scen, för det sitter folk därute på stolar.” 1 poäng för rätt plats utan ledtråd (”Bakom en scen.”) eller en ledtråd utan plats (”De har dräkter.”). 0 poäng för en plats som texten inte stöder, som ”Hemma”, eller inget svar." }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett bra svar nämner att Elin har dragit upp strumporna flera gånger eller att lappen är skrynklig, och ger ett eget skäl." }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”drog upp strumporna för tredje gången”." }
    - rubrik: "Mellan, kartläggning före: Fem minuter"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Poängen", text: "Lärarens sida för kartläggningen före, och protokollet i planeringsmallarna." }
      listor:
        - rubrik: "Fem minuter"
          rader:
            - ["Oskar satt längst ut på bänken och knöt om skosnörena för tredje gången. Skor gnisslade mot golvet, och varje gång bollen träffade väggen small det så att ljudet rullade under taket. Luften var varm och luktade gummi."]
            - ["”Fem minuter kvar”, sa tränaren utan att vända sig om.\n”Jag är redo när du vill”, sa Oskar. Han hade sagt samma sak för en stund sedan, och tränaren nickade bara mot planen."]
            - ["På väggen lyste siffrorna sju och nio, och klockan ovanför räknade ner mot noll. Alla de andra hade mörka svettfläckar på tröjorna. Oskars tröja var ren och torr, och han strök ut ett veck som redan var borta."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många gånger hade Oskar knutit om skosnörena?"]
            - ["2. Hur känner sig Oskar? Hur vet du det?"]
            - ["3. Var är Oskar? Hur vet du det?"]
            - ["4. Tränaren säger att det är fem minuter kvar. Vad hade du sagt till Oskar? Varför?"]
    - rubrik: "Mellan, text 1: Längst bak"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 1." }
      listor:
        - rubrik: "Längst bak"
          rader:
            - ["Läraren sa att jag fick sitta var jag ville. Alla andra hade redan sina platser, och de flesta hade någon bredvid sig som viskade och skrattade. Jag valde bänken längst bak vid fönstret. Jackan hängde jag inte upp på kroken. Den fick sitta kvar på ryggen."]
            - ["”Hej, jag heter Adam”, sa pojken framför mig och vände sig om. ”Gick du i en annan skola förut?”\n”Ja”, sa jag. ”Det spelar ingen roll.”\n”Okej”, sa Adam och vände sig bort igen.\nJag slog upp matteboken på sidan fyra och läste första raden tre gånger."]
            - ["På rasten stod jag en bit från hopprepet och räknade tyst med de andra. Det gick bra ända till tjugosju, då snubblade någon. På lunchen åt jag långsamt och lyssnade. De pratade om en gympapåse som hade trillat ner i en toalett, och jag höll på att skratta högt.\nNär skoldagen var slut stod Adam vid min bänk.\n”Jag går hem längs ån”, sa han. ”Du då?”\nJag tog väskan så snabbt att stolen åkte med."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många gånger läste berättaren första raden i matteboken?"]
            - ["2. Varför hänger berättaren inte upp jackan på kroken? Hur vet du det?"]
            - ["3. Hur känner sig berättaren under dagen? Hur vet du det?"]
            - ["4. Adam frågar ”Du då?” Vad hade du svarat i berättarens ställe? Varför?"]
    - rubrik: "Mellan, text 2: Skrapet på dörren"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 2." }
      listor:
        - rubrik: "Skrapet på dörren"
          rader:
            - ["Elias vaknade av att något skrapade på ytterdörren. Han sprang ut i hallen i strumpor, och pappa kom efter med håret åt alla håll. ”Tre dagar”, sa Elias och vred försiktigt om låset."]
            - ["Pricken spann och gick in som om han hade varit ute en vanlig natt. Han åt två skålar mat och sträckte ut sig på mattan. Elias satte sig bredvid och kliade honom bakom örat, och där satt en liten tuss sågspån. På ena tassen fanns en blå fläck som fortfarande var klibbig."]
            - ["”Han är hel”, sa pappa. ”Det är huvudsaken.”\n”Men var har han varit?” sa Elias. ”Han luktar som en målarburk.”\n”Jag vet inte”, sa pappa och gick till fönstret. ”Grannen kom hem från sin resa sent i går kväll.”\nPå andra sidan gården stod grannens garagedörr på glänt. Därifrån hördes radion.\nPappa log. ”Jag tror att jag bakar en sockerkaka i dag.”"]
        - rubrik: Frågorna
          rader:
            - ["1. Vad hade Pricken på ena tassen?"]
            - ["2. Var kan Pricken ha varit under de tre dagarna? Hur vet du det?"]
            - ["3. Varför kom Pricken hem just i morse? Hur vet du det?"]
            - ["4. Vad hade du gjort i Elias ställe under de tre dagarna? Varför?"]
    - rubrik: "Mellan, text 3: Mössan"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 3." }
      listor:
        - rubrik: "Mössan"
          rader:
            - ["Klassen hade kommit fram till gården efter en lång bussresa, och luften luktade hö och fuktig jord. Moa stod vid staketet med båda händerna i håret, för hennes röda mössa hade försvunnit."]
            - ["”Hon har tagit min mössa”, ropade Moa.\n”Vem då, Frida?” frågade Kian.\n”Nej, hon där borta, hon tuggar på den!”\nKian skrattade så att han fick stödja sig mot staketet. ”Gå och hämta den, då.”\n”Jag vågar inte, hon stirrar på mig”, sa Moa.\n”Fråga honom som kommer där, han jobbar här.”\nEn man i gummistövlar kom gående med en hink och skakade på huvudet. ”Hon äter allt”, sa han, ”till och med skor, men morötter gillar hon ännu mer.”\nHan höll upp ett knippe morötter över staketet, och hon släppte mössan och kom fram till honom.\n”Den är ju sönder”, sa Moa. Hon tog på sig den ändå."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad gör den som har tagit mössan, enligt Moa?"]
            - ["2. Vem är ”hon” som har tagit Moas mössa? Hur vet du det?"]
            - ["3. Vad är det för sorts gård som klassen har kommit till? Hur vet du det?"]
            - ["4. Hur känner sig Moa när hon tar på sig mössan i slutet? Hur vet du det?"]
            - ["5. Kian skrattar så att han får stödja sig mot staketet. Vad tycker du om det? Varför?"]
    - rubrik: "Mellan, text 4: Vid samma bord"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 4." }
      listor:
        - rubrik: "Vid samma bord"
          rader:
            - ["Ines och Malte delade bord och räknade uppgifter i matteboken. Ines skrev snabbt och nynnade lite för sig själv."]
            - ["”Sju gånger åtta är femtiofem”, sa hon högt och drog ett streck under svaret.\nMalte tittade över hennes axel och skakade långsamt på huvudet.\n”Du är ute och cyklar”, sa han.\nInes vände sig mot fönstret, men där fanns bara skolgården och en flaggstång.\n”Jag är inte ute”, sa hon. ”Jag sitter här på en stol, och jag har ingen cykel.”\nMalte höll tillbaka ett skratt. ”Räkna en gång till”, sa han och pekade på svaret."]
            - ["Ines räknade på fingrarna, först åt ena hållet och sedan åt det andra. Hon suddade ut femman och skrev en sexa.\n”Jaha”, sa hon. ”Då har jag väl cyklat klart.”\nMalte skrattade så högt att alla tittade upp."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad är sju gånger åtta, enligt Ines?"]
            - ["2. Varför vänder sig Ines mot fönstret? Hur vet du det?"]
            - ["3. Vad menar Malte när han säger att Ines är ute och cyklar? Vad i texten får dig att tro det?"]
            - ["4. Malte skrattade så högt att alla tittade upp. Vad tycker du om det Malte gjorde? Varför?"]
    - rubrik: "Mellan, text 5: Bänken"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 5." }
      listor:
        - rubrik: "Bänken"
          rader:
            - ["Det luktade våta vantar i klassrummet när Hedda öppnade bänken för att hämta suddgummit. Överst låg en hopvikt lapp. Hon vecklade ut den bakom locket så att ingen skulle se. Bokstäverna var lila: ”Din teckning är bäst. Fortsätt rita.” Hedda vek ihop lappen igen och stoppade den i fickan."]
            - ["Hon vände sig om och tittade på Tobias. I går hade han frågat vad hennes häst skulle föreställa, och nu satt han där och flinade.\n”Vad var det?” viskade Tobias.\n”Som om du inte visste”, sa Hedda.\n”Jag vet inte! Kolla.” Tobias tömde sitt pennfodral på bänken. Det var bara svarta och blå pennor.\nIsak satt ensam vid fönstret.\n”Inte jag heller”, sa han. ”Jag har ingen lila penna.”"]
            - ["Isak ställde sig upp och stoppade snabbt händerna i fickorna. Men Hedda hann se en lila strimma på hans långfinger."]
        - rubrik: Frågorna
          rader:
            - ["1. Vilken färg hade bokstäverna på lappen?"]
            - ["2. Varför tittar Hedda på Tobias när hon har läst lappen? Hur vet du det?"]
            - ["3. Vem skrev lappen? Hur vet du det?"]
            - ["4. Varför tror du att någon skrev lappen till Hedda? Vad i texten får dig att tro det?"]
            - ["5. Det stod inget namn på lappen. Vad tycker du om att skriva en lapp utan namn? Varför?"]
    - rubrik: "Mellan, text 6: Till författaren"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 6." }
      listor:
        - rubrik: "Till författaren"
          rader:
            - ["Hej författaren,\nJag heter Bilal. Jag har läst din bok, men det var bara för att den låg kvar i klassrummet när de andra hade valt. Den var väl okej."]
            - ["Kapitlet med kistan läste jag sex gånger, men det var för att jag hade glömt vad som hände. Mamma knackade på och frågade varför lampan i mitt rum lyste klockan elva på kvällen. Jag sa att jag letade efter en strumpa."]
            - ["Finns det fler böcker om honom, eller var det bara den här? Det är inte så viktigt, jag undrar bara. Jag har redan tittat på hyllan i skolbiblioteket två gånger, och i bokaffären vid busshållplatsen också.\nHälsningar\nBilal\nPS Det gick väl bra för honom i slutet? Jag läste slutet tre gånger till, ifall det hade ändrat sig."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många gånger har Bilal läst kapitlet med kistan?"]
            - ["2. Vad tycker Bilal om boken? Hur vet du det?"]
            - ["3. Varför skriver Bilal att han läste boken bara för att den låg kvar i klassrummet? Vad i texten får dig att tro det?"]
            - ["4. Varför läser Bilal slutet tre gånger till? Hur vet du det?"]
            - ["5. Bilal skriver ”Det är inte så viktigt, jag undrar bara.” Borde han skicka brevet precis så? Varför?"]
    - rubrik: "Mellan, text 7: Kartongen"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 7." }
      listor:
        - rubrik: "Kartongen"
          rader:
            - ["Samir hittade kartongen längst in i mormors garderob. Överst låg ett svartvitt foto av elva barn framför ett fotbollsmål. Längst bak stod en målvakt med stora handskar och en keps neddragen över pannan. Bakom örat skymtade änden av en fläta, nästan helt gömd under kepsen."]
            - ["”Vem är han med handskarna?” frågade Samir.\nMormor tog fotot och log. ”Han släppte bara in två mål hela sommaren.”\n”Vad hette han?”\n”Det var länge sedan.” Mormor strök med tummen över kepsen på fotot. ”Den fick aldrig tas av, inte ens när det regnade.”"]
            - ["Mormor vände på fotot. Där stod det med blyerts: Sommarlaget 1971. Under det stod elva namn, och tio av dem var pojknamn. Det elfte var Gunvor.\n”Gunvor”, läste Samir. ”Det står ju på din brevlåda.”\n”Jaså, det gör det.” Sedan tog hon upp de gamla handskarna ur kartongen och slog ihop dem, som om en boll var på väg."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad hade målvakten på huvudet?"]
            - ["2. Mormor säger ”Han släppte bara in två mål hela sommaren.” Vem menar hon med ”han”? Hur vet du det?"]
            - ["3. Varför fick kepsen aldrig tas av sommaren 1971, tror du? Vad i texten får dig att tro det?"]
            - ["4. Mormor tar upp de gamla handskarna. Vad hade du frågat henne i Samirs ställe? Varför?"]
    - rubrik: "Mellan, text 8: Lördag klockan 14"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 8." }
      listor:
        - rubrik: "Lördag klockan 14"
          rader:
            - ["Nour 19.40: Jag och Arvid har bokat en bana på bowlinghallen på lördag klockan 14, och det finns plats för en till.\nArvid 19.41: Det blir fantastiskt! Jag och Nour har redan bestämt i vilken ordning vi ska kasta.\nZahra 19.47: Låter kul.\nZahra 19.47: Men jag har nog jättemycket läxor på lördag, så det blir svårt att hinna allting.\nNour 19.50: Jaha.\nNour 19.51: Du kan ju komma efter läxorna! Vi har banan i två timmar, så det gör inget om du kommer lite sent.\nZahra 19.53: Kanske.\nArvid 19.54: Vi kan vänta med första kastet tills du kommer, om du vill.\nNour 19.56: Jag skriver upp dig på vår bana, så att ingen annan hinner ta platsen.\nZahra 19.57: Då kommer jag! Jag tar med mina egna strumpor."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad är det första Zahra skriver?"]
            - ["2. Arvid skriver ”Det blir fantastiskt!” Vad är det som blir fantastiskt? Hur vet du det?"]
            - ["3. Hur känner sig Zahra när hon har läst Nours och Arvids meddelanden? Hur vet du det?"]
            - ["4. Varför skriver Zahra att hon har jättemycket läxor på lördag? Vad i texten får dig att tro det?"]
            - ["5. Nour skriver upp Zahra på banan innan Zahra har sagt ja. Gjorde Nour rätt? Varför?"]
    - rubrik: "Mellan, text 9: Hinken i hallen"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 9." }
      listor:
        - rubrik: "Hinken i hallen"
          rader:
            - ["Nova låg i sängen och försökte somna. Uppifrån hördes grannen, som sjöng falskt och alldeles för högt. Sedan blev det plötsligt tyst, och Nova somnade."]
            - ["Nästa morgon vaknade hon av att det lät plopp, plopp. I hallen stod en plasthink under en mörk fläck i taket, och därifrån droppade det. Pappa kom rusande med en mopp, fortfarande i pyjamas.\n”Det har regnat hela natten”, sa pappa, ”och nu läcker taket.”\n”Men det regnar ju inte nu”, sa Nova.\n”Då har det väl hunnit sluta. Eller så har ett rör gått sönder.”\nVattnet i hinken var vitt av skum. Nova doppade ett finger i skummet och luktade på det. ”Det luktar lavendel”, sa hon. Pappa sniffade också, tittade upp mot taket och suckade. ”Jag går upp och knackar. Ta med en handduk.”"]
        - rubrik: Frågorna
          rader:
            - ["1. Vad luktar vattnet i hinken, enligt Nova?"]
            - ["2. Var kommer vattnet i hinken ifrån? Hur vet du det?"]
            - ["3. Hur känner sig pappa i slutet av texten? Hur vet du det?"]
            - ["4. Varför ber pappa Nova ta med en handduk? Vad i texten får dig att tro det?"]
            - ["5. Pappa säger ”Jag går upp och knackar.” Vad borde han säga när någon öppnar? Varför?"]
    - rubrik: "Mellan, text 10: Rum 4"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 10." }
      listor:
        - rubrik: "Rum 4"
          rader:
            - ["Ronja vaknade av ett prassel. Månen lyste in genom gardinen i rum 4, och klockan på väggen visade 01.20. I den undre sängen satt Hiba med ryggsäcken i knät. Hon tryckte ner en stor grå tröja i den och drog igen blixtlåset, långsamt, så att det inte skulle höras."]
            - ["”Är du vaken?” viskade Ronja.\n”Sov du, allt är bra”, sa Hiba.\n”Varför är du uppe då?”\n”Jag var törstig”, sa Hiba, men hon höll kvar ryggsäcken i knät och frågade i stället hur många nätter det var kvar.\n”Tre. Vi åker på fredag.”\n”Tre”, sa Hiba. ”Det är ju snart, det är bra.”"]
            - ["Ronja såg tröjans ärm sticka ut ur blixtlåset, och den var mycket större än något Hiba hade haft på sig under dagarna. Utanför dörren slog någon igen en toalettdörr, och sedan blev det tyst.\n”Jag kan inte sova heller”, sa Ronja och flyttade sig närmare väggen. ”Vill du komma upp hit? Det finns plats.”\nHiba satt stilla en stund, och sedan ställde hon ryggsäcken på golvet."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många nätter är det kvar, enligt Ronja?"]
            - ["2. Hur känner sig Hiba? Hur vet du det?"]
            - ["3. Vad menar Hiba när hon säger ”Det är ju snart, det är bra”? Hur vet du det?"]
            - ["4. Hur tror du att Hiba känner sig på fredag, när de åker? Varför?"]
    - rubrik: "Mellan, text 11: Torsdag hos farfar"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 11." }
      listor:
        - rubrik: "Torsdag hos farfar"
          rader:
            - ["Selma stod vid diskhon och sköljde två kaffekoppar. En tallrik med smulor stod på bordet, och köket luktade kaffe och kanel."]
            - ["Farfar kom in från vardagsrummet med tidningen under armen. Han stannade vid kylskåpet, där det satt en gul lapp. Med hans stora handstil stod det ”Torsdag. Selma kommer. Bullar i frysen.”\n”Nu är det nog dags för fika”, sa han och öppnade frysen. ”Du har väl inte hunnit äta något?”\nSelma stängde av kranen och torkade kopparna långsamt. ”Nej, inte än”, sa hon. ”Jag har väntat hela dagen på din kanelbulle.”\n”Då ska du få två!” sa farfar och nynnade medan han plockade fram bullarna."]
            - ["Selma ställde kopparna på bordet igen, en vid varje plats, och satte sig på samma stol som förut.\n”Det är bra att du kommer, Selma”, sa farfar. ”Annars blir det så tyst här.”\n”Då kommer jag nästa torsdag också”, sa Selma."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många kaffekoppar sköljer Selma?"]
            - ["2. Vad har hänt i köket innan farfar kommer in? Hur vet du det?"]
            - ["3. Varför säger Selma ”Nej, inte än”? Vad i texten får dig att tro det?"]
            - ["4. Farfar öppnar frysen och frågar om Selma har hunnit äta något. Vad hade du sagt i Selmas ställe? Varför?"]
    - rubrik: "Mellan, text 12: Snöret"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 12." }
      listor:
        - rubrik: "Snöret"
          rader:
            - ["Tyra satte försiktigt ner träbåten i bäcken bakom skolgården. Den hade ett blått segel av en gammal tygremsa, och på skrovet hade hon skrivit sitt namn med sin finaste handstil. Hon hade arbetat med båten i tre veckor."]
            - ["”Den flyter!” ropade Ravi. ”Får jag hålla i snöret?”\n”Håll hårt”, sa Tyra.\n”Jag håller, nej, vänta, nu gick det av!”\nBåten gled långsamt iväg, snurrade två varv och försvann under gångbron.\n”Förlåt, Tyra, det var bara snöret”, sa Ravi.\n”Det gör inget”, sa Tyra.\n”Men den var ju din!”\n”Jag sa ju att det gör inget.” Hon torkade av händerna på tröjan, först den ena och sedan den andra, fast de inte var blöta.\n”Jag kan bygga en ny åt dig”, sa Ravi.\n”Det behövs inte”, sa Tyra.\nRavi sprang längs bäcken och tittade efter båten i vassen, medan Tyra stod kvar vid bron och räknade sakta till tio. Sedan sprang hon efter honom och ropade: ”Vänta på mig!”"]
        - rubrik: Frågorna
          rader:
            - ["1. Hur länge hade Tyra arbetat med båten?"]
            - ["2. Hur känner sig Ravi när båten har försvunnit? Hur vet du det?"]
            - ["3. Vad menar Tyra när hon säger ”Det gör inget”? Hur vet du det?"]
            - ["4. Varför springer Ravi längs bäcken och tittar efter båten? Vad i texten får dig att tro det?"]
            - ["5. Ravi säger att han kan bygga en ny båt åt Tyra. Vad hade du svarat i Tyras ställe? Varför?"]
    - rubrik: "Mellan, text 13: Skollopp"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 13." }
      listor:
        - rubrik: "Skollopp"
          rader:
            - ["Torsdag kväll. I morgon är det skollopp, tre varv runt fotbollsplanen, och Loke och jag har bestämt hur vi ska göra. Vi ska springa sida vid sida och ta det lugnt, precis som förra året, och sedan ska vi äta varsin glass när vi kommer i mål. Jag har redan köpt två glassar, och mamma har lovat att inte röra dem i frysen."]
            - ["Fredag kväll. Jag vann! Fröken tog ett kort på mig vid mållinjen medan alla klappade, och jag fick en guldmedalj av plast med ett snöre i fel färg. När jag kom hem la jag medaljen längst ner i strumplådan. Mamma undrade varför jag inte ville ha någon glass efter middagen, och jag sa att jag var alldeles för mätt. Det var jag inte. Loke kom in som fyra. Han sa ”Grattis” utan att titta på mig och gick hem åt andra hållet, fast han bor på samma gata som jag. Det är inte mitt fel att jag springer fort. Ett lopp är ju ett lopp. Jag har inte öppnat frysen."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många glassar hade berättaren köpt?"]
            - ["2. Vad blev det av planen som berättaren och Loke hade? Hur vet du det?"]
            - ["3. Varför lägger berättaren medaljen längst ner i strumplådan? Hur vet du det?"]
            - ["4. Varför har berättaren inte öppnat frysen? Hur vet du det?"]
            - ["5. Vad tror du att texten vill säga om att vinna? Varför?"]
    - rubrik: "Mellan, text 14: En runda"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 14." }
      listor:
        - rubrik: "En runda"
          rader:
            - ["Rummet hade blivit större under natten. Där sängen hade stått fanns fyra små märken i golvet, och på väggen satt ljusa fyrkanter efter alla affischerna. Mamma hade skrivit ”Vincents saker” på kartongerna med tjock penna. Jag låtsades att jag inte såg dem."]
            - ["”Gå ut en stund innan vi åker”, sa pappa. ”Du är bara i vägen här.”\nJag gick, mest för att slippa tjatet. Det var en ren slump att jag gick förbi skolan. Det var också en slump att jag stannade vid fotbollsplanen och sparkade tre gånger på målstolpen, som vanligt.\nGrannen vattnade sina krukor vid grinden.\n”Är du ute så tidigt, Vincent?” ropade han.\n”Jag går bara en runda”, sa jag. ”Det är ingenting.”\n”Jaså”, sa grannen och torkade händerna på byxorna. ”Kom och hälsa på i sommar, hör du.”"]
            - ["Vid muren nära hållplatsen tog jag en slät sten och stoppade den i jackfickan. Jag vet inte varför.\nNär jag kom tillbaka hade pappa burit ut den sista kartongen. Jag lade cykelhjälmen överst, så att den skulle komma fram först."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad stoppar Vincent i jackfickan?"]
            - ["2. Varför går Vincent förbi skolan och fotbollsplanen? Hur vet du det?"]
            - ["3. Hur känner sig Vincent i slutet, när han lägger cykelhjälmen överst? Vad i texten får dig att tro det?"]
            - ["4. Grannen säger ”Kom och hälsa på i sommar, hör du.” Vad hade du svarat i Vincents ställe? Varför?"]
    - rubrik: "Mellan, text 15: Någon har varit här"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Mellan, text 15." }
      listor:
        - rubrik: "Någon har varit här"
          rader:
            - ["I morgon är det medeltidsdag i min klass, och alla ska komma utklädda till riddare eller prinsessor. Jag har ingen utklädnad och har bestämt mig för att vara sjuk. Vid middagen sa jag att jag hade ont i magen. Min storasyster Emelie tittade på mamma, och mamma tittade på taket."]
            - ["Sedan upptäckte jag att någon hade varit i mitt rum. Tejpen var borta, och den stora saxen, och silverpappret från julen, och tv-kartongen som mamma hade sparat. Jag visste precis vem det var."]
            - ["Emelie kom ut ur sitt rum och stängde dörren snabbare än vanligt.\n”Har du varit i mitt rum?” frågade jag.\n”Nej, varför skulle jag det?”\n”Du har glitter på kinden.”\n”Det är min nya stil”, sa hon. ”Jag har mycket att göra, Ruben. Gå och bli sjuk någon annanstans.”\nHennes dörr smällde igen. Senare låg jag vaken och hörde en sax klippa där inne, och Emelie som mumlade för sig själv: ”Skölden är klar. Nu är det bara hjälmen kvar.”\nJag drog täcket över huvudet och somnade med ryggen mot väggen, så att hon inte skulle kunna ta något mer."]
        - rubrik: Frågorna
          rader:
            - ["1. Vilka saker är borta från Rubens rum?"]
            - ["2. Varför tittar mamma på taket när Ruben säger att han har ont i magen? Hur vet du det?"]
            - ["3. Varför svarar Emelie nej när Ruben frågar om hon har varit i hans rum? Vad i texten får dig att tro det?"]
            - ["4. Vad förstår du i slutet som Ruben inte förstår? Hur vet du det?"]
            - ["5. Ruben somnar med ryggen mot väggen så att Emelie inte ska kunna ta något mer. Vad hade du gjort i hans ställe? Varför?"]
    - rubrik: "Mellan, kartläggning efter: Två minuter"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Poängen", text: "Lärarens sida för kartläggningen efter, och protokollet i planeringsmallarna." }
      listor:
        - rubrik: "Två minuter"
          rader:
            - ["Elin stod i halvmörkret och drog upp strumporna för tredje gången. Stolar skrapade mot golvet därute, och varje gång någon hostade hördes det hela vägen in. Luften var varm och luktade damm."]
            - ["”Två minuter kvar”, viskade fröken utan att titta på henne.\n”Jag kan gå först om du vill”, sa Elin. Hon hade sagt samma sak för en stund sedan, och fröken nickade bara mot ljuset där framme."]
            - ["Bakom henne tickade en klocka, och över dörren ut mot salen blinkade en röd lampa. De andra hade glittriga dräkter som prasslade när de rörde sig. Elins lapp var mjuk och skrynklig i kanterna, och hon vek den en gång till."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många gånger hade Elin dragit upp strumporna?"]
            - ["2. Hur känner sig Elin? Hur vet du det?"]
            - ["3. Var är Elin? Hur vet du det?"]
            - ["4. Fröken viskar att det är två minuter kvar. Vad hade du sagt till Elin? Varför?"]
    - rubrik: "Lärarens sidor: Avancerad"
      text:
        - "Här är de femton texterna på nivån Avancerad och kartläggningens två. Tabellen visar vad varje text handlar om, vad eleven ska lista ut, vilka slags frågor mellan raderna texten har, hur svår den är och om den har en vändning eller är känslig. Efter tabellen har varje text en egen sida med det du behöver i passet: det som står mellan raderna, var du stannar, vad du säger när du tänker högt, svaren och två öppna frågor till samtalet. Frågorna står på elevens blad, så ha din kopia bredvid."
      oversikt:
        kolumner: [Texten, Handlar om, Eleven listar ut, Frågornas slag, Svårighet]
        rader:
          - ["1. Kassan", "Hugo och hans chef i en kiosk vid en badplats en sommardag.", "varför något händer, eller vad någon vill", "Varför (två frågor), Det som menas, Känsla", "1, enkel, känslig"]
          - ["2. Fiskgratäng", "Emil och Stella vid lunchen i skolmatsalen.", "vad någon egentligen menar", "Vem (syftning), Varför, Det som menas, Känsla", "1, enkel, känslig"]
          - ["3. Hjälptränaren", "Edith i en idrottshall en halvtimme före ett träningspass.", "hur någon känner sig", "Känsla (två frågor), Varför", "1, enkel"]
          - ["4. Kvart i åtta", "Linnea och pappa en vanlig vecka, hemma och inne i stan.", "vad som hände innan, eller vad som händer sedan", "Före och efter (två frågor), Varför", "2, medel, vändning, känslig"]
          - ["5. Burken", "Rania i trapphuset och hos grannen en eftermiddag.", "varför något händer, eller vad någon vill", "Det som menas, Varför, Känsla", "2, medel, vändning, känslig"]
          - ["6. Vågen", "Robin och Ellen bakom slöjdsalen en morgon före skolan.", "vem någon är", "Känsla, Vem, Varför", "2, medel, känslig"]
          - ["7. Måndag morgon", "Signe, Kevin och Clara vid skåpen på måndagen.", "vad någon egentligen menar", "Vem (syftning), Det som menas, Varför, Känsla", "2, medel, känslig"]
          - ["8. Samma sak", "Berättaren och syskonen hemma en vardag, från morgon till natt.", "vad som hände innan, eller vad som händer sedan", "Var och när, Det som menas, Känsla, Före och efter", "2, medel, känslig"]
          - ["9. Nästan", "Berättaren och Ida i en kö.", "var och när det händer", "Var och när (två frågor), Varför", "2, medel"]
          - ["10. Dagen före", "Yusuf och tränaren på en fotbollsplan en kväll.", "varför något händer, eller vad någon vill", "Varför, Känsla, Det som menas", "2, medel"]
          - ["11. Kanelbullen", "Karim och Olle vid skåpen i skolkorridoren två morgnar i rad.", "vad ett ord betyder just här", "Ordet, Det som menas, Känsla", "2, medel, känslig"]
          - ["12. Ingen fara", "Fyra elever skriver till varandra i en gruppchatt under två dagar.", "vad någon egentligen menar", "Känsla, Varför, Det som menas", "3, svår"]
          - ["13. Fyrtio minuter", "Berättaren en lördag i en idrottshall, med många föräldrar på plats.", "vem någon är", "Vem, Känsla, Det som menas", "3, svår, vändning"]
          - ["14. Nästa fredag", "Jonatan och Minna skriver till varandra under tre dagar.", "vad som hände innan, eller vad som händer sedan", "Varför (två frågor), Före och efter", "3, svår, känslig"]
          - ["15. Fyra toner", "Joel skriver ett brev till grannen i lägenheten intill.", "varför något händer, eller vad någon vill", "Varför (två frågor), Känsla", "3, svår, vändning"]
          - ["Kartläggning före: Lappen", "Amira väntar på ett möte en fredagseftermiddag.", "hur någon känner sig", "Känsla, Var och när", "före insatsen"]
          - ["Kartläggning efter: Mejlet", "Mira väntar på att något ska börja en tisdagskväll.", "hur någon känner sig", "Känsla, Var och när", "efter insatsen"]
      delar:
        - rubrik: Så väljer du text
          falt:
            - { rubrik: "Veckans slag", text: "Välj en text med frågor av veckans slag, som progressionen visar: Känsla och Vem i vecka 1, Var och när och Varför i vecka 2, Före och efter i vecka 3, Det som menas i vecka 4–5 och Ordet i vecka 6–8. Metodens texter räcker till ungefär fem veckors pass. Texterna till resten av veckorna, också till Ordet i vecka 6–8, tar du ur serien Mellan raderna eller skriver själv." }
            - { rubrik: "Svårigheten", text: "Börja med svårighet 1, och ta 2 eller 3 när gruppen klarar slutsatsen med mindre stöd. En text med vändning får eleverna att tänka om mot slutet. En känslig text har en rad om det på sin sida. Läs raden före passet, och ta inte två texter om samma slags svåra sak samma vecka." }
            - { rubrik: "Nivåerna", text: "Välj nivå efter gruppen, och blanda gärna, till exempel en text på Lättläst när ni övar ett nytt tankesteg och en på Mellan när det sitter." }
    - rubrik: "Lärarens sida: Avancerad, text 1, Kassan"
      text:
        - "Det som står mellan raderna: Två barn hade bara 31 kronor, men Hugo gav dem glass för 50. Chefen förstår och väntar ut honom."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Låt samtalet handla om Hugo och inte om elevernas egna misstag." }
            - { rubrik: "Före läsningen", text: "Hur räknar man ut vad två saker kostar?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Han torkade av disken, som redan var ren.” Något är konstigt: han torkar en ren disk." }
            - { rubrik: "Tänka högt · fråga 3, Varför", text: "”Vänta, här står inte varför det fattas pengar. Det står ’Trettio, trettioett.’ och ’På displayen stod det 50.’ Jag vet att 50 minus 31 är 19. Alltså tror jag att Hugo lät barnen betala mindre och bjöd på skillnaden. Stämmer det med resten? Jag läser vidare. Hugo lägger dit en tjugolapp. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "25 kronor." }
            - { rubrik: "Fråga 2 · mellan raderna, Varför", text: "Ledtrådarna: ”tittade på mynten och sedan på de röda ansiktena”; ”gjorde kulorna extra stora”.\nSvar som texten stöder: han tycker synd om barnen eller vill ge dem glass. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”De bad om det.” De bad bara om två glassar.\nFråga tillbaka: ”Vad tittar Hugo på först?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Trettio, trettioett.”; ”På displayen stod det 50.”\nSvar som texten stöder: barnen betalade 31 kronor för glass som kostar 50, och Hugo bjöd på resten.\nEn tanke att pröva: ”Hugo tog pengarna.” Han lägger dit en egen tjugolapp.\nFråga tillbaka: ”Vad visade displayen?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Det som menas", text: "Ledtrådarna: ”Kassan har stämt varje kväll sedan juni”; ”tittade på skylten och sedan på honom”.\nSvar som texten stöder: hon tror inte på honom och väntar på sanningen.\nEn tanke att pröva: ”Hon tror honom.” Hon påminner om att kassan har stämt.\nFråga tillbaka: ”Vad tittar chefen på?”" }
            - { rubrik: "Fråga 5 · mellan raderna, Känsla", text: "Ledtrådarna: ”Han torkade av disken, som redan var ren”; ”Hugo sa inget”.\nSvar som texten stöder: skamsen eller orolig.\nEn tanke att pröva: ”Lugn, han står ju och städar.” Disken var redan ren.\nFråga tillbaka: ”Varför torkar han en disk som redan är ren?”" }
            - { rubrik: "Fråga 6 · bortom raderna", text: "Ett bra svar pekar på texten och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Vad får Hugo att säga ’Det var jag’ just då?”; ”Vad tror ni att chefen tänker när hon ger honom kronan?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”På displayen stod det 50.”" }
    - rubrik: "Lärarens sida: Avancerad, text 2, Fiskgratäng"
      text:
        - "Det som står mellan raderna: Emil är förälskad i Wilma och äter samma rätt som hon, fast han inte tycker om fisk. Han nekar när Stella anar något."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Att bli retad för att man är förälskad kan kännas pinsamt. Låt eleverna prata om Emil och Stella och inte om varandra." }
            - { rubrik: "Före läsningen", text: "Hur väljer man var man vill sitta i skolmatsalen?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Ingen, jag menade ingen särskild.” Någon ändrar sig: han tar tillbaka frågan." }
            - { rubrik: "Tänka högt · fråga 4, Det som menas", text: "”Vänta, han säger att han älskar fisk, men det stämmer knappast. Jag ser framför mig hur han sväljer hårt. Det står ’fisk smakade gammal badsvamp’ och ’Ingen, jag menade ingen särskild’. Jag vet att man låtsas tycka om något för att imponera. Alltså tror jag att Emil äter fisk för att imponera på någon. Stämmer det med resten? Jag läser vidare. Hans tallrik är nästan full när han går. Det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Gammal badsvamp." }
            - { rubrik: "Fråga 2 · mellan raderna, Vem, syftning", text: "Ledtrådarna: ”bredvid salladsbaren satt Wilma”; ”vred huvudet en bit”.\nSvar som texten stöder: Wilma.\nEn tanke att pröva: ”Stella.” Stella frågar ”Vem då”, så hon är inte den han menar.\nFråga tillbaka: ”Åt vilket håll tittar Emil, och vem sitter där?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”svalde hårt”; ”fisk smakade gammal badsvamp”.\nSvar som texten stöder: han sköljer ner fisken eller är nervös. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Han är törstig.” Han dricker efter tuggorna och sväljer hårt.\nFråga tillbaka: ”Vad sa Emil förra året om hur fisk smakar?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Det som menas", text: "Ledtrådarna: ”på hennes bricka stod fiskgratäng”; ”du brukar alltid sitta vid fönstret”.\nSvar som texten stöder: att han är kär i Wilma.\nEn tanke att pröva: ”Att han tycker om fisk.” Stella minns att han sa att fisk smakade badsvamp.\nFråga tillbaka: ”Vad åt Wilma, och var brukar Emil sitta?”" }
            - { rubrik: "Fråga 5 · mellan raderna, Känsla", text: "Ledtrådarna: ”fast hans tallrik var nästan full”; ”utan att se sig om”.\nSvar som texten stöder: nervös, hoppfull eller generad.\nEn tanke att pröva: ”Mätt, för han har ätit klart.” Hans tallrik är nästan full.\nFråga tillbaka: ”Hur mycket fisk ligger kvar på tallriken?”" }
            - { rubrik: "Fråga 6 · bortom raderna", text: "Ett bra svar tar med att Emil aldrig sa det rakt ut." }
            - { rubrik: "Öppna frågor", text: "”Emil viskar ’Vad sa hon egentligen?’ Vad tror ni att hon har sagt?”; ”Stella säger ’Nej då, ät din fisk.’ Vad tror ni att hon menar?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”jag menade ingen särskild”." }
    - rubrik: "Lärarens sida: Avancerad, text 3, Hjälptränaren"
      text:
        - "Det som står mellan raderna: Edith är stolt och nervös som ny hjälptränare och saknar sitt gamla lag. När Albin ropar är hon dragen åt två håll."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad gör man när man vill att något nytt ska bli rätt första gången?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Hej och välkomna’, sa hon tyst, och sedan en gång till med mörkare röst.” Något upprepas: Edith övar sin hälsning två gånger." }
            - { rubrik: "Tänka högt · fråga 2, Känsla", text: "”Vänta, här står inte hur Edith känner sig. Jag ser framför mig en tjej som flyttar en kon fram och tillbaka. Det står ’flyttade den sista en halv meter’ och ’rätade på ryggen’. Jag vet att man övar när man är nervös, och att man rätar på ryggen när man är stolt. Alltså tror jag att hon är nervös och stolt. Stämmer det med resten? Jag läser vidare. Hon blir stående när hon hör ropet. Ja, det stämmer, och det är mer än nerver.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Hej och välkomna." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”flyttade den sista en halv meter”; ”rätade på ryggen”; ”Hej och välkomna”.\nSvar som texten stöder: nervös och stolt. Båda räknas. Ge gärna orden spänd och pirrig.\nEn tanke att pröva: ”Lugn, hon är ju först på plats.” Hon flyttar konen och övar sin hälsning.\nFråga tillbaka: ”Vad gör Edith med den sista konen?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Hon kände igen rösten”; ”alltid stod till höger om henne”.\nSvar som texten stöder: hon saknar sitt gamla lag eller är avundsjuk. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hon har glömt vad hon skulle göra.” Hon stannar när hon känner igen rösten.\nFråga tillbaka: ”Vem ropar, och vad gjorde de två tillsammans?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Känsla", text: "Ledtrådarna: ”Hon tog ett steg mot dörren”; ”grep en liten hand tag i tränartröjan”.\nSvar som texten stöder: sugen på att spela men orolig för barnen, eller splittrad.\nEn tanke att pröva: ”Glad, hon ska ju få spela.” Hon tittar på klockan, och barnen väntar.\nFråga tillbaka: ”Vad gör Edith när Albin har frågat?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett bra svar tar med klockan eller handen i tröjan och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Varför tror ni att Edith blev hjälptränare?”; ”Den minsta frågar ’Är du tränaren?’ Vad tror ni att barnen tänker om Edith?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”blev stående med en kon i handen”." }
    - rubrik: "Lärarens sida: Avancerad, text 4, Kvart i åtta"
      text:
        - "Det som står mellan raderna: Pappa jobbar inte längre på lagret men går hemifrån varje morgon. Han pluggar på biblioteket inför något på fredag och vill berätta när han vet hur det har gått."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Någon i gruppen kan ha en förälder som har förlorat jobbet. Fråga inte om elevernas familjer, och säg gärna att pappa har en plan." }
            - { rubrik: "Före läsningen", text: "Hur ser en vanlig morgon ut för någon som ska iväg till jobbet?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Den hade hängt där i tre veckor, och jag trodde att han hade en till.” Något är konstigt: arbetsjackan hänger kvar." }
            - { rubrik: "Tänka högt · fråga 2, Före och efter", text: "”Vänta, här står inte vad som har hänt. Jag ser framför mig en arbetsjacka som bara hänger i hallen. Det står ’Den hade hängt där i tre veckor’, och det står ’Varje morgon.’ Jag vet att man tar med jackan till jobbet. Alltså tror jag att pappa inte jobbar på lagret längre men går hemifrån ändå. Stämmer det med resten? Jag läser vidare. Lagret ligger åt andra hållet. Det stämmer, men vad gör han där?”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Öppnar 10.00." }
            - { rubrik: "Fråga 2 · mellan raderna, Före och efter", text: "Ledtrådarna: ”Den hade hängt där i tre veckor”; ”Lagret ligger åt andra hållet.”\nSvar som texten stöder: pappa har slutat eller sagts upp på lagret för tre veckor sedan.\nEn tanke att pröva: ”Han har en annan jacka på jobbet.” Men han sitter på biblioteket.\nFråga tillbaka: ”Hur länge har jackan hängt kvar?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Jag är tidig”; ”Jag tänkte berätta när jag vet hur det gick.”\nSvar som texten stöder: han vill inte oroa familjen, han skäms eller han vill ha något bra att berätta först. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Han vill ljuga för dem.” Han säger att han tänker berätta senare.\nFråga tillbaka: ”När säger pappa att han tänker berätta?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Före och efter", text: "Ledtrådarna: ”gul av överstrykningspenna”; ”Jag har något på fredag”.\nSvar som texten stöder: han pluggar inför något på fredag, troligen ett prov, kanske för ett nytt jobb.\nEn tanke att pröva: ”Han är ledsen och har inget att göra.” Sidorna är gula av överstrykningspenna.\nFråga tillbaka: ”Vad har pappa i knät, och hur ser sidorna ut?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett svar kan vara att det var rätt, eftersom hon kunde hjälpa honom, eller att hon borde ha låtit honom berätta själv. Ett bra svar ger ett skäl ur texten." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att Linnea tänker på bakom busskuren?”; ”Pappa säger ’Jag tänkte berätta när jag vet hur det gick.’ Vad tror ni att han är mest orolig för?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Den hade hängt där i tre veckor”." }
    - rubrik: "Lärarens sida: Avancerad, text 5, Burken"
      text:
        - "Det som står mellan raderna: Grannen hittar på ärenden för att få sällskap när Rania kommer hem. Rania förstår det och ger honom ett eget skäl att ses igen."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Någon i gruppen kan själv vara ensam eller ha någon nära sig som är det. Låt samtalet handla om grannen och Ranias val." }
            - { rubrik: "Före läsningen", text: "Vad brukar man hjälpa äldre grannar med?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Du bytte den i tisdags.” Något är konstigt: lampan är redan bytt." }
            - { rubrik: "Tänka högt · fråga 3, Varför", text: "”Vänta, här står inte varför han ber om hjälp. Jag tänker att grannen är gammal och behöver hjälp. Jag ser framför mig grannen i ylletofflor. Det står ’Hon vred på locket en gång’ och ’Du bytte den i tisdags’. Jag vet att man inte ber om hjälp med saker som redan fungerar. Alltså tror jag att han vill ha sällskap. Stämmer det med resten? Jag läser vidare. Grannen frågar om klockan fyra passar, och han nynnar. Först trodde jag att han behövde hjälp, men han ville ha sällskap.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "En kaffekopp, ett glas saft och en plåt med havrekakor." }
            - { rubrik: "Fråga 2 · mellan raderna, Det som menas", text: "Ledtrådarna: ”ett glas saft som redan var upphällt”; ”alldeles för mycket som vanligt”.\nSvar som texten stöder: han hoppas att hon stannar mycket längre.\nEn tanke att pröva: ”Fem minuter, det står ju.” På bordet står redan saft och havrekakor.\nFråga tillbaka: ”Vad står på köksbordet?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Hon vred på locket en gång, och det gick upp”; ”Du bytte den i tisdags”; ”Jag har ett ärende i morgon”.\nSvar som texten stöder: grannen hittar på ärenden för att få sällskap, och Rania hittar på ett eget.\nEn tanke att pröva: ”Han är gammal och orkar inte själv.” Locket går upp på en gång, och lampan är ny.\nFråga tillbaka: ”Vad händer när Rania vrider på locket?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Känsla", text: "Ledtrådarna: ”Min cykelpump behöver en expert”; ”Och helst en havrekaka”.\nSvar som texten stöder: varm om hjärtat, road, omtänksam eller trött men nöjd. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Sur, för hon fick inte göra sina läxor.” Hon hittar på ett ärende och ber om en kaka.\nFråga tillbaka: ”Varför säger Rania att hon har ett ärende i morgon?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett svar kan vara att det var vänligt, eftersom ingen behöver säga rakt ut att de vill ses, eller att hon hellre kunde säga det öppet. Ett bra svar ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Grannen nynnar i trapphuset när Rania har stängt dörren. Vad tror ni att han tänker?”; ”Grannens dörr har gått upp varje eftermiddag sedan i höstas. Vad tror ni hände då?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Hon vred på locket en gång, och det gick upp”." }
    - rubrik: "Lärarens sida: Avancerad, text 6, Vågen"
      text:
        - "Det som står mellan raderna: Ellen har målat vågen. Robin förstår det när han ser hennes skor och väljer att tiga, fast rektorn hotar att hela skolan ska få skrubba väggen."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "I texten tiger Robin om en väns regelbrott. Låt samtalet handla om Robin och Ellen." }
            - { rubrik: "Före läsningen", text: "Hur kan man lista ut vem som har gjort något?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”’Och fisken är bäst’, sa hon och nickade mot hörnet.” Något är konstigt: ingen har nämnt någon fisk." }
            - { rubrik: "Tänka högt · fråga 3, Vem", text: "”Vänta, här står inte vem som målade. Jag ser framför mig väggen med vågen och Ellen som gäspar. Det står ’Fyra timmar, minst’ och ’Och fisken är bäst’. Jag vet att man bara vet sådant om man har varit där. Alltså tror jag att Ellen har målat den. Stämmer det med resten? Jag läser vidare. Hon har en blå rand på skon. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Orange." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”Helt sjukt”; ”glömde att gå in”.\nSvar som texten stöder: förvånad, imponerad eller nyfiken på vem som har målat. Alla håller när eleven visar en ledtråd. Ge gärna ordet häpen.\nEn tanke att pröva: ”Arg, för någon har förstört väggen.” Han undrar hur det gick till och klagar inte.\nFråga tillbaka: ”Vad säger Robin om väggen, och vad glömmer han?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Vem", text: "Ledtrådarna: ”Och fisken är bäst”; ”över tårna gick en smal blå rand”.\nSvar som texten stöder: Ellen.\nEn tanke att pröva: ”Dennis, Robin säger ju det.” Ellen säger att han bara kan rita sitt eget namn.\nFråga tillbaka: ”Vem vet att fisken finns, och vad har hon på skorna?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Varför", text: "Ledtrådarna: ”Robin såg på Ellens vita skor”; ”hela skolan skrubba väggen”.\nSvar som texten stöder: han skyddar Ellen eller vill att hon själv ska säga det. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Han vet ingenting.” Han har just sett den blå randen på Ellens sko.\nFråga tillbaka: ”Vad tittar Robin på innan han svarar?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett bra svar tar med rektorns hot och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Ska målningen få sitta kvar? Vad kunde rektorn göra i stället?”; ”Vad tror ni att Ellen tänker när hon tittar på fisken?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Och fisken är bäst”." }
    - rubrik: "Lärarens sida: Avancerad, text 7, Måndag morgon"
      text:
        - "Det som står mellan raderna: Tjejen på bilden är Clara. Hon låtsas att det är kul men är sårad, och säger ifrån till Kevin när Signe har gått."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Låt samtalet handla om Clara och inte om elevernas egna erfarenheter." }
            - { rubrik: "Före läsningen", text: "Vad händer med en rolig bild som någon lägger upp?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Hon öppnade sitt skåp, tog ut en bok och la tillbaka den.” Något är konstigt: Clara lägger tillbaka boken direkt." }
            - { rubrik: "Tänka högt · fråga 3, Det som menas", text: "”Vänta, här står inte vad Clara tycker. Det står ’Haha. Bra bild’ och ’tog ut en bok och la tillbaka den’. Jag vet att man pillar med saker när man döljer hur man mår. Alltså tror jag att Clara låtsas att det är kul. Stämmer det med resten? Jag läser vidare. Hon säger ’Haha’ igen, och Kevin tror att hon tar det bra. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Fyrtio." }
            - { rubrik: "Fråga 2 · mellan raderna, Vem, syftning", text: "Ledtrådarna: ”På skärmen sov en tjej på en soffa”; ”Jag ser ut som ett troll.”\nSvar som texten stöder: Clara, tjejen på bilden.\nEn tanke att pröva: ”Signe.” Signe står bredvid och skrattar.\nFråga tillbaka: ”Vem säger ’Jag ser ut som ett troll’?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Det som menas", text: "Ledtrådarna: ”tog ut en bok och la tillbaka den”; ”Fyrtio”.\nSvar som texten stöder: hon låtsas ta det lugnt men är generad eller sårad.\nEn tanke att pröva: ”Hon tycker att det är kul.” Hon säger ”Haha” men pillar med en bok.\nFråga tillbaka: ”Vad gör hon med boken?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Varför", text: "Ledtrådarna: ”Signe sprang mot matten”; ”sa Clara lågt”.\nSvar som texten stöder: hon vill säga det utan publik eller inte skämma ut Kevin. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hon har bråttom till matten.” Det är Signe som springer mot matten.\nFråga tillbaka: ”Vad säger Clara när Signe har gått?”" }
            - { rubrik: "Fråga 5 · mellan raderna, Känsla", text: "Ledtrådarna: ”Jag vet”; ”Clara stängde skåpet”; ”Nu tänkte du”.\nSvar som texten stöder: lättad, allvarlig eller sårad, och kanske lite arg på Kevin.\nEn tanke att pröva: ”Glad, för bilden är borta.” Hon säger ”Nu tänkte du”, och det låter allvarligt.\nFråga tillbaka: ”Vad har Kevin just gjort när hon säger ’Jag vet’?”" }
            - { rubrik: "Fråga 6 · bortom raderna", text: "Ett bra svar tar med något Clara eller Kevin gör, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Kevin öppnade munnen och stängde den igen. Vad tror ni att han ville säga?”; ”Clara säger ’Jag vet.’ Vad kan hon mena?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”tog ut en bok och la tillbaka den”." }
    - rubrik: "Lärarens sida: Avancerad, text 8, Samma sak"
      text:
        - "Det som står mellan raderna: Mamma mår dåligt, och Noor har tagit över hushållet. Berättaren tycker bara att Noor har blivit tråkig."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Texten kan beröra en elev med en sjuk förälder eller mycket ansvar hemma. Pressa inte fram ett namn på sjukdomen, och ta ett enskilt samtal om någon blir tyst. Ta inte texterna Samma sak och Kvart i åtta samma vecka." }
            - { rubrik: "Före läsningen", text: "Vad behöver någon göra hemma varje dag för att vardagen ska fungera?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Jag sa att det var fusk, men hon sa att det var samma sak.” Något är konstigt: vad är samma sak?" }
            - { rubrik: "Tänka högt · fråga 5, Före och efter", text: "”Vänta, här står inte vad som har hänt. Det står ’Förut brukade hon dansa runt i köket’ och ’mammas stora, runda bokstäver’. Jag vet att en förälder brukar göra sådant. Alltså tror jag att något har hänt med mamma, och Noor har tagit över. Stämmer det med resten? Jag läser vidare. Noor tvättar, dammsuger och hinner inget annat. Det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Berättarens läxlapp." }
            - { rubrik: "Fråga 2 · mellan raderna, Var och när", text: "Ledtrådarna: ”mammas stängda dörr”; ”brickan från lunchen”.\nSvar som texten stöder: i sitt rum.\nEn tanke att pröva: ”Hon är på jobbet.” Noor ställer maten utanför hennes dörr.\nFråga tillbaka: ”Var ställer Noor maten?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Det som menas", text: "Ledtrådarna: ”med mammas stora, runda bokstäver”; ”mamma vilar”.\nSvar som texten stöder: att det blir lika rätt, eftersom mamma inte orkar.\nEn tanke att pröva: ”Att det är fusk.” Fusk är berättarens ord.\nFråga tillbaka: ”Vem brukar skriva under?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Känsla", text: "Ledtrådarna: ”med ögonen nästan stängda”; ”för första gången på hela dagen”.\nSvar som texten stöder: trött, ensam eller lättad över att få sätta sig.\nEn tanke att pröva: ”Arg, för hon svarar kort.” Hon viker strumpor halvsovande.\nFråga tillbaka: ”När sätter sig Noor ner?”" }
            - { rubrik: "Fråga 5 · mellan raderna, Före och efter", text: "Ledtrådarna: ”Förut brukade hon dansa”; ”Hon har vilat hela veckan”.\nSvar som texten stöder: mamma är sjuk eller mår dåligt, och Noor har tagit över. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Inget, hon är tråkig.” Mamma har vilat hela veckan.\nFråga tillbaka: ”Vad gör Noor som mamma gjorde förut?”" }
            - { rubrik: "Fråga 6 · bortom raderna", text: "Ett bra svar tar med vad berättaren gör." }
            - { rubrik: "Öppna frågor", text: "”Noor säger ’Jag hinner inte.’ Vad tror ni att hon helst hade velat göra?”; ”Noors mobil surrar tills hon vänder den nedåt. Vem kan det vara?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”mamma vilar”." }
    - rubrik: "Lärarens sida: Avancerad, text 9, Nästan"
      text:
        - "Det som står mellan raderna: De är på ett nöjesfält en kväll, och Ida är några centimeter för kort för att få åka. Hon döljer att hon är ledsen, och berättaren funderar på att hjälpa henne att kringgå regeln."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad kan man höra, känna lukten av och se på ett ställe, så att man förstår var man är?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Långt däruppe skrek någon av ren lycka, och ljudet försvann med ett sus.” Något är konstigt: vilket ställe är det?" }
            - { rubrik: "Tänka högt · fråga 2, Var och när", text: "”Vänta, här står inte var de är. Jag ser framför mig ett ställe med hög musik och sockersöt doft. Det står ’Musiken dunkade så högt att jag kände den i fötterna’, och det står ’luktade sockervadd’. Jag vet att sådant finns på ett nöjesfält med åkattraktioner. Alltså tror jag att de är på ett tivoli. Stämmer det med resten? Jag läser vidare. Det finns en skylt, Minst 140, som vid en åkattraktion. Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Minst 140." }
            - { rubrik: "Fråga 2 · mellan raderna, Var och när", text: "Ledtrådarna: ”Musiken dunkade så högt”; ”luktade sockervadd”; ”Minst 140”.\nSvar som texten stöder: på ett nöjesfält eller tivoli, vid en åkattraktion.\nEn tanke att pröva: ”På en konsert.” Musiken finns, men luften luktar sockervadd och pommes.\nFråga tillbaka: ”Vad luktar det?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Var och när", text: "Ledtrådarna: ”Lamporna tändes en efter en”; ”himlen bakom dem blev mörkblå”; ”sista åket”.\nSvar som texten stöder: på kvällen, när det blir mörkt och nöjesfältet snart stänger.\nEn tanke att pröva: ”Mitt på dagen.” Lamporna tänds och himlen blir mörkblå.\nFråga tillbaka: ”Vad gör lamporna?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Varför", text: "Ledtrådarna: ”Det är okej”; ”det ser ändå läskigt ut”; ”räkna baklänges”.\nSvar som texten stöder: hon vill dölja att hon är ledsen, eller hon vill inte att berättaren ska må dåligt, eller hon är lite rädd på riktigt. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hon vill inte åka, hon säger ju det.” Hon var ivrig och ställde sig på tå under strecket.\nFråga tillbaka: ”Hur ivrig var Ida i början?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett svar kan vara att byta skor med Ida, eftersom det bara fattas lite, eller att låta bli, eftersom gränsen skyddar henne. Ett bra svar väger Idas besvikelse mot varför gränsen finns och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Berättaren säger ’Hon växte två centimeter i går.’ Vad tror ni att han hoppas att killen gör?”; ”Killen i röd jacka säger ’Nästan’ i stället för ’Nej’. Varför tror ni att han väljer det ordet?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”luktade sockervadd” och på ”Lamporna tändes en efter en”." }
    - rubrik: "Lärarens sida: Avancerad, text 10, Dagen före"
      text:
        - "Det som står mellan raderna: Yusuf har ont i foten och döljer det, eftersom han är rädd att missa finalen. Tränaren har genomskådat honom."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad gör en idrottare dagen före en viktig match?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”På vänster fot hade han två strumpor.” Något är konstigt: han har två strumpor på ena foten och springer bara när någon tittar." }
            - { rubrik: "Tänka högt · fråga 2, Varför", text: "”Vänta, varför springer han bara när tränaren tittar? Jag ser framför mig hur han springer fort under strålkastarna. Det står ’så länge tränaren tittade åt hans håll’, och det står ’gick han lite snett’. Jag vet att man döljer något när man är rädd att bli bortvald. Alltså tror jag att han har ont i foten och döljer det. Stämmer det med resten? Jag läser vidare. Tränaren säger ’Två strumpor’ och ’Det är tjugo grader’. Det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Två." }
            - { rubrik: "Fråga 2 · mellan raderna, Varför", text: "Ledtrådarna: ”så länge tränaren tittade åt hans håll”; ”gick han lite snett”.\nSvar som texten stöder: han har ont i foten och döljer det för att få spela finalen.\nEn tanke att pröva: ”Han vill visa hur snabb han är.” Han går lite snett när tränaren vänder sig om.\nFråga tillbaka: ”Vad gör Yusuf när tränaren vänder sig om?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”Yusuf log så brett att han glömde att halta”; ”han läste det två gånger”.\nSvar som texten stöder: glad, stolt eller lättad, kanske fortfarande nervös. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Ledsen, för han har ont.” Han ler så brett att han glömmer att halta.\nFråga tillbaka: ”Vad gör Yusuf när tränaren har sagt ’Du spelar’?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Det som menas", text: "Ledtrådarna: ”Två strumpor.”; ”Det är tjugo grader.”\nSvar som texten stöder: hon vet att han har ont i foten och vill att han slutar låtsas.\nEn tanke att pröva: ”Hon tycker att strumporna är smutsiga.” Hon säger bara ”Det är tjugo grader”.\nFråga tillbaka: ”Vad sa hon om strumporna?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett bra svar tar med något ur texten och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Tränaren tittar länge på Yusuf innan hon säger ’Du spelar.’ Vilka saker tror ni att hon väger mot varandra?”; ”Yusuf snörade om skon fast den redan satt hårt. Finns det fler sätt att förstå varför han gjorde det?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”På vänster fot hade han två strumpor”." }
    - rubrik: "Lärarens sida: Avancerad, text 11, Kanelbullen"
      text:
        - "Det som står mellan raderna: ”Läget?” är en hälsning som man svarar kort på, men Karim svarar långt. Olle skrattar vänligt och frågar dagen efter på riktigt om lillebrodern."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "En elev som själv är ny i Sverige kan känna igen sig. Låt eleven berätta om ord eller vanor som var svåra, bara om hen vill, och säg gärna att Olle skrattar vänligt." }
            - { rubrik: "Före läsningen", text: "Vad säger man när man möter en kompis i korridoren på morgonen?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Olle stod helt stilla med kanelbullen halvvägs till munnen medan en tjej gick förbi och sa ’Läget?’ till en klasskompis, som svarade ’Läget’ utan att någon av dem saktade in.” Något upprepas: alla säger Läget." }
            - { rubrik: "Tänka högt · fråga 2, Ordet", text: "”Vänta, här står inte vad Läget betyder. Jag ser framför mig korridoren, där två säger Läget och går vidare. Det står ’Olle stod helt stilla’ och ’utan att någon av dem saktade in’. Jag vet att man inte svarar på en riktig fråga med samma ord. Alltså tror jag att Läget är en hälsning, ungefär hej. Stämmer det med resten? Jag läser vidare. Olle skrattar. Det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Feber." }
            - { rubrik: "Fråga 2 · mellan raderna, Ordet", text: "Ledtrådarna: ”utan att någon av dem saktade in”; ”Bra, och du?”\nSvar som texten stöder: en hälsning, ungefär hej.\nEn tanke att pröva: ”Att Olle vill veta hur Karim mår.” De andra svarar med samma ord och går vidare.\nFråga tillbaka: ”Vad gör tjejen och kompisen efter att de har sagt ’Läget’?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Det som menas", text: "Ledtrådarna: ”Du frågade”; ”Olle skrattade så mycket”.\nSvar som texten stöder: att Karim svarade mycket mer än man brukar.\nEn tanke att pröva: ”Att Olle är arg.” Han skrattar och frågar sedan om lillebrodern.\nFråga tillbaka: ”Vad gör Olle sedan?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Känsla", text: "Ledtrådarna: ”Karim blev stående med handen på skåpsdörren”; ”tillsammans gick de mot klassrummet”.\nSvar som texten stöder: glad, lättad eller stolt, kanske rörd. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Ledsen, för Olle skrattade åt honom.” Olle frågar om lillebrodern och delar sin bulle.\nFråga tillbaka: ”Vad frågar Olle om, och vad gör Karim sedan?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett bra svar tar med att Karim försökte vara artig, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Olle bryter kanelbullen och räcker fram ena halvan. Vad vill han säga med det?”; ”Karim säger att lillebrodern nu vill ha kanelbulle också. Vad tror ni att han vill visa med det?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”utan att någon av dem saktade in”." }
    - rubrik: "Lärarens sida: Avancerad, text 12, Ingen fara"
      text:
        - "Det som står mellan raderna: Astrid har gjort nästan allt och säger ”ingen fara” fast hon är trött och sur. Hennes tack är ironiskt, och först då märker de andra det."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Hur brukar en grupp dela upp arbetet i ett grupparbete?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Tack för all hjälp, allihopa. Utan er hade jag ju behövt göra allt själv, och det hade varit tråkigt.” Någon säger en sak och menar en annan: ingen har hjälpt henne." }
            - { rubrik: "Tänka högt · fråga 4, Det som menas", text: "”Vänta, här står inte vad Astrid menar. Jag ser framför mig hur hon satt uppe halva natten. Det står ’Tack för all hjälp, allihopa’ och ’Utan er hade jag ju behövt göra allt själv’. Jag vet att man kan säga tack på ett elakt sätt när ingen har hjälpt en. Alltså tror jag att hon menar att ingen hjälpte henne. Stämmer det med resten? Jag läser vidare. Marcus frågar om hon menar det på riktigt, och Jasmin skriver att de trodde att hon tyckte om det. Det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "02.41." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”Torsdag 02.41”; ”nu behöver ni bara läsa”.\nSvar som texten stöder: trött, stressad eller lättad över att vara klar.\nEn tanke att pröva: ”Utvilad och glad.” Klockan är 02.41, och hon har skrivit två delar extra.\nFråga tillbaka: ”Hur dags skriver Astrid att hon är klar, och hur många delar har hon skrivit?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Ingen fara, jag tar det”; ”Utan er hade jag ju behövt göra allt själv”.\nSvar som texten stöder: hon vill inte bråka, eller hon vill hellre göra det själv, eller hon vill att de ska tycka om henne. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Hon tycker att det är kul att göra allt.” Hon skriver senare att det hade varit tråkigt.\nFråga tillbaka: ”Vad skriver hon senare?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Det som menas", text: "Ledtrådarna: ”Tack för all hjälp, allihopa”; ”Utan er hade jag ju behövt göra allt själv”.\nSvar som texten stöder: att ingen hjälpte henne och att hon är sur eller sårad, alltså ironi. Ge gärna ordet ironi.\nEn tanke att pröva: ”Att hon är tacksam.” Hon skriver att hon har behövt göra allt själv.\nFråga tillbaka: ”Vem har gjort allt, och vad skriver hon om ’er’?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett svar kan vara att skriva som det är, att hon är trött på att göra allt, eller att svara mjukt och föreslå hur de kan dela upp det. Ett bra svar tar med något Astrid skrev, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att Hampus och Marcus tänker när de läser Astrids tack?”; ”Hampus skriver ’Haha, bra skämt!’ Vad kan han mena? Kan han mena något annat?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Utan er hade jag ju behövt göra allt själv”." }
    - rubrik: "Lärarens sida: Avancerad, text 13, Fyrtio minuter"
      text:
        - "Det som står mellan raderna: Berättaren är en femtonåring som dömer en barnmatch. Pappan som skrek förstår efteråt hur svårt jobbet är."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad brukar man höra från åskådarna vid en match?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Ändå var det mig alla tittade på.” Något är konstigt: alla tittar på den som aldrig rör bollen." }
            - { rubrik: "Tänka högt · fråga 2, Vem", text: "”Vänta, här står inte vem berättaren är. Jag ser framför mig någon som springer utan boll. Det står ’Ingen passade till mig’ och ’Ändå var det mig alla tittade på.’ Jag vet att man passar till den man litar på. Alltså tror jag att hen är spelare. Stämmer det med resten? Jag läser vidare. Hen har svart tröja och visselpipa. Först trodde jag att hen var spelare, men nu förstår jag att hen är domare.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Femtio kronor per match." }
            - { rubrik: "Fråga 2 · mellan raderna, Vem", text: "Ledtrådarna: ”Den svarta tröjan klibbade”; ”visselpipan”.\nSvar som texten stöder: berättaren är domare i en barnmatch.\nEn tanke att pröva: ”En spelare som ingen passar bollen till.” Berättaren har svart tröja och de andra gult och rött.\nFråga tillbaka: ”Vilken tröja har berättaren, och vilka färger har de andra?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”Jag låtsades att jag inte hörde”; ”kollade klockan på handleden för femte gången”.\nSvar som texten stöder: pressad, otålig eller trött, men hen försöker hålla sig lugn. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Glad, för hen springer hela tiden.” Hen låtsas att hen inte hör pappan.\nFråga tillbaka: ”Hur många gånger har berättaren kollat klockan?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Det som menas", text: "Ledtrådarna: ”Är du blind?”; ”Jag hade inte gjort det för hundra”.\nSvar som texten stöder: pappan visar respekt utan att säga förlåt, och han tycker att jobbet är värt mer än femtio kronor.\nEn tanke att pröva: ”Han är fortfarande arg på berättaren.” Han säger att han inte hade gjort det för hundra.\nFråga tillbaka: ”Vad sa pappan under matchen, och vad säger han nu?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett bra svar tar med att pappan först skrek och sedan ändrade sig, och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Berättaren låtsas att hen inte hör pappan. Vad tror ni att hen hade velat svara?”; ”Varför tror ni att berättaren tar nästa match?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Den svarta tröjan klibbade” och sedan på ”visselpipan”." }
    - rubrik: "Lärarens sida: Avancerad, text 14, Nästa fredag"
      text:
        - "Det som står mellan raderna: Minna har missat fem fredagar med nachos. Jonatan köper två påsar ändå och döljer att han är besviken, och hans ”Ok!” visar till sist att han blir glad."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Känsligt", text: "Låt samtalet handla om Jonatan och Minna, och säg gärna att Minna försöker ställa det till rätta." }
            - { rubrik: "Före läsningen", text: "Vad kan man göra när man ses hemma hos en kompis en helgkväll?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Jag köpte två påsar som vanligt, det var ju rea.” Han säger en sak och gör en annan: han säger att det var rea, men han köper två påsar." }
            - { rubrik: "Tänka högt · fråga 4, Före och efter", text: "”Vänta, här står inte vad som har hänt mellan dem. Det står ’nachos hos dig i morgon, som vanligt’ och ’vi kan kanske ta nästa fredag i stället’. Jag vet att ’som vanligt’ betyder något man gör ofta tillsammans. Alltså tror jag att de brukar ses varje fredag, och att Minna har varit upptagen. Stämmer det med resten? Jag läser vidare. Minna frågar hur många fredagar hon har missat, och Jonatan svarar ’Fem.’ Ja, det stämmer.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Två." }
            - { rubrik: "Fråga 2 · mellan raderna, Varför", text: "Ledtrådarna: ”två påsar som vanligt”; ”Ok.”\nSvar som texten stöder: han hoppades att hon skulle komma ändå, och han är besviken.\nEn tanke att pröva: ”Det var rea.” Han köper två påsar fast Minna inte kommer.\nFråga tillbaka: ”Hur många påsar köper man om man hoppas att någon kommer?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Varför", text: "Ledtrådarna: ”Är du vaken?”; ”Hur många fredagar har jag missat sedan repet började?”\nSvar som texten stöder: hon kom precis hem med en nyhet, men hon har också dåligt samvete mot honom.\nEn tanke att pröva: ”Hon vill bara berätta om pizzan.” Hon frågar också om hans kväll.\nFråga tillbaka: ”Vad frågar Minna om efter rollerna?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Före och efter", text: "Ledtrådarna: ”är det nachos hos dig i morgon, som vanligt?”; ”Fem.”\nSvar som texten stöder: Minna har missat fem fredagar och Jonatan saknar henne, eller de har glidit isär. Båda håller när eleven visar en ledtråd.\nEn tanke att pröva: ”De har blivit osams.” Ingen är arg, och Minna bjuder hem honom.\nFråga tillbaka: ”Är någon av dem arg i meddelandena?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett svar kan vara att svara ärligt att man har saknat henne, eller att skämta bort det för att inte verka sårad. Ett bra svar tar med de två påsarna eller de fem fredagarna." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att de pratar om på lördag?”; ”Jonatan svarar ’Fem.’ direkt. Vad tror ni att han har gjort alla de fredagarna?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”Jag köpte två påsar som vanligt, det var ju rea.”" }
    - rubrik: "Lärarens sida: Avancerad, text 15, Fyra toner"
      text:
        - "Det som står mellan raderna: Joel säger att han skriver för att klaga, men han saknar grannens musik och är orolig nu när det är tyst. Brevet är hans sätt att få kontakt."
      delar:
        - rubrik: I passet
          falt:
            - { rubrik: "Före läsningen", text: "Vad kan man höra genom väggen i ett hus där många bor?" }
            - { rubrik: "Stoppet", text: "Stanna efter ”Det höll i två dagar, sedan flyttade jag tillbaka det.” Någon säger en sak och gör en annan: han vill slippa höra grannen men flyttar tillbaka skrivbordet." }
            - { rubrik: "Tänka högt · fråga 2, Varför", text: "”Vänta, varför flyttar han tillbaka skrivbordet? Jag tänker att han är arg. Jag ser framför mig hur han släpar skrivbordet till andra väggen. Det står ’för att slippa höra dig’ och ’sedan flyttade jag tillbaka det’. Jag vet att den som vill slippa ett ljud inte flyttar tillbaka till det. Alltså tror jag att han vill höra tonerna. Stämmer det med resten? Det står också ’i går upptäckte jag att jag nynnar dem på matten’. Först trodde jag att han var arg, men nu tror jag att han tycker om tonerna.”", kursiv: true }
            - { rubrik: "Fråga 1 · på raderna", text: "Den tredje. Förklara gärna ordet bas, ett instrument med låga toner." }
            - { rubrik: "Fråga 2 · mellan raderna, Varför", text: "Ledtrådarna: ”för att slippa höra dig”; ”Det höll i två dagar, sedan flyttade jag tillbaka det”.\nSvar som texten stöder: han vill höra musiken och saknade den när han satt längre bort.\nEn tanke att pröva: ”Det var jobbigt att flytta.” Det står inget om att det var jobbigt.\nFråga tillbaka: ”Hur länge höll det?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Känsla", text: "Ledtrådarna: ”I måndags var det tyst. I tisdags också.”; ”satt vid väggen i en timme”; ”hörde bara kylskåpet”.\nSvar som texten stöder: orolig, ensam eller tom. Ge gärna orden saknar och oroar sig.\nEn tanke att pröva: ”Glad, nu slipper han höra tonerna.” Han sitter vid väggen i en timme och lyssnar.\nFråga tillbaka: ”Vad gör Joel medan det är tyst?”" }
            - { rubrik: "Fråga 4 · mellan raderna, Varför", text: "Ledtrådarna: ”en melodi som passar till din bas”; ”det går bra att knacka”.\nSvar som texten stöder: han saknar musiken, är orolig för grannen eller vill spela tillsammans. Alla håller när eleven visar en ledtråd.\nEn tanke att pröva: ”Han är arg, han skriver ju att han klagar.” Det är vad han säger först.\nFråga tillbaka: ”Vad lägger han i kuvertet?”" }
            - { rubrik: "Fråga 5 · bortom raderna", text: "Ett svar kan vara att knacka på, eftersom man då får svar direkt, eller att skriva brev, eftersom det är lättare att skriva det som är svårt att säga. Ett bra svar tar med kuvertet och ger ett eget skäl." }
            - { rubrik: "Öppna frågor", text: "”Vad tror ni att grannen gör när hen har läst brevet?”; ”I måndags var det tyst i 4B, och i tisdags också. Vad tror ni har hänt?”" }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”I måndags var det tyst. I tisdags också.”" }
    - rubrik: "Lärarens sida: Avancerad, kartläggning före, Lappen"
      text:
        - "Det som står mellan raderna: Amira är nervös men bestämd inför ett samtal och väntar i ett bageri en fredagseftermiddag."
      delar:
        - rubrik: Kartläggningen
          falt:
            - { rubrik: "Så gör du", text: "Eleven gör kartläggningen enskilt med dig utanför passen, på fem till åtta minuter. Ställ ingen fråga före läsningen, och stanna inte. Eleven läser själv, och för den som avkodar mödosamt läser du texten högt först. Eleven svarar muntligt, och du skriver i protokollet. Den första frågan ger 1 poäng, och fråga 2 och fråga 3 ger 0–2 poäng var, högst 5 poäng. Fråga tillbaka bara om eleven inte svarar, och skriv då ett h efter poängen." }
            - { rubrik: "Fråga 1 · på raderna", text: "Femton." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”läste sin lapp en gång till”; ”hon kunde dem redan utan lappen”; ”Jag är lite tidig. Det gör ingenting om jag får vänta.”; ”vek ihop lappen till en liten fyrkant”; ”tittade på den och la ner den igen utan att ha skrivit något”.\nSvar som texten stöder: nervös, orolig eller spänd, men fast besluten att göra det. Ord att ge i samtalet: nervös, spänd.\nPoäng: 2 poäng för en slutsats som texten stöder (nervös, orolig, spänd) med minst en ledtråd. 1 poäng för en slutsats som texten stöder utan ledtråd, eller en ledtråd utan slutsats, som ”Hon läste lappen flera gånger.” 0 poäng för en känsla som texten inte stöder (glad, arg, trött), inget svar eller ett svar som inte hör ihop med texten.\nFråga tillbaka: ”Vad gör Amira med lappen?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Var och när", text: "Ledtrådarna: ”luktade det nybakat bröd och kanel”; ”Bakom glaset låg rader av kanelbullar”; ”någonstans brummade en ugn”; ”Klockan på väggen visade 15.50”.\nSvar som texten stöder: ett bageri eller konditori, en fredagseftermiddag.\nPoäng: 2 poäng för ett bageri, konditori eller fik med minst en ledtråd. 1 poäng för en rimlig plats utan ledtråd, som ”Ett bageri” eller ”En affär”, eller en ledtråd utan plats, som ”Det luktar bröd.” 0 poäng för en plats som ledtrådarna talar emot, som skolan, hemma eller en verkstad, eller ”Det står inte.”\nFråga tillbaka: ”Vad luktar det, och vad ligger bakom glaset?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att samtalet går bra och att hon får börja, eller att hon blir ännu mer nervös först. Ett bra svar nämner något ur texten, som lappen eller att hon redan hade rest sig, och ger ett eget skäl." }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”läste sin lapp en gång till”." }
    - rubrik: "Lärarens sida: Avancerad, kartläggning efter, Mejlet"
      text:
        - "Det som står mellan raderna: Mira är nervös men bestämd inför en kurs och väntar i en keramikverkstad en tisdagskväll."
      delar:
        - rubrik: Kartläggningen
          falt:
            - { rubrik: "Så gör du", text: "Eleven gör kartläggningen enskilt med dig utanför passen, på fem till åtta minuter. Ställ ingen fråga före läsningen, och stanna inte. Eleven läser själv, och för den som avkodar mödosamt läser du texten högt först. Eleven svarar muntligt, och du skriver i protokollet. Den första frågan ger 1 poäng, och fråga 2 och fråga 3 ger 0–2 poäng var, högst 5 poäng. Fråga tillbaka bara om eleven inte svarar, och skriv då ett h efter poängen." }
            - { rubrik: "Fråga 1 · på raderna", text: "Tjugo." }
            - { rubrik: "Fråga 2 · mellan raderna, Känsla", text: "Ledtrådarna: ”läste mejlet från kursledaren en gång till”; ”väskan hade hon packat dagen innan”; ”Jag kom nog lite tidigt. Jag kan vänta här borta.”; ”knöt om skorna en gång till”; ”tittade på den och la ner den igen utan att ha skrivit något”.\nSvar som texten stöder: nervös, orolig eller spänd, men fast besluten att vara med. Ord att ge i samtalet: nervös, spänd.\nPoäng: 2 poäng för en slutsats som texten stöder (nervös, orolig, spänd) med minst en ledtråd. 1 poäng för en slutsats som texten stöder utan ledtråd, eller en ledtråd utan slutsats, som ”Hon knöt om skorna två gånger.” 0 poäng för en känsla som texten inte stöder (glad, arg, trött), inget svar eller ett svar som inte hör ihop med texten.\nFråga tillbaka: ”Vad gör Mira med mejlet och med skorna?”" }
            - { rubrik: "Fråga 3 · mellan raderna, Var och när", text: "Ledtrådarna: ”luktade det blöt lera och kaffe”; ”Längs väggarna stod hyllor med skålar och krukor”; ”En man i ett lerigt förkläde”; ”Utanför hade gatlyktorna tänts”; ”Klockan på väggen visade 18.00”.\nSvar som texten stöder: en keramikverkstad, en lerverkstad eller en kurs där man gör skålar och krukor, en tisdagskväll.\nPoäng: 2 poäng för ett ställe där man gör eller säljer skålar, krukor eller keramik (verkstad, ateljé, kurs eller butik) med minst en ledtråd. 1 poäng för en rimlig plats utan ledtråd, som ”En verkstad” eller ”En affär”, eller en ledtråd utan plats, som ”Det luktar lera.” 0 poäng för en plats som ledtrådarna talar emot, som skolan, hemma eller ett bageri, eller ”Det står inte.” Förklara gärna att keramik är saker av bränd lera, som skålar och krukor.\nFråga tillbaka: ”Vad luktar det, och vad står på hyllorna?”" }
            - { rubrik: "Fråga 4 · bortom raderna", text: "Ett svar kan vara att kursen börjar bra och att hon får hjälp att hitta sin plats, eller att hon blir ännu mer nervös först. Ett bra svar nämner något ur texten, som mejlet eller att hon redan hade rest sig, och ger ett eget skäl." }
            - { rubrik: "Om eleven fastnar", text: "Peka på ”läste mejlet från kursledaren en gång till”." }
    - rubrik: "Avancerad, kartläggning före: Lappen"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Poängen", text: "Lärarens sida för kartläggningen före, och protokollet i planeringsmallarna." }
      listor:
        - rubrik: "Lappen"
          rader:
            - ["Amira kom femton minuter för tidigt. Det var fredag eftermiddag, och trottoaren var full av folk på väg hem. Hon stod utanför dörren och läste sin lapp en gång till. På lappen stod tre saker som hon ville säga, och hon kunde dem redan utan lappen. Dörren hade en liten klocka som pinglade när någon gick in. Inifrån luktade det nybakat bröd och kanel."]
            - ["Hon gick in och ställde sig vid disken. Bakom glaset låg rader av kanelbullar, och någonstans brummade en ugn. En kvinna i förkläde torkade händerna på en handduk.\n”Är du Amira?” frågade hon.\n”Ja”, sa Amira. ”Jag är lite tidig. Det gör ingenting om jag får vänta.”\n”Du får sitta där borta.”\nAmira satte sig vid fönstret och vek ihop lappen till en liten fyrkant."]
            - ["Utanför rullade en buss full av skolbarn förbi. Klockan på väggen visade 15.50. Kvinnan vid disken räknade mynt i en liten skål. Amira tog upp mobilen, tittade på den och la ner den igen utan att ha skrivit något. När dörren bakom disken öppnades hade hon redan rest sig. ”Jag kan börja nu”, sa hon."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många minuter för tidigt kom Amira?"]
            - ["2. Hur känner sig Amira när hon sitter vid fönstret? Hur vet du det?"]
            - ["3. Var är Amira? Vad i texten får dig att tro det?"]
            - ["4. Vad tror du händer efter att Amira har sagt ”Jag kan börja nu”? Varför?"]
    - rubrik: "Avancerad, text 1: Kassan"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 1." }
      listor:
        - rubrik: "Kassan"
          rader:
            - ["Det var varmt, och från badbryggan hördes skrik och plask. Två barn stod på tå vid luckan och kikade in. Den äldre, en pojke med blöta badbyxor, hällde ut en näve mynt på disken och räknade högt. ”Trettio, trettioett.” På skylten över Hugos huvud stod det: Glass, en kula 25 kronor. ”Vi vill ha två”, sa pojken. Hugo tittade på mynten och sedan på de röda ansiktena. Han sköt in mynten i lådan, gjorde kulorna extra stora och slog in två glassar i kassan. På displayen stod det 50. Barnen sprang iväg med var sin strut."]
            - ["Klockan sex stängde Hugo luckan. Chefen räknade pengarna två gånger.\n”Det fattas nitton kronor”, sa hon.\n”Jag kanske gav fel växel”, sa Hugo.\nHan torkade av disken, som redan var ren.\n”Kanske det”, sa chefen. ”Kassan har stämt varje kväll sedan juni.”\nHugo sa inget. Chefen tittade på skylten och sedan på honom."]
            - ["Fläkten i taket surrade. Hugo tog upp plånboken ur fickan och la en tjugolapp på disken.\n”Det var jag”, sa han.\nChefen räckte honom en krona i växel. ”Nästa gång frågar du mig först”, sa hon. ”Jag hade sagt ja.”"]
        - rubrik: Frågorna
          rader:
            - ["1. Hur mycket kostar en kula glass enligt skylten?"]
            - ["2. Varför gör Hugo kulorna extra stora? Hur vet du det?"]
            - ["3. Varför fattas det nitton kronor i kassan? Hur vet du det?"]
            - ["4. Vad tror chefen när Hugo säger att han kanske gav fel växel? Vad i texten får dig att tro det?"]
            - ["5. Hur känner sig Hugo när chefen säger att det fattas pengar? Hur vet du det?"]
            - ["6. Hugo svarar att han kanske gav fel växel. Gjorde han rätt? Varför?"]
    - rubrik: "Avancerad, text 2: Fiskgratäng"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 2." }
      listor:
        - rubrik: "Fiskgratäng"
          rader:
            - ["Stella ställde ner sin bricka mitt emot Emil. Bestick klirrade mot tallrikar, och man fick luta sig fram för att höras. Vid bordet bredvid salladsbaren satt Wilma med sina kompisar, och på hennes bricka stod fiskgratäng. Emil hade bytt till en ren skjorta efter gympan, och framför honom stod en jättestor portion fiskgratäng och en vattenkanna."]
            - ["”Fiskgratäng”, sa Stella. ”Sedan när äter du fisk?”\n”Jag älskar fisk, det har jag gjort i flera månader”, sa Emil och hällde upp mer vatten.\n”Förra året sa du att fisk smakade gammal badsvamp.”\n”Folk ändrar sig”, sa Emil, tog en tugga och svalde hårt.\n”Och du brukar alltid sitta vid fönstret.”\n”Här är det lugnare.”\n”Lugnare, bredvid salladsbaren, där det är värsta oväsendet?”\nEmil svarade inte, men vid salladsbaren skrattade någon högt, och han vred huvudet en bit och sedan tillbaka.\n”Vad sa hon egentligen?” viskade Emil.\n”Vem då, jag sitter ju med ryggen mot hela matsalen”, sa Stella.\n”Ingen, jag menade ingen särskild.”\n”Nej då, ät din fisk”, sa Stella.\nEmil tog en ny tugga och drack ett glas vatten."]
            - ["När Wilma reste sig med sin bricka reste sig Emil också, fast hans tallrik var nästan full. Han ställde den på diskbandet precis efter henne och gick sedan ut med långa steg, utan att se sig om. Stella följde efter honom och log hela vägen till korridoren."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad sa Emil förra året att fisk smakade?"]
            - ["2. Emil viskar ”Vad sa hon egentligen?” Vem menar han med ”hon”? Hur vet du det?"]
            - ["3. Varför dricker Emil så mycket vatten? Hur vet du det?"]
            - ["4. Emil säger att han älskar fisk. Vad menar han egentligen? Hur vet du det?"]
            - ["5. Hur känner sig Emil när Wilma reser sig med sin bricka? Hur vet du det?"]
            - ["6. Stella följer efter Emil och ler hela vägen. Vad hade du gjort i Stellas ställe? Varför?"]
    - rubrik: "Avancerad, text 3: Hjälptränaren"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 3." }
      listor:
        - rubrik: "Hjälptränaren"
          rader:
            - ["Edith kom till hallen en halvtimme före alla andra. Hon ställde ut åtta koner i en rak rad, flyttade den sista en halv meter och ställde tillbaka den. Tränartröjan hängde nästan ned till knäna. På en lista hade hon skrivit nio namn, och fem av dem kunde hon redan utantill. I glasdörren såg hon sig själv och rätade på ryggen. ”Hej och välkomna”, sa hon tyst, och sedan en gång till med mörkare röst."]
            - ["Från stora hallen hördes bollar som small mot väggen, och någon ropade ”Hit!” Edith blev stående med en kon i handen. Hon kände igen rösten. Det var Albin, som alltid stod till höger om henne när de spelade."]
            - ["Nio barn kom springande med klubborna släpande efter sig och ställde sig i en rad.\n”Är du tränaren?” frågade den minsta.\n”Hjälptränare”, sa Edith. ”Mats kommer klockan fem.”\n”Får vi spela match?” ropade en annan.\nDörren till stora hallen gick upp, och Albin stack in huvudet. ”Vi är en för få. Kom och spela, tio minuter bara!”\nEdith tittade på klockan. Den var fem i fem. Hon tog ett steg mot dörren. Bakom henne grep en liten hand tag i tränartröjan."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad säger Edith tyst vid glasdörren?"]
            - ["2. Hur känner sig Edith innan barnen kommer? Hur vet du det?"]
            - ["3. Varför blir Edith stående med en kon i handen när hon hör ropet? Vad i texten får dig att tro det?"]
            - ["4. Hur känner sig Edith när Albin frågar om hon vill spela? Hur vet du det?"]
            - ["5. Edith kan spela med Albin i tio minuter eller stanna hos barnen. Vad hade du gjort i hennes ställe? Varför?"]
    - rubrik: "Avancerad, text 4: Kvart i åtta"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 4." }
      listor:
        - rubrik: "Kvart i åtta"
          rader:
            - ["Pappa gick hemifrån klockan 07.45. Varje morgon. Han tog matlådan ur kylen, sa ”Hej då, gumman” och stängde dörren så tyst att lillebror inte vaknade. Skjortan var struken. Arbetsjackan med lagrets namn på ryggen hängde kvar i hallen. Den hade hängt där i tre veckor, och jag trodde att han hade en till."]
            - ["Den torsdagen var första lektionen inställd. Jag tog bussen in till stan för att köpa en ny laddare. Utanför biblioteket satt pappa på en bänk, klockan 08.25. Matlådan stod bredvid honom. Han satt helt stilla och tittade på dörren. På den hängde en skylt: Öppnar 10.00. Jag stod kvar bakom busskuren i tio minuter. Sedan gick jag fram."]
            - ["”Pappa?”\nHan ryckte till. ”Linnea. Ska inte du vara i skolan?”\n”Första lektionen är inställd. Varför sitter du här?”\n”Jag är tidig”, sa han. ”Jag brukar vara det.”\n”Lagret ligger åt andra hållet.”\nPappa tittade på matlådan. Sedan drog han upp en tjock bok ur väskan och la den i knät. Nästan varje sida var gul av överstrykningspenna. ”Jag har något på fredag”, sa han. ”Jag tänkte berätta när jag vet hur det gick.”\nJag satte mig bredvid honom och räckte ut handen. ”Ge hit. Jag förhör dig.”"]
        - rubrik: Frågorna
          rader:
            - ["1. Vad står det på skylten på biblioteksdörren?"]
            - ["2. Vad har hänt i Linneas familj innan texten börjar? Hur vet du det?"]
            - ["3. Varför går pappa hemifrån varje morgon? Vad i texten får dig att tro det?"]
            - ["4. Pappa tar fram en bok ur väskan. Vad förstår du då som du inte förstod innan? Hur vet du det?"]
            - ["5. Linnea går fram till pappa. Gjorde hon rätt? Varför?"]
    - rubrik: "Avancerad, text 5: Burken"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 5." }
      listor:
        - rubrik: "Burken"
          rader:
            - ["Rania hade inte hunnit sätta nyckeln i låset förrän grannens dörr gick upp på andra sidan trapphuset. Det hände varje eftermiddag vid fyra, och det hade hänt ända sedan i höstas. Grannen stod där i ylletofflor med en gurkburk i handen, och bakom honom luktade det nybakat."]
            - ["”Rania, du som är så stark”, sa grannen, ”jag får inte upp den här burken.”\nHon vred på locket en gång, och det gick upp.\n”Tack så mycket, och så är det lampan i hallen”, sa han.\n”Du bytte den i tisdags.”\n”Just det, men nu lyser den så bra att jag undrar om det är farligt.”\n”Den är bara splitterny”, sa Rania.\n”Då är det väl bra, och så har jag bakat, alldeles för mycket som vanligt.”\n”Jag har matteläxor”, sa hon.\n”Fem minuter”, sa grannen.\nPå hans köksbord stod en kaffekopp, ett glas saft som redan var upphällt och en plåt med havrekakor. Rania suckade, men hon satte sig ändå."]
            - ["När hon gick hem igen hade klockan hunnit bli sex, och vid dörren stannade hon.\n”Jag har ett ärende i morgon”, sa hon. ”Min cykelpump behöver en expert. Och helst en havrekaka.”\nGrannen rätade på ryggen och frågade om klockan fyra passade. Det gjorde den, och när Rania stängde sin egen dörr hörde hon honom nynna i trapphuset."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad står på grannens köksbord?"]
            - ["2. Grannen säger ”Fem minuter”. Vad menar han egentligen? Hur vet du det?"]
            - ["3. Vad förstår du i sista stycket som du inte förstod i början? Hur vet du det?"]
            - ["4. Hur känner sig Rania när hon går hem? Hur vet du det?"]
            - ["5. Rania säger vid dörren att hon har ett ärende i morgon. Vad tycker du om hennes val? Varför?"]
    - rubrik: "Avancerad, text 6: Vågen"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 6." }
      listor:
        - rubrik: "Vågen"
          rader:
            - ["Bakom slöjdsalen hade det växt upp en jättelik blå våg över natten. Den täckte hela betongväggen, och längst upp hade någon målat skum som såg så äkta ut att man nästan väntade sig att få vatten i ansiktet. Robin stod med ryggsäcken på ena axeln och glömde att gå in."]
            - ["”Helt sjukt”, sa han, ”det måste ha tagit hela natten, och ingen såg något.”\n”Fyra timmar, minst”, sa Ellen, som kom gående med händerna djupt i jackfickorna och gäspade.\n”Hur kan du veta det?” frågade Robin.\n”Det ser man”, sa hon, ”skumtopparna är gjorda en och en, och det tar tid.”\n”Det var säkert Dennis”, sa Robin, ”han hänger ju här med sin skateboard varje kväll.”\n”Det var inte Dennis”, sa Ellen snabbt, ”han kan bara rita sitt eget namn.”\n”Och fisken är bäst”, sa hon och nickade mot hörnet. ”Har du sett fisken?”\nRobin gick ner på huk, och där nere vid marken, knappt synlig, simmade en orange fisk som inte var större än hans hand."]
            - ["Rektorn kom runt hörnet med en hink och en borste. ”Jag vill bara veta vem som gjorde det”, sa hon, ”annars får hela skolan skrubba väggen på fredag.”\nRobin såg på Ellens vita skor, och över tårna gick en smal blå rand.\n”Robin? Vet du något?”\n”Nej”, sa han, ”ingenting.”\nEllen tittade på fisken."]
        - rubrik: Frågorna
          rader:
            - ["1. Vilken färg har fisken i hörnet?"]
            - ["2. Hur känner sig Robin när han ser väggen? Hur vet du det?"]
            - ["3. Vem målade vågen? Vad i texten får dig att tro det?"]
            - ["4. Varför svarar Robin som han gör när rektorn frågar? Hur vet du det?"]
            - ["5. Rektorn säger att hela skolan får skrubba väggen om ingen berättar. Vad hade du gjort i Robins ställe? Varför?"]
    - rubrik: "Avancerad, text 7: Måndag morgon"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 7." }
      listor:
        - rubrik: "Måndag morgon"
          rader:
            - ["På måndagsmorgonen stod Signe och Kevin vid skåpen och lutade sig över Kevins mobil. Signe skrattade så att hon fick hålla sig i skåpsdörren. På skärmen sov en tjej på en soffa med öppen mun och en mustasch i tusch.\n”Fem minuter tog det att rita den”, sa Kevin. ”Hon märkte ingenting.”"]
            - ["Clara kom gående med väskan på ena axeln. Signe höll upp mobilen mot henne.\n”Titta! Du är en legend”, sa Signe.\nClara tittade på skärmen i två sekunder. ”Haha. Bra bild”, sa hon. ”Jag ser ut som ett troll.”\n”Precis! Den har redan fyrtio visningar.”\n”Fyrtio”, sa Clara. Hon öppnade sitt skåp, tog ut en bok och la tillbaka den. ”Haha.”\nKevin log stort. ”Jag visste att du skulle ta det bra.”"]
            - ["Det ringde in. Signe sprang mot matten. Kevin blev kvar med mobilen i handen.\n”Kevin”, sa Clara lågt. ”Om det var du som låg där, hade du lagt upp den då?”\nKevin öppnade munnen och stängde den. Han tittade på bilden. Sedan tryckte han på skärmen, en gång, och höll upp mobilen igen. Där fanns ingen bild längre.\n”Jag tänkte inte på det”, sa han.\nClara stängde skåpet. ”Jag vet”, sa hon. ”Nu tänkte du.”"]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många visningar har bilden?"]
            - ["2. Vem menar Kevin när han säger ”Hon märkte ingenting”? Hur vet du det?"]
            - ["3. Vad menar Clara när hon säger ”Haha. Bra bild”? Hur vet du det?"]
            - ["4. Varför väntar Clara tills Signe har gått innan hon frågar Kevin om bilden? Vad i texten får dig att tro det?"]
            - ["5. Hur känner sig Clara när Kevin har tagit bort bilden? Hur vet du det?"]
            - ["6. Texten slutar med att Clara säger ”Nu tänkte du.” Vad tror du att texten vill säga med det? Varför?"]
    - rubrik: "Avancerad, text 8: Samma sak"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 8." }
      listor:
        - rubrik: "Samma sak"
          rader:
            - ["Noor har blivit tråkig. Förut brukade hon dansa runt i köket med musiken på högsta volym, men nu tittar hon mest på klockan och säger åt oss att skynda oss. I morse packade hon tre matlådor, gjorde två flätor på lillasyster och skrev under min läxlapp med mammas stora, runda bokstäver. Jag sa att det var fusk, men hon sa att det var samma sak."]
            - ["”Kom och ät, mamma vilar”, sa Noor.\n”Hon har vilat hela veckan, kan inte du spela kort med oss i stället?” sa jag.\n”Jag måste tvätta”, sa hon.\n”Du sa det i går också.”\nNoor la en portion köttbullar på en tallrik och ställde den utanför mammas stängda dörr, bredvid brickan från lunchen som stod kvar med maten orörd.\n”Och handbollen då, du har inte tränat sedan jul”, sa jag.\n”Jag hinner inte”, sa Noor och började dammsuga under bordet.\nHennes mobil surrade på bänken om och om igen, tills hon vände den med skärmen nedåt."]
            - ["Sent på kvällen vaknade jag av tvättmaskinen. I köket stod Noor och vek strumpor med ögonen nästan stängda. Jag visste inte vad jag skulle säga, så jag började diska, fast jag aldrig hade gjort det förut. Noor sa ingenting, men hon satte sig ner, för första gången på hela dagen."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad skrev Noor under i morse?"]
            - ["2. Var är mamma under dagen? Hur vet du det?"]
            - ["3. Noor säger att det är ”samma sak” när hon skriver under med mammas bokstäver. Vad menar hon? Hur vet du det?"]
            - ["4. Hur känner sig Noor på kvällen i köket? Hur vet du det?"]
            - ["5. Vad har hänt hemma innan texten börjar? Hur vet du det?"]
            - ["6. Berättaren diskar för första gången, och Noor sätter sig ner. Vad tror du att texten vill säga med det? Varför?"]
    - rubrik: "Avancerad, text 9: Nästan"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 9." }
      listor:
        - rubrik: "Nästan"
          rader:
            - ["Musiken dunkade så högt att jag kände den i fötterna, och luften luktade sockervadd och pommes. Långt däruppe skrek någon av ren lycka, och ljudet försvann med ett sus. Lamporna tändes en efter en, först de röda och sedan de gula, medan himlen bakom dem blev mörkblå. Ida ryckte mig i ärmen och pekade på vagnarna som svepte förbi över taken. ”Den där”, sa hon. ”Nu!”"]
            - ["Kön rörde sig sakta fram till en stång med ett rött streck högt upp och en skylt: Minst 140. Ida ställde sig under strecket och sträckte på sig så mycket att hälarna lämnade marken. Killen i röd jacka tuggade tuggummi och tittade på kön bakom oss i stället för på henne.\n”Nästan”, sa han.\n”Hon växte två centimeter i går”, sa jag.\n”Då är hon säkert lång nog om en vecka”, sa han.\n”Det är okej”, sa Ida snabbt, ”det ser ändå läskigt ut.”\nHon började räkna baklänges, tio, nio, åtta, som hon gjorde när tandläkaren borrade."]
            - ["Killen ropade över kön att det var sista åket. Jag tittade på Idas gympaskor, som var platta som pannkakor. Sedan tittade jag på mina kängor med sulor nästan lika tjocka som min tumme."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad står det på skylten vid stången?"]
            - ["2. Var är berättaren och Ida? Vad i texten får dig att tro det?"]
            - ["3. Vilken tid på dagen är det? Hur vet du det?"]
            - ["4. Varför säger Ida att hon inte vill åka ändå? Hur vet du det?"]
            - ["5. Berättaren tittar på Idas gympaskor och sedan på sina egna kängor. Vad hade du gjort i berättarens ställe? Varför?"]
    - rubrik: "Avancerad, text 10: Dagen före"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 10." }
      listor:
        - rubrik: "Dagen före"
          rader:
            - ["Dagen före finalen hade laget bara en lätt träning under strålkastarna. Planen var nyklippt. Vid sidlinjen stod Yusufs lillasyster med en hemmagjord flagga där det stod Yusuf 10. Yusuf sprang som en gasell så länge tränaren tittade åt hans håll. När tränaren vände sig om för att samla ihop konerna gick han lite snett. På vänster fot hade han två strumpor. På lappen på förrådsdörren stod startelvan. Hans namn var det tredje, och han läste det två gånger."]
            - ["”Yusuf”, sa tränaren. ”Kom hit.”\nHan joggade fram och lyfte knäna högt, som en travhäst. ”Jag är i toppform.”\n”Det frågade jag inte om.”\n”Bara så du vet. Och jag sov nio timmar.”\nTränaren nickade mot hans vänstra fot. ”Två strumpor.”\n”Det är kallt.”\n”Det är tjugo grader.”\nYusuf snörade om skon. Den satt redan hårt."]
            - ["Tränaren tittade på honom länge. Sedan tittade hon på lappen med startelvan. ”Du spelar”, sa hon. ”Men klockan tolv tejpar jag dig själv, och när jag byter ut dig så går du av.”\nYusuf log så brett att han glömde att halta. ”Vad ska du tejpa?”\n”Gå och byt strumpor”, sa hon.\nHan gick mot omklädningsrummet med raka steg. Det första ajet hördes när dörren hade slagit igen."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många strumpor har Yusuf på vänster fot?"]
            - ["2. Varför springer Yusuf som en gasell så länge tränaren tittar? Hur vet du det?"]
            - ["3. Hur känner sig Yusuf när tränaren säger ”Du spelar”? Hur vet du det?"]
            - ["4. Vad menar tränaren när hon säger ”Gå och byt strumpor”? Hur vet du det?"]
            - ["5. Tränaren låter Yusuf spela, men med villkor. Vad tycker du om det hon bestämmer? Varför?"]
    - rubrik: "Avancerad, text 11: Kanelbullen"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 11." }
      listor:
        - rubrik: "Kanelbullen"
          rader:
            - ["Karim hade bott i Sverige i tre månader och övat svenska hela vägen i skolbussen. Han hade bestämt sig för att svara ordentligt och ärligt på allt som någon frågade honom, eftersom han inte ville verka oartig. När han stängde sitt skåp i korridoren stod Olle bredvid honom med en stor kanelbulle i handen."]
            - ["Olle nickade mot honom och sa: ”Läget?”\nKarim rätade på sig och svarade så ordentligt han kunde: ”Jag sov dåligt, min lillebror har feber, bussen kom tio minuter för sent och jag har glömt matteboken hemma.”\nOlle stod helt stilla med kanelbullen halvvägs till munnen medan en tjej gick förbi och sa ”Läget?” till en klasskompis, som svarade ”Läget” utan att någon av dem saktade in.\n”Aha”, sa Olle till slut, ”det var mycket läge.”\n”Du frågade”, sa Karim.\nOlle skrattade så mycket att han fick lägga ifrån sig kanelbullen."]
            - ["Nästa morgon stod Olle vid skåpen igen och lutade sig mot skåpsdörren när Karim kom. ”Läget?” frågade han.\n”Bra, och du?” sa Karim och log.\n”Bra”, sa Olle, ”och hur är det med din lillebror?”\nKarim blev stående med handen på skåpsdörren.\n”Han är fullständigt frisk”, sa han till slut, ”och nu vill han ha kanelbulle också.”\nOlle bröt kanelbullen på mitten och räckte fram ena halvan, och tillsammans gick de mot klassrummet."]
        - rubrik: Frågorna
          rader:
            - ["1. Vad säger Karim att hans lillebror har?"]
            - ["2. Olle säger ”Läget?” till Karim. Vad betyder det här? Hur vet du det?"]
            - ["3. Olle säger ”det var mycket läge”. Vad menar han? Hur vet du det?"]
            - ["4. Hur känner sig Karim när han går mot klassrummet dagen efter? Hur vet du det?"]
            - ["5. Karim svarar långt på ”Läget?” Vad hade du gjort i Olles ställe? Varför?"]
    - rubrik: "Avancerad, text 12: Ingen fara"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 12." }
      listor:
        - rubrik: "Ingen fara"
          rader:
            - ["Onsdag kväll\nAstrid: Här är bilderna till del 1 och 2, och jag har skrivit del 3 och 4 också eftersom ingen av er hann, så läs igenom allt innan fredag och säg till om något är fel!\nHampus: Grymt, Astrid, du räddar oss!\nJasmin: Tusen tack, du är bäst, jag hade aldrig hunnit med min del!\nMarcus: Ska vi inte dela upp slutet så att du slipper göra allt själv, eller är det för sent?\nAstrid: Ingen fara, jag tar det, det är ändå nästan klart."]
            - ["Torsdag 02.41\nAstrid: Klart, och sista bilden ligger i mappen, så nu behöver ni bara läsa.\nLäst 07.50\nHampus: Du är en hjälte, jag ska läsa allt på bussen, vi ses på historian!\nMarcus: Jag kan berätta om del 1 om ni vill, den verkar vara den lättaste, och Jasmin tar väl slutet?\nJasmin: Ja, jag tar den korta biten, för annars blir jag för nervös."]
            - ["Torsdag 14.30\nAstrid: Tack för all hjälp, allihopa. Utan er hade jag ju behövt göra allt själv, och det hade varit tråkigt.\nHampus: Haha, bra skämt!\nMarcus: Menar du det där på riktigt?\nAstrid: Självklart. Ingen fara.\nJasmin: Men du sa ju hela tiden att det var ingen fara, så vi trodde att du tyckte om att göra det."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur dags skriver Astrid att hon är klar?"]
            - ["2. Hur känner sig Astrid när hon skriver att allt är klart? Hur vet du det?"]
            - ["3. Varför skriver Astrid ”Ingen fara, jag tar det” när Marcus frågar om de ska dela upp slutet? Hur vet du det?"]
            - ["4. Vad menar Astrid när hon skriver ”Tack för all hjälp, allihopa”? Vad i texten får dig att tro det?"]
            - ["5. Jasmin skriver att Astrid hela tiden sa att det inte var någon fara. Vad hade du skrivit till Jasmin om du var Astrid? Varför?"]
    - rubrik: "Avancerad, text 13: Fyrtio minuter"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 13." }
      listor:
        - rubrik: "Fyrtio minuter"
          rader:
            - ["Jag sprang över hela golvet i fyrtio minuter utan att röra bollen en enda gång. Ingen passade till mig. Killarna i gult och killarna i rött sprang runt mig som om jag var en kon. Ändå var det mig alla tittade på. En pappa vid sargen skrek: ”Är du blind?” Jag låtsades att jag inte hörde. Den svarta tröjan klibbade, och jag kollade klockan på handleden för femte gången. Två minuter kvar."]
            - ["När matchen var slut kom pappan som hade skrikit fram till mig. Han var röd i ansiktet, och skjortan hade åkt upp ur byxorna.\n”Hur gammal är du egentligen?”\n”Femton”, sa jag.\n”Vad får du för det här?”\n”Femtio kronor per match.”\nHan tittade på mig länge. ”Det är för lite”, sa han. ”Jag hade inte gjort det för hundra.”"]
            - ["Han gick tillbaka till sin son, som satt på golvet och drack saft ur en liten pappersmugg. På läktaren, som bara var tre bänkar, började alla packa ihop sina termosar. Jag tog en klunk ur vattenflaskan. Jag tittade på klockan igen. Sedan hängde jag visselpipan runt halsen. Nästa match började om tio minuter."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur mycket får berättaren för varje match?"]
            - ["2. Vad förstår du om berättaren i slutet som du inte förstod i början? Hur vet du det?"]
            - ["3. Hur känner sig berättaren under matchen? Vad i texten får dig att tro det?"]
            - ["4. Vad menar pappan när han säger ”Det är för lite”? Hur vet du det?"]
            - ["5. Pappan skrek åt berättaren under matchen och säger sedan att det är för lite. Vad hade du sagt till honom i berättarens ställe? Varför?"]
    - rubrik: "Avancerad, text 14: Nästa fredag"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 14." }
      listor:
        - rubrik: "Nästa fredag"
          rader:
            - ["Torsdag kväll\nJonatan: Hej, är det nachos hos dig i morgon, som vanligt?\nMinna: Åh, jag har repet till nio i morgon, men vi kan kanske ta nästa fredag i stället, eller?\nJonatan: Ok.\nMinna: Vi måste träffas snart, jag har så mycket att berätta om pjäsen och alla i gruppen, de är helt fantastiska!\nJonatan: Kul, berätta."]
            - ["Fredag 22.10\nMinna: Är du vaken? Jag kom precis hem, vi repade till halv tio och sedan åt hela gruppen pizza på scengolvet, och vi fick rollerna i dag, så jag ska spela den som snubblar in genom fel dörr.\nJonatan: Jag är vaken, vad kul att det gick bra.\nMinna: Men du då, hur har du haft det i kväll, gjorde du något speciellt?\nJonatan: Bra.\nMinna: Åt du nachos utan mig, eller var det ingen nachoskväll i dag heller?\nJonatan: Jag köpte två påsar som vanligt, det var ju rea.\nMinna: Hur många fredagar har jag missat sedan repet började?\nJonatan: Fem."]
            - ["Lördag förmiddag\nMinna: Jag är ledig hela lördagen, så kom klockan fyra, jag fixar salsan, och jag lovar att inte prata om repetitionerna mer än en timme!\nJonatan: Ok!\nMinna: Jag såg utropstecknet."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många påsar köpte Jonatan?"]
            - ["2. Varför köpte Jonatan två påsar ändå? Vad i texten får dig att tro det?"]
            - ["3. Varför skriver Minna till Jonatan sent på fredagskvällen? Hur vet du det?"]
            - ["4. Vad har hänt mellan Jonatan och Minna de senaste veckorna? Hur vet du det?"]
            - ["5. Minna frågar hur många fredagar hon har missat, och Jonatan svarar ”Fem.” Vad hade du svarat i Jonatans ställe? Varför?"]
    - rubrik: "Avancerad, text 15: Fyra toner"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Svaren", text: "Lärarens sida för Avancerad, text 15." }
      listor:
        - rubrik: "Fyra toner"
          rader:
            - ["Till den som bor i 4B,\nJag skriver för att klaga. Varje kväll klockan sju har jag hört en bas genom väggen, samma fyra toner om och om igen, och det har pågått sedan augusti. Tonerna sitter kvar i huvudet hela natten, och i går upptäckte jag att jag nynnar dem på matten. Min lärare tror att jag har blivit konstig."]
            - ["Det värsta är att den tredje tonen är fel. Den ska vara lägre. Jag har kollat på pianot hemma tre gånger, och jag har rätt. Hade du spelat den rätt hade jag inte haft något att klaga på. Jag flyttade skrivbordet till andra väggen för att slippa höra dig. Det höll i två dagar, sedan flyttade jag tillbaka det."]
            - ["I måndags var det tyst. I tisdags också. Jag satt vid väggen i en timme med örat mot tapeten och hörde bara kylskåpet, som brummar också men inte alls lika bra. I kuvertet ligger ett papper med en melodi som passar till din bas, ifall du skulle börja spela igen. Du behöver inte använda den. Väggen är tunn, så det går bra att knacka.\nHälsningar\nJoel i 4A"]
        - rubrik: Frågorna
          rader:
            - ["1. Vilken av de fyra tonerna tycker Joel är fel?"]
            - ["2. Varför flyttar Joel tillbaka skrivbordet? Hur vet du det?"]
            - ["3. Hur känner sig Joel när det är tyst i 4B? Hur vet du det?"]
            - ["4. Vad förstår du i slutet som du inte förstod i början? Hur vet du det?"]
            - ["5. Joel skriver ett brev i stället för att knacka på dörren. Vad hade du gjort i hans ställe? Varför?"]
    - rubrik: "Avancerad, kartläggning efter: Mejlet"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Poängen", text: "Lärarens sida för kartläggningen efter, och protokollet i planeringsmallarna." }
      listor:
        - rubrik: "Mejlet"
          rader:
            - ["Mira kom tjugo minuter för tidigt. Det var tisdag kväll, och gatan var tom på folk. Hon stod utanför dörren och läste mejlet från kursledaren en gång till. I mejlet stod tre saker att ta med, och väskan hade hon packat dagen innan. Dörren var tung och slog igen med en duns. Inifrån luktade det blöt lera och kaffe."]
            - ["Hon gick in och ställde sig vid dörren. Längs väggarna stod hyllor med skålar och krukor, och någonstans surrade en maskin. En man i ett lerigt förkläde torkade händerna på en handduk.\n”Är du Mira?” frågade han.\n”Ja”, sa Mira. ”Jag kom nog lite tidigt. Jag kan vänta här borta.”\n”Sätt dig gärna på bänken.”\nMira satte sig längst ut på bänken och knöt om skorna en gång till."]
            - ["Utanför hade gatlyktorna tänts, en efter en. Klockan på väggen visade 18.00. Mannen vid arbetsbordet sorterade små träpinnar i en liten burk. Mira tog upp mobilen, tittade på den och la ner den igen utan att ha skrivit något. När de andra började samlas mitt i rummet hade hon redan rest sig. ”Var ska jag stå?” sa hon."]
        - rubrik: Frågorna
          rader:
            - ["1. Hur många minuter för tidigt kom Mira?"]
            - ["2. Hur känner sig Mira när hon sitter på bänken? Hur vet du det?"]
            - ["3. Var är Mira? Vad i texten får dig att tro det?"]
            - ["4. Vad tror du händer efter att Mira har sagt ”Var ska jag stå?” Varför?"]
    # <<< texterna
mallar:
  - rubrik: Ledtrådsbladet
    typ: flode
    kolumner:
      - Det står
      - Jag vet
      - Alltså tror jag
    underrad: "Fråga: ______ · Namn: ______________"
    text: Du fyller i bladet på tavlan i pass 1, paren i pass 2 och varje elev i pass 3, för en mellan raderna-fråga. I rutan Det står skriver eleven ledtrådarna ur texten, gärna två, i rutan Jag vet det hen vet om livet och i rutan Alltså tror jag sin slutsats. På nivån Lättläst räcker ett ord eller en bild i varje ruta.
  - rubrik: Lyssningsbladet
    typ: rutnat
    kolumner:
      - Elev
      - Det eleven sa
      - Ledtråden
      - Steget som saknades
    rader: 8
    underrad: "Vecka: ____ · Text och fråga: ______________________"
    text: Fyll i bladet i pass 3. Skriv det eleven sa med elevens egna ord och vilken ledtråd hen pekade på, med ett h efter om den kom med din hjälp. Skriv också när en elev bygger vidare på en kamrat eller tänker annorlunda. I sista kolumnen skriver du det tankesteg som saknades. Efter pass 3 läser du bladet och väljer vad du visar nästa vecka.
  - rubrik: Kartläggningens protokoll
    typ: rutnat
    kolumner:
      - Elev
      - "Före: poäng på fråga 1, 2 och 3"
      - "Före: det eleven sa vid fråga 4"
      - "Efter: poäng på fråga 1, 2 och 3"
      - "Efter: det eleven sa vid fråga 4"
    rader: 8
    underrad: "Nivå och texter: ______________"
    text: Fyll i protokollet för kartläggningens text före och efter på samma blad, så att du kan jämföra. Fråga 1 ger en poäng för rätt svar. Fråga 2 och 3 ger två poäng för en slutsats som texten stöder med en ledtråd, en poäng för ett svar som texten stöder utan ledtråd eller en ledtråd utan slutsats, och noll poäng annars. Vid fråga 4 skriver du vad eleven sa.
lathund:
  innehall: En ny text med frågor varje pass
  metoden:
    text:
      - Eleverna lär sig läsa mellan raderna genom att samtala om texter. De säger vad de tror, visar sin ledtråd och bygger vidare på varandras tankar, och de får svara olika. Du tänker högt, leder samtalet och lyssnar.
      - I pass 1 tänker du högt och eleverna tänker med, i pass 2 samtalar de i par vid stoppet och sedan i gruppen, och i pass 3 tänker de mer själva medan du fyller i lyssningsbladet. Det du hör avgör vad du visar nästa vecka. Före första passet gör varje elev kartläggningen.
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Tänk högt i varje pass 1.
          text: Visa hela vägen till slutsatsen.
        - fet: Eleverna tänker i samtalet.
          text: Alla börjar med ”Jag tror att” och visar en ledtråd.
        - fet: Det du hör styr nästa vecka.
          text: Läs lyssningsbladet.
    tabell:
      rubrik: Passets delar och vad du säger
      kolumner:
        - Del
        - Exempelfraser
      rader:
        - - |-
            1 · Starten
            0–⁠3 min
          - ”Säg till din kamrat vad du tror, och varför.”
        - - |-
            2 · Möt texten
            3–⁠5 min
          - ”I dag lyssnar ni efter var jag stannar.”
        - - |-
            3 · Läs och tänk
            5–⁠13 min, pass 1 du, pass 2 ni, pass 3 var och en
          - ”Vänta, här står inte allt.”
        - - |-
            4 · Samtala om texten
            13–⁠26 min
          - ”Hur vet du det?” ”Vem tänker annorlunda?”
        - - |-
            5 · Avsluta
            26–⁠30 min
          - ”Vad sa din kamrat som fick dig att tänka nytt?”
    not: "Välj nivå efter gruppen: Lättläst, Mellan eller Avancerad. På samtalskortet tar ni ett nytt samtalsdrag i veckan. Vid stoppet i pass 2 tänker alla själv. Sedan säger A ”Jag tror att”, B frågar ”Hur vet du det?”, och de byter. Sist säger en elev kamratens tanke i gruppen. Är ni fler än fyra pratar paren först om mellan raderna-frågorna."
  pass:
    rubrik: "Vi kör ett pass: texten ”Skrapet på dörren”"
    textRubrik: Gruppen · fem elever i åk 5 · vecka 2, första passet
    titel: Skrapet på dörren
    text:
      - Förra veckan gissade Aron och Ebba utan ledtråd, så läraren visar Det står extra noga. Veckans samtalsdrag är att ta med det man har varit med om.
      - "Starten är en mening om gungorna. Liv säger till Aron: ”Jag tror att någon nyss har sprungit därifrån, för gungorna gungar.”"
      - Läraren stannar vid den blå fläcken och tänker högt. ”Det står sågspån, och det står en blå fläck. Jag vet att det finns sågspån och färg där man bygger och målar. Alltså tror jag att han har varit där.”
      - I rundan säger Mustafa att pappa vet något, för han ler. Vid fråga 3 säger Ebba att katten var hungrig. Liv tänker annorlunda, för hennes katt blev instängd en gång, och hon tror att Pricken var i grannens garage. Mustafa bygger vidare med att grannen kom hem i går.
      - "I Avsluta säger Aron: ”Han var i garaget, för sågspånet och färgen. Liv fick mig att tänka på garaget.”"
    forberett:
      rubrik: Det jag förberett
      text:
        - Valt tankesteget Det står och samtalsdraget, bestämt stoppet vid den blå fläcken, övat på att tänka högt och bestämt paren.
    klarTidigt: Leta efter en ledtråd som ingen har sagt, eller pröva ”Tänk om”.
    schema:
      rubrik: 30 minuter, del för del
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Välj tankesteg och samtalsdrag ur Veckans cykel, bestäm text, stopp och par och öva på att tänka högt. Kopiera texten och skriv startmeningen.
        - tid: 0–3
          fas: 1 · Starten
          vad: Skriv meningen på tavlan. Gruppen säger vad som står och vad de vet, och sedan säger alla ”Jag tror att” till en kamrat.
        - tid: 3–5
          fas: 2 · Möt texten
          vad: Säg titeln, ställ frågan Före läsningen och säg veckans tankesteg och samtalsdrag.
        - tid: 5–13
          fas: 3 · Läs och tänk
          vad: I pass 1 tänker du högt och sätter ett frågetecken, i pass 2 samtalar paren vid stoppet och i pass 3 läser eleverna själva eller i par.
          fraser:
            - Vänta, här står inte allt.
        - tid: 13–26
          fas: 4 · Samtala om texten
          vad: Ta en runda och sedan mellan raderna-frågorna av veckans slag, till exempel Känsla eller Vem. Ställ sist en öppen fråga, och ta resten när tiden räcker.
          fraser:
            - Hur vet du det?
            - Vem tänker annorlunda?
        - tid: 26–30
          fas: 5 · Avsluta
          vad: Var och en säger en slutsats, en ledtråd och vad kamraten sa, i par när ni är fler än fyra. Efteråt skriver du en kort notering i Veckans cykel, och efter pass 3 fyller du i resten av mallen.
  mall:
    rubrik: Korten vid bordet
    underrad: "Lärarens översikt · elevens kort står stort under Materialet"
    block:
