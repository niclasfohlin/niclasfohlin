        - Ämnet och längden
        - Det texten gör, som att beskriva eller övertyga
        - Vad en text gör
      - - Samma text, med och utan en skrivhandling
        - Läsaren och det skribenten vill
        - Om texten förklarar eller säger vad läsaren ska göra
        - Vad den meningen gör för läsaren
      - - "Samma ärende till en ny läsare, som en plan med lappar"
        - Ärendet, det skribenten vill
        - Läsaren, och därmed det som tas med
        - Att läsaren avgör vad som ska med
      - - Två hela texter som gör samma sak och ser olika ut, sist i kursen
        - Det texten gör
        - Läsaren, början och ordningen
        - Att en texttyp kan se ut på flera sätt
    not: "I de tre första textparen är det en enda sak som skiljer. Säg det som är lika, och ställ sedan en smal fråga om det som skiljer, till exempel ”Vad har den andra texten som den första inte har?” När det finns en tredje text letar gruppen efter samma skrivhandling i den, och sedan prövar eleven den i sin egen text. Lägg undan texterna innan eleverna skriver. Byter du ett textpar mot ett eget, skriver du själv texten där något saknas, så som eleverna brukar skriva."
  - rubrik: "Återkopplingen: åtta grepp, fem medan texten skrivs"
    plats: efter-steg
    meny: true
    text: "Allt skrivande i kurserna har återkoppling som eleven använder direkt, och den går till på samma sätt i varje text. Mitt i texten möter eleven något, som en kamrats början, din fråga, kamratens text eller en läsares svar. Eleven bestämmer om hen tar med det, ändrar sin text eller behåller den, och säger varför, som ”Jag tar med skuggan, för läsaren har inte varit där” eller ”Jag behåller min början, för den säger vad jag vill”. Sedan skriver hen vidare. När texten är klar skriver eleven på bladet Mitt mål vad hen tar med sig, och när nästa text börjar läser hen det först. När den texten är klar ringar hen in var det syns. Det läsaren undrade skriver eleven på samma blad, som nästa mål. Greppen heter likadant i alla kurser, så att du och eleverna känner igen dem. I kursen står de under Till läraren: återkopplingen, med de pass där ni gör dem."
    kolumner:
      - Greppet
      - Så gör ni
    rader:
      - - "Två texter där en sak skiljer\nInnan eleverna skriver"
        - "Visa två korta texter bredvid varandra. ”Vad har den andra som den första inte har? Vad gör det för läsaren?”"
      - - "Alla svar på bordet\nI passets början"
        - "Lägg allas nya meningar bredvid varandra. Gruppen pekar ut den mening som ger läsaren mest, och var och en gör sin egen bättre."
      - - "Starterna runt bordet\nMitt i texten"
        - "Var och en läser sin början, eller en mening ur den, och de andra svarar som läsaren. Eleven väljer om hen ändrar sin början."
      - - "Frågan medan eleven skriver\nMitt i texten"
        - "Läs en mening över axeln, och ställ en enda fråga så som läsaren skulle fråga. Eleven svarar och väljer om svaret ska med i texten."
      - - "Två sätt i era texter\nMitt i texten"
        - "Stoppa i två minuter och säg två sätt som du ser att eleverna skriver på, utan att peka ut någon: ”Många skriver vad de vill, några också varför.” Var och en väljer hur hen skriver vidare."
      - - "Två texter halvvägs\nMitt i texten"
        - "Var och en i paret läser sin text högt för den andra: ”Vad har du med som jag inte har?” Var och en tar med en sak eller säger varför inte."
      - - "Läsaren halvvägs\nMitt i texten"
        - "Eleven läser det hen har skrivit för en kamrat, som svarar så som läsaren gör i kursen. Eleven väljer vad hen skriver härnäst, och kamraten letar efter samma sak i sin egen text."
      - - "Före och efter\nNär texten är klar"
        - "Eleven lägger sin gamla och sin nya text bredvid varandra, och du frågar: ”Vad gör den nya som den gamla inte gjorde?”"
    not: "Återkopplingen lämnas över som pennan. Först jämför gruppen dina textpar, och du stoppar och säger vad du ser. Sedan jämför paret sina texter halvvägs, och sist läser eleven sin egen text för en läsare halvvägs. Det som byts mellan kurserna är hur läsaren svarar. I Texttyp: Argumenterande text säger läsaren vad som övertygade och vad hen undrar, och i Texttyp: Berättande text säger hen var hen var med. I Texttyp: Beskrivande text ritar läsaren det hen ser, och i Texttyp: Instruerande text gör läsaren det som står medan skribenten ser på. Har du läst texterna efter passet, visar du i början av nästa pass två korta versioner som du har skrivit själv: en som liknar det många skrev och en med det som fattades. Har gruppen gått en kurs förut, läser eleven i pass 1 sitt sista mål och säger vad hen känner igen i den nya texten. När ni jämför frågar ni vad varje text gör för läsaren. Ingen frågar vilken som är sämst, och du visar en elevs hela text för gruppen bara om eleven säger ja. Ett grepp inne i Skriv tar högst fem minuter, och med fler än sex elever gör ni Starterna vid två bord. Stavningen hör inte till greppen."
  - rubrik: "När det inte fungerar: tre frågor"
    plats: efter-fastnar
    text: "Stödtrappan gäller en elev i stunden. När du ser samma sak hos flera, eller om och om igen, hjälper tre frågor dig att välja stöd: Vad ser jag? Vad innebär det? Vad gör jag? Svaret på den sista säger också om stödet gäller en elev, ett par eller hela gruppen."
    kolumner:
      - Vad ser jag?
      - Vad innebär det?
      - Vad gör jag?
