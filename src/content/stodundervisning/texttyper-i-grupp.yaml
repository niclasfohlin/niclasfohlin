        - "Ha ett kort samtal med eleven: ställ en fråga, och bestäm vad eleven gör sedan"
      - - Flera elever kör fast på samma sätt
        - De behöver samma slags stöd
        - Samla de eleverna en kort stund, och ge en tydlig instruktion
      - - Många texter blir korta
        - Eleverna vet inte hur texten kan byggas ut
        - Stoppa arbetet, och visa hur du bygger ut en mening med ett exempel och en förklaring
      - - Eleverna frågar hur långt det ska vara
        - De vet inte vad texten ska göra eller vad som gör den bra
        - "Visa en mentortext, alltså en text ni har som förebild, en kort stund, eller låt gruppen jämföra två korta utdrag, och lägg sedan undan texterna"
      - - Eleverna behöver pröva idéer eller höra sin text
        - Tanken behöver språk innan den blir text
        - Låt eleverna tänka i par, eller ha ett kort samtal om texten i gruppen
    not: "Raderna kommer ur Skriv! (Fohlin och Wilson, 2027). Där gäller de en klass, och här är de skrivna om för en liten grupp."
  - rubrik: "Skrivstödet: det eleven kan behöva för att få ned texten"
    plats: efter-fastnar
    meny: true
    text: "Att skriva är att göra två saker på en gång: bestämma vad läsaren ska få veta, och få ned det på papper eller skärm. För eleverna i kurserna tar handen och stavningen så mycket kraft att för lite blir över till innehållet. De planerar kort, skriver några meningar och säger att de är klara. Det går också långsamt: en elev som behöver stöd får ofta ned bara några ord i minuten, och då tar hundra ord en halvtimme eller mer. Därför får skrivandet minst en tredjedel av kursens tid. Planen och steget Säg gör att eleven vet vad hen ska skriva, och skrivstödet avlastar handen och stavningen. Bestäm före kursen, med klassläraren, hur varje elev skriver. Eleven använder det skrivstöd hen har och kan, för ett nytt program hinner hen inte lära sig i kursen."
    kolumner:
      - "Skrivstöd"
      - "Vad det gör"
      - Hjälper eleven som
    rader:
      - - "Tangentbord"
        - "Texten blir läsbar, och eleven kan ändra i den"
        - "skriver långsamt för hand, eller så att texten inte går att läsa"
      - - "Tal till text"
        - "Eleven säger meningen, och programmet skriver den"
        - "berättar mycket men får ned lite. Hen har planen framför sig, säger flera ord i taget och rättar programmets fel med tangentbordet"
      - - "Ordförslag"
        - "Programmet föreslår ord medan eleven skriver"
        - "stannar vid stavningen mitt i meningen"
      - - "Stavningshjälp"
        - "Programmet markerar felstavade ord och föreslår rätt ord"
        - "stavar så att läsaren får svårt att förstå"
      - - "Talsyntes"
        - "Programmet läser upp det eleven har skrivit"
        - "inte läser igenom sin text. Ge en fråga att lyssna efter: ”Låter texten som du ville? Saknas något ord? Hör du var meningen tar slut?”"
    not: "Programmen heter till exempel IntoWords, eller LexiFlow och SkrivaText från Everway. Datorer och plattor har ofta tal till text och talsyntes inbyggda. Namnen ändras, och det är funktionerna som hjälper. Den som dikterar eller lyssnar behöver hörlurar med mikrofon. Frågorna att lyssna efter kommer ur Skriv! (Fohlin och Wilson, 2027)."
  - rubrik: "Eleven som har svårt att få ned texten"
    plats: efter-fastnar
    meny: true
    text: "Det här gör du under Skriv, när eleven vet vad hen vill säga men inte får ned det. Du hjälper eleven att börja och att fortsätta, och eleven bestämmer vad som ska stå i texten. Inget av det här är rätt för alla: välj efter eleven och stunden."
    kolumner:
      - Det du ser
      - Det du gör
    rader:
      - - "Eleven kommer inte i gång, fast hen har berättat"
        - "En del behöver uppmuntran: ”Du berättade det nyss. Skriv det du sa.” Andra behöver starthjälp: ”Jag hjälper dig med första meningen.” När eleven har sagt den säger du ”Bra tanke. Skriv ner den.”"
      - - "Eleven får ändå inte ned första meningen"
        - "Skriv den som eleven säger den, och läs upp den. Lämna över pennan och säg ”Vad kommer sedan? Skriv det.”"
      - - "Pennan stannar efter några meningar"
        - "Säg ”Vad kommer sedan? Skriv det.” Säg det flera gånger under Skriv."
      - - "Stavningen stoppar eleven mitt i meningen"
        - "Be eleven skriva ordet som det låter och gå vidare, eller ta ett ordförslag i programmet. Stavningen rättar du innan texten går till läsaren."
      - - "Eleven säger att hen är klar"
        - "Hen läser texten som läsaren, med kortet, och skriver in det läsaren saknar. Vad hen gör sedan står i kursens tabell Det du ser, och det du gör."
      - - "Eleven väntar på dig i stället för att börja"
        - "Ge starthjälpen. Anteckna vem det var, under Till nästa pass på bladet Det jag hör, och pröva längre fram om det räcker med uppmuntran."
  - rubrik: De fyra kurserna bredvid varandra
    plats: efter-urval
    meny: true
    text: "Kurserna har samma fyra steg, samma pass i sex delar och samma åtta grepp. Det som skiljer dem är vad texten gör för läsaren, vilka läsarna är, hur de svarar och vad gruppen lär sig med två texter bredvid varandra."
    kolumner:
      - Kurs
      - Det texten gör
      - Läsarna
      - Så svarar läsaren
      - Gruppen lär sig med två texter
    rader:
      - - Argumenterande text
        - Får läsaren att hålla med eller göra något
        - "En vuxen på skolan som kan bestämma"
        - Säger vad som övertygade och vad hen undrar
        - "Att förklara, och att säga vad läsaren ska göra"
      - - Berättande text
        - Låter läsaren vara med om något
        - "Yngre elever som paren intervjuar, och lyssnare på en spökläsning"
        - Säger var i berättelsen hen var med, och vad hen undrar
        - "Att visa hur det känns, och att stanna kvar i det som händer"
      - - Beskrivande text
        - Låter läsaren se hur något är
        - "Yngre barn som kommer på besök, och någon som eleven känner och skriver brev till"
        - Ritar det hen ser och säger vad hen undrar
        - "Att ge helheten först, och att säga vad som skiljer det från annat"
      - - Instruerande text
        - Lär läsaren att göra något själv
        - "Elever i en annan klass som gör flygare av papper och spelar spel efter texterna, och en vuxen eller kompis på skolan"
        - "Gör det som står medan skribenten ser på, och säger vad hen undrar"
        - "Att säga hur, med ord för var och när, och att säga vad som gäller om något händer"
    not: "Varje kurs har också en kooperativ struktur som tränar det centrala i texttypen. Gruppen gör den i ett av de första passen, och den står på en egen sida i kursen. Strukturerna heter Konstruktiv debatt i Argumenterande text, Berätta mera! i Berättande text, Lika och olika i Beskrivande text och Kommunicera i Instruerande text."
  - rubrik: För dig som kan cirkelmodellen
    plats: efter-grund
    text: "Du känner igen förebilderna, den gemensamma texten och de uttalade förväntningarna. Det som är nytt är att du börjar på ett tomt papper och tänker högt medan du skriver, att eleven tar över en strategi med mål och egen uppföljning, och att två texter står bredvid varandra där en sak skiljer."
    kolumner:
      - I cirkelmodellen
      - I kurserna
    rader:
      - - Ni bygger kunskap om ämnet
        - Ämnet är något eleverna redan kan, så att tiden går till att skriva
      - - "Ni studerar förebilder: syftet, delarna och de språkliga dragen"
        - Ni läser två texter bredvid varandra, där en sak skiljer, och frågar vad den saken gör för läsaren
      - - Ni skriver en gemensam text
        - Ni gör likadant. Du håller pennan, och eleverna väljer vad som ska med. En elev har kortet och frågar som läsaren
      - - Eleven skriver en egen text
        - Eleven skriver med fyra steg, ett mål och en egen uppföljning, till en läsare som svarar
    not: "Ett språkligt drag är något texttypen brukar ha. Ett skrivdrag är något skribenten väljer för läsarens skull."

exempel:
  rubrik: "Exempel: ett pass där gruppen lär sig förklara"
  valt:
    rubrik: Gruppen
    text: "Fyra elever i åk 5 går kursen om argumenterande text. Det är vecka 3 och pass 6, och passet lär ut en skrivhandling: att förklara. Kursens läsare är Maria i skolbiblioteket, som har frågat om biblioteket ska ha öppet på lunchrasten. Gruppen skickade sin gemensamma text till henne i förra passet. I dag bygger var och en ut sin egen text från pass 4 med en förklaring."
  text:
    - "Läs som läsaren. På tavlan står ett skäl ur gruppens text, utan förklaringen: ”Det är bra för många.” Vilgot läser det som Maria: ”Nu vet jag att det är bra. Nu undrar jag hur.” Alla skriver en ny mening som svar, och de lägger meningarna bredvid varandra. Läraren frågar vilken som ger Maria mest. Hamza pekar på Nadias mening, ”På rasten har vi tid att välja bok”, och säger: ”Den förklarar.” Var och en gör sin egen mening bättre."
    - "Visa och pröva. Läraren säger: ”I dag förklarar vi ett skäl.” Hen läser den första texten om rörelsepauser på tavlan som en lärare på skolan och tänker högt, som i tabellen Så tänker du högt. Paren har elevens sida med de två texterna och pratar om frågorna under dem, och Hamza säger: ”Den andra säger hur det går till.” Läraren frågar: ”Vad sa jag när jag körde fast?” Nadia säger: ”Du frågade som läsaren.” Läraren markerar det som bara den andra texten har och skriver ”Hur menar du?” i kanten. Elsa säger vad hon tar med sig, ”Jag förklarar mina skäl”, och skriver det under Mina mål."
    - "Tänk och planera. Var och en tar fram sin text från pass 4. Läraren har läst den som läsare och skrivit vad hen nu vet, vad som övertygade och vad hen undrar. I Elsas text har läraren skrivit ”Hur menar du?” vid skälet ”Fler hinner låna”. Elsa läser bladet Mitt mål och frågar sig: ”Hur menar jag?”"
    - "Säg. Nadia ur det andra paret är läsare, och Elsa berättar skälet för henne. Nadia frågar: ”Hur menar du med att fler hinner låna?” Elsa svarar: ”På lektionen hinner vi bara lämna tillbaka, eftersom vi måste gå sedan.” Läraren säger: ”Det du svarade nu ska med i texten.” Elsa skriver ”bara lämna tillbaka” på en ny lapp."
    - "Skriv. Elsa skriver in förklaringen på den tomma raden efter skälet. Läraren läser den över axeln och frågar som Maria: ”Vad gör ni då i stället?” Elsa svarar ”Vi går till nästa lektion”, och väljer att det inte ska med. Hamza läser sin text och blir sittande. Han säger: ”Jag vet inte vad jag ska lägga till. Jag tittar på tavlan. Maria läser.” Han läser sin text som Maria: ”Nu undrar jag vad du gör i biblioteket på en rast.” Sedan skriver han: ”Jag läser serier där, för det hinner jag inte annars.” De sista minuterna läser Elsa sin text för Nadia, som säger vad hon nu vet och vilket skäl som övertygade henne. Var och en ser om målet syns i texten och fyller i den första stapeln i sitt diagram."
    - "Läs upp. Elsa läser meningen med sin förklaring och säger: ”Jag lade till den för att Nadia frågade hur jag menade.” Var och en skriver på Mitt mål vad hen tar med sig."
    - "På bladet Det jag hör står efter passet: Läsaren nämns: Hamza, ”Maria läser”, utan att jag frågade. Lagt åt sidan eller lagt till: Elsa, lappen ”bara lämna tillbaka”. Kör fast: Hamza, ”Jag tittar på tavlan.” Till nästa pass: jag lyssnar särskilt på Nadia och Vilgot."

fastnar:
  rubrik: När eleven fastnar
  text: "Eleven fastnar oftast för att hen har tappat bort läsaren. Börja därför med läsaren, och ge sedan minsta möjliga stöd. Den som börjar skriva direkt, utan plan, får först berätta texten för en läsare som frågar, och det eleven svarar blir lapparna."
  fragaForst:
    - Vem ska läsa det här?
    - Vad behöver den personen veta då?
  trappaText: "En stödtrappa att gå uppför i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Vänta tio sekunder. Peka sedan på tavlans tre rader och på elevens blad, där meningen för när det tar emot står."
    - "Läs elevens senaste mening högt som läsaren, och säg vad du nu vet och vad du undrar."
    - "Låt eleven säga svaret högt. Säg sedan ”Skriv det du sa.”"
    - "Ge början på meningen, och låt eleven göra den färdig."
    - "Skriv meningen åt eleven medan hen säger den, och låt hen skriva nästa själv."
  motto: "Stödet ska göra skrivandet möjligt för eleven, inte göra det åt hen."

roll:
  rubrik: "Lärarens roll: fråga som läsaren, och låt eleven välja"
  text: "Du visar hur en skribent tänker, och du är elevens första läsare. Det är lätt att ta över valen, och då blir texten din."
  gor:
    - Låt eleven välja vad som läggs åt sidan, och fråga varför.
    - "Svara på saken när du är läsare: vad du nu vet, vad som nådde fram och vad du undrar."
    - Säg varför en text brukar se ut som den gör, varje gång du visar en.
    - Välj ämnen som eleverna redan kan, så att tiden går till att skriva.
    - Låt eleven planera och berätta på sitt starkaste språk.
  undvik:
    - Att visa en elevs text som exemplet där något saknas.
    - Att dela ut ett blad som en mall att fylla i.
    - Att räkna sambandsord eller kräva ett visst antal delar.
    - "Att rätta stavningen medan eleven skriver. Rätta den innan texten går till läsaren."
    - Att vara den enda läsaren.

urval:
  rubrik: Var hittar du kursens läsare?
  text:
    - "Kursens läsare är verkliga, och de svarar eleverna. I Texttyp: Argumenterande text är läsaren en vuxen på skolan, som bibliotekarien, fritidsledaren, vaktmästaren eller kökschefen, och i åk 6–7 gärna rektorn eller den som leder elevrådet. I Texttyp: Berättande text intervjuar paren först yngre elever och läser sedan för dem, och till en spökläsning bjuder eleverna in lyssnare. I Texttyp: Beskrivande text skriver eleverna först till yngre barn, som har frågat hur det ser ut där de äldre går, och sedan brev till någon de känner som inte har sett det de beskriver. I Texttyp: Instruerande text går läsarna i en annan klass, helst ett år yngre, och de gör flygare av papper och spelar spel efter elevernas texter. Finns läsarna inte på skolan, säger kursen vad du gör i stället. I de första passen är du själv läsaren. Varje kurs har ett blad till läsaren, eller till den lärare som har läsarna, där det står vad du ber om."
  kravText: "En läsare som fungerar uppfyller tre krav:"
  krav:
    - rubrik: Går att nå
      text: "Hen hinner svara, under kursen eller när gruppen samlas efter den"
    - rubrik: Behöver texten
      text: "Hen ska bestämma, göra, få veta eller vara med om något, och då behövs texten"
    - rubrik: Svarar på saken
      text: Hen säger vad hen nu vet, vad som nådde fram och vad hen undrar, och låter stavningen vara

progression:
  rubrik: Så tas stödet bort
  text: "En kurs går från att du visar till att eleven skriver själv. Du tar bort stödet på två sätt, vecka för vecka: du lämnar över pennan, och du lämnar över rollen som läsare. Gruppen går vidare varje vecka, eftersom kursens läsare väntar på texterna. Den som behöver mer stöd får dig som läsare en gång till, eller säger sin text medan du skriver. Till sist ska eleven göra stegen utan dig, i klassen. Har en elev varit borta, visar kamraten planen och säger vad de valde och varför, och eleven skriver vidare där paret är. I vecka 4 frågar du, i det pass som veckans sida i kursen säger: ”Vilken text skriver du i klassen nu? Vem läser den?”"
  rader:
    - vecka: "1"
      fokus: "Läsaren, och du är läsare"
      roll: Du svarar på en första text, som eleven skriver utan stöd.
    - vecka: "2"
      fokus: "Du visar, och en elev ur ett annat par är läsare"
      roll: Du planerar och skriver och säger dina val högt. Paren gör efter dig.
    - vecka: "3"
      fokus: "Gruppens text, till kursens läsare"
      roll: Du håller pennan, och en elev frågar som läsaren. Eleverna väljer.
    - vecka: "4"
      fokus: "Parens text, som en elev ur ett annat par läser"
      roll: Du väntar med frågan Vem läser? och lyssnar först.
    - vecka: "5"
      fokus: "Egen text, till kursens läsare när kamraten har läst"
      roll: Du är läsare åt den som behöver det. Eleven gör stegen själv.
    - vecka: "6"
      fokus: "Svaren från kursens läsare"
      roll: Du lägger elevens nya text bredvid den första.

uppfoljning:
  text: "Du ser om kursen hjälper i det du hör, i det eleven skriver och i det läsaren svarar. Eleven följer sina egna texter i sitt diagram. Kursen säger vad eleven räknar i just den texttypen."
  rader:
    - nar: Varje pass
      vad: Skriv vad två eller tre elever säger, på bladet Det jag hör.
    - nar: När en text är klar
      vad: Eleven ser om målet syns i texten och fyller i en stapel i sitt diagram.
    - nar: Efter vecka 3
      vad: Ge klassläraren de fyra stegen och tavlans tre rader.
    - nar: Första och sista veckan
      vad: Eleven skriver en kort text utan stöd. Skriv upp om hen planerar den sista.
    - nar: Sista passet
      vad: Skriv upp vad som nådde fram till läsaren.
    - nar: Fyra till sex veckor efter kursen
      vad: Samla gruppen ett pass med en ny text. Fråga klassläraren om eleven säger vem som läser.

mal:
  rubrik: "Mål: det eleven gör efter en kurs"
  text: "Efter en kurs gör eleven oftare det här:"
  punkter:
    - Säger vem som ska läsa och vad hen själv vill, innan hen skriver, också i klassen
    - Planerar före texten, och lägger något åt sidan för läsarens skull
    - Berättar sin text för någon, och skriver sedan det hen sa och det hen svarade
    - Läser sin text som läsaren, och lägger till det läsaren saknar
    - Har ett mål för sin text, och säger vad hen gör när det tar emot
    - Känner igen texttypen när en uppgift ber om den

checklista:
  rubrik: Checklista inför en kurs
  punkter:
    - Välj kurs efter vad eleverna behöver skriva i klassen.
    - Lägg inte passen på elevens läs- eller stavningsstöd.
    - Läs kursens checklista och veckans sida för vecka 1.
    - Öva högt på det du visar i vecka 2, med kursens exempel eller en egen text.

grund:
  text: "Kurserna bygger på en undervisning där läraren visar en skrivstrategi, tänker högt och lämnar över den steg för steg, och där eleven sätter mål och följer sitt eget skrivande. På engelska heter den Self-Regulated Strategy Development, SRSD (Harris och Graham, 2017). I en forskningsöversikt om elever från åk 4 till gymnasiets sista år hör undervisning i skrivstrategier till det som har gett störst effekt på elevers texter, och mer för elever som behöver stöd i att skriva än för hela klasser (Graham och Perin, 2007). I stora studier med mått som forskarna inte har gjort själva är effekterna däremot små, och i en engelsk studie i helklass hade lärarnas utbildning för få praktiska exempel (Slavin m.fl., 2019; Torgerson m.fl., 2018). Därför står det du visar ord för ord i varje kurs. Elever i skrivsvårigheter planerar ofta mindre än en minut och slutar skriva efter några minuter, och de skriver betydligt mer när läraren uppmanar dem att fortsätta. När eleven slipper forma bokstäver och stava, genom att diktera för en vuxen eller för ett program, blir texterna oftast längre och bättre (Santangelo, 2014). Att syftet går före formen kommer ur Skriv! (Fohlin och Wilson, 2027) och ur svenska forskares granskning av genrepedagogiken, där formen ibland har kommit före det texten ska göra (Bergh Nestlog m.fl., 2015; Walldén, 2019). Fyra saker är kursernas egna val, och studierna har inte prövat dem: att strategin har fyra steg utan minnesramsa, att Säg är ett eget steg, att kursens läsare är verkliga och svarar, och att du ger starthjälp med första meningen åt den som behöver det."
  kallor: "Bygger på Harris och Graham (2017), Graham och Perin (2007), Slavin m.fl. (2019), Torgerson m.fl. (2018), Santangelo (2014), Bergh Nestlog, Danielsson och Krogh (2015), Walldén (2019), Schmidt (2017) för cirkelmodellen och Fohlin och Wilson, Skriv! (utkommer 2027)."

lathund:
  innehall: En kurs per texttyp
  metoden:
    text:
      - "Texttyper i grupp är skrivkurser för elever i åk 4–7 som skriver korta texter utan plan. Varje kurs tar sex veckor och gäller en texttyp. Du frågar som läsaren, säger dina val högt och lämnar över. Det här är lathunden för det som gäller alla kurser."
      - "Gruppens och elevens egna texter går till kursens läsare, som svarar. Passen minut för minut, texterna och bladen står i varje kurs."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Nämn läsaren före första ordet.
          text: Läsaren avgör vad som ska med.
        - fet: Lägg åt sidan eller lägg till, för läsarens skull.
          text: Säg varför, så att valet hörs och syns.
        - fet: Kör fast högt.
          text: Säg vad du gör då.
      efter: Först från dig, sedan från eleven. Det är dem du lyssnar efter.
    tabell:
      rubrik: Elevens fyra steg · vad du säger
      kolumner:
        - Steg
        - Du säger
      rader:
        - - "Tänk\nLäsaren, och det eleven vill"
          - "”Vem läser? Vad vill du?”"
        - - "Planera\nLappar, och minst en åt sidan"
          - "”Behöver läsaren det här?”\n”Vilken lapp lägger ni åt sidan? Varför?”"
        - - "Säg\nBerätta för en läsare"
          - "”Berätta texten för din läsare.”\n”Fråga bara det du inte fick veta.”"
        - - "Skriv\nDet eleven sa"
          - "”Skriv det du sa.”\n”Vad svarade du när läsaren undrade?”"
    not: "På tavlan står tre rader: Vem läser? Vad vill vi? När får vi svar? När eleven fastnar frågar du först ”Vem ska läsa det här? Vad behöver den personen veta då?”"
  pass:
    rubrik: "Vi kör ett pass: gruppen lär sig förklara"
    textRubrik: "Gruppen · fyra elever i åk 5, pass 6 i kursen om argumenterande text"
    text:
      - "På tavlan står ”Det är bra för många.” Vilgot läser meningen som Maria i skolbiblioteket, kursens läsare: ”Nu undrar jag hur.” Alla skriver en ny mening som svar och lägger dem bredvid varandra."
      - "Läraren skriver utkastet ”Skolan borde ha fler rörelsepauser, för elever lär sig bättre då.” och tänker högt, rad för rad som under Så tänker du högt. Paren har elevens sida med de två texterna, och Hamza säger: ”Den andra säger hur det går till.”"
      - "Var och en tar fram sin text från pass 4. Elsa berättar sitt skäl. Nadia ur det andra paret är läsare och frågar: ”Hur menar du med att fler hinner låna?” Elsa skriver svaret på en ny lapp och sedan i texten."
      - "Elsa läser upp sin mening och säger: ”Jag lade till den för att Nadia frågade hur jag menade.” Var och en skriver vad hen tar med sig."
    forberett:
      rubrik: Det jag förberedde
      text:
        - "Jag skrev tavlans tre rader och dagens mening, och jag hade övat högt på det jag skulle visa. På bordet låg lappar, kursens kort och mapparna, och i handen hade jag bladet Det jag hör."
    klarTidigt: "Eleven läser sin text som läsaren, med kortet, och skriver in det läsaren saknar."
    schema:
      rubrik: Så tänker du högt i delen Visa och pröva
      kolumner:
        - Nr
        - Du gör och säger högt
      rader:
        - tid: "1"
          fas: Skriv vem som läser, och ett utkast
          vad: "”Lärarna på skolan läser det här. Jag vill att de lägger in fler rörelsepauser.”"
        - tid: "2"
          fas: Läs utkastet som läsaren
          vad: "”Jag har ett skäl, men det går för snabbt. Hur kan rörelse hjälpa lärandet? Jag behöver förklara mer.”"
        - tid: "3"
          fas: Skriv vidare
          vad: "”När elever får röra på sig en kort stund kan de komma tillbaka till arbetet med mer fokus.”"
        - tid: "4"
          fas: Stanna med pennan i luften
          vad: "”Nu kör jag fast. Då frågar jag som läsaren. Hur ser en sådan paus ut?”"
        - tid: "5"
          fas: Skriv ett exempel
          vad: "”Det kan räcka med två minuter där klassen sträcker på sig, byter plats eller gör en enkel rörelseövning.”"
        - tid: "6"
          fas: "Läs båda versionerna högt, och låt paren jämföra dem"
          vad: "”Vad hände med skälet när jag lade till förklaring och exempel?”"
        - tid: "7"
          fas: Fråga gruppen
          vad: "”Vad sa jag allra först? Vad sa jag när jag körde fast?”"
  mall:
    rubrik: När eleven fastnar · Så tas stödet bort
    underrad: Det som gäller alla kurser
    block:
      - typ: tabell
        rubrik: Stödtrappan · eleven prövar ett stöd innan du ger nästa
        kolumner:
          - Steg
          - Du gör
        rader:
          - - "Först"
            - "Fråga ”Vem ska läsa det här? Vad behöver den personen veta då?”"
          - - "1"
            - "Vänta tio sekunder. Peka på tavlans tre rader och på elevens mening för när det tar emot."
          - - "2"
            - "Läs elevens senaste mening som läsaren, och säg vad du nu vet och vad du undrar."
