# Texttyper i grupp. Den generella metoden i serien med en kurs per texttyp, på Niclas uppdrag 2026-10-06
# (intake/texttyper-i-grupp.md). Underlaget är intaget med registret (intake/texttyper-i-grupp/REGISTER.md), sökningarna
# (sokning.md) och Niclas bok Skriv! (intake/skrivkurs-sagoboken/skriv-bok.md), och valen står i analys.md.
# Det som står ordagrant ur Skriv! räknas upp i analysen under Källan i dag.
# Efter rundorna 2026-10-06: den generella metoden förklarar idén, strategin, hur du tänker högt, hur du lär ut en
# skrivhandling, eleverna, rollen, stödet och grunden. Passet minut för minut, stegtabellen och bladen står i kursen.
titel: Texttyper i grupp
undertitel: "Skrivkurser i liten grupp för åk 4–7, en för varje texttyp, där du tänker högt och eleven tar över"
ingress: "Skrivkurser i liten grupp för elever i åk 4–7 som skriver korta texter utan plan. Varje kurs tar sex veckor och gäller en texttyp. Eleven lär sig planera och skriva en text för en verklig läsare, som svarar. Du skriver inför gruppen, säger dina val högt och lämnar över valen till eleven."
omrade: Skrivning
arskurs:
  - 4-6
  - 7-9
arskursText: åk 4–7
taggar:
  - skrivstrategier
  - textstruktur
  - formativ-bedomning
  - intensivtraning
format:
  - liten grupp
  - par
tid: 60 minuter per pass, två pass i veckan
period: Sex veckor för varje kurs
grupp: Två till tio elever
material:
  - kursens texter
  - kursens kort och blad
  - lappar
  - en mapp per elev

uppdaterad: 2026-10-09
publicerad: 2026-10-09
