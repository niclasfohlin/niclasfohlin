    not: "De fyra stegen står på bladet Planen i varje kurs, och efter några veckor kan eleven säga dem, vad hen gör i varje steg och när hen har nytta av dem. Stegen är desamma i alla kurser. Det som skiljer kurserna åt är det läsaren brukar undra, och det står på kursens kort. Eleven har ett mål i taget. Hen föreslår målet själv, till exempel ”Jag förklarar ett skäl”, och tar det ur det en läsare undrade förra gången. Du säger ja eller lägger till något. När målet syns i texten skriver eleven ett nytt. Eleven har också en mening som hen säger till sig själv när det tar emot, och den tar hen ur det hen hörde dig säga. Målet och meningen står på ett annat av elevens blad."
  - rubrik: "Ett pass i sex delar: vad varje del är till för"
    plats: efter-steg
    meny: true
    text: "De sex delarna gäller de pass där eleverna skriver en text med de fyra stegen, i kursen om argumenterande text fem av de tolv. Här står vad varje del är till för. Minuterna, och det du gör och säger i varje del, står i kursen, i tabellen Ett pass i sex delar. I de passen är Skriv den längsta delen. Minuterna är hållpunkter: det tar tid att komma i gång, och ett skratt får ta plats. Det gör inget om det blir tid över, men det blir svårt när tiden är för knapp."
    kolumner:
      - Del
      - Det som händer
      - Varför
    rader:
      - - "Läs som läsaren\nGemensamt"
        - "En elev läser en mening på tavlan som läsaren och säger vad hen nu vet och vad hen undrar. Alla skriver en ny mening, ni lägger dem bredvid varandra, och var och en gör sin bättre: Alla svar på bordet."
        - "Eleven övar på att höra vad en läsare saknar, i en mening som inte är hens egen."
      - - "Visa och pröva\nLäraren visar"
        - "Du säger vad passet lär ut, visar det och tänker högt. Eleverna säger vad de hörde dig säga, och gruppen prövar samma sak en gång tillsammans."
        - "Eleven ser hur en skribent väljer innan hen väljer själv."
      - - "Tänk och planera, Säg och Skriv\nI par"
        - "Eleven läser sitt mål och gör de fyra stegen. Har paret en gemensam plan, kommer läsaren i Säg ur ett annat par. Var och en skriver sin text, och du ställer frågan medan eleven skriver, med högst ett grepp till."
        - "Planen är lappar som eleverna kan flytta, så att valet syns på bordet. Det eleven svarar läsaren är oftast det som saknades i texten."
      - - "Läs upp\nGemensamt igen"
        - "Två elever läser en mening och berättar om ett val de gjorde."
        - "Valet hörs från eleven, och du hör vad som har lämnats över."
  - rubrik: "Så tänker du högt: ett exempel"
    plats: efter-steg
    meny: true
    text: "När du tänker högt hör eleven hur en skribent väljer. Tre saker ska höras: du nämner läsaren före första ordet, du lägger något åt sidan eller lägger till något för läsarens skull, och du kör fast och säger vad du gör då. Exemplet kommer ur kursen om argumenterande text, där du i pass 6 visar hur ett skäl förklaras. Skriv på tavlan eller på ett blädderblock, så att utkastet står kvar bredvid det du lägger till. Öva högt kvällen före."
    kolumner:
      - Du gör
      - Du säger högt
    rader:
      - - "Skriver vem som läser, och ett utkast: ”Skolan borde ha fler rörelsepauser, för elever lär sig bättre då.”"
        - "”Lärarna på skolan läser det här. Jag vill att de lägger in fler rörelsepauser.”"
      - - Läser utkastet och tänker på läsaren
        - "”Jag har ett skäl, men det går för snabbt. Jag säger vad jag tycker, men jag hjälper inte läsaren att förstå sambandet. Hur kan rörelse hjälpa lärandet? Jag behöver förklara mer.”"
      - - Skriver vidare, och säger meningen medan du skriver
        - "”När elever får röra på sig en kort stund kan de komma tillbaka till arbetet med mer fokus.”"
      - - Stannar med pennan i luften
        - "”Nu kör jag fast. Då frågar jag som läsaren. Hur ser en sådan paus ut?”"
      - - Skriver ett exempel, och säger det medan du skriver
        - "”Det kan räcka med två minuter där klassen sträcker på sig, byter plats eller gör en enkel rörelseövning innan arbetet fortsätter.”"
      - - "Läser den första och den nya versionen högt, och låter paren jämföra dem"
        - "”Vad hände med skälet när jag lade till förklaring och exempel? Blev det lättare att följa min tanke?”"
      - - "Vänder dig till gruppen, när paren har svarat"
        - "”Vad sa jag allra först? Vad sa jag när jag körde fast?”"
    not: "Exemplet är hämtat ur Skriv! (Fohlin och Wilson, 2027). Där säger läraren argument, och här säger du skäl, som är elevernas ord i kurserna. Tre saker är tillagda här: du säger vem som läser, du kör fast och du frågar vad eleverna hörde dig säga."
  - rubrik: "Så lär du ut en skrivhandling: två texter och vad de gör"
    plats: efter-steg
    meny: true
    text: "En skrivhandling är det texten gör, som att berätta, beskriva, förklara, instruera eller övertyga. Sättet att göra det på, som att bygga ut ett skäl med ett exempel, är ett skrivdrag, alltså något skribenten väljer för läsarens skull. En text gör oftast flera saker, och du lär ut en skrivhandling i taget, i delen Visa och pröva. Du visar två texter bredvid varandra, och du vet i förväg vad som är lika och vad som skiljer dem åt. I de tre första textparen är texterna korta, högst fem meningar var. Varje kurs har sina textpar färdiga, under Kursens material."
    kolumner:
      - Textparet
      - Det som är lika
      - Det som skiljer
      - Eleven får syn på
    rader:
