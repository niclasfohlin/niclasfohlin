film:
  sekunder: 28.76
  beskrivning: "Läraren tänker högt. Läraren säger: ”Lärarna på skolan läser det här.” Läraren lägger till ett exempel för läsaren. Läraren säger: ”Nu kör jag fast. Då frågar jag som läsaren.” Läraren frågar: ”Hur ser en sådan paus ut?” Läraren skriver: ”Det kan räcka med två minuter där klassen sträcker på sig.” Vad hörde eleverna? Läraren frågar: ”Vad sa jag när jag körde fast?” Nadia säger: ”Du frågade som läsaren.” Senare skriver Hamza till Maria i biblioteket. Hamza säger: ”Maria undrar vad jag gör där.” Hamza skriver: ”Jag läser serier där, för det hinner jag inte annars.” Läraren säger: ”Nu vet jag vad du gör där.”"
  rubrik: "Så tänker du högt"
  ingress: "Fyra bilder ur filmen om hur läraren tänker högt. Läraren står vid tavlan och säger vem som läser. Tavlan syns på nära håll när läraren kör fast och lägger till något för läsarens skull. Eleverna säger vad de hörde, och senare gör en elev som läraren i sin egen text. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Utkastet står på tavlan. Läraren säger vem som läser."
    - text: "Läraren kör fast, frågar som läsaren och lägger till."
    - text: "Läraren frågar vad eleverna hörde, och Nadia svarar."
    - text: "Hamza frågar som läsaren, lägger till och får svar."
filmer:
  - nr: 2
    titel: "Så lär du ut en skrivhandling"
    sekunder: 27.04
    beskrivning: "Läraren visar två texter och säger vad som är lika. Läraren frågar: ”Vad har den andra texten som den första inte har?” Eleven säger: ”Den säger hur de menar.” Vad gör meningen för läsaren? Läraren skriver: ”förklarar: Hur menar du?” Sedan prövar eleven i sin egen text. Kamraten frågar: ”Hur menar du med att fler hinner låna?” Eleven säger: ”På lektionen hinner vi bara lämna tillbaka.” Läraren säger: ”Det du svarade nu ska med i texten.” Eleven skriver det hen sa."
    rubrik: "Två texter: fyra bilder ur filmen"
    ingress: "Skrivhandlingen här är att förklara. Läraren visar två texter där en sak skiljer, och sedan förklarar eleven i sin egen text. Filmen på metodens sida visar samma sak i rörelse."
    efter: "tabell: Så lär du ut en skrivhandling: två texter och vad de gör"
    stillbilder:
      - text: "Läraren visar två texter och frågar vad som skiljer."
      - text: "Läraren stryker under meningen och skriver vad den gör."
      - text: "Sedan frågar kamraten som Maria, och eleven svarar."
      - text: "Läraren säger att svaret ska med. Eleven skriver det."
