utkast: false
lektionsbank:
  rubrik: "Kurserna: en för varje texttyp"
  slag: kurser
  grupp: Texttyp
  skalRubrik: Det texten gör för läsaren
  numrerad: false
  text: "Varje kurs gäller en texttyp och har texttypen i namnet, som Texttyp: Argumenterande text. Kurserna står under Kurserna på metodens sida, och var och en är en egen metod. Kurserna har samma fyra steg, samma pass i sex delar och en läsare som svarar. Det som byts är vad texten ska göra för läsaren, och därmed det läsaren undrar. Gruppen går en kurs i taget, och du väljer kurs efter vad eleverna behöver skriva i klassen."
  formagor:
    - nr: 1
      namn: Argumenterande text
      skal: "Texten vill få läsaren att hålla med eller göra något. Läsaren undrar vad skribenten vill, varför, hur hen menar och vad läsaren själv ska göra."
    - nr: 2
      namn: Berättande text
      skal: "Texten låter läsaren vara med om något. Läsaren undrar vem det handlar om och var, vad som händer, hur det känns och hur det går."
    - nr: 3
      namn: Beskrivande text
      skal: "Texten låter läsaren se hur något är. Läsaren undrar vad det är och var, vad det liknar, vad hen ser först och sedan, och vad som skiljer det från annat."
    - nr: 4
      namn: Instruerande text
      skal: "Texten lär läsaren att göra något själv. Läsaren undrar vad det går ut på, vad hen behöver, hur hen gör och hur hen vet att det blev rätt."
  not: "En text gör oftast flera saker. I en argumenterande text behöver eleven också förklara och ge exempel, och det kan hen bygga vidare på i nästa kurs. Börja därför en ny kurs med att eleven läser sitt sista mål och säger vad hen känner igen i den nya texten, som avsnittet om återkopplingen säger. Att förklara tränas inne i kurserna och har ingen egen kurs."

inledning:
  - "Texttyper i grupp är skrivkurser för elever i åk 4–7 som behöver stöd i att skriva. Eleverna skriver ofta korta texter utan plan. De börjar skriva direkt, skriver ned det de kommer på, en sak i taget, och slutar när det tar emot. I kurserna lär de sig planera och skriva en text som gör något för en läsare: övertygar, berättar, beskriver eller instruerar. Varje kurs gäller en texttyp och tar sex veckor."
  - "På tavlan står tre rader om läsaren: Vem läser? Vad vill vi? När får vi svar? På bordet ligger lappar, kursens kort med det läsaren brukar undra och en mapp för varje elev. Lapparna är små bitar papper som du klipper ur arket Lapparna i kursen. På dem skriver eleverna det som ska med i texten, en sak på varje lapp, med några ord. Sedan lägger de åt sidan det läsaren inte behöver och lägger resten i ordning. När en kamrat är läsare har hen kortet och frågar med hjälp av det."
  - "Eleven lär sig genom att höra dig tänka högt och sedan göra likadant. Du frågar som läsaren, säger dina val högt och lämnar över. Du visar hur en skribent väljer, till exempel: ”Det här bryr sig rektorn inte om, så det lägger jag åt sidan.” Sedan väljer gruppen tillsammans, därefter paren, och till sist väljer eleven själv. Mitt i varje text möter eleven något, som en kamrats början, din fråga eller en läsares svar, och tar ställning till det medan texten ännu går att ändra. När texten är klar skriver eleven vad hen tar med sig till nästa text. Dina frågor och de samtal eleverna för med varandra kan så småningom bli en del av elevens inre röst som skribent."
  - "Tanken bakom kurserna är att en text ska göra något för någon. En text skrivs av någon, till någon och för ett syfte. När eleven vet vem som ska läsa, och vad läsaren behöver förstå, känna eller kunna göra efteråt, blir textens delar redskap för att lyckas. Därför börjar varje text med frågan Vem läser? Därför har också varje kurs verkliga läsare som svarar. Det kan vara en vuxen på skolan, yngre elever, inbjudna lyssnare, någon som eleven känner och skriver brev till, eller elever i en annan klass som gör det texten säger. Varje kurs säger vilka läsarna är och vad du ordnar inför den. I de första passen är du själv läsaren."
  - "Eleven gör varje text med samma fyra steg i alla kurser: Tänk, Planera, Säg och Skriv. I steget Säg berättar eleven texten för en läsare innan hen skriver den. De pass där eleverna skriver en text med de fyra stegen har samma sex delar: gruppen läser en mening som läsaren, du visar något som gruppen prövar, och sedan gör eleverna stegen. De andra passen har egna minuter i kursen."
  - "Texttypen är namnet på det en text mest gör och på hur sådana texter brukar se ut. Den är bra att känna igen, till exempel när en uppgift ber om en argumenterande text. Den får däremot aldrig bli en mall som bestämmer över det eleven vill säga. Därför läser gruppen två texter bredvid varandra och frågar vad de gör, och därför säger du varje gång varför en text brukar se ut som den gör. Passen minut för minut, texterna och bladen står i varje kurs. När du har valt kurs börjar du med kursens checklista och veckans sida för vecka 1. Den första kursen heter Texttyp: Argumenterande text."

upplagg:
  rubrik: Så fungerar insatsen
  text: "En kurs har två till tio elever och två pass om 60 minuter i veckan under sex veckor. Eleven skriver varje text i fyra steg: Tänk, Planera, Säg och Skriv. Första veckan skriver eleven en kort text utan stöd, och du är läsaren. I vecka 2 skriver du och tänker högt, i vecka 3 skriver gruppen, i vecka 4 paren och i vecka 5 var och en. Gruppens text och elevens egen text går till kursens läsare, som svarar. I vecka 6 kommer svaren, och eleven skriver en ny kort text, som du lägger bredvid den första. På kursens blad Det jag hör skriver du ned vad eleverna säger."

gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Kurserna är för elever i åk 4–7 som skriver korta texter utan plan. I åk 7 kan en kurs vara en insats för elever som inte nådde godkänt i svenska i åk 6. Eleven behöver kunna få ned meningar som går att läsa, för hand, på dator eller genom att diktera. Den som redan planerar och skriver sammanhängande får inte ut så mycket av en kurs, och den vars största hinder är stavningen behöver stöd i stavning vid sidan av kursen. Lägg inte kursen på tiden för elevens läs- eller stavningsstöd. Du sätter ihop paren. Med udda antal blir ett av paren tre, och med ett enda par är du läsaren."

principer:
  rubrik: Tre saker att hålla fast vid
  text: "Nämn läsaren före första ordet, i varje text. Läsaren avgör vad som ska med. Lägg något åt sidan eller lägg till något för läsarens skull, och säg varför, så att valet hörs och syns på pappret. Kör fast högt, och säg vad du gör då. Eleven behöver höra att också du fastnar och hur du tar dig vidare. De tre sakerna ska först höras från dig och sedan från eleven, och det är dem du lyssnar efter."

