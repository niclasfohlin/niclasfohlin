    not: "När eleven fastnar: vänta, peka på första ljudet, ljuda tillsammans, säg ordet och läs om meningen. Ett steg i taget. Fler än ett fel av tio ord: byt nivå."
  pass:
    rubrik: "Vi kör ett pass: tre elever i årskurs 2"
    textRubrik: Gruppen · tre elever, åk 2, egen bok var
    utskrift: Skriv ut passexemplet
    text:
      - Amir läser upp sina tre meningar från gårdagens bok. ”Du läste hela första meningen utan att stanna. Varför valde du den?” Läraren signerar lässchemat. Sedan Selma och Noor.
      - "Alla tar fram dagens bok. Läraren bläddrar med Selma: ”Vad tror du att hunden gör?” Ordet trädgården visas innan de börjar: ”Vi delar det: träd-går-den.” Kort, en elev i taget."
      - "Amir och Noor viskläser. Läraren sitter hos Selma, som fastnar på sprang. Läraren väntar. Selma ljudar. ”Läs ordet igen som ett helt ord. Läs meningen från början nu.” Sedan Amir, som gissar ändelser: ”Titta på slutet av ordet.” Sist Noor, som ljudar det mesta. Boken är för svår."
      - "”Ikväll läser ni boken en gång till för någon hemma. Välj tre meningar ni gillar.” Mapparna i ryggsäckarna. Notering: alla hade läst hemma, Selma läser om själv nu, Noor byter nivå."
    forberett:
      rubrik: Det jag förberedde
      text:
        - Tre böcker på tre nivåer i tre mappar. Titeln inskriven i lässchemat. Bläddrat igenom böckerna och sett orden som kan bli svåra. Bestämt att lyssna på Selma först.
    klarTidigt: Läs boken en gång till, läs den för en kamrat eller välj redan nu de tre favoritmeningarna.
    schema:
      rubrik: 20 minuter, steg för steg
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Välj bok på rätt nivå till varje elev. Bläddra igenom den. Skriv titeln i lässchemat.
        - tid: 0–4
          fas: Återkoppla
          vad: Varje elev läser upp tre favoritmeningar från gårdagens bok. Beröm något konkret. Signera lässchemat.
        - tid: 4–8
          fas: Förbered
          vad: Bild- och rubrikvandring i dagens bok. Gissa vad som händer. Visa två eller tre ord som kommer i texten.
        - tid: 8–18
          fas: Läs
          vad: Eleverna läser sin bok. Du sitter hos en i taget, två till tre minuter var. Övriga läser tyst eller viskande.
        - tid: 18–20
          fas: Avsluta
          vad: Upprepa hemuppdraget. Mappen i ryggsäcken. Kort notering.
        - tid: Hemma
          fas: Cirka 20 min
          vad: Eleven läser boken en gång till för en vuxen, cirka tio minuter. Skriver tre favoritmeningar. Den vuxne signerar.
