# Ordverkstad i grupp. Riggens metod på Niclas uppdrag 2026-10-05 (intake/ordverkstad-i-grupp.md, ARBETSPLAN.md).
# Underlaget är intaget med registret (intake/ordverkstad-i-grupp/REGISTER.md) och sökningen (sokning.md), och valen
# står i analys.md. Orden, delningarna och fogarna prövas mot facit i ord.json och SALDO (node build/ord.mjs).
titel: Ordverkstad i grupp
undertitel: "Åtta veckors kurs i liten grupp för åk 3–6, där eleverna bygger, läser, stavar och skriver långa ord"
ingress: "En kurs i åtta veckor för fyra till sex elever i åk 3–6 som läser korta ord men fastnar på långa. Varje vecka läser gruppen en förlaga, pusslar med ordens delar på kort och skriver en egen text till gruppens tidning, byggd som förlagan. Eleverna skriver i par de första fyra veckorna och sedan var för sig."
omrade: Skrivning
arskurs:
  - F-3
  - 4-6
arskursText: åk 3–6
taggar:
  - avkodning
  - stavning
  - ordforrad
  - intensivtraning
format:
  - liten grupp
  - par
tid: 60 minuter per pass, tre pass i veckan
period: Åtta veckor
grupp: Fyra till sex elever
material:
  - förlagorna
  - ordkorten
  - kortet Ett långt ord
  - en miniwhiteboard per elev
  - skrivplanen
  - tidningens sida

uppdaterad: 2026-10-06
publicerad: 2026-10-06
relaterade:
  - laslistor-i-grupp
  - textsamtal-i-grupp
  - skrivkurs-berattelseram
utkast: false

inledning:
  - "Ordverkstad i grupp är för elever i åk 3–6 som läser korta ord säkert men fastnar på långa. De gissar efter början av ordet, tappar ändelsen och stavar efter ljudet, och i egna texter väljer de bort de långa orden. I kursen lär de sig hur långa ord är byggda, först av ord som sätts ihop och sedan med ändelser och förstavelser. De delar långa ord för att läsa, stava och förklara dem, och de skriver orden i egna texter till gruppens tidning."
  - "Varje vecka har en förlaga, en kort text full av långa ord, som en artikel om uppfinningar, en platsannons eller en instruktion till en tävling. På bordet ligger förlagan, kortet Ett långt ord och en miniwhiteboard med en whiteboardpenna för varje elev, och i ordpasset ett kuvert med ordkort för varje par. På ordkorten står delarna i veckans ord, som regn och hatt i förlagans regnhatt. Paren pusslar ihop delarna till ord, läser orden och bygger nya, som hattregn, och säger vad orden betyder. På väggen sitter planschen Delarna, där du skriver upp veckans delar när ni börjar en ny vecka."
  - "Eleven tar varje långt ord med samma fyra steg, Dela ordet, En del i taget, Hela ordet och Vad betyder det? Stegen leder eleven genom hela ordet, en del i taget ända till ändelsen, så att hen slutar gissa efter början. Eleven stavar på samma sätt, en del i taget, och skriver varje del som när den står ensam. När eleven förklarar ordet börjar hen bakifrån, eftersom sista ordet i ett sammansatt ord säger vad det är, och ändelsen och förstavelsen ändrar det. En brandbil är en bil, en bilbrand är en brand och en ovän är ingen vän."
  - "Veckan har tre pass om 60 minuter, ett ordpass och två skrivpass. Varje pass börjar med Ordstarten, fem minuter då alla skriver två långa ord på sin miniwhiteboard och tar dem med stegen. I ordpasset läser gruppen förlagan, du visar ett ord med stegen, och paren bygger egna ord med korten. I en diktamen skriver eleverna långa ord en del i taget, ihop."
  - "I skrivpassen skriver eleverna en egen text byggd som förlagan, med en början, en mitt och ett slut och minst tre egna långa ord, varav minst ett med en av veckans delar. I vecka 1 hittar paret på en uppfinning och skriver om den, med namnet som rubrik, det som är jobbigt i mitten och vad uppfinningen gör i slutet. På bordet ligger då också skrivplanen, tidningens sida och kortet Vi skriver i par. Varje vecka visar du först hur förlagan är byggd och skriver din egen text på blädderblocket. Sedan gör paret en skrivplan, berättar texten för ett annat par och skriver den på tidningens sida med Kloka pennan: meningsbyggaren säger en mening, och sekreteraren säger den igen och skriver den. Från vecka 5 skriver var och en sin egen text, och kamraten är kontrollant: hen läser texten högt och pekar på de långa orden. Texten blir klar i det andra skrivpasset, och ingen text blir läxa."
  - "Texterna blir gruppens tidning. Gruppen ger tidningen ett namn i vecka 1, och varje veckas texter blir en avdelning i den, som Uppfinningar, Lediga jobb och Djurlexikon. Texterna hänger ihop, och uppfinningen från vecka 1 kommer till exempel tillbaka i reklamen i vecka 3. Du samlar sidorna i en mapp. I vecka 8 gör gruppen ett omslag och läser tidningen för en inbjuden läsare, och efter kursen får varje elev ett eget exemplar."

upplagg:
  rubrik: Så fungerar insatsen
  text: "Fyra till sex elever har tre pass om 60 minuter i veckan under åtta veckor. Varje vecka har en förlaga, ett ordpass och två skrivpass, och varje pass börjar med Ordstarten. I ordpasset bygger paren långa ord med ordkort och tar varje ord med samma fyra steg, Dela ordet, En del i taget, Hela ordet och Vad betyder det? I skrivpassen skriver eleverna en text till gruppens tidning, byggd som förlagan, i par i vecka 1–4 och var för sig i vecka 5–8. Kartläggningen före och efter kursen och protokollet efter varje pass visar hur eleven läser, stavar, förklarar och skriver långa ord."

gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Kursen är för elever i åk 3–6 som läser korta ord säkert men fastnar på långa. De gissar efter början, tappar ändelsen, stavar efter ljudet eller skriver sammansatta ord isär, men de skriver meningar som en vuxen kan läsa. Den som ännu ljudar korta ord bokstav för bokstav eller läser mycket långsamt börjar i TIL i grupp, och i åk 3 kan hen också börja i Läslistor i grupp. Den som läser långa ord rätt men inte förstår texten behöver Textsamtal i grupp. Gruppen har fyra till sex elever med samma behov, i fasta par som kan skriva tillsammans och en trio när eleverna är fem."

principer:
  rubrik: Tre saker att hålla fast vid
  text: "Ta varje långt ord med samma fyra steg, i Ordstarten, i förlagan och i elevens egen text. Eleven behöver en enda väg genom ordet, eftersom många regler blir för mycket att hålla reda på. Låt eleven förklara ordet bakifrån, varje gång. Sista ordet i ett sammansatt ord säger vad det är, och förstavelsen och ändelsen ändrar det, som o- i otur och -⁠lös i tandlös. Låt varje vecka sluta i en egen text till en läsare, byggd som förlagan. Där övar eleven stavningen i sina egna ord, och de långa orden blir värda att kunna."

passrutin:
  text: "Ordpasset är veckans första pass. Gruppen läser förlagan och arbetar med veckans delar, som eleverna sedan använder i sin egen text i skrivpassen."
  steg:
    - text: "Gruppen läser veckans och förra veckans delar på planschen Delarna i kör, och alla tar två långa ord med de fyra stegen på sin miniwhiteboard."
      fas: Ordstarten
    - text: "Gruppen tittar på bilder av det förlagan tar upp, läser förlagan och stryker under ord med veckans delar."
      fas: Förlagan
    - text: "Paren bygger ord av veckans delar med ordkorten och tar varje ord med stegen."
      fas: Bygga
    - text: "Paren läser veckans nya ord för varandra och säger vad de betyder."
      fas: Nya ord
    - text: "Eleven skriver långa ord på sin miniwhiteboard, en del i taget, ihop."
      fas: Diktamen
    - text: "Varje elev läser ett ord från sin miniwhiteboard och säger vad det betyder, och paren tänker ut vad deras text ska handla om."
      fas: Läsa upp
  kallas: delar
  efterPasset: "Skriv i protokollet vad varje elev läste och förklarade, och skriv felen från diktamen innan eleverna suddar sina miniwhiteboards. Byt ett av Ordstartens ord i pass 2 eller 3 mot ett ord som flera elever inte kunde läsa."

tidsschema:
  rubrik: "Pass 1: ordpasset på 60 minuter"
  text: "Förbered dig genom att läsa fältet Pass 1, ordpasset, på veckans sida under Till läraren: veckorna. Där står delarna och orden till Ordstarten, det du visar i Bygga, de nya orden och diktamen. Lathunden visar ett ordpass i vecka 2, minut för minut."
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: "Skriv veckans nya delar på planschen, och skriv Ordstartens två ord och veckans sex nya ord på stora tavlan. Ställ fram blädderblocket, och leta fram veckans bilder på datorn. Lägg fram förlagan, kortet Ett långt ord och en miniwhiteboard med whiteboardpenna och sudd till varje elev, och ett kuvert med ordkort till varje par."
    - tid: 0–5 min
      fas: Ordstarten
      vad: "Peka på veckans och förra veckans delar. Ta sedan ett ord i taget. Alla skriver av ordet och tar det med stegen innan någon säger det, och sedan visar du eller en elev på stora tavlan."
    - tid: 5–15 min
      fas: Förlagan
      vad: "Visa först bilder på datorn av två eller tre saker som förlagan tar upp, till exempel från en bildsökning. Fråga om någon känner igen dem, och säg vad de heter och vad orden betyder. Läs sedan förlagan högt, och därefter läser alla i kör. Prata om vem texten är skriven för (förlagans fråga 4) innan eleverna gör fråga 1."
    - tid: 15–35 min
      fas: Bygga
      vad: "Visa ett ord med stegen på stora tavlan och tänk högt, och lägg sedan ordet med korten mitt på bordet. Paren gör fråga 2, som gäller ett annat ord. Sedan bygger varje par minst fem egna ord och ett som inte finns: de lägger delarna i rad, läser en del i taget, skjuter ihop korten och säger vad ordet betyder, bakifrån, och byter plats på delarna. Sist förklarar varje par sitt påhittade ord för gruppen."
    - tid: 35–40 min
      fas: Nya ord
      vad: "Låt paren läsa orden från stora tavlan, och lyssna på ett par i taget."
    - tid: 40–52 min
      fas: Diktamen
      vad: "Före diktamen lägger paren korten i kuvertet och vänder förlagan, och du suddar de nya orden på stora tavlan. Säg ordet, säg det sedan i en mening som du hittar på och säg ordet igen, och låt eleven säga delarna innan hen skriver. Titta på elevernas miniwhiteboards tillsammans, och låt eleven själv hitta en del som blev fel. Visa sedan veckans vanliga fel, och låt eleverna svara muntligt på fråga 3."
    - tid: 52–60 min
      fas: Läsa upp
      vad: "Låt varje elev läsa ett ord från sin miniwhiteboard och förklara det bakifrån. Sedan säger du vem som ska läsa texten och vad eleverna ska skriva den här veckan. Paren, från vecka 5 var och en, tänker ut vad texten ska handla om, och du skriver idéerna på blädderblocket."
  efter: "Vecka 1 börjar med fem minuter om kursen, och Bygga tar då 15 minuter. I vecka 1 visar du det första ordet i Ordstarten innan eleverna tar stegen. Blir ett par klart tidigt i Bygga, bygger det fler ord och läser dem för dig."

steg:
  rubrik: Vad du gör och säger i ordpasset
  fraserRubrik: Du säger
  text: "Stegen för ett långt ord och fraserna till dem står i tabellen De fyra stegen för ett långt ord. Här står hur du leder ordpasset och vad du säger i varje del."
  rader:
    - namn: Ordstarten
      fraga: Hur är ordet byggt?
      gor: "När du pekar på planschen säger gruppen delen och vad den gör. Vem som visar stegen på stora tavlan står i tabellen Så flyttas stödet, och eleven som leder säger stegen från kortet Ett långt ord."
      fraser:
        - Vad gör -⁠arna med ordet?
        - Skriv av ordet och ta stegen.
        - Visa oss på stora tavlan.
    - namn: Förlagan
      fraga: Vem är texten skriven för?
      gor: "Låt eleverna säga vad de ser på bilderna innan du säger vad saken heter. Läs högt med inlevelse. När eleverna har strukit under, låt en elev säga delarna i ett av orden."
      fraser:
        - Känner någon igen det här?
        - Hur märker du vem den är skriven för?
        - Läs fråga 1 och stryk under orden.
        - Var är delarna i det här ordet?
    - namn: Bygga
      fraga: Vad betyder ordet?
      gor: "Säg allt du gör när du visar ordet, också när du delar det och börjar bakifrån. Gå sedan mellan paren och lyssna på ett ord i taget. När paret byter plats på delarna, fråga vad det nya ordet betyder, så att eleverna hör att sista ordet säger vad det är."
      fraser:
        - Vad betyder det? Börja bakifrån.
        - Byt plats på delarna. Vad blir det nu?
        - Finns ordet, eller har ni hittat på det?
    - namn: Nya ord
      fraga: Vilka delar känner du igen?
      gor: "Lyssna efter om eleven läser en del i taget eller gissar efter början. Gissar eleven, peka på delarna och låt hen läsa ordet igen. Känner gruppen inte till ett ord, säg det i en mening."
      fraser:
        - Läs ordet för din kamrat.
        - Var är delarna?
        - Vad betyder det?
    - namn: Diktamen
      fraga: Hur många delar?
      gor: "Rätta inte medan eleverna skriver. Fråga vilken del eleven är osäker på, och låt hen skriva den som när den står ensam, till exempel boll i snöbollarna."
      fraser:
        - Säg ordet. Hur många delar?
        - Skriv en del i taget.
        - Står ordet ihop?
    - namn: Läsa upp
      fraga: Vad ska er text handla om?
      gor: "Låt eleven välja det ord hen är säkrast på. När du har sagt vem som ska läsa texten, fråga paren vad läsaren skulle vilja läsa om."
      fraser:
        - Vilket ord väljer du?
        - Vad skulle läsaren vilja läsa om?
        - Vad ska texten handla om?

arbetsform:
  rubrik: "Arbetsform i ordpasset: gemensamt, i par, var för sig, gemensamt igen"
  text: "Ordpasset går från gruppen till paren och till var och en, och tillbaka till gruppen. Sedan kommer veckans två skrivpass."
  delar:
    - rubrik: 1. Gemensamt
      text: Alla läser, och du leder
      faser:
        - Ordstarten
        - Förlagan
    - rubrik: 2. I par
      text: Du visar först, och paren bygger och läser ord
      faser:
        - Bygga
        - Nya ord
    - rubrik: 3. Var för sig
      text: Varje elev skriver orden du säger
      faser:
        - Diktamen
    - rubrik: 4. Gemensamt igen
      text: Var och en läser ett ord för gruppen
      faser:
        - Läsa upp

