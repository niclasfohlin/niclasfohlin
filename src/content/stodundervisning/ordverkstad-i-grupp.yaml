fastnar:
  rubrik: När eleven fastnar i ett ord
  text: Fråga först, och ge sedan så lite stöd som möjligt. Gå tillbaka till det steg där eleven fastnade. En elev med ett modersmål där huvudordet står först, som arabiska, säger ofta att en brandbil är en brand. Peka då på sista ordet och fråga vad det är.
  fragaForst:
    - Var är delarna?
    - Vilket steg är du på?
  trappa:
    - Peka på slutet av ordet och säg ”Ring in ändelsen.” Har ordet ingen ändelse, peka på skarven mellan delarna.
    - Täck ordet med handen så att bara den första delen syns, och flytta handen en del i taget.
    - Läs den första delen åt eleven, och låt eleven läsa nästa.
    - Säg ordet och låt eleven dela det. Skriv sedan ett nytt ord med samma del, och låt eleven läsa det själv.
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  motto: Sluta alltid med ett ord som eleven läser själv.

roll:
  rubrik: "Lärarens roll: visa först, och låt eleven ta över"
  text: "Du tänker högt när du visar ett ord i ordpasset och när du skriver din egen text i skrivpassen, och sedan gör eleverna samma sak själva. Säg samma fraser varje gång, så att eleven kan säga dem till sig själv."
  gor:
    - Visa ett ord med de fyra stegen och säg allt du gör.
    - Skriv din egen text på blädderblocket inför gruppen, och låt varje elev ge ett ord eller en mening.
    - Fråga vad ordet betyder, varje gång, och låt eleven börja bakifrån.
    - Sitt med ett par i taget när paren skriver, och hjälp till med en sak.
    - "När en elev har stavat fel, fråga först vilken del som blev fel. Hittar eleven inte felet, skriv ordet rätt ovanför och säg ”Så skrivs det i böcker.”"
  undvik:
    - att säga ordet innan eleven har prövat stegen
    - att dela ordet i stavelser innan eleven har hittat delarna
    - att rätta varje stavfel i elevens text, eller rätta med rödpenna
    - att låta en elev i paret ta över, så att paret inte byter efter varje mening
    - att skicka hem en text som inte blev klar

urval:
  rubrik: Var hittar du förlagorna och orden?
  text:
    - "Under Kursens material står veckorna en i taget: först veckans sida, sedan förlagan och ordkorten. Efter vecka 8 står korten och bladen som gäller hela kursen. Tabellen Materialet du behöver säger hur många du skriver ut. Vill du ha fler ord, särskilt i åk 5–6, ta dem ur det gruppen läser i klassen och i ämnena, som -⁠ning i smältning och frysning."
    - Förlagorna har också ord som eleverna inte har hört, som nyorden och de påhittade yrkena, men delarna i dem känner eleven. Säg ett ovanligt ord högt och i en mening innan gruppen läser det i förlagan, gärna med en bild, särskilt för elever med svenska som andraspråk. Låt paren bygga riktiga ord innan de hittar på egna.
  kravText: "Välj egna ord så att de uppfyller tre krav:"
  krav:
    - rubrik: Ord eleven har hört
      text: Eleven känner ordet när hen säger det, så att steg 3 och 4 går
    - rubrik: Delar som syns
      text: Delarna går att se och höra och betyder något, som cykel och hjälm
    - rubrik: Veckans del
      text: Ordet har veckans del, och gärna en del från en tidigare vecka

progression:
  rubrik: Så flyttas stödet
  text: "Eleverna tar över vecka för vecka på två sätt, och varje rad säger båda: i Ordstarten från att du visar till att eleverna leder, och i skrivandet från att paret skriver en text tillsammans till att var och en skriver sin egen."
  rader:
    - vecka: "1"
      fokus: Två ord blir ett
      roll: "Ordstarten: du visar stegen och tänker högt. Skrivandet: du visar Kloka pennan i din text, och paret skriver en text tillsammans"
    - vecka: "2"
      fokus: Fogen
      roll: "Ordstarten: du visar, och eleverna säger fraserna med dig. Skrivandet: paret skriver med Kloka pennan"
    - vecka: "3"
      fokus: Ihop eller isär
      roll: "Ordstarten: en elev visar, och du hjälper till med fraserna. Skrivandet: paret skriver med Kloka pennan"
    - vecka: "4"
      fokus: Ord som slutar på -⁠are
      roll: "Ordstarten: eleverna visar och säger fraserna själva. Skrivandet: paret tar de långa orden med kortet Ett långt ord, och du frågar innan du hjälper"
    - vecka: "5"
      fokus: Förstavelser
      roll: "Ordstarten: eleverna visar, och du frågar vad förstavelsen gör. Skrivandet: var och en skriver sin text, och kamraten är kontrollant"
    - vecka: "6"
      fokus: Ändelser som beskriver
      roll: "Ordstarten: en elev leder, och du hjälper till när det behövs. Skrivandet: eleverna föreslår de flesta meningarna i din text"
    - vecka: "7"
      fokus: Ord på -⁠ning, -⁠het, -⁠else och -⁠skap
      roll: "Ordstarten: en elev leder, och du lyssnar. Skrivandet: var och en skriver sin text och tar de långa orden med stegen"
    - vecka: "8"
      fokus: Nyord
      roll: "Ordstarten: eleverna leder. Skrivandet: var och en förklarar sitt nya ord för läsaren i tidningen"

uppfoljning:
  text: "Kartläggningen visar hur eleven läser, delar, stavar och förklarar långa ord och skriver dem i en text, före och efter kursen. Protokollet samlar det eleven läste, skrev och förklarade, vecka för vecka."
  rader:
    - nar: Före kursen
      vad: Gör kartläggningen veckan före kursen.
    - nar: Efter varje pass
      vad: Skriv i protokollet.
    - nar: Efter vecka 4
      vad: Läs texterna från vecka 1 och 4. Ta felstavade ord till Ordstarten, och bestäm vem som behöver en sekreterare från vecka 5.
    - nar: Efter kursen
      vad: Gör kartläggningen igen. Ge klassläraren resultatet och vad eleven behöver nu.

mal:
  punkter:
    - läsa långa ord som har kursens delar genom att dela dem, också ord som eleven inte har övat på
    - stava långa ord en del i taget, skriva sammansatta ord ihop och få med fogen
    - säga vad ett okänt ord betyder ur delarna, bakifrån
    - skriva en kort text som är byggd som förlagan, med långa ord, till en läsare

checklista:
  rubrik: Före första passet
  punkter:
    - Gör kartläggningen veckan före kursen.
    - Skriv ut förlagan och korten, och lägg ordkorten i kuvert.
    - Skriv ut skrivplanen, tidningens sida och protokollet.
    - Skaffa miniwhiteboards, whiteboardpennor, sudd, blädderblock och mapp.
    - Bestäm de fasta paren, läsarna i vecka 2 och 8 och gruppen som prövar leken.
    - Läs vecka 1 och skriv din text i förväg.

grund:
  text: "Det som har starkast stöd för elever i åk 4–9 som fastnar på långa ord är en enda väg genom ordet, som eleven tar både när hen läser och när hen stavar, i ord, meningar och text, och kursen bygger på den (Vaughn m.fl., 2022). Undervisning om ordens delar hjälper också de elever som behöver stöd i läsningen, och effekten är störst på stavningen och på de ord och delar som eleverna övar (Goodwin och Ahn, 2010; Bowers, Kirby och Deacon, 2010; Colenbrander m.fl., 2024; Galuschka m.fl., 2020). Herrström (2003) förordar att eleven delar ordet vid delarna och inte i stavelser, eftersom svenska ord stavas efter delarna också när de låter annorlunda. I en svensk sammansättning säger sista ordet vad det är (Lyster, 2019). Eleverna tar med sig delarna till skrivandet när de använder dem i egna texter (McCutchen m.fl., 2014), och därför har varje vecka två skrivpass. I skrivpassen visar läraren och tänker högt, texten har mål för början, mitten och slutet och för de långa orden, och paret byter roll efter varje mening (Fohlin och Wilson, 2027). Par med roller och tydliga anvisningar skriver bättre texter (Graham och Harris, 2016; Koster m.fl., 2015), medan fritt samarbete inte gav någon sådan effekt (Montanero m.fl., 2025). I en studie där elever i åk 4–5 tränade långa ord i 40 pass blev deras inställning till läsning sämre (Toste m.fl., 2019), och därför har kursen förlagor, en läsare och en tidning men ingen tidtagning."
  kallor: "Bygger på Vaughn m.fl. (2022), Goodwin och Ahn (2010), Bowers, Kirby och Deacon (2010), Colenbrander m.fl. (2024), Galuschka m.fl. (2020), Herrström (2003), Lyster (2019), McCutchen m.fl. (2014), Graham och Harris (2016), Koster m.fl. (2015), Montanero m.fl. (2025), Toste m.fl. (2019), Fohlin och Wilson, Skriv! (utkommer 2027), och Institutet för språk och folkminnen (2024 och 2025)."

exempel:
  rubrik: "Exempel: så går ett skrivpass till"
  valt:
    rubrik: Gruppen
    text: "Amir, Ella, Noah, Saga och Leo går i åk 4 och är med i kursen. Det är vecka 1 och pass 2, det första skrivpasset. I ordpasset läste gruppen förlagan Tre uppfinningar som världen behöver och byggde ord av två ord, och varje par bestämde vad deras uppfinning skulle vara. Amir och Leo är ett par, och Ella, Noah och Saga är en trio."
  text:
    - "I Ordstarten tar alla stegen på matlåda och glasögon på sin miniwhiteboard. Läraren visar matlåda på stora tavlan, och Saga säger ”En låda för mat.”"
    - "Gruppen läser förlagan i kör och drar ramarna i Sängroboten. Läraren frågar ”Var slutar början?”, och Ella svarar att början är namnet och att mitten är det som är jobbigt. Gruppen kallar ramarna Namnet, Det jobbiga och Vad den gör. Läraren säger att uppfinningarna ska stå i tidningens första avdelning, och paren skriver uppfinningen och ramarnas namn på skrivplanen."
    - "Läraren skriver sin plan på blädderblocket, med säng | cykel bland de långa orden, och sedan rubriken Sängcykeln. ”Vad måste vi börja med?” frågar hen. Amir säger ”Det jobbiga”, och läraren skriver ”Det är svårt att gå upp när det är kallt på morgonen.” Sedan visar läraren Kloka pennan. Hen säger nästa mening, ”Därför har vi uppfunnit sängcykeln”, och Leo säger den igen och skriver den på blädderblocket."
    - "Amir och Leo har hittat på en cykel som flyger. De säger delarna och skriver flyg | cykel på skrivplanen. När de berättar för trion frågar Saga ”Var landar den?”, och Leo skriver frågan på skrivplanen. Sedan skriver de med Kloka pennan. Amir är meningsbyggare och säger ”Det tar lång tid att åka till skolan.” Leo är sekreterare, säger meningen igen och skriver den, och sedan läser de meningen tillsammans och byter roll. Läraren sitter med trion. De skriver om en hundrobot som går ut med hunden. Noah är sekreterare och fastnar på ryggsäck. Läraren säger ”Säg delarna.” Noah säger ”Rygg och säck”, skriver en del i taget och drar en prickad linje under ordet för säkerhets skull."
    - "I Läsa upp läser Amir och Leo det de har skrivit: ”Flygcykeln. Det tar lång tid att åka till skolan. Därför har vi uppfunnit en flygcykel.” Ella frågar hur cykeln kommer upp i luften."
    - "Efter passet skriver läraren i protokollet att Amir skrev flygcykel ihop, och att Noah sa delarna i ryggsäck, skrev ordet rätt och drog en prickad linje under. Trion tar ordet med stegen i pass 3."

ramar:
  rubrik: Kursens material
  text:
    - "Först kommer veckorna, en i taget. Varje vecka börjar med veckans sida, med ordpasset, uppgiften, din text och skrivpassen, och direkt efter den står veckans förlaga och veckans ordkort. Sedan kommer det som gäller hela kursen: hur du gör i ordning ordkorten, listan till planschen Delarna, kortet Ett långt ord, kortet Vi skriver i par, skrivplanen, tidningens sida, kartläggningen, protokollet och diplomet. Skrivplanen och tidningens sida skriver du ut på nytt varje vecka."
    - "Förlagorna, ordkorten, kortet Ett långt ord, kortet Vi skriver i par, skrivplanen och tidningens sida är gjorda för eleven."
  ramar:
    # ---------------------------------------------------------------- Veckorna
    - rubrik: "Till läraren: veckorna"
      lektioner: true
      text:
        - "Varje vecka har en egen sida, veckans sida. Överst står veckans fokus och förlagan, sedan ordpasset under Pass 1, uppgiften, din plan och din text, och skrivpassen under Pass 2 och 3. Sist står veckans vanliga fel under Lyssna efter. Direkt efter veckans sida kommer veckans förlaga och veckans ordkort. Hur du gör i ordning korten står under Ordkorten, efter veckorna."
      delar:
        - rubrik: "Vecka 1 · Två ord blir ett"
          falt:
            - rubrik: Fokus
              text: "Eleven läser och stavar ord som är byggda av två ord och säger vad de betyder, bakifrån."
            - rubrik: Förlagan
              text: "Tre uppfinningar som världen behöver, en tidningsartikel. Veckans ord i texten: sängrobot, regnhatt, cykelhiss, cykelhjälm, ryggsäck, matlåda, glasögon, tandrobot och matrobot. Före läsningen visar du bilder av en cykelhiss och en regnhatt."
            - rubrik: Pass 1, ordpasset
              text: "Börja med fem minuter om kursen: presentera den som Ordverkstaden, en verkstad där gruppen gör en tidning, och ge varje elev kortet Ett långt ord. Bygga tar därför 15 minuter.\nOrdstarten: planschen, de fyra första raderna i listan Ändelser som böjer ordet. Du visar brandbilen med stegen och tänker högt, och sedan tar alla bilbranden med stegen.\nBygga: visa och säg ”Sängrobot. Var är delarna? Säng och robot. Jag drar ett streck mellan dem och en båge under varje del. Säng, robot, sängrobot. Jag börjar bakifrån: en robot som bäddar sängen.” Byt plats på korten och fråga ”Vad är en robotsäng?”\nNya ord: sandlåda, lastbil, polisbil, tandkräm, snöskyffel och tvättmaskin.\nDiktamen: cykelhjälm, ryggsäck, tandborste, snöbollarna och snögubbe. Skriv sedan ”cykel hjälm” isär och fråga ”Är det ett ord eller två? Säg det högt.” Säg att det inte blir någon paus mellan delarna i ett sammansatt ord."
            - rubrik: Uppgiften
              text: "Paret hittar på en egen uppfinning och skriver om den till tidningen. Början: uppfinningens namn som rubrik, ett ord byggt av två ord. Mitten: det som är jobbigt. Slutet: vad uppfinningen gör och hur man använder den. Texten har minst tre ord som är byggda av två ord. Paret ritar uppfinningen i rutan."
            - rubrik: Din plan
              text: "Början: Sängcykeln. Mitten: kallt och svårt att gå upp. Slutet: trampa under täcket, ringklocka och matlåda. Långa ord i delar: säng | cykel, ring | klocka, mat | låda."
            - rubrik: Din text
              text: "Sängcykeln\nDet är svårt att gå upp när det är kallt på morgonen. Därför har vi uppfunnit sängcykeln. Du ligger kvar under täcket och trampar till skolan. Sängcykeln har en ringklocka, en lampa och en matlåda bak. Den är lika snabb som en vanlig cykel, men mycket mysigare."
            - rubrik: Pass 2 och 3, skrivpassen
              text: "Ordstarten: matlåda och glasögon i pass 2, cykelhjälmarna och snöbollarna i pass 3.\nFörlagan: dra ramarna i en uppfinning, som Sängroboten.\nDin text: visa Kloka pennan. Du är meningsbyggare och säger en mening, och en elev är sekreterare, säger den igen och skriver den på blädderblocket.\nLäsa upp i pass 3: gruppen ger tidningen ett namn."
            - rubrik: Lyssna efter
              text: "Eleven som läser cykel och gissar resten.\nEleven som säger att en sängrobot är en säng.\nEleven som tappar ändelsen och läser snöbollarna som snöboll.\nEleven som skriver ”cykel hjälm” isär, eller ”handuk” och ”ryksäck” efter hur det låter.\nEleven som säger att glasögon är ögon av glas. Säg att delarna ibland inte räcker."
        - rubrik: "Vecka 2 · Fogen"
          falt:
            - rubrik: Fokus
              text: "Eleven läser och stavar sammansatta ord där något händer i skarven, som fogen s, en vokal som faller bort eller byts och tre lika bokstäver som blir två, och ord med tre delar."
            - rubrik: Förlagan
              text: "Välkommen till Äventyrsbadet, en guide med skyltar. Veckans ord i texten: äventyrsbad, fotbollsplan, omklädningsrum, dricksvatten, gatlykta, ficklampa, skolbuss, gatukök, veckodag, glasstrut och nattåg. Före läsningen visar du bilder av ett äventyrsbad, ett gatukök och ett nattåg."
            - rubrik: Pass 1, ordpasset
              text: "Ordstarten: på planschen läser gruppen s, o och u mellan delarna och a som faller bort. Du visar orden cykelhiss och glasögonen.\nBygga: visa och säg ”Fotbollsplan. Fot, boll och plan, och mellan boll och plan står ett s. Fotboll är redan två ord, och när ett sådant ord står först kommer nästan alltid ett s. S:et hör till delen före. Fot, bolls, plan.” Visa sedan skolgård och säg ”Skola och gård. Här faller a:et bort. Skol, gård.” Läs äventyr i stavelser, ä, ven, tyr. När paren har gjort fråga 2 säger du ”Äventyr är ett ord, och ändå kommer ett s. Sådana ord lär vi oss ett i taget.”\nNya ord: pojkvän, flickskola, varuhus, fotbollsmatch, skolbänk och veckotidning.\nDiktamen: fotbollsplan, skolgården, veckodag, glasstrut och snöbollskrig. Skriv sedan ”fotbollplan” och fråga ”Är fotboll två ord?” Lägg korten glass och strut ihop och säg ”Tre s i rad. Då skriver vi bara två, glasstrut, och strecket står mellan glass och strut.”"
            - rubrik: Uppgiften
              text: "Paret skriver en guide till sin drömskolgård för en yngre klass och ritar en karta på ett tomt papper. Början: en mening som välkomnar läsaren. Mitten: tre skyltar med en eller två meningar var. Slutet: en mening som säger hej då. Texten har minst tre långa ord, och minst ett med fogen s. Skyltarna är långa ord."
            - rubrik: Din plan
              text: "Början: välkommen. Mitten: tre skyltar, fotbollsplanen, gungbrädan och pulkabacken. Slutet: ha en rolig rast. Långa ord i delar: fot | bolls | plan, gung | bräda, pulka | backe."
            - rubrik: Din text
              text: "Välkommen till drömskolgården! Följ skyltarna, så hittar du rätt.\nFotbollsplanen: Här spelar alla på rasterna. Bollarna ligger i en låda vid målet.\nGungbrädan: Sätt er på var sin sida och gunga upp och ner.\nPulkabacken: På vintern åker du pulka här, ända ner till staketet.\nHa en rolig rast!"
            - rubrik: Pass 2 och 3, skrivpassen
              text: "Ordstarten: fotbollsplanen och gatuköket i pass 2, nattåget och omklädningsrummet i pass 3.\nFörlagan: dra ramarna runt det första stycket, skyltarna och det sista stycket.\nSkriva i pass 3: paret ritar kartan i stället för bilden i rutan, med skyltarna på kartan. Efter pass 3 läser paren guiden för den yngre klassen och lämnar en kopia av kartan."
            - rubrik: Lyssna efter
              text: "Eleven som tappar s:et, som ”fotbollplan”.\nEleven som låter a:et stå kvar, som i ”skolagård”.\nEleven som skriver tre s i glasstrut.\nEleven som delar omklädningsrum på fel ställe, som omk och läd.\nEleven som sätter s där det inte ska vara, som ”skolsgård”."
        - rubrik: "Vecka 3 · Ihop eller isär"
          falt:
            - rubrik: Fokus
              text: "Eleven skriver sammansatta ord ihop och hör att ord som står isär betyder något annat, som en grönsak och en grön sak. Eleven skriver också jätte- och super- ihop med ordet."
            - rubrik: Förlagan
              text: "Två reklamer, tre fel: en reklam för en snöbollsmaskin och en slarvig reklam där tre ord har gått isär. Veckans ord i texten: supersnabb, superstark, jättestor, jätterolig, jättebra, jättegod, ostmacka, surstång och skumtomte. Före läsningen visar du bilder av en surstång och en skumtomte."
            - rubrik: Pass 1, ordpasset
              text: "Ordstarten: planschen jätte- och super-. Orden äventyrsbadet och veckodagar.\nBygga: lägg korten grön och sak isär och säg ”En grön sak. Det kan vara en boll eller en tröja.” Skjut ihop korten och säg ”Grönsak. Nu är det ett ord, och det blir ingen paus mellan delarna. En grönsak är en morot eller en gurka.” Sätt två framför båda: två grönsaker, men två gröna saker. Ta sedan grönsak med stegen på stora tavlan. Sedan gör paren fråga 2 och rättar den slarviga reklamen med korten.\nNya ord: jätteglad, jättelång, rökfri, blåbär, långfilm och storstad.\nDiktamen: jättebra, supersnabb, grönsakerna, ostmacka och strösocker. Skriv sedan ”jätte bra” och ”super snabb” isär och fråga ”Hur många ord är det? Säg det högt.” Säg att jätte- och super- alltid står ihop med ordet."
            - rubrik: Uppgiften
              text: "Paret skriver en reklam för sin uppfinning från vecka 1. Början: en rubrik och en fråga som får läsaren att stanna. Mitten: varför uppfinningen är jättebra. Slutet: det som säger åt läsaren att köpa. Texten har minst tre långa ord, och minst ett med jätte- eller super-."
            - rubrik: Din plan
              text: "Början: rubriken Köp en sängcykel! och en fråga om kalla morgnar. Mitten: supermjuk och jättesnabb. Slutet: köp i dag, kudde på köpet. Långa ord i delar: super | mjuk, jätte | snabb, säng | cykel."
            - rubrik: Din text
              text: "Köp en sängcykel!\nÄr du trött på kalla morgnar? Då är sängcykeln något för dig. Den är supermjuk och jättesnabb. Du kommer till skolan utan att lämna sängen. Köp din sängcykel i dag! Den kostar bara hundra kronor, och du får en kudde på köpet."
            - rubrik: Pass 2 och 3, skrivpassen
              text: "Ordstarten: jättestor och snöbollsmaskinen i pass 2, grönsaker och sjuksköterska i pass 3.\nFörlagan: dra ramarna i den första reklamen. Det sista stycket säger åt läsaren att köpa."
            - rubrik: Lyssna efter
              text: "Eleven som skriver ”jätte bra” isär.\nEleven som läser grönsakerna som grönsak.\nEleven som inte hör skillnad på grön sak och grönsak. Låt eleven säga båda högt."
        - rubrik: "Vecka 4 · Ord som slutar på -⁠are"
          falt:
            - rubrik: Fokus
              text: "Eleven läser och stavar ord på -⁠are, som betyder en person eller en sak som gör något, och ser att ett a faller bort, som i läsa och läsare."
            - rubrik: Förlagan
              text: "Lediga jobb i Fantasistaden, tre platsannonser för påhittade yrken. Veckans ord i texten: läsare, bagare, målare, dykare, lärare, fotbollsspelare, glassprovare, molnräknare och sakletare. Före läsningen visar du bilder av en dykare och en bagare."
            - rubrik: Pass 1, ordpasset
              text: "Ordstarten: planschen -⁠are. Orden jättegod och supersnabb.\nBygga: visa och säg ”Molnräknare. Jag ringar in ändelsen, are. Kvar är moln och räkn, av räkna, och a:et har fallit bort. Jag drar en båge under moln, räkn och are. Molnräknare. Bakifrån: en som räknar moln.”\nNya ord: dansare, sångare, hoppare, byggare, gräsklippare och skidåkare.\nDiktamen: spelarna, simmare, dammsugare, fotbollsspelare och bilförare. Skriv sedan ”simare” och säg ”Simma har två m, och de står kvar. Simmare.” Skriv ”fotbollspelare” och säg ”S:et står kvar fast nästa del börjar på s.” Fråga om en dammsugare är en person eller en sak."
            - rubrik: Uppgiften
              text: "Paret skriver en platsannons för ett påhittat yrke, gärna ett jobb med parets uppfinning från vecka 1. Början: yrket och sökes som rubrik. Mitten: vad man gör och vad man ska kunna. Slutet: hur man söker. Texten har minst tre ord på -⁠are."
            - rubrik: Din plan
              text: "Början: Sängcykelförare sökes. Mitten: cykla och berätta, pigg och duktig. Slutet: skriv om din bästa morgon. Långa ord i delar: för | are, berätt | are, upp | finn | are."
            - rubrik: Din text
              text: "Sängcykelförare sökes\nVi behöver en förare som provar vår nya sängcykel. Som förare cyklar du till skolan varje morgon och berättar vad som är bra och dåligt. Du ska vara pigg, tycka om att cykla och vara en duktig berättare. Du får en hjälm av vår uppfinnare. Så söker du: skriv en mening om din bästa morgon."
            - rubrik: Pass 2 och 3, skrivpassen
              text: "Ordstarten: molnräknare och läsaren i pass 2, fotbollsspelare och dammsugaren i pass 3.\nFörlagan: dra ramarna i en annons, som Molnräknare sökes.\nEfter veckan: läs parens texter från vecka 1 och 4, ta felstavade ord till Ordstarten och bestäm vem som behöver en sekreterare från vecka 5."
            - rubrik: Lyssna efter
              text: "Eleven som tappar ett m, som ”simare”.\nEleven som skriver ”fotbollspelare” med ett s.\nEleven som säger att en dammsugare är en person.\nEleven som delar spelarna i spel och arna. Visa att ordet är spelare och -⁠na, och att e:t i spelare faller bort.\nEleven som tror att snabbare är en person. Säg att snabbare används när man jämför, som mysigare."
        - rubrik: "Vecka 5 · Förstavelser"
          falt:
            - rubrik: Fokus
              text: "Eleven läser och stavar ord med förstavelserna o-, miss-, åter- och sam- och säger vad förstavelsen gör i just det ordet. Ost och orm börjar på o men har ingen förstavelse."
            - rubrik: Förlagan
              text: "Otursdagen, en rolig berättelse i jagform. Veckans ord i texten: otur, oväder, okänd, osäker, ojämn, missnöjd, misslyckas, samarbeta, samarbete, samtal och återvända. Före läsningen visar du en bild av ett oväder."
            - rubrik: Pass 1, ordpasset
              text: "Ordstarten: planschen o-, miss-, åter- och sam-, och -⁠ade och -⁠de. Orden dykare och glasstrut.\nBygga: visa och säg ”Missnöjd. Finns det en förstavelse? Miss. Jag ringar in den. Kvar är nöjd. Här betyder miss inte, så den som är missnöjd är inte nöjd.” Skriv sedan oväder på stora tavlan och säg att o betyder dåligt i oväder. Visa orm och säg ”Jag tar bort o. Blir rm ett ord? Nej. Orm har ingen förstavelse.” Säg att åter betyder tillbaka eller igen, som i återvända. Paren bygger ord och lägger dem i två högar, ord med förstavelse och ord utan, och gör fråga 2.\nNya ord: olycka, ovänlig, oklar, misstag, återbruk och samåka.\nDiktamen: otur, osäker, misslyckades, samarbete och okokt. Skriv sedan ”mislyckas” och säg ”Miss har två s, och de står kvar när lyckas kommer efter. Misslyckas.”"
            - rubrik: Uppgiften
              text: "Från den här veckan gör varje elev sin egen plan och skriver sin egen text. Kamraten lyssnar när eleven berättar och är kontrollant när texten är klar. Eleven skriver en rolig berättelse i jagform om en otursdag, som kan vara påhittad. Början: den första oturen. Mitten: oturen blir större. Slutet: det vänder. Texten har minst tre långa ord, och minst två med förstavelse."
            - rubrik: Din plan
              text: "Början: sängcykeln går sönder. Mitten: regn, osäker på vägen, blöt och missnöjd. Slutet: kompisen och samarbetet. Långa ord i delar: o | tur, o | säker, miss | nöjd, sam | arbet | ade."
            - rubrik: Din text
              text: "I går hade jag otur hela dagen. Först gick sängcykeln sönder, och jag fick springa till skolan. Sedan började det regna, och jag var osäker på vägen. Jag kom fram blöt och missnöjd. Men min kompis väntade med en handduk. På rasten samarbetade vi och lagade sängcykeln. Otur kan bli tur!"
            - rubrik: Pass 2 och 3, skrivpassen
              text: "Ordstarten: otur och missnöjd i pass 2, samarbetet och återvände i pass 3.\nFörlagan: dra ramarna för början, mitten och slutet i hela berättelsen.\nDin text: i pass 2 säger du varje mening högt innan du skriver den, som eleverna ska göra nu när var och en skriver sin egen text. I pass 3 är en elev kontrollant för din text, läser den högt och pekar på de långa orden, och du tar ett ord med stegen."
            - rubrik: Lyssna efter
              text: "Eleven som skriver ”mislyckas” med ett s.\nEleven som läser misslyckades som misslyckas.\nEleven som säger att o i ost är en förstavelse.\nEleven som säger att en ovän är en vän."
        - rubrik: "Vecka 6 · Ändelser som beskriver"
          falt:
            - rubrik: Fokus
              text: "Eleven läser och stavar ord med -⁠ig, -⁠lig, -⁠lös och -⁠bar och säger vad ändelsen betyder, som ”utan” i tandlös och ”går att” i ätbar."
            - rubrik: Förlagan
              text: "Molnkatten, en lexikonartikel om ett påhittat djur. Veckans ord i texten: dimmig, lurvig, farlig, ofarlig, osynlig, vänlig, färglös, ljudlös, tandlös, tvättbar och ätbar. Före läsningen visar du bilder av dimmiga berg och av mossa."
            - rubrik: Pass 1, ordpasset
              text: "Ordstarten: planschen -⁠ig, -⁠lig, -⁠lös och -⁠bar, och -⁠a och -⁠t. Orden oturen och misslyckades.\nBygga: visa och säg ”Färglös. Jag ringar in ändelsen, lös. Kvar är färg. Lös betyder utan, så färglös är utan färg.” Visa sedan dimmig och säg ”Dimma och ig. A:et faller bort. Dimmig.” Ta fram korten med o- från vecka 5 till fråga 2. Paren bygger ord med -⁠lös och -⁠bar och säger vad de betyder: tandlös är utan tänder, och det som är ätbart går att äta.\nNya ord: modig, sandig, kunglig, smaklös, läsbar och användbar.\nDiktamen: farlig, ljudlös, tvättbara, slemmig och taggig. Skriv sedan ”slemig” och säg ”Slem får två m före ig. Slemmig.”"
            - rubrik: Uppgiften
              text: "Eleven hittar på ett fantasidjur och skriver en lexikonartikel om det. Början: djurets namn och vad det är för djur. Mitten: rubrikerna ”Utseende och ljud” och ”Mat”. Slutet: rubriken ”Är den farlig?” och svaret. Texten har minst tre ord med -⁠ig, -⁠lig, -⁠lös eller -⁠bar. Eleven ritar djuret."
            - rubrik: Din plan
              text: "Början: Kuddräven bor i soffor. Mitten: utseende och ljud, mat. Slutet: ofarlig och vänlig. Långa ord i delar: prick | ig, ljud | lös, ät | bar | a, o | far | lig."
            - rubrik: Din text
              text: "Kuddräven\nKuddräven är ett litet djur som bor i soffor.\nUtseende och ljud: Pälsen är mjuk och prickig. Kuddräven är nästan ljudlös, men den snarkar när den sover.\nMat: Den äter smulor och tappade popcorn. Strumpor är inte ätbara, men den tuggar gärna på dem.\nÄr den farlig? Nej, kuddräven är ofarlig och vänlig."
            - rubrik: Pass 2 och 3, skrivpassen
              text: "Ordstarten: färglös och osynlig i pass 2, ofarliga och ätbara i pass 3.\nFörlagan: inledningen hör till början, och de två första rubrikerna är mitten."
            - rubrik: Lyssna efter
              text: "Eleven som skriver ”slemig” med ett m.\nEleven som skriver ”faralig”.\nEleven som läser tvättbara som tvättbar.\nEleven som tror att -⁠lös betyder mycket."
        - rubrik: "Vecka 7 · Ord på -⁠ning, -⁠het, -⁠else och -⁠skap"
          falt:
            - rubrik: Fokus
              text: "Eleven läser och stavar ord med -⁠ning, -⁠ing, -⁠het, -⁠else och -⁠skap, och ser att ord på -⁠ning, -⁠ing, -⁠het och -⁠skap får fogen s när de står först i ett sammansatt ord."
            - rubrik: Förlagan
              text: "Så går kråkhoppning till, en instruktion. Veckans ord i texten: kråkhoppning, tävling, samling, övning, landning, rörelse, säkerhet, vänskap, tävlingsregel och säkerhetsregel. Före läsningen visar du bilder av en kråka och ett barn som hoppar längdhopp."
            - rubrik: Pass 1, ordpasset
              text: "Ordstarten: planschen -⁠ning och -⁠ing, -⁠het och -⁠skap, och -⁠else. Orden ljudlöst och tvättbar.\nBygga: visa och säg ”Landning. Jag ringar in ändelsen, ning. Kvar är land, av landa. Landning är när man landar.” Visa sedan landningsbana och säg ”Landning och bana. Efter ning kommer ett s före nästa del. Landningsbana.” Säg att -⁠else inte får något s, som i födelsedag. Bygger paren tävlning eller öving, låt dem pröva båda ändelserna och säga ordet högt. Det som låter som ett ord de har hört är rätt.\nNya ord: läsning, målning, nyhet, frihet, händelse och kamratskap.\nDiktamen: tävlingen, säkerhet, rörelse, tävlingsregel och upplevelse. Skriv sedan ”tävlingregel” och fråga ”Står ing före en annan del?” Säg att det efter ning, ing, het och skap kommer ett s före nästa del."
            - rubrik: Uppgiften
              text: "Eleven skriver en instruktion till en lek, gärna på drömskolgården, och en annan grupp prövar en av gruppens lekar på en rast. Början: lekens namn och vad leken är. Mitten: rubrikerna ”Det här behöver ni” och ”Så går det till”, med orden först, sedan och därefter. Slutet: rubriken ”Säkerhet”. Texten har minst tre långa ord, och minst två med -⁠ning, -⁠ing, -⁠het, -⁠else eller -⁠skap."
            - rubrik: Din plan
              text: "Början: Däckhoppning, en lek på skolgården. Mitten: det här behöver ni, så går det till. Slutet: säkerhet och vänskap. Långa ord i delar: däck | hopp | ning, land | ning | en, vän | skap."
            - rubrik: Din text
              text: "Däckhoppning\nDäckhoppning är en lek på skolgården för fyra eller fler.\nDet här behöver ni: Fem gamla bildäck.\nSå går det till: Först lägger ni däcken i en rad. Sedan hoppar alla från däck till däck utan att nudda marken. Därefter räknar ni hoppen. Den som klarar flest hopp vinner.\nSäkerhet: Hoppa bara när det är torrt, och ta det lugnt vid landningen. Vänskap är viktigare än att vinna."
            - rubrik: Pass 2 och 3, skrivpassen
              text: "Ordstarten: kråkhoppning och rörelsen i pass 2, säkerhetsregler och vänskapen i pass 3.\nFörlagan: inledningen hör till början, och rubrikerna ”Det här behöver ni” och ”Så går det till” är mitten.\nGruppen väljer en av lekarna, som en annan grupp prövar på en rast i vecka 8. I Ordstarten efteråt får ni höra hur det gick."
            - rubrik: Lyssna efter
              text: "Eleven som tappar s:et, som ”tävlingregel”.\nEleven som läser säkerhetsregler som säkerhetsregel.\nEleven som läser landning utan att känna igen landa."
        - rubrik: "Vecka 8 · Nyord"
          falt:
            - rubrik: Fokus
              text: "Eleven förklarar nya ord ur delarna och bygger egna, och märker när delarna inte räcker, som i hjärnröta, och när ett ord inte har några delar, som skibidi. Gruppen sätter ihop tidningen och läser den för en inbjuden läsare."
            - rubrik: Förlagan
              text: "Årets nya ord, en artikel om fem ord ur Isofs nyordslistor 2024 och 2025. Veckans ord i texten: vänskapsbänk, avokadoskanner, balkongkraftverk, hjärnröta, nyord och nyordslista, och skibidi, som inte har några delar. Före läsningen visar du bilder av en vänskapsbänk och ett balkongkraftverk."
            - rubrik: Pass 1, ordpasset
              text: "Ordstarten: planschen, de delar eleverna väljer. Orden övningen och säkerheten.\nBygga: visa och säg ”Vänskapsbänk. Vänskap och bänk, och ett s mellan dem. Bakifrån: en bänk för den som vill prata med någon.” Visa sedan hjärnröta och säg ”Hjärna och röta. Men hjärnan ruttnar inte på riktigt. Här räcker inte delarna, och då frågar vi någon eller slår upp ordet.” Varje elev bygger ett eget nytt ord med korten, och de andra gissar vad det betyder, bakifrån.\nNya ord: osäkerhet, läsbarhet, omöjlighet, oläsbar, vänskapsband och säkerhetsbälte.\nDiktamen: vänskapsbänk, nyordslistan, avokadoskanner, säkerhetsregler och olycklig. Skriv sedan ”vänskapbänk” och fråga ”Står skap före en annan del?”"
            - rubrik: Uppgiften
              text: "I pass 2 hittar eleven på ett nytt ord av två ord som redan finns och skriver en artikel om det. Början: vad ordet betyder. Mitten: vad ordet är byggt av, och vad det är bakifrån. Slutet: en mening med ordet. Texten har minst tre långa ord, och ett av dem är det nya ordet."
            - rubrik: Din plan
              text: "Början: vad rastregn betyder. Mitten: rast och regn, och bakifrån ett regn. Slutet: en mening med ordet. Långa ord i delar: rast | regn, skol | gård | en, fot | bolls | match | en."
            - rubrik: Din text
              text: "Rastregn\nMitt nya ord är rastregn. Det är ett regn som kommer på rasten, ofta precis när hela klassen har gått ut på skolgården. Ordet är byggt av rast och regn, och bakifrån är det ett regn. Exempel: Det blev rastregn igen, så fotbollsmatchen fick vänta."
            - rubrik: Pass 2 och 3, skrivpassen
              text: "Ordstarten: vänskapsbänken och balkongkraftverket i pass 2.\nFörlagan: dra ramarna i ett av styckena, som det om vänskapsbänk. Slutet, en mening där ordet används, visar du med din text.\nTexten är kort, och eleven skriver den klart i pass 2. Kamraten är kontrollant sist i Skriva, och i Läsa upp läser varje elev hela sin text.\nPass 3 är tidningens pass, och alla texter kommer med. Ordstarten, 5 minuter: fotbollsplanen och molnräknare. Tidningen, 35 minuter: ni skriver en innehållsförteckning med en rad för varje avdelning, och två elever gör omslaget medan de andra skriver avdelningarnas namn, ett namn på varje sida. Läsa upp, 20 minuter: varje elev läser en av sina texter för den inbjudna läsaren, och du delar ut diplomen sist. Innan du kopierar tidningen skriver du rätt stavning med blyerts ovanför de övade ord som fortfarande är fel. Kopiera två sidor på varje ark, och dela ut häftet när du har gjort kartläggningen efter kursen."
            - rubrik: Lyssna efter
              text: "Eleven som inte börjar bakifrån och säger att en vänskapsbänk är en vän.\nEleven som läser säkerhetsregler som säkerhetsregel.\nEleven som inte märker att delarna inte räcker i hjärnröta."
    - rubrik: "Förlaga, vecka 1: Tre uppfinningar som världen behöver"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Om texten", text: "Veckans ord i texten står på veckans sida. Uppfinningarnas namn är påhittade." }
      listor:
        - rubrik: "Tre uppfinningar som världen behöver"
          rader:
            - ["Varje dag är det något som är jobbigt. Här är tre nya saker som kan hjälpa dig."]
            - ["**Sängroboten**"]
            - ["Ingen orkar bädda sängen på morgonen. Sängroboten gör det åt dig. Den drar upp täcket och slätar ut lakanet. Du hinner packa matlådan och ryggsäcken medan den jobbar."]
            - ["**Regnhatten**"]
            - ["Det regnar, och du har ingen jacka. Då är regnhatten bäst. Den har ett stort tak av plast. Regnet rinner av, och du blir inte blöt. Den passar till och med över en cykelhjälm. Inte ens glasögonen blir blöta."]
            - ["**Cykelhissen**"]
            - ["Backen är lång, och benen är trötta. Cykelhissen står längst ner. Du rullar in och trycker på en knapp. Hissen lyfter dig, cykeln och ryggsäcken till toppen."]
            - ["Vad behöver du själv? En tandrobot? En matrobot som lagar mat? Hitta på något och skriv till oss."]
        - rubrik: Frågorna
          rader:
            - ["1. Stryk under fem ord som är byggda av två ord."]
            - ["2. Dela ordet regnhatt med ett streck och byt plats på delarna. Vad är ett hattregn?"]
            - ["3. Börja bakifrån: vad är en cykelhiss? Hur vet du det?"]
            - ["4. Vem är artikeln skriven för? Vilka ord visar det?"]
    - rubrik: "Förlaga, vecka 2: Välkommen till Äventyrsbadet"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Om texten", text: "Veckans ord i texten står på veckans sida." }
      listor:
        - rubrik: "Välkommen till Äventyrsbadet"
          rader:
            - ["Här på Äventyrsbadet finns mer än du hinner pröva på en enda dag. Badet är större än en fotbollsplan, och det är lätt att gå vilse. Läs guiden och följ skyltarna, så hittar du rätt."]
            - ["**Omklädningsrummet**"]
            - ["Här byter du om och duschar innan du går ut i solen. Handduk och solglasögon tar du med dig, men skorna lämnar du här."]
            - ["**Rutschkanan**"]
            - ["Den är lång som ett nattåg och snabb som en sportbil. Du startar högst upp i ett torn och landar med ett plask."]
            - ["**Gatuköket**"]
            - ["Här köper du mat, och över disken hänger en gammal gatlykta. Det finns också glasstrutar, dricksvatten och en bänk att vila på."]
            - ["Äventyrsbadet är öppet alla veckodagar. Skolbussen stannar vid dörren. Har du tappat din ficklampa? Fråga i kassan, så hjälper vi dig. Välkommen tillbaka!"]
        - rubrik: Frågorna
          rader:
            - ["1. Stryk under fyra ord med ett s mellan delarna. Gör en ring runt två ord där en bokstav har fallit bort."]
            - ["2. Dela ordet äventyrsbad med ett streck. Vilken del hör fogen s till? Är äventyr ett ord eller två?"]
            - ["3. Börja bakifrån: vad är ett nattåg? Hur vet du det?"]
            - ["4. Vem är guiden skriven för? Hur hjälper skyltarna den som läser?"]
    - rubrik: "Förlaga, vecka 3: Två reklamer, tre fel"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Om texten", text: "Orden som står ihop och isär, som skumtomte och skum tomte, kommer ur Isofs övningar Sätta ihop ord (2025). Ostmacka, surstång och skumtomte står isär i den slarviga reklamen, och veckans andra ord i texten står på veckans sida." }
      listor:
        - rubrik: "Två reklamer, tre fel"
          rader:
            - ["Här är två reklamer. Läs dem och se om du vill köpa något."]
            - ["**Snöbollsmaskinen**"]
            - ["Är du trött på kalla händer? Då är det här något för dig. Snöbollsmaskinen är supersnabb och superstark. Den gör hundra snöbollar på en minut. Du behöver bara trycka på en knapp."]
            - ["Bygg en jättestor snögubbe på tio minuter. Det blir jätteroligt, och du blir inte kall om händerna."]
            - ["Köp din snöbollsmaskin i dag! Det är ett jättebra pris för en jättestor maskin. Du får en mössa på köpet. Skynda dig, innan snön smälter!"]
            - ["**Den slarviga reklamen**"]
            - ["Hungrig? Kom till kiosken vid torget! Här är det alltid kö."]
            - ["Vi har en ost macka för tjugo kronor. Köp också en sur stång eller en skum tomte. Vi har även varm choklad."]
            - ["Allt är jättegott. Barn får en glasstrut för tio kronor. Kom i dag, så ses vi!"]
        - rubrik: Frågorna
          rader:
            - ["1. Stryk under fyra ord som börjar med jätte eller super."]
            - ["2. Läs den slarviga reklamen. Hitta de tre ord som har gått isär, och skjut ihop dem med ordkorten."]
            - ["3. Börja bakifrån: vad är en skum tomte, och vad är en skumtomte? Hur vet du det?"]
            - ["4. Vem är reklamerna skrivna för? Vilka meningar säger åt dig att köpa?"]
    - rubrik: "Förlaga, vecka 4: Lediga jobb i Fantasistaden"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Om texten", text: "Ordet sakletare kommer från Pippi Långstrump, och de andra yrkena är påhittade." }
      listor:
        - rubrik: "Lediga jobb i Fantasistaden"
          rader:
            - ["Fantasistaden behöver hjälp. Här är tre lediga jobb. Du som är en bra läsare hittar säkert ett som passar dig."]
            - ["**Glassprovare sökes**"]
            - ["Som glassprovare provar du ny glass varje dag. Du ska kunna skilja på vanilj och choklad. Du jobbar i en kiosk vid fotbollsplanen, bredvid vår bagare. Så söker du: skicka en teckning av din bästa glass."]
            - ["**Molnräknare sökes**"]
            - ["Som molnräknare räknar du moln från ett högt tak. Du ska kunna räkna till tusen och vara supersnabb. Du jobbar ihop med vår målare, som målar molnen. Så söker du: skriv hur många moln du ser just nu."]
            - ["**Sakletare sökes**"]
            - ["Som sakletare letar du efter allt som någon har tappat. Fotbollsspelare, dykare och lärare tappar saker varje dag. Du ska vara envis och jättebra på att hitta. Så söker du: skriv en mening om något du har hittat."]
            - ["Alla jobb är lediga nu. Skynda dig och sök, innan någon annan tar dem!"]
        - rubrik: Frågorna
          rader:
            - ["1. Stryk under sju olika ord som slutar på are."]
            - ["2. Dela ordet sakletare med två streck. Vilket ord kommer let från, och vilken bokstav har fallit bort?"]
            - ["3. Börja bakifrån: vad är en glassprovare? Hur vet du det?"]
            - ["4. Vem är annonserna skrivna för? Vilken mening i varje annons säger hur man söker?"]
    - rubrik: "Förlaga, vecka 5: Otursdagen"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Om texten", text: "Veckans ord i texten står på veckans sida." }
      listor:
        - rubrik: "Otursdagen"
          rader:
            - ["Jag hade otur redan på morgonen. Tandborsten var borta, och jag misslyckades med frukosten. Mackan föll med osten nedåt."]
            - ["Skolbussen åkte utan mig. Jag vinkade, men den körde vidare. Jag tog cykelhjälmen och cyklade iväg."]
            - ["Sedan kom ett oväder. Jag svängde fel och hamnade på en okänd gata. Jag var blöt och osäker på vägen."]
            - ["Vägen var ojämn, och plötsligt gick luften ur däcket. En fågel såg på och verkade skratta. Jag var så missnöjd!"]
            - ["Då kom min lärare med ett stort paraply. ”Nu samarbetar vi”, sa hon."]
            - ["Hon höll paraplyet, och jag ledde cykeln. Vi hade ett fint samtal på vägen."]
            - ["Efter en stund återvände solen. Det blev ett bra samarbete! Otur kan bli tur, om man får hjälp."]
            - ["På kvällen hittade jag tandborsten i min sko."]
        - rubrik: Frågorna
          rader:
            - ["1. Stryk under åtta ord som har förstavelsen o, miss, åter eller sam."]
            - ["2. Dela orden otur och ost efter o. Vilket av dem har en förstavelse?"]
            - ["3. Börja bakifrån: vad betyder samarbete? Hur vet du det?"]
            - ["4. Berättelsen står i en tidning. Vem läser den, och vad i texten tycker de är roligt?"]
    - rubrik: "Förlaga, vecka 6: Molnkatten"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Om texten", text: "Molnkatten är påhittad. Veckans ord i texten står på veckans sida." }
      listor:
        - rubrik: "Molnkatten"
          rader:
            - ["Molnkatten är ett litet djur, lika stort som en kanin. Den bor på dimmiga berg. Där ligger molnen så lågt att man kan ta på dem."]
            - ["**Utseende och ljud**"]
            - ["Pälsen är lurvig och färglös. Därför är molnkatten nästan osynlig i dimman. Det enda man ser är två gula ögon."]
            - ["Molnkatten går ljudlöst på mjuka tassar. Man hör den bara när den spinner. Då låter det som ett litet åskmoln."]
            - ["**Mat**"]
            - ["Molnkatten äter bär och mossa. Mossan smakar ingenting, men molnkatten äter den ändå. Ibland hittar den en strumpa på marken. Strumpan är tvättbar men inte ätbar. Därför får strumpan ligga kvar."]
            - ["**Är den farlig?**"]
            - ["Nej, molnkatten är ofarlig och vänlig. Den är tandlös och kan inte bita. Den vill gärna bli klappad, men den är nästan osynlig. Därför är det nästan ingen som hittar den."]
        - rubrik: Frågorna
          rader:
            - ["1. Stryk under åtta ord som har ändelsen ig, lig, lös eller bar."]
            - ["2. Dela ordet ofarlig med två streck. Vilket ord kommer far från, och vilken bokstav har fallit bort?"]
            - ["3. Börja bakifrån: vad betyder tvättbar? Hur vet du det?"]
            - ["4. Vem slår upp ett djur i ett lexikon? Vilka frågor om molnkatten svarar artikeln på?"]
    - rubrik: "Förlaga, vecka 7: Så går kråkhoppning till"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Om texten", text: "Ordet kråkhoppning kommer från Pippi Långstrump i Söderhavet. Leken är påhittad för kursen." }
      listor:
        - rubrik: "Så går kråkhoppning till"
          rader:
            - ["Kråkhoppning är en tävling för hela gruppen. Man hoppar som en kråka, med båda fötterna ihop. Vinnaren är den som hoppar längst."]
            - ["**Det här behöver ni**"]
            - ["Ni behöver krita, en mjuk matta och ett måttband. Mattan ska vara så mjuk som en kudde."]
            - ["**Så går det till**"]
            - ["Först ritar ni en linje med krita. Sedan är det samling vid linjen. Alla gör en övning med tio små hopp. Därefter får alla hoppa tre gånger."]
            - ["Hoppet är en enda stor rörelse: böj knäna, svinga armarna och hoppa. Landningen ska vara stilla. Den första tävlingsregeln är att man inte får kliva över linjen. Sist mäter ni hoppen, och det längsta hoppet räknas."]
            - ["**Säkerhet**"]
            - ["Säkerhet är viktigast, och tävlingen har två säkerhetsregler. Hoppa aldrig på hal mark, för det är farligt. Landa på mattan, så är hoppet ofarligt. Heja på varandra, för vänskap betyder mer än att vinna."]
        - rubrik: Frågorna
          rader:
            - ["1. Stryk under åtta ord med ändelsen ning, ing, het, else eller skap."]
            - ["2. Dela ordet tävlingsregeln med streck. Vilken bokstav står i fogen?"]
            - ["3. Börja bakifrån: vad är en säkerhetsregel? Hur vet du det?"]
            - ["4. Vem ska följa en instruktion som den här? Vilka tre rubriker hjälper dem att hitta i texten?"]
    - rubrik: "Förlaga, vecka 8: Årets nya ord"
      text:
        - "Läs texten och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Om texten", text: "Orden står i Isofs nyordslistor 2024 och 2025, och förklaringarna är skrivna för kursen." }
      listor:
        - rubrik: "Årets nya ord"
          rader:
            - ["Ett nytt ord kallas ett nyord. Varje år samlar språkforskare nyord i en nyordslista. Här är fem från 2024 och 2025."]
            - ["Vänskapsbänk är en bänk för den som vill prata med någon. Den som sitter där visar att det går bra att komma fram. Ordet är byggt av vänskap och bänk, och bakifrån är det en bänk."]
            - ["Avokadoskanner är en apparat som visar om en avokado är mogen. Ordet är byggt av avokado och skanner, och bakifrån är det en skanner."]
            - ["Balkongkraftverk är små solpaneler som sitter på en balkong och ger el till hemmet. Ordet är byggt av balkong och kraftverk, och ett kraftverk gör el."]
            - ["Hjärnröta är när man har tittat på för många korta klipp. Då känner man sig trött och tom i huvudet. Ordet har två delar, hjärna och röta. Men hjärnan ruttnar inte på riktigt."]
            - ["Skibidi har inga delar, för ingen har byggt det av ord som redan finns. Det används om något konstigt, dåligt eller häftigt."]
            - ["Vad i din vardag saknar ett ord? Hitta på ett nytt ord av ord som redan finns. Skriv en förklaring, delarna och en mening med ordet."]
        - rubrik: Frågorna
          rader:
            - ["1. Stryk under de fem nya orden i artikeln. Vilket av dem har inga delar?"]
            - ["2. Dela ordet avokadoskanner med ett streck och byt plats på delarna. Vad är en skanneravokado?"]
            - ["3. Börja bakifrån: vad är ett balkongkraftverk? Hur vet du det?"]
            - ["4. Vem läser en artikel om nya ord? Vad ber artikeln läsaren göra sist?"]
    # ---------------------------------------------------------------- Ordkorten
    - rubrik: Ordkorten
      text:
        - Varje vecka har en sida med kort, som står efter veckans förlaga. I ordpasset bygger paren ord med korten, delar dem och flyttar delarna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: Skriv ut veckans kort en gång per par och en gång till dig, gärna på tjockt papper. Klipp isär korten och lägg varje sats i ett kuvert. Förstavelserna har ett streck efter sig och ändelserna ett streck före. Ett a i parentes, som i skol(a) och läs(a), faller bort när en annan del kommer efter, som i skolgård och läsare. Fogarna s, o och u har egna kort. Paren kan också bygga ord som inte finns. Låt eleven säga vad ett sådant ord skulle betyda, och hjälp eleven att skilja det från ett riktigt ord som har blivit fel, som tävlning för tävling.
      listor:
        - rubrik: "Vecka 1 · Ordkort"
          rader: [[säng], [robot], [regn], [hatt], [cykel], [hiss], [hjälm], [tand], [borste], [snö], [boll], [brand], [bil], [glas], [ögon], [hand], [duk], ["-arna"]]
        - rubrik: "Vecka 2 · Ordkort"
          rader: [[äventyr], [bad], [fot], [boll], [plan], ["skol(a)"], [gård], [buss], ["veck(a)"], [dag], ["gat(a)"], [kök], [glass], [strut], [s], [s], [o], [u]]
        - rubrik: "Vecka 3 · Ordkort"
          rader: [["jätte-"], ["super-"], [stor], [bra], [god], [rolig], [snabb], [stark], [grön], [sak], [ost], [macka], [skum], [tomte], [sur], [stång], [strö], [socker]]
        - rubrik: "Vecka 4 · Ordkort"
          rader: [["läs(a)"], ["lär(a)"], ["spel(a)"], ["mål(a)"], ["dyk(a)"], ["simm(a)"], [glass], ["prov(a)"], [moln], ["räkn(a)"], [sak], ["let(a)"], [damm], ["sug(a)"], [fotboll], [s], ["-are"], ["-are"]]
        - rubrik: "Vecka 5 · Ordkort"
          rader: [["o-"], ["o-"], ["miss-"], ["miss-"], ["åter-"], ["sam-"], [tur], [vän], [säker], [lycka], [känd], [lyckas], [nöjd], [vända], [arbete], [tal], [ost], [orm]]
        - rubrik: "Vecka 6 · Ordkort"
          rader: [["-ig"], ["-ig"], ["-lig"], ["-lig"], ["-lös"], ["-lös"], ["-bar"], ["-bar"], [lurv], ["dimm(a)"], [färg], [ljud], [tand], [vän], ["far(a)"], ["tvätt(a)"], ["ät(a)"], [syn]]
        - rubrik: "Vecka 7 · Ordkort"
          rader: [["-ning"], ["-ing"], ["-het"], ["-else"], ["-skap"], [s], [regel], ["öv(a)"], ["land(a)"], ["tävl(a)"], ["saml(a)"], [säker], [ny], [fri], ["rör(a)"], ["händ(a)"], [kamrat], [vän]]
        - rubrik: "Vecka 8 · Ordkort"
          rader: [[vänskap], [s], [bänk], [avokado], [skanner], [balkong], [kraftverk], ["hjärn(a)"], [röta], [ny], [ord], [moln], [robot], [tand], [s], ["-are"], ["-lös"], [lista]]
    # ---------------------------------------------------------------- Planschen
    - rubrik: Delarna
      text:
        - Det här är din lista till planschen Delarna. Skriv av veckans delar på ett blädderblocksark på väggen när ni börjar veckan, så att planschen växer under kursen.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: Veckans sida säger vilka delar gruppen läser i Ordstarten. Gruppen säger delen och vad den gör. Vid fogarna och ändelserna som böjer ordet säger gruppen ett ord med delen, som fotbollsplan och bilarna.
      listor:
        - rubrik: Före ordet
          rader:
            - ["o-", "inte, tvärtom, dålig"]
            - ["miss-", "inte, fel, dålig"]
            - ["åter-", "tillbaka, igen"]
            - ["sam-", "tillsammans"]
            - ["jätte-, super-", "mycket"]
        - rubrik: Mellan delarna
          rader:
            - ["s", "fotbollsplan, tävlingsregel"]
            - ["o, u", "veckodag, gatukök"]
            - ["a faller bort", "skolgård, farlig"]
        - rubrik: Efter ordet
          rader:
            - ["-are", "en som gör, eller en sak som gör"]
            - ["-ig, -lig", "som har, som är"]
            - ["-lös", "utan"]
            - ["-bar", "går att"]
            - ["-ning, -ing", "det man gör"]
            - ["-het, -skap", "det att vara"]
            - ["-else", "det som händer, eller när man gör något"]
        - rubrik: Ändelser som böjer ordet
          rader:
            - ["-en, -et", "bilen, huset"]
            - ["-ar, -er, -or", "bilar, bananer, flickor"]
            - ["-arna, -orna", "bilarna, flickorna"]
            - ["-s", "Saras, bilens"]
            - ["-ade, -de", "hoppade, återvände"]
            - ["-a, -t", "lurviga, ljudlöst"]
    # ---------------------------------------------------------------- Kortet Ett långt ord
    - rubrik: Ett långt ord
      text:
        - Kortet ligger framför varje elev i varje pass, och stegen med fraserna står också på lathundens första sida.
      huvud:
        - rubrik: Namn
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: Skriv ut kortet till varje elev, gärna på tjockt papper och förminskat till A5. Fastnar eleven när hen läser, gå uppför stödtrappan under När eleven fastnar i ett ord.
      listor:
        - rubrik: De fyra stegen
          rader:
            - ["", Läsa, Stava]
            - [1. Dela ordet, Ring in förstavelsen och ändelsen. Dra streck mellan delarna., Säg ordet. Räkna delarna.]
            - [2. En del i taget, Dra en båge under varje del och läs den., Skriv en del i taget och säg den.]
            - [3. Hela ordet, Säg ordet. Låter det som ett ord?, Läs ordet. Står det ihop? Är fogen med?]
            - [4. Vad betyder det?, Börja bakifrån., Börja bakifrån. Passar delarna betydelsen?]
        - rubrik: Till exempel
          rader:
            - ["cykel | hjälm | arna: cykelhjälmarna är hjälmarna man har när man cyklar"]
            - ["o | tur: otur är inte tur"]
    # ---------------------------------------------------------------- Vi skriver i par
    - rubrik: Vi skriver i par
      text:
        - Varje par har kortet på bordet i skrivpassen.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Skriv ut kortet en gång per par, gärna förminskat till A5. Visa Kloka pennan i din text i vecka 1: du säger en mening, och en elev säger den igen och skriver den. Meningsbyggare är ett långt ord, så ta det med stegen. I en trio är den tredje kontrollant och kollar de långa orden i varje mening, och rollerna går runt efter varje mening. När texten är klar är alla i paret eller trion kontrollanter. Från vecka 5 skriver var och en sin text, och kamraten är kontrollant. I en trio läser eleverna varandras texter i tur och ordning."
      listor:
        - rubrik: Kloka pennan, vecka 1–4
          rader:
            - ["Meningsbyggaren säger meningen."]
            - ["Sekreteraren säger meningen igen och skriver den."]
            - ["Läs meningen tillsammans och byt roller."]
        - rubrik: Var sin text, vecka 5–8
          rader:
            - ["Berätta din text för kamraten."]
            - ["Säg varje mening högt innan du skriver den."]
        - rubrik: Ett ord du är osäker på
          rader:
            - ["Säg delarna och skriv en del i taget."]
            - ["Fortfarande osäker? Dra en prickad linje under ordet och skriv vidare."]
        - rubrik: När ni lyssnar
          rader:
            - ["Vad vill ni veta mer om?"]
            - ["Vilket långt ord hörde ni?"]
        - rubrik: Kontrollanten
          rader:
            - ["Den som inte skrev sist läser texten högt."]
            - ["Har vi med det lyssnarna undrade?"]
            - ["Peka på varje långt ord. Står det ihop? Är fogen med?"]
            - ["Har ett ord en prickad linje? Ta det med stegen och skriv det rätt ovanför."]
    # ---------------------------------------------------------------- Skrivplanen
    - rubrik: Skrivplanen
      text:
        - "I det första skrivpasset skriver paret på planen vad texten ska handla om och vem som läser den, ett par ord om början, mitten och slutet, minst tre långa ord i delar, som säng | cykel, och det som lyssnarna vill veta mer om. Från vecka 5 har varje elev en egen plan."
      huvud:
        - rubrik: Namn
      delar:
        - rubrik: Skrivplanen
          falt:
            - rubrik: "Vad handlar texten om?"
            - rubrik: "Vem läser den?"
            - rubrik: Början
            - rubrik: Mitten
            - rubrik: Slutet
            - rubrik: Långa ord i delar
            - rubrik: Lyssnarna undrar
    # ---------------------------------------------------------------- Tidningens sida
    - rubrik: Tidningens sida
      sagoform: { form: sida, titel: Tidningens sida, radMm: 11 }
      text:
        - Det här är en sida i gruppens tidning, med en rad för titeln, en ruta att rita i och rader att skriva på. Eleverna skriver texten direkt på sidan med blyerts, och sidan går in i tidningen som den är.
      huvud:
        - rubrik: Skriven av
      delar:
        - rubrik: Tidningens sida
          falt:
            - { rubrik: Titel, text: "" }
            - { rubrik: Bild, text: "" }
            - { rubrik: Texten, text: "" }
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "Skriv ut en första sida och en sida att fortsätta på varje vecka, till varje par i vecka 1–4 och till varje elev i vecka 5–8. Sekreteraren, och från vecka 5 eleven, skriver textens första bokstav stort i den lilla rutan bredvid de första raderna. Paret ritar kartan i vecka 2 på ett tomt papper." }
    - rubrik: "Tidningens sida: fortsättning"
      sagoform: { form: sida, titel: Tidningens sida, radMm: 11 }
      text:
        - Den här sidan har bara rader. Eleverna skriver vidare på den när texten inte får plats på den första sidan.
      huvud:
        - rubrik: Skriven av
      delar:
        - rubrik: Tidningens sida
          falt:
            - { rubrik: Texten, text: "" }
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "Ge paret, eller från vecka 5 eleven, sidan när texten inte får plats på den första sidan." }
    # ---------------------------------------------------------------- Kartläggningen
    - rubrik: "Kartläggning: före och efter kursen"
      text:
        - Gör kartläggningen veckan före och veckan efter kursen, med samma ord båda gångerna. Ni övar inte de här orden i passen. Uppgift 1 och 4 gör du med en elev i taget, omkring fem minuter per elev, och uppgift 2, 3 och 5 med hela gruppen, omkring 20 minuter, en annan dag än uppgift 1 och 4.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Säg till eleven före kartläggningen att hen ska vara med i en verkstad där gruppen gör en tidning, och att orden i kartläggningen visar var ni ska börja. Eleven har ordlistan framför sig i uppgift 1 och bladet Dela orden i uppgift 2. Lägg undan dem före diktamen i uppgift 3, så att bara elevens blad ligger framme. Du har den här sidan. Uppgift 1: eleven läser orden högt, rad för rad, och du skriver det eleven säger ovanför ett ord som blir fel, på din egen kopia av ordlistan. Uppgift 2: visa övningsordet cykelhjälmarna först, och eleven ringar in ändelsen och drar streck mellan delarna på bladet Dela orden. Uppgift 3: du säger ordet, meningen och ordet igen, och eleven skriver på elevens blad. Uppgift 4: du läser frågan, och eleven svarar muntligt. Skriv svaret ordagrant. Uppgift 5: eleven skriver i tio minuter på tidningens sida om en sak som hen önskar fanns: vad den heter, vad som är jobbigt utan den och vad den gör."
            - rubrik: Poängen
              text: "Uppgift 1: ett poäng för varje ord som eleven läser rätt, också när eleven har delat ordet först, högst 16. Uppgift 2: ett poäng när eleven har märkt alla delar som i facit, med streck eller ring, högst 8. Uppgift 3: ett poäng för varje ord som är rätt stavat och ett för varje del som är rätt stavad, högst 8 för orden och 19 för delarna. Uppgift 4: två poäng när eleven säger både delarna och betydelsen, och ett när eleven säger det ena, högst 8. Uppgift 5: räkna de långa orden, och skriv vilka som står isär eller saknar fogen. Skriv också vilka av början, mitten och slutet texten har. Texten är av samma slag som i vecka 1, så efter kursen säger den mest om hur eleven skriver de långa orden."
            - rubrik: Lyssna efter
              text: "Gissar eleven efter början av ordet?\nTappar eleven ändelsen?\nDelar eleven ordet på fel ställe?\nFörklarar eleven ordet bakifrån?"
      listor:
        - rubrik: "Uppgift 2 · Facit"
          larare: true
          rader:
            - ["bad | rums | dörr"]
            - ["sommar | lov | et"]
            - ["o | läs | lig"]
            - ["hjälp | lös"]
            - ["lek | plats"]
            - ["mat | sal | en"]
            - ["skol | bibliotek | et"]
            - ["tåg | resa"]
        - rubrik: "Uppgift 3 · Diktamen"
          larare: true
          kolumner: [Ordet, Delar, Meningen]
          rader:
            - [hundkoja, "2", Hunden sover i sin hundkoja.]
            - [handbollsmatch, "3", En handbollsmatch spelas inomhus.]
            - [gatsten, "2", Gatan är byggd av gatsten.]
            - [otrygg, "2", Katten blev otrygg när det åskade.]
            - [missförstå, "2", Det är lätt att missförstå en lapp.]
            - [smutsig, "2", Tröjan blev smutsig i leran.]
            - [tandläkare, "3", En tandläkare tittar på tänderna.]
            - [vänlighet, "3", Vi tackade för hennes vänlighet.]
        - rubrik: "Uppgift 4 · Förklara orden"
          larare: true
          rader:
            - ["Vad kan en molnstövel vara? Hur vet du det?"]
            - ["Vad kan ett bokregn vara? Hur vet du det?"]
            - ["Vad betyder osnöig? Hur vet du det?"]
            - ["Vad kan en läxrobot vara? Hur vet du det?"]
    - rubrik: "Kartläggning: elevens ordlista"
      text:
        - Eleven läser orden högt i uppgift 1. Kopiera listan två gånger för varje elev, en till eleven och en till dig.
      huvud:
        - rubrik: Namn
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: Uppgifterna och poängen står under Kartläggning före och efter kursen. På din kopia skriver du det eleven säger ovanför ett ord som blir fel.
      listor:
        - rubrik: "Uppgift 1 · Läs orden, rad för rad"
          rader:
            - [diskmaskin, idrottshall]
            - [hårborste, kyrkogård]
            - [mjölkpaket, skolmat]
            - [kylskåp, busshållplats]
            - [hundägare, giftig]
            - [brevbärare, hemlös]
            - [oärlig, trygghet]
            - [missförstånd, städning]
    - rubrik: "Kartläggning: dela orden"
      text:
        - I uppgift 2 ringar eleven in ändelsen och drar streck mellan delarna. Kopiera bladet till varje elev.
      huvud:
        - rubrik: Namn
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: Visa övningsordet först, på stora tavlan. Facit och poängen står under Kartläggning före och efter kursen.
      listor:
        - rubrik: "Uppgift 2 · Ring in ändelsen, om ordet har en, och dra streck mellan delarna"
          rader:
            - ["Övning: cykelhjälmarna"]
            - [badrumsdörr]
            - [sommarlovet]
            - [oläslig]
            - [hjälplös]
            - [lekplats]
            - [matsalen]
            - [skolbiblioteket]
            - [tågresa]
    - rubrik: "Kartläggning: elevens blad"
      text:
        - Eleven skriver diktamen i uppgift 3 på det här bladet och texten i uppgift 5 på tidningens sida. Kopiera båda till varje elev, och spara dem från kartläggningen före kursen, så att du kan jämföra dem efter kursen.
      huvud:
        - rubrik: Namn
      delar:
