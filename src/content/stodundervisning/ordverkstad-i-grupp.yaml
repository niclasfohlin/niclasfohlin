      - - Ordkorten
        - En sats per par och vecka, och en till dig, klippta och i kuvert
        - "I ordpasset. Spara kuverten, eftersom korten med o- behövs igen i vecka 6."
      - - Kortet Ett långt ord
        - Ett per elev, för hela kursen
        - I varje pass, på bordet
      - - Kortet Vi skriver i par
        - Ett per par
        - I skrivpassen
      - - Skrivplanen
        - En per par i vecka 1–4 och en per elev i vecka 5–8, ny varje vecka
        - I skrivpassen
      - - Tidningens sida
