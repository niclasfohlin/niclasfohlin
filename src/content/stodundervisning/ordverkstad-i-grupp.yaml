    beskrivning: "Diktamen i ordpasset. Läraren säger: ”fotbollsplan”. Steg 1, Dela ordet: eleven räknar delarna. Steg 2, En del i taget: eleven skriver en del och säger den. Eleven säger: ”fot bolls plan”. Steg 3, Hela ordet: står ordet ihop? Eleven säger: ”fotbollsplan”. Fogen s är med, och ordet står ihop. Steg 4, Vad betyder det? Läraren säger: ”Vad är en fotbollsplan? Börja bakifrån.” Eleven säger: ”En plan där man spelar fotboll.”"
    rubrik: "Stava ett långt ord, en del i taget"
    ingress: "Fyra bilder ur filmen om diktamen i ordpasset. Läraren säger fotbollsplan, och eleven säger delarna och räknar dem på fingrarna. Eleven skriver en del i taget, ihop, läser hela ordet och kollar att det står ihop och att fogen s är med. Sist säger eleven vad ordet betyder. Filmen på metodens sida visar samma sak i rörelse."
