          falt:
            - rubrik: "1"
            - rubrik: "2"
            - rubrik: "3"
            - rubrik: "4"
            - rubrik: "5"
            - rubrik: "6"
            - rubrik: "7"
            - rubrik: "8"
    - rubrik: "Kartläggning: lärarens protokoll"
      text:
        - Skriv poängen för varje uppgift och det eleven sa i uppgift 1 och 4. Efter kursen jämför du poängen och svaren med dem före kursen och skriver vad eleven behöver nu.
      delar:
        - rubrik: Före kursen
          falt:
            - rubrik: Namn och datum
            - rubrik: "Uppgift 1: rätt av 16, och det eleven sa"
            - rubrik: "Uppgift 2: rätt av 8"
            - rubrik: "Uppgift 3: rätt stavade ord av 8, och delar av 19"
            - rubrik: "Uppgift 4: poäng av 8, och det eleven sa"
            - rubrik: "Uppgift 5: långa ord, de som står isär eller saknar fog, och början, mitten och slut"
        - rubrik: Efter kursen
          falt:
            - rubrik: Namn och datum
            - rubrik: "Uppgift 1: rätt av 16, och det eleven sa"
            - rubrik: "Uppgift 2: rätt av 8"
            - rubrik: "Uppgift 3: rätt stavade ord av 8, och delar av 19"
            - rubrik: "Uppgift 4: poäng av 8, och det eleven sa"
            - rubrik: "Uppgift 5: långa ord, de som står isär eller saknar fog, och början, mitten och slut"
            - rubrik: Vad eleven behöver nu
    # ---------------------------------------------------------------- Protokollet
    - rubrik: "Protokollet: vecka 1–3"
      text:
        - Varje elev har ett protokoll på tre sidor. Under Läste skriver du de ord som eleven läste fel eller med hjälp, och hur eleven läste dem. Under Skrev skriver du orden som blev fel i diktamen, så som eleven stavade dem, och de långa orden i texten. I vecka 1–4 skriver du också vem i paret som skrev dem. Skriv om texten har en början, en mitt och ett slut, och vad eleven lade till efter lyssnarnas fråga. Under Förklarade skriver du ordagrant vad eleven sa att ett ord betyder.
