  - nr: 3
    sekunder: 24.62
    beskrivning: "Meningsbyggaren säger meningen. Leo säger: ”Därför har vi uppfunnit en flygcykel.” Sekreteraren säger den igen och skriver den. Amir säger: ”Därför har vi uppfunnit en flygcykel.” Sekreteraren säger delarna och skriver en del i taget. Amir säger: ”flyg, cykel”. De läser meningen tillsammans. Amir och Leo säger: ”Därför har vi uppfunnit en flygcykel.” Sedan byter de roller."
    rubrik: "Kloka pennan"
    ingress: "Fyra bilder ur filmen om Kloka pennan i skrivpasset. Leo är meningsbyggare och säger meningen, och Amir är sekreterare, säger meningen igen och skriver den på tidningens sida. Det långa ordet flygcykel står i delar på skrivplanen, och Amir säger delarna och skriver en del i taget. Sedan läser de meningen tillsammans och byter roller. Skyltarna nederst finns bara i filmen och visar vem som har vilken roll. Filmen på metodens sida visar samma sak i rörelse."
