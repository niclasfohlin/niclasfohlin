lathund:
  innehall: En förlaga i veckan
  metoden:
    text:
      - "Kursen är för elever i åk 3–6 som fastnar på långa ord. Gör kartläggningen veckan före kursen. Varje långt ord tas med de fyra stegen här bredvid."
      - "Veckan har ett ordpass och två skrivpass, som står bredvid varandra på sidan Veckans tre pass. I pass 2 gör paret en skrivplan, berättar texten för ett annat par och skriver med Kloka pennan. I pass 3 skriver paret klart och läser för gruppen. Från vecka 5 skriver var och en sin text. Arbetsformen är ordpassets. Ha veckans sida framme."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Samma fyra steg på varje långt ord.
          text: I Ordstarten, i förlagan och i elevens text.
        - fet: Låt eleven förklara bakifrån.
          text: Sista ordet säger vad det är, och förstavelsen och ändelsen ändrar det.
        - fet: En egen text till en läsare varje vecka.
          text: Byggd som förlagan, med egna långa ord.
    tabell:
      rubrik: De fyra stegen · vad du säger
      kolumner:
        - Steg
        - Du säger
      rader:
        - - "1 · Dela ordet\nRing in och dra streck"
          - "”Var är delarna?”\n”Säg ordet. Hur många delar?”"
        - - "2 · En del i taget\nEn båge under varje del"
          - "”Läs den första delen.”\n”Säg delarna. Skriv en del i taget.”"
        - - "3 · Hela ordet\nSäg hela ordet"
          - "”Låter det som ett ord?”\n”Står ordet ihop?”"
        - - "4 · Vad betyder det?\nBörja bakifrån"
          - "”Vad betyder det? Börja bakifrån.”\n”Hur vet du det?”"
    not: "När eleven fastnar i ett ord, fråga först ”Var är delarna?” Räcker inte det, be eleven ringa in ändelsen, och läs först sedan den första delen åt hen. Är eleven osäker när hen skriver, drar hen en prickad linje under ordet, och paret tar det med stegen när texten är klar."
  pass:
    rubrik: "Vi kör ett pass: ordpasset i vecka 2"
    textRubrik: "Gruppen · fem elever i åk 4, vecka 2, pass 1"
    text:
      - "I Ordstarten läser gruppen i kör fogarna s, o och u och a som faller bort, och alla tar stegen på cykelhiss och glasögonen."
      - "Läraren läser guiden till Äventyrsbadet högt, och sedan läser alla i kör. Saga säger att guiden är skriven för den som kommer dit första gången."
      - "Läraren visar fotbollsplan: ”Fot, bolls, plan. S:et hör till delen före.” Amir och Leo lägger skol och buss och säger att a:et har fallit bort. Trion bygger glassbad, ett ord som inte finns, och Ella säger att det är ett bad med glass."
      - "I diktamen skriver Noah ”fotbollplan”. Läraren frågar ”Är fotboll två ord?”, och Noah lägger till s:et. Sist får paren veckans uppgift, en guide till drömskolgården för en yngre klass."
    forberett:
      rubrik: Det jag förberedde
      text:
        - "På planschen skrev jag fogarna och a som faller bort, och på stora tavlan cykelhiss, glasögonen och de sex nya orden. Jag letade fram bilder av ett äventyrsbad och ett gatukök och lade fram förlagan, kortet Ett långt ord och en miniwhiteboard per elev, och ordkorten i kuvert per par."
    klarTidigt: Paret bygger fler ord med korten och läser dem för mig.
    schema:
      rubrik: 60 minuter, minut för minut
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Skriv delarna på planschen och orden på stora tavlan. Lägg fram förlagan, kortet Ett långt ord, miniwhiteboarden och ordkorten.
        - tid: 0–5
          fas: 1 · Ordstarten
          vad: Alla läser delarna i kör och tar stegen på cykelhiss och glasögonen.
        - tid: 5–15
          fas: 2 · Förlagan
          vad: Bilder av ett äventyrsbad och ett gatukök. Du läser guiden högt, och alla läser i kör. Fråga 4 och 1.
        - tid: 15–35
          fas: 3 · Bygga
          vad: Du visar fotbollsplan och skolgård. Paren gör fråga 2 och bygger egna ord.
        - tid: 35–40
          fas: 4 · Nya ord
          vad: Paren läser pojkvän, flickskola och de andra nya orden för varandra.
        - tid: 40–52
          fas: 5 · Diktamen
          vad: Fotbollsplan, skolgården, veckodag, glasstrut och snöbollskrig, sedan felet ”fotbollplan” och fråga 3.
        - tid: 52–60
          fas: 6 · Läsa upp
          vad: Ett ord var, och du säger uppgiften om drömskolgården.
