    rader:
      - - "Förlagan\nHur är texten byggd?"
        - "Låt eleverna säga var början slutar och mitten börjar, och vad varje ram gör för läsaren. Dra ramen när gruppen är överens, och låt gruppen ge den ett namn, som Det jobbiga. Har förlagan flera stycken som är byggda likadant, som tre uppfinningar eller tre annonser, drar ni ramarna i ett av dem. I pass 3, fråga paren vad som är kvar att skriva."
        - "”Var slutar början?”\n”Vad gör den här ramen för läsaren?”\n”Vilket namn ger vi den?”\n”Vad är kvar att skriva?”"
      - - "Din text\nVad behöver läsaren veta först?"
        - "Din plan och din text på veckans sida är förslag, och du tar med elevernas ord och meningar där de passar. Säg vad du tänker om läsaren medan du skriver, och ta ett långt ord med stegen. Skriv gärna en otydlig mening med flit, och fråga gruppen vad läsaren behöver. Fråga i pass 3 vad mer läsaren behöver veta."
        - "”Vad måste vi börja med?”\n”Finns det ett bättre ord?”\n”Vilket långt ord passar här?”\n”Förstår läsaren det här?”"
      - - "Skriva\nVad är nästa mening?"
        - "Sitt med ett par i taget, tre till fem minuter med varje. Be paret läsa det de har skrivit, och hjälp till med en sak. Lyssna efter om sekreteraren säger meningen igen innan hen skriver och om paret byter efter varje mening. Från vecka 5 lyssnar du efter om eleven säger meningen högt innan hen skriver. Hur du hjälper eleven att stava ett ord står i tabellen När eleven fastnar i skrivandet."
        - "”Hur går det?”\n”Säg meningen innan ni skriver den.”\n”Säg delarna och skriv en del i taget.”\n”Är du osäker? Dra en prickad linje under ordet.”"
      - - "Läsa upp\nVad vill ni veta mer om?"
        - "Låt lyssnarna svara som läsare. Säger någon bara att det var bra, frågar du vad som var bra. Fråga sist vilket långt ord gruppen hörde, och låt den som skrev ordet säga delarna och vad ordet betyder, bakifrån."
        - "”Vad vill ni veta mer om?”\n”Vad var bäst i texten?”\n”Vilket långt ord hörde ni?”"
  - rubrik: När eleven fastnar i skrivandet
    plats: efter-fastnar
    text: "Här står det som oftast händer i skrivpassen, och vad du gör då."
    kolumner:
      - Det du ser
      - Det du gör
    rader:
      - - Paret kommer inte i gång
        - "Läs förlagans början högt och fråga vad deras början ska säga. Paret får låna förlagans första mening och byta ut innehållet."
      - - Varje mening börjar med ”och sen”
        - "Peka på början, mitten och slutet på skrivplanen och fråga var meningen hör hemma. Visa ord som säger i vilken ordning något händer, som först och sedan, gärna ur förlagan, och låt paret välja ett."
      - - Eleven vet inte hur ett ord stavas
        - "Låt eleven säga delarna och skriva en del i taget, och låt kamraten hjälpa till med delarna. Är eleven osäker efter tio sekunder, drar hen en prickad linje under ordet och skriver vidare. Paret tar ordet med stegen när texten är klar."
      - - Eleven väljer bort de långa orden
        - "Fråga vilket långt ord eleven sa när hen berättade. Låt eleven säga delarna och skriva ordet på miniwhiteboarden först, en del i taget, ihop."
      - - Eleven skriver mycket långsamt eller kan inte läsa sin text
        - "Låt eleven vara meningsbyggare oftare, och från vecka 5 kan kamraten vara sekreterare, en mening i taget. Du kan också själv vara sekreterare: eleven säger meningen, du skriver, och eleven läser meningen."
      - - Den ena i paret bestämmer alla meningar
        - "Påminn om att paret byter efter varje mening, och låt den som tog över vara sekreterare för nästa mening. Fortsätter det, skriver eleverna var sin text efter samma plan."
      - - Paret hinner inte klart i pass 3
        - "Sätt dig med paret, eller från vecka 5 med eleven. Paret, eller eleven, säger resten av texten, och du eller kamraten skriver den på sidan, en mening i taget. Ingen text blir läxa."
      - - Kamraten är borta
        - "Eleven skriver vidare och säger varje mening högt innan hen skriver den, och du är kontrollant. I nästa pass läser paret det nya tillsammans."
  - rubrik: Materialet du behöver
    plats: efter-urval
    meny: true
    text: "Allt utom miniwhiteboards, whiteboardpennor och sudd, blädderblocket, datorn, det tomma papperet och mappen står under Kursens material."
    kolumner:
      - Material
      - Hur många
      - När ni använder det
