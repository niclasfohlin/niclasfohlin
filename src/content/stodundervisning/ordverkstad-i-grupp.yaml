film:
  sekunder: 26.93
  beskrivning: "Paret bygger ett långt ord med ordkorten. Steg 1, Dela ordet: paret lägger delarna i rad. Steg 2, En del i taget: paret pekar och läser. Eleven säger: ”cykel, hjälm, arna”. Steg 3, Hela ordet: paret skjuter ihop korten och läser. Låter det som ett ord? Eleven säger: ”cykelhjälmarna”. Steg 4, Vad betyder det? Läraren säger: ”Vad betyder det? Börja bakifrån.” Eleven säger: ”Hjälmarna man har när man cyklar.”"
  rubrik: "Så gör paret"
  ingress: "Fyra bilder ur filmen om ett långt ord med ordkorten. Paret lägger korten cykel, hjälm och -arna i rad, läser en del i taget, skjuter ihop korten och läser hela ordet. Sist säger en av dem vad ordet betyder, bakifrån: hjälmarna man har när man cyklar. Kortet Ett långt ord med de fyra stegen ligger på bordet. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Dela ordet: paret lägger delarna i rad."
    - text: "En del i taget: paret pekar och läser varje del."
    - text: "Hela ordet: paret skjuter ihop korten och läser."
    - text: "Vad betyder det? Eleven börjar bakifrån."
