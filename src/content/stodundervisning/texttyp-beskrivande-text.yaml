        - "Pass 4, utan människor och utan papper som går att läsa"
      - - Bladet Det jag hör
        - Ett per vecka
        - "I handen medan paren planerar, beskriver och skriver"
      - - Bladet Till läraren i den yngre klassen
        - Ett
        - Före kursen
      - - En mapp per elev, skrivpapper, färgpennor och gem
        - En mapp per elev
        - Varje pass
