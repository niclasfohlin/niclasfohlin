# Texttyp: Beskrivande text. Den tredje kursen i serien Texttyper i grupp, efter Texttyp: Argumenterande text och
# Texttyp: Berättande text, på Niclas uppdrag 2026-10-06 (intake/texttyp-beskrivande-text.md och
# intake/texttyper-i-grupp.md). Formen är seriens (methods/texttyper-i-grupp/kursstandard.md), och det som gäller alla
# kurser står i methods/texttyper-i-grupp/metod.yaml. Kursens sammanhang är Niclas val i steg 4, 2026-10-08: en yngre
# klass som frågar hur det ser ut där de äldre går, och brev till någon i elevens liv som inte har sett det eleven
# beskriver. Kursens åtta grepp för återkoppling och kontraster står i kursstandarden, avsnittet Återkopplingen och
# kontrasterna. Underlaget är seriens register (intake/texttyper-i-grupp/REGISTER.md, kategori L och Q) med sökning
# 12–15, och valen står i analys.md, den andra analysen. Alla texter är riggens.
titel: "Texttyp: Beskrivande text"
undertitel: "Sex veckors kurs i liten grupp för åk 4–⁠7, där eleverna beskriver något för läsare som inte har sett det"
ingress: "En kurs i sex veckor för två till tio elever i åk 4–⁠7 som räknar upp det de ser när de beskriver. De lär sig beskriva så att läsaren ser det framför sig. Först beskriver de för yngre elever hur det ser ut där de äldre går, och sedan skriver de brev till någon som inte har sett det. Kursen hör till Texttyper i grupp."
omrade: Skrivning
arskurs:
  - 4-6
  - 7-9
arskursText: åk 4–7
taggar:
  - skrivstrategier
  - textstruktur
  - formativ-bedomning
  - intensivtraning
format:
  - liten grupp
  - par
tid: 60 minuter per pass, två pass i veckan
period: Sex veckor
grupp: Två till tio elever
material:
  - lappar
  - bladet Planen
  - kortet Läsarens frågor
  - bladet Barnets frågor
  - veckans texter
  - brevpapper och kuvert

uppdaterad: 2026-10-09
publicerad: 2026-10-09
relaterade: []
utkast: false
serie: texttyper-i-grupp
formaga: 3
tranar: "beskriva något så att läsaren ser det framför sig, genom att ge helheten först, säga vad det liknar och säga vad som skiljer det från annat"

inledning:
  - "Texttyp: Beskrivande text är en kurs för elever i åk 4–7 som behöver stöd i att skriva. När de beskriver något räknar de ofta upp det de ser, i en ordning som kunde vara vilken som helst och med ord som stor och fin. De tror att läsaren redan vet hur det ser ut, och läsaren får aldrig helheten. I kursen lär de sig beskriva något för en läsare som inte har sett det. En beskrivande text låter läsaren se hur något är, och den lyckas när läsaren ser det framför sig: vad det är och var, vad det liknar, vad hen ser först och sedan, och vad som skiljer det från annat. Kursen har två slags texter, två slags läsare och samma fyra steg. Det första slaget är en beskrivning till ett yngre barn som undrar hur det ser ut där de äldre går och vad de gör där, och det andra är brev till någon i elevens liv."
  - "På tavlan står tre rader: Vem läser? Vad vill vi? När får vi svar? På bordet ligger lappar, bladet Planen, kortet Läsarens frågor och bladet Barnets frågor, där barnet har ritat hur hen tror att det ser ut. Lapparna är små papperslappar, som du klipper ur arket Lapparna. På den första lappen skriver eleverna vad läsaren ska se. Är läsaren Noor, åtta år, kan det stå ”Noor ska se slöjdsalen framför sig”. På var och en av de andra skriver de en del av det läsaren ska se, med några ord: ”Väggen med verktygen”. Vid varje lapp frågar de sig om läsaren redan vet det, och svaret tar de ur det barnet sa och ritade. Det läsaren redan vet lägger de i rutan Åt sidan på bladet Planen. Minst en lapp hamnar där, och den som lägger den säger varför. De andra lapparna lägger de på Planen i den ordning läsaren ska se dem."
  - "Eleven lär sig genom att höra dig tänka högt och sedan göra likadant. Du frågar som läsaren, säger dina val högt och lämnar över till eleven. Det eleven ska ta över är att välja för läsarens skull och säga valet högt: ”Fönstren lägger jag åt sidan. Noor sa själv att där finns fönster.” Eleven gör varje text med samma fyra steg, Tänk, Planera, Säg och Skriv. I steget Säg beskriver eleven för en läsare ur ett annat par. Läsaren ritar det hen hör och frågar det hen inte kunde rita, och svaret blir en ny lapp och sedan en mening i texten. Eleven är också själv läsare av något hen inte har sett: din beskrivning av lärarrummet, kamratens beskrivning av sin sak och läsarens svar på brevet. Då märker eleven vad en läsare behöver. Mitt i skrivandet möter eleven andras texter och väljer vad hen använder, och efter texten skriver hen vad hen tar med sig till nästa text."
  - "Kursens läsare har inte sett det eleven beskriver. De första är yngre barn, och eleven är den som vet hur det ser ut och minns vad hen själv inte visste i barnets ålder. I vecka 1 kommer ett barn till varje par, ställer sina frågor och ritar hur hen tror att det ser ut. I vecka 2 beskriver paret en plats i skolan för barnet, i var sin text, och barnens lärare läser sedan texterna för barnen, som ritar det de ser framför sig. I vecka 3 kommer barnen på besök med sina teckningar och ser platsen på riktigt. De andra läsarna är personer i elevens eget liv, som en släkting eller en vän som har flyttat. Till dem skriver eleven två brev, ett om skolan och ett om en sak, en plats eller ett djur i sitt liv. Breven går med posten från skolan. Svaren på brevet om skolan öppnar eleverna i det sista passet, och svaren på det egna brevet när gruppen samlas efter kursen."
  - "De sex veckorna går från att du visar till att eleven skriver själv. I vecka 1 skriver eleven en kort text utan stöd, som ni lägger bredvid en ny i vecka 6. I vecka 2 visar du hur du planerar och skriver en beskrivning, och paren gör efter dig. I vecka 3 skriver gruppen en text tillsammans, i vecka 4 planerar paren brevet om skolan, och i vecka 5 planerar och skriver var och en sitt eget brev. I vecka 6 läser gruppen två uppgifter som liknar provens, så att eleven känner igen när en uppgift ber om en beskrivning. I vecka 1, 3 och 4 jämför ni två texter där en sak skiljer och frågar vad de gör för läsaren. Det som gäller alla kurser i serien står i Texttyper i grupp: vilka eleverna är, hur du tänker högt, vad du gör när en elev fastnar och vad kurserna bygger på."

upplagg:
  rubrik: Så fungerar insatsen
  text: "Två till tio elever har två pass om 60 minuter i veckan under sex veckor. Eleven gör varje text med fyra steg, Tänk, Planera, Säg och Skriv: hen säger vem som läser, väljer det läsaren behöver se, beskriver för en läsare som ritar och frågar, och skriver. Du tar bort stödet vecka för vecka: du visar, gruppen skriver tillsammans, paren planerar och var och en skriver sin egen text. Beskrivningen från vecka 2 går till ett yngre barn, och breven till någon i elevens liv. De korta texterna i pass 1 och 11, elevens diagram över kortets frågor och det du hör visar om kursen hjälper."

gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Kursen är för elever i åk 4–⁠7 som räknar upp det de ser när de beskriver och skriver ord som stor och fin, så att läsaren aldrig får helheten. Eleven behöver kunna säga vad hen ser och få ned läsbara meningar för hand, på dator eller genom att diktera. Den som redan ger läsaren helheten och det som skiljer får inte ut mycket av kursen, och den vars största hinder är stavningen behöver stöd i stavning vid sidan av kursen. Gruppen har två till tio elever. Du sätter ihop paren efter vem som stöttar vem. Med udda antal blir ett av paren tre, och med två elever är du läsare åt dem."

principer:
  rubrik: Tre saker att hålla fast vid
  text: "Nämn läsaren före första ordet, i varje text. Läsaren avgör vad som ska med. Lägg något åt sidan eller lägg till något för läsarens skull, och säg varför, så att valet hörs och syns på pappret. Kör fast högt, och säg vad du gör då. Eleven behöver höra att också du fastnar och hur du tar dig vidare. De tre sakerna ska först höras från dig och sedan från eleven, och det är dem du lyssnar efter."

passrutin:
  text: "Fem av passen, pass 4 och pass 6 till 9, har samma sex delar. I delarna Tänk och planera, Säg och Skriv gör eleverna de fyra stegen. En text tar oftast två pass. Tabellens minuter gäller pass 7, där eleverna planerar, beskriver och börjar skriva. De andra fyra har samma delar med andra minuter, och alla passens minuter står på veckans sida."
  steg:
    - text: "En elev läser dagens mening som läsaren. Alla skriver en ny mening, och ni lägger dem bredvid varandra. Var och en gör sin bättre."
      fas: Läs som läsaren
    - text: "Du visar det som står på veckans sida. Gruppen säger vad de hörde och prövar samma sak en gång tillsammans."
      fas: Visa och pröva
    - text: "Eleven läser bladet Mitt mål. Paret säger vem som läser. På lappar skriver de vad läsaren ska se. Det läsaren redan vet lägger de åt sidan, och resten lägger de i ordning."
      fas: Tänk och planera
    - text: "Två par sätter sig ihop. Skribenten beskriver för en läsare ur det andra paret. Läsaren ritar bara det hen hör och frågar det hen inte kunde rita."
      fas: Säg
    - text: "Var och en skriver efter planen, på varannan rad. Den som är klar läser texten som läsaren, med kortet, och skriver in det läsaren saknar."
      fas: Skriv
    - text: "Två elever läser en mening ur sin text och berättar om ett val."
      fas: Läs upp
  kallas: delar
  efterPasset: "Fäst lapparna på Planen och fyll i Till nästa pass på Det jag hör. Efter pass 1, 4, 8 och 10 svarar du på texterna. Efter pass 4 skickar du en kopia till barnens klass och lägger en i mappen."

tidsschema:
  rubrik: "Ett pass i sex delar"
  text: "Förbered dig genom att läsa veckans sida under Till läraren: veckorna. Där står dagens mening, vad du visar och vad du ska lägga märke till, och passets minuter. Minuterna är hållpunkter: det tar tid att komma i gång, och Skriv är lång för att passet ska ha luft."
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: "Skriv tavlans tre rader och dagens mening. Lägg fram lappar, pennor, bladet Planen, kortet, halva A4 och mapparna. Välj två eller tre elever som du lyssnar särskilt på."
    - tid: 0–5 min
      fas: Läs som läsaren
      vad: "Fråga ”Vad ser du framför dig? Vad undrar du?” och sedan ”Vilken mening ger läsaren mest? Varför?” Den som inte hinner skriva säger sin mening."
    - tid: 5–15 min
      fas: Visa och pröva
      vad: "Skriv på tavlan vad ni övar på, och visa bara det. Fråga ”Vad hörde ni mig säga?” Lägg undan texterna före Skriv."
    - tid: 15–27 min
      fas: Tänk och planera
      vad: "Fråga ”Vem läser?” och vid varje lapp ”Vet läsaren det redan? Hur vet du det?” Fråga sist ”Vad ser läsaren först?”"
    - tid: 27–33 min
      fas: Säg
      vad: "Säg till skribenten ”Det du svarade nu ska med i texten.” Svaret blir en ny lapp. Kan skribenten inte svara, tar paret reda på det vid platsen."
    - tid: 33–57 min
      fas: Skriv
      vad: "Säg ”Skriv det du sa.” Läs en mening över axeln och ställ en enda fråga ur kortet. Rätta inte nu. Den som inte kommer i gång får starthjälp: ”Jag hjälper dig med första meningen.”"
    - tid: 57–60 min
      fas: Läs upp
      vad: "Fråga efter ett val: ”Vilken lapp lade du åt sidan? Varför?” När en text är klar skriver eleven vad hen tar med sig."
  efter: "Tavlans tre rader är frågorna om läsaren: Vem läser? Vad vill vi? När får vi svar? Vid den första skriver du vem som läser. Svaret på den andra står på den första lappen. Vid den tredje skriver du när läsaren svarar: på besöket, i nästa pass eller när svaret på brevet kommer. Dagens mening tar du aldrig ur en elevs egen text. Har läsaren i Säg varit på platsen, ritar hen ändå bara det hen hör, och när hen har ritat säger hen en sak hen vet finns där men inte fick höra. De tre svarsraderna är läsarens svar, och de står på kortets andra sida: Nu vet jag, Det här ser jag framför mig och Nu undrar jag."

arbetsform:
  rubrik: "Arbetsform: gemensamt, läraren visar, i par, gemensamt igen"
  text: "I delen Säg sätter sig två par ihop, och läsaren kommer ur det andra paret. De två som beskriver gör det samtidigt, var och en för sin läsare. Blir ett par över, är du läsare åt det paret, och åt ett annat par nästa gång. Så blir det i varje pass när gruppen har två, tre, sex, sju eller tio elever. Då skriver du på bladet Det jag hör vad det paret säger. Är en i paret borta, blir kamraten den tredje i ett annat par. I pass 9 har var och en sin egen plan, och då är kamraten läsaren, som aldrig har sett elevens sak. I ett par med tre elever beskriver en elev i pass 3 och 7, och de två andra i pass 4 och 8. Paren är desamma hela kursen, och paret får planera på sitt starkaste språk."
  delar:
    - rubrik: 1. Gemensamt
      text: Hela gruppen, med dig vid tavlan
      faser:
        - Läs som läsaren
    - rubrik: 2. Läraren visar
      text: Du tänker högt, och gruppen gör likadant
      faser:
        - Visa och pröva
    - rubrik: 3. I par
      text: "Två och två, med var sin text"
      faser:
        - Tänk och planera
        - Säg
        - Skriv
    - rubrik: 4. Gemensamt igen
      text: Två elever berättar om ett val
      faser:
        - Läs upp

