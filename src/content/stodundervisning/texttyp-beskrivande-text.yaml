mallar:
  - rubrik: Lapparna
    typ: rutnat
    text: "Av arket gör du lapparna som eleverna planerar med. Skriv ut ett ark till varje par, och klipp längs linjerna, så blir det arton lappar. Hur länge ett ark räcker står under Till läraren: lapparna. Eleverna skriver en sak på varje lapp. På den första skriver de vad läsaren ska se framför sig, som ”Noor ska se slöjdsalen framför sig”, och på var och en av de andra en sak läsaren ska se där, som ”Väggen med verktygen”. Senare skriver de också det de svarade läsaren och det de har tagit reda på. Den som skriver på dator fyller i arket i Word innan du skriver ut det. Dina lappar från visningen står i manuset under Visningen, vecka 2."
    kolumner: ["", "", ""]
    rader: 6
    underrad: "Klipp längs linjerna, så blir det arton lappar. Skriv en sak på varje lapp."
    fot: "Skriv på den första lappen vad läsaren ska se framför sig. Skriv en sak läsaren ska se där på var och en av de andra, med några ord. Skriv det du svarade läsaren på en ny lapp."
  - rubrik: Planen
    typ: matta
    text: "Bladet ligger framför paret i delen Tänk och planera, och framför var och en i vecka 5. Skriv ut det på liggande A4. Lapparna klipper du ur arket Lapparna. Den första lappen säger vad läsaren ska se framför sig, och paret lägger den överst i den vänstra rutan. Under den lägger paret de andra lapparna i den ordning läsaren ser dem, uppifrån och lite omlott. Den lapp som paret lägger åt sidan ligger i den högra rutan. I vecka 4 har paret en plan och var sin läsare. Var och en skriver sin första bokstav på lappen med det som den egna läsaren redan vet, och lappen ligger kvar i den vänstra rutan så länge kamratens läsare behöver den."
    kolumner:
      - Det läsaren ska se, i ordning
      - "Åt sidan: det vet läsaren redan"
    fot: "Tänk: vem läser, och vad ska hen se framför sig? Planera: en sak läsaren ska se på varje lapp, i den ordning hen ser dem. Säg: beskriv för en läsare som ritar. Skriv: skriv det du sa, och det du svarade."
  - rubrik: Mina texter
    typ: rutnat
    text: "Diagrammet ligger i elevens mapp. Eleven fyller i stapeln nedifrån, med en ruta för var och en av kortets frågor som texten svarar på: när läsaren får veta vad det är och var, när texten jämför med något läsaren känner till och ger helheten, när delarna kommer i den ordning läsaren ser dem och när texten säger det som bara den här har. Varje fråga ger högst en ruta. Läsarens teckning och svar visar eleven vad texten gav läsaren. Gränsfallen står under Så räknar ni, i Till läraren: de korta texterna. Stapeln Efter kursen fyller eleven i när gruppen samlas igen."
    kolumner:
      - Första korta
      - Till barnet
      - Om skolan
      - Mitt brev
      - Sista korta
      - Efter kursen
    rader: 4
    underrad: "Namn: ____________________   En stapel för varje text som jag har skrivit. Fyll i nedifrån, en ruta för varje fråga på kortet som texten svarar på."
    fot: "En ruta för vad det är och var. En ruta för vad det liknar. En ruta när delarna kommer i den ordning läsaren ser dem. En ruta för det som bara den här har."

