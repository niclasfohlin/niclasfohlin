  pass:
    rubrik: "Vi kör ett pass: pass 7 i vecka 4"
    textRubrik: "Gruppen · fyra elever i åk 5 börjar brevet om skolan"
    text:
      - "På tavlan står en mening ur gruppens text: ”Längst in i korridoren står skåpen.” Ebba i 2A ritade dem som lådor på frågestunden. Alla skriver en ny mening, och gruppen pekar på Linneas: ”De är nästan lika höga som en vuxen, och varje skåp har ett eget lås.”"
      - "Läraren läser Brevet om Kaos, håller upp tre lappar om skolan och lägger en åt sidan: ”Min moster har sett skolgården på ett foto.” Var och en skriver sin läsare på första lappen och märker ut det den läsaren redan vet."
      - "Sami spelar Adams morfar och ritar det han hör. Han ritar ett höghus och frågar: ”Hur hög är den?” Adam svarar: ”Två våningar, lägre än ditt hus.” Det blir en ny lapp."
      - "Läraren läser Linneas första mening över axeln och frågar: ”Vad ser din moster först?” Wilma kör fast och säger: ”Jag tittar på kortet.” Sedan skriver hon."
    forberett:
      rubrik: Det jag förberedde
      text:
        - "Jag skrev tavlans tre rader och en mening ur gruppens text. Jag hade Brevet om Kaos, blädderblocket med reglerna och tre lappar om skolan. På bordet låg lappar, bladet Planen, kortet, halva A4 och mapparna med barnens teckningar. Jag lyssnade särskilt på Adam och Wilma."
    klarTidigt: "Eleven läser sin början som läsaren, med kortet, och skriver in det läsaren saknar."
    schema:
      rubrik: 60 minuter, minut för minut
      rader:
        - tid: Före
          fas: Förberedelse
          vad: "Skriv tavlans tre rader och dagens mening. Lägg fram lappar, bladet Planen, kortet, halva A4 och mapparna."
        - tid: 0–5
          fas: 1 · Läs som läsaren
          vad: "En elev läser meningen som barnet. Alla skriver en ny mening, och ni lägger dem bredvid varandra."
        - tid: 5–15
          fas: 2 · Visa och pröva
          vad: "Läs Brevet om Kaos. Visa reglerna och tre lappar. Du lägger en åt sidan, och gruppen säger vilka barnet hade behövt."
        - tid: "15–27"
          fas: 3 · Tänk och planera
          vad: "Nytt mål ur teckningen. Var och en skriver sin läsare och märker ut det läsaren redan vet."
        - tid: "27–33"
          fas: 4 · Säg
          vad: "Två par sätter sig ihop. Läsaren spelar skribentens läsare, ritar och frågar. Svaret blir en ny lapp. Sist säger läsaren sin egen första mening. Blir ett par över, är du läsaren."
        - tid: "33–57"
          fas: 5 · Skriv
          vad: "Var och en skriver början. Du läser över axeln och ställer en fråga i taget. Rätta inte nu."
        - tid: 57–60
          fas: 6 · Läs upp
          vad: "Paren säger vad de tar reda på vid skolan, i stället för ett val."
  mall:
    rubrik: Passen med egna minuter
    underrad: "Pass 4 och pass 6 till 9 följer passet i sex delar"
    block:
      - typ: tabell
        rubrik: Pass 1 till 5
        kolumner:
          - Pass och minuter
          - Det ni gör
        rader:
          - - "PASS 1\n0–⁠20 min"
            - "”Vad gör en beskrivning bra?” Den korta texten: tio minuter utan stöd."
          - - "20–⁠32 min"
            - "Två texter om samma skåp. ”I vilken ser du skåpet?”"
          - - "32–⁠60 min"
            - "Lika och olika med två bilder. Paren övar på frågestunden."
          - - "PASS 2\n0–⁠20 min"
            - "Läs som läsaren. Frågestunden: barnet frågar och ritar."
          - - "20–⁠40 min"
            - "Sortera frågorna. Läs Slöjdsalen som Noor."
          - - "40–⁠60 min"
            - "Eleven läser dina svarsrader, svarar på det du undrade och skriver ett mål."
          - - "PASS 3\n0–⁠23 min"
            - "Läs som läsaren. Du beskriver lärarrummet, och alla ritar."
          - - "23–⁠60 min"
            - "Paren planerar och beskriver. Alla skriver början. Två sätt vid 52."
          - - "PASS 4\n0–⁠60 min"
            - "Starterna. Fotot bredvid teckningarna. Säg 19–⁠25, Skriv 25–⁠57, halvvägs vid 41."
          - - "PASS 5\n0–⁠23 min"
            - "Två sätt i era texter. ”Jag skriver, ni tänker.” Du skriver gruppens början."
          - - "23–⁠60 min"
            - "Var och en skriver fortsättningen. Gruppen väljer en."
      - typ: tabell
        rubrik: Pass 6 till 12
        kolumner:
          - Pass och minuter
          - Det ni gör
        rader:
          - - "PASS 6\n0–⁠60 min"
            - "Två texter, vecka 3. Säg 18–⁠23, Skriv 23–⁠40. Besöket 40–⁠60."
          - - "PASS 8\n0–⁠60 min"
            - "Två texter, vecka 4. Säg 19–⁠25, Skriv 25–⁠57, halvvägs vid 41."
          - - "PASS 9\n0–⁠60 min"
            - "Två sätt i era texter. Planen som lista. Säg 26–⁠34, Skriv 34–⁠57."
          - - "PASS 10\n0–⁠9 min"
            - "Läs som läsaren. Saken bredvid kamratens teckning."
          - - "9–⁠45 min"
            - "Eleven skriver. Läsaren halvvägs vid 25, och hen ritar."
          - - "45–⁠60 min"
            - "Läsaren ringar in och undrar. Eleven skriver in svaret och adressen."
          - - "PASS 11\n0–⁠25 min"
            - "Den korta texten igen. Före och efter. Slöjdsalen och Kaos."
          - - "25–⁠60 min"
            - "Paren läser uppgifterna. Eleven bygger ut brevet."
          - - "PASS 12\n0–⁠30 min"
            - "Svaren på breven. Eleven ritar läsarens skola. Mitt mål."
          - - "30–⁠60 min"
            - "Det egna brevet går iväg. ”Vad gör en beskrivning bra?”"
  material:
    rubrik: Vad du behöver för kursen
    kravEtikett: "Brevens regler"
    var:
      rubrik: Var materialet finns
      punkter:
        - fet: Veckans sida.
          text: "Dagens mening, det du visar och det du ska lägga märke till står i metoden, under Till läraren: veckorna, och greppen under Till läraren: återkopplingen. Veckans texter står direkt efter veckans sida."
        - fet: Kortet och bladen.
          text: Kortet, bladet Barnets frågor, brevpapperet och de andra bladen står under Kursens material. Arket Lapparna, bladet Planen och diagrammet står i planeringsmallarna.
        - fet: Det som gäller alla kurser.
          text: "Hur du tänker högt, vad du gör när en elev fastnar och hur du hjälper den som har svårt att få ned texten står i Texttyper i grupp."
    bordet:
      - Lappar, pennor och halva A4 att rita på
      - "Bladet Planen och kortet Läsarens frågor"
      - Bladet Barnets frågor med barnets teckning, till och med pass 6
      - Mapparna med Mina texter och Mitt mål
      - Veckans text, som du lägger undan före Skriv
      - "På tavlan: Vem läser? Vad vill vi? När får vi svar?"
film:
  sekunder: 29.45
  beskrivning: "Tänk: vem läser, och vad ska hen se? Eleven säger: ”Noor läser. Hon ska se slöjdsalen.” Noor tänker: ”Hur ser den ut?” Planera: det läsaren ska se, en sak på varje lapp. Läraren frågar: ”Vet Noor det redan?” Eleven säger: ”Åt sidan. Noor sa att där finns fönster.” Säg: beskriv för en läsare som ritar. Eleven säger: ”Slöjdsalen är stor.” Läsaren frågar: ”Vad liknar det?” Läraren säger att svaret ska med i texten. Eleven säger: ”Den är stor som två klassrum.” Skriv: skriv det du sa. Eleven skriver: ”Slöjdsalen är stor som två klassrum.”"
  rubrik: "Så gör eleven: Tänk, Planera, Säg, Skriv"
  ingress: "Här är fyra bilder ur filmen om de fyra stegen, som paren gör i vecka 2. En elev planerar en beskrivning av slöjdsalen till Noor, åtta år, som frågade hur den ser ut. Det är mentortextens plats och läsare, och i kursen väljer paren en annan plats. Noor är inte i rummet: hon syns i bilden eftersom paret tänker på henne. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Tänk: vem läser? Noor undrar hur slöjdsalen ser ut."
    - text: "Planera: eleven lägger lappen åt sidan, för Noor vet."
    - text: "Säg: läsaren frågar vad det liknar. Det blir en lapp."
    - text: "Skriv: eleven skriver det hen sa till läsaren."
