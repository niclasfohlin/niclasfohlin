lathund:
  innehall: Läsare som inte har sett det
  metoden:
    text:
      - "Kursen är för elever i åk 4–7 som räknar upp när de beskriver. Eleven lär sig beskriva så att läsaren ser det framför sig, i fyra steg: Tänk, Planera, Säg och Skriv. Tabellen visar passets delar."
      - "Läsarna är ett yngre barn, som frågar i pass 2 och kommer på besök i pass 6, och någon i elevens liv, som får brev. Passen med egna minuter står på sidan Mallen, och stödtrappan i lathunden för Texttyper i grupp."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Nämn läsaren före första ordet.
          text: Läsaren avgör vad som ska med.
        - fet: Lägg åt sidan eller lägg till, för läsarens skull.
          text: Säg varför, så att valet hörs och syns.
        - fet: Kör fast högt.
          text: Säg vad du gör då.
      efter: Först från dig, sedan från eleven. Det är dem du lyssnar efter.
    tabell:
      rubrik: Passets delar · vad du säger
      kolumner:
        - Del
        - Du säger
      rader:
        - - "1 · Läs som läsaren\nAlla svar på bordet"
          - "”Vad ser du? Vad undrar du?”\n”Vilken mening ger mest?”"
        - - "2 · Visa och pröva\nDu tänker högt"
          - "”Vad hörde ni mig säga?”\n”Nu prövar vi samma sak tillsammans.”"
        - - "3 · Tänk och planera"
          - "”Vet läsaren det redan?”\n”Vad ser läsaren först?”"
        - - "4 · Säg\nLäsaren ritar"
          - "”Rita bara det du hör.”\n”Det du svarade nu ska med i texten.”"
        - - "5 · Skriv\nEn enda fråga"
          - "”Skriv det du sa.”\n”Stor som vad? Vad liknar det?”"
        - - "6 · Läs upp\nEtt val"
          - "”Vad lade du åt sidan? Varför?”\n”Vad tar du med dig?”"
