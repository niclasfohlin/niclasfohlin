# Metod i stödundervisning. Modellen står i src/content.config.ts och mallen i _mall.yaml.
# Skriven 2026-09-26 ur Niclas kompendium Särskilt stöd (Matematik 2 med Mall 3–5, och Matematik 4, nivå 3),
# intaget, Lgr22 och två sökningar online. Omskriven samma dag efter vikariens fyra rundor (granskning, frågerunda,
# läsbarhet och språk). Besluten står i metodriggens analys.md. Korten att klippa,
# elevens blad och mallarna (bråkplanket och tallinjerna) står under kort, elevblad och mallar före lathunden.
titel: "Bråkkurs i grupp: förstå, räkna och tänka i bråk"
undertitel: Fem veckors intensiv kurs i liten grupp, från material till tallinje och räkning, för åk 4–6
ingress: En intensiv kurs i fem veckor för två till tio elever i åk 4–6 som behöver stöd i att förstå bråk. Varje vecka går från material till tallinje och räkning. Läraren visar först och säger vad hen gör, och sedan gör gruppen likadant tillsammans, i par och var för sig.
omrade: Matematik
arskurs:
  - 4-6
arskursText: åk 4–6
taggar:
  - brak
  - intensivtraning
  - taluppfattning
format:
  - liten grupp
  - par
tid: 60 minuter per pass, två pass i veckan och ett tredje när det går
period: Fem veckor
grupp: Två till tio elever
material:
  - Bråkstavar från en hel till tolftedelar, utan elftedelar, en sats per elev och en för läraren, klippta ur mallen Bråkstavar att klippa, eller en köpt sats per par. I vecka 2 också halvorna och fjärdedelarna ur en extra sats till varje elev och till läraren
  - Remsor av A4-ark, klippta lika långa som den längsta staven
  - Maskeringstejp till en tallinje per elev, längs bordskanten
  - Mallarna Tallinjer i delar och Tomma tallinjer, bladet Stapelrutan, papper, penna och linjal
  - Bladet Bråket på fyra sätt, ett per elev, laminerat, och whiteboardpennor
  - Veckans kort, spelkort och problem ur Kursens material, kopierade på tjockt papper
  - Knappar, 24 per elev, en tärning per par, färgpennor och sax
  - Ett A3 som affisch till veckans mening
uppdaterad: 2026-09-26
relaterade:
  - antalsuppfattning-i-grupp
  - problemlosning-i-grupp
utkast: false
inledning:
  - "Kursen är för elever i åk 4–6 som behöver stöd i att förstå bråk. Eleverna gör bråken med material, ritar dem och sätter ut dem på tallinjen innan de räknar med dem. Varje vecka går från det konkreta till det abstrakta. I första passet arbetar gruppen med remsor och bråkstavar, och med knappar i vecka 5. I andra passet arbetar gruppen med bild, tallinje och räkning. I ett tredje pass, när det går, repeterar gruppen veckan med ett spel och ett problem. Det viktigaste händer vid bordet. Läraren visar först och berättar vad hen gör medan hen viker, lägger och pekar, och säger bråket i ord. Sedan gör gruppen samma sak tillsammans, i par och var för sig, och passet slutar med att alla gör det gemensamt igen."
  - "Kursen löser inte allt om bråk. Efter fem veckor ska eleven förstå vad ett bråk säger, kunna räkna med enkla bråk och tänka i bråk: jämföra, uppskatta och se när ett svar inte kan stämma."
  - "Tre ord är centrala i kursen: det hela, nämnare och täljare. Det hela är det som delas, till exempel en remsa, den längsta bråkstaven, sträckan från 0 till 1 på tallinjen eller ett antal knappar. Nämnaren säger hur många lika stora delar det hela är delat i, och täljaren säger hur många sådana delar vi har. Därför säger vi tre fjärdedelar om 3/4: tre delar, och varje del är en fjärdedel av det hela. 5/4 är fem fjärdedelar, alltså mer än det hela."
  - Bråkstavar är avlånga bitar. Den längsta staven är det hela, och de andra är halvor, tredjedelar, fjärdedelar och så vidare. Bladet Bråket på fyra sätt har fyra rutor, där eleven visar samma bråk med material, som bild, på tallinjen och med siffror.
  - Fraserna i stegen kommer från vecka 1, och exempelpasset från en grupp i vecka 2, när eleverna börjar sätta ut bråken på tallinjen. Lärarens ord, korten, spelen och problemen för varje vecka finns under Kursens material, efter Kort om grunden.
upplagg:
  rubrik: Så fungerar insatsen
  text: Insatsen pågår i fem veckor med två pass i veckan och ett tredje när det går. Varje pass är 60 minuter, och gruppen har två till tio elever i åk 4–6. Varje vecka har ett fokus. I pass 1 arbetar ni med material, i pass 2 med bild, tallinje och räkning, och i pass 3 med ett spel och ett problem. Hela gruppen arbetar med samma innehåll och samma kort, oavsett årskurs, och det blir ingen läxa. Före första passet och efter det sista gör du samma kartläggning, utanför passen.
gruppen:
  rubrik: Så sätter du ihop gruppen
  text: Välj två till tio elever som av olika anledningar behöver stöd i att förstå bråk. Några har missat grunden, några räknar med regler de inte förstår, och några blandar ihop bråk och decimaltal. Det klassläraren vet om eleverna hjälper dig att välja, och kartläggningen visar var varje elev börjar. Gruppen kan blanda åk 4, 5 och 6, eftersom alla börjar med det hela och de lika stora delarna. Med fler än sex elever arbetar paren vid två bord. När du visar, och i Samma bråk och Veckans mening, samlas alla vid ett bord. I Fyra sätt lyssnar du på varje elev. Med fler än sex elever lyssnar du på halva gruppen i pass 1 och resten i pass 2. Kalla gruppen bråkkursen. Den har en början och ett slut, och eleverna vet vad de ska kunna efteråt.
principer:
  rubrik: Tre saker att hålla fast vid
  text: "Visa först och säg bråket i ord: du viker, lägger och pekar framför eleverna och berättar vad du gör, och du säger alltid bråket med ord, som tre fjärdedelar. Fråga efter det hela: vad är det hela, och hur många lika stora delar är det delat i? Det hela är lika långt i remsan, i staven och på tallinjen. Och gå från material till siffror varje vecka: i pass 1 arbetar eleverna med material och i pass 2 med bild, tallinje och räkning, och materialet ligger kvar på bordet."
tabeller:
  - rubrik: Varför bråk blir svårt, och vad kursen gör
    plats: efter-inledning
    kolumner:
      - Det som händer
      - Så kan det låta
      - Så gör kursen
    rader:
      - - Eleven läser bråket som två hela tal.
        - ”1/5 är större än 1/3, för 5 är större än 3.”
        - I varje pass använder ni orden nämnare och täljare, och i vecka 1 ser eleverna att fler delar ger mindre delar.
      - - Eleven godtar delar som inte är lika stora.
        - ”Tre bitar, alltså tredjedelar.”
        - I vecka 1 viker eleverna remsor, lägger delarna mot varandra och gör själva delar som inte är lika stora.
      - - Eleven ser inte bråket som ett tal.
        - ”3/4 ligger mellan 3 och 4.”
        - I vecka 2 lägger eleverna staven mot tallinjen, och bråket får en plats mellan 0 och 2.
      - - Bråk större än 1 verkar omöjliga.
        - ”Man kan inte ta fem av fyra.”
        - "I vecka 2 räknar gruppen i kör förbi en hel: fyra fjärdedelar, fem fjärdedelar."
      - - Eleven byter ut det hela.
        - ”Jag delade hela linjen i fyra”, på en tallinje som går till 2.
        - Du frågar efter det hela varje gång, och det hela är lika långt i materialet och på tallinjen.
      - - Eleven räknar täljare och nämnare var för sig.
        - ”1/4 + 2/4 är 3/8.”
        - I vecka 4 räknar eleverna delar som är lika stora och uppskattar svaret först.
    not: Felen kommer av att eleven använder det hen vet om hela tal. Därför räcker det sällan att säga regeln en gång till. Eleven behöver se bråket i materialet och på tallinjen och säga det med rätt ord.
  - rubrik: "Veckan: från material till siffror"
    plats: efter-tidsschema
    text: Veckans fokus är detsamma i alla passen. Det som ändras är hur eleverna visar bråket. I pass 1 gör eleverna bråket med material, och i pass 2 ritar de det, sätter ut det på tallinjen och räknar. Materialet ligger kvar på bordet i pass 2, så att eleven kan gå tillbaka till det. I pass 3 repeterar gruppen veckan med ett spel och ett problem.
    kolumner:
      - Vecka och fokus
      - "Pass 1: med material"
      - "Pass 2: bild, tallinje och räkning"
      - "Pass 3, när det går: spel och problem"
    rader:
      - - 1 · Lika delar
        - Vik remsor i halvor och fjärdedelar, och jämför stavarna.
        - Skriv bråk i Bråkplanket att fylla i, rita staplar och dela dem, och ordna bråk med täljaren 1.
        - Spelet Fyll det hela. Problemet om tre barn som delar två chokladkakor.
      - - 2 · Bråk på tallinjen
        - Lägg stavarna mot tallinjen från 0. Staven blir ett mått.
        - Dela tallinjen, sätt ut bråk och räkna i fjärdedelar förbi 1.
        - Spelet Högst vinner. Problemet om snigeln som kryper en fjärdedels meter i timmen.
      - - 3 · Likvärdiga bråk
        - Bygg samma längd med andra stavar, och vik ett A4 i halvor, fjärdedelar och åttondelar.
        - Jämför linjerna i Tallinjer i delar, dubbla täljaren och nämnaren, och skriv tiondelar som decimaltal och en halv som 50 %.
        - Spelet Memory med samma tal. Problemet om tre baguetter och tre bråk.
      - - 4 · Addera och subtrahera
        - Lägg delar efter varandra, ta bort och byt en del mot mindre delar.
        - Uppskatta först och räkna på tallinjen.
        - Spelet Närmast en hel. Problemet om Majas bok.
      - - 5 · Bråk av antal
        - Dela knappar i lika stora högar och ta så många högar som täljaren säger.
        - Rita stapeln, hitta en del och sedan det hela.
        - Spelet Ta din del av 24. Problemet om klassen på utflykt.
    not: Du gör kartläggningen före vecka 1 och efter vecka 5. Hinner gruppen inte pass 3 en vecka spelar paren veckans spel när de blir klara tidigt i pass 1 och 2.
  - rubrik: "Pass 3, när det går: spel och problem"
    plats: efter-tidsschema
    text: I pass 3 repeterar gruppen veckan. Paren spelar först veckans spel, och sedan löser gruppen ett problem med samma fokus. Problemet står på ett eget kort efter veckans kort. Spelets regler och problemets lösning står i rutan Till läraren om pass 3 i veckans ram under Kursens material.
    kolumner:
      - Del och tid
      - Så leder du den
    rader:
      - - "Spelet\n0–20 min"
        - Paren spelar veckans spel. Den som vinner ett kort eller en poäng säger varför, och kamraten kontrollerar med materialet eller tallinjen.
      - - "Förstå och planera\n20–30 min"
        - Läs problemkortet högt. En elev berättar problemet med egna ord, och gruppen ringar in frågan och säger vad det hela är. Skriv upp det ni vet och det ni söker, gärna i Stapelrutan. Bestäm tillsammans hur ni visar problemet, med material, en bild eller tallinjen. Ingen räknar än.
      - - "Lösa\n30–45 min"
        - Paren löser problemet. Gå runt och se vilka lösningar som finns i gruppen. Blir ett par klart tidigt får det frågan som står i rutan Till läraren om pass 3 under Kursens material.
      - - "Jämföra\n45–55 min"
        - Två par visar sina lösningar bredvid varandra. Är svaret rimligt? Vad är det hela i problemet?
      - - "Veckans mening\n55–60 min"
        - Gruppen säger veckans mening igen, med problemet som exempel.
passrutin:
  text: "Pass 1 och pass 2 följer samma rutin i fem delar. Läraren visar först, sedan gör alla samma sak tillsammans, sedan arbetar eleverna i par och var för sig, och till sist gör alla det gemensamt igen. Det som skiljer är materialet. I pass 1 arbetar eleverna med remsor och stavar, och med knappar i vecka 5. I pass 2 arbetar de med bild, tallinje och räkning. Pass 3 har egna delar (se Pass 3, när det går: spel och problem)."
  steg:
    - text: Läraren visar ett bråk som hör till veckans fokus och säger allt hen gör. Eleverna tittar och lyssnar.
      fas: Första bråket
    - text: Alla gör samma bråk tillsammans, ett handgrepp i taget, och räknar delarna i kör.
      fas: Samma bråk
    - text: Läraren läser ett kort och paren gör det. Sedan läser eleverna korten för varandra i paret, och läraren lyssnar.
      fas: Korten
    - text: Varje elev får ett kort, visar bråket med material och på bladet Bråket på fyra sätt och berättar vad hen gör.
      fas: Fyra sätt
    - text: Alla gör ett sista bråk tillsammans och säger veckans mening.
      fas: Veckans mening
  efterPasset: Läraren antecknar i några ord vem som kunde säga vad nämnaren och täljaren betyder, vem som gjorde veckans vanliga fel och vad läraren behöver visa igen nästa pass.
tidsschema:
  rubrik: "Pass 1 och 2: 60 minuter"
  text: Förbered dig genom att göra veckans bråk själv med dagens material och säga orden högt. Översikten visar hur de 60 minuterna fördelas och vem som arbetar i varje del. Paren får längst tid, och Veckans mening får tio minuter, så att gruppen hinner säga meningen med egna exempel.
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: Ta fram dagens material och ett blad Bråket på fyra sätt per elev. Från vecka 2 tejpar du en tallinje per elev längs bordskanten. Kopiera korten till dagens pass, en kopia per par, och klipp dem. Det första bråket är det du visar under Visa först och säg i veckans ruta Till läraren under Kursens material, och det sista står under Veckans mening. Gör båda och säg orden högt.
    - tid: 0–8 min
      fas: Första bråket
      vad: Visa bråket långsamt och tänk högt. Säg vad det hela är, hur du delar det, vad du pekar på och vad bråket heter, och skriv bråket samtidigt som du säger det.
    - tid: 8–18 min
      fas: Samma bråk
      vad: "Säg varje handgrepp, och eleverna gör och säger likadant med sin egen sats. Har ni en köpt sats per par gör paret bråket tillsammans. Räkna delarna i kör: ”En fjärdedel, två fjärdedelar, tre fjärdedelar.” Fråga: ”Vad är det hela? Hur vet du att delarna är lika stora?”"
    - tid: 18–38 min
      fas: Korten
      vad: Läs det första kortet högt. I paret gör den ena kortet och berättar vad hen gör, och den andra kontrollerar med materialet eller tallinjen. De byter roller efter varje kort. Gå mellan paren och lyssna efter veckans vanliga fel. De står under Lyssna efter i veckans ruta Till läraren under Kursens material.
    - tid: 38–50 min
      fas: Fyra sätt
      vad: Ge varje elev ett kort med ett bråk, gärna ett som hen läste för kamraten men inte gjorde själv. I pass 1 gör eleven bråket på bordet och ritar det i rutan Med material. Sedan ritar eleven bråket som bild, på en egen liten tallinje och med siffror. Lyssna på en elev i taget. Har gruppen fler än sex elever lyssnar du på halva gruppen i pass 1 och på resten i pass 2. Den som är klar får ett kort till.
    - tid: 50–60 min
      fas: Veckans mening
      vad: Gör det sista bråket på din tallinje, med bitar från flera satser. Låt eleverna visa och berätta. Första passet i veckan skriver du meningen på affischen.
  efter: Blir ett par klart tidigt spelar de veckans spel. Reglerna står i veckans ram under Kursens material, i rutan Till läraren om pass 3.
steg:
  rubrik: "Pass 1 och 2: vad du gör och säger i varje del"
  rader:
    - namn: Första bråket
      fraga: Vad är det hela, och vad gör jag med det?
      gor: Visa bråket framför eleverna och tänk högt. Sätt ord på varje handgrepp, alltså vad det hela är, hur du delar det, vad eleverna ska titta på och vad du pekar på. Skriv bråkstrecket, sedan nämnaren och sist täljaren, medan du säger vad de betyder. Eleverna tittar. Sitt så att eleverna ser materialet som du ser det.
      fraser:
        - Den här remsan är det hela. Jag viker den så att kanterna möts.
        - Fyra lika stora delar. Jag skriver fyran under strecket.
        - Jag färglägger tre delar och skriver trean över strecket. Tre fjärdedelar.
        - "Jag räknar delarna: en fjärdedel, två fjärdedelar, tre fjärdedelar."
    - namn: Samma bråk
      fraga: Hur gör vi det tillsammans?
      gor: Gör bråket du just visade en gång till, nu samtidigt som eleverna och ett handgrepp i taget. Säg vad ni gör och räkna delarna i kör. Vänta tills alla är klara innan nästa handgrepp.
      fraser:
        - Vik med mig. Möts kanterna?
        - Räkna delarna med mig.
        - Vad är det hela? Hur många lika stora delar är det delat i?
    - namn: Korten
      fraga: Vad säger bråket?
      gor: Läs ett kort i taget i början. Paren gör kortet. Den ena visar och berättar vad hen gör, och kamraten kontrollerar. Sedan läser paren korten för varandra. Fråga efter det hela och delarna innan du frågar efter svaret.
      fraser:
        - Hur många lika stora delar är det hela delat i? Hur många delar tar du?
        - Är det mer eller mindre än en halv?
        - Var sitter talet på tallinjen? Visa med staven.
        - Hur vet du?
    - namn: Fyra sätt
      fraga: Kan du visa det på flera sätt?
      gor: Ge varje elev ett kort med ett bråk. Eleven gör bråket med materialet, ritar det i rutan Med material och visar det sedan som bild, på tallinjen och med siffror. Lyssna på en elev i taget. Har gruppen fler än sex elever lyssnar du på halva gruppen i pass 1 och på resten i pass 2. Saknar eleven orden gör ni det tillsammans igen, med materialet.
      fraser:
        - Visa bråket på två sätt.
        - Berätta vad nämnaren och täljaren säger.
        - Hur kan du kontrollera det?
    - namn: Veckans mening
      fraga: Vad tar vi med oss?
      gor: Gör det sista bråket med hela gruppen. Låt eleverna visa och berätta, och säg veckans mening tillsammans. Skriv meningen på affischen, som sitter uppe under hela kursen.
      fraser:
        - Vem kan visa det på ett annat sätt?
        - Säg det med orden nämnare och täljare.
        - Nu säger vi veckans mening tillsammans.
arbetsform:
  rubrik: "Arbetsform: läraren visar, gemensamt, i par, enskilt, gemensamt igen"
  text: Passet börjar hos läraren, går över till eleverna och slutar hos hela gruppen. Först visar läraren, och eleverna tittar och lyssnar. Därefter gör alla samma sak tillsammans, och sedan arbetar eleverna först i par och sedan var och en för sig. Sist arbetar alla gemensamt igen, när gruppen med egna ord säger det den har sett. Med ett udda antal elever blir det en trio, där en läser kortet och två gör det tillsammans. Med fler än sex elever arbetar paren vid två bord, och du går mellan dem. När du visar och i de gemensamma delarna samlas alla vid ett bord.
  delar:
    - rubrik: 1. Läraren visar
      text: eleverna tittar och lyssnar
      faser:
        - Första bråket
    - rubrik: 2. Gemensamt
      text: alla gör likadant, ett handgrepp i taget
      faser:
        - Samma bråk
    - rubrik: 3. I par
      text: den ena gör och berättar, den andra kontrollerar
      faser:
        - Korten
    - rubrik: 4. Enskilt
      text: var och en visar och berättar
      faser:
        - Fyra sätt
    - rubrik: 5. Gemensamt igen
      text: alla visar och säger det tillsammans
      faser:
        - Veckans mening
exempel:
  valt:
    rubrik: Gruppen
    text: "fem elever i åk 4–6, vecka 2, pass 1: bråk på tallinjen, med bråkstavar."
  text:
    - "Läraren har tejpat en tallinje längs bordskanten, där det är lika långt från 0 till 1 som den längsta staven. ”Den här staven är det hela. Den börjar vid 0 och slutar vid 1.” Läraren lägger en fjärdedel från 0, sätter ett streck där den slutar och skriver 1/4 vid strecket: ”Här är en fjärdedel. Talet står vid strecket, där delen slutar.” Läraren lägger fjärdedelar en i taget, sätter ett streck där varje fjärdedel slutar och räknar: ”Två fjärdedelar, tre fjärdedelar, fyra fjärdedelar. Fyra fjärdedelar är 1.” Läraren tar en fjärdedel till ur den andra satsen, lägger den efter 1 och sätter ett streck: ”Fem fjärdedelar. Nu är vi förbi 1.” Eleverna tittar."
    - "”Nu gör vi det tillsammans.” Alla lägger sina fjärdedelar på sin tallinje, lägger en femte efter 1 och räknar i kör från en fjärdedel till fem fjärdedelar. ”Var hamnar tre fjärdedelar?” frågar läraren. Amira pekar: ”Mellan en halv och 1.”"
    - "Läraren läser kortet ”Sätt ut 3/5. Är det mer eller mindre än en halv?” Hamza lägger tre femtedelar och skriver 3/5 på tejpen mitt under den tredje staven. ”Var slutar tre femtedelar?” frågar läraren. Hamza flyttar fingret till slutet av staven och sätter strecket där. Noah lägger halvan bredvid: ”Tre femtedelar är längre. Mer än en halv.” Sedan läser Elsa ett kort för Viggo: ”Lägg halvor från 0 till 2. Hur många halvor går det på 2?” Viggo lägger halvorna efter varandra, två ur varje sats, och räknar: ”Fyra halvor.”"
    - "Var och en får ett kort med ett bråk. Noah lägger fjärdedelar från 0 till 1 på sin tallinje och sedan en till efter 1. Han säger: ”Fem fjärdedelar. Det är en och en fjärdedel.” Sedan ritar han stavarna i rutan Med material på bladet Bråket på fyra sätt och skriver 5/4 i rutan Med siffror. Läraren lyssnar på en elev i taget."
    - "Till sist lägger gruppen 7/4 tillsammans på lärarens tallinje. ”Är 7/4 ett tal?” frågar läraren. ”Ja, det har en plats mellan 1 och 2”, säger Elsa. Gruppen säger veckans mening: ”Ett bråk är ett tal med en egen plats på tallinjen.” Efteråt noterar läraren att Hamza skrev bråket mitt under staven i stället för vid strecket, men flyttade det efter frågan. Nästa pass börjar läraren med att själv sätta ut tredjedelar på en tallinje utan stavar."
fastnar:
  rubrik: När eleven fastnar
  text: Den som brukar fastna gör det oftast när det hela eller delarna inte syns, på tallinjen, i en uträkning eller i ett antal. Gå då tillbaka ett steg, från siffror till bild eller från bild till material, och låt eleven visa igen.
  fragaForst:
    - Vad är det hela?
    - Hur många lika stora delar är det delat i?
    - Är det mer eller mindre än en halv?
  trappaText: "En stödtrappa att gå uppför i stunden. Ge inte nästa steg förrän eleven har prövat det föregående:"
  trappa:
    - Be eleven visa det hela och peka på en del. Vad heter den delen?
    - "Be eleven göra bråket med material, också i pass 2: vika en remsa, lägga stavarna eller dela knapparna i högar."
    - "Lägg staven mot tejpen, eller en halv bredvid, och jämför: är det längre eller kortare? I vecka 5 lägger ni högarna bredvid varandra."
    - "Räkna delarna högt tillsammans: en fjärdedel, två fjärdedelar, tre fjärdedelar."
    - Visa själv och säg vad du gör. Gör det sedan tillsammans med eleven, och låt eleven säga det.
  motto: Vad är det hela, och hur stora är delarna?
roll:
  rubrik: "Lärarens roll: visa först och säga bråket rätt"
  text: "Du visar först och säger vad du gör: vad det hela är, hur du delar det, vad du pekar på och vad bråket heter. Eleverna säger som du, så orden behöver vara desamma varje gång. Sedan lämnar du över, först till paren och sist till varje elev. Det är eleven som lägger stavarna och säger varför. Lägger du dem åt eleven blir svaret rätt, men eleven har inte gjort det."
  gor:
    - "Säg bråket i ord: tre fjärdedelar, fem åttondelar."
    - Fråga ”Vad är det hela?” innan eleven svarar.
    - "Be eleven uppskatta innan hen räknar: mer eller mindre än en halv, mer eller mindre än 1?"
    - Låt materialet ligga kvar i pass 2, och gå tillbaka till det när eleven fastnar.
    - Låt det hela vara lika långt i materialet och på tallinjen när stavarna läggs mot den.
    - Låt veckans mening sitta kvar på affischen hela kursen.
  undvik:
    - Att säga ”tre av fyra” eller ”tre genom fyra”.
    - Att ge regeln innan eleven har sett det i materialet.
    - Att lägga stavarna åt eleven.
    - Att räkna innan gruppen har uppskattat.
    - Att använda cirklar och pizzor som material.
urval:
  rubrik: Var hittar du materialet och korten?
  text:
    - Mallen Bråkstavar att klippa är två sidor i planeringsmallarna. Skriv ut båda på tjockt papper, en av varje per elev, färglägg varje rad i en egen färg och klipp isär raderna och bitarna. Stavarna är 2,4 cm höga, så att eleverna kan hålla dem. Bråkstavar finns också att köpa, som bråktavla eller bråkstavar. Med en köpt sats per par gör paret bråket tillsammans. I vecka 2 går bråken förbi 1, och då behöver varje elev och du halvorna och fjärdedelarna ur en extra sats. De står på mallens första sida. Ett par med en köpt sats tar dem ur en till köpt sats av samma sort, så att det hela är lika långt. Mallen Bråkplanket visar samma stavar på en sida, som eleverna kan ha framför sig. I mallen Bråkplanket att fylla i skriver eleverna själva bråket i en bit på varje rad.
    - Remsorna klipper du av A4-ark, fyra på längden ur varje ark. Klipp dem lika långa som den längsta staven, så att det hela är lika långt i allt material.
    - Från vecka 2 tejpar du en tallinje per elev med maskeringstejp längs bordskanten, två på varje långsida. Det är en stavlängd från 0 till 1 och en från 1 till 2, så att eleverna kan lägga stavarna mot linjen och skriva på tejpen. I pass 2 använder eleverna mallarna Tallinjer i delar och Tomma tallinjer från 0 till 1, där det hela är lika långt som i bråkplanket och bitarna går att lägga mot linjen. På A4 är det hela 26 cm.
    - Skriv ut bråkstavarna, bråkplanket och tallinjerna på samma sorts papper, A4 eller A3 liggande, så att det hela är lika långt i allt. En köpt sats har ofta en längsta stav på 20 cm. Då lägger eleverna stavarna mot tejpen och inte mot mallarna. På mallen Tomma tallinjer från 0 till 2 är det hela 13 cm, hälften så långt som staven. Där ritar och räknar eleverna, och stavarna läggs mot tejpen.
    - Bladet Bråket på fyra sätt finns i planeringsmallarna och på lathundens tredje sida, Mallen. Stavarna är längre än rutorna, så i pass 1 gör eleven bråket på bordet och ritar det i rutan Med material. I rutan På tallinjen ritar eleven en egen liten tallinje med 0 och 1, och till 2 när bråket är större än 1.
    - Bladet Stapelrutan, med Jag vet, Jag söker och plats för stapeln, står under Kursens material och i planeringsmallarna och används i vecka 5 och till problemen i pass 3. Kopiera en per elev.
    - Korten, spelkorten och problemen står under Kursens material, en ram per vecka efter kartläggningen.
  kravText: "Ett bråk som du visar eller skriver på ett kort ska uppfylla tre krav:"
  krav:
    - rubrik: Finns i materialet
      text: Nämnaren finns bland stavarna i pass 1
    - rubrik: Mellan 0 och 2
      text: Bråket ryms på tallinjen
    - rubrik: Visar veckans fokus
      text: Det eleverna ska se den här veckan
progression:
  rubrik: "Kursplan: fem veckor och fem fokus"
  rader:
    - vecka: "1"
      fokus: "Lika delar: eleverna delar det hela i lika stora delar och lär sig orden nämnare och täljare. Du gör kartläggningen före första passet."
      roll: Läraren viker först och säger varje del.
    - vecka: "2"
      fokus: "Bråk på tallinjen: staven blir ett mått, och bråket får en plats mellan 0 och 2, också bråk större än 1."
      roll: Läraren lägger stavarna mot tallinjen och räknar delarna högt.
    - vecka: "3"
      fokus: "Likvärdiga bråk: bråk som hamnar på samma punkt är samma tal. Eleverna skriver tiondelar som decimaltal, och en halv, en fjärdedel och tre fjärdedelar i procent."
      roll: Läraren visar samma punkt och frågar hur eleverna vet.
    - vecka: "4"
      fokus: "Addera och subtrahera: eleverna räknar delar som är lika stora, byter till mindre delar och uppskattar först."
      roll: Läraren uppskattar högt innan hen räknar.
    - vecka: "5"
      fokus: "Bråk av antal: eleverna delar i lika stora grupper och hittar det hela när en del är känd. Du gör kartläggningen efter sista passet."
      roll: Läraren visar kort, och eleverna berättar mer själva.
uppfoljning:
  rader:
    - nar: Före insatsen
      vad: Gör kartläggningen med hela gruppen, cirka 30 minuter, utanför passen. Anteckna R för rätt svar och R+ när eleven också förklarar med rätt ord, med en bild eller på tallinjen, i kolumnen Före.
    - nar: Varje pass
      vad: Vem kunde säga vad nämnaren och täljaren betyder, och vem gjorde veckans vanliga fel?
    - nar: Efter fem veckor
      vad: Gör samma kartläggning igen och anteckna i kolumnen Efter på samma kopia. Jämför uppgift för uppgift och berätta för klassläraren vad som behöver mer träning.
mal:
  rubrik: "Mål: det eleven kan efter fem veckor"
  text: "Det här ska eleven kunna efter fem veckor. Kartläggningen visar det, före och efter:"
  punkter:
    - Dela en hel i lika stora delar och säga vad nämnaren och täljaren betyder
    - Sätta ut bråk på tallinjen mellan 0 och 2, också bråk större än 1
    - Jämföra bråk med hjälp av 0, en halv och en hel, och av det som fattas till en hel
    - Visa att två bråk är samma tal, skriva tiondelar som decimaltal och skriva en halv, en fjärdedel och tre fjärdedelar i procent
    - Addera och subtrahera bråk med samma nämnare, eller där den ena nämnaren går jämnt upp i den andra, och uppskatta svaret först
    - Räkna ut en del av ett antal, och hitta det hela när en del är känd
snabbmall:
  fore:
    - Vecka, fokus och pass (1, 2 eller 3)
    - Det första bråket och vad jag säger
    - Det sista bråket till Veckans mening
  efter:
    - Vem kunde säga vad nämnaren och täljaren betyder?
    - Vem gjorde veckans vanliga fel?
    - Vad visar jag igen nästa pass?
checklista:
  punkter:
    - Tagit fram dagens material och bladet Bråket på fyra sätt, som finns i planeringsmallarna.
    - Tejpat tallinjerna från vecka 2, en stavlängd mellan 0, 1 och 2.
    - Kopierat korten till dagens pass, en kopia per par, och klippt dem.
    - Gjort det första och det sista bråket och sagt orden högt.
    - Bestämt paren.
    - Hängt upp affischen.
grund:
  text: "Bråk är elevernas första möte med tal där det de vet om hela tal inte gäller, och den som läser bråket som två hela tal tror att 1/5 är större än 1/3 och att 1/3 + 1/4 är 2/7 (Siegler, Thompson och Schneider, 2011; Malone och Fuchs, 2017). Att se hur stort ett bråk är och var det står på tallinjen hänger ihop med bråkräkningen, och många elever i åk 5 kan färglägga 3/4 av en stapel men inte sätta ut 3/4 mellan 0 och 1 (Hannula, 2003). Därför går kursen från remsor och stavar till tallinjen, där likvärdiga bråk blir samma punkt och bråk större än 1 får en plats (Siegler m.fl., 2010; McIntosh, 2008; Holmberg och Kilhamn, 2016; Fuchs m.fl., 2021). Insatser som bygger på tallinjen, ett exakt matematiskt språk och en lärare som visar först har gett effekt både på elevernas förståelse av hur stora bråk är och på bråkräkning, också i åk 5 i Sverige (Fuchs m.fl., 2017; Schumacher m.fl., 2023; Björkhammer m.fl., 2023). Riktmärkena 0, en halv och en hel, och frågan om hur mycket som fattas till en hel, hjälper eleven att jämföra och uppskatta (Clarke och Roche, 2009; Kilhamn, 2021)."
  kallor: Bygger på Siegler m.fl. (2010), Siegler, Thompson och Schneider (2011), Hannula (2003), Clarke och Roche (2009), Clarke, Roche och Mitchell (2010), Malone och Fuchs (2017), Fuchs m.fl. (2017), Fuchs m.fl. (2021), Schumacher m.fl. (2023), Björkhammer m.fl. (2023), McIntosh (2008), Kilhamn (2021), Holmberg och Kilhamn (2016) och kursplanen i matematik i Lgr22 (Skolverket, 2022).
ramar:
  rubrik: Kursens material
  text:
    - Materialet är ordnat efter vecka, med kartläggningen först och sedan en ram per vecka. Varje ram börjar med en ruta Till läraren med materialet, det du visar först och säger i pass 1 och pass 2, veckans mening och det du lyssnar efter. En andra ruta, Till läraren om pass 3, har spelets regler och problemets lösning. Sedan kommer korten till pass 1, korten till pass 2 och spelkorten och problemet till pass 3, varje pass på en egen sida. Sist finns bladet Stapelrutan. Bladet Bråket på fyra sätt och mallarna Bråkplanket, Bråkplanket att fylla i, Bråkstavar att klippa, Tallinjer i delar och Tomma tallinjer står i slutet av planeringsmallarna.
    - Korten är elevmaterial och stora nog att hålla i handen. Kopiera korten till dagens pass, en kopia per par, klipp isär dem längs de streckade linjerna och lägg dem i en hög hos varje par. Varje kort har vecka och pass i hörnet, och meningskorten har också ett nummer, det som Lyssna efter hänvisar till. Den som läser ett kort läser det högt, och kamraten gör det. Den som har svårt att läsa kortet får hjälp av kamraten eller av dig. I Fyra sätt får varje elev ett kort med ett bråk ur samma hög.
    - Säg orden i rutan Till läraren som de står, och skriv bråket samtidigt som du säger det. På korten står bråken som du skriver dem och som i läroboken, med täljaren över bråkstrecket och nämnaren under. Läs det första kortet högt, så att eleverna hör hur bråken låter. I pass 2 ligger materialet kvar på bordet.
  ramar:
    # ---------------------------------------------------------------- Kartläggningen
    - rubrik: Kartläggning före och efter kursen
      text:
        - Eleverna gör samma tolv uppgifter före första passet och efter det sista, två för varje mål.
      huvud:
        - rubrik: Elevens namn
        - rubrik: Tecken
          text: R när svaret är rätt, på uppgift 8, 9 och 10 båda delarna. R+ när eleven också förklarar med rätt ord, en bild eller tallinjen. Tom ruta när svaret är fel.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: Gör kartläggningen med hela gruppen, cirka 30 minuter, utanför passen. Läs varje uppgift högt och hjälp inte till. Eleverna svarar på eget papper och får rita. Till uppgift 3 och 4 får varje elev mallarna Tomma tallinjer från 0 till 1 och från 0 till 2.
            - rubrik: Så antecknar du
              text: Skriv elevens namn överst på en kopia av listan. I kolumnen Före skriver du R när svaret är rätt och R+ när eleven också förklarar med rätt ord, med en bild eller på tallinjen. Plustecknet gäller uppgifterna som frågar hur eleven vet. Lämna rutan tom när svaret är fel. På uppgift 8, 9 och 10 kräver R att båda delarna är rätt. Efter kursen skriver du på samma kopia, i kolumnen Efter.
            - rubrik: Uppgifterna och målen
              text: Uppgift 1–2 prövar lika delar, 3–4 tallinjen, 5–6 att jämföra, 7–8 samma tal, decimaltal och procent, 9–10 att räkna och uppskatta, och 11–12 bråk av antal.
      listor:
        - rubrik: Kartläggning · Läs uppgiften högt, eleven svarar på papper
          kolumner:
            - Uppgift
