film:
  sekunder: 27.79
  beskrivning: "Den längsta staven är det hela: från 0 till 1. Lägg en fjärdedel från 0 och sätt ett streck där den slutar. Lägg fjärdedelarna en i taget och räkna. Ta en fjärdedel ur den andra satsen och lägg den efter 1."
  rubrik: "Så gör eleven"
  ingress: "Fyra bilder ur filmen om vad eleven gör vid bordet i vecka 2. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Det hela är lika långt som från 0 till 1."
    - text: "Lägg en fjärdedel från 0 och sätt ett streck: 1/4."
    - text: "Fyra fjärdedelar är lika långt som det hela: 1."
    - text: "En fjärdedel till ur den andra satsen: 5/4, förbi 1."
filmer:
  - nr: 2
    titel: "Bråket på fyra sätt"
    sekunder: 22.73
    beskrivning: "Bråket är tre fjärdedelar. Lägg det hela på bordet. Gör bråket med stavarna: tre fjärdedelar. Rita stavarna i rutan Med material. Rita det som en stapel i fyra lika delar. Sätt ut det på en egen liten tallinje från 0 till 1. Skriv bråket med siffror: bråkstrecket, nämnaren, täljaren."
    rubrik: "Fyra sätt: samma bråk fyra gånger"
    ingress: "Fyra bilder ur filmen om delen Fyra sätt, där eleven gör kortets bråk på bordet och visar det på bladet med material, som bild, på tallinjen och med siffror. Rutan På tallinjen fylls från vecka 2, när tallinjen kommer. Filmen på metodens sida visar samma sak i rörelse."
    efter: "steg 4"
    stillbilder:
      - text: "Gör 3/4 på bordet och rita stavarna i rutan."
      - text: "Som bild: en stapel i fyra lika delar, tre fyllda."
      - text: "På tallinjen: ett streck vid tre fjärdedelar."
      - text: "Med siffror: 3/4. Säg det: tre fjärdedelar."
