  pass:
    rubrik: "Vi kör ett pass: bråk på tallinjen"
    textRubrik: Gruppen · fem elever, åk 4–6, vecka 2, pass 1
    utskrift: Skriv ut passexemplet
    text:
      - "Läraren lägger fjärdedelar mot tallinjen på bordet: ”Här är en fjärdedel. Talet står vid strecket, där delen slutar.” Hen räknar till fyra fjärdedelar och säger: ”Fyra fjärdedelar är 1. Fem fjärdedelar, nu är vi förbi 1.”"
      - "Alla lägger fjärdedelar och räknar i kör. ”Var hamnar tre fjärdedelar?” frågar läraren. Amira pekar: ”Mellan en halv och 1.”"
      - "Läraren läser kortet ”Sätt ut 3/5. Är det mer eller mindre än en halv?” Hamza skriver 3/5 på tejpen mitt under staven. ”Var slutar tre femtedelar?” frågar läraren. Hamza sätter strecket vid slutet. Noah säger: ”Längre än halvan. Mer än en halv.”"
      - "Noah lägger 5/4 själv och säger: ”En och en fjärdedel.” Till sist lägger gruppen 7/4, och Elsa säger: ”Det har en plats mellan 1 och 2.” Läraren noterar att Hamza skrev bråket mitt under staven i stället för vid strecket."
    forberett:
      rubrik: Det jag förberedde
      text:
        - Tejpat en tallinje per elev, med en stavlängd mellan 0, 1 och 2. En sats bråkstavar per elev, halvor och fjärdedelar ur en extra sats till varje elev och till mig, dagens kort och spelkorten till Högst vinner, klippta. Lagt 5/4 och 7/4 själv och sagt orden högt.
    klarTidigt: Spela veckans spel, som heter Högst vinner. Båda vänder ett kort, och den som har det största bråket tar båda, men bara om hen säger varför.
    schema:
      rubrik: 60 minuter, steg för steg
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Ta fram dagens material, tejpa tallinjerna och klipp dagens kort. Gör passets första och sista bråk ur veckans ruta Till läraren, under Kursens material eller först i veckan i planeringsmallarna, och säg orden högt.
        - tid: 0–8
          fas: 1 · Första bråket
          vad: Visa bråket framför eleverna och säg vad det hela är, hur du delar och vad bråket heter.
        - tid: 8–18
          fas: 2 · Samma bråk
          vad: Alla gör bråket en gång till, ett handgrepp i taget, och räknar delarna i kör.
        - tid: 18–38
          fas: 3 · Korten
          vad: Läs ett kort. Paren gör och kontrollerar, sedan läser de för varandra.
        - tid: 38–50
          fas: 4 · Fyra sätt
          vad: "Var och en får ett kort, gör bråket på bordet och visar det på bladet Bråket på fyra sätt. Lyssna på en i taget. Fler än sex elever: halva gruppen i pass 1, resten i pass 2."
        - tid: 50–60
          fas: 5 · Veckans mening
          vad: Gör det sista bråket tillsammans och säg veckans mening.
