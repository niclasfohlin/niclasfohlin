lathund:
  innehall: Ett fokus i veckan
  metoden:
    text:
      - En intensiv kurs i fem veckor för två till tio elever i åk 4–6 som behöver stöd i att förstå bråk. Före första passet gör du kartläggningen.
      - "Veckorna: lika delar, bråk på tallinjen, likvärdiga bråk, addera och subtrahera, bråk av antal. Varje vecka har en mening som gruppen säger och sätter upp på väggen."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Visa först och säg bråket i ord.
          text: Vik, lägg och peka framför eleverna, och säg bråket med ord, som tre fjärdedelar.
        - fet: Fråga efter det hela.
          text: "Det hela är det som delas: remsan, staven, sträckan från 0 till 1 eller knapparna."
