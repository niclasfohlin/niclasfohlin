    kravEtikett: Bråkkrav
    var:
      rubrik: Var materialet finns
      punkter:
        - fet: Bråkstavar.
          text: Mallen Bråkstavar att klippa, två sidor, en av varje per elev på tjockt papper, eller en köpt sats per par. I vecka 2 också halvorna och fjärdedelarna ur en extra sats till varje elev och till dig.
        - fet: Remsor.
          text: A4-ark klippta på längden, lika långa som den längsta staven.
        - fet: Tallinjer.
          text: Tejp längs bordskanten, och mallarna Tallinjer i delar och Tomma tallinjer till pass 2.
        - fet: Kort och kartläggning.
          text: Under Kursens material på metodens sida, en ram per vecka med kartläggningen först. I planeringsmallarna skriver du ut veckans kort med veckans ruta Till läraren, där det du visar först, veckans mening och det sista bråket står.
      efter: Bråket på fyra sätt är lathundens tredje sida och står också i planeringsmallarna, efter diplomet och före Bråkplanket. Skriv ut det liggande, ett per elev, och laminera det gärna. Stavarna ryms inte i rutorna, så eleven gör bråket på bordet och ritar det. Skriv ut stavarna, planket och tallinjerna på samma sorts papper, A4 eller A3 liggande.
