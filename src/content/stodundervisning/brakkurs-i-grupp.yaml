    # ---------------------------------------------------------------- Vecka 1
    - rubrik: "Vecka 1: Lika delar"
      text:
        - Eleverna delar det hela i lika stora delar och lär sig orden nämnare och täljare. I pass 1 viker de remsor och jämför stavar, och i pass 2 skriver de bråk i Bråkplanket att fylla i och ritar staplar. Tallinjen kommer i vecka 2, så på bladet Bråket på fyra sätt är rutan På tallinjen tom den här veckan.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Material
              text: Remsor, två A4 per elev och pass, klippta i fyra. Bråkstavar, en sats per elev och en för dig. Bråkplanket att fylla i, en per elev till pass 2, och färgpennor. Till spelet fyra remsor per elev, sax och en tärning per par. I pass 2 ritar eleverna runt den längsta staven och delar stapeln med stavarna.
            - rubrik: Pass 1 · Visa först och säg
              text: "”Den här remsan är det hela. Jag viker den så att kanterna möts. De två delarna ligger precis på varandra, så de är lika stora. Varje del är en halv.” Vik igen och vik upp remsan: ”Nu är det fyra lika stora delar.” Peka på vikarna. ”Jag skriver bråkstrecket på remsan och fyran under: det hela är delat i fyra lika stora delar. Jag färglägger tre delar och skriver trean över: vi har tre sådana delar. Tre fjärdedelar.” Riv en remsa i tre olika långa bitar: ”Tre delar. Är det tredjedelar? Jag lägger bitarna under varandra, med kanterna mot samma linje. De är olika långa, så det är inga tredjedelar.”"
            - rubrik: Pass 2 · Visa först och säg
              text: "Rita en lång stapel på tavlan. ”Den här stapeln är det hela. Jag mäter och delar den i fem lika långa delar. Jag färglägger tre delar och skriver 3/5: det hela är delat i fem lika stora delar, och vi har tre sådana delar.” Rita en lika lång stapel under och dela den i tredjedelar. ”En tredjedel är längre än en femtedel. När det hela delas i fler delar blir varje del mindre. Därför är 1/3 större än 1/5, fast 3 är mindre än 5.”"
            - rubrik: Veckans mening
              text: "”Nämnaren säger hur många lika stora delar det hela är delat i, och täljaren säger hur många sådana delar vi har.”\nDet sista bråket: 5/8 med stavarna i pass 1 och 5/6 som stapel i pass 2."
            - rubrik: Lyssna efter
              text: "Eleven som kallar tre olika stora bitar för tredjedelar (pass 1, kort 3).\nEleven som säger att 1/5 är större än 1/3 eftersom 5 är större än 3 (pass 1, kort 4).\nEleven som säger att 1/8 är större än 1/6 (pass 2, kort 6)."
        - rubrik: Till läraren om pass 3
          falt:
            - rubrik: Spelet · Fyll det hela
              text: "Varje elev har en hel remsa och bitar klippta ur tre remsor: två halvor, fyra fjärdedelar och åtta åttondelar. Slå tärningen: 1 ger en halv, 2 eller 3 en fjärdedel, och 4, 5 eller 6 en åttondel. Lägg biten på den hela remsan och säg vilka bitar du har. Får biten inte plats står du över. Den som först har fyllt det hela utan luckor vinner."
            - rubrik: Lösningen och frågorna
              text: "Paren låter två remsor vara chokladkakorna. Varje barn får 2/3 av en kaka, en tredjedel av varje kaka. En annan väg: varje barn får först en halv, och halvan som blir över delas i tre, så att varje barn får 1/2 + 1/6 = 4/6 = 2/3. Säger någon 1/3, fråga vad det hela är. En tredjedel av båda kakorna är två tredjedelar av en kaka. I jämförelsen frågar du: ”Är 2/3 mer eller mindre än en halv? Vad är det hela?” Blir ett par klart tidigt: ”Fyra barn delar tre kakor. Hur mycket får varje barn?” Svaret är 3/4."
      listor:
        - rubrik: Vecka 1 · Pass 1 · Läs kortet, kamraten gör det med material
          rader:
            - - Vik en remsa i fyra lika stora delar. Färglägg tre fjärdedelar och skriv bråket.
            - - Visa 1/2 på två sätt.
            - - Riv en remsa i tre bitar. Är det tredjedelar? Hur vet du?
            - - Lägg en tredjedel och en femtedel bredvid varandra. Vilken är längst? Varför?
            - - Hur många sjättedelar behövs till det hela? Lägg dem på den längsta staven.
            - - Visa 2/3 med stavarna. Hur mycket fattas till det hela?
        - rubrik: Vecka 1 · Pass 2 · Läs kortet, kamraten ritar och skriver
          rader:
            - - Skriv bråket i en bit på varje rad i Bråkplanket att fylla i. Vilken rad har de minsta bitarna? Varför?
            - - Rita en stapel delad i fem lika stora delar. Färglägg 2/5. Hur många femtedelar är inte färglagda?
            - - Det hela är delat i åtta lika stora delar, och tre är färglagda. Rita och skriv bråket.
            - - Rita två lika långa staplar. Dela den ena i tredjedelar och den andra i sjättedelar. Vilken del är störst?
            - - "Skriv i storleksordning, minst först: 1/2, 1/10, 1/4, 1/3."
            - - Vilket är störst, 1/8 eller 1/6? Rita och förklara.
        - rubrik: Vecka 1 · Pass 3 · Problemet, läs högt och lös i par
          rader:
            - - Tre barn delar två chokladkakor lika. Hur mycket får varje barn?
    # ---------------------------------------------------------------- Vecka 2
    - rubrik: "Vecka 2: Bråk på tallinjen"
      text:
        - Bråket är ett tal med en plats på tallinjen. I pass 1 lägger eleverna stavarna mot en tallinje som är tejpad på bordet, så att staven blir ett mått. I pass 2 delar de tallinjer på papper, sätter ut bråk och räknar förbi 1. Talet står vid strecket där delen slutar.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Material
              text: En tallinje per elev, tejpad längs bordskanten från 0 till 2, med en stavlängd mellan 0 och 1 och mellan 1 och 2. Bråkstavar, en sats per elev, och halvorna och fjärdedelarna ur en extra sats till varje elev och till dig, så att de räcker förbi 1. Mallarna Tallinjer i delar och Tomma tallinjer från 0 till 1 och från 0 till 2 till pass 2. Spelkorten till Högst vinner, en kopia per par, klippta.
            - rubrik: Pass 1 · Visa först och säg
              text: "”Den här staven är det hela. Den börjar vid 0 och slutar vid 1.” Lägg en fjärdedel från 0, sätt ett streck där den slutar och skriv 1/4 vid strecket: ”Här är en fjärdedel. Talet står vid strecket, där delen slutar.” Lägg fjärdedelar en i taget, sätt ett streck där varje fjärdedel slutar och räkna: ”Två fjärdedelar, tre fjärdedelar, fyra fjärdedelar. Fyra fjärdedelar är 1.” Ta en fjärdedel till ur den andra satsen och lägg den efter 1: ”Fem fjärdedelar. Nu är vi förbi 1. Fem fjärdedelar är en och en fjärdedel.”"
            - rubrik: Pass 2 · Visa först och säg
              text: "Rita en tallinje från 0 till 1. ”Jag ska dela den i tredjedelar, tre lika stora delar. Då behöver jag två streck mellan 0 och 1. Jag räknar delarna och inte strecken: en, två, tre delar.” Skriv 1/3 och 2/3 vid strecken och 3/3 vid 1. Förläng linjen till 2: ”Fyra tredjedelar, fem tredjedelar, sex tredjedelar. Sex tredjedelar är 2.”"
            - rubrik: Veckans mening
              text: "”Ett bråk är ett tal med en egen plats på tallinjen.”\nDet sista bråket: 7/4 med stavarna på din tallinje i pass 1. I pass 2 sätter ni ut 3/2 på en tom tallinje från 0 till 2."
            - rubrik: Lyssna efter
              text: "Eleven som skriver bråket mitt på delen i stället för vid strecket där delen slutar (pass 1, kort 1).\nEleven som räknar strecken i stället för delarna och ritar fyra streck mellan 0 och 1 för att dela i fjärdedelar (pass 2, kort 1)."
        - rubrik: Till läraren om pass 3
          falt:
            - rubrik: Spelet · Högst vinner
              text: "Blanda spelkorten och dela dem lika. Båda vänder ett kort. Den som har det största bråket tar båda korten, men bara om hen säger varför, till exempel: ”5/4 är mer än 1, och 3/4 är mindre än 1.” Kan hen inte säga varför läggs korten åt sidan. Är ni osäkra lägger ni stavarna mot tejpen. Är bråken lika stora vänder ni ett kort till, och tar korten slut behåller var och en sitt. Den som har flest kort när korten är slut vinner."
            - rubrik: Lösningen och frågorna
              text: "Låt den längsta staven vara en meter. Snigeln kryper en fjärdedel i timmen, så efter sex timmar har den krupit 6/4 meter, alltså 1 2/4 eller 1 1/2 meter. Paren lägger fjärdedelar på tejpen och räknar timmarna. I jämförelsen frågar du: ”Är det mer eller mindre än en meter? Var är snigeln efter fyra timmar?” Blir ett par klart tidigt: ”Hur många timmar tar det för snigeln att krypa 2 meter?” Svaret är 8."
      listor:
        - rubrik: Vecka 2 · Pass 1 · Läs kortet, kamraten lägger stavarna mot tallinjen
          rader:
            - - Sätt ut 1/2, 1/4 och 3/4 med stavarna.
            - - Lägg tiondelar från 0 och sätt ut 1/10. Ligger det nära 0 eller nära 1?
            - - Lägg fjärdedelar från 0. Var slutar fyra fjärdedelar? Vilket tal står där på tejpen?
            - - Sätt ut 3/5. Är det mer eller mindre än en halv?
            - - Lägg halvor från 0 till 2. Hur många halvor går det på 2?
            - - Lägg fjärdedelar från 0 till 1 och fler efter 1. Sätt ut 5/4 och 6/4.
        - rubrik: Vecka 2 · Pass 2 · Läs kortet, kamraten ritar och skriver
          rader:
            - - Rita en tallinje från 0 till 1 och dela den i fjärdedelar. Sätt ut 3/4.
            - - Sätt ut 1/5 och 4/5 på en tallinje från 0 till 1. Vilket ligger närmast 1?
            - - Är 3/8 mer eller mindre än en halv? Visa på tallinjen.
            - - Räkna i fjärdedelar från 0 till 2 och skriv talen vid strecken.
            - - Sätt ut 7/5 på tallinjen. Skriv det med ett helt tal och ett bråk.
            - - Vilket är störst, 5/6 eller 1? Visa på tallinjen.
        - rubrik: Vecka 2 · Pass 3 · Spelkort till Högst vinner, klipp isär
          rader:
            - ["1/4", "3/4", "5/4", "7/4"]
            - ["1/2", "3/2", "1/3", "2/3"]
            - ["4/3", "3/5", "2/5", "1/10"]
            - ["9/10", "7/8", "3/8", "6/4"]
        - rubrik: Vecka 2 · Pass 3 · Problemet, läs högt och lös i par
          rader:
            - - En snigel kryper 1/4 meter varje timme. Hur långt har den krupit efter sex timmar?
    # ---------------------------------------------------------------- Vecka 3
    - rubrik: "Vecka 3: Likvärdiga bråk"
      text:
        - Bråk som hamnar på samma punkt är samma tal, fast de har olika namn. I pass 1 bygger eleverna samma längd med olika stavar och viker ett A4. I pass 2 använder de mallen Tallinjer i delar och dubblar täljaren och nämnaren. De skriver tiondelar som decimaltal, och en halv, en fjärdedel och tre fjärdedelar i procent.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Material
              text: Bråkstavar, en sats per elev, och tallinjen på bordet. Ett A4 per elev till kort 5 i pass 1. Mallen Tallinjer i delar och linjal till pass 2. Memorykorten, en kopia per par på tjockt papper, klippta.
            - rubrik: Pass 1 · Visa först och säg
              text: "Lägg en tredjedel mot tallinjen. ”Här är en tredjedel. Den slutar här.” Lägg två sjättedelar under: ”Två sjättedelar slutar på samma ställe. Lika långt, samma punkt. En tredjedel och två sjättedelar är samma tal.” Skriv 1/3 = 2/6. ”Varje tredjedel är delad i två sjättedelar. Det hela har dubbelt så många delar, och jag har dubbelt så många. Delarna är hälften så stora, så längden är densamma.” Lägg fyra tolftedelar under: ”Fyra tolftedelar slutar också där. Tre namn på samma tal.”"
            - rubrik: Pass 2 · Visa först och säg
              text: "Visa mallen Tallinjer i delar. Skriv 1/2, 2/4 och 4/8 vid strecken på linjerna i halvor, fjärdedelar och åttondelar. ”1/2, 2/4 och 4/8 står på samma punkt.” Skriv 1/2 och dubbla täljaren och nämnaren: ”Om du dubblar både uppe och nere händer inget med värdet, det är samma punkt.” Peka på linjen i tiondelar: ”5/10 står också där. Som decimaltal skriver jag 0,5: noll hela och fem tiondelar. Fem tiondelar är lika mycket som femtio hundradelar. Procent betyder per hundra, så en halv är 50 procent. En fjärdedel är hälften av en halv, 25 hundradelar. Det skriver jag 0,25 och 25 procent.”"
            - rubrik: Veckans mening
              text: "”Bråk som hamnar på samma punkt är samma tal, fast de har olika namn.”\nDet sista bråket: 2/3 och 4/6 med stavarna i pass 1, och 3/4 som 0,75 och 75 % i pass 2."
            - rubrik: Lyssna efter
              text: "Eleven som tror att 2/4 är större än 1/2 eftersom talen är större (pass 1, kort 1).\nEleven som dubblar bara täljaren eller bara nämnaren (pass 2, kort 2)."
        - rubrik: Till läraren om pass 3
          falt:
            - rubrik: Spelet · Memory med samma tal
              text: "Lägg korten upp och ned. Vänd två kort. Är de samma tal får du behålla dem, men bara om du säger varför, till exempel: ”2/8 och 0,25 är båda en fjärdedel.” Annars vänder du tillbaka dem. Första gången spelar ni med korten uppvända och parar ihop dem tillsammans."
            - rubrik: Lösningen och frågorna
              text: "Paren visar baguetterna med stavar eller på tallinjen. Ali och Bea har ätit lika mycket, en halv baguette var, eftersom 2/4 och 3/6 hamnar på samma punkt som 1/2. Cia har ätit mest, eftersom 5/8 är mer än 4/8. I jämförelsen frågar du: ”Hade svaret blivit detsamma om Cias baguette var kortare? Vad är det hela?” Blir ett par klart tidigt: ”Dan har en lika lång baguette och äter 3/4 av den. Har han ätit mer än Cia?” Svaret är ja, eftersom 6/8 är mer än 5/8."
      listor:
        - rubrik: Vecka 3 · Pass 1 · Läs kortet, kamraten bygger med stavarna
          rader:
            - - Lägg en halv. Bygg samma längd med fjärdedelar. Är 2/4 mer än 1/2?
            - - Bygg samma längd som 1/2 med åttondelar och med tiondelar.
            - - Lägg 3/4. Bygg samma längd med åttondelar.
            - - Lägg 2/5. Bygg samma längd med tiondelar.
            - - Vik ett A4 i halvor, sedan i fjärdedelar och sedan i åttondelar. Hur många åttondelar är en halv?
            - - Lägg 2/3 och 3/4 bredvid varandra. Vilket är längst? Hur mycket fattas till det hela för varje bråk?
        - rubrik: Vecka 3 · Pass 2 · Läs kortet, kamraten ritar och skriver
          rader:
            - - Titta på linjen i fjärdedelar och linjen i åttondelar på mallen Tallinjer i delar. Vilket bråk står på samma punkt som 3/4?
            - - Skriv två bråk som är lika mycket som 3/5. Visa på tallinjen att de står på samma punkt.
            - - Dubbla både täljaren och nämnaren i 1/4. Visa på tallinjen att det är samma punkt.
            - - Sätt ut 3/10 på linjen i tiondelar och skriv det som decimaltal.
            - - Skriv 1/4 som hundradelar och i procent. Förklara hur du vet.
            - - Vilket är störst, 3/4 eller 4/5? Hur mycket fattas till en hel?
        - rubrik: Vecka 3 · Pass 3 · Memorykort, klipp isär
          rader:
            - ["1/2", "2/4", "5/10", "0,5"]
            - ["50 %", "4/8", "1/4", "2/8"]
            - ["0,25", "25 %", "3/4", "6/8"]
            - ["0,75", "75 %", "1/3", "2/6"]
            - ["2/3", "4/6", "3/10", "0,3"]
        - rubrik: Vecka 3 · Pass 3 · Problemet, läs högt och lös i par
          rader:
            - - Ali, Bea och Cia har var sin baguette, och baguetterna är lika långa. Ali äter 2/4 av sin baguette, Bea äter 3/6 av sin och Cia äter 5/8 av sin. Vem har ätit mest?
    # ---------------------------------------------------------------- Vecka 4
    - rubrik: "Vecka 4: Addera och subtrahera"
      text:
        - Eleverna räknar delar som är lika stora. I pass 1 lägger de delar efter varandra, tar bort och byter en del mot mindre delar. I pass 2 uppskattar de först och räknar sedan på tallinjen. En summa blir alltid större än båda talen man lägger ihop.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Material
              text: Bråkstavar, en sats per elev, tallinjen på bordet och remsor och sax till kort 2 i pass 1. Mallarna Tallinjer i delar och Tomma tallinjer till pass 2. Spelkorten till Närmast en hel, en kopia per par, klippta.
            - rubrik: Pass 1 · Visa först och säg
              text: "”Jag lägger 3/8 mot tallinjen, tre åttondelar. Jag lägger 2/8 efter, två åttondelar till. Jag räknar delarna: fem åttondelar.” Skriv 3/8 + 2/8 = 5/8. ”Delarna är lika stora, så nämnaren är densamma. Täljaren räknar delarna.” Skriv 5/16 bredvid: ”Blir det fem sextondelar? En sextondel är hälften av en åttondel, så 5/16 är kortare än 3/8. Summan kan inte vara mindre än det jag började med.”"
            - rubrik: Pass 2 · Visa först och säg
              text: "”Jag ska räkna 1/2 + 1/4. Först uppskattar jag. En fjärdedel är mindre än en halv, så summan blir mindre än 1.” Använd linjen i fjärdedelar på mallen Tallinjer i delar. ”En halv är två fjärdedelar. Jag hoppar två fjärdedelar och sedan en fjärdedel till. Tre fjärdedelar.” Skriv 1/2 + 1/4 = 2/4 + 1/4 = 3/4. ”Tre fjärdedelar är mindre än 1, som jag uppskattade.”"
            - rubrik: Kortet om 2/7 (pass 2, kort 5)
              text: 1/3 + 1/4 är mer än 1/4 + 1/4, alltså mer än en halv. 2/7 är mindre än en halv, eftersom hälften av 7 är 3,5. Med tolftedelar blir summan 4/12 + 3/12 = 7/12.
            - rubrik: Veckans mening
              text: "”Vi räknar delar som är lika stora: tre åttondelar och två åttondelar är fem åttondelar.”\nDet sista bråket: 1/2 + 3/4 med stavarna i pass 1, med den längsta staven under. I pass 2 räknar ni 2 − 3/4 på en tom tallinje från 0 till 2. Båda blir 5/4."
            - rubrik: Lyssna efter
              text: "Eleven som lägger ihop både täljarna och nämnarna, så att 3/8 + 4/8 blir 7/16 (pass 2, kort 1).\nSamma fel gör att 3/4 + 3/4 blir 6/8 (pass 2, kort 6). Fråga: ”Blev summan större än talen du lade ihop?”"
        - rubrik: Till läraren om pass 3
          falt:
            - rubrik: Spelet · Närmast en hel
              text: "Blanda spelkorten och lägg dem i en hög. Båda tar tre kort och väljer två som tillsammans blir så nära 1 som möjligt. Säg först om summan blir mer eller mindre än 1 och räkna sedan, till exempel: ”3/4 är 6/8, och 6/8 och 3/8 är 9/8. En åttondel över.” Den som kommer närmast 1 får en poäng, och exakt 1 ger två poäng. Är ni lika nära får båda lika många poäng. Lägg korten under högen och ta tre nya. Spela åtta rundor. Den som har flest poäng vinner."
            - rubrik: Lösningen och frågorna
              text: "Maja har läst 5/8 av boken, eftersom 1/2 + 1/8 = 4/8 + 1/8 = 5/8. Då är 3/8 kvar. Paren lägger stavarna eller ritar en stapel för boken. I jämförelsen frågar du: ”Är det mer eller mindre än en halv som är kvar? Hur vet ni?” Blir ett par klart tidigt: ”Det som är kvar är 30 sidor. Hur många sidor har boken?” Svaret är 80."
      listor:
        - rubrik: Vecka 4 · Pass 1 · Läs kortet, kamraten lägger stavarna
          rader:
            - - Lägg 2/5 och 1/5 efter varandra. Hur mycket är det tillsammans?
            - - Klipp två remsor i fjärdedelar. Lägg 3/4 och 2/4 efter varandra. Är det mer än det hela? Hur mycket mer?
            - - Lägg det hela. Byt det mot åttondelar och ta bort 3/8. Hur mycket är kvar?
            - - Lägg 1/4 och 1/8 efter varandra. Byt fjärdedelen mot åttondelar. Hur mycket är det?
            - - Lägg 2/3 och 1/6 efter varandra. Byt tredjedelarna mot sjättedelar. Hur mycket är det?
            - - Lägg 7/10. Hur många tiondelar är 1/5? Ta bort så många. Hur mycket är kvar?
        - rubrik: Vecka 4 · Pass 2 · Läs kortet, kamraten ritar och räknar
          rader:
            - - Uppskatta först. Är 3/8 + 4/8 mer eller mindre än 1? Räkna sedan.
            - - Räkna 5/6 − 2/6 på tallinjen.
            - - Räkna 1 − 3/4. Skriv först 1 som fjärdedelar och visa på tallinjen.
            - - Räkna 1/2 + 3/8 på linjen i åttondelar.
            - - Kan 1/3 + 1/4 bli 2/7? Varför inte?
            - - Räkna 3/4 + 3/4 på tallinjen. Skriv svaret med ett helt tal och ett bråk.
        - rubrik: Vecka 4 · Pass 3 · Spelkort till Närmast en hel, klipp isär
          rader:
            - ["1/2", "1/4", "3/4", "1/8"]
            - ["3/8", "5/8", "7/8", "2/4"]
            - ["2/8", "4/8", "6/8", "1/8"]
            - ["3/8", "5/8", "1/4", "3/4"]
        - rubrik: Vecka 4 · Pass 3 · Problemet, läs högt och lös i par
          rader:
            - - Maja läser 1/2 av en bok på måndagen och 1/8 av boken på tisdagen. Hur stor del av boken har hon kvar att läsa?
    # ---------------------------------------------------------------- Vecka 5
    - rubrik: "Vecka 5: Bråk av antal"
      text:
        - Det hela är ett antal. Eleverna delar antalet i lika stora grupper och tar så många grupper som täljaren säger. I pass 1 arbetar de med knappar, och i pass 2 ritar de stapeln och räknar. Sist hittar de det hela när en del är känd.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Material
              text: Knappar eller centikuber, 24 per elev. Papper, linjal och bladet Stapelrutan till pass 2. Spelkorten till Ta din del av 24, en kopia per par, klippta.
            - rubrik: Pass 1 · Visa först och säg
              text: "”Det hela är 12 knappar. Jag ska ta 1/3. Nämnaren säger tre lika stora delar, så jag lägger knapparna i tre högar, en i taget, tills alla är slut.” Räkna högt medan du lägger. ”Fyra i varje hög. En tredjedel av 12 är 4.” Peka på två högar: ”Två tredjedelar är två högar, 8.”"
            - rubrik: Pass 2 · Visa först och säg
              text: "Rita en stapel. ”Stapeln är det hela, 20 kronor. Jag delar den i fem lika stora delar. En femtedel är 20 delat med 5, alltså 4.” Skriv 4 i varje del. ”Tre femtedelar är tre delar: 4 + 4 + 4 = 12. Tre femtedelar av 20 är 12.” Rita en ny stapel i fem delar och vänd på det. Skriv det du vet och det du söker bredvid: ”Två femtedelar är 16 kronor. Jag söker det hela. En femtedel är 8, och det hela är fem femtedelar, 40.”"
            - rubrik: Veckans mening
              text: "”När vi tar tre fjärdedelar av ett antal delar vi antalet i fyra lika stora delar och tar tre av dem.”\nDet sista bråket: 3/4 av 16 med knappar i pass 1, som blir 12, och 5/6 av 30 med en stapel i pass 2, som blir 25."
            - rubrik: Lyssna efter
              text: "Eleven som tar två eller tre knappar när kortet säger 2/3 av 15 (pass 1, kort 4).\nEleven som svarar 50 kr när frågan gäller vad tröjan kostar nu (pass 2, kort 4)."
        - rubrik: Till läraren om pass 3
          falt:
            - rubrik: Spelet · Ta din del av 24
              text: "Varje par har 24 knappar och spelkorten i en bunt med baksidan upp. Vänd ett kort och ta den delen av 24, till exempel: ”Tre åttondelar. 24 delat i åtta högar är 3 i varje, och tre högar är 9.” Kamraten kontrollerar med knapparna, och du får lika många poäng som du tog knappar. Lägg tillbaka knapparna, så att det hela är 24 varje gång. Den som har flest poäng efter fem kort var vinner."
            - rubrik: Lösningen och frågorna
              text: "Rita stapeln för klassen och dela den i fyra lika stora delar. Tre delar är 18 elever, så en del är 6 och hela klassen är 24. I jämförelsen frågar du: ”Hur många är inte på utflykt? Var ser ni dem i stapeln?” Blir ett par klart tidigt: ”2/3 av klassen äter lunch i skolan. Hur många är det?” Svaret är 16."
      listor:
        - rubrik: Vecka 5 · Pass 1 · Läs kortet, kamraten tar knapparna
          rader:
            - - Lägg 12 knappar i fyra lika stora högar. Hur många är 1/4 av 12?
            - - Hur många är 3/4 av 12? Lägg knapparna i högar först.
            - - Hur många är 1/2 av 18?
            - - Hur många är 2/3 av 15?
            - - Lägg 18 knappar. Hur många är 1/6? Hur många är 5/6?
            - - Fyra knappar är 1/3 av knapparna i en påse. Hur många knappar är det i påsen?
        - rubrik: Vecka 5 · Pass 2 · Läs kortet, kamraten ritar och räknar
          rader:
            - - Rita en stapel för 32 elever och dela den i fyra lika stora delar. Hur många är 1/4 av 32?
            - - Hur många är 3/4 av 32?
            - - Rita stapeln. Hur många är 2/5 av 30?
            - - En tröja kostar 200 kr. Priset sänks med 1/4. Hur mycket sänks priset? Vad kostar tröjan nu?
            - - 1/3 av eleverna går hem. Det är 9 elever. Hur många elever är det i allt?
            - - Hur mycket är 25 % av 40 kr? Tänk en fjärdedel.
        - rubrik: Vecka 5 · Pass 3 · Spelkort till Ta din del av 24, klipp isär
          rader:
            - ["1/2", "1/3", "2/3", "1/4"]
            - ["3/4", "1/6", "5/6", "1/8"]
            - ["3/8", "5/8", "7/8", "5/12"]
        - rubrik: Vecka 5 · Pass 3 · Problemet, läs högt och lös i par
          rader:
            - - 3/4 av klassen är på utflykt. Det är 18 elever. Hur många elever är i klassen?
    # ---------------------------------------------------------------- Stapelrutan (källans Mall 4)
