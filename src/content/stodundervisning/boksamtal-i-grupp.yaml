# Metod i stödundervisning. Modellen står i src/content.config.ts och mallen i _mall.yaml.
# Texten är Niclas egen, ur kompendiet för läsförståelse åk 4–9 (2026).
# Omtaget 2026-10-10 (intake/ARBETSORDER-boksamtal-2026-10-10.md, analysen i analys-omtag-2026-10.md): en hel bok
# tillsammans, med bokvalet, läspasset i fyra delar, bokens tavla, slutet och tio böcker på var och en av tre nivåer.
# Omtaget av kärnan 2026-10-11 (intake/ARBETSORDER-boksamtal-karnan-2026-10-11.md): passet nämner sakerna, och bokens
# tavla, post-it-lapparna och frågekortet förklaras hela i var sin del efter passet. Sedan kommer det eleverna tar över
# och det som gäller en större grupp. Progressionen står som den fria tabellen Eleverna tar över, intill passet.
# Efter de första rundorna 2026-10-11 (out/boksamtal-i-grupp/beslut-karnan-rundor-2026-10-11.md): paret först, tre
# samtalsregler som gruppen tar en i taget, och strukturen Talkort på en egen sida (Niclas 2026-10-11, sökning 10).
# Efter helhetens rundor 2026-10-11 (out/boksamtal-i-grupp/beslut-karnan-helheten-2026-10-11.md): tabellen Perioden är
# periodens karta, läspass 1 har en egen tabell, och perioden står i tidsordning efter exemplet.
# Sidorna om nivåerna och litteraturlistorna skrivs in ur bocker/ med node methods/boksamtal-i-grupp/bocker/infor.mjs.
titel: Chambers boksamtal i grupp
undertitel: En hel bok tillsammans i liten grupp, med högläsning och samtal om boken, för åk 4–9
ingress: En liten grupp i åk 4–9 läser en hel bok tillsammans och lär sig att hålla ihop berättelsen över flera veckor. Du läser högt, och eleverna följer med i sina egna exemplar. I samtalet använder ni Aidan Chambers ”Jag undrar” och hans fråga ”Hur vet du det?” Bokens tavla på väggen växer från pass till pass.
omrade: Läsning
arskurs:
  - 4-6
  - 7-9
taggar:
  - lasforstaelse
  - textsamtal
  - lasframjande
  - lektionsupplagg
format:
  - liten grupp
  - helklass
tid: 40 minuter per pass, två till tre pass i veckan
period: Fem till tio veckor, en bok
grupp: Fyra till tio elever
material:
  - ett exemplar av boken per elev
  - bokens tavla
  - post-it och ett frågekort
uppdaterad: 2026-10-26
relaterade:
  - textsamtal-i-grupp
  - faktatextsamtal-i-grupp
  - til-i-grupp
utkast: false
nivaer:
  - { namn: Bas, farg: "4E7A43" }
  - { namn: Medel, farg: "A8742A" }
  - { namn: Avancerat, farg: "6E3450" }
inledning:
  - Chambers boksamtal i grupp är en lärarledd insats där fyra till tio elever i åk 4–9 läser en hel bok tillsammans och samtalar om den. Den är för elever som behöver stöd i läsförståelsen, och för den som aldrig har läst ut en bok som andra pratar om. Eleven lär sig att hålla ihop en berättelse över flera veckor och att samtala om den, som läsare gör.
  - Du läser högt, och varje elev följer med i sitt eget exemplar av boken. På väggen sitter bokens tavla, en tavla för hela boken, oftast ett blädderblocksark. I din bok sitter en post-it som du har skrivit före passet, på ett ställe där texten blir svår. Varje elev har en egen, tom post-it och sätter den under läsningen där hen vill säga något. När ni samtalar ligger frågekortet mitt på bordet, med Aidan Chambers fyra frågor, och var och en väljer en.
  - Varje läspass börjar och slutar vid tavlan. Först säger var och en till den bredvid vad som hände förra gången, en elev berättar för gruppen, och alla gissar vad som händer nu. Sedan läser du i drygt 20 minuter. I samtalet slår alla upp boken vid sin post-it och säger en sak var, först till den bredvid. Gruppen följer sedan en tråd med Chambers fråga ”Hur vet du det?” Sist säger eleverna dagens rad. Du skriver den på tavlan, och en ny fråga när ni har en. Frågan står kvar tills boken svarar, och då får den en bock. Ingen sitter på de rätta svaren, inte ens du.
  - "Perioden är en bok. Metoden har tre nivåer med tio böcker på varje. Före bokvalet gör du läsintervjun, ett kort samtal med varje elev, och väljer två av böckerna. I bokvalet väljer gruppen en av dem. Perioden slutar med ett samtal om hela boken, och var och en skriver ett boktips till en läsare. Hur lång perioden blir beror på boken: Nattkorpen av Johan Rundberg tar omkring 12 läspass, och Momo eller kampen om tiden av Michael Ende omkring 27."
upplagg:
  rubrik: Så fungerar insatsen
  text: "Fyra till tio elever läser en hel bok tillsammans, 40 minuter per pass och två till tre pass i veckan. Perioden är fem till tio veckor, från bokvalet till slutsamtalet och boktipset. Före den behöver du en till tre veckor till läsintervjuerna och böckerna. Läspasset har fyra delar: Var är vi?, Läs, Samtala och Med mig. Du läser högt i drygt 20 minuter, eleverna följer med i sina böcker, och bokens tavla håller ihop berättelsen. Läsintervjun före och efter boken, och det eleven säger i passen, visar om hen håller ihop berättelsen och kan säga var i boken en tanke kommer ifrån."
gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Metoden är för elever som kan avkoda men läser långsamt och tappar sammanhanget, och för den som aldrig har läst ut en bok som andra pratar om. Eleven behöver kunna förstå en berättelse som hen hör och orka lyssna och följa med i boken i drygt 20 minuter. Den som avkodar mödosamt kan vara med, eftersom du läser högt: hen lyssnar och hittar tillbaka i texten när du säger sidnumret. Avkodning och läsflyt tränar hen vid sidan av boken. Gruppen har fyra till tio elever. Är ni fler än fem, samtalar ni i två grupper, och hur ni gör står under Fler än fem."
principer:
  rubrik: Tre saker att hålla fast vid
  text: Läs mycket och med få avbrott. Stanna bara vid din post-it, högst två gånger per pass, och när någon har tappat bort sig, så att boken får det mesta av passet. Bär frågorna med er. Gruppens frågor står på tavlan tills boken svarar, och i slutsamtalet ser ni vilka som fick svar. Fråga ”Hur vet du det?”, och säg ”Jag undrar” i stället för ”Varför”. Då går eleverna tillbaka till boken, och ingen sitter på facit.
tabeller:
  - rubrik: "Perioden: en bok från bokvalet till boktipset"
    plats: efter-inledning
    meny: true
    text: "Perioden har tre slags pass: bokvalet, läspassen och slutet. Tabellen visar perioden i tidsordning, med det som är nytt och var det står. Den säger när något tidigast kommer, och gruppen avgör takten. I en bok med högst tolv läspass hinner ni till raden Från läspass 6. Raden Från läspass 10 väntar till nästa bok. Då börjar ni där ni slutade."
    kolumner:
      - När
      - Det som är nytt
      - Här står det
    rader:
      - - Före bokvalet
        - Du gör läsintervjun, fem minuter per elev, läser de två böckerna och reserverar exemplar. Räkna med en till tre veckor.
        - Följ upp effekten · Var hittar du böckerna och läsplanen?
      - - Bokvalet
        - Gruppen får se två böcker och röstar. Du läser början av den som vann.
        - "Första passet: bokvalet"
      - - Läspass 1
        - Du visar allt för första gången och läser kortare. I samtalet räcker laget runt.
        - Läspass 1
      - - Läspass 2 och 3
        - Tråden, den första samtalsregeln och protokollet. Från läspass 3 samtalar ni i två grupper, om ni är fler än fem.
        - Samtalsreglerna · Fler än fem · Följ upp effekten
      - - Från läspass 4
        - En elev skriver på tavlan. Nästa samtalsregel tar ni när den förra syns i samtalet, tidigast i läspass 5.
        - Eleverna tar över · Samtalsreglerna
      - - Från läspass 6
        - En elev leder Var är vi? vid tavlan. I bokens andra halva berättar eleverna vad som har hänt hittills.
        - Eleverna tar över
      - - Från läspass 10
        - En elev leder laget runt, senare också tråden.
        - Eleverna tar över
      - - Det sista läspasset
        - Du läser ut boken. I stället för samtalet säger alla ett ord om boken och skriver upp den på sitt kort Böcker jag har läst ut.
        - "Sista passet: slutet"
      - - Slutet
        - Slutsamtalet om hela boken, och boktipset.
        - "Sista passet: slutet"
      - - Efter slutet
        - Du gör läsintervjun igen, omkring tio minuter, och ni väljer elevens nästa bok.
        - Följ upp effekten
    not: När boken är vald gör du läsplanen och skriver in det som är nytt i ett läspass. Hur du gör står i avsnittet Var hittar du böckerna och läsplanen?
  - rubrik: Varför en hel bok blir svår, och vad metoden gör
    plats: efter-inledning
    text: Sex saker gör det svårt att läsa en hel bok tillsammans och samtala om den. Tabellen visar vad metoden gör åt var och en.
    kolumner:
      - Det som händer
      - Så kan det låta
      - Så gör metoden
    rader:
      - - Eleven tappar sammanhanget mellan passen
        - ”Var var vi?” ”Vad hände förra gången?”
        - Passet börjar vid bokens tavla. Var och en säger till den bredvid vad som hände, och en elev berättar med raderna som stöd.
      - - Eleven blandar ihop personerna och tappar bort sig vid ett tidshopp
        - ”Vem är han?”
        - Personerna står på tavlan, med streck mellan dem som hör ihop. Du stannar vid din post-it där texten blir svår.
      - - Eleven kommer inte in i boken eller tröttnar
        - ”Tråkigt.” ”Kan vi inte bara läsa?”
        - Gruppen väljer boken i bokvalet. I läspasset läser du drygt 20 minuter med få avbrott.
      - - Eleven glömmer sin fråga innan boken svarar
        - ”Vad var det vi undrade?”
        - Frågorna står på tavlan och får en bock när boken svarar.
      - - Samtalet blir ett referat eller ett förhör
        - ”Den var bra.” ”Först kom han, sen gick de.”
        - Var och en säger en sak med boken uppslagen vid sin post-it, och gruppen väljer tråden ur det eleverna sa.
      - - Eleven vågar inte säga sin tanke, eller talar bara med dig
        - ”Jag vet inte.” ”Samma som hon.”
        - Var och en säger sin sak till den bredvid först, och gruppen tar tre samtalsregler, en i taget.
  - rubrik: "Bokens tavla: en tavla för hela boken"
    plats: efter-arbetsform
    text: Ni har samma tavla hela boken, och den sitter kvar från bokvalet till slutet. Den har tre rutor, med frågor till varje ruta. I Var är vi? börjar passet med att ni läser tavlan, och i Med mig slutar det med att ni fyller på den.
    kolumner:
      - Rutan
      - I rutan står
      - När passet börjar
      - När passet slutar
    rader:
      - - Det här har hänt
        - En rad per läspass, med passets nummer. Hoppar boken i tiden, står det först på raden, som ”Två år senare”.
        - ”Vad hände förra gången?”
        - ”Vad hände i dag, i en mening?”
      - - Personerna
        - Namnet, några ord om vem det är och ett streck mellan dem som hör ihop.
        - Du pekar på namnen medan eleven berättar.
        - ”Kom det någon ny?”
      - - Frågorna vi bär med oss
        - Det gruppen undrar och boken inte har svarat på än. Frågan som fick svar får en bock, gärna med sidnumret.
        - Ni läser dem som inte har en bock. ”Vad tror du händer nu?”
        - ”Har boken svarat på någon fråga?” ”Vad undrar vi nu?”
    not: Eleverna turas om att berätta, med raderna som stöd. Blir dagens rad en detalj, fråga ”Vem var viktigast i dag, och vad hände?” Frågorna på tavlan är gruppens egna. Den första säger du själv, från din post-it, och sedan kommer de från eleverna. En fråga som ingen kan svara på än är bra. Du pekar på tavlan när någon undrar vem en person är.
  - rubrik: "Tavlans form: välj efter rummet"
    plats: efter-arbetsform
    text: Grundformen är ett blädderblocksark på väggen. Tavlan ska sitta kvar mellan passen, och alla ska se den medan ni läser och samtalar, så välj en annan form om rummet kräver det.
    kolumner:
      - Formen
      - Passar när
      - Tänk på
    rader:
      - - Blädderblock
        - Arket får sitta kvar, eller du rullar ihop det och samtalsreglerna och tar dem med dig.
        - Rutan Det här har hänt rymmer omkring tio rader. Sedan fortsätter ni på ett ark bredvid, med de gamla raderna i en mening överst.
      - - Whiteboard
        - Rummet är gruppens eget.
        - Skriv ”Låt stå” på tavlan.
      - - Skärm, som smartboard eller projektor
        - Skärmen är på i varje pass.
        - Mallen Bokens tavla är en tabell som du skriver i. Strecken går inte att dra där, så skriv på personens rad vem hen hör ihop med.
      - - Laminerad A3 med whiteboardpenna
        - Du går mellan rum, boken är kort och ni är högst fem.
        - Arket ligger på bordet, och raderna suddas lätt ut i en väska.
    not: Fotografera tavlan efter varje pass, vilken form du än väljer. Då har du den kvar om något suddas, och den som var borta kan se bilden.
  - rubrik: "Post-it-lapparna: din före passet, elevens under läsningen"
    plats: efter-arbetsform
    text: Metoden har två slags post-it. Din skriver du före passet, och elevens är tom.
    kolumner:
      - Om den
      - Din post-it
      - Elevens post-it
    rader:
      - - När
        - Före passet, när du läser om dagens sidor.
        - Du delar ut den när ni börjar läsa, och eleven sätter den medan du läser.
      - - Hur många
        - En per läspass, högst två.
        - En per läspass. De sitter kvar tills boktipset är klart. Eleven trycker in de gamla mot sidan, så att bara dagens sticker ut.
      - - Var
        - I din bok, där texten blir svår, som vid ett tidshopp, en ny person eller ett ord som berättelsen hänger på. I bokens andra halva också där något från en tidigare rad på tavlan kommer tillbaka.
        - I elevens bok, i kanten vid det ställe där hen vill säga något, som vid något hen gillar, undrar över eller inte förstår.
      - - Det står på den
        - "Sidan och tre rader: Jag undrar, Det står och Jag tror."
        - Ingenting. Eleven skriver inte på den, och får flytta den till ett bättre ställe.
      - - Så används den
        - I Läs stannar du vid den och säger de tre raderna på under en minut. Vid ”Det står” läser du meningen ur boken och pekar på den.
        - I Samtala slår eleven upp boken vid dagens post-it och säger sin sak där, först till den bredvid och sedan till gruppen.
      - - I Momo
        - ”Jag undrar om man kan spara tid på en bank. Det står”, och så läser du meningen om att lägga in tid och få tillbaka den. ”Jag tror inte att det går.”
        - Ella sätter sin när en ny person kommer in. I samtalet säger hon ”Här slutade jag förstå. Vem är han?”
    not: Den som inte har satt sin post-it när läsningen är slut gör det när du lägger fram frågekortet. Hen säger sitt sist. Den som har satt sin vid något hen inte förstod hjälper gruppen mest, och det stället tar ni först i tråden. Varje elev har samma exemplar varje pass, med en namnlapp innanför pärmen, så att hen har kvar sina ställen till slutsamtalet och boktipset.
  - rubrik: "Samtalet med frågekortet: fyra steg"
    plats: efter-arbetsform
    text: Här står Samtala steg för steg. Frågekortet har Chambers fyra grundfrågor, som står under tabellen. Ni har ett kort per samtalsgrupp. Det är en hjälp att komma i gång och ingen lista att gå igenom (Chambers, 1993).
    kolumner:
      - Steg
      - Det som händer
      - Du säger
    rader:
      - - 1 · Lägg fram
        - Du lägger kortet mitt på bordet, och de första passen läser du frågorna högt. Alla slår upp boken vid dagens post-it och väljer en av kortets frågor.
        - ”Slå upp boken vid din post-it.”
      - - 2 · Laget runt
        - "Först säger var och en till den bredvid om gissningen stämde, och säger sin sak. I laget runt säger en i taget sin sak till gruppen, och de andra lyssnar."
        - ”Stämde din gissning? Säg det till den bredvid, och säg din sak.” ”Vem börjar?”
      - - 3 · Tråden
        - Har någon sagt att hen inte förstod, tar ni det stället först. De två som sa något som hänger ihop säger sedan mer, och de andra bygger vidare.
        - ”Vi tar Ellas ställe först. Vem kan visa?” ”Sa två av er något som hänger ihop?”
      - - 4 · Tillbaka till boken
        - Eleven visar var det står och läser meningen, eller låter dig läsa den. Kan ingen förklara det någon inte förstod, läser du om stället.
        - ”Hur vet du det? Visa i boken.”
    not: "Kortets frågor är ”Var det något du gillade?” och ”Var det något du inte gillade?”, ”Var det något du inte förstod eller undrade över?” och ”Lade du märke till något mönster eller någon koppling?” Förklara orden första gången: ett mönster är något som kommer tillbaka, som tre bröder och tre prov i en saga, och en koppling är något som boken påminner om. De första passen säger du efter laget runt kort vad var och en sa, så att gruppen ser hur man hittar en tråd. Ser ingen något som hänger ihop, säger du vilka två som sa det. Det ni fortfarande undrar över blir en fråga på tavlan. Det du säger i stegen står också på kortet Du som leder, med ”Vad tar vi med oss till tavlan?” sist."
  - rubrik: "Första passet: bokvalet"
    plats: efter-fastnar
    meny: true
    text: I bokvalet väljer gruppen själv vilken bok ni ska läsa, och då blir boken gruppens egen. Välj två böcker ur nivåns lista efter det eleverna sa i läsintervjun om vad de gillar. Sidan om nivån föreslår böcker som går bra ihop. De två ska vara ungefär lika långa men olika i genre, miljö eller ton. Båda ska passa gruppen, och du ska ha läst dem. På bordet räcker ett exemplar av varje bok per elevpar, men till läspass 1 behöver varje elev den bok gruppen väljer. Reservera därför ett exemplar per elev av båda. Av den bok som inte vann behåller du några exemplar och lämnar tillbaka resten. Tavlan gör du i ordning sist i bokvalet, i den form du har valt.
    kolumner:
      - Tid och del
      - Vad händer
      - Du säger
    rader:
      - - "0–10 · Två böcker"
        - Du visar omslagen, berättar kort om böckerna och läser första sidan ur båda. Paren följer med i böckerna.
        - ”Vi ska läsa en hel bok, en riktig bok som andra i er ålder läser.”
      - - "10–20 · Baksidorna"
        - Paren läser baksidorna och tips från en tidigare grupp, om sådana finns.
        - ”Vad lockar dig? Vad undrar du?”
      - - "20–25 · Rösta"
        - Gruppen röstar med röstsedlar i en låda, en röst var. Blir det lika läser du en sida till ur båda, och gruppen röstar igen.
        - ”Skriv bokens namn på röstsedeln.”
      - - "25–40 · Början"
        - Visa gärna en bild av platsen där boken utspelar sig. Du läser början, och paren följer med. Du ritar tavlans tre rutor och skriver bokens namn överst.
        - ”Den andra boken står kvar här, och den kan bli nästa bok.”
    not: Blir det lika två gånger, avgör du och säger varför. Den bok som inte vann står kvar i rummet och går att låna hem. Efter bokvalet gör du läsplanen.
  - rubrik: "Läspass 1: allt visas första gången"
    plats: efter-fastnar
    meny: true
    text: Läspass 1 börjar där du slutade läsa i bokvalet. Passet har samma fyra delar som de andra, men du visar allt för första gången. Därför läser du kortare, och i samtalet räcker laget runt.
    kolumner:
      - Tid och del
      - Vad händer
      - Du säger
    rader:
      - - 0–5 · Var är vi?
        - Tavlans rutor är tomma, så ni berättar början tillsammans. Var och en säger till den bredvid vad hen tror händer nu.
        - ”Vad hände i början?” ”Vad tror du händer nu?”
      - - 5–23 · Läs
        - Du visar din post-it i din bok och delar ut en post-it var. Efter ett par minuter läser du i en kvart och stannar vid din post-it. Eleverna följer med och sätter sin post-it.
        - ”Sätt din post-it där du vill säga något.” ”Jag undrar”, ”Det står” och ”Jag tror”
      - - 23–35 · Samtala
        - Du lägger fram frågekortet, läser frågorna högt och förklarar mönster och koppling. Var och en väljer en fråga och säger sin sak till den bredvid, och sedan till gruppen.
        - ”Stämde din gissning?” ”Allt du tänker om boken är värt att säga.” ”Vem börjar?”
      - - 35–40 · Med mig
        - Eleverna säger den första raden och den första personen, och du skriver. Den första frågan säger du själv, från din post-it.
        - ”Vad hände i dag, i en mening?”
    not: Tråden och ”Hur vet du det?” kommer i läspass 2. Då skriver ni också den första samtalsregeln på arket, den du sa i läspass 1, och du läser lite kortare. Är ni fler än fem, räcker laget runt i läspass 2 också, och tråden kommer när ni har delat er, tidigast i läspass 3.
  - rubrik: "Samtalsreglerna: tre regler, en i taget"
    plats: efter-fastnar
    meny: true
    text: "Många elever talar till dig och väntar på nästa fråga. De behöver lära sig att tala med varandra. Tre saker hjälper dem: paret först, tre samtalsregler som gruppen tar en i taget, och talkort när några få talar mest. Reglerna står på ett blädderblocksark bredvid tavlan, som i tabellen."
    kolumner:
      - Regeln
      - Se
      - Höra
    rader:
      - - 1 · Allt vi tänker om boken är värt att säga.
        - Vi har boken uppslagen vid vår post-it och visar stället.
        - ”Jag tänker på sidan där Fusi kommer in.” ”Jag undrar vem han är.” ”Pass, kom tillbaka till mig.”
      - - 2 · Vi bygger vidare på det någon sa.
        - Vi vänder oss mot den som talar och väntar tills hen har talat färdigt.
        - ”Jag håller med dig, för han har bråttom.” ”Jag tänker annorlunda, för han ville spara tid.” ”Hur vet du det?”
      - - 3 · Vi bjuder in varandra.
        - Vi vänder oss till den som inte har sagt något än.
        - ”Vad tycker du?” ”Håller du med?” ”Tycker du likadant eller annorlunda?”
    not: "En regel tar ni före samtalet, på omkring fem minuter: fråga ”Vad är viktigt när man samtalar om en bok?”, säg regeln och låt gruppen säga den med egna ord. Skriv den på arket, och fyll i Se och Höra tillsammans. Läs kortare det passet. De första passen med regeln frågar du sist i Samtala ”Vad gjorde vi bra i samtalet i dag?”, och säger en sak du hörde. Den första regeln sa du redan i läspass 1, och i läspass 2 skriver ni den. Nästa regel tar ni när den förra syns och hörs i samtalet utan att du påminner, tidigast tre läspass senare. Arket följer med till nästa bok."
  - rubrik: "Samtalet mellan eleverna: det du gör"
    plats: efter-fastnar
    text: Reglerna är gruppens, och det här är din del.
    kolumner:
      - Du vill att de
      - Det du gör
      - Du säger
    rader:
      - - vågar säga sitt
        - Låt den som vill vänta säga ”Pass”, och kom tillbaka sist. Då kan hen visa sitt ställe och låta dig läsa meningen.
        - ”Jag kommer tillbaka till dig.”
      - - svarar på varandra
        - När en regel är ny prövar paren den först, och den som lyssnar svarar med en fras från arket. I gruppen väntar du tre sekunder, så att en kamrat hinner svara.
        - ”Vem vill bygga vidare på det Noor sa?” ”Du byggde vidare på det Elias sa.”
      - - kommer in i tråden
        - Säg vad du ser när en elev bjuder in en kamrat. Talar några få mest, ger du alla ett talkort.
        - ”Du frågade vad Sara tyckte.”
    not: Ett talkort är ett tomt kort eller en bit papper, ett per elev. Visa korten själv första gången, med sidan om Talkort på bordet, och ta bort dem när alla kommer in i tråden ändå. Fråga inte en elev inför gruppen varför hen är tyst, och beröm inte stort när hen säger något. Säger en elev ingenting i gruppen efter några veckor, ta upp det med elevhälsan.
  - rubrik: "Eleverna tar över: en bit i taget"
    plats: efter-fastnar
    meny: true
    text: "I början leder du allt. Sedan tar eleverna över, det minsta först. Gå vidare när gruppen klarar steget utan din hjälp, och gå tillbaka ett steg när den inte gör det längre. Du läser alltid själv."
    kolumner:
      - Det du gjorde
      - Det eleverna gör nu
      - Ungefär när
    rader:
      - - 1 · Du höll pennan.
        - En elev skriver ett namn, drar ett streck eller sätter bocken, och senare hela raden.
        - tidigast läspass 4
      - - 2 · Du frågade ”Hur vet du det?”
        - Eleverna frågar varandra, och du väntar.
        - från regel 2, tidigast läspass 5, i paret
      - - 3 · Du ledde Var är vi?
        - En elev ställer de två frågorna vid tavlan.
        - tidigast läspass 6
      - - 4 · Du ledde samtalet.
        - En elev leder laget runt med kortet Du som leder, senare också tråden.
        - tidigast läspass 10
    not: Är ni fler än fem, gäller stegen den grupp där du sitter. Leder en elev samtalet i läspassen, leder en elev också laget runt i slutsamtalet. I bokens andra halva byter du frågan i Var är vi? till ”Vad har hänt hittills?” De två första gångerna berättar du själv på en halv minut vem boken handlar om och de tre eller fyra viktigaste raderna. Sedan berättar eleverna så, till den bredvid och för gruppen, gärna först utan tavlan. Den som inte vill stå vid tavlan berättar från sin plats.
  - rubrik: "Fler än fem: två samtalsgrupper"
    plats: efter-fastnar
    meny: true
    text: Laget runt med sex elever tar för lång tid. Är ni fler än fem, delar ni er i två samtalsgrupper när Samtala börjar, med högst fem i varje. Resten av passet och slutsamtalet gör ni tillsammans.
    kolumner:
      - Frågan
      - Svaret
    rader:
      - - Från när?
        - Tidigast i läspass 3. Före det samtalar alla tillsammans, och då räcker laget runt.
      - - Var sitter du?
        - Med den ena gruppen, och du byter grupp varje pass, så att du hör båda.
      - - Vem leder den andra?
        - En elev som vill läser upp kortet Du som leder, en rad i taget. I början hoppar hen över rad 5 och 6, som är tråden. Nästa pass läser en annan. Vill ingen, läser gruppen kortet tillsammans.
      - - Vad gör gruppen utan dig?
        - Laget runt och, om tiden räcker, ett varv till med en annan av frågekortets frågor. Gruppen följer en tråd först när den klarar tråden de pass du sitter med, gärna med talkort.
      - - Vad tar gruppen med sig?
        - En fråga till Med mig, när den har en.
    not: Varje samtalsgrupp har ett eget frågekort och ett eget kort Du som leder, som står bland materialet. Blanda grupperna, så att varje grupp har någon som gärna börjar. Metoden fungerar också i helklass. Då läser du för alla, och klassen samtalar i grupper om tre till fem.
  - rubrik: "Sista passet: slutet"
    plats: efter-fastnar
    meny: true
    text: "I det sista läspasset läser du ut boken. Det har Var är vi? och Med mig som vanligt, men i stället för samtalet säger var och en ett ord om boken och skriver upp den på sitt kort Böcker jag har läst ut. Slutet är nästa pass, helst efter en helg, så att eleverna hinner tänka på boken. Slutsamtalet för ni tillsammans, också när ni är fler än fem. Rita före slutet fyra spalter på ett blädderblocksark, en per fråga på frågekortet: Gillade, Gillade inte, Undrade och Mönster. Boka i förväg en stund i elevernas klasser veckan efter, då den som vill tipsar sin klass i en minut, med boken i handen."
    kolumner:
      - Tid och del
      - Vad händer
      - Du säger
    rader:
      - - "0–5 · Berätta boken"
        - Ni berättar boken vid tavlan, en bit var.
        - ”Berätta boken från början.”
      - - "5–12 · En sak var"
        - Med den bredvid bläddrar eleverna bland sina post-it och väljer en sak var om hela boken. I laget runt säger de sin sak, och du skriver den i rätt spalt.
        - ”Vad vill du säga om hela boken?”
      - - "12–20 · Tråden"
        - Ni drar streck mellan det som hänger ihop och följer tråden med flest streck.
        - ”Sa två av er något som hänger ihop?” ”Hur vet du det?”
      - - "20–25 · Frågorna"
        - Ni går igenom frågorna på tavlan.
        - ”Vilka frågor fick svar, och var i boken? Vilka är fortfarande öppna?”
      - - "25–40 · Boktipset"
        - Var och en fyller i bladet Boktipset och läser upp sitt tips.
        - ”Vem vill du ska läsa boken?”
    not: "Är ni fler än fem, säger var och en sin sak till den bredvid i stället för laget runt, och du skriver några i varje spalt. Eleverna tar ur sina post-it efter boktipset. Bladet Boktipset har sex rader. Vid ”Till” skriver eleven läsaren, helst sin egen klass, vid ”Bra att veta” en varning, som att boken börjar långsamt, och vid ”Min fråga till dig” en fråga som läsaren bär med sig. Den som skriver långsamt fyller i tre rader och säger resten. Spara tipsen i ett kuvert till nästa grupps bokval."
  - rubrik: Så skiljer sig nivåerna
    plats: efter-urval
    text: Nivåerna bygger mer på temat och innehållet än på hur svår boken är att läsa, eftersom du läser högt och eleven följer med. Välj nivå efter gruppens ålder och efter vad gruppen är redo för. Frågorna för åldern blir vuxnare från nivå till nivå, eftersom äldre elever vet mer om världen och om hur berättelser är byggda. Före varje lista står en sida om nivån.
    kolumner:
