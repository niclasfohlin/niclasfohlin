    - rubrik: "Böckerna: Avancerat, om nivån"
      text:
        - "Avancerat passar oftast en grupp nära åk 8–9. Du känner din grupp bäst. En bok på Avancerat kan passa en grupp i åk 7 som är redo för temat, och en bok på Medel kan vara rätt också för en grupp i åk 9."
        - "Välj böcker som knyter an till elevernas liv. I åttan och nian frågar sig många vem de är, vad kamratgruppen gör med dem och vad som är värt något. Böckerna på Avancerat handlar om våld, makt, kärlek och meningen med livet, och flera tar upp verkliga händelser i Sverige och i världen. I samtalet om boken prövar eleverna tillsammans sina tankar om sig själva och om världen."
        - "På Avancerat kan läsningen gå i takt med det eleverna arbetar med i historia och samhällskunskap. Boken ger ämnet ett ansikte, och det eleverna kan från lektionerna hjälper dem att se vad boken säger om sin tid."
        - "Kring åk 8–9 har eleverna läst mer och vet mer om historia och samhälle. Frågorna för åldern kan då handla om hur berättelsen är byggd, alltså vem som berättar och i vilken ordning vi får veta det som händer, och om när och var boken skrevs (Chambers, 1993). De passar böckerna på Avancerat. Där berättar Agnes i Intet och Rayan i Yani själva, När hundarna kommer följer flera familjer, och Hjärtans fröjd växlar mellan nu och återblickar. Berättarperspektiv står också i kursplanen i svenska för högstadiet."
      delar:
        - rubrik: "Att välja bok"
          falt:
            - { rubrik: "Två böcker till bokvalet", text: "När hundarna kommer och Flugornas herre: vad en grupp får unga att göra, i en svensk roman och i en klassiker om pojkar på en öde ö\nIntet och Möss och människor: två korta böcker om vad som gör livet värt något, i en dansk skolklass och bland lantarbetare i Kalifornien på 1930-talet\nHimlabrand och I taket lyser stjärnorna: en första kärlek, bland renskötare i Jokkmokk och i en vardag med en sjuk mamma" }
            - { rubrik: "I andra ämnen", text: "Flugornas herre och När hundarna kommer i historia: hur våld och hat växer i en grupp. Den ena skrevs efter andra världskriget, och den andra handlar om nynazism i Sverige på 1990-talet.\nHimlabrand i historia: samerna och rasbiologin" }
            - { rubrik: "Svårt innehåll", text: "Självmord: Hjärtans fröjd\nMord och våld: När hundarna kommer, Möss och människor, Yani och Flugornas herre. I Intet offrar barnen en flickas oskuld och ett finger, och till sist dödar de en pojke.\nVåld i familjen: Maresi\nEn förälder som dör: I taket lyser stjärnorna\nVet du att en elev har varit med om något liknande, tala med eleven och elevhälsan innan du föreslår boken. Ha skolans rutin vid oro för en elev till hands." }
        - rubrik: "Frågor för åldern"
          falt:
            - { rubrik: "Exempel", text: "”Vem berättar, och hur vet vi det?”\n”Fick vi veta det som hände i den ordning det hände?”\n”Vad tycker berättaren om det personerna gör? Och vad tycker du?”\n”Vet någon något om när och var boken skrevs? Ska vi ta reda på det?”" }
