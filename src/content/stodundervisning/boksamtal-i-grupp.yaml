lathund:
  innehall: En hel bok, ett exemplar per elev
  metoden:
    text:
      - Ni läser en hel bok. Du läser högt, och eleverna följer med i sina böcker. På väggen sitter bokens tavla, i varje bok en post-it, och i samtalet ligger frågekortet mitt på bordet.
      - Varje läspass börjar och slutar vid tavlan, och eleverna säger sin sak till den bredvid innan de säger den till gruppen. Du leder, men ingen sitter på de rätta svaren, inte ens du. Är ni fler än fem, samtalar ni i två grupper, tidigast i läspass 3. Du sitter med den ena, och i den andra läser en elev upp kortet Du som leder.
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Läs mycket och med få avbrott.
          text: Stanna vid din post-it, högst två gånger per pass.
        - fet: Bär frågorna med er.
          text: De står på tavlan tills boken svarar.
        - fet: Fråga ”Hur vet du det?”
          text: Då går eleverna tillbaka till boken.
    tabell:
      rubrik: Läspasset i fyra delar
      kolumner:
        - Del
        - Exempelfraser
      rader:
        - - |-
            1 · Var är vi?
            Vid tavlan
          - |-
            ”Vad hände förra gången?”
            ”Vad tror du händer nu?”
        - - |-
            2 · Läs
            I böckerna
          - |-
            ”Sätt din post-it där du vill säga något.”
            ”Var slutade du förstå?”
        - - |-
            3 · Samtala
            Runt bordet
          - |-
            ”Sa två av er något som hänger ihop?”
            ”Hur vet du det?”
        - - |-
            4 · Med mig
            Vid tavlan igen
          - |-
            ”Vad hände i dag, i en mening?”
            ”Har boken svarat på någon fråga?”
    not: "Var och en väljer en av frågekortets fyra frågor: ”Var det något du gillade?” eller ”Var det något du inte gillade?”, ”Var det något du inte förstod eller undrade över?” eller ”Lade du märke till något mönster eller någon koppling?”"
  pass:
    rubrik: "Läspass 6 i Momo"
    textRubrik: Gruppen · fem elever i åk 5 · nivån Bas
    titel: Momo eller kampen om tiden
    text:
      - Alla säger till den bredvid vad som hände förra gången, och Adam berättar vid tavlan att de grå herrarna har kommit. Sedan gissar alla vad som händer nu.
      - Läraren läser och stannar vid sin post-it. Ella sätter sin post-it där en ny person kommer in.
      - I laget runt säger Elias varför folk glömmer de grå herrarna. Noor säger att Fusi får bråttom, som hennes storebror. Ella frågar vem Fusi är, och Sara visar stället där det står att han är frisör. Adam hör att Elias och Noor sa något som hänger ihop.
      - Vid tavlan får frågan ”Varför glömmer folk dem?” en bock, och Sara har en ny fråga.
    forberett:
      rubrik: Det jag förberett
      text:
        - "Läst om sidorna där Fusi kommer in. Min post-it: Jag undrar om man kan spara tid på en bank. Det står: meningen om att lägga in tid och få tillbaka den. Jag tror inte att det går."
    klarTidigt: Läs några sidor till, eller ta en fråga på tavlan.
    schema:
      rubrik: Ett läspass på 40 minuter
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Läs om dagens sidor, skriv din post-it och läs stället högt. Se på tavlan och läsplanen.
        - tid: 0–5
          fas: 1 · Var är vi?
          vad: Alla säger till den bredvid vad som hände förra gången, och en elev berättar vid tavlan. Ni läser frågorna utan bock, och alla gissar vad som händer nu. Är ni ett udda antal, är tre en grupp.
        - tid: 5–27
          fas: 2 · Läs
          vad: Du läser, stannar vid din post-it och säger ”Jag undrar”, ”Det står” och ”Jag tror”. Eleverna sätter sin post-it där de vill säga något.
        - tid: 27–36
          fas: 3 · Samtala
          vad: "Du lägger fram frågekortet, och var och en väljer en fråga. ”Stämde din gissning?” Alla säger sin sak vid sin post-it, först till den bredvid och sedan laget runt. Det någon inte förstod tar ni först, och sedan en tråd."
        - tid: 36–40
          fas: 4 · Med mig
          vad: Eleverna säger dagens rad och nya personer, och du skriver. En fråga som fick svar får en bock, och har ni en ny fråga, skriver du den.
