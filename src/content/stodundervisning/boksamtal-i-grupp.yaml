    - rubrik: "Böckerna: Medel, om nivån"
      text:
        - "Medel passar oftast en grupp nära åk 6–7, men du känner din grupp bäst. En bok på Medel kan också passa en yngre grupp som är redo för temat, och en äldre grupp som behöver vänta med böckerna på Avancerat."
        - "Välj böcker som knyter an till elevernas liv. I den åldern lämnar många barndomen bakom sig. Kroppen, kompisarna och familjen förändras, och många byter skola. Böckerna på Medel handlar om sorg, flykt, att höra till och att bli äldre, och huvudpersonerna är ofta lika gamla som eleverna. I samtalet om boken får eleverna ord för det de själva är mitt i, och de ser hur andra har det i en annan tid och på en annan plats."
        - "Flera böcker på Medel tar upp sådant som klassen arbetar med i historia, geografi och samhällskunskap, och då kan läsningen gå i takt med det arbetet. Det eleverna vet från lektionerna hjälper dem att förstå boken, och i boken möter de en människa som är med om just det."
        - "Kring åk 6–7 vet eleverna mer om världen och kan se en händelse från flera håll. Frågorna för åldern kan då handla om vems berättelse det är, om någon som inte är med i boken och om det som känns sant (Chambers, 1993). De passar böckerna på Medel, där flera bygger på verkliga människors liv."
      delar:
        - rubrik: "Att välja bok"
          falt:
            - { rubrik: "Två böcker till bokvalet", text: "Tio över ett och En ö i havet: att förlora sitt hem, i dagens Kiruna och i Wien i slutet av 1930-talet\nBrun flicka drömmer och Eldens hemlighet: verkliga människors liv, den ena på vers och den andra på prosa\nComedy Queen och Ett hål om dagen: humor och allvar, svensk realism och ett amerikanskt äventyr" }
            - { rubrik: "I andra ämnen", text: "Tio över ett i geografi: gruvan i Kiruna och staden som flyttar\nEn ö i havet i historia: andra världskriget och barn på flykt" }
            - { rubrik: "Svårt innehåll", text: "Självmord: Comedy Queen och Den utvalde, där samhället också dödar spädbarn och gamla\nMissbruk hemma: Balladen om en bruten näsa\nKrig och flykt: En ö i havet, där judiska föräldrar skickar bort sina barn, och Eldens hemlighet\nMord och våld: Ett hål om dagen\nVet du att en elev har varit med om något liknande, tala med eleven och elevhälsan innan du föreslår boken. Ha skolans rutin vid oro för en elev till hands." }
        - rubrik: "Frågor för åldern"
          falt:
            - { rubrik: "Exempel", text: "”Vilken person blev du mest nyfiken på? Är det den viktigaste personen i berättelsen?”\n”Finns det någon som inte är med i boken, men som behövs för att berättelsen ska kunna hända?”\n”Vilka delar av boken känns mest som på riktigt?”\n”Fick boken dig att tänka annorlunda om något du själv har varit med om?”" }
