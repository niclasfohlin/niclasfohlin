          falt:
            - rubrik: Så gör du
              text: Skriv ut ett blad per samtalsgrupp och klipp isär de två korten. Frågekortet lägger du mitt på bordet i Samtala, och var och en väljer en av frågorna. Kortet Du som leder har du själv i början, och sedan ger du det till den elev som leder. Hur korten används står under Samtalet med frågekortet.
      listor:
        - rubrik: "Frågekortet: välj en fråga"
          rader:
            - - Var det något du gillade?
            - - Var det något du inte gillade?
            - - Var det något du inte förstod eller undrade över?
            - - Lade du märke till något mönster eller någon koppling?
        - rubrik: "Du som leder: läs en rad i taget"
          rader:
            - - Slå upp boken vid din post-it.
            - - Stämde din gissning? Säg det till den bredvid, och säg din sak.
            - - Vem börjar?
            - - Var det någon som inte förstod? Vem kan visa stället?
            - - Sa två av er något som hänger ihop?
            - - Hur vet du det? Visa i boken.
            - - Vad tar vi med oss till tavlan?
    - rubrik: "Strukturen, samtalet: Talkort"
      text:
        - "Alla har ett talkort. När du har sagt något lägger du ditt kort mitt på bordet. I bilden har Ella sitt kort kvar."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Samtala
              text: "Korten tar du fram när några få talar mest. Hur du visar dem, och när du tar bort dem, står under Samtalet mellan eleverna. Talkort är en struktur ur det kooperativa lärandet. Två andra finns redan i passet: paret först är EPA, och laget runt är Rondellen."
      listor:
        - rubrik: Så gör ni
          rader:
            - ["Alla får ett talkort."]
            - ["Den som vill börjar. Säg en sak, och lägg sedan ditt kort mitt på bordet."]
            - ["Nu lyssnar du. Du får prata igen när allas kort ligger på bordet, eller när någon frågar dig ”Hur vet du det?”"]
            - ["Du får bjuda in den som har sitt kort kvar: ”Vad tycker du?”"]
            - ["Vill du inte säga något nu? Säg ”Pass” och lägg ditt kort."]
            - ["När alla kort ligger på bordet tar ni tillbaka dem och börjar om."]
        - rubrik: Så tränar ni samtalet
          rader:
            - ["Alla får säga en sak innan någon säger en till. Den som brukar vänta får prata, och den som brukar säga mycket lyssnar."]
            - ["Så kan du börja: ”Jag håller med dig, för”, ”Jag tänker annorlunda, för” eller ”Menar du att”."]
