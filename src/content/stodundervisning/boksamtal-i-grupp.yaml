film:
  sekunder: 29.76
  beskrivning: "Var är vi? Adam berättar. Adam säger: ”De grå herrarna har kommit.” Läraren stannar vid sin post-it. Läraren säger: ”Jag undrar om man kan spara tid.” Elias visar var boken svarar. Elias säger: ”Den grå herren tar bort minnet!” Läraren frågar: ”Hur vet du det?” Elias säger: ”Här står det.” Frågan får en bock. Läraren frågar: ”Har boken svarat?” Sara frågar: ”Kan de ta Momos tid också?”"
  rubrik: "Ett läspass i fyra bilder"
  ingress: "Fyra bilder ur filmen om ett läspass i Momo, en för varje del av passet: Var är vi?, Läs, Samtala och Med mig. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Var är vi? Adam berättar vid tavlan."
    - text: "Läs: läraren stannar vid sin post-it."
    - text: "Samtala: vid sin post-it visar Elias var det står."
    - text: "Med mig: frågan får en bock, och en ny kommer."
