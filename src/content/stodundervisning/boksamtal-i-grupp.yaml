passrutin:
  text: Passet börjar och slutar vid bokens tavla, och däremellan läser du högt och gruppen samtalar. Den sista delen heter Med mig, efter det ni tar med er till nästa pass. Tabellen visar passet när du leder det själv. Tavlan, post-it-lapparna och samtalet med frågekortet har egna avsnitt efter arbetsformen. Efter exemplet står perioden i tidsordning, från bokvalet till slutet. Läspasset står också på Lektionskortet, ett A4 att ha framför dig.
  steg:
    - text: Var och en säger till den bredvid vad som hände förra gången, och en elev berättar för gruppen. Ni läser tavlans frågor utan bock, och alla säger sin gissning till den bredvid.
      fas: Var är vi?
    - text: Du läser högt till dagens stopp i läsplanen, och eleverna följer med. Vid din post-it stannar du och säger ”Jag undrar”, ”Det står” och ”Jag tror”. Varje elev sätter sin post-it där hen vill säga något.
      fas: Läs
    - text: Var och en väljer en av frågekortets frågor och säger sin sak vid dagens post-it, först till den bredvid och sedan laget runt. Det någon inte förstod tar ni först, och sedan en tråd ur det eleverna sa.
      fas: Samtala
    - text: Vid tavlan säger eleverna dagens rad och vem som är ny, och du skriver. En fråga som fick svar får en bock, och har ni en ny fråga, skriver du den.
      fas: Med mig
  efterPasset: Fotografera tavlan, och skriv i läsplanen vad gruppen sa och vad du tar upp nästa gång.
  kallas: delar
tidsschema:
  rubrik: Ett läspass på 40 minuter
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: Läs om dagens sidor. Skriv din post-it där texten blir svår, och läs stället högt för dig själv. Titta på tavlan och i läsplanen.
    - tid: 0–5 min
      fas: Var är vi?
      vad: Fråga ”Vad hände förra gången?” Blir något fel, peka på tavlan i stället för att rätta. Fråga sedan ”Vad tror du händer nu?”
    - tid: 5–27 min
      fas: Läs
      vad: Dela ut en post-it var och säg ”Sätt din post-it där du vill säga något.” Säg sidnumret när du börjar och efter din post-it.
    - tid: 27–36 min
      fas: Samtala
      vad: Lägg fram frågekortet och fråga ”Stämde din gissning?” Efter laget runt frågar du ”Sa två av er något som hänger ihop?” och följer tråden med ”Hur vet du det?”
    - tid: 36–40 min
      fas: Med mig
      vad: Fråga ”Vad hände i dag, i en mening?”, ”Kom det någon ny?”, ”Har boken svarat på någon fråga?” och ”Vad undrar vi nu?” Säg vem som berättar nästa gång.
  efter: I Läs förklarar du ett namn eller ett ord med en mening, utan att stanna. Tappar någon sidan, säger du sidnumret igen, och den som tappar raden lyssnar vidare och hittar tillbaka nästa gång du säger sidnumret. Har någon tappat bort sig i berättelsen, fråga ”Var slutade du förstå?” och läs om därifrån. Minuterna är hållpunkter. De första passen tar tavlan och samtalet längre tid, och då läser du kortare. Blir samtalet klart tidigt, läser du några sidor till eller tar upp en fråga från tavlan. Blir det ont om tid, tar ni bara laget runt och ett ”Hur vet du det?” i Samtala, och dagens rad och bocken i Med mig.
arbetsform:
  rubrik: "Arbetsform: gemensamt, läraren läser, gemensamt igen"
  text: Vid tavlan och i början av samtalet säger var och en sin sak till den bredvid, innan någon säger den till gruppen. Vid tavlan fyller den som lyssnar i det som saknas, och nästa pass berättar hen först. Är ni ett udda antal, är tre en grupp.
  delar:
    - rubrik: 1. Gemensamt
      text: hela gruppen vid tavlan
      faser:
        - Var är vi?
    - rubrik: 2. Läraren läser
      text: eleverna följer med i sina böcker
      faser:
        - Läs
    - rubrik: 3. Gemensamt igen
      text: runt bordet, och sist vid tavlan
      faser:
        - Samtala
        - Med mig
exempel:
  valt:
    rubrik: Boken gruppen valde
    text: Momo eller kampen om tiden av Michael Ende, på nivån Bas. Gruppen valde den framför Ishavspirater, och läsplanen har 27 läspass.
  text:
    - "Adam, Ella, Elias, Noor och Sara går i åk 5 och har sitt sjätte läspass. Läraren leder fortfarande hela passet och håller pennan. Kvällen före har hen läst om dagens sidor och skrivit en post-it om att spara tid på en bank."
    - "Passet börjar vid tavlan. Läraren frågar: ”Vad hände förra gången?” Var och en säger det till den bredvid, och sedan berättar Adam för gruppen: ”Folk går till Momo, för hon lyssnar. Sen kom de grå herrarna.” Gruppen läser frågorna som inte har en bock, och var och en säger till den bredvid vad hen tror händer nu. Noor säger: ”Nu tror jag att de tar någons tid.”"
    - Läraren säger sidnumret och läser, och eleverna följer med i sina böcker. Vid sin post-it stannar hen och säger de tre raderna, säger sidnumret igen och läser vidare från samma mening. Noor, som hade tappat sidan, hittar rätt. När en ny person kommer in i berättelsen sätter Ella sin post-it där.
    - "När läsningen är slut lägger läraren frågekortet mitt på bordet, och alla slår upp boken vid sin post-it och väljer en av kortets frågor. Läraren frågar: ”Stämde din gissning?” Noor säger till Sara: ”Ja, de tog Fusis tid.” Sedan säger var och en sin sak till den bredvid. I laget runt börjar Elias: ”Nu fattar jag varför folk glömmer dem. Den grå herren tar bort minnet när han går, och Fusi tror att det var hans egen idé att spara tid.” Noor säger att Fusi får bråttom, som hennes storebror. Ella säger: ”Här slutade jag förstå. Vem är han?” Adam gillade inte att ingen märker de grå herrarna, och Sara gillade när den grå herren räknade Fusis liv i sekunder."
    - "Läraren säger: ”Vi tar Ellas ställe först. Vem kan visa?” Sara slår upp sidan där Fusi kommer in och visar raden där det står att han är frisör. Sedan frågar läraren: ”Sa två av er något som hänger ihop?” Adam svarar: ”Elias och Noor. De sparar tid och har ändå bråttom.” Läraren frågar Elias: ”Hur vet du det?” Elias läser meningen vid sin post-it, och gruppen följer tråden."
    - "Vid tavlan frågar läraren vad som hände i dag, och Sara säger dagens rad: ”Fusi sparar tid.” Ella säger att Fusi är ny och hör ihop med de grå herrarna, och läraren skriver upp honom, med ett streck dit. Frågan ”Varför glömmer folk dem?” får en bock, och Sara har en ny fråga: ”Kan de ta Momos tid också?” Läraren säger att Ella berättar nästa gång. Efteråt fotograferar läraren tavlan och skriver i läsplanen, under Det gruppen sa: ”De som sparar tid har ändå bråttom.”"
  tavla: true
  tavlaText: Så ser tavlan ut efter det sjätte läspasset, med en rad per läspass och en bock vid frågan som fick svar. På väggen står de tre rutorna sida vid sida, och från Fusi går ett streck till de grå herrarna, som i filmen Så växer bokens tavla.
fastnar:
  rubrik: När samtalet stannar
  text: Ibland tystnar gruppen. Det är inget misslyckande. Ge eleverna tanketid och ett litet stöd, men inget svar.
  fragaForst:
    - Vad fastnade du för?
    - Vad i boken får dig att tänka så?
  trappa:
    - Be en elev slå upp boken vid sin post-it och läsa meningen där, eller peka på den och låta dig läsa.
    - Gå till tavlan och välj en fråga som gruppen bär med sig.
    - Ställ en av frågorna för åldern, som står på sidan om nivån.
    - Lyft två olika tankar som eleverna har sagt, och be gruppen jämföra dem.
    - Låt eleverna skriva en rad på ett papper innan de pratar, om det är lättare.
  motto: Börja med det självklara. Då kan ingen elev känna att hen har svarat fel.
roll:
  rubrik: "Lärarens roll: läsa, leda och lyssna"
  text: Du läser boken högt och leder samtalet, men du bestämmer inte vad boken betyder, och du säger hellre för lite om den. Lyssna mer än du talar. Säg ”Jag undrar” i stället för att fråga ”Varför”, och visa att du själv undrar, tvekar och ändrar dig. Då vågar eleverna göra detsamma.
  gor:
    - Läs boken själv innan du föreslår den.
    - Läs med inlevelse och med få avbrott.
    - Samla allas tankar innan ni fördjupar.
    - Låt tråden komma ur det eleverna sa.
    - Be om textstöd.
    - Låt flera tolkningar finnas samtidigt.
  undvik:
    - Att stanna efter varje sida.
    - Att låta eleverna läsa högt i tur och ordning.
    - Att gå igenom en lista med frågor efter varje kapitel.
    - Att fråga ”Varför” eller tolka åt eleverna.
    - Att leta efter ett rätt svar.
    - Att fråga ”Vad tyckte du om boken?” som första fråga.
    - Att göra läsningen till en kontroll med frågor och betyg.
urval:
  rubrik: Var hittar du böckerna och läsplanen?
  text:
    - "På varje nivå, Bas, Medel och Avancerat, har metoden tio böcker: fem från 2012 eller senare och fem klassiker. I nivåns lista ser du ungefär hur många läspass varje bok tar, var ljudboken och talboken finns, var du lånar och köper boken och om det finns en lärarhandledning."
    - Böckerna lånar du genom skolbiblioteket, kommunens skolbibliotekscentral eller folkbiblioteket, och i Libris ser du vilka bibliotek som har dem. Låna samma utgåva till alla, så att sidnumren stämmer. Fråga om klassuppsättningar och om ett skollån med längre lånetid. Många folkbibliotek har bokcirkelkassar med sju eller åtta exemplar av samma bok och en lånetid på fyra till åtta veckor. Kassarna har sällan böcker för åk 4–7. En vuxen ansvarar för hela kassen, så du lånar den själv och förnyar lånet. En elev med läsnedsättning kan få talboken i Legimus genom skolbiblioteket, och vårdnadshavaren skriver under användaravtalet. Kontot i Legimus är elevens eget. En elev som har boken i en lättläst version läser den i förväg eller efteråt, och i passet följer hen med i originalet.
    - Läsplanen gör du på mallen Läsplanen, efter din utgåva. Listans läspass är för det mesta räknade på ljudbokens eller talbokens speltid, och du läser oftast något långsammare. Räkna därför med ett par läspass mer än listan säger. Pröva hur många sidor du hinner läsa högt på 20 minuter, och dela boken i läspass. Låt varje pass sluta där eleverna vill veta vad som händer sedan. Det stället är passets stopp. Skriv in sidorna och stoppet, och det som är nytt i ett läspass, som en samtalsregel eller protokollet. Välj takten efter boken, två pass i veckan för en kort bok och tre för en lång. Tar boken mer än omkring 20 läspass, kan du berätta ett mellanparti kort med egna ord. Skriv det i läsplanen och som en rad på tavlan. Läser du hela boken, tar perioden längre tid.
    - Böckerna ligger kvar i rummet mellan passen. Den som har varit borta följer med ändå, för i Var är vi? och på tavlan får hen veta vad som har hänt. Hen kan också ta igen passet med ljudboken eller talboken. Den som vill läsa vidare hemma lånar ett eget exemplar eller lyssnar på ljudboken, men berättar inte för de andra vad som händer.
  kravText: "Väljer du en bok utanför listan, ska den uppfylla tre krav:"
  krav:
    - rubrik: Något att samtala om
      text: En lucka, ett val eller en känsla att tolka
    - rubrik: Ett tema för åldern
      text: Temat angår eleverna i gruppen. Boken får vara för svår att läsa själv.
    - rubrik: Lagom lång
      text: 8 till 27 läspass. Över 20 kan du berätta ett mellanparti.
uppfoljning:
  text: Du behöver veta om passen ger effekt, och det räcker inte att boken blir utläst. Läsintervjun och protokollet står bland materialet, ett av varje per elev. På dem står frågorna och det du lyssnar efter. Läsplanen samlar det gruppen sa, och protokollet det varje elev sa. Jämför det eleven säger i bokens slut med det hen sa i början, och den andra läsintervjun med den första.
  rader:
    - nar: Före bokvalet
      tid: "före"
      perElev: 5
      vad: Gör läsintervjun, fem minuter per elev, om senaste boken, vad eleven gör när hen inte förstår och vad hen gillar. Eleven fyller i kortet Böcker jag har läst ut.
    - nar: Under boken
      tid: "i passet"
      vad: Skriv i protokollet vad eleven säger i Var är vi? och Samtala, i bokens början, mitt och slut. I en kort bok räcker början och slutet.
    - nar: Efter slutet
      tid: "efter"
      perElev: 10
      vad: Gör läsintervjun igen, omkring tio minuter. Eleven återberättar hela boken. Ni väljer hens nästa bok, och du skriver vilket stöd hen behöver i den.
plan:
  nivaval:
    text: "Nivåerna bygger mer på temat och innehållet än på hur svår boken är att läsa, eftersom du läser högt och eleven följer med. Välj nivå efter gruppens ålder och efter vad gruppen är redo för."
    mer: Så skiljer sig nivåerna
  fore:
    - "Du gör läsintervjun, fem minuter per elev, läser de två böckerna och reserverar exemplar. Räkna med en till tre veckor."
    - "På varje nivå, Bas, Medel och Avancerat, har metoden tio böcker: fem från 2012 eller senare och fem klassiker. I nivåns lista ser du ungefär hur många läspass varje bok tar, var ljudboken och talboken finns, var du lånar och köper boken och om det finns en lärarhandledning."
  passen:
    - nar: första passet
      kort: "Bokvalet"
      text: "När boken är vald gör du läsplanen och skriver in det som är nytt i ett läspass."
      tabell: "Första passet: bokvalet"
      ur: { tabell: "Perioden: en bok från bokvalet till boktipset", rad: Bokvalet, kolumner: [Det som är nytt] }
    - nar: pass 2
      kort: "Läspass 1"
      tabell: "Läspass 1: allt visas första gången"
      ur: { tabell: "Perioden: en bok från bokvalet till boktipset", rad: Läspass 1, kolumner: [Det som är nytt] }
    - nar: pass 3–4
      kort: "Läspass 2 och 3"
      ur: { tabell: "Perioden: en bok från bokvalet till boktipset", rad: Läspass 2 och 3, kolumner: [Det som är nytt] }
    - nar: pass 5–6
      kort: "En elev vid tavlan"
      ur: { tabell: "Perioden: en bok från bokvalet till boktipset", rad: Från läspass 4, kolumner: [Det som är nytt] }
    - nar: pass 7–10
      kort: "En elev leder Var är vi?"
      ur: { tabell: "Perioden: en bok från bokvalet till boktipset", rad: Från läspass 6, kolumner: [Det som är nytt] }
    - nar: pass 14 till det sista
      kort: "En elev leder laget runt"
      ur: { tabell: "Perioden: en bok från bokvalet till boktipset", rad: Från läspass 10, kolumner: [Det som är nytt] }
    - nar: näst sista passet
      kort: "Det sista läspasset"
      text: "I det sista läspasset läser du ut boken. Det har Var är vi? och Med mig som vanligt, men i stället för samtalet säger var och en ett ord om boken och skriver upp den på sitt kort Böcker jag har läst ut."
    - nar: sista passet
      kort: "Slutet"
      tabell: "Sista passet: slutet"
      ur: { tabell: "Perioden: en bok från bokvalet till boktipset", rad: Slutet, kolumner: [Det som är nytt] }
mal:
  overgripande: "kunna hålla ihop berättelsen och visa var i boken tanken kommer ifrån."
  punkter:
    - Berätta vad som har hänt hittills
    - Säga vem som är vem i boken och hur personerna hör ihop
    - Bära med sig en fråga och märka när boken svarar
    - Säga en tanke och visa var i boken den kommer ifrån
    - Bygga vidare på en kamrats tanke
    - Se ett mönster eller en koppling
    - Sätta ord på sin läsupplevelse
    - Berätta om boken för någon som inte har läst den
checklista:
  punkter:
    - Läst boken, lånat böckerna och gjort läsplanen.
    - Läst om dagens sidor och skrivit min post-it.
    - Tittat på tavlan och i läsplanen.
    - Tagit med en post-it per elev, frågekortet och kortet Du som leder, och talkort om de behövs.
    - Bestämt samtalsgrupperna, om vi är fler än fem.
grund:
  text: "Metoden bygger på Aidan Chambers boksamtal, på svenska ”Jag undrar” (Chambers, 1993), och på hans bild av läsandet som en cirkel, där urvalet, läsningen och samtalet hör ihop (Chambers, 1991). Kärnan är de fyra grundfrågorna om vad eleven gillade, inte gillade, undrade över och vilka mönster hen såg, och frågan ”Hur vet du det?”, som skickar eleven tillbaka till boken. I en studie i England läste lärare två hela, krävande romaner högt för klasser i Year 8, ungefär åk 7. De läste snabbare än vanligt under tolv veckor, och de elever som låg minst ett år efter i läsförståelse gick i genomsnitt fram 16 månader i läsålder. Studien hade ingen jämförelsegrupp, så belägget är lovande men svagt (Westbrook m.fl., 2019). En vägledning för åk 4–9 rekommenderar att eleverna arbetar med krävande texter två till tre gånger i veckan under sex till tio veckor, och belägget är måttligt (Vaughn m.fl., 2022). Att samtala om texter i liten grupp gynnar särskilt de elever som sällan kommer till tals i helklass (Reichenberg och Lundberg, 2011). I en studie i åk 9 räckte fler elever upp handen, också de blyga, när de först hade talat med en kamrat (Mundelsee och Jurkowski, 2021). Att läraren modellerar och gradvis lämnar över ansvaret kommer från reciprok undervisning (Palincsar och Brown, 1984) och GRR-modellen. Gruppen lär sig samtalsreglerna på samma sätt, en i taget: läraren visar hur regeln syns och hörs, och eleverna prövar den (Fohlin och Wilson, 2025)."
  kallor: Bygger på Chambers (1991), Chambers (1993), Fohlin och Wilson (2025), Mundelsee och Jurkowski (2021), Palincsar och Brown (1984), Reichenberg och Lundberg (2011), Vaughn m.fl. (2022), Westbrook m.fl. (2019), samt Skolverkets material om läsförståelse och boksamtal på Lärportalen.
pabordet:
  - nr: 1
    rubrik: "Läspasset · Det som finns i rummet"
    text: "Bokens tavla sitter på väggen. I lärarens bok sitter en post-it med tre rader och i elevens bok en tom post-it, och i samtalet ligger frågekortet mitt på bordet. Kortet i bilden har ett ord per fråga."
    efter: "stycke 4"
    fluent: [oppen-bok]
  - nr: 2
    rubrik: "Bokvalet · Två böcker och röstsedlarna"
    text: "De två böckerna ligger på bordet i bokvalet, och på röstsedeln skriver eleven den bok hen vill läsa."
    efter: "tabell: Första passet"
    fluent: [bok, valurna]
  - nr: 3
    rubrik: "Slutet · Spalterna och ett boktips"
    text: "I slutsamtalet om Momo har läraren skrivit en sak från var och en i de fyra spalterna, och gruppen har dragit ett streck mellan det som hänger ihop. Under spalterna ligger början av Noors boktips till sin klass."
    efter: "tabell: Sista passet"
  - nr: 4
    rubrik: "Strukturen · Talkort"
    text: "Fyra talkort ligger mitt på bordet. Ella har sitt kvar, och Noor bjuder in henne."
    efter: "ram: Strukturen, samtalet: Talkort"
    fluent: [pojke, flicka, pojke-2, flicka-2, barn]
ramar:
  rubrik: Böckerna och materialet
  text:
    - "Här finns lektionskortet för läspasset, böckerna nivå för nivå och materialet, med mallarna Bokens tavla och Läsplanen sist."
  ramar:
    # BOKKORTEN
    - rubrik: "Böckerna: Bas, om nivån"
      text:
        - "Bas passar oftast en grupp nära åk 4–5. Du känner din grupp bäst. En bok på Bas kan också passa en äldre grupp som behöver en tydlig handling och personer som är lätta att följa."
        - "Välj böcker som knyter an till elevernas liv. Kring åk 4–5 är kompisarna viktiga, och eleverna funderar mycket över vad som är rättvist, hur det är att våga och hur det är att förlora någon. Böckerna på Bas handlar om just det. När gruppen samtalar om en person i boken, kan eleverna se sitt eget liv på tryggt avstånd och förstå sig själva och världen lite bättre."
        - "Ett tema i boken kan hänga ihop med det klassen arbetar med i andra ämnen, och då har eleverna mer att knyta samtalet till. Med grundfrågan om mönster och kopplingar hittar eleverna sambanden själva."
        - "Kring åk 4–5 utgår eleverna mest från det som händer och från sig själva. Frågorna för åldern kan då handla om platsen, personerna, ordningen och elevens egna minnen (Chambers, 1993). De passar böckerna på Bas. Där finns tydliga platser, som Stockholm 1880, Ishavet och Mattisskogen, personer som är lätta att känna igen sig i och flera tidshopp. Tillbakablickar och beskrivningar av miljöer och personer står också i kursplanen i svenska för mellanstadiet."
      delar:
        - rubrik: "Att välja bok"
          falt:
            - { rubrik: "Två böcker till bokvalet", text: "Nattkorpen och Glasbarnen: en deckare som utspelar sig 1880 och en spökhistoria i nutid\nRonja rövardotter och Bröderna Lejonhjärta: två av Astrid Lindgren, en ljusare och en mörkare\nIshavspirater och Momo eller kampen om tiden: två långa, ett äventyr över havet och en saga om tiden" }
            - { rubrik: "I andra ämnen", text: "Momo i matematik: räkna om frisören Fusis liv till sekunder, som den grå herren gör\nMomo i historia: synen på tid, från bondesamhällets årstider till fabrikens klocka\nNattkorpen i historia: Stockholm och barnens villkor på 1800-talet" }
            - { rubrik: "Svårt innehåll", text: "Död i familjen: Glasbarnen och Bröderna Lejonhjärta, där båda bröderna dör och slutet har lästs som ett självmord\nBarn som far illa: Nattkorpen, Matilda och Ishavspirater, där barn rövas bort och blir slavar\nMord: Jefferson och Nattkorpen, som också skildrar en avrättning\nVet du att en elev har varit med om något liknande, tala med eleven och vårdnadshavaren innan du föreslår boken." }
        - rubrik: "Frågor för åldern"
          falt:
            - { rubrik: "Exempel", text: "”Var utspelar sig berättelsen? Hade det kunnat hända någon annanstans?”\n”Påminner någon i boken dig om någon du känner?”\n”Har du själv varit med om något som händer i boken?”\n”Berättar du alltid det som hände i ordning? Gör boken det?”" }
    - rubrik: "Böckerna: Bas"
      text:
        - "Här är tio böcker för en grupp nära åk 4–5, fem från 2012 eller senare och fem klassiker."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: "Listan", text: "Läspassen är räknade på ljudbokens eller talbokens speltid, med 22 minuters läsning per läspass. Jefferson är räknad på sidorna." }
