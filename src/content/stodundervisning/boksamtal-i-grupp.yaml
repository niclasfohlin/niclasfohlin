mallar:
  - rubrik: Bokens tavla
    typ: matta
    kolumner:
      - Det här har hänt
      - Personerna
      - Frågorna vi bär med oss
    underrad: "Boken: ____________________"
    fot: "När passet börjar: ”Vad hände förra gången?” ”Vad tror du händer nu?” När passet slutar: ”Vad hände i dag, i en mening?” ”Kom det någon ny?” ”Har boken svarat på någon fråga?” ”Vad undrar vi nu?”"
    text: Rita av mallen på ett blädderblocksark, eller visa den på skärmen och skriv i den. Hur tavlan används står i beskrivningen, under Bokens tavla.
  - rubrik: Läsplanen
    typ: rutnat
    kolumner:
      - Läspass, sidor och stopp
      - Det som är nytt
      - Det gruppen sa
      - Nästa gång
    rader: 10
    underrad: "Boken och utgåvan: ______________________________"
    text: Gör läsplanen när boken är vald. Pröva hur många sidor du hinner läsa högt på 20 minuter, och skriv för varje läspass sidorna och stoppet, alltså stället där läsningen slutar. Skriv också in det som är nytt i ett läspass, som en samtalsregel. Efter passet skriver du vad gruppen sa och vad du tar upp nästa gång. Bladet rymmer tio läspass, så en bok med 27 läspass behöver tre blad.
