lathund:
  innehall: Nästa del av parets bok
  metoden:
    text:
      - "I åtta veckor läser klassen högt i par, i pass om 20 minuter. Varje pass har fyra delar: Texten, Visa, Läs för en lyssnare och Återkoppling. Vecka 1–5 har var sin av de fem strategierna."
      - "Paret håller ihop alla åtta veckor och läser vidare i en bok som de har valt tillsammans. I varje pass lyssnar du på dagens par, som är högst fyra par i en klass och alla par i en liten grupp. I vecka 6 och 7 förbereder eleverna var sin bilderbok, och i vecka 8 läser de den för yngre elever eller någon hemma."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - { fet: Innehållet först., text: "Varje pass börjar med vad texten säger, och rösten ska föra fram det." }
        - { fet: Alla läser samtidigt., text: "De läser i kör eller i par. Ingen läser i tur och ordning inför klassen." }
        - { fet: Lyssnaren svarar med två meningar., text: "Vad hen förstod och vad rösten gjorde." }
    tabell:
      rubrik: Passets fyra delar
      kolumner: [Del, Exempelfraser]
      rader:
        - ["1 · Texten\nVad säger texten?", "”Berätta vad som hände förra gången.”\n”Hur tror ni att huvudpersonen känner sig nu?”"]
        - ["2 · Visa\nHur ska det låta, så att lyssnaren förstår?", "”Lyssna när jag läser det på två sätt.”\n”Vad förstod ni bättre nu?”"]
        - ["3 · Läs för en lyssnare\nVad förstod lyssnaren?", "”Säg först vad du förstod.”\n”Jag förstod att han var rädd, för att du viskade.”"]
        - ["4 · Återkoppling\nVad tar vi med oss?", "”Många pausade före det spännande, och då blev det spännande.”"]
    not: "Eleverna läser utan klocka och i lyssnarens takt."
  pass:
    rubrik: "Vi kör ett pass i åk 3: Repliken, vecka 3"
    textRubrik: Stället du visar på tavlan
    utskrift: Skriv ut stället
    titel: Hunden vid dörren
    text:
      - "Det knackade på dörren. Lisa satt alldeles stilla."
      - "– Vem är det? viskade hon."
      - "Ingen svarade."
    repliker:
      - Hur känns det för Lisa här?
      - Säg först vad du förstod.
    forberett:
      rubrik: Det jag förberett
      text:
        - "Början av Hunden vid dörren står stort på tavlan, med repliken att visa. Paren har böcker och lappar framme, och dagens par är fyra."
    schema:
      rubrik: 20 minuter, steg för steg
      rader:
        - { tid: Före, fas: Förberedelse, vad: "Välj stället och visa det stort på tavlan." }
        - { tid: 0–⁠3, fas: 1 · Texten, vad: "Paren gör high five och berättar om förra gången. De svarar varandra på dagens fråga.", fraser: [Hur tror ni att huvudpersonen känner sig nu?] }
        - { tid: 3–⁠6, fas: 2 · Visa, vad: "Skriv ordet i marginalen, sätt tecknet, läs utan och med strategin. Alla läser efter dig.", fraser: ["Lät det som att Lisa var rädd?"] }
        - { tid: 6–⁠18, fas: 3 · Läs för en lyssnare, vad: "Paren läser vidare, ett stycke var, svarar varandra och sätter en lapp där de slutar. Du lyssnar på dagens par.", fraser: ["Hur känns det för honom här?"] }
        - { tid: 18–⁠20, fas: 4 · Återkoppling, vad: "En sak om texten och en om rösten.", fraser: ["Många läste replikerna med personens känsla, och då förstod lyssnaren hur det kändes."] }
  mall:
    rubrik: De fem strategierna
    underrad: Läs så att lyssnaren förstår och känner det texten säger
    block:
      - typ: tabell
        rubrik: Fråga först vad som händer, och sedan hur det ska låta
        kolumner: [Strategin, Tecknet, Fråga dig]
        rader:
          - ["1 · Tankepausen", "/ kort paus, // lång paus", "Var börjar en ny tanke?"]
          - ["2 · Frågan och utropet", "ring runt ? och !", "Säger hen något, undrar hen eller ropar hen?"]
          - ["3 · Repliken", "ruta runt det som sägs", "Vem säger det, och hur känns det?"]
          - ["4 · Det viktiga ordet", "streck under", "Vilket ord är viktigast?"]
          - ["5 · Lyssnarens takt", "~ långsamt vid det viktiga", "Hänger lyssnaren med?"]
      - { typ: not, text: "Lyssnarens två meningar: ”Jag förstod att …” och ”Jag hörde att du …”" }
  material:
    rubrik: Vad du behöver för ett pass
    kravEtikett: Bokkrav
    var:
      rubrik: Var texterna finns
      punkter:
        - { fet: Parets bok., text: Paret väljer den ur din back eller i biblioteket. }
        - { fet: Stället du visar., text: "Ur högläsningsboken eller en kort text." }
        - { fet: Strukturerna., text: "En dikt eller en artikel ur 8 Sidor." }
        - { fet: Materialet., text: "Lektionskortet, affischen, strukturerna, Läsarens förberedelse, lappen hem, provtexterna och protokollet, i Materialet." }
    bordet:
      - Parets bok, med en lapp där paret slutade
      - Affischen på väggen
      - Stället du visar, stort på tavlan
    # Lathundens kortare uppföljning: metodens rader ryms inte på sidan 4 bredvid checklistan (del B, 2026-10-26).
    uppfoljning:
      - nar: "Vecka 1"
        vad: "Eleven läser provtexten tyst, säger vad den handlar om och läser den sedan högt. Spela in läsningen och fyll i lyssnarprotokollet."
      - nar: "Varje pass"
        vad: "Lyssna på dagens par, och skriv på klasslistan hur varje elev klarar veckans mål och vad hen ska pröva."
      - nar: "Vecka 8"
        vad: "Samma provtext, inspelning och protokoll. Spela upp 20 sekunder från vecka 1, och låt eleven säga vad hen hör nu."

lektionskort:
  - text: "Lektionskortet är passet på ett A4: målet, de fem strategierna med tecknen och elevens frågor, passet med det du gör och säger, och Lyssna efter. Skriv ut det och ha det framför dig under passet."
film:
  sekunder: 29.29
  beskrivning: "Först: vad säger texten? Läraren frågar: ”Hur känns det för Lisa här?” Wilma säger: ”Hon är rädd.” Sedan: hur ska det låta? Läraren skriver: ”rädd”. Läraren säger: ”Inte glatt. Hon är rädd, så jag viskar: Vem är det?” Klassen läser efter läraren. Läraren säger: ”Läs efter mig.” Alla läser: ”Vem är det?” Amina och Malik läser om Max. Amina viskar: ”Är det någon där?” Lyssnaren säger sina två meningar. Malik säger: ”Jag förstod att Max var rädd. Jag hörde att du viskade.”"
  rubrik: "Från texten till rösten"
  ingress: "Fyra bilder ur filmen om ett pass. Läraren frågar hur Lisa känner sig i berättelsen på tavlan, skriver ordet rädd i marginalen, ritar en ruta runt repliken och viskar den. Klassen läser repliken efter läraren. Sedan läser paren vidare i sin bok, och Amina viskar en replik för Malik, som säger vad han förstod och vad rösten gjorde. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Läraren frågar hur Lisa känner sig. Wilma svarar."
    - text: "Läraren skriver ordet rädd och ramar in repliken."
    - text: "Klassen läser repliken efter läraren."
    - text: "Malik säger vad han förstod och vad rösten gjorde."
