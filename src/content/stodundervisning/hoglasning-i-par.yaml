mal:
  overgripande: "kunna läsa högt så att lyssnaren förstår det texten säger."
  text: "Efter de åtta veckorna ska eleven oftare än förut:"
  punkter:
    - Säga vad en text handlar om och hur den ska låta, så att lyssnaren förstår
    - Pausa där en ny tanke börjar, och läsa frågor, utrop och repliker så att de låter som de är menade
    - Läsa i lugn takt och säga det viktiga ordet lite tydligare, så att lyssnaren hänger med
    - Våga läsa högt för en ny lyssnare
checklista:
  rubrik: Checklista
  punkter:
    - "Före vecka 1: bokat en yngre klass, satt ihop paren, delat dem i grupper om högst fyra och valt två eller tre böcker per par. Skrivit ut affischen på A3 och kopierat lappen hem, provtexterna Var är mössan? och Källaren och lyssnarprotokollet, och ordnat något att spela in med."
    - Valt ett ställe till varje pass i veckan, och lagt fram två eller tre böcker till par som snart har läst ut sin bok.
    - "Före vecka 6: lånat omkring två korta bilderböcker per elev, kopierat Läsarens förberedelse och bestämt med de yngres lärare vem varje elev läser för."
grund:
  text: "Att läsa olika texter ger liknande resultat som att läsa samma text flera gånger, om eleverna läser lika mycket (Kuhn och Stahl, 2003; Hudson m.fl., 2020). Rösten och läsförståelsen hänger ihop, och förståelsen kan hjälpa eleven att välja hur det ska låta (Wolters m.fl., 2022; Godde m.fl., 2020). Bland 30 elever i åk 3 som läste på eller över årskursnivå mindes de som ombads läsa för innehållets skull mer än de som ombads läsa fort (O’Shea och Sindelar, 1984). Kamratlärande i par ger mest när paren har fått träning och följer en fast form (Topping, 2000; Evidence for Learning, 2021). I jämförande studier gav turläsning inför klassen sämre resultat än gemensam läsning efter lärarens förebild (Kuhn och Stahl, 2003)."
  kallor: "Bygger på Kuhn och Stahl (2003), Hudson m.fl. (2020), Wolters m.fl. (2022), Godde m.fl. (2020), O’Shea och Sindelar (1984), Topping (2000, 2014), Evidence for Learning (2021), Duran m.fl. (2019), Meisinger m.fl. (2004), Hautala m.fl. (2023), Young och Nageldinger (2014), Huhtamäki (2015), Horne och Roll (2021) och Fohlin och Wilson (2025)."

ramar:
  rubrik: Materialet
  text:
    - "Här finns lektionskortet, affischen, de två strukturerna, Läsarens förberedelse, lappen hem, provtexterna och lyssnarprotokollet. Affischen sitter på väggen alla åtta veckor och får gärna sitta kvar efteråt, så att den påminner både dig och eleverna om strategierna när ni läser högt. Strukturerna visar du på tavlan när klassen tränar en strategi extra."
  ramar:
    - rubrik: "Affischen: fem sätt att läsa för en lyssnare"
      text:
        - Läs så att den som lyssnar förstår och känner det texten säger.
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Affischen, text: "Skriv ut bladet Affischen på A3, eller förstora det till 141 procent i kopiatorn. Sätt upp affischen där alla ser den, och peka på den i Visa och i Återkoppling." }
    - rubrik: "Strukturen, extra träning: Berätta mera!"
      text:
        - Läs ditt ställe för många lyssnare. Varje ny lyssnare hör din läsning för första gången.
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Extra träning, text: "När du vill att klassen ska träna en strategi extra, gör ni strukturen i omkring tolv minuter i stället för delen Läs för en lyssnare. Välj en kort text med flera ställen där strategin behövs, och kopiera den till varje elev. Säg vilken strategi eleverna tränar, och visa den här sidan på tavlan. Du är en av lyssnarna. Första gången blir det rörigt, så håll övningen kort och gör om den en annan dag." }
      listor:
        - rubrik: Så gör ni
          rader:
            - ["Välj ett ställe på två till fyra meningar i texten, och sätt tecknet för strategin."]
            - ["Läs stället tyst. Gå sedan runt i rummet med texten, och sträck upp handen."]
            - ["Möt någon som har handen uppe och hör till ett annat par, och ge varandra en high five."]
            - ["Säg varför du valde stället, och läs det."]
            - ["Lyssnaren säger: ”Jag förstod att …” och ”Jag hörde att du …”."]
            - ["Byt roller, så att hen läser för dig."]
            - ["Säg tack, sträck upp handen och hitta en ny lyssnare."]
            - ["När läraren säger stopp, berättar några vilket ställe de minns bäst."]
        - rubrik: Så tränar ni högläsning
          rader:
            - ["Bli lite bättre på strategin för varje ny lyssnare, och lyssna efter den när den andra läser för dig."]
    - rubrik: "Strukturen, extra träning: Speed-dating"
      text:
        - Sitt i två rader mitt emot varandra. Läs, lyssna och byt stol.
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Extra träning, text: "När du vill att klassen ska träna en strategi extra, gör ni strukturen i stället för delen Läs för en lyssnare. Kopiera en kort text till varje elev, ställ stolarna i två rader mitt emot varandra och visa den här sidan på tavlan. Säg vilken strategi eleverna tränar, och säg byt efter omkring två minuter, när de flesta har läst och svarat. Vid udda antal sitter du på den lediga stolen." }
      listor:
        - rubrik: Så gör ni
          rader:
            - ["Välj ett ställe på två till fyra meningar i texten, och sätt tecknet för strategin."]
            - ["Sätt dig i samma rad som din kamrat, mitt emot någon i den andra raden."]
            - ["Den i rad A läser sitt ställe först."]
            - ["Lyssnaren säger: ”Jag förstod att …” och ”Jag hörde att du …”."]
            - ["Nu läser den i rad B, och den i rad A svarar."]
            - ["När läraren säger byt flyttar rad B en stol åt höger, och den som sitter längst till höger går till stolen längst till vänster."]
            - ["Nu läser den i rad A för sin nya lyssnare, och ni gör som förut."]
            - ["Sist säger några vilket ställe de minns bäst."]
        - rubrik: Så tränar ni högläsning
          rader:
            - ["Säg varför du valde stället innan du läser, så vet lyssnaren vad hen ska lyssna efter."]
    - rubrik: "Läsarens förberedelse: inför läsningen för de yngre"
      text:
        - Med bladet förbereder eleven sin bilderbok i fem steg.
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Vecka 6–8, text: "Kopiera bladet till varje elev. Eleven gör steg 1–4 i vecka 6 och 7 och tar med bladet till lyssnaren i steg 5. Hen fyller i rutan om lyssnaren när hen träffar de yngre i vecka 6, och svaret på frågan efter läsningen i vecka 8." }
    - rubrik: Lappen hem
      text:
        - Lappen går hem i vecka 1, och en ny i vecka 8, när eleverna kan läsa sin bilderbok för någon hemma.
      huvud:
        - { rubrik: Namn }
      delar:
        - rubrik: Till vårdnadshavaren
          falt:
            - { rubrik: Högläsning i par, text: "I åtta veckor läser klassen högt i par ur en bok som paret har valt. Eleverna lär sig läsa så att den som lyssnar förstår och känner det texten säger. Ibland kan ditt barn läsa högt för dig ur en egen bok." }
            - { rubrik: När du lyssnar, text: "Lyssna utan att rätta, och vänta en stund om ditt barn fastnar på ett ord. Säg sedan vad du förstod och vad du hörde att rösten gjorde, till exempel: ”Jag förstod att Lisa var rädd. Jag hörde att du viskade.”" }
            - { rubrik: Ett annat språk hemma, text: "Talar ni ett annat språk hemma, kan ditt barn först berätta på det språket vad texten handlar om." }
            - { rubrik: Vecka 8, text: "De åtta veckorna slutar med att eleverna läser en bilderbok för yngre elever. Ditt barn kan också läsa boken för dig eller för någon i släkten, och det går bra i telefon. Skriv gärna dina två meningar i tabellen under." }
      listor:
        - rubrik: Lyssnarens två meningar
          kolumner: [Datum och text, Jag förstod att, Jag hörde att du]
          rader:
            - ["", "", ""]
            - ["", "", ""]
            - ["", "", ""]
            - ["", "", ""]
    - rubrik: "Åk 2–3, provtext: Var är mössan?"
      text:
        - Läs texten tyst. Säg vad den handlar om, och läs den sedan högt för din lärare.
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Vecka 1 och vecka 8, text: "Eleven läser texten tyst och säger vad den handlar om. Sedan läser hen hela texten högt för dig. Spela in läsningen, och fyll i protokollet." }
      listor:
        - rubrik: Var är mössan?
          rader:
            - ["I dag var mössan borta."]
            - ["Elsa letade under sängen, i lådan och bakom dörren."]
            - ["– Har du sett min mössa? frågade hon pappa."]
            - ["– Nej, sa pappa. Har du tittat i väskan?"]
            - ["Elsa öppnade väskan. Där låg böcker, pennor och en banan."]
            - ["Men ingen mössa."]
            - ["Då såg hon katten. Katten låg i korgen och sov på något rött."]
            - ["– Där är den ju! ropade Elsa."]
        - rubrik: Frågorna
          rader:
            - ["Vad handlar texten om?"]
    - rubrik: "Åk 4–5, provtext: Källaren"
      text:
        - Läs texten tyst. Säg vad den handlar om, och läs den sedan högt för din lärare.
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Vecka 1 och vecka 8, text: "Eleven läser texten tyst och säger vad den handlar om. Sedan läser hen hela texten högt för dig. Spela in läsningen, och fyll i protokollet." }
      listor:
        - rubrik: Källaren
          rader:
            - ["I går bad mormor Adam hämta en burk sylt i källaren."]
            - ["– Det tar bara en minut, sa hon."]
            - ["Adam tände lampan och gick nerför trappan. Det luktade fukt, gammalt trä och potatis."]
            - ["Plötsligt slocknade lampan."]
            - ["Adam stod alldeles stilla. Han hörde sitt eget hjärta, och någonstans i mörkret rasslade det."]
            - ["– Vem är där? viskade han."]
            - ["Inget svar. Rasslet kom närmare, och något strök mot hans ben."]
            - ["– Hjälp! skrek Adam och sprang uppför trappan."]
            - ["I köket satt mormor och log. Efter Adam kom katten Sotis."]
            - ["– Var det inte du som skulle hämta sylten? frågade mormor."]
        - rubrik: Frågorna
          rader:
            - ["Vad handlar texten om?"]
    - rubrik: "Lyssnarprotokollet: före och efter"
      text:
        - "Fyll i protokollet i vecka 1 och i vecka 8, och skriv vecka och datum överst. För varje strategi skriver du 1 om eleven inte använder den än, 2 om hen gör det på något ställe och 3 om hen gör det på de flesta ställena. Kunde eleven säga vad texten handlar om? Skriv ja, delvis eller nej under Förstod, och under Orden hur många ord eleven läste fel. Fler än 3 fel i åk 2–3 och fler än 4 fel i åk 4–5 är fler än 5 av 100, och då lyssnar du på eleven i parets bok. Läser eleven fel på fler än 5 ord av 100 där också, väljer paret en lättare bok, och eleven tränar avkodningen vid sidan av. På baksidan skriver du elevens svar på ”Hur känns det att läsa högt för någon?”, och i vecka 8 också det eleven säger om inspelningen. Inspelningarna raderar du efter skolans rutin när perioden är slut."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Före och efter, text: "Ett blad har 14 rader, så kopiera två blad till en klass i vecka 1 och två i vecka 8. Fyll i dem medan eleven läser provtexten eller direkt efter." }
