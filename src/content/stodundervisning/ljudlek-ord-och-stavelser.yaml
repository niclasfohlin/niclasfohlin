principer:
  rubrik: "Tre saker att hålla fast vid"
  text: "Lägg en kloss för varje ord och klappa varje del, samtidigt som du säger ordet eller delen. Säg orden i vanlig takt och klappa också den svaga delen. Blanda ord med en till fyra delar, som på arket Stavelser, så att eleverna räknar i stället för att gissa. Sluta med skrivna delar när gruppen har haft bokstäverna."
passrutin:
  text: "Lektionen går i fyra steg, från att du visar till att var och en gör själv."
  steg:
    - text: "Du lägger en kloss för varje ord eller del och sätter ihop det hela igen."
      fas: "Klossarna"
    - text: "Gruppen lägger klossar med dig och sedan själv, och alla visar dem samtidigt."
      fas: "Säg och räkna"
    - text: "Den ena i paret säger ordet i delar, och den andra lägger klossarna."
      fas: "Dela och sätt ihop"
    - text: "Var och en gör leken med sina tre kort, och du lyssnar på dagens elever."
      fas: "Mina ord"
  efterPasset: "Du noterar i snabbmallen vilka av dagens elever som räknade orden och delarna själva, vad som fastnade, och om gruppen tar samma rad, nästa rad eller nästa lektion."
tidsschema:
  rubrik: "Ett pass på 30 minuter"
  text: "Är passet bara 20 minuter blir ljudstarten tre minuter, lektionen 15 och avslutet två. Stegen får då två, fyra, fem och fyra minuter."
  rader:
    - tid: "Före passet"
      fas: "Förberedelse"
      vad: "Ta fram klossarna, stavelsekorten, bokstavskorten, speglarna och arket för gruppens rad, ett per par och ett till dig. Välj meningarna eller orden till steg 1 och 2 och orden till ljudstarten, och skriv dem, paren och dagens elever i snabbmallen."
    - tid: "0–5 min"
      fas: "Ljudstart"
      vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra, som i Ljudstarten. Alla svarar samtidigt."
    - tid: "5–9 min"
      fas: "Klossarna"
      vad: "Visa tre exempel i gruppens rad: meningar ur tabellen Meningarna, sammansatta ord eller ord i delar. Stå vänd mot eleverna."
    - tid: "9–15 min"
      fas: "Säg och räkna"
      vad: "Gruppen tar sex meningar eller ord, först med dig och sedan själv. Alla visar klossarna för dig samtidigt."
    - tid: "15–20 min"
      fas: "Dela och sätt ihop"
      vad: "Paret tar sex kort ur arket och turas om. Du går mellan paren."
    - tid: "20–25 min"
      fas: "Mina ord"
      vad: "Paret tar de sex andra korten, tre var. Du lyssnar på dagens elever."
    - tid: "25–30 min"
      fas: "Avslut"
      vad: "Var och en säger ett ord från dagens lek och vad hen gjorde med det. Du säger kort vad du hörde."
  efter: "Den som är klar före de andra byter kort med sin kamrat, eller sätter ihop två kort till ett nytt ord. Det får vara påhittat, som solkaka."
steg:
  rubrik: "Vad du gör och säger i varje steg"
  text: "Här är lärarens ord, så att du kan säga dem som de står."
  fraserRubrik: "Exempelfraser"
  rader:
    - namn: "Klossarna"
      fraga: "Hur många delar hör jag?"
      gor: "Första passet med ett nytt ark säger ni bildernas namn i kör, och du säger vad orden betyder. Säg meningen eller ordet, och säg det igen medan du lägger en kloss för varje ord eller del, från vänster, sett från eleverna. För handen över klossarna och sätt ihop det igen. I Stavelser jämför ni sist tåg och nyckelpiga."
      fraser:
        - "Jag ser en ko. En kloss för varje ord. Fyra ord."
        - "A-⁠na-⁠nas. Jag klappar och lägger en kloss för varje del. Tre delar."
        - "Vilket ord är längre, tåg eller nyckelpiga? Vi klappar."
    - namn: "Säg och räkna"
      fraga: "Hur många delar hör vi?"
      gor: "Först säger gruppen efter dig och klappar med. Sedan säger du hela ordet, och gruppen klappar själv och lägger en kloss för varje del. På ditt tecken tar alla bort händerna från klossarna, så att du ser varje elevs klossar. I raden Orden i meningen klappar ni inte, och i Stavelser läser ni sist två stavelsekort."
      fraser:
        - "Ka-⁠ka. Klappa med mig."
        - "Nu själva: melon. En kloss för varje del."
        - "Händerna bort. Två klossar: me-⁠lon."
    - namn: "Dela och sätt ihop"
      fraga: "Hur många delar hör du?"
      gor: "Paret tar sex kort och turas om. Den ena lägger kortet med bilden upp och säger ordet i delar, och den andra lägger en kloss för varje del och vänder kortet. Stämmer inte bågarna med klossarna, säger de ordet igen eller lägger kortet åt sidan till dig. I Stavelser klappar de. I Sammansatta ord tar den andra sist bort ett ord. I raden Orden i meningen säger den ena en mening om bilden, och de vänder inte kortet."
      fraser:
        - "Säg ordet och klappa: gur-⁠ka."
        - "Säg snögubbe utan snö."
        - "Vänd kortet. Lika många bågar som klossar?"
    - namn: "Mina ord"
      fraga: "Kan du göra det själv?"
      gor: "Var och en tar tre kort och gör själv som i steg 3. I Stavelser knackar eleven med fingret för varje del. Lyssna på dagens elever: lägger eleven en kloss för varje ord, också för ordet en? Tar hen bort is ur isbjörn? Räknar hen den svaga delen? Har gruppen haft bokstäverna, läser dagens elever också två stavelsekort för dig."
      fraser:
        - "Säg och knacka samtidigt."
        - "Hur många delar har potatis?"
        - "Du räknade också den svaga delen: to-⁠mat."
arbetsform:
  rubrik: "Arbetsform: alla i kör, växlande, gemensamt"
  text: "I ljudstarten svarar alla samtidigt, och i lektionen går ni från att du visar till att var och en gör själv. Paren och trion sätter du ihop som i Ljudlek i grupp. Den som ännu inte hör delarna sitter med en säker kamrat och säger delarna med handen under hakan."
  delar:
    - rubrik: "1. Alla i kör"
      text: "alla svarar"
      faser:
        - "Ljudstart"
    - rubrik: "2. Växlande"
      text: "du visar, tillsammans, i par, själv"
      faser:
        - "Klossarna"
        - "Säg och räkna"
        - "Dela och sätt ihop"
        - "Mina ord"
    - rubrik: "3. Gemensamt"
      text: "ett ord var"
      faser:
        - "Avslut"
exempel:
  valt:
    rubrik: "Gruppen"
    text: "sex elever i förskoleklass och åk 1, vecka 3, tre pass i veckan. Gruppen gör Ord och stavelser för tredje passet i följd och står i raden Stavelser. Dagens ljud är /m/, och dagens elever är Omar och Mira."
  text:
    - "Ljudstarten. Läraren visar m, och gruppen sätter ihop och delar upp ord ur Två och Tre ljud att dra ut."
    - "Klossarna. Läraren lägger två klossar för ka-⁠ka och tre för a-⁠na-⁠nas. ”Vilket ord är längre, tåg eller nyckelpiga?” Noah säger tåg, och gruppen klappar båda orden: ett klapp och fyra."
    - "Säg och räkna. Gruppen klappar ka-⁠ka med läraren och sedan melon själv. Omar lägger en kloss för melon. Läraren frågar ”Vad hör du?” och säger ordet i vanlig takt: ”Me-⁠lon.” Omar lägger två. Sist ljudar och läser gruppen so och la: sola."
    - "Dela och sätt ihop. Paren är Alva och Elin, Omar och Noah, Leo och Mira. Noah lägger kortet med igelkotten framför Omar och säger ”i-⁠gel-⁠kott”. Omar lägger tre klossar, och de vänder kortet: tre bågar."
    - "Mina ord. Läraren lyssnar på Omar och Mira. Mira knackar sju gånger för potatis, en för varje ljud. Läraren frågar ”Vad hör du?”, säger ordet igen och knackar med. Sedan säger hen: ”Säg det med mig och känn hakan: po-⁠ta-⁠tis.” Mira knackar tre. Omar läser mo, sa: mosa."
    - "Avslutet. Leo säger: ”Ananas. Tre delar.” Läraren säger: ”Ni klappade samtidigt som ni sa delarna.”"
    - "Efteråt noterar läraren: Omar klappar nu den svaga delen, och Mira räknar ljud i stället för delar. Veckan är slut, och gruppen går till nästa förmåga. Mira blir dagens elev oftare och sitter med en säker kamrat."
fastnar:
  rubrik: "När eleven fastnar"
  text: "Vänta tre sekunder och ge minsta möjliga stöd först. Blir det många fel i gruppen, säg det i kör, låt sedan några elever säga det ensamma och ta samma ord minst tre gånger."
  fragaForst:
    - "Vad hör du?"
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg det igen, långsamt, och klappa med: ka-⁠ka. Ett ord som tomat säger du i vanlig takt."
    - "Visa hur munnen gör. Eleven tittar i spegeln och känner efter med handen under hakan: den går ned en gång för varje del."
    - "Gör uppgiften mindre: ett ord med två delar i stället för tre, eller en mening med tre ord."
    - "Visa med handen eller med något att flytta: lägg en kloss för varje del från vänster, sett från eleven, och låt hen peka medan ni säger delarna."
    - "Säg det tillsammans, och låt eleven säga det själv efteråt: po-⁠ta-⁠tis."
  motto: "Till sist klappar och räknar eleven själv."
urval:
  rubrik: "Var hittar du orden och materialet?"
  text:
    - "Bildkorten och stavelsekorten står under Materialet, meningarna i tabellen Meningarna och orden till ljudstarten i Ordbanken."
    - "Egna ord går också bra, utom orden i ljudkollen och i screeningens version B."
  kravText: "Tre krav gäller egna ord:"
  krav:
    - rubrik: "Kända ord"
      text: "Eleven vet vad ordet betyder"
    - rubrik: "Olika långa"
      text: "En till fyra delar, som på arket Stavelser, och högst hälften med samma antal"
    - rubrik: "Två hela ord"
      text: "Båda delarna är ord, som is och björn"
uppfoljning:
  text: "Du ser i steg 4 vad eleverna klarar, och ljudkollen var tredje vecka visar samma sak för varje elev. Berätta konkret för eleven vad hen har lärt sig."
  rader:
    - nar: "Under passet"
      vad: "I steg 4 lyssnar du på dagens elever: lägger eleven en kloss för varje ord, tar hen bort ett ord, och klappar hen varje del samtidigt som hen säger den?"
    - nar: "Efter varje pass"
      vad: "I snabbmallen noterar du dagens elever och det som fastnade."
    - nar: "Var tredje vecka"
      vad: "Du gör ljudkollens uppgift 2 om stavelser, uppgift 3 om första ljudet och uppgift 4 om bokstävernas ljud."
mal:
  rubrik: "Mål: vad eleven ska kunna efter lektionen"
  text: "Efter lektionen ska eleven kunna:"
  punkter:
