        - "Klappa båda: ”Tåg, ett klapp. Nyck-⁠el-⁠pi-⁠ga, fyra.”"
      - - "”igel-⁠kott” med två klapp"
        - "Eleven delar ordet som ett sammansatt ord"
        - "”I-⁠gel-⁠kott. Ett klapp för varje del: tre.”"
      - - "”tomat” med ett klapp"
        - "Den svaga delen faller bort"
        - "Säg ordet i vanlig takt och klappa båda delarna: ”To-⁠mat.”"
      - - "”s-⁠o-⁠l” med tre klapp"
        - "Eleven klappar ljud i stället för delar"
        - "”Sol är en del, ett klapp. Ljuden räknar vi i ljudstarten.”"
  - rubrik: "Varianter"
