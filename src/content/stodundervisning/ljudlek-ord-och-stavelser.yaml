    - rubrik: "Stavelsekorten"
      text:
        - "Här finns nio skrivna delar, i den ordning bokstäverna blir dagens ljud. Två kort bredvid varandra blir ett ord, som so-⁠la, ra-⁠sa, mo-⁠sa, le-⁠ra, me-⁠ra, me-⁠na, vi-⁠la och vi-⁠sa."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Skriv ut korten på tjockt papper och klipp isär dem. Ta bara fram kort med bokstäver som gruppen har haft som dagens ljud. Håll upp två kort eller ställ dem på tavlans list, rättvända och i ordning från vänster, sett från eleverna. Gruppen ljudar varje kort, sss-⁠ooo, so, och läser sedan båda med fingret under: so, la, sola. Byt det ena kortet och läs igen. Säg vad rasa och mena betyder första gången, i en mening. Påhittade ord går också bra."
      listor:
        - rubrik: "Stavelsekort"
          rader:
