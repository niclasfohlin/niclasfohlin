        - "Steg 2 i Stavelser, när ni har fler än tre pass i veckan"
      - - "Stampa delarna"
        - "Alla stampar på stället för varje del och säger delen samtidigt."
        - "Steg 2, när gruppen klappar säkert"
  - rubrik: "Meningarna"
    plats: "efter-urval"
    text: "”En kanin” är två ord, och kaninen är ett."
    kolumner:
