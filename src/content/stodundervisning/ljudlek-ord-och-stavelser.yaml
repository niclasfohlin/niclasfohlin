# En lektion i Ljudlek i grupp, skriven i lektionsskelettet: methods/ljudlek-i-grupp/_lektion.yaml.
titel: "Ljudlek: Ord och stavelser"
undertitel: "En lektion i Ljudlek i grupp: dela meningen i ord och ordet i delar, och läsa ord i två skrivna delar, för F–⁠2"
ingress: "Eleverna lägger en kloss för varje ord i en mening, sätter ihop två ord till ett och klappar delarna i ord. Har de haft bokstäverna, läser de sist ord i två skrivna delar: so och la blir sola. Lektionen hör till Ljudlek i grupp och har samma ljudstart och avslut som de andra lektionerna."
omrade: "Läsning"
arskurs:
  - "F-3"
arskursText: "F–2"
taggar:
  - "fonologisk-medvetenhet"
  - "bokstavskunskap"
  - "lasinlarning"
  - "intensivtraning"
format:
  - "liten grupp"
  - "par"
tid: "30 minuter per pass, tre till fem pass i veckan"
period: "Högst en vecka, tre till fem pass"
grupp: "2–12 elever"
material:
  - "Bildkorten under Materialet: arket för gruppens rad, ett per par och ett till dig"
  - "Sex klossar eller knappar per elev och sex till dig"
  - "Stavelsekorten under Materialet, en sats till dig"
  - "Bokstavskorten under Materialet och en spegel per par"
  - "Snabbmallen för noteringen efter passet"
uppdaterad: "2026-09-29"
utkast: false
serie: "ljudlek-i-grupp"
formaga: 2
tranar: "dela meningar i ord och ord i stavelser"
inledning:
  - "I Ord och stavelser upptäcker eleverna att en mening består av ord och att ett ord består av delar som går att klappa: ”Jag ser en ko” är fyra ord, och ananas är tre delar. Lektionen hjälper eleven med det som gör delarna svåra att höra: i talet flyter orden ihop, eleven tycker att tåg är ett längre ord än nyckelpiga eftersom tåget är långt, och småord och svaga delar, som to i tomat, faller bort."
  - "Syftet är att eleverna ska höra orden och delarna, så att de kan skriva med mellanrum mellan orden och läsa längre ord i delar. Ditt uppdrag är att visa hur man lägger en kloss för varje ord och klappar delarna, att säga orden i vanlig takt och att sluta med skrivna delar som gruppen läser."
  - "Välj Ord och stavelser när fler än hälften av eleverna har färre än tre rätt av fyra på ljudkollens uppgift 2, ord och stavelser. Ljudkollen står i Ljudlek i grupp, och lektionen hör till förmåga 2 i lektionsbanken där."
upplagg:
  rubrik: "Så används lektionen"
  text: "Passet har samma ram i alla lektioner: fem minuter ljudstart, 20 minuter lektion i fyra steg och fem minuter avslut. Ljudlek i grupp beskriver gruppen, dagens elever och ljudkollen. Ord och stavelser går igenom de tre raderna i Så blir lektionen svårare och tar högst en vecka, eftersom lekar med bara stavelser ger liten effekt på läsningen. Har ni tre pass i veckan, ta en rad per pass. Har ni fler, ta nästa rad när nästan alla gör rätt i andra halvan av steg 2. Efter sista raden går gruppen till nästa förmåga där fler än hälften inte klarar uppgiften i ljudkollen."
tabeller:
  - rubrik: "Så blir lektionen svårare"
    plats: "efter-inledning"
    kolumner:
      - "Leken"
      - "Så låter det"
      - "Så gör ni"
    rader:
