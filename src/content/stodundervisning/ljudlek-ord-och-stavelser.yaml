grund:
  text: "Stavelser hörs lättare än ljud (Liberman m.fl., 1974), och International Literacy Association (2019) och Wolff (2017) rekommenderar en kort period med ord och stavelser för barn som behöver stöd i att höra delarna i orden. Lekar med stavelser gav ändå liten effekt på den senare läsningen, och 2007 tog Bornholmsmodellen bort de flesta av dem (Lundberg och Strid, 2009). Därför är lektionen kort och slutar med skrivna delar som eleven ljudar och läser."
  kallor: "Bygger på International Literacy Association (2019), Liberman m.fl. (1974), Lundberg och Strid (2009) och Wolff (2017)."
ramar:
  rubrik: "Materialet"
  text:
    - "Här finns bildkorten, stavelsekorten och bokstavskorten. Allt går att kopiera. Laminera stavelsekorten och bokstavskorten, och bildkorten när de är vikta och limmade."
  ramar:
    - rubrik: "Bildkorten"
      text:
        - "Det finns två ark: Stavelser, med ord i en till fyra delar, och Sammansatta ord, där två ord blir ett. Arket står två gånger på sidan, så en sida räcker till två par, eller till ett par och dig."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Klipp längs strecken och vik varje kort längs den blå prickade linjen, så att bilden blir framsidan och ordet baksidan. Limma ihop halvorna och laminera sist. Vänd kortet som en sida i en bok, så står ordet rätt. På baksidan står ordet i delar med en båge under varje del: en för varje stavelse på arket Stavelser och en för varje ord på arket Sammansatta ord. Första passet med ett nytt ark säger ni bildernas namn i kör, och du säger vad orden betyder: ”Det här är en isbit. Vi säger isbit.” Rätta antalet delar, och låt eleven dela där hen hör gränsen."
      listor:
        - rubrik: "Bildkort · Stavelser"
          rader:
            - - "sol"
              - "a-na-nas"
              - "ka-ka"
            - - "gur-ka"
