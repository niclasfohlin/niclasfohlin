        - "Jag ser en ko: fyra ord."
        - "Lägg en kloss för varje ord, utan att klappa. Säg meningen i vanlig takt och räkna också småorden, som ordet en. Dra sist ett streck på tavlan för varje ord."
      - - "Sammansatta ord"
        - "is och björn: isbjörn."
        - "Sätt ihop två ord till ett och ta bort det ena: säg isbjörn utan is. Lägg en kloss för varje ord, utan att klappa."
      - - "Stavelser"
        - "ka-⁠ka: två delar. a-⁠na-⁠nas: tre."
        - "Klappa och lägg en kloss för varje del. Klappa också den svaga delen: to-⁠mat. Har gruppen haft bokstäverna, läser ni sist två stavelsekort: so och la blir sola."
    not: "Gruppen börjar i raden Orden i meningen. Där tar ni korten i steg 3 och 4 från arket Stavelser. Bildkorten är vikta, med bilden på framsidan, ordet i delar på baksidan och en båge under varje del. Den som klappade banan eller krokodil med en del för lite i ljudkollen får to-⁠mat, ka-⁠nin och po-⁠ta-⁠tis i steg 4."
  - rubrik: "Ljudstarten: samma fem minuter varje pass"
    plats: "efter-tidsschema"
    text: "Alla svarar samtidigt. Vänd ansiktet mot eleverna, så att de ser din mun."
    kolumner:
      - "Moment"
      - "Så gör du"
    rader:
      - - "Dagens ljud"
        - "Visa bokstaven och säg ljudet. Alla säger efter, och någon säger ett ord på ljudet. Sist säger alla ljuden för några bokstäver ni har haft."
      - - "Sätt ihop"
        - "Dra ut fem ord utan paus, med handen från vänster till höger sett från eleverna. Räkna tyst till tre och knyt handen, så säger alla ordet. Sist säger en av dagens elever ett ord ensam."
      - - "Dela upp"
        - "Säg fyra ord med olika många ljud. Alla säger ordet och sedan ljuden, med ett finger för varje, och räknar fingrarna sist. I lektionerna före Räkna ljud i banken säger du ljuden först och gruppen efter."
    not: "Säg ljudet och inte bokstavens namn, och b, d, g, k, p och t korta och utan ö. Orden tar du ur Ordbanken, och i Dela upp blandar du in ord ur de lättare ordgrupperna, så att orden har olika många ljud. Dagens ljud, dina fraser och ordgrupperna står i Ljudlek i grupp. Gruppen behåller sin ordgrupp från lektion till lektion."
  - rubrik: "Lyssna efter"
    plats: "efter-steg"
    text: "Bekräfta först det som eleven gjorde rätt, och försök sedan igen tillsammans."
    kolumner:
      - "Eleven säger"
      - "Det som händer"
      - "Så gör du"
    rader:
      - - "”Jag ser en ko” med tre klossar"
        - "Eleven räknar inte småordet"
        - "”Säg meningen igen och lägg en kloss för varje ord, också för ordet en.”"
      - - "”is” när is ska bort ur isbjörn"
