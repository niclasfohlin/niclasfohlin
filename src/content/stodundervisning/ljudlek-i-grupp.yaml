# Metod i stödundervisning. Modellen står i methods/_mall.yaml och docs/modell.md.
titel: Ljudlek i grupp
undertitel: "Språkljud och bokstäver i grupp för F–⁠2, med en lektionsbank att välja ur"
ingress: "Eleverna hör, delar upp och sätter ihop ljuden i ord och kopplar dem till bokstäver. Varje pass börjar med fem minuter där alla sätter ihop och delar upp ord. Sedan kommer en lektion som du väljer ur lektionsbanken efter en kort kartläggning. Insatsen är för elever i F–2 som behöver stöd i att upptäcka språkljuden."
omrade: Läsning
arskurs:
  - F-3
arskursText: "F–2"
taggar:
  - fonologisk-medvetenhet
  - bokstavskunskap
  - lasinlarning
  - intensivtraning
format:
  - liten grupp
  - par
tid: 30 minuter per pass, tre till fem pass i veckan
period: 10–12 veckor
grupp: 2–12 elever
material:
  - "Bokstavskorten till dagens ljud, under Materialet"
  - "Bokstavskartan under Materialet, till den som behöver stöd att minnas bokstävernas ljud"
  - En liten spegel per par
  - "Lektionens material: bildkort, bokstavskort, golvbokstäver, markörer, ljudrutor eller platsrutor"
  - "Screeningen, ljudkollen och protokollet, under Materialet, och fyra markörer till ljudkollen"
  - Snabbmallen för noteringen efter passet
uppdaterad: 2026-09-29
relaterade:
  - laslistor-i-grupp
  - til-i-grupp
utkast: true
lektionsbank:
  rubrik: "Lektionsbanken: förmågorna och lektionerna"
  text: "Varje lektion tränar en förmåga, och förmågorna har samma nummer som uppgifterna i ljudkollen. Ordningen mellan förmågorna är ett förslag. Gruppen börjar i den första förmågan där fler än hälften av eleverna har en ring på uppgiften i gruppens översikt och hoppar över det som den redan kan, och du väljer en lektion för förmågan. Nya lektioner läggs in under den förmåga de tränar."
  formagor:
    - nr: 1
      namn: "Rim"
      skal: "Den lättaste vägen in i ljuden, men inte nödvändig för läsningen. Högst en vecka."
    - nr: 2
      namn: "Ord och stavelser"
      skal: "Större delar före de enskilda ljuden. Högst en vecka."
    - nr: 3
      namn: "Första ljudet"
      skal: "Första ljudet är lättast att höra, och där börjar ni med bokstäverna."
    - nr: 4
      namn: "Bokstävernas ljud"
      skal: "Bokstäverna tidigt, med kroppen som stöd för ordningen i ordet."
    - nr: 5
      namn: "Sist och i mitten"
      skal: "Ljudet i mitten är svårast att höra, så det kommer efter det första och det sista."
    - nr: 6
      namn: "Dela upp"
      skal: "Att dela upp är kärnan, tillsammans med att sätta ihop."
    - nr: 7
      namn: "Skriva ord"
      skal: "Ljuden med bokstäverna, en bokstav i taget."
    - nr: 8
      namn: "Sätta ihop och byta"
      skal: "Att ändra ljud är det svåraste och kommer sist. I förmåga 7 är bytet en väg till att skriva, men här är ändringen själva uppgiften."
  not: "Att sätta ihop och dela upp tränar ni redan i varje ljudstart. I åk 1–⁠2 börjar gruppen oftast i förmåga 3 eller senare och lägger mer tid på förmåga 7 och 8. Varje lektion säger när gruppen går vidare, och då tar gruppen nästa förmåga där fler än hälften har en ring. Har förmågan flera lektioner kan gruppen ta dem efter varandra. Ljudkollen var tredje vecka visar samma sak för varje uppgift, och säger den något annat än lektionens regel går du efter ljudkollen. Den som redan är säker blir den säkrare i paret och får ord ur nästa ordgrupp. Den som har ringar på uppgifter före gruppens förmåga får ord ur en lättare ordgrupp, blir dagens elev oftare och sitter med en säker kamrat."
inledning:
  - "Ljudlek i grupp är för elever i förskoleklass till årskurs 2 som behöver stöd i att höra ljuden i orden och koppla dem till bokstäverna. Det märks när eleven säger ess om första ljudet i sol, gissar ett ord efter första bokstaven eller tvekar om sol och sko börjar med samma ljud."
  - "Så här lär sig eleven läsa och skriva. Att läsa är att se bokstäverna i ordning, säga ljudet för varje bokstav och sätta ihop ljuden till ett ord: sss-⁠ooo-⁠lll, sol. Att skriva är samma sak åt andra hållet: eleven säger ordet långsamt, hör ljuden ett i taget och skriver en bokstav för varje ljud. Eleven behöver alltså tre saker: höra ljuden i orden, kunna bokstävernas ljud, och kunna sätta ihop ljud och dela upp ord. Har eleven ljudat ett ord några gånger känner hen igen det direkt, och då går läsningen fort."
  - "Syftet är att eleverna knäcker läskoden: att de hör ljuden i orden, kan bokstävernas ljud och kan sätta ihop och dela upp korta ord, så att de kan läsa och skriva dem själva. Undervisning i ljuden hjälper mest de elever som har kommit kortast, och den ger mest när bokstäverna finns med från första passet."
  - "Din roll är att visa, lyssna och välja. Du visar varje lek först och tänker högt, gör den sedan tillsammans med gruppen och låter eleverna ta över, först i par och sedan var för sig, medan du lyssnar på några elever i varje pass. Du säger ljuden rent och drar ut dem som går att dra ut, väntar innan du hjälper och ger minsta möjliga stöd. Du tar reda på vad varje elev kan med två kartläggningar: screeningen har fem nivåer, från första ljudet till att läsa meningar, och ljudkollen har nio korta uppgifter som följer förmågorna i lektionsbanken. Efter det väljer du lektion och följer eleverna."
  - "Varje pass börjar med ljudstarten, fem minuter där alla sätter ihop och delar upp ord, och fortsätter med en lektion ur lektionsbanken. Lektionerna tränar var sin del av det eleven behöver, från rim till att byta ett ljud i ett ord, och gruppen tar den lektion som den behöver enligt ljudkollen. Det som gäller alla lektioner står här: eleverna, din roll, ljudstarten, dagens ljud, stödet när eleven fastnar, felsökningen och uppföljningen. Varje lektion har sina egna fyra steg, sina ord och sitt material."
upplagg:
  rubrik: Så fungerar insatsen
  text: "Insatsen pågår i 10–⁠12 veckor med tre till fem pass i veckan, helst fler än tre för en grupp som har kommit kortast. Varje pass är cirka 30 minuter och har tre delar: ljudstarten, lektionen och avslutet. Ljudstarten är likadan varje pass. Lektionen väljer du ur lektionsbanken, där lektionerna är ordnade efter förmågan de tränar, och gruppen gör samma lektion flera pass i följd. Banken kan växa med fler lektioner för varje förmåga. Screeningen och ljudkollen gör du med varje elev utanför passen, cirka tolv minuter per elev, före första passet eller under den första veckan. Innan ljudkollen är gjord tar gruppen lektionen Första ljudet, med s som dagens ljud. Gör ljudkollen före screeningen, eftersom du väljer lektion efter ljudkollen. Var tredje vecka gör du ljudkollen igen, två till tre minuter per elev, och efter perioden gör du båda och jämför med starten. I lektionens steg 4 lyssnar du extra på dagens elever, några elever per pass, så att du hör var och en varje vecka. Efter passet noterar du i snabbmallen vilka som klarade steg 4 själva och vad som fastnade."
gruppen:
  rubrik: Så väljer du eleverna och sätter ihop paren
  text: "Ljudlek är för elever i F–2 som klarar högst nivå 4 i screeningen, där eleven läser ord, och för osäkra nybörjarläsare som behöver mer träning i ljuden. Också den som ännu inte klarar nivå 1 hör hit. Du kan starta gruppen utifrån det du vet om eleverna eller en kartläggning ni redan har. Den som klarar nivå 5 och läser de fyra påhittade orden i ljudkollens uppgift 9 behöver läsa och skriva mer, till exempel i Läslistor i grupp eller TIL i grupp. Har en elev svårt att följa instruktioner, ett litet ordförråd eller otydligt tal, kopplar du in logopeden samtidigt. Eleven får vara med i Ljudlek, men behöver också egen undervisning i språket. Elever med svenska som andraspråk klarar ljuden lika bra som andra när de känner orden. Säg vad ordet betyder första gången, sätt det i en mening och använd bilder. Att de blandar ihop ljud som p och b är väntat och inget tecken på dyslexi. Är svenskan ny för eleven, tar du reda på hur hen klarar samma sak på sitt förstaspråk, gärna med modersmålsläraren, innan du kopplar in logopeden. Hela gruppen, två till tolv elever, arbetar tillsammans. I steg 3 arbetar eleverna i par, så att tolv elever blir sex par att gå mellan. Sätt ihop varje par med en säkrare och en mindre säker elev. Med ett udda antal blir det en trio, där oftast en säger ordet och två turas om att göra leken, om inte lektionen säger något annat. Med två elever är du med i leken."
tabeller:
  - rubrik: "Från rim till ljud: det eleverna lär sig"
    plats: efter-inledning
    kolumner:
      - Det eleven gör
      - Så låter det
      - Förmågan i lektionsbanken
    rader:
      - - Hör rim och byter början av ordet
        - "Hus, mus och lus rimmar."
        - "1 · Rim"
      - - Delar meningar i ord och ord i stavelser
        - "Jag ser en ko: fyra ord. so-⁠la, to-⁠ma-⁠ter"
        - "2 · Ord och stavelser"
      - - Hör första ljudet
        - Sol börjar på /s/.
        - "3 · Första ljudet"
      - - Kopplar ljudet till bokstaven
        - "Bokstaven m låter mmm."
        - "4 · Bokstävernas ljud, och dagens ljud i varje pass"
      - - "Hör var ljudet finns: först, sist eller i mitten"
        - I sol hörs /l/ sist och /o/ i mitten.
        - "5 · Sist och i mitten"
      - - Delar upp ordet i ljud (ljudanalys)
        - "räv: /r/ /ä/ /v/, tre ljud"
        - "6 · Dela upp"
      - - Bygger och skriver ord med bokstäverna
        - "l-⁠u-⁠s blir lus. Byt /l/ mot /m/, så blir det mus."
        - "7 · Skriva ord"
      - - "Sätter ihop ljud till ord (ljudsyntes), och byter, tar bort och lägger till ljud"
        - "rrrääävvv blir räv. Mål utan /m/ blir ål."
        - "8 · Sätta ihop och byta, och varje ljudstart"
    not: "Ordningen går från ord och stavelser till de enskilda ljuden, men eleven behöver inte klara det ena helt innan hen går vidare. Att sätta ihop och dela upp tränar ni i varje pass. Vokalens längd behöver eleverna höra tidigt, och när dagens ljud är en vokal jämför ni kal och kall. Stavelserna hjälper sedan i längre ord, och i gruppen kallar ni dem delar. I Rim är början allt före vokalen, /st/ i stol, och resten står kvar när eleven byter början. Det är en lättare form av att byta ljud, som kommer sist i banken. Från och med lektionen Första ljudet lyssnar eleven på det första ljudet, /s/ i stol."
  - rubrik: "Ljudstarten: samma fem minuter varje pass"
    plats: efter-steg
    text: "I ljudstarten tränar ni varje pass att sätta ihop och dela upp ord, som är kärnan i läsningen. Alla svarar samtidigt, så att du hör och ser hela gruppen. Vänd ansiktet mot eleverna, så att de ser din mun, och sitt gärna vid sidan av dem. Sitter du mitt emot dem för du handen från din högra sida till din vänstra, så att de ser den gå från vänster till höger."
    kolumner:
      - Moment
      - Så gör du
      - Så kan det låta
    rader:
      - - Dagens ljud
        - "Håll upp bokstavskortet och säg ljudet. Alla säger ljudet och känner det i munnen, och tittar gärna i spegeln. Någon säger ett ord som börjar på ljudet. Sist säger alla ljuden för några bokstäver som gruppen har haft, gärna de som gruppen tvekar på."
        - "”Det här är /m/. Mmm. Känn hur läpparna ligger mot varandra.” ”Det här är /t/. Kort, utan ö. Känn luften mot handen.”"
      - - Sätt ihop
        - "Dra ut ljuden i fem ord utan paus, och för handen från vänster till höger. Räkna tyst till tre och knyt handen, så säger alla ordet. Låt en av dagens elever säga ett ord ensam."
        - "”Mmmooosss.” Du knyter handen. ”Mos!”"
      - - Dela upp
        - "Säg fyra ord med olika många ljud. Alla säger ordet, sedan ljuden, och håller upp ett finger för varje ljud. Sist räknar ni fingrarna. I lektionerna före Räkna ljud i banken säger du ljuden först och gruppen efter."
        - "”Mus. Säg ljuden.” ”/m/ /u/ /s/. Tre!”"
    not: "Orden tar du ur Ordbanken, i den ordgrupp där gruppen står. I Dela upp blandar du in ord ur de lättare ordgrupperna, så att orden har olika många ljud och eleverna räknar i stället för att gissa. När ni sätter ihop kan du gärna ta ord ur nästa ordgrupp, eftersom det är lättare än att dela upp. När gruppen sätter ihop utdragna ljud säkert säger du ljuden kortare, och till sist med en kort paus, som i ljudkollen. När gruppen kan bokstäverna i ordet lägger du ut bokstavskorten, rättvända för eleverna, och drar fingret under dem medan du ljudar. När gruppen har lektionen Rim hoppar du över ordet som börjar på ljudet, eftersom eleverna lätt blandar ihop rim och första ljudet när lekarna växlar. En elev som ännu inte hör rim eller delarna i ett ord efter lektionerna Rim och Ord och stavelser får ett rimpar eller ett ord att klappa sist i Dela upp, tills ljudkollen visar att hen klarar det."
  - rubrik: "Dagens ljud: bokstävernas ordning"
    plats: efter-steg
    text: "Dagens ljud är ljudet för den första bokstaven i ordningen som fler än hälften av eleverna inte kan enligt ljudkollen. Ta ungefär två nya ljud i veckan, och ett nytt först när gruppen säger de förra säkert. Samma ljud kan vara dagens ljud i flera pass. Kan gruppen alla bokstäver blir dagens ljud de ljud som gruppen blandar ihop, som p och b eller e och ä. Ordningen är densamma som i Läslistor i grupp, och bokstavskorten under Materialet står i samma ordning. Bokstäverna som gruppen har haft är bokstaven för dagens ljud, bokstäverna före den i ordningen och de bokstäver längre fram som gruppen redan kan. I lektionerna lägger du bara fram sådana bokstäver. Behöver en uppgift en annan bokstav, skriver eller visar du den, eller så pekar eleven på bokstavskartan. Det ni gör muntligt kräver inga bokstäver."
    kolumner:
      - Ordningen
      - Bokstäverna
    rader:
      - - "De tio första, ungefär vecka 1–⁠5"
        - "s, o, l, a, r, m, e, n, i, v"
      - - "Sedan, ungefär vecka 6–⁠12"
        - "t, f, å, p, k, d, u, b, g, h, y, ä, ö, j"
    not: "Är dagens ljud en vokal, säg den lång: ooo som i sol, och jämför med den korta i ett ordpar, som kal och kall. Kort e låter som ä, så eld och elefant börjar med samma ljud som äpple. Är det b, d, g, k, p eller t, säg det kort och utan ö, och säg det också i ett ord: /t/ i tak. Säger någon ett ord som börjar på bokstaven men inte på ljudet, som sju för /s/, säg: ”Sju börjar på ett annat ljud. Vi letar ord som börjar på sss.”"
  - rubrik: Lektionens fyra steg
    plats: efter-steg
    text: "Varje lektion har sitt eget innehåll i stegen, men samma ordning och tider. I den ordningen lämnar du över ansvaret till eleven."
    kolumner:
      - Steg
      - Så gör du
      - Tid
    rader:
      - - "1 · Läraren visar"
        - "Du visar leken med två eller tre ord och tänker högt. Eleverna tittar, lyssnar och härmar."
        - 3–⁠4 min
      - - "2 · Tillsammans"
        - "Ni gör leken tillsammans. Alla svarar samtidigt, och en elev i taget visar vid tavlan eller på golvet."
        - 5–⁠6 min
      - - "3 · I par"
        - "Paren turas om: den ena säger ordet och den andra gör leken, och efter varje ord byter de roller. Du går mellan paren och ger stöd."
        - 5 min
      - - "4 · Var för sig"
        - "Var och en gör leken med sitt eget material. Du lyssnar på dagens elever och ser vilka som klarar leken själva."
        - 4–⁠5 min
    not: "Dagens elever är de elever du lyssnar extra på i steg 4. Dela antalet elever med antalet pass i veckan och avrunda uppåt, så att du hör var och en minst en gång i veckan. Tolv elever och tre pass blir fyra per pass. Skriv upp dem i snabbmallen före passet."
  - rubrik: "Felsökning: var ljuden brister och hur du stöttar"
    plats: efter-fastnar
    text: "När en elev fastnar i samma sak pass efter pass, lyssna efter var det brister och stötta där. Felsökningen gäller alla lektioner, och lektionen som tränar det står sist i raden, när det finns en."
    kolumner:
      - Det du hör
      - Där det brister
      - Så stöttar du
    rader:
      - - "”Tåg är längre än nyckelpiga.”"
        - "Eleven lyssnar på vad ordet betyder och inte på hur det låter."
        - "Säg och klappa båda orden: tåg, ett klapp, nyck-⁠el-⁠pi-⁠ga, fyra. Lektionerna Rim och Ord och stavelser tränar det, när ljudkollen visar att gruppen behöver dem."
      - - "”ess” om första ljudet i sol"
        - "Eleven blandar ihop bokstavens namn och ljud."
        - "Säg ljudet: ”Ess är namnet. Ljudet är sss.” Eleven tittar i spegeln och känner ljudet i munnen. Dagens ljud i ljudstarten och lektionen Bokstavsgympa."
      - - "”sol” eller ”so” när du frågar efter första ljudet"
        - "Eleven hör ordet eller stavelsen som en helhet och skiljer inte ut det första ljudet."
        - "Dra ut det första ljudet och sluta där: sss-⁠ol. Börja med ljud som går att dra ut, som /s/, /m/ och /l/. Lektionen Första ljudet."
      - - "”bö-⁠å-⁠tö”, och ordet kommer inte"
        - "Eleven lägger ett ö efter b, d, g, k, p eller t, och ljuden går inte ihop."
        - "Säg klusilen kort och direkt in i vokalen: b-⁠ååå-⁠t. Ta först ord med ljud att dra ut, sedan ord som slutar på en klusil och sist ord som börjar på en klusil, som i Ordbanken."
      - - "”ak” när du säger /t/ /a/ /k/"
        - "Eleven glömmer de första ljuden när det blir en paus mellan dem."
        - "Dra ut ljuden utan paus och för handen från vänster till höger: sssooolll. Sätt ihop ljud för ljud: /t/, ta, tak. Pausa först när gruppen är säker. Ljudstarten och lektionen Från ljud till ord."
      - - "”m-⁠s” för mos, eller mr när eleven skriver mer"
        - "Eleven hör det första och det sista ljudet, men vokalen i mitten faller bort."
        - "Dra ut vokalen och öppna munnen. Fråga efter det första ljudet, sedan det sista och till sist ljudet i mitten, och låt eleven lägga en markör i rätt ruta eller en för varje ljud. Lektionerna Smaka på ljud, Räkna ljud och Skriv ord tillsammans."
      - - "”sen” för sten, ”hud” för hund"
        - "En konsonant i ett konsonantmöte faller bort, oftast när mötet står sist."
        - "Dra ut det ljud i mötet som går att dra ut: sss-⁠t-⁠eee-⁠n, hu-⁠nnn-⁠d. Eleven lägger en markör för varje ljud. Ta ord med möte först före ord med möte sist. Lektionen Räkna ljud."
      - - "”dak” för tak, ”brata” för prata, e för ä"
        - "Eleven blandar ihop ljud som liknar varandra: p och b, t och d, k och g, f och v, e och ä, i och y, o och å, o och u."
        - "Låt eleven känna luften mot handen vid /p/ och surret på halsen vid /v/, och se skillnaden mellan /i/ och /y/ i spegeln. Ta ordpar med bilder som skiljer sig på just det ljudet. Hos elever med svenska som andraspråk är det väntat och inget tecken på dyslexi."
      - - "”Två” när du frågar hur många ljud sola har"
        - "Eleven räknar stavelser när du frågar efter ljud."
        - "Kalla ljuden för ljud och stavelserna för delar, och håll tecknen isär: fingrar och markörer för ljud, klapp för delar. Dra ut ordet: sssooolllaaa, fyra ljud. Lektionen Räkna ljud."
      - - "”sko” när det står sol"
        - "Eleven läser den första bokstaven och gissar resten."
        - "Dra fingret under varje bokstav och säg varje ljud från vänster, utan att stanna. Fråga: ”Står det så?” Lektionerna Bokstavsgympa och Skriv ord tillsammans."
      - - "Eleven klarar kända ord men tvekar på nya bilder"
        - "Ordet är okänt, så eleven har inget att jämföra ljuden med."
        - "Säg vad ordet betyder och sätt det i en mening, och säg bildernas namn i kör första gången. Ta ord som eleverna känner."
      - - "Eleven hittar det nya ordet men kan inte säga vilket ljud som ändrades"
        - "Eleven hör hela ord men inte ljudet som byttes."
        - "Fråga vilket ljud som gick och vilket som kom, och gör ändringen med bokstavskorten. Lektionen Från ljud till ord."
      - - "”dåt” för båt, eller b och d förväxlade i skrift"
        - "Eleven vänder bokstäver som liknar varandra: b och d eller n och u."
        - "Säg ljudet och visa bokstaven med ett ord och en bild, som på bokstavskartan, och håll korten rättvända. Lektionen Bokstavsgympa."
      - - "Samma fel pass efter pass, och inga framsteg på ljudkollen vecka 6"
        - "Något annat står i vägen: hörseln, språket eller en läs- och skrivsvårighet."
        - "Ta det med elevhälsan och se till att hörseln kontrolleras. Har eleven svårt att följa instruktioner eller upprepa nya ord, kopplar du in logopeden. Är svenskan ny för eleven, tar du först reda på hur hen klarar samma sak på sitt förstaspråk. Har eleven inte gått framåt efter perioden, får hen mer intensivt stöd, gärna enskilt."
  - rubrik: Ordbanken
    plats: efter-urval
    text: "Här är orden till ljudstarten, i sex ordgrupper från lätt till svårt. Alla ord är ljudenliga, med ett ljud för varje bokstav, och lektionerna sorterar sina ord i samma ordgrupper. Gruppen börjar i Tre ljud att dra ut, eller i Två ljud att dra ut om fler än hälften håller upp fel antal fingrar. Ta nästa ordgrupp när nästan alla visar rätt antal fingrar i alla fyra orden, två pass i följd. Gruppen behåller sin ordgrupp från lektion till lektion. I en lektion där raderna är ordgrupperna, som Räkna ljud, är ordgruppen densamma som raden."
    kolumner:
      - Ordgrupp
      - Orden
    rader:
      - - Två ljud att dra ut
        - "is, ål, se, le, ro, sy, nu, ny, så"
      - - Tre ljud att dra ut
        - "sol, lus, mus, mos, vas, mål, nål, mås, sås, räv, säl, hår"
      - - Med klusil
        - "mat, lök, nöt, pil, gås, kål, gul, bad, båt, tåg, duk, tak"
      - - Två stavelser
        - "sola, mosa, lera, rasa, mera, läsa, måla, leta, vila, bada, baka, kaka"
      - - Konsonantmöte först
        - "snö, blå, sko, bro, tre, grå, klo, stå, sten, stol, glas, svan, stor, smör"
      - - Konsonantmöte sist
        - "fisk, mask, hand, sand, hund, vind, land, hals, rund, tält"
    not: "Orden står i ordning, lättast först, och i Med klusil kommer först orden där klusilen står sist. I Konsonantmöte sist är vokalen kort: dra ut de konsonanter som går att dra ut och säg vokalen kort, fff-⁠i-⁠sss-⁠k. Kort u, som i hund, låter nästan som ö. Säg vad ordet betyder första gången, också när du tror att alla vet. Ord som man, rum och jag låter inte som de stavas och väntar tills eleverna läser. Orden i ljudkollen och i screeningens version B är inte övningsord: de står varken i Ordbanken, på korten eller i exemplen, så att kollen mäter vad eleven kan och inte vilka ord eleven har övat."
principer:
  rubrik: Fyra saker att hålla fast vid
  text: "Visa alltid först: tänk högt, peka och för handen från vänster till höger, sett från eleverna, och säg sedan ordet tillsammans. Säg ljudet och inte bokstavens namn när ni ljudar, och dra ut ljuden utan paus när ni sätter ihop dem, eftersom en paus gör att eleven tappar de första ljuden. Gör en sak i taget: ta samma lektion flera pass i följd och samma ord två gånger, eftersom det ger mer än nya lekar varje gång. Avsluta när det fortfarande går bra."
passrutin:
  text: "Varje pass har samma tre delar. I ljudstarten tränar ni att sätta ihop och dela upp ord varje pass, och du visar dagens ljud med bokstaven. Lektionen tränar en sak i taget i fyra steg, från att du visar till att var och en gör leken själv. I avslutet samlas gruppen igen, och eleverna säger vad de har gjort. När eleverna vet vad som ska hända kan de lägga kraften på ljuden."
  steg:
    - text: "Du visar dagens ljud med bokstaven, och alla sätter ihop och delar upp ord i kör."
      fas: Ljudstart
    - text: "Gruppen gör lektionen i fyra steg: du visar, ni gör tillsammans, eleverna gör i par och sedan var för sig."
      fas: Lektionen
    - text: "Var och en säger ett ord från dagens lek, och du säger vad du hörde."
      fas: Avslut
  efterPasset: "Du noterar i snabbmallen vilka av dagens elever som klarade steg 4 själva, vilka ljud och ord som fastnade, och om gruppen tar samma lektion igen eller nästa."
  kallas: delar
tidsschema:
  rubrik: Ett pass på 30 minuter
  text: "Välj lektionen och orden före passet. Är passet bara 20 minuter blir ljudstarten tre minuter, lektionen 15 och avslutet två. Stegen får då två, fyra, fem och fyra minuter."
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: "Välj orden ur Ordbanken och ta fram bokstavskortet för dagens ljud och några som gruppen har haft. Lägg lektionens material vid varje plats, och en spegel per par. Bestäm paren och dagens elever, och skriv dem i snabbmallen."
    - tid: 0–5 min
      fas: Ljudstart
      vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra ord. Alla svarar samtidigt, och en av dagens elever sätter ihop ett ord ensam. Lyssna efter bokstavsnamn, pauser mellan ljuden och ett ö efter klusilerna."
    - tid: 5–25 min
      fas: Lektionen
      vad: "Steg 1 visar du, i tre till fyra minuter. Steg 2 gör ni tillsammans i fem till sex minuter, och steg 3 i par i fem minuter, medan du går mellan paren. Steg 4 gör var och en i fyra till fem minuter, och du lyssnar på dagens elever."
    - tid: 25–30 min
      fas: Avslut
      vad: "Var och en säger ett ord från dagens lek och vad hen gjorde med det. Du säger kort vad du hörde."
  efter: "Den som är klar före de andra tar ett ord ur nästa ordgrupp i lektionens material, eller gör leken en gång till."
steg:
  rubrik: Vad du gör och säger i varje del
  text: "Lektionens egna fraser står i varje lektion."
  fraserRubrik: Exempelfraser
  rader:
    - namn: Ljudstart
      fraga: Vilket ljud, och vilket ord?
      gor: "Visa dagens ljud med bokstaven och dra ut ljuden utan paus. Säg klusilerna korta och utan ö. Alla svarar samtidigt, och du lyssnar efter den som tvekar."
      fraser:
        - "Det här är /m/. Mmm. Känn på läpparna."
        - "Mmmooosss. Vilket ord blir det?"
        - "Mus. Säg ljuden och håll upp ett finger för varje."
        - "Sju börjar på ett annat ljud. Vi letar ord som börjar på sss."
    - namn: Lektionen
      fraga: Kan du göra det själv?
      gor: "Visa leken först och tänk högt. Låt sedan gruppen, paren och var och en ta över, och ge återkoppling på det eleven gör."
      fraser:
        - Titta hur jag gör. Jag drar ut ordet och lyssnar.
        - Nu gör vi det tillsammans.
        - Du hörde ljudet i mitten, för du drog ut ordet.
    - namn: Avslut
      fraga: Vad gjorde vi i dag?
      gor: "Låt var och en säga ett ord och vad hen gjorde med det. Säg vad du hörde, konkret och kort."
      fraser:
        - Säg ett ord från i dag och vad du gjorde med det.
        - "I dag hörde ni ljudet i mitten, för ni drog ut ordet."
arbetsform:
  rubrik: "Arbetsform: alla i kör, växlande, gemensamt"
  text: "I ljudstarten svarar alla samtidigt, så att ingen står ensam och du hör hela gruppen. I lektionen växlar ni: du visar, ni gör tillsammans, eleverna gör i par och sedan var för sig. I avslutet samlas gruppen igen. Med två elever är gruppen ett par, och du är med i leken."
  delar:
    - rubrik: 1. Alla i kör
      text: "du leder, alla svarar samtidigt"
      faser:
        - Ljudstart
    - rubrik: 2. Växlande
      text: "du visar, sedan tillsammans, i par och var för sig"
      faser:
        - Lektionen
    - rubrik: 3. Gemensamt
      text: "var och en säger ett ord, du sammanfattar"
      faser:
        - Avslut
exempel:
  valt:
    rubrik: Gruppen
    text: "sex elever i förskoleklass och åk 1, vecka 3, tre pass i veckan. Gruppen gör lektionen Räkna ljud för tredje passet i följd, det första i raden Med klusil. Dagens ljud är /m/, och dagens elever är Mira och Omar."
  text:
    - "Ljudstarten. Läraren sitter bredvid gruppen och håller upp bokstavskortet m. ”Det här är /m/. Mmm. Känn hur läpparna ligger mot varandra.” Alla säger mmm och tittar i parets spegel. Alva säger ”em”, och läraren svarar: ”Em är bokstavens namn. Ljudet är mmm.” Sedan säger eleverna ljuden för s, o och l. Läraren drar ut ljuden i fem ord, bland annat nöt och kål, räknar tyst till tre och knyter handen, och gruppen säger orden. Omar sätter ihop gås ensam. När gruppen delar upp mat säger Mira ”m-⁠t”. Läraren säger ”maaat” och drar ut a:et, och Mira hör /a/ i mitten."
    - "Lektionen, Räkna ljud. Gruppen säger bildernas namn i kör. Läraren sätter kortet med en ko i bildrutan på tavlan och flyttar en magnet för varje ljud: ”/k/, ooo. Två ljud. Ko.” Sedan lök och kaka. Gruppen säger ljuden i tåg efter läraren, och sedan i öga och stol själv, med ett finger för varje, och Noah flyttar magneterna. I par lägger den ena kortet i den andras bildruta och säger ordet, och den andra lägger markörerna i ljudrutorna. Paren är Alva och Elin, Omar och Noah, Leo och Mira, och läraren går mellan dem. I steg 4 delar paren arkets sex sista kort, var och en räknar ljuden i sina, och läraren lyssnar på dagens elever. Omar säger ”aba” om apan, och läraren låter Omar känna luften mot handen: i apa blåser det, i aba inte. Mira säger ”bö-⁠å-⁠tö”, och läraren säger b kort: ”b-⁠ååå-⁠t.”"
    - "Avslutet. Var och en säger ett ord från dagens lek och vad hen gjorde med det. Omar säger: ”Apa. Tre ljud.” Läraren säger: ”Ni drog ut orden och hörde ljudet i mitten.”"
    - "Efteråt noterar läraren: Mira och Omar lade rätt antal markörer och sa ljuden i två av tre ord. Mira lägger ett ö efter b, och Omar blandar ihop p och b. Nästa pass blir Räkna ljud igen, i samma rad, eftersom gruppen tar nästa rad först efter två pass i följd. Dagens elever blir Leo och Noah, och dagens ljud blir /m/ igen, eftersom Alva sa namnet."
fastnar:
  rubrik: När eleven fastnar
  text: "Ge minsta möjliga stöd först, och låt eleven göra jobbet. Stödtrappan gäller i varje ljudlek, och lektionerna har sina egna exempel. Blir det många fel i gruppen, sänk tröskeln: säg ordet i kör, låt sedan några elever säga det ensamma och ta samma ord minst tre gånger, först så att det blir rätt och sedan snabbare."
  fragaForst:
    - Vad hör du?
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg ordet igen, långsamt, och dra ut ljuden."
    - "Visa hur munnen gör. Eleven tittar i spegeln och känner efter, till exempel luften mot handen vid /p/ och surret på halsen vid /v/."
    - "Gör uppgiften mindre: ta ett ord med två ljud i stället för tre, eller sätt ihop ljud för ljud: /s/, so, sol."
    - "Visa med handen eller med något att flytta, en för varje ljud, från vänster till höger sett från eleven."
    - "Säg det tillsammans, och låt eleven säga det själv efteråt."
  motto: Till sist säger eleven det själv.
roll:
  rubrik: Läraren är alltid modell
  text: "Elever lär sig läsa genom att se hur du gör: tänk högt inför eleverna, peka och för handen från vänster till höger när ni ljudar, och bind sedan ihop ljuden till ord tillsammans i kör. Gör samma sak flera gånger i lugnt tempo, så att örat hinner med och ögat kan följa handen. När du visar tydligt och ni ljudar tillsammans, kort och ofta, blir eleverna säkra på att avkoda och ser hur strategierna fungerar. När de arbetar mer självständigt kan de använda de strategier de lärt sig."
  gor:
    - Säg ljudet och dra ut det, när det går att dra ut.
    - Vänta tre sekunder innan du hjälper.
    - "Låt alla visa svaret samtidigt, med fingrar eller markörer."
    - "Beröm det eleven gjorde: ”Du drog ut ordet och hörde ljudet i mitten.”"
    - Säg vad ett ord betyder första gången, och sätt det i en mening.
  undvik:
    - Att säga bokstavens namn när ni ljudar.
    - Att göra paus mellan ljuden innan gruppen sätter ihop utdragna ljud säkert.
    - "Att lägga till ett ö efter b, d, g, k, p och t."
    - "Att ta ord som börjar med en klusil, och ord med konsonantmöten, innan gruppen är säker på ljud som går att dra ut."
    - Att gå vidare innan lektionens regel säger det.
urval:
  rubrik: Var hittar du lektionerna?
  text:
    - "Lektionerna står i lektionsbanken, under den förmåga de tränar, och heter Ljudlek följt av lektionens namn, som Ljudlek: Räkna ljud. Varje lektion är en egen metod med en egen fil att ladda ner, där de första sidorna är passet och stegen och de sista sidorna materialet. Varje lektion har samma form. Den börjar med raderna i Så blir lektionen svårare, från lätt till svårt, och fortsätter med passet i fyra steg med dina fraser och de vanliga felen under Lyssna efter. Sist står materialet att skriva ut, som bildkort, bokstavskort, golvbokstäver eller mallar, efter vad lektionen behöver. Bildkorten är vikkort med bilden på framsidan och ordet på baksidan, och under ordet står en prick för varje ljud, eller en båge för varje del när eleven räknar stavelser. Ljudstarten står likadant i varje lektion och på lathundens tredje sida, Ljudstarten. Lektionernas exempel visar samma sex elever vid olika tillfällen, och veckan i exemplet visar vilka bokstäver gruppen har haft."
    - "Orden till ljudstarten står i Ordbanken, och bokstavskorten till dagens ljud under Materialet."
  kravText: "Tre regler hjälper dig att välja lektion:"
  krav:
    - rubrik: Ljudkollen först
      text: "Börja i den första förmågan där fler än hälften har en ring"
    - rubrik: En lektion i taget
      text: Samma lektion flera pass i följd
    - rubrik: Gå vidare
      text: När lektionens regel säger det
uppfoljning:
  text: "Screeningen visar var eleven står i läsningen, och ljudkollen visar vilka av lektionernas förmågor eleven klarar. Protokollet, gruppens översikt och frågorna finns under Materialet. Berätta konkret för eleven vad hen har lärt sig. Med bladet Observation av ett pass under Materialet kan en kollega följa ett pass och ge dig återkoppling, gärna samma vecka som ljudkollen. Säg före passet vad du vill ha återkoppling på. Efteråt berättar du först vad du själv lade märke till, och sedan läser kollegan upp det som fungerade, med det hen skrev. Du bestämmer nästa steg, ni prövar det en gång direkt, och det blir fokus nästa gång kollegan följer ett pass."
  rader:
    - nar: Före insatsen
      vad: "Gör screeningen, version A, och ljudkollen med en elev i taget utanför passen, cirka tolv minuter per elev. Välj den första förmågan i gruppens översikt och en lektion för den."
    - nar: Var tredje vecka
      vad: "Gör ljudkollens uppgift för gruppens förmåga, uppgiften för nästa förmåga och uppgift 4. Har en elev inte gått framåt vecka 6, tar du det med elevhälsan och ser till att hörseln kontrolleras."
    - nar: Efter 10–12 veckor
      vad: "Gör screeningen, version B, och hela ljudkollen. Den som klarar nivå 5 och läser de påhittade orden går vidare till Läslistor i grupp eller TIL i grupp. Den som inte har gått framåt får mer intensivt stöd och en bedömning."
mal:
  text: "Efter insatsen ska eleven kunna:"
  punkter:
    - "höra det första och det sista ljudet och ljudet i mitten i korta ord"
    - sätta ihop ljud till ord med två till fyra ljud
    - dela upp ord med två till fyra ljud i sina ljud
    - "säga ljudet för de tio första bokstäverna: s, o, l, a, r, m, e, n, i och v"
    - skriva korta ljudenliga ord
    - byta ett ljud i ett ord och säga det nya ordet
    - läsa korta ljudenliga ord och påhittade ord
snabbmall:
  fore:
    - "Lektionen, raden och vilket pass i raden"
    - Dagens ljud och orden ur Ordbanken
    - Paren och dagens elever
  efter:
    - Vilka av dagens elever klarade steg 4 själva?
    - Ljud och ord som fastnade
    - "Nästa pass: samma lektion eller nästa?"
checklista:
  punkter:
    - Valt lektionen och orden ur Ordbanken.
    - Tagit fram kortet för dagens ljud och några ni har haft.
    - Lagt fram lektionens passöversikt, stegtabell och material och en spegel per par.
    - Skrivit paren och dagens elever i snabbmallen.
grund:
  text: "Nybörjare i läsningen behöver upptäcka att orden består av ljud och att bokstäverna står för ljuden (Castles, Rastle och Nation, 2018). Förmågan att höra ljuden och kunskapen om bokstävernas ljud förutsäger den tidiga läsningen (Hulme m.fl., 2012). Undervisning i att höra, dela upp och sätta ihop ljuden hjälper, allra mest dem som har kommit kortast, och effekten på läsningen blir nästan dubbelt så stor när bokstäverna finns med (Ehri m.fl., 2001; National Reading Panel, 2000). En eller två förmågor åt gången ger mest, och att sätta ihop och dela upp är kärnan (National Reading Panel, 2000). Nybörjare får lättare ihop ordet när ljuden dras ut utan paus (Gonzalez-⁠Frey och Ehri, 2021), och i svenska studier gav stöd med munnen och spegeln bättre avkodning (Fälth, Gustafson och Svensson, 2017; Fälth, Svensson och Ström, 2020). Bornholmsmodellens språklekar i förskoleklass stärker förmågan att höra ljuden, och träningen ger mest när läraren gör kopplingen till bokstäverna tydlig (National Reading Panel, 2000; Wolff, 2017)."
  kallor: "Bygger på Castles, Rastle och Nation (2018), Hulme m.fl. (2012), Ehri m.fl. (2001), National Reading Panel (2000), Gonzalez-⁠Frey och Ehri (2021), Fälth, Gustafson och Svensson (2017), Fälth, Svensson och Ström (2020) och Wolff (2017)."
ramar:
  rubrik: Materialet
  text:
    - "Här finns bokstavskorten till ljudstarten, bokstavskartan, screeningen i två versioner, ljudkollen, protokollet, gruppens översikt och bladet Observation av ett pass. Allt går att kopiera. Laminera korten, kartan och elevens blad. Varje lektion har sitt eget material och säger vad du laminerar. Korten står i Andika, ett gratis typsnitt från SIL för dem som lär sig läsa."
  ramar:
    - rubrik: Bokstavskort till ljudstarten
      text:
        - "Här är korten till dagens ljud, i den ordning bokstäverna blir dagens ljud. Skriv ut sidan två gånger för hela insatsen, så att korten räcker till ord som kaka, med två k och två a."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Skriv ut korten på tjockt papper och klipp isär dem. Håll upp kortet för dagens ljud så att alla ser det. När ni ljudar ett ord med korten lägger du dem rättvända för eleverna."
      listor:
        - rubrik: Bokstavskort
          rader:
            - [s, o, l]
            - [a, r, m]
            - [e, n, i]
            - [v, t, f]
            - [å, p, k]
            - [d, u, b]
            - [g, h, y]
            - [ä, ö, j]
    - rubrik: Bokstavskartan
      text:
        - "Här är alfabetet med en bild för varje bokstav, och ordet till bilden börjar på bokstavens ljud. Kartan är till den som behöver stöd att minnas bokstävernas ljud, och i en del lektioner till alla."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Skriv ut kartan i färg och laminera den. Lägg den framför den elev som behöver den, eller sätt upp den där gruppen sitter, och säg vad bilderna heter i kör första gången. Peka på bokstaven och bilden och säg ljudet: ”a, som i apa. Aaa.” Q, w och x har ingen bild, eftersom inga vanliga ord börjar på dem. Bilderna ger samma första ljud också om eleven säger kossa eller isbit, och åsnan kallar ni åsna, varje gång. Säg vokalens långa ljud när ni pekar, ooo och uuu, också när ordet på bilden har kort vokal, som orm, uggla, yxa och äpple."
      listor:
        - rubrik: Bokstavskarta
          rader:
            - [a apa, b buss, c citron, d dörr, e ekorre]
            - [f fisk, g gurka, h hus, i is, j jordgubbe]
            - [k ko, l lejon, m myra, n nyckel, o orm]
            - [p paraply, q som k, r räv, s sol, t tiger]
            - [u uggla, v våffla, w som v, x som ks, y yxa]
            - [z zebra, å åsna, ä äpple, ö öga, ""]
    - rubrik: "Screeningen, version A"
      text:
        - "Det här är elevens blad till screeningen före insatsen. Eleven läser nivå 3–⁠5 från bladet. Nivå 1 och 2 säger du."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Sitt med en elev i taget, utanför passen. Börja på nivå 1 och fortsätt så länge eleven klarar nivån. Skriv antal rätt för varje nivå i protokollet och ringa in den högsta nivån eleven klarar. Klarar eleven inte nivå 1, skriv 0. Säger eleven bokstavens namn eller lägger till ett ö, fråga: ”Hur låter det?” Räkna svaret som rätt om eleven då säger ljudet, och kryssa felet under Fel att lyssna efter."
            - rubrik: Nivå 1
              text: "Säg: ”sol, skola, sten, sko”. Fråga: ”Vilket ljud börjar orden på?” Svaret är /s/. Säg sedan ”lek, lada, lera, lamm”. Svaret är /l/. Eleven ska säga ljudet, inte bokstavens namn."
            - rubrik: Nivå 2
              text: "Säg ljuden i ett ord i taget, med en kort paus mellan ljuden: /s/ /o/ /l/ (sol), /m/ /o/ /s/ (mos), /s/ /a/ /l/ (sal). Fråga: ”Vilket ord blir det?” Säg ljuden, inte bokstävernas namn. Pausen hör till screeningen: den prövar om eleven får ihop ljud som kommer ett i taget."
      listor:
        - rubrik: "Nivå 3: Säg hur bokstaven låter"
          rader:
            - - o
              - n
              - s
              - r
              - m
              - e
              - l
        - rubrik: "Nivå 3: Säg hur den stora bokstaven låter"
          rader:
            - - L
              - N
              - O
              - S
              - E
              - M
              - R
        - rubrik: "Nivå 4: Läs orden"
          rader:
            - - sol
              - mor
              - sal
              - ram
              - ser
        - rubrik: "Nivå 5: Läs meningarna"
          rader:
            - - Jag ser en sol.
            - - En man ser en ros.
            - - Rosen är röd.
    - rubrik: "Screeningen, version B"
      text:
        - "Det här är elevens blad till screeningen efter insatsen. Version B har samma uppställning och samma svårighet som version A men andra ord, och bokstäverna står i en annan ordning, så att du kan jämföra före och efter."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Gör som med version A: sitt med en elev i taget, börja på nivå 1 och fortsätt så länge eleven klarar nivån, skriv antal rätt för varje nivå och ringa in den högsta nivån i protokollet."
            - rubrik: Nivå 1
              text: "Säg: ”ros, rita, ring, resa”. Svaret är /r/. Säg sedan ”sax, skog, stövel, spade”. Svaret är /s/."
            - rubrik: Nivå 2
              text: "Säg ljuden med en kort paus: /r/ /a/ /m/ (ram), /f/ /a/ /r/ (far), /n/ /e/ /r/ (ner). Fråga: ”Vilket ord blir det?”"
      listor:
        - rubrik: "Nivå 3: Säg hur bokstaven låter"
          rader:
            - - m
              - e
              - r
              - l
              - o
              - s
              - n
        - rubrik: "Nivå 3: Säg hur den stora bokstaven låter"
