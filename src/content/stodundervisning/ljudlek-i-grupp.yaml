    - rubrik: Protokollet för screeningen och ljudkollen
      text:
        - "Det här är lärarens protokoll. Kopiera sidan med tabellerna, en per elev, och använd den före insatsen, var tredje vecka och efter. Sidan med frågorna räcker i ett exemplar."
      huvud:
