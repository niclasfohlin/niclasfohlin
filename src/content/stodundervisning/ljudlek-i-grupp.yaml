    - rubrik: "Ljudkollen, elevens blad"
      text:
        - "Eleven läser uppgift 4 och 9 från bladet och skriver uppgift 7 på ett papper. De andra uppgifterna säger du, och frågorna står i protokollet."
      huvud:
        - rubrik: Elevens namn
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Gör ljudkollen med en elev i taget, utanför passen. Peka på en bokstav i taget i uppgift 4. Ringa in de bokstäver som eleven inte kan på en kopia av bladet, en kopia per elev. Spara kopian med protokollet, så vet du vilka bokstäver som blir dagens ljud. Stryk ringen när eleven kan bokstaven. Säger eleven bokstavens namn, fråga: ”Hur låter den?” och räkna svaret som rätt om eleven då säger ljudet, som i screeningen. I uppgift 9 läser eleven fyra påhittade ord."
