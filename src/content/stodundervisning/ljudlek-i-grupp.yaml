lathund:
  innehall: En lektion i taget, samma ljudstart varje pass
  metoden:
    text:
      - "Eleverna hör, delar upp och sätter ihop ljuden i ord och kopplar dem till bokstäver, så att de kan läsa och skriva korta ord. Du gör screeningen och ljudkollen, leder ljudstarten, tar en lektion i taget och noterar efter passet."
      - "Insatsen är för elever i F–2 som klarar högst nivå 4 i screeningen och för osäkra nybörjarläsare. Ljudkollen har en uppgift för varje förmåga i lektionsbanken. Eleven klarar uppgiften med minst tre rätt av fyra, i uppgift 4 minst åtta av de tio första bokstäverna. Den första förmågan som fler än hälften inte klarar visar ingången: Rim vid 1–⁠2, Första ljudet vid 3–⁠5, Räkna ljud vid 6–⁠9."
    ruta:
      rubrik: Fyra saker att hålla fast vid
      punkter:
        - fet: Visa först.
          text: "Tänk högt och för handen från vänster till höger, sett från eleverna."
        - fet: Säg ljudet, inte namnet.
          text: "Sätt ihop utan paus."
        - fet: En sak i taget.
          text: "Samma lektion flera pass i följd."
        - fet: Avsluta när det går bra.
          text: "Sluta medan eleverna lyckas."
    tabell:
      rubrik: Passet i tre delar · vad du gör och säger
      kolumner:
        - Del
        - Exempelfraser
      rader:
        - - |-
            1 · Ljudstart
            0–⁠5 min. Alla i kör.
          - |-
            ”Det här är /m/. Mmm.”
            ”Mmmooosss. Vilket ord?”
            ”Mus. Säg ljuden.”
        - - |-
            2 · Lektionen
            5–⁠25 min. Fyra steg.
          - |-
            ”Titta hur jag gör.”
            ”Nu gör vi det tillsammans.”
        - - |-
            3 · Avslut
            25–⁠30 min. Gemensamt.
          - ”Säg ett ord från i dag och vad du gjorde med det.”
    not: "I lektionen visar du i 3–⁠4 minuter, ni gör tillsammans i 5–⁠6, paren arbetar i 5 och var och en i 4–⁠5, medan du lyssnar på dagens elever. Dela antalet elever med antalet pass i veckan och avrunda uppåt, så får du antalet dagens elever. Tolv elever och tre pass blir fyra per pass."
  pass:
    rubrik: "Vi kör ett pass: Räkna ljud"
    textRubrik: Gruppen · sex elever i förskoleklass och åk 1, vecka 3
    text:
      - "Ljudstarten. Läraren visar m: ”Det här är /m/. Mmm.” Alva säger ”em”, och läraren svarar: ”Em är namnet. Ljudet är mmm.” När gruppen delar upp mat säger Mira ”m-⁠t”. Läraren drar ut a:et, och Mira hör /a/."
      - "Lektionen, Räkna ljud, med bildkorten för raden Med klusil. Läraren flyttar en markör för varje ljud i ko, lök och kaka. Gruppen räknar ljuden i tåg, öga och stol tillsammans, och paren tar fler ord. I steg 4 säger Mira ”bö-⁠å-⁠tö”. Läraren säger b kort: ”b-⁠ååå-⁠t.”"
      - "Avslutet. Omar säger: ”Apa. Tre ljud.” Läraren noterar: Mira och Omar lade rätt antal markörer själva. Nästa pass tar gruppen samma rad, eftersom den går vidare först efter två pass i följd."
    forberett:
      rubrik: Det jag förberedde
      text:
        - "Valt orden till ljudstarten ur Med klusil i Ordbanken och tagit fram Räkna ljuds bildkort för raden och bokstavskorten m, s, o och l. Lagt fram ljudrutor, markörer och en spegel per par. Paren: Alva och Elin, Omar och Noah, Leo och Mira. Dagens elever: Mira och Omar."
    klarTidigt: "Ta ett ord ur nästa ordgrupp, eller gör leken en gång till."
    schema:
      rubrik: 30 minuter, del för del
      rader:
        - tid: Före
          fas: Förberedelse
          vad: "Välj orden, ta fram bokstavskorten och lektionens material. Bestäm paren och dagens elever."
        - tid: 0–5
          fas: 1 · Ljudstart
          vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra. Alla svarar samtidigt."
        - tid: 5–25
          fas: 2 · Lektionen
          vad: "Steg 1 du visar, 2 tillsammans, 3 i par, 4 var för sig. Du lyssnar på dagens elever."
        - tid: 25–30
          fas: 3 · Avslut
          vad: "Ett ord var, och vad du hörde. Nästa gång: samma rad, nästa rad eller nästa lektion?"
  mall:
    rubrik: Ljudstarten
    underrad: "Samma fem minuter varje pass · orden ur Ordbanken"
    block:
      - typ: tabell
        rubrik: Tre moment, alla svarar samtidigt
        kolumner:
          - Moment
          - Så gör du
        rader:
          - - Dagens ljud
            - "Visa bokstaven och säg ljudet. Alla säger efter, och någon säger ett ord på ljudet. Sist några ljud ni har haft."
          - - Sätt ihop
            - "Dra ut fem ord utan paus, med handen från vänster till höger. Vänta tre sekunder, knyt handen: alla svarar."
          - - Dela upp
            - "Säg fyra ord med olika många ljud. Alla säger ordet och ljuden och räknar fingrarna."
      - typ: tabell
        rubrik: Ordbanken
        kolumner:
          - Ordgrupp
          - Orden
        rader:
          - - Två ljud att dra ut
            - "is, ål, se, le, ro, sy, nu, ny, så"
          - - Tre ljud att dra ut
            - "sol, lus, mus, mos, vas, mål, nål, mås, sås, räv, säl, hår"
          - - Med klusil
            - "mat, lök, nöt, pil, gås, kål, gul, bad, båt, tåg, duk, tak"
          - - Två stavelser
            - "sola, mosa, lera, rasa, mera, läsa, måla, leta, vila, bada, baka, kaka"
          - - Konsonantmöte först
            - "snö, blå, sko, bro, tre, grå, klo, stå, sten, stol, glas, svan, stor, smör"
          - - Konsonantmöte sist
            - "fisk, mask, hand, sand, hund, vind, land, hals, rund, tält"
      - typ: not
        text: "I lektionerna före Räkna ljud säger du ljuden först i Dela upp och gruppen efter. Börja i Tre ljud att dra ut, eller i Två ljud att dra ut om fler än hälften visar fel antal fingrar. Ta nästa ordgrupp när nästan alla visar rätt två pass i följd, men före Räkna ljud när nästan alla sätter ihop orden själva, högst till Med klusil. Dagens ljud är den första bokstaven som fler än hälften inte kan, i ordningen s o l a r m e n i v, sedan t f å p k d u b g h y ä ö j."
      - typ: snabbmall
  material:
    rubrik: Vad du behöver för ett pass
    kravEtikett: Regel
    var:
      rubrik: Var lektionerna och materialet finns
      punkter:
        - fet: Lektionerna.
          text: "I lektionsbanken, under den förmåga de tränar. De heter Ljudlek följt av lektionens namn, som Ljudlek: Räkna ljud, och varje lektion är en egen metod, med rader från lätt till svårt i tabellen Så blir lektionen svårare. Lektionens första sidor är passet och stegen, och sist står materialet att skriva ut: bildkort, bokstavskort, golvbokstäver, ljudrutor eller platsrutor."
        - fet: Bokstavskorten, screeningen och ljudkollen.
          text: "Under Materialet på metodsidan och i planeringsmallarna (Word): bokstavskorten, elevens blad, protokollet och gruppens översikt."
      efter: "Förmågorna i lektionsbanken: 1 Rim, 2 Ord och stavelser, 3 Första ljudet, 4 Bokstävernas ljud, 5 Sist och i mitten, 6 Dela upp, 7 Skriva ord, 8 Sätta ihop och byta, 9 Läsa och skriva meningar. Lektionerna för varje förmåga står i banken på metodsidan."
    bordet:
      - Dagens och tidigare bokstavskort
      - Bokstavskartan vid behov
      - En spegel per par
      - Lektionens material
      - Snabbmallen, med dagens elever
    varjePass: "Vad gjorde dagens elever i steg 4, var fastnade de? Samma rad, nästa rad eller nästa lektion?"
    # Lathundens kortare uppföljning: raden Vecka 6 står i Var tredje vecka, som förut, så att sida 4 rymmer den.
    uppfoljning:
      - nar: "Före insatsen"
        vad: "Gör ljudkollen och screeningen, version A, med en elev i taget utanför passen, cirka tolv minuter per elev. I gruppens översikt ser du sedan ingången."
      - nar: "Var tredje vecka"
        vad: "Gör ljudkollens uppgift för gruppens förmåga, uppgiften för nästa förmåga och uppgift 4 på två till tre minuter per elev. Har en elev inte gått framåt vecka 6, tar du det med elevhälsan och ser till att hörseln kontrolleras."
      - nar: "Efter 4–12 veckor"
        vad: "Gör hela ljudkollen och screeningen, version B, med en elev i taget, och jämför med resultaten före insatsen."
film:
  titel: "Ljudstarten i Ljudlek i grupp"
  sekunder: 27.87
  beskrivning: "Dagens ljud: m. Alla säger ljudet. Någon säger ett ord på ljudet. Sätt ihop: läraren drar ut ljuden med handen. Knyt handen: alla säger ordet. Dela upp: läraren säger ordet. Alla säger ordet. Sedan ljuden, ett finger för varje. Sist räknar alla fingrarna."
  rubrik: "Ljudstarten i fyra bilder"
  ingress: "Varje pass börjar med ljudstarten, där alla säger dagens ljud, sätter ihop och delar upp ord. Filmen på metodens sida visar den i rörelse."
  stillbilder:
    - text: "Dagens ljud: alla säger ljudet."
    - text: "Sätt ihop: läraren drar ut ljuden med handen."
    - text: "Räkna tyst till tre, knyt handen: alla säger ordet."
    - text: "Dela upp: ett finger för varje ljud. Sist: tre."
filmer:
  - nr: 2
    titel: "Från ljudkollen till lektionen"
    sekunder: 29.45
    beskrivning: "Ljudkollen, en elev i taget: skriv antal rätt. Färre än tre rätt av fyra: ringa in siffran. Uppgift 4: färre än åtta av de tio första bokstäverna. Första förmågan från vänster där fler än hälften inte klarar den. Ingången Nybörjare: Första ljudet, sedan Bokstavsgympa."
    rubrik: "Från ljudkollen till lektionen"
    ingress: "Fyra bilder ur filmen om hur ljudkollen blir en lektion: siffran ringas in när eleven inte klarar uppgiften, och den första förmågan där fler än hälften inte klarar den visar vilken ingång gruppen börjar i. Filmen på metodens sida visar samma sak i rörelse."
    efter: "uppfoljning"
    stillbilder:
      - text: "Färre än tre rätt av fyra: ringa in siffran."
      - text: "Uppgift 4: färre än åtta av de tio första, ringa in."
      - text: "Förmåga 4: första där fler än hälften inte klarar den."
      - text: "Gruppen tar Första ljudet och sedan Bokstavsgympa."
