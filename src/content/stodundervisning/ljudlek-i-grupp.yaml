        - "Vi har is. Tre ord, med mellanrum."
        - "9 · Läsa och skriva meningar"
    not: "Ordningen går från ord och stavelser till de enskilda ljuden, men eleven behöver inte klara det ena helt innan hen går vidare. Att sätta ihop och dela upp tränar ni i varje pass. Vokalens längd behöver eleverna höra tidigt, och när dagens ljud är en vokal jämför ni kal och kall. Stavelserna hjälper sedan i längre ord, och i gruppen kallar ni dem delar. I Rim är början allt före vokalen, /st/ i stol, och resten står kvar när eleven byter början. Det är en lättare form av att byta ljud, som kommer i förmåga 8. Från och med lektionen Första ljudet lyssnar eleven på det första ljudet, /s/ i stol."
  - rubrik: "Ljudstarten: samma fem minuter varje pass"
    plats: efter-steg
    meny: true
    text: "I ljudstarten tränar ni varje pass att sätta ihop och dela upp ord. Det är kärnan i läsningen. Alla svarar samtidigt, så att du hör och ser hela gruppen. Vänd ansiktet mot eleverna, så att de ser din mun, och sitt gärna vid sidan av dem. Sitter du mitt emot dem för du handen från din högra sida till din vänstra, så att de ser den gå från vänster till höger."
    kolumner:
      - Moment
      - Så gör du
      - Så kan det låta
    rader:
      - - Dagens ljud
        - "Håll upp bokstavskortet och säg ljudet. Alla säger ljudet och känner det i munnen, och tittar gärna i spegeln. Någon säger ett ord som börjar på ljudet. Sist säger alla ljuden för några bokstäver som gruppen har haft, gärna de som gruppen tvekar på."
        - "”Det här är /m/. Mmm. Känn hur läpparna ligger mot varandra.” ”Det här är /t/. Kort, utan ö. Känn luften mot handen.”"
      - - Sätt ihop
        - "Dra ut ljuden i fem ord utan paus, och för handen från vänster till höger. Räkna tyst till tre och knyt handen, så säger alla ordet. Låt en av dagens elever säga ett ord ensam."
        - "”Mmmooosss.” Du knyter handen. ”Mos!”"
      - - Dela upp
        - "Säg fyra ord med olika många ljud. Alla säger ordet, sedan ljuden, och håller upp ett finger för varje ljud. Sist räknar ni fingrarna. I lektionerna före Räkna ljud i banken säger du ljuden först och gruppen efter."
        - "”Mus. Säg ljuden.” ”/m/ /u/ /s/. Tre!”"
    not: "Orden tar du ur gruppens ordgrupp i Ordbanken. I Dela upp blandar du in ord ur de lättare ordgrupperna, så att orden har olika många ljud och eleverna räknar i stället för att gissa. När ni sätter ihop kan du gärna ta ord ur nästa ordgrupp, eftersom det är lättare än att dela upp. Sätter gruppen ihop utdragna ljud säkert, säger du ljuden kortare och till sist med en kort paus, som i ljudkollen. Kan gruppen bokstäverna i ordet, lägger du ut bokstavskorten rättvända för eleverna och drar fingret under dem medan du ljudar. Har gruppen lektionen Rim, hoppar du över ordet som börjar på ljudet, eftersom eleverna lätt blandar ihop rim och första ljudet när lekarna växlar. En elev som ännu inte hör rim eller delarna i ett ord efter lektionerna Rim och Ord och stavelser får ett rimpar eller ett ord att klappa sist i Dela upp, tills ljudkollen visar att hen klarar det."
  - rubrik: "Dagens ljud: bokstävernas ordning"
    plats: efter-steg
    meny: true
    text: "Dagens ljud är ljudet för den första bokstaven i ordningen som fler än hälften av eleverna inte kan i ljudkollen. Ta ungefär två nya ljud i veckan, och ett nytt först när gruppen säger de förra säkert. Samma ljud kan vara dagens ljud i flera pass. Kan gruppen alla bokstäver blir dagens ljud de ljud som gruppen blandar ihop, som p och b eller e och ä. Ordningen är densamma som i Läslistor i grupp, och bokstavskorten under Materialet står i samma ordning. Bokstäverna som gruppen har haft är dagens bokstav, de som kommer före den i ordningen och de längre fram som gruppen redan kan. I lektionerna lägger du bara fram sådana bokstäver. Behöver en uppgift en annan bokstav, skriver eller visar du den, eller så pekar eleven på bokstavskartan. Det ni gör muntligt kräver inga bokstäver."
    kolumner:
      - Ordningen
      - Bokstäverna
    rader:
      - - "De tio första, ungefär vecka 1–⁠5"
        - "s, o, l, a, r, m, e, n, i, v"
      - - "Sedan, ungefär vecka 6–⁠12"
        - "t, f, å, p, k, d, u, b, g, h, y, ä, ö, j"
    not: "Är dagens ljud en vokal, säg den lång: ooo som i sol, och jämför med den korta i ett ordpar, som kal och kall. Kort e låter som ä, så eld och elefant börjar med samma ljud som äpple. Är det b, d, g, k, p eller t, säg det kort och utan ö, och säg det också i ett ord: /t/ i tak. Säger någon ett ord som börjar på bokstaven men inte på ljudet, som sju för /s/, säg: ”Sju börjar på ett annat ljud. Vi letar ord som börjar på sss.”"
