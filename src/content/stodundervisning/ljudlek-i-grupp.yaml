      text: "du leder, alla svarar samtidigt"
      faser:
        - Ljudstart
    - rubrik: 2. Växlande
      text: "du visar, sedan tillsammans, i par och var för sig"
      faser:
        - Lektionen
    - rubrik: 3. Gemensamt
      text: "var och en säger ett ord, du sammanfattar"
      faser:
