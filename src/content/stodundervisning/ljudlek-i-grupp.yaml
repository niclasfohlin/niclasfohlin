    - sätta ihop ljud till ord med två till fyra ljud
    - dela upp ord med två till fyra ljud i sina ljud
    - "säga ljudet för de tio första bokstäverna: s, o, l, a, r, m, e, n, i och v"
    - skriva korta ljudenliga ord
    - byta ett ljud i ett ord och säga det nya ordet
    - läsa korta ljudenliga ord och påhittade ord
snabbmall:
  text: Bladet gäller veckans tre till fem pass. Raden är gruppens rad i lektionens tabell Så blir lektionen svårare. Under Nästa gång skriver du samma rad, nästa rad eller nästa lektion, och de första veckorna kryssar du det som ska med.
  pass: 5
  period: veckan
  fore: lektionen, raden och dagens ljud
  foreHjalp: "Dagens elever: det du lyssnar efter hos var och en."
  efter: det dagens elever sa och gjorde i steg 4, och var de fastnade
  ska:
    - Jag visade först och tänkte högt.
    - Vi sa ljuden och inte bokstävernas namn.
    - Vi satte ihop ord utan paus mellan ljuden.
  sist:
    - Det här gör eleverna själva nu som de inte gjorde förut
    - Jag tar med mig in i nästa vecka
  not: Dela antalet elever med antalet pass i veckan och avrunda uppåt, så får du antalet dagens elever. Tolv elever och tre pass blir fyra per pass. Varje lektion säger när gruppen tar nästa rad.
checklista:
