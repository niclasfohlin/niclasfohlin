exempel:
  valt:
    rubrik: Gruppen
    text: "sex elever i förskoleklass och åk 1, vecka 3, tre pass i veckan. Gruppen gör lektionen Räkna ljud för tredje passet i följd, det första med bildkorten för raden Med klusil. Dagens ljud är /m/, och dagens elever är Mira och Omar."
  text:
    - "Ljudstarten. Läraren sitter bredvid gruppen och håller upp bokstavskortet m. ”Det här är /m/. Mmm. Känn hur läpparna ligger mot varandra.” Alla säger mmm och tittar i parets spegel. Alva säger ”em”, och läraren svarar: ”Em är bokstavens namn. Ljudet är mmm.” Sedan säger eleverna ljuden för s, o och l. Läraren drar ut ljuden i fem ord, bland annat nöt och kål, räknar tyst till tre och knyter handen, och gruppen säger orden. Omar sätter ihop gås ensam. När gruppen delar upp mat säger Mira ”m-⁠t”. Läraren säger ”maaat” och drar ut a:et, och Mira hör /a/ i mitten."
    - "Lektionen, Räkna ljud. Gruppen säger i kör vad bilderna på radens bildkort heter. Läraren sätter kortet med en ko i bildrutan på tavlan och flyttar en markör för varje ljud: ”/k/, ooo. Två ljud. Ko.” Sedan lök och kaka. Gruppen säger ljuden i tåg efter läraren och sedan själv i öga och stol, med ett finger för varje. Noah flyttar markörerna på tavlan. I par lägger den ena kortet i den andras bildruta och säger ordet, och den andra lägger markörerna i ljudrutorna. Paren är Alva och Elin, Omar och Noah, Leo och Mira, och läraren går mellan dem. I steg 4 delar paren arkets sex sista kort, var och en räknar ljuden i sina, och läraren lyssnar på dagens elever. Omar säger ”aba” om apan, och läraren låter Omar känna luften mot handen: i apa blåser det, i aba inte. Mira säger ”bö-⁠å-⁠tö”, och läraren säger b kort: ”b-⁠ååå-⁠t.”"
    - "Avslutet. Var och en säger ett ord från dagens lek och vad hen gjorde med det. Omar säger: ”Apa. Tre ljud.” Läraren säger: ”Ni drog ut orden och hörde ljudet i mitten.”"
    - "Efteråt noterar läraren: Mira och Omar lade rätt antal markörer och sa ljuden i två av tre ord. Mira lägger ett ö efter b, och Omar blandar ihop p och b. Nästa pass blir Räkna ljud igen, i samma rad, eftersom gruppen tar nästa rad först efter två pass i följd. Dagens elever blir Leo och Noah, och dagens ljud blir /m/ igen, eftersom Alva sa namnet."
fastnar:
  rubrik: När eleven fastnar
  text: "Ge minsta möjliga stöd först, och låt eleven göra jobbet. Stödtrappan gäller i varje ljudlek, och lektionerna har sina egna exempel. Blir det många fel i gruppen, sänk tröskeln: säg ordet i kör, låt sedan några elever säga det ensamma och ta samma ord minst tre gånger, först så att det blir rätt och sedan snabbare."
  fragaForst:
    - Vad hör du?
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg ordet igen, långsamt, och dra ut ljuden."
    - "Visa hur munnen gör. Eleven tittar i spegeln och känner efter, till exempel luften mot handen vid /p/ och surret på halsen vid /v/."
    - "Gör uppgiften mindre: ta ett ord med två ljud i stället för tre, eller sätt ihop ljud för ljud: /s/, so, sol."
    - "Visa med handen eller med något att flytta, en för varje ljud, från vänster till höger sett från eleven."
    - "Säg det tillsammans, och låt eleven säga det själv efteråt."
  motto: Till sist säger eleven det själv.
roll:
  rubrik: Läraren är alltid modell
  text: "Elever lär sig läsa genom att se hur du gör: tänk högt inför eleverna, peka och för handen från vänster till höger när ni ljudar, och bind sedan ihop ljuden till ord tillsammans i kör. Gör samma sak flera gånger i lugnt tempo, så att örat hinner med och ögat kan följa handen. När du visar tydligt och ni ljudar tillsammans, kort och ofta, blir eleverna säkra på att avkoda och ser hur strategierna fungerar. När de sedan gör leken i par och var för sig, använder de det de har sett dig göra."
  gor:
    - Säg ljudet och dra ut det, när det går att dra ut.
    - Vänta tre sekunder innan du hjälper.
    - "Låt alla visa svaret samtidigt, med fingrar eller markörer."
    - "Beröm det eleven gjorde: ”Du drog ut ordet och hörde ljudet i mitten.”"
    - Säg vad ett ord betyder första gången, och sätt det i en mening.
  undvik:
    - Att säga bokstavens namn när ni ljudar.
    - Att göra paus mellan ljuden innan gruppen sätter ihop utdragna ljud säkert.
    - "Att lägga till ett ö efter b, d, g, k, p och t."
    - "Att ta ord som börjar med en klusil, och ord med konsonantmöten, innan gruppen är säker på ljud som går att dra ut."
    - Att gå vidare innan lektionens regel säger det.
urval:
  rubrik: Var hittar du lektionerna?
  text:
    - "Lektionerna står i lektionsbanken, under den förmåga de tränar, och heter Ljudlek följt av lektionens namn, som Ljudlek: Räkna ljud. Varje lektion är en egen metod med en egen fil att ladda ner, där de första sidorna är passet och stegen och de sista sidorna materialet. Varje lektion har samma form. Den börjar med raderna i Så blir lektionen svårare, från lätt till svårt, och fortsätter med passet i fyra steg med dina fraser och de vanliga felen under Lyssna efter. Sist står materialet att skriva ut, som bildkort, bokstavskort, golvbokstäver eller mallar, efter vad lektionen behöver. Bildkorten är vikkort med bilden på framsidan och ordet på baksidan, och under ordet står en prick för varje ljud, eller en båge för varje del när eleven räknar stavelser. Ljudstarten står likadant i varje lektion och på lathundens tredje sida, Ljudstarten. Lektionernas exempel visar samma sex elever vid olika tillfällen, och veckan i exemplet visar vilka bokstäver gruppen har haft."
    - "Orden till ljudstarten står i Ordbanken, och bokstavskorten till dagens ljud under Materialet."
  kravText: "Tre regler hjälper dig att välja lektion:"
  krav:
    - rubrik: Ljudkollen först
      text: "Börja i den ingång som ljudkollen visar"
    - rubrik: En lektion i taget
      text: Samma lektion omkring två veckor eller längre
    - rubrik: Gå vidare
      text: När lektionens regel säger det
uppfoljning:
  text: "Screeningen visar var eleven står i läsningen, och ljudkollen visar vilka av lektionernas förmågor eleven klarar. Protokollet, gruppens översikt och frågorna finns under Materialet. Berätta konkret för eleven vad hen har lärt sig. Med bladet Observation av ett pass under Materialet kan en kollega följa ett pass och ge dig återkoppling, gärna samma vecka som ljudkollen. Säg före passet vad du vill ha återkoppling på. Efteråt berättar du först vad du själv lade märke till, och sedan läser kollegan upp det som fungerade, ur sina anteckningar. Du bestämmer nästa steg, ni prövar det en gång direkt, och det blir fokus nästa gång kollegan följer ett pass. Efter perioden beslutar du hur varje elev går vidare. Klarar eleven nivå 5 eller högre i screeningen och läser hen alla fyra påhittade orden i ljudkollens uppgift 9, går hen vidare till Läslistor i grupp, TIL i grupp eller Säg, skriv och läs. Läslistor i grupp är för den som gissar sig fram eller ljudar utan att binda ihop ljuden, TIL i grupp för den som behöver stöd i avkodning och läsflyt, och Säg, skriv och läs för den som inte kommer igång med att skriva. Klarar eleven inte fler uppgifter i ljudkollen än före insatsen, får hen mer intensivt stöd, gärna enskilt, och en bedömning. Annars fortsätter eleven en period till, från den lektion som gruppen har nått. Har gruppen gått den sista lektionen, börjar eleven den nya perioden i den lektion som hör till den första uppgift i ljudkollen som hen inte klarar, eller i Från ord till mening när hen klarar alla uppgifter."
  rader:
    - nar: Före insatsen
      tid: "före"
      perElev: 12
      vad: "Gör ljudkollen och screeningen, version A, med en elev i taget utanför passen, cirka tolv minuter per elev. I gruppens översikt ser du sedan ingången."
    - nar: Var tredje vecka
      tid: "var 3:e vecka"
      perElev: [2, 3]
      vad: "Gör ljudkollens uppgift för gruppens förmåga, uppgiften för nästa förmåga och uppgift 4 på två till tre minuter per elev."
    - nar: Vecka 6
      tid: "vecka 6"
      vad: "Har en elev inte fler rätt i ljudkollen vecka 6 än i samma uppgifter före insatsen, tar du det med elevhälsan och ser till att hörseln kontrolleras."
    - nar: Efter 4–12 veckor
      tid: "efter"
      perElev: 12
      vad: "Gör hela ljudkollen och screeningen, version B, med en elev i taget, och jämför med resultaten före insatsen."
# Planera insatsen (sajtens K-551, 2026-10-26): seriens planerare med tre ingångar och lektionen vecka för vecka. Texterna
# är ordagranna citat ur metoden: ingångarna och längden ur lektionsbanken, beslutet efter perioden ur uppföljningen.
plan:
  lektionsval:
    text: "Den första förmågan där fler än hälften av eleverna inte klarar uppgiften i ljudkollen visar ingången: Rim vid 1 eller 2, Första ljudet vid 3, 4 eller 5 och Räkna ljud vid 6 eller senare."
    mer: "Lektionsbanken: förmågorna och lektionerna"
    ingangar:
      - { lektion: 1, namn: Helt nybörjare }
      - { lektion: 3, namn: Nybörjare }
      - { lektion: 6, namn: Kan ljuda }
    # En grupp som är klar med den sista lektionen före periodens slut, ur Perioden (riggens leverans 2026-10-27, punkt 3).
    klar: "Är gruppen klar med Från ord till mening före periodens slut, slutar perioden där, och du gör mätningen efter perioden."
  veckoval:
    text: "På 4–12 veckor kommer gruppen så långt den hinner från sin ingång. Välj tolv veckor, eller åtta till tolv från Räkna ljud med fem pass i veckan. En kortare period, fyra till sju veckor, passar en grupp som bara har de sista lektionerna kvar."
    mer: "Lektionsbanken: förmågorna och lektionerna"
    forval: 12
  fore:
    - "Den första förmågan där fler än hälften av eleverna inte klarar uppgiften i ljudkollen visar ingången: Rim vid 1 eller 2, Första ljudet vid 3, 4 eller 5 och Räkna ljud vid 6 eller senare."
    - "Gruppen börjar i en ingång och går sedan vidare lektion för lektion: vid förmåga 4 börjar den i Första ljudet och tar sedan Bokstavsgympa."
    - "Har du inte gjort ljudkollen före första passet, väljer du Första ljudet, med s som dagens ljud."
    - "Visar ljudkollen sedan en annan ingång, går gruppen dit."
  utvardering:
    - "Klarar eleven nivå 5 eller högre i screeningen och läser hen alla fyra påhittade orden i ljudkollens uppgift 9, går hen vidare till Läslistor i grupp, TIL i grupp eller Säg, skriv och läs. Läslistor i grupp är för den som gissar sig fram eller ljudar utan att binda ihop ljuden, TIL i grupp för den som behöver stöd i avkodning och läsflyt, och Säg, skriv och läs för den som inte kommer igång med att skriva."
    - "Klarar eleven inte fler uppgifter i ljudkollen än före insatsen, får hen mer intensivt stöd, gärna enskilt, och en bedömning."
    - "Annars fortsätter eleven en period till, från den lektion som gruppen har nått."
    - "Har gruppen gått den sista lektionen, börjar eleven den nya perioden i den lektion som hör till den första uppgift i ljudkollen som hen inte klarar, eller i Från ord till mening när hen klarar alla uppgifter."
mal:
