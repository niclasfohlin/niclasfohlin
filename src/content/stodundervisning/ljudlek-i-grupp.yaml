kort:
  listor:
    - Bokstavskort
lathund:
  innehall: En lektion i taget, samma ljudstart varje pass
  metoden:
    text:
      - "Eleverna hör, delar upp och sätter ihop ljuden i ord och kopplar dem till bokstäver, så att de kan läsa och skriva korta ord. Din roll är att visa, lyssna och välja. Du gör screeningen och ljudkollen, leder ljudstarten, tar en lektion i taget och noterar efter passet."
      - "Insatsen är för elever i F–2 som klarar högst nivå 4 i screeningen och för osäkra nybörjarläsare. Gör ljudkollen och screeningen den första veckan. Gruppen börjar i den första förmågan där fler än hälften har en ring. Innan ljudkollen är gjord tar gruppen lektionen Första ljudet."
    ruta:
      rubrik: Fyra saker att hålla fast vid
      punkter:
        - fet: Visa först.
          text: "Tänk högt och för handen från vänster till höger, sett från eleverna."
        - fet: Säg ljudet, inte namnet.
          text: "Dra ut ljuden utan paus när ni sätter ihop."
        - fet: En sak i taget.
          text: "Samma lektion flera pass, tills lektionens regel säger att ni går vidare."
        - fet: Avsluta när det går bra.
    tabell:
      rubrik: Passet i tre delar · vad du gör och säger
      kolumner:
        - Del
        - Exempelfraser
      rader:
        - - |-
            1 · Ljudstart
            0–⁠5 min. Alla i kör.
          - |-
            ”Det här är /m/. Mmm.”
            ”Mmmooosss. Vilket ord?”
            ”Mus. Säg ljuden.”
        - - |-
            2 · Lektionen
            5–⁠25 min. Fyra steg.
          - |-
            ”Titta hur jag gör.”
            ”Nu gör vi det tillsammans.”
        - - |-
            3 · Avslut
            25–⁠30 min. Gemensamt.
          - ”Säg ett ord från i dag och vad du gjorde med det.”
    not: "I lektionen visar du i 3–⁠4 minuter, ni gör tillsammans i 5–⁠6, paren arbetar i 5 och var och en i 4–⁠5, medan du lyssnar på dagens elever. Dela antalet elever med antalet pass i veckan och avrunda uppåt, så får du antalet dagens elever. Med tolv elever blir det sex par."
  pass:
    rubrik: "Vi kör ett pass: Räkna ljud"
    textRubrik: Gruppen · sex elever i förskoleklass och åk 1, vecka 3
    text:
      - "Ljudstarten. Läraren visar m: ”Det här är /m/. Mmm.” Alva säger ”em”, och läraren svarar: ”Em är namnet. Ljudet är mmm.” När gruppen delar upp mat säger Mira ”m-⁠t”. Läraren drar ut a:et, och Mira hör /a/."
      - "Lektionen, Räkna ljud, i raden Med klusil. Läraren flyttar en magnet för varje ljud i ko, lök och kaka. Gruppen räknar ljuden i tåg, öga och stol tillsammans, och paren tar fler ord. I steg 4 säger Mira ”bö-⁠å-⁠tö”. Läraren säger b kort: ”b-⁠ååå-⁠t.”"
      - "Avslutet. Omar säger: ”Apa. Tre ljud.” Läraren noterar: Mira och Omar lade rätt antal markörer själva. Nästa pass tar gruppen samma rad, eftersom den går vidare först efter två pass i följd."
    forberett:
      rubrik: Det jag förberedde
      text:
        - "Valt ord ur Med klusil och tagit fram korten m, s, o och l. Lagt fram ljudrutor, markörer och en spegel per par. Paren: Alva och Elin, Omar och Noah, Leo och Mira. Dagens elever: Mira och Omar."
    klarTidigt: "Ta ett ord ur nästa ordgrupp, eller gör leken en gång till."
    schema:
      rubrik: 30 minuter, del för del
      rader:
        - tid: Före
          fas: Förberedelse
          vad: "Välj orden, ta fram bokstavskorten och lektionens material. Bestäm paren och dagens elever."
        - tid: 0–5
          fas: 1 · Ljudstart
          vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra. Alla svarar samtidigt."
        - tid: 5–25
          fas: 2 · Lektionen
          vad: "Steg 1 du visar, 2 tillsammans, 3 i par, 4 var för sig. Du lyssnar på dagens elever."
        - tid: 25–30
          fas: 3 · Avslut
          vad: "Ett ord var, och vad du hörde. Nästa pass: samma lektion eller nästa?"
  mall:
    rubrik: Ljudstarten
    underrad: "Samma fem minuter varje pass · orden ur Ordbanken"
    block:
      - typ: tabell
        rubrik: Tre moment, alla svarar samtidigt
        kolumner:
          - Moment
          - Så gör du
        rader:
          - - Dagens ljud
            - "Visa bokstaven och säg ljudet. Alla säger efter, och någon säger ett ord på ljudet. Sist säger alla ljuden för några bokstäver ni har haft."
          - - Sätt ihop
            - "Dra ut fem ord utan paus med handen från vänster till höger sett från eleverna. Räkna tyst till tre och knyt handen: alla svarar, sist en elev ensam."
          - - Dela upp
            - "Säg fyra ord med olika många ljud. Alla säger ordet och ljuden och räknar fingrarna."
      - typ: tabell
        rubrik: Ordbanken
        kolumner:
          - Ordgrupp
          - Orden
        rader:
          - - Två ljud att dra ut
            - "is, ål, se, le, ro, sy, nu, ny, så"
          - - Tre ljud att dra ut
            - "sol, lus, mus, mos, vas, mål, nål, mås, sås, räv, säl, hår"
          - - Med klusil
            - "mat, lök, nöt, pil, gås, kål, gul, bad, båt, tåg, duk, tak"
          - - Två stavelser
            - "sola, mosa, lera, rasa, mera, läsa, måla, leta, vila, bada, baka, kaka"
          - - Konsonantmöte först
            - "snö, blå, sko, bro, tre, grå, klo, stå, sten, stol, glas, svan, stor, smör"
          - - Konsonantmöte sist
            - "fisk, mask, hand, sand, hund, vind, land, hals, rund, tält"
      - typ: snabbmall
  material:
    rubrik: Vad du behöver för ett pass
    kravEtikett: Regel
    var:
      rubrik: Var lektionerna och materialet finns
      punkter:
        - fet: Lektionerna.
          text: "I lektionsbanken, under den förmåga de tränar. De heter Ljudlek följt av lektionens namn, som Ljudlek: Räkna ljud, och varje lektion är en egen metod. Lektionens första sidor är passet och stegen, och sist står materialet att skriva ut: bildkort, bokstavskort, golvbokstäver, ljudrutor eller platsrutor."
        - fet: Bokstavskorten, screeningen och ljudkollen.
          text: "Under Materialet på metodsidan och i planeringsmallarna (Word): bokstavskorten, elevens blad, protokollet och gruppens översikt."
      efter: "Lektionsbanken, förmåga för förmåga: Rim (1), Ord och stavelser (2), Första ljudet (3), Bokstavsgympa (4, Bokstävernas ljud), Smaka på ljud (5, Sist och i mitten), Räkna ljud (6, Dela upp), Skriv ord tillsammans (7, Skriva ord) och Från ljud till ord (8, Sätta ihop och byta)."
    bordet:
      - Bokstavskortet för dagens ljud och några som ni har haft
      - Bokstavskartan, till den som behöver den
      - En spegel per par
      - Lektionens material
      - Snabbmallen, med paren och dagens elever
    varjePass: "Vem klarade steg 4 själv, vad fastnade, och samma lektion eller nästa?"
