inledning:
  - "Ljudlek i grupp är för elever i förskoleklass till årskurs 2 som behöver stöd i att höra ljuden i orden och koppla dem till bokstäverna. Det märks när eleven säger ess om första ljudet i sol, gissar ett ord efter första bokstaven eller tvekar om sol och sko börjar med samma ljud."
  - "Så här lär sig eleven läsa och skriva. Att läsa är att se bokstäverna i ordning, säga ljudet för varje bokstav och sätta ihop ljuden till ett ord: sss-⁠ooo-⁠lll, sol. Att skriva är samma sak åt andra hållet: eleven säger ordet långsamt, hör ljuden ett i taget och skriver en bokstav för varje ljud. Eleven behöver alltså tre saker: höra ljuden i orden, kunna bokstävernas ljud, och kunna sätta ihop ljud och dela upp ord. Har eleven ljudat ett ord några gånger känner hen igen det direkt, och då går läsningen fort."
  - "Syftet är att eleverna knäcker läskoden: att de hör ljuden i orden, kan bokstävernas ljud och kan sätta ihop och dela upp korta ord, så att de kan läsa och skriva dem själva. Undervisning i ljuden hjälper mest de elever som har kommit kortast, och den ger mest när bokstäverna finns med från första passet."
  - "Din roll är att visa, lyssna och välja. Du visar varje lek först och tänker högt. Sedan gör ni den tillsammans, och eleverna tar över, först i par och sedan var för sig, medan du lyssnar på några av dem i varje pass. Du säger ljuden tydligt och drar ut dem som går att dra ut, väntar innan du hjälper och ger minsta möjliga stöd. Du tar reda på vad varje elev kan med två kartläggningar. Screeningen visar var eleven står i läsningen, på åtta nivåer från första ljudet till att läsa en text och svara på frågor om den. Ljudkollen visar vilken lektion gruppen börjar i och vilka bokstäver som blir dagens ljud. Den har nio korta uppgifter, en för varje förmåga i lektionsbanken, och i den sista läser eleven fyra påhittade ord. Var tredje vecka gör du två eller tre av ljudkollens uppgifter igen och ser om eleverna går framåt."
  - "Varje pass börjar med ljudstarten, fem minuter där alla sätter ihop och delar upp ord, och fortsätter med en lektion ur lektionsbanken. Lektionerna tränar var sin del av det eleven behöver, från rim till korta meningar, och gruppen tar den lektion som ljudkollen visar. Det som gäller alla lektioner står här: eleverna, din roll, ljudstarten, dagens ljud, stödet när eleven fastnar, felsökningen och uppföljningen. Varje lektion har sina egna fyra steg, sina ord och sitt material."
upplagg:
  rubrik: Så fungerar insatsen
  text: "Insatsen pågår i 4–12 veckor med tre till fem pass i veckan, helst fler än tre för en grupp som har kommit kortast. Gruppen har två till tolv elever, och varje pass är cirka 30 minuter med tre delar: ljudstarten, lektionen och avslutet. I ljudstarten sätter alla ihop och delar upp ord, likadant varje pass. Lektionen väljer du ur lektionsbanken efter ljudkollen, och gruppen gör samma lektion två veckor eller längre. Ljudkollen och screeningen gör du med varje elev före eller under den första veckan, ljudkollen igen var tredje vecka och båda efter perioden, så att du kan jämföra med starten."
gruppen:
  rubrik: Så väljer du eleverna och sätter ihop paren
  text: "Ljudlek är för elever i F–2 som klarar högst nivå 4 i screeningen, också under nivå 1, och för osäkra nybörjarläsare. Du kan starta utifrån det du vet om dem. Den som klarar nivå 5 och läser alla fyra påhittade orden i ljudkollen behöver i stället Läslistor i grupp, TIL i grupp eller Säg, skriv och läs. Har en elev ett litet ordförråd eller otydligt tal, kopplar du in logopeden samtidigt, men är svenskan ny prövar du först samma sak på förstaspråket. I steg 3 arbetar eleverna i par, en säkrare och en mindre säker. Vid udda antal blir det en trio, där oftast en säger ordet och två turas om."
