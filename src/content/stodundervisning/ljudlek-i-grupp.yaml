    - Lagt fram lektionens sidor med passet och stegen, materialet och en spegel per par.
    - Bestämt paren och skrivit dagens elever i snabbmallen.
grund:
  text: "Nybörjare i läsningen behöver upptäcka att orden består av ljud och att bokstäverna står för ljuden (Castles, Rastle och Nation, 2018). Förmågan att höra ljuden och kunskapen om bokstävernas ljud förutsäger den tidiga läsningen (Hulme m.fl., 2012). Undervisning i att höra, dela upp och sätta ihop ljuden hjälper, allra mest dem som har kommit kortast, och effekten på läsningen blir nästan dubbelt så stor när bokstäverna finns med (Ehri m.fl., 2001; National Reading Panel, 2000). En eller två förmågor åt gången ger mest, och att sätta ihop och dela upp är kärnan (National Reading Panel, 2000). Nybörjare får lättare ihop ordet när ljuden dras ut utan paus (Gonzalez-⁠Frey och Ehri, 2021), och i svenska studier gav stöd med munnen och spegeln bättre avkodning (Fälth, Gustafson och Svensson, 2017; Fälth, Svensson och Ström, 2020). Bornholmsmodellens språklekar i förskoleklass stärker förmågan att höra ljuden, och träningen ger mest när läraren gör kopplingen till bokstäverna tydlig (National Reading Panel, 2000; Wolff, 2017)."
  kallor: "Bygger på Castles, Rastle och Nation (2018), Hulme m.fl. (2012), Ehri m.fl. (2001), National Reading Panel (2000), Gonzalez-⁠Frey och Ehri (2021), Fälth, Gustafson och Svensson (2017), Fälth, Svensson och Ström (2020) och Wolff (2017)."
ramar:
  rubrik: Materialet
  text:
    - "Här finns bokstavskorten till ljudstarten, bokstavskartan, screeningen i två versioner, ljudkollen, protokollet, gruppens översikt och bladet Observation av ett pass. Allt går att kopiera. Laminera korten, kartan och screeningens blad. Ljudkollens blad kopierar du, ett per elev. Varje lektion har sitt eget material och säger vad du laminerar. Korten står i Andika, ett gratis typsnitt från SIL för dem som lär sig läsa."
  ramar:
    - rubrik: Bokstavskort till ljudstarten
      text:
        - "Här är korten till dagens ljud, i den ordning bokstäverna blir dagens ljud. Skriv ut sidan två gånger för hela insatsen, så att korten räcker till ord som kaka, med två k och två a."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Skriv ut korten på tjockt papper och klipp isär dem. Håll upp kortet för dagens ljud så att alla ser det. När ni ljudar ett ord med korten lägger du dem rättvända för eleverna."
      listor:
        - rubrik: Bokstavskort
          rader:
            - [s, o, l]
            - [a, r, m]
            - [e, n, i]
            - [v, t, f]
            - [å, p, k]
            - [d, u, b]
            - [g, h, y]
            - [ä, ö, j]
    - rubrik: Bokstavskartan
      text:
        - "Här är alfabetet med en bild för varje bokstav utom q, w och x, och ordet till bilden börjar på bokstavens ljud. Kartan är till den som behöver stöd att minnas bokstävernas ljud, och i en del lektioner till alla."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Skriv ut kartan i färg och laminera den. Lägg den framför den elev som behöver den, eller sätt upp den där gruppen sitter, och säg vad bilderna heter i kör första gången. Peka på bokstaven och bilden och säg ljudet: ”a, som i apa. Aaa.” Q, w och x har ingen bild, eftersom inga vanliga ord börjar på dem. Bilderna ger samma första ljud också om eleven säger kossa eller isbit, och åsnan kallar ni åsna, varje gång. Säg vokalens långa ljud när ni pekar, ooo och uuu, också när ordet på bilden har kort vokal, som orm, uggla, yxa och äpple."
    - rubrik: "Screeningen, version A"
      text:
        - "Elevens blad till screeningen före insatsen har två sidor. Nivå 1 och 2 säger du, och nivå 3–⁠8 läser eleven från bladet. Här står det du säger och frågar på varje nivå, och gränsen för att gå vidare."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Sitt med en elev i taget, utanför passen. Börja på nivå 1 och fortsätt så länge eleven klarar gränsen. Skriv resultatet för varje nivå i protokollets kolumn Före, antal rätt eller antal fel som gränsen säger, och ringa in den högsta nivån eleven klarar. Klarar eleven inte nivå 1, skriver du antal rätt på raden och ringar inte in någon nivå. Säger eleven bokstavens namn eller lägger till ett ö, fråga: ”Hur låter det?” Räkna svaret som rätt om eleven då säger ljudet. Kryssa felet, och de andra felen du hör, under Fel att lyssna efter."
            - rubrik: Läsfel och frågor
              text: "Från nivå 5 räknar du läsfel: ett ord som eleven läser fel, hoppar över, lägger till eller får hjälp med. Ett ord som eleven rättar själv är inget fel. I nivå 6–⁠8 läser eleven högt, och sedan läser du frågorna medan texten ligger kvar. Skriv antal läsfel och antal rätta svar, till exempel 1 fel och 2 av 2 rätt. Ett svar är rätt när det stämmer med texten, och när frågan säger ”tror du” räcker ett rimligt svar ur texten."
            - rubrik: Bladet
              text: "Skriv ut bladet dubbelsidigt, med nivå 3–⁠6 på framsidan och nivå 7–⁠8 på baksidan, och laminera det. Lägg bladet framför eleven och peka på en nivå i taget. Täck gärna nivåerna längre ned med ett papper."
        - rubrik: Nivå för nivå
          falt:
            - rubrik: "Nivå 1 · Första ljudet"
              text: "Säg: ”sol, skola, sten, sko”. Fråga: ”Vilket ljud börjar orden på?” Svaret är /s/. Säg sedan ”lek, lada, lera, lamm”. Svaret är /l/. Eleven säger ljudet, inte bokstavens namn. Gränsen: 2 av 2."
            - rubrik: "Nivå 2 · Sätta ihop"
              text: "Säg ljuden i ett ord i taget, med en kort paus mellan ljuden: /s/ /o/ /l/ (sol), /m/ /o/ /s/ (mos), /s/ /a/ /l/ (sal). Fråga efter varje ord: ”Vilket ord blir det?” Säg ljuden, inte bokstävernas namn. Pausen hör till screeningen: den prövar om eleven får ihop ljud som kommer ett i taget. Gränsen: 2 av 3."
            - rubrik: "Nivå 3 · Bokstavens ljud"
              text: "Peka på en bokstav i taget, först de sju små och sedan de sju stora. Eleven säger ljudet. Gränsen: 12 av 14."
            - rubrik: "Nivå 4 · Läsa ord"
              text: "Eleven läser orden sol, mor, sal, ram och ser. Gränsen: 4 av 5."
            - rubrik: "Nivå 5 · Läsa meningar"
              text: "Eleven läser de tre meningarna högt. Gränsen: högst ett fel sammanlagt."
            - rubrik: "Nivå 6 · Läsa och svara"
              text: "Eleven läser texten om Eva högt. Fråga sedan: ”Vad har Eva?” ”Vad ritade Eva?” Gränsen: högst ett fel och frågorna rätt."
            - rubrik: "Nivå 7 · Läsa en kort text"
              text: "Vänd bladet. Eleven läser texten om Lina högt. Fråga sedan: ”Varför tror du att Lina gick fram till flickan?” ”Varför går de in tillsammans, tror du?” Gränsen: högst två fel och frågorna rätt."
            - rubrik: "Nivå 8 · Läsa en längre text"
              text: "Eleven läser texten om Ola högt. Fråga sedan: ”Varför hade Ola ingen att leka med?” ”Varför pirrade det i Olas mage, tror du?” Gränsen: högst tre fel och frågorna rätt."
    - rubrik: "Screeningen, version B"
      text:
        - "Elevens blad till screeningen efter insatsen har samma uppställning som version A, så att du kan jämföra, men andra ord och texter, så att eleven inte känner igen dem. Här står det du säger och frågar på varje nivå, och gränsen för att gå vidare."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Sitt med en elev i taget, utanför passen, som före insatsen. Börja på nivå 1 och fortsätt så länge eleven klarar gränsen. Skriv resultatet för varje nivå i protokollets kolumn Efter, antal rätt eller antal fel som gränsen säger, och ringa in den högsta nivån eleven klarar. Klarar eleven inte nivå 1, skriver du antal rätt på raden och ringar inte in någon nivå. Säger eleven bokstavens namn eller lägger till ett ö, fråga: ”Hur låter det?” Räkna svaret som rätt om eleven då säger ljudet. Kryssa felet, och de andra felen du hör, under Fel att lyssna efter."
            - rubrik: Läsfel och frågor
              text: "Från nivå 5 räknar du läsfel: ett ord som eleven läser fel, hoppar över, lägger till eller får hjälp med. Ett ord som eleven rättar själv är inget fel. I nivå 6–⁠8 läser eleven högt, och sedan läser du frågorna medan texten ligger kvar. Skriv antal läsfel och antal rätta svar, till exempel 1 fel och 2 av 2 rätt. Ett svar är rätt när det stämmer med texten, och när frågan säger ”tror du” räcker ett rimligt svar ur texten."
            - rubrik: Bladet
              text: "Skriv ut och laminera bladet som version A, dubbelsidigt. Lägg det framför eleven och peka på en nivå i taget."
        - rubrik: Nivå för nivå
          falt:
            - rubrik: "Nivå 1 · Första ljudet"
              text: "Säg: ”ros, rita, ring, resa”. Fråga: ”Vilket ljud börjar orden på?” Svaret är /r/. Säg sedan ”sax, skog, stövel, spade”. Svaret är /s/. Eleven säger ljudet, inte bokstavens namn. Gränsen: 2 av 2."
            - rubrik: "Nivå 2 · Sätta ihop"
              text: "Säg ljuden i ett ord i taget, med en kort paus mellan ljuden: /r/ /a/ /m/ (ram), /f/ /a/ /r/ (far), /n/ /e/ /r/ (ner). Fråga efter varje ord: ”Vilket ord blir det?” Säg ljuden, inte bokstävernas namn. Pausen hör till screeningen: den prövar om eleven får ihop ljud som kommer ett i taget. Gränsen: 2 av 3."
            - rubrik: "Nivå 3 · Bokstavens ljud"
              text: "Peka på en bokstav i taget, först de sju små och sedan de sju stora. Eleven säger ljudet. Gränsen: 12 av 14."
            - rubrik: "Nivå 4 · Läsa ord"
              text: "Eleven läser orden nos, ris, ren, val och fil. Gränsen: 4 av 5."
            - rubrik: "Nivå 5 · Läsa meningar"
              text: "Eleven läser de tre meningarna högt. Gränsen: högst ett fel sammanlagt."
            - rubrik: "Nivå 6 · Läsa och svara"
              text: "Eleven läser texten om Alma högt. Fråga sedan: ”Vad har Alma?” ”Vad handlar boken om?” Gränsen: högst ett fel och frågorna rätt."
            - rubrik: "Nivå 7 · Läsa en kort text"
              text: "Vänd bladet. Eleven läser texten om Noah högt. Fråga sedan: ”Varför tror du att Noah gav bort sin smörgås?” ”Varför ler pojken, tror du?” Gränsen: högst två fel och frågorna rätt."
            - rubrik: "Nivå 8 · Läsa en längre text"
              text: "Eleven läser texten om Stefan högt. Fråga sedan: ”Varför får inte Stefan vara med och spela fotboll?” ”Hur tror du att Stefan känner sig när han ser de andra spela?” Gränsen: högst tre fel och frågorna rätt."
    - rubrik: Ljudkollen
      text:
        - "Eleven läser uppgift 4 och 9 från bladet och skriver uppgift 7 på ett papper. De andra uppgifterna säger du. Här står det du säger och frågar i varje uppgift."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Gör ljudkollen med en elev i taget, utanför passen. Före och efter insatsen gör du alla nio uppgifterna, och var tredje vecka uppgiften för gruppens förmåga, uppgiften för nästa förmåga och uppgift 4. Varje uppgift utom uppgift 4 har fyra delar, och du skriver antal rätt av 4 i protokollet. Eleven klarar en uppgift med minst tre rätt av fyra, och uppgift 4 med minst åtta av de tio första bokstäverna, och det för du in i gruppens översikt. Säger eleven bokstavens namn eller lägger till ett ö, fråga: ”Hur låter den?” och räkna svaret som rätt om eleven då säger ljudet, som i screeningen."
            - rubrik: Bokstäverna
              text: "Bokstäverna i uppgift 4 står blandade, så att eleven inte kan säga dem i den ordning ni lär in dem. Ringa in på elevens kopia de bokstäver som eleven inte kan, när hen har läst klart, och spara kopian med protokollet. Stryk ringen när eleven kan bokstaven. Den första bokstaven i ordningen s, o, l, a, r, m, e, n, i, v som fler än hälften av eleverna har inringad blir dagens ljud."
            - rubrik: Bladet
              text: "Kopiera bladet, ett per elev, och skriv elevens namn överst. Ha några markörer till uppgift 6 och papper och penna till uppgift 7 framme."
        - rubrik: Uppgift för uppgift
          falt:
            - rubrik: "1 · Rim"
              text: "”Rimmar katt och hatt?” (ja) ”Rimmar gris och glass?” (nej) ”Säg ett ord som rimmar på boll.” (till exempel troll) ”Säg ett ord som rimmar på gå.” (till exempel två) Ett påhittat ord som rimmar räknas."
            - rubrik: "2 · Ord och stavelser"
              text: "”Klappa ordet. Hur många klappar?” sked (1), lampa (2), banan (2), krokodil (3)"
            - rubrik: "3 · Första ljudet"
              text: "”Vilket ljud hör du först i måne?” (/m/) Och i såg (/s/), fot (/f/) och tå (/t/)."
            - rubrik: "4 · Bokstävernas ljud"
              text: "Peka på en bokstav i taget på bladet. Eleven säger ljudet. Skriv hur många bokstäver eleven kan av de tio första och av alla 24, till exempel 8 och 19."
            - rubrik: "5 · Sist och i mitten"
              text: "”Vilket ljud hör du sist i lås?” (/s/) Och sist i får (/r/). ”Vilket ljud hör du i mitten av mur?” (/u/) Och i mitten av löv (/ö/)."
            - rubrik: "6 · Dela upp"
              text: "”Säg ljuden i få och lägg en markör för varje ljud.” (2) Och hål (3), näsa (4), häst (4)."
            - rubrik: "7 · Skriva ord"
              text: "Säg: ”Skriv ordet på, som i: Mössan ligger på bordet.” Sedan fin, sur och lama, ett ord i taget. Svaret är rätt när eleven skriver en bokstav för varje ljud, i rätt ordning."
            - rubrik: "8 · Sätta ihop och byta"
              text: "Säg ljuden med en kort paus: ”/v/ /å/ /r/. Vilket ord blir det?” (vår) Och /r/ /ö/ /r/ /a/ (röra). ”Säg lek. Ta bort /l/.” (ek) ”Säg sal. Byt /s/ mot /h/.” (hal) Pausen hör till kollen: den prövar om eleven får ihop ljud som kommer ett i taget."
            - rubrik: "9 · Påhittade ord"
              text: "Eleven läser fål, rel, nar och mel från bladet."
