      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Ljudkollen, uppgift 1–4
              text: "1 · Rim. ”Rimmar katt och hatt?” (ja) ”Rimmar gris och glass?” (nej) ”Säg ett ord som rimmar på boll.” (till exempel troll) ”Säg ett ord som rimmar på gå.” (till exempel två) Ett påhittat ord som rimmar räknas.\n2 · Stavelser. ”Klappa ordet. Hur många klappar?” sked (1), lampa (2), banan (2), krokodil (3)\n3 · Första ljudet. ”Vilket ljud hör du först i måne?” (/m/) Och i såg (/s/), fot (/f/) och tå (/t/).\n4 · Bokstävernas ljud. Eleven säger ljudet för bokstäverna på bladet. Skriv hur många av de tio första och hur många av alla 24, till exempel 8 och 19."
            - rubrik: Ljudkollen, uppgift 5–9
              text: "5 · Sist och i mitten. ”Vilket ljud hör du sist i lås?” (/s/) Och sist i får (/r/). ”Vilket ljud hör du i mitten av mur?” (/u/) Och i mitten av löv (/ö/).\n6 · Dela upp. ”Säg ljuden i få och lägg en markör för varje ljud.” (2) Och hål (3), näsa (4), häst (4).\n7 · Skriva ord. ”Skriv ordet på.” Sedan fin, sur och lama på samma sätt. Svaret är rätt när eleven skriver en bokstav för varje ljud, i rätt ordning.\n8 · Sätta ihop och byta. Säg ljuden med en kort paus: ”/v/ /å/ /r/. Vilket ord blir det?” (vår) Och /r/ /ö/ /r/ /a/ (röra). ”Säg lek. Ta bort /l/.” (ek) ”Säg sal. Byt /s/ mot /h/.” (hal) Pausen hör till kollen: den prövar om eleven får ihop ljud som kommer ett i taget.\n9 · Påhittade ord. Eleven läser fål, rel, nar och mel från bladet."
