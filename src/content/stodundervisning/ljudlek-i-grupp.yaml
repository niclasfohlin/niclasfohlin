# Metod i stödundervisning. Modellen står i methods/_mall.yaml och docs/modell.md.
titel: Ljudlek i grupp
undertitel: "Språkljud och bokstäver i grupp för F–⁠2, med en lektionsbank att välja ur"
ingress: "Eleverna hör, delar upp och sätter ihop ljuden i ord och kopplar dem till bokstäver. Varje pass börjar med fem minuter där alla sätter ihop och delar upp ord. Sedan kommer en lektion som du väljer ur lektionsbanken efter en kort kartläggning. Insatsen är för elever i F–2 som behöver stöd i att upptäcka språkljuden."
omrade: Läsning
arskurs:
  - F-3
arskursText: "F–2"
taggar:
  - fonologisk-medvetenhet
  - bokstavskunskap
  - intensivtraning
format:
  - liten grupp
  - par
tid: 30 minuter per pass, tre till fem pass i veckan
period: 4–12 veckor
grupp: 2–12 elever
material:
  - bokstavskorten
  - bokstavskartan
  - speglar
  - lektionens material
  - snabbmallen
  - kartläggningen
uppdaterad: 2026-10-27
relaterade:
  - laslistor-i-grupp
  - til-i-grupp
  - sag-skriv-och-las
utkast: false
lektionsbank:
  rubrik: "Lektionsbanken: förmågorna och lektionerna"
  text: "Varje lektion tränar en förmåga, och lektionen, förmågan och uppgiften i ljudkollen har samma nummer. Ordningen mellan förmågorna är ett förslag. Eleven klarar en uppgift i ljudkollen med minst tre rätt av fyra, och uppgift 4 med minst åtta av de tio första bokstäverna. Ljudkollen visar vilken av tre ingångar gruppen börjar i: Rim (lektion 1) för helt nybörjare, Första ljudet (lektion 3) för nybörjare och Räkna ljud (lektion 6) för elever som kan ljuda. Den första förmågan där fler än hälften av eleverna inte klarar uppgiften i ljudkollen visar ingången: Rim vid 1 eller 2, Första ljudet vid 3, 4 eller 5 och Räkna ljud vid 6 eller senare. Gruppen börjar i en ingång och går sedan vidare lektion för lektion: vid förmåga 4 börjar den i Första ljudet och tar sedan Bokstavsgympa. Har du inte gjort ljudkollen före första passet, väljer du Första ljudet, med s som dagens ljud. Visar ljudkollen sedan en annan ingång, går gruppen dit. Nya lektioner läggs in under den förmåga de tränar."
  lektionskort: "Varje lektion har ett lektionskort, ett A4 med målet, rörelsen, orden och passet. Öppna kortet vid lektionen, eller skriv ut alla på en gång och sätt dem i en pärm."
  formagor:
    - nr: 1
      namn: "Rim"
      skal: "Den lättaste vägen in i ljuden, men inte nödvändig för läsningen."
    - nr: 2
      namn: "Ord och stavelser"
      skal: "Större delar före de enskilda ljuden."
    - nr: 3
      namn: "Första ljudet"
      skal: "Första ljudet är lättast att höra, och där börjar ni med bokstäverna."
    - nr: 4
      namn: "Bokstävernas ljud"
      skal: "Bokstäverna tidigt, med kroppen som stöd för ordningen i ordet."
    - nr: 5
      namn: "Sist och i mitten"
      skal: "Ljudet i mitten är svårast att höra, så det kommer efter det första och det sista."
    - nr: 6
      namn: "Dela upp"
      skal: "Att dela upp är kärnan, tillsammans med att sätta ihop."
    - nr: 7
      namn: "Skriva ord"
      skal: "Ljuden med bokstäverna, en bokstav i taget."
    - nr: 8
      namn: "Sätta ihop och byta"
      skal: "Att ändra ljud är det svåraste med ljuden och kommer näst sist. I förmåga 7 är bytet en väg till att skriva, men här är ändringen själva uppgiften."
    - nr: 9
      namn: "Läsa och skriva meningar"
      skal: "Sist i banken. Eleven läser och skriver ord i korta meningar, också ord som ingen har sagt högt först, och med meningarna tar hen steget till att läsa och skriva själv."
  not: "Att sätta ihop och dela upp tränar ni redan i varje ljudstart. I åk 1–⁠2 börjar gruppen oftast i Första ljudet eller Räkna ljud och lägger mer tid på förmåga 7 och 8. Varje lektion säger när gruppen går vidare till nästa lektion, oftast när fler än hälften av eleverna klarar steg 4 själva i lektionens sista rad. Har förmågan flera lektioner, kan gruppen ta dem efter varandra. I ljudkollen var tredje vecka visar uppgiften för gruppens förmåga samma sak som lektionens regel. Uppgiften för nästa förmåga visar vem som redan är säker på den. I Smaka på ljud, Räkna ljud och Från ljud till ord visar uppgiften också vilken rad gruppen börjar i när den kommer dit. Den som redan är säker blir den säkrare i paret och får ord ur nästa ordgrupp. Den som inte klarar uppgifter före gruppens förmåga får ord ur en lättare ordgrupp, blir dagens elev oftare och sitter med en säker kamrat. I en lektion där ljudkollen visar vilken rad gruppen börjar i, väljer du raden efter den senaste ljudkollen med lektionens uppgift. Är den äldre än tre veckor, gör du uppgiften med varje elev före lektionens första pass. Gruppen börjar i den första raden där fler än hälften av eleverna missade ett ord som hör till raden. Finns ingen sådan rad, börjar gruppen i raden för uppgiftens sista ord. Lektion 1 till 5 tar omkring två veckor var (sex till tio pass). Lektion 6 till 9 tar två till fyra veckor var, eftersom innehållet där är skarpare och det är viktigare att eleverna klarar det. Med två pass i varje rad tar en sådan lektion omkring tio pass från första raden, alltså två veckor med fem pass i veckan eller tre till fyra veckor med tre pass. Elevernas progression styr: gruppen går vidare när lektionens regel säger det, och inte förr. På 4–12 veckor kommer gruppen så långt den hinner från sin ingång. Från Rim når gruppen oftast Räkna ljud på tolv veckor. Från Första ljudet når den oftast Skriv ord tillsammans, och från Räkna ljud når den Från ord till mening. Med fyra eller fem pass i veckan blir en grupp som börjar i Räkna ljud oftast klar med Från ord till mening på en period. En grupp som börjar i Rim eller Första ljudet behöver oftast två perioder. Välj tolv veckor, eller åtta till tolv från Räkna ljud med fem pass i veckan. En kortare period, fyra till sju veckor, passar en grupp som bara har de sista lektionerna kvar. Är gruppen klar med Från ord till mening före periodens slut, slutar perioden där, och du gör mätningen efter perioden. Tar perioden slut innan gruppen är klar, gör du ändå ljudkollen och screeningen efter perioden och beslutar hur varje elev går vidare."
