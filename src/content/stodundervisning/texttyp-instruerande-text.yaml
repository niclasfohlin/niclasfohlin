          - - "PASS 6\n0–⁠60 min"
            - "Två texter, vecka 3. Säg 18–22, Skriv 22–35. Flygdagen 35–60, med sidan Flygdagen."
          - - "PASS 7\n0–⁠5 min"
            - "Lådan från läsarnas klass. Steget där flest stannade."
          - - "PASS 8\n0–⁠60 min"
