lathund:
  innehall: Läsare som gör det som står
  metoden:
    text:
      - "Kursen är för elever i åk 4–7 som hoppar över steg när de skriver en instruktion. Eleven lär sig skriva i fyra steg, Tänk, Planera, Säg och Skriv, så att läsaren kan göra något själv. Tabellen visar passets delar. Passen med egna minuter står på sidan Mallen, och stödtrappan i lathunden för Texttyper i grupp."
      - "Läsarna går i en annan klass. De gör flygarna på Flygdagen i pass 6 och spelar elevernas spel på Spelstunden i pass 12, och en läsare på skolan spelar parets spel."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Nämn läsaren före första ordet.
          text: Läsaren avgör vad som ska med.
        - fet: Lägg åt sidan eller lägg till, för läsarens skull.
          text: Säg varför, så att valet hörs och syns.
        - fet: Kör fast högt.
          text: Säg vad du gör då.
      efter: Du gör dem först, sedan eleven. Det är dem du lyssnar efter.
    tabell:
      rubrik: Passets delar · vad du säger
      kolumner:
        - Del
        - Du säger
      rader:
        - - "1 · Läs som läsaren\nAlla svar på bordet"
          - "”Vad hände? Vad undrar du?”\n”Vilken mening hjälper läsaren mest?”"
        - - "2 · Visa och pröva\nDu tänker högt"
          - "”Vad hörde ni mig säga?”\n”Nu prövar vi samma sak tillsammans.”"
        - - "3 · Tänk och planera"
          - "”Kan läsaren göra det här utan att fråga dig?”\n”Vad gör läsaren först?”"
        - - "4 · Säg\nPärmen emellan"
          - "”Gör bara det du hör.”\n”Svaret blir en ny lapp.”"
        - - "5 · Skriv\nEn enda fråga"
          - "”Skriv det du sa.”\n”Hur gör jag?”"
        - - "6 · Läs upp\nEtt val"
          - "”Vilken lapp lade du åt sidan? Varför?”\n”Vad tar du med dig?”"
    not: "Kortet: Vad går det ut på? Vad behöver jag? Hur gör jag? Hur vet jag att det blev rätt? Från pass 8: Vad gäller om något händer? Svarsraderna: Nu kan jag, Här stannade jag, Nu undrar jag."
  pass:
    rubrik: "Vi kör ett pass: pass 7 i vecka 4"
    textRubrik: "Gruppen · fyra elever i åk 5 börjar ett spel"
    text:
      - "Gruppen öppnar lådan från 4B. Flest stannade vid ”Tejpa fast ringarna på sugröret.” Theo gör det, och ringflygaren vinglar. Gruppen väljer Selmas nya steg: ”Tejpa fast ringarna i var sin ände av sugröret, på samma sida.”"
      - "Läraren läser Grisen, lägger en lapp åt sidan och säger: ”Morfar vet hur en tärning ser ut.” Paren väljer spel, och var och en skriver sin läsare på första lappen."
      - "Hassan säger stegen över pärmen, och Theo gör det han hör. Theo vänder upp sina kort, och Selma säger var han stannade. Hassan säger steget igen: ”Lägg korten i en hög, med baksidan upp.” Det blir en ny lapp."
      - "Läraren läser Selmas första steg över axeln och frågar: ”Hur gör jag?” Amira kör fast och säger: ”Jag tittar på kortet.” Sedan skriver hon."
    forberett:
      rubrik: Det jag förberedde
      text:
        - "Jag skrev tavlans tre rader. Jag hade lådan från 4B, Grisen, blädderblocket med kraven, tre lappar om Grisen, två kortlekar och tärningar. På bordet låg lappar, bladet Planen, kortet, pärmarna och mapparna med läsarens ord från Flygdagen. Jag lyssnade särskilt på Hassan och Amira."
    klarTidigt: "Eleven läser sin början högt för en kamrat som också är klar. Kamraten gör det som står, och eleven skriver in det som fattades."
    schema:
      rubrik: 60 minuter, minut för minut
      rader:
        - tid: Före
          fas: Förberedelse
          vad: "Skriv tavlans tre rader och lägg fram materialet."
        - tid: 0–5
          fas: 1 · Läs som läsaren
          vad: "Öppna lådan. En elev gör steget där flest stannade. Alla skriver ett nytt steg, och ni lägger dem bredvid varandra."
        - tid: 5–15
          fas: 2 · Visa och pröva
          vad: "Läs Grisen, men steg 4 först utan ”När du säger stopp”. Ring in orden för när. Lägg en lapp åt sidan för morfar."
        - tid: "15–27"
          fas: 3 · Tänk och planera
          vad: "Var och en fyller i stapeln Helikoptern och skriver ett nytt mål. Paret väljer spel. Var och en skriver sin läsare, och paret spelar en tur och skriver en lapp per drag."
        - tid: "27–33"
          fas: 4 · Säg
          vad: "Två par ställer upp en pärm. En säger stegen, läsarna ur andra paret gör, och kamraten ser på. Där läsaren stannar säger skribenten steget igen, och det blir en ny lapp. Sedan byter paren."
        - tid: "33–57"
          fas: 5 · Skriv
          vad: "Var och en skriver början. Du läser över axeln och frågar ”Hur gör jag?” Rätta inte nu."
        - tid: 57–60
          fas: 6 · Läs upp
          vad: "Paren säger vad de tar reda på till nästa pass, i stället för ett val."
  mall:
    rubrik: Passen med egna minuter
    underrad: "Pass 4 och pass 6 till 9 följer passet i sex delar"
    block:
      - typ: tabell
        rubrik: Pass 1 till 5
        kolumner:
          - Pass och minuter
          - Det ni gör
        rader:
          - - "PASS 1\n0–⁠20 min"
