  - rubrik: Lapparna
    typ: rutnat
    text: "Av arket gör du lapparna som eleverna planerar med. Skriv ut ett ark till varje par, och klipp längs linjerna, så blir det arton lappar. Ett ark räcker till ett par i ungefär tre pass. Eleverna skriver en sak på varje lapp. På den första skriver de vad läsaren ska kunna efteråt, som ”Lova ska kunna göra en helikopter”, och på var och en av de andra ett steg, med verbet först, som ”Klipp ett snitt”. Senare skriver de också det de svarade läsaren och det som gäller om något händer. Den som skriver på dator fyller i arket i Word innan du skriver ut det. Dina lappar från visningen står i manuset under Visningen, vecka 2."
    kolumner: ["", "", ""]
    rader: 6
    underrad: "Klipp längs linjerna, så blir det arton lappar. Skriv en sak på varje lapp."
    fot: "Skriv på den första lappen vad läsaren ska kunna efteråt. Skriv ett steg på var och en av de andra, med verbet först. Skriv ditt svar till läsaren på en ny lapp."
  - rubrik: Planen
    typ: matta
    text: "Bladet ligger framför paret i delen Tänk och planera, och framför var och en i vecka 5. Skriv ut det på liggande A4. Lapparna klipper du ur arket Lapparna. Den första lappen säger vad läsaren ska kunna efteråt, och paret lägger den överst i den vänstra rutan. Under den lägger paret stegen i den ordning läsaren gör dem, uppifrån och lite omlott. De lappar som paret lägger åt sidan ligger i den högra rutan. I vecka 2 och 4 har paret en plan och var sin läsare. Var och en skriver första bokstaven i sitt namn på lappen med det som den egna läsaren redan vet, och lappen ligger kvar i den vänstra rutan så länge kamratens läsare behöver den."
    kolumner:
      - Det läsaren ska kunna, och stegen i ordning
      - "Åt sidan: det vet läsaren redan"
    fot: "Tänk: vem läser, och vad ska hen kunna efteråt? Planera: ett steg på varje lapp, i den ordning läsaren gör dem. Säg: säg stegen över pärmen. Skriv: skriv det du sa, och svaret på det läsaren frågade."
  - rubrik: Mina texter
    typ: rutnat
    text: "Diagrammet ligger i elevens mapp. Eleven fyller i stapeln nedifrån, med en ruta för var och en av kortets frågor som texten svarar på: när texten säger vad det går ut på, när den säger vad som behövs, när stegen säger hur och var, och när läsaren får veta hur hen ser att det blev rätt. Varje fråga ger högst en ruta, och från pass 8 ger ”Vad gäller om något händer?” en ruta till. Rutan Läsaren kom hela vägen fyller eleven i när en läsare har gjort saken klart utan att fråga. Gränsfallen står under Så räknar ni, i Till läraren: de korta texterna. Stapeln Efter kursen fyller eleven i när gruppen samlas igen."
    kolumner:
      - Första korta
      - Helikoptern
      - Spelet
      - Mitt spel
      - Sista korta
      - Efter kursen
    rader: 6
    underrad: "Namn: ____________________   En stapel för varje text som jag har skrivit. Fyll i nedifrån, en ruta för varje fråga som texten svarar på."
    fot: "Rutorna: vad det går ut på, vad som behövs, hur och var, att det blev rätt, vad som gäller om något händer (från pass 8), och läsaren kom hela vägen."

