# Texttyp: Instruerande text. Den fjärde och sista kursen i serien Texttyper i grupp, efter Texttyp: Argumenterande
# text, Texttyp: Berättande text och Texttyp: Beskrivande text, på Niclas uppdrag 2026-10-08
# (intake/ARBETSORDER-texttyper-2026-10-08.md). Formen är seriens (methods/texttyper-i-grupp/kursstandard.md), och det
# som gäller alla kurser står i methods/texttyper-i-grupp/metod.yaml. Kursens sammanhang är riggens val, efter Niclas
# fyra ben: elevens svårigheter med texttypen, en meningsfull kontext, lärarstöd och sociala aktiviteter mellan
# eleverna. Läsarna gör det som står: elever i en annan klass gör elevernas flygare av papper och spelar deras spel,
# samma läsare hela kursen, och en läsare på skolan spelar parets spel. Säg görs med en pärm emellan, efter Niclas tips om
# strukturen Kommunicera, och två texter prövas genom att någon gör saken efter var och en. Där läsaren stannar skriver
# eleven in det som fattades medan läsaren sitter kvar. Underlaget är seriens register
# (intake/texttyper-i-grupp/REGISTER.md, kategori N) med sökning 16–18, och valen står i analys.md, den andra analysen.
# Alla texter är riggens.
titel: "Texttyp: Instruerande text"
undertitel: "Sex veckors kurs i liten grupp för åk 4–⁠7, där eleverna skriver instruktioner till läsare som gör det som står"
ingress: "En kurs i sex veckor för två till tio elever i åk 4–⁠7 som hoppar över steg när de skriver en instruktion. De lär sig skriva så att läsaren kan göra något själv utan att fråga. Läsarna i en annan klass gör en flygare av papper efter elevernas texter och spelar sedan deras spel. Kursen hör till Texttyper i grupp."
omrade: Skrivning
arskurs:
  - 4-6
  - 7-9
arskursText: åk 4–7
taggar:
  - skrivstrategier
  - textstruktur
  - formativ-bedomning
  - intensivtraning
format:
  - liten grupp
  - par
tid: 60 minuter per pass, två pass i veckan
period: Sex veckor
grupp: Två till tio elever
material:
  - lappar
  - bladet Planen
  - kortet Läsarens frågor
  - en pärm att ställa upp
  - pappersremsor och gem
  - veckans texter

uppdaterad: 2026-10-09
publicerad: 2026-10-09
relaterade: []
utkast: false
serie: texttyper-i-grupp
formaga: 4
tranar: "skriva så att läsaren kan göra något själv, genom att säga vad det går ut på och vad som behövs, ta ett steg i taget och säga hur och var"

inledning:
  - "Texttyp: Instruerande text är en kurs för elever i åk 4–7 som behöver stöd i att skriva. När de skriver en instruktion hoppar de ofta över steg som de själva gör utan att tänka, och stegen säger vad läsaren ska göra men inte hur. När de läser sin text tycker de att den är klar, för de vet ju hur man gör. I kursen lär de sig skriva så att en läsare kan göra något själv utan att fråga. En instruerande text lär läsaren att göra något, och den lyckas när läsaren kommer hela vägen: hen vet vad det går ut på och vad som behövs, gör ett steg i taget, vet hur och var och ser att det blev rätt. Kursen har två slags texter. Det första slaget lär läsaren göra en flygare av papper, och det andra lär läsaren ett spel."
  - "På tavlan står tre rader om läsaren: Vem läser? Vad vill vi? När får vi svar? På bordet ligger lappar, bladet Planen, kortet Läsarens frågor, papper och en pärm som går att ställa upp. Lapparna är små papperslappar, som du klipper ur arket Lapparna. På den första lappen skriver eleverna vad läsaren ska kunna efteråt. Är läsaren Lova i 4B, kan det stå ”Lova ska kunna göra en helikopter”. På var och en av de andra skriver de ett steg, med verbet först: ”Klipp ett snitt”. Vid varje lapp prövar de om läsaren kan göra steget utan att fråga, och svaret tar de ur det de vet om läsaren, som det hen sa på mötet i pass 2. Det läsaren redan vet, som hur man klipper eller hur en tärning ser ut, lägger de i rutan Åt sidan på bladet Planen. Ett steg som läsaren ska göra ligger kvar, också när hen kan det. Minst en lapp hamnar åt sidan, och den som lägger den säger varför. De andra lapparna lägger de på Planen i den ordning läsaren gör stegen."
  - "Eleven lär sig genom att höra dig tänka högt och sedan göra likadant. Du frågar som läsaren, säger dina val högt och lämnar över till eleven. Det eleven ska ta över är att välja för läsarens skull och säga valet högt: ”Halvvägs in måste med. Lova vet inte hur långt snittet ska vara.” Eleven gör varje text med samma fyra steg, Tänk, Planera, Säg och Skriv. Innan eleven planerar, lär hen sig göra saken själv. I Säg ställer två par upp en pärm mellan sig, som en skärm. Skribenten säger stegen över pärmen, och läsaren ur det andra paret gör bara det hen hör. Skribentens kamrat ser på och säger var läsaren stannade. Där säger skribenten steget på ett nytt sätt, och läsaren gör om. Det som fungerade blir en ny lapp. Med pärmen emellan har skribenten bara orden, för hen kan inte peka eller visa hur man gör. Mitt i skrivandet och när texten är klar gör en läsare det som står, ibland du, medan skribenten ser på. Det är så eleven ser var texten tar slut, för det syns inte när man läser sin egen text. Efter texten skriver eleven vad hen tar med sig till nästa text."
  - "Läsarna går i en annan klass, helst en klass ett år yngre där ingen i gruppen går, och eleven har samma läsare hela kursen. Eleven är den som kan något som läsaren inte kan. I pass 2 kommer en läsare till varje elev, viker sitt bästa pappersplan och berättar vilka spel hen kan, så att eleven vet vad läsaren redan kan. Sedan skriver eleven hur man gör en helikopter av papper. Gruppens text i vecka 3 går i en låda till hela läsarnas klass, och klassen gör ringflygare efter den och skickar tillbaka dem i lådan. På Flygdagen i pass 6 gör läsaren helikoptern efter elevens text. Där läsaren stannar skriver eleven in det som fattades, och läsaren gör en ny helikopter. I vecka 4 spelar en vuxen eller en kompis på skolan parets spel efter elevens text. På Spelstunden i pass 12 kommer läsarna tillbaka och spelar elevernas egna spel, och sist går spelen till läsarnas klass i en låda."
  - "De sex veckorna går från att du visar till att eleven skriver själv. I vecka 1 skriver eleven en kort text utan stöd, som ni lägger bredvid en ny i vecka 6. I vecka 2 visar du hur du planerar och skriver en instruktion, och paren gör efter dig. I vecka 3 skriver gruppen en text tillsammans, i vecka 4 planerar paren ett spel, och i vecka 5 planerar och skriver var och en sin egen text. I vecka 6 läser gruppen två uppgifter som liknar provens, så att eleven känner igen när en uppgift ber om en instruktion. I vecka 1, 3 och 4 jämför ni två texter om samma sak, och någon gör saken efter båda texterna. Det som gäller alla kurser i serien står i Texttyper i grupp: vilka eleverna är, hur du tänker högt, vad du gör när en elev fastnar och vad kurserna bygger på."

upplagg:
  rubrik: Så fungerar insatsen
  text: "Två till tio elever har två pass om 60 minuter i veckan under sex veckor. Eleven gör varje text med fyra steg, Tänk, Planera, Säg och Skriv: hen säger vem som läser, skriver det läsaren ska göra på lappar, säger det för en läsare som gör det bakom en pärm och skriver. Du tar bort stödet vecka för vecka: du visar, gruppen skriver tillsammans, paren planerar och var och en skriver sin egen text. Läsarna går i en annan klass och kommer tre gånger, och en läsare på skolan spelar parets spel. De korta texterna i pass 1 och 11, det läsarna gör och det du hör visar om kursen hjälper."

gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Kursen är för elever i åk 4–⁠7 som hoppar över steg när de skriver en instruktion, och som skriver vad läsaren ska göra men inte hur. Eleven behöver kunna ge och ta emot en enkel muntlig instruktion och få ned läsbara meningar för hand, på dator eller genom att diktera. Den som redan skriver vad som behövs och var och hur man gör får inte ut mycket av kursen. Gruppen har två till tio elever. Du sätter ihop paren efter vem som stöttar vem. Med udda antal blir ett av paren tre, och med två elever är du läsare åt dem."

principer:
  rubrik: Tre saker att hålla fast vid
  text: "Nämn läsaren före första ordet, i varje text. Läsaren avgör vad som ska med. Lägg något åt sidan eller lägg till något för läsarens skull, och säg varför, så att valet hörs och syns på papperet. Kör fast högt, och säg vad du gör då. Eleven behöver höra att också du fastnar och hur du tar dig vidare. De tre sakerna ska först höras från dig och sedan från eleven, och det är dem du lyssnar efter."

passrutin:
  text: "Fem av passen, pass 4 och pass 6 till 9, har samma sex delar. I delarna Tänk och planera, Säg och Skriv gör eleverna de fyra stegen. En text tar oftast två pass. Tabellens minuter gäller pass 7, där paren planerar ett spel, säger stegen och börjar skriva. De andra fyra har samma delar med andra minuter, och alla passens minuter står på veckans sida."
  steg:
    - text: "En elev läser dagens mening, och en annan gör det den säger. Alla skriver en bättre mening, och ni lägger dem bredvid varandra."
      fas: Läs som läsaren
    - text: "Du visar det som står på veckans sida. Gruppen säger vad de hörde och prövar samma sak en gång tillsammans."
      fas: Visa och pröva
    - text: "Paret säger vem som läser. Den ena gör saken långsamt, och den andra skriver ett steg på varje lapp. Det läsaren redan vet lägger de åt sidan, men varje steg ligger kvar."
      fas: Tänk och planera
    - text: "Två par sätter sig med en pärm emellan. Skribenten säger stegen, och läsarna i det andra paret gör bara det de hör. Skribentens kamrat ser på."
      fas: Säg
    - text: "Var och en skriver efter planen, på varannan rad. Den som är klar läser texten högt för en kamrat som också är klar, och kamraten gör det som står."
      fas: Skriv
    - text: "Två elever läser ett steg ur sin text och berättar om ett val."
      fas: Läs upp
  kallas: delar
  efterPasset: "Fäst lapparna på bladet Planen, och fyll i fältet Till nästa pass på bladet Det jag hör. Efter pass 1, 4, 8 och 10 svarar du på texterna, och då gör du saken efter varje text, exakt som det står."

tidsschema:
  rubrik: "Ett pass i sex delar"
  text: "Minuterna är hållpunkter: det tar tid att komma i gång, och Skriv är lång för att passet ska ha luft."
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: "Skriv tavlans tre rader och dagens mening. Lägg fram lappar, pennor, Planen, kortet, pärmarna, mapparna och det spelen behöver. Välj två eller tre elever att lyssna särskilt på."
    - tid: 0–5 min
      fas: Läs som läsaren
      vad: "Fråga ”Vad hände? Vad undrar du?” och sedan ”Vilken mening hjälper läsaren mest?”"
    - tid: 5–15 min
      fas: Visa och pröva
      vad: "Skriv på tavlan vad ni övar på, och visa bara det. Fråga ”Vad hörde ni mig säga?” Lägg undan texterna före Skriv."
    - tid: 15–27 min
      fas: Tänk och planera
      vad: "Lyssna först: säger paret vem som läser? Fråga vid varje lapp ”Kan läsaren göra det här utan att fråga dig?” och sist ”Vad gör läsaren först?”"
    - tid: 27–33 min
      fas: Säg
      vad: "Säg till läsaren ”Gör bara det du hör.” Där läsaren stannar första gången, säger skribenten steget med nya ord, och det blir en ny lapp. Sedan byter paren."
    - tid: 33–57 min
      fas: Skriv
      vad: "Säg ”Skriv det du sa.” Läs ett steg över axeln och fråga ”Hur gör jag?” Rätta inte nu. Ge den som inte kommer i gång starthjälp."
    - tid: 57–60 min
      fas: Läs upp
      vad: "Fråga efter ett val: ”Vilken lapp lade du åt sidan? Varför?” När en text är klar skriver eleven vad hen tar med sig."
  efter: "Tavlans tre rader är frågorna om läsaren: Vem läser? Vad vill vi? När får vi svar? Vid den första skriver du vem som läser. Vid den andra skriver du vad läsaren ska kunna efteråt, som också står på den första lappen. Vid den tredje skriver du när läsaren svarar: på Flygdagen, när lådan kommer tillbaka, när läsaren av parets spel har spelat eller på Spelstunden. Dagens mening tar du aldrig ur en elevs egen text, men ur gruppens text går det bra, för den är allas. Säg följer strukturen Kommunicera ur det kooperativa lärandet, som står på sidan Strukturen, vecka 2: Kommunicera. Läsaren har saken bakom pärmen och gör bara det hen hör, som en robot, också när hen kan saken. Säg slutar när läsaren har gjort om det första steget där hen stannade. Resten prövar en läsare som gör efter texten, på Flygdagen, med parets spel och på Spelstunden, och då svarar skribenten bara ”Det står inte”. Är ett ord nytt för läsaren, förklarar skribenten ordet i det steg där det står första gången."

arbetsform:
  rubrik: "Arbetsform: gemensamt, läraren visar, i par, gemensamt igen"
  text: "I delen Säg sätter sig två par ihop, med en pärm emellan. I det ena paret säger en elev stegen och kamraten ser på, och båda i det andra paret är läsare. Sedan byter paren, så att det andra paret säger sina steg. Blir ett par över, är du läsare åt det paret, och åt ett annat par nästa gång. Så blir det i varje pass när gruppen har två, tre, sex, sju eller tio elever. Då skriver du på bladet Det jag hör vad det paret säger. Är en i paret borta, blir kamraten den tredje i ett annat par. I pass 9 har var och en sin egen plan, och då är kamraten läsaren, som aldrig har spelat elevens spel. I ett par med tre elever säger en elev stegen i pass 3 och 7, och de två andra i pass 4 och 8. Paren är desamma hela kursen, och paret får planera på sitt starkaste språk."
  delar:
    - rubrik: 1. Gemensamt
      text: Hela gruppen, med dig vid tavlan
      faser:
        - Läs som läsaren
    - rubrik: 2. Läraren visar
      text: Du tänker högt, och gruppen gör likadant
      faser:
        - Visa och pröva
    - rubrik: 3. I par
      text: "Två och två, och två par ihop med en pärm emellan"
      faser:
        - Tänk och planera
        - Säg
        - Skriv
    - rubrik: 4. Gemensamt igen
      text: Två elever berättar om ett val
      faser:
        - Läs upp

tabeller:
  - rubrik: Läsaren frågar, och eleven svarar
    plats: efter-inledning
    text: "När eleven planerar och säger stegen svarar hen på det en läsare undrar. Frågorna står på kortet Läsarens frågor."
    kolumner:
      - Läsaren frågar
      - Eleven
      - Du säger
    rader:
      - - Vad går det ut på?
        - Säger först vad läsaren ska kunna göra, eller vad spelet går ut på
        - ”Vad har läsaren när hen är klar?”
      - - Vad behöver jag?
        - Säger vad som ska ligga framme innan första steget
        - ”Vad ska ligga framför läsaren innan hen börjar?”
      - - Hur gör jag?
        - "Tar stegen ett i taget, i den ordning läsaren gör dem, och säger hur och var"
        - ”Var ska kanten ligga? När gör läsaren det?”
      - - Hur vet jag att det blev rätt?
        - "Säger hur det ska se ut efter ett svårt steg, eller hur spelet slutar"
        - ”Hur ser läsaren att hen inte har gjort fel?”
    not: "I början av varje text övar ni på att svara på fråga 1 och 2. Ord för var övar ni i pass 6, och ord för när i pass 7. Från pass 8 får läsaren också fråga ”Vad gäller om något händer?”, och eleven säger vad som gäller när något händer, i det steg där läsaren behöver det."
  - rubrik: De sex veckorna
    plats: efter-inledning
    meny: true
    karta: true
    text: "Varje vecka har två pass. Läsarna går i en annan klass och kommer i pass 2, 6 och 12. I vecka 4 spelar en vuxen eller en kompis på skolan parets spel."
    kolumner:
      - Vecka
      - Det som händer
      - Eleven skriver
      - Texten går till
    rader:
      - - "Vecka 1\nLäsaren"
        - "Pass 1: en kort text, två texter om samma hus och Båten.\nPass 2: läsarna kommer, och alla gör helikoptern."
        - En kort text
        - Du
      - - "Vecka 2\nDu visar"
        - "Pass 3: du säger över pärmen hur man viker Pilen, och en elev viker. Paren planerar.\nPass 4: du lägger elevens pappersplan bredvid ditt, och var och en skriver klart."
        - Hur man gör helikoptern
        - Läsaren
      - - "Vecka 3\nGruppens text"
        - "Pass 5: dina två versioner av elevernas början, och gruppen skriver hur man gör ringflygaren.\nPass 6: ord för var, och Flygdagen."
        - "En fortsättning på gruppens text, och mer i sin egen"
        - "Läsarnas klass, och läsaren på Flygdagen"
      - - "Vecka 4\nParens text"
        - "Pass 7: Grisen, och paren planerar ett spel.\nPass 8: det som gäller om något händer."
        - En instruktion till ett spel
        - En vuxen eller kompis på skolan
      - - "Vecka 5\nEgen text"
        - "Pass 9: dina två versioner, och eleven planerar sitt spel.\nPass 10: en kamrat gör de första stegen efter texten, och eleven skriver klart."
        - En egen instruktion
        - Läsarna
      - - "Vecka 6\nSvaren"
        - "Pass 11: en ny kort text, och två uppgifter som liknar provens.\nPass 12: Spelstunden."
        - "En kort text, och mer i sin egen"
        - "Du, och läsarna"
    not: "Du frågar läsarnas lärare före pass 2, helst en vecka före kursen (se Var hittar du texterna och läsarna?). Kan klassen inte komma i pass 2, träffar eleven sin läsare på en rast före pass 3, med bladet Läsaren. Hur du tar bort stödet står i Texttyper i grupp."
  - rubrik: Det du ser, och det du gör
    plats: efter-fastnar
    text: "Här står det som brukar hända i just den här kursen. Stödtrappan för när en elev fastnar, och det du gör och undviker som lärare, står i Texttyper i grupp. Där står också det du gör under Skriv, i tabellerna Skrivstödet och Eleven som har svårt att få ned texten."
    kolumner:
      - Det du ser
      - Det du gör
    rader:
      - - Eleven hoppar över steg som hen gör utan att tänka
        - "Säg ”Gör det en gång till, långsamt, och säg vad du gör.” Gör eleven något som inte står på någon lapp, skriver hen en ny lapp."
      - - "Steget säger vad men inte hur: ”Vik ned hörnen.”"
        - "Fråga som läsaren: ”Vilka hörn? Var ska kanten ligga?” Peka på kortet Ord för var och när."
      - - En lapp rymmer flera saker att göra
        - "Fråga ”Vad gör läsaren först i det här steget?” Eleven skriver två lappar i stället för en. Gör läsaren samma sak två gånger, som att vika ned båda hörnen, får det stå på en lapp."
      - - Texten börjar med första steget
        - "Fråga ”Vad går det ut på? Vad ska ligga framme innan läsaren börjar?”"
      - - Regeln kommer efter steget där den behövs
        - "Fråga ”När behöver läsaren veta det?” Eleven flyttar lappen dit."
      - - "Läsaren vet inte vad ett ord i steget betyder, som foten eller turen"
        - "Be skribenten förklara ordet i det steg där det står första gången: ”Vik upp foten, den nedre änden.”"
      - - "Steget säger ”så här” eller ”där”"
        - "Fråga ”Vad menar du med så här, och var är där? Läsaren ser dig inte.”"
      - - Eleven skriver varför spelet är roligt
        - "Låt en mening om varför spelet är roligt stå i början, där texten säger vad det går ut på. Den meningen räknas inte i stapeln."
      - - Eleven kan inte saken själv
        - "Hen gör den med kamraten eller dig tills det går utan att titta, innan hen planerar."
      - - Skribenten pekar, visar eller säger mer än det som står
        - "Säg ”Läsaren gör bara det som står.” Det skribenten ville säga skriver hen på en lapp."
      - - Eleven har svårt att vika
        - "Eleven viker tillsammans med kamraten, på tjockare papper, och säger stegen medan kamraten viker."
      - - Eleven är klar före de andra
        - "Hen skriver hur och var vid ett steg till, och från pass 8 en mening som börjar med Om. Sedan läser hen texten högt för en kamrat som också är klar, och kamraten gör det som står."
      - - Eleven har varit borta
        - "Kamraten visar planen och säger vad de valde och varför. Missade eleven pass 1, skriver hen den korta texten i tio minuter när hen kommer. Missade hen pass 2, frågar hen sin läsare på en rast, med bladet Läsaren."
  - rubrik: Åk 4–5 och åk 6–7
