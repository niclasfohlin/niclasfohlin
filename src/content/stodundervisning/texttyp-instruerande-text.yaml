  material:
    rubrik: Vad du behöver för kursen
    kravEtikett: "Krav på spelet"
    var:
      rubrik: Var materialet finns
      punkter:
        - fet: Veckans sida.
          text: "Dagens mening, det du visar och det du ska lägga märke till står i metoden, under Till läraren: veckorna, och greppen under Till läraren: återkopplingen. Veckans texter står direkt efter veckans sida."
        - fet: Kortet och bladen.
          text: "Kortet, bladet Läsaren, inbjudan och de andra bladen står under Kursens material. Arket Lapparna, bladet Planen och diagrammet står i planeringsmallarna."
        - fet: Det som gäller alla kurser.
          text: "Hur du tänker högt, vad du gör när en elev fastnar och hur du hjälper den som har svårt att få ned texten står i Texttyper i grupp."
    bordet:
      - "Lappar, pennor, papper och saxar"
      - "Bladet Planen och kortet Läsarens frågor"
      - "En pärm att ställa upp, och saken eller spelet"
      - Mapparna med Mina texter och Mitt mål
      - Veckans text, som du lägger undan före Skriv
      - "På tavlan: Vem läser? Vad vill vi? När får vi svar?"
film:
  sekunder: 28.91
  beskrivning: "Tänk: vem läser, och vad ska hen kunna? Eleven säger: ”Lova ska kunna göra en helikopter.” Lova tänker: ”Hur gör man en?” Planera: ett steg på varje lapp. Läraren frågar: ”Kan Lova göra det utan att fråga?” Eleven säger: ”Åt sidan. Lova klipper varje dag.” Säg: säg stegen över pärmen. Eleven säger: ”Klipp ett snitt.” Läsaren frågar: ”Hur långt?” Svaret blir en ny lapp. Eleven säger: ”Klipp ett snitt mitt på kortsidan, halvvägs in.” Skriv: skriv det du sa. Eleven skriver: ”Klipp ett snitt mitt på kortsidan, halvvägs in.”"
  rubrik: "Så gör eleven: Tänk, Planera, Säg, Skriv"
  ingress: "Här är fyra bilder ur filmen om de fyra stegen, så som paren gör dem i vecka 2. En elev planerar en instruktion till Lova i 4B, som aldrig har gjort en helikopter. Lova är inte i rummet: hon syns i bilden eftersom paret tänker på henne. Läraren frågar vid lapparna. I Säg kommer läsaren ur ett annat par och sitter bakom pärmen, och hen gör bara det hen hör. Kamraten i paret ser på och är inte med i bilden. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Tänk: Lova läser. Hon har aldrig gjort en helikopter."
    - text: "Planera: Läraren frågar, och saxlappen går åt sidan."
    - text: "Säg: eleven säger steget, och läsaren frågar hur långt."
    - text: "Skriv: eleven skriver det hen sa till läsaren."
