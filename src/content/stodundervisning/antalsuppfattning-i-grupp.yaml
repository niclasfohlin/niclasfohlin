  pass:
    rubrik: "Vi kör ett pass: lägga till och växla upp"
    textRubrik: Gruppen · fyra elever, åk 2, vecka 3, pass 1
    utskrift: Skriv ut passexemplet
    text:
      - "Läraren bygger 38 och berättar vad hen gör: ”Tre tiostavar på tiotalens plats, åtta ental här.” Läraren lyfter en stav: ”Tio ental som sitter ihop.” Sedan fem ental, ett i taget: ”Nio, tio. Tio ental bredvid en tiostav. Lika långa. Jag byter. Fyra tiotal och tre ental. 43.”"
      - "Alla bygger 38 + 5 tillsammans, ett handgrepp i taget: ”Lyft en tiostav med mig. Hur många ental är den?”"
      - "Läraren läser kortet ”Bygg 47. Lägg till 6.” Ibrahim och Oskar skriver 413. ”Får det ligga tretton ental på en plats?” frågar läraren. Ibrahim byter och säger: ”Fem tiotal och tre ental. 53.”"
      - "Ibrahim bygger 68 + 14 själv och säger: ”Jag bytte tio ental mot en tiostav. 82.” Till sist bygger alla 56 + 7: ”Vad hände när entalen blev tio?” Läraren noterar att Ibrahim och Oskar växlade efter frågan."
    forberett:
      rubrik: Det jag förberedde
      text:
        - Byggt 38 + 5 och 56 + 7 och sagt orden högt. Tiobas och en talsortsmatta per elev. Veckans kort för åk 2, klippta.
    klarTidigt: "Spela Närmast målet. Varje slag räknas som tiotal eller ental, och i åk 2 gäller det att komma närmast 100 på sju slag utan att gå över. Målet för andra årskurser står i paketet."
    schema:
      rubrik: 30 minuter, steg för steg
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Ta fram dagens material, en matta per elev och en till dig, och veckans kort. Välj två tal ur korten, det första talet som du visar och det andra talet som hela gruppen bygger sist. Bygg båda och säg orden högt.
        - tid: 0–6
          fas: 1 · Första talet
          vad: Bygg det första talet framför eleverna och säg vad du tar, lyfter och pekar på.
        - tid: 6–12
          fas: 2 · Samma tal
          vad: Alla bygger talet en gång till, ett handgrepp i taget, och säger vad de gör.
        - tid: 12–21
          fas: 3 · Korten
          vad: Läs ett kort. Paren bygger och avgör, sedan läser de för varandra.
        - tid: 21–26
          fas: 4 · Två kort
          vad: Var och en bygger talet på sitt kort och säger vad hen gör.
        - tid: 26–30
          fas: 5 · Andra talet
          vad: Bygg det andra talet tillsammans. Vad hände, och varför?
