              text: Läs ett kort högt. Barnet bygger med tiobaspaketet på mattan och berättar vad det gör. Har kortet två tal bygger barnet det andra ovanför mattan. När kortet säger ”Ta bort” bygger barnet bara det första talet. Tio minuter några gånger i veckan räcker.
