              text: "Tiobas med hundraplattor och en tusenkub, talbrickor med 1, 10, 100 och 1000, och pengar upp till en tusenlapp. En halv sats per elev räcker till fem hundraplattor och 15 tiostavar. Kräver ett kort fler bygger eleven med talbrickor. Klar tidigt: Närmast målet 1 000 på sju slag, där varje slag räknas som hundratal, tiotal eller ental. Per elev: 20 brickor och 20 mynt eller sedlar av varje talsort."
            - rubrik: Vecka 1 · Bygga och säga tal
              text: "Visa först och säg: ”Jag bygger 236. Jag lägger två hundraplattor på hundratalens plats och lyfter dem: två hundratal. Jag lägger tre tiostavar på tiotalens plats och sex ental på entalens. Jag pekar: två hundratal, tre tiotal, sex ental. 236.” Lägg tio tiostavar på en hundraplatta: ”Lika stora. Tio tiotal är ett hundratal.”\nLyssna efter eleven som räknar plattor och stavar som ental, så att 236 blir elva."
            - rubrik: Vecka 2 · Siffrans plats och nollan
              text: "Visa först och säg: ”Jag bygger 247 på mattan och 274 ovanför, och skriver talen. Jag pekar på sjuan i 247 och på de sju entalen: sju ental. Jag pekar på sjuan i 274 och på de sju tiotalen: sju tiotal. Samma hundratal, och sju tiotal är mer än fyra. 274 är störst.” Bygg 306 och peka på tiotalens plats: ”Tom. Nollan håller platsen.”\nLyssna efter eleven som skriver tvåhundrafyra som 2004, eller läser 306 som trettiosex."
            - rubrik: Vecka 3 · Lägga till och växla upp
              text: "Visa först och säg: ”Jag bygger 199 och lägger till 1. Tio ental. Jag byter dem mot en tiostav. Nu har jag tio tiotal. Jag lägger dem på en hundraplatta och byter igen.” Peka: ”Två hundratal. 200.”\nLyssna efter eleven som bara gör den första växlingen och läser ett hundratal och tio tiotal som 1 100."
            - rubrik: Vecka 4 · Ta bort och växla ned
              text: "Visa först och säg: ”Jag bygger 400 och ska ta bort 1. Entalen är tomma, och tiotalen också. Jag byter en hundraplatta mot tio tiostavar och en tiostav mot tio ental. Jag tar bort ett ental.” Peka: ”Tre hundratal, nio tiotal och nio ental. 399.”\nLyssna efter eleven som glömmer det som växlats, så att 500 − 78 blir 432."
        - rubrik: "Till läraren: vecka 5 och kartläggningen"
          falt:
            - rubrik: Vecka 5 · Från material till skrift
              text: "Visa först och säg, och skriv samtidigt.\nPass 1: ”Jag bygger 247 och 168. Hundratalen: tre. Tiotalen: tio, och dem växlar jag mot ett hundratal: fyra hundratal. Entalen: femton, och tio av dem växlar jag mot ett tiotal. Fyra hundratal, ett tiotal och fem ental. 415.” Skriv (200 + 40 + 7) + (100 + 60 + 8) = 300 + 100 + 15 = 400 + 15 = 415.\nPass 2: ”Jag bygger 398 och lägger till 27. Två ental gör 398 till 400, med två växlingar i rad. Kvar av 27 är 25. Fyra hundratal, två tiotal och fem ental. 425.” Skriv 398 + 2 + 25 = 425.\nPass 3: ”Jag bygger 503 och ska ta bort 78. Tre ental räcker inte, och tiotalen är tomma. Jag växlar ett hundratal mot tio tiotal och ett tiotal mot tio ental: fyra hundratal, nio tiotal och tretton ental. Jag tar bort åtta ental och sju tiotal. 425.” Skriv 503 = 400 + 90 + 13, 13 − 8 = 5, 90 − 70 = 20 och 400 + 20 + 5 = 425.\nPeka på varje steg i materialet.\nLyssna efter eleven som skriver ett svar som inte syns i materialet."
            - rubrik: Kartläggning
              text: Före första passet och efter sista, en elev i taget, med uppgifterna i listan Kartläggning. Uppgift 1–5 följer veckorna.
