              text: "Visa först och säg, och skriv samtidigt.\nPass 1: ”Jag bygger 12 och 13. Tiotalen: två. Entalen: fem. 25.” Skriv 10 + 10 = 20, 2 + 3 = 5 och 20 + 5 = 25.\nPass 2: ”Jag bygger 18 och lägger till 7. Åtta ental och två till blir tio, och dem växlar jag mot ett tiotal. Fem är kvar. 25.” Skriv 18 + 2 + 5 = 25.\nPass 3: ”Jag bygger 22 och ska ta bort 8. Två ental räcker inte. Jag växlar ett tiotal mot tio ental och tar bort åtta. Ett tiotal och fyra ental. 14.” Skriv 22 = 10 + 12, 12 − 8 = 4 och 10 + 4 = 14.\nPeka på varje steg i materialet.\nLyssna efter eleven som skriver 18 + 7 = 115."
            - rubrik: Kartläggning
              text: Före första passet och efter sista, en elev i taget, med uppgifterna i listan Kartläggning. Uppgift 1–5 följer veckorna.
