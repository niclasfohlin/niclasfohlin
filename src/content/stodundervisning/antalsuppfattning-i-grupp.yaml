lathund:
  innehall: Ett fokus i veckan
  metoden:
    text:
      - "Intensivt stöd i fem veckor för en liten grupp i åk 1–5. Läraren gör först och sätter ord på varje handgrepp: bygger, lyfter och pekar. Sedan gör gruppen samma sak tillsammans, i par, var för sig och till sist gemensamt igen."
      - "Veckorna: bygga och säga tal, siffrans plats och nollan, lägga till och växla upp, ta bort och växla ned, från material till skrift. Pass 1 tiobas, pass 2 talbrickor, pass 3 pengar och skrift. Talområdet följer årskursen: 0–30 i åk 1, 0–100 i åk 2, 0–1 000 i åk 3 och upp till 10 000 i åk 4–5. Före första passet gör du kartläggningen i gruppens paket."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Gör först och sätt ord på det.
          text: Bygg, visa, lyft och peka framför eleverna, och säg vad du gör.
        - fet: Växla i materialet och säg det.
          text: Tio ental blir ett tiotal, varje gång.
        - fet: Ett fokus i veckan.
          text: Samma fokus i tre material, så att eleverna ser det som är gemensamt.
    tabell:
      rubrik: Passets fem faser · tider och fraser
      kolumner:
        - Steg
        - Exempelfraser
      rader:
        - - "1 · Första talet\n0–6 min"
          - "”Jag lägger tre tiostavar på tiotalens plats och sex ental på entalens.”\n”Jag lyfter en tiostav. Den är tio ental som sitter ihop.”"
        - - "2 · Samma tal\n6–12 min"
          - "”Lyft tiostavarna med mig. Hur många tiotal?”\n”Peka på entalen med mig. Hur många är de?”"
        - - "3 · Korten\n12–21 min"
          - "”Bygg 36. Ta bort 12. Vad har ni kvar?”\n”Säg vad du gör medan du gör det.”"
        - - "4 · Två kort\n21–26 min"
          - "”Bygg ditt kort och berätta vad du gör.”\n”Varför fick du växla?”"
