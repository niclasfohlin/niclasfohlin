# Metod i stödundervisning. Modellen står i src/content.config.ts och mallen i _mall.yaml.
# Skriven 2026-09-25 ur kompendiet Särskilt stöd, Norrtälje (Matematik 1 med Mall 1 och 2), intaget och
# sökningar online. Omskriven samma dag efter författarens återkoppling: passets fem faser (gör först, gör
# tillsammans, i par, själv, gemensamt igen) och ett paket per årskurs. Besluten står i analys.md.
titel: "Antalsuppfattning i grupp: bygga tal"
undertitel: Fem veckors intensivt stöd i liten grupp, där eleverna bygger tal med tiobas, talbrickor och pengar, för åk 1–5
ingress: Ett körschema för fem veckors intensivt stöd i antalsuppfattning för en liten grupp i åk 1–5. Läraren bygger talet först och säger vad hen gör. Sedan bygger eleverna tillsammans med läraren, i par och var för sig, och gör växlingarna själva. Varje vecka har ett fokus, och talen och korten följer gruppens årskurs.
omrade: Matematik
arskurs:
  - F-3
  - 4-6
arskursText: åk 1–5
taggar:
  - taluppfattning
  - positionssystemet
  - intensivtraning
format:
  - liten grupp
  - par
tid: 30 minuter per pass, tre pass i veckan
period: Fem veckor
grupp: Två till sex elever
material:
  - "Tiobas: centikuber, tiostavar och hundraplattor, en sats per par och en för läraren"
  - Talbrickor med gruppens talsorter
  - Lekpengar i enkronor, tiokronor, hundralappar och tusenlappar
  - En talsortsmatta per elev och veckans kort ur gruppens paket
  - Papper, penna och sifferkort 0–9 per par
  - En tärning per par till Klar tidigt
  - Ett tiobaspaket per elev att ta hem
uppdaterad: 2026-09-25
relaterade:
  - problemlosning-i-grupp
utkast: false
inledning:
  - "Metoden är för elever i åk 1–5 som behöver stöd i antalsuppfattning. Eleverna bygger talen framför sig med tiobas, talbrickor och pengar. Talbrickor är runda brickor med ett talvärde. Eleverna lägger till och tar bort, och när en talsort blir full eller inte räcker växlar de själva med materialet. Metoden handlar om att se tal och bygga tal, inte bara räkna dem. Det viktigaste händer vid bordet. Läraren gör först: bygger, lyfter, pekar och säger vad hen gör. Sedan gör gruppen samma sak tillsammans, sedan i par och sist var och en för sig, och passet slutar med att alla gör det gemensamt igen. Efter fem veckor ska eleven kunna bygga tal på egen hand och förstå hur växlingen går till i skriftlig huvudräkning."
  - "Två ord är centrala i metoden: talsort och växla. Talsorterna är ental, tiotal, hundratal och tusental, och i decimaltal även tiondelar och hundradelar. Att växla är att byta tio av en talsort mot en av nästa större, eller en mot tio av nästa mindre. Tio ental blir ett tiotal, och ett tiotal blir tio ental. Värdet är detsamma, det är bara talsorten som byts. Talsortsmattan har en ruta för varje talsort, och allt eleverna bygger ligger på den."
  - Exemplen i beskrivningen av passet kommer från en grupp i åk 2. Materialet för varje årskurs finns under Material per årskurs, efter Kort om grunden.
upplagg:
  rubrik: Så fungerar insatsen
  text: "Insatsen pågår i fem veckor med tre pass i veckan. Varje pass är 30 minuter, och gruppen har två till sex elever i samma eller närliggande årskurs. Varje vecka har ett fokus som eleverna möter i tre material, ett per pass: tiobas, talbrickor och pengar med skrift. Talområdet och korten följer årskursen, och det finns ett paket för varje årskurs. Eleven får ett tiobaspaket att ha hemma och en läxa i veckan. Före och efter perioden gör du samma kartläggning."
principer:
  rubrik: Tre saker att hålla fast vid
  text: "Gör först och sätt ord på det: läraren bygger framför eleverna, visar vad de ska titta på, lyfter och pekar och säger vad hen gör, innan eleverna gör något själva. Bygg, peka och växla i materialet: talet ligger framför eleven innan någon räknar, och eleven gör växlingen själv och säger vad som händer, till exempel att tio ental blir ett tiotal. Och ett fokus i veckan: när samma fokus kommer tillbaka i tre pass och tre material ser eleverna det som är gemensamt."
tabeller:
  - rubrik: Talområde och talsorter per årskurs
    plats: efter-inledning
    kolumner:
      - Årskurs
      - Talområde
      - Talsorter på mattan
      - Växlingen som ska synas
    rader:
      - - Åk 1
        - 0–30
        - Tiotal och ental
        - Tio ental blir ett tiotal, och tvärtom.
      - - Åk 2
        - 0–100
        - Hundratal, tiotal och ental
        - Tio ental blir ett tiotal, och tio tiotal ett hundratal.
      - - Åk 3
        - 0–1 000
        - Tusental, hundratal, tiotal och ental
        - Växling i två led, som 199 + 1 och 400 − 1.
      - - Åk 4–5
        - Upp till 10 000, decimaltal och negativa tal
        - Tusental till hundradelar
        - Tio hundratal blir ett tusental, och tio tiondelar ett ental.
    not: "Hela gruppen arbetar med samma paket. Har gruppen elever från två årskurser gör du kartläggningen för den lägre årskursen. Klarar eleverna kartläggningens uppgift 1–4 säkert redan före perioden tar ni paketet för nästa årskurs. Innehållet följer det centrala innehållet i Lgr22: naturliga tal och positionssystemet i åk 1–3, och i åk 4–6 också tal i decimalform och negativa tal."
  - rubrik: "Veckan: ett fokus i tre material"
    plats: efter-tidsschema
    text: "Veckans fokus är detsamma i alla tre passen, och ni använder samma kort. Det som byts är materialet. I tiobasen syns tio: tio kuber är lika långa som en tiostav. På talbrickor och pengar syns det inte, där är tio något vi har kommit överens om. Lägg därför tiobasen bredvid när ni börjar med talbrickor och pengar."
    kolumner:
      - Vecka och fokus
      - "Pass 1: tiobas"
      - "Pass 2: talbrickor"
      - "Pass 3: pengar och skrift"
    rader:
      - - 1 · Bygga och säga tal
        - Bygg, lyft och peka på varje talsort.
        - Samma tal med brickor, och tiobasen bredvid.
        - Bygg talet i kronor och skriv det i talsorter.
      - - 2 · Siffrans plats och nollan
        - Samma siffror på olika platser, och en tom plats.
        - Bygg med brickor och lägg talet med sifferkort. En plats utan bricka får en nolla.
        - Bygg med så få sedlar och mynt som möjligt och skriv talet i talsorter.
      - - 3 · Lägga till och växla upp
        - Lägg till och byt tio mot en av nästa större talsort.
        - Byt tio brickor mot en bricka av nästa större talsort.
        - Lägg till kronor, byt tio mynt eller sedlar mot nästa valör och skriv talet.
      - - 4 · Ta bort och växla ned
        - Ta bort och byt en mot tio när det inte räcker.
        - Byt en bricka mot tio brickor av nästa mindre talsort.
        - "Handla: betala, växla när det inte räcker och skriv det som är kvar."
      - - 5 · Från material till skrift
        - Dela upp i talsorter och skriv varje steg.
        - Räkna stegvis via närmaste jämna tiotal eller hundratal och skriv.
        - Ta bort med växling och skriv bredvid.
    not: Använd bara enkronor, tiokronor, hundralappar och tusenlappar. Femkronan är större än tiokronan och säger inget om talsorterna. I åk 4–5 handlar pass 3 i vecka 5 om negativa tal, på tallinjen och som skuld. Det står i paketet för åk 4–5.
passrutin:
  text: "Varje pass följer samma rutin i fem steg, oavsett material: läraren gör först, sedan gör ni det tillsammans, sedan i par, sedan var och en för sig och till sist alla gemensamt igen. Det gör passen lätta att leda och trygga för eleverna."
  steg:
    - text: Läraren bygger ett tal som visar veckans fokus och säger allt hen gör. Eleverna tittar.
      fas: Första talet
    - text: Läraren och eleverna bygger samma tal tillsammans, ett handgrepp i taget, och säger vad de gör.
      fas: Samma tal
    - text: Läraren läser ett kort och paren avgör vad som hände. Sedan läser paren korten för varandra, och läraren går runt.
      fas: Korten
    - text: Varje elev bygger talet på sitt eget kort och säger vad hen gör.
      fas: Två kort
    - text: Alla bygger det andra talet tillsammans och säger vad som hände och varför.
      fas: Andra talet
  efterPasset: Läraren antecknar kort vem som växlade själv och kunde säga vad som hände, och vad läraren behöver visa igen nästa pass.
tidsschema:
  rubrik: Ett pass på 30 minuter
  text: Förbered dig genom att bygga veckans tal med dagens material och säga orden högt. Remsan visar hur de 30 minuterna fördelas och när läraren visar, när alla arbetar gemensamt och när eleverna arbetar i par och enskilt. Paren får längst tid.
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: Ta fram dagens material, en matta per elev och en till dig, och veckans kort ur gruppens paket. Välj två tal som kräver veckans fokus. Det första talet visar du och bygger sedan tillsammans med eleverna, och det andra talet bygger hela gruppen sist. Bygg båda och säg orden högt för dig själv.
    - tid: 0–6 min
      fas: Första talet
      vad: Bygg det första talet långsamt framför eleverna och tänk högt. Säg vad du tar, var du lägger det, vad du lyfter och vad du pekar på. Eleverna tittar.
    - tid: 6–12 min
      fas: Samma tal
      vad: "Alla bygger talet du just visade, ett handgrepp i taget. Säg varje handgrepp, och eleverna gör och säger likadant. Fråga: ”Hur vet du att det är 36 och inte 63?” Gör sedan en kedja med sex till tio korta ändringar på samma tal. Efter varje ändring säger alla vilket tal det blev."
    - tid: 12–21 min
      fas: Korten
      vad: Läs ett kort, till exempel ”Bygg 36. Ta bort 12.” I paret bygger den ena och berättar vad hen gör, och den andra kontrollerar. De kommer överens om vad som blev kvar och byter roller efter varje kort. Sedan läser paren korten för varandra. Gå runt och lyssna efter veckans vanliga fel, som står under Lyssna efter i rutan Till läraren.
    - tid: 21–26 min
      fas: Två kort
      vad: Varje elev får två kort. Eleverna bygger det första medan du går runt. När de bygger det andra lyssnar du på en elev i taget. Saknar någon orden gör ni handgreppet tillsammans igen.
    - tid: 26–30 min
      fas: Andra talet
      vad: "Bygg det andra talet med hela gruppen. Eleverna visar och säger vad som hände: ”Jag hade tretton ental. Jag bytte tio ental mot ett tiotal.”"
  efter: "Blir ett par klart tidigt kan de spela Närmast målet. De slår en tärning och bestämmer varje gång vilken talsort slaget ska räknas som. De bygger summan efter varje slag, och alla slag ska användas. Den som kommer närmast målet utan att gå över vinner. Målet och antalet slag står i gruppens paket, i åk 2 till exempel 100 på sju slag."
steg:
  rubrik: Vad du gör och säger i varje fas
  rader:
    - namn: Första talet
      fraga: Vad gör jag, och vad ser ni?
      gor: "Bygg framför eleverna och tänk högt. Sätt ord på varje handgrepp: vad du tar, var du lägger det, vad eleverna ska se, vad du lyfter och vad du pekar på. Eleverna tittar. Sitt på samma sida som eleverna, så att din matta ligger som deras."
      fraser:
        - Jag bygger 36. Jag lägger tre tiostavar på tiotalens plats och sex ental på entalens.
        - Jag lyfter en tiostav. Den är tio ental som sitter ihop.
        - "Jag pekar på entalen och räknar: ett, två, tre, fyra, fem, sex."
        - Jag tar bort 12, en tiostav och två ental. Kvar är två tiotal och fyra ental, 24.
    - namn: Samma tal
      fraga: Kan vi göra det tillsammans?
      gor: Bygg talet du just visade en gång till, nu samtidigt som eleverna och ett handgrepp i taget. Säg vad ni gör, och vänta tills alla är klara innan nästa handgrepp.
      fraser:
        - Lyft tiostavarna med mig. Hur många tiotal?
        - Peka på entalen med mig. Hur många är de?
        - Vad blir det om vi tar bort 12?
    - namn: Korten
      fraga: Vad hände med talet?
      gor: Läs ett kort i taget. Paren bygger, ändrar och kommer överens om vad som blev kvar. Sedan läser paren korten för varandra, och den som bygger säger vad hen gör. Vid subtraktion byggs bara det första talet.
      fraser:
        - Bygg 36. Ta bort 12. Vad har ni kvar?
        - Räcker entalen? Vad gör ni då?
        - Säg vad du gör medan du gör det.
    - namn: Två kort
      fraga: Kan du göra det själv?
      gor: Ge varje elev ett eget kort. Eleven bygger och säger vad hen gör, och vecka 5 skriver eleven samtidigt. Saknar eleven orden gör ni handgreppet tillsammans igen.
      fraser:
        - Bygg ditt kort och berätta vad du gör.
        - Varför fick du växla?
        - Hur skriver du det du gjorde?
    - namn: Andra talet
      fraga: Vad såg vi i dag?
      gor: Bygg det andra talet med hela gruppen. Låt eleverna visa och säga vad som hände, och sätt ord på veckans fokus i en mening.
      fraser:
        - Vad hände när entalen blev tio?
        - Visa oss och säg det.
        - I dag såg vi att tio ental blir ett tiotal.
arbetsform:
  rubrik: "Arbetsform: läraren visar, gemensamt, i par, enskilt, gemensamt igen"
  text: "Passet går från läraren till eleven och tillbaka. Först visar läraren och eleverna tittar. Sedan gör alla likadant tillsammans, sedan arbetar eleverna i par och sedan var för sig. Sist arbetar alla gemensamt igen, när gruppen sätter ord på det den har sett. Med tre eller fem elever blir det en trio, där en läser och två bygger. Med två elever är hela gruppen ett par. Med två till sex elever hinner du höra varje elev beskriva en växling i varje pass."
  delar:
    - rubrik: 1. Läraren visar
      text: eleverna tittar
      faser:
        - Första talet
    - rubrik: 2. Gemensamt
      text: alla gör likadant, ett handgrepp i taget
      faser:
        - Samma tal
    - rubrik: 3. I par
      text: den ena bygger, den andra kontrollerar
      faser:
        - Korten
    - rubrik: 4. Enskilt
      text: var och en bygger och säger
      faser:
        - Två kort
    - rubrik: 5. Gemensamt igen
      text: alla visar och berättar
      faser:
        - Andra talet
exempel:
  valt:
    rubrik: Gruppen
    text: "fyra elever i åk 2, vecka 3, pass 1: lägga till och växla upp, med tiobas."
  text:
    - "Läraren bygger 38 framför gruppen och berättar vad hen gör: ”Jag lägger tre tiostavar på tiotalens plats och åtta ental här.” Läraren lyfter en tiostav: ”Den här är tio ental som sitter ihop.” Sedan lägger läraren till fem ental, ett i taget: ”Nio, tio. Jag lägger de tio entalen bredvid en tiostav. Lika långa. Jag byter och lägger tiostaven på tiotalens plats.” Läraren lägger de tre sista entalen och pekar: ”Fyra tiotal och tre ental. 43.” Eleverna tittar."
    - "”Nu gör vi det tillsammans.” Alla bygger 38 och lyfter en tiostav: ”Tio ental”, säger Wilma. Gruppen lägger till fem ental, ett i taget, räknar högt och byter. ”Fyra tiotal och tre ental. 43.” Sedan gör läraren en kedja av ändringar på samma tal: ”Lägg till åtta ental. Ta bort tre ental. Lägg till ett tiotal.” Efter varje ändring säger alla talet: 51, 48, 58."
    - "Läraren läser ett kort: ”Bygg 47. Lägg till 6.” Ibrahim och Oskar lägger till sex ental och skriver 413. ”Får det ligga tretton ental på entalens plats?” frågar läraren. Ibrahim byter tio ental mot en tiostav: ”Fem tiotal och tre ental. 53.” Sedan läser Alva ”Bygg 29. Lägg till 1.” för Wilma, som byter och säger: ”Tre tiotal. Nollan visar att entalen är tomma.”"
    - "Var och en får två kort. Alla bygger sitt första kort medan läraren går runt, och sedan lyssnar läraren på en i taget. Ibrahim bygger 68, lägger till 14 och säger samtidigt: ”Jag hade tolv ental. Jag bytte tio mot en tiostav. Åtta tiotal och två ental. 82.”"
    - "Till sist bygger alla 56 + 7. ”Vad hände när entalen blev tio?” ”Vi bytte dem mot en tiostav”, säger Alva. Läraren säger: ”I dag såg vi att tio ental blir ett tiotal.” Efteråt noterar läraren att Ibrahim och Oskar skrev fyra tiotal och tretton ental som 413 men växlade efter frågan. Nästa pass börjar läraren med att själv visa 47 + 6."
fastnar:
  rubrik: När eleven fastnar
  text: "Den som brukar fastna gör det oftast vid växlingen. Eleven flyttar stavar utan att säga vad som händer, eller bygger på fel plats. Visa då igen: gör växlingen långsamt, säg vad du gör och låt eleven göra likadant."
  fragaForst:
    - Vad har du byggt? Säg talet.
    - Hur många ental har du nu?
    - Räcker entalen?
  trappa:
    - "Be eleven peka på varje talsort och säga hur många det är: tre tiotal, sex ental."
    - Be eleven lägga varje sak på sin plats på mattan. Allt har en plats.
    - "Räkna entalen högt tillsammans och stanna vid tio. Lägg dem bredvid en tiostav: de är lika långa, så ni kan byta."
    - "Räcker det inte: lyft ett tiotal, byt det mot tio ental och säg: ett tiotal blir tio ental."
    - Gör växlingen själv först och säg vad du gör. Gör den sedan tillsammans med eleven, och låt eleven säga det.
  motto: Bygg, visa, lyft, peka och sätt ord på det du gör.
roll:
  rubrik: "Lärarens roll: göra först och sätta ord på allt"
  text: "Du gör först, framför eleverna, och tänker högt: vad du tar, var du lägger det, vad du lyfter och vad du pekar på. Sedan gör ni det tillsammans, och sedan lämnar du över, först till paren och sist till varje elev. Det är eleven som byter tio ental mot en tiostav och säger vad som händer. Växlar du åt eleven blir mattan rätt, men eleven har inte gjort växlingen."
  gor:
    - "Bygg långsamt och säg varje handgrepp: jag lägger, jag lyfter, jag pekar."
    - Fråga ”Hur vet du?” efter varje tal.
    - Säg talsortsorden, som sju tiotal, i stället för bara siffran.
    - Säg växla. Ordet låna gör växlingen till ett trick.
    - Välj tal ur gruppens paket som kräver veckans fokus.
    - Lägg tiobasen bredvid när talbrickor och pengar införs.
  undvik:
    - Att säga ”Bygg” utan att först visa hur.
    - Att växla åt eleven.
    - Att lämna materialet så fort eleven verkar kunna.
    - Att blanda två fokus i samma pass.
    - Att använda femkronan och tjugolappen.
urval:
  rubrik: Var hittar du materialet och talen?
  text:
    - Tiobas finns i de flesta skolors matematikmaterial. Talbrickor är runda lappar i kartong med 1, 10, 100 eller 1000, gärna en färg per talsort. Lekpengar finns att köpa eller kopiera. Använd bara enkronor, tiokronor, hundralappar och tusenlappar, så att varje valör är en talsort. Talsortsmattan finns på lathundens sida 3, Mallen. Skriv ut den i A3 när ni bygger med talbrickor och pengar. Med tiobas får varje talsort ett eget A4-ark i samma ordning, så att en hundraplatta eller tio tiostavar i rad får plats.
    - Tiobaspaketet som eleven tar hem är av papper. Rita tiostavar och hundraplattor på papper med centimeterrutor och klipp ut dem. Vad påsen ska innehålla står i gruppens paket under Material per årskurs, tillsammans med kartläggningen, veckornas kort och läxorna.
  kravText: "Ett tal som du visar först eller skriver på ett eget kort ska uppfylla tre krav:"
  krav:
    - rubrik: Inom talområdet
      text: Gruppens talområde, inget större
    - rubrik: Kräver veckans fokus
      text: En växling när veckan handlar om växling
    - rubrik: Går att bygga
      text: Det finns material för varje talsort i talet
hem:
  rubrik: Hem och skola
  text:
    - Eleven får ett tiobaspaket och en talsortsmatta att ha hemma, och en läxa i veckan. Läxorna, Läxa 1–5, finns i gruppens paket under Material per årskurs. Läxan delas ut efter veckans första pass och innehåller samma sorts uppgifter som i skolan. En vårdnadshavare läser veckans kort, och eleven bygger och berättar vad hen gör. Det blir en repetition, och eleven får höra samma sak med andra ord och i ett annat sammanhang. Tio minuter några gånger under veckan räcker. Fråga i början av veckans första pass hur läxan gick, och låt eleven visa ett kort.
    - "Berätta för vårdnadshavarna att barnet får intensivt stöd och extra träning under fem veckor, och visa hur man gör med ett kort: läs kortet högt, låt barnet bygga och berätta vad det gör, och visa själv först om det blir svårt. Går det inte att göra läxan hemma kan eleven göra den i skolan eller på fritids tillsammans med en annan vuxen."
progression:
  rubrik: "Kursplan: fem veckor, ett fokus i veckan"
  rader:
    - vecka: "1"
      fokus: "Bygga och säga tal: tio av en talsort är en av nästa större. Kartläggningen görs före första passet."
      roll: Läraren gör först och säger varje talsort.
    - vecka: "2"
      fokus: "Siffrans plats och nollan: samma siffror på olika platser, och en tom plats där nollan håller platsen."
      roll: Läraren gör först, och paren börjar läsa korten för varandra.
    - vecka: "3"
      fokus: "Lägga till och växla upp: tio i en talsort blir en i nästa större."
      roll: Läraren gör växlingen långsamt först, och eleverna gör den själva.
    - vecka: "4"
      fokus: "Ta bort och växla ned: en från nästa större talsort blir tio."
      roll: Läraren gör först och frågar mer.
    - vecka: "5"
      fokus: "Från material till skrift: bygg, anteckna och tänk dig till sist materialet. I åk 4–5 handlar pass 3 om negativa tal. Kartläggningen görs efter sista passet."
      roll: Eleven skriver det hen bygger, och läraren kontrollerar mot materialet.
uppfoljning:
  rader:
    - nar: Före insatsen
      vad: "Gör kartläggningen i gruppens paket utanför passen, med en elev i taget, cirka tio minuter per elev. Läs uppgiften högt och hjälp inte till. Eleven bygger, berättar och skriver. Anteckna för varje uppgift på en kopia av listan: B om eleven byggde rätt, V om eleven växlade själv i materialet och S om eleven använde talsortsord."
    - nar: Varje pass
      vad: Anteckna kort vem som växlade själv och kunde säga vad som hände.
    - nar: Efter fem veckor
      vad: Samma kartläggning med samma uppgifter. Jämför uppgift för uppgift, och berätta för klassläraren vilket talområde eleven bygger säkert i och vilka växlingar som behöver mer träning.
mal:
  rubrik: "Mål: det eleven kan efter fem veckor"
  text: "Kryssa för det eleven kan, före och efter perioden:"
  punkter:
    - Bygga ett tal i sitt talområde och säga hur många av varje talsort
    - Läsa, skriva och jämföra tal med nolla och med samma siffror på olika platser
    - Lägga till och växla upp, och säga vad som händer
    - Ta bort och växla ned, och säga vad som händer
    - Räkna talsort för talsort och skriva det som skriftlig huvudräkning
    - "Åk 4–5: bygga decimaltal och visa negativa tal på tallinjen"
snabbmall:
  fore:
    - "Vecka, fokus och pass: tiobas, talbrickor eller pengar"
    - Det jag visar först och vad jag säger
    - Korten paren och eleverna får
  efter:
    - Vem växlade själv och kunde säga vad som hände?
    - Vem byggde på fel plats eller läste fel?
    - Vad behöver jag visa igen nästa pass?
checklista:
  punkter:
    - "Tagit fram dagens material: tiobas, talbrickor eller pengar."
    - Lagt fram en talsortsmatta per elev och bestämt paren.
    - Kopierat veckans kort ur gruppens paket.
    - Byggt det jag ska visa först och sagt orden högt.
    - Valt det andra talet, som hela gruppen bygger sist.
grund:
  text: "Metoden bygger på att eleven ser tiotalet som en enhet och som tio ental på samma gång, och på att mängd, talord och siffra kopplas ihop varje gång (Fuson m.fl., 1997). När elever bygger och växlar med tiobas och skriver varje steg samtidigt, förstår de flersiffriga tal och räknar med växling redan i åk 1 och 2 (Fuson och Briars, 1990). Den som tidigt förstår positionssystemet klarar senare räkning med växling bättre (Moeller m.fl., 2011). För elever i matematiksvårigheter rekommenderas systematisk undervisning där läraren först visar och tänker högt, använder ett tydligt matematiskt språk och kopplar konkret material till bild och symbol (Fuchs m.fl., 2021). Vägen från material via anteckningar till skrift följer McIntosh (2008), och samtal om representationer i talkör, i par och i helgrupp har gett effekt i svensk förskoleklass (Sterner, Wolff och Helenius, 2020)."
  kallor: Bygger på Fuson och Briars (1990), Fuson m.fl. (1997), Moeller m.fl. (2011), Fuchs m.fl. (2021), McIntosh (2008) och Sterner, Wolff och Helenius (2020), kursplanen i matematik i Lgr22 (Skolverket, 2022) och kompendiet Särskilt stöd, Norrtälje, avsnittet Matematik 1.
ramar:
  rubrik: Material per årskurs
  text:
    - Materialet är ordnat efter årskurs, med ett paket för varje talområde. Använd paketet för gruppens årskurs. Först kommer en ruta Till läraren som för varje vecka beskriver vad du visar först och vad du ska lyssna efter. Sedan kommer kartläggningen och veckornas kort, och sist Läxa 1–5 med en ruta Till vårdnadshavaren.
    - "Rutan Till läraren beskriver hur du visar med tiobas. Med brickor och pengar gör du samma sak och säger talsorten: en tiokrona är ett tiotal."
    - Korten är elevmaterial. Kopiera veckans lista, en per par, klipp isär korten och lägg dem i en hög hos varje par. Den som läser ett kort läser det högt, och kamraten bygger. Om en elev inte kan läsa kortet läser kamraten eller läraren det. Har kortet två tal bygger eleven det första på mattan och det andra ovanför, talsort över talsort, och skjuter ned det när kortet säger ”slå ihop”. Vid subtraktion bygger eleven bara det första talet.
    - Talen är valda så att de kräver veckans fokus inom årskursens talområde. Egna kort skriver du efter de tre kraven under Var hittar du materialet och talen?
  ramar:
    # ---------------------------------------------------------------- Åk 1
    - rubrik: "Åk 1: talen 0–30"
      text:
        - "Tiotal och ental med talen till 30. Elva till nitton är ett tiotal och några ental, fast namnen inte visar det. Mattan har bara Tiotal och Ental: vik bort de andra rutorna."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Material
              text: "Tiostavar och ental, talbrickor med 1 och 10, och enkronor och tiokronor. Klar tidigt: Närmast målet 30 på tre slag, där varje slag räknas som tiotal eller ental. Ett slag på 4, 5 eller 6 blir ental. Per elev: 20 brickor och 20 mynt av varje talsort. Om ingen i paret kan läsa än läser du korten under hela I par."
            - rubrik: Vecka 1 · Bygga och säga tal
              text: "Visa först och säg: ”Jag bygger 25. Jag tar två tiostavar och lägger dem på tiotalens plats. Jag lyfter en: tio ental som sitter ihop. Jag lägger fem ental här och pekar på dem: ett, två, tre, fyra, fem. Två tiotal och fem ental. 25.”\nLyssna efter eleven som räknar tiostaven som en, så att 14 blir fem."
            - rubrik: Vecka 2 · Siffrans plats och nollan
              text: "Visa först och säg: ”Jag bygger 12 på mattan och 21 ovanför, och skriver talen. Jag pekar på tvåan i 12 och på de två entalen: två ental. Jag pekar på tvåan i 21 och på de två tiotalen: två tiotal. 21 är störst.” Bygg 20 och peka på entalens plats: ”Tom. Nollan håller platsen.”\nLyssna efter eleven som skriver tjugotre som 203."
            - rubrik: Vecka 3 · Lägga till och växla upp
              text: "Visa först och säg: ”Jag bygger 8 och lägger till 5, ett i taget. Nio, tio. Jag lägger de tio entalen bredvid en tiostav. Lika långa. Jag byter och lägger tiostaven på tiotalens plats.” Lägg de tre som är kvar och peka: ”Ett tiotal och tre ental. 13.”\nLyssna efter eleven som läser ett tiotal och elva ental som 111."
            - rubrik: Vecka 4 · Ta bort och växla ned
              text: "Visa först och säg: ”Jag bygger 12 och ska ta bort 5. Jag pekar på entalen: två. Det räcker inte. Jag lyfter tiostaven och byter den mot tio ental. Tolv ental. Jag tar bort fem. Sju.”\nLyssna efter eleven som drar den minsta siffran från den största, så att 21 − 4 blir 23."
        - rubrik: "Till läraren: vecka 5 och kartläggningen"
          falt:
