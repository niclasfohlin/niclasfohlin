    # ---------------------------------------------------------------- Åk 4–5
    - rubrik: "Åk 4–5: tal till 10 000, decimaltal och negativa tal"
      text:
        - Hela tal till 10 000 första veckan. Från vecka 2 också decimaltal med tiondelar, och från vecka 3 med hundradelar. Hundraplattan är då en hel, tiostaven en tiondel och kuben en hundradel. Sista passet vecka 5 handlar om negativa tal, på tallinjen och som skuld.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Material
              text: "Tiobas med en tusenkub, talbrickor från 0,01 till 1000, och pengar upp till tusenlappar. Saknas tusenkuber, bygg tusentalen med talbrickor eller tusenlappar. En halv sats per elev räcker till fem hundraplattor och 15 tiostavar. Kräver ett kort fler bygger eleven med talbrickor. Från vecka 2 är kort 1–3 hela tal och kort 4–6 decimaltal. Lägg dem i två högar och bygg de hela talen först. Byt sedan matta och säg: nu är hundraplattan en hel. Decimaltalen byggs med tiobas eller talbrickor, även i pass 3. Varje elev behöver en lodrät tallinje från −10 till 10 i vecka 5 och vid kartläggningen. Klar tidigt: Närmast målet 5 000 med talbrickor på sju slag, där varje slag räknas som tusental, hundratal, tiotal eller ental. Per elev: 20 brickor och 20 mynt eller sedlar av varje talsort."
            - rubrik: Vecka 1 · Bygga och säga tal till 10 000
              text: "Visa först och säg: ”Jag bygger 2 345. Jag lägger två brickor med 1000 på tusentalens plats, tre hundraplattor, fyra tiostavar och fem ental. Jag pekar: två tusental, tre hundratal, fyra tiotal, fem ental. 2 345.” Ta plattorna från mattan och stapla tio hundraplattor bredvid tusenkuben: ”Lika höga. Tio hundratal är ett tusental.”\nLyssna efter eleven som läser 4 050 som fyrahundrafemtio."
            - rubrik: Vecka 2 · Siffrans plats och nollan, också i decimaltal
              text: "Visa först och säg: ”Jag bygger 3 045 på mattan och 3 450 ovanför, och skriver talen. Jag pekar på fyran i 3 045: fyra tiotal. I 3 450: fyra hundratal. Nollan i 3 045 säger att det inte finns några hundratal. 3 450 är störst.” Byt sedan till decimalmattan och lyft hundraplattan: ”Nu är den här en hel, och tiostaven är en tiondel.” Bygg 0,9 och 1 och peka: ”Nio tiondelar. En hel är tio tiondelar. 1 är störst.”\nLyssna efter eleven som tror att 0,9 är större än 1, för att nio är mer än ett."
            - rubrik: Vecka 3 · Lägga till och växla upp
              text: "Visa först och säg: ”Jag bygger 3 480 och lägger till 50. Tretton tiotal. Tio av dem byter jag mot ett hundratal. 3 530.” Bygg sedan 0,7 och lägg till 0,5: ”Tolv tiondelar. Tio tiondelar byter jag mot en hel. 1,2.” Visa sedan hundradelarna och lägg tio kuber bredvid en tiostav: ”Tio hundradelar är en tiondel.”\nLyssna efter eleven som skriver 0,7 + 0,5 = 0,12."
            - rubrik: Vecka 4 · Ta bort och växla ned
              text: "Visa först och säg: ”Jag bygger 3 000 och ska ta bort 1. Jag pekar på entalen: tomma. Tiotalen och hundratalen också. Det räcker inte. Jag byter ett tusental mot tio hundratal, ett hundratal mot tio tiotal och ett tiotal mot tio ental. Jag tar bort ett ental. Två tusental, nio hundratal, nio tiotal, nio ental. 2 999.” Bygg sedan 1,2 och ta bort 0,5: ”Två tiondelar räcker inte. Jag byter en hel mot tio tiondelar. Tolv tiondelar, jag tar bort fem. 0,7.”\nLyssna efter eleven som drar den minsta siffran från den största, så att 1,2 − 0,5 blir 1,3."
        - rubrik: "Till läraren: vecka 5 och kartläggningen"
          falt:
            - rubrik: Vecka 5 · Från material till skrift, och negativa tal
              text: "Visa först och säg, och skriv samtidigt.\nPass 1: ”Jag bygger 2 470 och 1 385. Tusentalen: tre. Hundratalen: sju. Tiotalen: femton, och tio av dem växlar jag mot ett hundratal. Åtta hundratal, fem tiotal, fem ental. 3 855.” Skriv 3 000 + 700 + 150 + 5 = 3 000 + 800 + 50 + 5 = 3 855.\nPass 2: ”Jag bygger 4 998 och lägger till 36. Två ental gör 4 998 till 5 000, med tre växlingar i rad. Kvar av 36 är 34. 5 034.” Skriv 4 998 + 2 + 34 = 5 034. Ta bort på samma sätt: ”6 003 ta bort 45. Jag växlar ett tusental, ett hundratal och ett tiotal. 5 958.”\nPass 3, negativa tal: ”Här är noll. Det är fyra grader och blir nio grader kallare. Jag går fyra steg ned till noll och fem steg till: minus fem.” Sedan skuld: ”Jag har 200 kronor och ska betala 350. Jag betalar 200 och skriver en lapp: skyldig 150. Det är minus 150.”\nLyssna efter eleven som tror att −5 är större än −2, och visa båda på tallinjen."
            - rubrik: Kartläggning
              text: "Före första passet och efter sista, en elev i taget, med uppgifterna i listan Kartläggning. Uppgift 1–5 följer veckorna, och uppgift 6 gäller negativa tal. Säg före uppgift 2 och 5: här är hundraplattan en hel."
