# Metod i stödundervisning. Modellen står i methods/_mall.yaml och docs/modell.md.
# Ny metod 2026-11-19 ur Niclas beställning i chatten (ARBETSORDER.md). Analysen står i analys.md och sökningarna i
# sokning.md. De åtta delarna står som uppslag i en ram med lektioner, en sida var (analys.md, Formval). Casen har tre
# elever, en per stadium: Elias i åk 4 (del 3, 6 och 8 och exemplet), Nora i åk 8 (del 1 och 5 och den ifyllda
# bemötandeplanen) och Selma i åk 2 (del 2, 4 och 7).
# 2026-11-23: del 8, Stöd det som fungerar, blev del 2, Tecknet och den lugna platsen, och del 2–⁠7 blev del 3–⁠8 (Niclas via
# sajten, out/FRAN-SAJTEN.md, och analys.md, Tecknet och den lugna platsen blir del 2).
titel: "Relationell vägledning"
undertitel: "Så bygger du en relation som bär och använder den för att vägleda en elev som lätt hamnar i affekt, för F–⁠9"
ingress: "Elever följer vuxna de litar på. Metoden handlar om hur du bemöter en elev som lätt hamnar i affekt: först lugn, sedan kontakt, sedan vägledning. Efter en svår stund tar du första steget tillbaka. Två gånger i veckan har du och eleven en halvtimme som är elevens. I åtta delar slår du upp vad du gör, steg för steg."
