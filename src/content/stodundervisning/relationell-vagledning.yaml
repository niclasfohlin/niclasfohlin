# Planen (sajtens Planera insatsen): läraren räknar elevens svåra stunder och lösningar varje vecka, med veckan före
# start som diagrammets första stapel (sajten 2026-11-23, efter Niclas 2026-11-22). Texterna är metodens egna meningar,
# ordagrant: ändras en av dem i uppföljningen eller i kurvans ram, ändras den här också.
plan:
  skattningar:
    - namn: "Svåra stunder vecka för vecka"
      vem: eleven
      rad: "Varje fredag"
      fore: "Före start"
      text: "Det som hör ihop räknas en gång, så tecknet, den lugna platsen och vägen tillbaka är en lösning. Det ni övar räknas inte. De andra vuxna berättar för dig samma dag när eleven hade en svår stund eller visade tecknet."
      ram: "Svåra stunder vecka för vecka"
      antal:
        - namn: "Svåra stunder"
          mot: ned
          text: "när eleven hamnade i affekt eller låste sig"
        - namn: "Lösningar"
          mot: upp
          text: "när eleven visade tecknet, gick till sin lugna plats eller löste det med ord"
      regler:
        - om: "uppåt 6 veckor i rad"
          antal: "Svåra stunder"
          text: "Fortsätter de att öka tre veckor efter det, behöver eleven mer än den här insatsen."
        - om: "uppåt 3 veckor i rad"
          antal: "Svåra stunder"
          text: "Har de svåra stunderna ökat tre veckor i rad, och inget i elevens liv förklarar det, ändrar ni vuxna hur ni bemöter eleven."
  atgard: "I tio veckor gör alla vuxna runt eleven likadant i varje möte: först lugn, sedan kontakt, sedan vägledning. Efter en svår stund tar den vuxne första steget tillbaka."
  # Det eleven väljer och övningen (sajten 2026-11-23, K-822, efter Niclas: "De två behöver också tidigt planeras och
  # tränas i insatsen och i Planera insatsen"). Meningarna är del 2:s, ordagrant.
  valet:
    rubrik: "Tecknet och den lugna platsen"
    nar: "Eleven väljer tecknet och den lugna platsen på träffen före start om hen är med, och annars med dig i vecka 1."
    senare: "Vill eleven inte välja än, frågar du igen när hen har börjat komma till stunden, och då övar du och eleven de två veckorna efter. Till dess gör ni vuxna som bemötandeplanen säger."
    fraga: "Fråga: ”Vad kan du visa mig när det börjar bli för mycket? Vad blir du lugn av?”"
    falt: ["Tecknet", "Den lugna platsen", "Det som lugnar"]
  ovning:
    namn: "Öva tecknet"
    text: "I vecka 1 och 2 övar du och eleven tecknet två gånger i veckan, fem minuter åt gången, utanför stunden och när inget har hänt."
    ganger: 2
    veckor: 2
    lov: "Öva igen efter ett lov, och påminn före det svåra: ”Kom ihåg tecknet på matten.”"
  justera:
    - "Läs bemötandeplanen med arbetslaget. Gjorde alla lika, och fick elevens tecken svar?"
    - "Välj färre krav ett tag, och lägg resten åt sidan med flit (del 4). Se om de svåra stunderna blir färre."
    - "Gör om en överenskommelse som inte håller (del 8). Fråga eleven vad som har ändrats."
    - "Ta upp det med elevhälsan och vårdnadshavarna."
  utanUpprepa: true
  upprepa: "Svaret på tecknet ändrar ni först när eleven klarar det som står under Gå vidare när, och då säger du det till eleven och skriver det i bemötandeplanen. Annars stannar ni i raden, och ni tar beslutet efter vecka 10 ändå."
  utvardering:
    - "Blev de svåra stunderna farligare eller fler, behöver eleven mer än insatsen, och elevhälsan avgör vad. Stunden fortsätter."
    - "Är de färre och går eleven själv i tid, blir stunden en gång i veckan, och hälsningen och bemötandeplanen står kvar."
    - "Annars fortsätter insatsen tio veckor till från elevens rad i progressionen."
lathund:
  innehall: "Relation och bemötande"
  metoden:
    text:
      - "Elever följer vuxna de litar på, så lämna varje möte med eleven med en starkare relation än när ni började. Ordningen är lugn, kontakt, vägledning. Snurrar eleven en linjal, fråga tyst: ”Är det svårt att sitta still nu?” Vänta på en blick och säg: ”Lägg linjalen i pennskrinet.”"
      - "Efter en svår stund tar du första steget tillbaka. Kraven står kvar, och du ändrar hur du ställer dem. Eleven väljer ett tecken och en lugn plats, övade när det är lugnt. Två gånger i veckan har du och eleven en halvtimme som är elevens. Är någon i fara eller kränkt, går skolans rutin före."
    ruta:
      rubrik: "Tre saker att hålla fast vid"
      punkter:
        - fet: "Lugn före kontakt, kontakt före vägledning."
          text: "Är du eller eleven uppe i varv, väntar allt annat."
        - fet: "Stunden är elevens."
          text: "Den ställs inte in efter en dålig dag."
        - fet: "Ta första steget tillbaka."
          text: "Samma dag eller nästa, efter en svår stund."
    tabell:
      rubrik: "Åtta delar: slå upp den du behöver"
      kolumner:
        - "Del"
        - "Använd den när"
      rader:
        - - "1 · Bygg relationen i förväg"
          - "Varje dag från start, mest när eleven håller sig undan vuxna."
        - - "2 · Tecknet och den lugna platsen"
          - "Från vecka 1: eleven väljer och övar när allt är lugnt."
        - - "3 · Kontakt före korrigering"
          - "Du behöver säga till, och eleven är lugn nog att höra dig."
        - - "4 · Ställ krav så att eleven kan säga ja"
          - "Du ska be om något du vet är svårt, eller eleven sitter tyst och gör ingenting."
        - - "5 · Håll dig själv lugn"
          - "Du känner att du själv går upp i varv."
        - - "6 · Lugna när det trappas upp"
          - "Eleven håller på att tappa kontrollen, eller har stängt av helt."
        - - "7 · Laga efteråt"
          - "Det har varit en svår stund, och du ska möta eleven igen."
        - - "8 · Nå en överenskommelse"
          - "Samma sak har hänt flera gånger."
  pass:
    rubrik: "Stunden: tre veckor med Nora"
    textRubrik: "Nora i åk 8 och mentorn Samir"
    utskrift: Skriv ut passexemplet
    text:
      - "Samir säger en måndag, när ingen annan hör: ”Tisdagar och torsdagar efter lunch har vi en halvtimme i musiksalen. Du bestämmer vad vi gör.” På tisdagen säger Nora: ”Det här är töntigt.” Efter tre minuter går hon."
      - "På torsdagen kommer hon inte. Samir sitter kvar den halvtimmen. Nästa morgon säger han: ”Hej Nora. Jag satt där i går. Vi ses på tisdag.” Veckan efter kommer hon inte heller, och han säger samma sak."
      - "Den tredje veckan står hon i dörren och pekar på högtalaren: ”Får man spela vad man vill på den där?” Hon sätter på en låt och sitter kvar. ”Den börjar lugnt och blir större”, säger Samir."
    forberett:
      rubrik: "Det jag förberedde"
      text:
        - "Bestämt platsen för stunden och de två tiderna, och sagt dem till Nora när ingen annan hörde. Sett till att högtalaren i musiksalen fungerar."
    klarTidigt: "Stunden har inget som ska bli klart. Sitt kvar tiden ut, också när eleven går."
    schema:
      rubrik: "30 minuter, del för del"
      rader:
        - tid: "Före"
          fas: "Förberedelse"
          vad: "Platsen för stunden och de två tiderna är desamma varje vecka. Ha några saker framme att välja bland."
        - tid: "0–3"
          fas: "Börja"
          vad: "Hälsa med namnet. Första gången säger du: ”Det här är din stund.” Fråga vad eleven vill göra, och vet eleven inte, visar du sakerna."
        - tid: "3–27"
          fas: "Eleven leder"
          vad: "Gör det eleven har valt. Säg det du ser. Du undervisar inte, ger inga råd och tar inte upp det som har gått fel."
          fraser:
            - "Den börjar lugnt och blir större."
        - tid: "27–30"
          fas: "Avsluta"
          vad: "Förvarna om slutet. Säg en sak du såg, och vilken dag ni ses igen."
          fraser:
            - "Vi ses på torsdag."
  mall:
    rubrik: "Bemötandeplanen"
    underrad: "Noras plan, kortad. Din elevs plan står i planeringsmallarna."
    block:
      - typ: tabell
        rubrik: "Fyra lägen"
        kolumner:
          - "Läge"
          - "Det vi ser"
          - "Det vi gör"
        rader:
          - - "En vanlig dag"
            - "Hon vet vad som ska hända och sitter nära dörren."
            - "Kravet nu är att komma in och börja. Läxorna i engelska och att svara högt väntar."
          - - "På väg upp"
            - "Luvan åker upp, och hon slutar skriva."
            - "Hon visar sitt tecken, suddgummit på bänkens hörn, och går till biblioteket i tio minuter. Vi säger tyst ”Gå du”."
          - - "Tappat kontrollen"
            - "Hon går utan sitt tecken."
            - "Få ord och avstånd: ”Vi pratar sedan.” Läraren ringer Samir, som möter henne i biblioteket."
          - - "Lugn igen"
            - "Hon kommer in genom den bakre dörren."
            - "Läraren nickar. Samir hälsar nästa morgon."
      - typ: not
        text: "Alla vuxna som möter eleven har planen, också vikarier. Varannan vecka frågar ni vuxna: gjorde vi som planen säger?"
  material:
    rubrik: "Vad du behöver"
    var:
      rubrik: "Var materialet finns"
      punkter:
        - fet: "De åtta delarna."
          text: "En sida var under Materialet, med stegen, ett case och skälen."
        - fet: "Bemötandeplanen."
          text: "Mallen och Noras plan finns i planeringsmallarna (Word)."
        - fet: "Vår överenskommelse."
          text: "Elevens blad till samtalet i del 8, i planeringsmallarna (Word)."
        - fet: "Svåra stunder vecka för vecka."
          text: "Kurvan du fyller i varje vecka, i planeringsmallarna (Word)."
        - fet: "Lektionskortet."
          text: "Stunden på ett A4, i en egen fil, att läsa före de första stunderna."
        - fet: "Stunden."
          text: "Att välja bland: papper och pennor, ett kortspel, en boll."
    bordet:
      - "Det eleven har valt att göra"
      - "Inget skolarbete"
    uppfoljning:
      - nar: "Före start"
        vad: "Räkna svåra stunder och lösningar en vecka."
      - nar: "Varje fredag"
        vad: "Räkna veckan och dra linjerna. Fråga hur veckan har varit, och säg något eleven gjorde."
      - nar: "Efter vecka 10"
        vad: "Jämför med Före. Är det färre och går eleven själv, glesar du ut stunden. Annars fortsätter du, eller tar det med elevhälsan."
film:
  sekunder: 29.33
  beskrivning: "Lugn: Läraren ropar inte. Läraren tänker: ”Elias, lägg ner den!” Kontakt: Läraren går nära och talar tyst. Läraren säger: ”Du har linjalen i gång. Är det svårt att sitta still nu?” Vägledning: en sak att göra. Läraren säger: ”Lägg linjalen i pennskrinet.” Elias säger: ”Varför är det alltid jag? Melvin pratade också!” Läraren säger: ”Kanske det. Lägg linjalen i pennskrinet.” Hon går tillbaka utan att vänta. Tillsägelsen slutar med något vänligt. Läraren säger: ”Tack.”"
  rubrik: "Lugn, kontakt, vägledning"
  ingress: "Fyra bilder ur filmen om en tillsägelse, med Elias i åk 4. Elias snurrar linjalen under genomgången, och Läraren låter bli att ropa från tavlan. Hon går fram till honom, frågar tyst om det är svårt att sitta still och väntar på en blick. Sedan säger hon en sak som Elias ska göra, och han protesterar. När linjalen ligger i pennskrinet säger hon tack."
  stillbilder:
    - text: "Lugn: Läraren vill ropa till Elias, men låter bli."
    - text: "Kontakt: på huk och tyst. Läraren väntar på en blick."
    - text: "Läraren säger en sak att göra. Elias protesterar."
    - text: "Elias har lagt ner linjalen. Läraren säger: ”Tack.”"
filmer:
  - nr: 2
    sekunder: 28.33
    beskrivning: "Läraren ser att det är på väg upp och gör uppgiften mindre. Läraren säger: ”Vi tar de två första tillsammans.” Elias säger: ”Jag hatar matte!” Klassen går ut, och Elias stannar. Läraren säger: ”Gå in till klassen bredvid, som vi har övat.” Läraren backar och sätter sig snett. Läraren säger: ”Jag är här.” Elias säger: ”Du är dum i huvudet!” Hon svarar inte. Hon väntar i några minuter. Elias sätter sig och blir tyst. Läraren säger: ”Bra att du satte dig.”"
    rubrik: "När det trappas upp"
    ingress: "Fyra bilder ur filmen till del 6, med Elias i åk 4. Läraren gör uppgiften mindre, men Elias sveper ner boken på golvet. Klassen lämnar rummet, och Läraren backar, sätter sig snett från Elias och säger en mening. Hon svarar inte på det han ropar. När han har satt sig, säger hon det hon ser."
    efter: "del: Del 6 · Lugna när det trappas upp"
    stillbilder:
      - text: "Läraren gör uppgiften mindre. Det räcker inte."
      - text: "Klassen lämnar rummet, och Elias stannar kvar."
      - text: "Läraren säger en mening och svarar inte på ropet."
      - text: "Efter några minuter: ”Bra att du satte dig.”"
  - nr: 3
    sekunder: 28.35
    beskrivning: "Läraren frågar och väntar tills hon förstår. Läraren frågar: ”Vad är det som händer?” Elias säger: ”Det är tråkigt.” Läraren frågar: ”Är det mest rasten eller mest matten?” Elias säger: ”Alla ser när man inte kan första talet.” Läraren säger: ”Det jag tänker på är att du missar matten.” Hon frågar efter Elias idé, och de prövar den. Läraren frågar: ”Har du någon idé?” Elias säger: ”Om jag fick vara i biblioteket först.” Läraren frågar: ”Hinner du matten då?” De skriver: ”Fem minuter i biblioteket, sedan matten.” Håller lösningen inte, börjar de om."
    rubrik: "Samtalet om en överenskommelse"
    ingress: "Fyra bilder ur filmen om samtalet i del 8, med Elias i åk 4. Läraren frågar vad som händer och väntar. När Elias får två saker att välja mellan säger han vad som är svårt. Sedan säger Läraren sin oro i en mening. Elias föreslår en lösning, och Läraren frågar om han hinner med matten då. Sist skriver de lösningen på bladet Vår överenskommelse."
    efter: "del: Del 8 · Nå en överenskommelse"
    stillbilder:
      - text: "Läraren frågar vad som händer och väntar."
      - text: "Läraren ger två val, och Elias säger vad som är svårt."
      - text: "Läraren säger sin oro i en mening."
      - text: "Elias föreslår en lösning, och Läraren prövar den."
