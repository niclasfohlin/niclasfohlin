        - "Två ord att välja mellan: ”mest arg eller mest ledsen?”"
        - "Prata kort, och fråga hur eleven ser det."
      - - "Överenskommelsen"
        - "Du skriver eller ritar det eleven säger. En sak i taget, i högst tio minuter."
        - "Eleven skriver själv, och ni läser tillsammans."
        - "Lösningen är elevens. Fråga hur eleven vill bli påmind."
      - - "Hemmet"
        - "Du berättar för hemmet varje fredag, och eleven är med och väljer."
        - "Eleven väljer vad du berättar för hemmet på fredagen."
        - "Eleven väljer, och får säga nej. Säg till eleven vad du ändå måste berätta."
tidsschema:
  rubrik: "Stunden: en halvtimme som är elevens"
  text: "Stunden är likadan varje gång: samma vuxen, samma plats och samma tider, och eleven bestämmer vad ni gör. Första gången säger du vad den är: ”Det här är din stund. Du bestämmer vad vi gör, och jag är med.” Ha roligt tillsammans, för delad glädje bygger relationen. Ibland gör ni något utanför schemat. Stunden är ett erbjudande: eleven får säga nej eller gå, och du sitter kvar tiden ut. Du delar inte ut den som belöning och ställer inte in den efter en dålig dag. Stunden står också på Lektionskortet, ett A4 i en egen fil, att läsa före de första stunderna."
  rader:
    - tid: "Före stunden"
      fas: "Förberedelse"
      vad: "Bestäm två tider i veckan, inte på den rast eleven helst vill ha, och säg dem till eleven och klassläraren. De första gångerna har du några saker framme att välja bland, som papper och pennor, ett kortspel och en boll."
    - tid: "0–3 min"
      fas: "Börja"
      vad: "Hälsa med namnet, och fråga vad eleven vill göra. Säger eleven ”vet inte”, visar du sakerna eller tar fram det ni gjorde sist."
    - tid: "3–27 min"
      fas: "Eleven leder"
      vad: "Gör det eleven har valt, på elevens sätt. Säg det du ser och hur eleven verkar ha det: ”Du blandar korten snabbt.” ”Det där blev du nöjd med.” Du undervisar inte, ger inga råd och tar inte upp det som har gått fel."
    - tid: "27–30 min"
      fas: "Avsluta"
      vad: "Säg några minuter före slutet att ni snart slutar. Säg sedan en sak du såg eller tyckte om, och när ni ses nästa gång: ”Du lärde mig ett nytt spel i dag. Vi ses på torsdag.”"
  efter: "Stunden har inget som ska bli klart, och den är lika lång en dålig dag som en bra."
steg:
  rubrik: "Varje möte: lugn, kontakt, vägledning"
  text: "Ordningen gäller varje möte med eleven, från en hälsning till ett utbrott. Du frågar dig tre saker, i den här ordningen, och på de två första ska svaret vara ja innan du går vidare. Vägledningen kommer när du behöver säga till. Under stunden följer du eleven. De åtta delarna visar ordningen i åtta situationer."
  fraserRubrik: "Så kan du säga"
  rader:
    - namn: "Lugn"
      fraga: "Är vi båda lugna nog?"
      gor: "Känn efter hos dig själv först: rösten, axlarna och tempot. Är eleven uppe i varv, väntar allt annat: säg lite och håll avstånd. Svarar eleven med ord eller en blick, kan du gå vidare."
      fraser:
        - "Jag är här."
        - "Vi pratar sedan."
    - namn: "Kontakt"
      fraga: "Hör eleven mig?"
      gor: "Gå fram till eleven, sätt dig i höjd med hen och säg namnet tyst. Säg det du ser, och gissa hur eleven har det. Vänta på en blick, en nick eller ett svar."
      fraser:
        - "Du har linjalen i gång."
        - "Är det svårt att sitta still nu?"
        - "Blev det trångt vid gungorna?"
    - namn: "Vägledning"
      fraga: "Vad ska eleven göra nu?"
      gor: "Säg en sak som eleven ska göra. Ge ett val när det går, och gå därifrån. Säg tyst tack när det är gjort."
      fraser:
        - "Lägg linjalen i pennskrinet."
        - "Går du med mig eller med en kompis?"
        - "Tack."
exempel:
  rubrik: "Exempel: tio veckor med Elias"
  valt:
    rubrik: "Eleven"
    text: "Elias i åk 4 hamnar i bråk på rasterna, och ett par gånger i veckan slutar en lektion med att han skriker eller springer ut. Klassläraren Karin håller i insatsen."
  text:
    - "Veckan före start räknar Karin sex svåra stunder, och som längst tar det resten av dagen innan Elias är tillbaka. Han ger skolan tre av tio. Med Elias, hans pappa och arbetslaget skriver hon bemötandeplanen. På frågan vad som blir bättre om det här går bättre svarar Elias: ”Att få vara med på fotbollen.” Som tecken väljer han handen på huvudet, som syns både i klassrummet och på rasten. Som lugn plats väljer han soffan i kapprummet."
    - "De första stunderna bygger han lego och svarar knappt. Den fjärde stunden ber han Karin hålla bygget medan han sätter på taket. När de har övat tecknet lägger han en dag handen på huvudet under matten. ”Gå du”, säger Karin tyst, och han går till soffan. I vecka 5 sveper han matteboken i golvet efter lunchrasten (del 6), och veckan efter har de sitt första samtal om matten efter rasten (del 8)."
    - "Vecka 7 blir den bästa hittills. Han har två svåra stunder och är tillbaka inom tio minuter båda gångerna. Veckan efter är Karin borta en dag. Vikarien säger till honom från tavlan och svarar inte på hans tecken. Elias välter bänken och springer hem. Skolan ringer hem, som skolans rutin säger. Nästa morgon lägger Karin bemötandeplanen överst i vikariepärmen, hälsar på Elias som vanligt och har stunden som planerat."
    - "Den sista fredagen ger Elias skolan sju av tio, mot tre före start. Karin säger: ”Du visade tecknet fyra gånger, och tre gånger gick du själv.” Hon visar honom kurvan, som har gått från sex svåra stunder till två. Elias vill att hon berättar hemma att han har varit med på fotbollen hela veckan. De bestämmer att stunden blir en gång i veckan fram till jul."
fastnar:
  rubrik: "När det går bakåt"
  text: "Skoldagen är full av krav, andra elever och situationer som är svåra just för de här eleverna, och mycket i deras liv rår skolan inte på. Bakslagen kommer, ofta efter ett lov, med en ny vikarie eller efter en vecka som har gått bra. De betyder inte att arbetet var förgäves. Då behöver eleven se att du gör som du brukar. Kan ni i arbetslaget vara vuxna utanför familjen som inte ger upp, också när det är svårt, har ni gett eleven något hen har nytta av i skolan och i livet."
  fragaForst:
    - "Vad var annorlunda de dagar det gick bättre?"
    - "Vad gjorde vi vuxna då?"
  trappaText: "Pröva i den här ordningen, och ta nästa först när det förra är prövat:"
  trappa:
    - "Gör som vanligt i morgon: hälsningen, stunden och första steget tillbaka (del 7). Ett bakslag avbryter inte insatsen."
    - "Läs bemötandeplanen med arbetslaget. Gjorde alla lika, och fick elevens tecken svar? En vanlig orsak är att en vuxen inte har läst planen, till exempel en vikarie."
    - "Välj färre krav ett tag, och lägg resten åt sidan med flit (del 4). Se om de svåra stunderna blir färre."
    - "Gör om en överenskommelse som inte håller (del 8). Fråga eleven vad som har ändrats."
    - "Ta upp det med elevhälsan och vårdnadshavarna. Blir de svåra stunderna farligare, gör du det samma dag. Fortsätter de svåra stunderna att öka tre veckor efter att ni vuxna har ändrat bemötandet, behöver eleven mer än den här insatsen."
  motto: "Två steg fram och ett tillbaka är också framåt."
lararensFragor:
  fragor:
    - fraga: "Kom eleven undan?"
      svar: "Nej. Medan eleven är i affekt säger du inget om följder, för då kan hen inte ta emot dem. Samma dag eller nästa ställer eleven till rätta (del 7), och du ställer kravet igen (del 4). Skolans regler gäller som för alla."
    - fraga: "Får jag ställa krav på en elev som lätt hamnar i affekt?"
      svar: "Ja. Förbered eleven. Säger eleven nej, gör du kravet mindre men tar inte bort det (del 4)."
    - fraga: "Får jag ställa in stunden?"
      svar: "Nej, inte för att eleven har haft en dålig dag. Då hänger relationen på uppförandet. Vad du gör när du måste flytta den eller är borta står under Om något händer i stunden."
    - fraga: "Vad gör jag med de andra eleverna när det brister?"
      svar: "Oftast lämnar klassen rummet, inte eleven. Öva det med klassen före start, som en rutin för alla och utan att nämna någon: ”Ta era böcker och gå till klassen bredvid.”"
    - fraga: "Vad säger jag till klassen efteråt?"
      svar: "När eleven inte är i rummet säger du kort vad klassen gjorde bra, och att eleven är välkommen tillbaka. Tycker någon att det är orättvist, säger du att alla får det de behöver, och att inte alla behöver samma sak."
    - fraga: "Vad gör jag när jag själv inte orkar tycka om eleven?"
      svar: "Det går att lära sig. Påminn dig om att det eleven gör ofta är ett försvar, och leta efter en sak du tycker om hos hen. Säg till en kollega att du inte orkar, och byt av varandra i de svåra stunderna (del 5)."
progression:
  text: "Delarna gäller från första dagen, när de behövs. Vecka för vecka lägger ni vuxna mest kraft på en sak, och eleven tar över mer. Svaret på tecknet ändrar ni först när eleven klarar det som står under Gå vidare när, och då säger du det till eleven och skriver det i bemötandeplanen. Annars stannar ni i raden, och ni tar beslutet efter vecka 10 ändå."
  rader:
    - vecka: 1–2
      rubrik: "Relationen"
      fokus: "Stunden och hälsningen börjar (del 1). I vecka 1 och 2 övar du och eleven tecknet två gånger i veckan, fem minuter åt gången, utanför stunden och när inget har hänt."
      roll: "Du håller stunden, hälsar varje dag och pratar två minuter de andra dagarna. Var eleven inte med på träffen, väljer hen tecknet och den lugna platsen med dig i vecka 1 (del 2)."
      eleverna: "Att komma till stunden och välja vad ni gör. Att visa tecknet när ni övar."
      vidare: "eleven kommer till stunden och kan visa tecknet, gå till den lugna platsen och komma tillbaka när ni övar"
    - vecka: 3–4
      rubrik: "Tecknet"
      fokus: "Eleven börjar visa tecknet när det behövs (del 2)."
      roll: "Du påminner om tecknet före det svåra och säger vad du ser när det börjar. Varje gång eleven visar tecknet svarar ni vuxna tyst: ”Gå du.”"
      eleverna: "Att visa sitt tecken i tid, gå till sin lugna plats och komma tillbaka."
      vidare: "eleven har visat tecknet i verkliga lägen två veckor i rad"
    - vecka: 5–8
      rubrik: "Ett problem i taget"
      fokus: "I samtal utanför stunden, 15–25 minuter och högst tio i F–⁠3, löser du och eleven det som kommer igen, ett problem i taget (del 8)."
      roll: "Du bjuder in till samtalet och lyssnar först. Det du och eleven kommer överens om skriver ni gärna på bladet Vår överenskommelse. Har eleven visat tecknet i verkliga lägen, svarar ni vuxna nu med en nick. I vecka 8 säger du att stunden inte slutar efter vecka 10."
      eleverna: "Att säga vad som är svårt i ett lugnt samtal, föreslå en lösning och pröva den."
      vidare: "det oftast räcker med en nick, och en överenskommelse har hållit i två veckor"
    - vecka: "9–10"
      rubrik: "Eleven själv"
      fokus: "Eleven visar tecknet och går utan att vänta. Du nickar ändå."
      roll: "Du säger efteråt vad du såg. Den sista fredagen läser du elevens mål i bemötandeplanen med eleven. Tar eleven själv upp något svårt, föreslår eleven en lösning först (del 8)."
      eleverna: "Att gå själv i tid, och själv säga med ord när något är svårt. Att säga vad som har blivit lättare och vad hen vill ha kvar."
uppfoljning:
  rubrik: "Så ser du att det hjälper"
  text: "Du som håller i insatsen räknar varje vecka två saker. Den ena är de svåra stunderna, när eleven hamnade i affekt eller låste sig. Den andra är lösningarna, när eleven visade tecknet, gick till sin lugna plats eller löste det med ord. Det som hör ihop räknas en gång, så tecknet, den lugna platsen och vägen tillbaka är en lösning. Det ni övar räknas inte. De andra vuxna berättar för dig samma dag när eleven hade en svår stund eller visade tecknet. På bladet Svåra stunder vecka för vecka sätter du ett kryss vid antalet svåra stunder och en ring vid antalet lösningar, och drar linjerna från förra veckan. Talen ger ingen belöning och inget straff, men visar er vuxna och eleven vart det är på väg."
  rader:
    - nar: "Före start"
      tid: "före"
      resultat: "längsta tiden tillbaka; elevens siffra från 0 till 10"
      vad: "Räkna de svåra stunderna och lösningarna under en vecka, och sätt dem i kolumnen Före på bladet Svåra stunder vecka för vecka. Skriv hur lång tid det som längst tog innan eleven var tillbaka. Fråga eleven: ”Hur är det i skolan, från 0 till 10, där 10 är riktigt bra?”"
    - nar: "Varje fredag"
      tid: "varje vecka"
      vad: "Räkna veckan och dra linjerna. Ta två minuter med eleven: fråga hur veckan har varit och vad eleven gjorde när det blev svårt, och säg något du såg: ”I tisdags sa du att du inte förstod.” Fråga vad du ska berätta hemma."
    - nar: "Varannan vecka"
      tid: "varannan vecka"
      vad: "Ta några minuter på arbetslagets möte, med bemötandeplanen och bladet Svåra stunder vecka för vecka framme. Gjorde vi som bemötandeplanen säger? Har de svåra stunderna ökat tre veckor i rad, och inget i elevens liv förklarar det, ändrar ni hur ni bemöter eleven."
    - nar: "Vecka 5"
      tid: "vecka 5"
      vad: "Visa bladet Svåra stunder vecka för vecka för hemmet och elevhälsan. På fredagen tar du och eleven tio minuter och läser elevens mål i bemötandeplanen. Blir de svåra stunderna färre, visar du eleven kurvan: ”Titta, nu blir det färre.”"
    - nar: "Efter vecka 10"
      tid: "efter"
      resultat: "längsta tiden tillbaka; elevens siffra från 0 till 10"
      vad: "Jämför de två sista veckorna på bladet Svåra stunder vecka för vecka och tiden tillbaka med Före, och fråga eleven igen, också om elevens mål i bemötandeplanen. Blev de svåra stunderna farligare eller fler, behöver eleven mer än insatsen, och elevhälsan avgör vad. Stunden fortsätter. Är de färre och går eleven själv i tid, blir stunden en gång i veckan, och hälsningen och bemötandeplanen står kvar. Annars fortsätter insatsen tio veckor till från elevens rad i progressionen."
mal:
  overgripande: "kunna ta emot hjälp att bli lugn, och lösa problem med ord."
  punkter:
    - "Komma till stunden och välja vad ni gör"
    - "Ta emot en tillsägelse utan att det trappas upp"
    - "Visa sitt tecken när det börjar bli för mycket"
    - "Gå till sin lugna plats i tid, och komma tillbaka"
    - "Säga vad som är svårt i ett lugnt samtal"
    - "Föreslå en lösning och pröva den"
    - "Ställa till rätta efter en svår stund"
checklista:
  rubrik: "Före start"
  punkter:
    - "Pratat med elevhälsan och rektor om insatsen, som tar två till tre timmar i veckan, och läst skolans rutiner för akuta situationer och kränkningar."
    - "Bestämt vem som håller i insatsen, vem som tar stunden när hen är borta, och en plats och två tider för stunden."
    - "Ringt vårdnadshavarna och frågat vad som lugnar och vad de märker innan det brister."
    - "Räknat de svåra stunderna och lösningarna under en vecka och frågat eleven hur det är i skolan."
    - "Skrivit bemötandeplanen på en gemensam träff runt eleven och gett planen till alla vuxna som möter eleven, också vikarier."
    - "Låtit eleven välja ett tecken och en lugn plats, om hen var med (del 2)."
    - "Övat lägen ur bemötandeplanen i arbetslaget, och bestämt vart klassen går när det brister, vem som hämtas och hur ni byter av."
    - "Övat med klassen vart den går när det brister, som en rutin för alla."
    - "Under tiden hälsat på eleven med namnet varje dag och sagt till enskilt, som i del 1 och del 3."
grund:
  text: "Gymnasieelever i USA som hade skickats till rektorn för trots samarbetade med lärare de litade på, och förtroendet hängde ihop med att läraren både brydde sig och hade höga förväntningar (Gregory och Weinstein, 2008). Konflikt i relationen till läraren hänger tydligt ihop med utagerande beteende (Lei m.fl., 2016), och en insats där läraren bygger, vårdar och lagar relationen gav bättre relationer och mindre störande beteende i en liten studie i åk 4–⁠5 (Cook m.fl., 2018). Stunden är formad efter Banking Time, som i en lottad studie i förskolan gjorde lärarna mindre negativa mot barnen men hade liten effekt på barnens beteende (Williford m.fl., 2017). Redan lite stress gör det svårare att tänka efter (Arnsten, 2009), och därför väntar du med samtalet tills eleven är lugn (SPSM, 2024). Att lära ut ett beteende som ersätter det gamla och att ändra kraven har starkt stöd i låg- och mellanstadiet (Epstein m.fl., 2008). Samtalet om en överenskommelse följer Greenes modell, som har gett lika goda resultat som föräldraträning i studier med barn och unga (Norman m.fl., 2026), men i skolan är modellen lite prövad. Greppen när det trappas upp kommer ur lågaffektivt bemötande, där SBU inte hittade någon effektstudie för barn och unga inom socialtjänsten (SBU, 2020), och kontakt före korrigering och NVC är inte prövade som program."
  kallor: "Bygger på Arnsten (2009), Cook m.fl. (2018), Epstein m.fl. (2008), Gregory och Weinstein (2008), Lei m.fl. (2016), Norman m.fl. (2026), SBU (2020), SPSM (2024) och Williford m.fl. (2017)."
ramar:
  rubrik: "Materialet"
  text:
    - "De åtta delarna har en sida var. Här finns också bemötandeplanen med ett ifyllt exempel, bladet Svåra stunder vecka för vecka och bladet Vår överenskommelse. Lektionskortet är en egen fil."
  ramar:
    - rubrik: "Till läraren: de åtta delarna"
      lektioner: true
      text:
        - "Varje del har en egen sida, med när du använder den, tanken bakom, stegen, ett case där en vuxen följer dem, och varför hen gör så. Där står också vad delen har hämtat ur de fem arbetssätten: kontakt före korrigering, PBS, NVC, CPS och lågaffektivt bemötande. Casen handlar om tre elever: Elias i åk 4, Nora i åk 8 och Selma i åk 2."
      delar:
        - rubrik: "Del 1 · Bygg relationen i förväg"
          falt:
            - rubrik: "När"
              text: "Varje dag, också när inget har hänt. Börja här."
            - rubrik: "Tanken"
              text: "En elev som ofta får höra vad hen gör fel räknar med att vuxna vill något av hen. Lär känna eleven så väl att du kan förutse vad som blir svårt, och se det eleven gör som ett försvar. Du bygger relationen när du inte vill något: du hälsar, är nyfiken på det som är elevens, har roligt med eleven och kommer tillbaka också efter en dålig dag. Delad glädje gör att eleven vill vara med dig. Kraven står kvar under tiden, och relationen gör dem lättare att ta emot. Räkna med att det tar veckor, och att eleven prövar om du menar allvar."
            - rubrik: "Gör så här"
              text: "1. Hälsa med namnet varje dag. Gör det lika varmt dagen efter en svår dag: ”Hej Nora, bra att du är här.”\n2. Ha stunden två gånger i veckan. I ungefär 30 minuter väljer eleven vad ni gör, och du följer med. Ha roligt tillsammans, och gör ibland något utanför schemat. Hur den går till står under Stunden och på Lektionskortet.\n3. Ta två minuter med eleven de andra dagarna. Fråga om det som är elevens och inte om skolarbetet: ”Hur gick matchen?” Vet du inte vad eleven tycker om, lyssnar du efter det eller frågar hemmet.\n4. Säg det du ser. I stunden och de två minuterna rättar du inte, ger inga råd, ställer inga krav och tar inte upp det som har gått fel.\n5. Håll i när eleven stöter bort dig. Ett ”töntigt” betyder inte nej. Sitt kvar när eleven inte kommer, och säg utan förebråelse att du var där. Har eleven inte kommit på tre veckor, fråga vad som passar bättre."
            - rubrik: "Caset"
              kursiv: true
              text: "Nora i åk 8 lämnar lektioner när det blir för mycket, och hon litar inte på lärare. Mentorn Samir säger en måndag, när ingen annan hör: ”Tisdagar och torsdagar efter lunch har vi en halvtimme i musiksalen. Du bestämmer vad vi gör.” På tisdagen kommer hon, ser sig om och säger: ”Det här är töntigt.” Efter tre minuter går hon. ”Vi ses på torsdag”, säger Samir.\nPå torsdagen kommer hon inte. Samir sitter kvar den halvtimmen. Nästa morgon säger han i korridoren: ”Hej Nora. Jag satt där i går. Vi ses på tisdag.” Hon svarar inte. På måndagen frågar han hur det gick på matchen, som han har hört henne prata om, och får en axelryckning. Veckan efter kommer hon inte heller, och han säger samma sak.\nDen tredje veckan står hon i dörren. ”Får man spela vad man vill på den där?” säger hon och pekar på högtalaren. Hon sätter på en låt och sitter kvar. ”Den har jag inte hört. Den börjar lugnt och blir större”, säger Samir. De lyssnar på två låtar till."
            - rubrik: "Därför"
              text: "Steg 1: Hälsningen säger att Nora är väntad. När den är lika varm dagen efter att hon inte kom, säger den att han inte är sur.\nSteg 2: Stunden hänger inte på hur veckan har gått. Samir bokar den när ingen hör, så att Nora slipper förklara den för kamraterna.\nSteg 3: Det som är elevens eget är lättast att prata om.\nSteg 4: En rättelse eller ett råd hade sagt Nora att han ändå vill något av henne. Han säger något om låten, som är hennes.\nSteg 5: Nora prövar i två veckor om han ger upp. Den som slutar komma när eleven säger nej har visat att eleven hade rätt om vuxna."
            - rubrik: "Bygger på"
              text: "Kontakt före korrigering: kontakten ska finnas innan den behövs.\nPBS: hälsningen vid dörren, och uppmärksamhet som inte hänger på uppförandet.\nNVC: lyssna utan att värdera eller ge råd.\nCPS: var nyfiken på eleven, utan att rätta.\nLågaffektivt bemötande: eleven säger ja till den hen litar på."
        - rubrik: "Del 2 · Tecknet och den lugna platsen"
          ord:
            - namn: "tecknet"
              former: ["tecken"]
            - namn: "lugna platsen"
              former: ["lugna plats", "lugn plats"]
          falt:
            - rubrik: "När"
              text: "Från vecka 1. Eleven väljer och övar med dig när allt är lugnt, så att hen har något att ta till när det börjar bli för mycket."
            - rubrik: "Tanken"
              text: "Det räcker inte att eleven slutar med något. Hen behöver något att göra i stället, och det lär du ut. Eleven väljer ett tecken att visa när det börjar bli för mycket, och en lugn plats att gå till. Den lugna platsen är elevens, och ingen skickar dit eleven som straff."
            - rubrik: "Gör så här"
              text: "1. Se vad beteendet ger eleven. Slipper hen något, kommer en vuxen eller får hen det hen ville ha? Det eleven gör i stället ska ge samma sak. Är det en tur, lär du ut orden: ”Kan jag få nästa tur?” Är det en vuxen, ger hälsningen och stunden det (del 1).\n2. Låt eleven välja. Eleven väljer tecknet och den lugna platsen på träffen före start om hen är med, och annars med dig i vecka 1. Fråga: ”Vad kan du visa mig när det börjar bli för mycket? Vad blir du lugn av?” Det kan vara vatten eller tre långa utandningar. Tecknet ska gå att visa där det brukar bli svårt, också på rasten. Skriv i bemötandeplanen vem som svarar där, vem som ser eleven på den lugna platsen och hur länge hen stannar. Vill eleven inte välja än, frågar du igen när hen har börjat komma till stunden, och då övar du och eleven de två veckorna efter. Till dess gör ni vuxna som bemötandeplanen säger.\n3. Öva när allt är lugnt. I vecka 1 och 2 övar du och eleven tecknet två gånger i veckan, fem minuter åt gången, utanför stunden och när inget har hänt. Fortsätt tills eleven kan visa tecknet, gå till den lugna platsen, göra det som lugnar och komma tillbaka till samma uppgift, som du gör mindre. Öva igen efter ett lov, och påminn före det svåra: ”Kom ihåg tecknet på matten.”\n4. Svara varje gång, tyst och med samma ord: ”Gå du.” Kan du inte gå fram till eleven, nickar du. Eleven stannar den tid som är bestämd och kommer sedan tillbaka.\n5. Säg vad du såg, tyst och så som eleven tål det: ”Du visade tecknet och gick i tid.” Beskriv det eleven gjorde, utan ”duktig”. Behåll stödet också när det går bättre."
            - rubrik: "Caset"
              kursiv: true
              text: "Selma i åk 2 blir arg när hon fastnar i en uppgift, och då river hon sönder pappret. Läraren Lena ser att rivandet ger Selma en paus. När de skriver bemötandeplanen väljer Selma handen på kinden som tecken, och läshörnan blir hennes lugna plats. De övar två eftermiddagar efter skolan. Selma lägger handen på kinden, Lena säger ”Gå du”, och Selma går till läshörnan, bläddrar i en bok och kommer tillbaka.\nDagen efter lägger Selma handen på kinden mitt i svenskan. Lena ser det för sent, och pappret går i bitar. Nästa morgon säger Lena: ”Jag missade ditt tecken i går. Visa igen, så ser jag.” Samma dag ser Lena tecknet och svarar. När Selma kommer tillbaka skriver hon två meningar i stället för fem. Lena visar bara tummen, och efteråt säger hon tyst: ”Du visade tecknet och gick i tid.” Efter sex veckor räcker en nick."
            - rubrik: "Därför"
              text: "Steg 1: Rivandet gav Selma en paus, så det hon gör i stället ska också ge en paus.\nSteg 2: Tecknet ger pausen utan ord och utan att någon annan märker det.\nSteg 3: De övar när det är lugnt, för den som är uppe i varv hittar bara det övade.\nSteg 4: Eleven slutar använda ett tecken som inte får svar, så Lena säger att det var hon som missade och ber Selma visa igen.\nSteg 5: Beröm inför klassen gör Selma arg, så tummen räcker där. Meningen efteråt säger vad hon gjorde, och det kan hon göra igen."
            - rubrik: "Bygger på"
              text: "PBS: lär ut något att göra i stället, öva, påminn i förväg och säg vad du såg.\nKontakt före korrigering: uppmuntra det eleven gör, inte hur eleven är.\nNVC: säg vad eleven gjorde, utan omdöme.\nCPS: det eleven själv väljer prövar hen på allvar.\nLågaffektivt bemötande: fråga eleven vad hen blir lugn av, och öva när det är lugnt."
        - rubrik: "Del 3 · Kontakt före korrigering"
          falt:
            - rubrik: "När"
              text: "Eleven gör något annat än klassen, och du behöver säga till nu. Är du eller eleven uppe i varv, börjar du i del 5 eller del 6."
            - rubrik: "Tanken"
              text: "Innan du säger till, fråga dig om uppgiften är för svår eller om något har hänt. Eleven hör en tillsägelse rakt över klassrummet som skäll, och då försvarar hen sig i stället för att lyssna. Går du fram till eleven och får kontakt först, hör eleven vad du säger. Du har kontakt när eleven märker att du ser hur hen har det. Sedan säger du en sak att göra och går därifrån. Det tar en halv minut. Säg det med värme, gärna med humor, men aldrig med ironi."
            - rubrik: "Gör så här"
              text: "1. Gå fram till eleven. Ge först klassen något att göra, och säg ingenting över rummet. Gå nära, ner i ögonhöjd med eleven, och säg namnet tyst.\n2. Säg det du ser, och gissa hur eleven har det: ”Du har linjalen i gång. Är det svårt att sitta still nu?” Vänta på en blick, en nick eller ett svar. Är uppgiften för svår eller har något hänt, hjälper du med det först.\n3. Säg en sak att göra. Säg det eleven ska göra, inte det hen ska sluta med: ”Lägg linjalen i pennskrinet.”\n4. Gå därifrån. Protesterar eleven, svarar du kort och säger samma sak igen: ”Kanske det. Lägg linjalen i pennskrinet.” Suckar och muttrande låter du vara.\n5. Följ upp. Säg tyst ”Tack” när det är gjort. Är det inte gjort efter ett tag, går du förbi en gång till och ger ett val: ”I pennskrinet eller i bänken?” Blir det ändå inte gjort, tar du det enskilt med eleven efter lektionen. Kommer det igen dag efter dag, går du till del 8."
            - rubrik: "Caset"
              kursiv: true
              text: "Elias i åk 4 har svårt att sitta still under genomgångar, och han tycker att lärare alltid är på just honom. I dag snurrar han linjalen mot bänken så att det smattrar. Läraren Karin känner att hon vill säga ”Elias, lägg ner den!” från tavlan. Hon ber i stället klassen prata med grannen om nästa tal, går fram till Elias och sätter sig på huk. ”Elias”, säger hon tyst. ”Du har linjalen i gång. Är det svårt att sitta still nu?” Han rycker på axlarna. ”Lägg linjalen i pennskrinet.”\nElias säger högt: ”Varför är det alltid jag? Melvin pratade också!” Några vänder sig om. ”Kanske det. Lägg linjalen i pennskrinet”, säger Karin lugnt och går tillbaka till tavlan. Elias muttrar och snurrar ett varv till. En halv minut senare ligger linjalen i pennskrinet. När hon går förbi hans bänk säger hon tyst: ”Tack.”"
            - rubrik: "Därför"
              text: "Steg 1: När klassen har något att göra lyssnar ingen på Karin och Elias, och han har mindre att försvara.\nSteg 2: Elias väntar sig skäll. Frågan visar att hon ser hur han har det, och då hör han nästa mening. Linjalen ska ändå ner.\nSteg 3: Hon säger vad han ska göra. ”Sluta” säger bara vad som är fel.\nSteg 4: Hon står inte kvar, för då blir det en kamp som han måste vinna inför klassen. Samma ord håller samtalet vid linjalen, och muttrandet låter hon vara.\nSteg 5: Tacket är tyst och säger bara att hon såg. Tillsägelsen slutar i något vänligt."
            - rubrik: "Bygger på"
              text: "Kontakt före korrigering: känslan först, sedan gränsen. Att förstå är inte att hålla med.\nPBS: en kort och enskild rättelse som säger vad eleven ska göra, och ett ord när hen gör det.\nNVC: säg det du ser utan omdöme, och det du vill som något att göra.\nCPS: det som kommer igen är ett problem att lösa.\nLågaffektivt bemötande: ingen publik, få ord och ingen maktkamp."
        - rubrik: "Del 4 · Ställ krav så att eleven kan säga ja"
          falt:
            - rubrik: "När"
              text: "Du ska be om något du vet är svårt: en övergång, ett nytt arbete eller ett slut. Eller eleven sitter tyst och gör ingenting."
            - rubrik: "Tanken"
              text: "Eleven ska möta krav, och kraven står kvar. Du ändrar hur du ställer dem. Ett krav som kommer plötsligt, är för stort eller sägs som en order inför andra får ofta ett nej, och sedan handlar allt om nejet. Förbered eleven, säg en sak i taget och lämna något åt eleven att bestämma. Välj också dina krav. Allt behöver inte gälla i dag."
            - rubrik: "Gör så här"
              text: "1. Välj kravet. Bestäm vad som är viktigast just nu, och lägg resten åt sidan med flit. Säg det till de andra vuxna, så att alla ställer samma krav.\n2. Förbered eleven. Berätta vad som ska hända, och när det eleven håller på med tar slut: ”Om fem minuter går vi in.”\n3. Säg en sak, nära och vänligt, och ge två val som båda duger för dig: ”Nu går vi in. Går du med mig eller med en kompis?” Fråga inte om eleven vill.\n4. Vänta tio sekunder, och säg det en gång till med samma ord. Blir det nej eller tyst, gör du kravet mindre och ber om ett första steg som eleven brukar klara: ”Bromsa gungan, så går vi tillsammans.” ”Ta fram pennan.” Svarar eleven, med ord eller en blick, tar du inte bort kravet, också när nejet är högt.\n5. Visa att du såg. När det är gjort räcker ett tyst ”Tack” eller tummen upp. Har eleven stängt av helt, eller slår, kastar eller springer iväg, går du till del 6. Kommer nejet igen dag efter dag, går du till del 8."
            - rubrik: "Caset"
              kursiv: true
              text: "Selma i åk 2 har svårt att sluta med det hon håller på med, och rasternas slut blir ofta skrik. Arbetslaget har bestämt att kravet den här månaden är att Selma kommer in. Att stå i ledet och hänga av sig jackan får vänta. Fem minuter före ringningen går fritidspedagogen Jonas bort till gungorna: ”Selma, du gungar högt i dag. Om fem minuter går vi in.”\nNär det ringer ställer han sig bredvid gungan. ”Nu går vi in. Går du med mig eller med Tilde?” ”Nej!” skriker Selma och gungar högre. Jonas väntar. ”Nu går vi in. Med mig eller med Tilde?” ”Jag vill inte!” Han höjer inte rösten och står kvar bredvid gungan. ”Bromsa gungan, så går vi tillsammans.” Selma bromsar med fötterna, sitter kvar en stund och går sedan fem steg bakom honom. Hon kommer in sist och sätter sig vid dörren med jackan på. Jonas visar tummen upp. I dag räcker det."
            - rubrik: "Därför"
              text: "Steg 1: Kravet är att komma in. Varje krav till är ett nytt tillfälle att säga nej, så ledet och jackan får vänta en månad.\nSteg 2: Selma får veta fem minuter före att det roliga tar slut. Det som brukar få henne ur balans är att slutet kommer plötsligt.\nSteg 3: ”Nu går vi in” är en sak, sagd som något de gör tillsammans. En fråga hade gett henne ett nej att säga, och valet ger henne något att bestämma. I dag hjälper det inte, och fler val hade blivit en förhandling.\nSteg 4: Ett första steg är lättare att säga ja till. Selma skriker, men hon hör honom och svarar, så kravet står kvar. Nejet ger ingen extra gungtid.\nSteg 5: Selma tål inte beröm inför andra, så tummen är hans tack. Ett ja som blir sett är lättare att ge nästa gång."
            - rubrik: "Bygger på"
              text: "Lågaffektivt bemötande: du anpassar kravet så att eleven klarar det, med förberedelse, ett tydligt slut och tid.\nPBS: förbered, börja med något eleven brukar klara, och tacka när det är gjort.\nKontakt före korrigering: vänlig och bestämd på samma gång, med val som du kan godta.\nCPS: välj vilka krav som gäller nu, och lägg resten åt sidan med flit.\nNVC: det du ber om ska gå att göra nu, och får inte låta som ett hot."
        - rubrik: "Del 5 · Håll dig själv lugn"
          falt:
            - rubrik: "När"
              text: "Du märker att du själv går upp i varv: pulsen, käken, rösten. Läs delen i förväg, och efter en stund som du ångrar."
            - rubrik: "Tanken"
              text: "Känslor smittar åt båda hållen. En vuxen som är stressad, pratar fort och går mot eleven gör eleven mer upprörd, och en lugn vuxen gör eleven lugnare. Därför tar du hand om ditt eget lugn först. Lugnet är något du gör, och det går att öva."
            - rubrik: "Gör så här"
              text: "1. Lär känna dig själv i förväg. Vad händer i dig först: käken, axlarna, rösten? Vad får i gång dig, och vad säger du då till dig själv? Be en kollega sitta med en halv lektion ibland, räkna dina tillsägelser och vänliga ord till eleven och säga vad hen såg. Sikta på fem vänliga ord för varje tillsägelse.\n2. Stanna och andas ut. Ta tre långa utandningar innan du säger något mer. Är någon i fara, gäller skolans rutin och del 6.\n3. Tänk om. Byt ut ”Hon struntar i mig” mot ”Hon kan inte just nu. Det hon säger handlar inte om mig.”\n4. Sänk allt. Tala lägre och långsammare, med färre ord. Ta ett steg bakåt, och skjut upp resten: ”Vi pratar sedan.”\n5. Byt av när du inte hittar tillbaka, och laga efteråt. Kom överens om en signal, som ”Kan du ta över? Jag hämtar kaffe.” Är du ensam, skickar du efter den som står i bemötandeplanen. Sa du något du ångrar, säger du det till eleven nästa dag."
            - rubrik: "Caset"
              kursiv: true
              text: "Nora i åk 8 sitter för tredje lektionen i rad med luvan uppdragen och gör ingenting. Hon stör ingen. Läraren Helena har sagt till två gånger, och just tyst vägran är det som får i gång Helena mest. Hon hör sig själv säga högt: ”Nu får du faktiskt skärpa dig.” Nora tittar upp: ”Du är den sämsta läraren på hela skolan.” Klassen tystnar.\nHelena känner att det hettar i ansiktet, och att hon har höjt rösten. Hon andas ut långsamt, tre gånger. ”Hon kan inte just nu. Det hon säger handlar inte om mig”, tänker hon. Hon tar ett steg bakåt och säger lågt: ”Vi pratar sedan.” Hon fortsätter lektionen. Nora sitter kvar med luvan uppe.\nNästa morgon säger Helena i korridoren: ”Det jag sa i går var inte okej.” Nora rycker på axlarna och går. På eftermiddagen berättar Helena för mentorn Samir vad som får i gång henne, och de bestämmer att hon ringer honom nästa gång."
            - rubrik: "Därför"
              text: "Steg 1: Den som vet vad som får i gång en märker det tidigare. Helena märker det sent, men i tid för att stanna.\nSteg 2: Hon andas ut innan hon säger något mer. Svarar hon direkt, svarar hon på förolämpningen, och då är de två som trappar upp.\nSteg 3: Det är lättare att vara lugn inför en elev som inte kan än inför en som inte vill.\nSteg 4: Hon backar och skjuter upp samtalet. Nora har inget att slåss mot, och klassen ser en vuxen som hittar tillbaka.\nSteg 5: Helena trappade upp först och säger det. Hon kräver inget tillbaka, för då blir ursäkten ett nytt krav. Med Samir att ringa står hon inte ensam nästa gång."
            - rubrik: "Bygger på"
              text: "Lågaffektivt bemötande: affekt smittar, du ansvarar för din egen, och ni vuxna byter av.\nPBS: stanna upp innan du svarar, och ge fem vänliga ord för varje tillsägelse.\nKontakt före korrigering: du lugnar dig själv först och lagar dina egna misstag öppet.\nNVC: vad säger jag till mig själv, och vad behöver jag?\nCPS: eleven gör rätt när hen kan."
        - rubrik: "Del 6 · Lugna när det trappas upp"
          falt:
            - rubrik: "När"
              text: "Eleven håller på att tappa kontrollen. Har eleven redan gjort det, eller stängt av helt så att hen inte går att nå, börjar du på steg 2."
            - rubrik: "Tanken"
              text: "En elev som är uppe i varv kan inte tänka efter, välja eller ta emot en förklaring. Det som hjälper då är att det blir lugnare runt eleven: färre ord, färre krav, färre människor och en vuxen som själv är lugn. Ju tidigare du ser att det är på väg upp, desto mindre behöver du göra."
            - rubrik: "Gör så här"
              text: "1. Se när det är på väg upp, och lätta på trycket. Det ni vuxna brukar se, som att eleven trummar eller tystnar, står i bemötandeplanen. Gå nära och säg tyst det du ser: ”Du trummar hårt. Börjar det bli för mycket? Du har ditt tecken.” Du kan också sänka kravet eller ge ett ärende.\n2. Bedöm faran och hämta hjälp. Är någon i fara, gäller skolans rutin. Går eleven till sin lugna plats, eller har hen stängt av, kan klassen vara kvar. Annars lämnar de andra rummet, inte eleven. Bemötandeplanen säger vart klassen går och vem som hämtas.\n3. Gör dig liten. Backa två steg, ställ dig snett eller sätt dig. Titta inte eleven i ögonen, och stå inte i vägen till dörren eller den lugna platsen. Springer eleven ut, går en vuxen efter på avstånd.\n4. Andas ut och säg nästan ingenting. En lugn mening räcker: ”Jag är här.” Ställ inga krav, fråga inte varför och säg inget om följder. Svara inte på det eleven ropar om dig.\n5. Vänta och ta emot eleven. När eleven andas lugnare, sätter sig eller ser upp, säger du det: ”Bra att du satte dig.” Erbjud vatten och något lätt att göra. Samtalet tar du med eleven senare (del 7)."
            - rubrik: "Caset"
              kursiv: true
              text: "Elias i åk 4 har svårt med matten efter lunchrasten, och när det brister kastar han saker. I dag trummar han hårt med pennan och har lagt huvudet på armen. Läraren Karin går fram till honom och säger tyst: ”Du trummar hårt. Vill du ta soffan en stund? Annars tar vi de två första tillsammans.” Han sveper ner boken på golvet och skriker: ”Jag hatar matte!”\nKarin ser att ingen är i fara. Hon säger till klassen: ”Ta era böcker och gå in till klassen bredvid, som vi har övat. Ella och Sam hämtar Maria på fritids.” Karin backar ett par steg och sätter sig på en bänk snett från Elias, med blicken mot golvet. ”Jag är här”, säger hon. Elias sparkar till en stol och ropar att hon är dum i huvudet. Karin vill svara, men andas ut och tiger.\nEfter några minuter sjunker han ner under bordet och blir tyst. ”Bra att du satte dig”, säger Karin. Maria kommer med ett glas vatten. Elias sitter kvar under bordet med vattnet och en serietidning."
            - rubrik: "Därför"
              text: "Steg 1: Tidigt går det att nå Elias, och soffan, hans lugna plats, eller ett mindre krav kan vara nog. Nu räcker det inte, och Karin byter steg i stället för att stå på sig.\nSteg 2: Klassen går, inte Elias. Det är lättare att flytta tjugo elever än en som är i affekt, och utan publik behöver han inte vinna inför någon. Med Maria är Karin inte ensam, och de kan byta av.\nSteg 3: Avståndet, sidan och blicken mot golvet gör henne mindre hotfull.\nSteg 4: Varje ord är ett krav på att förstå och svara, och det klarar han inte nu. Svarar Karin på ”dum i huvudet”, är de två som trappar upp.\nSteg 5: Hon säger det han gjorde rätt och kräver inget mer. Resten tar de när båda är lugna."
            - rubrik: "Bygger på"
              text: "Lågaffektivt bemötande: avståndet, blicken, de få orden och att vänta.\nPBS: ett utbrott har faser, och fasen avgör vad du gör.\nKontakt före korrigering: var kvar, med få ord.\nCPS: du lägger kravet åt sidan tills vidare.\nNVC: hör vad eleven försöker säga, och ta det i del 7."
        - rubrik: "Del 7 · Laga efteråt"
          falt:
            - rubrik: "När"
              text: "Samma dag eller dagen efter en svår stund, när både du och eleven är lugna."
            - rubrik: "Tanken"
              text: "Efter en svår stund väntar sig eleven att du är arg. Det är du som tar första steget. Sedan visar du att eleven är välkommen tillbaka, hör kort hur hen ser det och låter hen ställa till rätta. Det är ett enda samtal, och det blickar framåt."
            - rubrik: "Gör så här"
              text: "1. Tänk igenom det samma dag. Vad hände precis före, vad gjorde eleven, vad fick eller slapp eleven genom det, och vad gjorde ni vuxna? Tänk på det du såg och inte på hur eleven är, och på en sak du tycker om hos eleven. Har någon blivit slagen, rädd eller kränkt, följer du skolans rutin samma dag.\n2. Välkomna eleven tillbaka och börja om. Hälsa som vanligt: ”Hej Selma. Bra att du är här.” Säg sedan enskilt: ”I går blev det svårt. I dag börjar vi om.” Gjorde du något du ångrar, säger du det.\n3. Hör elevens bild, enskilt och kort: ”Hur var det för dig?” Rätta inte. Fråga sedan: ”Vad märkte du först, innan det blev för mycket?” Säg att det är då tecknet hjälper. Har eleven få ord, ritar ni, eller så gissar du och frågar om det stämmer. Vill eleven inte prata, frågar du en annan dag.\n4. Låt eleven ställa till rätta när någon eller något har kommit till skada. Prata med den drabbade först. Fråga sedan eleven: ”Vad kan du göra så att det blir bra igen?” En handling duger, och du tvingar ingen att säga förlåt. Har eleven inget förslag, ger du två att välja mellan.\n5. Ta med en sak framåt. Fråga dig vad ni vuxna kan göra annorlunda. Ändrar ni bemötandeplanen, får alla som har den veta det. Kommer samma sak igen, går du till del 8."
            - rubrik: "Caset"
              kursiv: true
              text: "Selma i åk 2 hamnar ofta i bråk på rasterna. I går sparkade hon Alva vid gungorna. Efter skolan tänker läraren Lena igenom det: Alva hann före till gungan, Selma sparkade henne och gömde sig bakom förrådet, och rastvakten väntade en bit bort tills Selma gick in. Lena anmäler det som skolans rutin säger. Hon tänker också på att Selma gärna bär in bollarna.\nNästa morgon står Lena vid dörren. ”Hej Selma. Bra att du är här.” Först pratar hon med Alva. Sedan sätter hon sig med Selma: ”I går blev det svårt. I dag börjar vi om. Hur var det för dig?” ”Jag vet inte”, säger Selma. Lena ritar två gungor och två streckgubbar. ”Blev det trångt vid gungorna?” Selma nickar. ”Vad kan du göra så att det blir bra med Alva igen?” Selma vill inte säga förlåt. ”Hon kan få första turen”, säger hon. På rasten håller hon gungan åt Alva, och Lena ser det och nickar. En vuxen står nu vid gungorna."
            - rubrik: "Därför"
              text: "Steg 1: Lena kommer till skolan med vad som hände och inte med hur trött hon var. Bollarna påminner henne om vem Selma också är.\nSteg 2: Hon hälsar som vanligt, och klassen hör det. Selma kom beredd på skäll och får veta att hon är välkommen tillbaka.\nSteg 3: ”Jag vet inte” är inget trots. Selma har inte orden, så Lena ritar och gissar, och får en nick.\nSteg 4: Alva får sitt samtal först. Selma väljer själv hur hon ställer till rätta, och hon gör det. Ett förlåt som hon tvingas till blir bara ord.\nSteg 5: Trängseln kunde de vuxna ändra, och en vuxen vid gungorna blir en ny rad i bemötandeplanen."
            - rubrik: "Bygger på"
              text: "Kontakt före korrigering: du tar första steget och säger vad du själv kunde ha gjort annorlunda.\nPBS: välkomna eleven tillbaka som vanligt, och låt hen ställa till rätta.\nNVC: säg vad som hände utan dom, och hör vad som var viktigt för eleven.\nCPS: gör inget i dag som gör att eleven inte vill prata med dig i morgon.\nLågaffektivt bemötande: börja inte med det som gick fel, och fråga vad ni vuxna kan ändra."
        - rubrik: "Del 8 · Nå en överenskommelse"
          falt:
            - rubrik: "När"
              text: "Samma sak har hänt flera gånger. Du och eleven har 15–25 minuter i lugn och ro utanför stunden, högst tio i F–⁠3."
            - rubrik: "Tanken"
              text: "En tillsägelse löser inte det som kommer igen. Eleven vet bäst vad som är svårt. Du tar först reda på hur eleven ser det, säger sedan din oro och bjuder in eleven att hitta en lösning som fungerar för er båda."
            - rubrik: "Gör så här"
              text: "1. Välj ett problem och be om ett samtal. Säg vad som är svårt i en bestämd situation, utan att nämna beteendet: ”Jag har märkt att det är svårt att komma i gång med matten efter lunchrasten. Kan vi prata om det på onsdag?” Före det första samtalet övar du med en kollega som spelar eleven, och kollegan säger om du föreslog något för tidigt.\n2. Lyssna tills du förstår. ”Vad är det som händer?” Fråga vad, var och när, och sammanfatta det du hör. Säger eleven ”vet inte”, väntar du, eller ger två saker att välja mellan. Föreslå inget än. Kommer ni inte längre i dag, fortsätter ni en annan dag.\n3. Säg din oro i en mening: ”Det jag tänker på är att du missar matten, och att de andra blir störda.” Predika inte.\n4. Bjud in: ”Hur kan vi göra starten lättare, så att du ändå hinner med matten? Har du någon idé?” Eleven föreslår först. Har eleven ingen idé, ger du två att välja mellan. Pröva förslaget mot er båda: blir det som är svårt lättare, möter det din oro, och går det att göra?\n5. Skriv, pröva och ses igen. Skriv ner vad eleven gör, vad du gör och vilken dag ni ses, gärna på bladet Vår överenskommelse. Håller lösningen, säger du det: ”Det var din idé, och den fungerar.” Håller den inte, börjar ni om från steg 2: ”Den lösningen fungerade inte. Det är inte ditt fel. Vi hittar en ny.”"
            - rubrik: "Caset"
              kursiv: true
              text: "Elias i åk 4 har haft det svårt med matten efter lunchrasten i tre veckor. På onsdagen frågar läraren Karin honom i grupprummet vad som händer när matten börjar. ”Det är tråkigt”, säger Elias. Karin väntar. ”Är det mest rasten eller mest matten?” ”Man ska kunna första talet direkt. Och alla ser när man inte kan.”\nKarin säger sin oro och frågar om han har någon idé. ”Om jag fick vara i biblioteket först.” ”Blir det lättare med första talet då?” ”Då har de andra börjat och tittar inte.” ”Hinner du matten då?” ”Fem minuter bara.” De skriver på bladet: fem minuter i biblioteket, sedan matten.\nVeckan efter går Elias till biblioteket, men han kommer inte tillbaka. ”Den fungerade inte. Det är inte ditt fel”, säger Karin. Nu säger Elias att det är svårt att gå in när alla redan sitter. De gör första talet tillsammans före lunchen, och han går in med de andra."
            - rubrik: "Därför"
              text: "Steg 1: ”Du kastar böcker” hade fått Elias att försvara sig.\nSteg 2: ”Det är tråkigt” är ett första svar och inte hela svaret. Hade Karin nöjt sig med det, hade de löst fel problem.\nSteg 3: En mening om vad det leder till är ingen anklagelse.\nSteg 4: Elias tar en lösning som är hans egen på allvar. Karins frågor ser till att den också möter hennes oro.\nSteg 5: Biblioteket lät Elias slippa starten men gav ingen väg tillbaka in, och Karin hade ingen del i lösningen. Får Elias skulden, slutar han komma med förslag."
            - rubrik: "Bygger på"
              text: "CPS: de tre stegen i samtalet, och att gå tillbaka när lösningen inte håller.\nNVC: skilj det som är viktigt för var och en från sättet att få det.\nKontakt före korrigering: elevens bild först, och en lösning som hjälper.\nPBS: lösningen ändrar ofta ett krav eller ger eleven något att öva, och du följer upp den.\nLågaffektivt bemötande: du håller samtalet i lugnt läge, och eleven är med och tar fram lösningen."
    - rubrik: "Bemötandeplanen"
      text:
        - "Ni vuxna skriver planen på en gemensam träff runt eleven före start, och eleven är med när det går. Överst står elevens mål, svaret på frågan ”Vad blir bättre för dig om det här går bättre?”"
      huvud:
        - rubrik: "Elev och datum"
        - rubrik: "Elevens mål"
        - rubrik: "Vem har stunden, och när"
      delar:
