pabordet:
  - nr: 1
    rubrik: "Blad: Svåra stunder vecka för vecka"
    text: "Det här är ditt blad för tio veckor, ett liggande A4."
    alt: "Överst står rubriken Svåra stunder vecka för vecka och raderna Elev och Räknas av. Under rubriken står hur du fyller i bladet: räkna varje vecka de gånger eleven hamnade i affekt eller låste sig, och sätt ett kryss vid antalet. Räkna också lösningarna, när eleven visade tecknet, gick till sin lugna plats eller löste det med ord, och sätt en ring vid antalet. Sedan kommer diagrammet. Antalet i veckan går från 0 till 15 uppåt, och åt höger kommer först kolumnen Före, veckan före start, och sedan vecka 1 till 10. Nederst står förklaringen: kryss och en heldragen linje för svåra stunder, ringar och en streckad linje för lösningar."
    efter: "ram: Svåra stunder vecka för vecka"
inledning:
  - "Relationell vägledning handlar om hur du som vuxen bemöter en elev som lätt hamnar i affekt, har svårt att följa regler och ofta bråkar. Elever följer vuxna de litar på, och förtroendet bygger du genom hur du möter eleven: hur du hälsar, hur du säger till, hur du håller dig lugn när det hettar till och hur du tar första steget efteråt. Två gånger i veckan har du och eleven dessutom stunden, en halvtimme där eleven bestämmer vad ni gör. Hur du bemöter eleven står steg för steg i åtta delar, som du slår upp när du behöver dem."
  - "En elev som ofta får höra vad hen gör fel slutar lyssna på vuxna, och det hjälper inte att säga det högre. Det som får en elev att följa en vuxen är förtroendet: eleven vet att du vill hen väl, och att du menar det du säger. Du är varm och ställer krav på samma gång. Varje möte som slutar bra stärker förtroendet, och det är det du har att ta av den dag du behöver säga något som eleven inte vill höra. Tumregeln är därför att lämna varje möte med eleven med en starkare relation än när ni började. Det gäller tillsägelsen, och det gäller dagen efter ett utbrott. Klassen ser hur du bemöter eleven och tar efter, så det du gör med en elev lär du alla."
  - "Du som arbetar med eleven måste lära dig att tycka om hen och bry dig om hen, också när hen bryter mot regler eller är elak mot andra barn. Då behöver du förstå varför eleven gör som hen gör, så att du ser det komma. Mycket av det eleven gör är för att skydda sig själv. Barn som ofta hamnar i aggression ser andra som ett hot, som om de vill dem illa, och då blir våld och glåpord ett försvar. Se det inte som dålig karaktär. Det är ett symptom, och du ska hjälpa eleven att komma ifrån det."
  - "Du kan inte bara vara den som ställer krav. Eleven ska också ha roligt med dig, och ni ska kunna skratta tillsammans, så att du blir någon eleven vill vara med. Delad glädje bygger relation. Med en relation kan du påverka eleven och dela med dig av ditt lugn, och är eleven inte i affekt, vill hen göra rätt när du är där. Gör eleven mer rätt, kan du berömma, och då tål relationen också bakslagen."
  - "Relationen bygger du redan innan något har hänt. Du hälsar med namnet varje dag, lika varmt efter en svår dag. I stunden gör du och eleven något eleven väljer, som att spela eller rita, vare sig hen går i klassen eller i en särskild undervisningsgrupp. Ibland gör ni något utanför schemat: går på museum, åker pulka med två kamrater eller tar med matsäck på en utflykt."
  - "När du behöver säga till, går du fram till eleven, så att de andra inte hör eller lägger märke till er. Elias i åk 4 snurrar linjalen mot bänken under genomgången. Läraren kan säga ”Elias, lägg ner den!” från tavlan och få ”Jag gör ju inget!” tillbaka, för eleven hör en tillsägelse inför klassen som skäll. Hon ger i stället klassen något att prata om, sätter sig på huk vid hans bänk och säger tyst: ”Är det svårt att sitta still nu?” Elias rycker på axlarna. ”Lägg linjalen i pennskrinet.” Sedan går hon direkt tillbaka, och när linjalen ligger där säger hon tack. Ordningen är densamma i varje möte: först lugn, sedan kontakt, sedan vägledning. Är du eller eleven uppe i varv, hör eleven inte vad du säger, hur rätt du än har."
  - "När det hettar till börjar du med dig själv. Känslor smittar. Höjer du rösten och går nära, blir eleven mer upprörd, och är du lugn, blir eleven lugnare. Du säger lite, backar ett steg och väntar. Det som ska redas ut tar du och eleven när ni båda är lugna, för en elev i affekt kan inte tänka efter. Efteråt tar du första steget tillbaka, samma dag eller nästa. Du hälsar som vanligt, hör hur eleven såg det och låter hen ställa till rätta. Eleven väntar sig skäll och får i stället veta att hen har sin plats kvar."
  - "Kraven står kvar, men du ställer dem så att eleven kan säga ja: du förbereder eleven, säger en sak i taget och låter hen välja något inom kravet. Det som händer om och om igen löser du och eleven i ett lugnt samtal. Eleven berättar vad som är svårt, du säger din oro, och eleven föreslår en lösning, som ni gärna skriver med elevens ord på bladet Vår överenskommelse. Från start väljer eleven något att göra i stället: ett tecken att visa när det börjar bli för mycket, och en lugn plats att gå till. Det övar ni när allt är lugnt, för den som är uppe i varv hittar bara det som sitter."
  - "De åtta delarna bygger på det som fem arbetssätt är överens om. Arbetssätten är kontakt före korrigering, positivt beteendestöd (PBS), Nonviolent Communication (NVC), Greenes samarbetsbaserade problemlösning (CPS) och lågaffektivt bemötande. Bemötandet fungerar bara om alla vuxna runt eleven gör likadant. Därför träffas ni i arbetslaget före start och skriver en bemötandeplan tillsammans. Ni övar några lägen, och varannan vecka går ni tillbaka till planen och ser om ni behöver ändra något. Vi vuxna kan inte alltid påverka hur eleven beter sig. Det vi kan påverka är hur vi beter oss mot eleven."
  - "Eleverna som metoden är till för hör till dem som skolan har svårast att lyckas med, och bakslagen kommer hur väl ni vuxna än gör det här. Räkna med två steg fram och ett tillbaka. Målet är färre och kortare svåra stunder och en snabbare väg tillbaka, och en elev som vet att det finns vuxna i skolan som inte ger upp. Du för in de svåra stunderna vecka för vecka på en kurva. De blir sällan noll i en skola full av krav, men de ska bli färre. För en del barn är du en av få vuxna utanför familjen som inte ger upp. Det är skäl nog att fortsätta försöka."
upplagg:
  rubrik: "Så fungerar insatsen"
  text: "I tio veckor gör alla vuxna runt eleven likadant i varje möte: först lugn, sedan kontakt, sedan vägledning. Efter en svår stund tar den vuxne första steget tillbaka. Arbetslaget träffas före start, skriver en bemötandeplan och ser över den varannan vecka. Du som håller i insatsen har stunden två gånger i veckan, en halvtimme där eleven väljer vad ni gör. Eleven väljer ett tecken och en lugn plats och övar med dig från vecka 1. Varje fredag räknar du veckans svåra stunder och säger något bra som eleven gjorde. Efter vecka 10 ser arbetslaget om de har blivit färre och bestämmer fortsättningen."
gruppen:
  rubrik: "Vem metoden är för"
  text: "Metoden är för en elev i F–⁠9 som ofta hamnar i affekt eller stänger av, har svårt att följa regler och ofta bråkar, när anpassningarna i klassrummet inte har räckt. Är någon i fara eller kränkt, går skolans rutin före metoden. Elevhälsan är med från början. Oroar du dig för hur eleven har det hemma, eller behöver eleven vård eller en utredning, följer skolan sin rutin, och insatsen kan gå bredvid. En vuxen håller i insatsen: klassläraren eller mentorn, en speciallärare, en resurs eller en fritidspedagog. Vårdnadshavarna och de andra vuxna är med i bemötandeplanen."
principer:
  rubrik: "Tre saker att hålla fast vid"
  text: "Lugn kommer före kontakt, och kontakt före vägledning: är du eller eleven uppe i varv (del 5 och del 6), väntar tillsägelsen, samtalet och kravet, och när ni båda är lugna ställer du kravet igen på ett annat sätt. Stunden är elevens, och den ställs inte in efter en dålig dag, eftersom relationen inte får hänga på uppförandet. Första steget tillbaka tar du efter en svår stund, samma dag eller nästa (del 7), så att eleven vet att hen har sin plats kvar."
