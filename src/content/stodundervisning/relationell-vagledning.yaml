        - "Relationen byggs när du inte vill något."
      - - "Del 2\nTecknet och den lugna platsen"
        - "Från vecka 1: eleven väljer och övar när allt är lugnt."
        - "Eleven visar tecknet, och ni vuxna svarar varje gång."
      - - "Del 3\nKontakt före korrigering"
        - "Du behöver säga till, och eleven är lugn nog att höra dig."
        - "Kontakt först, sedan en sak att göra."
      - - "Del 4\nStäll krav så att eleven kan säga ja"
        - "Du ska be om något du vet är svårt, eller eleven sitter tyst och gör ingenting."
        - "Kravet står kvar. Du ändrar hur du ställer det."
      - - "Del 5\nHåll dig själv lugn"
