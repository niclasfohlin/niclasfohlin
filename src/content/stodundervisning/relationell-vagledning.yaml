          falt:
            - rubrik: "Det här fungerar, och så säger vi till"
              text: ""
            - rubrik: "Kraven nu, och det som väntar"
              text: ""
        - rubrik: "På väg upp (del 2 och 6)"
          falt:
            - rubrik: "Det som brukar bli svårt, och det vi ser"
              text: ""
            - rubrik: "Det vi gör då, och elevens tecken och lugna plats"
              text: ""
        - rubrik: "Tappat kontrollen (del 5 och 6)"
          falt:
