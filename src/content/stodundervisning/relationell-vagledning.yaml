    not: "Varje del står längre fram, under Materialet, med stegen, ett case och skälen."
  - rubrik: "Om något händer i stunden"
    plats: "efter-tidsschema"
    kolumner:
      - "Det som händer"
      - "Så gör du"
    rader:
      - - "Eleven går eller kommer inte"
        - "Sitt kvar tiden ut, och säg utan förebråelse att du var där. Har eleven inte kommit på tre veckor, fråga vad som passar bättre (del 1)."
      - - "Eleven vill prata om det som har hänt"
        - "Lyssna, och ta det som behöver lösas en annan dag."
      - - "Eleven prövar dig"
        - "Säg lugnt en gång vad som gäller, och fortsätt."
      - - "Det trappas upp"
        - "Gör som bemötandeplanen säger (del 6)."
      - - "Eleven vill inte sluta"
        - "Säg var bygget eller spelet står till nästa gång."
      - - "Du måste flytta stunden eller är borta"
        - "Säg själv den nya tiden i förväg. Är du borta, har den vuxne som står i bemötandeplanen stunden."
      - - "Eleven berättar något som oroar dig"
        - "Säg att du måste berätta det för vuxna som kan hjälpa, och följ skolans rutin samma dag."
  - rubrik: "De vuxna runt eleven: alla gör likadant"
    plats: "efter-steg"
    meny: true
    text: "Före start träffas arbetslaget, hemmet och elevhälsan runt eleven och skriver en bemötandeplan på ett A4. Du leder träffen. Börja med det som fungerar: när, var och med vem går det bra? Ta sedan det som brukar bli svårt, som uppgifter, övergångar och kamrater, utan att nämna vad eleven gör. Sedan bestämmer ni kravet nu och det som får vänta, och sist vad ni gör i de fyra lägena: en vanlig dag, på väg upp, tappat kontrollen och lugn igen. Är eleven med, väljer hen tecknet och den lugna platsen (del 2). Efter träffen övar ni i arbetslaget några lägen, med en kollega som spelar eleven: hur ni säger till, hur ni svarar på tecknet och vad ni gör när det trappas upp. Varannan vecka tar ni fram planen och frågar: gjorde vi som den säger, och behöver vi ändra något i hur vi bemöter eleven? Mallen och ett ifyllt exempel finns under Materialet."
    kolumner:
      - "Vem"
      - "Gör"
    rader:
      - - "Du som håller i insatsen"
        - "Hälsar varje dag, har stunden och pratar två minuter de andra dagarna. Övar tecknet, fyller i kurvan och tar första steget efter en svår stund. Samlar de vuxna kring planen varannan vecka."
      - - "Klassläraren"
        - "Säger till tyst och enskilt, svarar på elevens tecken och sätter eleven bredvid en kamrat som är trygg i samarbete, i en uppgift där båda behövs."
      - - "Andra lärare, fritids och vikarier"
        - "Hälsar med namnet, gör som planen säger i de fyra lägena och berättar för dig samma dag när något har hänt."
      - - "En vuxen till som eleven känner"
        - "Tar stunden när du är borta, och kommer när någon behöver bytas av."
      - - "Vårdnadshavarna"
        - "Säger vad som lugnar hemma och vad de märker innan det brister, får höra något bra varje vecka, ser kurvan och är med när planen ändras."
      - - "Elevhälsan"
        - "Är med på träffarna före start och efter vecka 10, och stödjer dig under tiden."
    not: "Klassläraren byter kamrat efter några veckor, så att ingen har uppdraget hela året. Behöver eleven öva samspelet med kamrater i en liten grupp, passar Kompissamtal."
  - rubrik: "Så anpassar du för åldern"
