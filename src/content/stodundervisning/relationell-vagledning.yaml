              text: ""
            - rubrik: "Vart klassen går, och vem som hämtas"
              text: ""
        - rubrik: "Lugn igen (del 7)"
          falt:
            - rubrik: "Så kommer eleven tillbaka"
              text: ""
            - rubrik: "Första steget tar"
              text: ""
    - rubrik: "Bemötandeplanen: Noras plan"
      text:
        - "Här är planen ifylld för Nora i åk 8, ur casen i del 1 och del 5. De vuxna skrev sina rader före start, och Noras mål, tecken och lugna plats kom till i vecka 4, när hon hade börjat komma till stunden."
      huvud:
        - rubrik: "Elev och datum"
          text: "Nora, åk 8, vecka 4"
        - rubrik: "Elevens mål"
          text: "”Att mamma slipper samtal från skolan.”"
        - rubrik: "Vem har stunden, och när"
          text: "Samir, tisdagar och torsdagar efter lunch, och han fyller i kurvan. Åsa tar stunden när han är borta."
      delar:
        - rubrik: "En vanlig dag (del 1, 3 och 4)"
          falt:
            - rubrik: "Det här fungerar, och så säger vi till"
              text: "Nora arbetar bäst när hon vet i förväg vad som ska hända, och när hon sitter nära dörren. Vi säger till enskilt, tyst vid bänken eller efter lektionen."
            - rubrik: "Kraven nu, och det som väntar"
              text: "Kravet nu är att komma in till lektionen och börja med den första uppgiften. Läxorna i engelska och att svara högt inför klassen väntar."
        - rubrik: "På väg upp (del 2 och 6)"
          falt:
            - rubrik: "Det som brukar bli svårt, och det vi ser"
              text: "Att svara högt inför klassen. Hon drar upp luvan, tystnar och slutar skriva."
            - rubrik: "Det vi gör då, och elevens tecken och lugna plats"
              text: "Vi frågar tyst om hon vill börja med något annat. Lägger Nora suddgummit på bänkens hörn, säger vi tyst ”Gå du” och frågar inget. Hon går till biblioteket i tio minuter. Vi följer inte efter, och bibliotekarien vet om det."
        - rubrik: "Tappat kontrollen (del 5 och 6)"
          falt:
            - rubrik: "Det vi gör och låter bli"
              text: "Vi håller avstånd, säger bara ”Vi pratar sedan” och fortsätter lektionen. Vi säger inte till inför klassen, ropar inte efter henne och tar inte i henne."
            - rubrik: "Vart klassen går, och vem som hämtas"
              text: "Klassen är kvar. Går Nora utan sitt tecken, går en vuxen efter på avstånd, och läraren ringer Samir, som möter henne i biblioteket."
        - rubrik: "Lugn igen (del 7)"
          falt:
            - rubrik: "Så kommer eleven tillbaka"
              text: "Hon går in genom den bakre dörren och sätter sig. Läraren nickar, och ingen säger något."
            - rubrik: "Första steget tar"
              text: "Samir hälsar nästa morgon, och den lärare som var med säger samma vecka vad hen själv kunde ha gjort annorlunda."
    - rubrik: "Svåra stunder vecka för vecka"
