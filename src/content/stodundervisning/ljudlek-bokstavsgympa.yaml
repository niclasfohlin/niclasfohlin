      text: "Eleven vet vad ordet betyder"
    - rubrik: "Ljudenliga"
      text: "En bokstav för varje ljud, som låter som den brukar"
    - rubrik: "Gruppens bokstäver"
      text: "Bara bokstäver som gruppen har haft, en gång i ordet"
uppfoljning:
  text: "Du ser i steg 4 vad eleverna klarar, och ljudkollen var tredje vecka visar samma sak för varje elev. Berätta konkret för eleven vad hen har lärt sig."
  rader:
    - nar: "Under passet"
      vad: "I steg 4 lyssnar du på dagens elever: säger eleven ljudet och inte namnet, och håller hen ljuden utan paus?"
    - nar: "Efter varje pass"
      vad: "I snabbmallen noterar du dagens elever och det som fastnade. Stryk ringen på elevens blad från ljudkollen när hen kan ljudet."
    - nar: "Var tredje vecka"
      vad: "Du gör ljudkollens uppgift 4 om bokstävernas ljud och uppgift 5 om sist och i mitten."
