grund:
  text: "Tydlig undervisning i bokstävernas ljud ihop med ljuden i ord har starkt forskningsstöd, särskilt i små grupper (Foorman m.fl., 2016; Piasta och Wagner, 2010). När eleverna övade bokstäverna för sig blev läsningen bara lite bättre (Piasta och Wagner, 2010). En rörelse med hela kroppen till varje ljud lärde barnen fler ljud än vanlig undervisning, men de läste inte ord bättre (Damsgaard m.fl., 2022). Att hålla ljuden ihop utan paus gav bättre avkodning (Gonzalez-⁠Frey och Ehri, 2021)."
  kallor: "Bygger på Damsgaard m.fl. (2022), Foorman m.fl. (2016), Gonzalez-⁠Frey och Ehri (2021) och Piasta och Wagner (2010)."
ramar:
  rubrik: "Materialet"
  text:
    - "Här finns golvbokstäverna och bokstavskorten. Bokstavskartan står i Ljudlek i grupp. Första gången drar du ett streck under gruppens bokstäver på varje karta, och ni säger vad bilderna heter i kör. Allt går att kopiera. Laminera golvbokstäverna, bokstavskorten och bokstavskartorna, som du drar strecken på."
  ramar:
    - rubrik: "Golvbokstäverna"
      text:
        - "Bokstäverna står en på varje sida, i den ordning de blir dagens ljud. Skriv ut de bokstäver som gruppen har haft, och en ny när den blir dagens ljud."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Laminera sidorna och lägg halkskydd under, så att de ligger still när eleverna kliver. Håll rörelsen trygg: påminn om lugna steg och egen tur, och låt eleverna gå i skor eller barfota, eftersom laminerade ark är hala i strumpor. Lägg gruppens bokstäver i en följd vid sidan om och hämta ordets bokstäver där. Lägg ordet rättvänt för eleverna, från vänster till höger, med ett litet mellanrum. Pilen nederst på arket pekar bort från gruppen. Ligger arket fel blir n ett u och d ett p. Gruppen sitter i en halvcirkel på den sida där bokstäverna står rätt. Den som går har ryggen mot de andra och kliver i sidled åt höger. Då står bokstäverna rätt också för hen, och n blir inte u. När du visar i steg 1 står du vänd mot eleverna, så att de ser din mun. Inget ord i Orden att gå har samma bokstav två gånger, så en utskrift räcker."
      listor:
        - rubrik: "Golvbokstäver"
          rader:
            - - "s"
              - "o"
              - "l"
            - - "a"
              - "r"
              - "m"
            - - "e"
              - "n"
              - "i"
            - - "v"
              - "t"
              - "f"
            - - "å"
              - "p"
              - "k"
            - - "d"
              - "u"
              - "b"
            - - "g"
              - "h"
              - "y"
            - - "ä"
              - "ö"
              - "j"
    - rubrik: "Bokstavskorten"
      text:
        - "Det är samma 24 kort i alla lektioner, i den ordning bokstäverna blir dagens ljud."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Skriv ut korten på tjockt papper och klipp isär dem. Håll upp kortet för dagens ljud så att alla ser det, och håll det rättvänt, eftersom u blir n och d blir p när kortet vänds upp och ned."
      listor:
        - rubrik: "Bokstavskort"
          rader:
