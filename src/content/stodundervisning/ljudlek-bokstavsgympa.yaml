exempel:
  valt:
    rubrik: "Gruppen"
    text: "sex elever i förskoleklass och åk 1, vecka 3, tre pass i veckan. Gruppen gör Bokstavsgympa för femte passet i följd, det första i raden Tre ljud att dra ut. Dagens ljud är /m/, och dagens elever är Omar och Alva."
  text:
    - "Ljudstarten. Läraren visar m: ”Det här är /m/. Mmm. Känn läpparna.” Alva säger ”emm”, och läraren svarar: ”Emm är namnet. Ljudet är mmm.”"
    - "Gå ordet. Läraren lägger sol och kliver: ”Sssooolll. Sol!” Sedan lägger hen mos, med dagens ljud först."
    - "Ormen. Eleverna går mos och sedan sol, en i taget med ryggen mot de andra, och läraren står bredvid och säger ljuden med dem. De andra säger ordet i kör. Sist säger läraren ”lll”, och alla pekar på l."
    - "Peka och säg. Paren är Alva och Elin, Omar och Noah, Leo och Mira. Elin pekar på s på kartan, och Alva säger: ”Sss, som i sol.”"
    - "Läs på golvet. Läraren lägger mal för Omar. Omar kliver och säger: ”/m/ /a/ /l/, al?” Läraren säger: ”Håll ljudet tills foten landar.” Omar går igen: ”Mmmaaalll. Mal!” Läraren berättar att en mal är en liten fjäril. Alva går mor och säger ”emm, o, ärr”. Läraren frågar: ”Hur låter den?” Alva säger mmm och går igen: ”Mmmooorrr. Mor!” Läraren säger att mor är mamma."
    - "Avslutet. Noah säger: ”Sssooolll. Sol.” Läraren säger: ”Ni höll ljuden tills foten landade, och orden kom.”"
    - "Efteråt noterar läraren: Omar gör en paus mellan ljuden men läser ordet när han håller dem. Alva säger namnet för m och r. Nästa pass tar gruppen samma rad, och dagens elever blir Leo och Elin."
fastnar:
  rubrik: "När eleven fastnar"
  text: "Vänta tre sekunder och ge minsta möjliga stöd först. Blir det många fel i gruppen, säg ordet i kör, låt sedan några elever säga det ensamma och ta samma ord minst tre gånger."
  fragaForst:
    - "Hur låter den?"
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg ordet igen, långsamt: ta bara ljudet där eleven stannade, som lll i sol."
    - "Visa hur munnen gör. Eleven tittar i spegeln och känner efter: läpparna ihop vid /m/, tungan bakom tänderna vid /l/."
    - "Gör uppgiften mindre: ta de två första bokstäverna först, so, och sedan sol."
    - "Visa med handen eller med något att flytta: för handen utan paus över bokstäverna medan eleven kliver."
    - "Säg det tillsammans, och låt eleven säga det själv efteråt: sssooolll, sol."
  motto: "Till sist går och läser eleven ordet själv."
urval:
  rubrik: "Var hittar du orden och materialet?"
  text:
    - "Golvbokstäverna står under Materialet, bokstavskartan i Ljudlek i grupp och orden i Orden att gå. Orden till ljudstarten står i Ordbanken."
    - "Egna ord går också bra, utom orden i ljudkollen och i screeningens version B."
  kravText: "Tre krav gäller egna ord:"
  krav:
