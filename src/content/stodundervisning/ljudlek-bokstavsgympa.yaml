titel: "Ljudlek: Bokstavsgympa"
undertitel: "En lektion i Ljudlek i grupp: höra, gå och säga bokstävernas ljud, för F–⁠2"
ingress: "Eleverna kliver på bokstäverna i ett ord på golvet, säger ljudet för varje bokstav från vänster till höger och läser ordet på slutet. I par pekar de på bokstavskartan och säger ljuden. Lektionen hör till Ljudlek i grupp och har samma ljudstart och avslut som de andra lektionerna."
