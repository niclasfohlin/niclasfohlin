principer:
  rubrik: "Tre saker att hålla fast vid"
  text: "Säg ljudet och inte namnet: bokstaven s låter sss. Håll ljudet tills foten landar på nästa bokstav, så att ljuden blir ett ord. Lägg ord som börjar likadant efter varandra, som mos, mor och mal, och säg inte ordet i förväg, så att eleven läser i stället för att gissa."
passrutin:
  text: "Lektionen går i fyra steg, från att du visar till att var och en gör själv."
  steg:
    - text: "Du går ett ord på golvbokstäverna och säger ljudet för varje bokstav och sedan ordet."
      fas: "Gå ordet"
    - text: "Eleverna går ordet en i taget, och de andra säger ordet i kör."
      fas: "Ormen"
    - text: "Den ena i paret pekar på bokstavskartan, och den andra säger ljudet och ett ord."
      fas: "Peka och säg"
    - text: "Dagens elever läser ett ord var på golvet, och de andra pekar på sin karta."
      fas: "Läs på golvet"
  efterPasset: "Du noterar i snabbmallen vilka av dagens elever som läste ordet utan paus, vad som fastnade, och om gruppen tar samma rad, nästa rad eller nästa lektion."
tidsschema:
  rubrik: "Ett pass på 30 minuter"
  text: "Är passet bara 20 minuter blir ljudstarten tre minuter, lektionen 15 och avslutet två. Stegen får då två, fyra, fem och fyra minuter."
  rader:
    - tid: "Före passet"
      fas: "Förberedelse"
      vad: "Lägg gruppens golvbokstäver i en följd vid sidan om, och dra ett streck under dagens ljud på kartorna när det är nytt. Ta fram bokstavskorten och speglarna. Välj ord ur Orden att gå och ord till ljudstarten ur Ordbanken. Skriv dem, paren och dagens elever i snabbmallen."
    - tid: "0–5 min"
      fas: "Ljudstart"
      vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra, som i Ljudstarten. Alla svarar samtidigt."
    - tid: "5–9 min"
      fas: "Gå ordet"
      vad: "Gå två eller tre ord ur gruppens rad. Eleverna sitter i en halvcirkel på den sida där bokstäverna står rätt."
    - tid: "9–15 min"
      fas: "Ormen"
      vad: "Ta två till fyra ord med tre eller fyra elever på varje. Den som går har ryggen mot de andra, och du står bredvid."
    - tid: "15–20 min"
      fas: "Peka och säg"
      vad: "Paren sitter kvar i halvcirkeln med en karta per par och turas om efter varje bokstav. Du går mellan paren."
    - tid: "20–25 min"
      fas: "Läs på golvet"
      vad: "Var och en av dagens elever läser ett ord som hen inte har gått. De andra pekar på sin karta."
    - tid: "25–30 min"
      fas: "Avslut"
      vad: "Var och en säger ett ord från dagens lek och vad hen gjorde med det. Du säger kort vad du hörde."
  efter: "Ett par som är klart tidigt läser ordet som ligger på golvet. Den ena säger ljuden, och den andra pekar på bokstäverna i ordning på kartan och säger ordet."
steg:
  rubrik: "Vad du gör och säger i varje steg"
  text: "Här är lärarens ord, så att du kan säga dem som de står."
  fraserRubrik: "Exempelfraser"
  rader:
    - namn: "Gå ordet"
      fraga: "Hur låter bokstäverna när jag går?"
      gor: "Lägg ett ord ur gruppens rad. Stå vänd mot eleverna och kliv i sidled från vänster sett från dem. Håll ljudet tills foten landar på nästa: sssooolll. Säg ordet och vad det betyder, och gå det två gånger till, lite fortare. Visa en gång vad en paus gör: ”/s/ /o/ /l/, ol? Nu tappade jag början.”"
      fraser:
        - "Det här är /s/. Den låter sss."
        - "Jag håller ljudet tills foten landar: sssooolll."
        - "Sol!"
    - namn: "Ormen"
      fraga: "Hur låter bokstäverna när vi går?"
      gor: "Eleverna går ordet en i taget med ryggen mot de andra, så att bokstäverna står rätt, och kliver i sidled åt höger. Stå bredvid och säg ljuden med den som går. Nästa kliver på när de andra har sagt ordet i kör. Sist säger du ett ljud, och alla pekar samtidigt på bokstaven på golvet."
      fraser:
        - "Ställ dig med ryggen mot de andra. Säg ljuden när du kliver."
        - "Vilket ord blev det? Säg det tillsammans."
        - "Mmm. Peka på bokstaven, alla samtidigt."
    - namn: "Peka och säg"
      fraga: "Hur låter den?"
      gor: "Den säkrare pekar först på en av gruppens bokstäver på kartan, och den andra säger ljudet och ett ord på ljudet. Är paret osäkert tittar de på bilden: sss, som i sol. Vid o säger du ooo, som i sol, eftersom kartans orm har kort o. Sedan säger den ena ett ljud, och den andra pekar."
      fraser:
        - "Hur låter den?"
        - "Vilken bokstav visar det ljudet?"
        - "Titta på bilden: sss, som i sol."
    - namn: "Läs på golvet"
      fraga: "Kan du läsa det själv?"
      gor: "Lägg ett ord som dagens elev inte har gått, utan att säga det. Eleven går ordet och säger ljuden och ordet. Lyssna: säger eleven ljudet och inte namnet, och håller hen ljuden utan paus? De andra pekar tyst på bokstaven på sin karta när foten landar och säger ordet i kör efteråt."
      fraser:
        - "Gå och säg ljuden. Vilket ord blev det?"
        - "Håll ljudet tills foten landar."
        - "Du sa mmm och inte emm."
