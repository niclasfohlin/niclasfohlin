tranar: "koppla ljud till bokstav med kroppen, och gå ordet från vänster till höger"
inledning:
  - "I Bokstavsgympa kliver eleverna på bokstäver på golvet, säger ljudet för varje bokstav från vänster till höger och säger ordet på slutet. Lektionen hjälper eleven med det som gör bokstävernas ljud svåra: eleven säger bokstavens namn, ess för s, och gör en paus mellan ljuden, så att början faller bort och ordet inte kommer."
  - "Syftet är att eleverna ska kunna ljuden för de bokstäver de har haft och hålla ihop ljuden till ett ord, så att de kan läsa. Du säger ljudet och inte namnet, håller ljudet tills foten landar på nästa bokstav och lägger bara ord med gruppens bokstäver."
  - "Välj Bokstavsgympa när fler än hälften av eleverna kan färre än åtta av de tio första bokstäverna på ljudkollens uppgift 4, bokstävernas ljud. Ljudkollen är den korta kartläggningen med nio uppgifter som du gör med varje elev före insatsen och var tredje vecka. Den står i Ljudlek i grupp, och Bokstavsgympa hör till förmåga 4, Bokstävernas ljud, i lektionsbanken där."
upplagg:
  rubrik: "Så används lektionen"
  text: "Passet har samma ram i alla lektioner: fem minuter ljudstart, 20 minuter lektion i fyra steg och fem minuter avslut. Ljudlek i grupp beskriver gruppen, dagens elever och ljudkollen. Bokstavsgympa går igenom raderna i Så blir lektionen svårare, oftast i fyra till sex veckor. Ta nästa rad när dagens elever läser orden utan paus två pass i följd och nästa rad har fyra ord med gruppens bokstäver. Efter raden Med klusil, eller när minst hälften kan ljudet för minst åtta av de tio första bokstäverna, går gruppen till nästa förmåga där fler än hälften inte klarar uppgiften i ljudkollen."
