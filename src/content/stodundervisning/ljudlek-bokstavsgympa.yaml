  text: "I ljudstarten svarar alla samtidigt, och i lektionen går ni från att du visar till att var och en gör själv. Paren och trion sätter du ihop som i Ljudlek i grupp. Den som ännu inte kan ljuden går efter en säker kamrat i ormen och blir dagens elev oftare."
