film:
  sekunder: 16.91
  beskrivning: "Läs ordet: kliv på bokstaven och säg ljudet. Håll ljudet tills foten landar på nästa. Håll ljudet till sista bokstaven och säg ordet. En gång till, utan paus mellan ljuden."
  rubrik: "Så gör eleven"
  ingress: "Fyra bilder ur lektionens film om vad eleven gör. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Läs ordet: kliv på bokstaven och säg ljudet."
    - text: "Håll ljudet tills foten landar på nästa bokstav."
    - text: "Håll ljudet ända till sista bokstaven: sssooolll."
    - text: "Säg ordet: sol."
