      - - "Fyra ord"
        - "Ola ror i solen. Vi vilar i solen. Elin tar mos nu. Mira målar tre hus. Vi äter mat ute. Mira har tre bär. Ali ser tre sälar."
    not: "Alla ord är ljudenliga. Säg vad ett ord betyder första gången, som ror och syr. Låt r:et höras, som i har, ser och målar, också när nästa ord börjar med s, t eller l."
