exempel:
  valt:
    rubrik: "Gruppen"
    text: "sex elever i förskoleklass och åk 1, vecka 10, tre pass i veckan. Gruppen gör Från ord till mening för tredje passet i följd, det första i raden Tre ord. Dagens ljud är /h/, och dagens elever är Mira och Omar."
  text:
    - "Ljudstarten. Läraren visar h och säger ljudet: ”Hhh.”"
    - "Meningen på tavlan. Läraren säger: ”Jag ska skriva: Vi ser solen.” Alla räknar orden medan hen lägger tre klossar. Hen skriver Vi och läser det, lämnar ett fingers mellanrum, skriver ser och läser från början: ”Vi ser.” Efter solen sätter hen punkten: ”Nu har jag sagt allt.”"
    - "Meningen ur högen. Paren är Alva och Elin, Omar och Noah, Leo och Mira. Läraren säger den andra meningen: ”Ali tar mos.” Alla säger den igen, och varje par lägger tre klossar. Omar bygger Ali. Noah bygger tar men lägger det direkt efter Ali. Omar läser från början: ”Alitar.” Noah lägger ett finger emellan och flyttar tar."
    - "Byt ett ord. Mira byter tyst mos mot mat medan Leo blundar. Leo ljudar mmmaaat och läser: ”Ali tar mat.” Mira säger: ”Ja, det står så.”"
    - "Skriv meningen. Läraren säger en ny mening: ”Vi har is.” Mira skriver alla tre orden med stor bokstav, mellanrum och punkt. Omar skriver ”vi har is.” Läraren frågar: ”Var börjar meningen?” Omar tittar i hörnet av tavlan och byter v mot ett stort V."
    - "Avslutet. Alva säger: ”Ali. Jag byggde det med stort A.”"
    - "Efteråt noterar läraren: Mira får med allt, och Omar glömmer den stora bokstaven. Nästa pass tar gruppen samma rad, och dagens elever blir Alva och Leo."
fastnar:
  rubrik: "När eleven fastnar"
  text: "Vänta tre sekunder och ge minsta möjliga stöd först. Blir det många fel i gruppen, säg ordet i kör, låt sedan några elever säga det ensamma och ta samma ord minst tre gånger."
  fragaForst:
    - "Vad hör du?"
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg ordet igen, långsamt: mmmooosss. Dra fingret under bokstäverna medan ni säger det."
    - "Visa hur munnen gör. Eleven tittar i spegeln och känner efter: läpparna är ihop vid /m/ och runda vid /o/."
    - "Gör uppgiften mindre: eleven väljer mellan två bokstäver, som e och o."
    - "Visa med handen eller med något att flytta: peka på klossen för ordet som eleven bygger, och lägg ett finger mellan orden."
    - "Säg det tillsammans, och låt eleven säga det själv efteråt: ni säger meningen i kör, och sedan säger eleven den ensam och bygger den igen."
  motto: "Till sist säger, bygger och läser eleven meningen själv."
urval:
  rubrik: "Var hittar du orden och materialet?"
  text:
    - "Meningarna du säger står i tabellen Meningarna, och bokstavskorten och arken med bokstäver att bygga med står under Materialet. Orden till ljudstarten står i Ordbanken."
    - "Egna ord går också bra, utom orden i ljudkollen och i screeningens version B."
  kravText: "Tre krav gäller egna ord:"
  krav:
    - rubrik: "Kända ord"
      text: "Eleven vet vad ordet betyder"
    - rubrik: "Ljudenliga"
      text: "En bokstav för varje ljud, som låter som den brukar"
    - rubrik: "Gruppens bokstäver"
      text: "Bara bokstäver som gruppen har haft"
uppfoljning:
  text: "Du ser i steg 4 vad eleverna klarar, och ljudkollen var tredje vecka visar samma sak för varje elev. Berätta konkret för eleven vad hen har lärt sig."
  rader:
    - nar: "Under passet"
      vad: "I steg 4 lyssnar du på dagens elever. Säger de meningen igen själva, och får de med alla ord, mellanrum, stor bokstav och punkt? Läser de det som står?"
    - nar: "Efter varje pass"
      vad: "I snabbmallen noterar du det dagens elever skrev och det som fastnade."
    - nar: "Var tredje vecka"
      vad: "Du gör ljudkollens uppgift 9 om påhittade ord, uppgift 7 om att skriva ord och uppgift 4 om bokstävernas ljud."
