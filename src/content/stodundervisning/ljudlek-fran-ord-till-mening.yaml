        - "Visa bokstaven och säg ljudet. Alla säger efter, och någon säger ett ord på ljudet. Sist säger alla ljuden för några bokstäver ni har haft."
      - - "Sätt ihop"
        - "Dra ut fem ord utan paus, med handen från vänster till höger sett från eleverna. Räkna tyst till tre och knyt handen, så säger alla ordet. Sist säger en av dagens elever ett ord ensam."
      - - "Dela upp"
        - "Säg fyra ord med olika många ljud. Alla säger ordet och sedan ljuden, med ett finger för varje, och räknar fingrarna sist. I lektionerna före Räkna ljud i banken säger du ljuden först och gruppen efter."
    not: "Säg ljudet och inte bokstavens namn, och b, d, g, k, p och t korta och utan ö. Orden tar du ur Ordbanken, och i Dela upp blandar du in ord ur de lättare ordgrupperna, så att orden har olika många ljud. Dagens ljud, dina fraser och ordgrupperna står i Ljudlek i grupp. Gruppen behåller sin ordgrupp från lektion till lektion."
  - rubrik: "Lyssna efter"
    plats: "efter-steg"
    text: "Bekräfta först det som eleven gjorde rätt, och försök sedan igen tillsammans. Skrivstrategier är ett A4 på metodens sida med strategierna för ordet och meningen, som att säga meningen igen och säga ordet långsamt, när eleverna skriver den nya meningen."
    kolumner:
      - "Det eleven gör"
      - "Det som händer"
      - "Så gör du"
    rader:
      - - "Bygger ”lr” för ler"
        - "Vokalen faller bort"
        - "”Du hörde /l/ och /r/. Vad hör du mellan dem?”"
      - - "Bygger ”Olaler.”"
        - "Orden flyter ihop"
        - "”Läs från början. Hur många ord?”"
      - - "Skriver ”ola ler”"
        - "Stor bokstav och punkt saknas"
        - "”Var börjar meningen, och var slutar den?” Peka på hörnet av tavlan om eleven inte hittar den stora bokstaven."
      - - "Lägger en kloss för varje ljud i Vi ler"
        - "Eleven räknar ljuden i stället för orden"
        - "”Säg meningen igen och lägg en kloss för varje ord: Vi, ler.”"
      - - "Börjar bygga direkt"
        - "Eleven har inte sagt meningen igen"
        - "”Vad gör du först?” Säg meningen igen och lägg klossarna tillsammans med eleven."
      - - "Läser ”Vi ler” när det ligger Vi ror"
        - "Eleven läser meningen som låg där före bytet"
        - "”Läs det som ligger, med fingret under.”"
  - rubrik: "Varianter"
    plats: "efter-urval"
    text: "Byt till en variant i samma steg när gruppen behöver något nytt."
    kolumner:
      - "Variant"
      - "Så gör ni"
      - "När den passar"
    rader:
      - - "Namnmeningar"
        - "Du säger en mening med ett namn först, och varje par byter det mot ett av sina egna namn, som ”Mira ser solen”. Den som heter så bygger namnet med stor bokstav."
        - "Steg 2, när namnen stavas som de låter"
      - - "Meningsväggen"
        - "Du skriver parens nya meningar på ett papper på väggen, och i slutet av steget läser gruppen dem i kör. Ta ned papperet före steg 4."
        - "Steg 3, när paren hinner byta många gånger"
  - rubrik: "Meningarna"
    plats: "efter-urval"
    meny: true
    text: "Här står meningarna till raderna Två ord, Tre ord och Fyra ord, i bokstävernas ordning. Ta de första meningarna som bara har bokstäver som gruppen har haft. En mening med ett namn mitt i, som ”Ola ser Lisa”, står sist i raden. Byt gärna ett namn mot namnet på någon i gruppen, när det stavas som det låter."
    kolumner:
      - "Raden"
      - "Meningarna"
    rader:
