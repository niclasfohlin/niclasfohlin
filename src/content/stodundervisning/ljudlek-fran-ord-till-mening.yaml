grund:
  text: "I åk 1 betydde det muntliga språket, arbetsminnet och stavningen mest för hur eleverna skrev (Kim och Schatschneider, 2017). Därför säger eleven meningen igen och lägger en kloss för varje ord innan hen bygger. Elever i riskzonen för läs- och skrivsvårigheter stavade och läste bättre när de fick lära sig att skriva ord ljud för ljud (Weiser och Mathes, 2011). Barn i åk 1 gjorde större framsteg i sitt eget skrivande när de skrev en text tillsammans tio minuter om dagen och turades om att hålla pennan (Roth och Guinee, 2011)."
  kallor: "Bygger på Fohlin och Wilson, Skriv! (utkommer 2027), Kim och Schatschneider (2017), Weiser och Mathes (2011) och Roth och Guinee (2011)."
ramar:
  rubrik: "Materialet"
  text:
    - "Här finns lektionskortet, bokstavskorten och arken med bokstäver att bygga med. Varje par har ett ark med små bokstäver, och två par delar ett ark med stora bokstäver och tecken. Med tolv elever blir det sex ark med små bokstäver och tre med stora. Skriv ut arken på tjockt papper, laminera dem och klipp isär bokstäverna. Klossarna är desamma som i Ord och stavelser, och du behöver fyra per elev och fyra till dig."
  ramar:
    - rubrik: "Bokstäver att bygga med"
      text:
        - "Arken har hela alfabetet, och de bokstäver som behövs mest finns flera gånger, så att paret kan bygga varje mening i Meningarna ur sin hög."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Högen"
              text: "Ta först bort de bokstäver som gruppen inte har haft. Lägg de små bokstäverna i en hög mitt på parets bänk och bred ut dem med bokstaven uppåt, så att alla bokstäver syns. Lägg de stora bokstäverna och tecknen i en liten hög mellan två par. Paret sitter bredvid varandra, så att meningen ligger rättvänd för båda. Saknas en bokstav, skriv den på en lapp."
            - rubrik: "Upp och ned"
              text: "Visa eleverna att u blir n och d blir p när bokstaven ligger upp och ned."
      listor:
        - rubrik: "Bokstäver att bygga med: små bokstäver"
          rader:
            - ["a", "a", "a", "a", "b", "c"]
            - ["d", "e", "e", "e", "e", "f"]
            - ["g", "h", "i", "i", "i", "j"]
            - ["k", "k", "l", "l", "m", "n"]
            - ["n", "o", "o", "p", "q", "r"]
            - ["r", "r", "r", "s", "s", "t"]
            - ["t", "t", "u", "v", "w", "x"]
            - ["y", "z", "å", "å", "ä", "ö"]
        - rubrik: "Bokstäver att bygga med: stora bokstäver och tecken"
          rader:
            - ["A", "A", "B", "C", "D", "D"]
            - ["E", "E", "F", "G", "H", "H"]
            - ["I", "J", "J", "K", "L", "L"]
            - ["M", "M", "N", "O", "O", "P"]
            - ["Q", "R", "S", "T", "U", "V"]
            - ["V", "W", "X", "Y", "Z", "Å"]
            - ["Ä", "Ö", ".", ".", ".", "."]
            - [".", ".", ".", ".", "?", "?"]
    - rubrik: "Bokstavskorten"
      text:
        - "Det är samma 24 kort i alla lektioner, i den ordning bokstäverna blir dagens ljud."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Skriv ut korten på tjockt papper och klipp isär dem. Håll upp kortet för dagens ljud så att alla ser det, och håll det rättvänt, eftersom u blir n och d blir p när kortet vänds upp och ned."
      listor:
        - rubrik: "Bokstavskort"
          rader:
            - ["s", "o", "l"]
            - ["a", "r", "m"]
            - ["e", "n", "i"]
            - ["v", "t", "f"]
            - ["å", "p", "k"]
            - ["d", "u", "b"]
            - ["g", "h", "y"]
            - ["ä", "ö", "j"]
kort:
  listor:
    - "Bokstavskort"
    - "Bokstäver att bygga med"
mallar: []
lektionskort:
  - text: "Lektionskortet är lektionen på ett A4: målet, rörelsen, meningarna att ta, passet med det du gör och säger, och det du lyssnar efter. Skriv ut det och ha det framför dig under passet."
film:
  sekunder: 29.56
  beskrivning: "Läraren säger: ”Vi ler.” Leo säger meningen igen och lägger en kloss per ord. Läraren säger: ”Bygg ett ord var.” Leo bygger Vi med stort V. Leo lämnar ett fingers mellanrum. Mira bygger ler och lägger punkten. Paret läser från början. Läraren säger: ”Byt ett ord.” Leo byter ler mot ror medan Mira blundar. Mira har inte hört det nya ordet. Mira läser: ”Vi ror.”"
  rubrik: "Så gör eleven"
  ingress: "De fyra bilderna är ur lektionens film, där paret bygger meningen ur högen, byter ett ord och läser den nya meningen. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Leo lägger klossarna för lärarens mening."
    - text: "Klossarna ligger kvar, och Leo bygger Vi."
    - text: "Mira bygger ler, och paret läser från början."
    - text: "Mira läser ett ord hon inte har hört."
