        - "Ola ler."
        - "Gruppen börjar här. Meningen har ett mellanrum, stor bokstav först och punkt sist."
      - - "Tre ord"
        - "Vi ser solen."
        - "Meningen har två mellanrum. Ordet i mitten är ofta kort, till exempel ser, har eller tar, och eleven glömmer det lätt."
      - - "Fyra ord"
        - "Vi vilar i solen."
        - "Meningen har tre mellanrum, och eleven har mer att hålla kvar. Säg meningen igen före varje ord, om det behövs."
      - - "Egen mening"
        - "Ola ser mos."
        - "Eleven säger en egen mening på två till fyra ord eller byter två ord i en mening ur tabellen Meningarna."
    not: "Meningarna till varje rad står under Meningarna. I raden Egen mening säger alla en egen mening: du säger din och skriver den på tavlan, paret säger sin för dig när du går mellan paren, och sist skriver var och en sin egen. Har den egna meningen ett ord som inte stavas som det låter, till exempel jag eller och, skriver du det på tavlan, och paret bygger det efter tavlan. Säger eleven bara ett ord, som Mira, svarar du: ”Mira. Vad gör Mira?”"
  - rubrik: "Ljudstarten: samma fem minuter varje pass"
