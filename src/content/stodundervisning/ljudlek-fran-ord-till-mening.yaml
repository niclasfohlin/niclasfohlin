# Metod i stödundervisning. Modellen står i methods/_mall.yaml och docs/modell.md.
# En lektion i Ljudlek i grupp, skriven i lektionsskelettet: methods/ljudlek-i-grupp/_lektion.yaml. Lektionen är den
# korta formen av Säg, skriv och läs (Niclas 2026-10-17): passet och att bygga meningar ur en hög mitt på bordet.
titel: "Ljudlek: Från ord till mening"
undertitel: "En lektion i Ljudlek i grupp: säga, bygga, skriva och läsa meningar, för F–⁠2"
ingress: "Eleverna säger en mening efter dig, lägger en kloss för varje ord och bygger den ord för ord med bokstäver ur en hög, med mellanrum, stor bokstav och punkt. Sedan byter den ena i paret ett ord, och den andra läser meningen. Lektionen hör till Ljudlek i grupp och har samma ljudstart och avslut som de andra lektionerna."
