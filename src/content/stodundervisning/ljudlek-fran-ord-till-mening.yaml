inledning:
  - "I Från ord till mening säger eleverna en mening efter dig, lägger en kloss för varje ord och bygger meningen ord för ord med lösa bokstäver ur en hög mitt på bänken. Lektionen hjälper eleven med det som gör en mening svår att skriva och läsa: eleven glömmer meningen medan hen bygger, orden flyter ihop utan mellanrum, stor bokstav och punkt faller bort, och eleven läser det hen tänkte i stället för det som står."
  - "Syftet är att eleverna ska kunna säga en kort mening, bygga den med mellanrum, stor bokstav och punkt, och läsa den, så att de kan skriva och läsa sina första meningar själva. Ditt uppdrag är att visa hur du säger, bygger och läser meningen, att låta eleverna säga den igen innan de bygger, och att låta dem läsa det som ligger, också kamratens nya ord."
  - "Välj Från ord till mening när fler än hälften av eleverna har färre än tre rätt på ljudkollens uppgift 9, där eleven läser fyra påhittade ord. Ljudkollen står i Ljudlek i grupp, och Från ord till mening hör till förmåga 9, Läsa och skriva meningar, i lektionsbanken där."
upplagg:
  rubrik: "Så används lektionen"
  text: "Passet har samma ram i alla lektioner: fem minuter ljudstart, 20 minuter lektion i fyra steg och fem minuter avslut. Ljudlek i grupp beskriver gruppen, dagens elever och ljudkollen. Från ord till mening går igenom raderna i Så blir lektionen svårare, oftast i åtta till tolv pass. Ta nästa rad när dagens elever skriver en mening själva med alla ord, mellanrum, stor bokstav och punkt, två pass i följd. Efter den sista raden gör du ljudkollens uppgift 9. Läser fler än hälften alla fyra orden, går gruppen till Säg, skriv och läs eller Läslistor i grupp. Annars tar ni de två sista raderna igen."
