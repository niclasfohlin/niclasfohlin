principer:
  rubrik: "Tre saker att hålla fast vid"
  text: "Låt eleven säga meningen igen och lägga en kloss för varje ord innan hen bygger. Klossarna ligger kvar, så att hen kan peka på dem och säga meningen igen. Eleven bygger ett ord i taget med en bokstav för varje ljud och lämnar ett fingers mellanrum, så att orden inte flyter ihop. Efter varje ord läser hen från början med fingret under, så att hen läser det som ligger och inte det hen tänkte."
passrutin:
  text: "Lektionen går i fyra steg, från att du visar till att var och en gör själv."
  steg:
    - text: "Du säger meningen, lägger klossarna och skriver den ord för ord på tavlan."
      fas: "Meningen på tavlan"
    - text: "Du säger nästa mening, och paren säger den igen, lägger klossarna och bygger den."
      fas: "Meningen ur högen"
    - text: "Den ena i paret byter tyst ett ord, och den andra läser den nya meningen."
      fas: "Byt ett ord"
    - text: "Var och en skriver en ny mening på sin whiteboardtavla och läser med fingret under."
      fas: "Skriv meningen"
  efterPasset: "Du noterar i snabbmallen vilka av dagens elever som i steg 4 fick med alla ord, mellanrum, stor bokstav och punkt, vad som fastnade, och om gruppen tar samma rad, nästa rad eller nästa lektion."
tidsschema:
  rubrik: "Ett pass på 30 minuter"
  text: "Är passet bara 20 minuter blir ljudstarten tre minuter, lektionen 15 och avslutet två. Stegen får då två, fyra, fem och fyra minuter."
  rader:
    - tid: "Före passet"
      fas: "Förberedelse"
      vad: "Lägg gruppens små bokstäver i en hög per par och de stora mellan två par. Ta fram bokstavskorten, speglarna, klossarna och whiteboardtavlorna. Skriv de stora bokstäverna som dagens meningar behöver bredvid de små i hörnet av tavlan. Fyll i snabbmallen."
    - tid: "0–5 min"
      fas: "Ljudstart"
      vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra, som i Ljudstarten. Alla svarar samtidigt."
    - tid: "5–9 min"
      fas: "Meningen på tavlan"
      vad: "Ta en mening ur raden och tänk högt medan du skriver. Gruppen räknar orden med dig."
    - tid: "9–15 min"
      fas: "Meningen ur högen"
      vad: "Paren bygger två meningar, men bara en i raden Fyra ord. Bokstäverna går tillbaka i högen, utom efter den sista. Du går mellan paren."
    - tid: "15–20 min"
      fas: "Byt ett ord"
      vad: "Den sista meningen ligger kvar, och i paret turas de om att byta ett ord tills tiden är slut. Du går mellan paren."
    - tid: "20–25 min"
      fas: "Skriv meningen"
      vad: "Lägg bokstäverna i högen och sudda meningarna på tavlan, men låt hörnet stå. Säg en ny mening ur raden. Du lyssnar på dagens elever."
    - tid: "25–30 min"
      fas: "Avslut"
      vad: "Var och en säger ett ord från dagens lek och vad hen gjorde med det. Du säger kort vad du hörde."
  efter: "Den som är klar före de andra får fyra bokstäver ur högen som blir ett ord ur Ordbanken, men i blandad ordning. Hen flyttar dem och läser tills hen hittar ett ord."
steg:
  rubrik: "Vad du gör och säger i varje steg"
  text: "Här är lärarens ord, så att du kan säga dem som de står."
  fraserRubrik: "Exempelfraser"
  rader:
    - namn: "Meningen på tavlan"
      fraga: "Hur många ord har min mening?"
      gor: "Säg meningen två gånger och lägg en kloss för varje ord. Börja med stor bokstav, skriv ett ord i taget och läs från början. Sätt punkten: ”Nu har jag sagt allt.” Ibland hoppar du över ett mellanrum med flit."
      fraser:
        - "Jag ska skriva: Ola ler."
        - "Hur många ord? Räkna med mig."
        - "Jag läser från början: Ola ler."
    - namn: "Meningen ur högen"
      fraga: "Vilket ord bygger vi nu?"
      gor: "Säg nästa mening. Alla säger den igen, och paret lägger klossarna. De bygger ett ord var, och den som väntar säger också ljuden. Båda läser från början efter varje ord. Skriv sedan meningen på tavlan, så att paren kan jämföra."
      fraser:
        - "Säg den igen och lägg klossarna."
        - "Bygg det första ordet, en bokstav för varje ljud."
        - "Läs från början med fingret under."
    - namn: "Byt ett ord"
      fraga: "Kan din kamrat läsa den?"
      gor: "Den ena byter tyst ett ord, helst det sista, medan kamraten blundar. Det nya ordet stavas som det låter. Kamraten ljudar det nya ordet med fingret under och läser meningen högt, och den som bytte säger om det stämmer."
      fraser:
        - "Byt ett ord tyst medan din kamrat blundar."
        - "Ljuda det nya ordet och läs meningen."
        - "Var det det du ville skriva?"
    - namn: "Skriv meningen"
      fraga: "Kan du skriva den själv?"
      gor: "Säg en ny mening ur raden. Var och en säger den igen, lägger klossarna, skriver meningen på sin whiteboardtavla och läser den med fingret under. Den som inte minns hur en bokstav ser ut letar upp den i högen."
      fraser:
        - "Säg den igen och lägg klossarna."
        - "Skriv ett ord i taget, med mellanrum."
        - "Läs det du har skrivit, med fingret under."
