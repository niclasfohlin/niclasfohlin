        - "3 · 28, 12 · 14, 13 · 15\nMultiplikation 2 och Division 2, sedan Multiplikation 5"
      - - "Vecka 7\nKort multiplikation och kort division"
        - "5 · 14, 69/3, 6 · 12\nMultiplikation 2 och Division 2, med rektangeln och utan den korta formen"
        - "3 · 26, 96/4, 2 · 41\nMultiplikation 3 och Division 3"
        - "4 · 236, 896/7, 2 · 341\nMultiplikation 3 och Division 3, sedan Multiplikation 4"
      - - "Vecka 8\nNollan och resten i textuppgifter"
