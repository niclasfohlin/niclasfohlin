      punkter:
        - fet: Tiobas och sifferkort.
          text: 20 ental, 15 tiostavar och 6 hundraplattor per elev, och en sats sifferkort eller NCM:s positionskort.
        - fet: Multilink.
          text: Kuber på 2 cm som går att sätta ihop, omkring 100 per elev i vecka 5–⁠8.
        - fet: Bladen och mallarna.
          text: Övningsbladen, kartläggningen, Mina lärdomar och läxan under Kursens material i metoden, och räknemattan, talrutan och talraderna i planeringsmallarna.
        - fet: Talen.
          text: Tabellen Talen och bladen i veckorna i metoden, för gruppens nivå.
      efter: Räknemattan är tre stående A4, ett per talsort. Kortet på tredje sidan ligger framför eleven.
    bordet:
      - Räknemattan, tiobas och sifferkort i vecka 1–4
      - Multilink och talrutan i vecka 5–8, sifferkort i vecka 6–7
      - Tomma talrader i vecka 1 och 4, och en lapp för talet som tas bort
      - En liten tavla, en penna och kortet per elev
      - Veckans blad
      - Mina lärdomar i elevens mapp
film:
  sekunder: 28.47
  beskrivning: "57 + 28. Skjut upp entalen. En elev säger: ”Fler än nio ental? Växla!” Tio ental blir ett tiotal. Skriv 5 och minnessiffran 1 ovanför tiotalen. Skjut upp tiotalen: 1 + 5 + 2 = 8. Åt andra hållet: 85 − 28. En elev säger: ”Räcker inte entalen? Växla!” Ett tiotal blir tio ental. Stryk åttan i 85, skriv 7 och en liten tia. Ta bort 8 ental: 15 − 8 = 7. Ta bort 2 tiotal: 7 − 2 = 5. Kvar är 57."
  rubrik: "Så gör eleven"
  ingress: "Fyra bilder ur filmen om vecka 2, pass 1. Eleven räknar 57 + 28 på räknemattan och skriver växlingen i uppställningen bredvid. Sedan räknar eleven samma tal åt andra hållet, 85 − 28, och lägger det som tas bort på den nedre raden. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "57 + 28: entalen är skjutna ihop till 15. Växla."
    - text: "Tio ental blir ett tiotal, ettan ovanför tiotalen: 85."
    - text: "Åt andra hållet: 85 − 28. Räcker inte entalen? Växla."
    - text: "Ett tiotal blir tio ental. 57 överst, 28 under linjen."
filmer:
  - nr: 2
    titel: "Åt båda hållen på talraden"
    sekunder: 29.49
    beskrivning: "58 + 27. Dra isär 27 med sifferkorten: 20 och 7. Sätt ut 58. Hoppa tiotalen först. Sedan sju: två till 80 och fem till 85. Skriv hoppen som en uträkning. Åt andra hållet: 85 − 27. Långt isär: hoppa bakåt, tiotalen först. Sedan sju: fem till 60 och två till 58. Skriv hoppen som en uträkning."
    rubrik: "Vecka 1: åt båda hållen på talraden"
    ingress: "Fyra bilder ur filmen om vecka 1. Eleven drar isär 27 med sifferkorten och räknar 58 + 27 med hopp på en tom talrad, tiotalen först. Sedan räknar eleven åt andra hållet och hoppar bakåt från 85 med samma delar, tiotalen först, eftersom 85 och 27 ligger långt isär. Filmen på metodens sida visar samma sak i rörelse."
    efter: "tabell: Så visar du de fyra räknesätten"
    stillbilder:
      - text: "Dra isär 27: 20 och 7. Först tiotalen, till 78."
      - text: "58 + 20 = 78 och 78 + 7 = 85."
      - text: "Långt isär: hoppa bakåt från 85, först 20."
      - text: "85 − 20 = 65 och 65 − 7 = 58."
  - nr: 3
    titel: "Rektangeln med multilink"
    sekunder: 29.73
    beskrivning: "Bygg rader med fyra kuber, en hel rad i taget. Tre rader med fyra är en rektangel: 3 · 4 = 12. Åt andra hållet: hur många rader med fyra? Tre, 12/4 = 3. Samma tolv kuber, andra frågan: 12 i tre rader. En kub i varje rad i taget. Fyra i varje rad: 12/3 = 4. Samma rektangel, byggd på två sätt."
    rubrik: "Vecka 5: rektangeln med multilink"
    ingress: "Fyra bilder ur filmen om vecka 5. Eleven bygger hela rader med fyra kuber och får en rektangel med sidorna 3 och 4, som visar 3 · 4 = 12 och 12/4 = 3. Sedan delar eleven samma tolv kuber i tre rader, en kub i varje rad i taget, och får fyra i varje rad, 12/3 = 4. Det blir samma rektangel. Filmen på metodens sida visar samma sak i rörelse."
    efter: "tabell: Så visar du de fyra räknesätten"
    stillbilder:
      - text: "Tre rader med fyra är en rektangel: 3 · 4 = 12."
      - text: "Hur många rader med fyra? Tre: 12/4 = 3."
      - text: "Dela i tre rader: en kub i varje rad i taget."
      - text: "Fyra i varje rad: 12/3 = 4. Samma rektangel."
