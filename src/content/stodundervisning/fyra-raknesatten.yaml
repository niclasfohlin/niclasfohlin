            - rubrik: Lyssna efter
              text: "Säger eleven ental och tiotal?\nSer eleven att talen ligger två från 300, så att 302 − 298 = 2 + 2, eller räknar hen ett och ett?\nVet eleven vad den lilla ettan är, och hur många tiotal som är kvar efter växlingen?\nMärker eleven ett orimligt svar?\nKänner eleven igen multiplikation och division i en händelse, och ser hen två divisioner i samma rektangel?"
            - rubrik: Uppgifterna och målen
              text: "Bladets uppgift 1–⁠4 och Addition, Subtraktion och Välj sätt prövar addition och subtraktion med material, talrad och uppställning. Bladets uppgift 5–⁠8 och Multiplikation och Division prövar rektangeln och de korta skrivsätten. Den lilla ettan, tiotalen efter växlingen och kakorna som blir över prövar att förklara minnessiffran, den strukna siffran och resten, och Rimlighet prövar överslaget och kontrollen åt andra hållet."
