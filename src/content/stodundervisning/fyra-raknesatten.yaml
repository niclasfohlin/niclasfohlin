    not: I vecka 4 är uppgiften en subtraktion, och åt andra hållet blir den en addition. I vecka 7 är uppgiften i pass 2 en division. På Medel och Avancerad visar du kort division en gång till innan eleverna leder uträkningen, och Bas räknar med rektangeln. I vecka 8 är uppgiften en division, och åt andra hållet multiplicerar ni och lägger till resten, som 83/4 = 20 rest 3 och 4 · 20 + 3 = 83. Repetition är uppgifter ur bladen från tidigare veckor, och i vecka 8 räknar ni en addition och en subtraktion i uppvärmningen. Ett bygge med multilink har högst omkring 100 kuber, så att kuberna räcker, och större tal ritar ni. I addition och subtraktion ritar ni tiobasen med rutor, streck och prickar i veckans andra pass och när talen är för stora för materialet. I vecka 5 är en ruta på talrutan en kub. Från vecka 6 ritar eleven också en tom rektangel utan rutor, med talen vid sidorna.

exempel:
  rubrik: "Exempel: så går ett pass till"
  valt:
    rubrik: Gruppen
    text: Sex elever i åk 5 arbetar på nivån Medel, och det är vecka 2, pass 1. Passets uppgift är 57 + 28 och åt andra hållet 85 − 28, och bladen är Addition 2 och Subtraktion 2.
  text:
    - Uppvärmningen börjar med förra veckans sista lärdom. Ines läser ur Mina lärdomar, ”På talraden hoppar vi tiotalen först”, och gruppen visar 46 + 30 + 7 med hopp på en tom talrad. Läraren säger ”Lägg 52 med sifferkorten och dra isär”, och Sara säger ”Femman är femtio”. Sedan bygger alla 52 med tiobas, och läraren säger ”Byt en tiostav mot tio ental”. Hamza säger ”Fyra tiotal och tolv ental, det är fortfarande 52”. Sist ger läraren talfakta muntligt, ”Sju plus fem. Hur tänkte du?”, och Alva svarar ”Jag tar tre från femman till sjuan, och det blir tio. Två till blir tolv”. Läraren skriver 7 + 3 + 2 = 12.
    - I genomgången berättar läraren uppgiften som en händelse, ”Ines har 57 kronor och får 28 till”, gör ett överslag, ”ungefär 60 plus 30, alltså 90”, och lägger 57 på räknemattans övre rad och 28 på den nedre. Läraren skjuter upp entalen och säger ”Femton ental. Fler än nio ental? Växla.” Läraren lägger tio ental längs en tiostav, ”lika långa”, byter dem mot staven, lägger staven bland tiotalen och skjuter upp de två tiostavarna. Bredvid skriver läraren uppställningen med den lilla ettan ovanför tiotalen, ”Ettan är staven jag bytte till. Åtta tiotal och fem ental, 85.” Sist visar läraren 57 + 28 = 715 och frågar ”En elev skrev 715. Hur kan hen ha tänkt?”
    - Sedan räknar alla samma tal åt andra hållet, 85 − 28. Läraren säger hela händelsen, ”Ines hade 57 kronor, fick 28 och har nu 85”, och döljer sedan ett tal, ”Ines har 85 kronor och fick nyss 28. Hur mycket hade hon från början?” Hamza säger ”Vi söker en del”. I varje par bygger den ena och den andra skriver. ”Vad bygger vi?” frågar läraren. Sara svarar ”Vi bygger bara 85, och 28 står på lappen”. ”Räcker entalen?” Ebbe skakar på huvudet, och paren byter en tiostav mot tio ental. De lägger det de tar bort på den nedre raden, åtta ental och två tiostavar. Melvin säger ”57 är kvar, och raderna är 85 tillsammans”.
    - I Bladet räknar eleverna bladets första uppgift, 46 + 38. Läraren går runt. Melvin har skrivit 714, och läraren frågar ”Vad betyder ettan? Var finns den på mattan?” Melvin bygger om, växlar och skriver 84. Sedan räknar eleverna uppgiften åt andra hållet, 84 − 38.
    - I Lärdomen ligger 57 + 28 = 85 och 85 − 28 = 57 bredvid varandra. ”Vilka tre tal finns i båda? Vilket är helheten?” Alva säger till sin kamrat ”85 är helheten. I plus blir tio ental ett tiotal, och i minus blir ett tiotal tio ental”, och sedan säger hon det till gruppen. Läraren skriver meningen på väggplanschen med räknesättens namn, ”I addition blir tio ental ett tiotal, och i subtraktion blir ett tiotal tio ental”, och alla skriver den i Mina lärdomar.
    - Efter passet antecknar läraren att Melvin skrev båda kolumnsummorna och växlade efter frågan, och att Ebbe ska vara först att förklara uträkningen åt andra hållet i nästa pass.

fastnar:
  rubrik: När eleven fastnar
  text: Fråga först och ge eleven ett handgrepp i taget. Fastnar flera på samma ställe, stoppar du arbetet och gör en uppgift till tillsammans.
  fragaForst:
    - Vad har du gjort hittills?
    - Visa med materialet.
  trappa:
    - Rikta elevens blick utan att säga svaret, som ”Titta på entalen” eller ”Är alla delar med?”
    - Säg frasen ”Fler än nio ental? Växla.” eller ”Räcker entalen?”
    - Gå tillbaka till materialet och skriv det eleven gör bredvid.
    - Är svaret orimligt ber du eleven läsa uppgiften högt, hitta på en räknehändelse eller räkna i huvudet.
    - Gör ett handgrepp tillsammans och låt eleven göra nästa.
  motto: Behöver du förklara länge vid bänken, behöver ni räkna mer tillsammans.

roll:
  rubrik: "Lärarens roll: visa och låt eleven göra"
  text: Du visar i genomgången, och eleven räknar själv på bladet. Däremellan, i Åt andra hållet, lämnar du över ett handgrepp i taget.
  gor:
    - Visa först och säg allt du gör, också det som känns självklart.
    - Säg talsorten varje gång, och samma fras varje gång.
    - Fråga vad eleven gör och ser.
    - Låt det ni tar bort ligga kvar på den nedre raden, så att båda uträkningarna syns.
    - Skriv elevens mening som lärdom och gör den exakt med ämnets ord.
  undvik:
    - att ge regeln innan eleven har sett den i materialet
    - att räkna åt eleven vid bänken
    - att säga att en uppgift är lätt
    - att visa flera nya sätt att räkna i samma pass
    - att säga låna om växlingen

urval:
  rubrik: Var hittar du materialet och talen?
  text:
    - Talen för varje vecka och nivå står i tabellen Talen och bladen i veckorna. Materialet och var du hittar det står i tabellen Materialet du behöver. Övningsbladen, kartläggningen, Mina lärdomar och läxan står under Kursens material, och räknemattans ark, talrutan och de tomma talraderna står i planeringsmallarna. Kortet Säg varje gång är lathundens tredje sida. Fler uppgifter tar du ur gruppens matematikbok, om de passar veckans fokus och kraven.
  kravText: "Välj passets tal så att de uppfyller tre krav:"
  krav:
    - rubrik: Samma tal åt båda hållen
      text: Uppgiften och uträkningen åt andra hållet har samma tal, så att sambandet syns
    - rubrik: Med och utan växling
      text: Blanda uppgifter med och utan växling, så att eleven avgör när det behövs
    - rubrik: Kända talfakta
      text: Välj tal där eleven kan talfakta, så att det nya får all uppmärksamhet

hem:
  rubrik: "Läxan: Åt båda hållen"
  text:
    - En gång i veckan tar eleven hem bladet Åt båda hållen, där du har skrivit veckans uppgift, som 57 + 28 = 85. Hemma skriver eleven veckans lärdom, räknar samma tal åt andra hållet, 85 − 28 = 57, ritar talen som i passet, på en talrad, med streck och prickar eller som en rektangel, hittar på en händelse och förklarar uträkningen för en vuxen. Bilden efter avsnittet visar ett ifyllt blad. Läxan tar omkring tio minuter och går hem efter veckans andra pass, och ni tar upp den i Uppvärmningen i nästa pass, i stället för talfakta. Den sista läxan tar du upp i ett tredje pass eller i kartläggningen efter kursen. Berätta för vårdnadshavarna om kursen innan den första läxan går hem.

progression:
  rubrik: Kursplanen
  text: Varje vecka har ett nytt fokus, och det nya kommer i pass 1 och 2. Vecka 1–4 är addition och subtraktion och vecka 5–8 multiplikation och division. Du tonar ut stödet, så att du först tänker högt hela vägen, sedan visar bara det nya och till sist låter eleverna leda uträkningen åt andra hållet. I vecka 4 och 8 repeterar ni också det kursen har haft. Kan flera i gruppen inte visa veckans grepp i slutet av veckan, gör ni veckan en gång till med nya tal, och kursen blir en vecka längre. Är det en elev, övar hen greppet i uppvärmningen och i ett tredje pass, om gruppen har ett, och gruppen går vidare.
  rader:
    - vecka: "1"
      fokus: Hopp på talraden, addition och subtraktion i huvudet. Tiotalen först, och i subtraktion räkna upp när talen ligger nära
      roll: Du tänker högt hela vägen och skriver hoppen som en uträkning
    - vecka: "2"
      fokus: Tio ental blir ett tiotal. Växling på räknemattan och med streck och prickar, med uppställningen bredvid
      roll: Du tänker högt hela vägen
    - vecka: "3"
      fokus: Hundratal och två växlingar, med ritad tiobas och sifferkort
      roll: Du visar det nya, och en elev tänker högt i resten av uträkningen
    - vecka: "4"
      fokus: Över nollan och välj sätt, talraden eller uppställningen. Blandad repetition
      roll: Eleverna väljer sätt och förklarar valet
    - vecka: "5"
      fokus: Rektangeln med multilink. Alla rektanglar av ett antal kuber, multiplikation, och division på två sätt med samma rektangel
      roll: Du tänker högt när du visar det nya, rektangeln
    - vecka: "6"
      fokus: Rektangeln med tiotal, den tomma rektangeln och rest med små tal
      roll: Du visar delningen vid tiotalet, och en elev tänker högt i resten av uträkningen
    - vecka: "7"
      fokus: Kort multiplikation och kort division. På nivån Bas fortsätter ni med rektangeln
      roll: Du visar kort multiplikation i pass 1 och kort division i pass 2, och en elev tänker högt med rektangeln
    - vecka: "8"
      fokus: Nollan i kvoten och resten i textuppgifter. I uppvärmningen räknar ni en addition och en subtraktion, och du delar ut kursintyget i sista passet. Kartläggningen efter görs veckan efter kursen
      roll: Eleverna leder uträkningen åt andra hållet och väljer sätt

uppfoljning:
  text: Kartläggningen visar vad eleven kan räkna och förklara, före och efter. Mina lärdomar visar elevens ord pass för pass.
  rader:
    - nar: Före kursen
      vad: Kartläggningen. Eleven räknar åtta uppgifter på sin nivå och visar och förklarar sex uppgifter. Du skriver vad eleven gör och säger.
    - nar: Efter varje pass
      vad: Din notering och elevens lärdom i Mina lärdomar.
    - nar: Vecka 4
      vad: Den blandade repetitionen visar om addition och subtraktion sitter.
    - nar: Efter kursen
      vad: Samma kartläggning veckan efter. Visa skillnaden och skriv nästa steg.

mal:
  punkter:
    - visa med material och på talraden vad som händer i addition och subtraktion, och räkna med uppställning och växling på sin nivå
    - visa en multiplikation och två divisioner i samma rektangel med en händelse till varje, och räkna med kort multiplikation och kort division på sin nivå, på nivån Bas med rektangeln
    - förklara vad minnessiffran och den strukna siffran betyder, och vad resten är
    - avgöra med ett överslag om ett svar är rimligt, och kontrollera det genom att räkna åt andra hållet

checklista:
  rubrik: Före första passet
  punkter:
    - Gör kartläggningen veckan före kursen och bestäm gruppens nivå.
    - "Skriv ut per elev: räknemattans ark, talraderna, Addition 1, Subtraktion 1, Mina lärdomar och kortet."
    - Läs vecka 1 under Kursens material i metoden, och räkna första talet åt båda hållen.
    - Sätt upp en väggplansch för lärdomarna.
    - Prata med varje elev i åk 7 om ett eget mål.

grund:
  text: Kursen följer den väg som forskningen om elever i matematiksvårigheter rekommenderar. Läraren visar och tänker högt, eleverna övar med stöd och sedan själva, och läraren kopplar materialet till bild och symbol (Fuchs m.fl., 2021). Eleven går från materialet till papperet i tre steg, först med bara materialet, sedan med materialet och varje steg antecknat och sist på papper medan hen föreställer sig materialet (McIntosh, 2008). Addition och subtraktion hör ihop, och gruppen räknar dem tillsammans (Larsson, 2011), och rektangeln är tankeredskapet för multiplikation och division, där sidorna är faktorerna och arean är produkten (Larsson, 2024). Korta repetitioner varje pass håller kunskapen kvar, och i övningen ska eleven klara omkring åtta uppgifter av tio, så att uppgifterna är lagom svåra (Rosenshine, 2012).
  kallor: Bygger på Fuchs m.fl. (2021), McIntosh (2008), Larsson (2011, 2012, 2015 och 2024), Holmberg och Kilhamn (2014), Rosenshine (2012) och Specialpedagogiska skolmyndighetens stödmaterial om att intensifiera insatser i matematik (2024).

ramar:
  rubrik: Kursens material
  text:
    - Först kommer veckorna, en sida för varje vecka med det du visar och säger. Sedan kommer kartläggningen, övningsbladen, Mina lärdomar och läxan Åt båda hållen.
    - Övningsbladen är elevens, fem för varje räknesätt, och eleven räknar i rutnätet, en siffra per ruta. Kopiera veckans blad till varje elev.
  ramar:
    # ---------------------------------------------------------------- Veckorna
    - rubrik: "Till läraren: veckorna"
      lektioner: true
      text:
        - "En sida för varje vecka, med veckans fokus överst och sist bilden På bordet, som visar materialet och skriften. Rutorna har talen för nivån Medel, och med en annan nivå säger du samma sak med talen i tabellen Talen och bladen i veckorna. Genomgången och Åt andra hållet gäller veckans första pass, och veckans vanliga fel står under Lyssna efter."
      delar:
        - rubrik: "Vecka 1 · Hopp på talraden"
          falt:
            - rubrik: "Fokus"
              text: "Eleven adderar och subtraherar i huvudet med hopp på en tom talrad, tiotalen först, och räknar upp i subtraktion när talen ligger nära."
            - rubrik: "Genomgången"
              text: "Visa och säg ”Jag ska lägga till 27. Jag lägger 27 med sifferkorten och drar isär dem, 20 och 7. Det blir mina hopp. Jag ritar en tom talrad och sätter ut 58. Först tiotalen, två hopp om tio till 68 och 78. Sedan sju, två till 80 och fem till 85. Jag skriver 58 + 20 = 78 och 78 + 7 = 85.”\nNär gruppen är säker hoppar ni tjugo på en gång."
            - rubrik: "Åt andra hållet"
              text: "Hoppa bakåt, tiotalen först, och säg ”Jag står på 85 och tar bort 27. Först tjugo, till 65. Sedan sju, fem till 60 och två till 58. Jag skriver 85 − 20 = 65 och 65 − 7 = 58.”"
            - rubrik: "Pass 2"
              text: "Visa 71 − 69 ur bladet och säg ”Talen ligger nära. Jag räknar upp från 69, ett till 70 och ett till 71. Det är två.”"
            - rubrik: "Nivåerna"
              text: "På nivån Avancerad är talen i pass 2 tiondelar, och du säger ”Sjutton tiondelar och sex tiondelar. Tre tiondelar till 2 och tre tiondelar till, 2,3.”"
            - rubrik: "Lyssna efter"
              text: "Eleven som hoppar ett steg i taget.\nEleven som räknar strecken i stället för hoppen.\nEleven som hoppar bakåt fast talen ligger nära."
        - rubrik: "Vecka 2 · Tio ental blir ett tiotal"
          falt:
            - rubrik: "Fokus"
              text: "Eleven växlar tio ental till ett tiotal i addition och ett tiotal till tio ental i subtraktion, på räknemattan och i uppställningen."
            - rubrik: "Genomgången"
              text: "Visa och säg ”Jag lägger 57 på den övre raden och 28 på den nedre. Jag skjuter upp entalen, femton. Fler än nio ental? Växla. Jag lägger tio ental längs en tiostav. De är lika långa, och jag byter dem mot staven. Staven lägger jag bland tiotalen, och sedan skjuter jag upp de två tiostavarna från den nedre raden. Åtta tiotal och fem ental, 85.”\nLägg sedan entalen med sifferkorten och säg ”Sju och åtta är femton, och femton är två kort, tiokortet och femkortet. Tiokortet går till tiotalen.”\nSkriv uppställningen och säg ”Jag börjar med entalen, för där kan det bli ett nytt tiotal. Den lilla ettan ovanför tiotalen är samma tiotal som tiokortet och staven jag bytte till.”"
            - rubrik: "Åt andra hållet"
              text: "Tänk högt när du gör det första handgreppet, ”85 − 28. Jag bygger bara 85, och 28 står på lappen. Fem ental räcker inte för att ta bort åtta, så jag byter en tiostav mot tio ental. Sju tiotal och femton ental, och det är fortfarande 85. Jag stryker åttan och skriver en sjua ovanför och en liten tia ovanför entalen.” Låt paren göra resten.\nVisa sist 85 − 28 = 63 och fråga ”Hur kan hen ha tänkt?” Räkna åt andra hållet, 63 + 28 är 91 och inte 85."
            - rubrik: "Pass 2"
              text: "Eleverna ritar talen med streck och prickar och ringar in tio prickar."
            - rubrik: "Nivåerna"
              text: "På nivån Avancerad kan det bli två växlingar redan nu, som 186 + 257, och då säger du samma fras om tiotalen, ”Fler än nio tiotal? Växla.”"
            - rubrik: "Lyssna efter"
              text: "Eleven som skriver båda summorna, som 715.\nEleven som drar det mindre talet från det större i varje kolumn, som 63."
        - rubrik: "Vecka 3 · Hundratal och två växlingar"
          falt:
            - rubrik: "Fokus"
              text: "Eleven räknar med hundratal och två växlingar, ritar tiobasen med rutor, streck och prickar och skriver uppställningen."
            - rubrik: "Uppvärmningen"
              text: "Dela upp 543 på flera sätt med tiobasen, 500 + 40 + 3, 400 + 140 + 3 och 400 + 130 + 13."
            - rubrik: "Genomgången"
              text: "Visa och säg ”Jag ritar 386 med tre rutor, åtta streck och sex prickar, och 457 under. Tretton prickar. Jag ringar in tio prickar och ritar ett streck till bland tiotalen. Fjorton streck. Fler än nio tiotal? Växla. Jag ringar in tio streck och ritar en ruta till. Det blir 843.”\nLägg 843 med sifferkorten, 800, 40 och 3 på varandra, och skriv uppställningen med båda minnessiffrorna."
            - rubrik: "Åt andra hållet"
              text: "Räkna 843 − 457 och säg ”Tre ental räcker inte för sju. Jag stryker fyran, skriver en trea ovanför och en liten tia ovanför entalen. Tretton minus sju är sex. Tre tiotal räcker inte för fem. Jag stryker åttan, skriver en sjua ovanför och en liten tia ovanför trean. Tretton tiotal minus fem tiotal är åtta tiotal. Sju hundratal minus fyra hundratal är tre hundratal. Det blir 386.”"
            - rubrik: "Nivåerna"
              text: "På nivån Avancerad skriver du 29 som 29,0, ställer upp 29,0 + 6,3 och säger ”Entalen under entalen, och kommat under kommat.”"
            - rubrik: "Lyssna efter"
              text: "Eleven som räknar med den strukna siffrans gamla värde.\nEleven som glömmer en minnessiffra, som 386 + 457 = 833.\nEleven som ställer upp talen med de första siffrorna under varandra, som 253 + 74 = 993."
        - rubrik: "Vecka 4 · Över nollan och välj sätt"
          falt:
            - rubrik: "Fokus"
              text: "Eleven växlar över nollan, som i 600 − 247, och väljer mellan talraden och uppställningen efter talen."
            - rubrik: "Genomgången"
              text: "Visa och säg ”600 − 247. Jag lägger 600 med sifferkorten, och det är ett enda kort. Det finns inga lösa tiotal och inga lösa ental att ta från. Jag växlar ett hundratal till tio tiotal och sedan ett tiotal till tio ental. Nu är det fem hundratal, nio tiotal och tio ental, och det är fortfarande 600. Tio ental minus sju är tre, nio tiotal minus fyra är fem och fem hundratal minus två är tre. Det blir 353.”\nGör växlingen med tiobasen och skriv varje ny siffra ovanför."
            - rubrik: "Åt andra hållet"
              text: "Räkna 353 + 247 med två minnessiffror och säg ”Tio ental blir ett tiotal, och tio tiotal blir ett hundratal. Det blir 600.”"
            - rubrik: "Pass 2"
              text: "Visa 701 − 698 på talraden och säg ”Talen ligger nära. Jag räknar upp från 698, två till 700 och en till. Det är tre.”\nLäs sedan en jämförelse, ”Ellen är 152 cm och Omar 147 cm. Hur mycket längre är Ellen?” Säg att subtraktion också ger skillnaden mellan två tal, och räkna upp från 147, tre till 150 och två till 152. Ellen är fem cm längre.\nI lärdomen lägger ni talraden och uppställningen för 701 − 698 bredvid varandra och frågar var det syns att talen ligger nära och vilket sätt som var kortast."
            - rubrik: "Pass 3"
              text: "Eleverna räknar 1 004 − 368 på papper, och den som tvekar ritar tiobasen."
            - rubrik: "Lyssna efter"
              text: "Eleven som räknar nollan som tio efter växlingen.\nEleven som ställer upp fast talen ligger nära. Fråga om det finns en kortare väg, men en rätt uppställning är inget fel."
        - rubrik: "Vecka 5 · Rektangeln"
          falt:
            - rubrik: "Fokus"
              text: "Eleven bygger multiplikation som en rektangel och läser samma rektangel som två slags division."
            - rubrik: "Uppvärmningen"
              text: "I pass 1 får varje par tolv kuber och frågan ”Hur många olika rektanglar kan ni bygga av alla tolv?” Paren hittar 1 · 12, 2 · 6 och 3 · 4, och en vriden rektangel räknas som samma. Elva kuber ger bara en rektangel."
            - rubrik: "Genomgången"
              text: "Visa och säg ”Fyra rader med sex stolar i varje. Hur många stolar är det? Jag bygger fyra rader med multilink, sex kuber i varje rad. Fyra gånger sex. Jag bryter isär rektangeln i två delar med två rader i varje. Två rader med sex är tolv, och tolv till är 24.”\nVrid rektangeln och säg ”Nu är det sex rader med fyra i varje. Samma kuber, 6 · 4.”"
            - rubrik: "Åt andra hållet"
              text: "Ta samma 24 kuber och berätta två händelser. ”Vi har 24 stolar och ställer sex i varje rad. Hur många rader blir det?” Sätt ihop torn med sex kuber och lägg varje torn som en rad, ”Det blir fyra rader. 24 delat med 6 är 4.”\n”Vi ställer 24 stolar i fyra lika långa rader. Hur många blir det i varje rad?” Rita fyra rader på ett papper, lägg en kub i varje rad i taget och säg ”Det blir sex i varje rad. 24 delat med 4 är 6.” Peka på 24 i båda divisionerna och säg ”Överst står alla kuberna. Det är helheten.”"
            - rubrik: "Pass 2"
              text: "Ni ritar rektangeln från hörnet vid de tjocka linjerna på talrutan, en ruta för varje kub, och skriver 24 i hörnrutan och de fyra uträkningarna bredvid. Rektanglarna kan bli gruppens multiplikationsruta på väggen."
            - rubrik: "Lyssna efter"
              text: "Eleven som bara delar ut och inte känner igen frågan hur många rader det blir.\nEleven som skriver 6/24 när hen ska dela 24 med 6."
        - rubrik: "Vecka 6 · Rektangeln med tiotal"
          falt:
            - rubrik: "Fokus"
              text: "Eleven delar rektangeln vid tiotalet, ritar den tomma rektangeln och möter rest med små tal."
            - rubrik: "Genomgången"
              text: "Visa och säg ”Jag drar isär 24 med sifferkorten, 20 och 4. Jag bygger tre rader med 24 kuber, två tiotorn och fyra kuber i varje rad. Tre gånger två tiotorn är sex tiotorn, sextio. Tre gånger fyra kuber är tolv kuber, och tio av dem sätter jag ihop till ett tiotorn. 60 + 12 = 72.”"
            - rubrik: "Åt andra hållet"
              text: "Dela ut de 72 kuberna i tre rader, tiotornen först.\nLägg sist ut 14 kuber i fyra rader, en kub i varje rad i taget, och säg ”Tre i varje rad, och två är kvar. Räcker de till en kub till i varje rad? Nej, då behövs fyra.” Skriv 14/4 = 3 rest 2 och räkna åt andra hållet, 4 · 3 + 2 = 14."
            - rubrik: "Pass 2"
              text: "Rita förra passets rektangel på talrutan, en ruta för varje kub, med ett streck efter tjugo rutor i varje rad, och skriv 3 · 24 = 3 · 20 + 3 · 4 = 60 + 12 = 72.\nRita sedan en tom rektangel utan rutor, med talen vid sidorna, och räkna åt andra hållet, ”Arean är 72 och ena sidan är 3. Vad kan jag lätt dela med tre? Sextio delat med tre är tjugo. Tolv är kvar, och tolv delat med tre är fyra. Den andra sidan är 24.”"
            - rubrik: "Nivåerna"
              text: "På nivån Avancerad delar du upp båda sidorna i tiotal och ental, 12 · 14 = 10 · 10 + 10 · 4 + 2 · 10 + 2 · 4 = 168."
            - rubrik: "Lyssna efter"
              text: "Eleven som glömmer att multiplicera en del, som 3 · 24 = 3 · 20 + 4 = 64.\nEleven som delar upp 72 i 70 och 2 och fastnar.\nEleven som får en rest som är lika stor som det hen delar med.\nEleven på nivån Avancerad som räknar tiotalen gånger tiotalen och entalen gånger entalen, som 19 · 26 = 254."
        - rubrik: "Vecka 7 · Kort multiplikation och kort division"
          falt:
            - rubrik: "Fokus"
              text: "Eleven på nivåerna Medel och Avancerad skriver kort multiplikation och kort division och förklarar minnessiffran och den lilla ettan med kuberna."
            - rubrik: "Genomgången"
              text: "Visa och säg ”3 · 26. Jag börjar med entalen. Tre gånger sex kuber är arton. Tio av dem sätter jag ihop till ett torn, och åtta är kvar. Jag skriver åtta och en liten etta ovanför tvåan. Ettan väntar tills jag har multiplicerat tiotalen. Tre gånger två tiotal är sex tiotal, och med tornet jag satte ihop blir det sju tiotal. Det blir 78.”"
            - rubrik: "Åt andra hållet"
              text: "Räkna 78/3 och tänk högt också här, ”Sju tiotal delat i tre rader är två tiotal i varje rad, och ett tiotal blir över. Jag skriver tvåan. Blir ett tiotal över? Växla. Jag bryter isär tornet till tio ental och skriver en liten etta före åttan. Arton ental delat i tre rader är sex ental i varje rad. Jag skriver sexan.” Det blir 7¹8/3 = 26.\nFråga ”Vad betyder tvåan? Vad betyder den lilla ettan?”"
            - rubrik: "Pass 2"
              text: "Uppgiften är en division, 96/4, så att du visar kort division en gång till innan eleverna leder uträkningen."
            - rubrik: "Nivåerna"
              text: "På nivån Bas räknar ni samma tal med rektangeln och skriftlig huvudräkning, utan den korta formen.\nPå nivån Avancerad lägger eleverna tresiffriga tal med sifferkorten och drar isär dem, som 4 · 236 = 4 · 200 + 4 · 30 + 4 · 6."
            - rubrik: "Lyssna efter"
              text: "Eleven som lägger till minnessiffran innan hen multiplicerar tiotalen.\nEleven som skriver 18 i entalens ruta.\nEleven som delar tiotalen och entalen var för sig och tappar tiotalet som blev över, så att 78/3 blir 22 rest 2.\nEleven på nivån Bas som glömmer en del av rektangeln."
        - rubrik: "Vecka 8 · Nollan och resten i textuppgifter"
          falt:
            - rubrik: "Fokus"
              text: "Eleven skriver nollan i kvoten och avgör i textuppgifter vad resten betyder."
            - rubrik: "Genomgången"
              text: "Visa och säg ”Jag delar 83 kuber i fyra rader. Åtta tiotorn ger två i varje rad. Tre kuber är kvar. Kan jag lägga en till i varje rad? Nej, då behövs fyra. Varje rad har 20, och tre blir över.”\nSkriv 83/4 = 20 rest 3 och säg ”Nollan står bland entalen, för raderna fick inga lösa kuber.”"
            - rubrik: "Åt andra hållet"
              text: "Multiplicera och lägg till resten, 4 · 20 + 3 = 83."
            - rubrik: "Pass 2"
              text: "Visa 176/4 i den tomma rektangeln, 160 och 16, och i den korta formen, ”Ett hundratal räcker inte till fyra rader. Jag växlar det till tio tiotal, och med de sju blir det sjutton tiotal. Sjutton tiotal delat i fyra rader är fyra tiotal i varje rad, och ett tiotal blir över. Jag växlar det till tio ental, och med de sex blir det sexton. Sexton ental delat i fyra rader är fyra i varje rad.” Skriv 17¹6/4 = 44.\nLäs sedan tre textuppgifter och fråga vad varje tal står för, ”74 elever ska åka minibuss, och det får plats 8 i varje. Hur många bussar behövs?”, ”Du har 74 kronor, och en glass kostar 8 kronor. Hur många glassar kan du köpa?” och ”Ali har 24 kort. Sara har tre gånger så många. Hur många har Sara?”"
            - rubrik: "Nivåerna"
              text: "På nivån Avancerad visar du också 832/8, ”Åtta hundratal delat i åtta rader är ett hundratal i varje rad. Tre tiotal räcker inte till åtta rader. Noll tiotal i varje rad, och nollan skrivs. Tre tiotal och två ental är 32 ental, och 32 delat i åtta rader är fyra. Det blir 104.”"
            - rubrik: "Lyssna efter"
              text: "Eleven som får en rest som är större än det hen delar med.\nEleven som tappar nollan i kvoten.\nEleven som skriver skillnaden 5 − 2 som en liten siffra före ettan i stället för tvåan, så att 215/5 blir 63.\nEleven som räknar 24 + 3 när det står ”tre gånger så många”."
