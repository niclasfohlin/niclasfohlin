# De fyra räknesätten i grupp. Källan är Niclas meddelande och styrning 2026-10-04 (intake/fyra-raknesatten.md),
# och underlaget är intaget med registret (intake/fyra-raknesatten/REGISTER.md). Analysen står i analys.md.
