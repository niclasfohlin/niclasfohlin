lathund:
  innehall: Samma tal åt båda hållen
  metoden:
    text:
      - En kurs i åtta veckor för två till tio elever i åk 3–7. Varje pass har samma grund. Du visar först och tänker högt, gruppen gör tillsammans, eleven provar själv och ni samlas kring en lärdom.
      - Ni räknar samma tal åt båda hållen, som 57 + 28 och 85 − 28. Vecka 1–4 är addition och subtraktion med tiobas och talrad, och vecka 5–8 multiplikation och division med multilink. Ni bygger i pass 1 och ritar och skriver i pass 2, och ett tredje pass befäster. Gör kartläggningen veckan före kursen.
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Räkna åt båda hållen i varje pass.
          text: Samma tal, och den andra uträkningen kontrollerar den första.
        - fet: Bygg innan ni skriver.
          text: Skriv i samma kolumner som materialet ligger i.
        - fet: Säg talsorten varje gång.
          text: Ental, tiotal och hundratal, och samma fras varje gång.
    tabell:
      rubrik: Passets fem steg · tider och fraser
      kolumner:
        - Steg
        - Exempelfraser
      rader:
        - - "1 · Uppvärmningen\n0–⁠8 min"
          - "”Läs förra lärdomen. Kan du visa den med materialet?”\n”Sju plus fem. Hur tänkte du?”"
        - - "2 · Genomgången\n8–⁠18 min"
          - "”Vad kan talen handla om?”\n”Ungefär hur mycket blir det?”"
        - - "3 · Åt andra hållet\n18–⁠30 min"
          - "”Vi räknar åt andra hållet. Vad bygger vi?”\n”Vad vet vi, och vad söker vi?”"
        - - "4 · Bladet\n30–⁠52 min"
          - "”Visa med materialet vad du gjorde.”\n”Stämmer det? Räkna åt andra hållet.”"
        - - "5 · Lärdomen\n52–⁠60 min"
          - "”Vilka tre tal finns i båda? Vilket är helheten?”\n”Säg det till din kamrat först.”"
    not: Med fler än sex elever arbetar de i fasta par, och du börjar hos paren som tvekade. Med ett udda antal arbetar tre tillsammans och turas om.
  pass:
    rubrik: "Vi kör ett pass: tio ental blir ett tiotal"
    textRubrik: Gruppen · sex elever, nivån Medel, vecka 2, pass 1
    text:
      - Läraren lägger 57 på räknemattans övre rad och 28 på den nedre och skjuter upp entalen och säger ”Femton ental. Fler än nio ental? Växla.” Läraren byter tio ental mot en tiostav, skjuter upp tiotalen och skriver uppställningen bredvid, med en liten etta ovanför tiotalen.
      - Alla räknar samma tal åt andra hållet, 85 − 28. Sara säger ”Vi bygger bara 85, och 28 står på lappen.” Paren växlar en tiostav och lägger det de tar bort på den nedre raden. Melvin säger ”57 är kvar, och raderna är 85 tillsammans.”
      - På bladet skriver Melvin 46 + 38 = 714. Läraren frågar ”Vad betyder ettan? Var finns den på mattan?” Melvin bygger om och skriver 84. Alva säger lärdomen, och läraren skriver ”I addition blir tio ental ett tiotal, och i subtraktion blir ett tiotal tio ental.”
    forberett:
      rubrik: Det jag förberedde
      text:
        - Gjort 57 + 28 och 85 − 28 med tiobas och sagt orden högt. Arken för tiotal och ental, tiobas och en lapp per elev, bladen Addition 2 och Subtraktion 2, och Mina lärdomar.
    klarTidigt: Veckans andra blad, eller uppgifter ur matematikboken som passar veckans fokus.
    schema:
      rubrik: 60 minuter, steg för steg
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Räkna 57 + 28 och 85 − 28 själv med tiobas. Lägg fram arken för tiotal och ental, tiobas, lappar, tavlor och Addition 2 och Subtraktion 2.
        - tid: 0–8
          fas: 1 · Uppvärmningen
          vad: Förra lärdomen, 52 med sifferkort och tiobas, och talfakta som sju plus fem.
        - tid: 8–18
          fas: 2 · Genomgången
          vad: Du visar 57 + 28 och tänker högt. Visa sist felet 57 + 28 = 715.
        - tid: 18–30
          fas: 3 · Åt andra hållet
          vad: Paren räknar 85 − 28. En bygger och en skriver, och de byter till nästa uppgift med samma tal, som 85 − 57.
        - tid: 30–52
          fas: 4 · Bladet
          vad: Eleven räknar 46 + 38 och vidare på bladet. Du går runt och frågar.
        - tid: 52–60
          fas: 5 · Lärdomen
          vad: 57 + 28 och 85 − 28 bredvid varandra, och 85 är helheten. Elevens mening på väggplanschen och i Mina lärdomar.
  mall:
    rubrik: Säg varje gång
    underrad: "Ett kort per elev · Namn: ______________"
    block:
      - typ: tabell
        rubrik: Säg det högt för dig själv
        kolumner:
          - När
          - Säg
        rader:
          - - Talraden
            - Ligger talen nära i subtraktion? Räkna upp. Annars tiotalen först.
          - - Addition
            - Entalen under entalen. Fler än nio ental? Växla.
          - - Subtraktion
            - Räcker inte entalen? Växla.
          - - Multiplikation
            - Hur många rader? Hur många i varje rad?
          - - Division
            - Hur många rader, eller hur många i varje rad? Blir ett tiotal över? Växla.
      - typ: not
        text: Räkna åt andra hållet, och i division lägger du till resten. Stämmer det?
