# rigg.json, tills sajten har formerna.
titel: De fyra räknesätten i grupp
undertitel: Åtta veckors kurs i liten grupp för åk 3–7, där eleverna går från tiobas och multilink till skriftlig räkning
ingress: En kurs i åtta veckor för två till tio elever i åk 3–7. Eleverna bygger, ritar och skriver talen i de fyra räknesätten tills de ser vad som händer. Läraren visar och tänker högt, gruppen gör tillsammans och eleven provar själv. I varje pass räknar gruppen samma tal åt båda hållen, plus med minus eller gånger med delat.
omrade: Matematik
arskurs:
  - F-3
  - 4-6
  - 7-9
arskursText: åk 3–7
taggar:
  - positionssystemet
  - huvudrakning
  - taluppfattning
  - intensivtraning
format:
  - liten grupp
  - par
tid: 60 minuter per pass, två till tre pass i veckan
period: Åtta veckor
grupp: Två till tio elever
material:
  - tiobas och sifferkort
  - multilink
  - räknemattan och talrutan
  - övningsblad
uppdaterad: 2026-10-05
publicerad: 2026-10-04
relaterade:
  - antalsuppfattning-i-grupp
  - brakkurs-i-grupp
utkast: false

inledning:
  - De fyra räknesätten i grupp är en kurs i åtta veckor för två till tio elever i åk 3–7, med två till tre pass på 60 minuter i veckan. Eleverna bygger talen med material, ser vad som händer i varje räknesätt och skriver det sedan med siffror, först med skriftlig huvudräkning och sedan i uppställning. Kursen är för elever som behöver stöd i att förstå växlingen och vad multiplikation och division betyder, och för elever som räknar utan att se om svaret är rimligt.
  - Varje pass följer samma grund. Läraren visar först och tänker högt. Sedan bygger, lägger och skriver gruppen tillsammans. Därefter provar eleven själv, medan läraren går runt, lyssnar och ställer klargörande frågor. På slutet samlas gruppen kring en lärdom från dagens pass.
  - Räknesätten hör ihop två och två, som två sidor av samma mynt, addition med subtraktion och multiplikation med division. Har läraren visat 57 + 28 = 85, räknar gruppen samma tal åt andra hållet, 85 − 28 = 57. Det som togs bort ligger kvar på mattans nedre rad och visar att 57 och 28 tillsammans är 85. Sedan räknar eleven själv på bladet, och en uppgift på varje blad räknar eleven också åt andra hållet.
  - I addition och subtraktion bygger eleverna med tiobas på räknemattan och räknar i huvudet med talraden. I multiplikation och division bygger de rektanglar med multilink och ritar dem på talrutan. Talen lägger de med sifferkort på varandra till 657 och drar isär till 600 + 50 + 7, så att de ser talsorterna och kan ta en talsort i taget. I veckans första pass bygger eleverna, och i det andra ritar och skriver de, så att de till sist räknar på papper och ser materialet framför sig. Ett tredje pass befäster det som ännu inte sitter. Kursen har tre nivåer, Bas, Medel och Avancerad, som skiljer sig i talen och i skrivsätten, och gruppen får den nivå som kartläggningen visar, oavsett årskurs. Kursen tar vid där Antalsuppfattning i grupp slutar, och den kan också gå som en särskild kurs i åk 7.

upplagg:
  rubrik: Så fungerar insatsen
  text: Två till tio elever träffas två till tre gånger i veckan i åtta veckor, 60 minuter per pass. Varje pass har fem steg, Uppvärmningen, Genomgången, Åt andra hållet, Bladet och Lärdomen, och gruppen räknar samma tal åt båda hållen. Vecka 1–4 gäller addition och subtraktion och vecka 5–8 multiplikation och division, och under veckan bygger, ritar och skriver eleverna. Kartläggningen veckan före och veckan efter kursen visar vad eleven kan räkna och förklara, och Mina lärdomar samlar elevens egna ord pass för pass.

gruppen:
  rubrik: Så sätter du ihop gruppen
  text: Kursen är för elever i åk 3–7 som behöver stöd i att förstå växlingen och vad multiplikation och division betyder, och i att se varför uppställningen fungerar. Eleven ska kunna bygga och läsa tal med tiobas, som i Antalsuppfattning i grupp, och den som behöver stöd i det börjar där. Gruppen har två till tio elever på samma nivå, Bas, Medel eller Avancerad, som du väljer efter kartläggningen och inte efter årskurs. Med fler än sex elever arbetar de i fasta par, och med ett udda antal arbetar tre tillsammans. I åk 7 väljer eleven själv kursen och sätter ett eget mål vid starten.

principer:
  rubrik: Tre saker att hålla fast vid
  text: Räkna samma tal åt båda hållen i varje pass. Det visar att räknesätten hör ihop, och den andra uträkningen kontrollerar den första. Bygg innan ni skriver. Det som händer på räknemattan skriver ni i samma kolumner i uppställningen, så att minnessiffran och den strukna siffran blir något eleven har sett. Säg talsorten varje gång, som fem tiotal i stället för fem, och använd samma fras varje gång, som ”Fler än nio ental? Växla.”

passrutin:
  text: Varje pass har samma grund, efter en kort uppvärmning. Du visar passets första uppgift och tänker högt, gruppen räknar samma tal åt andra hållet, eleven räknar själv på bladet, och till sist samlas ni kring en lärdom. I veckans första pass bygger eleverna med materialet, och i det andra ritar och skriver de. Allt nytt kommer i de två passen. I ett tredje pass skriver eleverna med materialet i asken och tar upp det som ännu inte sitter, och den som tvekar tar fram materialet igen.
  steg:
    - text: En elev läser förra passets lärdom, och gruppen gör en uppgift som visar den. Sedan lägger eleverna ett tal med sifferkorten, bygger det och växlar, och sist ger du talfakta muntligt.
      fas: Uppvärmningen
    - text: Läraren visar veckans räknesätt med passets första uppgift och tänker högt. Eleverna tittar och svarar på frågor.
      fas: Genomgången
    - text: Alla räknar samma tal åt andra hållet. I paret bygger den ena och den andra skriver, ett handgrepp i taget.
      fas: Åt andra hållet
    - text: Eleven räknar vidare på veckans blad, och en uppgift på varje blad räknar eleven också åt andra hållet. Läraren går runt, lyssnar och ställer klargörande frågor.
      fas: Bladet
    - text: Ni lägger de två uträkningarna bredvid varandra. Eleverna säger dagens lärdom, och alla skriver den i Mina lärdomar.
      fas: Lärdomen
  efterPasset: Läraren antecknar vem som kunde förklara växlingen och räkna åt andra hållet, och vad läraren ska visa igen nästa pass.

tidsschema:
  rubrik: Ett pass på 60 minuter
  text: Förbered dig genom att räkna passets första uppgift åt båda hållen med materialet, eller med en bild när talen är för stora, och säga varje handgrepp högt. Remsan visar när du leder, när alla arbetar tillsammans och när eleven provar själv. Bladet får längst tid.
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: Välj passets tal för gruppens nivå i tabellen Talen och bladen i veckorna, och räkna dem själv medan du säger handgreppen högt. Lägg fram veckans material ur tabellen Materialet du behöver, veckans blad och elevernas Mina lärdomar.
    - tid: 0–8 min
      fas: Uppvärmningen
      vad: Låt en elev läsa förra lärdomen och gör en uppgift som visar den. I det första passet bygger ni i stället ett tal ur kartläggningen. Säg ett tal som alla lägger med sifferkorten, drar isär och bygger, och låt dem växla. I vecka 5–8 bygger de med multilink, och korten är med i vecka 6–7. Ge sedan fyra till sex talfakta muntligt, låt eleverna tänka tyst och skriv en elevs tanke som en uträkning. Den dag ni tar upp läxan gör ni det i stället för talfakta.
    - tid: 8–18 min
      fas: Genomgången
      vad: Berätta passets första uppgift som en kort händelse, gör ett överslag och räkna sedan uppgiften framför eleverna med materialet och skriften bredvid. Säg allt du gör och fråga gruppen under tiden. Visa sist veckans vanliga fel.
    - tid: 18–30 min
      fas: Åt andra hållet
      vad: Räkna samma tal åt andra hållet och led ett handgrepp i taget. Paren byter roller till nästa uppgift med samma tal, som 85 − 57, så att båda har byggt. Gör en uppgift till om någon behöver mer än en påminnelse.
    - tid: 30–52 min
      fas: Bladet
      vad: Låt eleven räkna vidare på veckans blad. Gå runt, stanna högst en halv minut hos varje elev och be eleven berätta vad hen gör. Med fler än sex elever börjar du hos de par som tvekade.
    - tid: 52–60 min
      fas: Lärdomen
      vad: Visa båda uträkningarna och fråga vilket tal som är helheten. I addition och subtraktion är de andra två talen delarna, och i multiplikation och division antalet rader och antalet i varje rad. Paren säger en mening, en elev säger den till gruppen, och du skriver den på väggplanschen. Alla skriver lärdomen i Mina lärdomar.
  efter: Blir en elev klar med bladet tar hen veckans andra blad, eller uppgifter ur matematikboken som passar veckans fokus.

steg:
  rubrik: Vad du gör och säger i varje steg
  text: Fraserna gäller addition och subtraktion, utom den sista i Uppvärmningen. I multiplikation och division frågar du efter raderna och antalet i varje rad, som i tabellen Så visar du de fyra räknesätten.
  rader:
    - namn: Uppvärmningen
      fraga: Vad lärde vi oss förra gången?
      gor: Låt en elev läsa förra lärdomen ur Mina lärdomar och gör en uppgift som visar den. I det första passet finns ingen lärdom än, och då bygger ni ett tal ur kartläggningen. Säg sedan ett tal som eleverna lägger med sifferkorten, drar isär och bygger, och låt dem växla. Ge fyra till sex talfakta muntligt i dagens par av räknesätt. Eleverna tänker tyst, och du frågar hur de tänkte och skriver tanken som en uträkning, som 7 + 3 + 2 = 12. I vecka 1–4 är två av talfakta uppdelningar som eleverna behöver till dagens hopp, som ”Åtta är tre och hur mycket?” och ”77, hur långt till 80?” I vecka 5–8 bygger eleverna talet med multilink och tar sifferkorten bara i vecka 6–7, och talfakta tar du ur tabellerna de kan. Tanken ritar du som en delad rektangel med uträkningen bredvid, som 7 · 6 = 5 · 6 + 2 · 6.
      fraser:
        - Läs förra lärdomen. Kan du visa den med materialet?
        - Lägg 52 med sifferkorten och dra isär. Vad är femman värd?
        - Bygg 52. Byt en tiostav mot tio ental. Vilket tal är det nu?
        - Sju plus fem. Hur tänkte du?
        - Sju plus fem är tolv. Vilka två subtraktioner vet vi då?
        - Sex gånger fyra är 24. Vilka två divisioner vet vi då?
    - namn: Genomgången
      fraga: Vad gör jag, och vad ser ni?
      gor: Börja med en kort händelse och ett överslag. Gör sedan passets första uppgift framför eleverna och säg allt du gör, vad du lägger, var du lägger det, vad du växlar och vad du skriver. Fråga gruppen under tiden, men gör handgreppen själv. Visa sist veckans vanliga fel och fråga hur eleven kan ha tänkt.
      fraser:
        - Vad kan talen handla om?
        - Ungefär hur mycket blir det?
        - Fler än nio ental? Växla.
        - Den lilla ettan är tiotalet jag växlade till. Var finns det på mattan?
        - En elev skrev 57 + 28 = 715. Hur kan hen ha tänkt?
    - namn: Åt andra hållet
      fraga: Kan vi räkna det åt andra hållet tillsammans?
      gor: Säg först hela händelsen med alla tre talen, som ”Ines hade 57 kronor, fick 28 och har nu 85”. Dölj sedan ett tal, som ”Ines har 85 kronor och fick nyss 28. Hur mycket hade hon från början?”, och fråga om ni söker helheten eller en del. Räkna sedan samma tal åt andra hållet med hela gruppen, ett handgrepp i taget. I paret bygger eller ritar den ena och den andra skriver, och till nästa uppgift med samma tal byter de, så att båda har byggt. Med ett udda antal arbetar tre tillsammans och turas om. Vänta tills alla är klara innan nästa handgrepp, och låt alla svara på tavlan eller i kör. Gå vidare till Bladet när varje elev gör nästa handgrepp rätt med högst en påminnelse och kan säga varför, som varför ni växlar eller vad raderna i rektangeln betyder.
      fraser:
        - Vi räknar åt andra hållet. Vad bygger vi?
        - Räcker entalen?
        - Skrivaren, vad skriver du nu?
        - Lägg det ni tar bort på den nedre raden. Vilket tal blir raderna tillsammans?
        - Samma händelse åt andra hållet. Söker vi helheten eller en del?
    - namn: Bladet
      fraga: Kan du göra det själv?
      gor: Eleven räknar vidare på bladet, med materialet på bordet, och en uppgift på varje blad räknar eleven också åt andra hållet. Gå runt, stanna högst en halv minut hos varje elev, lyssna och ställ klargörande frågor. Fråga vad eleven gör och ser, och har eleven räknat fel, låt hen hitta felet själv. Den som fastnar medan du är hos någon annan markerar var hen fastnade och visar sitt senaste säkra steg med materialet. Gör flera samma fel, stoppar du arbetet och gör en uppgift till med gruppen.
      fraser:
        - Var behöver du växla? Hur ser du det innan du räknar?
        - Visa med materialet vad du gjorde.
        - Vad betyder den lilla ettan?
        - Hur många tiotal är kvar nu?
        - Stämmer det? Räkna åt andra hållet.
    - namn: Lärdomen
      fraga: Vad såg vi i dag?
      gor: Lägg de två uträkningarna med svaren bredvid varandra och fråga vilka tre tal som finns i båda och vilket som är helheten. I 57 + 28 = 85 sökte ni helheten och i 85 − 28 = 57 en del. I multiplikation och division är helheten alla kuberna, och de andra två talen är antalet rader och antalet i varje rad. En rest står med i båda, som i 83/4 = 20 rest 3 och 4 · 20 + 3 = 83. Paren säger en mening till varandra, och en elev säger den till gruppen. Skriv elevens mening på väggplanschen och gör den exakt med ämnets ord. Alla skriver lärdomen i Mina lärdomar, med egna ord eller som på planschen, och den som behöver ritar den eller säger den medan du skriver. Sist säger du vad nästa pass handlar om.
      fraser:
        - Vilka tre tal finns i båda? Vilket är helheten?
        - Säg det till din kamrat först.
        - Hur skriver vi det, så att vi minns det nästa pass?
        - I dag såg vi att tio ental blir ett tiotal.

arbetsform:
  rubrik: "Arbetsform: tillsammans, jag gör, vi gör, du gör, vi samlas"
  text: Passet går från läraren till eleven och tillbaka till gruppen.
  delar:
    - rubrik: 1. Tillsammans
      text: Alla svarar, och läraren frågar och skriver
      faser:
        - Uppvärmningen
    - rubrik: 2. Jag gör
      text: Läraren gör och tänker högt, eleverna tittar och svarar
      faser:
        - Genomgången
    - rubrik: 3. Vi gör
      text: Alla gör samma handgrepp, en bygger och en skriver
      faser:
        - Åt andra hållet
    - rubrik: 4. Du gör
      text: Var och en provar själv, läraren går runt och frågar
      faser:
        - Bladet
    - rubrik: 5. Vi samlas
      text: Paren säger en mening, och alla skriver sin lärdom
      faser:
        - Lärdomen

tabeller:
  - rubrik: "Materialet du behöver"
    plats: efter-inledning
    meny: true
    text: Tiobasen och multilink visar hur stort talet är, och sifferkorten visar hur det skrivs. Du behöver också en egen sats av varje, och bilden efter tabellen visar materialet.
    kolumner:
      - Material
      - Per elev
      - Var du hittar det
      - När ni använder det
    rader:
      - - "Tiobas\nental, tiostavar och hundraplattor"
        - 20 ental, 15 tiostavar och 6 hundraplattor
        - Skolans matematikmaterial. Tiobas finns att köpa i plast eller trä, och NCM:s matematikpapper har tiobas att skriva ut.
        - Vecka 1–4. Eleven bygger talen på räknemattan och växlar själv.
      - - "Sifferkort\n1–9, 10–90, 100–900 och 1 000–9 000"
        - En sats, med en färg för varje talsort
        - Montessoris sifferkort i trä eller plast, eller NCM:s positionskort att skriva ut.
        - Vecka 1–4 och 6–7. Eleven lägger talet, drar isär det och skriver en talsort i taget. Korten visar inte växlingen. I subtraktion drar eleven bara isär talet som tas bort, aldrig båda, och i division behövs inte korten.
      - - "Multilink\nkuber på 2 cm som går att sätta ihop"
        - Omkring 100 kuber i två färger
        - Skolans matematikmaterial, eller köp multilinkkuber.
        - Vecka 5–8. Eleven bygger rektangeln, och tio kuber i ett torn är ett tiotal.
      - - "Räknemattan\nett stående A4 per talsort"
        - Tre ark, för hundratal, tiotal och ental
        - Planeringsmallarna
        - Vecka 1–4, med tiobasen. Arken ligger bredvid varandra, och en hundraplatta ryms ovanför och under linjen.
      - - Talrutan och tomma talrader
        - Ett blad per pass
        - Planeringsmallarna
        - Talraderna i vecka 1 och 4 och talrutan i vecka 5–8
      - - Liten tavla, penna och lappar
        - En tavla och några lappar
        - Skolans material
        - Varje pass. På lappen skriver du talet som tas bort i subtraktion.
      - - Övningsblad, Mina lärdomar, läxan och kortet Säg varje gång
        - Veckans blad, Mina lärdomar, läxan och ett kort
        - Kursens material, planeringsmallarna och lathundens tredje sida
        - Bladet i varje pass, kortet för den som behöver det och läxan en gång i veckan
  - rubrik: "Så visar du de fyra räknesätten"
    plats: efter-steg
    meny: true
    kolumner:
      - Räknesätt
      - Materialet
      - Bilden
      - Skriften
      - Säg varje gång
    rader:
      - - Addition, 57 + 28
        - Lägg det första talet på räknemattans övre rad och det andra på den nedre. Skjut upp entalen. Är de fler än nio, byt tio ental mot en tiostav och lägg den bland tiotalen. Skjut sist upp tiotalen.
        - Talraden till huvudräkningen. Börja på det första talet och hoppa tiotalen och sedan entalen via ett jämnt tiotal, 57, 77, 80, 85. Till uppställningen ritar ni tiobasen med streck för tiotal och prickar för ental, och ni ringar in tio prickar och byter dem mot ett streck.
        - 57 + 20 = 77 och 77 + 8 = 85. I uppställningen står entalen rakt under entalen. Du börjar med entalen och skriver minnessiffran ovanför tiotalen.
        - ”Entalen under entalen.” ”Fler än nio ental? Växla.” ”Den lilla ettan är ett tiotal. Var finns det på mattan?”
      - - Subtraktion, 85 − 28
        - Bygg bara det första talet. Talet du tar bort står på en lapp. Räcker inte entalen, byt en tiostav mot tio ental. Lägg det du tar bort på den nedre raden, så att det syns. Jämför ni två tal, som när ni söker hur många fler, bygger ni båda, ett på varje rad, och skillnaden är det som bara det större talet har.
        - Talraden. Ligger talen långt isär, hoppa bakåt, tiotalen först och sedan entalen via ett jämnt tiotal, 85, 65, 60, 57. Ligger talen nära, räkna upp, som i 64 − 58, där det är sex från 58 till 64. Till uppställningen ritar ni bara det första talet, och ni stryker ett streck och ritar tio prickar.
        - 85 − 20 = 65 och 65 − 8 = 57. I uppställningen stryker du siffran du växlar från och skriver den nya siffran ovanför. Ovanför entalen skriver du en liten tia. Kontrollera med addition, 57 + 28 = 85.
        - ”Räcker inte entalen? Växla.” ”Hur många tiotal är kvar nu?”
      - - Multiplikation, 3 · 24
        - Bygg tre rader med multilink, med två tiotorn och fyra lösa kuber i varje rad. Raderna blir en rektangel. Av de tolv lösa kuberna sätter ni ihop tio till ett tiotorn, och två är kvar.
        - Rektangeln på talrutan. Antalet rader och antalet i varje rad är faktorerna, och antalet rutor är produkten. Dela rektangeln vid tiotalet, 3 · 20 och 3 · 4, och rita sedan en tom rektangel utan rutor, med talen vid sidorna.
        - 3 · 24 = 3 · 20 + 3 · 4 = 60 + 12 = 72. I kort multiplikation börjar du med entalen, och minnessiffran ovanför lägger du till efter att du har multiplicerat tiotalen.
        - ”Vad kan 3 · 24 vara? Tre rader med 24 stolar i varje.” ”Hur många rader? Hur många i varje rad?” ”Är alla delar med?”
      - - Division, 72/3
        - "Sätt ihop de 72 kuberna till sju tiotorn och två kuber, och dela ut tiotornen i tre tomma rader. Tornet som blir över bryter du isär till tio kuber, och sedan delar du ut de tolv lösa kuberna. Läs sedan rektangeln på det andra sättet. Vrid den, så att varje rad har tre kuber, och antalet rader är 20 + 4 = 24."
        - Samma rektangel. Arean är 72 och den ena sidan 3. I den tomma rektangeln delar du upp 72 i 60 och 12, och den andra sidan blir 20 + 4 = 24.
        - 72/3 = 60/3 + 12/3 = 20 + 4 = 24. I kort division skriver du 7¹2/3 = 24, där den lilla ettan är tiotalet som blev över. Resten är alltid mindre än det du delar med, och en nolla i kvoten skriver du ut, som i 832/8 = 104.
        - ”Vet du hur många rader, eller hur många i varje rad?” ”Blir ett tiotal över? Växla.”
    not: Lärdomen är elevens egen mening. Du skriver den på väggplanschen och gör den exakt med ämnets ord, som ”Tio ental blir ett tiotal” eller ”Varje del av rektangeln ska med”.
  - rubrik: "Så skiljer sig nivåerna"
    plats: efter-urval
    text: Passen och veckorna är desamma på alla tre nivåer. Nivåerna skiljer sig i talen och i om eleven går vidare till kort multiplikation och kort division. Välj nivå efter kartläggningen och inte efter årskurs. Nivån Avancerad har tal i decimalform och kräver att eleven kan läsa tiondelar och hundradelar.
    kolumner:
      - Vad
      - Bas
      - Medel
      - Avancerad
    rader:
      - - Addition och subtraktion
        - Upp till 1 000, som 158 + 64 och 400 − 156
        - Främst tresiffriga tal, med två växlingar och växling över nollan, som 386 + 457 och 600 − 247
        - Fyrsiffriga tal och tal i decimalform, som 3 579 + 2 846 och 4 − 3,6. Eleven räknar i tiondelar och hundradelar, så att 4 − 3,6 blir 40 tiondelar minus 36 tiondelar. Tio hundradelar är en tiondel, och tio tiondelar är en hel
      - - Multiplikation
        - Inom tabellerna och tvåsiffrigt gånger ensiffrigt i rektangeln, som 3 · 14
        - Tvåsiffrigt gånger ensiffrigt med kort multiplikation, som 3 · 26
        - Tresiffrigt gånger ensiffrigt, som 4 · 236, och tvåsiffrigt gånger tvåsiffrigt i den tomma rektangeln, som 19 · 26. Ett decimaltal delas upp i heltal och tiondelar, som 1,5 · 4 = 1 · 4 + 0,5 · 4 = 6
      - - Division
        - Inom tabellerna, tvåsiffriga tal delat med ensiffriga i den tomma rektangeln, som 42/3, och rest med små tal, som 26/3
        - Kort division med rest, som 83/4 = 20 rest 3
        - Kort division med nollan mitt i kvoten, som 832/8 = 104
  - rubrik: "Talen och bladen i veckorna"
    karta: true
    plats: efter-urval
    meny: true
    text: För varje vecka och nivå står passets första uppgift för pass 1, 2 och 3, i den ordningen, och gruppen räknar sedan samma tal åt andra hållet. I pass 2 visar du först det som står under Pass 2 på veckans sida, oftast förra passets uppgift ritad, och sedan passets uppgift ur tabellen. Allt nytt kommer i pass 1 och 2, och med två pass i veckan tar ni de två första uppgifterna. Veckans blad står först, och ett blad efter ”sedan” är för den som blir klar. Bladen räcker hela veckan, och eleven fortsätter där hen slutade. De sista uppgifterna på Subtraktion 1 och Division 4 väntar på det du visar i pass 2. En uppgift på varje blad räknar eleven också åt andra hållet, i rutan sist på bladet. Bladen står under Kursens material.
    kolumner:
      - Vecka
      - Bas
      - Medel
      - Avancerad
    rader:
      - - "Vecka 1\nHopp på talraden"
        - "37 + 26, 48 + 35, 57 + 7\nAddition 1 och Subtraktion 1"
        - "58 + 27, 136 + 48, 195 + 8\nAddition 1 och Subtraktion 1"
        - "386 + 245, 1,7 + 0,6, 1 450 + 380\nAddition 1 och Subtraktion 1"
      - - "Vecka 2\nTio ental blir ett tiotal"
        - "39 + 25, 47 + 37, 58 + 34\nAddition 2 och Subtraktion 2"
        - "57 + 28, 68 + 25, 146 + 37\nAddition 2 och Subtraktion 2"
        - "236 + 48, 345 + 192, 468 + 125\nAddition 3 och Subtraktion 3"
      - - "Vecka 3\nHundratal och två växlingar"
        - "67 + 76, 158 + 64, 145 + 87\nAddition 3 och Subtraktion 3"
        - "386 + 457, 279 + 164, 657 + 286\nAddition 3 och Subtraktion 3, sedan Addition 4"
        - "3 579 + 2 846, 1 768 + 3 495, 2 657 + 3 486\nAddition 4 och Subtraktion 3, sedan Addition 5"
      - - "Vecka 4\nÖver nollan och välj sätt"
        - "400 − 156, 302 − 297, 503 − 68\nSubtraktion 4 och repetition"
        - "600 − 247, 701 − 698, 1 004 − 368\nSubtraktion 4 och repetition"
        - "5 000 − 1 863, 4 − 3,6, 3 006 − 1 478\nSubtraktion 4 och 5"
      - - "Vecka 5\nRektangeln"
        - "3 · 4, 4 · 6, 7 · 5\nMultiplikation 1 och Division 1"
        - "4 · 6, 6 · 7, 8 · 7\nMultiplikation 1 och Division 1"
        - "6 · 8, 7 · 9, 12 · 8\nMultiplikation 1 och Division 1"
      - - "Vecka 6\nRektangeln med tiotal"
