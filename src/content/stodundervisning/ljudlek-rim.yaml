film:
  sekunder: 22.21
  beskrivning: "Kamraten säger ordet på ett kort. Leta upp kortet som rimmar. Säg båda orden. Vänd korten. Resten är olika: ol och o. Säg orden igen och leta vidare. Vänd. Samma rest: ol och ol. Säg ett ord som rimmar på varje kort. Ett påhittat ord räknas."
  rubrik: "Så gör eleven"
  ingress: "Fyra bilder ur lektionens film om vad eleven gör. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Kamraten säger ordet på ett kort."
    - text: "Sko börjar likadant, men resten är olika: ol och o."
    - text: "Leta vidare: sol och stol har samma rest, ol."
    - text: "Säg ett eget ord som rimmar. Ett påhittat ord räknas."
