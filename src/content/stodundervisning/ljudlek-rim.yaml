exempel:
  valt:
    rubrik: "Gruppen"
    text: "sex elever i förskoleklass och åk 1, med tre pass i veckan. I vecka 1 gör gruppen Rim för tredje passet i följd och står i raden Byt början. Dagens ljud är /o/, och dagens elever är Alva och Leo."
  text:
    - "Ljudstarten. Läraren visar o, och gruppen sätter ihop och delar upp ord med två och tre ljud att dra ut."
    - "Dela ordet. Läraren visar huset och musen: ”Hus. /h/ och us. Mus. /m/ och us. Samma rest: de rimmar.” Sedan visar hen huset och handen, som börjar likadant men inte rimmar, och stolen: ”Stol. /st/ och ol.” Sist byter läraren /h/ mot /l/ i hus: ”Lus.”"
    - "Tummen upp. Vid båt och bad visar Leo tummen upp, och läraren säger: ”Båt och bad börjar likadant. Lyssna på resten: åt, ad.” Leo vänder tummen. Sedan byter gruppen början i kör. Gruppen har bara haft s och o, så restkorten får vänta."
    - "Rimpar. Paren är Alva och Elin, Omar och Noah, Leo och Mira. Elin säger ”sko”, och Alva tar kon: ”Ko, sko. Samma rest: o.” De vänder korten: resten ser likadan ut."
    - "Ordfamiljer. Läraren lyssnar på Alva och Leo. Alva tar kortet hand: ”Hand. /h/ och and. Sand, land, rand.” Leo tar huset och säger ”mos”. Läraren visar /h/ och us i var sin hand: ”Behåll us.” Leo säger ”mus”."
    - "Avslutet. Mira säger: ”Hus, mus, lus.” Läraren säger: ”Ni bytte början, och resten blev kvar.”"
    - "Efteråt noterar läraren: Alva byter början säkert, och Leo byter mer än början och får ett rimpar i ljudstarten. Veckan är slut, och gruppen går till nästa förmåga."
fastnar:
  rubrik: "När eleven fastnar"
  text: "Vänta tre sekunder och ge minsta möjliga stöd först. Blir det många fel i gruppen, säg ordet i kör, låt sedan några elever säga det ensamma och ta samma ord minst tre gånger."
  fragaForst:
    - "Vad hör du?"
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg ordet igen, långsamt, och dra ut början: mmm-⁠us."
    - "Visa hur munnen gör. Eleven tittar i spegeln och känner efter: munnen ser likadan ut vid us i hus och us i mus."
    - "Gör uppgiften mindre: två ord att välja mellan, ”Rimmar mus på hus eller på hund?”"
    - "Visa med handen eller med något att flytta: början i ena handen och resten i den andra, och byt bara början."
    - "Säg det tillsammans, och låt eleven säga det själv efteråt: hus, mus, lus."
  motto: "Till sist byter eleven början själv."
urval:
  rubrik: "Var hittar du orden och materialet?"
  text:
