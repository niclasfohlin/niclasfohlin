principer:
  rubrik: "Tre saker att hålla fast vid"
  text: "Dela ordet i början och resten, där resten börjar vid vokalen: /h/ och us, /st/ och ol. Ord med samma rest rimmar. Blanda par som rimmar med par som inte gör det, bland dem par som börjar med samma ljud, så att eleverna inte kan gissa. Byt början, och läs sist ord med restkorten när gruppen har haft bokstäverna."
passrutin:
  text: "Lektionen går i fyra steg, från att du visar till att var och en gör själv."
  steg:
    - text: "Du delar orden i början och resten och visar att ord med samma rest rimmar."
      fas: "Dela ordet"
    - text: "Gruppen visar med tummen om två ord rimmar och gör leken i gruppens rad."
      fas: "Tummen upp"
    - text: "Den ena säger ordet på ett kort, och den andra letar upp kortet som rimmar."
      fas: "Rimpar"
    - text: "Var och en gör leken med sina tre kort, och du lyssnar på dagens elever."
      fas: "Ordfamiljer"
  efterPasset: "Du noterar i snabbmallen vilka av dagens elever som själva sa ett rim, delade ordet, bytte början eller läste ord med restkorten, vad som fastnade, och om gruppen tar samma rad, nästa rad eller nästa lektion."
tidsschema:
  rubrik: "Ett pass på 30 minuter"
  text: "Är passet bara 20 minuter blir ljudstarten tre minuter, lektionen 15 och avslutet två. Stegen får då två, fyra, fem och fyra minuter."
  rader:
    - tid: "Före passet"
      fas: "Förberedelse"
      vad: "Ta fram rimkorten, restkorten, bokstavskorten och speglarna. Välj passets ordpar och orden till ljudstarten. Bestäm paren och dagens elever, och skriv allt i snabbmallen."
    - tid: "0–5 min"
      fas: "Ljudstart"
      vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra, som i Ljudstarten. Alla svarar samtidigt."
    - tid: "5–9 min"
      fas: "Dela ordet"
      vad: "Visa två par rimkort, ett som rimmar och ett som börjar likadant, och stolen. Visa sist leken i gruppens rad."
    - tid: "9–15 min"
      fas: "Tummen upp"
      vad: "Säg åtta ordpar, där hälften rimmar. Alla visar tummen på ditt tecken. Sist gör ni leken i gruppens rad."
    - tid: "15–20 min"
      fas: "Rimpar"
      vad: "Paret turas om med korten sol, stol, ko, sko, ben och sten. Du går mellan paren."
    - tid: "20–25 min"
      fas: "Ordfamiljer"
      vad: "Paret delar de sex andra korten, tre var. Du lyssnar efter det som gruppens rad tränar."
    - tid: "25–30 min"
      fas: "Avslut"
      vad: "Var och en säger ett ord från dagens lek och vad hen gjorde med det. Du säger kort vad du hörde."
  efter: "Den som är klar före de andra säger så många ord som möjligt i samma ordfamilj, också påhittade."
steg:
  rubrik: "Vad du gör och säger i varje steg"
  text: "Här är lärarens ord, så att du kan säga dem som de står."
  fraserRubrik: "Exempelfraser"
  rader:
    - namn: "Dela ordet"
      fraga: "Hur hör jag att ord rimmar?"
      gor: "Säg bildernas namn i kör första passet, och förklara vad orden betyder. Dela två ord som rimmar: /h/ och us, /m/ och us. Visa hus och hand, som börjar likadant men inte rimmar, och stol, där början är två ljud. Säg /st/ utan ö. Visa sist leken i gruppens rad."
      fraser:
        - "Hus. /h/ och us. Mus. /m/ och us. Samma rest: de rimmar."
        - "Stol. /st/ och ol. Början är två ljud."
        - "Hus och hand börjar likadant, men resten är olika: us och and."
    - namn: "Tummen upp"
      fraga: "Hör vi om det rimmar?"
      gor: "Säg passets åtta ordpar, och alla visar tummen upp eller ned på ditt tecken, så att du ser varje elev. I raden Början och resten säger gruppen sedan resten i båda orden. I raden Byt början tar ni hus, mus och hand, och alla byter början i kör. Har gruppen haft bokstäverna, läser ni sist ord med restkorten."
      fraser:
        - "Sol, sko. Tummen upp eller ned? Visa nu."
        - "Säg resten i båda: ol, o."
        - "Mus. Byt /m/ mot /l/. Vilket ord blir det?"
    - namn: "Rimpar"
      fraga: "Vilket kort rimmar?"
      gor: "Paret lägger sina sex kort med bilden upp. Den ena säger ordet på ett kort. Den andra letar upp kortet som rimmar och säger båda orden. Från raden Början och resten säger hen också resten i båda. De vänder korten: ser resten likadan ut? Om inte, säger de orden igen och letar vidare. Sedan lägger de tillbaka korten och byter roller."
      fraser:
        - "Säg båda orden. Rimmar de?"
        - "Sol och sko börjar med samma ljud. Lyssna på resten."
        - "Vänd korten. Ser resten likadan ut?"
    - namn: "Ordfamiljer"
      fraga: "Kan du göra det själv?"
      gor: "Var och en tar tre av de sex andra korten och säger ett ord som rimmar på varje, också påhittat. I raden Början och resten delar eleven först ordet. I raden Byt början byter eleven början så många gånger hen kan. Har gruppen haft bokstäverna, läser dagens elever sist två ord med restkorten."
      fraser:
        - "Säg ett ord som rimmar på hus. Ett påhittat går bra."
        - "Säg början och resten: /h/ och us."
        - "Du bytte bara början, och resten blev kvar."
arbetsform:
  rubrik: "Arbetsform: alla i kör, växlande, gemensamt"
  text: "I ljudstarten svarar alla samtidigt, och i lektionen går ni från att du visar till att var och en gör själv. Paren och trion sätter du ihop som i Ljudlek i grupp. Den som ännu inte hör rim sitter med en säker kamrat och får två ord att välja mellan."
  delar:
