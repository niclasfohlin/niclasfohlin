      vad: "I snabbmallen noterar du dagens elever och det som fastnade."
    - nar: "Var tredje vecka"
      vad: "Du gör ljudkollens uppgift 1 om rim, uppgift 2 om ord och stavelser och uppgift 4 om bokstävernas ljud."
