# En lektion i Ljudlek i grupp, skriven i lektionsskelettet: methods/ljudlek-i-grupp/_lektion.yaml.
titel: "Ljudlek: Rim"
undertitel: "En lektion i Ljudlek i grupp: höra rim, dela ordet i början och resten och byta början, för F–⁠2"
ingress: "Eleverna delar ord i två delar, början och resten, och hör att ord med samma rest rimmar: hus, mus, lus. Sedan byter de början och säger nya ord, också påhittade. Har de haft bokstäverna, läser de orden med restkort. Lektionen hör till Ljudlek i grupp och har samma ljudstart och avslut som de andra lektionerna."
omrade: "Läsning"
arskurs:
  - "F-3"
arskursText: "F–2"
taggar:
  - "fonologisk-medvetenhet"
  - "bokstavskunskap"
  - "lasinlarning"
  - "intensivtraning"
format:
  - "liten grupp"
  - "par"
tid: "30 minuter per pass, tre till fem pass i veckan"
period: "Högst en vecka, tre till fem pass"
grupp: "2–12 elever"
material:
  - "Rimkorten under Materialet, ett ark per par och ett till dig, ditt gärna förstorat till A3"
  - "Restkorten under Materialet"
  - "Bokstavskorten under Materialet och en spegel per par"
  - "Snabbmallen för noteringen efter passet"
uppdaterad: "2026-09-30"
utkast: false
serie: "ljudlek-i-grupp"
formaga: 1
tranar: "höra och hitta rim, och byta början av ordet"
inledning:
  - "I Rim delar eleverna ordet i början och resten: hus är /h/ och us, och stol är /st/ och ol. Ord med samma rest rimmar, och med en ny början blir det ett nytt ord: mus, lus. Lektionen hjälper eleven med det som gör rim svårt: betydelsen tar över, så att råtta blir ett rim på mus, eller första ljudet tar över, så att sko blir ett rim på sol."
  - "Syftet är att eleverna lyssnar på hur orden låter och hör att ett ord har en början som går att byta. Du visar hur du delar ordet, blandar par som rimmar med par som inte gör det och låter påhittade ord räknas."
  - "Välj Rim när fler än hälften av eleverna har färre än tre rätt av fyra på ljudkollens uppgift 1, rim. Ljudkollen är den korta kartläggningen med nio uppgifter som du gör med varje elev före insatsen och var tredje vecka. Den står i Ljudlek i grupp, och lektionen hör till förmåga 1 i lektionsbanken där."
upplagg:
  rubrik: "Så används lektionen"
  text: "Passet har samma ram i alla lektioner: fem minuter ljudstart, 20 minuter lektion i fyra steg och fem minuter avslut. Ljudlek i grupp beskriver gruppen, dagens elever och ljudkollen. Rim tar högst en vecka och går igenom de tre raderna i Så blir lektionen svårare. Med tre pass i veckan byter gruppen rad varje pass. Med fler pass byter den rad när dagens elever klarar steg 4 själva. Sedan går gruppen till nästa förmåga där fler än hälften inte klarar uppgiften i ljudkollen."
tabeller:
  - rubrik: "Så blir lektionen svårare"
    plats: "efter-inledning"
    kolumner:
      - "Leken"
      - "Så låter det"
      - "Så gör ni"
    rader:
      - - "Rim eller inte"
        - "hus och mus: ja. hus och hand: nej."
        - "Alla visar tummen upp eller ned på ditt tecken. I steg 4 säger eleven ett ord som rimmar på varje kort."
      - - "Början och resten"
        - "hus: /h/ och us. stol: /st/ och ol."
        - "Dela två ord där vokalen börjar, och säg resten i båda. I steg 4 säger eleven början och resten."
      - - "Byt början"
        - "hus: byt /h/ mot /m/, mus."
        - "Behåll resten och sätt en ny början, i kör och sedan själv. Har gruppen haft bokstäverna, läser ni sist ord med restkorten."
    not: "Gruppen börjar i raden Rim eller inte. Om nästan alla bara missade att säga ett eget rim i ljudkollen, börjar gruppen i raden Början och resten och tar sedan raden Byt början i två pass. I alla rader tar ni rimkorten, sex i steg 3 och de sex andra i steg 4. Den som ännu inte hör rim efter veckan får ett rimpar sist i ljudstarten. Orden i ljudkollen och i screeningens version B är inte övningsord. Föreslå dem inte, men säger eleven ett av dem, räknas det."
  - rubrik: "Ljudstarten: samma fem minuter varje pass"
    plats: "efter-tidsschema"
    text: "Alla svarar samtidigt. Vänd ansiktet mot eleverna, så att de ser din mun."
    kolumner:
      - "Moment"
      - "Så gör du"
    rader:
      - - "Dagens ljud"
        - "Visa bokstaven och säg ljudet. Alla säger efter, och någon säger ett ord på ljudet. Sist säger alla ljuden för några bokstäver ni har haft."
      - - "Sätt ihop"
        - "Dra ut fem ord utan paus, med handen från vänster till höger sett från eleverna. Räkna tyst till tre och knyt handen, så säger alla ordet. Sist säger en av dagens elever ett ord ensam."
      - - "Dela upp"
        - "Säg fyra ord med olika många ljud. Alla säger ordet och sedan ljuden, med ett finger för varje, och räknar fingrarna sist. I lektionerna före Räkna ljud i banken säger du ljuden först och gruppen efter."
    not: "Säg ljudet och inte bokstavens namn, och b, d, g, k, p och t korta och utan ö. Orden tar du ur Ordbanken, och i Dela upp blandar du in ord ur de lättare ordgrupperna, så att orden har olika många ljud. Dagens ljud, dina fraser och ordgrupperna står i Ljudlek i grupp. Gruppen behåller sin ordgrupp från lektion till lektion. I Rim-⁠veckan säger ingen ett ord på dagens ljud."
  - rubrik: "Lyssna efter"
    plats: "efter-steg"
    text: "Bekräfta först det som eleven gjorde rätt, och försök sedan igen tillsammans."
    kolumner:
      - "Eleven säger"
      - "Det som händer"
      - "Så gör du"
    rader:
      - - "”råtta” som rim på mus"
        - "Betydelsen tar över"
        - "Lyssna på resten: ”Mus, us. Råtta, åtta. Låter resten likadant?”"
      - - "”sko” som rim på sol"
        - "Första ljudet tar över"
        - "”Sol och sko börjar med samma ljud. Lyssna på resten: ol, o.”"
      - - "tummen upp vid varje ordpar"
        - "Eleven säger ja till allt"
        - "Säg ett ordpar som rimmar och ett som inte gör det: ”Hus, mus. Hus, hand. Vilket rimmar?”"
      - - "”mos” när ni byter /h/ mot /m/ i hus"
        - "Eleven byter mer än början"
        - "”Behåll us. Byt bara /h/: mmm-⁠us.” Visa /h/ i ena handen och us i den andra."
      - - "inget ord"
        - "Eleven hittar inget eget rim"
        - "Ge två ord att välja mellan: ”Rimmar mus på hus eller på hund?”"
      - - "tummen upp vid hus och sås"
        - "Eleven lyssnar bara på sista ljudet"
        - "”Hus, us. Sås, ås. Låter resten likadant?”"
  - rubrik: "Varianter"
    plats: "efter-urval"
    text: "Byt till en variant i samma steg när gruppen behöver något nytt."
    kolumner:
      - "Variant"
      - "Så gör ni"
      - "När den passar"
    rader:
      - - "Rimramsan"
        - "Gruppen säger rimordet sist i en ramsa: ”Det var en gång en mus som bodde i ett” (hus). ”Det var en gång en ko som tappade sin” (sko)."
        - "Steg 2, när gruppen behöver en paus"
      - - "Rimlek i par"
        - "Paret väljer ett kort och hittar så många rim som möjligt, också påhittade. I avslutet säger de ett för gruppen."
        - "Steg 3, i raden Byt början"
      - - "Rim i påse"
        - "Lägg ett kort ur varje rimpar i en påse och de andra med bilden upp. Eleverna turas om att dra och leta upp kortet som rimmar."
        - "Steg 3, när gruppen behöver något nytt"
  - rubrik: "Ordparen"
    plats: "efter-urval"
    text: "I steg 2 säger du åtta ordpar, och hälften rimmar. Med fler än tre pass tar ni ordparen igen."
    kolumner:
