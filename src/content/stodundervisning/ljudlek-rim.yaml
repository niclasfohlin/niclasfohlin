grund:
  text: "Barn hör rim före enskilda ljud (Carroll m.fl., 2003), men att höra och hantera ljuden förutsäger läsningen bäst (Muter m.fl., 1997; Hulme m.fl., 2002; Melby-⁠Lervåg m.fl., 2012). Därför kommer rim först och tar kort tid. Den amerikanska lärarguiden från IES rekommenderar att eleverna delar enstaviga ord i början och resten och byter början (Foorman m.fl., 2016). Att avgöra om ord rimmar är lättare än att hitta rim (Phillips m.fl., 2008), och träningen ger mest när bokstäverna finns med (Bradley och Bryant, 1983, i Wolff, 2017)."
  kallor: "Bygger på Bradley och Bryant (1983), Carroll m.fl. (2003), Foorman m.fl. (2016), Hulme m.fl. (2002), Melby-⁠Lervåg m.fl. (2012), Muter m.fl. (1997), Phillips m.fl. (2008) och Wolff (2017)."
ramar:
  rubrik: "Materialet"
  text:
    - "Här finns rimkorten, restkorten och bokstavskorten. Allt går att kopiera. Laminera restkorten och bokstavskorten, och rimkorten när de är vikta och limmade."
  ramar:
    - rubrik: "Rimkorten"
      text:
        - "Arket har sex rimpar, och flera kort börjar med samma ljud utan att rimma. Den som bara lyssnar på första ljudet hittar då fel par. Sol, stol, ko, sko, ben och sten är korten till steg 3, och hus, mus, mål, nål, hand och tand korten till steg 4. Arket står två gånger på sidan, så en sida räcker till två par, eller till ett par och dig."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Klipp längs strecken och vik varje kort längs den blå prickade linjen, så att bilden blir framsidan och ordet baksidan. Limma ihop halvorna och laminera sist. Vänd kortet som en sida i en bok, så står ordet rätt. Prickarna under ordet är en för varje ljud, som i de andra lektionerna. Första passet säger ni bildernas namn i kör: ”Det här är en ko. Vi säger ko.” Ett rim hörs bara när kortet får rätt namn."
      listor:
        - rubrik: "Rimkort · Sex rimpar"
          rader:
            - - "sol"
              - "ko"
              - "ben"
            - - "sko"
              - "sten"
              - "stol"
            - - "hus"
              - "mål"
              - "hand"
            - - "nål"
              - "tand"
              - "mus"
    - rubrik: "Restkorten"
      text:
        - "Korten har resten av ordet i sex ordfamiljer och står i den ordning bokstäverna blir dagens ljud. Du lägger en bokstav framför kortet, och gruppen läser ordet, till exempel sol, vas, mor, liv, mål och mus."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Skriv ut korten på tjockt papper och klipp isär dem. Ta bara fram restkort och bokstavskort med bokstäver som gruppen har haft som dagens ljud. Framför restkortet lägger du bara s, l, r, m, n eller v. Andra bokstäver ger ord ur ljudkollen eller ord som inte låter som de stavas. Lägg bokstaven och restkortet rättvända för eleverna, bokstaven till vänster sett från dem, och läs tillsammans: sss-⁠ol, sol. Byt bokstaven och läs igen. Påhittade ord räknas."
      listor:
        - rubrik: "Restkort"
          rader:
            - - "ol"
              - "as"
              - "or"
            - - "iv"
              - "ål"
              - "us"
    - rubrik: "Bokstavskorten"
      text:
        - "Det är samma 24 kort i alla lektioner, i den ordning bokstäverna blir dagens ljud."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Skriv ut korten på tjockt papper och klipp isär dem. Håll upp kortet för dagens ljud så att alla ser det, och håll det rättvänt, eftersom u blir n och d blir p när kortet vänds upp och ned."
      listor:
        - rubrik: "Bokstavskort"
          rader:
            - - "s"
              - "o"
              - "l"
            - - "a"
              - "r"
              - "m"
            - - "e"
              - "n"
              - "i"
            - - "v"
              - "t"
              - "f"
            - - "å"
              - "p"
              - "k"
            - - "d"
              - "u"
              - "b"
            - - "g"
