  material:
    rubrik: Vad du behöver för ett pass med läslistor
    kravEtikett: Listkrav
    var:
      rubrik: Var listorna och böckerna finns
      punkter:
        - fet: Sju läslistor, en per vecka.
          text: I planeringsmallarna (Word), en lista per sida att kopiera till paren, och i avsnittet Läslistorna på metodsidan. Från bokstäver och ljud till meningar och text.
        - fet: Lättlästa böcker för F–3.
          text: Nivåindelade serier som Kiwi, Stjärnsvenska och Beta Pedagog, till avslutningen från vecka 4.
        - fet: Egna listor.
          text: Riktiga, vanliga och ljudenligt stavade ord, en ny svårighet per lista.
      efter: Byt lista först när flytet sitter.
    bordet:
      - Veckans läslista, en kopia per par
      - Listan stor, så att alla ser den
      - Bokstavskort för att bygga ord
      - En lättläst bok, från vecka 4
      - Snabbmallen för noteringen efteråt
    varjePass: Vilka ord och orddelar behöver repeteras, och vem läser listan med flyt?
