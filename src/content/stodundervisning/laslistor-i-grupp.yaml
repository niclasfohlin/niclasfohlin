lathund:
  innehall: En läslista i veckan
  metoden:
    text:
      - "Läslistor utvecklar avkodningen genom strukturerad och upprepad läsning, för elever i F–3 som gissar sig fram eller har svårt att ljuda ihop ord. Arbetet följer alltid samma rörelse: läraren modellerar, gruppen körläser och eleverna läser i par. Det är rörelsen som är metoden."
      - "En lista i veckan, 15 minuter per pass. Tiderna i tabellen gäller från vecka 4, när passet avslutas med några minuter i en riktig bok som ni läser och pratar om. Vecka 1–3 är passet bara listan: modellering 0–3 minuter, körläsning 3–6, parläsning 6–14 och avslutning den sista minuten."
      - "Upplägget fungerar med en elev lika väl som med tio. Med en elev är du elevens par. Vid udda antal läser tre tillsammans: en pekar och två turas om att läsa."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Rörelsen är metoden.
          text: Modellering, körläsning och parläsning, i den ordningen, varje gång.
        - fet: Återkoppla direkt.
          text: Det är den snabba feedbacken, inte listan, som utvecklar avkodningen.
        - fet: Listan är ett komplement.
          text: Riktiga böcker varje vecka, från vecka 4 i slutet av passet.
    tabell:
      rubrik: De fyra stegen · vad du gör och säger
      kolumner:
        - Steg
        - Exempelfraser
      rader:
        - - |-
            1 · Modellering
            0–2 min. Ljuda, bind ihop och läs ordet i normal takt.
          - |-
            ”Lyssna när jag ljudar: sss-t-eee-nnn. Sten.”
            ”Här är det lätt att tappa ett ljud. Hör ni vilket?”
        - - |-
            2 · Körläsning
            2–4 min. Alla läser samma ord i ditt tempo.
          - |-
            ”Alla tillsammans, i min takt.”
            ”Vi läser kolumnen en gång till.”
        - - |-
            3 · Parläsning
            4–10 min. En pekar, en läser, byt roller. Du cirkulerar.
          - |-
            ”Du ljudade hela vägen fram till sista ljudet.”
            ”Läs om hela ordet från början.”
        - - |-
            4 · Avslutning
            10–15 min. Det viktigaste, sedan boken från vecka 4.
          - |-
            ”Nu läser vi ordet tillsammans.”
            ”Vad tror ni händer sen?”
    not: "Bekräfta, korrigera och ge stöd direkt när det händer. Korrigera kort: säg rätt ljud och låt eleven läsa om hela ordet från början. Vid många fel: modellera ordet igen och körläs det på nytt."
  pass:
    rubrik: "Vi kör ett pass: vecka 5, konsonantmöten"
    textRubrik: Gruppen · fyra elever, åk 1, Läslista 4
    utskrift: Skriv ut passexemplet
    text:
      - "Läraren modellerar fem ord ur första kolumnen: ”sss-t-eee-nnn. Sten. Här är det lätt att tappa ett ljud. Hör ni vilket?” Eleverna lyssnar."
      - Alla körläser kolumnen i lärarens tempo. Vid spik stannar kören. Läraren modellerar ordet igen, och de läser om kolumnen.
      - "Alva pekar för Omar, Hiba pekar för Leon. Leon läser ”sen”. Hiba ljudar med Leon, och läraren säger: ”Läs om hela ordet från början.” Till Omar: ”Du ljudade hela vägen fram till sista ljudet.” Paren byter roller."
      - "Läraren modellerar mötet i sten och spik. Sedan en lättläst bok om en hund som gräver i sanden: ”Vad tror ni att hunden letar efter?” Notering efteråt: Leon tappar t i st-orden, repetera i morgon."
    forberett:
      rubrik: Det jag förberedde
      text:
        - "Fem ord ur första kolumnen att modellera. Listan kopierad till två par: Alva och Omar, Hiba och Leon. En lättläst bok framme till avslutningen."
    klarTidigt: Läs listan en gång till och byt roller. Det är omläsningen av samma ord som ger flytet.
    schema:
      rubrik: 15 minuter, steg för steg
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Välj fyra till sex ord att modellera. Kopiera listan till varje par. Ta fram dagens bok.
        - tid: 0–2
          fas: Modellering
          vad: Peka, ljuda och bind ihop. Tänk högt om det svåra. Eleverna lyssnar.
        - tid: 2–4
          fas: Körläsning
          vad: Alla läser samma ord i ditt tempo. Läs om kolumnen.
        - tid: 4–10
          fas: Parläsning
          vad: En pekar, en läser, byt roller. Du bekräftar, korrigerar och ger stöd.
        - tid: 10–15
          fas: Avslutning
          vad: Modellera det viktigaste. Läs i boken och prata om vad som händer.
