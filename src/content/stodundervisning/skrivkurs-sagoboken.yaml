  - rubrik: En saga i tre pass
    plats: efter-inledning
    meny: true
    text: "Gruppens saga i vecka 2–4 och parens sagor i vecka 5–7 går igenom samma tre slags pass. Bladet i skrivpasset är Sagans väg eller Vår saga, och från vecka 5 har paret också bladet Det här tar vi med oss."
    kolumner:
      - Passet
      - Det paret gör
      - På bordet
    rader:
      - - Planeringspasset
        - Slår tärningarna, skriver eller ritar vid stationerna och färgar lågorna på berget.
        - Tärningarna, Sagans väg och Spänningsberget
      - - Berättarpasset
        - Berättar sagan två gånger med Kamratens frågor, spelar den vid skyltarna och skriver stationen där scenen frös.
        - Skyltarna, repet, lådan, lappar, bladet och korten
      - - Skrivpasset
        - Skriver station för station med rollerna, sätter en bock där sagan svarar på frågan och läser för lyssnarparet.
        - Bladet, berget, rollkorten och frågekorten
  - rubrik: Skrivdragen
    plats: efter-tidsschema
    text: "Ett skrivdrag är ett val som en författare gör för att läsaren ska se, höra eller känna något. Gruppen lär sig ett drag i taget i vecka 3–4, och i fyra steg kommer draget Sakta ner i pass 20. Från pass 13 visar du draget i din egen saga, så att paren ser det i en annan saga och inte skriver av din mening. Behöver ett par ett annat drag, säger du det i Där vi slutade."
    kolumner:
      - Draget
      - Så tänker du högt
      - Det sitter när
    rader:
      - - "Börja med vem, var och önskan\nVälj det när hjälten inte vill något eller önskan kommer sent.\nFinns i Bockarna Bruse, Hans och Greta och Jack och bönstjälken."
        - "Jag skriver: Det var en gång en mus. Vet läsaren vad musen vill? Nej. Jag lägger till var hon bor och vad hon vill. Det var en gång en mus som bodde under en ek. Mest av allt ville hon ha en skatt."
        - Paret skriver önskan i en av de två första meningarna utan att du frågar efter den.
      - - "Låt kroppen visa känslan\nVälj det när du hör ”hen blev rädd”.\nFinns i De tre små grisarna, Hans och Greta och Jack och bönstjälken."
        - "Jag skriver: Räven var rädd. Nej, jag vill visa det. Rävens ben skakade."
        - Paret byter själv ett känsloord mot något kroppen gör.
      - - "En replik\nVälj det när läsaren aldrig hör vad figurerna säger.\nFinns i Bockarna Bruse, Hans och Greta och Jack och bönstjälken."
        - "Jag skriver: Musen kröp in genom hålet. Vad sa hon då? Jag låter läsaren höra henne. ”Du är för stor för hålet”, viskade musen och kröp in."
        - Paret skriver en replik med sa, ropade eller viskade, och repliken för sagan framåt.
      - - "Sakta ner vid det värsta\nVälj det när problemet löses i nästa mening. I fyra steg hör det till Problemet.\nFinns i Hans och Greta, Jack och bönstjälken och Räven som ville flyga, och i fyra steg i De tre små grisarna."
        - "Jag skriver: Trollet kom. Nej, jag tar det steg för steg. Bron knakade. En grön hand tog tag i räcket."
        - Toppen har flest meningar, och i sex steg försöker hjälten två gånger.
      - - "Knyt ihop slutet med önskan\nVälj det när hjälten bara går hem eller vaknar.\nFinns i alla modellsagorna och i grodans andra saga."
        - "Jag skriver: Till slut gick musen hem. Vad ville hon i början? En skatt. Jag skriver: Till slut hade musen skatten, precis som hon ville."
        - Den sista meningen säger om hjälten fick det hen ville.
    not: "Gruppen samlar dragen på väggen under rubriken Sagornas ord och ger varje drag ett eget namn, med meningen ur gruppens saga. Där står också sagornas kännetecken, det som saknades i Två texter, det barnen ville ha och ord som för sagan vidare, som ”Plötsligt”, ”Efter ett tag” och ”Äntligen”. Från vecka 5 kan du skriva en mening ur ett pars saga på väggen, om paret säger ja."
