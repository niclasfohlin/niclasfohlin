lathund:
  innehall: En sagobok, i par
  metoden:
    text:
      - "Eleverna lär sig bygga en saga efter sagans väg: hjälten önskar sig något, ett problem står i vägen, och hjälten löser det själv. Fyra steg passar de flesta grupper i åk 1–3 och sex steg de flesta i åk 4–6."
      - "Kursen är 30 pass i tio veckor. Gruppen läser och planerar i vecka 1–2 och skriver en saga tillsammans i vecka 3–4. I vecka 5–6 gör paren en saga i veckan, med tärningarna, scenen och pappret. I vecka 7 skriver de klart boksagan. I vecka 8 lyssnar barnen som boken är till, och i vecka 9–10 gör ni boken."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - { fet: Hjälten löser problemet själv., text: "Hjälparen ger något, men hjälten gör det svåra." }
        - { fet: Berätta innan ni skriver., text: Paret berättar sagan tre gånger och säger varje mening högt innan någon skriver den. }
        - { fet: Spara rättningen till boken., text: "Medan paren skriver, svarar du som läsare." }
    tabell:
      rubrik: Skrivpassets delar
      kolumner: [Del, Exempelfraser]
      rader:
        - ["1 · Sagostarten\nSagan vid skyltarna", "”Hur ska det gå?”\n”Vem löser det?”"]
        - ["2 · Där vi slutade\nParens sista mening", "”Nu undrar jag vad draken gör.”"]
        - ["3 · Skrivdraget\nDin saga på blocket", "”Vad kallar vi det här draget?”"]
        - ["4 · Berätta och skriva\nParet byter roller", "”Vilken mening sa ni på scenen? Skriv den först.”"]
        - ["5 · Läsarna lyssnar\nEtt par läser", "”Var blev det mest spännande?”\n”Undrade ni något?”"]
    not: "När en saga är klar läser i stället varje par för sitt lyssnarpar. I pass 12 och 20 spelar ett annat par bara det som står."
  pass:
    rubrik: "Vi kör ett pass: Det värsta, sex steg"
    textRubrik: Gruppen · sex elever i åk 4, pass 20
    text:
      - "Liam slår tärningarna, och gruppen berättar vid skyltarna. Alva och Omar läser lärarens lapp: ”Nu undrar jag: hur kommer hon upp?” Läraren läser ur Hans och Greta. Sedan skriver hen i sin saga och tänker högt: ”Trollet kom. Nej, jag tar det steg för steg. Bron knakade.” Gruppen känner igen draget Sakta ner."
      - "Paret bygger ut Det värsta med scenens lapp. Läraren säger: ”Skriv den meningen först.” Omar berättar: ”Prinsessan klättrade, men stenarna rasade.” Alva upprepar den och skriver. Vid minut 46 spelar paren varandras sagor och skriver en mening där spelarna står stilla."
    forberett:
      rubrik: Det jag förberedde
      text:
        - Jag läste boksagorna efter pass 19 och skrev en lapp i varje. Jag hittade draget i Hans och Greta. Sedan tänkte jag ut min nästa station.
    klarTidigt: Paret bygger ut en station med stationens drag.
    schema:
      rubrik: 60 minuter, del för del
      rader:
        - { tid: Före, fas: Förberedelse, vad: "Läs boksagorna och skriv ditt svar. Tänk ut nästa station i din saga." }
        - { tid: 0–5, fas: 1 · Sagostarten, vad: "En elev slår tärningarna, och gruppen berättar vid skyltarna.", fraser: [Hur ska det gå?] }
        - { tid: 5–8, fas: 2 · Där vi slutade, vad: Paret läser ditt svar., fraser: [Vad svarar ni på lappen?] }
        - { tid: 8–16, fas: 3 · Skrivdraget, vad: "Du läser ur en modellsaga och skriver nästa station i din saga. Varje par säger en mening med draget.", fraser: [Vad kallar vi det här draget?] }
        - { tid: 16–50, fas: 4 · Berätta och skriva, vad: "Berättaren säger meningen, Skrivaren säger den igen och skriver, båda läser, och de byter kort. Vid minut 46 spelar ett annat par bara det som står.", fraser: [Börja med lappen.] }
        - { tid: 50–60, fas: 5 · Läsarna lyssnar, vad: "Efter spelet skriver paret en mening där spelarna stod stilla.", fraser: [Var stod ni stilla?] }
  mall:
    rubrik: Sagans väg
    underrad: "Fyra och sex steg, dragen och de andra passen"
    block:
      - typ: tabell
        rubrik: Sagans väg i fyra steg
