      - - Räven som ville flyga
        - "Sex steg, högläsningen. Hjälten: Rasmus vill flyga som gässen. Problemet: rävar har inga vingar. Hjälparen: en gås ger en fjäder. Det värsta: två hopp, och han fastnar i en gran. Lösningen: fjädern mot vinden. Landningen: han flyger med gässen."
