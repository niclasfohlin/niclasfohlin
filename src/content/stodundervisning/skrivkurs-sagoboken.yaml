            - { rubrik: Så gör du, text: "Säg: ”Berätta en saga om bilden” eller ”Skriv en saga om bilden”. Sagans väg ligger inte framme. Skriv B efter namnet när eleven berättar och S när eleven skriver.\nI fyra steg berättar eleven för dig i omkring fem minuter. Du spelar in med skolans surfplatta eller dator och skriver ner berättelsen ordagrant efteråt. Den räknar du som en skriven saga.\nI sex steg skriver eleven i 15 minuter. Är det mycket tungt för en elev att skriva, berättar hen i stället.\nI vecka 9 gör eleven uppgiften på samma sätt. I fyra steg jämför du elevens två sagor efter passet, och i sex steg jämför eleven själv den nya sagan med den första." }
