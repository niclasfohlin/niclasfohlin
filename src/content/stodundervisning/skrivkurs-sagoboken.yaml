lathund:
  innehall: En saga på sagans väg
  metoden:
    text:
      - "Eleverna lär sig bygga en saga efter sagans väg: hjälten önskar sig något, ett problem står i vägen, och hjälten löser det själv. Fyra steg passar de flesta grupper i åk 1–⁠3 och sex steg de flesta i åk 4–⁠6."
      - "Kursen är 30 pass. Gruppen läser och planerar i vecka 1–⁠2 och skriver en saga tillsammans i vecka 3–⁠4. Paren gör sina sagor i vecka 5–⁠8, och i vecka 8–⁠10 gör ni boken. Eleverna berättar och spelar varje saga innan de skriver den. Före kursen gör du Sagokollen och bestämmer vem som ska läsa boken."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - { fet: Hjälten löser problemet själv., text: "Hjälparen ger något, men hjälten gör det svåra." }
        - { fet: Berätta innan ni skriver., text: Paret berättar sagan tre gånger och säger varje mening högt innan någon skriver den. }
        - { fet: Rätta först när ni gör boken., text: "Medan paren skriver, svarar du som läsare." }
    tabell:
      rubrik: Skrivpassets delar
      kolumner: [Del, Exempelfraser]
      rader:
        - ["1 · Sagostarten\nSagan vid skyltarna", "”Nu kom stormen. Hur ska det gå?”"]
        - ["2 · Där vi slutade\nSista meningen", "”Vilken station är ni på?”"]
        - ["3 · Skrivdraget\nDu visar ett drag", "”Vad kallar vi det här draget?”"]
        - ["4 · Berätta och skriva\nParet byter roller", "”Vad händer vid er station? Berätta för din kamrat först.”"]
        - ["5 · Läsarna lyssnar\nEtt par läser", "”Var blev det mest spännande?”\n”Hur ska det gå?”"]
    not: "I läspassen berättar och läser du en saga, och gruppen återberättar den längs skyltarna. I planeringspassen slår ni tärningarna och fyller i Sagans väg och berget. I vecka 3–⁠4 skriver du gruppens saga, och varje elev ger ett förslag innan du skriver. I berättarpassen berättar paren sagan två gånger med Kamratens frågor, spelar den för gruppen och sätter lappar vid stationerna."
  pass:
    rubrik: "Vi kör ett pass: Det värsta, sex steg"
    textRubrik: Gruppen · sex elever i åk 4, pass 20
    text:
      - "Liam slår tärningarna och får en mus, önskan att rädda någon, en storm, en myra och en flöjt. Sedan berättar gruppen vid vägskyltarna. Läraren läser ur Hans och Greta: ”Gretas händer skakade. Ugnen var het. Greta tog ett steg bakåt.” Noah säger: ”Det är korta meningar.” Alva säger: ”Hon gör en sak i taget.” Gruppen känner igen draget att sakta ner vid det värsta, och varje par säger en egen mening med draget."
      - "Omar berättar: ”Prinsessan klättrade, men stenarna rasade.” Alva säger meningen igen och skriver den, och sedan byter de roller. Elin och Noah är oense, så de slår tärning 4 och får en storm. Läraren frågar Sara och Liam: ”Vad gör hjälten först?” Sist läser Elin och Noah sin text och börjar med meningen de strök under. Omar frågar: ”Hur ska det gå?”"
    forberett:
      rubrik: Det jag förberedde
      text:
        - Jag läste parens sista meningar och Parets väg och valde draget att sakta ner vid det värsta. Jag hittade draget i Hans och Greta. Sedan skrev jag två egna meningar med draget.
    klarTidigt: Paret läser sagan för ett annat par eller ritar en bild till stationen på ett eget papper.
    schema:
      rubrik: 60 minuter, del för del
      rader:
        - { tid: Före, fas: Förberedelse, vad: Läs parens sista meningar och välj skrivdraget. }
        - { tid: 0–5, fas: 1 · Sagostarten, vad: "En elev slår tärning 1, 3 och 4, och i sex steg också tärning 5 och 6. Sedan berättar gruppen vid skyltarna.", fraser: [Hur ska det gå?] }
        - { tid: 5–10, fas: 2 · Där vi slutade, vad: Varje par läser sin sista mening., fraser: [Vilken station är ni på?] }
        - { tid: 10–20, fas: 3 · Skrivdraget, vad: "Du läser ur en modellsaga och skriver två egna meningar med draget. Sedan säger varje par en mening med draget.", fraser: [Vad kallar vi det här draget?] }
        - { tid: 20–50, fas: 4 · Berätta och skriva, vad: "Berättaren säger meningen, Skrivaren säger den igen och skriver, båda läser, och sedan byter de rollkort. Paret stryker under meningen med draget.", fraser: [Vad gör hjälten först?] }
        - { tid: 50–60, fas: 5 · Läsarna lyssnar, vad: "Ett par läser och börjar med meningen de strök under. Gruppen säger var det blev spännande.", fraser: [Var blev det mest spännande?] }
