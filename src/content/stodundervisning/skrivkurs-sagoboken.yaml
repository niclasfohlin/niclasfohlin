    sekunder: 24.26
    beskrivning: "Paret har berättat sagan förut. Omar berättar och Alva skriver. Omar säger: ”Prinsessan klättrade, men stenarna rasade.” Skrivaren säger meningen igen och skriver. Alva säger: ”Prinsessan klättrade, men stenarna rasade.” Båda läser högt. Omar och Alva säger: ”Prinsessan klättrade, men stenarna rasade.” Sedan byter de roller. Alva säger: ”Hon försökte igen, men då kom draken.” Omar säger: ”Hon försökte igen, men då kom draken.”"
    rubrik: "Berättaren och Skrivaren"
