          - ["Planeringspass", "0–5 Sagostarten · 5–20 tärningarna och orden\n20–50 vägen och berget · 50–60 två par berättar"]
          - ["Bokpass", "0–5 Sagostarten · 5–15 du visar uppgiften\n15–50 paren arbetar · 50–60 ett par läser"]
      - typ: tabell
        rubrik: Sagans väg i sex steg
