    not: "I fyra steg är sagan kort, med en eller två meningar vid varje station. Redan i första meningen vill hjälten något. Hjälten har också med sig en sak eller kan något, och det använder hen vid Lösningen."
  - rubrik: Sagans väg i sex steg
    plats: efter-inledning
    kolumner:
      - Stationen
      - Startorden
      - Frågan
    rader:
      - - 1 Hjälten
        - Det var en gång
        - Vem är hjälten, och vad önskar hen sig?
      - - 2 Problemet
        - Men en dag
        - Vad står i vägen för önskan?
      - - 3 Hjälparen
        - På vägen mötte
        - Vem hjälper hjälten, och vad får hjälten?
      - - 4 Det värsta
        - Plötsligt
        - Hjälten försöker två gånger. Vad händer?
      - - 5 Lösningen
        - Men då
        - Vad gör hjälten själv med det hen har fått?
      - - 6 Landningen
        - Till slut
        - Fick hjälten sin önskan? Hur känns det nu?
    not: "Sex steg har samma stationer som fyra steg och två till mellan Problemet och Lösningen, så att problemet hinner växa. Startorden är ett stöd, och i boksagan får paret byta dem mot egna."
  - rubrik: Från idé till saga
    plats: efter-inledning
    meny: true
    text: "Gruppens saga i vecka 2–⁠4 och parens sagor i vecka 5–⁠8 går igenom samma fem moment. Eleverna berättar sagan tre gånger innan de skriver den, och sagan hinner växa medan de berättar."
    kolumner:
      - Momentet
      - Det eleverna gör
      - Med vad
    rader:
      - - 1. Hitta på
        - Paret slår tärningarna och väljer bland sidorna. I fyra steg ritar paret i rutan vid varje station, och i sex steg skriver de några ord där. Paret färgar också lågorna på berget. Ju mer spännande stationen ska vara, desto fler lågor färgar de.
        - Tärningarna, Sagans väg och Spänningsberget, och Hjältens kort till gruppens saga och boksagan
      - - 2. Berätta
        - Paret berättar sagan för varandra två gånger med bladet Sagans väg framför sig. Kamraten läser frågan på kortet vid varje station, och när sagan är slut byter de. Den andra berättar då samma saga med svaren i.
        - Sagans väg och Kamratens frågor
      - - 3. Spela
        - Paret spelar sagan för gruppen längs skyltarna. Lyssnarparet och gruppen ger idéer, som paret får på lappar. Sist väljer paret de lappar de vill ha och skriver en egen lapp om det som kom till när de berättade. Lapparna sätter de vid stationerna.
        - Vägskyltarna, repet, lådan och lappar
      - - 4. Skriva
        - Berättaren säger en mening, Skrivaren säger den igen och skriver, och båda läser. Efter varje mening byter de roller. När paret har skrivit sagan, sätter de en bock vid varje station där sagan svarar på stationens fråga.
        - Sagans väg, rollkorten och papper eller dator
      - - 5. Läsa
        - Paret läser sagan för ett annat par, som lyssnar och svarar på Läsarens frågor. När paret läser boksagan, färgar lyssnarparet också ett eget berg. Paret som skrev sagan jämför lågorna på de två bergen och ändrar sagan där det behövs.
        - Läsarens frågor och Spänningsberget
    not: "Gruppen hittar på sin saga i pass 4–⁠5, berättar och spelar den i pass 6 och skriver den med dig vid pennan i pass 7–⁠12. I pass 12 läser gruppen sagan och svarar på Läsarens frågor."
