film:
  sekunder: 28.29
  beskrivning: "En elev slår tre tärningar. Eleven lägger tärningarna vid skyltarna. Gruppen berättar sagan, en mening vid varje station. Maja säger: ”Det var en gång en mus som ville ha en skatt.” Ali säger: ”Men en dag kom en stor drake och vaktade skatten.” Gruppen frågar: ”Hur ska det gå?” Hjälten löser problemet själv. Ebba säger: ”Då kröp musen in genom ett hål som var för litet för draken.” Vid Landningen får hjälten sin önskan. Isak säger: ”Till slut hade musen skatten, precis som hon ville.”"
  rubrik: "Så gör eleven"
  ingress: "Fyra bilder ur filmen om Sagostarten i fyra steg, i en grupp i åk 2: en elev slår tärningarna, och gruppen berättar en saga med en mening vid varje station. Filmen på metodens sida visar samma sak i rörelse. De gula bubblorna är elevernas."
  stillbilder:
    - text: "Tärning 1, 3 och 4 visar en mus, en skatt och en drake."
    - text: "Maja berättar om en mus som vill ha en skatt."
    - text: "Draken vaktar skatten. Gruppen frågar hur det ska gå."
    - text: "Musen löser problemet själv och får skatten."
