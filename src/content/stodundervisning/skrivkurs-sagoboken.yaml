        - "Fyra steg, saga 1. Hjälten: tre bockar som vill upp på berget. Problemet: trollet under bron hotar den lilla och den mellersta. Lösningen: den stora bocken stångar trollet ner i forsen. Landningen: bockarna äter sig runda."
      - - De tre små grisarna
        - "Fyra steg, saga 2. Hjälten: tre grisar som vill ha ett hus som står emot vargen. Problemet: vargen blåser omkull två hus. Lösningen: ett hus av sten och en gryta under skorstenen. Landningen: vargen kommer aldrig tillbaka."
      - - Hans och Greta
        - "Sex steg, saga 1. Hjälten: syskonen vill aldrig mer vara hungriga. Problemet: de går vilse. Hjälparen: ugglans råd. Det värsta: häxan låser in Hans och eldar i ugnen. Lösningen: Greta lurar in häxan. Landningen: aldrig mer hungriga."
      - - Jack och bönstjälken
