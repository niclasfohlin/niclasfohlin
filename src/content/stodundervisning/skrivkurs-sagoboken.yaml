# Skriven av riggen 2026-10-02 ur Niclas uppdrag (intake/skrivkurs-sagoboken.md), sökningen och analysen. Omtaget
# 2026-10-09 efter Texttyper i grupp (analys-omtag-2026-10.md): veckosidor i stället för kursplanen, Pass med egna
# minuter och Materialet i varje pass, ett barn per par som läsare, Två texter, Spela det som står och din egen saga.
titel: "Skrivkurs: sagoboken"
undertitel: Lärarledd skrivkurs i liten grupp där eleverna skriver sagor i par och gör en tryckt sagobok, för åk 1–6
ingress: "Gruppen läser sagor och hittar sagans väg i fyra eller sex steg: hjälten önskar sig något, ett problem står i vägen och växer, och hjälten löser det själv. Sedan gör gruppen en saga tillsammans och paren sina egna. Eleverna berättar och spelar sina sagor innan de skriver dem. Kursen slutar med en tryckt sagobok."
omrade: Skrivning
arskurs:
  - F-3
  - 4-6
arskursText: åk 1–6
taggar:
  - textstruktur
  - skrivstrategier
  - formativ-bedomning
format:
  - liten grupp
  - par
tid: 60 minuter per pass, tre pass i veckan
period: Tio veckor
grupp: Fyra till tolv elever
material:
  - vägskyltar och rep
  - tärningar
  - blad och kort ur planeringsmallarna
  - modellsagor
  - låda och lappar
  - blädderblock
uppdaterad: 2026-10-09
relaterade:
  - skrivkurs-berattelseram
  - texttyper-i-grupp
utkast: false
inledning:
  - Sagor och berättande är nog inprogrammerat i vårt DNA. Ända sedan människan tittade upp mot stjärnorna och undrade vad som fanns där ute, har vi berättat sagor för varandra. Nu ska du hjälpa eleverna att bli en del av detta arv. Det är ett fantastiskt uppdrag.
  - "Eleverna lär sig bygga en saga som håller ihop. Sagans väg är kursens kärna: hjälten önskar sig något, ett problem står i vägen och växer, och sagan landar när hjälten har löst det själv. Gruppen gör en saga tillsammans, och sedan gör paren sina egna. Paret hittar på sagan med tärningarna, berättar den för varandra och spelar den för gruppen, och direkt efter scenen skriver paret den station där det blev mest spännande. Varje par skriver till ett yngre barn, och sagorna blir en tryckt sagobok."
  - "På bordet ligger rollkorten, frågekorten, Spänningsberget och parets blad Sagans väg, Vår saga och Det här tar vi med oss. Vägskyltarna ligger längs ett rep på golvet, och tärningarna mitt på bordet. Tärningarna ger idéer och avgör när paret inte kommer överens. Paret ritar eller skriver några ord vid varje station och färgar lågor på berget där det ska bli spännande. Från vecka 5 skriver du din egen saga på blädderblocket, en station i taget."
  - "I vecka 1, 2 och 4 jämför gruppen Två texter, två sagor där bara en sak skiljer, som önskan eller vem som gör det svåra. Från vecka 2 börjar passen med Sagostarten, som filmen visar: en elev slår tärningarna, och gruppen berättar en saga med en mening vid varje skylt. I Skrivdraget ser eleverna dig skriva nästa station i din egen saga, ibland på två sätt, och hör dig tänka högt. Sedan berättar paret stationen, och Berättaren säger varje mening innan Skrivaren skriver den. Medan sagan går att ändra möter paret läsare: ett annat par spelar bara det som står, du skriver på en lapp i boksagan vad du undrar, och barnet som sagan är till lyssnar innan boken trycks."
  - "Sagans väg finns i två versioner. Fyra steg, med Hjälten, Problemet, Lösningen och Landningen, passar de flesta grupper i åk 1–3. I sex steg kommer Hjälparen och Det värsta till före Lösningen, och den versionen passar de flesta grupper i åk 4–6. Hela gruppen använder samma version. Välj fyra steg när de flesta i gruppen skriver högst några meningar på egen hand, och sex steg när de flesta skriver en halv sida."
  - "Kursen är tio veckor med tre pass i veckan. Paret gör en saga på tre pass, med tärningarna, på scenen och på pappret, och boksagan får en vecka till. Före kursen gör du Sagokollen, där varje elev berättar eller skriver en saga om en bild utan sagans väg framför sig. Läs först tabellen Kursen vecka för vecka och de två tabellerna Sagans väg. Varje vecka har sin sida under Till läraren: veckorna."
  - "Ett exempel: Alva och Omar i åk 4 skriver till Elsa i förskoleklassen. Första gången Elsa kommer, säger hon att hon vill ha en drake, men inte för läskig. När paret spelar sin saga, föreslår Liam att stenarna rasar när prinsessan klättrar, och paret skriver in det i boksagan. När Elsa kommer tillbaka, pekar hon på just det stället."
upplagg:
  rubrik: Så fungerar insatsen
  text: "Kursen har tre pass i veckan under tio veckor, 30 pass på 60 minuter, och gruppen har fyra till tolv elever i par. I vecka 1–2 läser gruppen sagor, möter barnen som boken är till och planerar en saga tillsammans. I vecka 3–4 skriver gruppen sagan med dig, och varje par skriver sin version av varje station. I vecka 5–6 gör paren en saga i veckan, med ett planeringspass, ett berättarpass och ett skrivpass, och i vecka 7 skriver de klart boksagan. I vecka 8 lyssnar barnen på den, och i vecka 9–10 gör ni boken och har boksläpp. Före kursen och i vecka 9 gör du Sagokollen."
gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Kursen är för fyra till tolv elever i åk 1–6 som kan berätta om något som har hänt men som räknar upp händelser eller löser problemet direkt när de skriver en saga. En elev som ännu inte berättar med början och slut behöver öva det muntligt med bilder först, och den som redan skriver välutvecklade sagor behöver inte kursen. Elever som inte ljudar ihop ord än kan vara med, och de tränar avkodning i en annan insats. Sätt ihop par där de två är bra på olika saker. Paren är desamma hela kursen. Med ett udda antal elever blir ett par en trio med Utbyggaren. Varje par har ett lyssnarpar."
principer:
  rubrik: Tre saker att hålla fast vid
  text: "Hjälten löser problemet själv. Hjälparen ger en sak eller ett råd, men hjälten gör det svåra. Därför frågar ni vid Lösningen vad hjälten själv gör. Berätta innan ni skriver. Paret berättar sina sagor tre gånger innan de skriver dem, två gånger för varandra och en gång på scenen. Bara snabbsagan, som är en övning, skriver paret direkt. Berättaren säger varje mening högt innan Skrivaren skriver den. Spara rättningen till boken. Medan paren skriver svarar du på innehållet som en läsare, och stavningen rättar ni tillsammans i vecka 8–9, eftersom andra ska läsa sagan i boken."
