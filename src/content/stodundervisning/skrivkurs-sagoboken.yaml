passrutin:
  kallas: delar
  text: "Skrivpassen har samma fem delar, så paren vet vad som ska hända."
  steg:
    - text: "En elev slår tärningarna. Gruppen berättar en mening vid varje skylt och gör en rörelse till startordet, som en båge vid ”Det var en gång”."
      fas: Sagostarten
    - text: "Paren läser sin sista mening. Paret bredvid säger vad de undrar: ”Nu undrar jag vad draken gör.”"
      fas: Där vi slutade
    - text: "Du läser ur modellsagan där draget syns och skriver nästa station i din saga. Varje par säger en mening med draget."
      fas: Skrivdraget
    - text: "Före varje station läser Skrivaren frågan på Kamratens frågor. Berättaren säger en mening, Skrivaren säger den igen och skriver, och de byter roll."
      fas: Berätta och skriva
    - text: "Ett par läser för gruppen, först meningen med draget. Gruppen svarar på två frågor från kortet Läsarens frågor."
      fas: Läsarna lyssnar
  efterPasset: "Från pass 13 skriver du på Parets väg vad paret lade till och vad de behöver nästa pass."
tidsschema:
  rubrik: 60 minuter, del för del
  text: "Tabellen gäller alla skrivpass, men pass 11 i fyra steg, pass 12 och pass 22 har egna minuter på veckans sida. Det som är annorlunda i de andra passen står också där, med delens namn först. Minuterna är hållpunkter."
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: "Läs veckans sida och det paren skrev sist, och tänk ut nästa station i din saga. Lägg fram skyltarna, och parens blad, berg och kort."
    - tid: 0–5
      fas: Sagostarten
      vad: "Vid Problemet, i sex steg Det värsta, frågar gruppen: ”Hur ska det gå?” Vid Lösningen frågar du: ”Vem löser det?”"
    - tid: 5–8
      fas: Där vi slutade
      vad: "Säg till varje par vad de behöver i dag, ur Parets väg."
    - tid: 8–16
      fas: Skrivdraget
      vad: "Fråga vad författaren gör. Tänk högt när du skriver, och stryk det du skrev först. Fråga: ”Vad kallar vi det här draget?”"
    - tid: 16–50
      fas: Berätta och skriva
      vad: "Efter första varvet sitter du med paren som Parets väg pekar ut: ”Vilken mening sa ni på scenen? Skriv den först.”"
    - tid: 50–60
      fas: Läsarna lyssnar
      vad: "Fråga: ”Var blev det mest spännande?” och ”Undrade ni något?” Är sagan inte klar, avslutar du med: ”Hur ska det gå?”"
  efter: "I Sagostarten slår eleven tärning 1, 3 och 4, i sex steg också 5 och 6, och säger orden. I delen Där vi slutade bestämmer paret om meningen står kvar, och i en ny saga läser paret först sin rad på bladet Det här tar vi med oss. I delen Berätta och skriva stryker paret under meningen med draget. I första varvet ställer du en fråga till varje par och stannar högst två minuter. Frågar Skrivaren hur ett ord stavas, säger du: ”Skriv det du hör, så tittar vi på det inför boken.” Blir ett par klart tidigt, bygger paret ut en station: efter varje mening skriver de en mening till med stationens drag. Paret kan också göra strukturen Spela det som står med ett annat klart par. Ett par som inte blir klart börjar nästa skrivpass med att skriva klart stationen, och ett par som ligger mer än ett pass efter sitter med dig. När en saga är klar läser varje par för sitt lyssnarpar i delen Läsarna lyssnar, och lyssnarparet svarar på hela Läsarens frågor. Säger någon bara ”Bra!”, frågar du vad i meningen som var bra."
arbetsform:
  rubrik: "Arbetsform: gemensamt, läraren visar, i par, gemensamt igen"
  text: "Passet börjar gemensamt med Sagostarten och Där vi slutade. Sedan visar du draget i din saga, paren berättar och skriver, och sist samlas gruppen igen. Med fler än tre par läser paren i Där vi slutade samtidigt för paret bredvid, och du lyssnar på ett par."
  delar:
    - rubrik: 1. Gemensamt
      text: Gruppen berättar vid skyltarna, och paren läser sin sista mening
      faser: [Sagostarten, Där vi slutade]
    - rubrik: 2. Läraren visar
      text: Du läser, skriver din saga och tänker högt
      faser: [Skrivdraget]
    - rubrik: 3. I par
      text: Två och två, och de byter roller efter varje mening
      faser: [Berätta och skriva]
    - rubrik: 4. Gemensamt igen
      text: Hela gruppen, eller två par tillsammans
      faser: [Läsarna lyssnar]
exempel:
  valt:
    rubrik: Gruppen
    text: "sex elever i åk 4, i tre par, som skriver efter sagans väg i sex steg. Det är pass 20 i vecka 7. Paren skriver klart Det värsta i boksagan. Dagens drag är att sakta ner vid det värsta."
  text:
    - "Liam slår tärningarna och säger orden: en mus, rädda någon, en storm, en myra och en flöjt. Han lägger tärningarna vid skyltarna, gruppen säger orden igen, och sedan berättar gruppen sagan. Liam börjar: ”Det var en gång en mus som ville rädda sin syster.” Elin står vid Det värsta och säger två meningar: ”Plötsligt blåste stormen så hårt att musen inte kunde gå. Hon försökte krypa, men vinden drog henne bakåt.” Gruppen frågar: ”Hur ska det gå?” Sara står vid Lösningen och säger: ”Men då spelade musen på flöjten, och stormen somnade.”"
    - "Alva och Omar läser lappen som läraren skrev efter pass 19: ”Här höll jag andan: prinsessan stod vid berget. Nu undrar jag: hur kommer hon upp?” Omar säger: ”Hon klättrar, men det går inte.” Alla tre paren är på Det värsta, och läraren säger att dagens drag är att sakta ner där."
    - "Läraren läser ur Hans och Greta, där Greta står vid ugnen: ”Gretas händer skakade. Ugnen var het. Greta tog ett steg bakåt.” Läraren frågar vad författaren gör. Noah säger: ”Det är korta meningar.” Alva säger: ”Hon gör en sak i taget.” Gruppen känner igen draget att sakta ner vid det värsta. Det står redan på väggen. Sedan skriver läraren nästa station i sin egen saga på blädderblocket och tänker högt: ”Jag skriver: Trollet kom. Nej, jag tar det steg för steg. Bron knakade. En grön hand tog tag i räcket.” Varje par säger en mening med draget om sin egen station."
    - "Paren skriver. Alva och Omar skrev Det värsta redan i pass 17, när scenen frös där. Nu bygger de ut stationen, och vid den sitter lappen där Liam föreslog stenarna. Läraren säger: ”Skriv den meningen först.” Omar är Berättaren och säger: ”Prinsessan klättrade, men stenarna rasade.” Alva säger meningen igen och skriver, och de läser den tillsammans. Sedan byter de kort, och Alva berättar: ”Hon försökte igen, men då kom draken.” Elin och Noah är oense om vad som ska göra det ännu värre. De slår tärning 4 och får en storm. Läraren går ett varv och frågar Sara och Liam: ”Vad gör hjälten först? Och vad händer då?” De lägger till ett försök som misslyckas."
    - "Vid minut 46 spelar paren varandras sagor. Elin läser det hon och Noah har skrivit, och Alva och Omar spelar bara det som står. Vid Det värsta står Omar stilla och säger ”Stopp!” Elin och Noah skriver en mening där: ”Prinsen höll sig fast i en gren medan stormen ven.” Efteråt skriver läraren på Parets väg för varje par. Alva tog pennan en gång när det var Omars tur, och Omar skriver först nästa pass."
fastnar:
  rubrik: När paret fastnar
  text: "Ett par kan fastna på tre sätt: stationen är tom, paret har ingen idé, eller paret är oense. Börja med det minsta stödet."
  fragaForst:
    - Läs för mig det ni har skrivit. Var på vägen är ni?
    - Vad önskar sig hjälten?
  trappa:
    - "Peka på stationen på bladet och läs frågan högt."
    - "Låt paret slå tärningen för stationen och välja om de tar den nya idén eller behåller den gamla. Tabellen Berättartärningarna visar vilken tärning som hör till stationen. Har paret ingen idé alls, låt dem låna stationen från en modellsaga och sätta in sin egen hjälte."
    - "Låt Berättaren berätta stationen högt, en mening i taget, och Skrivaren säga varje mening igen."
    - "Låt paret spela stationen: den ena är hjälten och den andra det som står i vägen. Sedan skriver paret det de sa."
    - "Ge paret två startord att välja mellan vid stationen, till exempel ”Plötsligt” eller ”Då hördes” vid Det värsta."
    - "Skriv meningen eleven säger, som sekreterare, och låt eleven läsa tillbaka. Sedan tar paret pennan igen."
  motto: Pennan stannar hos paret.
roll:
  rubrik: "Lärarens roll: hålla i vägen, inte i pennan"
  text: Du håller i vägen så att sagorna hänger ihop och paren blir klara. Du visar ett drag i taget och skriver själv inför gruppen. Men sagan är parets. Bestämmer du vad hjälten gör, är sagan inte längre parets.
  gor:
    - Skriv inför gruppen och tänk högt om dina val.
    - Låt varje elev lämna ett förslag innan gruppen skriver.
    - Låt paret berätta och spela sagan innan de skriver den.
    - Svara som läsare, till exempel ”Jag blev rädd när stenarna rasade”.
    - Rätta stavningen tillsammans med paret inför boken.
  undvik:
    - Att skriva åt paret när det går för långsamt.
    - Att rätta stavningen under skrivandet.
    - Att berömma med ”Bra!” utan att säga vad du såg.
    - Att låta en elev i paret skriva allt.
    - Att låta paret skriva att hjälparen eller en ny figur löser problemet.
urval:
  rubrik: Var hittar du sagorna?
  text:
    - "Under Kursens material finns två modellsagor för varje version, återberättade folksagor som följer sagans väg. Vid vecka 1, 2 och 4 står Två texter, nyskrivna par där bara en sak skiljer och den andra sagan följer vägen. Läs fler folksagor högt och pröva dem mot vägen. Rödluvan och sagan om Guldlock och de tre björnarna är bra att pröva just för att de inte följer vägen. Vem löser problemet i Rödluvan, och vad önskar Guldlock? Gruppens saga, din egen saga och parens sagor blir sedan nya modellsagor."
  kravText: "En saga är en bra modellsaga när den uppfyller tre krav:"
  krav:
    - rubrik: Hjälten önskar något
      text: Önskan syns tidigt och sagan handlar om den
    - rubrik: Problemet växer
      text: Det blir gärna värre tre gånger, som i folksagorna
    - rubrik: Hjälten löser det själv
      text: Hjälparen ger något, men hjälten gör det svåra
uppfoljning:
  text: "Sagokollen visar om eleven bygger en saga med vägens stationer utan att vägen ligger framme. Låt eleven göra samma uppgift före kursen och i vecka 9, lika länge och på samma sätt men med en ny bild av samma slag. I fyra steg berättar eleven, och du spelar in och skriver ner berättelsen efteråt. På Parets väg skriver du det du ser hos varje par, och raderna på Det här tar vi med oss visar vad paret tar med sig. Boken visar vad paren kan. Efter kursen berättar du för klassläraren vilka drag och stationer varje elev klarar själv."
  rader:
    - nar: Före kursen
      vad: "Varje elev berättar eller skriver en saga om en bild."
    - nar: Pass 13–23
      vad: "Parets väg visar det paret lade till, om det kom med och parets drag."
    - nar: Pass 25 och 27 i fyra steg, pass 26 i sex steg
      vad: "Samma uppgift med en ny bild."
mal:
  rubrik: "Mål: vad eleven ska kunna göra efter kursen"
  text: "Eleven ska göra det här oftare än före kursen:"
  punkter:
    - Berätta och spela upp en saga efter sagans väg, och bygga ut den muntligt
    - Ge hjälten en önskan som sagan handlar om
    - Låta ett problem stå i vägen för önskan, och i sex steg låta hjälten försöka minst två gånger så att problemet växer
    - Låta hjälten lösa problemet själv, med det hen kan eller har fått
    - Knyta ihop slutet med önskan
    - Använda skrivdrag från väggen i sin egen saga, som att visa en känsla genom det kroppen gör eller skriva en replik
    - "Säga meningen, skriva den och läsa den tillsammans med en kamrat, och byta roll efter varje mening"
    - Läsa sin saga station för station och säga vad som finns och vad som saknas
    - Ge respons som läsare genom att ställa en fråga eller säga var det blev spännande
checklista:
  rubrik: Checklista inför kursen
  punkter:
    - Bett om ett yngre barn till varje par.
    - Bokat pass 3, pass 22 och boksläppet.
    - Frågat hemmen om namn och bilder i boken.
    - Gjort Sagokollen veckan före.
    - Tagit fram låda, block, skyltar och rep, två satser om ni är fem eller sex par.
    - Gjort tärningarna före pass 4.
grund:
  text: "Att undervisa explicit om berättelsens delar, som en strategi eleverna kan använda när de skriver, hör till det som har bäst belägg i forskningen om skrivundervisning, också för elever med inlärningssvårigheter (Graham m.fl., 2012; Graham och Harris, 2005; Graham och Perin, 2007; Gillespie och Graham, 2014). Sagans väg är en sådan strategi, och den sätter hjältens önskan först och försök före lösningen, eftersom eleverna i sina sagor ofta räknar upp händelser eller löser problemet direkt (Thorsten, 2019). Elever som först berättar muntligt skriver sedan bättre berättelser, och när barn spelar upp berättelser blir berättelserna bättre uppbyggda och barnen bättre på att förstå dem (Spencer och Petersen, 2018; Lee och Enciso, 2017; Nicolopoulou m.fl., 2015). Kursen följer genrepedagogikens cirkelmodell, men eleverna skriver i par och för riktiga läsare, som i Skriv! (Fohlin och Wilson, 2027). I åk 6 och hos 10–11-åringar förbättrade sig elever som skrev i par med var sin roll mer än de som skrev ensamma (Montanero m.fl., 2025; Yarrow och Topping, 2001). Innan gruppen skriver tillsammans kommer varje elev med ett förslag, eftersom gemensamt skrivande inte gav någon effekt i en studie i åk 4–6, där de säkraste eleverna kan ha tagit över formuleringarna (Hermansson m.fl., 2019)."
  kallor: Bygger på Graham, McKeown, Kiuhara och Harris (2012), Graham och Harris (2005), Graham och Perin (2007), Gillespie och Graham (2014), Thorsten (2019), Spencer och Petersen (2018), Lee och Enciso (2017), Nicolopoulou m.fl. (2015), Montanero m.fl. (2025), Yarrow och Topping (2001), Hermansson m.fl. (2019) och Fohlin och Wilson, Skriv! (utkommer 2027).
ramar:
  rubrik: Kursens material
  text:
    - "Först kommer Till läraren: veckorna, med en sida för varje vecka och veckans material direkt efter. Sedan kommer det som gäller hela kursen: återkopplingen, de två strukturerna, modellsagorna, vägskyltarna, Sagans väg, Vår saga i sex steg, Spänningsberget, Hjältens kort, tärningarna, frågekorten, rollkorten, Det här tar vi med oss, bladen till boken, Sagokollen och Parets väg. Varje blad börjar på ett nytt A4. I fyra steg skriver paret sagan direkt på bladet Sagans väg och boksagan på Vår saga i fyra steg. I sex steg planerar paret på Sagans väg och skriver på Vår saga i sex steg eller på dator. Till den förstorade vägen kopierar du bladet Sagans väg för er version i A3 och sätter upp det på väggen. Gruppens saga skriver du på blädderblocket, ett ark för varje station, och sätter upp arken under vägen. Din egen saga skriver du på blädderblocket, efter gruppens saga. Bladen till boken är omslaget, Bokens sida och Författarna. De har ingen sidfot, så att kopiorna kan bli sidor i boken som de är."
  ramar:
    # ---------------------------------------------------------------- Veckorna
    - rubrik: "Till läraren: veckorna"
      lektioner: true
      text:
        - "Överst på veckans sida står fokus och sist det du ska lägga märke till. Däremellan står de tre passen. Varje pass börjar med sitt slag och säger bara det som är annorlunda än i slagets tabell. Där versionerna skiljer sig står fyra steg först och sex steg på en rad sist i passet."
      delar:
        - rubrik: "Vecka 1 · Sagorna"
          falt:
            - rubrik: Fokus
              text: "Gruppen hittar sagans väg."
            - rubrik: Pass 1
              text: "Läspass.\n0–⁠10 min. Berätta om sagoboken och paren, och läs musens andra saga, vecka 2.\n10–⁠25 min. Läs Bockarna Bruse vid skyltarna.\n25–⁠40 min. Gruppen återberättar, och på ”Byt!” tar nästa över.\n40–⁠60 min. Visa sagans väg på tavlan, och gruppen hittar på rörelser.\nI sex steg: Hans och Greta, och musen bara vid skylt 1, 2, 5 och 6."
            - rubrik: Pass 2
              text: "Läspass.\n0–⁠5 min. Gruppen berättar musens saga med rörelserna.\n5–⁠25 min. Två texter, vecka 1: Ekorren, och paret skriver vad ekorren vill.\n25–⁠40 min. Gruppen färgar berget för Bockarna Bruse.\n40–⁠60 min. Skriv upp önskan. Gruppen berättar ekorrens andra saga vid skyltarna.\nI sex steg: högläsningen och Två texter 5–⁠30 min, berget och ett försök 30–⁠45 min, Hans och Greta vid skyltarna 45–⁠60 min."
            - rubrik: Pass 3
              text: "Läspass med barnen.\n0–⁠25 min. Du berättar De tre små grisarna, och gruppen läser och återberättar den.\n25–⁠42 min. Barnen kommer och ser Sagoteatern med grisarna. De väljer en ny hjälte, och ni berättar sagan med den nya hjälten.\n42–⁠52 min. Paret intervjuar barnet med Frågorna till barnet.\n52–⁠60 min. Barnen går. Det de ville ha skriver du under Sagornas ord.\nI sex steg: Jack och bönstjälken."
            - rubrik: Lägg märke till
              text: "Eleven som frågar vad hjälten vill.\nParet som skriver önskan med egna ord."
        - rubrik: "Vecka 2 · Gruppens plan"
          falt:
            - rubrik: Fokus
              text: "Gruppen planerar sin saga med barnens svar, så att hjälten gör det svåra själv."
            - rubrik: Pass 4
              text: "Planeringspass.\n0–⁠10 min. Visa A-tärningarna. I den första Sagostarten säger du första meningen.\n10–⁠20 min. Gruppen slår tärning 1, 2, 3 och 6. Ett barns svar får ta en tärnings plats.\n20–⁠50 min. Gruppen fyller i Hjältens kort i A3 med det barnen ville ha. Du sitter först i heta stolen och svarar som hjälten.\n50–⁠60 min. Var och en prövar en första mening vid skylten Hjälten.\nI sex steg: tärning 1, 2 och 3."
            - rubrik: Pass 5
              text: "Planeringspass.\n0–⁠5 min. Gruppen gör Sagostarten med B-tärningarna.\n5–⁠15 min. Gruppen slår tärning 4, och i sex steg också 5 och 6.\n15–⁠30 min. Två texter, vecka 2: Vem gör det svåra? Sist skriver paret en lapp till Lösningen.\n30–⁠50 min. Gruppen skriver ord på den förstorade vägen och färgar berget i A3.\n50–⁠60 min. Gruppen berättar sagan vid skyltarna."
            - rubrik: Pass 6
              text: "Berättarpass för hela gruppen.\n5–⁠25 min. En elev står vid varje skylt, och ni byter plats efter varje varv. Du läser Kamratens frågor. Vid Landningen föreslår paren var sitt slut, och gruppen väljer det som knyter an till önskan.\n25–⁠50 min. Hela gruppen gör Sagoteatern, och du säger ”Frys!” vid toppen.\n50–⁠60 min. Gruppen väljer bland idéerna, och var och en säger en första mening."
            - rubrik: Lägg märke till
              text: "Eleven som föreslår att hjälten gör det svåra själv.\nEleven som tar med ett barns svar i planen."
        - rubrik: "Vecka 3 · Gruppens saga"
          falt:
            - rubrik: Fokus
              text: "Gruppen skriver sin saga med dig, och varje par skriver sin version av varje station."
            - rubrik: Skrivpasset i vecka 3–4
              text: "Där vi slutade: du läser gruppens saga.\nSkrivdraget: du skriver och tänker högt som i tabellen Skrivdragen.\n16–⁠26 min. Varje elev föreslår en mening med draget, och gruppen väljer den som svarar bäst på stationens fråga. Du skriver den.\n26–⁠50 min. Paret skriver sin version av stationen, två eller tre meningar.\nLäsarna lyssnar: Parens versioner på bordet, som står i återkopplingen."
            - rubrik: Pass 7
              text: "Skrivpass. Station Hjälten och draget Börja med vem, var och önskan.\nDär vi slutade: gruppen berättar sagan från pass 6.\nBerätta och skriva: 26–⁠31 min visar du rollerna med gruppens mening och skriver fraserna på tavlan: ”Din tur.” ”Säg meningen igen.” ”Ska vi höra båda förslagen?”"
            - rubrik: Pass 8
              text: "Skrivpass. Station Problemet och draget Låt kroppen visa känslan, i fyra steg med ett försök som misslyckas.\nSkrivdraget: i fyra steg skriver du två versioner av Problemet. I den ena löser hjälten problemet direkt, och i den andra går första försöket fel. Gruppen väljer."
            - rubrik: Pass 9
              text: "Skrivpass. Station Lösningen och draget En replik. Fråga: ”Vem löser det?”\nI sex steg: station Hjälparen, med draget En replik."
            - rubrik: Lägg märke till
              text: "Skrivaren som säger meningen igen innan hen skriver.\nEleven som tar pennan när det är kamratens tur."
        - rubrik: "Vecka 4 · Gruppens saga klar"
          falt:
            - rubrik: Fokus
              text: "Gruppens saga blir klar, och paren skriver och spelar snabbsagor."
            - rubrik: Pass 10
              text: "Skrivpass. Station Landningen och draget Knyt ihop slutet med önskan.\nSkrivdraget: ni läser Två texter, vecka 4: Slutet.\nBerätta och skriva: paret skriver hela Landningen själv.\nLäsarna lyssnar: gruppen väljer en av parens Landningar.\nI sex steg: Det värsta och draget Sakta ner."
            - rubrik: Pass 11
              text: "Skrivpass utan nytt drag.\n5–⁠15 min. Du läser gruppens saga, och gruppen säger var dragen syns.\n15–⁠20 min. Paret slår tärningarna.\n20–⁠45 min. Paret skriver en snabbsaga.\n45–⁠60 min. Paret läser för sitt lyssnarpar.\nI sex steg: Lösningen och Landningen, med Två texter, vecka 4: Slutet. Gruppen skriver en mening vid Lösningen 16–⁠24 min, och paret sin Lösning och Landning 24–⁠50 min."
            - rubrik: Pass 12
              text: "Skrivpass.\n5–⁠20 min. Gruppen prövar sin saga med Läsarens frågor, sätter bockarna, ändrar en sak och säger sin rad till bladet Det här tar vi med oss.\n20–⁠45 min. Du visar Spela det som står, och paren spelar varandras snabbsagor.\n45–⁠55 min. Paret skriver en mening där spelarna stod stilla.\n55–⁠60 min. Två par läser sin nya mening.\nI sex steg: gruppens saga 5–⁠15 min, tärningarna och snabbsagan 15–⁠36 min, visningen och spelet 36–⁠54 min och meningen 54–⁠60 min."
            - rubrik: Lägg märke till
              text: "Paret som själv ser var spelarna stod stilla.\nEleven som knyter slutet till önskan utan att du frågar."
        - rubrik: "Vecka 5 · Första sagan"
          falt:
            - rubrik: Fokus
              text: "Paren gör en saga i veckan: de planerar, berättar och skriver. Från nu skriver du din egen saga i takt med paren, och i Sagostarten säger eleven vid toppen två meningar: vad hjälten försöker och vad som går fel."
            - rubrik: Pass 13
              text: "Planeringspass för första sagan.\n5–⁠12 min. Du visar planeringen med din egen saga: du slår tärningarna och färgar ditt berg.\n12–⁠20 min. Paren slår tärningarna. Barnets lapp från pass 3 ligger i mappen. Fråga: ”Vad ville ert barn ha i en saga?”"
            - rubrik: Pass 14
              text: "Berättarpass, som i tabellen Berättarpasset."
            - rubrik: Pass 15
              text: "Skrivpass. Draget Börja med vem, var och önskan.\nBerätta och skriva: paret skriver sagan klart och sätter en bock vid varje station där sagan svarar på frågan.\nEfter passet läser du sagorna. Vid en station där sagan inte svarar på frågan skriver du: ”Står det det?” Det många skrev vid Problemet blir den ena versionen i pass 18.\nI sex steg räcker en mening vid varje station i första sagan, och den får vara ofärdig."
            - rubrik: Lägg märke till
              text: "Paret som skriver den mening hjälten sa på scenen.\nEleven som skriver önskan i en av de två första meningarna."
        - rubrik: "Vecka 6 · Andra sagan"
          falt:
            - rubrik: Fokus
              text: "Paren gör andra sagan som i vecka 5. I sex steg är det boksagan."
            - rubrik: Pass 16
              text: "Planeringspass. Där du skrev ”Står det det?” skriver paret en mening, och om den stationen skriver paret sin rad på bladet Det här tar vi med oss. Paret frågar sig: ”Var i den nya sagan ska det synas?”\nI sex steg: boksagan, med Hjältens kort och heta stolen 20–⁠35 min och berget 35–⁠50 min."
            - rubrik: Pass 17
              text: "Berättarpass. I delen Sagan växer visar ett par hur deras saga växer."
            - rubrik: Pass 18
              text: "Skrivpass. Draget Låt kroppen visa känslan.\nSkrivdraget: Två sätt i era sagor. Du skriver Problemet i din saga två gånger, en gång med ”blev rädd” och en gång där kroppen visar känslan. Väljer paret versionen med kroppen, skriver de om sin mening på en lapp.\nI sex steg: Hjälten och Problemet i boksagan, på Vår saga."
            - rubrik: Lägg märke till
              text: "Paret som pekar där den nya sagan har raden från bladet Det här tar vi med oss.\nParet som väljer ett av två sätt och säger varför."
        - rubrik: "Vecka 7 · Boksagan"
          falt:
            - rubrik: Fokus
              text: "Paret skriver boksagan. I fyra steg är det en av sagorna igen."
            - rubrik: Pass 19
              text: "Berättarpass för boksagan.\n5–⁠25 min. Paret skriver sin rad på Det här tar vi med oss, räknar bockarna i sina två sagor och väljer boksagan. Med Hjältens kort sitter den ena i heta stolen.\n25–⁠32 min. Paret berättar med Kamratens frågor.\n32–⁠45 min. Sagoteatern.\n45–⁠60 min. Fånga sagan, på Vår saga.\nEfter passet skriver du ditt svar på en lapp i boksagan, vid stationen från scenen.\nI sex steg: skrivpass, Hjälparen och Det värsta, och draget En replik."
            - rubrik: Pass 20
              text: "Skrivpass. Draget Sakta ner, vid Problemet.\nDär vi slutade: paret läser ditt svar.\nSkrivdraget: du saktar ner Problemet i din saga, i sex steg Det värsta.\n16–⁠46 min. Paret skriver boksagan från början, med lapparna, ditt svar och stationens drag från Det här tar vi med oss.\n46–⁠60 min. Paren spelar det som står i varandras boksagor, och sedan skriver paret en mening där spelarna stod stilla.\nI sex steg: paret skriver klart Det värsta, och tärning 4 får göra det värre."
            - rubrik: Pass 21
              text: "Skrivpass. Draget Knyt ihop slutet med önskan.\n8–⁠20 min. Din saga får Lösningen och två Landningar, och den ena svarar på önskan.\n20–⁠50 min. Paret skriver klart boksagan.\n50–⁠60 min. Paret övar på att läsa boksagan högt.\nI sex steg: Lösningen och Landningen."
            - rubrik: Lägg märke till
              text: "Paret som börjar med lappen från scenen.\nParet som tar stationens drag från bladet."
        - rubrik: "Vecka 8 · Läsarna"
          falt:
            - rubrik: Fokus
              text: "Barnen kommer tillbaka och hör boksagan innan paret skriver den rent. Det de undrade skriver paret in samma pass. Från pass 22 gör gruppen Sagostarten utan skyltarna."
            - rubrik: Pass 22
              text: "Skrivpass med barnen, som under Läsarna, vecka 8.\n5–⁠15 min. Paret lägger sin förra saga bredvid boksagan, ringar in det nya och visar var sagan har raderna från bladet Det här tar vi med oss.\n15–⁠30 min. Paret läser för barnet.\n30–⁠50 min. Paret ser om barnet pekade vid bergets topp och skriver in det barnet undrade."
            - rubrik: Pass 23
              text: "Skrivpass utan nytt drag.\nSkrivdraget: du visar i din saga hur du ändrar där en läsare undrade.\nBerätta och skriva: paret lägger till en mening, byter ett ord eller stryker en mening där lyssnarparet eller barnet undrade."
            - rubrik: Pass 24
              text: "Bokpass.\n5–⁠15 min. Du visar hur du rättar stavning, stor bokstav och punkt i dina meningar.\n15–⁠50 min. Paren läser sagan för dig, ett par i taget, och ni rättar. De andra ritar på Bokens sida."
            - rubrik: Lägg märke till
              text: "Paret som ändrar där barnet undrade.\nEleven som rättar ett ord själv när hen läser högt."
        - rubrik: "Vecka 9 · Boken"
          falt:
            - rubrik: Fokus
              text: "Paren skriver rent och ritar, och eleverna gör Sagokollen igen."
            - rubrik: Pass 25
              text: "Bokpass. Ni rättar klart, och de par som är färdiga skriver rent på Bokens sida.\nI fyra steg gör högst sex elever Sagokollen 15–⁠45 min, fem minuter var. Du spelar in, och resten av passet rättar ni."
            - rubrik: Pass 26
              text: "Bokpass. I paret läser den ena meningen från bladet, och den andra skriver den rent. Efter varje sida byter de. För de yngsta skriver du det som behövs.\nI sex steg gör alla Sagokollen 5–⁠20 min."
            - rubrik: Pass 27
              text: "Bokpass. Paren ritar klart och fyller i Författarna. Gruppen ritar till gruppens saga, som du har skrivit rent. Ska boken till ett tryckeri, skannar du sidorna efter passet och omslaget efter pass 28, och du flyttar boksläppet om tryckeriet behöver mer tid.\nI fyra steg gör de andra Sagokollen hos dig 15–⁠45 min.\nI sex steg läser varje elev sin saga från Sagokollen före kursen och säger vad den nya har som den första saknar."
            - rubrik: Lägg märke till
              text: "Eleven som läser meningen högt innan hen skriver rent.\nEleven som tar med alla stationer i Sagokollen."
        - rubrik: "Vecka 10 · Boksläppet"
          falt:
            - rubrik: Fokus
              text: "Boken blir klar, och barnen kommer till boksläppet."
            - rubrik: Pass 28
              text: "Bokpass. Paret skriver en inbjudan till barnet. Gruppen väljer en titel och gör omslaget, och gruppens saga står först i boken.\nI fyra steg säger du till varje elev vad som är nytt i Sagokollen."
            - rubrik: Pass 29
              text: "Bokpass. Du binder ett exemplar till varje elev och varje barn, ett till biblioteket och ett till barnens klass. Paren övar på att läsa eller spela sin saga."
            - rubrik: Pass 30
              text: "Bokpass.\n0–⁠15 min. Barnen och familjerna kommer.\n15–⁠50 min. Paret läser eller spelar sin saga.\n50–⁠60 min. Paret signerar böckerna."
            - rubrik: Lägg märke till
              text: "Eleven som läser med inlevelse.\nParet som berättar vad som kom från barnets svar."
    # ---------------------------------------------------------------- Veckornas material
    - rubrik: "Två texter, vecka 1: Ekorren"
      text:
        - "Läs båda sagorna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 2
              text: "Fyra steg. Läs båda sagorna högt, och ställ frågorna i tur och ordning. Paren pratar om fråga 2 och 3, och gruppen tar de andra. Sist skriver paret på en lapp vad ekorren vill, med egna ord och på fem minuter. Önskan ska passa nöten och slutet. Skriv ut ett blad per par."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Allt utom en mening."
            - rubrik: "2. Vad vill ekorren i den andra?"
              text: "En riktigt stor nöt."
            - rubrik: "3. Varför gnager hon av grenen i den första?"
              text: "Vi förstår det först när nöten faller. I den andra vet vi det från början, och därför blir grenen ett problem. Säger någon ”för att få nöten”, frågar du: ”Står det det?”"
            - rubrik: "4. Vilken blev en saga?"
              text: "Den andra. Läsaren vet vad ekorren vill, och problemet står i vägen för det."
      listor:
        - rubrik: Två sagor om ekorren
          kolumner:
            - Den första sagan
            - Den andra sagan
          rader:
            - - "Det var en gång en ekorre som bodde i ett hasselträd.\n____________________\nLängst ut på en tunn gren satt en stor nöt.\nGrenen var för tunn för att bära ekorren.\nDå gnagde ekorren av grenen, och nöten föll ner i mossan.\nTill slut satt ekorren i sitt bo med nöten."
              - "Det var en gång en ekorre som bodde i ett hasselträd.\nMest av allt ville hon ha en riktigt stor nöt.\nLängst ut på en tunn gren satt en stor nöt.\nGrenen var för tunn för att bära ekorren.\nDå gnagde ekorren av grenen, och nöten föll ner i mossan.\nTill slut satt ekorren i sitt bo med nöten."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två sagorna?"]
            - ["Vad vill ekorren i den andra?"]
            - ["Varför gnager hon av grenen i den första?"]
            - ["Vilken blev en saga?"]
            - ["Skriv med egna ord vad ekorren vill i den första sagan, på en lapp."]
    - rubrik: "Högläsning, vecka 1: Räven som ville flyga"
      text:
        - "I sex steg läser du sagan högt i pass 2, innan gruppen läser Två texter om räven."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Fråga, text: "Hur många försök gör Rasmus, och vad händer varje gång?" }
            - { rubrik: Svaret, text: "Två försök. När han hoppar från stenen faller han i bäcken, och när han hoppar från kullen slänger stormen in honom i en gran." }
            - { rubrik: Förklara, text: "lya och söderut" }
      listor:
        - rubrik: Räven som ville flyga
          rader:
            - ["Det var en gång en räv som hette Rasmus. Han bodde i en lya vid skogens kant, och varje kväll satt han och tittade på gässen. Mest av allt önskade han att han kunde flyga som de."]
            - ["Men en dag flög gässen söderut, och Rasmus blev ensam kvar. Rävar har inga vingar, men han sprang efter dem så långt han orkade."]
            - ["På vägen mötte han en gammal gås som hade stannat kvar. Hon gav honom en fjäder. ”Fjädern flyger bara från rätt ställe”, sa hon."]
            - ["Rasmus hoppade från en sten, men han föll rakt ner i bäcken. Han klättrade upp på en kulle och hoppade igen, men då kom en storm. Vinden tog tag i honom och slängde in honom i en gran. Där satt han fast i grenarna, högt uppe, och det blev mörkt. Han frös."]
            - ["Men då kom han ihåg gåsens ord. Han slet sig loss och klättrade högst upp i granen. Där uppe blåste vinden rakt söderut, och han höll fjädern mot vinden. Fjädern växte till två stora vingar, och Rasmus lyfte."]
            - ["Till slut flög han ikapp gässen, precis som han hade önskat, och han var gladare än någonsin. Han flög med dem hela vägen söderut och hem igen på våren. Och sedan dess hälsar gässen på Rasmus varje gång de flyger förbi."]
        - rubrik: Frågorna
          rader:
            - ["1. Hjälten: Vem är hjälten, och vad önskar hen sig?"]
            - ["2. Problemet: Vad står i vägen för önskan?"]
            - ["3. Hjälparen: Vem hjälper hjälten, och vad får hjälten?"]
            - ["4. Det värsta: Hjälten försöker två gånger. Vad händer?"]
            - ["5. Lösningen: Vad gör hjälten själv med det hen har fått?"]
            - ["6. Landningen: Fick hjälten sin önskan? Hur känns det nu?"]
    - rubrik: "Två texter, vecka 1: Räven"
      text:
        - "Läs båda texterna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 2
              text: "Sex steg. Läs först hela sagan om räven högt, ur Högläsning, vecka 1: Räven som ville flyga. Båda texterna är sagans Det värsta, men i den första är det en enda mening. Ställ frågorna i tur och ordning. Sedan färgar gruppen ett berg för varje text. Sist skriver paret ett försök till den första texten på en lapp, på fem minuter."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Rasmus, och att han hamnar i en gran."
            - rubrik: "2. Hur många gånger försöker Rasmus i den andra?"
              text: "Två gånger: från stenen och från kullen."
            - rubrik: "3. Var håller du andan?"
              text: "I den andra, när han sitter fast och det blir mörkt."
            - rubrik: "4. Vilken får en topp på berget?"
              text: "Den andra. I den första går det för fort."
      listor:
        - rubrik: Det värsta i två sagor om räven
          kolumner:
            - Den första texten
            - Den andra texten
          rader:
            - - "Rasmus klättrade upp i en hög gran.\n________________"
              - "Rasmus hoppade från en sten, men han föll rakt ner i bäcken. Han klättrade upp på en kulle och hoppade igen, men då kom en storm. Vinden tog tag i honom och slängde in honom i en gran. Där satt han fast i grenarna, högt uppe, och det blev mörkt. Han frös."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två texterna?"]
            - ["Hur många gånger försöker Rasmus i den andra?"]
            - ["Var håller du andan?"]
            - ["Vilken får en topp på berget?"]
            - ["Skriv ett försök till den första texten, på en lapp."]
    - rubrik: "Frågorna till barnet, vecka 1: Barnen kommer"
      sagoform: { form: kort }
      text:
        - "Paret har kortet när de intervjuar barnet i pass 3 och skriver eller ritar svaren på en lapp."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "Varje par får ett kort. Svaren ligger i mappen till planeringspassen. Kan barnen inte komma, spelar paret in frågorna, och barnens lärare visar dem." }
      listor:
        - rubrik: Frågorna till barnet
          rader:
            - ["Vad tycker du om i en saga?"]
            - ["Vad är läskigt, men inte för läskigt?"]
            - ["Vad ska hjälten önska sig?"]
            - ["Tack för att du kom!"]
    - rubrik: "Två texter, vecka 2: Vem gör det svåra?"
      text:
        - "Läs båda sagorna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 5
              text: "Gruppen har slagit tärning 4 och vet vad som står i vägen. Läs båda sagorna högt, och ställ frågorna i tur och ordning. Sist skriver varje par på en lapp hur gruppens hjälte gör det svåra själv och lägger lappen vid Lösningen på den förstorade vägen. I sex steg kan fen vara hjälparen och ge något, men hjälten gör det svåra."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Musen, skatten, draken och slutet."
            - rubrik: "2. Vem löser problemet i den första?"
              text: "Fen."
            - rubrik: "3. Vem löser det i den andra?"
              text: "Musen själv. Hon är liten och kryper in genom hålet."
            - rubrik: "4. I vilken är musen hjälten?"
              text: "I den andra. Hjälten gör det svåra själv."
      listor:
        - rubrik: Två sagor om musen
          kolumner:
            - Den första sagan
            - Den andra sagan
          rader:
            - - "Det var en gång en mus som ville ha en skatt.\nMen en dag kom en stor drake och vaktade skatten.\nDå kom en fe och trollade bort draken.\nTill slut hade musen skatten, precis som hon ville."
              - "Det var en gång en mus som ville ha en skatt.\nMen en dag kom en stor drake och vaktade skatten.\nDå kröp musen in genom ett hål som var för litet för draken.\nTill slut hade musen skatten, precis som hon ville."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två sagorna?"]
            - ["Vem löser problemet i den första?"]
            - ["Vem löser det i den andra?"]
            - ["I vilken är musen hjälten?"]
            - ["Skriv på en lapp hur vår hjälte gör det svåra själv."]
    - rubrik: "Två texter, vecka 4: Slutet"
      text:
        - "Läs båda sagorna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 10 och 11
              text: "Läs båda sagorna högt i Skrivdraget och ställ frågorna, i fyra steg i pass 10 och i sex steg i pass 11. Sedan skriver paret sin egen Landning till gruppens saga."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Allt utom den sista meningen."
            - rubrik: "2. Vad ville grodan?"
              text: "Komma hem till sin damm."
            - rubrik: "3. I vilken vet du att hon kom hem?"
              text: "I den andra."
            - rubrik: "4. Vilket slut säger något om önskan?"
              text: "Det andra. Den sista meningen svarar på det grodan ville."
      listor:
        - rubrik: Två sagor om grodan
          kolumner:
            - Den första sagan
            - Den andra sagan
          rader:
            - - "Det var en gång en groda som ville komma hem till sin damm.\nMen en dag blåste en storm henne långt bort.\nDå hoppade grodan från sten till sten genom ån.\nTill slut åt grodan en fluga."
              - "Det var en gång en groda som ville komma hem till sin damm.\nMen en dag blåste en storm henne långt bort.\nDå hoppade grodan från sten till sten genom ån.\nTill slut satt grodan på sitt näckrosblad i dammen igen, precis där hon ville vara."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två sagorna?"]
            - ["Vad ville grodan?"]
            - ["I vilken vet du att hon kom hem?"]
            - ["Vilket slut säger något om önskan?"]
            - ["Skriv er Landning till gruppens saga."]
    - rubrik: "Vår saga i fyra steg, vecka 7: Boksagan"
      sagoform: { form: vag, ram: lindorm, titel: Vår saga, undertitel: fyra steg, bilder: [ stjärna, vägspärr, glödlampa, regnbåge ], sidor: 4, radMm: 12 }
      text:
        - Paret skriver boksagan en gång till från början, med två till fyra meningar vid varje station. En har stationens drag.
      huvud:
        - { rubrik: Vi som skriver, text: "" }
        - { rubrik: Sagan är till, text: "" }
      delar:
        - rubrik: Vår saga
          falt:
            - { rubrik: 1 Hjälten, text: "Det var en gång" }
            - { rubrik: 2 Problemet, text: "Men en dag" }
            - { rubrik: 3 Lösningen, text: "Då" }
            - { rubrik: 4 Landningen, text: "Till slut" }
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "Bladet har fyra sidor, en för varje station, och varje par får ett i pass 19–21. Sagan är klar när varje lapp är med, varje station har sitt drag från Det här tar vi med oss, Problemet har ett försök som misslyckas och Lösningen en replik." }
    - rubrik: "Läsarna, vecka 8: Barnen lyssnar"
      text:
        - "Barnen från pass 3 kommer tillbaka och hör boksagan före renskriften. Paret läser, stannar vid toppen och frågar ”Hur ska det gå?”, och barnet pekar på det mest spännande stället."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Före
              text: "Påminn barnens lärare en vecka före."
            - rubrik: Läsningen
              text: "Barnen kommer vid minut 15, och varje par sätter sig med sitt barn. Paret läser boksagan, stannar vid stationen med flest lågor och frågar: ”Hur ska det gå?” Sist ställer paret Läsarens frågor, och barnet pekar i sagan. Paret skriver svaren på en lapp."
            - rubrik: Efteråt
              text: "Barnen går vid minut 30. Paret ser om barnet pekade vid bergets topp och skriver in det barnet undrade eller inte kunde svara på."
            - rubrik: Om barnen inte kan komma
              text: "Paret spelar in boksagan, som barnens lärare visar. Barnen ritar det mest spännande, och teckningarna kommer före pass 23."
    - rubrik: "Inbjudan till läsaren, vecka 10: Boksläppet"
      sagoform: { form: sida, titel: Inbjudan, sidfot: true }
      text:
        - Paret bjuder in barnet till boksläppet.
      delar:
        - rubrik: Inbjudan
          falt:
            - { rubrik: Titel, text: "" }
            - { rubrik: Inbjudan, text: "" }
            - { rubrik: Från oss, text: "" }
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "I pass 28 skriver varje par när och var boksläppet är och vad barnet får. Du lämnar inbjudningarna till barnens lärare." }
    # ---------------------------------------------------------------- Hela kursen
    - rubrik: "Till läraren: återkopplingen"
      text:
        - "Kursens grepp för återkoppling gör ni medan sagan går att ändra. Paret möter en läsare, som en kamrat, du eller barnet, och bestämmer direkt vad de ändrar. Greppen kommer ett i taget, utöver frågan över axeln."
      delar:
        - rubrik: Greppen
          falt:
            - rubrik: Parens versioner på bordet
              text: "Vecka 3–4, 50–⁠60 min. Två par läser sin version av stationen, gruppen väljer en mening till sin saga, och varje par förbättrar en egen mening."
            - rubrik: Fånga sagan
              text: "Berättarpassen, 45–⁠60 min. Paret skriver stationen där scenen frös och börjar med det hjälten sa högt."
            - rubrik: Spela det som står
              text: "Pass 12 och 20. Ett annat par spelar bara det som står, och paret skriver en mening där spelarna stod stilla."
            - rubrik: Där vi slutade
              text: "Från pass 15. Paret hör vad paret bredvid undrar och bestämmer om meningen står kvar."
            - rubrik: Två sätt i era sagor
              text: "Skrivdraget, pass 18 och 21. Du skriver en station i din saga på två sätt: som många par skrev och med draget. Varje par väljer ett innan de skriver vidare."
            - rubrik: Ditt svar
              text: "Efter pass 19. Läs boksagan så långt den är skriven, och skriv en lapp vid ett ställe: var du höll andan och vad du undrar, som ”Nu undrar jag: hur kommer hon upp?” Räkna med två minuter per saga."
            - rubrik: Barnen
              text: "Pass 22. Barnet pekar på det mest spännande stället och säger vad det undrade, och paret skriver in det samma pass."
            - rubrik: Frågan över axeln
              text: "När paren skriver. Först en fråga till varje par, sedan sitter du med de par som Parets väg pekar ut."
            - rubrik: Det här tar vi med oss
              text: "Efter varje saga. Paret skriver en rad ur din fråga eller det lyssnarparet undrade och läser den när nästa saga börjar."
    - rubrik: "Strukturen, berättarpassen: Sagoteatern"
      text:
        - "Paret spelar sin saga längs repet, och lyssnarparet säger ”Frys!” där det är som mest spännande."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Berättarpassen
              text: "Minut 27–45. I pass 3 och 6 spelar hela gruppen, och du säger ”Frys!” vid toppen. Med fem eller sex par spelar ni på två scener samtidigt, och där du inte är säger lyssnarparet ”Frys!” själv."
      listor:
        - rubrik: Så gör ni
          rader:
            - ["Paret står vid första skylten och får ta en sak ur lådan, som en krona, en sjal eller en pinne. Läraren eller en kamrat säger startorden."]
            - ["Hjälten säger högt vad hen vill."]
            - ["Den andra spelar det som står i vägen. I sex steg lånar paret en hjälpare ur publiken."]
            - ["Lyssnarparet har parets berg och säger ”Frys!” vid stationen med flest lågor."]
            - ["Hjälten säger högt vad hen tänker, och paret spelar vidare."]
            - ["Hjälten gör det svåra själv, och vid Landningen knyter paret en knut på repet, som tecken på att önskan gick i uppfyllelse."]
            - ["Lyssnarparet ger en idé först, sedan publiken: något som gör det värre, ett försök till eller en replik."]
            - ["Den som ger idén ritar eller skriver den på en lapp åt paret direkt."]
        - rubrik: Så tränar ni sagans väg
          rader:
            - ["Ni ser om hjälten vill något, om problemet står i vägen och om hjälten gör det svåra själv."]
    - rubrik: "Strukturen, pass 12 och 20: Spela det som står"
      text:
        - "Ett annat par spelar bara det som står i er saga. Där spelarna står stilla behöver läsaren veta mer."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 12 och 20
              text: "Alla par spelar samtidigt i omkring tio minuter, och med ett udda antal par spelar du med. Hittar den som läser på något, läser du texten själv."
      listor:
        - rubrik: Så gör ni
          rader:
            - ["Ni läser vid bordet, och det andra paret spelar på golvet bredvid."]
            - ["En av er läser sagan högt, med fingret under orden."]
            - ["Spelarna gör och säger bara det som står. Står det inget, står de stilla."]
            - ["Står spelarna stilla, säger de ”Stopp!”, och ni sätter ett streck där."]
            - ["När sagan är slut frågar ni: ”Var stod ni stilla?”"]
            - ["Byt: nu läser det andra paret, och ni spelar."]
            - ["Sist skriver ni en mening där spelarna stod stilla, och stryker det som inte gick att spela."]
        - rubrik: Så tränar ni sagans väg
          rader:
            - ["Ni ser var sagan säger för lite och läsaren inte ser hjälten göra något."]
    - rubrik: "Fyra steg, saga 1: Bockarna Bruse"
      text:
        - "Läs sagan högt. Gruppen hittar sagans väg och svarar på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Fråga, text: "Hur många gånger möter bockarna trollet? Är den stora bocken en hjälpare eller en av hjältarna?" }
            - { rubrik: Svaret, text: "Tre gånger, och problemet växer. Den stora bocken är en av hjältarna, eftersom alla tre vill upp på berget." }
            - { rubrik: Förklara, text: "forsen" }
      listor:
        - rubrik: Bockarna Bruse
          rader:
            - ["Det var en gång tre bockar som hette Bruse.\nI dalen där de bodde var gräset slut.\nDe ville upp på berget, där gräset var högt och grönt."]
            - ["Men på vägen fanns en bro,\noch under bron bodde ett troll.\n”Vem trippar på min bro?” röt trollet.\n”Nu tar jag dig!”\n”Vänta på den mellersta bocken”, sa den lilla.\n”Vänta på den stora”, sa den mellersta."]
            - ["Då gick den stora bocken Bruse ut på bron.\nNär trollet klättrade upp,\nstångade han trollet ner i forsen."]
            - ["Till slut kom alla tre bockarna upp på berget.\nDe åt och åt tills de var runda som bollar.\nOch snipp, snapp, snut, så var sagan slut."]
        - rubrik: Frågorna
          rader:
            - ["1. Hjälten: Vem är hjälten, och vad vill hen?"]
            - ["2. Problemet: Vad står i vägen för det hen vill?"]
            - ["3. Lösningen: Hur löser hjälten problemet själv?"]
            - ["4. Landningen: Fick hjälten det hen ville?"]
    - rubrik: "Fyra steg, saga 2: De tre små grisarna"
      text:
        - "Läs sagan högt. Gruppen hittar sagans väg och svarar på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Fråga, text: "Hur många hus blåser vargen omkull, och vad gör den tredje grisen?" }
            - { rubrik: Svaret, text: "Två hus. Den tredje grisen bygger av sten och har ställt grytan under skorstenen, så grisarna löser det själva." }
            - { rubrik: Förklara, text: "skorstenen" }
      listor:
        - rubrik: De tre små grisarna
          rader:
            - ["Det var en gång tre små grisar\nsom ville ha ett hus\nsom ingen varg kunde blåsa omkull."]
            - ["Men i skogen bodde en hungrig varg.\nDen första grisen byggde ett hus av halm,\noch vargen blåste omkull det.\nDen andra byggde ett hus av pinnar,\noch vargen blåste omkull det också.\nGrisarna skakade så att knäna slog mot varandra."]
            - ["Då byggde den tredje grisen ett hus av sten,\noch alla tre sprang in.\nVargen blåste och blåste, men huset stod kvar.\nDå klättrade vargen ner genom skorstenen.\nMen den tredje grisen hade ställt en gryta\nmed hett vatten under skorstenen.\nVargen brände sig på svansen\noch sprang tillbaka till skogen."]
            - ["Till slut bodde de tre grisarna i stenhuset,\noch vargen kom aldrig tillbaka."]
        - rubrik: Frågorna
          rader:
            - ["1. Hjälten: Vem är hjälten, och vad vill hen?"]
            - ["2. Problemet: Vad står i vägen för det hen vill?"]
            - ["3. Lösningen: Hur löser hjälten problemet själv?"]
            - ["4. Landningen: Fick hjälten det hen ville?"]
    - rubrik: "Sex steg, saga 1: Hans och Greta"
      text:
        - "Läs sagan högt. Gruppen hittar sagans väg och svarar på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Fråga, text: "Vad får Greta av ugglan, och när använder hon det?" }
            - { rubrik: Svaret, text: "Rådet att vara listigare än häxan. Greta använder det vid ugnen, när hon säger: ”Jag vet inte hur man gör. Visa mig.”" }
            - { rubrik: Förklara, text: "listig och benbit" }
      listor:
        - rubrik: Hans och Greta
          rader:
            - ["Det var en gång två syskon, Hans och Greta, som bodde med sin pappa i ett litet hus vid en stor skog. De var fattiga, och mest av allt önskade de att ingen i familjen skulle behöva vara hungrig mer."]
            - ["Men en dag var maten slut. Barnen plockade bär långt inne i skogen, och där gick de vilse. Hans hade strött brödsmulor efter sig för att hitta hem, men fåglarna hade ätit upp varenda en."]
            - ["På vägen mötte de en gammal uggla. ”Längre in i skogen står ett hus av pepparkakor”, sa ugglan. ”Den som bor där är listig, men ni kan vara listigare.”"]
            - ["Plötsligt stod huset framför dem, och barnen var så hungriga att de bröt loss en bit av taket. Då kom en häxa ut. Hon låste in Hans i en bur och ville göra honom fet. Häxan såg dåligt och ville känna på hans finger om han hade blivit fet. Då höll Hans fram en liten benbit, så att hon trodde att han var mager. På natten försökte Greta öppna buren, men låset satt fast. En morgon tröttnade häxan. Hon eldade i ugnen och sa åt Greta att krypa in och känna om den var varm. Gretas händer skakade. Ugnen var het. Greta tog ett steg bakåt."]
            - ["Men då kom Greta ihåg ugglans råd. ”Jag vet inte hur man gör”, sa hon. ”Visa mig.” Häxan kröp in för att visa henne, och Greta slog igen luckan. Hon släppte ut Hans, och i häxans hus hittade de en kista full av pärlor."]
            - ["Till slut bar en vit and dem över en sjö, och de hittade vägen hem. Pappa grät av glädje, och tack vare pärlorna behövde ingen i familjen vara hungrig mer."]
        - rubrik: Frågorna
          rader:
            - ["1. Hjälten: Vem är hjälten, och vad önskar hen sig?"]
            - ["2. Problemet: Vad står i vägen för önskan?"]
            - ["3. Hjälparen: Vem hjälper hjälten, och vad får hjälten?"]
            - ["4. Det värsta: Hjälten försöker två gånger. Vad händer?"]
            - ["5. Lösningen: Vad gör hjälten själv med det hen har fått?"]
            - ["6. Landningen: Fick hjälten sin önskan? Hur känns det nu?"]
    - rubrik: "Sex steg, saga 2: Jack och bönstjälken"
      text:
        - "Läs sagan högt. Gruppen hittar sagans väg och svarar på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Fråga, text: "Hur många gånger tar Jack något, och vad hjälper honom till slut?" }
            - { rubrik: Svaret, text: "Tre gånger, och tredje gången går det fel. Frun säger att bönstjälken är svag, och Jack hugger av den själv." }
            - { rubrik: Förklara, text: "marknaden och harpan" }
      listor:
        - rubrik: Jack och bönstjälken
          rader:
            - ["Det var en gång en pojke som hette Jack. Han bodde med sin mamma i en liten stuga, och de hade bara en ko kvar. Jack önskade att mamma aldrig mer skulle behöva oroa sig för mat."]
            - ["Men en dag slutade kon att ge mjölk, och Jack skulle sälja den på marknaden. På vägen bytte han kon mot fem bönor. Mamma blev så arg att hon kastade ut bönorna genom fönstret."]
            - ["På morgonen hade en bönstjälk vuxit ända upp i himlen. Jack klättrade upp och kom till ett slott. Där bodde en jätte som hade stulit guld från hela landet. Jättens fru gömde Jack i ugnen. ”Jätten är stark”, viskade hon, ”men bönstjälken är svag.”"]
            - ["Plötsligt dånade golvet. ”Fi, fai, fo, fum, jag känner lukten av en människa!” vrålade jätten. Jack höll andan. Första gången tog han en påse guld när jätten somnade. Andra gången tog han en höna som värpte guldägg. Tredje gången tog han jättens harpa, men harpan ropade: ”Vakna, jätte! Vakna!” Jätten vaknade och klättrade efter honom nerför stjälken."]
            - ["Men då kom Jack ihåg vad frun hade sagt. ”Mamma, yxan!” ropade han. Han högg och högg, och bönstjälken föll med ett brak. Jätten föll med den och kom aldrig tillbaka."]
            - ["Till slut hade Jack och mamma guldet, hönan och harpan. Hönan värpte guldägg, harpan spelade på kvällarna, och mamma behövde aldrig mer oroa sig för mat."]
        - rubrik: Frågorna
          rader:
            - ["1. Hjälten: Vem är hjälten, och vad önskar hen sig?"]
            - ["2. Problemet: Vad står i vägen för önskan?"]
            - ["3. Hjälparen: Vem hjälper hjälten, och vad får hjälten?"]
            - ["4. Det värsta: Hjälten försöker tre gånger. Vad händer?"]
            - ["5. Lösningen: Vad gör hjälten själv med det hen har fått?"]
            - ["6. Landningen: Fick hjälten sin önskan? Hur känns det nu?"]
