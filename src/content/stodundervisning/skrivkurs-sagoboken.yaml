      listor:
        - rubrik: Saga B om räven
          rader:
            - ["Det var en gång en räv som hette Rasmus. Han bodde i en lya vid skogens kant, och varje kväll satt han och tittade på gässen. Mest av allt önskade han att han kunde flyga som de."]
            - ["Men en dag flög gässen söderut, och Rasmus blev ensam kvar. Rävar har inga vingar, men han sprang efter dem så långt han orkade."]
            - ["På vägen mötte han en gammal gås som hade stannat kvar. Hon gav honom en fjäder. ”Fjädern flyger bara från rätt ställe”, sa hon."]
            - ["Rasmus hoppade från en sten, men han föll rakt ner i bäcken. Han klättrade upp på en kulle och hoppade igen, men då kom en storm. Vinden tog tag i honom och slängde in honom i en gran. Där satt han fast i grenarna, högt uppe, och det blev mörkt. Han frös."]
            - ["Men då kom han ihåg gåsens ord. Han slet sig loss och klättrade högst upp i granen. Där uppe blåste vinden rakt söderut, och han höll fjädern mot vinden. Fjädern växte till två stora vingar, och Rasmus lyfte."]
            - ["Till slut flög han ikapp gässen, precis som han hade önskat, och han var gladare än någonsin. Han flög med dem hela vägen söderut och hem igen på våren. Och sedan dess hälsar gässen på Rasmus varje gång de flyger förbi."]
