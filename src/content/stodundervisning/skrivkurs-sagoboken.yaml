    - rubrik: Frågekorten i fyra steg
      sagoform: { form: kort, kortbilder: { Kamratens frågor i fyra steg: [ stjärna, vägspärr, glödlampa, regnbåge, null ], Läsarens frågor i fyra steg: [ stjärna, vägspärr, null, glödlampa, regnbåge, null, null ] } }
      text:
        - På bladet står de två frågekorten i fyra steg. Paret har Kamratens frågor framför sig när de berättar sagan för varandra, och Läsarens frågor när de lyssnar på ett annat par.
      delar:
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "Skriv ut ett blad per par och klipp isär korten. Den som lyssnar läser frågan för varje station på kortet Kamratens frågor, och den som berättar svarar. När sagan är slut byter de, och den andra berättar samma saga med svaren i. Lyssnarparet följer med i texten på bladet Sagans väg och svarar på Läsarens frågor i tur och ordning. Sedan sätter de ett frågetecken i rutan vid den station där de undrade något. I pass 22 färgar lyssnarparet också ett eget Spänningsberg innan de ser parets." }
      listor:
        - rubrik: Kamratens frågor i fyra steg
          rader:
            - ["Hjälten: Var bor hjälten, och hur ser hen ut?"]
            - ["Problemet: Vad gör hjälten först? Varför går det inte?"]
            - ["Lösningen: Vad har hjälten med sig, eller vad kan hen?"]
            - ["Landningen: Hur känns det för hjälten nu?"]
            - ["Nu byter vi, och jag berättar."]
        - rubrik: Läsarens frågor i fyra steg
          rader:
            - ["Vem är hjälten, och vad vill hen?"]
            - ["Vad står i vägen för det hen vill?"]
            - [Var blev det mest spännande? Peka i sagan.]
            - [Hur löste hjälten problemet?]
            - [Fick hjälten det hen ville?]
            - [Undrade ni något? Sätt ett frågetecken där.]
            - [Säg tack till författarna.]
