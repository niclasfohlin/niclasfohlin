# Metod i stödundervisning. Modellen står i src/content.config.ts och mallen i _mall.yaml.
# Skriven av riggen 2026-10-02 ur Niclas uppdrag (intake/skrivkurs-sagoboken.md), sökningen och analysen.
titel: "Skrivkurs: sagoboken"
undertitel: Lärarledd skrivkurs i liten grupp där eleverna skriver sagor i par och gör en tryckt sagobok, för åk 1–6
ingress: "Gruppen läser sagor och hittar sagans väg i fyra eller sex steg: hjälten önskar sig något, ett problem står i vägen och växer, och slutet knyter an till önskan. Sedan gör gruppen en saga tillsammans och paren sina egna. Eleverna berättar och spelar varje saga innan de skriver den. Kursen slutar med en tryckt sagobok."
omrade: Skrivning
arskurs:
  - F-3
  - 4-6
arskursText: åk 1–6
taggar:
  - textstruktur
  - skrivstrategier
format:
  - liten grupp
  - par
tid: 60 minuter per pass, tre pass i veckan
period: Tio veckor
grupp: Fyra till tolv elever
material:
  - Vägskyltarna för er version och ett rep eller en tejp på golvet
  - Tolv berättartärningar på tjockt papper, två för varje fråga
  - Sagans väg på två sidor, tre exemplar till varje par och ett i A3 som blir den förstorade vägen på väggen
  - Ett blädderblock eller stora ark till gruppens saga, ett ark för varje station
  - Hjältens kort, ett per par och ett i A3
  - Spänningsberget, tre per par och två i A3
  - Frågekorten för er version och rollkorten, ett blad av varje per par
  - Modellsagorna och kontrastparet, en kopia per elev
  - En låda med enkla saker till sagoteatern, som tyg, en hatt och en pinne
  - Lappar, linjerat papper, pennor, färgpennor och en mapp per par
  - En dator per par som skriver på dator, och headset till den som dikterar
  - Sagobokens omslag, Bokens sida och bladet Författarna
uppdaterad: 2026-10-02
relaterade:
  - skrivkurs-berattelseram
utkast: false
inledning:
  - Sagor och berättande är nog inprogrammerat i vårt DNA. Ända sedan människan tittade upp mot stjärnorna och undrade vad som fanns där ute, har vi berättat sagor för varandra. Nu ska du hjälpa eleverna att bli en del av detta arv. Det är ett fantastiskt uppdrag.
  - Eleverna lär sig bygga en saga som håller ihop. Sagans väg är kursens kärna. Hjälten önskar sig något, ett problem står i vägen och växer, och sagan landar när hjälten har löst det. Varje saga börjar muntligt. Eleverna hittar på sagan, berättar den för varandra och spelar upp den för gruppen. Först sedan skriver de sagan, och sist läser de den för andra. Gruppen gör en saga tillsammans, och sedan gör eleverna sina egna i par. Varje par får egna sidor för sin saga i sagoboken. Ni trycker boken, och paren läser sina sagor för riktiga läsare.
  - "Under kursen läser du sagor högt och visar sagans väg i dem. Du låter eleverna berätta och spela sina sagor innan de skriver. När du skriver inför gruppen, tänker du högt om varför du väljer som du gör. Du leder paren så att båda berättar och båda skriver. Och du ger respons medan sagan ännu går att ändra, och rättar stavningen först när ni gör boken."
  - "Sagans väg finns i två versioner. Fyra steg, med Hjälten, Problemet, Lösningen och Landningen, passar de flesta grupper i åk 1–⁠3. I sex steg kommer Hjälparen och Det värsta till före Lösningen, och den versionen passar de flesta grupper i åk 4–⁠6. Hela gruppen använder samma version. Välj fyra steg när de flesta i gruppen skriver högst några meningar på egen hand, och sex steg när de flesta skriver en halv sida. Berättartärningarna ger idéer när paret inte kommer på något, och de avgör när paret inte kommer överens."
  - Kursen är tio veckor med tre pass i veckan, och varje pass är 60 minuter. Före kursen gör du Sagokollen, där varje elev berättar eller skriver en saga till en bild. Du bestämmer också vem som ska läsa boken. Läs först de två tabellerna Sagans väg och tabellen Från idé till saga, och sedan kursplanen och tabellen Materialet i varje pass. Mallarna, tärningarna och modellsagorna finns under Kursens material.
upplagg:
  rubrik: Så fungerar insatsen
  text: "Kursen har tre pass i veckan under tio veckor, alltså 30 pass om 60 minuter, och gruppen har fyra till tolv elever. I vecka 1 läser gruppen sagor, hittar sagans väg i dem och spelar upp en av dem. I vecka 2 hittar gruppen på sin hjälte och sin saga, berättar den och spelar upp den. I vecka 3–⁠4 skriver gruppen sagan tillsammans med dig vid pennan. I vecka 5–⁠8 gör paren först en eller två korta sagor och sedan den saga som ska stå i boken. I fyra steg väljer paret en av de korta sagorna till boken och bygger ut den. Varje saga går igenom samma fem moment: gruppen eller paret hittar på den, berättar den, spelar upp den, skriver den och läser den för andra. I vecka 8–⁠10 rättar ni sagorna, ritar bilderna, formger boken och trycker den. Kursen slutar med ett boksläpp. Från pass 13 har du ett blad för varje par, Parets väg. Där skriver du efter varje pass vilken station paret är på och vad de behöver nästa pass. Före och efter kursen gör du Sagokollen, och boken visar vad paren kan."
gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Sätt ihop paren med omsorg, så att de två i varje par är bra på olika saker. Den ena kanske skriver säkrare och den andra berättar mer, eller så stavar den ena säkert och den andra har idéerna. Paren håller ihop hela kursen, eftersom sagan är deras. Är eleverna ett udda antal, blir ett av paren en trio, och den tredje är Utbyggaren. Utbyggaren läser meningen högt och föreslår hur paret kan bygga ut den. Vill paret ha med förslaget, skriver Skrivaren in det, och efter varje mening går rollerna runt. När paret får respons, läser de sagan för ett annat par, sitt lyssnarpar. Är paren ett udda antal, läser de för varandra i en ring: par 1 läser för par 2, par 2 för par 3 och par 3 för par 1. Kursen passar elever som kan skriva några meningar men som räknar upp händelser eller löser problemet direkt när de skriver en berättelse. Elever som ännu inte ljudar ihop ord är också med. Vad du gör för dem och för andra elever står i tabellen När en elev behöver något mer."
principer:
  rubrik: Tre saker att hålla fast vid
  text: "Hjälten löser problemet själv. Hjälparen ger något, en sak eller ett råd, men det är hjälten som gör det svåra. Därför frågar ni vid Lösningen vad hjälten själv gör. Berätta innan ni skriver. Paret berättar varje saga tre gånger innan de skriver den, två gånger för varandra och en gång på scenen, och sagan växer varje gång. Gruppen eller Berättaren säger också varje mening högt innan någon skriver den, så att den som skriver inte tappar tråden. Rätta först när ni gör boken. Medan paren skriver, ger du respons på sagan, och stavningen rättar ni tillsammans i vecka 8–⁠9, eftersom andra ska läsa sagan i boken."
tabeller:
  - rubrik: När en elev behöver något mer
    plats: efter-inledning
    text: "De flesta elever får det stöd de behöver i paret och genom rollerna. Här står vad du gör för enskilda elever."
    kolumner:
      - Eleven
      - Så gör du
    rader:
      - - Ljudar inte ihop ord än
        - Eleven är med. Som Skrivare skriver eleven det hen kan, till exempel startordet, den första bokstaven eller ett kort ord, och kamraten eller du skriver resten. Sedan läser eleven det som står och följer orden med fingret. Kan eleven inte läsa frågorna på kortet, berättar hen först, och kamraten läser frågorna. Samtidigt tränar eleven avkodning i en annan insats. Sätt inte två sådana elever i samma par.
      - - Skriver långsamt
        - Som Skrivare skriver eleven början av meningen, och kamraten skriver resten medan eleven säger den. Det räknas som elevens tur. I renskriften skriver eleven den första meningen på sidan, och kamraten eller du skriver resten. Du kan också låta eleven skriva på dator eller diktera, som tabellen För hand eller på dator säger.
      - - Ny i svenskan
        - Eleven får höra dagens modellsaga och orden på tärningarna före passet, gärna med studiehandledaren eller modersmålsläraren. Den läraren kan också lyssna när eleven berättar parets saga på det språk eleven är starkast i. I paret berättar eleven på svenska med stöd av bilderna på bladet, och kamraten hjälper till med ett ord när eleven fastnar.
      - - Har en språkstörning
        - Eleven har bilderna på bladet och tärningarna framför sig när hen berättar, och kamraten ställer en fråga i taget från kortet. Eleven berättar först, och kamraten ritar elevens svar på en lapp vid varje station. När de sedan byter och kamraten berättar, har eleven lapparna framför sig och lyssnar efter svaren.
      - - Har svårt att vänta
        - Eleven får en uppgift i varje del, som att slå tärningen, hålla kortet eller peka på stationen. I sagoteatern håller eleven lådan, säger ”Frys!” eller spelar hjälparen åt ett annat par.
      - - Vill inte spela
        - Eleven berättar och visar bilderna på bladet, eller så spelar kamraten. Vill eleven inte läsa vid boksläppet, läser kamraten eller du, medan paret visar bilderna.
      - - Kamraten är borta
        - Eleven skriver stationen ensam och säger varje mening högt innan hen skriver den. Nästa pass läser paret tillsammans det som eleven skrev. I ett berättarpass berättar eleven sagan för lyssnarparet och spelar upp den tillsammans med dem.
