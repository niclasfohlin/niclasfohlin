  - rubrik: När en elev behöver något mer
    plats: efter-fastnar
    text: "De flesta elever får det stöd de behöver i paret och genom rollerna. Här står vad du gör för enskilda elever."
    kolumner:
      - Eleven
      - Så gör du
    rader:
      - - Ljudar inte ihop ord än
        - "Som Skrivare skriver eleven det hen kan, som startordet eller den första bokstaven, och kamraten eller du skriver resten. Eleven läser meningen med fingret under orden. Sätt inte två sådana elever i samma par."
      - - Skriver långsamt
        - Som Skrivare skriver eleven början av meningen, och kamraten skriver resten medan eleven säger den. Det räknas som elevens tur. I renskriften skriver eleven den första meningen på sidan, och kamraten eller du skriver resten.
      - - Ny i svenskan
        - Eleven får höra dagens modellsaga och orden på tärningarna före passet, gärna med studiehandledaren, som också kan lyssna när eleven berättar på sitt starkaste språk. I paret berättar eleven på svenska med stöd av bladets bilder.
      - - Har en språkstörning
        - Eleven har bladets bilder och tärningarna framme när hen berättar. Kamraten ställer kortets frågor en i taget och ritar svaret på en lapp vid stationen. När de byter, lyssnar eleven efter svaren på lapparna.
      - - Har svårt att vänta
        - Eleven får en uppgift i varje del, som att slå tärningen, hålla kortet eller peka på stationen. I sagoteatern håller eleven lådan, säger ”Frys!” eller spelar hjälparen åt ett annat par.
      - - Vill inte spela
        - Eleven berättar och visar bilderna på bladet, eller så spelar kamraten. Vill eleven inte läsa vid boksläppet, läser kamraten eller du, medan paret visar bilderna.
      - - Kamraten är borta
        - Eleven skriver stationen ensam och säger varje mening högt innan hen skriver den. Nästa pass läser paret tillsammans det som eleven skrev. I ett berättarpass berättar eleven sagan för lyssnarparet och spelar upp den tillsammans med dem.
    not: "Kan en elev inte läsa frågorna på kortet, berättar hen först. Efter bytet pekar hen på stationens bild och frågar: ”Vad händer här?” Eller så läser du frågan. Dator och diktering står i tabellen För hand eller på dator."
