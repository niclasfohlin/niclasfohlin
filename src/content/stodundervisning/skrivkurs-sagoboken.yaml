  - rubrik: Berätta och spela med sagans väg
    plats: efter-arbetsform
    text: "Tabellen säger vad kamraten frågar vid varje station, vad paret gör på scenen, hur många lågor stationen brukar få på Spänningsberget och vilket skrivdrag paret använder. På scenen spelar den ena hjälten och den andra det som står i vägen. Stationen med flest lågor får mest tid och flest meningar. Vid Problemet ska läsaren tänka: ”Oj, hur ska det gå?” Paret skriver det de har sagt och spelat. Stationen där scenen frös skriver de i Fånga sagan, och resten i skrivpasset."
    kolumner:
      - Stationen
      - Kamraten frågar
      - På scenen
      - Lågor
      - I texten
    rader:
      - - Hjälten
        - Vad vill hjälten mest av allt? Varför?
        - Hjälten kliver fram och säger vad hen vill.
        - En eller två
        - Börja med vem, var och önskan.
      - - Problemet
        - "Hur känns det för hjälten?\nI fyra steg: Vad gör hjälten först? Varför går det inte?"
        - Hjälten visar med kroppen hur hen känner sig.
        - Två eller tre, fyra eller fem i fyra steg
        - Låt kroppen visa känslan. I fyra steg skriver paret också ett försök som misslyckas.
      - - "Hjälparen\nbara i sex steg"
        - Vad säger hjälparen?
        - Hjälparen ger hjälten saken eller rådet och säger en replik.
        - Två
        - En replik.
      - - "Det värsta\nbara i sex steg"
        - Vad gör hjälten först? Och vad händer då?
        - Paret spelar båda försöken långsamt, ett steg i taget.
        - Fem
        - Sakta ner vid det värsta.
      - - Lösningen
        - "Vad säger hjälten när hen löser problemet?\nI fyra steg: Vad har hjälten med sig, eller vad kan hen?"
        - Hjälten använder det hen har eller kan och säger en replik.
        - Tre
        - En replik, och hjälten gör det svåra själv.
      - - Landningen
        - Hur känns det för hjälten nu?
        - Hjälten visar att önskan har gått i uppfyllelse.
        - En
        - Knyt ihop slutet med önskan.
    not: "I fyra steg hoppar paret över Hjälparen och Det värsta, och Problemet får flest lågor. På scenen säger figurerna högt vad de vill och känner, mer än man gör i verkligheten. Det visar du i pass 3 och 6."
  - rubrik: Läspass, planeringspass och bokpass
    plats: efter-arbetsform
    text: "Varje pass är ett läspass, ett planeringspass, ett berättarpass, ett skrivpass eller ett bokpass. Skrivpasset står i tabellen 60 minuter, del för del, och berättarpasset i tabellen Berättarpasset. Här står de tre andra. Det som är annorlunda i ett visst pass står på veckans sida. I planeringspassen sitter du med två eller tre par, och från pass 16 börjar du med de par som Parets väg pekar ut."
    kolumner:
      - Passet
      - Minut för minut
    rader:
      - - "Läspass\nPass 1–3"
        - "Före: kopiera dagens saga till varje elev och lägg skyltarna längs repet.\nMinuterna står på sidan för vecka 1.\nDu kan säga: ”Vad vill hjälten? Vad står i vägen?”"
      - - "Planeringspass\nPass 4–5, 13 och 16"
        - "Före: tärningarna, bladen och bergen.\n0–⁠5 min. Sagostarten.\n5–⁠20 min. Paren slår och skriver orden vid stationerna.\n20–⁠50 min. Sagans väg och berget.\n50–⁠60 min. Två par berättar sagan."
      - - "Bokpass\nPass 24–30"
        - "Före: parens sagor, Bokens sidor och färgpennorna.\n0–⁠5 min. Sagostarten.\n5–⁠15 min. Du visar uppgiften på din sida.\n15–⁠50 min. Paren arbetar, och du sitter med ett par i taget.\n50–⁠60 min. Ett par läser en sida."
  - rubrik: För hand eller på dator
    plats: efter-arbetsform
    text: "Paret skriver hela sagan på samma sätt, för hand eller på dator. I fyra steg skriver paren för hand, också när gruppen går i åk 4–6. I sex steg kan ett par skriva på dator om båda skriver minst lika fort på tangentbordet som för hand. Det prövar ni genom att båda skriver samma mening för hand och på datorn. Behöver en elev dator eller diktering som anpassning, också i fyra steg, bestämmer du det före kursen. Då skriver hela paret på dator, och eleven ska ha övat på verktyget."
    kolumner:
      - Delen
      - För hand
      - På dator
    rader:
      - - Där sagan står
        - På bladen Sagans väg och Vår saga, som det står under Kursens material.
        - Paret skriver i ett delat dokument med stationerna som rubriker. Bladet Sagans väg ligger bredvid datorn, och där sätter paret bockarna.
      - - Rollerna
        - Skrivaren har pennan, och efter varje mening byter paret kort.
        - Paret har en dator. Efter varje mening tar den nya Skrivaren över tangentbordet, och Berättaren pekar på bladet och rör inte tangenterna.
      - - Stavningen
        - Skrivaren skriver det hen hör, och ni rättar i bokpassen.
        - Stavningskontrollen är av i skrivpassen och på i bokpassen. Den missar ungefär vart tredje fel och har svårt med sammansatta ord, så ni läser igenom texten själva också.
      - - Båda läser
        - Båda läser meningen tillsammans.
        - Båda läser meningen på skärmen. Kan en elev inte läsa texten än, låter paret datorn läsa upp meningen.
      - - Att diktera
        - Kamraten eller du skriver det eleven säger, och sedan läser eleven texten och följer med fingret.
        - Båda har övat på att diktera. Skrivaren säger meningen igen till datorn, med headset längst bort i rummet. Högst två par dikterar samtidigt, och paret rättar ord som datorn hörde fel.
      - - Draget och nya meningar
        - Paret drar ett blyertsstreck under meningen med draget. En ny mening skriver paret på en lapp och sätter lappen där meningen ska stå.
        - Paret stryker under meningen med draget genom att trycka Ctrl + U. Vill paret lägga till en mening, skriver de den där den ska stå, i en annan färg.
      - - Till boken
        - Paret skriver rent på Bokens sida.
        - Paret tar bort sagans första bokstav, skriver ut texten för varje station och klistrar den på Bokens sida. Sedan skriver de bokstaven stort för hand i den lilla rutan och ritar bilden.
    not: "På en Chromebook läser Textuppläsning upp markerad text, och den finns under Inställningar > Tillgänglighet. I Word gör knappen Läs upp på fliken Granska samma sak. Google Dokuments uppläsning kan bara engelska. Eleven dikterar med Röstinmatning under Verktyg i Google Dokument, med knappen Diktera på fliken Start i Word eller med Diktering på en Chromebook. I Word stänger du av stavningskontrollen under Arkiv > Alternativ > Språkkontroll. Visar skolans Google Dokument röda streck under svenska ord, stänger du av dem under Verktyg > Stavning och grammatik. När du delar dokumentet i Classroom väljer du ”Eleverna kan redigera filen”."
  - rubrik: Modellsagornas väg
    plats: efter-urval
    text: "I tabellen ser du var stationerna står i varje modellsaga. Frågan till gruppen, svaret och orden du förklarar står vid sagan under Kursens material. Läs dem kvällen före läspasset."
    kolumner:
