film:
  sekunder: 28.59
  beskrivning: "En elev slår tre tärningar. En mening vid varje station. Maja säger: ”Det var en gång en mus som ville ha en skatt.” Ali säger: ”Men en dag kom en stor drake och vaktade skatten.” Gruppen frågar: ”Hur ska det gå?” Läraren frågar: ”Vem löser det?” Ebba säger: ”Då kröp musen in genom ett hål som var för litet för draken.” Isak säger: ”Till slut hade musen skatten, precis som hon ville.”"
  rubrik: "Så gör eleven"
  ingress: "Fyra bilder ur filmen om Sagostarten i fyra steg, i en grupp i åk 2: en elev slår tärningarna, och gruppen berättar en saga med en mening vid varje station. Filmen på metodens sida visar samma sak i rörelse. De gula bubblorna är elevernas."
  stillbilder:
    - text: "Tärning 1, 3 och 4 visar en mus, en skatt och en drake."
    - text: "Maja berättar om en mus som vill ha en skatt."
    - text: "Gruppen frågar hur det ska gå. Läraren: Vem löser det?"
    - text: "Musen kryper själv in där draken inte kommer in."
filmer:
  - nr: 2
    titel: "Spela det som står"
    sekunder: 23.04
    beskrivning: "Maja läser. Isak spelar katten, och Ebba stormen. Isak säger: ”Jag vill segla!” Ebba säger: ”Vuuuu!” Där sagan säger för lite står spelarna stilla. Isak säger: ”Stopp!” Maja läser klart, och katten kommer hem. Ali frågar: ”Var stod ni stilla?” Isak säger: ”Vid ’Då blev det bra.’” Sedan byter paren. Sist skriver Maja och Ali där Isak och Ebba stod stilla. Ali skriver: ”Då styrde katten mot land.”"
    rubrik: "Spela det som står"
    ingress: "Fyra bilder ur filmen om strukturen Spela det som står, i fyra steg. Maja läser parets snabbsaga med fingret vid raden, och Isak och Ebba spelar bara det som står. Där sagan säger för lite står de stilla. När sagan är slut frågar paret var de stod stilla. Sedan byter paren, och sist skriver paret en mening där. Filmen på metodens sida visar samma sak i rörelse."
    efter: "ram: Strukturen, pass 12 och 20: Spela det som står"
    stillbilder:
      - text: "Maja läser, Isak spelar katten och Ebba stormen."
      - text: "Isak säger Stopp, och Maja sätter ett streck."
      - text: "Sagan är slut. Ali frågar spelarna var de stod stilla."
      - text: "Maja och Ali stryker och skriver vad katten gör."
  - nr: 3
    titel: "Paren berättar"
    sekunder: 20.91
    beskrivning: "Grodan vill komma hem. Maja berättar, och Ali har kortet. Maja säger: ”Men en dag kom en storm.” Ali läser stationens fråga på kortet. Ali frågar: ”Vad gör hjälten först? Varför går det inte?” Maja svarar. Maja säger: ”Hon hoppar, men vinden är för stark.” Maja berättar klart, och Ali frågar vid varje station. När sagan är slut byter de. Ali berättar den med svaren i. Ali säger: ”… Grodan hoppade, men vinden var för stark.”"
    rubrik: "Paren berättar"
    ingress: "Fyra bilder ur filmen om delen Paren berättar i berättarpasset, med sagans väg i fyra steg. Maja berättar sagan, och vid varje station läser Ali frågan på kortet. Maja svarar. När sagan är slut byter de, och Ali berättar samma saga med svaren i. Den blå bubblan är frågan på kortet, och de gula är det paret säger."
    efter: "tabell: Berättarpasset"
    stillbilder:
      - text: "Grodan vill komma hem. Maja berättar om stormen."
      - text: "Ali läser stationens fråga på kortet."
      - text: "Maja svarar på frågan."
      - text: "När sagan är slut byter de. Ali berättar med svaren i."
