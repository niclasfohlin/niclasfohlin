# Metod i stödundervisning. Modellen står i methods/_mall.yaml och docs/modell.md.
# En lektion i Ljudlek i grupp, skriven i lektionsskelettet: methods/ljudlek-i-grupp/_lektion.yaml.
titel: "Ljudlek: Smaka på ljud"
undertitel: "En lektion i Ljudlek i grupp: höra ljudet sist och i mitten av ordet och skriva bokstaven där det hörs, för F–⁠2"
ingress: "Eleverna säger ord långsamt, stannar på det sista ljudet eller ljudet i mitten och lägger en markör i rutan där ljudet hörs. Sedan skriver de bokstaven i rutan och jämför med kortets baksida. Lektionen hör till Ljudlek i grupp och har samma ljudstart och avslut som de andra lektionerna."
omrade: "Läsning"
arskurs:
  - "F-3"
arskursText: "F–2"
taggar:
  - "fonologisk-medvetenhet"
  - "bokstavskunskap"
  - "lasinlarning"
  - "intensivtraning"
format:
  - "liten grupp"
  - "par"
tid: "30 minuter per pass, tre till fem pass i veckan"
period: "Fyra till tolv pass i följd"
grupp: "2–12 elever"
material:
  - bildkorten
  - platsrutorna
  - whiteboardpennor
  - magneter
  - bokstavskorten
  - bokstavskartan
uppdaterad: "2026-09-30"
utkast: false
serie: "ljudlek-i-grupp"
formaga: 5
tranar: "höra det sista ljudet och ljudet i mitten, och var ett ljud hörs"
inledning:
  - "I Smaka på ljud säger eleverna ord långsamt, lyssnar efter det sista ljudet och ljudet i mitten och säger var ljudet hörs. Lektionen hjälper eleven med det som gör ljuden svåra: det sista ljudet sitter ihop med vokalen, så att eleven säger ol för sol, och vokalen i mitten flyter ihop med ljuden runt den och faller bort."
  - "Syftet är att eleverna hör det sista ljudet och ljudet i mitten i ett kort ord, så att de kan skriva ordet och läsa det. Du säger ordet långsamt och stannar på ljudet, säger bara ljudet och aldrig bokstavens namn, och ser till att eleverna skriver bokstaven i rätt ruta."
  - "Välj Smaka på ljud när fler än hälften av eleverna har färre än tre rätt av fyra på ljudkollens uppgift 5, sist och i mitten. Ljudkollen är den korta kartläggningen med nio uppgifter som du gör med varje elev före insatsen och var tredje vecka. Den står i Ljudlek i grupp, och Smaka på ljud hör till förmåga 5, Sist och i mitten, i lektionsbanken där."
upplagg:
  rubrik: "Så används lektionen"
  text: "Passet har samma ram i alla lektioner: fem minuter ljudstart, 20 minuter lektion i fyra steg och fem minuter avslut. Ljudlek i grupp beskriver gruppen, dagens elever och ljudkollen. Smaka på ljud går igenom raderna i Så blir lektionen svårare, oftast i fyra till tolv pass. Ta nästa rad när dagens elever säger rätt ljud och skriver eller visar rätt bokstav i rätt ruta på minst två av sina kort i steg 4, två pass i följd. Efter sista raden går gruppen till nästa förmåga där fler än hälften inte klarar uppgiften i ljudkollen."
tabeller:
  - rubrik: "Så blir lektionen svårare"
    plats: "efter-inledning"
    kolumner:
      - "Ljudet"
      - "Så låter det"
      - "Så gör ni"
    rader:
      - - "Sist: s, t och k"
        - "hus: det sista ljudet är /s/"
        - "Säg ordet långsamt och stanna på det sista: hhhuuusss, sss. T och k går inte att dra ut: säg dem korta och utan ö, bååå-⁠t. En kort vokal, som i ost, säger du kort."
      - - "Sist: l, r och n"
        - "sol: det sista ljudet är /l/"
        - "L, r och n flyter ihop med vokalen före. Dra ut dem: sooolll, lll."
      - - "I mitten"
        - "sol: ljudet i mitten är /o/"
        - "Orden har tre ljud och lång vokal. Dra ut vokalen: sooo. I steg 1 och 2 säger ni också ordpar ur Ordparen."
      - - "Var ljudet hörs"
        - "/s/ i hus: sist. /s/ i sol: först."
        - "Säg ett ljud och ett ord. Eleven lägger markören där ljudet hörs och skriver bokstaven."
    not: "Raderna har var sitt ark bildkort under Materialet, utom raden Var ljudet hörs, som tar arket I mitten. Vilken rad gruppen börjar i beror på felen i ljudkollen: fel på lås leder till första raden, på får till andra raden och på mur och löv till tredje raden. Den som frågar i raden Var ljudet hörs tittar på baksidan och säger ljudet för en bokstav som gruppen har haft. Har kortet ingen sådan bokstav, tar ni nästa kort. I steg 4 säger du ljudet för dagens elever, och de andra frågar varandra två och två, i nya par när det behövs."
  - rubrik: "Ljudstarten: samma fem minuter varje pass"
    plats: "efter-tidsschema"
    text: "Alla svarar samtidigt. Vänd ansiktet mot eleverna, så att de ser din mun."
    kolumner:
      - "Moment"
      - "Så gör du"
    rader:
      - - "Dagens ljud"
        - "Visa bokstaven och säg ljudet. Alla säger efter, och någon säger ett ord på ljudet. Sist säger alla ljuden för några bokstäver ni har haft."
      - - "Sätt ihop"
        - "Dra ut fem ord utan paus, med handen från vänster till höger sett från eleverna. Räkna tyst till tre och knyt handen, så säger alla ordet. Sist säger en av dagens elever ett ord ensam."
      - - "Dela upp"
        - "Säg fyra ord med olika många ljud. Alla säger ordet och sedan ljuden, med ett finger för varje, och räknar fingrarna sist. I lektionerna före Räkna ljud i banken säger du ljuden först och gruppen efter."
    not: "Säg ljudet och inte bokstavens namn, och b, d, g, k, p och t korta och utan ö. Orden tar du ur Ordbanken, och i Dela upp blandar du in ord ur de lättare ordgrupperna, så att orden har olika många ljud. Dagens ljud, dina fraser och ordgrupperna står i Ljudlek i grupp. Gruppen behåller sin ordgrupp från lektion till lektion."
  - rubrik: "Lyssna efter"
    plats: "efter-steg"
    text: "Bekräfta först det som eleven gjorde rätt, och försök sedan igen tillsammans."
    kolumner:
      - "Eleven säger"
      - "Det som händer"
      - "Så gör du"
    rader:
      - - "”sol”, ”ol” eller ”sss” för det sista ljudet i sol"
        - "Eleven säger hela ordet, vokalen ihop med det sista ljudet, eller det första"
        - "”Säg ordet långsamt och stanna på det sista: sooolll. Bara lll.”"
      - - "”ell” för l, ”tö” för båt"
        - "Eleven säger bokstavens namn, eller ett ö efter klusilen"
        - "”Ell är namnet. Hur låter den? Lll.” Säg t kort och utan ö: bååå-⁠t."
      - - "”sk” för det sista ljudet i fisk"
        - "Eleven säger hela konsonantmötet"
        - "Dra ut s:et och säg k:et kort: ”Fff-⁠i-⁠sss-⁠k. Det sista är /k/.”"
      - - "”sss, lll” för ljudet i mitten av sol"
        - "Vokalen faller bort"
        - "”Du hörde sss och lll. Vad hör du mellan dem? Sooolll.”"
      - - "”eee” i mitten av säl"
        - "Eleven blandar ihop vokaler som liknar varandra"
        - "”Dra ut vokalen och titta i spegeln: säääl.” Säg ordet med eee och med äää."
  - rubrik: "Varianter"
    plats: "efter-urval"
    text: "Byt till en variant i samma steg när gruppen behöver något nytt."
    kolumner:
      - "Variant"
      - "Så gör ni"
      - "När den passar"
    rader:
      - - "Ljudjakt"
        - "Paret letar i rummet efter saker som slutar på ett av radens ljud och säger ordet och ljudet till dig."
        - "Steg 3 i raderna Sist, när gruppen behöver röra sig"
      - - "Först och sist"
        - "Den som är säker skriver också den första bokstaven i rutan Först, när gruppen har haft den."
        - "Steg 4 i raderna Sist"
  - rubrik: "Ordparen"
    plats: "efter-urval"
    text: "Ordparen hör till steg 1 och 2 i raden I mitten. Säg båda orden och dra ut vokalen. Eleverna säger vilken vokal som byts."
    kolumner:
      - "Ordparet"
      - "Så låter det"
    rader:
      - - "sol, sil"
        - "sooolll, siiilll"
      - - "mus, mos"
        - "muuusss, mooosss"
      - - "mos, mås"
        - "mooosss, måååsss"
      - - "ben, bin"
        - "beeennn, biiinnn"
      - - "hel, häl"
        - "heeelll, hääälll"
      - - "lök, lok"
        - "lööök, loook"
    not: "Säg vad sil, mås, bin, häl och lok betyder första gången, och sätt varje ord i en mening. Långt e och ä hörs isär, men kort e och ä låter lika."
  - rubrik: "Ordbanken"
    plats: "efter-urval"
    text: "Här är orden till ljudstarten, i sex ordgrupper från lätt till svårt. Alla ord är ljudenliga, med ett ljud för varje bokstav."
    kolumner:
      - "Ordgrupp"
      - "Orden"
    rader:
      - - "Två ljud att dra ut"
        - "is, ål, se, le, ro, sy, nu, ny, så"
      - - "Tre ljud att dra ut"
        - "sol, lus, mus, mos, vas, mål, nål, mås, sås, räv, säl, hår"
      - - "Med klusil"
        - "mat, lök, nöt, pil, gås, kål, gul, bad, båt, tåg, duk, tak"
      - - "Två stavelser"
        - "sola, mosa, lera, rasa, mera, läsa, måla, leta, vila, bada, baka, kaka"
      - - "Konsonantmöte först"
        - "snö, blå, sko, bro, tre, grå, klo, stå, sten, stol, glas, svan, stor, smör"
      - - "Konsonantmöte sist"
        - "fisk, mask, hand, sand, hund, vind, land, hals, rund, tält"
    not: "Orden står i ordning, lättast först. Hur du säger orden och vilka ord som får vänta står under Ordbanken i Ljudlek i grupp."
principer:
  rubrik: "Tre saker att hålla fast vid"
  text: "Säg ordet långsamt, sooolll, stanna på ljudet ni letar efter och säg sedan bara det ljudet, lll, aldrig bokstavens namn. Blanda korten, så att eleverna lyssnar i stället för att gissa. Skriv bokstaven i rutan där ljudet hörs."
passrutin:
  text: "Lektionen går i fyra steg, från att du visar till att var och en gör själv."
  steg:
    - text: "Du säger ett ord långsamt, stannar på ljudet och lägger markören där ljudet hörs."
      fas: "Stanna på ljudet"
    - text: "Alla skriver bokstaven i rutan där ljudet hörs och visar den samtidigt."
      fas: "Skriv i rutan"
    - text: "Den ena i paret frågar efter ett ljud, och den andra lägger markören och skriver bokstaven."
      fas: "Fråga och svara"
    - text: "Var och en skriver bokstaven för ljudet i sina tre ord, och du lyssnar på dagens elever."
      fas: "Mina ord"
  efterPasset: "Du noterar i snabbmallen vilka av dagens elever som sa rätt ljud och skrev eller visade rätt bokstav i rätt ruta, vad som fastnade, och om gruppen tar samma rad, nästa rad eller nästa lektion."
tidsschema:
  rubrik: "Ett pass på 30 minuter"
  text: "Är passet bara 20 minuter blir ljudstarten tre minuter, lektionen 15 och avslutet två. Stegen får då två, fyra, fem och fyra minuter."
  rader:
    - tid: "Före passet"
      fas: "Förberedelse"
      vad: "Ta fram platsrutorna, markörerna, pennorna, trasorna, bokstavskartorna, bokstavskorten, speglarna och arket för gruppens rad, ett per par och ett till dig. Rita platsrutorna på tavlan. Välj orden till ljudstarten ur Ordbanken, och skriv dem, paren och dagens elever i snabbmallen."
    - tid: "0–5 min"
      fas: "Ljudstart"
      vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra, som i Ljudstarten. Alla svarar samtidigt."
    - tid: "5–9 min"
      fas: "Stanna på ljudet"
      vad: "Ta tre kort med olika ljud, och i raden I mitten ett ordpar. Stå bredvid platsrutorna på tavlan, vänd mot eleverna."
    - tid: "9–15 min"
      fas: "Skriv i rutan"
      vad: "Ta sex kort, och i raden I mitten först två ordpar. Du ser varje elevs bokstav."
    - tid: "15–20 min"
      fas: "Fråga och svara"
      vad: "Paret blandar korten, tar sex och turas om. Du går mellan paren."
    - tid: "20–25 min"
      fas: "Mina ord"
      vad: "Paret delar de sex andra korten, tre var. Du lyssnar på dagens elever."
    - tid: "25–30 min"
      fas: "Avslut"
      vad: "Var och en säger ett ord från dagens lek och vad hen gjorde med det. Du säger kort vad du hörde."
  efter: "Den som är klar före de andra säger ett eget ord med samma ljud på samma plats, eller byter kort med sin kamrat."
steg:
  rubrik: "Vad du gör och säger i varje steg"
  text: "Här är lärarens ord, så att du kan säga dem som de står."
  fraserRubrik: "Exempelfraser"
  rader:
    - namn: "Stanna på ljudet"
      fraga: "Vilket ljud hör jag sist?"
      gor: "Säg bildernas namn i kör första passet med ett nytt ark. Visa rutorna Först, Mitten och Sist och säg vad de betyder. Sätt kortet i rutan Bild, säg ordet långsamt och för handen från vänster till höger sett från eleverna: hhhuuusss. Stanna och säg bara ljudet, sss. Lägg markören i rutan Sist, skriv s och vänd kortet. I raden I mitten säger du: ”Sooolll. Ljudet i mitten är ooo.”"
      fraser:
        - "Hus. Hhhuuusss."
        - "Det sista ljudet jag hör är sss."
        - "Jag lägger markören i rutan Sist och skriver bokstaven."
    - namn: "Skriv i rutan"
      fraga: "Vilket ljud hör vi sist?"
      gor: "Visa ett kort och fråga efter det ljud gruppens rad tränar. Alla säger ordet långsamt, lägger markören, skriver bokstaven och håller handen över den. Den som inte kan skriva bokstaven än letar upp den på bokstavskartan och väntar. På ditt tecken tar alla bort handen eller pekar på bokstaven, och du ser varje elevs bokstav."
      fraser:
        - "Sol. Vilket ljud hör ni sist?"
        - "Skriv bokstaven och håll handen över."
        - "Händerna bort. Lll. Det sista ljudet i sol är lll."
    - namn: "Fråga och svara"
      fraga: "Vilket ljud hör du sist?"
      gor: "Den ena visar bilden och frågar: ”Vilket ljud hör du sist i båt?” Den andra säger ordet långsamt och sedan ljudet, lägger markören och skriver bokstaven, eller pekar ut den på bokstavskartan om hen inte kan skriva den än. De vänder kortet, ser om bokstaven stämmer och byter roller. Den säkrare svarar först."
      fraser:
        - "Vilket ljud hör du i mitten av sol?"
        - "Var hör du sss i hus?"
        - "Vänd kortet. Samma bokstav?"
    - namn: "Mina ord"
      fraga: "Kan du göra det själv?"
      gor: "Var och en säger ordet långsamt och sedan ljudet, skriver bokstaven och vänder kortet. Den som inte kan skriva bokstaven än pekar ut den på bokstavskartan. Lyssna på dagens elever: säger eleven bara ljudet, och står bokstaven i rätt ruta?"
      fraser:
        - "Säg ordet långsamt. Vad hör du sist?"
        - "Du stannade på det sista ljudet: lll."
        - "Vänd kortet och jämför."
arbetsform:
  rubrik: "Arbetsform: alla i kör, växlande, gemensamt"
  text: "I ljudstarten svarar alla samtidigt, och i lektionen går ni från att du visar till att var och en gör själv. Paren och trion sätter du ihop som i Ljudlek i grupp. Den som ännu inte hör det sista ljudet får föra handen med dig och blir dagens elev oftare."
  delar:
    - rubrik: "1. Alla i kör"
      text: "alla svarar"
      faser:
        - "Ljudstart"
    - rubrik: "2. Växlande"
      text: "du visar, tillsammans, i par, själv"
      faser:
        - "Stanna på ljudet"
        - "Skriv i rutan"
        - "Fråga och svara"
        - "Mina ord"
    - rubrik: "3. Gemensamt"
      text: "ett ord var"
      faser:
        - "Avslut"
exempel:
  valt:
    rubrik: "Gruppen"
    text: "sex elever i förskoleklass och åk 1, vecka 5, tre pass i veckan. Gruppen gör Smaka på ljud för andra passet i följd och står i raden Sist: l, r och n, där den började efter ljudkollen. Dagens ljud är /i/, och dagens elever är Noah och Mira."
  text:
    - "Ljudstarten. Läraren visar i-⁠kortet, och alla säger iii och tittar i spegeln. Mira säger ett ord på ljudet: ”is”."
    - "I steget Stanna på ljudet sätter läraren kortet med en sol i rutan Bild på tavlan: ”Sooolll. Det sista ljudet jag hör är lll.” Hen lägger markören i rutan Sist, skriver l och vänder kortet: ordet slutar på l. Sedan tar hen tigern och benet."
    - "I steget Skriv i rutan visar läraren kortet med en svan. Alla säger ”svaaannn”, skriver bokstaven och håller handen över den. När alla tar bort handen har Noah skrivit a. Läraren säger: ”Du hörde aaa och nnn. Vilket kom sist?” Noah skriver n."
    - "I steget Fråga och svara är paren Alva och Elin, Omar och Noah, Leo och Mira. Elin visar fågeln och frågar: ”Vilket ljud hör du sist i fågel?” Alva säger ”fååågelll, lll”, lägger markören och skriver l. De vänder kortet: ordet slutar på l."
    - "I steget Mina ord lyssnar läraren på Noah och Mira. Mira säger ”sss-⁠t-⁠eeennn, nnn” och skriver n. Noah säger ”bäver” när han ska säga det sista ljudet. Läraren säger: ”Säg ordet långsamt och stanna på det sista: bääävvverrr.” Noah säger rrr och skriver r."
    - "Avslutet. Omar säger: ”Säl. Lll sist.” Läraren säger: ”Ni stannade på det sista ljudet och hittade bokstaven.”"
    - "Efteråt noterar läraren: Mira säger det sista ljudet rätt och skriver bokstaven. Noah säger hela ordet, eller vokalen ihop med det sista ljudet. Nästa pass tar gruppen samma rad, och dagens elever blir Leo och Elin."
fastnar:
  rubrik: "När eleven fastnar"
  text: "Vänta tre sekunder och ge minsta möjliga stöd först. Blir det många fel i gruppen, säg ordet i kör, låt sedan några elever säga det ensamma och ta samma ord minst tre gånger."
  fragaForst:
    - "Vad hör du?"
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg ordet igen, långsamt: sooolll, och stanna på det sista."
    - "Visa hur munnen gör. Eleven tittar i spegeln och känner efter: ”Känn på läpparna. Var är tungan? Öppna munnen lite till för å.”"
    - "Gör uppgiften mindre: två ljud att välja mellan, hör du lll eller ooo sist i sol?"
    - "Visa med handen eller med något att flytta: för handen från vänster till höger sett från eleven och stanna där ljudet hörs."
    - "Säg det tillsammans, och låt eleven säga det själv efteråt: sooolll, lll."
  motto: "Till sist stannar eleven på ljudet själv."
urval:
  rubrik: "Var hittar du orden och materialet?"
  text:
    - "Bildkorten står under Materialet, platsrutorna i planeringsmallarna och bokstavskartan i Ljudlek i grupp. Orden till ljudstarten står i Ordbanken, och ordparen i tabellen Ordparen."
    - "Egna ord går också bra, utom orden i ljudkollen och i screeningens version B."
  kravText: "Tre krav gäller egna ord:"
  krav:
    - rubrik: "Kända ord"
      text: "Eleven vet vad ordet betyder"
    - rubrik: "Bokstaven stämmer"
      text: "Bokstaven där ljudet hörs låter som ljudet"
    - rubrik: "Olika ljud"
      text: "Minst tre olika sista ljud eller vokaler på varje ark"
uppfoljning:
  text: "Du ser i steg 4 vad eleverna klarar, och ljudkollen var tredje vecka visar samma sak för varje elev. Berätta konkret för eleven vad hen har lärt sig."
  rader:
    - nar: "Under passet"
      vad: "I steg 4 lyssnar du på dagens elever: säger eleven bara ljudet, och skriver eller visar hen rätt bokstav i rätt ruta?"
    - nar: "Efter varje pass"
      vad: "I snabbmallen noterar du dagens elever och det som fastnade."
    - nar: "Var tredje vecka"
      vad: "Du gör ljudkollens uppgift 5 om sist och i mitten, uppgift 6 om att dela upp och uppgift 4 om bokstävernas ljud."
mal:
  rubrik: "Mål: vad eleven ska kunna efter lektionen"
  text: "Efter lektionen ska eleven kunna:"
  punkter:
    - "säga det sista ljudet i ord med tre till fem ljud"
    - "säga ljudet i mitten av ord med tre ljud och lång vokal"
    - "säga var ett ljud hörs: först, i mitten eller sist"
    - "skriva eller visa bokstaven för ljudet i rätt ruta"
snabbmall:
  fore:
    - "Raden och arket"
    - "Dagens ljud och orden ur Ordbanken"
    - "Paren och dagens elever"
  efter:
    - "Vilka av dagens elever sa rätt ljud och skrev eller visade rätt bokstav i rätt ruta?"
    - "Ord och ljud som fastnade"
    - "Nästa pass: samma rad, nästa rad eller nästa lektion?"
grund:
  text: "Det första ljudet är lättast att höra, det sista svårare och ljudet i mitten svårast. Holländska sexåringar hade 69, 60 och 45 procent rätt, i den ordningen (de Graaff m.fl., 2008). Nybörjare kopplar först bokstäver till det första och det sista ljudet och missar vokalen (Ehri, 2014). Undervisningen ger mest när eleverna arbetar med bokstäverna, i små grupper och med en eller två färdigheter i taget (National Reading Panel, 2000; Foorman m.fl., 2016)."
  kallor: "Bygger på de Graaff m.fl. (2008), Ehri (2014), Foorman m.fl. (2016) och National Reading Panel (2000)."
ramar:
  rubrik: "Materialet"
  text:
    - "Här finns bildkorten, ett ark för var och en av de tre första raderna i Så blir lektionen svårare, och bokstavskorten. Platsrutorna står i planeringsmallarna och bokstavskartan i Ljudlek i grupp. Allt går att kopiera. Laminera bokstavskorten, bokstavskartorna, bildkorten när de är vikta och limmade, och platsrutorna, som eleverna skriver på."
  ramar:
    - rubrik: "Bildkorten"
      text:
        - "Varje ark har minst tre olika sista ljud eller vokaler i mitten, så att eleverna lyssnar i stället för att gissa. Korten står i bokstävernas ordning efter det ljud raden tränar, så att du ser vilka kort som kräver en bokstav som gruppen inte har haft. Blanda korten innan ni tar dem, så att ingen kan gissa ljudet efter ordningen. Arket står två gånger på sidan, så en sida räcker till två par, eller till ett par och dig. Skriv ut sidan för gruppens rad. Med tolv elever behöver du fyra sidor."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Klipp längs strecken och vik varje kort längs den blå prickade linjen, så att bilden blir framsidan och ordet baksidan. Limma ihop halvorna och laminera sist. Vänd kortet som en sida i en bok, så står ordet rätt, med en prick under för varje ljud. Första passet med ett nytt ark säger ni bildernas namn i kör, och du säger vad ord som bäver och kamel betyder: ”Det här är en bäver. Den bygger dammar. Vi säger bäver.” Bilderna till salt, smör och mål kan också heta saltkar, ost och nät. Säger eleverna solen eller båten, blir det sista ljudet ett annat. Säg ordet som det står på kortet."
      listor:
        - rubrik: "Bildkort · Sist: s, t och k"
          rader:
            - - "hus"
              - "mus"
              - "båt"
            - - "morot"
              - "tomat"
              - "raket"
            - - "ost"
              - "tält"
              - "salt"
            - - "lök"
              - "fisk"
              - "mask"
        - rubrik: "Bildkort · Sist: l, r och n"
          rader:
            - - "sol"
              - "säl"
              - "nål"
            - - "fågel"
              - "kamel"
              - "tiger"
            - - "bäver"
              - "smör"
              - "ben"
            - - "melon"
              - "sten"
              - "svan"
        - rubrik: "Bildkort · I mitten"
          rader:
            - - "sol"
              - "ben"
              - "pil"
            - - "nål"
              - "mål"
              - "båt"
            - - "tåg"
              - "hus"
              - "mus"
            - - "säl"
              - "räv"
              - "lök"
    - rubrik: "Bokstavskorten"
      text:
        - "Det är samma 24 kort i alla lektioner, i den ordning bokstäverna blir dagens ljud."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Skriv ut korten på tjockt papper och klipp isär dem. Håll upp kortet för dagens ljud så att alla ser det, och håll det rättvänt, eftersom u blir n och d blir p när kortet vänds upp och ned."
      listor:
        - rubrik: "Bokstavskort"
          rader:
            - - "s"
