    - "Bokstavskort"
mallar:
  - rubrik: "Platsrutorna"
    typ: "matta"
    text: "Skriv ut en per elev och laminera, så att eleven kan skriva bokstaven med en whiteboardpenna och torka bort den."
    kolumner:
      - "Bild"
      - "Först"
      - "Mitten"
      - "Sist"
    fot: "Lägg bildkortet i rutan Bild, med bilden uppåt. Säg ordet långsamt och lägg markören i rutan där ljudet hörs: först, i mitten eller sist. Skriv bokstaven i samma ruta, och torka bort den efter varje kort."
film:
  sekunder: 26.81
  beskrivning: "Kamraten frågar efter ljudet. Säg ordet långsamt och stanna på ljudet. Lägg markören där ljudet hörs. Skriv bokstaven i rutan. Vänd kortet. Stämmer bokstaven? Nästa kort: ljudet i mitten. Vänd kortet. Stämmer bokstaven?"
  rubrik: "Så gör eleven"
  ingress: "Fyra bilder ur lektionens film om vad eleven gör. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Kamraten frågar efter ljudet sist i ordet."
    - text: "Säg ordet långsamt och lägg markören där ljudet hörs."
    - text: "Skriv bokstaven och vänd kortet: stämmer den?"
    - text: "Nästa kort, sol: o hörs i mitten, och baksidan stämmer."
