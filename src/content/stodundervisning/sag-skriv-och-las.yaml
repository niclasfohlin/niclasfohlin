utkast: false
inledning:
  - "Säg, skriv och läs är en insats för elever i F–2 som kan bokstävernas ljud men inte kommer igång med att skriva. Eleven säger ett ord eller en mening, bygger det med lösa bokstavskort och läser det hen har byggt, om och om igen, tills rörelsen sitter och eleven börjar skriva själv. Rörelsen kommer ur boken Skriv! (Fohlin och Wilson, utkommer 2027), där den är kärnan i den första skrivundervisningen."
  - "Mitt på bordet ligger en hög med bokstavskort, små bokstäver att bygga med, och bredvid den en liten hög med stora bokstäver, punkter och frågetecken. Varje elev bygger på sin rad, på bordet framför sig, och har ett namnkort och en skrivbok. Ordbilderna, vanliga ord som inte stavas som de låter, ligger också på bordet. Du har listorna med orden och meningarna i handen, och en miniwhiteboard där du skriver det du visar."
  - "Du visar först rörelsen med dagens första mening och tänker högt. Sedan säger du nästa mening ur listan, och eleven säger den igen och räknar orden på fingrarna innan hen bygger. Hen lägger ett kort för varje ljud, ord för ord med ett fingers mellanrum, och läser från början efter varje ord. Korten tar bort det tunga i att forma bokstäverna, så att eleven orkar höra ljuden och hålla kvar meningen. När eleven läser, ser hen om det som ligger är det hen ville säga. Sist i passet byter eleven ett ord, så att meningen blir hens egen, och grannen läser den högt."
  - "Första veckan bygger gruppen ord. Sedan blir det meningar på två, tre, fyra och fem ord, och ungefär varje vecka kommer en ny ordbild. I vecka 2 kan det låta så här: du säger ”Ola ler.”, alla säger meningen igen och räknar två ord på fingrarna, och var och en bygger Ola, ett fingers mellanrum, ler och punkten. När rörelsen sitter, omkring vecka 3, prövar eleven att skriva sin mening i skrivboken med pennan, och korten finns kvar. Är eleven redo, skriver hen de två sista veckorna egna meningar om något som har hänt eller efter ett skrivkort. När insatsen slutar följer skrivboken med till klassen, där eleven skriver en mening om dagen."
upplagg:
  rubrik: "Så fungerar insatsen"
  text: "Insatsen är för en till fyra elever, 30 minuter tre gånger i veckan i omkring åtta veckor. Varje pass har fyra delar: Startorden, Jag visar, Dagens meningar och Min mening. I varje del gör ni samma rörelse: säga, bygga och läsa från början. Listan växer från ord till meningar på fem ord, och sist skriver eleven egna meningar. När rörelsen sitter prövar eleven att skriva med penna. I varje pass ser du om eleven får med ljuden, orden och mellanrummen. Före insatsen, efter vecka 4 och efter vecka 8 visar Skrivkollen, en kort kartläggning med varje elev, vad eleven skriver på egen hand."
gruppen:
  rubrik: "Så sätter du ihop gruppen"
  text: "Insatsen är för elever i F–2 som kan ljuden till de flesta bokstäverna och kan dela upp och sätta ihop ord med tre ljud, men som inte kommer igång med att skriva. Den som ännu inte kan bokstävernas ljud eller inte hör ljuden i ord börjar i Ljudlek i grupp. Den som har svårt att säga en hel mening behöver också arbeta med det muntliga språket, och i insatsen säger du meningen först, så att hen inte behöver hitta på den. Gruppen är en till fyra elever som skriver på ungefär samma nivå, och en elev ensam går lika bra."
principer:
  rubrik: "Tre saker att hålla fast vid"
  text: "Låt eleven säga meningen igen och räkna orden innan hen bygger, så att meningen finns kvar medan hen skriver. Låt eleven läsa det som ligger, med fingret under: så upptäcker hen själv ett ljud som fattas. Bekräfta först det som stämmer, fråga sedan efter nästa ljud och låt eleven hitta resten."
passrutin:
  kallas: delar
  text: "Passet har samma fyra delar varje gång, och korten går tillbaka i högen efter varje ord och mening, utom den sista meningen. Här står ett pass med meningar. Vecka 1 är det ord i passets alla delar: i Jag visar skriver du ett ord ur dagens ordgrupper i tabellen Orden, i Dagens meningar bygger var och en omkring sex ord ur samma ordgrupper, och i Min mening bygger eleven ett ord hen vill skriva, som grannen läser. Ordbilderna börjar vecka 2. Den som är klar före de andra får fyra kort i blandad ordning, bokstäverna i ett ord ur tabellen Orden. Hen flyttar dem och läser tills hen hittar ett ord. Är gruppen klar före tiden, gör alla det eller läser ur skrivböckerna för varandra."
  steg:
    - text: "Var och en bygger två ord, och sist veckans ordbild och en av de förra, som i tabellen Ordbilderna."
      fas: "Startorden"
    - text: "Du skriver dagens första mening på miniwhiteboarden och tänker högt. En gång i veckan gör du ett fel med flit."
      fas: "Jag visar"
    - text: "Var och en bygger två eller tre meningar ur listan, och den sista ligger kvar."
      fas: "Dagens meningar"
    - text: "Eleven byter ett ord i sista meningen, grannen läser den, och sist skriver ni den i skrivboken och jämför med raden."
      fas: "Min mening"
  efterPasset: "Du skriver i snabbmallen vilka ljud och ord som var svåra, och om gruppen stannar i steget eller går vidare."
tidsschema:
  rubrik: "Ett pass på 30 minuter"
  text: "Före första passet får varje elev ett namnkort och en skrivbok. Namnkortet är en remsa med elevens namn, lika hög som bokstavskorten, och kamraterna kan lägga in den i sina meningar. Skrivboken är ett skrivhäfte med stödlinjer och elevens namn på, och varje sida får en mening och ett datum."
  rader:
    - tid: "Före passet"
      fas: "Förberedelse"
      vad: "Lägg högen med bokstavskort och den lilla högen mitt på bordet, eller till varje par när eleverna är fyra. Lägg fram namnkorten, skrivböckerna, ordbilderna och miniwhiteboarden, och skriv dagens ord och meningar i snabbmallen."
    - tid: "0–5 min"
      fas: "Startorden"
      vad: "Säg ordet. ”Säg det långsamt. Vad hör du först?” Alla bygger det från vänster och läser med fingret under. Skriv sist ordet på miniwhiteboarden, och eleverna jämför."
    - tid: "5–9 min"
      fas: "Jag visar"
      vad: "”Jag ska skriva: Vi har is.” Säg meningen två gånger och fråga: ”Hur många ord är det?” Skriv ord för ord med ett fingers mellanrum, och läs från början efter varje ord."
    - tid: "9–22 min"
      fas: "Dagens meningar"
      vad: "Säg meningen. ”Säg den igen. Hur många ord?” Alla bygger ord för ord och läser från början efter varje ord. Lyssna på en i taget. Skriv sist meningen, och eleverna jämför."
    - tid: "22–30 min"
      fas: "Min mening"
      vad: "Eleven bygger sitt nya ord och viskar meningen till dig. ”Kan din granne läsa den?” Ni ser om något fattas. Säg vad som fungerar och ge ett litet tips framåt."
arbetsform:
  rubrik: "Arbetsform: enskilt, läraren visar, enskilt igen, i par"
  text: "Arbetsformen för varje del står i Ett pass på 30 minuter. När gruppen är en enda elev, viskar eleven inte meningen till dig. Du läser raden exakt som den ligger, och sedan säger eleven vad hen ville skriva. En gång i veckan kan klassläraren läsa skrivboken. Vill eleven inte visa sin mening för grannen än, läser du raden i stället."
  delar:
    - rubrik: "1. Enskilt"
      text: "var och en bygger sina ord"
      faser:
        - "Startorden"
    - rubrik: "2. Läraren visar"
      text: "gruppen säger med och räknar"
      faser:
        - "Jag visar"
    - rubrik: "3. Enskilt igen"
      text: "var och en bygger meningen"
      faser:
        - "Dagens meningar"
    - rubrik: "4. I par"
      text: "grannen läser högt"
      faser:
        - "Min mening"
exempel:
  valt:
    rubrik: "Gruppen"
    text: "fyra elever i åk 1, vecka 4, första passet med fyra ord, då ordbilden ”och” kommer. Eleverna är Saga, Noah, Ella och Hugo."
  text:
    - "Startorden. Läraren säger stol. Alla säger det långsamt, och var och en bygger. Hugo lägger s, o och l. Läraren säger: ”Du hörde /s/, /o/ och /l/. Säg det långsamt igen. Hör du något mellan /s/ och /o/?” Hugo hör /t/ och lägger in t. Sist lägger läraren fram veckans nya ordbild. Alla bygger den efter kortet och säger vad som inte låter som det står: o låter som å, och ch låter som k. När läraren har vänt kortet, bygger de ordet utan att titta."
    - "Jag visar. Läraren säger: ”Jag ska skriva: Ola och Lisa ler.” Hen skriver på miniwhiteboarden och tänker högt: ”Fyra ord. Ola, med stort O. Ett finger. Och, ordbilden.” Lisa skriver läraren utan s, med flit, och läser: ”Lia? Vad saknas?” Saga säger /s/."
    - "Dagens meningar. Den tredje meningen är ”Hon och Omar vilar.” Alla säger den igen och räknar fyra ord på fingrarna. Ella bygger Honoch utan mellanrum. När hon läser från början med fingret under, ser hon att det blev ett ord där hon sa två, och lägger ett finger emellan. Efter tre meningar har alla jämfört sina rader med meningen på miniwhiteboarden."
    - "Min mening. ”Hon och Omar vilar.” ligger kvar. Noah tar bort ”vilar”, bygger ”läser” och viskar till läraren: ”Hon och Omar läser.” Saga läser Noahs rad högt utan att ha hört meningen, och läraren säger: ”Saga kunde läsa den, för du gjorde mellanrum. Nästa gång kan du byta två ord.” Sist skriver Noah meningen i skrivboken, läser den och jämför med raden."
    - "Efteråt noterar läraren: Hugo tappar t i konsonantmöten, och Ella glömmer mellanrummet före ”och”. Nästa pass stannar gruppen i samma steg, och i Startorden bygger alla två ord med konsonantmöte."
fastnar:
  rubrik: "När eleven fastnar"
  text: "Vänta tre sekunder och ge minsta möjliga stöd först. Fastnar flera på samma ljud, säg ordet i kör och ta ord med det ljudet i Startorden nästa pass."
  fragaForst:
    - "Vad hör du?"
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg ordet igen, långsamt, och dra fingret under raden medan ni säger det."
    - "Bekräfta ljuden som stämmer och fråga efter det som fattas: ”Vad hör du mellan /k/ och /l/?”"
    - "Gör uppgiften mindre: eleven väljer mellan två kort, som e och o."
    - "Säg bara ljudet som fattas: eee, eller /t/ kort och utan ö."
    - "Bygg ordet tillsammans, och låt eleven bygga det själv efteråt."
  motto: "Till sist bygger och läser eleven själv."
urval:
