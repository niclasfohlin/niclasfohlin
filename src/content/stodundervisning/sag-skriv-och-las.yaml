grund:
  text: "I studier i de första skolåren stavade, avkodade och skrev elever i riskzonen för läs- och skrivsvårigheter tydligt bättre när de fick bygga ord med lösa bokstäver och skriva dem (Weiser och Mathes, 2011), och att skriva ord gör också att eleverna läser bättre (Graham och Hebert, 2010). I åk 1 var det muntliga språket, arbetsminnet och stavningen det som betydde mest för hur eleverna skrev (Kim och Schatschneider, 2017), och därför säger eleven meningen och räknar orden innan hen bygger. Barn i förskoleklass som skrev de ljud de hörde och fick återkoppling lärde sig läsa fler ord än barn som bara övade på att höra ljuden (Ouellette och Sénéchal, 2008). Elever i åk 1 som skrev orden för hand stavade bättre än de som lade dem med lösa bokstäver (Cunningham och Stanovich, 1990), och därför prövar eleven att skriva med penna så snart rörelsen sitter, omkring vecka 3. Barn i förskoleklass lärde sig bättre att läsa ord som inte stavas som de låter när de skrev dem efter förlagan än när de bara tittade på dem och sa dem (Colenbrander m.fl., 2022)."
  kallor: "Bygger på Fohlin och Wilson, Skriv! (utkommer 2027), Weiser och Mathes (2011), Graham och Hebert (2010), Kim och Schatschneider (2017), Ouellette och Sénéchal (2008), Cunningham och Stanovich (1990) och Colenbrander m.fl. (2022)."
ramar:
  rubrik: "Materialet"
  text:
    - "Här finns bokstavskorten, ordbildskorten, Skrivkollen och sidan Till klassläraren. Skriv ut korten på tjockt papper, laminera dem och klipp isär dem. På sidan Till klassläraren fyller du i de två sista raderna för varje elev."
  ramar:
    - rubrik: "Bokstavskorten"
      text:
        - "Varje elev får ett ark med små bokstäver. Ett ark med stora bokstäver, punkter och frågetecken räcker till två elever, så tre elever behöver två ark. Båda arken har hela alfabetet, och de bokstäver som behövs mest finns flera gånger. Vecka 1 räcker de små. Skolans egna bokstavsbrickor går också bra, om de har små bokstäver och å, ä och ö, och en mening på fem ord ryms framför varje elev."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Högen"
              text: "Lägg de små bokstäverna i en hög mitt på bordet och bred ut dem med bokstaven uppåt, så att alla syns. Lägg de stora bokstäverna och tecknen i en liten hög bredvid. Är eleverna fyra, sitter de två och två, och varje par har en hög och en liten hög."
            - rubrik: "Upp och ner"
              text: "Visa eleverna att u blir n, b blir q och d blir p när kortet ligger upp och ner."
            - rubrik: "Saknas en bokstav"
              text: "Skriv den på en lapp."
      listor:
