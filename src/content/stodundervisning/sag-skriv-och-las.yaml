    - rubrik: "Ordbildskorten"
      text:
        - "Här är sex kort, ett för varje ordbild."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "I Startorden ligger korten med ordet nedåt, utom den nya ordbilden första passet. Eleven bygger ordet, vänder kortet och ser om det stämmer. När gruppen bygger meningar ligger veckans ordbild med ordet uppåt och de förra med ordet nedåt. Hur eleven lär sig en ny ordbild står i tabellen Ordbilderna."
      listor:
        - rubrik: "Ordbildskorten att klippa"
          rader:
            - ["jag", "hon", "och"]
            - ["det", "en", "med"]
    - rubrik: "Skrivkollen"
      text:
        - "Skrivkollen visar vad eleven skriver med pennan, utan korten. Du gör den före insatsen, efter vecka 4 och efter vecka 8, med en elev i taget och utanför passen. Den tar omkring en kvart med varje elev. Eleven skriver på ett linjerat papper, och du sparar det med elevens protokoll, ett blad per elev."
      huvud:
        - rubrik: "Elevens namn"
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Orden och meningarna"
              text: "Säg ordet, sätt det i en mening och säg det igen. Säg meningen två gånger, och eleven säger den igen innan hen skriver."
            - rubrik: "Den egna meningen"
              text: "Sist skriver eleven en mening om något hen har gjort. Skriv i protokollet hur många ord meningen har och hur många mellanrum som stämmer."
            - rubrik: "Ljuden"
              text: "Eleven får ett poäng för varje ljud i rätt ordning, så att sl för sol ger två av tre. I hon och en räknas ljuden, så att hån och än ger full poäng."
            - rubrik: "Mellanrum och tecken"
              text: "Eleven får ett poäng för varje mellanrum, stor bokstav och punkt i meningarna, och ett för varje mening som hen läser som den står."
            - rubrik: "Ordbilderna"
              text: "Före insatsen och efter vecka 8 får eleven ett poäng för varje ordbild som hen stavar rätt."
