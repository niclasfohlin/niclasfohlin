          rader:
            - ["a", "a", "a", "a", "b", "c"]
            - ["d", "e", "e", "e", "e", "f"]
            - ["g", "h", "i", "i", "i", "j"]
            - ["k", "k", "l", "l", "m", "n"]
            - ["n", "o", "o", "p", "q", "r"]
            - ["r", "r", "r", "s", "s", "t"]
