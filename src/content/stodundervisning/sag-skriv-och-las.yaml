  text:
    - "Orden och meningarna står i tabellerna Orden och Meningarna, i den ordning gruppen tar dem. Alla står också på Lektionskortet, ett A4 med passet och orden på framsidan och meningarna på baksidan. Du hämtar det på metodens sida och laminerar det. Ta listorna uppifrån och hoppa över ett ord med en bokstav som gruppen inte kan än. Räcker inte listan, byter du ett ord i en mening som gruppen redan har haft."
    - "Skrivkorten till de två sista veckorna finns på sidan Ta fram ett skrivkort, som hör till metoden Kortskrivning: skriv varje dag. Välj nivån Bas, slumpa fram ett kort och visa det på en skärm eller skriv ut det."
  kravText: "Tre krav gäller ord och meningar du väljer själv:"
  krav:
    - rubrik: "Kända ord"
      text: "Eleven vet vad orden betyder"
    - rubrik: "Ljudenliga"
      text: "En bokstav för varje ljud, utom ordbilderna"
    - rubrik: "Inga provord"
      text: "Inga ord ur Skrivkollen, ljudkollen eller skolans diktamen, utom småorden"
