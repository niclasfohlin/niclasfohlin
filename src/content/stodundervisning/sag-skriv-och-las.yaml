    not: "Vecka 8 väljer varje elev också ett eget ord som inte stavas som det låter. Du skriver det på en lapp, och eleven lär sig det på samma sätt som de andra, som veckans ordbild."
uppfoljning:
  text: "Du ser i varje pass vad eleven bygger och skriver. Visa eleven i hens egna meningar vad hen kan nu."
  rader:
