    text: "Ordbilderna är sex vanliga ord som inte stavas som de låter. Första passet med ordbildens lista bygger eleven två ord i Startorden och sist den nya ordbilden: hen ser ordet, säger det, bygger det och säger vad som inte låter som det står. Sedan vänder du kortet, och eleven bygger ordet utan att titta, eller skriver det längst bak i skrivboken när hen har börjat med pennan. De andra passen ligger korten med ordet nedåt. Eleven bygger veckans ordbild och en av de förra, vänder sedan korten och ser om orden stämmer. I vecka 2 finns ingen av de förra, och då bygger eleven tre ord före veckans ordbild."
    kolumner:
      - "Ordbilden"
      - "Det som inte låter som det står"
      - "Kommer med listan"
    rader:
      - - "jag"
        - "g hörs inte"
        - "Två ord med ”jag”"
      - - "hon"
        - "o är kort, fast det bara står ett n"
        - "Tre ord med ”hon”"
      - - "och"
        - "o låter som å, och ch låter som k"
        - "Fyra ord med ”och”"
      - - "det"
        - "t hörs inte"
        - "Fyra ord med ”det”"
      - - "en"
        - "e låter som ä och är kort, fast det bara står ett n"
