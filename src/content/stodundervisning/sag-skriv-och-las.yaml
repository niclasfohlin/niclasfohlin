titel: "Säg, skriv och läs"
undertitel: "Bokstavskort, ord och de första meningarna i liten grupp, för F–2"
ingress: "Du säger en mening, och eleven säger den igen, bygger den med bokstavskort och läser det hen har byggt. Först bygger gruppen ord, sedan meningar på två till fem ord och sist egna meningar, och eleven skriver också med penna. Insatsen är för elever i F–2 som kan bokstävernas ljud men inte kommer igång med att skriva."
