    - "flytta en markör för varje ljud medan hen säger det, från vänster till höger"
    - "dela upp ord med konsonantmöte först och sist"
    - "skriva bokstäverna i rutorna och läsa tillbaka ordet, när hen kan bokstäverna i ordet"
