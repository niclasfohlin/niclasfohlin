# Metod i stödundervisning. Modellen står i methods/_mall.yaml och docs/modell.md.
# En lektion i Ljudlek i grupp, skriven i lektionsskelettet: methods/ljudlek-i-grupp/_lektion.yaml.
titel: "Ljudlek: Räkna ljud"
undertitel: "En lektion i Ljudlek i grupp: dela upp ord i ljud, i grupp och enskilt, för F–⁠2"
ingress: "Eleverna delar upp ord i sina ljud och flyttar en markör in i en ruta för varje ljud, från vänster till höger. Sedan drar de fingret under rutorna och säger ordet. Lektionen hör till Ljudlek i grupp och har samma ljudstart och avslut som de andra lektionerna."
omrade: "Läsning"
arskurs:
  - "F-3"
arskursText: "F–2"
taggar:
  - "fonologisk-medvetenhet"
  - "bokstavskunskap"
  - "lasinlarning"
  - "intensivtraning"
format:
  - "liten grupp"
  - "par"
tid: "30 minuter per pass, tre till fem pass i veckan"
period: "Sex till femton pass i följd"
grupp: "2–12 elever"
material:
  - "Bildkorten under Materialet: arket för gruppens rad, ett per par och ett till dig"
  - "Laminerade ljudrutor ur planeringsmallarna, fyra markörer och en whiteboardpenna per elev"
  - "Fem magneter till tavlan"
  - "Bokstavskorten under Materialet och en spegel per par"
uppdaterad: "2026-09-29"
utkast: true
serie: "ljudlek-i-grupp"
formaga: 6
tranar: "dela upp ord i ljud, med en markör för varje ljud"
inledning:
  - "I Räkna ljud delar eleverna upp ord i sina ljud och flyttar en markör in i en ruta för varje ljud. Lektionen hjälper eleven med det som gör ljuden svåra att räkna: barn hör stavelser före ljuden, och ljudet i mitten och en konsonant i ett konsonantmöte faller lätt bort."
  - "Syftet är att eleverna hör varje ljud i ordet, i ordning, och vet hur många de är, så att de kan skriva ordet och läsa det. Ditt uppdrag är att visa hur du flyttar en markör för varje ljud medan du säger ljudet, att låta eleverna ta över steg för steg och att lyssna på var och en."
  - "Välj Räkna ljud när fler än hälften av eleverna har en ring på ljudkollens uppgift 6, dela upp, alltså färre än tre rätt av fyra. Ljudkollen står i Ljudlek i grupp, och Räkna ljud hör till förmåga 6, Dela upp, i lektionsbanken där."
upplagg:
  rubrik: "Så används lektionen"
  text: "Passet har samma ram i alla lektioner: fem minuter ljudstart, 20 minuter lektion i fyra steg och fem minuter avslut. Ljudlek i grupp beskriver gruppen, dagens elever och ljudkollen. Räkna ljud går igenom raderna i Så blir lektionen svårare, oftast i sex till femton pass. Har dagens elever två pass i följd lagt rätt antal markörer och sagt ljuden i minst två av sina ord i steg 4, tar ni nästa rad. Efter sista raden tar ni nästa lektion."
tabeller:
  - rubrik: "Så blir lektionen svårare"
    plats: "efter-inledning"
    kolumner:
      - "Ordgrupp"
      - "Så låter det"
      - "Så gör ni"
    rader:
      - - "Tre ljud att dra ut"
        - "sol: /s/ /o/ /l/, tre ljud"
        - "Dra ut ljuden: sssooolll. Dra ut både s och v i svan: sss-⁠vvv-⁠aaa-⁠nnn. Säg k och b korta i ko, bi, kaka och räka."
      - - "Med klusil"
        - "båt: /b/ /å/ /t/, tre ljud"
        - "Klusilerna b, d, g, k, p och t går inte att dra ut. Säg dem korta och utan ö: b-⁠ååå-⁠t."
      - - "Två stavelser"
        - "myra: /m/ /y/ /r/ /a/, fyra ljud"
        - "Säg ordet långsamt och utan klappar: mmmyyyrrraaa."
      - - "Konsonantmöte först"
        - "sten: /s/ /t/ /e/ /n/, fyra ljud"
        - "Dra ut det ljud i mötet som går att dra ut: sss-⁠t-⁠eee-⁠nnn. Säg t:et kort i träd: t-⁠rrr-⁠äää-⁠d."
      - - "Konsonantmöte sist"
        - "hund: /h/ /u/ /n/ /d/, fyra ljud"
        - "Vokalen är kort. Dra ut n:et: hu-⁠nnn-⁠d."
    not: "Varje rad har ett ark vikkort under Materialet, med bilden på framsidan och ordet med en prick för varje ljud på baksidan. Gruppen börjar i den första rad som ljudkollens fel leder till. Missar eleverna få eller hål börjar ni i Tre ljud att dra ut, missar de näsa i Två stavelser och missar de häst i Konsonantmöte först, den första raden med konsonantmöten."
  - rubrik: "Ljudstarten: samma fem minuter varje pass"
    plats: "efter-tidsschema"
    text: "Alla svarar samtidigt. Vänd ansiktet mot eleverna, så att de ser din mun."
    kolumner:
      - "Moment"
      - "Så gör du"
    rader:
      - - "Dagens ljud"
        - "Visa bokstaven och säg ljudet. Alla säger efter, och någon säger ett ord på ljudet. Sist säger alla ljuden för några bokstäver ni har haft."
      - - "Sätt ihop"
        - "Dra ut fem ord utan paus, med handen från vänster till höger sett från eleverna. Räkna tyst till tre och knyt handen, så säger alla ordet. Sist säger en av dagens elever ett ord ensam."
      - - "Dela upp"
        - "Säg fyra ord med olika många ljud. Alla säger ordet och sedan ljuden, med ett finger för varje, och räknar fingrarna sist."
    not: "Säg ljudet och inte bokstavens namn, och b, d, g, k, p och t korta och utan ö. Orden tar du ur Ordbanken, och i Dela upp blandar du in ord ur de lättare ordgrupperna, så att orden har olika många ljud. Dagens ljud, dina fraser och ordgrupperna står i Ljudlek i grupp. Ordgruppen är densamma som gruppens rad."
  - rubrik: "Lyssna efter"
    plats: "efter-steg"
    text: "Bekräfta först det som eleven gjorde rätt, och försök sedan igen tillsammans."
    kolumner:
      - "Eleven säger"
      - "Det som händer"
      - "Så gör du"
    rader:
      - - "”sol” med en markör, eller ”s-⁠ol” med två"
        - "Eleven hör stavelsen, eller början och resten"
        - "Dra ut ordet, sssooolll, och flytta en markör för varje ljud medan ni säger det."
      - - "”m-⁠t” för mat"
        - "Ljudet i mitten faller bort"
        - "”Du hörde /m/ och /t/. Vad hör du mellan dem? Maaat.”"
      - - "”s-⁠e-⁠n” för sten, ”sutol” för stol"
        - "En konsonant faller bort i mötet, eller en vokal kommer in"
        - "Dra ut det ljud som går att dra ut, utan något ljud emellan: sss-⁠t-⁠eee-⁠nnn."
      - - "”bö-⁠å-⁠tö” för båt, ”ess” för s"
        - "Eleven säger ett ö efter klusilen, eller bokstavens namn"
        - "Säg ljudet kort och gå direkt till nästa: b-⁠ååå-⁠t. Säger eleven ess, fråga: ”Hur låter den?”"
      - - "”aba” om apan"
        - "Eleven blandar ihop p och b, t och d eller k och g"
        - "”Håll handen framför munnen. Apa: det blåser. Aba: det blåser inte.”"
      - - "”/s/ /o/ /l/” och två markörer, eller en i varje ruta"
        - "Eleven tappar ljuden, eller fyller rutorna i stället för att räkna ljuden"
        - "Ett ljud i taget: säg ljudet och flytta markören samtidigt."
  - rubrik: "Varianter"
    plats: "efter-urval"
    text: "Byt till en variant när gruppen behöver något nytt, i samma steg."
    kolumner:
      - "Variant"
      - "Så gör ni"
      - "När den passar"
    rader:
      - - "Ljudkedjan"
        - "Eleverna säger ett ljud var, i tur och ordning. Sedan säger alla ordet."
        - "Steg 2, när ni är högst sex"
      - - "Ljudstegen"
        - "Tejpa fyra papper på golvet. En elev tar ett steg för varje ljud, och de andra går på stället."
        - "Steg 2, när gruppen behöver röra sig"
      - - "Sätt ihop ordet"
        - "Den ena håller kortet dolt och säger ljuden. Den andra sätter ihop dem och säger ordet."
        - "Steg 3, när paren är säkra"
  - rubrik: "Ordbanken"
    plats: "efter-urval"
    text: "Här är orden till ljudstarten, i sex ordgrupper från lätt till svårt. Alla ord är ljudenliga, med ett ljud för varje bokstav."
    kolumner:
      - "Ordgrupp"
      - "Orden"
    rader:
      - - "Två ljud att dra ut"
        - "is, ål, se, le, ro, sy, nu, ny, så"
      - - "Tre ljud att dra ut"
        - "sol, lus, mus, mos, vas, mål, nål, mås, sås, räv, säl, hår"
      - - "Med klusil"
        - "mat, lök, nöt, pil, gås, kål, gul, bad, båt, tåg, duk, tak"
      - - "Två stavelser"
        - "sola, mosa, lera, rasa, mera, läsa, måla, leta, vila, bada, baka, kaka"
      - - "Konsonantmöte först"
        - "snö, blå, sko, bro, tre, grå, klo, stå, sten, stol, glas, svan, stor, smör"
      - - "Konsonantmöte sist"
        - "fisk, mask, hand, sand, hund, vind, land, hals, rund, tält"
    not: "Orden står i ordning, lättast först. Hur du säger orden och vilka ord som väntar står under Ordbanken i Ljudlek i grupp."
principer:
  rubrik: "Tre saker att hålla fast vid"
  text: "Flytta en markör för varje ljud medan ni säger det, och dra sedan fingret under rutorna och säg ordet. Arbeta från vänster till höger sett från eleverna, också när du står vid tavlan eller sitter mitt emot dem. Varje ark har ord med två, tre och fyra ljud, så att eleverna räknar ljuden i stället för att gissa samma antal."
passrutin:
  text: "Lektionen går i fyra steg, från att du visar till att var och en gör själv."
  steg:
    - text: "Du visar tre ord, med två, tre och fyra ljud, och flyttar en magnet för varje ljud."
      fas: "Ordet på tavlan"
    - text: "Gruppen säger ljuden efter dig och sedan själv, med ett finger för varje."
      fas: "Fingrarna"
    - text: "Den ena i paret säger ordet till bilden, och den andra säger ljuden och lägger markörerna."
      fas: "Säg och lägg"
    - text: "Var och en räknar ljuden i sina ord, och du lyssnar på dagens elever."
      fas: "Mina ord"
  efterPasset: "Du noterar i snabbmallen vilka av dagens elever som lade rätt antal markörer och sa ljuden själva, vad som fastnade, och om gruppen tar samma rad, nästa rad eller nästa lektion."
tidsschema:
  rubrik: "Ett pass på 30 minuter"
  text: "Är passet bara 20 minuter blir ljudstarten tre minuter, lektionen 15 och avslutet två. Stegen får då två, fyra, fem och fyra minuter."
  rader:
    - tid: "Före passet"
      fas: "Förberedelse"
      vad: "Ta fram arken för gruppens rad, bokstavskorten, ljudrutorna, markörerna, pennorna och speglarna. Rita fem rutor på tavlan, som ljudrutorna: en bildruta och fyra rutor för ljuden. Välj orden till ljudstarten ur Ordbanken, och skriv dem, paren och dagens elever i snabbmallen."
    - tid: "0–5 min"
      fas: "Ljudstart"
      vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra, som i Ljudstarten. Alla svarar samtidigt."
    - tid: "5–9 min"
      fas: "Ordet på tavlan"
      vad: "Ta tre av arkets sex första kort, ett med två ljud, ett med tre och ett med fyra. Stå bredvid tavlan, vänd mot eleverna."
    - tid: "9–15 min"
      fas: "Fingrarna"
      vad: "Ta de tre andra av arkets sex första kort. En elev i taget flyttar magneterna."
    - tid: "15–20 min"
      fas: "Säg och lägg"
      vad: "Paret tar arkets sex första kort och turas om. Du går mellan paren."
    - tid: "20–25 min"
      fas: "Mina ord"
      vad: "Paret delar arkets sex sista kort, tre var. I en trio får var och en två. Du lyssnar på dagens elever."
    - tid: "25–30 min"
      fas: "Avslut"
      vad: "Var och en säger ett ord från dagens lek och vad hen gjorde med det. Du säger kort vad du hörde."
  efter: "Den som är klar före de andra byter kort med sin kamrat."
steg:
  rubrik: "Vad du gör och säger i varje steg"
  text: "Här är lärarens ord, så att du kan säga dem som de står."
  fraserRubrik: "Exempelfraser"
  rader:
    - namn: "Ordet på tavlan"
      fraga: "Hur många ljud hör jag?"
      gor: "Första passet med ett nytt ark säger ni bildernas namn i kör, och du säger vad nya ord betyder. Sätt kortet i bildrutan och säg ordet. Flytta en magnet in i en ruta för varje ljud medan du säger det. Räkna magneterna och vänd kortet. Kan gruppen bokstäverna, sätter du bokstavskorten i rutorna, under magneterna, och läser ordet."
      fraser:
        - "Båt. Säg efter mig: båt."
        - "Jag flyttar en magnet för varje ljud: /b/, ååå, /t/."
        - "Tre magneter. Jag vänder kortet: tre prickar."
    - namn: "Fingrarna"
      fraga: "Hur många ljud hör vi?"
      gor: "Säg ljuden, ett i taget, och låt gruppen säga efter. Sedan säger gruppen ljuden själv, med ett finger för varje, och en elev flyttar magneterna. Sist säger alla ljuden i passets ord en gång till."
      fraser:
        - "Säg ljuden efter mig: /t/, ååå, /g/."
        - "Nu själva. Myra. Ett finger för varje ljud."
        - "Fyra fingrar, fyra ljud. Myra."
    - namn: "Säg och lägg"
      fraga: "Hur många ljud hör du?"
      gor: "Den ena lägger kortet i den andras bildruta och säger ordet långsamt tills paret är säkert. Den andra säger ljuden, flyttar en markör för varje och säger ordet. Sedan vänder de kortet och räknar prickarna. Stämmer det inte, säger de ordet långsamt igen eller lägger undan kortet åt dig. De byter efter varje ord."
      fraser:
        - "Säg ljudet och flytta markören samtidigt."
        - "Dra fingret under rutorna och säg ordet."
        - "Vänd kortet. Lika många prickar som markörer?"
    - namn: "Mina ord"
      fraga: "Kan du göra det själv?"
      gor: "Var och en räknar ljuden i sina ord och vänder kortet för att räkna prickarna. Lyssna på dagens elever: säger eleven ljuden, och flyttar hen en markör medan hen säger varje ljud? Den som kan bokstäverna i ordet skriver dem i rutorna, läser tillbaka ordet och jämför med baksidan. Bokstavskartan i Ljudlek i grupp kan ligga framme."
      fraser:
        - "Du drog ut ordet och hörde ljudet i mitten."
        - "Vilken bokstav står för det ljudet?"
        - "Läs det du skrev: sssooolll. Sol."
arbetsform:
  rubrik: "Arbetsform: alla i kör, växlande, gemensamt"
  text: "I ljudstarten svarar alla samtidigt, och i lektionen går ni från att du visar till att var och en gör själv. Paren och trion sätter du ihop som i Ljudlek i grupp. Den som ännu bara hör första ljudet får kort med två och tre ljud och blir dagens elev oftare."
  delar:
    - rubrik: "1. Alla i kör"
      text: "alla svarar"
      faser:
        - "Ljudstart"
    - rubrik: "2. Växlande"
      text: "du visar, tillsammans, i par, själv"
      faser:
        - "Ordet på tavlan"
        - "Fingrarna"
        - "Säg och lägg"
        - "Mina ord"
    - rubrik: "3. Gemensamt"
      text: "ett ord var"
      faser:
        - "Avslut"
exempel:
  valt:
    rubrik: "Gruppen"
    text: "sex elever i förskoleklass och åk 1, vecka 3, tre pass i veckan. Gruppen gör Räkna ljud för tredje passet i följd, det första i raden Med klusil. Dagens ljud är /m/, och dagens elever är Mira och Omar."
  text:
    - "Ljudstarten. När gruppen delar upp mat säger Mira ”m-⁠t”. Läraren drar ut a:et, ”maaat”, och Mira hör /a/ i mitten."
    - "Ordet på tavlan. Gruppen säger bildernas namn i kör. Läraren sätter kon i bildrutan och flyttar en magnet för varje ljud: ”/k/, ooo. Två ljud. Ko.” Sedan kommer lök och kaka, med tre och fyra ljud."
    - "Fingrarna. Gruppen säger ljuden i tåg efter läraren, och sedan i öga och stol själv, med ett finger för varje. Noah flyttar magneterna."
    - "Säg och lägg. Paren är Alva och Elin, Omar och Noah, Leo och Mira. Elin lägger stolen i Alvas bildruta och säger ”stol”. Alva säger sss-⁠t-⁠ooo-⁠lll och flyttar en markör för varje ljud."
    - "Mina ord. Paren delar arkets sex sista kort. Omar säger ”aba” om apan och känner med handen framför munnen att det blåser vid /p/. Mira säger ”bö-⁠å-⁠tö” om båten, och läraren säger b:et kort: ”b-⁠ååå-⁠t.”"
    - "Avslutet. Omar säger: ”Apa. Tre ljud.” Läraren säger: ”Ni drog ut orden och hörde ljudet i mitten.”"
    - "Efteråt noterar läraren: Mira och Omar lade rätt antal markörer och sa ljuden i två av tre ord. Mira lägger ett ö efter b, och Omar blandar ihop p och b. Passet räknas som det första av två i följd, och nästa pass blir Leo och Noah dagens elever."
fastnar:
  rubrik: "När eleven fastnar"
  text: "Vänta tre sekunder och ge minsta möjliga stöd först. Blir det många fel i gruppen, säg det i kör, låt sedan några elever säga det ensamma och ta samma ord minst tre gånger."
  fragaForst:
    - "Vad hör du?"
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg det igen, långsamt, och dra ut ljuden: sssooolll."
    - "Visa hur munnen gör. Eleven tittar i spegeln och känner efter, till exempel luften mot handen vid /p/."
    - "Gör uppgiften mindre: täck de rutor som ordet inte behöver, eller ta bara första ljudet medan ni säger resten tillsammans."
    - "Visa med handen eller med något att flytta, en för varje ljud: du säger ljudet, och eleven flyttar markören."
    - "Säg det tillsammans, och låt eleven säga det själv efteråt med markörerna."
  motto: "Till sist lägger eleven markörerna själv."
urval:
  rubrik: "Var hittar du orden och materialet?"
  text:
    - "Bildkorten står under Materialet, ett ark för varje rad i Så blir lektionen svårare, och ljudrutorna i planeringsmallarna. Orden till ljudstarten står i Ordbanken."
    - "Egna ord går också bra, utom orden i ljudkollen och i screeningens version B."
  kravText: "Tre krav gäller egna ord:"
  krav:
    - rubrik: "Kända ord"
      text: "Eleven vet vad ordet betyder"
    - rubrik: "Ljudenliga"
      text: "En bokstav för varje ljud, som låter som den brukar"
    - rubrik: "Olika långa"
      text: "Två, tre och fyra ljud på varje ark"
uppfoljning:
  text: "Du ser i steg 4 vad eleverna klarar, och ljudkollen var tredje vecka visar samma sak för varje elev. Berätta konkret för eleven vad hen har lärt sig."
  rader:
    - nar: "Under passet"
      vad: "I steg 4 lyssnar du på dagens elever: säger eleven ljuden i ordning, och flyttar hen en markör medan hen säger varje ljud?"
    - nar: "Efter varje pass"
      vad: "I snabbmallen noterar du dagens elever och det som fastnade."
    - nar: "Var tredje vecka"
      vad: "Du gör ljudkollens uppgift 6 om att dela upp, uppgift 7 om att skriva ord och uppgift 4 om bokstävernas ljud."
mal:
  rubrik: "Mål: vad eleven ska kunna efter lektionen"
  text: "Efter lektionen ska eleven kunna:"
  punkter:
