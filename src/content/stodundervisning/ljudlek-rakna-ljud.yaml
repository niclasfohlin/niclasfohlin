grund:
  text: "Att dela upp ord i ljud och sätta ihop ljud till ord är kärnan i fonemmedvetenheten, och undervisningen ger mest i små grupper och med bokstäver (Ehri m.fl., 2001; National Reading Panel, 2000). Barn som flyttade en markör för varje ljud medan de sa det, och samtidigt lärde sig bokstävernas ljud, läste och stavade bättre (Ball och Blachman, 1991). Barn hör stavelser långt före ljuden (Liberman m.fl., 1974), och med bokstäver i rutorna kopplar eleven ljuden till bokstäverna (Foorman m.fl., 2016)."
  kallor: "Bygger på Ball och Blachman (1991), Ehri m.fl. (2001), Foorman m.fl. (2016), Liberman m.fl. (1974) och National Reading Panel (2000)."
ramar:
  rubrik: "Materialet"
  text:
    - "Här finns bildkorten, ett ark för varje rad i Så blir lektionen svårare, och bokstavskorten. Ljudrutorna står i planeringsmallarna. Allt går att kopiera. Laminera ljudrutorna, som eleverna skriver på, och bokstavskorten. Bildkorten laminerar du när de är vikta och limmade."
  ramar:
    - rubrik: "Bildkorten"
      text:
        - "Varje ark har ord med två, tre och fyra ljud, så att eleverna räknar i stället för att gissa. Arket står två gånger på sidan, så en sida räcker till två par. Skriv ut sidan för gruppens rad och gärna ditt ark förstorat till A3."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Klipp längs strecken och vik varje kort längs den blå prickade linjen, så att bilden blir framsidan och ordet baksidan. Limma ihop halvorna och laminera sist. Vänd kortet som en sida i en bok, så står ordet rätt. Orden är ljudenliga, så prickarna under ordet är lika många som ljuden. Håll ihop arkets sex första kort för sig och de sex sista för sig, med ett gem. Ni tar de sex första i steg 1–⁠3 och de sex sista i steg 4, och nästa pass byter ni. Första passet med ett nytt ark säger ni vad bilderna heter, i kör, och du säger vad nya ord betyder: ”Det här är en nål. Med en nål syr man.” Barn kallar ofta ko och bi för kossa och humla, som har fler ljud än prickarna på kortet. Ko och bi säger ni i kör varje pass, och när någon i gruppen är nybörjare i svenska säger ni alla namnen varje pass. Säger eleven ett annat namn, som kossa, svarar du: ”Kossa har fler ljud. Kortet heter ko. Säg ko och räkna igen.”"
