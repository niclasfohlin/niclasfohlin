# Texttyp: Argumenterande text. Piloten i serien Texttyper i grupp, på Niclas uppdrag 2026-10-06
# (intake/texttyp-argumenterande-text.md och intake/texttyper-i-grupp.md). Underlaget är seriens intag med registret
# (intake/texttyper-i-grupp/REGISTER.md) och sökningarna (methods/texttyper-i-grupp/sokning.md), och valen står i
# analys.md här och i seriens analys. Det som gäller alla kurser i serien står i methods/texttyper-i-grupp/metod.yaml.
# Efter rundorna 2026-10-06: kursen har passet i en enda tabell, veckorna och allt som skrivs ut. Veckans texter har
# veckan i namnet ("Två texter, vecka 1: Skolgården") och står direkt efter veckans sida (sajtens K-236). Stödtrappan,
# lärarens roll och hur stödet tas bort står i den generella metoden.
titel: "Texttyp: Argumenterande text"
undertitel: "Sex veckors kurs i liten grupp för åk 4–7, där eleverna övertygar en läsare som svarar"
ingress: "En kurs i sex veckor för två till tio elever i åk 4–7 som skriver korta texter utan plan. Eleverna lär sig övertyga en läsare: de väljer skäl som läsaren bryr sig om, förklarar dem och säger vad läsaren ska göra. Texterna går till en vuxen på skolan, som svarar. Kursen hör till Texttyper i grupp."
omrade: Skrivning
arskurs:
  - 4-6
  - 7-9
arskursText: åk 4–7
taggar:
  - skrivstrategier
  - textstruktur
  - formativ-bedomning
  - intensivtraning
format:
  - liten grupp
  - par
tid: 60 minuter per pass, två pass i veckan
period: Sex veckor
grupp: Två till tio elever
material:
  - lappar
  - bladet Planen
  - kortet Läsarens frågor
  - mentortexterna
  - diagrammet Mina texter
  - en mapp per elev

uppdaterad: 2026-10-10
publicerad: 2026-10-09
relaterade: []
utkast: false
serie: texttyper-i-grupp
formaga: 1
tranar: "övertyga en läsare, genom att välja skäl som läsaren bryr sig om, förklara dem och säga vad läsaren ska göra"

inledning:
  - "Texttyp: Argumenterande text är en kurs för elever i åk 4–7 som behöver stöd i att skriva. De har ofta en åsikt och ett par skäl, men de förklarar inte skälen och skriver inget slut, och texten blir kort. I kursen lär de sig övertyga en läsare. En argumenterande text vill få någon att hålla med eller göra något, och den lyckas när läsaren får veta vad skribenten vill, varför och vad läsaren själv ska göra."
  - "På tavlan står tre rader: Vem läser? Vad vill vi? När får vi svar? Vid den tredje står när svaret kommer. På bordet ligger lappar, bladet Planen och kortet Läsarens frågor. Lapparna är remsor av papper, som du skriver ut på arket Lapparna, bland mallarna, och klipper isär. På den första lappen skriver eleverna vad de vill, och på var och en av de andra ett skäl, alltså ett argument, med några ord: ”Fler hinner låna.” Sedan lägger de lapparna på bladet Planen. Vid varje lapp frågar de sig om läsaren bryr sig om det skälet. De lägger minst en lapp åt sidan, och den som gör det säger varför. De lappar som ligger kvar lägger de i ordning, och det är planen för texten."
  - "Eleven lär sig genom att höra dig tänka högt och sedan göra likadant. Du frågar som läsaren, säger dina val högt och lämnar över. Det eleven ska ta över är att välja för läsarens skull och säga valet högt: ”Jag lägger det här skälet åt sidan, för det gäller bara mig.” Eleven gör varje text med samma fyra steg, Tänk, Planera, Säg och Skriv. De står på bladet Planen, och efter vecka 3 kan eleven säga dem. I steget Säg berättar eleven sin text för en läsare, som har kortet och frågar det hen inte fick veta. Det eleven svarar då är oftast förklaringen som saknades, och den skriver eleven sedan in i texten. Mitt i skrivandet möter eleven andras texter och läsarens frågor, och väljer vad hen använder i sin egen text. När texten är klar skriver hen vad hen tar med sig till nästa text."
  - "Kursens läsare är en vuxen på skolan som har en fråga att avgöra, till exempel bibliotekarien som undrar om biblioteket ska ha öppet på lunchrasten. Du ber hen ställa upp under vecka 1. I vecka 2 kommer hen till gruppen i tio minuter och ställer sin fråga, och eleverna frågar vad hen behöver veta för att kunna bestämma. I vecka 3 skriver gruppen en gemensam text till hen, och läsaren svarar med sitt beslut. Blir det ja, sätter gruppen upp beslutet där det gäller, till exempel på bibliotekets dörr. I vecka 5 väljer varje elev en egen sak och skriver om den till samma läsare. Det sista passet är ett möte: eleven säger vad hen vill, och läsaren svarar."
  - "De sex veckorna går från att du visar till att eleven skriver själv. I vecka 1 skriver eleven ett brev utan stöd, som ni lägger bredvid ett nytt i vecka 6, och gruppen läser en text som läsaren. I vecka 2 visar du hur du planerar och skriver en text, i vecka 3 skriver gruppen, i vecka 4 paren och i vecka 5 var och en. I vecka 6 kommer svaren, och gruppen läser en uppgift som liknar provens, så att eleven känner igen när en uppgift ber om en argumenterande text. Det som gäller alla kurser i serien står i Texttyper i grupp: vilka eleverna är, hur du tänker högt, vad du gör när en elev fastnar och vad kurserna bygger på."

upplagg:
  rubrik: Så fungerar insatsen
  text: "Två till tio elever har två pass om 60 minuter i veckan under sex veckor. Eleven gör varje text med fyra steg, Tänk, Planera, Säg och Skriv: hen säger vem som läser, väljer skäl som läsaren bryr sig om, berättar texten för en läsare och skriver den. Du tar bort stödet vecka för vecka: du visar, gruppen skriver tillsammans, paren planerar ihop och till sist planerar var och en sin egen text. Gruppens och elevens egna texter går till kursens läsare, en vuxen på skolan som svarar. Breven i pass 1 och 11, elevens diagram och det du hör eleverna säga visar om kursen hjälper."

gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Kursen är för elever i åk 4–7 som skriver korta texter utan plan: en åsikt, ett par skäl utan förklaring och inget slut. Eleven behöver kunna få ned läsbara meningar för hand, på dator eller genom att diktera. Den som redan planerar och skriver sammanhängande får inte ut mycket av kursen, och den vars största hinder är stavningen behöver stöd i stavning vid sidan av kursen. Gruppen har två till tio elever. Du sätter ihop paren efter vem som stöttar vem. Med udda antal blir ett av paren tre, och med två elever är du läsare åt dem."

principer:
  rubrik: Tre saker att hålla fast vid
  text: "Nämn läsaren före första ordet, i varje text. Läsaren avgör vilka skäl som ska med. Lägg något åt sidan eller lägg till något för läsarens skull, och säg varför, så att valet hörs och syns på pappret. Kör fast högt, och säg vad du gör då. Eleven behöver höra att också du fastnar och hur du tar dig vidare. De tre sakerna ska först höras från dig och sedan från eleven, och det är dem du lyssnar efter."

passrutin:
  text: "Fem av passen, pass 4 och pass 6 till 9, har samma sex delar. I delarna Tänk och planera, Säg och Skriv gör eleverna de fyra stegen. En text tar oftast två pass. Tabellens minuter gäller pass 7, där eleverna planerar, berättar texten och börjar skriva. De andra fyra passen har samma delar med andra minuter, och alla passens minuter står på veckans sida."
  steg:
    - text: "En elev läser dagens mening som läsaren. Alla skriver en ny mening som svar, och ni lägger dem bredvid varandra. Var och en gör sin mening bättre."
      fas: Läs som läsaren
    - text: "Du visar det som står på veckans sida. Gruppen säger vad de hörde och prövar samma sak en gång tillsammans."
      fas: Visa och pröva
    - text: "Eleven läser bladet Mitt mål. Paret säger vem som läser. På lappar skriver de vad de vill och sina skäl, och lägger minst en åt sidan och resten i ordning."
      fas: Tänk och planera
    - text: "Skribenten berättar för en läsare ur ett annat par. Läsaren har kortet och frågar det hen inte fick veta. Svaret blir en ny lapp. Sist säger läsaren sin första mening."
      fas: Säg
    - text: "Var och en skriver efter planen, på varannan rad. Den som är klar läser texten som läsaren, med kortet, och skriver in det läsaren saknar."
      fas: Skriv
    - text: "Två elever läser en mening ur sin text och berättar om ett val."
      fas: Läs upp
  kallas: delar
  efterPasset: "Fäst lapparna på bladet Planen. Fyll i fältet Till nästa pass på bladet Det jag hör. Efter pass 4 och pass 8 skriver du tre svarsrader under texterna, och efter pass 4 ”Hur menar du?” vid ett skäl utan förklaring."

tidsschema:
  rubrik: "Ett pass i sex delar"
  text: "Förbered dig genom att läsa veckans sida under Till läraren: veckorna. Där står dagens mening, vad du visar och vad du ska lägga märke till, och passets minuter när de skiljer sig från tabellens. Minuterna är hållpunkter: det tar tid att komma i gång, och Skriv är lång för att passet ska ha luft."
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: "Skriv tavlans tre rader och dagens mening. Lägg fram lappar, pennor, bladet Planen, kortet och mapparna. Välj två eller tre elever som du lyssnar särskilt på."
    - tid: 0–5 min
      fas: Läs som läsaren
      vad: "Fråga ”Vad vet du nu? Vad undrar du?” Den som inte hinner skriva säger sin mening. Fråga sedan ”Vilken mening ger läsaren mest? Varför?”"
    - tid: 5–15 min
      fas: Visa och pröva
      vad: "Skriv på tavlan vad ni övar på, och visa bara det. Fråga ”Vad hörde ni mig säga?” Lägg undan veckans texter före Skriv."
    - tid: 15–27 min
      fas: Tänk och planera
      vad: "Fråga efter läsaren före skälen. Vid varje lapp: ”Bryr sig läsaren om det skälet?” Sedan: ”Vilken lapp lägger ni åt sidan? Varför?”"
    - tid: 27–33 min
      fas: Säg
      vad: "Lyssna på en skribent i taget, och säg ”Det du svarade nu ska med i texten.” Kan hen inte svara, tar paret reda på det."
    - tid: 33–57 min
      fas: Skriv
      vad: "Säg ”Skriv det du sa.” Läs en mening över axeln och ställ en enda fråga ur kortet, som ”Hur menar du?” Rätta inte nu. Den som inte kommer i gång får hjälp med första meningen."
    - tid: 57–60 min
      fas: Läs upp
      vad: "Fråga efter ett val: ”Vilket skäl lade du åt sidan? Varför?” När en text är klar skriver eleven vad hen tar med sig."
  efter: "Tavlans tre rader är frågorna om läsaren: Vem läser? Vad vill vi? När får vi svar? Vid den första skriver du vem eleverna skriver till, och vid den tredje när svaret kommer: i dag, i nästa pass eller den dag som kursens läsare har lovat. Har det du visar en annan läsare, skriver du den vid ditt exempel. Dagens mening tar du aldrig ur en enskild elevs text. De tre svarsraderna är läsarens svar, och de står på kortets andra sida: Nu vet jag, Det här övertygade mig och Nu undrar jag."

arbetsform:
  rubrik: "Arbetsform: gemensamt, läraren visar, i par, gemensamt igen"
  text: "I delen Säg sätter sig två par ihop, och läsaren kommer ur det andra paret. De två som berättar gör det samtidigt, var och en för sin läsare. Blir ett par över, är du läsare åt det paret, och åt ett annat par nästa gång. Så blir det i varje pass när gruppen har två, tre, sex, sju eller tio elever. Då skriver du på bladet Det jag hör vad det paret säger, och den andra i paret säger sist sin första mening till dig. Är en i paret borta, blir kamraten den tredje i ett annat par. I pass 9 har var och en sin egen plan, och då är kamraten läsaren. Paren är desamma hela kursen, och paret får planera på sitt starkaste språk."
  delar:
    - rubrik: 1. Gemensamt
      text: Hela gruppen, med dig vid tavlan
      faser:
        - Läs som läsaren
    - rubrik: 2. Läraren visar
      text: Du tänker högt, och gruppen gör likadant
      faser:
        - Visa och pröva
    - rubrik: 3. I par
      text: "Två och två, med var sin text"
      faser:
        - Tänk och planera
        - Säg
        - Skriv
    - rubrik: 4. Gemensamt igen
      text: Två elever berättar om ett val
      faser:
        - Läs upp

