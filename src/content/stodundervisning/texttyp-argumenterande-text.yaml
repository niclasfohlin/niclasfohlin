film:
  sekunder: 28.52
  beskrivning: "Tänk: vem läser, och vad vill ni? Eleven säger: ”Maria läser. Vi vill ha öppet.” Maria tänker: ”Vem hinner låna?” Planera: det ni vill, och ett skäl på varje lapp. Läraren frågar: ”Bryr sig Maria om det skälet?” Eleven säger: ”Åt sidan. Det gäller bara oss.” Säg: berätta för en läsare ur ett annat par. Läsaren frågar: ”Vad ska jag göra?” Läraren säger att svaret ska med i texten. Eleven frågar: ”Kan du ha öppet från nästa vecka?” Skriv: skriv det du sa."
  rubrik: "Så gör eleven: Tänk, Planera, Säg, Skriv"
  ingress: "Fyra bilder ur filmen om de fyra stegen, med ett par i vecka 2. Maria, kursens läsare, är inte i rummet: hon syns i bilden eftersom paret tänker på henne. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Tänk: vem läser? Maria undrar vem som hinner låna."
    - text: "Planera: bryr sig läsaren om skälet? En lapp åt sidan."
    - text: "Säg: en läsare ur ett annat par frågar. Ny lapp."
    - text: "Skriv: eleven skriver det hen sa till läsaren."
