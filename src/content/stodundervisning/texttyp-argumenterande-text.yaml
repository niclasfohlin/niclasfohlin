      - - Eleven är klar före de andra
        - "Hen läser texten som läsaren, med kortet, och skriver in det läsaren saknar. Från pass 6 ger hen varje skäl en förklaring. Sedan läser hen för en kamrat som också är klar."
      - - Paret har bara ett skäl
