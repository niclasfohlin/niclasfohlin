      - - De två i paret tycker olika om kursens fråga
        - "Låt dem som tycker lika planera ihop i pass 3. Gruppens text i pass 5 säger det som flest vill, och att några tycker tvärtom."
      - - Eleven vill inte skicka sin text
        - "Hen skriver under med en signatur, eller så lämnar du över texten. Den som ändå inte vill får en läsare i gruppen."
      - - "Kursens läsare kan inte komma i pass 3"
        - "Gå till hen med två elever före passet och hämta frågan och det hen behöver veta. Går inte det, svarar paren på en fråga som du ska avgöra. Kursens fråga tar ni i pass 5, där paren först skriver lappar."
