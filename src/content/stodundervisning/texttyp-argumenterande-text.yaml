mallar:
  - rubrik: Lapparna
    typ: rutnat
    text: "Arket är till lapparna som eleverna planerar med. Skriv ut ett ark till varje par, och klipp längs linjerna, så blir det arton lappar. Hur länge ett ark räcker står under Till läraren: lapparna. Eleverna skriver en sak på varje lapp: det de vill på den första, ett skäl på var och en av de andra, och senare det de svarade läsaren och det de har tagit reda på. Den som skriver på dator fyller i arket i Word innan det skrivs ut. Dina lappar från visningen står i manuset under Visningen, vecka 2."
    kolumner: ["", "", ""]
    rader: 6
    underrad: "Klipp längs linjerna, så blir det arton lappar. Skriv en sak på varje lapp."
    fot: "Den första lappen: det vi vill. De andra lapparna: ett skäl på varje, med några ord. En ny lapp: det jag svarade läsaren."
  - rubrik: Planen
    typ: matta
    text: "Bladet ligger framför paret i delen Tänk och planera, och framför var och en i vecka 5. Skriv ut det på liggande A4. Lapparna klipper du ur arket Lapparna. Den första lappen säger vad paret vill. Paret lägger den lappen och de skäl de väljer i den vänstra rutan, i ordning uppifrån och lite omlott, och lappen som läggs åt sidan ligger kvar i den högra."
    kolumner:
      - Det vi vill, och skälen vi tar
      - "Åt sidan: det här bryr sig läsaren inte om"
    fot: "Tänk: vem läser, och vad vill vi? Planera: det vi vill först, och ett skäl på varje lapp. Säg: berätta texten för en läsare. Skriv: skriv det du sa, och det du svarade."
  - rubrik: Mina texter
    typ: rutnat
    text: "Diagrammet ligger i elevens mapp. Eleven fyller i en ruta nedifrån för det hen vill, en ruta för varje skäl som har en förklaring och en ruta för det läsaren ska göra. Ett skäl utan förklaring ger ingen ruta. Stapeln har plats för sex rutor, och ingen behöver fylla den: tre eller fyra rutor är en hel text. Den sista stapeln fyller eleven i när gruppen samlas igen efter kursen."
    kolumner:
      - Pass 6
      - Pass 8
      - Pass 10
      - Första brevet
      - Sista brevet
      - Efter kursen
    rader: 6
    underrad: "Namn: ____________________   En stapel för varje text som jag har skrivit. Fyll i nedifrån."
    fot: "En ruta för det jag vill. En ruta för varje skäl som jag förklarar. En ruta för det läsaren ska göra. Tre eller fyra rutor är en hel text."

