lathund:
  innehall: En läsare som svarar
  metoden:
    text:
      - "Kursen är för elever i åk 4–7 som skriver korta texter utan plan. Eleven lär sig övertyga en läsare, med fyra steg: Tänk, Planera, Säg och Skriv. Passet följer stegen, och tabellen visar passets delar."
      - "Kursens läsare är en vuxen på skolan, som kommer med sin fråga i pass 3, svarar före pass 7 och kommer igen i pass 12. Passen med egna minuter står på sidan Mallen. Stödtrappan står i lathunden för Texttyper i grupp."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Nämn läsaren före första ordet.
          text: Läsaren avgör vilka skäl som ska med.
        - fet: Lägg åt sidan eller lägg till, för läsarens skull.
          text: Säg varför, så att valet hörs och syns.
        - fet: Kör fast högt.
          text: Säg vad du gör då.
      efter: Först från dig, sedan från eleven. Det är dem du lyssnar efter.
    tabell:
      rubrik: Passets delar · vad du säger
      kolumner:
        - Del
        - Du säger
      rader:
        - - "1 · Läs som läsaren\nAlla svar på bordet"
          - "”Vad vet du nu? Vad undrar du?”\n”Vilken mening ger läsaren mest?”"
        - - "2 · Visa och pröva\nDu tänker högt"
          - "”Vad hörde ni mig säga?”\n”Nu prövar vi samma sak tillsammans.”"
        - - "3 · Tänk och planera"
          - "”Bryr sig läsaren om det skälet?”\n”Vilken lapp lägger ni åt sidan? Varför?”"
        - - "4 · Säg\nEn läsare ur ett annat par"
          - "”Fråga bara det du inte fick veta.”\n”Det du svarade nu ska med i texten.”"
        - - "5 · Skriv\nEn enda fråga"
          - "”Skriv det du sa.”\n”Hur menar du? Skriv det.”"
        - - "6 · Läs upp\nEtt val"
          - "”Vilket skäl lade du åt sidan? Varför?”\n”Vad tar du med dig?”"
    not: "Tavlans tre rader: Vem läser? Vad vill vi? När får vi svar? De tre svarsraderna: Nu vet jag, Det här övertygade mig, Nu undrar jag. När eleven fastnar frågar du först ”Vem ska läsa det här?”"
  pass:
    rubrik: "Vi kör ett pass: pass 7 i vecka 4"
    textRubrik: "Gruppen · fyra elever i åk 5, och Maria i skolbiblioteket är kursens läsare"
    text:
      - "Hamza läser meningen på tavlan som Maria: ”Nu undrar jag varför de inte hinner låna i dag.” Alla skriver en ny mening och lägger dem bredvid varandra. Nadia pekar på Elsas: ”Den förklarade.”"
      - "Läraren läser Marias svar: biblioteket har öppet två dagar, och hon bestämmer över böckerna och vad man får göra där. Vilgot säger: ”Jag vill att man får spela schack där.”"
      - "Elsa och Vilgot skriver lappar, och var och en pekar på en att lägga åt sidan. Vilgot pekar på lappen ”Det är kul”: ”Bryr sig Maria om det? Kanske inte.” Hamza ur det andra paret är läsare och frågar: ”Hur menar du med att det blir tyst?” Vilgot svarar: ”Man tänker när man spelar schack”, och skriver det på en ny lapp."
      - "Läraren frågar Vilgot över axeln: ”Varför där?” Elsa kör fast och säger: ”Jag tittar på tavlan. Maria läser.” Sedan skriver hon."
    forberett:
      rubrik: Det jag förberedde
      text:
        - "Jag skrev tavlans tre rader och en mening ur gruppens text, och jag hade Marias svar och listan från pass 1 med mig. På bordet låg lappar, bladet Planen och kortet till varje par, och mapparna. Jag lyssnade särskilt på Vilgot och Nadia."
    klarTidigt: "Eleven läser sin början som läsaren, med kortet, och skriver in det läsaren saknar."
    schema:
      rubrik: 60 minuter, minut för minut
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Skriv tavlans tre rader och dagens mening. Lägg fram lappar, bladet Planen, kortet och mapparna.
        - tid: 0–5
          fas: 1 · Läs som läsaren
          vad: En elev läser meningen som läsaren. Alla skriver en ny mening, och ni lägger dem bredvid varandra.
        - tid: 5–15
          fas: 2 · Visa och pröva
          vad: Läs läsarens svar. Visa hur du tänker ut en sak som läsaren kan säga ja eller nej till.
        - tid: 15–27
          fas: 3 · Tänk och planera
          vad: Paren enas om en sak och skriver lappar. Var och en pekar på en lapp att lägga åt sidan.
        - tid: 27–33
          fas: 4 · Säg
          vad: "Två par sätter sig ihop. Skribenten berättar för en läsare ur det andra paret, och svaret blir en ny lapp. Läsaren säger sin egen första mening. Blir ett par över, är du läsaren."
        - tid: 33–57
          fas: 5 · Skriv
          vad: "Var och en skriver början. Du läser över axeln och ställer en enda fråga. Rätta inte nu."
        - tid: 57–60
          fas: 6 · Läs upp
          vad: Varje par säger vad de tar reda på till nästa pass.
