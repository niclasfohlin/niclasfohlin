# Mall för en metod i stödundervisning. Filer som börjar med _ läses inte in.
# Filnamn: kort slug som beskriver metoden, t.ex. problemlosning-i-grupp.yaml
# Modellen står i src/content.config.ts. Sidan, utskriften och docx-filerna byggs ur samma data,
# så det som skrivs här hamnar i alla tre. Delarna under "Modellen" är valfria: skriv bara det som finns.
# En text med flera stycken skrivs som en lista med ett stycke per rad.
# Ett värde som innehåller kolon följt av mellanrum skrivs inom citattecken.
# Repliker och citat står inom ” och ”, och citatet stängs i samma stycke: bygget stannar när citattecknen inte går
# jämnt ut i ett stycke (en radbrytning \n börjar ett nytt).
# "åk" och siffran efter skrivs med hårt mellanslag (U+00A0), som i undertiteln nedan, så att raden inte kan brytas
# mellan dem: bygget stannar på "åk" med vanligt mellanslag före en siffra.

titel: Metodens namn
# Raden under rubriken: vad metoden är och för vem.
undertitel: Lärarledd insats i liten grupp för åk 4–9
ingress: Två till fyra meningar om vad metoden tränar och hur den används. Egen text som fungerar ensam i ett kort och i ett nyhetsbrev.
# Exakt ett av: Matematik, Läsning, Skrivning
omrade: Läsning
# Minst ett av: F-3, 4-6, 7-9. Filtret i metodbanken använder nivåerna.
arskurs: ["4-6", "7-9"]
# Valfritt: årskursen som läsaren ser när nivåerna inte säger det exakt, t.ex. åk 3–6.
# arskursText: åk 3–6
# id från src/data/taggar.json. Återanvänd före att lägga till.
taggar: ["lasforstaelse"]
# Valfritt antal av: enskilt, par, liten grupp, helklass
format: ["liten grupp", "par"]
# Faktarutan, fritext. Skriv tid som "<passlängd> per pass, <hur ofta>": metodkortet och lathundens
# faktarutor delar texten vid " per pass" och visar passlängd och frekvens var för sig.
tid: 20 minuter per pass, två till tre pass i veckan
period: Sex till åtta veckor
grupp: Tre till åtta elever
# Faktarutans material: egenskaper, inte meningar (Niclas 2026-10-02). Det viktigaste i högst sex korta delar, högst 40
# tecken var och 110 tillsammans, utan punkt, komma eller kolon. De står på en rad, och sidan länkar till metodens
# material för resten. Antal, A3 och liknande står i metodens text och lathunden.
material:
  - en kort text per pass
  - tavla och pennor
# Dagens datum när posten publiceras eller ändras.
uppdaterad: 2026-01-01
# id på andra metoder som hör ihop med denna. Lägg också in den här metoden hos dem.
relaterade: []
# true: syns bara i npm run dev, ingen pdf-kontroll, inget mejl. Sätt false när metoden är klar att mejlas.
utkast: true

# Serier (Ljudlek i grupp): en generell metod med en lektionsbank och lektioner som är egna metoder. En ny lektion är en
# ny fil med de tre fälten nedan: den syns i banken, i metodbanken och i seriens meny utan att den generella metoden
# ändras. En lektion tas bort genom att filen tas bort; bygget säger till om en text i serien fortfarande nämner den.
# En lektion har alla tre, och ingen relaterade: serien visar vägen mellan lektionerna.
# serie: ljudlek-i-grupp        # den generella metodens id
# formaga: 6                    # förmågans nummer i lektionsbanken, samma som uppgiften i ljudkollen
# tranar: "dela upp ord i ljud, med en markör för varje ljud"   # vad eleven tränar, som det står i banken
# Den generella metoden har lektionsbanken: förmågorna i ordning, numrerade från 1, med skälet till platsen.
# lektionsbank:
#   rubrik: "Lektionsbanken: förmågorna och lektionerna"
#   text: Hur gruppen väljer lektion.
#   formagor:
#     - nr: 1
#       namn: Rim
#       skal: Varför förmågan står här i ordningen.
#   not: Vad som gäller när gruppen går vidare.

# Modellen. Rubrikerna har standardvärden där de inte anges (se src/content.config.ts).
inledning:
  - Vad metoden är, för vem och hur ett pass ser ut. Ett stycke per rad.
# De tre rutorna svarar var på sin fråga, med delarna i den här ordningen, och har högst 600 tecken var, så att de
# går att överblicka på en mobilskärm (Niclas 2026-10-03). Huvudbeskedet står först, siffror och metodens egna namn
# står i stället för allmänna ord, och detaljer, felsökning och anteckningar står där de hör hemma.
upplagg:
  rubrik: Så fungerar insatsen
  text: Ramen (hur ofta, hur länge och hur många, med siffror), kärnan (vad som händer i passen och över perioden, med metodens egna namn på stegen) och uppföljningen (hur du ser att den hjälper).
# gruppen: valfri ruta om vilka elever och hur (rubrik, text), efter upplägget: målgruppen efter vad eleverna gör,
# gränsen (vem som behöver något annat först) och sammansättningen (storlek, blandning och par).
# principer: valfri ruta med metodens tre viktigaste saker, högst fyra, var och en först i sin mening följd av
# skälet eller handgreppet.
# passrutin: stegen som texter, eller med fas (en rad i tidsschemat). Har alla steg en fas ritas rutinen,
# tidsschemat och arbetsformen som en passöversikt (se problemlosning-i-grupp.yaml), och efterPasset blir raden Efter passet.
passrutin:
  text: Varje pass följer samma rutin.
  steg:
    - Steg ett.
    - Steg två.
    # - { text: Steg med fas., fas: Förstå }
  # efterPasset: Läraren skriver en kort notering.
  # kallas: delar  # när ordet steg hör till något annat i metoden, som lästrappan: rubrikerna blir Del och Rutinen i N delar (upprepad-lasning.yaml)
tidsschema:
  rubrik: 20 minuter, steg för steg
  text: Hur du förbereder dig.
  rader:
    - { tid: Före passet, fas: Förberedelse, vad: Vad du gör innan. }
    - { tid: 0–5 min, fas: Fasens namn, vad: Vad som händer. }
  efter: Vad ni gör om gruppen blir klar tidigt.
steg:
  text: De fyra stegen är den didaktiska modellen bakom rutinen.
  rader:
    - namn: Förstå
      fraga: Vad frågar texten?
      gor: Vad läraren gör i steget.
      fraser:
        - En fras att säga, utan citattecken.
arbetsform:
  rubrik: "Arbetsform: gemensamt, par, gemensamt"
  text: Hur passet rör sig mellan gemensamt och par.
  delar:
    - { rubrik: 1. Gemensamt, text: Läraren leder och modellerar }
    - { rubrik: 2. I par, text: Eleverna prövar }
    - { rubrik: 3. Gemensamt igen, text: Jämför och sätt ord på strategin }
    # Delarna är den övergripande arbetsformen, inte passets moment: Läraren visar, Gemensamt, I par, Enskilt,
    # med "igen" när gruppen går tillbaka (METODER.md, Arbetsformen i remsan). Faser i följd med samma arbetsform
    # blir en del. faser: [Jämföra, Avsluta] på varje del ger passöversiktens remsa var delen ligger.
exempel:
  valt: { rubrik: Texten läraren valt, text: Vad läraren valde till exempelpasset. }
  text:
    - Så gick passet till, ett stycke per rad.
  # tavla: true visar lathundens tavla (blocket tavla i lathund.mall) efter berättelsen, tavlaText under den.
fastnar:
  rubrik: När gruppen fastnar
  text: Vad du gör i stället för att ge svaret.
  fragaForst:
    - Vad har ni gjort hittills?
  # trappaText: egen rad före trappan (standard: En stödtrappa att gå uppför i stunden ...).
  trappa:
    - Minsta stöd först.
    - Nästa steg.
  motto: En mening att hålla fast vid.
  # efter: en mening efter trappan och mottot.
roll:
  rubrik: "Lärarens roll: leda utan att ta över"
  text: Vad läraren gör och inte gör.
  gor:
    - Gör så här.
  undvik:
    - Undvik det här.
urval:
  rubrik: Var hittar du texterna?
  text:
    - Var materialet finns.
  kravText: "Välj en text per pass som uppfyller tre krav:"
  krav:
    - { rubrik: Krav ett, text: Vad det betyder }
# Fria tabeller med rubrikrad, där de hör hemma: plats efter-inledning, efter-tidsschema, efter-steg, efter-arbetsform, efter-fastnar, efter-urval eller efter-grund.
tabeller:
  - rubrik: Elevens mapp
    plats: efter-inledning
    # Valfritt: meny: true sätter tabellen i sidans meny, efter avsnittet den ligger efter, med rubrikens första led som namn.
    # För det läraren letar efter varje pass, som Ljudstarten, Dagens ljud och Ordbanken i Ljudlek i grupp.
    kolumner: [Del, Vad den är till för]
    rader:
      - [Skrivbok, Här skriver eleven tre favoritmeningar]
    # Valfri not under tabellen.
    not: En mening som förklarar tabellen.

# Hem och skola, för insatser där hemmet gör en del av arbetet. Kontraktet och schemat blir egna sidor i planeringsmallarna.
hem:
  rubrik: Hem och skola
  text:
    - Ett stycke om mötet med vårdnadshavarna och vad hemmet gör.
  kontrakt:
    rubrik: Kontrakt
    inledning: Vad insatsen är och hur länge den pågår.
    ansvar:
      - rubrik: Skolans ansvar
        text: Vad skolan gör varje dag.
      - rubrik: Vårdnadshavarnas ansvar
        text: Vad hemmet gör varje dag.
    efter: En avslutande mening.
  schema:
    rubrik: Lässchema
    text: Vem som skriver vad i schemat.
    kolumner: [Datum, Bok, Lärare, Vårdnadshavare]
    rader: 16

progression:
  text: Hur ansvaret flyttas till eleverna.
  # enhet: första kolumnens rubrik, Vecka som standard. Skriv Pass för en insats som räknas i pass.
  rader:
    - { vecka: 1–2, led: Jag gör, fokus: Vad ni tränar, roll: Vad läraren gör }
uppfoljning:
  text: Hur du ser om det fungerar.
  rader:
    - { nar: Före insatsen, vad: Vad som mäts. }
    - { nar: Efter sex till åtta veckor, vad: Vad som jämförs. }
mal:
  punkter:
    - Vad eleven ska kunna göra efter insatsen.
snabbmall:
  text: En halv sida att fylla i före och efter varje pass.
  fore:
    - Fält att fylla i före passet
  efter:
    - Fält att fylla i efter passet
checklista:
  punkter:
    - Vad som ska vara gjort inför passet.
grund:
  text: Forskningen bakom, med parentescitat (Författare, årtal). Bara källor som går att verifiera.
  kallor: Bygger på Författare (årtal), Författare (årtal).

# Ramar: färdiga berättelseramar, textramar eller liknande som metoden arbetar i. Sist på sidan, efter
# grunden, och som egna sidor i planeringsmallarna. En ram där alla fält är tomma är en mall att fylla i.
ramar:
  rubrik: Berättelseramarna
  text:
    - Vad ramarna är och hur de används.
  ramar:
    - rubrik: "Berättelseram 1: Titeln"
      text:
        - Ramens inledning.
      # Valfri översikt, en rad per del.
      oversikt:
        kolumner: [Del, Rubrik, Vad händer, Skrivfokus]
        rader:
          - ["1", "Hej", "Vad som händer i delen.", "Skrivfokus i delen."]
      # listor: elevmaterial i ramen (ordlistor, bokstäver, meningar, en text), flera per ram, i elevens typsnitt. En lista
      # som är lärarens (kartläggningens uppgifter som läraren läser upp) får larare: true och står i husets typsnitt; ett
      # protokoll med skrivkolumn känns igen av sig självt. Kolumnrubriker
      # bara när de betyder något. Ritas stort, för att pekas i. Lärarnoten (delar) står före listorna på sidan
      # och i Word-filen med allt, efter dem i elevkopiorna. Se laslistor-i-grupp.yaml.
      # listor:
      #   - rubrik: Läs orden, kolumn för kolumn
      #     kolumner: [Konsonant + vokal, Vokal + konsonant]
      #     rader: [[se, is], [så, os]]
      # sagoform: ramen ritas i Word som ett blad i en sagobok (Skrivkurs: sagoboken), med kurbits, lindormen som ram och
      # bildbankens bilder vid stationerna. form: vag, berg, portratt, kort, omslag, sida, forfattare eller skyltar; ram:
      # lindorm eller slinga; bilder: bildbankens ord för stationerna i fältens ordning; sidor, radMm, rita och kortbilder
      # efter behov. Fältens text är frågan och, efter en radbrytning, startorden. Sidan hänvisar till planeringsmallarna.
      # sagoform: { form: vag, ram: lindorm, titel: Sagans väg, undertitel: fyra steg, bilder: [stjärna, vägspärr, glödlampa, regnbåge], sidor: 2 }
      delar:
        - rubrik: Del 1 · Hej
          falt:
            - { rubrik: Vad händer, text: Vad som händer i delen. }
            # kursiv: true för en mentortext eller ett exempel.
            - { rubrik: Så här kan det låta, text: En exempeltext., kursiv: true }
    - rubrik: "Berättelseram 2: egen ram"
      text:
        - Hur läraren fyller i ramen med gruppen.
      # huvud: fält att fylla i före delarna, tomma i en mall.
      huvud:
        - { rubrik: Tema och genre }
      delar:
        - rubrik: "Del 1 · Rubrik:"
          falt:
            - { rubrik: Vad händer }
            - { rubrik: Skrivfokus }
  # efter: en mening efter ramarna.
# Diplom eller intyg efter perioden: en sida i planeringsmallarna. En rad med bara understreck blir en skrivlinje.
diplom:
  kicker: Skrivkursen
  rubrik: Diplom
  text:
    - tilldelas
    - ___
    - som har genomfört kursen.
    - Grattis!
  underskrifter: [Datum, Lärare]

# Mallar att skriva ut, sist i planeringsmallarna på liggande A4 och som bilder på sidan. Säger metoden att eleverna
# ska ha ett blad ("Tabellmall att fylla i" på bordet), finns bladet här. typ rutnat: band med kolumnnamn, tomma när
# eleven skriver rubriken själv, och rader rutor. typ flode: rutor med pil mellan. typ matta, brakplank och tallinjer:
# se src/content.config.ts. text är till läraren och står bara på sidan; underrad står på bladet.
# mallar:
#   - rubrik: Tabellmall att fylla i
#     typ: rutnat
#     kolumner: ["", "", ""]
#     rader: 8
#     underrad: "Problem: ______________________ · Namn: ______________"
#     text: När gruppen väljer att visa problemet i en tabell.
#   - rubrik: "Problem och lösning: problem-lösning-ruta"
#     typ: flode
#     kolumner: [Problem, Lösning, Resultat]

# Lathunden: fyra sidor ur snabbguiden (Metoden, Ett pass, Mallen, Material). Egen sida
# /stodundervisning/<id>/lathund, utskrift i liggande A4 och Word-fil. Passlängd, grupp och
# frekvens tas ur tid, grupp och period; kraven ur urval; checklistan, snabbmallen och
# uppföljningen ur metoden. Utelämna hela blocket om metoden saknar lathund.
lathund:
  innehall: Vad ni arbetar med per pass, t.ex. En kort skönlitterär text
  metoden:
    text:
      - Två stycken om hur insatsen fungerar.
    ruta:
      rubrik: Tre saker att hålla fast vid
      # inledning: en fet rad först, t.ex. "Fråga alltid först: ..."
      punkter:
        - { fet: Fet inledning., text: Förklaringen. }
      # efter: en grå rad sist
    # En cell som börjar med "N · Fas" och tiden "A–B min" på nästa rad prövas mot tidsschemat: fasens
    # starttid och sluttiden för fasen eller en senare fas. Bygget stannar annars (content.config.ts).
    tabell:
      rubrik: Frågorna eller stegen
      kolumner: [Steg, Exempelfraser]
      rader:
        - ["1 · Förstå\nVad läraren gör.", "”Fras ett.”\n”Fras två.”"]
    # not: cremefärgad not under tabellen
  pass:
    rubrik: "Vi kör ett pass: texten ”Titeln”"
    textRubrik: Texten · cirka en sida, åk 4
    titel: Titeln
    text:
      - Exempeltexten eller problemet, ett stycke per rad.
    forberett:
      rubrik: Det jag förberett
      text:
        - Vad läraren gjort innan.
    klarTidigt: Vad gruppen gör om den blir klar tidigt.
    # utskrift: knappens text vid texten (standard: Skriv ut till eleverna).
    # schema är tidsschemat minut för minut: samma faser i samma ordning och samma tider (Före passet blir
    # Före, "min" stryks), med "N · " framför de faser som är steg och numren i följd från 1. Bygget stannar
    # annars (content.config.ts), så att lathunden aldrig säger emot sidan.
    schema:
      rubrik: 30 minuter, steg för steg
      rader:
        - { tid: Före, fas: Förberedelse, vad: Vad läraren gör. }
        - { tid: 0–10, fas: 1 · Läs, vad: Vad som händer., fraser: [En fras utan citattecken.] }
  mall:
    rubrik: Mallen jag skriver i under samtalet
    underrad: Kort rad under rubriken
    # block: spalter (kolumner med namn och fråga, rader), skrivruta (rubrik, text, rader),
    # tavla (text, fraga, listor, tabell, annat, svar, citat), snabbmall (ur metoden),
    # tabell (rubrik, kolumner, rader), kedja (rubrik, steg, citat), not (text)
    block:
      - typ: spalter
        kolumner:
          - { namn: Gillade, fraga: Var det något du gillade? }
          - { namn: Ogillade, fraga: Var det något du inte gillade? }
        rader: 5
      - { typ: not, text: Håll det enkelt. }
  material:
    rubrik: Vad du behöver för ett pass
    kravEtikett: Textkrav
    var:
      rubrik: Var texterna finns
      punkter:
        - { fet: Var., text: Kort förklaring. }
      efter: En grå rad sist.
    bordet:
      - Vad som ska ligga på bordet när passet börjar
    varjePass: Vad som noteras efter varje pass.
# Filmerna ur metodriggens filmpaket (METODER.md under Filmerna, src/lib/film.ts). Varje metod får en huvudfilm, film,
# som står direkt efter faktarutan; stillbilderna står på sidan 1 i Word och i utskriften. Filerna <id>-film.svg och
# <id>-film-1.svg … -4.svg ligger i public/stodundervisning/. titel bara när filmen ska heta något annat än rubriken.
# film:
#   titel: "Ljudstarten i Ljudlek i grupp"
#   sekunder: 18.9
#   beskrivning: "Filmens steg i ord och i ordning, samma text som filmens textrad."
#   rubrik: "Så gör eleven"
#   ingress: "Fyra bilder ur lektionens film om vad eleven gör. Filmen på metodens sida visar samma sak i rörelse."
#   stillbilder:
#     - text: "Högst 55 tecken under varje stillbild."
#     - text: "…"
#     - text: "…"
#     - text: "…"
# Högst två extrafilmer (fältet filmer, riggens format), nr 2 och 3, var och en vid momentet den förklarar, på samma
# plats i sidan, utskriften och Word. Filerna heter <id>-film2.svg och <id>-film2-1.svg … -4.svg. efter är ett avsnitt
# (passrutin, tidsschema, steg, arbetsform, exempel, fastnar, roll, urval, hem, progression, uppfoljning, mal, snabbmall,
# checklista, grund eller ramar: filmen står sist i avsnittet), "tabell: <rubrik>" (efter den fria tabellen),
# "ram: <rubrik>" (efter ramen), "steg <N>" (efter steg N; tabellen delas där) eller "stycke <N>" (efter stycke N i
# inledningen), med N från 1. En rubrik räcker med ledet före kolon. Rubrik och ingress är olika för varje film i metoden.
# filmer:
#   - nr: 2
#     titel: "Bråket på fyra sätt"
#     sekunder: 13.3
#     beskrivning: "…"
#     rubrik: "Fyra sätt: samma bråk fyra gånger"
#     ingress: "…"
#     efter: "steg"
#     stillbilder:
#       - text: "…"
#       - text: "…"
#       - text: "…"
#       - text: "…"
