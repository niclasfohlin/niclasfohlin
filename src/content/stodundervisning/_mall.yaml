# Mall för en metod i stödundervisning. Filer som börjar med _ läses inte in.
# Filnamn: kort slug som beskriver metoden, t.ex. problemlosning-i-grupp.yaml
# Modellen står i src/content.config.ts. Sidan, utskriften och docx-filerna byggs ur samma data,
# så det som skrivs här hamnar i alla tre. Delarna under "Modellen" är valfria: skriv bara det som finns.
# En text med flera stycken skrivs som en lista med ett stycke per rad.
# Ett värde som innehåller kolon följt av mellanrum skrivs inom citattecken.

titel: Metodens namn
# Raden under rubriken: vad metoden är och för vem.
undertitel: Lärarledd insats i liten grupp för åk 4–9
ingress: Två till fyra meningar om vad metoden tränar och hur den används. Egen text som fungerar ensam i ett kort och i ett nyhetsbrev.
# Exakt ett av: Matematik, Läsning, Skrivning
omrade: Läsning
# Minst ett av: F-3, 4-6, 7-9. Filtret i metodbanken använder nivåerna.
arskurs: ["4-6", "7-9"]
# Valfritt: årskursen som läsaren ser när nivåerna inte säger det exakt, t.ex. åk 3–6.
# arskursText: åk 3–6
# id från src/data/taggar.json. Återanvänd före att lägga till.
taggar: ["lasforstaelse"]
# Valfritt antal av: enskilt, par, liten grupp, helklass
format: ["liten grupp", "par"]
# Faktarutan, fritext. Skriv tid som "<passlängd> per pass, <hur ofta>": metodkortet och lathundens
# faktarutor delar texten vid " per pass" och visar passlängd och frekvens var för sig.
tid: 20 minuter per pass, två till tre pass i veckan
period: Sex till åtta veckor
grupp: Tre till åtta elever
material:
  - Vad som behövs, en rad per sak
# Dagens datum när posten publiceras eller ändras.
uppdaterad: 2026-01-01
# id på andra metoder som hör ihop med denna. Lägg också in den här metoden hos dem.
relaterade: []
# true: syns bara i npm run dev, ingen pdf-kontroll, inget mejl. Sätt false när metoden är klar att mejlas.
utkast: true

# Modellen. Rubrikerna har standardvärden där de inte anges (se src/content.config.ts).
inledning:
  - Vad metoden är, för vem och hur ett pass ser ut. Ett stycke per rad.
upplagg:
  rubrik: Så fungerar insatsen
  text: Hur ofta, hur länge, hur stor grupp, vad ni arbetar med per pass, vad som noteras och hur perioden utvärderas.
# gruppen: valfri ruta om hur gruppen sätts ihop (rubrik, text), efter upplägget.
# principer: valfri ruta med det viktigaste att hålla fast vid.
# passrutin: stegen som texter, eller med fas (en rad i tidsschemat). Har alla steg en fas ritas rutinen,
# tidsschemat och arbetsformen som en passöversikt (se problemlosning-i-grupp.yaml), och efterPasset blir raden Efter passet.
passrutin:
  text: Varje pass följer samma rutin.
  steg:
    - Steg ett.
    - Steg två.
    # - { text: Steg med fas., fas: Förstå }
  # efterPasset: Läraren skriver en kort notering.
tidsschema:
  rubrik: 20 minuter, steg för steg
  text: Hur du förbereder dig.
  rader:
    - { tid: Före passet, fas: Förberedelse, vad: Vad du gör innan. }
    - { tid: 0–5 min, fas: Fasens namn, vad: Vad som händer. }
  efter: Vad ni gör om gruppen blir klar tidigt.
steg:
  text: De fyra stegen är den didaktiska modellen bakom rutinen.
  rader:
    - namn: Förstå
      fraga: Vad frågar texten?
      gor: Vad läraren gör i steget.
      fraser:
        - En fras att säga, utan citattecken.
arbetsform:
  rubrik: "Arbetsform: gemensamt, par, gemensamt"
  text: Hur passet rör sig mellan gemensamt och par.
  delar:
    - { rubrik: 1. Gemensamt, text: Läraren leder och modellerar }
    - { rubrik: 2. I par, text: Eleverna prövar }
    - { rubrik: 3. Gemensamt igen, text: Jämför och sätt ord på strategin }
    # faser: [Jämföra, Avsluta] på varje del ger passöversiktens remsa var delen ligger.
exempel:
  valt: { rubrik: Texten läraren valt, text: Vad läraren valde till exempelpasset. }
  text:
    - Så gick passet till, ett stycke per rad.
  # tavla: true visar lathundens tavla (blocket tavla i lathund.mall) efter berättelsen, tavlaText under den.
fastnar:
  rubrik: När gruppen fastnar
  text: Vad du gör i stället för att ge svaret.
  fragaForst:
    - Vad har ni gjort hittills?
  # trappaText: egen rad före trappan (standard: En stödtrappa att gå uppför i stunden ...).
  trappa:
    - Minsta stöd först.
    - Nästa steg.
  motto: En mening att hålla fast vid.
  # efter: en mening efter trappan och mottot.
roll:
  rubrik: "Lärarens roll: leda utan att ta över"
  text: Vad läraren gör och inte gör.
  gor:
    - Gör så här.
  undvik:
    - Undvik det här.
urval:
  rubrik: Var hittar du texterna?
  text:
    - Var materialet finns.
  kravText: "Välj en text per pass som uppfyller tre krav:"
  krav:
    - { rubrik: Krav ett, text: Vad det betyder }
# Fria tabeller med rubrikrad, där de hör hemma: plats efter-inledning, efter-tidsschema, efter-steg, efter-arbetsform, efter-fastnar, efter-urval eller efter-grund.
tabeller:
  - rubrik: Elevens mapp
    plats: efter-inledning
    kolumner: [Del, Vad den är till för]
    rader:
      - [Skrivbok, Här skriver eleven tre favoritmeningar]
    # Valfri not under tabellen.
    not: En mening som förklarar tabellen.

# Hem och skola, för insatser där hemmet gör en del av arbetet. Kontraktet och schemat blir egna sidor i planeringsmallarna.
hem:
  rubrik: Hem och skola
  text:
    - Ett stycke om mötet med vårdnadshavarna och vad hemmet gör.
  kontrakt:
    rubrik: Kontrakt
    inledning: Vad insatsen är och hur länge den pågår.
    ansvar:
      - rubrik: Skolans ansvar
        text: Vad skolan gör varje dag.
      - rubrik: Vårdnadshavarnas ansvar
        text: Vad hemmet gör varje dag.
    efter: En avslutande mening.
  schema:
    rubrik: Lässchema
    text: Vem som skriver vad i schemat.
    kolumner: [Datum, Bok, Lärare, Vårdnadshavare]
    rader: 16

progression:
  text: Hur ansvaret flyttas till eleverna.
  # enhet: första kolumnens rubrik, Vecka som standard. Skriv Pass för en insats som räknas i pass.
  rader:
    - { vecka: 1–2, led: Jag gör, fokus: Vad ni tränar, roll: Vad läraren gör }
uppfoljning:
  text: Hur du ser om det fungerar.
  rader:
    - { nar: Före insatsen, vad: Vad som mäts. }
    - { nar: Efter sex till åtta veckor, vad: Vad som jämförs. }
mal:
  punkter:
    - Vad eleven ska kunna göra efter insatsen.
snabbmall:
  text: En halv sida att fylla i före och efter varje pass.
  fore:
    - Fält att fylla i före passet
  efter:
    - Fält att fylla i efter passet
checklista:
  punkter:
    - Vad som ska vara gjort inför passet.
grund:
  text: Forskningen bakom, med parentescitat (Författare, årtal). Bara källor som går att verifiera.
  kallor: Bygger på Författare (årtal), Författare (årtal).

# Ramar: färdiga berättelseramar, textramar eller liknande som metoden arbetar i. Sist på sidan, efter
# grunden, och som egna sidor i planeringsmallarna. En ram där alla fält är tomma är en mall att fylla i.
ramar:
  rubrik: Berättelseramarna
  text:
    - Vad ramarna är och hur de används.
  ramar:
    - rubrik: "Berättelseram 1: Titeln"
      text:
        - Ramens inledning.
      # Valfri översikt, en rad per del.
      oversikt:
        kolumner: [Del, Rubrik, Vad händer, Skrivfokus]
        rader:
          - ["1", "Hej", "Vad som händer i delen.", "Skrivfokus i delen."]
      delar:
        - rubrik: Del 1 · Hej
          falt:
            - { rubrik: Vad händer, text: Vad som händer i delen. }
            # kursiv: true för en mentortext eller ett exempel.
            - { rubrik: Så här kan det låta, text: En exempeltext., kursiv: true }
    - rubrik: "Berättelseram 2: egen ram"
      text:
        - Hur läraren fyller i ramen med gruppen.
      # huvud: fält att fylla i före delarna, tomma i en mall.
      huvud:
        - { rubrik: Tema och genre }
      delar:
        - rubrik: "Del 1 · Rubrik:"
          falt:
            - { rubrik: Vad händer }
            - { rubrik: Skrivfokus }
  # efter: en mening efter ramarna.
# Diplom eller intyg efter perioden: en sida i planeringsmallarna. En rad med bara understreck blir en skrivlinje.
diplom:
  kicker: Skrivkursen
  rubrik: Diplom
  text:
    - tilldelas
    - ___
    - som har genomfört kursen.
    - Grattis!
  underskrifter: [Datum, Lärare]

# Lathunden: fyra sidor ur snabbguiden (Metoden, Ett pass, Mallen, Material). Egen sida
# /stodundervisning/<id>/lathund, utskrift i liggande A4 och Word-fil. Passlängd, grupp och
# frekvens tas ur tid, grupp och period; kraven ur urval; checklistan, snabbmallen och
# uppföljningen ur metoden. Utelämna hela blocket om metoden saknar lathund.
lathund:
  innehall: Vad ni arbetar med per pass, t.ex. En kort skönlitterär text
  metoden:
    text:
      - Två stycken om hur insatsen fungerar.
    ruta:
      rubrik: Tre saker att hålla fast vid
      # inledning: en fet rad först, t.ex. "Fråga alltid först: ..."
      punkter:
        - { fet: Fet inledning., text: Förklaringen. }
      # efter: en grå rad sist
    tabell:
      rubrik: Frågorna eller stegen
      kolumner: [Steg, Exempelfraser]
      rader:
        - ["1 · Förstå\nVad läraren gör.", "”Fras ett.”\n”Fras två.”"]
    # not: cremefärgad not under tabellen
  pass:
    rubrik: "Vi kör ett pass: texten ”Titeln”"
    textRubrik: Texten · cirka en sida, åk 4
    titel: Titeln
    text:
      - Exempeltexten eller problemet, ett stycke per rad.
    forberett:
      rubrik: Det jag förberett
      text:
        - Vad läraren gjort innan.
    klarTidigt: Vad gruppen gör om den blir klar tidigt.
    # utskrift: knappens text vid texten (standard: Skriv ut till eleverna).
    schema:
      rubrik: 30 minuter, steg för steg
      rader:
        - { tid: Före, fas: Förberedelse, vad: Vad läraren gör. }
        - { tid: 0–10, fas: 1 · Läs, vad: Vad som händer., fraser: [En fras utan citattecken.] }
  mall:
    rubrik: Mallen jag skriver i under samtalet
    underrad: Kort rad under rubriken
    # block: spalter (kolumner med namn och fråga, rader), skrivruta (rubrik, text, rader),
    # tavla (text, fraga, listor, tabell, annat, svar, citat), snabbmall (ur metoden),
    # tabell (rubrik, kolumner, rader), kedja (rubrik, steg, citat), not (text)
    block:
      - typ: spalter
        kolumner:
          - { namn: Gillade, fraga: Var det något du gillade? }
          - { namn: Ogillade, fraga: Var det något du inte gillade? }
        rader: 5
      - { typ: not, text: Håll det enkelt. }
  material:
    rubrik: Vad du behöver för ett pass
    kravEtikett: Textkrav
    var:
      rubrik: Var texterna finns
      punkter:
        - { fet: Var., text: Kort förklaring. }
      efter: En grå rad sist.
    bordet:
      - Vad som ska ligga på bordet när passet börjar
    varjePass: Vad som noteras efter varje pass.
