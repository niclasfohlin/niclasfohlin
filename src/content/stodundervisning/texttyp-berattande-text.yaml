            - rubrik: Pass 1
              text: "Efter Två texter gör ni strukturen, med tärning 1, 2 och 4, som står direkt efter sidan. Har ni inte tärningarna, skriv fyra svar per tärning på lappar. Med två elever eller udda antal är du också lyssnare. Säg till när minuten har gått. Visa sidan på tavlan."
      listor:
