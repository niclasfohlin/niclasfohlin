          rader:
            - ["Var och en slår tärningarna och tänker ut en kort berättelse med det som kom upp."]
            - ["Ställ er två och två. Den ena berättar på en minut."]
            - ["Den som lyssnar säger ”Berätta mera!” där hen vill veta mer."]
            - ["Den som berättar lägger till hur det ser ut eller hur det känns."]
            - ["Byt roller: nu berättar den andra."]
            - ["Tacka kamraten och hitta en ny. Gör om steg 2 till 5, med det du lade till."]
            - ["Efter tre omgångar: säg till gruppen vad som blev bättre i din berättelse."]
        - rubrik: Så tränar ni berättande text
