mallar:
  - rubrik: Lapparna
    typ: rutnat
    text: "Av arket gör du lapparna som eleverna planerar med. Skriv ut ett ark till varje par, och klipp längs linjerna, så blir det arton lappar. Hur länge ett ark räcker står under Till läraren: lapparna. Eleverna skriver en sak på varje lapp. På den första skriver de vad läsaren ska känna, och på var och en av de andra något som händer. Senare skriver de också det de svarade läsaren och det de har tagit reda på. Den som skriver på dator fyller i arket i Word innan du skriver ut det. Dina lappar från visningen står i manuset under Visningen, vecka 2."
    kolumner: ["", "", ""]
    rader: 6
    underrad: "Klipp längs linjerna, så blir det arton lappar. Skriv en sak på varje lapp."
    fot: "Den första lappen: det vi vill. Var och en av de andra: något som händer, med några ord. En ny lapp: det jag svarade läsaren."
  - rubrik: Planen
    typ: matta
    text: "Bladet ligger framför paret i delen Tänk och planera, och framför var och en i vecka 5. Skriv ut det på liggande A4. Lapparna klipper du ur arket Lapparna. Den första lappen säger vad paret vill att läsaren ska känna. I den vänstra rutan lägger paret den lappen och lapparna med det som händer, i ordning uppifrån och lite omlott. Lappen som paret lägger åt sidan ligger kvar i den högra."
    kolumner:
      - Det vi vill, och det som händer
      - "Åt sidan: det här vill läsaren inte vara med om"
    fot: "Tänk: vem läser, och vad vill vi? Planera: det vi vill först, och på varje lapp något som händer. Säg: berätta för en läsare. Skriv: skriv det du sa, och det du svarade."
  - rubrik: Mina texter
    typ: rutnat
    text: "Diagrammet ligger i elevens mapp. Eleven fyller i stapeln nedifrån: en ruta när läsaren får veta vem det handlar om och var, en ruta när berättelsen stannar kvar i det som händer, en ruta för varje ställe där det märks hur det känns och en ruta när läsaren får veta hur det går. Gränsfallen står under Så räknar ni, i Till läraren: de korta berättelserna. Stapeln har plats för sex rutor, och ingen behöver fylla den: fyra rutor är en hel berättelse. Stapeln Efter kursen fyller eleven i när gruppen samlas igen."
    kolumner:
      - Yngre eleven
      - Vår spöktext
      - Min spöktext
      - Första korta
      - Sista korta
      - Efter kursen
    rader: 6
    underrad: "Namn: ____________________   En stapel för varje berättelse som jag har skrivit. Fyll i nedifrån. Fyra rutor är en hel berättelse."
    fot: "En ruta för vem och var. En ruta när jag stannar kvar i det som händer: det personen märker eller prövar först. En ruta för varje ställe där det märks hur det känns. En ruta för hur det går."

