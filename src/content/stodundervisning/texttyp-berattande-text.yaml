# Texttyp: Berättande text. Den andra kursen i serien Texttyper i grupp, efter piloten Texttyp: Argumenterande text, på
# Niclas uppdrag 2026-10-06 (intake/texttyp-berattande-text.md och intake/texttyper-i-grupp.md). Formen är seriens
# (methods/texttyper-i-grupp/kursstandard.md), och det som gäller alla kurser står i methods/texttyper-i-grupp/metod.yaml.
# Kursens två texter är Niclas: en berättelse till yngre elever som gruppen först intervjuar, och en spökberättelse från
# en känd plats, läst på en spökläsning med en läsplats under ett lakan. Underlaget är seriens register
# (intake/texttyper-i-grupp/REGISTER.md) med sökning 7–9, och valen står i analys.md. De två texterna om Sara i skogen
# och lärarens ord om dem kommer ur Skriv! (intake/skrivkurs-sagoboken/skriv-bok.md, rad 801–823), och frågan
# ”Hur märker läsaren det?” från rad 3718.
titel: "Texttyp: Berättande text"
undertitel: "Sex veckors kurs i liten grupp för åk 4–7, där eleverna berättar för läsare som svarar"
ingress: "En kurs i sex veckor för två till tio elever i åk 4–7 som i sina berättelser räknar upp det som händer. Eleverna lär sig berätta så att läsaren är med. De skriver först en berättelse till yngre elever som de har intervjuat, och sedan en spökberättelse till en spökläsning. Kursen hör till Texttyper i grupp."
omrade: Skrivning
arskurs:
  - 4-6
  - 7-9
arskursText: åk 4–7
taggar:
  - skrivstrategier
  - textstruktur
  - formativ-bedomning
  - intensivtraning
format:
  - liten grupp
  - par
tid: 60 minuter per pass, två pass i veckan
period: Sex veckor
grupp: Två till tio elever
material:
  - lappar
  - bladet Planen
  - kortet Läsarens frågor
  - bladet Intervjun
  - "veckans texter"
  - "ett lakan och två ficklampor"

uppdaterad: 2026-10-09
publicerad: 2026-10-09
relaterade: []
utkast: false
serie: texttyper-i-grupp
formaga: 2
tranar: "berätta så att läsaren är med, genom att välja det läsaren vill vara med om, visa hur det känns och stanna kvar i det som händer"

inledning:
  - "Texttyp: Berättande text är en kurs för elever i åk 4–7 som behöver stöd i att skriva. När de skriver en berättelse räknar de ofta upp det som händer, från morgon till kväll. Det som skulle bli spännande är över på en mening, och läsaren får inte veta hur det känns. I kursen lär de sig berätta för en läsare. En berättande text låter läsaren vara med om något, och den lyckas när läsaren får veta vem det handlar om och var, vad som händer, hur det känns och hur det går. Kursen har två berättelser, två läsare och samma fyra steg. Den första berättelsen går till en yngre elev som eleverna har intervjuat, och den andra är en spökberättelse till lyssnarna på en spökläsning."
  - "På tavlan står tre rader: Vem läser? Vad vill vi? När får vi svar? Vid den tredje står när läsaren får höra berättelsen och svarar. På bordet ligger lappar, bladet Planen, kortet Läsarens frågor och bladet Intervjun. Lapparna är remsor av papper, som du klipper ur arket Lapparna. På den första lappen skriver eleverna vad de vill att läsaren ska känna. Är läsaren Vera, sju år, kan det stå ”Vera ska skratta”. På var och en av de andra skriver de något som händer, med några ord: ”Påsen rör på sig”. Sedan lägger de lapparna på bladet Planen. Vid varje lapp frågar de sig om läsaren vill vara med om det. De lägger minst en lapp åt sidan, och den som gör det säger varför. De lappar som ligger kvar lägger de i ordning, och det är planen för berättelsen."
  - "Eleven lär sig genom att höra dig tänka högt och sedan göra likadant. Du frågar som läsaren, säger dina val högt och lämnar över. Det eleven ska ta över är att välja för läsarens skull och säga valet högt: ”Jag lägger den här lappen åt sidan, för Vera tycker att åska är läskigt.” Eleven gör varje berättelse med samma fyra steg, Tänk, Planera, Säg och Skriv. De står på bladet Planen. I steget Säg berättar eleven för en läsare ur ett annat par. Läsaren håller kortet och frågar bara det hen inte fick veta. Det eleven svarar då är oftast det som saknades, till exempel hur det känns. Svaret blir en ny lapp och sedan en mening i berättelsen. Mitt i skrivandet möter eleven andras berättelser och läsarens frågor, och väljer vad hen använder i sin egen berättelse. När berättelsen är klar skriver hen vad hen tar med sig till nästa."
  - "Kursens läsare lyssnar, eftersom eleverna läser upp sina berättelser. De första läsarna är yngre elever. I vecka 1 intervjuar varje par en yngre elev om vad hen tycker om, och paret skriver svaren på bladet Intervjun. I vecka 2 planerar paret en berättelse till just den eleven, och var och en skriver sin. I vecka 3 kommer de yngre eleverna på läsbesök, får höra berättelserna och säger vad de minns bäst. De andra läsarna är lyssnarna på en spökläsning, och dem bjuder eleverna själva in. Eleverna skriver spökberättelser från en plats som alla känner, i eller nära skolan: först en med parets plan och sedan en egen. Den egna läser eleven upp i det sista passet, när ni har byggt en läsplats under ett lakan och gjort det mörkt i rummet. Efter varje berättelse säger lyssnarna var i berättelsen de var med, och vad de undrar."
  - "De sex veckorna går från att du visar till att eleven skriver själv. I vecka 1 skriver eleven en kort berättelse utan stöd, som ni lägger bredvid en ny i vecka 6. I vecka 2 visar du hur du planerar och skriver en berättelse, och paren gör efter dig. I vecka 3 skriver gruppen en berättelse tillsammans, i vecka 4 planerar paren en spökberättelse, och i vecka 5 planerar var och en sin egen. I vecka 6, före spökläsningen, läser gruppen två uppgifter som liknar provens, så att eleven känner igen när en uppgift ber om en berättande text. Det som gäller alla kurser i serien står i Texttyper i grupp: vilka eleverna är, hur du tänker högt, vad du gör när en elev fastnar och vad kurserna bygger på."

upplagg:
  rubrik: Så fungerar insatsen
  text: "Två till tio elever har två pass om 60 minuter i veckan under sex veckor. Eleven gör varje berättelse med fyra steg, Tänk, Planera, Säg och Skriv: hen säger vem som läser, väljer det läsaren vill vara med om, berättar för en läsare och skriver. Du tar bort stödet vecka för vecka: du visar, gruppen skriver tillsammans, paren planerar och var och en skriver sin egen berättelse. Berättelsen från vecka 2 läser eleven för en yngre elev som paret har intervjuat, och spökberättelsen på en spökläsning. De korta berättelserna i pass 1 och 11, elevens diagram och det du hör visar om kursen hjälper."

gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Kursen är för elever i åk 4–7 som i sina berättelser räknar upp det som händer: problemet löser sig på en mening, och läsaren får inte veta hur det känns. Eleven behöver kunna berätta om något som har hänt och få ned läsbara meningar för hand, på dator eller genom att diktera. Den som redan låter läsaren vara med får inte ut mycket av kursen, och den vars största hinder är stavningen behöver stöd i stavning vid sidan av kursen. Gruppen har två till tio elever. Du sätter ihop paren efter vem som stöttar vem. Med udda antal blir ett av paren tre, och med två elever är du läsare åt dem."

principer:
  rubrik: Tre saker att hålla fast vid
  text: "Nämn läsaren före första ordet, i varje berättelse. Läsaren avgör vad som ska med. Lägg något åt sidan eller lägg till något för läsarens skull, och säg varför, så att valet hörs och syns på pappret. Kör fast högt, och säg vad du gör då. Eleven behöver höra att också du fastnar och hur du tar dig vidare. De tre sakerna ska först höras från dig och sedan från eleven, och det är dem du lyssnar efter."

passrutin:
  text: "Fem av passen, pass 4 och pass 6 till 9, har samma sex delar. I delarna Tänk och planera, Säg och Skriv gör eleverna de fyra stegen. En berättelse tar oftast två pass. Tabellens minuter gäller pass 7, där eleverna planerar, berättar och börjar skriva. De andra fyra passen har samma delar med andra minuter, och alla passens minuter står på veckans sida."
  steg:
    - text: "En elev läser dagens mening som läsaren. Alla skriver en ny mening som svar, och ni lägger dem bredvid varandra. Var och en gör sin mening bättre."
      fas: Läs som läsaren
    - text: "Du visar det som står på veckans sida. Gruppen säger vad de hörde och prövar samma sak en gång tillsammans."
      fas: Visa och pröva
    - text: "Eleven läser bladet Mitt mål. Paret säger vem som läser. På lappar skriver de vad läsaren ska känna och det som händer, och lägger minst en åt sidan och resten i ordning."
      fas: Tänk och planera
    - text: "Skribenten berättar för en läsare ur ett annat par. Läsaren har kortet och frågar det hen inte fick veta. Svaret blir en ny lapp. Sist säger läsaren sin första mening."
      fas: Säg
    - text: "Var och en skriver efter planen, på varannan rad. Den som är klar läser berättelsen som läsaren, med kortet, och skriver in det läsaren saknar."
      fas: Skriv
    - text: "Två elever läser en mening ur sin berättelse och berättar om ett val."
      fas: Läs upp
  kallas: delar
  efterPasset: "Fäst lapparna på bladet Planen. Fyll i fältet Till nästa pass på bladet Det jag hör. Efter pass 4, 8 och 10 läser du berättelserna och svarar. Se Till läraren: de korta berättelserna."

tidsschema:
  rubrik: "Ett pass i sex delar"
  text: "Förbered dig genom att läsa veckans sida under Till läraren: veckorna. Där står dagens mening, vad du visar och vad du ska lägga märke till, och passets minuter när de skiljer sig från tabellens. Minuterna är hållpunkter: det tar tid att komma i gång, och Skriv är lång för att passet ska ha luft."
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: "Skriv tavlans tre rader och dagens mening. Lägg fram lappar, pennor, bladet Planen, kortet och mapparna. Välj två eller tre elever som du lyssnar särskilt på."
    - tid: 0–5 min
      fas: Läs som läsaren
      vad: "Fråga ”Vad vet du nu? Vad undrar du?” Den som inte hinner skriva säger sin mening. Fråga sedan ”Vilken mening ger läsaren mest? Varför?”"
    - tid: 5–15 min
      fas: Visa och pröva
      vad: "Skriv på tavlan vad ni övar på, och visa bara det. Fråga ”Vad hörde ni mig säga?” Lägg undan veckans texter före Skriv."
    - tid: 15–27 min
      fas: Tänk och planera
      vad: "Fråga efter läsaren före händelserna. Vid varje lapp: ”Vill läsaren vara med om det?” Sedan: ”Vilken lapp lägger ni åt sidan? Varför?”"
    - tid: 27–33 min
      fas: Säg
      vad: "Lyssna på en skribent i taget, och säg ”Det du svarade nu ska med i berättelsen.” Kan hen inte svara, tar paret reda på det."
    - tid: 33–57 min
      fas: Skriv
      vad: "Säg ”Skriv det du sa.” Läs en mening över axeln och ställ en enda fråga ur kortet, som ”Hur känns det?” Rätta inte nu. Den som inte kommer i gång får hjälp med första meningen."
    - tid: 57–60 min
      fas: Läs upp
      vad: "Fråga efter ett val: ”Vilken lapp lade du åt sidan? Varför?” När en berättelse är klar skriver eleven vad hen tar med sig."
  efter: "Tavlans tre rader är frågorna om läsaren: Vem läser? Vad vill vi? När får vi svar? Vid den första skriver du vem som ska höra berättelsen, och vid den tredje när läsaren svarar: i dag, på läsbesöket, i nästa pass eller på spökläsningen. Svaret på frågan Vad vill vi? står på den första lappen, och på tavlan när hela gruppen vill samma sak. Dagens mening tar du aldrig ur en elevs egen berättelse. Har gruppen läst texten som meningen kommer ur, skriver eleverna en egen mening och inte den som följer i texten. De tre svarsraderna är läsarens svar, och de står på kortets andra sida: Nu vet jag, Här var jag med och Nu undrar jag."

arbetsform:
  rubrik: "Arbetsform: gemensamt, läraren visar, i par, gemensamt igen"
  text: "I delen Säg sätter sig två par ihop, och läsaren kommer ur det andra paret. De två som berättar gör det samtidigt, var och en för sin läsare. Blir ett par över, är du läsare åt det paret, och åt ett annat par nästa gång. Så blir det i varje pass när gruppen har två, tre, sex, sju eller tio elever. Då skriver du på bladet Det jag hör vad det paret säger, och den andra i paret säger sist sin första mening till dig. Är en i paret borta, blir kamraten den tredje i ett annat par. I pass 9 har var och en sin egen plan, och då är kamraten läsaren. Paren är desamma hela kursen, och paret får planera på sitt starkaste språk."
  delar:
    - rubrik: 1. Gemensamt
      text: Hela gruppen, med dig vid tavlan
      faser:
        - Läs som läsaren
    - rubrik: 2. Läraren visar
      text: Du tänker högt, och gruppen gör likadant
      faser:
        - Visa och pröva
    - rubrik: 3. I par
      text: "Två och två, med var sin text"
      faser:
        - Tänk och planera
        - Säg
        - Skriv
    - rubrik: 4. Gemensamt igen
      text: Två elever berättar om ett val
      faser:
        - Läs upp

