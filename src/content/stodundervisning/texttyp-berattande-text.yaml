              text: "Uppgifterna liknar dem i de nationella proven. Den första ber om en berättelse, och den andra om en instruktion. Hinner ni, planerar paren den första muntligt. Ingen skriver en text till uppgifterna i dag."
            - rubrik: Efter kursen
              text: "Uppgift 1 skriver eleven när gruppen samlas igen efter kursen. Då läser hen först det hen skrev på Mitt mål i pass 12, och ditt svar på berättelsen från pass 11. Sedan gör hen de fyra stegen, med kamraten som läsare. Du svarar med tre svarsrader, och eleven fyller i stapeln Efter kursen."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vem ska läsa?"
              text: "De som läser skolans tidning i den första, och förskoleklassen i den andra."
            - rubrik: "2. Vilken ber dig berätta?"
              text: "Den första: en berättelse om någon som tappar bort något viktigt i skolan. Den andra ber om en instruktion."
            - rubrik: "3. Vilka av kortets frågor?"
              text: "”Vad händer?” hör till problemet, ”Hur känns det?” till hur huvudpersonen upplever det, och ”Hur går det?” till hur det löser sig. Huvudpersonen är den som berättelsen handlar om."
            - rubrik: "4. Inledning, handling och avslutning?"
              text: "Inledningen svarar på vem och var, handlingen på vad som händer och hur det känns, och avslutningen på hur det går."
      listor:
        - rubrik: Två uppgifter
          kolumner:
            - Den första uppgiften
            - Den andra uppgiften
          rader:
            - - "Skolans tidning ska ge ut ett nummer med berättelser från skolan. Skriv en berättelse om någon som tappar bort något viktigt i skolan. Vilket problem får huvudpersonen? Hur upplever huvudpersonen det? Hur löser det sig? Tänk på att berättelsen ska ha en inledning, en handling och en avslutning. Ge din berättelse en rubrik."
              - "Förskoleklassen vill lära sig en ny lek till rasten. Skriv en instruktion till en lek som du kan. Skriv så att den som läser kan leka leken utan att fråga dig."
        - rubrik: Frågorna
          rader:
            - ["Vem ska läsa? Ringa in läsaren."]
            - ["Vilken uppgift ber dig berätta? Stryk under orden som säger det."]
            - ["Vilken av kortets frågor hör till var och en av uppgiftens frågor?"]
            - ["Vad är inledning, handling och avslutning?"]
    - rubrik: "Spökläsningen, vecka 6: Läsplatsen och lyssnarna"
      text:
        - "I pass 12 läser eleverna sina spökberättelser för inbjudna lyssnare."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Före passet
              text: "Efter pass 10 läser du varje berättelse mot reglerna och skriver ”Vad märker hen först?” vid ett ställe där det går för fort. Bryter en berättelse mot en regel, ändrar eleven det i pass 11. Efter pass 11 rättar du det som gör berättelserna svåra att läsa högt, och skriver ut dem som är skrivna på dator. Säg till klassläraren och lyssnarnas lärare när spökläsningen är. Till pass 12 tar du med lakan, kudde, två ficklampor, berättelserna och ett papper per elev."
            - rubrik: Lyssnarna
              text: "Varje elev bjuder in en lyssnare, eller två om gruppen har fem elever eller färre. Lyssnaren är en kamrat som är lika gammal eller äldre, ett äldre syskon eller en vuxen på skolan. Eleven skriver namnet överst i sin plan i pass 9. Bjud också in klassläraren. De yngre eleverna bjuder ni inte in, eftersom spökberättelserna är skrivna för äldre lyssnare. Klockslaget på inbjudan är tio minuter efter passets början."
            - rubrik: Läsplatsen
              text: "Bygg den tillsammans med eleverna. Lägg ett lakan över ett bord, eller spänn det mellan två stolar, så att två elever får plats under det. Lägg dit en kudde och en ficklampa. Dra för fönstren, och släck när alla sitter. Den som läser sitter under lakanet med ficklampan, och lyssnarna sitter på golvet runt om."
            - rubrik: Ordningen
              text: "Bestäm ordningen efter pass 11. Börja med någon som vill, och lägg den lugnaste berättelsen sist. Tio berättelser tar omkring trettiofem minuter. Har gruppen fler än sex elever, tänder du efter halva tiden och låter alla sträcka på sig. Har den fyra eller färre, läser varje par också en av sina berättelser från pass 8."
            - rubrik: Den som läser
              text: "Eleven läser sin berättelse långsamt, och ännu långsammare mot slutet. I pass 11 väljer hen hur: hen läser själv, har kamraten bredvid sig under lakanet eller låter en kamrat eller dig läsa. Den som inte läser själv håller ficklampan eller sitter bland lyssnarna."
            - rubrik: Svaren
              text: "Säg till lyssnarna innan du släcker: ”Efter varje berättelse säger två av er var i berättelsen ni var med, och vad ni undrar.” I en grupp med fler än sex elever svarar en lyssnare. Skriv det de säger på ett papper med elevens namn, i ljuset från den andra ficklampan, eller be en vuxen lyssnare skriva. Undrar någon vad det läskiga var, har berättelsen lyckats. Ingen säger om en berättelse var bra eller dålig."
    # ---------------------------------------------------------------- Det som används i flera veckor
    - rubrik: "Till läraren: återkopplingen"
      text:
        - "Fem av kursens åtta grepp för återkoppling gör ni mitt i berättelsen, medan den fortfarande går att ändra. Eleven möter något, som en kamrats början, din fråga, kamratens berättelse eller läsarens svar. Hen bestämmer direkt om hen tar med det, ändrar sin berättelse eller behåller den, och säger varför. Efter varje berättelse skriver eleven på bladet Mitt mål vad hen tar med sig, och när nästa berättelse börjar läser hen det först. Eleven skriver på varannan rad, så att det hen ändrar går att skriva in."
      delar:
        - rubrik: Greppen
          falt:
            - rubrik: Två texter där en sak skiljer
              text: "Det här gör ni i pass 1, och i pass 6 och 8 innan eleverna skriver. Händelsen och platsen är lika, och en sak skiljer. I pass 1 skiljer flera saker."
            - rubrik: Alla svar på bordet
              text: "Det här gör ni i delen Läs som läsaren, från pass 3. Alla skriver en ny mening och lägger den bredvid de andras, och gruppen pekar ut den mening som ger läsaren mest. Var och en gör sin egen bättre."
            - rubrik: Starterna runt bordet
              text: "Det här gör ni mitt i berättelsen, i början av pass 4 och vid minut 44 i pass 9. Var och en läser sin början högt, eller en mening ur den, och de andra säger var de är med och vad de undrar. Sedan väljer var och en om hen ändrar sin början."
            - rubrik: Frågan medan eleven skriver
              text: "Det här gör du under Skriv i varje pass. Läs en mening över axeln och ställ en enda fråga ur kortet, oftast ”Hur känns det?”, och från pass 8 också ”Vad märker hen först?” Eleven svarar och väljer om svaret ska med i berättelsen. Skriv frågan på bladet Det jag hör."
            - rubrik: Två sätt i era texter
              text: "Vid minut 52 i pass 3 stoppar du skrivandet i två minuter och berättar om två sätt som du ser att eleverna skriver på, utan att peka ut någon: ”Många berättar vad som händer, några också hur det känns.” Var och en väljer hur hen skriver vidare. Före pass 5 och 9 skriver du själv två korta versioner på tavlan, en som liknar det många skrev och en med det som fattades, som ”Sedan gick vi hem.” och ”Jag hoppade så högt att mössan trillade av.” Ingen av dem är en elevs berättelse."
            - rubrik: Två texter halvvägs
              text: "Det här gör ni mitt i berättelsen, vid minut 41 i pass 4. Paret har samma plan. Var och en läser sin berättelse högt för den andra och frågar: ”Vad har du med som jag inte har?” Var och en tar med en sak eller säger varför inte."
            - rubrik: Läsaren halvvägs
              text: "Det här gör ni mitt i berättelsen, vid minut 20 i pass 10. Skribenten läser det hen har skrivit för en läsare ur det andra paret, som säger var i berättelsen hen var med och vad hen undrar. Skribenten väljer vad hen skriver härnäst, och läsaren letar i sin egen berättelse efter ett ställe där det går för fort. Med två elever är du läsaren."
            - rubrik: Före och efter
              text: "Det här gör ni i pass 11, när den nya korta berättelsen är klar. Eleven lägger sina två korta berättelser bredvid varandra, och paren frågar varandra: ”Vad gör du nu som du inte gjorde då? Vad gör du redan från början nästa gång?”"
            - rubrik: Reglerna
              text: "Fråga vad varje berättelse gör för läsaren. Ingen frågar vilken som är sämst. Du visar en elevs hela berättelse för gruppen bara om eleven säger ja. Ett grepp mitt i berättelsen tar högst fem minuter. Har gruppen fler än sex elever, delar ni er på två bord under Alla svar på bordet och Starterna runt bordet. Vid det andra bordet har en elev kortet och leder."
    - rubrik: "Till läraren: lapparna"
      text:
        - "Eleverna planerar varje berättelse med lappar. På varje lapp står en sak i planen, med några ord eller en kort mening. Lapparna går att flytta, lägga åt sidan och lägga i ordning, och därför syns elevens val på bordet."
      delar:
        - rubrik: Lapparna
          falt:
            - rubrik: Så gör du dem
              text: "Skriv ut arket Lapparna, som står bland mallarna sist i materialet. Klipp längs linjerna, så blir det arton lappar. Ett ark räcker till ett par i ungefär tre pass. Från pass 3 lägger du lapparna i en hög på bordet. Efter passet fäster du parens lappar på bladet Planen."
            - rubrik: Den första lappen
              text: "På den skriver eleverna vad de vill att läsaren ska känna, en enda sak: ”Vera ska skratta” eller ”De ska rysa”."
            - rubrik: Det som händer
              text: "På var och en av de andra lapparna står en händelse: ”Påsen rör på sig”, ”Kaninen gömmer sig” och ”Det börjar åska”. Eleverna skriver fler än de behöver, så att det finns något att välja bort. Det som läsaren inte vill vara med om lägger de i rutan Åt sidan på bladet Planen, och de andra lapparna lägger de i ordning."
            - rubrik: Nya lappar
              text: "När läsaren har frågat i delen Säg skriver skribenten sitt svar på en ny lapp: ”Svettiga händer”. Det eleverna tar reda på till nästa pass blir också en lapp. I pass 8 är det något de hörde vid platsen: ”Det surrar i en fläkt”."
            - rubrik: Ett exempel
              text: "Dina sex lappar från visningen i pass 3 står i manuset under Visningen, vecka 2. Bilderna På bordet för vecka 2 och vecka 4 visar hur lapparna ligger på bladet Planen."
    - rubrik: Kortet Läsarens frågor
      sagoform: { form: kort }
      text:
        - "Läsaren har frågorna framför sig när skribenten berättar, och frågar bara det hen inte fick veta. När skribenten har läst upp sin berättelse svarar läsaren med de tre svarsraderna."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Skriv ut ett kort per par, och ett per elev från pass 8. Klipp längs de streckade linjerna, utom den i mitten, och vik där. Från pass 6 får läsaren också fråga ”Hur märker läsaren det?”, och från pass 8 ”Vad märker hen först?”"
      listor:
        - rubrik: Läsaren frågar
          rader:
            - ["Vem är det, och var?"]
            - ["Vad händer?"]
            - ["Hur känns det?"]
            - ["Hur går det?"]
        - rubrik: Läsaren svarar
          rader:
            - ["Nu vet jag ___"]
            - ["Här var jag med: ___"]
            - ["Nu undrar jag ___"]
    - rubrik: Intervjun
      text:
        - "Fråga er yngre elev, och skriv några ord vid varje fråga. Läs sedan upp svaren och fråga: Stämmer det?"
      huvud:
        - rubrik: Vi som frågar
        - rubrik: Vi intervjuar
      delar:
        - rubrik: Intervjun
          falt:
            - rubrik: Vad tycker du om att göra?
            - rubrik: "Vilket djur eller vilken sak gillar du?"
            - rubrik: Vad är det roligaste du vet?
            - rubrik: Vad är lite läskigt?
            - rubrik: Vem ska berättelsen handla om?
    - rubrik: En gång när
      sagoform: { form: sida, titel: En gång när, radMm: 11 }
      text:
        - "Välj ett av de tre förslagen, och skriv en berättelse till din lärare om den gången."
      huvud:
        - rubrik: Berättelse till
        - rubrik: Från
        - rubrik: En gång när jag
      delar:
        - rubrik: Berättelsen
          falt:
            - { rubrik: Min berättelse, text: "" }
    - rubrik: Mitt mål
      text:
        - "Skriv ett mål i taget. När målet syns i din berättelse skriver du ett nytt under. Efter varje berättelse skriver du vad du tar med dig till nästa, och när nästa berättelse börjar läser du det först."
      huvud:
        - rubrik: Namn
      delar:
        - rubrik: När jag skriver
          falt:
            - rubrik: När det tar emot säger jag
            - rubrik: Mina mål
            - rubrik: Det här tar jag med mig
    - rubrik: "Till läraren: de korta berättelserna"
      text:
        - "De korta berättelserna i pass 1 och pass 11 visar vad eleven gör utan stöd, och de går till dig. Här står också hur du svarar på berättelserna i hela kursen och hur eleven räknar när hen fyller i sin stapel."
      delar:
        - rubrik: De korta berättelserna
          falt:
            - rubrik: Uppgiften
              text: "Säg samma ord i pass 1 och pass 11, och skriv dem på tavlan: ”Välj ett av de tre förslagen, och skriv en berättelse till mig om den gången. Jag var inte där.” Säg inget om vad berättelsen ska innehålla. På tavlan står bara uppgiften och de tre förslagen. Papper ligger framme för den som vill planera, och i pass 11 också lappar."
            - rubrik: Förslagen i pass 1
              text: "Förslagen är ”En gång när jag blev rädd”, ”En gång när jag hade otur” och ”En gång när jag blev överraskad”, i den ordningen. Eleven skriver sitt val på raden En gång när jag, på bladet En gång när."
            - rubrik: Förslagen i pass 11
              text: "Förslagen är ”En gång när jag blev arg”, ”En gång när jag kom för sent” och ”En gång när jag blev stolt”, i den ordningen. Säg efter uppgiften vilket förslag som är elevens: det som står på samma plats som det hen valde i pass 1. Då är de två berättelserna av samma slag. Hen skriver med samma verktyg som då, för hand, på dator eller genom att diktera."
            - rubrik: Så svarar du
              text: "Skriv tre svarsrader på varje berättelse: Nu vet jag, Här var jag med och Nu undrar jag. Under Nu undrar jag skriver du en av kortets frågor, den som berättelsen inte svarar på. Ett svar kan lyda: ”Nu vet jag att du fastnade i hissen. Här var jag med: när lampan slocknade. Nu undrar jag hur det känns att stå där i mörkret.” En berättelse tar tre till fem minuter. Efter pass 4, 8 och 10 tar tio berättelser omkring en timme."
            - rubrik: När du svarar
              text: "Den korta berättelsen svarar du på till pass 2. Efter pass 4 skriver du också ”Hur märker läsaren det?” vid ett ställe där en känsla bara sägs, och efter pass 8 och pass 10 ”Vad märker hen först?” där det går för fort. I spökberättelsen frågar du aldrig vad det läskiga var. Ditt svar på berättelsen från pass 11 får eleven när gruppen samlas igen."
            - rubrik: Så räknar ni
              text: "Från pass 6 sätter eleven ett streck i kanten vid det hen räknar och fyller i sin stapel, som det står under diagrammet. En känsla som bara sägs ger ingen ruta, och ”Sedan gick vi hem” svarar inte på Hur går det? Rutan för det som händer fyller eleven i när läsaren får veta vad personen märker eller prövar innan det är över. I åk 6–7 räknar ni en tanke som ett ställe där det märks hur det känns."
            - rubrik: Efter pass 11
              text: "I pass 11 räknar eleven den första korta berättelsen utan tillägget från pass 2, som står under strecket. Efter passet läser du berättelserna och rättar staplarna om de inte stämmer. En ruta mer eller mindre säger inte mycket. Se efter vad eleven gör nu som hen inte gjorde då, också i spökberättelsen. Visa berättelserna och diagrammet för klassläraren."
    - rubrik: Det jag hör
      text:
        - "Skriv ut ett blad per vecka. Ha det i handen medan paren planerar, berättar och skriver. Skriv elevens namn och det hen säger medan du lyssnar. Ringa in det eleven sa utan att du frågade. Efter passet fyller du i Till nästa pass."
      huvud:
        - rubrik: Vecka, och eleverna jag lyssnar särskilt på
      delar:
        - rubrik: Det jag hör
          falt:
            - rubrik: Läsaren nämns
            - rubrik: Något läggs åt sidan eller läggs till för läsarens skull
            - rubrik: Den som kör fast säger vad hen gör
            - rubrik: Frågan jag ställde under Skriv
            - rubrik: Till nästa pass
    - rubrik: Till läraren i den yngre klassen
      text:
        - "Ge bladet till läraren i den yngre klassen före kursen. Skriv in antalet barn, rummet, dagarna och klockslagen först. Intervjun börjar 5 minuter in i pass 2, och läsbesöket 45 minuter in i pass 6. Vik undan de här raderna innan du lämnar bladet."
      delar:
        - rubrik: Till dig som har barnen vi berättar för
          falt:
            - rubrik: Det vi ber dig om
              text: "Eleverna i vår skrivkurs övar på att berätta för någon som lyssnar. Två och två intervjuar de ett av dina barn och skriver sedan var sin berättelse till just det barnet. Vi behöver ________ barn två gånger, en kvart varje gång, i rum ________. Du behöver bara välja barnen. Säg till om vi ska hämta och lämna dem."
            - rubrik: "1. Intervjun, den ________ klockan ________"
              text: "Eleverna frågar vad barnet tycker om att göra, vad som är roligt, vad som är lite läskigt och vem berättelsen ska handla om. Välj gärna barn som tycker om att prata."
            - rubrik: "2. Läsbesöket, den ________ klockan ________"
              text: "Samma barn kommer tillbaka och får höra berättelserna som eleverna har skrivit till dem. Eleverna frågar vad barnet minns bäst och vad hen undrar. Vill barnen rita något ur berättelsen efteråt, får vi gärna teckningarna."

