      - - En mapp per elev, skrivpapper, färgpennor och gem
        - En mapp per elev
        - "Varje pass. Eleven skriver på varannan rad, så att det läsaren saknar går att skriva in"
      - - Ett blädderblock och häftmassa, eller en dator med projektor
        - Till gruppen
        - "Din berättelse (pass 3 och 4), gruppens berättelse (pass 5), listan över hur en känsla märks (från pass 6), reglerna (från pass 7) och listan över det läskiga (från pass 8)"
      - - "Ett lakan, en kudde, två ficklampor och ett rum som går att göra mörkt"
        - Till gruppen
        - "Pass 12. Hur ni bygger läsplatsen står under Spökläsningen, vecka 6"
      - - "En dator eller platta med elevens skrivstöd"
        - "En per elev som skriver bäst så"
        - "I delen Skriv. Bestäm före kursen, med klassläraren, hur varje elev skriver"
    not: "Allt du skriver ut står under Kursens material och i planeringsmallarna."

urval:
  rubrik: Var hittar du texterna och läsarna?
  text:
    - "Texterna står under Kursens material, direkt efter sidan för den vecka de hör till. Mentortexterna är de två berättelser ni har som förebild: Kaninen i gympapåsen i vecka 1, som är skriven till Vera, sju år, och Krok nummer tretton i vecka 4, som är skriven till lyssnarna på en spökläsning. Du kan byta texterna mot egna. Då behöver du två korta texter om samma sak, och en berättelse där du kan säga vem den är skriven till."
    - "De yngre eleverna går i förskoleklass eller på lågstadiet, och i tabellen Åk 4–5 och åk 6–7 står vilka som passar. Be deras lärare om två saker före kursen, och ge hen bladet Till läraren i den yngre klassen. I pass 2 kommer ett barn till varje par, och paret intervjuar barnet i en kvart. I pass 6 kommer samma barn på läsbesök och får höra berättelserna. Eleverna bjuder själva in lyssnarna till spökläsningen i pass 12. Vilka de bjuder in, och hur många, står under Spökläsningen, vecka 6."
  kravText: "Spökberättelsen har tre regler, som du skriver på blädderblocket till pass 7:"
  krav:
    - rubrik: "En plats som alla känner"
      text: "Lyssnarna har gått där, och eleven får gå dit själv på en rast och lyssna"
    - rubrik: "Ingen pekas ut"
      text: "Ingen som finns på riktigt är den läskiga eller råkar illa ut, och platsen är ingens hem eller arbetsrum"
    - rubrik: "Det går bra till slut"
      text: "Den som berättelsen handlar om klarar sig"

uppfoljning:
  text: "Du ser om kursen hjälper i det du hör och i det eleven skriver. Läsarnas svar står under berättelserna, och eleven följer sina berättelser i diagrammet."
  rader:
    - nar: Varje pass
      vad: Skriv vad två eller tre elever säger, på bladet Det jag hör.
    - nar: "Pass 6, 8 och 11"
      vad: "Eleven fyller i diagrammet och ser om målet syns."
    - nar: Pass 1 och 11
      vad: "Ni lägger de korta berättelserna bredvid varandra."
    - nar: Efter kursen
      vad: "Eleven skriver Uppgift 1 efter fyra till sex veckor, och du svarar. Fråga klassläraren om eleven säger vem som läser."

mal:
  rubrik: "Mål: det eleven gör efter kursen"
  text: "Efter kursen gör eleven oftare det här:"
  punkter:
    - Säger vem som ska läsa och vad läsaren ska känna, innan hen skriver
    - Väljer det läsaren vill vara med om, och lägger något annat åt sidan
    - Visar hur det känns, så att läsaren inte behöver fråga
    - "Stannar kvar i det som händer, så att det inte är över på en mening, och säger hur det går"
    - Jämför sin berättelse med en annan och säger vad hen tar med sig till nästa gång
    - Känner igen en uppgift som ber om en berättande text

checklista:
  rubrik: Checklista inför kursen
  punkter:
    - "Be först en lärare i en yngre klass om intervjun och läsbesöket."
    - "Bestäm vilka som ska vara med, och sätt ihop paren."
    - "Skriv ut En gång när, Intervjun och texterna om bollen till pass 1."
    - "Läs Texttyper i grupp, och öva högt på det du visar i vecka 2."
    - "Klipp lappar till pass 3, och bestäm varje elevs skrivstöd."
    - "Boka ett mörkt rum som rymmer lyssnarna till pass 12, och dagen då ni samlas igen."

grund:
  text: "Kursen bygger på en skrivstrategi i steg, som börjar med läsaren. Läraren visar strategin och tänker högt, och tar sedan bort stödet lite i taget (Harris och Graham, 2017; Fohlin och Wilson, 2027). I en svensk studie i åk 3 och 4 hade de flesta berättelserna ett problem, men det löstes efter en till tre meningar. Att bara jämföra två versioner av samma berättelse ändrade inte elevernas egna texter. När läraren också riktade samtalet mot det som skilde versionerna åt, blev elevernas berättelser mer utvecklade (Thorsten, 2019). I en italiensk studie i åk 4 skrev eleverna om något de själva hade varit med om. Nästan alla texter hade en början, en händelse och ett slut. De elever som under femton veckor fick lära sig att lyfta fram det viktiga, med ord, känslor och egna tankar, skrev längre och bättre texter, också tre månader senare (Gelati och Boscolo, 2009). I en svensk studie i åk 5 var en liten ökning av textkvaliteten borta efter tre till fyra månader (Grenner, 2021). Därför samlas gruppen en gång till efter kursen. Att det läskiga ska vänta och aldrig synas helt är råd från författare och lärare."
  kallor: "Bygger på Harris och Graham (2017), Thorsten (2019), Gelati och Boscolo (2009), Grenner (2021) och Fohlin och Wilson, Skriv! (utkommer 2027)."

exempel:
  rubrik: "Exempel: så går pass 7 till"
  valt:
    rubrik: Gruppen
    text: "Fyra elever i åk 5, vecka 4, pass 7. Paren är Alma och Idris, och Tyra och Leo. I pass 6 läste de sina berättelser för Noel och Juni i förskoleklassen. I dag börjar de på spökberättelsen. Läraren lyssnar särskilt på Idris och Tyra."
  text:
    - "Läs som läsaren. På tavlan står en mening ur gruppens berättelse: ”Hunden gömde sig under bordet.” På läsbesöket undrade Juni varför. Leo läser meningen som Juni: ”Nu vet jag att hunden gömde sig. Nu undrar jag varför.” Alla skriver en ny mening som svar, och de lägger meningarna bredvid varandra. Läraren frågar vilken som ger Juni mest. Alma pekar på Tyras mening, ”Den hade ätit upp hela mackan, och nu slickade den sig om nosen”, och säger: ”Nu ser man hunden.” Var och en gör sin egen mening bättre."
    - "Visa och pröva. Läraren säger att nästa berättelse är en spökberättelse och har nya läsare, och läser Krok nummer tretton högt. Hen visar de tre reglerna på blädderblocket och säger sin egen plats: ”Trappan ner till källaren. Alla här har gått i den.” Hen sätter upp tre lappar: ”Vi hämtar stolar”, ”Lampan slocknar” och ”Någon andas där nere”. Tyra säger: ”Lägg stolarna åt sidan. De vill inte höra om stolar.” Läraren frågar: ”Om berättelsen gick till Noel och Juni i stället, vilka lappar låg kvar då?” Leo säger: ”Inte den om att någon andas. De skulle inte våga gå ner dit sedan.”"
    - "Tänk och planera. Först ringar var och en in det som den yngre eleven mindes bäst. Ur Idris berättelse mindes Noel ”när skorna flög”. Läraren frågar: ”Vad gjorde du just där?” Idris säger: ”Jag stannade kvar. Det tog tre meningar.” Han skriver det under Det här tar jag med mig, på bladet Mitt mål. Alma och Idris enas om förrådet bakom gympasalen och skriver på den första lappen: ”De ska rysa.” De skriver fyra lappar med sådant som händer. Var och en pekar på den lapp hen själv skulle lägga åt sidan. Idris pekar på lappen ”Vi byter om till gympan” och säger: ”Vill de vara med om det? Det gör de ju varje vecka.” Alma pekar på samma lapp och säger: ”Vi börjar när lampan blinkar.” Idris lägger lappen åt sidan. Sedan håller han upp lappen ”Dörren går i lås” och säger: ”Till Noel hade vi lagt bort den här också. Han skulle inte våga gå på gympan sedan.” Läraren säger: ”Just det. Nu lyssnar de som kommer på spökläsningen, och de vill rysa.”"
    - "Säg. Alma berättar för Leo ur det andra paret. Leo har kortet och frågar: ”Hur känns det när bollarna rullar?” Alma svarar: ”Det blir kallt i nacken, fast det är varmt där inne.” Läraren säger: ”Det du svarade nu ska med i berättelsen.” Alma skriver ”kallt i nacken” på en ny lapp. Sist säger Leo första meningen i sin egen berättelse: ”Det luktar alltid sågspån utanför slöjdsalen.”"
    - "Skriv. Var och en skriver början på sin berättelse. Tyra sitter stilla och säger: ”Jag vet inte hur jag ska börja. Jag tittar på tavlan. Vem läser? De som kommer på spökläsningen.” Hon skriver: ”Du har säkert gått förbi dörren vid slöjdsalen.” Leo dikterar på datorn och säger till Tyra: ”Jag börjar med lukten, för den känner alla igen.” Läraren läser Idris första mening över axeln, ”Vi skulle hämta bollar i förrådet”, och frågar: ”Var är vi?” Idris svarar: ”Bakom gympasalen, där det alltid är mörkt.” Han skriver in det. När de slutar skriva har Tyra fem meningar och Leo nio."
    - "Läs upp. Paren säger vad de tar reda på till nästa pass. Idris säger: ”Vi går till förrådet och lyssnar. Och luktar.” Läraren ger varje par tre lappar att ta med."
    - "På bladet Det jag hör står efter passet: Läsaren nämns: Leo, ”den känner alla igen”, utan att jag frågade. Lagt åt sidan eller lagt till: Idris, ”Det gör de ju varje vecka”, och Almas lapp ”kallt i nacken”. Kör fast: Tyra, ”Jag tittar på tavlan.” Frågan under Skriv: till Idris, ”Var är vi?” Till nästa pass: Idris berättar i Säg."

ramar:
  rubrik: Kursens material
  text:
    - "Först kommer veckans sida, en för varje vecka, och direkt efter den kommer veckans material, som texterna, sidan om strukturen med tärningarna, manuset till din visning och sidan om läsbesöket. Sedan kommer det som används i flera veckor: sidan om återkopplingen, sidan om lapparna, kortet Läsarens frågor och bladen. Arket Lapparna, bladet Planen och diagrammet Mina texter står sist, bland mallarna."
  ramar:
    # ---------------------------------------------------------------- Veckorna
    - rubrik: "Till läraren: veckorna"
      lektioner: true
      text:
        - "Varje vecka har en egen sida, veckans sida. Överst står veckans fokus, och i vecka 2 till 5 dagens mening till Läs som läsaren. Sedan kommer de två passen och sist det du ska lägga märke till. De grepp för återkoppling som passen nämner, till exempel Starterna runt bordet och Två texter halvvägs, står under Till läraren: återkopplingen. När en berättelse är klar skriver eleven på bladet Mitt mål vad hen tar med sig, och när nästa berättelse börjar läser hen det först. Mellan passen svarar du på de korta berättelserna efter pass 1 och 11 och på berättelserna efter pass 4, 8 och 10, och före pass 5 och 9 skriver du två korta versioner till Två sätt i era texter. Har gruppen gått en annan kurs i serien, läser eleven i pass 1 sitt sista mål och säger vad hen känner igen i den nya berättelsen, och du kortar visningen i pass 3."
      delar:
        - rubrik: "Vecka 1 · Läsaren"
          falt:
            - rubrik: Fokus
              text: "Eleven läser som läsaren och säger vad hen vet och vad hen undrar, och paret möter sin yngre elev."
            - rubrik: Pass 1
              text: "0–⁠5 min. Kursen: ni ska berätta för läsare som ni träffar. Fråga ”Vad gör en berättelse bra?”, och spara svaren till pass 12.\n5–⁠20 min. Säg uppgiften med orden under Till läraren: de korta berättelserna. Eleven väljer ett förslag och skriver till dig, i tio minuter utan stöd.\n20–⁠32 min. Två texter, vecka 1: Bollen på taket. Visa elevens sida, och ställ frågorna under texterna. Säg sedan: båda är berättande texter, och den andra låter läsaren vara med.\n32–⁠45 min. Strukturen, vecka 1: Berätta mera!, med berättartärningarna. Följ stegen på sidan.\n45–⁠56 min. Intervjun: läs frågorna på bladet. De två i paret övar på varandra, och den som frågar skriver några ord vid varje fråga.\n56–⁠60 min. Läs upp: var och en säger en sak som hen vill veta om sin yngre elev."
            - rubrik: Pass 2
              text: "0–⁠5 min. Läs som läsaren, första gången: du har båda rollerna, med meningen ”Det hände något konstigt i matsalen.” Säg: ”Nu vet jag att något hände. Nu undrar jag vad.”\n5–⁠20 min. Intervjun: de yngre eleverna kommer. Den ena i paret frågar, och den andra skriver. Sist läser paret upp svaren och frågar ”Stämmer det?”\n20–⁠35 min. Dela ut kortet Läsarens frågor, och läs berättelsen till Vera högt. Gruppen läser den som Vera och svarar på bladets frågor.\n35–⁠50 min. Ge tillbaka de korta berättelserna, med dina tre svarsrader. Eleven drar ett streck under sin och skriver minst tre meningar om det du undrade.\n50–⁠60 min. Målet: eleven föreslår ett mål ur det du undrade, som ”Jag visar hur det känns”, och skriver det på bladet Mitt mål."
            - rubrik: Lägg märke till
              text: "Eleven som säger att en bra berättelse är en lång berättelse.\nEleven som säger vad Vera undrar utan att du frågar."
        - rubrik: "Vecka 2 · Du visar"
          falt:
            - rubrik: Fokus
              text: "Eleven hör dig välja för läsarens skull och gör samma sak i paret."
            - rubrik: Dagens mening
              text: "Pass 3: ”Mitt på skolgården stod en gul grävmaskin.”, ur din berättelse. I pass 4 läser alla sin början i stället."
            - rubrik: Pass 3
              text: "0–⁠5 min. Läs som läsaren. Från och med i dag skriver alla en mening som svar.\n5–⁠20 min. Visa de tre första stegen och börja skriva, med manuset under Visningen, vecka 2.\n20–⁠35 min. Paren planerar för sin yngre elev, med lappar och bladet Intervjun. På den första lappen skriver de vad hen ska känna, och på de andra något som händer.\n35–⁠41 min. Säg. Sist säger läsaren första meningen i sin egen berättelse. Paret bestämmer en sak att ta reda på till nästa pass, helst det läsaren frågade om.\n41–⁠60 min. Skriv: var och en skriver början. Vid minut 52, Två sätt i era texter: ”Många berättar vad som händer, några också hur det känns.”"
            - rubrik: Pass 4
              text: "0–⁠5 min. Starterna runt bordet: var och en läser sin början.\n5–⁠15 min. Visa och pröva: skriv vidare på blädderblocket. Fråga ”Vad sa jag när jag körde fast?” Eleven skriver på Mitt mål en mening för när det tar emot.\n15–⁠19 min. Tänk och planera. Det paren har tagit reda på blir en ny lapp. Fråga ”Var i berättelsen hör den hemma?”\n19–⁠25 min. Säg. Den som inte berättade i pass 3 berättar.\n25–⁠57 min. Skriv. Var och en skriver tills varje lapp är med. Vid minut 41, Två texter halvvägs: ”Vad har du med som jag inte har?”\n57–⁠60 min. Läs upp. Två elever berättar om ett val."
            - rubrik: Lägg märke till
              text: "Eleven som säger de fyra stegen utan att titta på bladet.\nEleven som säger ”för hon” eller ”för han” om läsaren."
        - rubrik: "Vecka 3 · Gruppens text"
          falt:
            - rubrik: Fokus
              text: "Gruppen skriver till de yngre eleverna, och eleven visar hur det känns."
            - rubrik: Dagens mening
              text: "Pass 5: dina två versioner. Pass 6: ”Hon blev glad.”"
            - rubrik: Pass 5
              text: "0–⁠5 min. Två sätt i era texter: ”Vad gör den andra versionen för läsaren?”\n5–⁠15 min. Säg ”Jag skriver, ni tänker.” Med intervjubladen framme skriver varje par tre lappar, och gruppen väljer början och lägger minst en lapp åt sidan.\n15–⁠23 min. En elev har kortet och är läsaren. Eleverna säger varje mening innan du skriver den, fram till där det går snett.\n23–⁠50 min. Skriv: var och en skriver fortsättningen själv, alltså vad personen prövar först, som inte går, och hur det går sedan.\n50–⁠55 min. Var och en läser sin text för kamraten. Gruppen hör två och väljer en.\n55–⁠60 min. Läs berättelsen och fyll i en stapel på tavlan. Skriv in fortsättningen efter passet."
            - rubrik: Pass 6
              text: "0–⁠5 min. Läs som läsaren.\n5–⁠15 min. Visa och pröva: Två texter, vecka 3, som rutan Till läraren säger. Sedan gör gruppen samma sak med ”Han blev rädd.”\n15–⁠18 min. Tänk och planera: eleven läser Mitt mål och stället med din fråga.\n18–⁠23 min. Säg. Eleven berättar det stället för en läsare ur ett annat par.\n23–⁠45 min. Skriv. Eleven bygger ut stället, skriver klart och läser berättelsen för kamraten, som säger var hen var med. Sist fyller eleven i stapeln Yngre eleven.\n45–⁠60 min. Läs upp blir läsbesöket: följ sidan Läsbesöket, vecka 3.\nEfter passet. Ge elevernas klasslärare ett blad Planen med tavlans tre rader."
            - rubrik: Lägg märke till
              text: "Eleven som säger hur det märks, som ”hon biter på tröjärmen”, när läsaren frågar hur det känns. Skriv orden på blädderblocket, under frågan ”Hur märker läsaren det?”\nEleven som visar en känsla i varje mening. Fråga var läsaren ska vara med mest."
        - rubrik: "Vecka 4 · Parens text"
          falt:
            - rubrik: Fokus
              text: "Paret väljer en känd plats och stannar kvar i det som händer: det läskiga får vänta."
            - rubrik: Dagens mening
              text: "Pass 7: meningen barnen undrade över. Pass 8: första meningen i Två texter, vecka 4."
            - rubrik: Pass 7
              text: "0–⁠5 min. Läs som läsaren.\n5–⁠15 min. Visa och pröva: läs Krok nummer tretton högt. Visa reglerna och tre lappar för din plats, och gruppen lägger en åt sidan.\n15–⁠27 min. Tänk och planera. Från och med nu lyssnar du innan du frågar vem som läser. Var och en skriver vad hen tar med sig: det hen gjorde där den yngre eleven var mest med. Paret enas om en plats, och var och en pekar på en lapp att lägga åt sidan.\n27–⁠57 min. Säg och Skriv, som i passets tabell.\n57–⁠60 min. Läs upp. Varje par får tre lappar till platsen, för ljud, lukter och det som känns."
            - rubrik: Pass 8
              text: "0–⁠5 min. Läs som läsaren.\n5–⁠15 min. Visa och pröva: Två texter, vecka 4. Ställ frågorna under texterna. Gruppen säger sedan vad som hörs först på din plats, och det blir en ny lapp.\n15–⁠19 min. Tänk och planera. Paren väljer lappen där lyssnarna ska rysa mest. Före den lägger de lapparna från platsen. Den som inte var där blundar och säger tre ljud.\n19–⁠25 min. Säg. Den andra i paret berättar, och läsaren får fråga ”Vad märker hen först?” Frågan ”Vad var det?” får inget svar.\n25–⁠57 min. Skriv, tills varje lapp är med. Från minut 52 läser eleven för läsaren, som ringar in ett ställe. Eleven fyller i sin stapel och skriver vad hen tar med sig.\n57–⁠60 min. Läs upp. Fråga ”Vilken text skriver du i klassen nu? Vem läser den?”"
            - rubrik: Lägg märke till
              text: "Eleven som inte själv har sagt varför en lapp läggs åt sidan. Hen behåller parets plats i pass 9.\nEleven som låter något höras eller skymta innan det syns."
        - rubrik: "Vecka 5 · Egen text"
          falt:
            - rubrik: Fokus
              text: "Eleven gör alla fyra stegen själv, med kamraten som läsare."
            - rubrik: Dagens mening
              text: "Pass 9: dina två versioner. Pass 10: ”Sakta, sakta sänkte han skopan.”"
            - rubrik: Pass 9
              text: "0–⁠5 min. Två sätt i era texter, ur pass 8: ”Vad gör den andra versionen för läsaren?”\n5–⁠12 min. Visa och pröva. Visa hur din plan från pass 7 blir en lista på tomt papper. Gruppen väljer vilken händelse du ska stryka och säger varför. I åk 6–7 visar du också hur en tanke låter: ”Det är bara vinden, tänkte jag.”\n12–⁠26 min. Tänk och planera. Eleven läser det hen tog med sig, skriver ett nytt mål ur dina svarsrader och överst i planen vem hen bjuder in. Hen väljer en egen plats och planerar med lappar, eller som en lista om hen sa sitt val själv i vecka 4. Den som behåller parets plats byter en händelse mot en egen.\n26–⁠32 min. Säg. Alla berättar för kamraten, tre minuter var.\n32–⁠57 min. Skriv. Vid minut 44, Starterna runt bordet: alla läser en mening.\n57–⁠60 min. Läs upp. Fråga ”Vad behöver du lyssna efter på din plats till nästa pass?”"
            - rubrik: Pass 10
              text: "0–⁠5 min. Läs som läsaren. Fråga hur det gick med texten i klassen.\n5–⁠38 min. Eleven skriver klart, med det hen har hört eller sett vid platsen. Berättelsen tar högst två minuter att läsa högt. Vid minut 20, Läsaren halvvägs.\n38–⁠47 min. Skribenten läser för kamraten, som ringar in stället där hen var mest med och säger svarsraderna. Skribenten svarar, men aldrig vad det läskiga var.\n47–⁠53 min. Paret prövar berättelserna mot reglerna och läser dem för en ny kamrat.\n53–⁠60 min. Inbjudan. Är berättelsen inte klar, säger eleven sitt slut, och du skriver det.\nEfter passet. Gör det som står under Före passet på sidan Spökläsningen, vecka 6."
            - rubrik: Lägg märke till
              text: "Eleven som börjar skriva utan plan.\nEleven som säger sitt val utan att du frågar."
        - rubrik: "Vecka 6 · Svaren"
          falt:
            - rubrik: Fokus
              text: "Eleven ser vad hen gör nu, känner igen texttypen i en uppgift och läser för sina lyssnare."
            - rubrik: Pass 11
              text: "0–⁠13 min. Säg uppgiften som i pass 1, med de nya förslagen under Till läraren: de korta berättelserna. Se vem som planerar innan hen skriver.\n13–⁠20 min. Före och efter: eleven lägger de två korta bredvid varandra och fyller i en stapel för vardera, den första utan tillägget. Paren frågar varandra ”Vad gör du nu som du inte gjorde då?”\n20–⁠25 min. Ta fram Krok nummer tretton och berättelsen till Vera. Fråga ”Båda är berättande texter. Vad har båda?”\n25–⁠35 min. Uppgifterna: visa elevens sida, och ställ frågorna under uppgifterna.\n35–⁠48 min. Skriv: eleven bygger ut stället där du har skrivit ”Vad märker hen först?” och stryker en mening där inget händer.\n48–⁠60 min. Eleven fyller i stapeln för spökberättelsen. Två par övar ihop, och var och en läser sin. Fråga vem som läser själv i pass 12."
            - rubrik: Pass 12
              text: "0–⁠10 min. Bygg läsplatsen tillsammans, som det står under Spökläsningen, vecka 6. Var och en säger sin första mening under lakanet, med ficklampan.\n10–⁠45 min. Spökläsningen: lyssnarna kommer, och du släcker. En i taget läser under lakanet. Efter varje berättelse säger lyssnarna var de var med och vad de undrar, och du skriver det på ett papper med elevens namn.\n45–⁠60 min. Tänd och tacka lyssnarna. Eleven fäster sitt papper under berättelsen och skriver på Mitt mål vad hen tar med sig och nästa mål ur det lyssnarna undrade. Fråga igen ”Vad gör en berättelse bra?” och jämför med svaren från pass 1. Säg när gruppen samlas igen. Kopiera berättelserna med papperen och behåll diagrammet och Mitt mål. Eleven tar hem sin mapp."
            - rubrik: Lägg märke till
              text: "Eleven som säger vem som läser, i en uppgift som hen aldrig har sett.\nEleven som nämner läsaren när du frågar vad som gör en berättelse bra."
    # ---------------------------------------------------------------- Veckans material
    - rubrik: "Två texter, vecka 1: Bollen på taket"
      text:
        - "Läs båda texterna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 1
              text: "Läs båda texterna högt, och ställ frågorna i tur och ordning. Låt paren prata en stund om varje fråga innan ni tar svaren i hela gruppen. Säg sedan att båda är berättande texter, men att den andra låter läsaren vara med."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Händelsen, platsen och hur det går: bollen hamnar på taket, och vaktmästaren hämtar den."
            - rubrik: "2. I vilken är du med?"
              text: "I den andra. Den första räknar upp det som hände i tur och ordning, och två meningar börjar med Sedan."
            - rubrik: "3. Var märker du det?"
              text: "Bollen syns i en hög båge, den ligger kvar på taket, och alla tittar. Texten stannar kvar medan bollen ligger där."
            - rubrik: "4. Hur känns det?"
              text: "Öronen blir varma. Texten säger inte att den som berättar skäms, men läsaren märker det."
      listor:
        - rubrik: Två texter om samma boll
          kolumner:
            - Den första texten
            - Den andra texten
          rader:
            - - "På rasten spelade vi fotboll. Jag sköt bollen på taket. Vaktmästaren hämtade den med en stege. Sedan spelade vi igen. Sedan ringde det in."
              - "På rasten for bollen i en hög båge över målet. Den landade på taket och låg kvar där. Alla tittade på mig. Mina öron blev varma. Då kom vaktmästaren med den långa stegen, och snart studsade bollen på gruset igen."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två texterna?"]
            - ["I vilken av dem är du med om det som händer?"]
            - ["Var i texten märker du det?"]
            - ["Hur känns det för den som berättar? Hur vet du det?"]
    - rubrik: "Strukturen, vecka 1: Berätta mera!"
      text:
