    - rubrik: "Mentortext, vecka 1: Kaninen i gympapåsen"
      text:
        - "Läs berättelsen som Vera, och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 2
              text: "Läs berättelsen högt, och lägg undan den innan eleverna skriver. Den används igen i pass 11."
      listor:
        - rubrik: Kaninen i gympapåsen
          rader:
            - ["Till Vera, sju år, som tycker om kaniner och kurragömma."]
            - ["Veras gympapåse hade ramlat ner från kroken i korridoren. Hon lyfte upp den. Då rörde påsen på sig."]
            - ["Vera stod alldeles stilla. Det prasslade där inne. Två långa öron stack upp ur påsen."]
            - ["Det var Sotis, klassens kanin! Genom dörren såg Vera att buren i klassrummet stod öppen. På golvet framför henne låg en halv morot."]
            - ["”Kom, Sotis”, viskade Vera. Men Sotis hoppade ur påsen och skuttade in under en bänk. Sedan under nästa bänk."]
            - ["Veras händer blev svettiga. Snart skulle det ringa in, och då kom tjugo par fötter springande."]
            - ["Då kom Vera på en sak. Hon lade sitt äpple mitt på golvet och väntade. En nos kom fram. Sedan hela Sotis."]
            - ["När klassen kom in satt Vera med kaninen i knät. Sotis åt äpple, och Vera fick den halva moroten."]
            - ["Maja och Yusuf, 5B"]
        - rubrik: Frågorna
          rader:
            - ["1. Läs berättelsen som Vera. Vem handlar den om, och var är vi?"]
            - ["2. Vad händer? Stryk under det Vera märker först."]
            - ["3. Hur känns det för Vera? Ringa in två ställen där du märker det."]
            - ["4. Hur går det?"]
            - ["5. Vad har Maja och Yusuf valt för just Vera?"]
    - rubrik: "Visningen, vecka 2: Planen och berättelsen"
      text:
        - "I pass 3 visar du de tre första stegen och skriver första meningen, och i pass 4 skriver du vidare. Säg stegens namn medan du gör dem, och peka på dem på bladet Planen. Tre saker ska höras: läsaren först, en lapp åt sidan för läsarens skull, och att du kör fast och säger vad du gör då."
      oversikt:
        kolumner:
          - Du gör
          - Du säger högt
        rader:
          - - "Pass 3. Skriver på tavlan: Sixten, 6 år. Skriver på första lappen: ”Sixten ska skratta”"
            - "”Tänk. Sixten läser. Han gillar grävmaskiner, och han ska skratta. Det skriver jag först.”"
          - - "Skriver tre lappar: ”Vaktmästaren tappar nycklarna”, ”Sixten sänker skopan” och ”Grävmaskinen går sönder”"
            - "”Planera. Jag skriver allt jag kommer på som kan hända. Sedan väljer jag.”"
          - - "Håller upp lappen ”Grävmaskinen går sönder”, och lägger den i rutan Åt sidan"
            - "”Vill Sixten vara med om det? Nej. Han sa att det är läskigt när saker går sönder, och han ska skratta. Den lägger jag åt sidan.”"
          - - "Skriver en lapp till, ”Sixten får tuta”, håller upp den och gör som gruppen säger"
            - "”Vill Sixten vara med om det? Vad säger ni? Varför?”"
          - - "Lägger lapparna i ordning och numrerar dem"
            - "”Var börjar jag? Där Sixten kan se något framför sig: en gul grävmaskin mitt på skolgården.”"
          - - "Berättar för en elev, som har kortet Läsarens frågor"
            - "”Säg. Fråga mig det du inte får veta. Vaktmästaren tappar nycklarna i gropen. Sixten klättrar upp i grävmaskinen och får upp dem.”"
          - - "Svarar eleven, som frågar hur det känns. Pekar annars på kortets tredje fråga. Skriver svaret på en ny lapp: ”Tungan sticker ut”"
            - "”Det pirrar i magen, och tungan sticker ut. Det ska med.”"
          - - "Vänder dig till gruppen, och skriver elevernas svar på tavlan"
            - "”Vad sa jag allra först? Vad gjorde jag med lappen om att grävmaskinen går sönder?”"
          - - "Skriver första meningen på blädderblocket"
            - "”Skriv. Mitt på skolgården stod en gul grävmaskin.”"
          - - "Pass 4. Skriver om nycklarna och Sixten som klättrar upp. Stannar med pennan i luften"
            - "”Nu kör jag fast. Jag tittar på tavlan. Vem läser? Sixten. Vad undrar han? Hur det känns.”"
          - - "Skriver vidare, med den nya lappen"
            - "”Det pirrade i magen, och tungan stack ut ur mungipan. Nu märker Sixten hur det känns.”"
          - - "Skriver slutet och läser hela berättelsen högt"
            - "”Hur går det? Nycklarna kommer upp, och Sixten får tuta. Det var kortets fyra frågor.”"
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 3 och pass 4
              text: "Sixten är ett exempel: han tycker att det är roligt när vuxna gör fel. Byter du honom mot ett barn som du har intervjuat, skriver du egna lappar och en egen berättelse, med dagens mening ur den. Lägger gruppen ”Sixten får tuta” åt sidan, slutar berättelsen när nycklarna kommer upp. Har gruppen fler än sex elever, ritar du de två rutorna från bladet Planen på tavlan och skriver lapparna stort, på halva A4-ark."
            - rubrik: Din text
              text: "Mitt på skolgården stod en gul grävmaskin. Vaktmästaren skulle laga ett rör, men han tappade nycklarna rakt ner i gropen. Plopp, sa det. Då klättrade Sixten upp i grävmaskinen. Det pirrade i magen, och tungan stack ut ur mungipan. Sakta, sakta sänkte han skopan. Upp kom en hög med lera, och överst låg nycklarna. ”Nu får du tuta”, sa vaktmästaren. Och Sixten tutade så att hela skolan hörde det."
    - rubrik: "Två texter, vecka 3: Sara i skogen"
      text:
        - "Läs båda texterna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 6
              text: "Den första texten står på tavlan. Säg: ”Nu vet läsaren att Sara är vilse. Men jag vill att det ska kännas mer. Jag kan visa vad som händer i kroppen.” Skriv den andra texten bredvid, med de tre nya meningarna, och läs den högt. Dela sedan ut elevens sida och ställ frågorna i tur och ordning."
            - rubrik: På tavlan
              text: "Skriv ”Hur märker läsaren det?” vid texterna. Under den skriver du vad de nya meningarna visar: det som händer i kroppen, och det Sara gör och ser. Skriv frågan också överst på blädderblocket, där listan över hur en känsla märks börjar. Sudda texterna innan eleverna skriver, och låt frågan stå kvar. Texterna, frågorna och dina ord kommer ur Skriv! (Fohlin och Wilson, 2027)."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad har den andra?"
              text: "Tre meningar till: hjärtat slår snabbt, Sara vänder sig om, och bakom henne finns bara träd och mörker."
            - rubrik: "2. Vad märker du som läsare?"
              text: "Läsaren blir nyfiken på vad som finns i mörkret och känner det Sara känner. I den första vet läsaren bara att hon är vilse."
            - rubrik: "3. Vad skapar spänning?"
              text: "Eleverna pekar ofta på ”Och mörker”, som står ensamt sist, eller på ”bara träd”."
            - rubrik: "4. Var märks känslan?"
              text: "Det märks i kroppen, på hjärtat som slår, och i det hon gör och ser. Texten säger aldrig att hon är rädd."
      listor:
        - rubrik: Två texter om Sara
          kolumner:
            - Den första texten
            - Den andra texten
          rader:
            - - "Var är jag? Sara stannade mellan träden. Hon kände inte igen stigen längre."
              - "Var är jag? Sara stannade mellan träden. Hon kände inte igen stigen längre. Hjärtat slog snabbt. Hon vände sig om, men bakom henne fanns bara träd. Och mörker."
        - rubrik: Frågorna
          rader:
            - ["Vad har den andra texten som den första inte har?"]
            - ["Vad märker du som läsare? Blir du nyfiken?"]
            - ["Vilket ord eller vilken mening skapar spänning?"]
            - ["Var märker du hur Sara känner sig?"]
    - rubrik: "Läsbesöket, vecka 3: De yngre eleverna lyssnar"
      text:
        - "I pass 6 läser eleverna sina berättelser för de yngre elever som de har intervjuat."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Före besöket
              text: "Barnen kommer när 45 minuter av passet har gått och stannar i en kvart. Bestäm med deras lärare vem som följer dem. Ställ en stol åt barnet hos varje par, och ha gruppens berättelse framme på blädderblocket."
            - rubrik: Gruppens berättelse
              text: "Läs den först, för alla barnen. Fråga ”Vad undrar ni?”, och skriv upp en sak som de undrar och vilken mening i berättelsen det gäller. Den meningen blir dagens mening i pass 7."
            - rubrik: Elevernas berättelser
              text: "Sedan sätter sig varje barn hos sitt par, och var och en i paret läser sin berättelse för barnet. Berättelserna har samma plan, men barnet minns olika saker ur dem. Efter varje berättelse frågar skribenten ”Vad minns du bäst? Vad undrar du?”, och kamraten skriver svaren under berättelsen."
            - rubrik: Om något saknas
              text: "Den som inte är klar läser det som finns och säger resten. Den som inte vill läsa högt låter kamraten läsa och ställer själv frågorna. Är ett barn borta, läser paret för ett annat pars barn, och du ser till att barnet får höra berättelserna efteråt."
            - rubrik: Om barnen går på en annan skola
              text: "Har skolan inga yngre elever, frågar du en förskoleklass eller en etta på en skola i närheten. Gör då intervjun och läsningen med inspelningar, och gör likadant om barnen inte kan komma. Till pass 2 spelar deras lärare in barnens svar på frågorna, och paren lyssnar och skriver. I pass 6 spelar ni in gruppens och elevernas berättelser. Deras lärare spelar upp dem för barnen och spelar in vad de minns och undrar, och det får eleverna höra i pass 7."
    - rubrik: "Två texter, vecka 4: Omklädningsrummet"
      text:
        - "Läs båda texterna som en av lyssnarna på spökläsningen, och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 8
              text: "Läs båda texterna högt, och ställ frågorna i tur och ordning."
            - rubrik: Efteråt
              text: "Börja en lista på blädderblocket över det som gör en berättelse läskig, under frågan ”Vad märker hen först?” Eleverna säger det med egna ord, och du skriver deras ord på listan."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Platsen, den som berättar, början och slutet."
            - rubrik: "2. I vilken hinner du bli rädd?"
              text: "I den andra. I den första syns spöket direkt, och sedan är det över."
            - rubrik: "3. Vad hör och ser du?"
              text: "Först ett ljud, en dusch som droppar, och sedan en skymt av något vitt. Det läskiga får vänta."
            - rubrik: "4. Vad får du aldrig veta?"
              text: "Vad det var bakom draperiet. Den som lyssnar får gissa, och det gör berättelsen läskig."
      listor:
        - rubrik: Två texter om samma omklädningsrum
          kolumner:
            - Den första texten
            - Den andra texten
          rader:
            - - "På måndagsmorgonen gick jag in i omklädningsrummet. Där stod ett spöke. Jag sprang därifrån så fort jag kunde."
              - "På måndagsmorgonen gick jag in i omklädningsrummet. Längst in droppade en dusch. Ingen hade varit där sedan i fredags. Något vitt rörde sig bakom duschdraperiet. Jag sprang därifrån så fort jag kunde."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två texterna?"]
            - ["I vilken av dem hinner du bli rädd?"]
            - ["Vad hör och ser du innan den som berättar springer?"]
            - ["Vad får du aldrig veta?"]
    - rubrik: "Mentortext, vecka 4: Krok nummer tretton"
      text:
        - "Läs berättelsen, och svara på frågorna."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: "Pass 7, 8, 9 och 11"
              text: "Berättelsen utspelar sig i samma korridor som berättelsen till Vera. Läs den högt i pass 7, och ställ fråga 1. Fråga 2 och 3 tar den som är klar tidigt i pass 8, och fråga 4 hör till pass 11. I åk 6–7 visar du i pass 9 meningen med ”tänkte jag”."
      listor:
        - rubrik: Krok nummer tretton
          rader:
            - ["Det var sista dagen före lovet, och alla andra hade gått hem. Korridoren var halvmörk och luktade våta vantar, som alltid."]
            - ["På krok nummer tretton hängde en grå gympapåse. Jag hade aldrig sett den förut."]
            - ["Jag skulle bara hämta min jacka. Då hörde jag det. Ritsch. Som när någon drar i ett snöre."]
            - ["Påsen på krok tretton svängde fram och tillbaka. Min jacka bredvid hängde stilla. Det är bara vinden, tänkte jag. Men fönstren var stängda."]
            - ["Jag ville springa, men benen lydde inte. Snöret gick upp, sakta, av sig självt. Något där inne drog efter andan."]
            - ["Då tändes lamporna. Vaktmästaren stod i dörren. ”Är du kvar?” sa han. ”Krok tretton”, viskade jag och pekade. Där hängde ingen påse."]
            - ["”Tretton?” sa han. ”Den kroken tog vi bort för många år sedan.”"]
            - ["Hela vägen hem räknade jag krokarna i huvudet. Tolv. Fjorton."]
            - ["Maja och Yusuf, 5B"]
        - rubrik: Frågorna
          rader:
            - ["1. Vem ska höra den här berättelsen? Hur märker du det?"]
            - ["2. Vad hör den som berättar innan hen ser något röra sig?"]
            - ["3. Vad får du aldrig veta? Varför, tror du?"]
            - ["4. Jämför med berättelsen till Vera. Båda är berättande texter. Vad har båda?"]
