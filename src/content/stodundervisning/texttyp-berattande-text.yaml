lathund:
  innehall: Läsare som lyssnar
  metoden:
    text:
      - "Kursen är för elever i åk 4–7 som räknar upp det som händer i sina berättelser. Eleven lär sig berätta så att läsaren är med, i fyra steg: Tänk, Planera, Säg och Skriv. Tabellen visar passets delar."
      - "Läsarna är en yngre elev, som paret intervjuar i pass 2 och läser för i pass 6, och lyssnarna på spökläsningen i pass 12. Passen med egna minuter står på sidan Mallen, och stödtrappan i lathunden för Texttyper i grupp."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Nämn läsaren före första ordet.
          text: Läsaren avgör vad som ska med.
        - fet: Lägg åt sidan eller lägg till, för läsarens skull.
          text: Säg varför, så att valet hörs och syns.
        - fet: Kör fast högt.
          text: Säg vad du gör då.
      efter: Först från dig, sedan från eleven. Det är dem du lyssnar efter.
    tabell:
      rubrik: Passets delar · vad du säger
      kolumner:
        - Del
        - Du säger
      rader:
        - - "1 · Läs som läsaren\nAlla svar på bordet"
          - "”Vad vet du nu? Vad undrar du?”\n”Vilken mening ger läsaren mest?”"
        - - "2 · Visa och pröva\nDu tänker högt"
          - "”Vad hörde ni mig säga?”\n”Nu prövar vi samma sak tillsammans.”"
        - - "3 · Tänk och planera"
          - "”Vill läsaren vara med om det?”\n”Vilken lapp lägger ni åt sidan? Varför?”"
        - - "4 · Säg\nEn läsare ur ett annat par"
          - "”Fråga bara det du inte fick veta.”\n”Det du svarade nu ska med i berättelsen.”"
        - - "5 · Skriv\nEn enda fråga"
          - "”Skriv det du sa.”\n”Hur känns det? Skriv det.”"
        - - "6 · Läs upp\nEtt val"
          - "”Vilken lapp lade du åt sidan? Varför?”\n”Vad tar du med dig?”"
    not: "De tre svarsraderna: Nu vet jag, Här var jag med, Nu undrar jag. På läsbesöket frågar eleven ”Vad minns du bäst? Vad undrar du?” På spökläsningen säger lyssnarna var de var med och vad de undrar."
  pass:
    rubrik: "Vi kör ett pass: pass 7 i vecka 4"
    textRubrik: "Gruppen · fyra elever i åk 5 börjar på spökberättelsen"
    text:
      - "På tavlan står en mening ur gruppens berättelse: ”Hunden gömde sig under bordet.” Leo läser den som Juni i förskoleklassen: ”Nu undrar jag varför.”"
      - "Läraren läser Krok nummer tretton och visar reglerna och tre lappar för sin plats. Tyra säger: ”Lägg stolarna åt sidan. De vill inte höra om stolar.”"
      - "Alma och Idris enas om förrådet bakom gympasalen. Idris pekar på lappen ”Vi byter om till gympan”: ”Det gör de ju varje vecka.” Leo ur det andra paret frågar: ”Hur känns det när bollarna rullar?” Alma svarar: ”Det blir kallt i nacken.” Svaret blir en ny lapp."
      - "Läraren frågar Idris över axeln: ”Var är vi?” Tyra kör fast och säger: ”Jag tittar på tavlan. Vem läser?” Sedan skriver hon."
    forberett:
      rubrik: Det jag förberedde
      text:
        - "Jag skrev tavlans tre rader och en mening ur gruppens berättelse. Jag hade Krok nummer tretton, blädderblocket med reglerna och tre lappar för min egen plats. På bordet låg lappar, bladet Planen, kortet och mapparna med svaren från läsbesöket. Jag lyssnade särskilt på Idris och Tyra."
    klarTidigt: "Eleven läser sin början som läsaren, med kortet, och skriver in det läsaren saknar."
    schema:
      rubrik: 60 minuter, minut för minut
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Skriv tavlans tre rader och dagens mening. Lägg fram lappar, bladet Planen, kortet och mapparna.
        - tid: 0–5
          fas: 1 · Läs som läsaren
          vad: En elev läser meningen som läsaren. Alla skriver en ny mening, och ni lägger dem bredvid varandra.
        - tid: 5–15
          fas: 2 · Visa och pröva
          vad: "Läs Krok nummer tretton högt. Visa de tre reglerna och din plan. Gruppen lägger en lapp åt sidan."
        - tid: "15–27"
          fas: 3 · Tänk och planera
          vad: Eleven skriver vad hen tar med sig. Paren enas om en plats och skriver lappar. Var och en pekar på en lapp att lägga åt sidan.
        - tid: "27–33"
          fas: 4 · Säg
          vad: "Två par sätter sig ihop. Skribenten berättar för en läsare ur det andra paret, och svaret blir en ny lapp. Läsaren säger sin egen första mening. Blir ett par över, är du läsaren."
        - tid: "33–57"
          fas: 5 · Skriv
          vad: "Var och en skriver början. Du läser över axeln och ställer en enda fråga. Rätta inte nu."
        - tid: 57–60
          fas: 6 · Läs upp
          vad: "Paren säger vad de ska ta reda på vid platsen."
  mall:
    rubrik: Passen med egna minuter
    underrad: "Pass 4 och pass 6 till 9 följer passet i sex delar"
    block:
      - typ: tabell
        rubrik: Pass 1 till 5
        kolumner:
          - Pass och minuter
          - Det ni gör
        rader:
          - - "PASS 1\n0–⁠20 min"
            - "”Vad gör en berättelse bra?” Den korta berättelsen: tio minuter utan stöd."
          - - "20–⁠32 min"
            - "Två texter om samma boll. ”I vilken är du med?”"
          - - "32–⁠60 min"
            - "Berätta mera! med tärningarna. Paren övar på intervjun. Läs upp."
          - - "PASS 2\n0–⁠20 min"
            - "Läs som läsaren. Intervjun med de yngre eleverna."
          - - "20–⁠35 min"
            - "Berättelsen till Vera. Var får hon svar på varje fråga?"
          - - "35–⁠60 min"
            - "Dina tre svarsrader. Eleven svarar under ett streck och skriver sitt mål."
          - - "PASS 3\n0–⁠20 min"
            - "Läs som läsaren. Du visar hur du tänker, planerar, berättar och börjar skriva."
          - - "20–⁠60 min"
            - "Paren planerar och berättar. Alla skriver början. Två sätt vid 52."
          - - "PASS 4\n0–⁠60 min"
            - "Starterna. Du skriver vidare, kör fast. Säg 19–25, Skriv 25–57, halvvägs vid 41."
          - - "PASS 5\n0–⁠23 min"
            - "Två sätt i era texter. ”Jag skriver, ni tänker.” Du skriver gruppens början."
          - - "23–⁠60 min"
            - "Var och en skriver fortsättningen. Gruppen väljer en. Räkna berättelsen i en stapel."
      - typ: tabell
        rubrik: Pass 6 till 12
        kolumner:
          - Pass och minuter
          - Det ni gör
        rader:
          - - "PASS 6\n0–⁠45 min"
            - "Två texter om Sara. Säg 18–23, Skriv 23–45."
          - - "45–⁠60 min"
            - "Läsbesöket: de yngre eleverna lyssnar."
          - - "PASS 8\n0–⁠60 min"
            - "Två texter, vecka 4. Säg 19–25, Skriv 25–57. Läsaren från 52."
          - - "PASS 9\n0–⁠60 min"
            - "Två sätt i era texter. Planen som lista. Säg 26–32, Skriv 32–57, starterna vid 44."
          - - "PASS 10\n0–⁠38 min"
            - "Läs som läsaren. Eleven skriver klart. Läsaren halvvägs vid 20."
          - - "38–⁠60 min"
            - "Kamraten är läsare. Reglerna och listan. Läs högt. Inbjudan."
          - - "PASS 11\n0–⁠20 min"
            - "Den korta berättelsen igen. Före och efter."
          - - "20–⁠60 min"
            - "Krok nummer tretton. Uppgifterna. Eleven bygger ut ett ställe. Öva på att läsa högt."
          - - "PASS 12\n0–⁠10 min"
            - "Bygg läsplatsen under lakanet."
          - - "10–⁠60 min"
            - "Spökläsningen till minut 45. Du skriver lyssnarnas svar. Mitt mål."
  material:
    rubrik: Vad du behöver för kursen
    kravEtikett: "Spökberättelsens regler"
    var:
      rubrik: Var materialet finns
      punkter:
        - fet: Veckans sida.
          text: "Dagens mening, det du visar och det du ska lägga märke till står i metoden, under Till läraren: veckorna. Greppen står under Till läraren: återkopplingen, och veckans texter direkt efter veckans sida."
        - fet: Kortet och bladen.
          text: Kortet, bladet Intervjun, bladet En gång när och de andra bladen står under Kursens material. Arket Lapparna, bladet Planen och diagrammet står i planeringsmallarna.
        - fet: Det som gäller alla kurser.
          text: "Hur du tänker högt, vad du gör när en elev fastnar och hur du hjälper den som har svårt att få ned texten står i Texttyper i grupp."
    bordet:
      - Lappar ur arket Lapparna, och pennor
      - "Bladet Planen och kortet Läsarens frågor"
      - Bladet Intervjun, till och med pass 6
      - Mapparna med Mina texter och Mitt mål
      - Veckans text, som läggs undan när eleverna skriver
      - "På tavlan: Vem läser? Vad vill vi? När får vi svar?"
film:
  sekunder: 29.86
  beskrivning: "Tänk: vem läser, och vad vill ni? Eleven säger: ”Vera läser. Hon ska skratta.” Vera tänker: ”Kaniner!” Planera: det ni vill, och på varje lapp något som händer. Läraren frågar: ”Vill Vera vara med om det?” Vera tänker: ”Huu, åska!” Eleven säger: ”Åt sidan. Vera tycker att åska är läskigt.” Säg: berätta för en läsare ur ett annat par. Läsaren frågar: ”Hur känns det?” Läraren säger att svaret ska med i berättelsen. Eleven säger: ”Veras händer blev svettiga.” Skriv: skriv det du sa."
  rubrik: "Så gör eleven: Tänk, Planera, Säg, Skriv"
  ingress: "Fyra bilder ur filmen om de fyra stegen, som paren gör i vecka 2. Här planerar ett par en berättelse till Vera, sju år, som de har intervjuat. Vera är inte i rummet: hon syns i bilden eftersom paret tänker på henne. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Tänk: vem läser? Vera tycker om kaniner. Vad vill ni?"
    - text: "Planera: läraren frågar om Vera vill. En lapp åt sidan."
    - text: "Säg: en läsare ur ett annat par frågar. Ny lapp."
    - text: "Skriv: eleven skriver det hen sa till läsaren."
