principer:
  rubrik: "Tre saker att hålla fast vid"
  text: "Lägg eller skriv en bokstav för varje ljud, från vänster, medan ni säger ljudet, och läs tillbaka med fingret under det som står. Byt en bokstav i taget och säg var i ordet ni byter. Den som skriver ser inte orden förrän efteråt, och orden har bara bokstäver som gruppen har haft."
passrutin:
  text: "Lektionen går i fyra steg, från att du visar till att var och en gör själv."
  steg:
    - text: "Du bygger ett ord på tavlan, läser och skriver det och byter en bokstav."
      fas: "Kedjan på tavlan"
    - text: "Paren byter en bokstav i den enas ljudrutor, och alla läser i kör."
      fas: "Kedjan i rutorna"
    - text: "Den ena bygger och läser ett ord, och den andra skriver det hen hör."
      fas: "Ordjakt"
    - text: "Var och en skriver tre ord, ett av dem efter ett byte, och läser tillbaka."
      fas: "Skriv det du hör"
  efterPasset: "Du noterar i snabbmallen vilka av dagens elever som skrev ordet efter bytet och minst ett av de två andra orden rätt i steg 4, vad som fastnade, och om gruppen tar samma rad, nästa rad eller nästa lektion."
tidsschema:
  rubrik: "Ett pass på 30 minuter"
  text: "Är passet bara 20 minuter blir ljudstarten tre minuter, lektionen 15 och avslutet två. Stegen får då två, fyra, fem och fyra minuter."
  rader:
    - tid: "Före passet"
      fas: "Förberedelse"
      vad: "Lägg gruppens bokstäver i ett kuvert per par, och ta fram dina kort, magneterna, ljudrutorna, markörerna, whiteboardtavlorna, bokstavskartan och speglarna. Rita fyra rutor på tavlan. Välj kedjorna, bokstäverna till Ordjakt och orden till ljudstarten, och skriv dem, paren och dagens elever i snabbmallen."
    - tid: "0–5 min"
      fas: "Ljudstart"
      vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra, som i Ljudstarten. Alla svarar samtidigt."
    - tid: "5–9 min"
      fas: "Kedjan på tavlan"
      vad: "Bygg två eller tre ord ur en kedja i gruppens rad, med dina kort och magneterna i rutorna på tavlan."
    - tid: "9–15 min"
      fas: "Kedjan i rutorna"
      vad: "Paren bygger fyra ord, vidare i kedjan eller i nästa kedja. Du tittar i rutorna när paren räcker upp handen."
    - tid: "15–20 min"
      fas: "Ordjakt"
      vad: "Paret tar fram bokstäverna till Ordjakt och lägger resten i kuvertet. Första passet visar du en runda med en elev. Du går mellan paren."
    - tid: "20–25 min"
      fas: "Skriv det du hör"
      vad: "Lägg undan korten och sudda tavlan. Säg ett ord, ett byte och ett ord till. Du lyssnar på dagens elever."
    - tid: "25–30 min"
      fas: "Avslut"
      vad: "Var och en säger ett ord från dagens lek och vad hen gjorde med det. Du säger kort vad du hörde."
  efter: "Den som är klar före de andra skriver ett eget ord med gruppens bokstäver och läser det för sin kamrat."
steg:
  rubrik: "Vad du gör och säger i varje steg"
  text: "Här är lärarens ord, så att du kan säga dem som de står."
  fraserRubrik: "Exempelfraser"
  rader:
    - namn: "Kedjan på tavlan"
      fraga: "Vilken bokstav byter jag?"
      gor: "Lägg dina kort i rutorna på tavlan och säg ljuden: mmm, ooo, sss. Dra fingret under och läs: mos. Skriv ordet under rutorna. Byt ett kort och säg var: ”Jag byter /s/ mot /r/, sist.” Gör sedan ett fel med flit: lägg m och r utan o och läs: ”Mr? Jag missade ett ljud.”"
      fraser:
        - "Mos. En bokstav för varje ljud: mmm, ooo, sss."
        - "Jag byter /s/ mot /r/ och läser: mooorrr, mor."
        - "Vilken bokstav bytte jag? Den sista."
    - namn: "Kedjan i rutorna"
      fraga: "Vilken bokstav byter vi?"
      gor: "Paret sitter bredvid varandra och bygger ordet från steg 1 i den enas rutor. Säg nästa ord, ”Gör mor till mer”, och alla säger det långsamt. Den ena byter kortet och den andra läser, och nästa gång tvärtom. Ibland säger du bytet, ”Byt /m/ mot /l/”, och paren byter och läser ordet."
      fraser:
        - "Gör mor till mer. Vilken bokstav byter ni?"
        - "Läs med fingret under: mmmeeerrr."
        - "Byt /m/ mot /l/. Vilket ord blev det?"
    - namn: "Ordjakt"
      fraga: "Vilka ord kan du bygga?"
      gor: "Den ena bygger och läser ett riktigt ord med bokstäverna till Ordjakt medan den andra tittar bort. Den andra skriver det hen hör, läser tillbaka och jämför med korten. Sedan turas de om, och i trion skriver två. Hinner de, byter de sist en bokstav mot en ur kuvertet, till ett ord som låter som det stavas och inte står i ljudkollen eller i screeningens version B."
      fraser:
        - "Bygg ett ord medan din kamrat tittar bort."
        - "Du missade ett ljud. Säg det långsamt igen."
        - "Du bytte en bokstav och hittade ett nytt ord."
    - namn: "Skriv det du hör"
      fraga: "Kan du göra det själv?"
      gor: "Lägg korten i kuverten och sudda tavlan. Säg ett ord ur kedjan, ett byte, ”Gör mos till mor”, och ett ord ur en annan kedja med fler eller färre ljud, som se. Var och en säger ordet långsamt, skriver och läser tillbaka. Lyssna på dagens elever: har varje ljud en bokstav, i rätt ordning?"
      fraser:
        - "Säg ordet långsamt och skriv en bokstav för varje ljud."
        - "Gör mos till mor. Var bytte du?"
        - "Du hörde /m/ och /r/. Vad hör du mellan dem?"
arbetsform:
  rubrik: "Arbetsform: alla i kör, växlande, gemensamt"
  text: "I ljudstarten svarar alla samtidigt, och i lektionen går ni från att du visar till att var och en gör själv. Paren och trion sätter du ihop som i Ljudlek i grupp. Den som ännu inte ger varje ljud en bokstav lägger markörer först och blir dagens elev oftare."
  delar:
    - rubrik: "1. Alla i kör"
      text: "alla svarar"
      faser:
        - "Ljudstart"
    - rubrik: "2. Växlande"
      text: "du visar, tillsammans, i par, själv"
      faser:
        - "Kedjan på tavlan"
        - "Kedjan i rutorna"
        - "Ordjakt"
        - "Skriv det du hör"
    - rubrik: "3. Gemensamt"
      text: "ett ord var"
      faser:
        - "Avslut"
exempel:
  valt:
    rubrik: "Gruppen"
    text: "sex elever i förskoleklass och åk 1, vecka 6, tre pass i veckan. Gruppen gör Skriv ord tillsammans för sjunde passet i följd, det första i raden Blandat. Dagens ljud är /t/, och dagens elever är Elin och Leo."
  text:
    - "Ljudstarten. Läraren visar t: ”Kort, utan ö: /t/.”"
    - "Kedjan på tavlan. Läraren lägger m, o och s: ”Mmm, ooo, sss. Mos.” Sedan byter läraren s mot r: ”Mooorrr. Mor.”"
    - "Kedjan i rutorna. Paren är Alva och Elin, Omar och Noah, Leo och Mira. De gör mor till mer och mer till ser. Vid ”Gör ser till ler” lägger Leo sel. Läraren frågar var ser och ler låter olika, och Leo byter den första."
    - "Ordjakt. Alva och Elin har v, i, s och a. Elin bygger vas medan Alva tittar bort. Alva skriver vs, och Elin säger: ”Du missade ett ljud.” Alva skriver vas."
    - "Skriv det du hör. Läraren säger mer, ”Gör mer till ser” och se. Elin skriver alla tre, och Leo skriver mr. Läraren säger: ”Du hörde /m/ och /r/. Vad hör du mellan dem?” Leo hör eee och skriver mer."
    - "Avslutet. Omar säger: ”Ser. Jag bytte den första bokstaven.” Läraren säger: ”Du bytte en bokstav och hittade ett nytt ord.”"
    - "Efteråt noterar läraren: Elin skriver, byter och läser tillbaka. Leo tappar vokalen men byter rätt. Nästa pass tar gruppen samma rad, och dagens elever blir Alva och Noah."
fastnar:
  rubrik: "När eleven fastnar"
  text: "Vänta tre sekunder och ge minsta möjliga stöd först. Blir det många fel i gruppen, säg ordet i kör, låt sedan några elever säga det ensamma och ta samma ord minst tre gånger."
  fragaForst:
    - "Vad hör du?"
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg ordet igen, långsamt: mmmeeerrr. Dra fingret under medan ni säger det."
    - "Visa hur munnen gör. Eleven tittar i spegeln och känner efter: läpparna är ihop vid /m/, breda vid /e/ och runda vid /o/."
    - "Gör uppgiften mindre: eleven väljer mellan två kort, e och o. Den som inte minns bokstaven letar på bokstavskartan."
    - "Visa med handen eller med något att flytta: lägg en markör för varje ljud först, och sedan bokstäverna."
    - "Säg det tillsammans, och låt eleven säga det själv efteråt: mmmeeerrr, mer."
  motto: "Till sist bygger, läser och skriver eleven ordet själv."
urval:
  rubrik: "Var hittar du orden och materialet?"
  text:
    - "Orden står under Kedjorna och Bokstäverna till Ordjakt, bokstavskorten under Materialet och ljudrutorna i planeringsmallarna. Orden till ljudstarten står i Ordbanken."
    - "Egna ord går också bra, utom orden i ljudkollen och i screeningens version B."
  kravText: "Tre krav gäller egna ord:"
  krav:
    - rubrik: "Kända ord"
      text: "Eleven vet vad ordet betyder"
    - rubrik: "Ljudenliga"
      text: "En bokstav för varje ljud, som låter som den brukar"
    - rubrik: "Gruppens bokstäver"
      text: "Bara bokstäver som gruppen har haft, en gång i ordet"
uppfoljning:
  text: "Du ser i steg 4 vad eleverna klarar, och ljudkollen var tredje vecka visar samma sak för varje elev. Berätta konkret för eleven vad hen har lärt sig."
  rader:
    - nar: "Under passet"
      vad: "I steg 4 lyssnar du på dagens elever. Har varje ljud en bokstav, i rätt ordning? Byter eleven rätt bokstav? Läser hen det som står?"
    - nar: "Efter varje pass"
      vad: "I snabbmallen noterar du det dagens elever skrev och det som fastnade."
    - nar: "Var tredje vecka"
      vad: "Du gör ljudkollens uppgift 7 om att skriva ord, uppgift 8 om att sätta ihop och byta och uppgift 4 om bokstävernas ljud."
mal:
  rubrik: "Mål: vad eleven ska kunna efter lektionen"
  text: "Efter lektionen ska eleven kunna:"
  punkter:
    - "skriva korta ljudenliga ord, med en bokstav för varje ljud i rätt ordning"
    - "läsa tillbaka det som ligger eller står, med fingret under"
    - "byta en bokstav, läsa det nya ordet och säga var i ordet hen bytte"
snabbmall:
