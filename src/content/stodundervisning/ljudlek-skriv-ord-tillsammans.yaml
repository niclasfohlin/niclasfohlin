# Metod i stödundervisning. Modellen står i methods/_mall.yaml och docs/modell.md.
# En lektion i Ljudlek i grupp, skriven i lektionsskelettet: methods/ljudlek-i-grupp/_lektion.yaml.
titel: "Ljudlek: Skriv ord tillsammans"
undertitel: "En lektion i Ljudlek i grupp: bygga, läsa och skriva ord och byta en bokstav i taget, för F–⁠2"
ingress: "Eleverna bygger ord med bokstavskort, läser dem med fingret under och skriver dem. Sedan byter de en bokstav i taget och läser det nya ordet: mos, mor, mer. Lektionen hör till Ljudlek i grupp och har samma ljudstart och avslut som de andra lektionerna."
omrade: "Läsning"
arskurs:
  - "F-3"
arskursText: "F–2"
taggar:
  - "fonologisk-medvetenhet"
  - "bokstavskunskap"
  - "lasinlarning"
  - "intensivtraning"
  - "stavning"
format:
  - "liten grupp"
  - "par"
tid: "30 minuter per pass, tre till fem pass i veckan"
period: "Tio till femton pass i följd"
grupp: "2–12 elever"
material:
  - bokstavskorten
  - parets kort
  - ljudrutor och markörer
  - whiteboardtavlor
  - magneter
  - snabbmallen
uppdaterad: "2026-09-30"
utkast: false
serie: "ljudlek-i-grupp"
formaga: 7
tranar: "bygga, läsa och skriva ord med bokstavskort, och byta en bokstav i taget"
inledning:
  - "I Skriv ord tillsammans bygger eleverna ord med bokstavskort, läser och skriver dem, och byter en bokstav i taget. Lektionen hjälper eleven med det som gör ett ord svårt att skriva: vokalen faller bort, så att mer blir mr, och eleven läser det ord hen tänkte på i stället för det som står."
  - "Syftet är att eleverna ger varje ljud en bokstav, i rätt ordning, och läser tillbaka det de har skrivit, så att de kan skriva och läsa korta ord själva. Du visar en bokstav för varje ljud och läser tillbaka, säger var i ordet ni byter och tar bara bokstäver som gruppen har haft."
  - "Välj Skriv ord tillsammans när fler än hälften av eleverna har färre än tre rätt av fyra på ljudkollens uppgift 7, skriva ord. Ljudkollen är den korta kartläggningen med nio uppgifter som du gör med varje elev före insatsen och var tredje vecka. Den står i Ljudlek i grupp, och Skriv ord tillsammans hör till förmåga 7, Skriva ord, i lektionsbanken där."
upplagg:
  rubrik: "Så används lektionen"
  text: "Passet har samma ram i alla lektioner: fem minuter ljudstart, 20 minuter lektion i fyra steg och fem minuter avslut. Ljudlek i grupp beskriver gruppen, dagens elever och ljudkollen. Skriv ord tillsammans går igenom raderna i Så blir lektionen svårare, oftast i tio till femton pass. Ta nästa rad när dagens elever skriver ordet efter bytet och minst ett av de två andra orden rätt i steg 4, två pass i följd. Efter sista raden går gruppen till nästa förmåga där fler än hälften inte klarar uppgiften i ljudkollen."
