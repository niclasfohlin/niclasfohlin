    - "Ord och ljud som fastnade"
    - "Nästa pass: samma rad, nästa rad eller nästa lektion?"
grund:
  text: "Att bygga ord med bokstavskort och byta en bokstav i taget gav bättre avkodning hos elever som behövde stöd (McCandliss m.fl., 2003). Barn som skrev de ljud de hörde och fick återkoppling lärde sig läsa fler nya ord än barn som bara övade ljuden (Ouellette och Sénéchal, 2008; Sénéchal m.fl., 2012). Att öva ljuden och bokstäverna tillsammans har starkt stöd (Foorman m.fl., 2016)."
  kallor: "Bygger på Foorman m.fl. (2016), McCandliss m.fl. (2003), Ouellette och Sénéchal (2008) och Sénéchal m.fl. (2012)."
ramar:
  rubrik: "Materialet"
  text:
    - "Här finns bokstavskorten. I den här lektionen har varje par en egen sida, utöver de två du skriver ut för hela insatsen. Med tolv elever blir det sex sidor till. Ljudrutorna står i planeringsmallarna. Allt går att kopiera. Laminera bokstavskorten, ljudrutorna och bokstavskartan."
  ramar:
    - rubrik: "Bokstavskorten"
      text:
        - "Det är samma 24 kort i alla lektioner, i den ordning bokstäverna blir dagens ljud."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Skriv ut korten på tjockt papper och klipp isär dem. Håll upp kortet för dagens ljud så att alla ser det, och håll det rättvänt, eftersom u blir n och d blir p när kortet vänds upp och ned."
      listor:
        - rubrik: "Bokstavskort"
          rader:
            - - "s"
              - "o"
              - "l"
            - - "a"
              - "r"
              - "m"
            - - "e"
              - "n"
              - "i"
            - - "v"
              - "t"
              - "f"
            - - "å"
              - "p"
              - "k"
            - - "d"
              - "u"
              - "b"
            - - "g"
              - "h"
              - "y"
            - - "ä"
              - "ö"
              - "j"
kort:
  listor:
    - "Bokstavskort"
mallar:
  - rubrik: "Ljudrutorna"
    typ: "matta"
    text: "Skriv ut en per elev och laminera den gärna. Paret bygger i den enas rutor, och den som behöver lägger markörer i sina."
    kolumner:
      - "Bild"
      - "1"
      - "2"
      - "3"
      - "4"
    fot: "Lägg en bokstav för varje ljud, från ruta 1, och säg ljudet samtidigt. Dra sedan fingret under rutorna och läs ordet. Rutan Bild står tom."
film:
  sekunder: 28.67
  beskrivning: "Bygg ordet: en bokstav för varje ljud. Läs med fingret under. Byt en bokstav. Läs det nya ordet. Lägg undan korten. Läraren säger ett nytt ord. Säg ordet långsamt medan du skriver. Skriv ordet du hör på whiteboardtavlan. Läs tillbaka. Jämför med korten."
  rubrik: "Så gör eleven"
  ingress: "Fyra bilder ur lektionens film om vad eleven gör. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Bygg ordet: en bokstav för varje ljud."
    - text: "Läs med fingret under."
    - text: "Byt en bokstav: s blir r, sist i ordet."
    - text: "Korten undan: skriv på whiteboardtavlan, läs tillbaka."
