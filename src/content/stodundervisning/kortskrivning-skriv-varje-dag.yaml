    # Veckans sista pass: Skriv-delen den dagen med strecket, ordräkningen och de två eleverna, i passets ordning, och frågan
    # sist i Dela (de kalla läsarna K-585: passet såg ut som ett vanligt pass). Skriv står i stället för delens text, eftersom
    # eleverna räknar när klockan ringer, och Dela har pass 2–10:s rad först.
    - nar: veckans sista pass
      kort: Ord på tre minuter
      del: Skriv
      istallet: true
      text: "Starta klockan. Alla skriver utan att stanna. I de tio första passen skriver du också den första minuten. I veckans sista pass säger du ”streck” när tre minuter har gått. Alla drar ett streck efter sitt sista ord och skriver vidare. När klockan ringer räknar eleven alla ord fram till strecket, också dem du skrev åt hen, fyller i Min skrivlista och sätter en stjärna vid veckans favorittext. När alla har fyllt i ber du två elever, och i vecka 6 och vecka 12 alla, visa dig Min skrivlista: ”Vad ser du i din lista?” Säg vad du har sett: ”Du började direkt i dag.” Sedan delar ni som vanligt."
