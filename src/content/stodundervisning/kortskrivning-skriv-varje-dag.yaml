lathund:
  innehall: Ett skrivkort om dagen
  metoden:
    text:
      - "Varje dag i sex veckor skriver alla utifrån dagens skrivkort, och sedan läser den som vill en rad för en kamrat. Uppgiften är densamma varje dag, och det som växlar är kortet."
      - Till de tio första passen finns korten Börja här som förslag. Sedan slumpar du dagens kort, och den som behöver säger sin första tanke till dig. Skrivtiden börjar på tre minuter. Lägg till en minut om de flesta skriver när klockan ringer, upp till åtta, och ta bort en om de flesta slutar tidigt. Den som vill står över första tanken eller raden.
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Ingen text rättas.
          text: Skrivboken är elevens, och du läser bara det eleven visar.
        - fet: Pennan stannar inte.
          text: Den som fastnar skriver sitt sista ord igen, och det som blir fel stryks över.
        - fet: Ni skriver varje gång ni ses.
          text: Skriv helst varje dag. Vanan gör att fler börjar direkt.
    tabell:
      rubrik: Passet i tre delar
      kolumner:
        - Del
        - Ni gör och säger
      rader:
        - - "1 · Dagens kort\n2 min"
          - "Visa kortet. Citat och händelser läser du högt. Säg uppgiften och din egen första mening. I pass 1–10 säger eleverna sin första tanke till en kamrat.\n”Skriv vad du tänker när du ser, läser eller tänker på det här.”"
        - - "2 · Skriv\n3–⁠8 min"
          - "Starta klockan. Skriv själv den första minuten i pass 1–⁠10.\n”Låt inte pennan stanna, även när det är trögt.”"
        - - "3 · Dela\n5 min"
          - "Eleverna stryker under en rad och läser den för en kamrat. Den som läste berättar eller skriver en rad till.\nKamraten: ”Berätta mer om …”"
    not: "När pennan stannar. Den som inte har börjat efter en minut: ”Vad var din första tanke?” Skriv svaret som elevens första rad. Den som frågar om stavningen: ”Skriv det som du hör det, och sätt prickar under.” Den som suddar: ”Stryk över och skriv vidare.” Den som är utan idé: ”Ta ett kort ur högen, eller skriv om något annat.”"
