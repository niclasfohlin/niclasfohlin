  nivaval:
    text: "På Bas är varje kort en bild: något ur sagans värld, något knasigt eller något att undra över. Ju högre nivå, desto fler dikter och citat. Välj nivå efter eleverna och hur vuxet kortet ska vara, inte efter årskursen, och se på kortet före passet."
    mer: Var hittar du skrivkorten?
  langdval:
    text: Skrivtiden börjar på tre minuter, och passet är då omkring tio minuter. Skriver de flesta fortfarande när klockan ringer, lägger du till en minut nästa pass, upp till åtta. Slutar de flesta före klockan, tar du bort en minut, som lägst till tre.
    mer: Passet, del för del
  veckoval:
    text: Du stämmer av målen, elev för elev. Den som inte har nått dem fortsätter sex veckor till, och efter vecka 12 stämmer du av igen. Gruppen fortsätter så länge den vill.
    mer: Så växer det över sex veckor
    forval: 6
    langder: [6, 12]
  utvardering:
    - Har du inte skrivit upp eleven i dina rader efter passen i vecka 6, och är talet i Min skrivlista högre i vecka 6 än i vecka 1, har hen nått målen. Hen kan då sluta eller fortsätta så länge gruppen vill.
    - Börjar eleven fortfarande inte inom en minut och är talet inte högre i vecka 6 än i vecka 1, tar du upp det med elevhälsan.
    - Annars fortsätter eleven sex veckor till, och efter vecka 12 stämmer du av igen, med vecka 12 i stället för vecka 6. Har eleven inte nått målen då, tar du upp det med elevhälsan.
    - Lägger eleven fortfarande all kraft på bokstäverna eller stavningen, får hen också undervisning i det, eller ett verktyg som dator eller diktering.
mal:
  overgripande: "kunna börja skriva direkt och skriva utan att stanna."
  punkter:
    - börja skriva inom en minut
    - skriva hela skrivtiden utan att sudda
    - skriva ett ord som det låter och gå vidare
    - skriva fler ord på tre minuter än i början
checklista:
  rubrik: Checklista inför första passet
  punkter:
    - Varje elev har en skrivbok med Min skrivlista vikt och inklistrad längst bak, och jag har en egen.
    - Gruppens kort 1 i Börja här och kort 1 från en annan nivå går att visa för alla, och klockan syns.
    - Lösa papper och en papperskorg står framme, och ett blad med ”Jag ser …” sitter på väggen.
    - Jag har tänkt ut min första mening till gruppens kort 1.
grund:
  text: Att skriva utan stopp och utan återkoppling kallar Peter Elbow fritt skrivande. Den som rättar under skrivandet och vill ha början perfekt ger lätt upp, skriver han (Elbow, 1973). Linda Rief skriver med sina elever i åk 8 och skriver ned elevens egna ord när någon inte kommer igång (Rief, 2018). Nio elever i åk 6 berättar att en text blir meningsfull när den får en mottagare i klassen (Jansson m.fl., 2021). Att fler vågar när ingen rättar bygger på lärares erfarenhet och intervjuer med elever. I två försök i åk 3 fick en grupp varje vecka veta hur många ord de hade skrivit. De fick bättre skrivflyt än kontrollgruppen, och i det ena försöket också än de som bara övade (Truckenmiller m.fl., 2014; Koenig m.fl., 2016). I ett norskt försök i åk 1–2 gav mer skrivande inte bättre texter (Skar m.fl., 2023), så skrivundervisningen behövs också.
  kallor: Bygger på Fohlin och Wilson, Skriv! (utkommer 2027), Elbow (1973), Rief (2018), Jansson m.fl. (2021), Truckenmiller m.fl. (2014), Koenig m.fl. (2016) och Skar m.fl. (2023).

ramar:
  rubrik: Materialet
  text:
    - "Här står lektionskortet, de tio första passen och vilka kort som hör till dem. Korten finns på sidan Ta fram ett skrivkort. Min skrivlista finns i planeringsmallarna."
  ramar:
    - rubrik: "Börja här: de tio första passen"
      text:
        - Varje nivå har tio kort. Kort 1 hör till första passet och kort 10 till det tionde. Är kortet i veckans sista pass ett citat, tar du ett bildkort och sparar citatet till passet efter. Tabellen visar vilka korten är och ger en början att låna till varje pass. Efter tabellen står det som kommer till i pass 1–10. Det första passet står efter schemat Passet, del för del. De tio korten är ett förslag. Du kan när som helst slumpa fram ett eller tio nya kort på sidan Ta fram ett skrivkort och själv ge eleverna en början att låna.
      oversikt:
        kolumner:
          - Pass
          - Bas
          - Medel
          - Avancerat
          - En början att låna
        rader:
          - ["1", "En flicka rider på en snigel", "Ett hus på en valrygg", "Ett öga i en mur", "”Jag ser …”"]
          - ["2", "En man möter en drake", "Ett kyrktorn i en sjö", "Citat: Karin Boye", "”Jag tänker på …”"]
          - ["3", "En flicka släpar ett lejon", "Två båtar i en öken", "VR-glasögon på en cykel", "”Det började med att …”"]
          - ["4", "Getter i ett träd", "Citat: H.C. Andersen", "Citat: Stig Dagerman", "”Jag undrar …”"]
          - ["5", "En katt vid en dörr till vintern", "Handbojor i snön", "En ängel bärs på en bår", "”Strax innan …”"]
          - ["6", "En flicka på en översvämmad väg", "En jätte av is på ett berg", "Citat: Henry David Thoreau", "”Tänk om …”"]
          - ["7", "Ett barn som blåser bort", "1967: alla bilar byter sida", "1930: Gandhi går till havet", "”Om jag var där …”"]
          - ["8", "En flicka och ett ånglok i snön", "Citat: Sigbjörn Obstfelder", "Citat: Henrik Ibsen", "”Det påminner mig om …”"]
          - ["9", "Ett barn och en ren", "En flicka på en gunga", "Ett gäng på en brygga", "”Nästa dag …”"]
          - ["10", "En ö på en sköldpaddas rygg", "Citat: Emily Dickinson", "Citat: Edith Södergran", "”Jag tror att …”"]
      delar:
        - rubrik: "Pass 1–10: det som kommer till"
          falt:
            - rubrik: Dagens kort
              text: "Visa kortet på skärmen, eller skriv ut det på ett A4. Lägg det utskrivna kortet i högen efter passet: högen är de kort gruppen har haft."
            - rubrik: En början att låna
              text: Sätt ett tomt blad på väggen. Före varje pass skriver du dagens början under de förra. Börja din egen första mening med den. Den som behöver lånar en början eller en rad ur kortet. Bladet sitter kvar hela perioden.
            - rubrik: Pass 1–6
              text: Säg passets rad ur tabellen i Kort om kortskrivning innan klockan startar.
            - rubrik: Första tanken
              text: "Eleverna säger sin första tanke till en kamrat innan klockan startar. Stå då hos den som brukar bli sittande, och säg sedan till alla: ”Skriv det du sa.”"
            - rubrik: Dela
              text: Visa din egen sida och läs din rad först.

