film:
  sekunder: 29.9
  beskrivning: "Leo tar tiden. De andra håller händer. Läraren säger: ”Ni är klara när rockringen är tillbaka hos mig.” Elias fastnar i rockringen, och Sara hjälper. Sara säger: ”Böj dig, så lyfter jag armen.” Läraren säger vad Sara gjorde. Läraren säger: ”Sara lyfte armen, och då kom rockringen vidare.” Rockringen är tillbaka. Leo säger: ”Fyrtio sekunder!” Läraren frågar efteråt. Läraren frågar: ”Vad gjorde någon som hjälpte gruppen?” Elias säger: ”Sara visade hur jag skulle böja mig.”"
  rubrik: "Så gör gruppen"
  ingress: "Rockringen ska gå ett varv runt gruppen utan att någon släpper taget. Här är fyra bilder ur filmen, med en grupp i åk 4. Leo, som inte vill hålla händer, tar tiden."
  stillbilder:
    - text: "Läraren säger målet, och Leo tar tiden."
    - text: "Sara hjälper Elias, och läraren säger vad Sara gjorde."
    - text: "Rockringen kommer runt, och Leo säger tiden."
    - text: "Läraren frågar, och Elias säger vad Sara gjorde."
