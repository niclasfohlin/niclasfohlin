  material:
    rubrik: Vad du behöver för skrivkursen
    kravEtikett: Ramkrav
    var:
      rubrik: Var ramarna och texterna finns
      punkter:
        - fet: Den magiska skogen.
          text: Sex delar bakom klippan, med mentortext i varje del.
        - fet: Hunden som försvann.
          text: En hund kommer bort på en resa och tar sig hem.
        - fet: Egen ram.
          text: Tom mall med samma sex fält. Fyll i med gruppen efter en högläst text eller en bild.
        - fet: Mentortexter.
          text: Ramens ”så här kan det låta”, elevtexter från förra passet och din egen text på tavlan.
      efter: Alla tre ramarna finns i planeringsmallarna, Word-filen på metodsidan, och de färdiga sist i metodbeskrivningen.
    bordet:
      - Ramen synlig på tavlan eller väggen
      - Dagens mentortext, utskriven
      - Skrivbok eller mapp per elev
      - Tavla med plats för en spalt
      - Skylten för skrivkursen
      - Diplomen och häftapparaten, sista passet
