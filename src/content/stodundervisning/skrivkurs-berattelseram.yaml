    - rubrik: "Ramens texter, del 1–6: Den magiska skogen"
      text:
        - "Så här kan det låta i varje del. Läs den del ni skriver i dag."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Visa delens text på tavlan, och lägg undan den före Skriv."
      listor:
        - rubrik: Den magiska skogen
          rader:
            - ["Del 1 · Hej\nJag heter Vilda och jag är den enda i klassen som vågar klättra högst upp i kastanjen. Mamma säger att jag har för mycket spring i benen. Min bästa vän Milo säger att jag inte kan sitta still i fem minuter. Han har rätt. Men att hoppa ner från kastanjen vågar jag inte. Bakom vår skola finns en klippa. Alla vet att man inte går dit. Ingen vet varför."]
            - ["Del 2 · Klippan\nBollen rullade mot klippan. Jag sprang efter. Vid berget stannade jag. Där, i stenen, satt ett handtag av rost. Jag hade gått förbi hundra gånger. Det hade aldrig funnits där."]
            - ["Del 3 · In i skogen\nDet första jag märkte var tystnaden. Inga bilar, inga fåglar. Sedan såg jag att löven inte var gröna. De var silver, och när jag rörde ett klingade det som en liten klocka. Marken var mjuk som en madrass. Långt inne mellan träden rörde sig något som var för stort för att vara ett rådjur."]
            - ["Del 4 · En annorlunda vän\n– Du är sen, sa rösten.\nJag vände mig om. Den som pratade var inte högre än en hund och hade ögon som lyste gult.\n– Sen till vad? frågade jag.\n– Till att hjälpa mig, förstås. Dörren öppnas bara för den som kan hjälpa."]
            - ["Del 5 · Faran\nBron var borta. Jag försökte klättra ner, men stenarna var för hala. På andra sidan stod Skuggan och väntade, och den visste att jag inte vågade hoppa. Mina ben skakade. Jag tänkte på den lilla med de gula ögonen, som satt fast där borta. Jag tänkte på mamma, som skulle undra var jag var. Sedan tog jag tre steg bakåt."]
            - ["Del 6 · Tillbaka\nNär jag kom hem stod middagen på bordet, som om ingenting hade hänt. Mamma frågade var jag varit. Jag sa att jag klättrat i kastanjen. I fickan låg ett silverlöv. Det klingade när jag rörde det."]
        - rubrik: Frågorna
          rader:
            - ["Vad händer i dagens del?"]
            - ["Var i texten ser du dagens skrivfokus?"]
    - rubrik: "Ramens texter, del 1–6: Hunden som försvann"
      text:
        - "Så här kan det låta i varje del. Läs den del ni skriver i dag."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så gör du
              text: "Visa delens text på tavlan, och lägg undan den före Skriv."
      listor:
        - rubrik: Hunden som försvann
          rader:
            - ["Del 1 · Hunden och familjen\nJag heter Bus och jag är den som väcker familjen. Först Lova, hon är sju och har alltid smulor i sängen. Sedan pappa. Mamma väcker jag inte, det har jag lärt mig. Jag är rädd för två saker: åska och dammsugaren."]
            - ["Del 2 · Försvinnandet\nVid bensinmacken öppnade Lova dörren för att kasta en påse. Jag såg en hare. Bara en liten bit, tänkte jag. När jag kom tillbaka var det fullt av bilar. Jag nosade på varenda en. Ingen av dem var vår."]
            - ["Del 3 · Första platsen\nStaden luktade hundra saker på en gång: korv, avgaser, andra hundar, regn. Mina tassar gjorde ont av asfalten. Under en bänk hittade jag en halv smörgås och en torr plats. Där sov jag, med ena örat uppe."]
            - ["Del 4 · Ett nytt möte\n– Du går åt fel håll, sa katten uppe på staketet.\n– Hur vet du det? sa jag.\n– Jag vet allt. Bilarna som ska söderut kör där borta.\nKatten pekade med svansen. Jag litade inte på henne. Men jag hade ingen annan att lita på."]
            - ["Del 5 · Faran\nLastbilen kom fort. Jag försökte springa tillbaka. Tassarna gled på den regnblöta asfalten. Jag stod mitt på vägen och benen ville inte lyda. Ljuset blev större. Sedan hörde jag Lovas röst i huvudet: Spring, Bus! Och jag sprang vidare."]
            - ["Del 6 · Hemma igen\nJag kände lukten av vårt hus innan jag såg det. Lova satt på trappan. Hon hade smulor på tröjan. Jag skällde en gång, och hon vände sig om. Sedan minns jag inte så mycket mer, för hon höll så hårt. Jag är fortfarande rädd för åska. Men inte för något annat."]
        - rubrik: Frågorna
          rader:
            - ["Vad händer i dagens del?"]
            - ["Var i texten ser du dagens skrivfokus?"]
    - rubrik: "Till läraren: den korta berättelsen"
      text:
        - "Den korta berättelsen i pass 1 och pass 14 visar vad eleven gör utan stöd. Spara den i elevens mapp, och läs den som det står under Följ upp effekten."
      delar:
