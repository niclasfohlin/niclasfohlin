              text: "Eleverna i vår skrivkurs skriver var sin bok till ett av dina barn. Före ________ behöver vi en lista med barnens förnamn och ålder. Sedan behöver vi träffa barnen två gånger, en gång i 20–25 minuter och en gång i 45 minuter. Säg till om vi ska komma till er till provläsningen."
            - rubrik: "1. Provläsningen"
              text: "Den ________ klockan ________ i ________. Varje barn får höra början av boken som skrivs till hen, svarar på tre frågor och ritar en figur som kommer med i boken."
            - rubrik: "2. Boksläppet"
              text: "Den ________ klockan ________ i biblioteket. Barnen kommer till biblioteket och får höra hela boken. Efteråt ritar de det bästa i boken, och ni får ett exemplar av varje bok."
            - rubrik: Om böckerna
              text: "Böckerna är skrivna för barn i den här åldern. Ingen dör i dem, och ingen som barnen känner är den farliga."
            - rubrik: Hälsningar
              text: "________, som leder skrivkursen"
    # ---------------------------------------------------------------- Berättelseramarna
    - rubrik: "Berättelseram 1: Den magiska skogen"
      text:
        - Bakom huvudpersonens skola eller by ligger en klippa. Alla vet att man inte går dit, men ingen vet varför. På andra sidan klippan finns en skog där magiska saker händer. Huvudpersonen kan vara i elevens egen ålder och berätta i jag-form, om eleven vill. Ramen har sex delar, och varje del har en rubrik, det som händer, ett skrivfokus, frågor att samla på tavlan, ramens text att läsa högt och det som eleven bestämmer själv.
      oversikt:
        kolumner:
          - Del
          - Rubrik
          - Vad händer
          - Skrivfokus
        rader:
          - - "1"
            - Hej
            - Huvudpersonen presenterar sig, sin plats, en vän och klippan.
            - Personbeskrivning i jag-form
          - - "2"
            - Klippan
            - Huvudpersonen går ändå till klippan och hittar ett tecken.
            - "Spänning: säg inte allt"
          - - "3"
            - In i skogen
            - Huvudpersonen går in. Skogen är annorlunda.
            - Miljö med alla sinnen
          - - "4"
            - En annorlunda vän
            - Huvudpersonen möter någon som bor i skogen och behöver hjälp.
            - Dialog och ny karaktär
          - - "5"
            - Faran
            - Något står i vägen. Huvudpersonen måste välja.
            - Bygg upp mot ett val
          - - "6"
            - Tillbaka
            - Huvudpersonen kommer hem. Något har förändrats. Hemligheten.
            - Knyt ihop och sista meningen
      delar:
        - rubrik: Del 1 · Hej
          falt:
            - rubrik: Vad händer
              text: "Huvudpersonen presenterar sig själv, sin plats och en vän. Vi får veta något hen är bra på och något hen är rädd för. Hen nämner också klippan, dit alla vet att man inte går."
            - rubrik: Skrivfokus
              text: Personbeskrivning i jag-form. Visa vem huvudpersonen är genom det hen gör och gillar, i stället för att räkna upp egenskaper.
            - rubrik: Samla på tavlan
              text: Vad kan en huvudperson vara bra på? Vad kan hen vara rädd för? Vad säger andra om hen? Vad säger man om klippan, som gör att ingen går dit?
            - rubrik: Så här kan det låta
              text: Jag heter Vilda och jag är den enda i klassen som vågar klättra högst upp i kastanjen. Mamma säger att jag har för mycket spring i benen. Min bästa vän Milo säger att jag inte kan sitta still i fem minuter. Han har rätt. Men att hoppa ner från kastanjen vågar jag inte. Bakom vår skola finns en klippa. Alla vet att man inte går dit. Ingen vet varför.
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Namn, ålder och plats. Vem vännen är. Vad huvudpersonen är bra på och rädd för. Vad man säger om klippan.
        - rubrik: Del 2 · Klippan
          falt:
            - rubrik: Vad händer
              text: "Något gör att huvudpersonen ändå går till klippan, till exempel en boll, ett vad eller en katt som springer dit. Vid klippan finns ett tecken som inte fanns förut, som en dörr i berget, en stig eller ett brev under en sten."
            - rubrik: Skrivfokus
              text: Skapa spänning med korta meningar och ett sinne i taget. Säg inte allt, och låt läsaren undra.
            - rubrik: Samla på tavlan
              text: Vad kan få huvudpersonen att gå dit? Vad kan tecknet vara? Hur märker läsaren att något inte stämmer, utan att vi skriver ”läskigt”?
            - rubrik: Så här kan det låta
              text: Bollen rullade mot klippan. Jag sprang efter. Vid berget stannade jag. Där, i stenen, satt ett handtag av rost. Jag hade gått förbi hundra gånger. Det hade aldrig funnits där.
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Varför huvudpersonen går dit. Vad tecknet är. Om hen berättar för vännen eller inte.
        - rubrik: Del 3 · In i skogen
          falt:
            - rubrik: Vad händer
              text: "Huvudpersonen går in i skogen, där ljuset, ljuden, lukterna och marken är annorlunda. Något rör sig långt inne mellan träden."
            - rubrik: Skrivfokus
              text: Miljöbeskrivning med alla sinnen. Börja med ett annat sinne än synen. Gör skogen magisk utan att använda ordet magisk.
            - rubrik: Samla på tavlan
              text: Vad ser, hör och känner man i en vanlig skog, och hur luktar det där? Vad kan vara annorlunda i den här? Vilka ord gör att läsaren är med i skogen?
            - rubrik: Så här kan det låta
              text: Det första jag märkte var tystnaden. Inga bilar, inga fåglar. Sedan såg jag att löven inte var gröna. De var silver, och när jag rörde ett klingade det som en liten klocka. Marken var mjuk som en madrass. Långt inne mellan träden rörde sig något som var för stort för att vara ett rådjur.
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Hur skogen ser ut. Vad som är annorlunda. Vad det är som rör sig.
        - rubrik: Del 4 · En annorlunda vän
          falt:
            - rubrik: Vad händer
              text: Huvudpersonen möter någon som bor i skogen. Den är inte som huvudpersonen väntat sig. Den behöver hjälp med något, och bara huvudpersonen kan hjälpa.
            - rubrik: Skrivfokus
              text: Dialog och en ny karaktär. Använd replikstreck och säga-verb, och visa vad personerna gör medan de pratar. Låt dialogen föra handlingen framåt.
            - rubrik: Samla på tavlan
              text: Vem kan bo i skogen? Hur ser den ut och hur låter den när den pratar? Vad kan den behöva hjälp med? Vilka ord kan vi använda i stället för ”sa”?
            - rubrik: Så här kan det låta
              text: |-
                – Du är sen, sa rösten.
                Jag vände mig om. Den som pratade var inte högre än en hund och hade ögon som lyste gult.
                – Sen till vad? frågade jag.
                – Till att hjälpa mig, förstås. Dörren öppnas bara för den som kan hjälpa.
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Vem den nya vännen är. Vad den behöver hjälp med. Hur den pratar. Om huvudpersonen litar på den.
        - rubrik: Del 5 · Faran
          falt:
            - rubrik: Vad händer
              text: "För att hjälpa den nya vännen måste huvudpersonen göra något svårt. Någon eller något vill hindra det. Det går fel minst en gång. Till slut måste huvudpersonen välja: ge upp och gå hem, eller våga det hen är mest rädd för."
            - rubrik: Skrivfokus
              text: Bygg upp mot ett val. Problemet växer, huvudpersonen försöker flera gånger, det värsta ögonblicket kommer, och sedan måste hen välja. Visa rädslan i kroppen.
            - rubrik: Samla på tavlan
              text: Vad kan stå i vägen? Vad var huvudpersonen mest rädd för redan i del 1? Vilket val måste hen göra? Hur känns rädsla i kroppen?
            - rubrik: Så här kan det låta
              text: Bron var borta. Jag försökte klättra ner, men stenarna var för hala. På andra sidan stod Skuggan och väntade, och den visste att jag inte vågade hoppa. Mina ben skakade. Jag tänkte på den lilla med de gula ögonen, som satt fast där borta. Jag tänkte på mamma, som skulle undra var jag var. Sedan tog jag tre steg bakåt.
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Vad faran är. Vad som går fel först. Vilket valet är.
        - rubrik: Del 6 · Tillbaka
          falt:
            - rubrik: Vad händer
              text: Huvudpersonen kommer tillbaka till sin vanliga värld. Något har förändrats, i huvudpersonen eller runt omkring. Huvudpersonen behåller hemligheten om skogen, eller delar den med en enda person.
            - rubrik: Skrivfokus
              text: Knyt ihop berättelsen. Återkom till något från början. Visa vad som har förändrats utan att förklara det. Skriv en sista mening som läsaren minns.
            - rubrik: Samla på tavlan
              text: Vad från början kan komma tillbaka i slutet? Vad är annorlunda med huvudpersonen nu? Hur vet läsaren att berättelsen är slut?
            - rubrik: Så här kan det låta
              text: När jag kom hem stod middagen på bordet, som om ingenting hade hänt. Mamma frågade var jag varit. Jag sa att jag klättrat i kastanjen. I fickan låg ett silverlöv. Det klingade när jag rörde det.
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Vad som förändrats. Om vännen hemma eller familjen får veta. Om vägen in i skogen finns kvar.
    - rubrik: "Berättelseram 2: Hunden som försvann"
      text:
        - En hund kommer bort från sin familj under en resa. Hunden är huvudperson, och på vägen hem kommer den till nya platser, möter nya karaktärer och hamnar i fara. Eleven väljer om hunden berättar i jag-form eller om hen skriver berättelsen i tredje person. Ramen har sex delar, byggda som i Den magiska skogen.
      oversikt:
        kolumner:
          - Del
          - Rubrik
          - Vad händer
          - Skrivfokus
        rader:
          - - "1"
            - Hunden och familjen
            - Hunden presenterar sig, sin familj och sin plats.
            - Karaktär genom vanor
          - - "2"
            - Försvinnandet
            - Familjen är på resa. Hunden lämnar bilen, som sedan är borta.
            - En händelse steg för steg
          - - "3"
            - Första platsen
            - Hunden hamnar på en ny plats och måste klara natten.
            - Miljö genom hundens sinnen
          - - "4"
            - Ett nytt möte
            - Hunden möter någon som hjälper eller lurar.
            - Dialog och ny karaktär
          - - "5"
            - Faran
            - Hunden hamnar i fara och måste välja.
            - Spänning i kropp och tempo
          - - "6"
            - Hemma igen
            - Hunden och familjen hittar varandra. Något är annorlunda.
            - Slutet och sista meningen
      delar:
        - rubrik: Del 1 · Hunden och familjen
          falt:
            - rubrik: Vad händer
              text: Hunden presenterar sig, sin familj och sin plats. Vi får veta vad hunden gör varje dag, vem i familjen hunden tycker mest om och vad hunden är rädd för.
            - rubrik: Skrivfokus
              text: Karaktär genom vanor. Visa vem hunden är genom det den gör varje dag, i stället för att räkna upp egenskaper.
            - rubrik: Samla på tavlan
              text: Vad gör en hund varje morgon? Vad kan en hund vara bra på, och vad kan den vara rädd för? Vem i familjen tycker hunden mest om, och varför?
            - rubrik: Så här kan det låta
              text: "Jag heter Bus och jag är den som väcker familjen. Först Lova, hon är sju och har alltid smulor i sängen. Sedan pappa. Mamma väcker jag inte, det har jag lärt mig. Jag är rädd för två saker: åska och dammsugaren."
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Hundens namn och hur den ser ut. Familjen och platsen. Favoritpersonen. Vad hunden är rädd för.
        - rubrik: Del 2 · Försvinnandet
          falt:
            - rubrik: Vad händer
              text: "Familjen är på resa. Vid ett stopp lämnar hunden bilen, för att den följer ett spår, blir skrämd eller bara är nyfiken. När den kommer tillbaka är bilen borta."
            - rubrik: Skrivfokus
              text: Berätta en händelse steg för steg. Sakta ner i det viktiga ögonblicket, när hunden förstår att bilen är borta.
            - rubrik: Samla på tavlan
              text: Var kan familjen stanna på en resa? Vad kan locka en hund bort från bilen? Hur märker hunden att något är fel? Vad känner den då?
            - rubrik: Så här kan det låta
              text: Vid bensinmacken öppnade Lova dörren för att kasta en påse. Jag såg en hare. Bara en liten bit, tänkte jag. När jag kom tillbaka var det fullt av bilar. Jag nosade på varenda en. Ingen av dem var vår.
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Var det händer. Varför hunden lämnar bilen. Hur långt bort den hamnar.
        - rubrik: Del 3 · Första platsen
          falt:
            - rubrik: Vad händer
              text: "Hunden hamnar på en ny plats, till exempel en stad, en skog, en bondgård eller en hamn. Den måste hitta mat och en plats att sova på under sin första natt ensam."
            - rubrik: Skrivfokus
              text: Miljö genom hundens sinnen. Börja med nosen, och ta sedan med öronen och tassarna. Vad är gott och vad är farligt?
            - rubrik: Samla på tavlan
              text: Hur luktar en stad för en hund? En skog? En bondgård? Vad är farligt för en hund där? Var kan den sova?
            - rubrik: Så här kan det låta
              text: "Staden luktade hundra saker på en gång: korv, avgaser, andra hundar, regn. Mina tassar gjorde ont av asfalten. Under en bänk hittade jag en halv smörgås och en torr plats. Där sov jag, med ena örat uppe."
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Vilken platsen är. Vad hunden hittar att äta. Hur första natten blir.
        - rubrik: Del 4 · Ett nytt möte
          falt:
            - rubrik: Vad händer
              text: "Hunden möter ett djur eller en människa. Den nya karaktären hjälper hunden på vägen, eller lurar den åt fel håll. Djur förstår varandra. Människor förstår hunden på sitt sätt."
            - rubrik: Skrivfokus
              text: Dialog och en ny karaktär. Visa hur den ser ut, hur den låter och vad den vill, och använd replikstreck och säga-verb.
            - rubrik: Samla på tavlan
              text: Vem kan hunden möta? Går den nya att lita på? Hur pratar en katt, en kråka eller en gammal man på en bänk? Vad kan de vilja ha i utbyte?
            - rubrik: Så här kan det låta
              text: |-
                – Du går åt fel håll, sa katten uppe på staketet.
                – Hur vet du det? sa jag.
                – Jag vet allt. Bilarna som ska söderut kör där borta.
                Katten pekade med svansen. Jag litade inte på henne. Men jag hade ingen annan att lita på.
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Vem hunden möter. Om den nya går att lita på. Om hunden får sällskap en bit på vägen.
        - rubrik: Del 5 · Faran
          falt:
            - rubrik: Vad händer
              text: "Hunden hamnar i fara. Det kan vara en stor väg, en älv, en hundfångare eller ett djur som jagar. Den måste välja: gömma sig och vänta, eller fortsätta hemåt trots faran."
            - rubrik: Skrivfokus
              text: Spänning i kropp och tempo. Visa hjärtat, andningen och benen. Skriv korta meningar när det går fort, och sakta ner precis innan det avgörs.
            - rubrik: Samla på tavlan
              text: Vad kan vara farligt för en hund på väg hem? Hur känns rädsla i kroppen? Vad kan få hunden att våga?
            - rubrik: Så här kan det låta
              text: "Lastbilen kom fort. Jag försökte springa tillbaka. Tassarna gled på den regnblöta asfalten. Jag stod mitt på vägen och benen ville inte lyda. Ljuset blev större. Sedan hörde jag Lovas röst i huvudet: Spring, Bus! Och jag sprang vidare."
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Vad faran är. Om någon hjälper till. Vad hunden förlorar eller vinner.
        - rubrik: Del 6 · Hemma igen
          falt:
            - rubrik: Vad händer
              text: Hunden hittar hem, eller familjen hittar hunden, och de ses igen. Något är annorlunda med hunden nu, eftersom den har varit med om något som ingen annan vet om.
            - rubrik: Skrivfokus
              text: Slutet. Sakta ner i återseendet. Återkom till något från del 1. Skriv en sista mening som läsaren minns.
            - rubrik: Samla på tavlan
              text: Hur hittar de varandra? Vad från början kan komma tillbaka i slutet? Vad är annorlunda med hunden nu?
            - rubrik: Så här kan det låta
              text: Jag kände lukten av vårt hus innan jag såg det. Lova satt på trappan. Hon hade smulor på tröjan. Jag skällde en gång, och hon vände sig om. Sedan minns jag inte så mycket mer, för hon höll så hårt. Jag är fortfarande rädd för åska. Men inte för något annat.
              kursiv: true
            - rubrik: Eleven bestämmer
              text: Hur de hittar varandra. Vad som förändrats. Sista meningen.
    - rubrik: "Berättelseram 3: egen ram"
      text:
        - "Ramar som fungerar för många slags berättelser har samma rörelse: något oväntat händer, huvudpersonen försöker förstå, det blir svårare, huvudpersonen måste välja, och valet får en konsekvens. Bestäm tema och genre med gruppen, ge eleverna något att utgå från (en högläst text, en bild eller ett föremål) och fyll sedan i delarna tillsammans. Delarna har samma skrivfokus i samma ordning som i de färdiga ramarna, så att Min ram och delarnas sidor passar: personen när vi möter huvudpersonen, spänningen när något inte stämmer, platsen när hen kommer till en ny plats, dialogen när personer möts, faran och valet när problemet växer, och slutet när trådarna ska knytas ihop."
