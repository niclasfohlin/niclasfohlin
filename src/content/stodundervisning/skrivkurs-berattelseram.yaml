        - "Familjer på ett boksläpp efter skoldagen, eller åk 4 när gruppen går i åk 5–6"
passrutin:
  text: "Introduktionspasset är grundpasset, och kursen har sex sådana, ett för varje del. Fortsättningspasset har en egen tabell efter introduktionspassets."
  steg:
    - text: "Du läser din förra del. Eleven läser tyst slutet på sin förra del och raden på Mitt mål."
      fas: Ramen
    - text: "Gruppen jämför två texter och hittar greppet i ramens text. Du skriver din del på blädderblocket och tänker högt."
      fas: Skrivfokus
    - text: "I par berättar var och en sin del, och kamraten frågar med kortet. Sist skriver eleven sina val i Min ram."
      fas: Berätta
    - text: "Alla skriver. Vid minut 38 går ni ett varv i Galleriet."
      fas: Skriv
    - text: "Alla läser en mening med skrivfokuset, och alla ändrar en sak."
      fas: Dela
  efterPasset: "Läs början på allas delar, omkring en minut per text. Skriv själv två korta versioner till fortsättningspasset: en som liknar det många skrev och en med det som fattades."
tidsschema:
  rubrik: "Introduktionspasset, 60 minuter"
  text: "Introduktionspassets tabell visar ett pass med två texter, som pass 2, 6 och 10. De två korta texterna handlar om samma sak, och bara den andra använder delens skrivfokus. Ramens text är ramens exempel på hur delen kan låta. Det som skiljer i ett visst pass, också minuterna, står på delens sida. Minuterna är hållpunkter."
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: "Skriv ett utkast till din del. Skriv skrivfokuset och dagens fråga på tavlan. Bestäm paren."
    - tid: 0–5 min
      fas: Ramen
      vad: "”Hon är rädd för höjder. Det måste jag komma ihåg till del 5.” Peka på dagens del: ”Vad som är annorlunda bestämmer ni.”"
    - tid: 5–20 min
      fas: Skrivfokus
      vad: "Ställ frågorna under texterna, och säg vad greppet heter. Tveka högt: ”Det luktade blött. Nej, sött, som pannkakor.” Gruppen samlar ord. Vänd bort blocket."
    - tid: 20–28 min
      fas: Berätta
      vad: "”Ställ dagens fråga först.” Lyssna på den som brukar fastna: ”Bra. Skriv det du just sa.”"
    - tid: 28–52 min
      fas: Skriv
      vad: "Läs över axeln och peka: ”Här visar du att han är rädd utan att skriva rädd.” Fråga om det som saknas."
    - tid: 52–60 min
      fas: Dela
      vad: "”Vad gör meningen för läsaren?” Den som lånade säger av vem."
  efter: "Den som är klar läser delen för en kamrat, lägger till en mening med dagens skrivfokus eller ritar delens bild."
arbetsform:
  rubrik: "Arbetsform: gemensamt, läraren visar, i par, enskilt, gemensamt igen"
  text: "Passet rör sig från dig till eleven och tillbaka till gruppen. Med fyra till tio elever hinner alla läsa upp något i varje pass, och de som skriver med flyt blir gruppens levande mentortexter. Blir en elev över i Berätta, är du kamrat."
  delar:
    - rubrik: 1. Gemensamt
      text: Hela gruppen, med dig vid tavlan
      faser:
        - Ramen
    - rubrik: 2. Läraren visar
      text: Du tänker högt
      faser:
        - Skrivfokus
    - rubrik: 3. I par
      text: Två och två, med kortet
      faser:
        - Berätta
    - rubrik: 4. Enskilt
      text: Var och en i sin bok
      faser:
        - Skriv
    - rubrik: 5. Gemensamt igen
      text: En mening var
      faser:
        - Dela
fastnar:
  rubrik: Stödet att komma igång
  text: "Den som inte kommer igång efter Berätta har oftast idén men inte första meningen. Börja med att fråga, och ge mer stöd ett steg i taget."
  fragaForst:
    - Vad sa du till din kamrat? Säg det igen.
    - Var är din huvudperson nu?
  trappa:
    - "Uppmuntran: ”Det du sa till Nora var bra. Skriv det.”"
    - "Rita först: i två eller tre minuter ritar eleven det första huvudpersonen ser eller hör i delen, i rutan på bokens sida. Fråga ”Vad är det där?” och säg ”Skriv det.”"
    - "Starthjälp med första meningen: ”Jag hjälper dig med första meningen. Säg den till mig.” När eleven har sagt den, säger du: ”Bra tanke. Skriv ner den.”"
    - Du skriver första meningen åt eleven, med elevens ord, och eleven skriver nästa.
  efter: "Den som har skrivstöd, som tal till text eller tangentbord, använder det i hela kursen. Eleven klistrar då in en utskrift på bokens sida och gör titeln och bilden för hand."
exempel:
  valt:
    rubrik: Gruppen
    text: 'sex elever i årskurs 4. Exemplet är pass 6, introduktionspasset för del 3 i Den magiska skogen, ”In i skogen”. Skrivfokus: platsen med sinnena.'
  text:
    - "Läraren läser sin del 2 högt från blädderblocket, där hennes huvudperson hittar en stig som inte fanns i går. Sedan säger hon: ”Hon är rädd för höjder. Det måste jag komma ihåg till del 5.” Eleverna läser tyst sin rad på Mitt mål, och Leos rad är ”Jag ska inte säga allt.” Läraren pekar på del 3 i ramen. ”I dag går era huvudpersoner in i skogen. Ramen säger att skogen är annorlunda. Hur den är annorlunda bestämmer ni.”"
    - "Läraren läser de två texterna om källaren hos mormor högt. Gruppen säger att båda handlar om samma källare och att den andra börjar med lukten. Sedan läser hon mentortexten ur ramen högt: ”Det första jag märkte var tystnaden.” Hon frågar: ”Var gör den här texten samma sak?” ”Hon börjar med ett öra, inte med ögonen”, säger Yasmin. Läraren skriver på tavlan: se, höra, känna, lukta. Sedan skriver hon sin del och tänker högt: ”Jag vill att det ska lukta något. Blött? Nej, det luktade sött, som pannkakor. Det är konstigt i en skog, bra.” Gruppen fyller spalterna: silverlöv, ljus utan sol, fåglar som inte låter som fåglar. Hon vänder bort blocket."
    - "Eleverna berättar i par. Elias sitter tyst tills Nora ställer dagens fråga: ”Vad hör eller känner hen först?” Då kommer det: ett tickande, som en klocka. Läraren hör det och säger: ”Skriv den meningen först.” Alla skriver sina val i Min ram och börjar sedan på sin del. Läraren läser över Adams axel och pekar: ”Här skriver du att marken var konstig. Vad kände fötterna?” Adam ändrar till ”marken gungade som en säng”."
    - "Vid minut 38 lägger alla boken öppen på sin plats och går ett varv. Var och en pekar på ett ställe i en kamrats bok, och Sofia pekar på Adams. ”Han skriver vad fötterna känner”, säger hon. Nora skriver en mening om marken i sin egen skog: den är kall som snö mitt i sommaren. Hon sätter en stjärna i kanten."
    - "Sist läser alla en mening där de beskriver skogen med ett sinne. Nora läser meningen med stjärnan och säger att hon lånade av Adam. Alla ändrar en sak. Efteråt läser läraren början på allas delar och skriver en kort notering: Elias behöver berätta för läraren innan han skriver, och flera skriver bara vad huvudpersonen ser. Till pass 7 skriver läraren själv två versioner av en mening om marken, en med ögonen och en med fötterna."
roll:
  rubrik: "Lärarens roll: hålla ramen, inte pennan"
  text: Du håller i strukturen så att delarna hänger ihop och alla hinner bli klara. Du undervisar om ett skrivfokus i taget och visar med din egen bok att skrivande är att pröva och ändra. Men innehållet är elevens. I samma stund som du bestämmer huvudpersonens val slutar berättelsen att vara elevens bok.
  gor:
    - Skriv din egen bok på blädderblocket, och läs den förra delen högt innan du skriver nästa.
    - Visa att du tvekar och ändrar, och säg varför.
    - Låt alla berätta muntligt innan de skriver.
    - Lyft en elevs formulering för gruppen, när eleven har sagt ja.
    - Fastnar eleven i handlingen, ställ dagens fråga eller fråga ”Vad går fel?”
    - Visa mycket i början. Från del 4 föreslår gruppen repliker och ord, och du frågar mer än du visar.
  undvik:
    - Att skriva en mall som styr varje mening.
    - Att låta eleverna skriva tyst ett helt pass utan gemensamt steg.
    - Att rätta stavning under skrivtiden.
    - Att låta delarna bli så långa att ingen blir klar.
    - Att kalla gruppen något annat än skrivkursen.
urval:
  rubrik: Var hittar du ramarna, texterna och läsarna?
  text:
    - "Den magiska skogen handlar om en skog bakom en klippa och har en mentortext i varje del. I Hunden som försvann kommer en hund bort på en resa och tar sig hem. Den egna ramen är tom, med samma sex delar, och du fyller i den med gruppen efter en högläst text eller en bild. Välj Den magiska skogen. Går läsarna i förskolan, välj Hunden som försvann. Med en egen ram skriver du själv varje dels fokus och dagens fråga på en kopia av delens sida. Ramarna står under Kursens material och i planeringsmallarna, och ramens texter står också på en sida till eleverna."
    - "Läsarna är ett barn per elev i en yngre klass, oftast förskoleklassen eller åk 1. Med två pass i veckan blir provläsningen i vecka 4 och boksläppet i vecka 8. Med tre pass i veckan blir de i vecka 3 och vecka 5. Brevet Till läraren i den yngre klassen står under Kursens material."
  kravText: "En ram som fungerar uppfyller tre krav:"
  krav:
    - rubrik: Rörelse, inte meningar
      text: Ramen säger vad som händer, och eleven bestämmer hur
    - rubrik: Ett skrivfokus per del
      text: "Det berättelsen behöver just där: miljö, dialog, spänning"
    - rubrik: Korta delar som blir klara
      text: Hellre en halv sida färdig än två ofärdiga sidor
uppfoljning:
  text: Du behöver veta om kursen ger effekt, och inte bara att ni har genomfört den. I pass 1 och pass 14 skriver eleven en kort berättelse till en bild. Räkna orden, och jämför de två texterna. Prata med klassläraren och hemmet, så att skrivandet fortsätter efter kursen.
  rader:
    - nar: Pass 1
      vad: "Finns början, problem och slut? Märks platsen med fler än ett sinne? Driver en replik handlingen framåt? Visar texten en känsla utan att nämna den?"
    - nar: Pass 14
      vad: "Ställ samma frågor till den nya texten. Titta på stjärnorna: lånade eleven ett grepp och behöll sitt innehåll?"
    - nar: Efter kursen
      vad: Berätta för klassläraren vilka grepp eleven lärt sig, så att hen frågar efter dem i klassen. Skicka hem boken med diplomet.
mal:
  rubrik: "Mål: vad eleven ska kunna göra efter kursen"
  punkter:
    - Bygga en berättelse del för del inom en ram
    - Berätta sin idé muntligt innan hen skriver
    - Beskriva en plats med mer än ett sinne
    - Skriva en dialog som för handlingen framåt
    - Visa en känsla utan att nämna den
    - Låna ett grepp av en kamrat utan att låna innehållet
snabbmall:
  text: "Snabbmallen är en halv sida som du fyller i före och efter varje introduktionspass. Håll det enkelt. Det du skriver efteråt styr nästa pass: vilka två versioner du visar, och vem som behöver berätta för dig innan hen skriver."
  fore:
    - Paren i Berätta
  efter:
    - Vem kom igång, vem behövde berätta två gånger?
    - Frågan jag ställde över axeln, och till vem
    - Mina två versioner till fortsättningspasset
checklista:
  rubrik: Före kursen
  punkter:
    - Bett om barnens namn med brevet.
    - Bokat provläsningen och boksläppet, med reserv.
    - Hittat på min huvudperson.
    - Kopierat Min huvudperson, Min ram, Mitt mål och korten.
    - Gjort en mapp per elev för bokens sidor fram till pass 14.
grund:
  text: "Metoden bygger på tanken om den skrivande gemenskapen: eleverna utvecklas som skribenter när de skriver i ett sammanhang där de ser hur andra gör, prövar sina ord inför varandra och tar stöd av varandra (Lave & Wenger, 1991; Wenger, 1998). Att låta elever skriva tillsammans och att undervisa om hur man planerar och bearbetar, med lärarens modellering, hör till det som har starkast stöd för elever från åk 4 till gymnasiet, medan modelltexter ensamma har svagare stöd (Graham & Perin, 2007). Berättelseramen gör det möjligt: när formen redan finns kan eleven lägga sin kraft på innehållet. Femteklassare som läste andras texter med en läsares ögon bearbetade sin egen text bättre, men det syntes inte när de skrev en ny text (Moore & MacArthur, 2012), så eleven får svar på sin del medan den går att ändra. Att blanda elever som behöver stöd med elever som skriver med flyt, och att kalla det en kurs man får vara med i, ger gruppen både förebilder och stolthet."
  kallor: Bygger på Lave och Wenger (1991), Wenger (1998), Graham och Perin (2007), Moore och MacArthur (2012) samt Josef Sahlins lärarhandledning till Den magiska dörren, förlagan till Den magiska skogen.
ramar:
  rubrik: Kursens material
  text:
    - "Först kommer sidan för varje del, och direkt efter den det som hör till delen, som Två texter, strukturen, provläsningen och boksläppet. Sedan kommer det som används i hela kursen: återkopplingen, kortet, elevens blad och bokens sidor, ramens texter till eleverna, den korta berättelsen och brevet till läraren i den yngre klassen. Sist står berättelseramarna."
    - "Det du kopierar före pass 1 står i listan Före kursen. Före pass 2 kopierar du sidan i Min bok, sex till varje elev, och några sidor med bara rader. När du häftar boken efter pass 14, lägger du dem efter delens första sida. Ge hellre eleven en sida till än att låta hen skriva trångt. Före pass 8 kopierar du bladet Provläsningen. Före pass 13 kopierar du omslaget på tjockt papper, två till varje elev. Av sidan Om författaren kopierar du ett blad per två elever och klipper det itu. Av Läsarnas sida kopierar du ett eller två blad per författare. Läsarnas sida står sist i båda exemplaren av boken, och barnen ritar i elevens exemplar."
  ramar:
    # ---------------------------------------------------------------- Delarna
    - rubrik: "Till läraren: delarna"
      lektioner: true
      text:
        - "Varje del i ramen har en sida. Överst står delens fokus och dagens fråga, som kamraten ställer först i Berätta. Sedan kommer delens två pass, med bara det som skiljer sig från tabellerna över introduktionspasset och fortsättningspasset, och sist det du ska lägga märke till. Ramens text för delen står på sidan Ramens texter. Sidornas namn, som Personen och Spänningen, gäller båda ramarna. Med Hunden som försvann skiljer sig del 2 och del 5. Det som skiljer står på del 2:s sida och på sidan Två texter, del 5."
      delar:
        - rubrik: "Start · pass 1"
          falt:
            - rubrik: Fokus
              text: "Eleven får veta vem boken är till och hittar på sin huvudperson."
            - rubrik: Pass 1
              text: "0–⁠8 min. Visa skylten, diplomet och en kapitelbok för yngre barn. Varje elev får namn och ålder på barnet som boken är till. Skriv läsarens två regler på tavlan: ”Ingen dör, och ingen du känner är den farliga.”\n8–⁠25 min. Eleven skriver den korta berättelsen till en bild i 15 minuter. Uppgiften står på sidan om den korta berättelsen.\n25–⁠40 min. Läs ramen del för del. Visa din huvudperson och tänk högt om vad hen är bra på och rädd för.\n40–⁠55 min. Eleven ritar och fyller i Min huvudperson och berättar om hen för en kamrat.\n55–⁠60 min. Eleven skriver barnets namn överst på Min ram."
            - rubrik: Lägg märke till
              text: "Eleven som vet vad huvudpersonen vill innan du frågar.\nEleven vars korta berättelse bara räknar upp händelser."
        - rubrik: "Del 1 · Personen"
          falt:
            - rubrik: Fokus
              text: "Eleven visar vem huvudpersonen är genom det hen gör, och berättar något som får betydelse senare."
            - rubrik: Dagens fråga
              text: "”Vad gör hen som visar vem hen är?”"
            - rubrik: Pass 2
              text: "Ramen, 0–⁠5 min: det finns ingen förra del än. Eleven läser på Min ram vem boken är till, och du pekar på del 1.\nI Skriv lär du ut Galleriet, och ni går det första varvet. Sidan Strukturen, del 1: Galleriet säger hur ni gör."
            - rubrik: Pass 3
              text: "I Skriv fyller eleven i raden ”När jag kör fast” på Mitt mål.\nVid minut 45 visar du ramens del 1 och 6, där kastanjen eller smulorna kommer tillbaka, och ringar in något sådant i din del 1. Sedan ringar eleverna in."
            - rubrik: Lägg märke till
              text: "Eleven som räknar upp utseende och ålder. Ställ dagens fråga igen.\nEleven som skriver vad huvudpersonen är rädd för. Det kommer tillbaka i del 5."
        - rubrik: "Del 2 · Spänningen"
          falt:
            - rubrik: Fokus
              text: "Eleven låter läsaren undra, med korta meningar och utan att säga allt."
            - rubrik: Dagens fråga
              text: "”Vad märker hen först som inte stämmer?”"
            - rubrik: Pass 4
              text: "Skrivfokus, 5–⁠17 min: läs ramens text för del 2 och fråga ”Hör ni att författaren aldrig skriver ordet läskigt? Vad gör hon i stället?” Med Hunden som försvann berättar du i stället försvinnandet steg för steg och saktar ner när hunden förstår att bilen är borta.\nBerätta går 17–⁠25 min och Skriv 25–⁠52 min.\nEfter passet läser du delarna och skriver ditt svar, som det står under Till läraren: återkopplingen."
            - rubrik: Pass 5
              text: "0–⁠8 min: ditt svar. Eleven läser din lapp, svarar på den och använder sitt svar när hen skriver vidare i Skriv."
            - rubrik: Lägg märke till
              text: "Eleven som säger allt på en gång.\nEleven som använder ditt svar utan att du påminner."
        - rubrik: "Del 3 · Platsen"
          falt:
            - rubrik: Fokus
              text: "Eleven börjar med ett annat sinne än synen och använder minst två sinnen, så att läsaren känner att platsen är annorlunda."
            - rubrik: Dagens fråga
              text: "”Vad hör eller känner hen först?”"
            - rubrik: Pass 6
              text: "Exemplet visar passet.\nHar skolan en plats som kan vara klippan, kan gruppen stå där en minut i början och säga vad de hör och känner, och hur det luktar."
            - rubrik: Pass 7
              text: "Två sätt i era texter: en version med bara synen och en som börjar med ett annat sinne."
            - rubrik: Lägg märke till
              text: "Eleven som börjar med ögonen i varje mening.\nEleven som lånar ett grepp i Galleriet och behåller sin egen plats."
        - rubrik: "Del 4 · Dialogen"
          falt:
            - rubrik: Fokus
              text: "Eleven låter den nya karaktären tala och föra handlingen framåt."
            - rubrik: Dagens fråga
              text: "”Vad säger den nya först?”"
            - rubrik: Pass 8
              text: "0–⁠25 min. Provläsningen.\n25–⁠35 min. Eleven läser raden på Mitt mål. Du läser ramens text och skriver din dialog.\n35–⁠40 min. Berätta: paren spelar upp dialogen. Kamraten frågar: ”Barnet ser oss inte. Hur vet hen vem som pratar?”\n40–⁠57 min. Skriv: eleven använder två saker ur barnets teckning.\n57–⁠60 min. Dela."
            - rubrik: Pass 9
              text: "0–⁠8 min: eleven läser barnets svar och ändrar där barnet inte förstod.\nTvå sätt i era texter: bara replikerna, och samma repliker där läsaren vet vem som pratar.\nTeckningen är delens bild, så Skriv går till 50. Eleven ringar in före Dela."
            - rubrik: Lägg märke till
              text: "Eleven som skriver långa samtal där inget händer. Fråga ”Vad vet läsaren nu som hen inte visste?”"
        - rubrik: "Del 5 · Faran och valet"
          falt:
            - rubrik: Fokus
              text: "Eleven ger faran plats, visar rädslan i kroppen och låter huvudpersonen välja."
            - rubrik: Dagens fråga
              text: "”Vad är hen rädd för, och vad får hen att våga?”"
            - rubrik: Pass 10
              text: "Ramen, 0–⁠5 min: läs rädslan ur din del 1. Eleven läser sitt ”Är rädd för” på Min huvudperson. Skriv läsarens regler på tavlan igen.\nSkrivfokus: skriv kortare och fråga gruppen mer.\nBerätta, 20–⁠30 min: två elever berättar för gruppen, som ställer dagens fråga. Sedan berättar paren.\nSkriv går 30–52.\nEfter passet skriver du ditt svar, som efter pass 4."
            - rubrik: Pass 11
              text: "0–⁠8 min: ditt svar."
            - rubrik: Lägg märke till
              text: "Eleven som löser faran på en mening. Fråga ”Vad prövar hen först som inte går?”\nEleven som knyter valet till rädslan."
        - rubrik: "Del 6 · Slutet"
          falt:
            - rubrik: Fokus
              text: "Eleven låter något från början komma tillbaka och skriver en sista mening som läsaren minns."
            - rubrik: Dagens fråga
              text: "”Vad från början kommer tillbaka?”"
            - rubrik: Pass 12
              text: "Ramen: eleven läser sin del 1, sitt mål och det hen ringade in.\nSkrivfokus, 5–⁠17 min: lägg ramens del 1, 3 och 6 bredvid varandra, och ställ dagens fråga. Skriv bara din sista mening.\nBerätta går 17–⁠25 min och Skriv 25–⁠52 min, utan galleri."
            - rubrik: Pass 13
              text: "0–⁠8 min: Starterna.\n45–⁠50 min: bara bilden.\n50–⁠60 min: eleven läser hela boken tyst och ändrar en sak barnet inte skulle förstå. Läser hen långsamt, räcker del 1 och 6."
            - rubrik: Lägg märke till
              text: "Eleven som slutar med att någon vaknar. Fråga ”Vad har förändrats?”\nEleven som väljer något hen ringade in."
        - rubrik: "Boken · pass 14 och 15"
          falt:
            - rubrik: Fokus
              text: "Eleven gör boken klar och läser den för barnen."
            - rubrik: Pass 14
              text: "0–⁠17 min. Eleven skriver den korta berättelsen till en ny bild.\n17–⁠22 min. Före och efter: paren jämför berättelserna och frågar ”Vad gör du nu som du inte gjorde i början?” Eleven skriver de två sista raderna på Mitt mål.\n22–⁠27 min. Eleven läser del 6 för kamraten, som säger vad hen minns.\n27–⁠34 min. Eleven ändrar två ställen: där barnet inte förstod och där läsaren behöver se mer.\n34–⁠58 min. Eleven gör omslaget, Om författaren och bilderna som saknas. Den som skriver långsamt skriver några ord per rad.\n58–⁠60 min. Eleven ordnar sidorna. Efter passet kopierar du boken och häftar båda exemplaren."
            - rubrik: Pass 15
              text: "0–⁠10 min. Ordna läsplatserna, och var och en säger en mening om sin bok.\n10–⁠55 min. Boksläppet, som sidan Läsarna kommer beskriver.\n55–⁠60 min. Dela ut diplomen när barnen har gått."
            - rubrik: Lägg märke till
              text: "Eleven som läser med inlevelse för barnet.\nEleven som säger vad hen gör nu som hen inte gjorde i pass 1."
    # ---------------------------------------------------------------- Delarnas material
    - rubrik: "Två texter, del 1: Amir på rasten"
      text:
        - "Läs båda texterna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 2
              text: "Läs båda texterna högt, och ställ frågorna i tur och ordning. Låt paren prata om fråga 2 och 3, och ta de andra frågorna i hela gruppen. Eleverna kan svara annat än det som står under Det du lyssnar efter, om de visar var i texten de ser det. Säg sedan: ”Den andra visar hur Amir är genom det han gör.” Läs ramens text för del 1, och fråga: ”Var gör den här texten samma sak?”"
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Namnet, åldern, jackan och Lisa finns i båda, och i den andra syns fotbollen i målet han gör. Den första säger att han är rädd för mörker, och den andra visar det."
            - rubrik: "2. I vilken lär du känna Amir bäst?"
              text: "I den andra. Den första räknar upp vad Amir har och är, och fyra av sex meningar börjar med Jag."
            - rubrik: "3. Var märker du hur han är?"
              text: "Han hinner göra mål innan de andra har hittat mössorna, Lisa säger att han har motor i benen, och han står stilla när lampan slocknar."
            - rubrik: "4. Vad kan hända Amir sen?"
              text: "Något som händer i mörkret. Läsaren vet redan att han är rädd för det, och det texten berättar om personen i början får betydelse senare."
            - rubrik: "5. Vad tar du med dig?"
              text: "Visa vem din huvudperson är genom det hen gör, och berätta något som får betydelse senare, som det hen är rädd för."
      listor:
        - rubrik: Två texter om Amir
          kolumner:
            - Den första texten
            - Den andra texten
          rader:
            - - "Jag heter Amir och jag är tio år. Jag har svart hår och en blå jacka. Jag är snabb, och jag är bra på fotboll. Min bästa kompis heter Lisa. Hon tycker också om fotboll. Jag är rädd för mörker."
              - "Jag heter Amir och jag är tio år. På rasten är jag först ut på planen i min blå jacka, och jag har gjort mål innan de andra har hittat sina mössor. Lisa, min bästa kompis, säger att jag har motor i benen. Men när lampan slocknar i trapphuset står jag alldeles stilla."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två texterna?"]
            - ["I vilken lär du känna Amir bäst?"]
            - ["Var i texten märker du hur han är?"]
            - ["Vad kan hända Amir sen?"]
            - ["Vad tar du med dig till din del 1?"]
    - rubrik: "Strukturen, del 1: Galleriet"
      text:
        - "Mitt i skrivandet går alla ett varv och läser hur kamraterna har börjat dagens del. Var och en kan låna ett sätt att skriva och behåller sitt eget innehåll."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 2
              text: "Gör strukturen mitt i Skriv i pass 2, 4, 6 och 10. I pass 2 lär du ut den. Med fler än sex elever gör ni två gallerier, ett vid varje bord."
      listor:
        - rubrik: Så gör ni
          rader:
            - ["Skriv i din bok tills läraren säger till."]
            - ["Lägg boken öppen på din plats. Vill du inte visa din text, lägg boken stängd."]
            - ["Gå ett varv utan penna. Läs början på dagens del i varje bok."]
            - ["Stanna vid en kamrats bok, och peka på ett ställe där kamraten har använt dagens skrivfokus."]
            - ["Säg högt hur kamraten gjorde, som ”Han skriver vad fötterna känner.”"]
            - ["Gå tillbaka till din plats."]
            - ["Skriv vidare i din egen bok. När du lånar ett sätt att skriva, rita en stjärna i kanten."]
        - rubrik: Så tränar ni berättelsen
          rader:
            - ["Ni ser hur kamraterna har löst samma del, och ni får fler sätt att skriva er egen. Regeln är ”Samma sätt, ditt eget innehåll.”"]
    - rubrik: "Två texter, del 3: Källaren hos mormor"
      text:
        - "Läs båda texterna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 6
              text: "Läs båda texterna högt, och ställ frågorna i tur och ordning. Låt paren prata om fråga 2 och 3, och ta de andra frågorna i hela gruppen. Eleverna kan svara annat än det som står under Det du lyssnar efter, om de visar var i texten de ser det. Säg sedan: ”Den andra börjar med ett annat sinne än synen.” Läs ramens text för del 3, och fråga: ”Var gör den här texten samma sak?”"
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Samma källare och samma saker: lådorna, stolen, fönstret och kistan. Båda slutar vid kistan."
            - rubrik: "2. I vilken är du mest med?"
              text: "I den andra."
            - rubrik: "3. Vilka sinnen?"
              text: "Den första använder bara synen. Den andra använder lukten, hörseln när trappan knarrar, känseln när det är kallt och synen."
            - rubrik: "4. Hur börjar den andra?"
              text: "Med lukten. Källaren luktade jord och gamla äpplen."
            - rubrik: "5. Vad tar du med dig?"
              text: "Börja med ett annat sinne än synen, och använd minst två sinnen."
      listor:
        - rubrik: Två texter om samma källare
          kolumner:
            - Den första texten
            - Den andra texten
          rader:
            - - "Källaren hos mormor var stor och mörk. Där stod gamla lådor och en trasig stol. Golvet var av sten. Uppe vid taket fanns ett litet fönster. I hörnet stod en gammal kista med ett lock. Jag gick fram till kistan."
              - "Källaren hos mormor luktade jord och gamla äpplen. Trappan knarrade vid varje steg. Genom det lilla fönstret uppe vid taket föll en strimma ljus över gamla lådor och en trasig stol. Det var kallt, fast det var sommar. I hörnet stod en kista. Jag gick fram till den."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två texterna?"]
            - ["I vilken känns det mest som att du själv är i källaren?"]
            - ["Vilka sinnen använder texterna?"]
            - ["Hur börjar den andra texten?"]
            - ["Vad tar du med dig till din del 3?"]
    - rubrik: "Läsarmötet, del 4: Provläsningen"
      text:
        - "I pass 8 läser varje elev del 1–3 för barnet som boken är till. Barnet svarar på tre frågor och ritar den nya som huvudpersonen möter i del 4."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Före mötet
              text: "Mötet tar 20–25 minuter, och ni går till barnen eller de kommer till er. Ta med elevernas böcker, bladet Provläsningen, papper och kritor."
            - rubrik: Läsningen
              text: "Varje elev sitter med barnet, läser del 1–3 högt och visar bilderna. Den som läser långsamt berättar del 1 och 2 med egna ord och läser del 3."
            - rubrik: De tre frågorna
              text: "Eleven frågar ”Vad tyckte du bäst om? Vad förstod du inte? Vad vill du ska hända?” och skriver några ord vid varje fråga på bladet."
            - rubrik: Teckningen
              text: "Sedan berättar eleven att huvudpersonen möter någon ny i nästa del, och säger: ”Rita hur du tror att den ser ut.” Har eleven redan bestämt vem huvudpersonen möter, säger hen tre saker om den först. Teckningen blir bilden till del 4 i boken, och barnets namn står vid Bilder av på omslaget."
            - rubrik: Om något saknas
              text: "Är barnet borta, läser eleven för ett annat barn, men boken är fortfarande till samma barn. Är eleven borta, läser hen för barnet en annan dag. Går det inte att träffas, spelar eleverna in läsningen i pass 7 vid 50–60, och barnens lärare ställer frågorna och skickar svaren och teckningarna före pass 8. Då läser eleven svaren och tittar på teckningen i pass 8, 0–⁠25 min."
    - rubrik: "Provläsningen, del 4: Läsaren svarar"
      sagoform: { form: vag, titel: Provläsningen, undertitel: läsaren svarar, bilder: [ stjärna, förvånad, glödlampa, ryggsack ], radMm: 11 }
      text:
        - "Eleven läser del 1–3 för sin läsare, ställer frågorna och skriver svaret med några ord vid varje fråga."
      huvud:
        - { rubrik: Min läsare heter, text: "" }
      delar:
        - rubrik: Svaren
          falt:
            - { rubrik: 1 Det bästa, text: "Vad tyckte du bäst om?" }
            - { rubrik: 2 Det svåra, text: "Vad förstod du inte?" }
            - { rubrik: 3 Det som händer sen, text: "Vad vill du ska hända?" }
            - { rubrik: 4 Det jag tar med mig, text: "Det här tar jag med mig till del 4:" }
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "Kopiera ett blad per elev till pass 8. Eleven skriver några ord vid varje fråga, och du hjälper den som skriver långsamt." }
    - rubrik: "Två texter, del 5: Hopptornet"
      text:
        - "Läs båda texterna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Pass 10
              text: "Läs båda texterna högt, och ställ frågorna i tur och ordning. Låt paren prata om fråga 2 och 3, och ta de andra frågorna i hela gruppen. Eleverna kan svara annat än det som står under Det du lyssnar efter, om de visar var i texten de ser det. Säg sedan: ”Den andra visar rädslan i kroppen, och ögonblicket före valet får ta tid.” Läs ramens text för del 5, och fråga: ”Var gör den här texten samma sak?”\nMed Den magiska skogen läser du Vildas del 1: ”Men att hoppa ner från kastanjen vågar jag inte.” I del 5 lyssnar du efter benen som skakar. De tre stegen bakåt är ansatsen, och hoppet får vänta. Med Hunden som försvann är Bus rädd för åska, och i del 5 lyssnar du efter benen som inte vill lyda. Det som får honom att våga är Lovas röst."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Hopptornet, alla som tittar, och att hen hoppar till slut."
            - rubrik: "2. I vilken känner du mest?"
              text: "I den andra."
            - rubrik: "3. Var märker du att hen är rädd?"
              text: "Benen darrar, fingrarna blir vita och hen tar ett steg bakåt. Ordet rädd står inte."
            - rubrik: "4. Vad får hen att hoppa?"
              text: "Hen tänker på Mira, som väntar i vattnet. Valet har ett skäl."
            - rubrik: "5. Vad tar du med dig?"
              text: "Visa rädslan i kroppen, och låt ögonblicket före valet ta tid."
      listor:
        - rubrik: Två texter om samma hopptorn
          kolumner:
            - Den första texten
            - Den andra texten
          rader:
            - - "Jag stod högst upp i hopptornet. Det var jättehögt. Jag blev jätterädd och ville inte hoppa. Alla tittade på mig. Jag var så rädd. Men till slut hoppade jag ändå, och det gick bra."
              - "Jag stod högst upp i hopptornet. Vattnet var så långt ner att människorna såg små ut. Benen darrade, och jag höll så hårt i räcket att fingrarna blev vita. Alla tittade på mig. Jag tog ett steg bakåt. Sedan tänkte jag på Mira, som väntade i vattnet. Jag blundade och hoppade."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två texterna?"]
            - ["I vilken känner du mest hur det är att stå där?"]
            - ["Var märker du att den som berättar är rädd?"]
            - ["Vad får hen att hoppa?"]
            - ["Vad tar du med dig till din del 5?"]
    - rubrik: "Boksläppet, boken: Läsarna kommer"
      text:
        - "I pass 15 läser eleverna sina böcker för barnen i skolbiblioteket. Alla läser samtidigt, vid var sin läsplats, och barnen svarar på Läsarnas sida, sist i boken."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Före boksläppet
              text: "Gör en läsplats per författare, med stolar för två eller tre barn. Ha två exemplar av varje bok: ett till eleven och ett till barnets klass."
            - rubrik: Första rundan
              text: "Barnen kommer, och barnet som boken är till sätter sig hos sin författare, med en eller två kamrater ur klassen. Författaren läser hela boken och visar bilderna, och det tar omkring 15 minuter."
            - rubrik: Andra rundan
              text: "Barnen byter läsplats och väljer en del i taget genom att peka på en bild, och författaren läser den. Rundan tar omkring 10 minuter."
            - rubrik: Barnens svar
              text: "Efter andra rundan går barnen tillbaka till läsplatsen från första rundan. Barnet ritar det bästa i boken på Läsarnas sida, och författaren skriver det barnet säger på raden Jag tyckte om när, till exempel ”Jag tyckte om när ugglan pratade.”"
            - rubrik: Böckerna
              text: "Efter boksläppet lämnar du det andra exemplaret till barnets klass. Vill eleven ställa en bok i biblioteket, kopierar du den en gång till."
            - rubrik: Om något saknas
              text: "Den som inte vill läsa högt visar bilderna, och en kamrat eller du läser. Är ett barn borta, läser författaren för ett annat barn i första rundan. Kan barnen inte komma, bjuder ni in familjerna efter skoldagen."
    # ---------------------------------------------------------------- Hela kursen
    - rubrik: "Till läraren: återkopplingen"
      text:
        - "De flesta av kursens grepp för återkoppling gör ni mitt i boken, medan delen går att ändra. Eleven får något att ta ställning till, som en kamrats början, din fråga, ditt svar eller läsarens svar. Hen bestämmer direkt om hen tar med det, ändrar sin del eller behåller den, säger varför och skriver vidare. Efter varje del skriver eleven på Mitt mål vad hen tar med sig, och när nästa del börjar läser hen raden först."
      delar:
        - rubrik: Greppen
          falt:
            - rubrik: Två texter där en sak skiljer
              text: "I pass 2, 6 och 10 visar du två texter som är lika utom i skrivfokuset. Ramens text blir den tredje, och gruppen hittar samma sak i den."
            - rubrik: Dela
              text: "Det här gör ni sist i passet. I introduktionspasset läser alla en mening, och i fortsättningspasset läser eleven delen för en kamrat, som svarar med kortets baksida."
            - rubrik: Starterna runt bordet
              text: "Det här gör ni först i pass 13, som texten över fortsättningspassets tabell säger. Eleven väljer om hen ändrar sin början."
            - rubrik: Frågan över axeln
              text: "Det här gör du under Skriv i varje pass, som passets tabell och film 2 visar. Ställ en enda fråga, och eleven väljer om svaret ska med. I introduktionspasset skriver du frågan i snabbmallen."
            - rubrik: Två sätt i era texter
              text: "Det här gör ni i varje fortsättningspass, med de två versioner du skriver efter introduktionspasset. Ingen elevs mening blir den första versionen, och den andra bygger du på en elevs text bara när eleven har sagt ja."
            - rubrik: Galleriet
              text: "Det här gör ni mitt i Skriv i pass 2, 4, 6 och 10, som det står under Strukturen, del 1: Galleriet. Eleven ser hur kamraterna har löst samma del och kan låna ett sätt att skriva."
            - rubrik: Provläsningen
              text: "Det här gör ni i pass 8, när del 1–3 är skrivna. Barnet säger vad det tyckte bäst om, vad det inte förstod och vad det vill ska hända. Eleven använder svaren i pass 9 och pass 14."
            - rubrik: Före och efter
              text: "Det här gör ni i pass 14, som sidan Boken säger."
            - rubrik: Ditt svar
              text: "Efter pass 4 och pass 10 läser du delarna och skriver tre rader på en lapp, som du lägger i boken vid det ställe den gäller: ”Här var jag med”, ”Nu undrar jag” och en fråga om delens skrivfokus. Ett svar kan lyda: ”Här var jag med: där handtaget satt i stenen. Nu undrar jag: vem satte dit det? Vad hör hon bakom dörren?” Räkna med tre till fem minuter per text. Pass 5 och 11 börjar med att eleven läser lappen och svarar på den. Läs lappen högt för den som läser långsamt."
            - rubrik: Reglerna
              text: "Fråga vad varje text gör för läsaren. Ingen frågar vilken som är sämst. Du visar en elevs text för gruppen bara om eleven säger ja. Ett grepp mitt i skrivtiden, som Galleriet, tar högst fem minuter, och eleven skriver vidare direkt efter. Ingen tar upp stavningen i greppen."
    - rubrik: Kortet Berätta
