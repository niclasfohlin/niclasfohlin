        - "Eleven får veta vem boken är till, hör ramen och hittar på sin huvudperson."
        - Ingen
        - "Barnets namn överst på Min ram"
      - - "Del 1\nPass 2–3"
        - "Vilda vågar klättra men inte hoppa."
        - Personen
        - "Galleriet, pass 2"
      - - "Del 2\nPass 4–5"
        - Vilda hittar ett handtag i klippan.
        - Spänningen
        - "Du svarar skriftligt efter pass 4"
      - - "Del 3\nPass 6–7"
        - Skogen bakom klippan är annorlunda.
        - Platsen med sinnena
        - "Galleriet, pass 6"
      - - "Del 4\nPass 8–9"
        - "Vilda möter en liten vän som behöver hjälp."
        - Dialogen
        - "Barnet svarar och ritar vännen"
      - - "Del 5\nPass 10–11"
        - "Vilda vågar inte hoppa, men måste välja."
        - Faran och valet
        - "Du svarar skriftligt efter pass 10"
      - - "Del 6\nPass 12–13"
        - "Vilda kommer hem med ett silverlöv."
        - Slutet
        - "Starterna, pass 13"
