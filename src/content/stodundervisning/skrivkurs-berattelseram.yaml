diplom:
  kicker: Skrivkursen
  rubrik: Diplom
  text:
    - tilldelas
    - ___
    - som har genomfört en skrivkurs och skrivit boken
    - ___
    - Innehavaren av detta diplom har tagit sina första steg till att bli en författare.
    - Grattis!
  underskrifter:
    - Datum
    - Lärare
lathund:
  innehall: En bok var, sex delar
  metoden:
    text:
      - "Lärarledd skrivkurs i liten grupp. Gruppen skriver en berättelse i sex delar utifrån en färdig berättelseram. Alla följer samma rörelse i handlingen, men varje elev skriver sin egen bok med egna personer, platser och händelser. Kursen är cirka fjorton pass: ett startpass, två pass per del och ett sista pass där texterna häftas till böcker som läses för en inbjuden läsare."
      - "Skillnaden mot vanligt skrivande: ramen finns redan, läraren undervisar om ett skrivfokus per del, och alla berättar muntligt innan de skriver."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Ramen styr rörelsen, inte meningarna.
          text: Styr uppgiften varje mening blir alla texter lika.
        - fet: Alla berättar innan de skriver.
          text: Idén får en första form och ingen sitter med tom sida.
        - fet: Grepp lånas, innehåll är eget.
          text: En inledning får fler pröva. Kamratens huvudperson är kamratens.
    tabell:
      rubrik: De fyra stegen · vad du gör och säger
      kolumner:
        - Steg
        - Exempelfraser
      rader:
        - - |-
            1 · Ramen
            0–10 min. Var är vi? Någon läser upp.
          - |-
            ”I dag är vi i del tre. Huvudpersonen går in i skogen.”
            ”Ramen säger att något är annorlunda. Vad, bestämmer du.”
        - - |-
            2 · Skrivfokus
            10–25 min. Mentortext, modellera, samla.
          - |-
            ”Hör ni att författaren aldrig skriver läskigt? Vad gör hon i stället?”
            ”Jag provar en mening. Nej, jag ändrar.”
        - - |-
            3 · Berätta
            25–30 min. I par, innan någon skriver.
          - |-
            ”Berätta för din kompis vad som händer i din del.”
            ”Fråga din kompis: vad går fel?”
        - - |-
            4 · Skriv
            30–60 min. Skriv, dela tre meningar, ändra en sak.
          - |-
            ”Här visar du att han är rädd utan ordet rädd. Läs den sen.”
            ”Vilket grepp lånar du av Nora?”
    not: "Så sätter du ihop gruppen: presentera kursen i klasserna med skylt och diplom och fråga vilka som vill vara med. Två till fyra elever som behöver stöd är valda i förväg, två eller fler som skriver med flyt bjuds in. Alla i gruppen är utvalda."
  pass:
    rubrik: "Vi kör ett pass: In i skogen, del 3"
    textRubrik: Gruppen · sex elever, åk 4, skrivfokus miljö med sinnena
    utskrift: Skriv ut passexemplet
    text:
      - Läraren pekar på del 3 i ramen. ”I dag går era huvudpersoner in i skogen. Hur den är annorlunda bestämmer ni.” Leo läser meningen där hans huvudperson hittar dörren i berget.
      - "Mentortexten läses högt: ”Det första jag märkte var tystnaden.” Läraren stannar: ”Hon börjar med ett öra, inte med ögonen.” På tavlan: se, höra, känna, lukta. Läraren skriver egna meningar och ändrar sig högt. Gruppen fyller spalten: silverlöv, ljus utan sol."
      - "Eleverna berättar i par. Elias sitter tyst tills Nora frågar: ”Vad hör din huvudperson först?” Ett tickande, som en klocka. ”Skriv den meningen först.” Adam ändrar ”konstig mark” till ”marken gungade som en säng”."
      - "Tre elever läser upp en mening med ett sinne. Alla ändrar en sak. Notering: Elias berättar för läraren innan han skriver, Adams mening blir mentortext nästa pass."
    forberett:
      rubrik: Det jag förberedde
      text:
        - "Läst del 3 i ramen. Valt mentortexten ur ramen. Skrivit mina två egna meningar i förväg. Tavlan med fyra spalter: se, höra, känna, lukta."
    klarTidigt: Läs delen för en kamrat, lägg till en mening med dagens skrivfokus eller rita bokens bild till delen.
    schema:
      rubrik: 60 minuter, steg för steg
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Läs dagens del i ramen. Välj mentortext. Skriv dina egna meningar i förväg.
        - tid: 0–10
          fas: 1 · Ramen
          vad: Visa ramen, peka på dagens del. Två elever läser upp en mening från förra passet.
        - tid: 10–25
          fas: 2 · Skrivfokus
          vad: Mentortext högt. Tänk högt om greppet. Skriv egna meningar på tavlan. Samla gruppens förslag.
        - tid: 25–30
          fas: 3 · Berätta
          vad: "I par: berätta din del från början till slut. Kamraten frågar vad som går fel."
        - tid: 30–50
          fas: 4 · Skriv
          vad: Alla skriver. Du cirkulerar och pekar på skrivfokuset där eleven redan gjort det.
        - tid: 50–60
          fas: Dela och bearbeta
          vad: Tre meningar läses upp. Alla ändrar en sak. Kort notering.
