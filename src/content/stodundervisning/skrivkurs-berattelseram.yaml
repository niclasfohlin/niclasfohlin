film:
  sekunder: 29.71
  beskrivning: "Läraren pekar på dagens del i ramen. Läraren säger: ”Hur skogen är annorlunda bestämmer ni.” Läraren skriver sin egen del och tänker högt. Läraren skriver: ”Det luktade blött.” Läraren säger: ”Nej, sött, som pannkakor.” Läraren skriver: ”sött, som pannkakor.” Läraren vänder bort blocket. Eleverna berättar först. Nora frågar: ”Vad hör eller känner hen först?” Elias säger: ”Ett tickande, som en klocka!” Läraren går till Elias. Läraren säger: ”Skriv den meningen först.” Elias skriver: ”Ett tickande, som en klocka, hördes bakom träden.”"
  rubrik: "Så visar du skrivfokuset"
  ingress: "Fyra bilder ur filmen om det första passet i en del. Läraren pekar på dagens del i ramen och skriver sin del i sin bok på blädderblocket medan hon tänker högt. Sedan berättar eleverna i par, och Elias skriver det han berättade. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Läraren visar dagens del, och eleverna bestämmer hur."
    - text: "Läraren börjar med lukten, tvekar och byter ord."
    - text: "Nora ställer dagens fråga, och Elias berättar."
    - text: "Elias börjar sin del med det han berättade."
filmer:
  - nr: 2
    titel: "När läraren läser över axeln"
    sekunder: 28.23
    beskrivning: "Läraren läser över Adams axel. Läraren pekar där Adam redan har använt skrivfokuset. Läraren säger: ”Här använder du örat. Det är dagens skrivfokus.” Läraren frågar om det som saknas. Läraren säger: ”Du skriver att marken var konstig. Vad kände fötterna?” Adam ändrar själv till ”marken gungade som en säng”. Adam skriver: ”gungade som en säng.” Adam får läsa meningen för gruppen sist i passet. Läraren säger: ”Läs den meningen för oss sen.”"
    rubrik: "Skrivtiden: när läraren läser över axeln"
    ingress: "Fyra bilder ur filmen om skrivtiden: läraren pekar där Adam redan har använt skrivfokuset och ställer en fråga där en detalj saknas. Adam ändrar själv och får läsa meningen för gruppen sist i passet. Filmen på metodens sida visar samma sak i rörelse."
    efter: "tidsschema"
    stillbilder:
      - text: "Läraren pekar där Adam redan har använt skrivfokuset."
      - text: "Läraren frågar om det som saknas och skriver inget."
      - text: "Adam ändrar själv till ”marken gungade som en säng”."
      - text: "Adam får läsa meningen för gruppen sist i passet."
  - nr: 3
    titel: "Galleriet"
    sekunder: 24.62
    beskrivning: "Mitt i skrivandet lägger alla boken öppen och går ett varv. Var och en pekar där hen såg dagens skrivfokus, Sofia i Adams bok. Sofia säger: ”Han skriver vad fötterna känner.” Alla går tillbaka och lånar ett sätt, inte det som händer. Läraren säger: ”Samma sätt, ditt eget innehåll.” Nora skriver vidare om marken i sin skog. Nora skriver: ”kall som snö mitt i sommaren.”"
    rubrik: "Galleriet: samma sätt, ditt eget innehåll"
    ingress: "Fyra bilder ur filmen om Galleriet. Böckerna ligger öppna, och alla går ett varv och pekar där de såg dagens skrivfokus. Sofia säger hur Adam gjorde, läraren säger regeln, och Nora lånar sättet till marken i sin skog. Filmen på metodens sida visar samma sak i rörelse."
    efter: "ram: Strukturen, del 1: Galleriet"
    stillbilder:
      - text: "Alla lägger boken öppen och går ett varv."
      - text: "Sofia säger högt hur Adam gjorde."
      - text: "Läraren säger regeln: samma sätt, ditt eget innehåll."
      - text: "Nora lånar sättet och sätter en stjärna i kanten."
