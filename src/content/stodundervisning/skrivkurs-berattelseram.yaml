              text: "Säg samma ord båda gångerna, och skriv dem på tavlan: ”Titta på bilden. Skriv en berättelse om det som händer. Du har en kvart.” Säg inget om vad berättelsen ska innehålla."
            - rubrik: Bilderna
              text: "Välj två bilder utan text av samma slag, där var och en visar en plats och en person som det händer något med. Spara den andra till pass 14."
    - rubrik: Till läraren i den yngre klassen
      text:
        - "Skriv in datum, klockslag, rum och ditt namn, och ge bladet till läraren i den yngre klassen före kursen. Vik undan de här raderna innan du lämnar bladet."
      delar:
        - rubrik: Till dig som har barnen vi skriver för
          falt:
