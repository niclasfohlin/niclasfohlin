# Omtaget 2026-10-09: analysen står i methods/skrivkurs-berattelseram/analys-omtag-2026-10.md.
titel: "Skrivkurs: gemensam berättelseram"
undertitel: Lärarledd skrivkurs i liten grupp där varje elev skriver sin egen bok inom en gemensam ram, för åk 3–6
ingress: "En skrivkurs i liten grupp där eleverna lär sig bygga en berättelse del för del. Var och en skriver sin egen bok till ett yngre barn, i sex delar efter samma ram. Du visar ett skrivfokus i varje del, och alla berättar innan de skriver. Du blandar elever som behöver stöd med elever som skriver med flyt."
omrade: Skrivning
arskurs:
  - F-3
  - 4-6
arskursText: åk 3–6
taggar:
  - textstruktur
  - skrivstrategier
  - formativ-bedomning
format:
  - liten grupp
  - par
  - enskilt
tid: 60 minuter per pass, två till tre gånger i veckan
period: Fem till åtta veckor
grupp: Fyra till tio elever
material:
  - berättelseramen
  - elevens bok och blad
  - kortet Berätta
  - blädderblock
  - skylt och diplom
  - häftapparat
uppdaterad: 2026-10-09
relaterade:
  - skrivkurs-vardeskapande
  - skrivkurs-sagoboken
  - ordverkstad-i-grupp
utkast: false
inledning:
  - "Skrivkurs: gemensam berättelseram är en kurs för fyra till tio elever i åk 3–6. Alla följer samma ram i sex delar, men var och en skriver sin egen bok, med egna personer, platser och händelser. Ramen säger i sex korta stycken vad som händer, till exempel att huvudpersonen går in i en skog som är annorlunda. Hur skogen är annorlunda bestämmer eleven. Två ramar är färdiga, Den magiska skogen och Hunden som försvann, och en tredje gör du med gruppen. Boken är till ett yngre barn."
  - "På bordet ligger elevens bok, där eleven skriver dagens del på en sida med en ruta att rita i. Där ligger också bladet Min ram, där eleven skriver sina val för varje del, och bladet Mitt mål. Kortet Berätta, med frågorna kamraten ställer, ligger mellan två elever. På tavlan står ramen, och på blädderblocket skriver du din egen bok i samma ram, en del i taget."
  - "Eleven lär sig genom att se dig skriva och höra dig tänka högt. I varje del visar du ett skrivfokus, som att börja med ett annat sinne än synen eller visa en känsla i kroppen, och du tvekar och ändrar på blädderblocket. Sedan berättar alla sin del för en kamrat innan de skriver. Medan de skriver läser du över axeln och ställer en fråga, och mitt i skrivtiden läser de början på varandras delar i Galleriet. Där lånar de ett sätt att skriva men inte det som händer, och bestämmer vad de ändrar. Efter varje del skriver eleven på Mitt mål vad hen tar med sig till nästa. Barnet ger eleven någon att skriva för: en sexåring måste förstå var skogen är och vem som pratar."
  - "Kursen har 15 pass. I pass 1 får eleven veta vilket barn boken är till, skriver en kort berättelse till en bild och ritar sin huvudperson. Sedan tar varje del två pass. I introduktionspasset visar du ett skrivfokus och eleverna börjar på delen. I fortsättningspasset läser de först sin början igen, ser två sätt att skriva samma ställe och skriver sedan klart. I början av pass 8 provläser eleven del 1–3 för barnet, som ritar vännen i del 4. I pass 14 gör eleverna boken klar, och i pass 15 läser de böckerna för barnen på ett boksläpp i biblioteket."
  - "Ett exempel: Elias i åk 4 skriver till Tove, som är sex år. I del 3 frågar kamraten honom ”Vad hör eller känner hen först?”, och hans skog börjar med ett tickande, som en klocka. I pass 8 ritar Tove vännen som bor i skogen, och teckningen ligger på bordet när Elias skriver del 4."
upplagg:
  rubrik: Så fungerar insatsen
  text: "Kursen har 15 pass om 60 minuter, två till tre i veckan under fem till åtta veckor, och gruppen har fyra till tio elever. Alla följer samma ram i sex delar, men var och en skriver sin egen bok till ett yngre barn. Varje del tar två pass med fem steg: Ramen, Skrivfokus, Berätta, Skriv och Dela. I introduktionspasset visar du ett skrivfokus och eleverna börjar på delen, och i fortsättningspasset skriver de klart. Efter del 3 provläser eleven för barnet. I pass 14 gör eleverna boken klar, och pass 15 är boksläppet. I pass 1 och 14 skriver eleven en kort berättelse till en bild, och ni jämför dem."
gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Kursen är för elever i åk 3–6 som skriver några meningar själva eller med skrivstöd, men vars berättelser tar slut när problemet kommer. Den som ännu inte ljudar ihop ord behöver läsinlärning först. Du väljer i förväg två till fyra elever som behöver stöd. Sedan presenterar du kursen i klasserna med skylt och diplom, ”En skrivkurs där vi skriver en hel bok var”, och frågar vilka som vill vara med. Två eller fler som skriver med flyt anmäler sig, och de ger gruppen kamrattexter att låna grepp ur. Gruppen har fyra till tio elever, och ingen vet vem som är vald av vilket skäl. Alla är utvalda."
principer:
  rubrik: Tre saker att hålla fast vid
  text: "Ramen styr rörelsen, inte meningarna. Om uppgiften styr varje mening blir alla texter lika, och elevens röst försvinner. Alla berättar muntligt för en kamrat innan de skriver, eftersom det ger idén en första form och gör att ingen sitter med en tom sida. Och eleverna lånar grepp av varandra men behåller sitt eget innehåll: en spännande inledning eller ett sätt att visa en känsla får andra pröva, men kamratens huvudperson och händelser förblir kamratens."
tabeller:
  - rubrik: Vad ramen bestämmer och vad eleven bestämmer
    plats: efter-inledning
    kolumner:
      - Det gemensamma
      - Det varje elev gör till sitt
    rader:
      - - Tema och genre
        - Huvudperson och andra karaktärer
      - - Berättelsens rörelse i sex delar
        - Plats och miljö
      - - Ett skrivfokus per del
        - Det konkreta problemet
      - - "Läsaren: ett yngre barn"
        - Händelser, vändning och slut
      - - Gemensamma ord, exempel och samtal
        - Berättelsens röst och ton
  - rubrik: Kursen pass för pass
    plats: efter-inledning
    meny: true
    karta: true
    text: "Tabellen visar alla 15 pass. I del 1–6 visar den vad som händer Vilda, huvudpersonen i Den magiska skogen. Det som bara gäller passen i en viss del står på delens sida, under Till läraren: delarna."
    kolumner:
      - Delen
      - Det som händer
      - Skrivfokus
      - Läsaren och svaren
    rader:
