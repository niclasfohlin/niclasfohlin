    not: "Läsarna är yngre barn, och det du ska boka står i listan Före kursen. Tabellen Läsarna i olika skolformer säger hur du gör när skolan saknar yngre elever."
  - rubrik: "Fortsättningspasset, 60 minuter"
    plats: efter-tidsschema
    text: "Fortsättningspasset har samma fem steg som introduktionspasset och går i pass 3, 5, 7, 9, 11 och 13. Pass 3 och 7 börjar som tabellen visar, pass 5 och 11 med ditt svar och pass 9 med barnets. Pass 13 börjar med Starterna runt bordet. Du läser din egen början först. Sedan läser var och en sin början högt, och de andra säger var de var med och vad de undrar. Är ni fler än sex, sitter ni vid två bord. I pass 3 har eleven inget mål än, så i Dela läser hen bara delen."
    kolumner:
      - Tid
      - Steg
      - Det som händer
    rader:
      - - 0–⁠8 min
        - Ramen
        - "Var och en läser tyst sin påbörjade del och ändrar eller behåller sin början."
      - - 8–⁠13 min
        - "Skrivfokus: Två sätt i era texter"
        - "Visa dina två versioner: ”Vad gör den andra för läsaren?” Sudda dem och säg: ”Samma sätt, ditt eget innehåll.” Alla prövar greppet."
      - - 13–⁠17 min
        - Berätta
        - Paren berättar resten av delen.
      - - 17–⁠45 min
        - Skriv
        - Skriv klart. Frågan över axeln.
      - - 45–⁠50 min
        - "Skriv: delens bild"
        - "Alla ritar bilden. I Min ram ringar de in det som kan återkomma."
      - - 50–⁠60 min
        - Dela
        - "Eleven säger sitt mål och läser delen. Kamraten säger var hen var med, vad hen undrar och om målet hördes. Eleven ändrar där kamraten undrade och skriver ett nytt mål."
  - rubrik: Det du ser, och det du gör
    plats: efter-fastnar
    text: "Det här brukar hända i kursen, och så gör du."
    kolumner:
      - Det du ser
      - Det du gör
    rader:
      - - Ett namn eller en sak ändras mellan delarna
        - I pass 13 läser eleven hela boken och ändrar så att det stämmer.
      - - Eleven lånar kamratens händelse
        - "Fråga ”Hur gjorde Nora, och hur blir det i din berättelse?” Låt eleven byta kamratens ord mot sina: finns sättet kvar, har hen lånat ett grepp."
      - - Eleven vill lösa faran med ett slag eller ett skott
        - "Säg ”Din bok är till Tove. Hur kan din huvudperson komma undan utan att någon skadas?”"
      - - "Eleven skriver ”Hon blev rädd.”"
        - "Fråga ”Hur märker läsaren det?”"
      - - Delen växer, och eleven hinner inte klart
        - "Hellre en halv sida färdig. Eleven stryker en mening som säger något läsaren redan vet."
      - - Eleven var borta i introduktionspasset
        - "I Berätta berättar hen delen för dig med dagens fråga och läser ramens text. Sedan skriver hen en halv sida."
      - - Eleven vill inte läsa sin text högt
        - "I Dela läser du eller kamraten. På boksläppet läser en kamrat, och eleven visar bilderna."
  - rubrik: Läsarna i olika skolformer
