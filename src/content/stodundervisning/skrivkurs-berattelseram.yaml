lathund:
  innehall: En bok var, sex delar
  metoden:
    text:
      - "Lärarledd skrivkurs i liten grupp. Alla följer en färdig ram i sex delar, men var och en skriver sin egen bok till ett yngre barn. Kursen är 15 pass: ett startpass, två pass per del, ett pass där boken blir klar och ett boksläpp där eleverna läser för barnen."
      - "Det som skiljer sig från vanligt skrivande är att ramen finns redan och att du visar ett skrivfokus per del med din egen bok på blädderblocket."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Ramen styr rörelsen, inte meningarna.
          text: Styr uppgiften varje mening, blir texterna lika.
        - fet: Alla berättar innan de skriver.
          text: Idén får en första form och ingen sitter med tom sida.
        - fet: Grepp lånas, innehåll är eget.
          text: Fler får pröva en inledning. Kamratens huvudperson är kamratens.
    tabell:
      rubrik: De fem stegen · vad du säger
      kolumner:
        - Steg
        - Exempelfraser
      rader:
        - - |-
            1 · Ramen
            0–⁠5 min
          - ”Något är annorlunda, säger ramen. Ni bestämmer vad.”
        - - |-
            2 · Skrivfokus
            5–⁠20 min
          - ”Hör ni att hon aldrig skriver ordet läskigt?”
        - - |-
            3 · Berätta
            20–⁠28 min
          - ”Bra. Skriv det du just sa.”
        - - |-
            4 · Skriv
            28–⁠52 min
          - ”Här visar du att han är rädd utan ordet rädd.”
        - - |-
            5 · Dela
            52–⁠60 min
          - ”Vilket grepp lånade du av Nora?”
    not: "Så sätter du ihop gruppen: välj i förväg två till fyra elever som behöver stöd. Presentera kursen i klasserna med skylt och diplom och fråga vilka som vill vara med. Två eller fler som skriver med flyt kommer med via anmälan. Alla är utvalda."
  pass:
    rubrik: "Vi kör ett pass: In i skogen, del 3"
    textRubrik: Gruppen · sex elever, åk 4, skrivfokus miljö med sinnena
    utskrift: Skriv ut passexemplet
    text:
      - "Läraren läser sin del 2 från blädderblocket och pekar på del 3 i ramen. ”Hur skogen är annorlunda bestämmer ni.”"
      - "Den andra texten om mormors källare börjar med lukten. Läraren läser ramens text: ”Det första jag märkte var tystnaden.” ”Hon börjar med ett öra, inte med ögonen”, säger Yasmin. Läraren skriver sin del och tvekar högt."
      - "I par ställer Nora dagens fråga: ”Vad hör eller känner hen först?” Elias svarar: ”Ett tickande, som en klocka.” Läraren säger: ”Skriv den meningen först.” Hon frågar Adam ”Vad kände fötterna?”, och han ändrar till ”marken gungade som en säng”."
      - "Vid minut 38 går alla ett varv i Galleriet. Nora lånar sättet till sin egen mark. Sist läser alla en mening med ett sinne och ändrar en sak."
    forberett:
      rubrik: Det jag förberedde
      text:
        - "Jag läste del 3 i ramen och skrev min del på papper. Två texter om källaren och ramens text låg framme. På tavlan stod skrivfokuset och dagens fråga."
    klarTidigt: Läs delen för en kamrat, lägg till en mening med dagens skrivfokus eller rita delens bild.
    schema:
      rubrik: Pass 6, steg för steg
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Läs delens sida och del 3 i ramen. Skriv ett utkast till din del, och dagens fråga på tavlan.
        - tid: 0–5
          fas: 1 · Ramen
          vad: Läs din del 2. Eleven läser slutet på sin del 2 och raden på Mitt mål. Peka på del 3.
        - tid: 5–20
          fas: 2 · Skrivfokus
          vad: Två texter om källaren, och ramens text. Skriv din del och tänk högt.
        - tid: 20–28
          fas: 3 · Berätta
          vad: "I par, med kortet: dagens fråga först. Sist skriver eleven sina val i Min ram."
        - tid: 28–52
          fas: 4 · Skriv
          vad: Alla skriver. Du frågar över axeln. Galleriet vid minut 38.
        - tid: 52–60
          fas: 5 · Dela
          vad: En mening var. Den som lånade säger av vem. Alla ändrar en sak.
