# Ny metod 2026-10-02 ur Niclas beskrivning i chatten (intake/kompissamtal.md). Analysen står i analys.md och
# sökningarna i sokning.md. Området Socialt är riggens förslag till sajten (K-190).
titel: Kompissamtal
undertitel: Vuxenledda samtal i liten grupp där eleverna lär sig lyssna, säga hur de tänker och komma överens, för F–9
ingress: Du leder tre till fem korta samtal med en liten grupp elever som behöver stöd i att prata och samarbeta med varandra. En talpinne visar vem som talar, och eleverna övar att säga ”jag tänker” och ”jag undrar” utan att anklaga. Varje samtal slutar med en överenskommelse som eleverna prövar i vardagen och du följer upp.
omrade: Socialt
arskurs:
  - F-3
  - 4-6
  - 7-9
arskursText: F–9
taggar:
