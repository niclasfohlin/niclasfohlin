        kolumner:
          - Teknik
          - Så gör du
          - Så låter det
        rader:
          - - "Modellera"
            - "Säg rundans mening eller ett jag-⁠budskap själv först, och håll det kort, så att eleverna hör hur det låter."
            - "”Jag känner mig glad när vi leker.”"
          - - "Öppna frågor"
            - "Börja frågorna med vad eller hur, och vänta på svaret. Fråga aldrig varför någon gjorde något."
            - "”Vad hände?” ”Vad tänkte du då?” ”Hur kändes det?”"
          - - "Spegla"
            - "Säg med egna ord det eleven sa och hur det kändes, och fråga om det stämmer."
            - "”Du blev arg när Elsa ropade fusk. Stämmer det?”"
          - - "Kamratspegling"
            - "Be en elev säga med egna ord vad kamraten sa, innan hen svarar själv."
            - "”Kan du säga med egna ord vad Omar sa?”"
          - - "Säg önskan bakom"
            - "När eleverna anklagar varandra, säg vad var och en själv vill."
            - "”Du vill att det ska vara rättvist.” ”Och du vill veta var linjen går.”"
          - - "Sammanfatta"
            - "Säg kort vad var och en har sagt, utan att döma, och fråga om något saknas."
            - "”Omar blev arg, och Elsa tänker att linjen inte var bestämd. Har jag missat något?”"
          - - "Fråga när det gick bra"
            - "Fråga när det har gått bättre och vad eleverna gjorde då, och fråga om de kommer på något mer."
            - "”När gick det bättre? Vad gjorde ni då? Något mer?”"
          - - "Rulla med motståndet"
            - "Argumentera inte. Säg med egna ord vad eleverna sa, och säg att det är de som bestämmer vad de ska göra."
            - "”Ni tycker att det fungerar som det är. Det är ni som bestämmer.”"
      - typ: not
        text: Öva på en eller två tekniker i taget. Eleverna lär sig också kamratspeglingen och jag-⁠budskapet.
  material:
    rubrik: Vad du behöver för ett kompissamtal
    var:
      rubrik: Var materialet finns
      punkter:
        - fet: Korten och bladet.
          text: De finns i planeringsmallarna (Word), under Material att skriva ut.
        - fet: Lapparna hem.
          text: En lapp går hem före samtal 1 och en efter varje samtal. Lapparna och snabbmallen finns i planeringsmallarna (Word), och du fyller i dem samma dag som samtalet.
        - fet: Talpinnen.
          text: Den kan vara en kort pinne, en slät sten eller ett litet gosedjur. Ingen kastar den.
        - fet: De vuxna runt gruppen.
          text: Ge dem kortet Så kan du säga. Efter varje samtal får de också överenskommelsen, så att de kan lägga märke till det som fungerar.
    bordet:
      - Talpinnen mitt på bordet
      - Korten till hands, att ta fram vid behov
      - Bladet Vår överenskommelse och en penna
      - Papper för förslagen
      - Förra bladet, från och med samtal 2
    varjePass: Samma dag fyller du i snabbmallen och lapparna hem och berättar för de vuxna.
film:
  sekunder: 29.67
  beskrivning: "Läraren säger: ”Jag känner mig glad när vi leker.” Elsa säger: ”Jag känner mig glad när vi vinner.” Sedan tar den som vill tala talpinnen. Omar säger: ”Elsa skriker alltid fusk!” Läraren speglar och visar kortet. Läraren säger: ”Du blev arg. Stämmer det?” Omar säger till Elsa: ”När du ropar fusk, känner jag mig arg.” Noor säger: ”Jag undrar hur det är för dig, Liam.” Liam säger: ”Jag känner mig ensam när ingen passar.” Gruppen väljer ett förslag. Läraren frågar: ”Kan alla göra det här?” Tummarna går upp, och Elsa skriver på bladet."
  rubrik: "Så gör eleverna"
  ingress: "Fyra bilder ur filmen om samtal 1 med Elsa, Omar, Noor och Liam i åk 4. I rundan gör läraren meningen färdig först, och sedan gör den som har talpinnen likadant. Läraren säger med egna ord att Omar blev arg, och Omar använder orden på kortet för att säga hur det kändes. Noor undrar hur Liam har det, och gruppen kommer överens."
  stillbilder:
    - text: "Läraren börjar, och sedan talar den som har talpinnen."
    - text: "Läraren tar emot känslan, och Omar använder kortet."
    - text: "Noor undrar hur Liam har det, och Liam svarar."
    - text: "Läraren frågar om alla kan göra det. Tummarna går upp."
filmer:
  - nr: 2
    sekunder: 17.81
    beskrivning: "Det är rast mellan samtalen, och Omar frågar Liam. Omar frågar: ”Vill du vara med, Liam?” Liam säger: ”Ja!” Noor tänker: ”Det berättar jag i samtalet.” I samtal 2 går talpinnen ett varv, och eleverna berömmer varandra. Läraren säger: ”Jag såg att du ___”. Noor säger till Omar: ”Omar, jag såg att du frågade Liam.” Omar säger till Noor: ”Tack för att du såg det, Noor.”"
    rubrik: "Samtal 2: det vi har sett"
    ingress: "Fyra bilder ur filmen om tiden mellan samtal 1 och samtal 2. På rasten gör Omar det han lovade och frågar om Liam vill vara med, och Noor lägger märke till det. I samtal 2 berättar Noor det för Omar, och Omar tackar."
    efter: "tabell: Mellan samtalen"
    stillbilder:
      - text: "På rasten gör Omar det han lovade i samtal 1."
      - text: "Noor ser det och tar det med till samtal 2."
      - text: "Noor berättar för Omar vad hon såg på rasten."
      - text: "Omar tackar, och talpinnen går vidare."
