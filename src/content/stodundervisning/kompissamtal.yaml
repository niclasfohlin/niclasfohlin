  pass:
    rubrik: "Ett kompissamtal: samtal 1"
    textRubrik: Gruppen · fyra elever i åk 4, samtal 1
    text:
      - Rundans mening är ”Jag känner mig glad när vi ___.” Läraren gör den färdig först. Liam står över och svarar när varvet är klart.
      - "Omar tar talpinnen: ”Elsa skriker alltid fusk!” Läraren säger: ”Du blev arg när Elsa ropade fusk. Stämmer det?” Läraren tar fram kortet Så kan du säga, och Omar säger till Elsa: ”När du ropar fusk, känner jag mig arg.” Noor tar talpinnen: ”Jag undrar hur det är för dig, Liam.” Liam tar talpinnen och svarar: ”Jag känner mig ensam när ingen passar.”"
      - "Gruppen väljer: ”Innan matchen bestämmer vi var linjerna går.” Alla visar tummen upp. I sista varvet säger var och en vad hen ska göra och tackar någon. Omar säger: ”Jag frågar Liam om han vill vara med.” Noor ska lägga märke till vad Omar gör."
    forberett:
      rubrik: Det jag förberedde
      text:
        - Pratat kort med var och en, frågat om de vill vara med och hur bra det fungerar, från 0 till 10. Bestämt att Omar och Elsa inte sitter bredvid varandra.
        - "Planerat tiderna för samtal 1, som har en längre Starta: Starta 0–⁠6, Rundan 6–⁠9, Reda ut 9–⁠13, Komma överens 13–⁠17 och Avsluta 17–⁠20. Med fem eller sex elever hade Komma överens fått 13–⁠16 och Avsluta 16–⁠20."
    klarTidigt: Låt talpinnen gå ett varv till med frågan ”Vad var bra i dag?”
    schema:
      rubrik: 20 minuter, del för del
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Bestäm var eleverna ska sitta. Lägg talpinnen mitt på bordet, och ha korten och bladet till hands.
        - tid: 0–4
          fas: 1 · Starta
          vad: "I samtal 1 visar du talpinnen, läser reglerna och säger ”Du är dum” och sedan ”När du säger så, känner jag mig ledsen”. Säg varje gång att det ni berättar stannar i rummet."
        - tid: 4–7
          fas: 2 · Rundan
          vad: Du säger rundans mening och gör den färdig först. I samtal 2 är den ”Jag såg att du ___”, och i samtal 3 ”Jag tänker att det har blivit bättre när ___”.
        - tid: 7–13
          fas: 3 · Reda ut
          vad: Nicka åt den som räcker upp handen och har sagt minst. I samtal 2 börjar du med det som har blivit bättre, och i samtal 3 med det som ska fortsätta.
          fraser:
            - Vad hände? Hur kändes det?
        - tid: 13–17
          fas: 4 · Komma överens
          vad: Fråga om förslaget går att se, om det säger vad ni gör och om alla kan säga ja. I samtal 2 behåller ni överenskommelsen, ändrar den eller lägger till något. I samtal 3 väljer gruppen det som ska fortsätta.
          fraser:
            - Hur ser det ut när ni gör det?
        - tid: 17–20
          fas: 5 · Avsluta
          vad: Var och en säger vad hen ska göra och tackar någon, och du skriver det och nästa samtal på bladet. I samtal 1 ger du varje elev en kamrat att lägga märke till. Efteråt fyller du i snabbmallen och lapparna hem.
  mall:
    rubrik: Samtalsteknikerna
    underrad: Lärarens kort att ha i handen, samma som under Material att skriva ut
    block:
      - typ: tabell
