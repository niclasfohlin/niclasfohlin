lathund:
  innehall: Det som skaver i gruppen
  metoden:
    text:
      - Du leder samtal med en liten grupp, där eleverna lär sig lyssna, säga hur de tänker och känner utan att anklaga varandra, och komma överens. Talpinnen visar vem som talar, och varje samtal slutar i en överenskommelse som gruppen prövar i vardagen.
      - Gruppen har tre samtal, ett i veckan, och sedan ett eller två till vid behov. Före samtal 1 pratar du med varje elev, skickar lappen hem och berättar om samtalen för de vuxna runt gruppen. Säger en elev att hen har blivit kränkt, följer du skolans rutin, och den går före samtalen.
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Samtala när alla är lugna.
          text: Ta aldrig samtalet mitt i ett bråk. Boka en tid.
        - fet: Var varken polis eller domare.
          text: Ta emot känslan, och fråga vad som ska hända nu.
        - fet: Följ alltid upp överenskommelsen.
          text: Varje samtal börjar med det som har hänt sedan sist.
    tabell:
      rubrik: Passet i fem delar
      kolumner:
        - Del
        - Du kan säga
      rader:
        - - |-
            1 · Starta
            0–⁠4 min
          - ”Den som håller i talpinnen pratar, och vi andra lyssnar.”
        - - |-
            2 · Rundan
            4–⁠7 min
          - ”Du får stå över, så kommer talpinnen tillbaka till dig sedan.”
        - - |-
            3 · Reda ut
            7–⁠13 min
          - |-
            ”Vad hände? Hur kändes det?”
            ”Du blev arg. Stämmer det?”
        - - |-
            4 · Komma överens
            13–⁠17 min
          - |-
            ”Hur ser det ut när ni gör det?”
            ”Kan alla göra det här?”
        - - |-
            5 · Avsluta
            17–⁠20 min
          - ”Vad gör du själv till nästa gång?”
