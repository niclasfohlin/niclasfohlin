            - rubrik: Kompissamtal
              text: Ditt barn ska ha kompissamtal tillsammans med några kamrater från klassen eller fritids. Gruppen träffas ungefär en gång i veckan, cirka 20 minuter varje gång. Det blir tre gånger, ibland fyra eller fem. Barnen övar på att lyssna på varandra, säga vad de tänker och känner utan att anklaga varandra, och komma överens om något de ska göra annorlunda. Ingen pekas ut i samtalen.
