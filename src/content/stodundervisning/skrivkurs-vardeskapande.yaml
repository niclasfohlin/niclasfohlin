lathund:
  innehall: En text i veckan till en verklig läsare
  metoden:
    text:
      - "Lärarledd skrivkurs för åk 4–9 i en blandad grupp. Eleverna skriver en skattjakt för yngre barn eller en guide för dem som är nya på skolan. De verkliga läsarna prövar texterna mitt i kursen och använder dem sista veckan."
      - "Gruppen läser mentortexten, pekar ut ett skrivdrag och lånar det till sin text. Eleven säger texten för en kamrat innan hen skriver, och en annan läser som läsaren. Dag 2 läser ni mentortexten igen och svarar på allas början. Mina drag samlar det eleven tar med sig."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Ett skrivdrag i taget.
          text: En text rymmer mycket, men är allt i fokus är inget i fokus.
        - fet: Draget lånar vi, innehållet är vårt.
          text: Eleven behåller sitt innehåll och prövar mentortextens drag.
        - fet: Texterna ska nå sin läsare.
          text: Eleven ser läsaren ta emot texten.
    tabell:
      rubrik: De fem delarna · dag 1 och dag 2 · exempelfraser
      kolumner:
        - Del
        - Exempelfraser
      rader:
        - - "1 · Läs\n0–⁠8 min · dag 2: 0–8"
          - "”Vad handlar texten om?”"
        - - "2 · Hitta draget\n8–⁠17 min · dag 2: 8–12"
          - "”Vad gör den första meningen med oss som läsare?”"
        - - "3 · Läraren skriver\n17–⁠27 min · dag 2: 12–17"
          - "”Vilket gammalt drag passar här, och vilket inte?”"
        - - "4 · Eleverna skriver\n27–⁠50 min · dag 2: 17–45"
          - "”Här gör du som mentortexten.”"
        - - "5 · Jämför\n50–⁠60 min · dag 2: 45–60"
          - "”Läs ledtråden som en åttaåring. Vart går du?”"
  pass:
    rubrik: "Vi kör ett pass: Skattjakten vecka 2"
    textRubrik: Gruppen · fem elever, åk 5, skattjakt för åk 2
    utskrift: Skriv ut passexemplet
    text:
      - "Två texter: ”I vilken hittar du platsen?” ”I den andra”, säger Selma. Omar gissar gåtan, och läraren frågar: ”Står ordet simhall någonstans?” Paren stryker under ”klor” och ”kommer ut blöt”. Draget får ett namn: säg allt utom namnet."
      - "Hugo läser Mina drag och väljer bort sitt gamla drag. Läraren tänker högt och ändrar sin ledtråd: ”Här får du låna men aldrig köpa.”"
      - "I Kommunicera säger var och en sin ledtråd bakom en pärm, och en kamrat pekar bland fotona. Hugo fastnar tills läraren tyst frågar vad man gör på hans plats."
      - "Selma har inte hört Miras ledtråd och gissar direkt. Mira stryker ordet gympa. Hugo kom igång, noterar läraren."
    forberett:
      rubrik: Det jag förberedde
      text:
        - Jag kopierade de två texterna och gåtan, en per par, och gjorde gåtan stor för tavlan. Jag skrev min ledtråd, lade lagens remsor i mapparna och tog fram fotona och två pärmar till Kommunicera.
    klarTidigt: Läs ledtråden för en kamrat som gissar, och skriv in det som fattades.
    schema:
      rubrik: Dag 1, del för del
      rader:
        - tid: 0–8
          fas: 1 · Läs
          vad: "Två texter om fritids. ”I vilken hittar du platsen?” Frågorna."
        - tid: 8–17
          fas: 2 · Hitta draget
          vad: Gåtan som den tredje. Paren markerar. Draget får ett namn.
        - tid: 17–27
          fas: 3 · Läraren skriver
          vad: "Vad behöver läsaren? Uppgiften och Mina drag. Din ledtråd om biblioteket. Tänk högt och stryk."
        - tid: 27–50
          fas: 4 · Eleverna skriver
          vad: "Kommunicera 27–33 med fotona. Sedan skriver alla. Fastnar någon, fråga vad man gör på platsen."
        - tid: 50–60
          fas: 5 · Jämför
          vad: En annan gissar som en åttaåring. Eleven ändrar. Tre som vill läser upp.
  mall:
    rubrik: "Tavlan under passet: mentortexten och lärarens text"
    underrad: "Mentortexten till vänster, lärarens text till höger · Vecka: ______ · Läsaren: ______________"
    block:
      - typ: skrivruta
        rubrik: "Draget heter:"
        rader: 1
      - typ: skrivruta
        rubrik: "Dagens uppgift:"
        rader: 1
      - typ: spalter
        kolumner:
          - namn: Mentortexten
            fraga: Vad gör texten med läsaren?
          - namn: Lärarens text
            fraga: Hur gör vi samma sak för vår läsare?
        rader: 6
      - typ: skrivruta
        rubrik: Jämför
        text: "Dag 1: Var stannar läsaren? Dag 2: Gör vi som mentortexten?"
        rader: 2
      - typ: not
        text: Draget lånar vi, innehållet är vårt.
  material:
    rubrik: Vad du behöver för skrivkursen
    kravEtikett: Textkrav
    var:
      rubrik: Var texterna och läsarna finns
      punkter:
        - fet: Skattjakten.
          text: "Veckornas sidor, med mentortexterna, två texter, Kommunicera och korten."
        - fet: Guideboken.
          text: "Veckornas sidor, med mentortexterna, två texter och Kommunicera."
        - fet: Läsarna.
          text: "Boka dem före kursen. Se tabellen Läsarna och tillfället."
        - fet: Eget projekt.
          text: Tom plan. Välj mentortexter som gör samma skrivhandling som elevernas.
      efter: "Projektplanerna, veckornas sidor och bladen finns under Projekten i metodbeskrivningen och i planeringsmallarna (Word)."
    bordet:
      - Veckans mentortext, en kopia per par
      - Två texter, i två veckor
      - Pennor, skrivbok och Frågebanken
      - Mina drag och Kortet till skribenten
      - Fotona eller kartan, och pärmar, vecka 2
      - Mentortexten stor på tavlan
    varjePass: Notera vem som använde draget och vem som behöver stöd.
film:
  sekunder: 27.98
  beskrivning: "Gruppen läser gåtan som läsare. Omar säger: ”Simhallen!” Läraren frågar: ”Står ordet simhall någonstans?” Paren stryker under orden som avslöjar platsen. Mira säger: ”Den säger hur det är där!” Draget får ett namn. Läraren skriver: ”Säg allt utom namnet.” Mira skriver sin ledtråd, och Selma läser den som en åttaåring. Mira skriver: ”Här har vi gympa.” Selma säger: ”Gympasalen! Det står ju där.” Mira stryker gympa och skriver att bollarna studsar. Mira skriver: ”Här studsar bollarna mot väggen.”"
  rubrik: "Så gör gruppen med draget"
  ingress: "Fyra bilder ur filmen om ett pass i Skattjakten. Gruppen läser gåtan, stryker under orden som avslöjar platsen och ger draget ett namn. Mira skriver sin ledtråd, och kamraten gissar direkt, så Mira stryker ordet. Filmen på metodens sida visar samma sak i rörelse."
  stillbilder:
    - text: "Omar gissar. Läraren frågar om ordet simhall står där."
    - text: "Paren stryker under orden. Mira säger vad orden gör."
    - text: "Gruppen ger draget ett namn. Selma gissar direkt."
    - text: "Mira stryker ordet och skriver att bollarna studsar."
