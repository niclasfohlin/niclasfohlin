titel: "Skrivkurs: värdeskapande skrivande"
undertitel: Lärarledd skrivkurs i liten grupp där eleverna skriver för en verklig läsare, för åk 4–9
ingress: "En skrivkurs i liten grupp där elever i åk 4–9 skriver något som en verklig läsare ska använda: en skattjakt för yngre barn eller en guide för dem som är nya på skolan. Varje vecka lånar gruppen ett skrivdrag ur en mentortext, och läsarna prövar texterna mitt i kursen."
omrade: Skrivning
arskurs:
  - 4-6
  - 7-9
taggar:
  - textstruktur
  - skrivstrategier
  - formativ-bedomning
format:
  - liten grupp
  - par
  - enskilt
tid: 60 minuter per pass, två till tre pass i veckan
period: Fem till sex veckor
grupp: Fyra till tio elever
material:
  - projektplanen
  - veckans mentortext
  - skrivbok
  - Mina drag och Kortet till skribenten
  - fotona eller kartan
  - diplom
uppdaterad: 2026-10-09
relaterade:
  - skrivkurs-berattelseram
  - texttyper-i-grupp
utkast: false
inledning:
  - "Skrivkurs: värdeskapande skrivande är en kurs där fyra till tio elever i åk 4–9 skriver för en verklig läsare. Gruppen gör ett av två projekt. I Skattjakten skriver varje elev inbjudan, ledtråden, uppdraget och berättelsen i skattkistan till ett lag med yngre barn. I Guideboken skriver varje elev ett uppslag om ett ställe i närområdet, till dem som är nya på skolan. Texterna är korta, och de ska fungera: laget ska hitta platsen, och den nya ska hitta vägen."
  - "På bordet ligger veckans mentortext, en kopia per par, och kortet Frågebanken. I två av veckorna ligger där också två korta texter som gör samma sak olika bra. Eleven skriver i skrivboken och renskriver på det som läsaren får: ett kort, en inbjudan, en berättelse eller ett uppslag. Bladet Mina drag och Kortet till skribenten ligger i elevens mapp. På tavlan står mentortexten stor, och där skriver du din egen text."
  - "Varje vecka läser gruppen mentortexten först som läsare och sedan som skribent, pekar ut ett skrivdrag och ger det ett namn. Du skriver din egen text med draget och tänker högt, och eleven säger sin text för en kamrat innan hen skriver. När texten är halvfärdig, läser en annan kamrat texten som läsaren och gör det som står: gissar platsen, gör uppdraget eller följer vägen. Eleven ser var läsaren stannar och ändrar där, innan hen renskriver texten. På Mina drag skriver eleven vad hen ändrade efter läsaren, och nästa vecka väljer hen ett av sina tidigare drag, om något passar i den nya texten."
  - "Skattjakten tar fem veckor och Guideboken sex. Läsarna kommer redan mitt i kursen: i Skattjakten vecka 3 lyssnar barn på ledtrådarna och gissar, och i Guideboken vecka 4 kommer en elev som är ny på skolan och följer vägen på kartan. Sista veckan går lagen jakten, eller så får de nya guiden på besöksdagen."
  - "Ett exempel: Mira i åk 5 skriver ”Här har vi gympa” i ledtråden till gympasalen. Selma har inte hört ledtråden, och när hon läser den som läsaren gissar hon direkt. Mira stryker ordet gympa och skriver i stället om bollarna som studsar. I vecka 3 hör ett barn ledtråden och gissar rätt på första försöket."
upplagg:
  rubrik: Så fungerar insatsen
  text: "Fyra till tio elever har två eller tre pass om 60 minuter i veckan. Gruppen gör ett projekt, Skattjakten på fem veckor eller Guideboken på sex. Varje vecka skriver eleven en text med ett skrivdrag. Dag 1 läser gruppen en mentortext, du skriver din text och eleven börjar sin. Dag 2 läser ni mentortexten igen, och eleven får svar och skriver klart. Läsarna prövar texterna mitt i kursen, och sista veckan möter texterna sina läsare. På bladet Mina drag skriver eleven det hen tar med sig. Första och sista veckan skriver eleven samma slags korta text på tio minuter, och ni jämför dem."
gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Kursen är för elever i åk 4–9 som får ned några meningar men skriver för sig själva, eller som frågar hur långt det ska vara. Den lär eleven att skriva för en läsare. En elev som ska kunna en texttyp på djupet inför proven passar bättre i Texttyper i grupp. Gruppen har fyra till tio elever. Du väljer i förväg två till fyra som behöver stöd i skrivandet, och sedan presenterar du kursen i klasserna: ”En skrivkurs där vi gör en skattjakt åt de yngre.” Två eller fler som redan skriver med flyt anmäler sig, och eleverna vet inte vem som är med av vilket skäl."
principer:
  rubrik: Tre saker att hålla fast vid
  text: "Ett skrivdrag i taget: en text rymmer mycket, men om allt blir fokus blir inget i fokus. Skrivdraget lånar vi, men innehållet skapar vi själva: eleven behåller sitt innehåll och prövar mentortextens sätt att nå läsaren. Och texterna ska nå sina läsare: ordna så att eleverna får se hur läsarna tar emot texterna, i ett möte eller genom läsarnas svar efteråt."
