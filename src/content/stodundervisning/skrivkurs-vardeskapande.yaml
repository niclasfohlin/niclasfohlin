passrutin:
  text: "Varje pass, dag 1 och dag 2, följer samma fem delar. Eleverna vet vad som kommer, och kraften går till skrivandet. Delen Läs gäller veckans mentortext, och dag 2 läser ni den igen. I de veckor som har Två texter läser gruppen dem i Läs, och mentortexten blir den tredje texten i Hitta draget."
  kallas: delar
  steg:
    - text: "Gruppen läser veckans mentortext tillsammans, först som läsare."
      fas: Läs
    - text: "Paren stryker under svaret på den smala frågan, och gruppen namnger draget som gör något med läsaren."
      fas: Hitta draget
    - text: "Läraren skriver på tavlan och bestämmer var draget ska in i texten, och eleverna tänker."
      fas: Läraren skriver
    - text: "Eleverna säger sin text för en kamrat och skriver, och läraren stödjer."
      fas: Eleverna skriver
    - text: "Läs tillbaka och jämför, dag 1 med läsarens streck, dag 2 med mentortexten."
      fas: Jämför
  efterPasset: "Du skriver en kort notering om vem som använde draget och vem som behöver stöd. När veckans sida säger det, skriver du också ditt svar på en lapp i varje text: en fråga som läsaren skulle ställa."
tidsschema:
  rubrik: "Dag 1, 60 minuter"
  text: "Din text på tavlan handlar om biblioteket varje vecka. Den smala frågan i Hitta draget pekar på en mening: fråga hellre ”Vad gör den första meningen med oss som läsare?” än ”Hur fångar texten läsaren?” Den smalare frågan hjälper särskilt de elever som har svårt att veta var de ska titta. Veckans smala fråga står på mentortextens sida, ofta med en variant av frågan ”Vad hade hänt om texten börjat på ett annat sätt?” Minuterna är hållpunkter, och delen Eleverna skriver är lång för att passet ska ha luft."
  rader:
    - tid: 0–8 min
      fas: Läs
      vad: "Läs högt, med Frågebanken framme: ”Vad handlar texten om? Vad händer?”"
    - tid: 8–17 min
      fas: Hitta draget
      vad: "”Nu läser vi texten igen, men den här gången tittar vi på hur den är byggd.” Fråga sist ”Vad kallar vi det?”"
    - tid: 17–27 min
      fas: Läraren skriver
      vad: "”Nu prövar vi samma drag, men med vårt eget innehåll.” Säg vem ni skriver till, och skriv uppgiften. Fråga ”Vilket gammalt drag på Mina drag passar här, och vilket inte?” Skriv med dragen som passar, och tänk högt."
    - tid: 27–50 min
      fas: Eleverna skriver
      vad: "Eleven säger sin text för en kamrat i tre minuter, och sedan skriver alla. Peka på draget där eleven redan har använt det: ”Här gör du som mentortexten.”"
    - tid: 50–60 min
      fas: Jämför
      vad: "En kamrat som inte har hört texten läser som läsaren. Eleven tiger, frågar och ändrar som Kortet till skribenten säger. Den som vill läser upp."
  efter: "Den som är klar läser texten för en kamrat som gissar eller gör det som står, och skriver in det som fattades."
arbetsform:
  rubrik: "Arbetsform: gemensamt, läraren visar, i par och enskilt, i par och gemensamt"
  text: "Inför Jämför byter ni par, så att läsaren är en kamrat som inte har hört texten. Den som vill läser upp. Med fyra till tio elever hinner du läsa över axeln hos alla."
  delar:
    - rubrik: 1. Gemensamt
      text: läraren leder
      faser:
        - Läs
        - Hitta draget
    - rubrik: 2. Läraren visar
      text: eleverna tänker
      faser:
        - Läraren skriver
    - rubrik: 3. I par och enskilt
      text: eleven säger texten för en kamrat, läraren stödjer
      faser:
        - Eleverna skriver
    - rubrik: 4. I par och gemensamt
      text: en annan läser som läsaren, några läser upp
      faser:
        - Jämför
exempel:
  valt:
    rubrik: Gruppen
    text: "fem elever i åk 5 som gör Skattjakten för åk 2. Passet är dag 1 i vecka 2, när de skriver ledtrådarna, och draget heter ”Säg allt utom namnet”."
  text:
    - "Läraren visar de två texterna om fritids. Båda börjar med ”Här är det roligt.” ”I vilken hittar du platsen?” frågar läraren. ”I den andra”, säger Selma. ”Mellanmål när skolan är slut, det är fritids.” Ebba säger att den första kan vara skolgården eller gympasalen."
    - "Sedan visar läraren veckans mentortext stor på tavlan, och varje par har en kopia: ”Här är det alltid varmt, fast det är vinter ute. Det luktar klor, och det ekar när någon ropar. Du går in torr och kommer ut blöt. Var är du?” ”Simhallen!” säger Omar. ”Hur vet du det?” frågar läraren. ”Står ordet simhall någonstans?” Paren stryker under de ord som avslöjade platsen. ”Den säger hur det är där, men aldrig vad det heter”, säger Mira. Läraren frågar: ”Vad hade hänt om gåtan hade börjat med ’Simhallen är varm’?” Ebba skrattar: ”Då är den ju redan löst.” Gruppen ger draget ett namn: ”Säg allt utom namnet.”"
    - "Läraren säger vem de skriver till: ”Åk 2 ska läsa era ledtrådar själva. Vad behöver en åttaåring?” Korta meningar och ord de känner, svarar gruppen. Läraren frågar vilket gammalt drag som passar. Hugo läser sin rad på Mina drag, ”Börja med en fråga”, och säger att draget inte behövs här, eftersom en ledtråd redan slutar med ”Var är du?” Läraren skriver en ledtråd om biblioteket och tänker högt: ”Här är det tyst. Nej, det kan vara många ställen. Här får du låna men aldrig köpa.” Omar föreslår: ”Här lånar du böcker på biblioteket.” Läraren frågar: ”Biblioteket är namnet. Hur säger vi det utan namnet?” ”Här finns tusen böcker”, säger Omar."
    - "För Kommunicera blir gruppen en trio och ett par, och läraren är observatör hos paret. Mira säger sin ledtråd bakom pärmen, och Ebba frågar en gång och pekar sedan på rätt foto. Sedan skriver alla. Hugo sitter stilla. Läraren frågar tyst: ”Vad gör man på din plats?” ”Man köar och äter.” ”Skriv det, men säg inte namnet.” Hugo skriver: ”Här står alla i kö för att bli mätta.” Selma är klar tidigt och läser sin ledtråd för Ebba, som gissar."
    - "Till sist byter trion och paret ledtrådar, och var och en läser en ledtråd som en åttaåring. Mira har skrivit ”Här har vi gympa.” Selma läser och säger direkt: ”Gympasalen! Det står ju där.” Mira tiger och sätter ett streck där Selma gissade. Hon stryker gympa och skriver i stället om bollarna som studsar. Tre frivilliga läser upp. Efteråt skriver läraren en kort notering: Hugo kom igång av frågan om vad man gör på platsen, och flera ledtrådar säger platsens namn. Ledtrådarna som säger namnet tar läraren upp i Två sätt dag 2."
fastnar:
  rubrik: När eleven fastnar
  text: Den som brukar fastna gör det oftast när hen ska skriva själv, framför en tom rad. Led eleven tillbaka till draget och till läsaren, ett steg i taget.
  fragaForst:
    - Vad ska din läsare göra eller veta när hen har läst?
    - Vad sa du till din kamrat? Säg det igen.
  trappa:
    - Peka på draget i mentortexten och läs meningen högt.
    - "Ställ en smal fråga, som ”Vad gör den här meningen med läsaren?”"
    - "Gör uppgiften mindre och konkret: ”Skriv en mening med draget.”"
    - "Ge starthjälp: ”Jag hjälper dig med första meningen. Säg den till mig.” När eleven har sagt den, säger du: ”Bra tanke. Skriv ner den.”"
    - Skriv de första orden tillsammans, och låt eleven skriva resten.
    - Eleven säger texten, och du skriver ner den ordagrant. Eleven läser den och renskriver.
roll:
  rubrik: "Lärarens roll: visa draget, låt innehållet vara elevens"
  text: Du väljer projektet, mentortexterna och dragen, och du håller i planen så att texterna blir klara till mötet. På tavlan visar du hur draget fungerar med vårt innehåll, och att skrivande är att pröva och ändra. Det eleven skriver om bestämmer eleven. Skriver du elevens meningar blir texten din, och mötet med läsaren blir ditt. Skriver du ordagrant det eleven säger, är texten fortfarande elevens.
  gor:
    - Välj text och skrivdrag i förväg.
    - Peka på just den mening som visar draget, och ställ en smal fråga.
    - Skriv själv på tavlan med vårt innehåll, och tänk högt.
    - Stäm ofta av elevernas texter mot syftet och läsaren.
    - Lyft en elevs text som mentortext när eleven har sagt ja, och spara den märkt med draget. I Skattjakten gör du det först efter jakten.
    - Stötta eleven när läsaren inte tar emot texten så som eleven hade tänkt sig.
  undvik:
    - Att analysera allt i texten på en gång.
    - Att låta arbetet stanna vid att förstå mentortexten.
    - Att använda en elevs text som det svaga exemplet.
    - Att visa en elevs text innan eleven har sagt ja, eller att fråga vilken text som är sämst.
    - Att göra projektet så stort att det inte blir klart.
    - Att begränsa elevernas idéer för tidigt.
urval:
  rubrik: Var hittar du mentortexterna och läsarna?
  text:
    - "Till de två projekten finns en mentortext för varje vecka där eleverna skriver en text. Den står direkt efter veckans sida, under Till läraren: veckorna. Till ett eget projekt väljer du mentortexterna själv. En mentortext kan vara nästan vilken text som helst som gör ett skrivdrag synligt: ett stycke ur en bok, en inledning i en krönika, en faktatext, en text du själv har skrivit eller en text från en tidigare elev. Välj helst en text av samma slag som den eleverna ska skriva: en riktig inbjudan inför inbjudan, lekregler inför uppdraget, en guidebok inför guideboken. Jämför gärna två exempel som gör samma sak olika bra, till exempel en stark och en svagare inledning."
    - "Tabellen Läsarna och tillfället säger vilka läsarna är på er skola och när du bokar dem."
  kravText: "En mentortext som fungerar uppfyller tre krav:"
  krav:
    - rubrik: Kort
      text: Två till fem meningar, en inledning eller ett stycke
    - rubrik: Samma skrivhandling
      text: Den gör det som elevernas text ska göra
    - rubrik: Ett synligt drag
      text: Draget går att peka på i en mening eller två
uppfoljning:
  text: Du behöver veta om kursen ger effekt, inte bara att ni har hållit den. Läsarens svar säger om texten nådde fram.
  rader:
    - nar: Vecka 1, dag 2
      vad: "Eleven skriver om en plats i tio minuter, utan stöd. Spara texten."
    - nar: Sista veckan, dag 1
      vad: "Samma uppgift om en ny plats. Hittar en kamrat rätt direkt i båda? Vad gör den andra som den första inte gjorde?"
    - nar: Efter mötet
      vad: "Eleven läser en ny mentortext. Vad gör den, och med vilket drag? Visa elevens klasslärare Mina drag."
mal:
  rubrik: "Mål: det eleven kan efter kursen"
  punkter:
    - Skriva så att mottagaren förstår och vill läsa
    - Läsa en text som läsare och som skribent
    - Hitta och namnge ett skrivdrag i en text
    - Pröva ett skrivdrag med sitt eget innehåll
    - Se var läsaren stannar, och ändra
    - Bearbeta en text tills den är klar för läsaren
snabbmall:
  fore:
    - Datum, projekt, vecka och dag 1 eller dag 2
    - Veckans text, skrivhandling och skrivdrag
    - Mentortexten, de två texterna och den smala frågan
    - Min text på tavlan och dagens uppgift
  efter:
    - Vem använde draget, och vem behöver stöd?
    - "Två sätt dag 2: vad skrev många, och vad fattades?"
    - Vad är kvar till mötet med läsaren?
checklista:
  punkter:
    - Läst veckans sida och vet när läsarna kommer.
    - Kopierat veckans texter, en per par, och gjort mentortexten stor.
    - Förberett en smal fråga om draget, och bestämt paren eller triorna.
    - Skrivit min text om biblioteket med draget, och dagens uppgift.
    - "Inför dag 2: läst allas början och skrivit två versioner till Två sätt."
    - "Inför läsarens prov och renskriften: strukit under felstavade ord."
grund:
  text: "Värdeskapande lärande låter elever lära sig genom att använda sina kompetenser för att skapa värde för andra, och i 19 svenska grundskolor beskrev eleverna skolvardagen som mer meningsfull och sig själva som mer motiverade (Lackéus & Sävetun, 2016). Mentortexter visar eleverna hur en text är byggd innan de skriver sin egen (Dorfman & Cappelli, 2017). Att läsa med en författarblick riktar uppmärksamheten mot hantverket bakom texten (Smith, 1983), och i alla ämnen kan eleverna vända samma blick mot ämnets egna skrivdrag (EEF, 2019). När eleverna har en mottagare och ett syfte behöver de explicit undervisning i de skrivdrag som krävs för att lyckas, och den får de genom mentortexten. Att se en läsare använda texten medan den går att ändra hjälper eleven att skriva beskrivningar och instruktioner för läsaren (Rijlaarsdam m.fl., 2009)."
  kallor: Bygger på Lackéus och Sävetun (2016), Dorfman och Cappelli (2017), Smith (1983), EEF (2019) och Rijlaarsdam m.fl. (2009).
ramar:
  rubrik: Projekten
  text:
    - "Först kommer de två projektplanerna. Sedan kommer sidan för varje vecka i båda projekten, och direkt efter varje sida det som hör till veckan: mentortexten, två texter, strukturen, läsarens prov och det läsaren får. Sist kommer det som används i flera veckor: återkopplingen, Mina drag, Kortet till skribenten, Frågebanken och uppslaget, och allra sist den tomma projektplanen."
    - "Välj projekt efter gruppen och efter vem ni kan nå. De här frågorna hjälper er att välja: Vem kan vi skriva för? Vem kan ha glädje eller nytta av vår kunskap? Vem vill vi glädja, hjälpa eller påverka på något sätt? Börja enkelt, för redan små projekt kan göra stor skillnad."
  ramar:
    # ---------------------------------------------------------------- Projektplanerna
    - rubrik: "Projekt 1: Skattjakt för yngre barn"
      text:
        - "Gruppen gör en skattjakt på skolan åt en klass i åk 2. Varje elev i kursen har ett lag och en hemlig plats på skolan, och skriver inbjudan till laget, ledtråden till platsen, uppdraget som laget gör där och en berättelse till laget. Projektet tar fem veckor: fyra veckor med en text i veckan och en vecka för jakten."
        - "Så går skattjakten: varje lag får den första ledtråden av sin elev, som sedan går före till sin plats. Vid varje plats gör laget uppdraget och får ledtråden till nästa plats. Lagen går samma runda men börjar på olika platser. När ett lag har varit på alla platser, ger den som följer laget ledtråden till skattkistan, där berättelserna ligger."
      huvud:
        - rubrik: Syfte
          text: Sprida glädje och ge de yngre en skattjakt som de kan läsa själva.
        - rubrik: Läsarna
          text: "En klass i åk 2, delad i lika många lag som kursen har elever. På en skola utan åk 2 går jakten på besöksdagen, som tabellen Läsarna och tillfället säger."
        - rubrik: Samarbetspartner
          text: "Klassläraren i åk 2. Bestäm dag, tid och lag med hen i god tid. Varje lag fyller i remsan längst ned på sin inbjudan, med lagets namn och vad laget tror att skatten är, och klassläraren skickar tillbaka remsorna."
        - rubrik: Dagen
          text: Lagen går skattjakten. Eleverna i kursen står vid sina platser och ser lagen hitta rätt.
      delar:
        - rubrik: Före kursen
          falt:
            - rubrik: Boka
              text: "Jakten, lagen, provläsarna och en vuxen eller en äldre elev per lag, med en reserv."
            - rubrik: Fotografera
              text: "Fler platser på skolan än gruppen har elever. Promenaden i vecka 1 går till dem, och i Kommunicera i vecka 2 pekar lyssnaren bland fotona."
    - rubrik: "Projekt 2: Guidebok för dem som är nya på skolan"
      text:
        - "Gruppen gör en guide till närområdet för dem som är nya på skolan. Varje elev väljer ett ställe och skriver ett uppslag om det i fyra delar: en beskrivning, vägen dit från skolans entré, faktarutan ”Visste du att?” och ett tips. Gruppen skriver välkomsttexten tillsammans. Projektet tar sex veckor: fem veckor med en text i varje och en vecka för besöksdagen."
      huvud:
        - rubrik: Syfte
          text: Hjälpa de nya att hitta i närområdet, så som eleverna själva ser det.
        - rubrik: Läsarna
          text: "Barnen som börjar på skolan nästa år och eleverna som flyttar hit under året. Tabellen Läsarna och tillfället säger vilka det är på er skola."
        - rubrik: Samarbetspartner
          text: "En elev som började på skolan i år, och hens lärare. Biblioteket kan ställa ut guiden efteråt."
        - rubrik: Dagen
          text: "På besöksdagen eller vid inskolningen står varje elev vid sitt uppslag och ger guiden till de nya. Hamnar besöksdagen utanför kursens veckor, ställer biblioteket ut guiden med en gästbok."
      delar:
        - rubrik: Före kursen
          falt:
            - rubrik: Boka
              text: "Den nya eleven till vecka 1 och vecka 4, med en reserv, och besöksdagen."
            - rubrik: Kartan
              text: "Skriv ut en karta över närområdet där skolans entré syns, en per trio till Kommunicera i vecka 2 och en till provet i vecka 4. Efter promenaden i vecka 1 ritar du in landmärkena vid svängarna eller klistrar in fotona."
    # ---------------------------------------------------------------- Veckorna
    - rubrik: "Till läraren: veckorna"
      lektioner: true
      text:
        - "Varje vecka i båda projekten har en sida. Överst står veckans fokus. Sedan kommer dag 1 och dag 2, med det som skiljer sig från tabellerna Dag 1 och Dag 2, och sist det du ska lägga märke till."
      delar:
        # -------------------------------------------- Skattjakten
        - rubrik: "Skattjakten vecka 1 · Inbjudan"
          falt:
            - rubrik: Fokus
              text: "Eleven bjuder in sitt lag och börjar med en fråga. Laget ska få veta vad, när och var. Skrivhandlingen är att bjuda in. Uppgiften är inbjudan på fyra till sex meningar."
            - rubrik: Dag 1
              text: "0–⁠12 min. Berätta om projektet, läsarna och skattjaktsdagen, och ge var och en sitt lag.\n12–⁠20 min. Läs Kalaset.\n20–⁠28 min. Hitta draget: Kalaset börjar med en fråga till läsaren.\n28–⁠36 min. Läraren skriver, och eleven får Mina drag.\n36–⁠52 min. Eleverna skriver.\n52–⁠60 min. Jämför: eleven får Kortet till skribenten, och du visar ringen och strecket i din inbjudan. Vet kamraten vad, när och var?"
            - rubrik: Dag 2
              text: "0–⁠8 min. Starterna.\n8–⁠17 min. Eleven skriver klart.\n17–⁠22 min. Eleven jämför sin inbjudan med Kalaset och skriver en rad på Mina drag.\n22–⁠33 min. Eleven renskriver på bladet Inbjudan.\n33–⁠43 min. Den korta texten före: en ledtråd till en åttaåring om en plats på skolan.\n43–⁠60 min. Promenaden till platserna: var och en väljer sin plats och viskar den till dig.\nEfter passet lämnar du inbjudningarna till lagens klasslärare."
            - rubrik: Lägg märke till
              text: "Eleven som skriver när och var utan att du frågar.\nEleven som skriver platsens namn i den korta texten."
        - rubrik: "Skattjakten vecka 2 · Ledtråden"
          falt:
            - rubrik: Fokus
              text: "Eleven beskriver sin plats med det som bara finns där och säger allt utom namnet. Skrivhandlingen är att beskriva. Uppgiften är ledtråden på tre eller fyra meningar, en per rad."
            - rubrik: Dag 1
              text: "Passet går som exemplet. Före passet lägger du lagens remsor i mapparna.\n0–⁠8 min. Två texter om fritids.\n8–⁠17 min. Mentortexten Gåtan.\n27–⁠33 min. Kommunicera, med fotona av platserna.\nEfter passet skriver du ditt svar på en lapp i varje text."
            - rubrik: Dag 2
              text: "0–⁠8 min. Ditt svar i stället för Starterna: eleven läser lappen, svarar på frågan och skriver vidare.\n17–⁠45 min. Eleven skriver klart ledtråden i skrivboken."
            - rubrik: Lägg märke till
              text: "Eleven vars ledtråd passar på två ställen.\nEleven som tar ett ord ur Kommunicera in i ledtråden."
        - rubrik: "Skattjakten vecka 3 · Uppdraget"
          falt:
            - rubrik: Fokus
              text: "Eleven skriver uppdraget som laget gör på platsen, ett steg per rad med ett verb först, i den ordning laget gör det. Skrivhandlingen är att instruera. Uppgiften är uppdraget i tre till fem steg."
            - rubrik: Dag 1
              text: "0–⁠8 min. Två texter om uppdraget.\n8–⁠17 min. Mentortexten Följa John.\n17–⁠27 min. Läraren skriver. Tänk högt: ”Ledtråden gömde platsen, men uppdraget säger rakt ut vad laget ska göra.”"
            - rubrik: Dag 2
              text: "Barnen lyssnar på ledtrådarna under Eleverna skriver, som sidan Läsarens prov säger.\n0–⁠8 min. Starterna, med uppdragets början.\n17–⁠45 min. Barnen kommer, och du ropar fram en skribent till varje barn. De andra skriver uppdraget. Efter provet renskriver eleven ledtråden på Ledtrådskortet."
            - rubrik: Lägg märke till
              text: "Eleven som ändrar ledtråden där barnet gissade fel.\nEleven som skriver flera steg på samma rad."
        - rubrik: "Skattjakten vecka 4 · Berättelsen"
          falt:
            - rubrik: Fokus
              text: "Eleven börjar mitt i en händelse, och laget är med i berättelsen, med sitt namn och skatten det gissade. Skrivhandlingen är att berätta. Uppgiften är berättelsen på fyra till sex meningar."
            - rubrik: Dag 1
              text: "0–⁠8 min. Läs Dörren.\n8–⁠17 min. Hitta draget: ”Vilket gammalt drag gör som Dörren?”\n17–⁠27 min. Läraren skriver, med lagets remsa: ”Vad behöver laget för att vilja läsa till slutet?”\n50–⁠60 min. Jämför: kamraten läser som laget och säger var hen ville läsa vidare.\nEfter passet skriver du ditt svar på en lapp."
            - rubrik: Dag 2
              text: "0–⁠8 min. Ditt svar i stället för Starterna.\n17–⁠32 min. Eleven skriver klart.\n32–⁠40 min. Jämför med Dörren.\n40–⁠60 min. Eleven renskriver och ritar."
            - rubrik: Lägg märke till
              text: "Eleven som börjar med att någon vaknar.\nEleven som låter laget göra något redan i första meningen."
        - rubrik: "Skattjakten vecka 5 · Skattjakten"
          falt:
            - rubrik: Fokus
              text: "Texterna möter sina läsare, och eleven ser vad hen gör nu som hen inte gjorde i vecka 1."
            - rubrik: Dag 1
              text: "0–⁠10 min. Den korta texten efter: en ledtråd till en annan plats.\n10–⁠25 min. Eleven ringar in raden där en åttaåring kan stanna. Som en åttaåring läser en kamrat de korta texterna, sedan ledtråden och uppdraget.\n25–⁠40 min. Gruppen skriver ledtråden till skattkistan.\n40–⁠55 min. Eleven renskriver uppdraget och lägger berättelsen i kistan.\n55–⁠60 min. Eleven skriver Före och efter på Mina drag."
            - rubrik: Dag 2
              text: "Lagen går skattjakten, som sidan Dagen säger.\nSamma dag eller i det tredje passet ställer du frågorna på sidan Dagen, och eleverna får diplomen."
            - rubrik: Lägg märke till
              text: "Eleven som ser var laget stannar och säger varför.\nEleven som säger vad hen gör nu som hen inte gjorde i vecka 1."
        # -------------------------------------------- Guideboken
        - rubrik: "Guideboken vecka 1 · Platsen"
          falt:
            - rubrik: Fokus
              text: "Eleven beskriver sitt ställe med detaljer som bara finns där. Skrivhandlingen är att beskriva. Uppgiften är texten om stället, på fyra till sex meningar."
            - rubrik: Dag 1
              text: "0–⁠12 min. Projektet och läsarna. En elev som började här i år är med i sex minuter. Gruppen frågar: ”Vad visste du inte när du kom hit? Vilket ställe hade du velat att någon visade dig?” Var och en väljer sitt ställe.\n12–⁠22 min. Två texter om parken.\n22–⁠28 min. Mentortexten Torget.\n28–⁠36 min. Läraren skriver, och eleven får Mina drag.\n36–⁠52 min. Eleverna skriver.\n52–⁠60 min. Jämför: eleven får Kortet till skribenten, och du visar ringen och strecket i din text. Ser kamraten stället?"
            - rubrik: Dag 2
              text: "0–⁠8 min. Starterna.\n8–⁠18 min. Den korta texten före: vägen från entrén till biblioteket.\n18–⁠48 min. Promenaden förbi alla ställen: gruppen fotograferar dem, skyltarna och svängarna, och eleven frågar någon som jobbar där. Det tredje passet är reserv.\n48–⁠60 min. Eleven skriver klart med det hen såg, jämför med Torget och skriver en rad på Mina drag."
            - rubrik: Lägg märke till
              text: "Eleven som skriver ”fin och mysig”.\nEleven som väljer ett ställe ur det den nya sa."
        - rubrik: "Guideboken vecka 2 · Vägen dit"
          falt:
            - rubrik: Fokus
              text: "Eleven visar vägen från skolans entré, med något att se vid varje sväng. Skrivhandlingen är att instruera. Uppgiften är vägbeskrivningen i fyra till sex steg."
            - rubrik: Dag 1
              text: "0–⁠8 min. Två texter om vägen.\n8–⁠17 min. Mentortexten Lekplatsen.\n27–⁠33 min. Kommunicera, med kartan.\n50–⁠60 min. Jämför: kamraten följer vägen en mening i taget.\nEfter passet skriver du ditt svar på en lapp."
            - rubrik: Dag 2
              text: "0–⁠8 min. Ditt svar i stället för Starterna.\n17–⁠45 min. Eleven skriver klart vägen."
            - rubrik: Lägg märke till
              text: "Eleven som skriver ”gå rakt fram en bit”.\nEleven som tar ett landmärke ur Kommunicera in i vägen."
        - rubrik: "Guideboken vecka 3 · Visste du att?"
          falt:
            - rubrik: Fokus
              text: "Eleven skriver en sak om stället och förklarar ett svårt ord med en enklare mening. Skrivhandlingen är att förklara. Uppgiften är faktarutan på tre till fem meningar."
            - rubrik: Dag 1
              text: "Före passet skriver du ut kommunens text om varje ställe, eller fotona av skyltarna. Saknar stället en text, har eleven frågat någon där på promenaden. Du väljer en mening ur texten åt den som behöver.\n0–⁠8 min. Läs Runstenen.\n17–⁠27 min. Läraren skriver. Eleven väljer en sak ur texten om sitt ställe.\n50–⁠60 min. Jämför: kamraten säger vad det svåra ordet betyder.\nEfter passet skriver du ditt svar på en lapp."
            - rubrik: Dag 2
              text: "0–⁠8 min. Ditt svar på lappen.\n17–⁠45 min. Eleven skriver klart faktarutan och renskriver Uppslaget: stället."
            - rubrik: Lägg märke till
              text: "Eleven som skriver av skylten.\nEleven som förklarar ordet för en kamrat innan hen skriver."
        - rubrik: "Guideboken vecka 4 · Vårt tips"
          falt:
            - rubrik: Fokus
              text: "Eleven övertygar den nya och börjar med det läsaren ska göra. Skrivhandlingen är att övertyga. Uppgiften är tipset på tre till fem meningar."
            - rubrik: Dag 1
              text: "0–⁠8 min. Läs Loppisen.\n17–⁠27 min. Läraren skriver, med frågan ”Vad ska den nya göra, och varför?”\n50–⁠60 min. Jämför: kamraten säger om hen vill göra det eleven tipsar om, och varför."
            - rubrik: Dag 2
              text: "Den nya följer vägarna under Eleverna skriver, som sidan Läsarens prov säger.\n17–⁠45 min. Den nya kommer och följer en väg i taget på kartan, medan de andra skriver vidare på tipset."
            - rubrik: Lägg märke till
              text: "Eleven som ändrar vägen där fingret stannade.\nEleven som sparar tipset till sist."
        - rubrik: "Guideboken vecka 5 · Välkommen"
          falt:
            - rubrik: Fokus
              text: "Gruppen skriver guidens välkomsttext tillsammans, och texten säger vilka som har skrivit guiden och varför. Skrivhandlingen är att bjuda in. Uppgiften är först ett förslag på en eller två meningar och sedan gruppens text."
            - rubrik: Dag 1
              text: "0–⁠8 min. Läs Kokboken.\n17–⁠27 min. Läraren skriver, med frågan ”Vad ska de nya veta om oss?”\n27–⁠50 min. Var och en skriver ett förslag.\n50–⁠60 min. Jämför: kamraten läser som den nya. Vet hen vilka som skriver och varför?"
            - rubrik: Dag 2
              text: "0–⁠12 min. Du skriver alla förslag på tavlan.\n12–⁠25 min. Paren slår ihop två förslag till en mening.\n25–⁠40 min. Gruppen sätter ihop texten, och du skriver.\n40–⁠60 min. Eleverna renskriver uppslagen och skriver sist en rad på Mina drag."
            - rubrik: Lägg märke till
              text: "Eleven vars mening kommer med.\nEleven som föreslår en ändring i en kamrats mening."
        - rubrik: "Guideboken vecka 6 · Besöksdagen"
          falt:
            - rubrik: Fokus
              text: "Guiden möter de nya, och eleven ser vad hen gör nu som hen inte gjorde i vecka 1."
            - rubrik: Dag 1
              text: "0–⁠10 min. Den korta texten efter: vägen från entrén till ett annat ställe.\n10–⁠25 min. Eleven ringar in raden där den nya kan stanna. En kamrat läser båda texterna och uppslaget som den nya.\n25–⁠55 min. Gruppen sätter ihop guiden, och den som behöver renskriver.\n55–⁠60 min. Eleven skriver Före och efter på Mina drag."
            - rubrik: Dag 2
              text: "Besöksdagen går som sidan Dagen säger.\nSist läser ni gästboken. Eleverna får diplomen."
            - rubrik: Lägg märke till
              text: "Eleven som ser var den nya stannar och säger varför.\nEleven som säger vad hen gör nu som hen inte gjorde i vecka 1."
    # ---------------------------------------------------------------- Skattjakten, veckornas material
    - rubrik: "Mentortext, Skattjakten vecka 1: Kalaset"
      text:
        - "Läs inbjudan två gånger, först som läsare och sedan som skribent."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Ge varje par en kopia, och visa texten stor på tavlan. Läs som skribent och fråga: ”Vad gör den första meningen med dig som läser? Vad hade hänt om inbjudan hade börjat med ’Du är bjuden på kalas’?”"
      listor:
        - rubrik: Kalaset
          rader:
            - ["Kan du hålla en hemlighet?"]
            - ["På lördag fyller Tilde elva år, och festen är en överraskning."]
            - ["Kom till fotbollsplanen klockan två och göm dig bakom förrådet."]
            - ["När Tilde kommer ropar alla grattis."]
            - ["Säg inget i förväg!"]
            - ["Hälsningar Malte"]
        - rubrik: Frågorna
          rader:
            - ["Vem får inbjudan, och vad ska hen göra?"]
            - ["Vad gör den första meningen med dig?"]
    - rubrik: "Inbjudan, Skattjakten vecka 1: Till laget"
      sagoform: { form: sida, titel: Inbjudan, radMm: 13, sidfot: true }
      text:
        - "Här skriver du inbjudan till ditt lag. Laget fyller i remsan längst ned och lämnar tillbaka den."
      delar:
        - rubrik: Inbjudan
          falt:
            - { rubrik: Titel, text: "" }
            - { rubrik: Inbjudan, text: "" }
            - { rubrik: Vårt lag heter, text: "" }
            - { rubrik: Vi tror att skatten är, text: "" }
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "En per elev, renskriven dag 2. Lagens klasslärare ger varje lag sin inbjudan och skickar tillbaka remsan före vecka 2." }
    - rubrik: "Två texter, Skattjakten vecka 2: Fritids"
      text:
        - "Läs båda texterna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Läs båda texterna högt, och ställ frågorna i tur och ordning. Paren pratar om fråga 2 och 3, och gruppen tar de andra. Ett annat svar går också bra, om eleven visar var i texten det står."
            - rubrik: Säg sedan
              text: "”Den andra har en mening som bara passar på fritids.” Visa mentortexten Gåtan som den tredje texten."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Båda börjar med ”Här är det roligt” och säger att det finns många barn. Ingen av dem säger platsens namn."
            - rubrik: "2. I vilken hittar du platsen?"
              text: "I den andra."
            - rubrik: "3. Vilka andra platser kan den första handla om?"
              text: "Skolgården, klassrummet, gympasalen och parken."
            - rubrik: "4. Vilken mening avslöjar platsen?"
              text: "”Här äter du mellanmål när skolan är slut.” Av skolans platser passar den bara på fritids."
            - rubrik: "5. Vad tar du med dig?"
              text: "Säg det som bara finns på din plats, och säg inte namnet."
      listor:
        - rubrik: Två texter om samma plats
          kolumner:
            - Den första texten
            - Den andra texten
          rader:
            - - "Här är det roligt.\nHär finns många barn.\nHär leker du.\nVar är du?"
              - "Här är det roligt.\nHär finns många barn.\nHär äter du mellanmål när skolan är slut.\nVar är du?"
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två texterna?"]
            - ["I vilken hittar du platsen?"]
            - ["Vilka andra platser kan den första texten handla om?"]
            - ["Vilken mening avslöjar platsen?"]
            - ["Vad tar du med dig till din ledtråd?"]
    - rubrik: "Mentortext, Skattjakten vecka 2: Gåtan"
      text:
        - "Läs gåtan två gånger, först som läsare och sedan som skribent."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Gåtan är den tredje texten, efter Två texter. Läs som skribent och fråga: ”Vilka ord avslöjade platsen för dig? Vad hade hänt om gåtan hade börjat med ’Simhallen är varm’?”"
      listor:
        - rubrik: Gåtan
          rader:
            - ["Här är det alltid varmt, fast det är vinter ute."]
            - ["Det luktar klor, och det ekar när någon ropar."]
            - ["Du går in torr och kommer ut blöt."]
            - ["Var är du?"]
        - rubrik: Frågorna
          rader:
            - ["Vilken plats är det?"]
            - ["Vilka ord avslöjar platsen?"]
    - rubrik: "Strukturen, Skattjakten vecka 2: Kommunicera"
      text:
        - "Ni är tre. Berättaren säger sin ledtråd bakom en pärm, och lyssnaren pekar bland fotona."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Gör strukturen i Eleverna skriver, minut 27–33. Blir en elev över, får en trio två observatörer. Blir två över, är du observatör, eftersom du vet platserna. Fyra elever blir två par, och i Jämför läser en ur det andra paret."
      listor:
        - rubrik: Så gör ni
          rader:
            - ["Ni är tre: berättaren, lyssnaren och observatören."]
            - ["Lyssnaren har fotona framför sig. Pärmen står mellan lyssnaren och berättaren."]
            - ["Berättaren säger sin ledtråd, utan platsens namn."]
            - ["Lyssnaren får fråga en gång och pekar på det foto hen tror är rätt."]
            - ["Observatören skriver ner orden som fick lyssnaren att välja. Passar ledtråden på två foton, skriver hen ”passar på två”."]
            - ["Berättaren tittar över pärmen. Pekade lyssnaren på rätt plats?"]
            - ["Byt roller tills alla har berättat."]
        - rubrik: Så tränar ni ledtråden
          rader:
            - ["Ni hör om ledtråden säger det som bara finns på platsen. Passar den på två foton, behöver den en rad till."]
    - rubrik: "Ledtrådskortet, Skattjakten vecka 2: Ledtråden"
      sagoform: { form: sida, titel: Ledtråd, radMm: 14, sidfot: true }
      text:
        - "Skriv ledtråden med en mening per rad, stort och tydligt. Barnen i laget ska kunna läsa den själva."
      delar:
        - rubrik: Ledtråden
          falt:
            - { rubrik: Titel, text: "" }
            - { rubrik: Ledtråden, text: "" }
            - { rubrik: "Svaret, för den vuxna", text: "" }
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "En per elev, renskriven efter provet i vecka 3, och en kopia per lag. Vik in svaret längst ned. Det är till den som följer laget." }
    # Vecka 3
    - rubrik: "Två texter, Skattjakten vecka 3: Uppdraget"
      text:
        - "Läs båda texterna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Läs båda texterna högt, och ställ frågorna i tur och ordning. Paren pratar om fråga 2 och 3, och gruppen tar de andra. Ett annat svar går också bra, om eleven visar var i texten det står."
            - rubrik: Säg sedan
              text: "”Den andra har ett steg per rad, i den ordning laget gör dem.” Visa mentortexten Följa John som den tredje texten."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Samma tre saker: räkna fönstren, hitta lappen och gå till bänken."
            - rubrik: "2. Med vilken gör en åttaåring rätt?"
              text: "Med den andra."
            - rubrik: "3. Vad gör laget först i den första?"
              text: "Den börjar med ”Gå till bänken”, men det ska laget göra sist. Yngre läsare följer ofta orden i den ordning de står."
            - rubrik: "4. Hur börjar varje rad i den andra?"
              text: "Med ett verb: räkna, hitta och gå."
            - rubrik: "5. Vad tar du med dig?"
              text: "Ett steg per rad, med ett verb först, i den ordning laget gör det."
      listor:
        - rubrik: Två texter om samma uppdrag
          kolumner:
            - Den första texten
            - Den andra texten
          rader:
            - - "Gå till bänken på lappen när ni har räknat fönstren i matsalen och hittat lappen vid det sista fönstret."
              - "Räkna fönstren i matsalen.\nHitta lappen vid det sista.\nGå till bänken på lappen."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två texterna?"]
            - ["Med vilken gör en åttaåring rätt?"]
            - ["Vad gör laget först i den första texten?"]
            - ["Hur börjar varje rad i den andra?"]
            - ["Vad tar du med dig till ditt uppdrag?"]
    - rubrik: "Mentortext, Skattjakten vecka 3: Följa John"
      text:
        - "Läs reglerna två gånger, först som läsare och sedan som skribent."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Reglerna är den tredje texten, efter Två texter. Läs som skribent och fråga: ”Hur vet du vad du ska göra först? Vilket slags ord står först på varje rad?”"
      listor:
        - rubrik: Följa John
          rader:
            - ["Ställ er på en rad bakom den som är John."]
            - ["Gör precis som John gör."]
            - ["Stanna när John klappar två gånger."]
            - ["Byt John."]
            - ["Fortsätt tills alla har varit John en gång."]
        - rubrik: Frågorna
          rader:
            - ["Vad gör du först?"]
            - ["Vilket slags ord står först på varje rad?"]
    - rubrik: "Läsarens prov, Skattjakten vecka 3: Barnen provläser"
      text:
        - "Två eller tre barn lyssnar på ledtrådarna under Eleverna skriver, dag 2. Skribenten läser högt, och barnet gissar. Skribenten ser var barnet gissar fel eller frågar, och ändrar ledtråden samma dag."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Före provet
              text: "Boka barnen före kursen. De kommer helst från en parallellklass eller åk 1 och ska inte gå jakten. Kommer provläsarna ur samma klass som lagen, blir de kistans vakter på dagen och går inte i något lag."
            - rubrik: Provet
              text: "Barnen kommer vid minut 17, och du ropar fram en skribent till varje barn. Skribenten läser ledtråden högt, eftersom åk 1 inte läser handskrift på hösten. Hen sätter ett streck i texten där barnet gissar fel eller frågar."
            - rubrik: Frågorna
              text: "Sedan frågar skribenten: ”Var tror du att det är? Var blev det svårt?” Hen ändrar ledtråden direkt och skriver vidare på uppdraget."
            - rubrik: Tiden
              text: "En omgång med frågorna tar omkring fem minuter. Med två barn och tio skribenter blir det fem omgångar, och barnen går tillbaka omkring minut 42."
            - rubrik: Om barnen inte kan komma
              text: "Du vet platserna, så be två vuxna eller elever från en annan klass att lyssna och gissa. Skribenten sätter strecken."
    - rubrik: "Uppdragskortet, Skattjakten vecka 3: Laget gör"
      sagoform: { form: sida, titel: Uppdrag, radMm: 14, sidfot: true }
      text:
        - "Skriv uppdraget med ett steg per rad och ett verb först, i den ordning laget gör det."
      delar:
        - rubrik: Uppdraget
          falt:
            - { rubrik: Titel, text: "" }
            - { rubrik: Uppdraget, text: "" }
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "En per elev, renskriven i vecka 5, och en kopia per lag. Eleven vid platsen ger laget kortet och sedan ledtråden till nästa plats." }
    # Vecka 4
    - rubrik: "Mentortext, Skattjakten vecka 4: Dörren"
      text:
        - "Läs början två gånger, först som läsare och sedan som skribent."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Läs som skribent och fråga: ”Vad hade hänt om texten börjat med ’Det var en helt vanlig dag’?”\nLyssna efter: något händer redan i första meningen, vi vet inte vad som hänt innan, och ”ingen väg tillbaka” gör början dramatisk."
      listor:
        - rubrik: Dörren
          rader:
            - ["Dörren slog igen bakom mig."]
            - ["Nu fanns det ingen väg tillbaka."]
        - rubrik: Frågorna
          rader:
            - ["Vad tror du händer sen?"]
            - ["Var i händelsen börjar texten?"]
    - rubrik: "Berättelsen, Skattjakten vecka 4: Till laget"
      sagoform: { form: sida, titel: Berättelsen, radMm: 12, sidfot: true }
      text:
        - "Det här är skatten. Laget är med i berättelsen, och den ligger i skattkistan."
      huvud:
        - { rubrik: Till lag, text: "" }
      delar:
        - rubrik: Berättelsen
          falt:
            - { rubrik: Berättelsens titel, text: "" }
            - { rubrik: Rita, text: "" }
            - { rubrik: Berättelsen, text: "" }
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "En per elev, renskriven i vecka 4. Blir berättelsen lång, fortsätter den på baksidan. Är läsarna blivande sjuor, handlar berättelsen i stället om elevens första dag här, och den är sann." }
    # Vecka 5
    - rubrik: "Dagen, Skattjakten vecka 5: Skattjakten"
      text:
        - "Lagen går jakten, och varje elev står vid sin plats."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Före dagen
              text: "Kopiera ledtrådarna och uppdragen, ett av varje per lag, och ge varje elev korten till sin plats. Lägg berättelserna i skattkistan. Säg till personalen vid platserna vilken tid lagen kommer. Är en elev borta, står du eller en provläsare där."
            - rubrik: Tiden
              text: "Med tio elever tar jakten omkring 50–70 minuter, med fyra eller fem minuter per plats. Det blir tio lag med en vuxen eller en äldre elev var, och 200 kort att kopiera."
            - rubrik: Jakten
              text: "Varje lag får den första ledtråden av sin elev. Eleven vid platsen ger laget uppdraget och nästa ledtråd, ser barnen läsa och säger inget om svaret. Sist ger den som följer laget ledtråden till skattkistan, där berättelserna ligger."
            - rubrik: Läsarens svar
              text: "Be klassläraren låta lagen skriva eller rita det bästa med skattjakten. Läs svaren med gruppen."
            - rubrik: Efteråt
              text: "Fråga: ”Hur kändes det när lagen hittade din plats? Blev det som du hade tänkt?” Tar lagen inte emot texten så som eleven hade tänkt sig, prata om det och stötta eleven i känslorna som kommer."
    # ---------------------------------------------------------------- Guideboken, veckornas material
    - rubrik: "Två texter, Guideboken vecka 1: Parken"
      text:
        - "Läs båda texterna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Läs båda texterna högt, och ställ frågorna i tur och ordning. Paren pratar om fråga 2 och 3, och gruppen tar de andra. Ett annat svar går också bra, om eleven visar var i texten det står."
            - rubrik: Säg sedan
              text: "”Den andra har det som bara finns i den här parken.” Visa mentortexten Torget som den tredje texten."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Träden, bänken, lekplatsen, dammen och sommaren."
            - rubrik: "2. I vilken ser du parken?"
              text: "I den andra."
            - rubrik: "3. Vilka ord passar in på alla parker?"
              text: "Fin, mysig, stora träd och bänkar."
            - rubrik: "4. Vad finns bara i den här parken?"
              text: "Eken som tre barn inte når runt, hjärtat i bänken och änderna som simmar fram."
            - rubrik: "5. Vad tar du med dig?"
              text: "Byt ”fin och mysig” mot det som bara finns på ditt ställe."
      listor:
        - rubrik: Två texter om samma park
          kolumner:
            - Den första texten
            - Den andra texten
          rader:
            - - "Parken är fin och mysig. Där finns stora träd och bänkar att sitta på. Det finns en lekplats och en damm. På sommaren är det skönt att vara där."
              - "I parken står en ek som är så tjock att tre barn inte når runt den. Bänken under eken har ett hjärta inristat i ryggen. Bakom lekplatsen ligger en damm, där änderna simmar fram så fort någon prasslar med en påse. På sommaren är det skönt att vara där."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två texterna?"]
            - ["I vilken ser du parken framför dig?"]
            - ["Vilka ord passar in på alla parker?"]
            - ["Vad finns bara i den här parken?"]
            - ["Vad tar du med dig till texten om ditt ställe?"]
    - rubrik: "Mentortext, Guideboken vecka 1: Torget"
      text:
        - "Läs texten två gånger, först som läsare och sedan som skribent."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Torget är den tredje texten, efter Två texter. Läs som skribent och fråga: ”Vilka ord gör att du ser just det här torget? Vad hade hänt om texten hade sagt ’Torget är fint och mysigt’?”"
      listor:
        - rubrik: Torget
          rader:
            - ["Mitt på torget står en fontän formad som en fisk."]
            - ["På sommaren sitter duvorna på kanten och väntar på smulor från kaféet med de gröna stolarna."]
            - ["På lördagar luktar hela torget nybakat bröd, och den som kommer före tio hinner köpa en kanelbulle innan bullarna tar slut."]
        - rubrik: Frågorna
          rader:
            - ["Vad ser du framför dig?"]
            - ["Vilka ord passar bara in på det här torget?"]
    - rubrik: "Två texter, Guideboken vecka 2: Vägen"
      text:
        - "Läs båda texterna och prata om frågorna under."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Läs båda texterna högt, och ställ frågorna i tur och ordning. Paren pratar om fråga 2 och 3, och gruppen tar de andra. Ett annat svar går också bra, om eleven visar var i texten det står."
            - rubrik: Säg sedan
              text: "”Den andra har något att se vid varje sväng.” Visa mentortexten Lekplatsen som den tredje texten."
        - rubrik: Det du lyssnar efter
          falt:
            - rubrik: "1. Vad är lika?"
              text: "Samma väg, samma svängar och samma mål."
            - rubrik: "2. Med vilken hittar du dit?"
              text: "Med den andra."
            - rubrik: "3. Var kan den nya gå fel i den första?"
              text: "Vid ”en bit”, som inte säger hur långt, och vid ”sväng höger”, som inte säger var."
            - rubrik: "4. Vad ser den nya i den andra?"
              text: "Den gula villan, flaggstången, den blå skylten och glasdörrarna."
            - rubrik: "5. Vad tar du med dig?"
              text: "Något att se vid varje sväng."
      listor:
        - rubrik: Två texter om samma väg
          kolumner:
            - Den första texten
            - Den andra texten
          rader:
            - - "Gå ut genom entrén och sväng vänster. Gå rakt fram en bit. Sväng höger. Gå över gatan. Där ligger biblioteket."
              - "Gå ut genom entrén och sväng vänster. Gå rakt fram tills du ser en gul villa med en flaggstång. Sväng höger vid flaggstången. Gå över gatan vid den blå skylten. Biblioteket är det låga huset med glasdörrar."
        - rubrik: Frågorna
          rader:
            - ["Vad är lika i de två texterna?"]
            - ["Med vilken hittar du dit utan att fråga?"]
            - ["Var kan den nya gå fel i den första?"]
            - ["Vad ser den nya vid varje sväng i den andra?"]
            - ["Vad tar du med dig till din vägbeskrivning?"]
    - rubrik: "Mentortext, Guideboken vecka 2: Lekplatsen"
      text:
        - "Läs vägbeskrivningen två gånger, först som läsare och sedan som skribent."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Lekplatsen är den tredje texten, efter Två texter. Läs som skribent och fråga: ”Hur vet läsaren att hen går rätt? Vad hade hänt om det bara hade stått ’Gå höger och sedan rakt fram’?”"
      listor:
        - rubrik: Lekplatsen
          rader:
            - ["Gå ut genom den stora grinden och sväng höger."]
            - ["Följ staketet tills du ser en röd brevlåda."]
            - ["Vid brevlådan går en smal stig in mellan björkarna."]
            - ["Gå stigen ända fram till bäcken och över bron."]
            - ["Där ligger lekplatsen."]
        - rubrik: Frågorna
          rader:
            - ["Hittar du dit?"]
            - ["Vad ser du vid varje sväng?"]
    - rubrik: "Strukturen, Guideboken vecka 2: Kommunicera"
      text:
        - "Ni är tre. Berättaren säger vägen dit, och lyssnaren följer den med fingret på kartan."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Gör strukturen i Eleverna skriver, minut 27–33. Blir en elev över, får en trio två observatörer. Blir två över, är du observatör. Fyra elever blir två par, och i Jämför läser en ur det andra paret."
      listor:
        - rubrik: Så gör ni
          rader:
            - ["Ni är tre: berättaren, lyssnaren och observatören."]
            - ["Lyssnaren har kartan framför sig. Pärmen står mellan lyssnaren och berättaren."]
            - ["Berättaren säger vägen från entrén, utan ställets namn."]
            - ["Lyssnaren flyttar fingret bara så långt varje mening säger och får fråga en gång."]
            - ["Observatören skriver ner var fingret stannade."]
            - ["Berättaren tittar över pärmen. Hamnade fingret på rätt ställe?"]
            - ["Byt roller tills alla har berättat."]
        - rubrik: Så tränar ni vägen dit
          rader:
            - ["Ni märker var vägen behöver något att se. Där fingret stannar fattas ofta ett landmärke."]
    - rubrik: "Mentortext, Guideboken vecka 3: Runstenen"
      text:
        - "Läs faktarutan två gånger, först som läsare och sedan som skribent."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Läs som skribent och fråga: ”Vilket ord är svårt för läsaren? Hur får hen veta vad det betyder?”"
      listor:
        - rubrik: Runstenen
          rader:
            - ["Vid badplatsen står en runsten."]
            - ["En runsten är en sten där någon ristade in bokstäver, runor, för att minnas en person."]
            - ["Det var för ungefär tusen år sedan."]
            - ["Runorna på den här stenen berättar om en man som hette Sven."]
        - rubrik: Frågorna
          rader:
            - ["Vad är en runsten?"]
            - ["Hur får du veta vad ordet betyder?"]
    - rubrik: "Mentortext, Guideboken vecka 4: Loppisen"
      text:
        - "Läs tipset två gånger, först som läsare och sedan som skribent."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Läs som skribent och fråga: ”Vad vill texten att du ska göra? När i texten får du veta det?”"
      listor:
        - rubrik: Loppisen
          rader:
            - ["Gå till loppisen i kyrkans källare en lördag."]
            - ["Där hittar du serietidningar för fem kronor styck, och ibland ett helt spel med alla bitar kvar."]
            - ["Ta med en egen kasse, för påsarna tar slut före lunch."]
        - rubrik: Frågorna
          rader:
            - ["Vad vill texten att du ska göra?"]
            - ["När i texten får du veta det?"]
    - rubrik: "Läsarens prov, Guideboken vecka 4: Den nya följer vägen"
      text:
        - "Den nya eleven följer vägbeskrivningarna med fingret på kartan under Eleverna skriver, dag 2. Skribenten ser var fingret stannar och ändrar texten samma dag."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Före provet
              text: "Boka samma elev som i vecka 1. Kan hen inte komma, provläser en annan ny elev eller en vuxen på skolan som inte bor i området."
            - rubrik: Provet
              text: "Du ropar fram en skribent i taget. Den nya läser vägbeskrivningen och flyttar fingret på kartan, en mening i taget. Skribenten tiger och sätter ett streck i texten där fingret stannar, som Kortet till skribenten säger."
            - rubrik: Frågorna
              text: "Sedan frågar skribenten: ”Var blev det svårt? Vad såg du där?” Skribenten skriver in det som fattades, ofta något att se vid en sväng."
            - rubrik: Tiden
              text: "Den nya kommer vid minut 17. Räkna med två till tre minuter per skribent. Med tio skribenter går hen tillbaka omkring minut 45."
            - rubrik: Om ingen kan komma
              text: "En kamrat i gruppen följer vägen på kartan, en mening i taget och bara så långt meningen säger."
    - rubrik: "Mentortext, Guideboken vecka 5: Kokboken"
      text:
        - "Läs början två gånger, först som läsare och sedan som skribent."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Dag 1
              text: "Läs som skribent och fråga: ”Vad får du veta om dem som har skrivit? Varför vill du läsa vidare?”"
      listor:
        - rubrik: Kokboken
          rader:
            - ["Vi är fem kompisar som har lagat mat ihop varje fredag i ett år."]
            - ["Vi har bränt pannkakor och spillt mjöl över hela köket."]
            - ["Här är de recept som till slut blev bäst."]
        - rubrik: Frågorna
          rader:
            - ["Vilka är det som skriver?"]
            - ["Varför vill du läsa vidare?"]
    - rubrik: "Dagen, Guideboken vecka 6: Besöksdagen"
      text:
        - "Varje elev står vid sitt uppslag och ger guiden till de nya."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Före dagen
              text: "Kopiera guiden, en till varje ny elev eller familj. Lägg varje uppslag på ett eget bord, och lägg fram en gästbok."
            - rubrik: Besöket
              text: "De nya går runt mellan borden. Varje elev i gruppen berättar om sitt ställe och visar vägen dit på kartan."
            - rubrik: Läsarens svar
              text: "De nya skriver i gästboken vilket ställe de vill gå till först. Läs den med gruppen."
            - rubrik: Om dagen ligger utanför kursen
              text: "Biblioteket ställer ut guiden med gästboken, och skolan ger guiden till de nya vid nästa inskolning."
            - rubrik: Efteråt
              text: "Fråga gruppen: ”Hur kändes det att se de nya läsa? Vad gjorde att vi lyckades i vårt samarbete? Vad var svårt?”"
    # ---------------------------------------------------------------- Hela kursen
    - rubrik: "Till läraren: återkopplingen"
      text:
        - "Kursens återkoppling kommer medan texten går att ändra. Eleven får svar från en kamrat, gruppen, ett barn, den nya eleven eller dig, och bestämmer direkt om hen ändrar texten eller låter den stå. Här står var ni gör varje grepp."
      delar:
        - rubrik: Greppen
          falt:
            - rubrik: Två texter där en sak skiljer
              text: "I Läs, i Skattjakten vecka 2 och 3 och i Guideboken vecka 1 och 2."
            - rubrik: Kommunicera
              text: "Under Eleverna skriver i vecka 2, minut 27–33."
            - rubrik: En kamrat läser som läsaren
              text: "I Jämför dag 1, varje vecka, med Kortet till skribenten."
            - rubrik: Starterna runt bordet
              text: "I Läs dag 2."
            - rubrik: Två sätt i era texter
              text: "Under Läraren skriver, dag 2."
            - rubrik: Ditt svar
              text: "Efter dag 1 i två av veckorna i varje projekt, och dag 2 i stället för Starterna. Räkna med tre minuter per text."
            - rubrik: Läsarens prov
              text: "Under Eleverna skriver, dag 2, i Skattjakten vecka 3 och Guideboken vecka 4."
            - rubrik: Före och efter
              text: "Första och sista veckan, som under Följ upp effekten."
    - rubrik: Mina drag
      sagoform: { form: vag, titel: Mina drag, undertitel: det jag tar med mig, bilder: [ penna, penna, penna, penna, penna, stjärna ], sidor: 2, radMm: 10 }
      text:
        - "Skriv varje vecka vad texten ska göra och vad draget heter. Skriv också vad draget gör för läsaren och vad du ändrade efter din läsare. När du börjar på nästa text väljer du ett drag härifrån, om något passar."
      huvud:
        - { rubrik: Namn, text: "" }
      delar:
        - rubrik: Mina drag
          falt:
            - { rubrik: 1 Vecka 1, text: "Vad ska texten göra? Vad gör draget för läsaren? Vad ändrade du efter din läsare?\nDraget heter" }
            - { rubrik: 2 Vecka 2, text: "Vad ska texten göra? Vad gör draget för läsaren? Vad ändrade du efter din läsare?\nDraget heter" }
            - { rubrik: 3 Vecka 3, text: "Vad ska texten göra? Vad gör draget för läsaren? Vad ändrade du efter din läsare?\nDraget heter" }
            - { rubrik: 4 Vecka 4, text: "Vad ska texten göra? Vad gör draget för läsaren? Vad ändrade du efter din läsare?\nDraget heter" }
            - { rubrik: 5 Vecka 5, text: "Vad ska texten göra? Vad gör draget för läsaren? Vad ändrade du efter din läsare?\nDraget heter" }
            - { rubrik: 6 Före och efter, text: "Det här gör jag nu, som jag inte gjorde i vecka 1:" }
        - rubrik: Till läraren
          falt:
            - { rubrik: Till läraren, text: "En per elev, i mappen. Eleven skriver en rad, oftast sist dag 2, och nästa vecka väljer hen ett gammalt drag och säger varför det passar. Att inget passar är ett svar. Den som går kursen igen tar med bladet." }
    - rubrik: Kortet till skribenten
      sagoform: { form: kort }
      text:
        - "Ha kortet framför dig när läsaren prövar din text."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Till läraren
              text: "Ett kort per elev, i mappen. Eleven har kortet framme i Jämför dag 1 och vid läsarens prov i Skattjakten vecka 3 och Guideboken vecka 4."
      listor:
        - rubrik: När läsaren prövar din text
          rader:
            - ["Ringa in raden där du tror att läsaren stannar."]
            - ["Säg till läsaren: ”Det är min text vi prövar, inte dig.”"]
            - ["Säg inget mer än texten. Sätt ett streck i texten där läsaren stannar, gissar fel eller frågar. Hamnade strecket vid ringen?"]
            - ["Fråga sedan: ”Var blev det svårt?” Skriv svaret vid strecket."]
            - ["Ändra där strecket står: skriv in det som fattades, eller stryk det som sa för mycket."]
    - rubrik: Frågebanken
      sagoform: { form: kort }
      text:
        - "Kortet ligger framme när ni läser en text."
      delar:
