lathund:
  innehall: En mentortext i veckan
  metoden:
    text:
      - "Lärarledd skrivkurs för åk 4–9 i en blandad grupp: några elever behöver stöd i skrivandet, några skriver med flyt. Eleverna skriver för en verklig mottagare, till exempel en skattjakt för åk 2 eller en guidebok till närområdet. Projektets text skrivs en del i veckan, och kursen slutar med att texterna möter sin läsare."
      - "Varje vecka börjar med en mentortext. Gruppen läser den, pekar ut ett skrivdrag och lånar det till sin egen text. Stegtabellen visar tiderna dag 1 och dag 2. Dag 2 läser gruppen samma text igen, läraren visar en elevtext i stället för att skriva själv, och eleverna skriver klart."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Ett skrivdrag i taget.
          text: En text rymmer mycket, men om allt blir fokus blir inget i fokus.
        - fet: Draget lånar vi, innehållet är vårt.
          text: Eleven behåller sitt innehåll och prövar mentortextens sätt.
        - fet: Texterna ska nå sin läsare.
          text: Eleverna får se hur texten tas emot.
    tabell:
      rubrik: De sex stegen · tider dag 1 och dag 2 · exempelfraser
      kolumner:
        - Steg
        - Exempelfraser
      rader:
        - - "1 · Läs\n0–8 min · dag 2: 0–5"
          - "”Vad handlar texten om? Vad händer?”"
        - - "2 · Hitta draget\n8–18 min · dag 2: 5–8"
          - "”Vad gör den första meningen med oss som läsare?”"
        - - "3 · Vår text\n18–23 min · dag 2: 8–12"
          - "”Nu prövar vi samma drag, men med vårt eget innehåll.”"
        - - "4 · Läraren skriver\n23–30 min · dag 2: 12–17"
          - "”Säger vi böcker gissar de direkt. Hur säger vi det utan ordet?”"
        - - "5 · Eleverna skriver\n30–50 min · dag 2: 17–45"
          - "”Här gör du precis som mentortexten. Läs den meningen för mig.”"
        - - "6 · Jämför\n50–60 min · dag 2: 45–60"
          - "”Lägg din text bredvid mentortexten. Gör den samma sak?”"
  pass:
    rubrik: "Vi kör ett pass: ledtrådarna, vecka 2"
    textRubrik: Gruppen · fem elever, åk 5, skattjakt för åk 2
    utskrift: Skriv ut passexemplet
    text:
      - "Gåtan på tavlan: ”Här är det alltid varmt, fast det är vinter ute. Det luktar klor, och det ekar när någon ropar. Du går in torr och kommer ut blöt. Var är du?” ”Simhallen!” säger Omar. ”Står ordet simhall där?”"
      - "Paren läser igen och stryker under det som avslöjar: klor, kommer ut blöt. Mira: ”Den säger vad man gör där.” Draget får ett namn: säg allt utom namnet."
      - "”Åk 2 ska läsa själva. Vad behöver en åttaåring?” Uppgiften på tavlan: skriv ledtråden till din plats i tre meningar, säg allt utom namnet. Läraren skriver om biblioteket och ändrar högt: ”Här får du låna men aldrig köpa.”"
      - "Alla skriver. Hugo fastnar tills läraren frågar vad man gör i matsalen. Hugo skriver: ”Här står alla i kö för att bli mätta.”"
      - "Alla läser sin ledtråd bredvid gåtan för en kamrat, som gissar. Miras säger ordet gympa, och Mira stryker det. Notering: Hugo kom igång av frågan om vad man gör där."
    forberett:
      rubrik: Det jag förberedde
      text:
        - Kopierat gåtan, en per par, och gjort den stor för tavlan. Skrivit min ledtråd om biblioteket i förväg. Projektplanen på väggen.
    klarTidigt: Skriv en ledtråd till, eller läs din för en kamrat som gissar.
    schema:
      rubrik: Dag 1, steg för steg
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Läs veckans del. Kopiera mentortexten. Skriv dina meningar med draget.
        - tid: 0–8
          fas: 1 · Läs
          vad: Texten stor på tavlan. Läs högt. Vad handlar den om, vem är den till?
        - tid: 8–18
          fas: 2 · Hitta draget
          vad: Läs igen som skribent. Paren markerar. Samla iakttagelser och ge draget ett namn.
        - tid: 18–23
          fas: 3 · Vår text
          vad: Vem skriver vi till, och var behövs draget? Dagens uppgift på tavlan.
        - tid: 23–30
          fas: 4 · Läraren skriver
          vad: Skriv med vårt innehåll och tänk högt. Eleverna föreslår ord.
        - tid: 30–50
          fas: 5 · Eleverna skriver
          vad: "Alla skriver. Peka på draget där eleven använt det. Fastnar någon: läs meningen i mentortexten, ställ en smal fråga, gör uppgiften mindre."
        - tid: 50–60
          fas: 6 · Jämför
          vad: Texten bredvid mentortexten, läs för en kamrat. Tre läser upp. Alla ändrar en sak.
  mall:
    rubrik: "Tavlan under passet: mentortexten och lärarens text"
    underrad: "Mentortexten till vänster, lärarens text till höger · Vecka: ______ · Mottagare: ______________"
    block:
      - typ: skrivruta
        rubrik: "Skrivdraget heter:"
        rader: 1
      - typ: skrivruta
        rubrik: "Dagens uppgift:"
        rader: 1
      - typ: spalter
        kolumner:
          - namn: Mentortexten
            fraga: Vad gör texten med läsaren?
          - namn: Lärarens text
            fraga: Hur gör vi samma sak för vår mottagare?
        rader: 6
      - typ: skrivruta
        rubrik: Jämför
        text: Lägg din text bredvid mentortexten. Gör den samma sak? Vad ändrar du?
        rader: 2
      - typ: not
        text: Draget lånar vi, innehållet är vårt eget.
  material:
    rubrik: Vad du behöver för skrivkursen
    kravEtikett: Textkrav
    var:
      rubrik: Var mentortexterna finns
      punkter:
        - fet: Skattjakt för åk 2.
          text: Kopieringssidan efter projektplanen. En inbjudan, en gåta, reglerna för en lek och början på en berättelse.
        - fet: Guidebok till närområdet.
          text: Kopieringssidan efter projektplanen. Ett torg, en väg, en runsten, ett tips och början på en kokbok.
        - fet: Eget projekt.
          text: Tom projektplan. Välj en text som gör samma skrivhandling som elevernas.
        - fet: Fler mentortexter.
          text: Ett stycke ur en bok, en faktatext, din egen text eller en tidigare elevs, med lov.
      efter: Projektplanerna och mentortexterna att kopiera finns under Projekten i metodbeskrivningen och i Word-filen Bara planeringsmallarna och projekten på metodsidan.
    bordet:
      - Veckans mentortext, en kopia per par
      - Pennor att markera med
      - Skrivbok, eller papper och mapp
      - Elevens text från förra passet
      - Mentortexten stor på tavlan
      - Projektplanen synlig i rummet
    varjePass: Notera vem som använde draget och vem som behöver stöd.
