  - rubrik: "Dag 2, 60 minuter"
    plats: efter-tidsschema
    text: "Dag 2 har samma fem delar. Texten är påbörjad, och eleven får svar och skriver klart. Före läsarens prov och renskriften stryker du under felstavade ord, och eleven rättar dem. Ledtråden och vägen renskriver eleven efter läsarens prov. Veckans sida säger de minuter som skiljer sig. Är ni fler än sex, sitter ni vid två bord i Starterna. Passet slutar med en rad på Mina drag."
    kolumner:
