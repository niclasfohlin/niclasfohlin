    titel: "När läraren skriver på tavlan"
    sekunder: 27.19
    beskrivning: "Läraren skriver en mening och tänker högt. Läraren skriver: ”Här är det tyst.” Läraren säger: ”Nej, det kan vara många ställen. Jag stryker.” Läraren skriver i stället en ny mening. Läraren skriver: ”Här får du låna men aldrig köpa.” Omar föreslår en mening. Omar säger: ”Här lånar du böcker på biblioteket.” Läraren skriver: ”Här lånar du böcker på biblioteket.” Meningen säger platsens namn. Läraren säger: ”Biblioteket är namnet. Hur säger vi det utan namnet?” Omar säger: ”Här finns tusen böcker.” Läraren skriver: ”Här finns tusen böcker.”"
    rubrik: "Läraren skriver på tavlan: pröva, stryk och ändra"
    ingress: "Fyra bilder ur filmen om delen Läraren skriver, dag 1: läraren skriver en ledtråd på tavlan, tänker högt om draget och stryker det som är för vagt. Omar föreslår en mening som säger platsens namn, och läraren frågar hur de kan säga det utan namnet. Filmen på metodens sida visar samma sak i rörelse."
    efter: "tidsschema"
    stillbilder:
      - text: "Läraren skriver på tavlan och tänker högt."
      - text: "Meningen är för vag, så läraren stryker och skriver om."
      - text: "Omar föreslår, och läraren ringar in namnet."
      - text: "Läraren frågar, och Omar säger det utan namnet."
  - nr: 3
    titel: "Läsarens prov"
    sekunder: 27.73
    beskrivning: "Lina är ny på skolan och följer Omars väg med fingret. Fingret stannar vid den första affären. Omar säger inget. Omar sätter ett streck där fingret stannade. Omar frågar: ”Var blev det svårt?” Lina säger: ”Vid affären. Jag såg två.” Omar stryker affären och skriver vilken. Omar skriver: ”vid den gula kiosken.” Lina läser igen. Hon går förbi bageriet och svänger vid kiosken. Lina säger: ”Där är simhallen!”"
    rubrik: "Läsarens prov: den nya följer vägen"
    ingress: "Fyra bilder ur filmen om läsarens prov i Guideboken. Lina, som är ny på skolan, följer Omars väg med fingret på kartan. Omar säger inget och sätter ett streck där fingret stannar. Sedan frågar han var det blev svårt och skriver in det som fattades. Filmen på metodens sida visar samma sak i rörelse."
    efter: "ram: Läsarens prov, Guideboken vecka 4: Den nya följer vägen"
    stillbilder:
      - text: "Lina, som är ny, följer vägen med fingret."
      - text: "Fingret stannar vid bageriet. Omar säger inget."
      - text: "Omar sätter ett streck och frågar var det blev svårt."
      - text: "Omar skriver in kiosken, och Lina hittar fram."
