# Metod i stödundervisning. Modellen står i methods/_mall.yaml och docs/modell.md.
# En lektion i Ljudlek i grupp, skriven i lektionsskelettet: methods/ljudlek-i-grupp/_lektion.yaml.
titel: "Ljudlek: Från ljud till ord"
undertitel: "En lektion i Ljudlek i grupp: sätta ihop ljud till ord och ta bort, lägga till eller byta ett ljud, för F–⁠2"
ingress: "Med bokstavskorten sätter eleverna ihop ljud till ord, först utdragna och därefter med en kort paus. Sedan tar de bort, lägger till eller byter ett ljud och läser det nya ordet: mål, ål. Lektionen hör till Ljudlek i grupp och har samma ljudstart och avslut som de andra lektionerna."
omrade: "Läsning"
arskurs:
  - "F-3"
arskursText: "F–2"
taggar:
  - "fonologisk-medvetenhet"
  - "bokstavskunskap"
  - "lasinlarning"
  - "intensivtraning"
  - "avkodning"
format:
  - "liten grupp"
  - "par"
tid: "30 minuter per pass, tre till fem pass i veckan"
period: "Sex till femton pass i följd"
grupp: "2–12 elever"
material:
  - "Ljudrutorna i planeringsmallarna, en per par och gärna laminerade"
  - "Fyra magneter till dina kort på tavlan"
  - "Bokstavskorten under Materialet och en spegel per par"
  - "En whiteboard, en penna och en trasa per elev"
  - "Snabbmallen före och efter passet"
uppdaterad: "2026-09-29"
utkast: false
serie: "ljudlek-i-grupp"
formaga: 8
tranar: "sätta ihop ljud till ord, och ta bort, lägga till och byta ljud"
inledning:
  - "I Från ljud till ord sätter eleverna ihop ljud till ord med bokstavskorten och ändrar ordet ett ljud i taget. Lektionen hjälper eleven med det som gör ljuden svåra: eleven säger ljuden men får inte ihop ordet, glömmer de första ljuden när det blir en paus, och tar bort eller byter fel ljud."
  - "Syftet är att eleverna läser ord genom att sätta ihop ljuden och kan ändra ett ord ett ljud i taget. Ditt uppdrag är att dra ut ljuden utan paus och skjuta ihop korten när ni läser, att säga vilket ljud som går och vilket som kommer, och att göra varje ändring med bokstäverna."
  - "Välj Från ljud till ord när fler än hälften av eleverna har färre än tre rätt av fyra på ljudkollens uppgift 8, sätta ihop och byta. Ljudkollen står i Ljudlek i grupp, och Från ljud till ord hör till förmåga 8, Sätta ihop och byta, i lektionsbanken där."
upplagg:
  rubrik: "Så används lektionen"
  text: "Passet har samma ram i alla lektioner: fem minuter ljudstart, 20 minuter lektion i fyra steg och fem minuter avslut. Ljudlek i grupp beskriver gruppen, dagens elever och ljudkollen. Från ljud till ord går igenom raderna i Så blir lektionen svårare, oftast i sex till femton pass. Ta nästa rad när dagens elever klarar nästan alla ord i steg 4, två pass i följd. Efter sista raden gör ni hela ljudkollen, som visar vad gruppen gör sedan."
