kort:
  listor:
    - "Bokstavskort"
mallar:
  - rubrik: "Ljudrutorna"
    typ: "matta"
    text: "En per par, gärna laminerad."
    kolumner:
      - "Bild"
      - "1"
      - "2"
      - "3"
      - "4"
    fot: "Lägg ett bokstavskort för varje ljud, ett i varje ruta från ruta 1. Peka under det första kortet och dra fingret vidare utan att stanna: sssooolll, t-⁠aaa-⁠k. Skjut ihop korten och läs ordet. Ändra ett kort och läs igen. Rutan Bild står tom i den här lektionen."
