principer:
  rubrik: "Tre saker att hålla fast vid"
  text: "Läs utan paus, också när du har sagt ljuden med paus: dra ut dem från vänster till höger sett från eleverna, säg klusilerna b, d, g, k, p och t korta och skjut ihop korten till ett ord. Ändra ett ljud i taget och säg vilket som går och vilket som kommer. Eleverna läser varje nytt ord med fingret under, så att de inte gissar."
passrutin:
  text: "Lektionen går i fyra steg, från att du visar till att var och en gör själv."
  steg:
    - text: "Du sätter ihop ljuden till ett ord med korten och visar leken i gruppens rad."
      fas: "Ljuden blir ett ord"
    - text: "Gruppen tänker ordet tyst, säger det på ditt tecken och läser det med korten."
      fas: "Tänk och säg"
    - text: "Den ena bygger och läser ordet, och den andra gör ändringen och läser det nya."
      fas: "Bygg och ändra"
    - text: "Var och en skriver ordet och det nya ordet, och du lyssnar på dagens elever."
      fas: "Mina ord"
  efterPasset: "Du noterar i snabbmallen vilka av dagens elever som satte ihop och ändrade orden, vad som fastnade, och om gruppen tar samma rad, nästa rad eller nästa lektion."
tidsschema:
  rubrik: "Ett pass på 30 minuter"
  text: "Är passet bara 20 minuter blir ljudstarten tre minuter, lektionen 15 och avslutet två. Stegen får då två, fyra, fem och fyra minuter."
  rader:
    - tid: "Före passet"
      fas: "Förberedelse"
      vad: "Ta fram ljudrutorna, speglarna, magneterna, whiteboardtavlorna och bokstavskorten, en klippt sida per par med gruppens bokstäver. Rita fyra rutor på tavlan. Välj orden ur Orden att ändra och Ordbanken, och skriv dem, paren och dagens elever i snabbmallen."
    - tid: "0–5 min"
      fas: "Ljudstart"
      vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra, som i Ljudstarten. Alla svarar samtidigt."
    - tid: "5–9 min"
      fas: "Ljuden blir ett ord"
      vad: "Tre ord ur gruppens rad, med korten på tavlan. Stå vänd mot eleverna."
    - tid: "9–15 min"
      fas: "Tänk och säg"
      vad: "Fem ord. Alla svarar samtidigt, och ibland en elev i taget."
    - tid: "15–20 min"
      fas: "Bygg och ändra"
      vad: "Tre eller fyra ord till alla par. Du går mellan paren."
    - tid: "20–25 min"
      fas: "Mina ord"
      vad: "Tre nya ord. Du lyssnar på dagens elever, en i taget."
    - tid: "25–30 min"
      fas: "Avslut"
      vad: "Var och en säger ett ord från dagens lek och vad hen gjorde med det. Du säger kort vad du hörde."
  efter: "Den som är klar före de andra gör ändringen baklänges och läser: ål, mål. I raderna Sätt ihop bygger hen ett ord till ur raden."
steg:
  rubrik: "Vad du gör och säger i varje steg"
  text: "Här är lärarens ord, så att du kan säga dem som de står."
  fraserRubrik: "Exempelfraser"
  rader:
    - namn: "Ljuden blir ett ord"
      fraga: "Vilket ord läser jag?"
      gor: "Sätt korten med mellanrum i rutorna på tavlan. Peka under det första och håll ljudet, dra fingret vidare utan att stanna och skjut ihop korten: sssooolll, sol. Visa sedan leken i gruppens rad: ”Mål. Ta bort /m/.” Ta bort kortet medan du säger /m/, och läs det som är kvar."
      fraser:
        - "Sssooolll. Jag skjuter ihop korten: sol."
        - "Mål. Jag tar bort /m/ och läser: ål."
        - "Vilket ljud tog jag bort?"
    - namn: "Tänk och säg"
      fraga: "Vilket ord hör vi?"
      gor: "Säg ljuden utdragna i första raden, annars med en kort paus. Alla tänker ordet tyst, säger det när du knyter handen och läser det i kör på dina kort. Gör sedan leken: ”Säg ål. Lägg till /n/ först.” Alla säger det nya ordet medan du lägger kortet, och läser det i kör."
      fraser:
        - "Lyssna: /m/ /o/ /s/. Tänk ordet. Säg!"
        - "Säg ål. Lägg till /n/ först."
        - "Nål. Vilket ljud lade vi till?"
    - namn: "Bygg och ändra"
      fraga: "Vilket ord läser du?"
      gor: "Säg ljuden i ett ord till alla par, som i steg 2. Den ena lägger ett kort i varje ljudruta, drar fingret under, skjuter ihop korten och läser. Sedan säger du ändringen, och den andra gör den och läser det nya ordet. I trion gör den tredje ändringen baklänges och läser. Paret sitter bredvid varandra och byter roller efter varje ord."
      fraser:
        - "Lägg ett kort i varje ruta och läs ordet."
        - "Ta bort /m/. Vad står kvar?"
        - "Läs det nya ordet med fingret under."
    - namn: "Mina ord"
      fraga: "Kan du göra det själv?"
      gor: "Säg ljuden i ett nytt ord, som i steg 2. Var och en skriver ordet på sin whiteboard och läser det tyst. Säg sedan ändringen, och eleven skriver det nya ordet under. Dagens elever läser orden för dig och säger vilket ljud som ändrades. Den som inte kan skriva bokstaven än lägger bokstavskortet."
      fraser:
        - "/t/ /a/ /k/. Tänk ordet och skriv det."
        - "Ta bort /k/. Skriv det nya ordet under."
        - "Du ändrade bara ett ljud och hittade ett nytt ord."
arbetsform:
  rubrik: "Arbetsform: alla i kör, växlande, gemensamt"
  text: "I ljudstarten svarar alla samtidigt, och i lektionen går ni från att du visar till att var och en gör själv. Paren och trion sätter du ihop som i Ljudlek i grupp. Den som fortfarande stannar mellan ljuden sätter ihop ljud för ljud med dig: /s/, so, sol."
  delar:
    - rubrik: "1. Alla i kör"
      text: "alla svarar"
      faser:
        - "Ljudstart"
    - rubrik: "2. Växlande"
      text: "du visar, tillsammans, i par, själv"
      faser:
        - "Ljuden blir ett ord"
        - "Tänk och säg"
        - "Bygg och ändra"
        - "Mina ord"
    - rubrik: "3. Gemensamt"
      text: "ett ord var"
      faser:
        - "Avslut"
exempel:
  valt:
    rubrik: "Gruppen"
    text: "sex elever i förskoleklass och åk 1, vecka 8, tre pass i veckan. Gruppen gör Från ljud till ord för femte passet i följd, det första i raden Ta bort ett ljud. Dagens ljud är /d/, och dagens elever är Mira och Alva."
  text:
    - "Ljudstarten. Läraren visar d: ”Kort, utan ö: /d/.” Alva säger ett ord på ljudet: ”duk”."
    - "Ljuden blir ett ord. Läraren sätter m, å och l i rutorna på tavlan och drar fingret under: ”Mmmååålll. Mål.” Hen tar bort m medan hen säger /m/ och läser: ”Ååålll. Ål.”"
    - "Tänk och säg. Läraren säger ”/n/ /å/ /l/”, och alla säger nål. ”Ta bort /n/.” Mira säger ”nå”. Läraren säger: ”Säg nål långsamt. Vilket ljud kommer först? Ta bort just det.” Mira säger ål."
    - "Bygg och ändra. Paren är Alva och Elin, Omar och Noah, Leo och Mira. Läraren säger ”/s/ /å/ /r/”, och Omar lägger korten i ljudrutorna: ”Sår.” Efter ”Ta bort /s/” läser Noah: ”År.”"
    - "Mina ord. Läraren säger ”/t/ /a/ /k/”. Alva skriver tak. Mira säger ”ak”, och läraren bygger ljud för ljud med henne: ”/t/, ta, tak.” Mira skriver tak, och efter ”Ta bort /k/” skriver hon ordet ta under: ”Jag tog bort /k/.”"
    - "Avslutet. Leo säger: ”Mål. Ta bort /m/: ål.” Läraren säger: ”Ni tog bort ett ljud och hittade ett nytt ord.”"
    - "Efteråt noterar läraren: Alva sätter ihop och ändrar säkert. Mira tappar det första ljudet men får ihop ordet ljud för ljud. Nästa pass tar gruppen samma rad, och dagens elever blir Leo och Omar."
fastnar:
  rubrik: "När eleven fastnar"
  text: "Vänta tre sekunder och ge minsta möjliga stöd först. Blir det många fel i gruppen, säg det i kör, låt sedan några elever säga det ensamma och ta samma ord minst tre gånger."
  fragaForst:
    - "Vad hör du?"
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg det igen, långsamt: sssooolll."
    - "Visa hur munnen gör. Eleven tittar i spegeln och känner efter: läpparna ihop vid /m/."
    - "Gör uppgiften mindre: ljud för ljud, /s/, so, sol."
    - "Visa med handen eller med något att flytta: ta bort eller lägg kortet medan ni säger ljudet."
    - "Säg det tillsammans, och låt eleven säga det själv efteråt: sssooolll, sol."
  motto: "Till sist sätter eleven ihop och ändrar ordet själv."
urval:
  rubrik: "Var hittar du orden och materialet?"
  text:
    - "Orden till lektionen står i Orden att ändra, bokstavskorten under Materialet och ljudrutorna i planeringsmallarna. Orden till ljudstarten står i Ordbanken."
    - "Egna ord går också bra, utom orden i ljudkollen och i screeningens version B."
  kravText: "Tre krav gäller egna ord:"
  krav:
    - rubrik: "Kända ord"
      text: "Eleven vet vad ordet betyder"
    - rubrik: "Ett ljud"
      text: "Du ändrar ett ljud, och det nya ordet är känt och står inte i ljudkollen eller version B"
    - rubrik: "Gruppens bokstäver"
      text: "Ljudenliga ord med bokstäver som gruppen har haft eller redan kan, och ingen bokstav två gånger"
uppfoljning:
  text: "Du ser i steg 4 vad eleverna klarar, och ljudkollen var tredje vecka visar samma sak för varje elev. Berätta konkret för eleven vad hen har lärt sig."
  rader:
    - nar: "Under passet"
      vad: "I steg 4 lyssnar du på dagens elever: läser eleven ordet utan att stanna, och säger hen vilket ljud som ändrades?"
    - nar: "Efter varje pass"
      vad: "I snabbmallen noterar du dagens elever och det som fastnade."
    - nar: "Var tredje vecka"
      vad: "Du gör ljudkollens uppgift 8 om att sätta ihop och byta, uppgift 9 om nya ord och uppgift 4 om bokstävernas ljud."
mal:
  rubrik: "Mål: vad eleven ska kunna efter lektionen"
  text: "Efter lektionen ska eleven kunna:"
  punkter:
    - "sätta ihop ljud till ord, också när ljuden kommer med en kort paus"
    - "ta bort det första eller sista ljudet och säga ordet som blir kvar"
    - "lägga till ett ljud först eller sist och säga det nya ordet"
    - "byta ett ljud och säga vilket ljud som gick och vilket som kom"
    - "läsa det nya ordet med bokstäverna"
snabbmall:
