        - "Säg ljuden med en kort paus och vokalen lång. Börja med ord utan klusil. Eleverna drar ändå fingret utan att stanna."
      - - "Ta bort ett ljud"
        - "mål utan /m/ blir ål. sola utan /a/ blir sol."
        - "Ta först bort det första ljudet och senare det sista, och läs det som är kvar."
      - - "Lägg till ett ljud"
        - "ål med /n/ först: nål. sol med /a/ sist: sola."
        - "Lägg kortet först eller sist och läs det nya ordet."
      - - "Byt ett ljud"
        - "mat blir fat. mål blir mås."
        - "Byt det första ljudet, sedan det sista och till sist vokalen, och säg vilket ljud som går och vilket som kommer."
    not: "Gruppen börjar i den första rad där ljudkollens fel ligger. Orden vår och röra hör till raden Sätt ihop, utdraget. Ordet lek hör till raden Ta bort ett ljud och ordet sal till raden Byt ett ljud. I raderna Sätt ihop ändrar ni inget, och i steg 3 läser båda i paret ordet."
  - rubrik: "Ljudstarten: samma fem minuter varje pass"
    plats: "efter-tidsschema"
    text: "Alla svarar samtidigt. Vänd ansiktet mot eleverna, så att de ser din mun."
