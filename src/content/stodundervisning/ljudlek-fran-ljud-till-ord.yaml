    - "Ord och ljud som fastnade"
    - "Nästa pass: samma rad, nästa rad eller nästa lektion?"
grund:
  text: "Barn som drog ut ljuden utan paus läste fler nya ord än barn som stannade mellan ljuden (Gonzalez-⁠Frey och Ehri, 2021). Fonemträning med bokstäver gav nästan dubbelt så stor effekt på läsningen som träning utan bokstäver (National Reading Panel, 2000), och att bygga ord och byta en bokstav i taget gav bättre avkodning (McCandliss m.fl., 2003, i Brady, 2020)."
  kallor: "Bygger på Brady (2020), Gonzalez-⁠Frey och Ehri (2021) och National Reading Panel (2000)."
ramar:
  rubrik: "Materialet"
  text:
    - "Här finns bokstavskorten. I den här lektionen har varje par en egen sida, utöver de två du skriver ut för hela insatsen. Ljudrutorna står i planeringsmallarna. Allt går att kopiera. Laminera bokstavskorten och ljudrutorna."
  ramar:
    - rubrik: "Bokstavskorten"
      text:
        - "Det är samma 24 kort i alla lektioner, i den ordning bokstäverna blir dagens ljud."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Skriv ut korten på tjockt papper och klipp isär dem. Håll upp kortet för dagens ljud så att alla ser det, och håll det rättvänt, eftersom u blir n och d blir p när kortet vänds upp och ned."
      listor:
        - rubrik: "Bokstavskort"
          rader:
            - - "s"
              - "o"
              - "l"
            - - "a"
