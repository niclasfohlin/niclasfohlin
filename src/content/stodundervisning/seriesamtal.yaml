# Seriesamtal, Niclas val 2026-10-04 (arbetsnamnet var Seriesamtal och ritprat).
titel: Seriesamtal
undertitel: Vuxenledda samtal där eleverna ritar en konflikt ruta för ruta och ser vad personerna tänkte och ville, för F–⁠5
ingress: Du och en till fyra elever tar upp en konflikt och ritar den som en serie. Ni spolar tillbaka till när det var lugnt och går framåt en ruta i taget. Sedan ser ni serien ovanifrån och letar upp rutan där någon hade behövt göra annorlunda. Eleven lär sig av konflikter och övar på att tänka innan det svåra kommer.
omrade: Socialt
arskurs:
  - F-3
  - 4-6
arskursText: F–5
taggar:
