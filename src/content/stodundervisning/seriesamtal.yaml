pabordet:
  - nr: 1
    rubrik: "Blad: Frågor vi ställer till varandra"
    text: "Från pass 4 ligger ett kort på varje sida av bordet. En elev läser en fråga och ställer den till en kamrat, och i F–⁠2 läser du frågan åt eleven. Klipp isär bladets två kort och laminera dem."
    alt: "Bladet har två likadana kort att klippa isär, ett till varje sida av bordet. Kortet Frågor vi ställer till varandra har sex frågor i var sin pratbubbla: Vad får dig att tro det? Kan hen ha tänkt något annat? Vad ville hen? Vad behöver hen? Hur kändes det för hen? Tänker du som jag?"
    efter: "ram: Frågor vi ställer till varandra"
    fluent: [sax]
  - nr: 2
    rubrik: "Blad: Vad behöver hen?"
    text: "Kortet ligger bredvid bildserien hela passet, och ni använder det i delen Tankarna. Eleven pekar på ett behov, och ni säger en mening om personen i serien. Skriv ut kortet på A4 och laminera det."
    alt: "Kortet ”Vad behöver hen?” har frågan i en tankebubbla och nio behov i var sin ruta, med en bild över varje: vara med, få vara i fred, få bestämma, hinna klart, ha roligt, få det rättvist, bli hörd, göra rätt och må bra."
    efter: "ram: Vad behöver hen?"
    fluent: ["vara med", "få vara i fred", "få bestämma", "hinna klart", "ha roligt", "få det rättvist", "bli hörd", "göra rätt", "må bra"]
inledning:
  - I ett seriesamtal tar du och eleverna upp en konflikt och ritar den som en serie. Ni spolar tillbaka till när det var lugnt, innan konflikten. Det är ruta 1. Sedan går ni framåt en ruta i taget till konflikten i den sista rutan, och på vägen frågar du vad som händer i nästa ruta. I samtalet efteråt får båda personerna en tankebubbla, och ni ser hela serien ovanifrån. Ni funderar på varför det blev så och i vilken ruta någon hade behövt tänka och göra annorlunda, så att konflikten inte hade uppstått. Sist ritar ni hur det kan bli i stället.
  - Konflikter hör till att vara människa och är inget att vara rädd för. I en konflikt kan vi utvecklas socialt när vi förstår att människor har olika behov och vill olika saker. Därför är syftet att eleven lär sig av konflikter. Hen ska kunna se en social situation lite ovanifrån, förstå varför det blir som det blir och tänka innan det svåra kommer. Det kommer att bli konflikter också efter perioden, och det är inget misslyckande.
  - Ett seriesamtal är ritprat i rutor, i den ordning det hände. Ritprat betyder att du ritar streckgubbar, pratbubblor för det någon säger och tankebubblor för det hen tänker, medan eleven berättar. Det ni ritar står kvar medan ni pratar, så att eleven hinner tänka och ni kan titta på en ruta igen. Så förstärker ritprat och seriesamtal lärandet. De gör också eleven nyfiken på sociala situationer och stöttar den som har svårt att lära sig av en konflikt på egen hand.
  - I pass 1–⁠6 tar ni en färdig bildserie och börjar direkt i ruta 1. När ni sedan ritar en elevs egen händelse, berättar eleven först kort vad som hände. I passets sex delar heter stegen Spola tillbaka, Tankarna, Ovanifrån och Nästa gång. Före dem kommer delen Spaningen, där var och en berättar om sitt spanaruppdrag, en sak att lägga märke till mellan passen. Efter dem kommer delen Med mig. Före pass 1 skriver du ut det som står under Material att skriva ut och träffar varje elev för sig i cirka 15 minuter. För att börja läser du från avsnittet Ett pass på 30 minuter till och med tabellen Pass 1, och checklistan inför pass 1. Resten slår du upp när du behöver det.
upplagg:
  rubrik: Så fungerar insatsen
  text: En till fyra elever har två pass på cirka 30 minuter i veckan under sex till åtta veckor, alltså 12–⁠16 pass. I varje serie spolar ni tillbaka till ruta 1, när det var lugnt, och går framåt en ruta i taget till konflikten i den sista rutan. Sedan får båda personerna en tankebubbla. Ni ser serien ovanifrån, letar upp rutan där någon hade behövt göra annorlunda och ritar hur det kan bli i stället. I pass 1–⁠6 tar ni en bildserie per pass, och sedan elevernas egna händelser. Före och efter perioden visar du provbilden för varje elev.
gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Gruppen är en till fyra elever i F–⁠5 som ofta hamnar i bråk eller utanför och behöver stöd i att förstå vad andra menar och vill. Metoden passar särskilt elever som har assistent eller resurs för sina sociala behov, eftersom den vuxna tar med passens frågor ut på rasten. Eleven behöver kunna berätta i korta meningar. Säger en elev att hen har blivit kränkt, går skolans rutin före metoden. Fråga varje elev för sig om hen vill vara med. Högst en elev får behöva mycket stöd i sitt beteende. Gruppen kan ha en kamrat som förebild. Elever som står mot varandra i en konflikt är inte i samma grupp."
tabeller:
  - rubrik: Perioden pass för pass
    plats: efter-tidsschema
    meny: true
    text: Pass 1–⁠6 har var sin bildserie, där två personer vill olika saker. Varje serie har fyra rutor och slutar där konflikten är som störst. I den sista rutan har personerna ansikten utan ögon och mun, och när det finns tid över ritar eleverna färdigt ansiktena. Under Material att skriva ut står lärarens sida före varje serie, med berättelsen, var ni stannar och vad personerna vill. Det eleven tar med sig från en bildserie är tumregeln. Från pass 4 berättar en elev serien utan att du ställer frågor, och på bordet ligger kortet Frågor vi ställer till varandra. Pass 1, pass 7, ett pass med en egen serie och det sista passet har egna tabeller efter Samtalsteknikerna.
    kolumner:
      - Pass
      - Det som händer
      - Det eleven tar med sig
    rader:
      - - |-
          Pass 1
          Fönsterplatsen
        - Sam håller sig om magen och frågar om han får sitta vid fönstret. Alva säger nej, för hon var först.
        - Man ser inte alltid vad någon behöver. Säg varför, eller fråga varför.
      - - |-
          Pass 2
          Spelet
        - Leo frågar om han får vara med när Mira och Alva spelar fyra i rad. Mira säger nej.
        - Ett nej kan ha ett skäl. Säg skälet.
      - - |-
          Pass 3
          Teckningen
        - Sam slänger Alvas teckning, som låg med baksidan upp bland skräpet. Alva hittar den i papperskorgen.
        - Den som inte såg kan inte veta.
      - - |-
          Pass 4
          Vinsten
        - Saga vinner över Noah i pingis och jublar. Noah går och sätter sig på en bänk.
        - Den som vinner kan vara glad och samtidigt tänka på den som förlorar.
      - - |-
          Pass 5
          Chatten
        - Elias lägger ut en bild på Amir i klassens chatt, och många skrattar. Amir sitter ensam hemma.
        - Ett skämt som är roligt för en kan såra en annan. Fråga innan du lägger ut en bild på någon.
      - - |-
          Pass 6
          Lunchen
        - Nora har sagt att hon ska äta med Ida, som är ny. I matsalen ropar fotbollslaget på Nora.
        - Man kan vilja två saker samtidigt.
      - - |-
          Pass 7
          En gång när det nästan blev bråk
        - Var och en ritar en serie om en gång när det nästan blev bråk, men det blev inget. Serien börjar i ruta 1, när det var lugnt.
        - Eleven ser vad någon gjorde så att det inte blev bråk, och kan göra likadant själv.
      - - |-
          Pass 8 till det näst sista
          Egna händelser
        - I varje pass ritar ni en elevs egen händelse, med samma steg som i bildserierna.
        - Eleven får en plan för nästa gång det händer.
      - - Det sista passet
        - Med pärmarna och gruppens blad framför er ser ni tillbaka på perioden.
        - Var och en väljer en tumregel och en sak att ta med sig.
    not: Personerna i Chatten och Lunchen är runt tolv år, och de fyra första serierna fungerar i hela F–⁠5. I F–⁠2 kan gruppen ta om en eller två av de fyra första serierna i stället för Chatten och Lunchen. Då tar var och en först den person hen inte tog förra gången. Bildserierna sitter på väggen under perioden, i den ordning ni har gjort dem.
  - rubrik: "Samtalsteknikerna: vad du gör och hur det låter"
    plats: efter-steg
    meny: true
    text: Med de här åtta teknikerna leder du samtalet i passets alla delar. De fyra första håller kvar samtalet vid bilden och vid elevens egna tankar. De fyra sista får eleverna att tala med varandra, så att samtalet går runt bordet. Du använder dem från pass 1 och övar särskilt på två i taget, i den ordning de står i tabellen. Gå vidare till två nya varje vecka. Bara tekniken Fråga varandra börjar senare, i pass 4. Skriv teknikerna överst i snabbmallen, och efter två veckor hur det gick med dem. Använd tankeord, till exempel tror, vet, vill, märker, menar, råkar, undrar och minns. En kort version står på lathundens sida 3.
    kolumner:
      - Teknik
      - Så gör du
      - Så låter det
    rader:
      - - Spegla
        - Upprepa elevens egna ord i undrande ton, utan att berömma eller rätta.
        - ”Du tänker att Elias ville vara elak.”
      - - Fråga vad hen ser
        - När eleven säger vad en person tänker eller vill, be eleven visa vad i bilden som får hen att säga det.
        - ”Vad ser du som får dig att säga det?”
      - - Pröva en tanke till
        - Be eleven komma på en tanke till, och fråga vad personen ville när det är oklart.
        - ”Kan hen ha tänkt eller velat något annat?”
      - - Undra högt
        - Säg högt vad du själv undrar om en person, så att eleverna hör hur en nyfiken fråga låter.
        - ”Jag undrar vad Nora tänker när laget ropar.”
      - - Tänk själv först
        - Låt alla tänka tyst innan någon svarar. Den som har en tanke visar tummen.
        - ”Tänk tyst. Visa tummen när du har en tanke.”
      - - Skicka frågan vidare
        - Låt en elev svara på det en kamrat sa, i stället för att du svarar själv.
        - ”Vera, vad säger du om det Ella såg?”
      - - Knyt ihop
        - När två elever ser olika på samma ruta, fråga om båda kan stämma och vad i bilden som får dem att tro det.
        - ”Ella och Vera, ni ser olika på det. Kan båda stämma?”
      - - Fråga varandra
        - Från pass 4 ligger kortet Frågor vi ställer till varandra på var sida av bordet. Låt eleverna ställa frågorna till varandra.
        - ”Läs frågan på kortet och ställ den till Ella.”
  - rubrik: "Pass 1: syftet, reglerna och tankebubblan"
    plats: efter-steg
    meny: true
    text: Före pass 1 träffar du varje elev för sig. Pass 1 börjar med att du säger varför ni ses och vad som gäller i gruppen, och sedan gör ni en övning som visar att tankar inte syns. Till sist tar ni bildserien Fönsterplatsen, med kortare tid för de flesta delarna än i ett vanligt pass.
    kolumner:
      - Del
      - Så gör du
    rader:
      - - |-
          Samtalet före
          Före pass 1
        - Träffa en elev i taget i cirka 15 minuter. Berätta att ni i gruppen ritar bråk som serier och spolar tillbaka till när det var lugnt. Fråga om hen vill vara med. Visa sedan provbilden och fyll i protokollet. Låt eleven säga ett mål, till exempel ”Jag vill få vara med”, och skriv det på framsidan av elevens pärm. Be klassläraren sätta sin siffra från 0 till 10 för eleven.
      - - |-
          Förberedelse
          Före passet
        - Skriv gruppens regler överst på ett stort papper, gruppens blad, och sätt upp det på väggen. Lägg Fönsterplatsen på A3 mitt på bordet, med rutorna 2–⁠4 täckta. Ta fram en tankebubbla och en pratbubbla på var sin pinne till varje elev och till dig själv. Lägg fram lösa bubblor, pennor och spanarbladen med det första uppdraget.
      - - |-
          Varför vi ses
          0–⁠4 min
        - "I F–⁠2 säger du: ”Här ritar vi serier om hur det är att vara med andra. Tankar syns inte, men här kan vi rita dem.” I åk 3–⁠5 säger du: ”Ibland blir det bråk fast ingen ville det, eftersom vi inte kan se vad andra tänker. Här ritar vi händelser som serier och ser vad alla som var med tänkte och ville.” Säg också: ”Vi börjar i rutan där det var lugnt och går framåt en ruta i taget. Sedan letar vi upp rutan där någon hade behövt göra annorlunda. Jag bestämmer inte vem som hade rätt. Alla hamnar i bråk ibland, och det är inget farligt. Vi ritar för att förstå och lära oss av det.”"
      - - |-
          Gruppens regler
          4–⁠6 min
        - "Läs reglerna på gruppens blad: ”Den som äger serien bestämmer vad som står i den. Vi skrattar inte åt någons serie. Du får säga ’Jag vet inte’ eller ’Jag står över’. Det vi säger stannar här, men om jag får veta att någon far illa, måste jag berätta det för någon som kan hjälpa.”"
      - - |-
          Tankebubblan
          6–⁠11 min
        - "Titta tyst på något i rummet, skriv det i tankebubblan utan att någon ser och håll baksidan mot gruppen. Säg: ”Jag tänker på något. Vad tänker jag på?” Låt eleverna gissa, och säg sedan: ”Det kan ni inte veta. Tankar syns inte.” Håll pratbubblan vid munnen och säg: ”Jag tänker på pennan.” Vänd tankebubblan och säg: ”Nu vet ni, för jag sa det.” Var och en gör likadant med något eget, och de andra gissar."
      - - |-
          Spola tillbaka
          11–⁠16 min
        - "Säg: ”I den här serien går det snett. Vi spolar tillbaka till när det var lugnt.” Läs ruta 1, stanna och säg: ”Här har inget hänt än.” Visa sedan en ruta i taget, och stanna där det står Stanna här på lärarens sida."
      - - |-
          Tankarna
          16–⁠21 min
        - Säg själv vad en av personerna kan tänka, skriv det på en lös bubbla och lägg den vid personen. Sedan tar eleverna de roller du har bestämt, som i ett vanligt pass.
      - - |-
          Ovanifrån
          21–⁠24 min
        - "En elev berättar serien. Berätta sedan det som gruppen inte vet än: Sam mår illa när han åker buss, men inte när han kan titta ut genom fönstret. Fråga sist varför det blev så och i vilken ruta Alva eller Sam hade behövt tänka och göra annorlunda."
      - - |-
          Nästa gång
          24–⁠27 min
        - "Utgå från den rutan och fråga ”Hur kan det bli i stället?” Var och en säger vad Alva eller Sam kan göra, och två elever spelar upp ett av förslagen med bubblorna på pinne."
      - - |-
          Med mig
          27–⁠30 min
        - Var och en säger en sak hen tar med sig. Gruppen säger dagens tumregel, och du skriver den på gruppens blad. Dela ut spanarbladen.
  - rubrik: "Pass 7: en gång när det nästan blev bråk"
    plats: efter-steg
    meny: true
    text: Den första egna serien handlar om en gång när det nästan blev bråk, men det blev inget. Var och en ritar sin egen händelse i mallen med fyra rutor och följer samma steg som i bildserierna. I delen Ovanifrån letar eleverna upp rutan där någon gjorde något så att det inte blev bråk.
    kolumner:
      - Del
      - Så gör du
    rader:
      - - |-
          Förberedelse
          Före passet
        - Lägg fram elevernas pärmar, pennor och en mall med fyra rutor till var och en. Bestäm i vilken ordning eleverna ska rita sina egna händelser, med början i pass 8.
      - - |-
          Spaningen
          0–⁠4 min
        - Var och en berättar om sitt spanaruppdrag.
      - - |-
          Spola tillbaka
          4–⁠13 min
        - Var och en tänker på ett tillfälle när det nästan blev bråk, men det blev inget. Eleverna spolar tillbaka till när det var lugnt, ritar det i ruta 1 och ritar sedan en ruta i taget fram till det som hände. Du ritar åt den som vill.
      - - |-
          Tankarna
          13–⁠17 min
        - Var och en ritar sin egen tankebubbla och den andra personens, i rutan där det nästan blev bråk.
      - - |-
          Ovanifrån
          17–⁠23 min
        - Var och en visar sin serie och säger i vilken ruta någon gjorde något så att det inte blev bråk. Fråga ”Vad tänkte hen då?”
      - - |-
          Nästa gång
          23–⁠26 min
        - Fråga ”När kan du göra likadant?” Var och en säger när hen kan göra det.
      - - |-
          Med mig
          26–⁠30 min
        - "Var och en säger vad hen tar med sig, läser målet på sin pärm och säger hur det går med det. Berätta att ni från pass 8 ritar en elevs egen händelse i varje pass, och i vilken ordning ni tar dem. Dela ut spanarbladen med uppdraget ”Lägg märke till en gång när det nästan blev bråk, men det blev inget. Vad gjorde någon precis innan, så att det inte blev bråk?”"
    not: Påfyllningspasset fyra veckor efter det sista passet har samma delar och tider. I delen Spaningen läser var och en sin plan och säger hur den har gått. Sedan ritar var och en ett tillfälle när planen fungerade. Har elevens plan inte fungerat, ritar eleven en gång när det blev svårt. I delen Ovanifrån säger eleven i vilken ruta någon hade behövt tänka och göra annorlunda, och i delen Nästa gång säger hen hur det kan bli i stället. Direkt efter passet gör ni en ny plan på bladet Min plan, och det tar cirka tio minuter.
  - rubrik: Ett pass med en egen serie
    plats: efter-steg
    meny: true
    text: Från pass 8 äger en elev serien i varje pass. Eleven berättar sin version först, ni spolar tillbaka till när det var lugnt, och de andra lyssnar och säger vad de undrar. Delarna och tiderna är desamma som i ett pass med en bildserie. Allt ritar ni på papper, också tankebubblorna, så att serien finns kvar i elevens pärm. Passet står också på Lektionskortet, ett A4 att ha framför dig.
    kolumner:
      - Del
      - Så gör du
    rader:
      - - |-
          Förberedelse
          Dagen före
        - Prata i fem minuter med den som äger serien, och fråga ”Vill du rita något som har hänt dig, eller något som brukar bli svårt? Är det över nu? Får de andra höra det?” Pröva händelsen mot de tre kraven under ”Var hittar du bildserierna och händelserna?”, och säg att du inte bestämmer vem som hade rätt. Skriv ut mallen med fyra rutor på A3, eller mallen med sex rutor om händelsen är lång. Före passet lägger du fram mallen, pennorna och bladet Nästa gång.
      - - |-
          Spaningen
          0–⁠4 min
        - Du eller en elev läser gruppens regler högt. Sedan berättar var och en om sitt spanaruppdrag, och från pass 9 berättar den som ägde serien i förra passet hur planen gick.
      - - |-
          Spola tillbaka
          4–⁠11 min
        - Låt ägaren berätta kort vad som hände. Spola sedan tillbaka till när det var lugnt och fråga ”Var var du? Vad gjorde du precis innan? Vad ville du då?” Det blir ruta 1. Ägaren berättar vidare, en ruta i taget fram till konflikten. Ägaren väljer om du eller hen ritar, och du rättar inget i det hen berättar. De andra lyssnar.
      - - |-
          Tankarna
          11–⁠17 min
        - Rita först ägarens egna tankebubblor, i ruta 1 och i rutan där det gick snett. Fråga sedan ”Får vi undra över vad den andra tänkte?” De andra i gruppen säger vad de undrar, och ägaren väljer vilken tanke som ska stå i den andra personens bubbla.
      - - |-
          Ovanifrån
          17–⁠21 min
        - Ägaren berättar hela serien. Fråga ”Vad gjorde du som hen märkte?” och sedan ”I vilken ruta hade någon behövt tänka och göra annorlunda?” Svaret kan också vara en ruta där den andra personen hade behövt göra annorlunda, och ägaren bestämmer vilken ruta det blir. Blev ägaren sårad, fråga också ”Vad behöver hända för att det ska bli bra för dig?”
      - - |-
          Nästa gång
          21–⁠27 min
        - Utgå från rutan där någon hade behövt göra annorlunda, och fråga ”Hur kan det bli i stället?” De andra kommer med förslag, ägaren väljer ett av dem, och ägaren eller du ritar det på bladet Nästa gång. Direkt efter passet fyller du i bladet Min plan med ägaren, och det tar cirka tio minuter.
      - - |-
          Med mig
          27–⁠30 min
        - Var och en säger vad hen tar med sig. Säg till ägaren något hen gjorde bra i samtalet, till exempel ”Du berättade fast det var svårt.” Ägaren får planen som sitt spanaruppdrag, och du skriver uppdraget på spanarbladet när ni fyller i bladet Min plan. De andras uppdrag är ”Lägg märke till en gång när det nästan blev bråk, men det blev inget. Vad gjorde någon precis innan, så att det inte blev bråk?”
    not: Handlar serien om något som ska hända, ritar ni i ruta 1 hur det brukar börja och går fram till rutan där det brukar bli bråk. Sedan får personerna tankebubblor som vanligt, och i delen Nästa gång ritar ni hur det kan bli i stället och vad eleven, den andra personen och de vuxna kan göra. I ett pass som blir över äger gruppen serien, och gruppen väljer händelsen i slutet av passet före. Eleverna berättar i tur och ordning där ägaren annars berättar, och gruppen väljer tillsammans där ägaren annars väljer. I delen Nästa gång ritar var och en på bladet Nästa gång vad hen kan göra, och det blir hens spanaruppdrag. Ingen fyller i bladet Min plan efter passet.
  - rubrik: Det sista passet
    plats: efter-steg
    meny: true
    text: I det sista passet ser ni tillbaka på hela perioden, med elevernas pärmar och gruppens blad.
    kolumner:
      - Del
      - Så gör du
    rader:
      - - |-
          Förberedelse
          Före passet
        - Lägg fram varje elevs pärm, och ha gruppens blad på väggen.
      - - |-
          Starten
          0–⁠5 min
        - Säg ”I dag tittar vi tillbaka på allt vi har gjort.” Var och en berättar om sitt spanaruppdrag, och den som ägde serien i förra passet säger hur planen gick. Sedan läser var och en målet på sin pärm.
      - - |-
          Förut och nu
          5–⁠13 min
        - Var och en bläddrar i sin pärm, väljer en serie och pekar på rutan där någon hade behövt göra annorlunda. Sedan säger hen hur hen tänkte då och hur hen tänker nu, till exempel ”Först tänkte jag att han tog bollen med flit. Nu tror jag att han inte visste.” De andra säger en sak de har sett att hen har lärt sig.
      - - |-
          Tumreglerna
          13–⁠21 min
        - Gruppen läser tumreglerna på gruppens blad, och var och en väljer en att ta med sig.
      - - |-
          Med mig
          21–⁠27 min
        - Var och en säger eller ritar en sak hen tar med sig, vem som kan hjälpa hen efter perioden och ett råd till en elev som ska börja i en sådan grupp.
      - - |-
          Avslutet
          27–⁠30 min
        - Säg en sak du har sett hos var och en. Säg också att det kommer att bli bråk igen, och att de nu vet hur de kan lära sig av det. Berätta att du visar provbilden för var och en efter passet, och att ni ses igen om fyra veckor i ett påfyllningspass, där ni läser planerna och ritar en serie om en gång när planen fungerade.
  - rubrik: Så anpassar du för eleven
    plats: efter-steg
    kolumner:
      - Eleven
      - Så gör du
    rader:
      - - Förskoleklass
        - Passet kan bli 20 minuter, med delarna Spaningen 0–⁠3 min, Spola tillbaka 3–⁠8 min, Tankarna 8–⁠12 min, Ovanifrån 12–⁠14 min, Nästa gång 14–⁠17 min och Med mig 17–⁠20 min. I delen Ovanifrån pekar eleven på rutan där någon hade behövt göra annorlunda. Dela pass 1 i två pass, ett med syftet, reglerna och tankebubblan, och ett med Fönsterplatsen. Räkna båda som pass 1. I övningen Tankebubblan ritar eleven det hen tittar på, i stället för att skriva det. Fråga mest om det ni ser och det personerna gör. Du ritar och skriver, och eleven pekar. Gör också det som står i raden F–⁠2.
      - - F–⁠2
        - Läs berättelsen och peka på personerna. Där ni stannar läser du de två vägarna framåt på lärarens sida och frågar vilken eleven tror på, till exempel ”Tror du att Alva säger nej, eller frågar hon om Sam mår illa?” Låt eleven välja mellan två tankar, och fråga ”Ville hen vara dum, eller ville hen något annat?” Du skriver i bubblan det eleven säger. Eleven gör spanaruppdraget med en vuxen i klassen, och när ni fyller i Min plan visar eleven med fingrarna hur stark känslan var. Har eleven varit med om något, ritpratar du med hen samma dag, och ni tar upp serien i gruppen om den uppfyller de tre kraven.
      - - Åk 3–⁠5
        - Eleverna skriver själva i bubblorna och ritar sina egna serier i mallen med fyra eller sex rutor. Fråga också vad den ena tror att den andra tänker, som ”Vad tror Elias att Amir tänker?”
      - - Med språkstörning
        - Prata om två rutor i taget, den ni just har läst och den före, och ställ en konkret fråga åt gången, till exempel ”Vad hände först? Och sedan?” Ge eleven början på en mening, till exempel ”Jag tror att hon”, ”Han vill” eller ”Hon visste inte att”. När det låser sig, ge två tankar eller två känslor att välja mellan, eller ställ en fråga som eleven kan svara ja eller nej på.
      - - Med adhd
        - Skriv passets sex delar på en lapp som eleven bockar av. Ge en uppgift i taget, som att leta ledtrådar i bilden, och låt eleven hålla i pennan. Gör en kort paus efter delen Tankarna, och korta delen Spaningen lika mycket som pausen tar.
      - - Med autism
        - Berätta före passet vad det handlar om och hur länge det håller på. Där ni stannar skriver ni personens tanke på en tankebubbla och lägger den vid personen, innan ni säger vad hen gör sedan. I delen Nästa gång säger du också vad som är klokt att göra och varför. I elevens egen serie ritar du hur de andra kan ha missförstått eleven, och frågar eleven vad de andra kan göra annorlunda.
  - rubrik: En elev eller två till fyra
    plats: efter-arbetsform
    meny: true
    text: Med en elev får eleven all din uppmärksamhet och hela passet. Med två till fyra elever hör eleverna fler tankar om samma ruta och övar med jämnåriga, och det är med jämnåriga som samspelet brukar bli svårt. Var och en får mindre tid, och den som berättar en egen händelse gör det inför fler.
    kolumner:
      - Del
      - En elev och du
      - Två till fyra elever
    rader:
      - - Passar för
        - Förskoleklass och åk 1, en elev som skäms mycket eller blir överstimulerad i grupp, och en känslig händelse.
        - Elever som kan vänta på sin tur några minuter och har nytta av att höra andra, gärna med en kamrat som förebild.
      - - Spaningen
        - Ni turas om. Eleven berättar om sitt spanaruppdrag, och du berättar något du själv har sett.
        - Ni tar en runda, och den som håller upp sina bubblor pratar. Från pass 4 är det en kamrat som speglar, till exempel ”Du såg att han tog bollen.”
      - - Spola tillbaka
        - Du läser, och eleven säger vad som kan hända. Eleven bestämmer tempot.
        - Du läser. Där ni stannar tänker alla först själva och visar tummen, och sedan säger ni i en runda vad som kan hända.
      - - Tankarna
        - Eleven tar en person och du den andra, och sedan byter ni. Säg din persons tankar som en undran, på samma sätt som i tekniken Undra högt.
        - Eleverna tar en person var, och med tre elever är en av dem detektiv. Med fyra elever tar två och två samma person och jämför sina tankar.
      - - Ovanifrån
        - Eleven berättar hela serien, och ni letar tillsammans upp rutan där någon hade behövt göra annorlunda.
        - En elev berättar hela serien, och de andra säger i vilken ruta någon hade behövt tänka och göra annorlunda.
      - - Nästa gång
        - Eleven ritar en ruta och du en annan, och ni spelar upp elevens ruta.
        - Var och en ritar på bladet Nästa gång hur det kan bli i stället, och två elever spelar upp en av teckningarna.
      - - Med mig
        - Du säger en sak du såg hos eleven, och eleven säger vad hen tar med sig.
        - Ni tar en runda där var och en säger vad hen tar med sig, gärna något som en kamrat fick hen att tänka på, till exempel ”Det Vera sa hade jag inte tänkt på.”
      - - En egen serie
        - Ni kan ta egna serier före pass 8, och de kan handla om något svårare, eftersom ingen annan hör. Eleven säger vad den andra kan ha tänkt, och du skriver det i en tankebubbla vid den andra personen.
        - Ni tar en egen händelse bara när den uppfyller de tre kraven. Den som äger serien bestämmer vad som står i den, och de andra säger vad de undrar.
      - - Din roll
        - Du tar kamratens plats i samtalet. Låt eleven hålla i pennan ofta, så att det inte blir en intervju.
        - Du fördelar ordet och skickar frågorna vidare till eleverna. Från pass 4 ställer eleverna frågorna till varandra.
    not: Detektiven letar ledtrådar i bilden och säger sist vad hen har hittat och var i bilden det syns. Ni byter detektiv varje pass. Den som har tagit en person svarar som personen, i jagform. Hur eleverna talar med varandra står i de fyra sista samtalsteknikerna.
  - rubrik: Med en assistent eller resursperson
    plats: efter-arbetsform
    meny: true
    text: Metoden passar särskilt elever som har assistent eller resurs för sina sociala behov. Den vuxna som är med eleven under dagen kan ta med sig passens frågor och elevens plan ut på rasten. Annars följer det som eleven upptäcker vid bordet sällan med ut. Tabellen gäller när assistenten är den andra vuxna vid bordet. Leder assistenten gruppen, gäller det som står under Lärarens roll.
    kolumner:
      - När
      - Vad assistenten gör
      - Stödet hen behöver
    rader:
      - - Före perioden
        - Läser metoden, ser filmerna och gör ett seriesamtal om något hen själv har varit med om, tillsammans med den som leder gruppen.
        - En timme med en speciallärare eller specialpedagog.
      - - I passen
        - Sitter bredvid eleven, ritar när eleven vill och hjälper eleven att vänta på talpinnen. Svarar inte åt eleven.
        - Handledning av en speciallärare eller specialpedagog i 20 minuter varannan vecka, med snabbmallen som underlag.
      - - När assistenten var med i händelsen
        - Väntar med sin version tills elevens står på pappret och ritar den sedan bredvid.
        - Ett samtal med dig om händelsen före passet.
      - - I vardagen
        - Ställer frågorna på kortet Till de vuxna runt eleven före en situation som brukar bli svår, och efter att något har hänt, när eleven är lugn. Säger det till eleven när något går bra.
        - Kortet Till de vuxna runt eleven, och elevens plan om eleven säger ja.
      - - Efter perioden
        - Fortsätter med frågorna och planen, och är med i påfyllningspasset efter fyra veckor. Kan leda en egen grupp nästa period.
        - Elevens pärm och plan, och handledning.
    not: Är ni fler än två vuxna, blir det svårt för eleverna att tala med varandra. Har flera elever assistent, är en av assistenterna med i passen, och de andra får kortet Till de vuxna runt eleven.
  - rubrik: Om något händer
    plats: efter-fastnar
    meny: true
    kolumner:
      - Det som händer
      - Så gör du
    rader:
      - - Eleven säger ”Han började!”
        - Säg ”Då spolar vi tillbaka. Vad hände innan?” Rita ruta 1, när det var lugnt, och gå sedan framåt en ruta i taget. Stanna i rutan där eleven själv gjorde något.
      - - Eleven försvarar sig eller skäms
        - Peka på rutan och prata om det som händer där, till exempel ”Titta på ruta 3. Vad händer där?” Sitt kvar bredvid eleven, och säg vad hen gjorde bra i samtalet.
      - - Eleven vill att den andra ska få straff
        - Säg att de vuxna tar hand om det som gäller den andra, och att ni ritar för att förstå. Fråga ”Vad behöver hända för att det ska bli bra för dig?”
      - - Eleven vill att du säger vem som hade rätt
        - Fråga ”Vad ville Alva? Vad ville Sam?” och säg att båda ville något som går att förstå. Ville någon såra, förklarar du att man då säger stopp och berättar för en vuxen.
      - - En elev svarar åt de andra eller tar över samtalet
        - Säg ”Tack, Ella. Nu vill jag höra Vera.” Låt alla tänka först och visa tummen, och ge Ella ett uppdrag, som att leta ledtrådar i bilden.
      - - Eleven blir arg för att det inte blev som hen trodde
        - Säg ”Det hade kunnat bli så. Nu läser vi vad som hände här.” Fråga vad personen visste.
      - - Eleven säger att det alltid blir bråk
        - Fråga ”Vad gjorde någon de gånger det inte blev bråk?” och rita en sådan gång.
      - - Någon skrattar åt en annans serie
        - Påminn om regeln att ingen skrattar åt någons serie, och fråga den det gällde hur det kändes.
      - - Eleven blir upprörd
        - Lägg ned pennan och gör en paus. Blir det inte lugnt, får serien vänta till nästa pass.
      - - En elev vill inte rita sin händelse
        - Rita en påhittad serie om något liknande, eller ta en bildserie.
      - - Eleven tycker att det är barnsligt
        - Ta Chatten eller Lunchen tidigare, eller rita serien utan figurer, med bara rutor och bubblor.
      - - Eleven tror att personen säger det som står i tankebubblan
        - Håll tankebubblan vid personens huvud och säg ”Det här tänker hon, men hon säger det inte.”
      - - En elev berättar om en kränkning eller att någon far illa
        - Avbryt passet lugnt, prata med eleven för sig och följ skolans rutin. Den går före seriesamtalet.
principer:
  rubrik: Tre saker att hålla fast vid
  text: Spola tillbaka och spela framåt. Börja i ruta 1, när det var lugnt, och gå framåt en ruta i taget till konflikten. Stanna på vägen och fråga vad som händer i nästa ruta, så att eleven tänker innan det svåra kommer. Båda personerna får en tankebubbla. Eleverna svarar som personerna, och du speglar det de säger utan att rätta. Se serien ovanifrån. Med hela serien framför er frågar du varför det blev så och i vilken ruta någon hade behövt tänka och göra annorlunda, så att konflikten inte hade uppstått. Sedan ritar ni hur det kan bli i stället. Så lär sig eleven av konflikten.
passrutin:
  kallas: delar
  text: Passen med en bildserie och med en egen serie följer samma rutin i sex delar. Varje del har en fråga. Rutinen gör det tryggt att prata om något svårt, och eleverna lär sig frågorna så att de kan ställa dem själva.
  steg:
    - text: Vad såg du någon säga eller göra, och vad tror du att hen tänkte?
      fas: Spaningen
    - text: Vad händer i nästa ruta?
      fas: Spola tillbaka
    - text: Vad tänkte, kände och ville personerna?
      fas: Tankarna
    - text: Varför blev det så, och i vilken ruta hade någon behövt tänka och göra annorlunda?
      fas: Ovanifrån
    - text: Hur kan det bli i stället?
      fas: Nästa gång
    - text: Vad tar du med dig?
      fas: Med mig
  efterPasset: Du fyller i snabbmallen och lägger elevernas blad i pärmarna. Efter ett pass med en egen serie frågar du ägaren vilken vuxen hen vill visa Min plan för. Visar en egen serie att något runt eleven behöver ändras, tar du det vidare till klassläraren eller elevhälsan, om eleven säger ja.
tidsschema:
  rubrik: Ett pass på 30 minuter
  text: Tabellen gäller ett pass med en bildserie, pass 2–⁠6. Läs förra passets rad i snabbmallen och lärarens sida för dagens serie, och skriv vad eleverna ska få syn på i dag under Före i snabbmallen. Lärarens sida har berättelsen och säger var ni stannar. Det du kan säga står under Passets sex delar. De andra passen har egna tabeller, som står efter Samtalsteknikerna.
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: Lägg dagens bildserie på A3 mitt på bordet, och täck rutorna 2–⁠4 med ett halvt A4-ark på varje ruta. Lägg fram bubblorna, talpinnen, elevernas pärmar och en whiteboardpenna till var och en, i var sin färg. Talpinnen går runt i rundorna, och den som håller i den pratar. Lägg också fram bladet Nästa gång och kortet ”Vad behöver hen?”, och från pass 4 kortet Frågor vi ställer till varandra. Skriv det nya spanaruppdraget från lärarens sida på spanarbladen.
    - tid: 0–4 min
      fas: Spaningen
      vad: Var och en håller upp bubblorna på pinne och berättar om sitt spanaruppdrag, utan att säga några namn. Du speglar det var och en såg, och från pass 4 gör en kamrat det.
    - tid: 4–11 min
      fas: Spola tillbaka
      vad: "Säg: ”I den här serien går det snett. Vi spolar tillbaka till när det var lugnt.” Börja i ruta 1. Ta sedan bort pappret från en ruta i taget och läs den, fram till konflikten i den sista rutan. Där det står Stanna här på lärarens sida stannar ni, och du ställer frågorna som står där. Alla tänker först själva, och sedan säger ni vad som kan hända."
    - tid: 11–17 min
      fas: Tankarna
      vad: Var och en tar en av personerna och svarar som personen, i jagform. Med tre elever är en av dem detektiv och letar ledtrådar i bilden, och med fyra tar två och två samma person. Eleverna skriver personens tanke på en lös bubbla och lägger den i den ruta som står under Två tankar att välja mellan på lärarens sida. Sedan byter de person, läser den personens bubbla och säger om de tänker likadant. Sist säger detektiven vad hen har hittat i bilden.
    - tid: 17–21 min
      fas: Ovanifrån
      vad: En elev berättar hela serien, och efter det läser du upp det som står under Det ni inte vet än på lärarens sida. Fråga sedan varför det blev så och i vilken ruta någon hade behövt tänka och göra annorlunda, så att konflikten inte hade uppstått.
    - tid: 21–27 min
      fas: Nästa gång
      vad: "Utgå från rutan där någon hade behövt göra annorlunda, och fråga ”Hur kan det bli i stället?” Var och en ritar ett nytt slut på bladet Nästa gång, och två elever tar bubblorna på pinne och spelar upp en av teckningarna."
    - tid: 27–30 min
      fas: Med mig
      vad: Talpinnen går en runda, och var och en säger vad hen tar med sig. Säg en sak du såg hos gruppen, skriv tumregeln på gruppens blad och dela ut spanarbladen.
  efter: Delen Med mig hoppar ni aldrig över, eftersom det är där eleven säger vad hen har fått syn på.
steg:
  rubrik: "Passets sex delar: vad du gör och säger"
  text: Det som skiljer i en egen serie står i tabellen Ett pass med en egen serie. Under Du kan säga står frågor och meningar att välja bland. Välj en eller två i taget, och vänta minst tre sekunder på svaret.
  fraserRubrik: Du kan säga
  rader:
    - namn: Spaningen
      fraga: Vad såg du någon säga eller göra, och vad tror du att hen tänkte?
      gor: Låt eleven hålla upp pratbubblan och säga vad någon sa eller gjorde, och sedan tankebubblan och säga vad hen tror att personen tänkte. Eleven fick spanaruppdraget i slutet av förra passet. I pass 1 lär sig gruppen i stället vad bubblorna visar.
      fraser:
        - Vad såg du någon säga eller göra?
        - Vad tror du att hen tänkte?
        - Vad tänkte hen men sa inte?
        - Hur gick det med din plan?
    - namn: Spola tillbaka
      fraga: Vad händer i nästa ruta?
      gor: Fråga vad personerna vill och vet, i ruta 1 och där ni stannar. När ni stannar handlar det inte om att gissa rätt, och ”Vi vet inte än” är ett bra svar. När alla har sagt vad som kan hända, läser du nästa ruta.
      fraser:
        - Här har inget hänt än. Vad vill hon?
        - Vad vet han? Vad vet han inte?
        - Vad händer nu, tror du?
        - Vi spolar tillbaka. Vad gjorde du precis innan det hände?
    - namn: Tankarna
      fraga: Vad tänkte, kände och ville personerna?
      gor: Fråga vad i bilden som får eleven att säga det, när hen berättar vad en person tänker. Be om en tanke till innan ni skriver i bubblan.
      fraser:
        - Om du var hen, vad skulle du vilja?
        - Vad ser du som får dig att säga det?
        - Vad tänkte hon i ruta 1? Vad tänker hon nu?
        - Ville hen såra, eller ville hen något annat?
        - Vad behöver han?
    - namn: Ovanifrån
      fraga: Varför blev det så, och i vilken ruta hade någon behövt tänka och göra annorlunda?
      gor: Låt en elev berätta hela serien, och be gruppen lyssna efter vad personerna tänkte och ville. Från pass 4 berättar eleven utan att du ställer frågor.
      fraser:
        - Berätta hela serien från ruta 1.
        - Varför blev det så?
        - I vilken ruta hade någon behövt tänka och göra annorlunda?
        - Vad gjorde du som hon märkte?
        - Kan vi veta säkert? Hur kan du ta reda på det?
    - namn: Nästa gång
      fraga: Hur kan det bli i stället?
      gor: Det eleverna ritar ska vara bra för båda personerna. Fråga också vad den andra personen och de vuxna kan göra.
      fraser:
        - Vad kunde hen ha gjort i stället?
        - Vad tänker den andra då? Hur slutar det?
        - Vad kan den andra göra? Vad kan vi vuxna göra?
        - Har du varit med om något liknande? Berätta för mig efter passet.
        - När det händer igen, vad kan du göra innan det blir bråk?
    - namn: Med mig
      fraga: Vad tar du med dig?
      gor: Lärarens sida har ett förslag på dagens tumregel, och gruppen säger den med egna ord innan du skriver den.
      fraser:
        - Vad tar du med dig i dag?
        - Vad tänkte du först? Vad tänker du nu?
        - Jag märkte att ni ändrade er när ni tittade på ruta 1.
arbetsform:
  rubrik: "Arbetsform: runt samma bord"
  text: Ni sitter runt samma bord hela passet, med serien mitt på bordet. I rundorna går talpinnen runt bordet, åt samma håll varje gång. Den som vill får stå över och ta sin tur sist. I en egen serie föreslår de andra hur det kan bli, och ägaren väljer ett av förslagen.
  delar:
    - rubrik: 1. I tur och ordning
      text: var och en berättar
      faser:
        - Spaningen
    - rubrik: 2. Gemensamt
      text: ni tar en ruta i taget
      faser:
        - Spola tillbaka
    - rubrik: 3. Var sin roll
      text: eleverna är personerna eller detektiv
      faser:
        - Tankarna
    - rubrik: 4. Gemensamt igen
      text: ni ser hela serien
      faser:
        - Ovanifrån
    - rubrik: 5. Var för sig
      text: var och en ritar
      faser:
        - Nästa gång
    - rubrik: 6. I tur och ordning igen
      text: var och en säger en sak
      faser:
        - Med mig
exempel:
  valt:
    rubrik: Gruppen
    text: Ella, Malik och Vera i åk 4 hamnar ofta i bråk på rasten, eftersom de tror att andra är emot dem. Exemplet är pass 5 med bildserien Chatten.
  text:
    - Läraren har lagt Chatten på A3 mitt på bordet med rutorna 2–⁠4 täckta. Bredvid ligger bubblorna, en whiteboardpenna till var och en i var sin färg och kortet Frågor vi ställer till varandra. Ella är Elias, Malik är Amir, och Vera är detektiv. I snabbmallen står att Vera i förra passet kom på en tanke till utan hjälp.
    - "Vera berättar om sitt spanaruppdrag: ”Det blev nästan bråk om en plats i matsalen. Men en kille frågade först om den var ledig.” Läraren läser ruta 1 och stannar: ”Bilden finns bara i Elias mobil. Vad tänker han göra med den?” Alla tänker tyst och visar tummen när de har en tanke. Ella säger: ”Han lägger ut den.” Vera säger: ”Han kanske visar Amir först.” Sedan tar läraren bort pappret från en ruta i taget och läser den."
    - "I delen Tankarna frågar läraren: ”Ella, du är Elias. Vad ville du?” Ella svarar: ”Jag ville göra Amir ledsen. Jag gjorde det med flit.” Vera läser en fråga på kortet och ställer den till Ella: ”Vad får dig att tro det?” Ella pekar på ruta 2. Vera pekar på ruta 1: ”De skrattar båda två där.” Läraren säger: ”Ella och Vera, ni ser olika på det. Kan båda stämma?” Ella säger: ”Han tyckte att det var kul, men Amir blev ledsen.” Hon skriver Elias tanke, ”Alla ska skratta!”, på en tankebubbla och lägger den vid Elias i ruta 2. Malik, som är Amir, säger: ”Alla skrattar åt mig.” Han skriver tanken på en tankebubbla och lägger den vid Amir i ruta 3. Sedan byter Ella och Malik person och säger om de tänker likadant."
    - "I delen Ovanifrån berättar Malik hela serien från ruta 1, och Vera säger: ”Det började när Elias la ut bilden.” Läraren berättar det som gruppen inte vet än: Elias vill gärna att de andra ska tycka att han är rolig, och Amir tycker inte om att bli fotad. Sedan frågar läraren: ”Varför blev det så?” Ella säger: ”Elias ville vara rolig, men Amir ville inte bli fotad.” Läraren frågar: ”I vilken ruta hade Elias behövt tänka och göra annorlunda?” Ella pekar på ruta 1."
    - "I delen Nästa gång frågar läraren: ”Hur kan det bli i stället?” Ella ritar en ruta där Elias frågar: ”Får jag lägga ut den?” Malik ritar en ruta där Amir säger: ”Lägg inte ut den, okej?” Ella och Malik spelar upp Ellas ruta med bubblorna på pinne. I den sista delen, Med mig, säger Ella: ”Jag tar med mig att man kan skratta åt olika saker.” Gruppen säger tumregeln med egna ord, och läraren skriver den på gruppens blad."
    - Efteråt skriver läraren i snabbmallen att Ella sa vad som kunde hända innan läraren visade nästa ruta, och att Vera hittade ledtråden i ruta 1 och ställde Ella en fråga från kortet. Läraren skriver också att Ella först sa att Elias gjorde det med flit och sedan att det kunde vara på två sätt. Sist skriver läraren att Ella hittade rutan där Elias hade behövt göra annorlunda, och att Malik utan hjälp sa vad Amir tänkte. I nästa pass tar gruppen Lunchen.
fastnar:
  rubrik: När en elev inte hittar tanken
  text: När en elev inte vet vad en person tänker, eller bara ser sin egen sida av saken, behöver hen ditt stöd. Ge minsta möjliga stöd, så att eleven hittar tanken själv.
  fragaForst:
    - Vad gör hen i rutan?
    - Vad säger hen?
    - Vad tänker hen?
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - Peka på personens ansikte och kropp i rutan, och fråga vad eleven ser.
    - Spegla det eleven sa, och vänta.
    - Ge två tankar att välja mellan, som ”Tänker han ’Jag mår illa’ eller ’Jag vill sitta där’?” Lärarens sida har två tankar för varje person i serien.
    - Säg början på meningen, som ”Han tror att”.
    - Ta fram kortet ”Vad behöver hen?” och låt eleven peka på en bild av det personen behöver.
    - Säg en tanke själv, och fråga ”Kan det vara så?”
  motto: Börja med det som syns. Tanken kommer sedan.
roll:
  rubrik: "Lärarens roll: nyfiken, aldrig domare"
  text: Du leder samtalet och dömer inte. Du visar eleverna att ett bråk går att lära sig av och inte är något att skämmas för. Eleverna vill ofta att du ska säga vem som hade rätt. Säg då att ni ritar för att förstå, och att det ni kommer fram till är vad var och en kan göra en annan gång. Den som leder är en vuxen som eleverna känner och som har tid två gånger i veckan under hela perioden. Det kan vara en speciallärare, specialpedagog, lärare, fritidspedagog, resurspedagog, elevassistent eller kurator. Samma person leder alla pass. Klassläraren sätter en siffra för eleven före och efter perioden, och därför är det bäst om någon annan än klassläraren leder gruppen. Leder en elevassistent, resurspedagog eller fritidspedagog, planerar en speciallärare eller specialpedagog passen med hen, och de ses 20 minuter varannan vecka med snabbmallen som underlag. Om du själv var med i händelsen, väntar du med din version tills elevens står på pappret och ritar den sedan bredvid, eller så leder en annan vuxen just det passet.
  gor:
    - Sitt bredvid den som berättar, så att ni båda tittar på serien.
    - Låt eleven hålla i pennan när hen vill, och rita själv när eleven vill att du ritar.
    - Ställ frågor som börjar med vad och hur.
    - Rita elevens version först. I en egen serie väntar du med att föreslå andra tankar tills hela serien står på pappret, eftersom eleven annars försvarar sig.
    - Var själv lugn. Märker du att du blir irriterad eller vill försvara någon, gör en paus.
    - Spara elevens serier och blad i elevens pärm hos dig.
  undvik:
    - Att fråga ”Varför gjorde du så?” Fråga ”Vad hände?” och ”Vad tänkte du då?” Om serien kan du fråga ”Varför blev det så?”
    - Att döma eller bestämma straff, och att ta parti för den ena mot den andra.
    - Att kräva att eleven ber om ursäkt.
    - Att rita en egen serie medan eleven är upprörd.
    - Att visa en elevs serie för andra utan att eleven säger ja.
urval:
  rubrik: Var hittar du bildserierna och händelserna?
  text:
    - Bildserierna med lärarens sidor, bubblorna, mallarna, korten och bladen står under Material att skriva ut. I pass 7 ritar alla en egen serie om en gång när det nästan blev bråk, men det blev inget. Från pass 8 äger en elev serien i varje pass, i den ordning som du berättade för gruppen i pass 7, och alla får sin första egna serie innan någon får sin andra.
    - Antalet veckor avgör hur många egna serier varje elev får. Två egna serier ger eleven tid att pröva sin första plan och göra en ny. Välj därför sex veckor med en eller två elever, sju med tre och åtta med fyra. Med tre eller fyra elever ger sex veckor en egen serie var. Räcker passen inte till ännu en egen serie för alla, blir resten av passen över. Då ritar ni något som ska hända och som gruppen väljer, och flera i gruppen får vara med i det. Slutar perioden tidigare än du planerade, gör du det sista passet som det står i tabellen Det sista passet.
    - En egen serie kan också handla om något som ska hända och som brukar bli svårt, till exempel rasten efter lunch eller en utflykt. Ingen behöver ha gjort fel.
    - När ni ritar i gruppen skriver ni ”en kompis” eller en bokstav vid andra personer, och ni säger inte deras namn. Blir det bråk mellan passen, tar den vuxna som var där hand om det. Du frågar eleven om hen vill rita det, när det är hens tur eller i ett pass som blir över.
  kravText: "Ni ritar en egen händelse i gruppen när den uppfyller tre krav:"
  krav:
    - rubrik: Händelsen pågår inte
      text: Den är över eller har inte hänt än, och eleven är lugn när hen berättar.
    - rubrik: Eleven vill
      text: Eleven har själv sagt ja till att rita händelsen i gruppen.
    - rubrik: Ingen annan i gruppen är inblandad
      text: Är två i gruppen med, ritar du med var och en för sig, utom när ni ritar något som ska hända.
progression:
  text: Du lämnar över ansvaret till eleverna. Först visar du själv hur man hittar tankarna, sedan hittar gruppen dem tillsammans i bildserierna och börjar ställa frågorna till varandra, och till sist ritar eleverna sina egna händelser.
  enhet: Pass
  rader:
    - vecka: "1"
      rubrik: "Bildserie 1, Fönsterplatsen"
      led: Jag gör
      fokus: Bildserie 1, Fönsterplatsen, med syftet, reglerna och tankebubblan.
      roll: Du säger syftet och reglerna, visar tankebubblan, stannar i berättelsen innan Alva svarar Sam och säger själv vad en av personerna kan tänka.
      eleverna: Att skilja på det någon säger och det någon tänker. Att säga vad som kan hända innan du visar nästa ruta.
    - vecka: 2–6
      rubrik: "Bildserie 2–6"
      led: Vi gör
      fokus: Bildserie 2–⁠6.
      roll: Du läser och stannar, och eleverna säger vad som kan hända och svarar som personerna. Från pass 4 berättar en elev serien utan dina frågor, och eleverna ställer frågorna på kortet Frågor vi ställer till varandra. Du ber om en tanke till.
      eleverna: Att säga vad som kan hända, och ge mer än en förklaring när det är oklart vad någon ville. Att hitta rutan där någon hade behövt göra annorlunda, och komma på ett sätt som fungerar för båda.
    - vecka: 7 till det sista
      rubrik: "Egna händelser"
      led: Ni gör
      fokus: Pass 7 om en gång när det nästan blev bråk, egna händelser och det sista passet.
      roll: Du ritar åt den som vill. Från pass 8 spolar du tillbaka till när det var lugnt och ritar elevens version, eller låter eleven rita. Efter det sista passet visar du provbilden för var och en.
      eleverna: Att berätta i sin egen serie vad man själv gjorde och hur det påverkade den andra. Att säga vad man själv tänkte och ville, och vad den andra kan ha tänkt och velat.
uppfoljning:
  text: Du behöver veta om eleven ser mer i en social situation än förut, och om det märks utanför rummet. Provbilden och protokollet står under Material att skriva ut. Har provbildens poäng och klasslärarens siffra stigit, avslutar du insatsen med påfyllningspasset, och de vuxna runt eleven fortsätter med frågorna och planen. Har poängen stigit men inte klasslärarens siffra, ritar du en eller två egna serier till med eleven ensam före påfyllningspasset, som i tabellen Ett pass med en egen serie. Sedan gör du en ny plan. Säger de vuxna före påfyllningspasset att planen inte går, gör ni en ny plan direkt efter påfyllningspasset. Har poängen inte stigit, tar du upp det med elevhälsan.
  rader:
    - nar: Före pass 1
      tid: "före"
      perElev: 15
      vad: I samtalet före pass 1 visar du provbilden när eleven har sagt att hen vill vara med. Be först eleven berätta vad som har hänt, och ställ sedan de andra frågorna. Varje fråga ger 0–⁠2 poäng. Skriv poängen i provbildens protokoll och elevens ord på protokollets baksida. Be sedan eleven visa med en siffra från 0 till 10 hur bra hen är på att förstå vad andra tänker och vill. Be klassläraren sätta en siffra från 0 till 10 för hur väl eleven förstår vad kamraterna menar och vill.
      resultat: "provbildens poäng 0–⁠8, klasslärarens siffra 0–⁠10, elevens siffra 0–⁠10"
    - nar: I varje pass
      tid: "i passet"
      vad: Skriv i snabbmallen vem som sa vad som kunde hända och vem som hittade rutan där någon hade behövt göra annorlunda. När ni arbetar med en egen serie skriver du vem som sa vad hen själv gjorde och vem som hittade rutan.
    - nar: Efter sista passet
      tid: "efter"
      perElev: 10
      vad: Träffa en elev i taget i cirka tio minuter. Visa provbilden, ställ samma frågor som före och skriv poängen i kolumnen Efter. Be om siffrorna igen, och visa eleven svaren före och efter. En lägre egen siffra efter perioden kan vara ett gott tecken om eleven har börjat se sig själv tydligare.
      resultat: "provbildens poäng 0–⁠8, klasslärarens siffra 0–⁠10, elevens siffra 0–⁠10"
    - nar: Fyra veckor efter sista passet
      tid: "efter 4 veckor"
      vad: Fråga de vuxna runt eleven hur planen går. Håll sedan ett påfyllningspass på 30 minuter där ni läser planerna, med samma delar som i pass 7.
