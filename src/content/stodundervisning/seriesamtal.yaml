lathund:
  innehall: Bildserier och egna serier
  metoden:
    text:
      - Ni ritar en konflikt som en serie, så att eleverna lär sig av den och övar på att tänka innan det svåra kommer.
      - En till fyra elever har två pass i veckan under sex till åtta veckor, först med sex bildserier och sedan med egna händelser. Säger en elev att hen har blivit kränkt, följer du skolans rutin.
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Spola tillbaka och spela framåt.
          text: Börja i ruta 1, när det var lugnt, och gå framåt en ruta i taget till konflikten.
        - fet: Båda personerna får en tankebubbla.
          text: Eleverna svarar som personerna, och du speglar det de säger utan att rätta.
        - fet: Se serien ovanifrån.
          text: Fråga i vilken ruta någon hade behövt tänka och göra annorlunda. Sedan ritar ni hur det kan bli i stället.
    tabell:
      rubrik: Passet i sex delar
      kolumner:
        - Del
        - Frågan
      rader:
        - - |-
            1 · Spaningen
            0–⁠4 min
          - Vad såg du någon säga eller göra, och vad tror du att hen tänkte?
        - - |-
            2 · Spola tillbaka
            4–⁠11 min
          - Vad händer i nästa ruta?
        - - |-
            3 · Tankarna
            11–⁠17 min
          - Vad tänkte, kände och ville personerna?
        - - |-
            4 · Ovanifrån
            17–⁠21 min
          - Varför blev det så, och i vilken ruta hade någon behövt tänka och göra annorlunda?
        - - |-
            5 · Nästa gång
            21–⁠27 min
          - Hur kan det bli i stället?
        - - |-
            6 · Med mig
            27–⁠30 min
          - Vad tar du med dig?
    not: I spanaruppdraget lägger eleven märke till något mellan passen. Lärarens sida för varje bildserie har berättelsen och säger var ni stannar. Ett pass med en egen serie står på sidan 3, och pass 1, pass 7 och det sista passet står i metoden.
  pass:
    rubrik: "Ett pass med bildserien Chatten"
    textRubrik: Gruppen · tre elever i åk 4, pass 5
    text:
      - "Ella är Elias, Malik är Amir, och Vera är detektiv. Läraren säger att det går snett, spolar tillbaka till ruta 1 och stannar: ”Vad tänker Elias göra med bilden?” Ella säger: ”Han lägger ut den.”"
      - "Läraren visar en ruta i taget och frågar sedan: ”Ella, du är Elias. Vad ville du?” Ella svarar: ”Jag ville göra Amir ledsen.” Vera pekar på ruta 1: ”De skrattar båda två där.” Ella skriver Elias tanke på en bubbla: ”Alla ska skratta!” Malik skriver Amirs: ”Alla skrattar åt mig.”"
      - "Läraren frågar: ”I vilken ruta hade Elias behövt tänka och göra annorlunda?” Ella pekar på ruta 1 och ritar en ny där Elias frågar: ”Får jag lägga ut den?”"
      - Har du en elev, tar du själv den andra personen, och ni spelar upp elevens ruta.
    forberett:
      rubrik: Det jag förberedde
      text:
        - Bestämt vem som är Elias, Amir och detektiv.
        - Läst på lärarens sida för Chatten var vi stannar och vad gruppen inte vet än.
    klarTidigt: Låt var och en rita en ny ruta där Amir berättar för Elias hur det kändes.
    schema:
      rubrik: 30 minuter, del för del
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Lägg fram det som står under På bordet på sidan 4, och skriv det nya spanaruppdraget på spanarbladen.
        - tid: 0–4
          fas: 1 · Spaningen
          vad: Var och en håller upp bubblorna på pinne och berättar om sitt spanaruppdrag, utan att säga några namn.
        - tid: 4–11
          fas: 2 · Spola tillbaka
          vad: Säg att det går snett och spola tillbaka till ruta 1. Stanna innan Elias lägger ut bilden, och visa sedan en ruta i taget.
          fraser:
            - Vad händer nu, tror du?
        - tid: 11–17
          fas: 3 · Tankarna
          vad: Var och en är en av personerna eller detektiv. Eleven skriver personens tanke på en lös bubbla. Sedan byter eleverna person.
          fraser:
            - Vad ser du som får dig att säga det?
        - tid: 17–21
          fas: 4 · Ovanifrån
          vad: En elev berättar hela serien. Säg det gruppen inte vet än, och fråga i vilken ruta Elias hade behövt tänka och göra annorlunda.
        - tid: 21–27
          fas: 5 · Nästa gång
          vad: Utgå från den rutan och fråga ”Hur kan det bli i stället?” Var och en ritar, och två elever spelar upp en av teckningarna.
        - tid: 27–30
          fas: 6 · Med mig
          vad: Var och en säger vad hen tar med sig. Skriv tumregeln på gruppens blad och dela ut spanarbladen.
  mall:
    rubrik: Samtalet, pass 1 och en egen serie
    underrad: Ditt kort under passet
    block:
      - typ: tabell
        rubrik: Samtalsteknikerna
        kolumner:
          - Teknik
          - Så låter det
        rader:
          - - Spegla
            - ”Du tänker att han ville vara elak.”
          - - Fråga vad hen ser
            - ”Vad ser du som får dig att säga det?”
          - - Pröva en tanke till
            - ”Kan hen ha tänkt något annat?”
          - - Undra högt
            - ”Jag undrar vad Nora tänker.”
          - - Tänk själv först
            - ”Visa tummen när du har en tanke.”
          - - Skicka frågan vidare
            - ”Vera, vad säger du om det?”
          - - Knyt ihop
            - ”Ni ser olika på det. Kan båda stämma?”
          - - Fråga varandra
            - ”Läs frågan på kortet och ställ den till Ella.”
      - typ: kedja
        rubrik: Pass 1
        steg:
          - Varför vi ses 0–⁠4
          - Gruppens regler 4–⁠6
          - Tankebubblan 6–⁠11
          - Spola tillbaka 11–⁠16
          - Tankarna 16–⁠21
          - Ovanifrån 21–⁠24
          - Nästa gång 24–⁠27
          - Med mig 27–⁠30
        citat: Jag tänker på något. Vad tänker jag på?
      - typ: tabell
        rubrik: Ett pass med en egen serie
        kolumner:
          - Del
          - Så gör du
        rader:
          - - Dagen före
            - Pröva händelsen mot de tre kraven.
          - - 1 · Spaningen
            - Läs reglerna och fråga om uppdragen och förra planen.
          - - 2 · Spola tillbaka
            - Låt ägaren berätta kort. Fråga sedan ”Vad gjorde du precis innan?” och rita utan att rätta.
          - - 3 · Tankarna
            - Rita ägarens tankebubblor. Gruppen undrar vad den andra tänkte, och ägaren väljer.
          - - 4 · Ovanifrån
            - Fråga ”Vad gjorde du som hen märkte? I vilken ruta hade någon behövt tänka och göra annorlunda?”
          - - 5 · Nästa gång
            - De andra föreslår hur det kan bli, ägaren väljer och ni ritar det.
          - - 6 · Med mig
            - Planen blir ägarens spanaruppdrag, och efter passet fyller ni två i bladet Min plan, cirka tio minuter.
      - typ: not
        text: Vänta minst tre sekunder på svaret, och använd tankeorden tror, vet, vill och undrar.
  material:
    rubrik: Vad du behöver för ett pass
    kravEtikett: Krav
    var:
      rubrik: Var materialet finns
      punkter:
        - fet: Bildserierna och lärarens sidor.
          text: De står under Material att skriva ut och i planeringsmallarna (Word). Skriv ut serien på A3 och laminera den.
        - fet: Bubblorna och korten.
          text: Laminera tre ark bubblor och korten. Alla vid bordet får en tanke- och en pratbubbla på pinne.
        - fet: Bladen.
          text: Skriv ut spanarbladet till varje pass, och bladet Nästa gång, mallarna och Min plan när ni behöver dem.
        - fet: Provbilden, protokollet och snabbmallen.
          text: De står i planeringsmallarna. Skriv ut snabbmallen varannan vecka.
    bordet:
      - Dagens bildserie på A3, med rutorna 2–⁠4 täckta
      - Bubblorna och whiteboardpennor i en färg per elev
      - Talpinnen, spanarbladen och bladet Nästa gång
      - Korten, och mallen när ni ritar en egen serie
      - Elevernas pärmar, lärarens sida och snabbmallen
    # Lathundens kortare uppföljning: metodens rader med beslutet efter perioden ryms inte på sidan 4 (2026-10-26).
    uppfoljning:
      - nar: "Före pass 1"
        vad: "Visa provbilden för en elev i taget, och skriv poängen och båda siffrorna i protokollet."
      - nar: "I varje pass"
        vad: "Skriv i snabbmallen vem som sa vad som kunde hända och vem som hittade rutan där någon hade behövt göra annorlunda."
      - nar: "Efter sista passet"
        vad: "Visa provbilden och be om siffrorna igen, cirka tio minuter per elev. Visa eleven svaren före och efter."
      - nar: "Fyra veckor efter sista passet"
        vad: "Fråga de vuxna runt eleven hur planen går. Ett påfyllningspass på 30 minuter som pass 7, där ni läser planerna."
lektionskort:
  - efter: "tabell: Ett pass med en egen serie"
    text: "Lektionskortet är passet med en egen serie på ett A4: målet, delarna med det du gör och säger, stödet när eleven inte hittar tanken och det du gör om något händer. Skriv ut det och ha det framför dig under passet."
film:
  sekunder: 28.67
  beskrivning: "Spola tillbaka till ruta 1, när det var lugnt. Du frågar: ”Vad tänker Elias göra med bilden?” Ella säger: ”Han lägger ut den.” Gå framåt en ruta i taget. Du frågar: ”Vad händer i nästa ruta?” Båda personerna får en tankebubbla. Ella, som är Elias, säger: ”Alla ska skratta!” Malik, som är Amir, säger: ”Alla skrattar åt mig.” Se serien ovanifrån. Du frågar: ”I vilken ruta hade Elias behövt göra annorlunda?” Ella säger: ”I ruta 1. Han kunde ha frågat först.”"
  rubrik: "Så gör gruppen"
  ingress: "Fyra bilder ur filmen om pass 5, där Ella och Malik i åk 4 tar bildserien Chatten. Gruppen börjar i ruta 1, när det var lugnt, och Ella säger vad som kan hända. Sedan går gruppen framåt en ruta i taget, och Elias och Amir får var sin tankebubbla. Sist ser gruppen serien ovanifrån, och Ella säger i vilken ruta Elias hade behövt tänka och göra annorlunda."
  stillbilder:
    - text: "Ella ser ruta 1 och tror att Elias lägger ut bilden."
    - text: "Ella skriver Elias tanke på en lös bubbla."
    - text: "Malik skriver Amirs tanke på en lös bubbla."
    - text: "Ella svarar att Elias i ruta 1 kunde ha frågat först."
filmer:
  - nr: 2
    sekunder: 26.44
    beskrivning: "Spola tillbaka till när det var lugnt. Du frågar: ”Vad gjorde du precis innan?” Malik säger: ”Vi spelade fotboll på rasten. Jag skulle skjuta.” Rätta inte. Rita hela serien först. Malik säger: ”Då tog han bollen med flit! Jag skrek: ’Ge tillbaka!’” Fråga först vad Malik själv tänkte. Du frågar: ”Vad tänkte du i ruta 3?” Malik säger: ”Nu får jag inte skjuta!” Fråga sedan vad den andra tänkte. Du frågar: ”Får vi undra vad kompisen ville i ruta 2?” Malik säger: ”Han ville också vara med.”"
    rubrik: "En egen händelse"
    ingress: "Fyra bilder ur filmen om en egen händelse i pass 8, när Malik är ensam med dig. Du spolar tillbaka till när det var lugnt, och Malik berättar medan du ritar utan att rätta. Först skriver du Maliks egen tanke i hans bubbla. Sedan undrar ni vad kompisen ville i ruta 2, och Malik tror att kompisen också ville vara med."
    efter: "tabell: Ett pass med en egen serie"
    stillbilder:
      - text: "Du spolar tillbaka, och Malik berättar från ruta 1."
      - text: "Malik säger ”med flit”, och du ritar utan att rätta."
      - text: "Först skriver du Maliks egen tanke i hans bubbla."
      - text: "Malik gissar vad kompisen ville, och du skriver det."
