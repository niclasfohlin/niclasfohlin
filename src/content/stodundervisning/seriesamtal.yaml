  punkter:
    - Berätta i ordning vad som hände, och säga vad som kan hända innan det händer
    - Skilja på det någon säger och det någon tänker
    - Säga vad hen själv och den andra tänkte, kände och ville
    - Ge mer än en förklaring när det är oklart vad någon ville
    - Säga vad hen själv gjorde och hur det påverkade den andra
    - Säga när någon hade behövt göra annorlunda, och komma på ett sätt som fungerar för båda
snabbmall:
  text: Bladet gäller fyra pass på två veckor. Före passet skriver du vad eleverna ska få syn på i dag, och efter passet vem som sa vad och vad du gör i nästa pass. De första veckorna kryssar du det som ska med. Efter två veckor läser du bladet, gärna med den som handleder dig.
  pass: 4
  period: två veckor
  overst:
    - Första veckan övar jag på teknikerna ______________ och
    - Andra veckan övar jag på teknikerna ______________ och
  fore: det eleverna ska få syn på i dag
  foreHjalp: "I en bildserie: tumregeln på lärarens sida, med dina ord."
  efter: vem som sa vad som kunde hända, och vem som hittade rutan där någon hade behövt göra annorlunda
  ska:
    - Vi stannade och frågade vad som händer i nästa ruta.
    - Jag varken rättade eleverna eller sa vem som hade rätt.
    - Vi såg serien ovanifrån och ritade ett nytt slut.
  sist:
    - Det här säger eleverna nu som de inte sa förut
    - Det jag tar med mig, och hur det gick med teknikerna
  not: Du övar på två tekniker i veckan, i den ordning de står på lathundens sida 3.
checklista:
  rubrik: Checklista inför pass 1
  punkter:
    - Läst metoden, sett filmerna och gjort ett seriesamtal om något eget med en kollega.
    - Haft samtalet med varje elev före pass 1, gjort elevens pärm med målet på framsidan och berättat om gruppen för vårdnadshavarna.
    - Bokat rummet, två tider i veckan och handledning om jag behöver den.
    - Laminerat Bildserie 1–⁠6, Bubblor att klippa ut och korten Vad behöver hen? och Frågor vi ställer till varandra.
    - Skrivit reglerna överst på gruppens blad, ett stort papper på väggen, och lämnat kortet Till de vuxna runt eleven.
grund:
  text: "I Carol Grays seriesamtal (1994) ritar den vuxna och eleven streckgubbar, pratbubblor och tankebubblor medan de pratar, så att båda ser vad någon säger och vad hen tänker, både efter en händelse och före något som ska hända (Hutchins och Prelock, 2008). Få studier har prövat Grays metod, och 2006 hade ingen av dem prövat om den hjälper barn att förstå andras tankar (Hutchins och Prelock, 2006). Barn med autism lärde sig på några korta pass att använda tankebubblor och att förutsäga vad någon gör utifrån det hen tror (Wellman m.fl., 2002). Samtal i grupp om vad andra tänker har hjälpt barn från sju år att förstå andras tankar bättre (Bianco och Castelli, 2023). Pojkar i åk 3–⁠6 som hade tolv pass på sex veckor tolkade färre handlingar som fientliga och blev mindre arga (Hudley m.fl., 2007). När elever i åk 5 vid ett enda tillfälle tänkte på en egen händelse som om de såg den på avstånd, blev de mindre upprörda (Kross m.fl., 2011). De vuxna runt eleven tar med sig passens frågor ut på rasten, eftersom det eleverna övar under särskilda lektioner annars tycks gälla bara där (Skolverket, 2011)."
  kallor: Bygger på Bianco och Castelli (2023), Gray (1994), Hudley m.fl. (2007), Hutchins och Prelock (2006, 2008), Kross m.fl. (2011), Skolverket (2011) och Wellman m.fl. (2002).
ramar:
  rubrik: Material att skriva ut
  text:
    - Före pass 1 skriver du ut Bildserie 1–⁠6 med lärarens sidor och serierna på A3, Bubblor att klippa ut, kortet ”Vad behöver hen?”, bladet med de två korten Frågor vi ställer till varandra, provbilden och kortet Till de vuxna runt eleven. Till varje pass skriver du ut ett spanarblad till varje elev, och varannan vecka snabbmallen. Till pass 2–⁠6 skriver du också ut bladet Nästa gång till varje elev, och till varje egen serie ett blad. Från pass 7 skriver du ut mallarna med fyra och sex rutor, och från pass 8 bladet Min plan och lektionskortet för passet med en egen serie. Mer än så behöver du inte.
    - Bildserierna, bubblorna, korten på bordet och bladen är elevernas. Laminera serierna och bubblorna, så att eleverna kan skriva och rita på dem med whiteboardpenna och sudda ut det efteråt. Efter passet tar du ett foto av serien innan du suddar. Vill du att eleverna ska ha serien i sin pärm, skriver du ut en papperskopia till var och en. En egen serie ritar ni på papper, så att den finns kvar. Lärarens sidor, provbildens protokoll och kortet Till de vuxna runt eleven är dina. De bildserier ni har gjort och gruppens blad sitter på väggen under perioden, och elevens egna serier ligger i pärmen.
  ramar:
    - rubrik: "Bildserie 1: Fönsterplatsen"
      serie: fonsterplatsen
      text:
        - Ni tar bildserien i pass 1. Skriv ut den på A3, laminera den och täck rutorna 2–⁠4 med papper. I delen Spola tillbaka läser du berättelsen högt och stannar där det står Stanna här. I delen Ovanifrån berättar du det som gruppen inte vet än, innan du frågar ”Varför blev det så? I vilken ruta hade någon behövt tänka och göra annorlunda?”
      delar:
        - rubrik: Berättelsen att läsa högt
          falt:
            - rubrik: Ruta 1
              text: Klassen ska på utflykt med bussen. Alva kliver på först och sätter sig vid fönstret.
            - rubrik: Stanna här
              text: Här har inget hänt än. Vad vill Alva göra på resan? Vem kan komma fram till henne?
            - rubrik: Ruta 2
              text: "Sam kommer fram till Alva och håller sig om magen. Han frågar: ”Får jag sitta vid fönstret?”"
            - rubrik: Stanna här
              text: Vad vill Sam? Var har han händerna? Vad svarar Alva, tror du?
            - rubrik: Ruta 3
              text: "Alva svarar: ”Nej, jag var först.” Hon tittar ut."
            - rubrik: Ruta 4
              text: Sam sätter sig på platsen vid gången. Bussen åker iväg.
        - rubrik: Till läraren
          falt:
            - rubrik: Behoven
              text: Alva vill titta ut, och hon var först. Sam vill inte må illa på resan.
            - rubrik: Ledtråden
              text: Sam håller sig om magen. Låt gruppen fundera på vad det betyder, och säg det inte själv. Kommer ingen på något, säger du ”Jag undrar varför Sam håller sig om magen.”
            - rubrik: Två vägar framåt
              text: Antingen säger Alva ”Nej, jag var först”, eller så frågar hon ”Mår du illa?”
            - rubrik: Två tankar att välja mellan
              text: Sam i ruta 2 kan tänka ”Jag mår illa” eller ”Jag vill sitta där.” Alva i ruta 3 kan tänka ”Jag vill titta ut” eller ”Sam vill bara ta min plats.”
            - rubrik: Det ni inte vet än
              text: Sam mår illa när han åker buss, men inte när han kan titta ut genom fönstret. Det vet inte Alva.
            - rubrik: Tumregeln
              text: Man ser inte alltid vad någon behöver. Säg varför, eller fråga varför.
            - rubrik: Spanaruppdraget
              text: Lägg märke till när någon behöver något. Hur märkte du det?
    - rubrik: "Bildserie 2: Spelet"
      serie: spelet
      text:
        - Ni tar bildserien i pass 2.
      delar:
        - rubrik: Berättelsen att läsa högt
          falt:
            - rubrik: Ruta 1
              text: Mira och Alva spelar fyra i rad på fritids.
            - rubrik: Stanna här
              text: Här har inget hänt än. Vad vill Mira och Alva? Hur många kan spela fyra i rad samtidigt?
            - rubrik: Ruta 2
              text: "Leo kommer fram och frågar: ”Får jag vara med?”"
            - rubrik: Stanna här
              text: Vad vill Leo? Vad vill Mira? Vad svarar hon, tror du?
            - rubrik: Ruta 3
              text: "Mira pekar på spelet och säger: ”Nej.”"
            - rubrik: Ruta 4
              text: Leo sätter sig vid ett annat bord. Mira tittar efter honom.
        - rubrik: Till läraren
          falt:
            - rubrik: Behoven
              text: Mira vill spela klart med Alva. Leo vill vara med.
            - rubrik: Ledtråden
              text: Fyra i rad är ett spel för två, och Mira pekar på spelet när hon säger nej.
            - rubrik: Två vägar framåt
              text: Antingen säger Mira ”Nej”, eller så säger hon ”Det är vår sista match. Sen får du spela.”
            - rubrik: Två tankar att välja mellan
              text: Mira i ruta 3 kan tänka ”Spelet är bara för två” eller ”Jag vill inte att Leo är med.” Leo i ruta 4 kan tänka ”De vill inte ha mig” eller ”Jag får spela sen.”
            - rubrik: Det ni inte vet än
              text: Mira och Alva hade bestämt att spela tre matcher, och det här är den sista.
            - rubrik: Tumregeln
              text: Ett nej kan ha ett skäl. Säg skälet.
            - rubrik: Spanaruppdraget
              text: Lägg märke till när någon säger nej. Vad kan skälet vara?
    - rubrik: "Bildserie 3: Teckningen"
      serie: teckningen
      text:
        - Ni tar bildserien i pass 3. Avsluta gärna delen Spaningen med en övning som visar vad serien handlar om. Lägg en penna på bordet. En elev blundar, och du flyttar pennan. Fråga de andra var den som blundade tror att pennan ligger. I delen Ovanifrån frågar du också vad Alva kunde ha gjort innan hon gick ut.
      delar:
        - rubrik: Berättelsen att läsa högt
          falt:
            - rubrik: Ruta 1
              text: Alva ritar en teckning. På bordet ligger pappersbitar.
            - rubrik: Stanna här
              text: Här har inget hänt än. Vad tänker Alva om sin teckning?
            - rubrik: Ruta 2
              text: "Alva har lagt teckningen med baksidan upp och går ut. En vuxen säger: ”Sam, kan du slänga skräpet?”"
            - rubrik: Stanna här
              text: Vad ser Sam på bordet? Vet han att det vita pappret är en teckning? Vad gör han nu, tror du?
            - rubrik: Ruta 3
              text: Sam slänger bitarna och det vita pappret.
            - rubrik: Ruta 4
              text: Alva kommer in och hittar teckningen i papperskorgen. Sam står bredvid.
        - rubrik: Till läraren
          falt:
            - rubrik: Behoven
              text: Alva vill att andra ska vara rädda om det hon har gjort. Sam vill hjälpa till och göra som den vuxna sa.
            - rubrik: Ledtråden
              text: Teckningen ligger med baksidan upp, så Sam ser bara ett vitt papper.
            - rubrik: Två vägar framåt
              text: Antingen slänger Sam allt, eller så frågar han ”Är det här skräp?”
            - rubrik: Två tankar att välja mellan
              text: Sam i ruta 3 kan tänka ”Det här är skräp” eller ”Jag slänger Alvas teckning.” Alva i ruta 4 kan tänka ”Sam slängde den med flit” eller ”Någon har slängt den.”
            - rubrik: Det ni inte vet än
              text: Alva ritade teckningen till sin mormor.
            - rubrik: Tumregeln
              text: Den som inte såg kan inte veta.
            - rubrik: Spanaruppdraget
              text: Lägg märke till en gång när någon inte visste något som du visste.
    - rubrik: "Bildserie 4: Vinsten"
      serie: vinsten
      text:
        - Ni tar bildserien i pass 4.
      delar:
        - rubrik: Berättelsen att läsa högt
          falt:
            - rubrik: Ruta 1
              text: Saga och Noah spelar pingis på rasten.
            - rubrik: Stanna här
              text: Här har inget hänt än. Vad vill Saga? Vad vill Noah? Vad händer när en av dem förlorar?
            - rubrik: Ruta 2
              text: "Saga vinner. Hon sträcker upp armarna och ropar: ”Jaa! Jag vann!”"
            - rubrik: Stanna här
              text: Titta på Noah. Snart kommer en kompis fram till Saga. Vad gör Saga nu, tror du? Vad märker Noah då?
            - rubrik: Ruta 3
              text: "Saga ropar igen till kompisen: ”Jag vann, jag vann!” Noah går därifrån."
            - rubrik: Ruta 4
              text: Noah sitter på en bänk. Saga står kvar vid pingisbordet.
        - rubrik: Till läraren
          falt:
            - rubrik: Behoven
              text: Saga vill få vara glad över att hon vann. Noah vill inte känna sig som en förlorare när andra ser på.
            - rubrik: Ledtråden
              text: Noah sänker racketen i ruta 2 och går därifrån i ruta 3, medan Saga jublar.
            - rubrik: Två vägar framåt
              text: Antingen ropar Saga igen, eller så säger hon ”Bra match! En till?”
            - rubrik: Två tankar att välja mellan
              text: Saga i ruta 3 kan tänka ”Vad roligt att jag vann!” eller ”Nu ska alla veta att Noah förlorade.” Noah i ruta 4 kan tänka ”Jag är dålig på pingis” eller ”Saga bryr sig inte om mig.”
            - rubrik: Det ni inte vet än
              text: Det var första gången Saga vann över Noah. Noah tycker att det är jobbigt att förlora när andra ser på.
            - rubrik: Tumregeln
              text: Den som vinner kan vara glad och samtidigt tänka på den som förlorar.
            - rubrik: Spanaruppdraget
              text: Lägg märke till en gång när det nästan blev bråk, men det blev inget. Vad gjorde någon precis innan, så att det inte blev bråk?
    - rubrik: "Bildserie 5: Chatten"
      serie: chatten
      text:
        - Ni tar bildserien i pass 5. Elias lägger ut bilden redan i ruta 2, så ni stannar bara en gång, efter ruta 1. Händer något liknande i klassen, följer du skolans rutin.
      delar:
        - rubrik: Berättelsen att läsa högt
          falt:
            - rubrik: Ruta 1
              text: "Amir snubblar över en väska i korridoren och gör en rolig min. Elias skrattar, tar en bild och säger: ”Kolla!”"
            - rubrik: Stanna här
              text: Bilden finns bara i Elias mobil. Vad tänker han göra med den? Vad tror Amir att Elias ska göra med bilden?
            - rubrik: Ruta 2
              text: Elias lägger ut bilden i klassens chatt. Många svarar med skrattande emojier.
            - rubrik: Ruta 3
              text: På kvällen sitter Amir ensam hemma med mobilen.
            - rubrik: Ruta 4
              text: Nästa morgon möts Amir och Elias i korridoren.
        - rubrik: Till läraren
          falt:
            - rubrik: Behoven
              text: Elias vill vara rolig och höra till. Amir vill inte bli utskrattad, och han vill själv bestämma över bilder på sig själv.
            - rubrik: Ledtråden
              text: I ruta 1 skrattar båda. I ruta 3 är Amir ensam med mobilen.
            - rubrik: Två vägar framåt
              text: Antingen lägger Elias ut bilden, eller så visar han bilden för Amir och frågar ”Får jag lägga ut den?”
            - rubrik: Två tankar att välja mellan
              text: Elias i ruta 2 kan tänka ”Amir skrattade ju också” eller ”Nu ska alla skratta åt Amir.” Amir i ruta 3 kan tänka ”Alla skrattar åt mig” eller ”Det var ganska roligt.”
            - rubrik: Det ni inte vet än
              text: Elias vill gärna att de andra tycker att han är rolig. Amir tycker inte om att bli fotad.
            - rubrik: Tumregeln
              text: Ett skämt som är roligt för en kan såra en annan. Fråga innan du lägger ut en bild på någon.
            - rubrik: Spanaruppdraget
              text: Lägg märke till när någon skrattar. Skrattar alla åt samma sak?
    - rubrik: "Bildserie 6: Lunchen"
      serie: lunchen
      text:
        - Ni tar bildserien i pass 6.
      delar:
        - rubrik: Berättelsen att läsa högt
          falt:
            - rubrik: Ruta 1
              text: "Ida är ny i klassen. Vid skåpen säger Nora: ”Vi äter lunch ihop!”"
            - rubrik: Stanna här
              text: Här har inget hänt än. Vad vill Ida? Vad tänker hon när Nora säger det?
            - rubrik: Ruta 2
              text: "I matsalen ropar Noras fotbollslag: ”Nora, kom hit!”"
            - rubrik: Stanna här
              text: Laget ropar. Vad vill Nora nu? Var är Ida, och vad tänker hon? Vad gör Nora, tror du?
            - rubrik: Ruta 3
              text: Nora står med brickan. Ida sitter ensam, och laget sitter vid ett annat bord.
            - rubrik: Ruta 4
              text: Ida tittar upp mot Nora.
        - rubrik: Till läraren
          falt:
            - rubrik: Behoven
              text: Nora vill vara med laget och hålla sitt ord. Ida vill inte sitta ensam.
            - rubrik: Ledtråden
              text: Nora står med brickan mellan två bord, och Ida sitter ensam.
            - rubrik: Två vägar framåt
              text: Antingen går Nora till laget, eller så säger hon ”Kom, Ida, vi sätter oss med laget.”
            - rubrik: Två tankar att välja mellan
              text: Nora i ruta 3 kan tänka ”Jag sa ju att vi skulle äta ihop” eller ”Jag vill sitta med laget”, och kanske tänker hon båda. Ida i ruta 4 kan tänka ”Nora glömde mig” eller ”Nora vill hellre vara med laget.”
            - rubrik: Det ni inte vet än
              text: Laget har match efter skolan och ska prata om den.
            - rubrik: Tumregeln
              text: Man kan vilja två saker samtidigt.
            - rubrik: Spanaruppdraget
              text: Tänk före lunchen eller rasten på vad någon vill göra där. Se sedan efter om det du tänkte stämde.
    - rubrik: Bubblor att klippa ut
      ark: bubblor
      text:
        - Ett ark räcker till två av er vid bordet, dig inräknad. Till en grupp med fyra elever blir det tre ark. Skriv ut arken på tjockt papper, laminera dem och klipp sedan ut bubblorna. Eleverna skriver i bubblorna med whiteboardpenna och lägger dem vid personerna i serien.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så använder du arket
              text: Arket har tankebubblor, pratbubblor och en bubbla för det någon ropar eller skriker. Varje elev och du själv får en tankebubbla och en pratbubbla, som du tejpar på var sin pinne. Ni använder bubblorna på pinne i delen Spaningen, i pass 1 och när två elever spelar upp en teckning i delen Nästa gång. När eleverna byter person i delen Tankarna, tar var och en den andra personens bubbla.
    - rubrik: Vad behöver hen?
      text:
        - I delen Tankarna använder ni kortet när gruppen ska säga vad en person vill eller behöver.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så använder du kortet
              text: Eleven pekar på en bild, och ni säger tillsammans en mening om personen, till exempel ”Leo vill vara med.” Två personer i en serie kan behöva samma sak, och en person kan behöva två saker.
            - rubrik: Kortet
              text: Skriv ut kortet på A4 och laminera det. Det ligger bredvid bildserien hela passet.
    - rubrik: Frågor vi ställer till varandra
      text:
        - Kortet är elevernas, och det ligger på bordet från pass 4.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så använder du kortet
              text: En elev läser en fråga, till exempel ”Vad får dig att tro det?”, och ställer den till en kamrat. Lägg ett kort på varje sida av bordet. I F–⁠2 läser du frågan, och eleven ställer den.
            - rubrik: Korten
              text: Bladet har två likadana kort. Skriv ut det, klipp isär korten och laminera dem.
    - rubrik: Spanarbladet
      text:
        - Skriv det nya spanaruppdraget på bladet före passet, och ge eleven bladet sist i passet. Eleven har det i bänken eller hos sin assistent och tar med det till nästa pass. Ägarens uppdrag skriver du efter passet, när ni fyller i bladet Min plan.
      huvud:
        - rubrik: Namn
      delar:
        - rubrik: Till nästa pass
          falt:
            - rubrik: Mitt uppdrag
              text: ""
            - rubrik: Det här såg jag någon säga eller göra
              text: ""
            - rubrik: Det här tror jag att hen tänkte
              text: ""
    - rubrik: Min plan
      text:
        - Direkt efter ett pass med en egen serie fyller du i bladet tillsammans med den som äger serien, och eleven skriver eller ritar så mycket hen kan. Rita ett hjärta i elevens serie, i ruta 1 och i rutan där det gick snett. I varje hjärta skriver eleven hur stark känslan var, från 0 till 10. Fråga ”När började siffran stiga? Vad märkte du då?” och skriv svaret under Så märker jag att det börjar. I början av nästa pass skriver eleven ”bra”, ”så där” eller ”inte än” under Så gick det och säger varför.
      huvud:
        - rubrik: Namn
      delar:
        - rubrik: När det händer igen
          falt:
            - rubrik: När
              text: ""
            - rubrik: Så märker jag att det börjar
              text: ""
            - rubrik: Då kan jag
              text: ""
            - rubrik: Hur blir det för den andra då?
              text: ""
            - rubrik: Vem hjälper mig, och vad kan de vuxna göra?
              text: ""
            - rubrik: Så gick det
              text: ""
    - rubrik: Provbilden
      serie: mjolken
      text:
        - Visa bilden för en elev i taget, före pass 1 och efter det sista passet. Be först eleven berätta vad som har hänt, och ställ sedan de andra frågorna. Skriv poängen i protokollet och elevens ord på protokollets baksida, med frågans nummer.
      huvud:
        - rubrik: Elevens namn
      listor:
        - rubrik: Provbildens frågor
          larare: true
          kolumner:
            - Fråga
            - Före
            - Efter
          rader:
            - - |-
                1. Berätta vad som har hänt.
                Eleven får två poäng när hen berättar både att Wilma gick fort förbi och att glaset välte över Isaks papper.
              - ""
              - ""
            - - |-
                2. Vad tänker Isak? Vad tänker Wilma?
                Eleven får två poäng när hen säger vad både Isak och Wilma tänker, vill eller vet.
              - ""
              - ""
            - - |-
                3. Gjorde Wilma det med flit? Kan det ha gått till på något annat sätt?
                Eleven får två poäng när hen ger mer än en förklaring, eller säger att hen inte vet och förklarar varför.
              - ""
              - ""
            - - |-
                4. Vad kan de göra nu, så att det blir bra för båda?
                Eleven får två poäng för ett förslag som tar hänsyn till båda.
              - ""
              - ""
        - rubrik: Elevens egen siffra
          larare: true
          kolumner:
            - Fråga
            - Före
            - Efter
          rader:
            - - Hur bra är du på att förstå vad andra tänker och vill? Visa en siffra från 0 till 10.
              - ""
              - ""
        - rubrik: Klasslärarens siffra
          larare: true
          kolumner:
            - Fråga
            - Före
            - Efter
          rader:
            - - Hur väl förstår eleven vad kamraterna menar och vill? Sätt en siffra från 0 till 10.
              - ""
              - ""
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Poängen
              text: Ett svar som stämmer med bilden men bara ger en del av det som ger två poäng, till exempel bara den ena personen eller en enda förklaring, ger en poäng. Inget svar, eller ett svar som inte stämmer med bilden, ger noll poäng. Skriv också upp om eleven sa vad någon tänkte eller ville i fråga 1 utan att du frågade.
            - rubrik: Efter perioden
              text: Visa eleven svaren före och efter, och säg vad som har ändrats, till exempel ”Då sa du att hon gjorde det med flit. Nu säger du att hon kanske inte såg glaset.” En lägre egen siffra efter perioden kan vara ett gott tecken om eleven har börjat se sig själv tydligare.
    - rubrik: Till de vuxna runt eleven
      text:
        - Lämna kortet till klassläraren, personalen på fritids och elevens assistent före pass 1. Kortet kan också gå hem om eleven och vårdnadshavarna vill. Elevens händelser står inte på kortet.
      huvud:
        - rubrik: Elevens namn
      delar:
        - rubrik: Om eleven och gruppen
          falt:
            - rubrik: Det här gör eleven i gruppen
              text: Vi ritar konflikter som serier, med pratbubblor för det någon säger och tankebubblor för det hen tänker. Vi spolar tillbaka till när det var lugnt och går framåt en ruta i taget, så att eleven övar på att tänka innan det svåra kommer. Konflikter hör till livet, och i gruppen lär sig eleven av dem.
            - rubrik: Orden vi använder
              text: Vi skiljer på säga, tänka och känna, och vi frågar ”Ville hen såra, eller ville hen något annat?” och ”Vad behöver hen?”
            - rubrik: Före en situation som brukar bli svår
              text: Fråga ”Vad vill du? Vad tror du att de andra vill? Vad kan hända?” Har eleven en plan, påminn hen om den.
            - rubrik: När något har hänt och eleven är lugn
              text: Fråga ”Vad hände? Vad tänkte du? Vad tror du att den andra tänkte? När hade någon kunnat göra annorlunda?” Rita gärna två rutor på en lapp, med en pratbubbla och en tankebubbla.
            - rubrik: Spanarbladet
              text: Mellan passen har eleven ett spanaruppdrag, något att lägga märke till. Hjälp eleven att skriva eller rita det hen såg.
            - rubrik: Så hjälper du
              text: Säg det till eleven när något går bra. Berätta för den som leder gruppen när något går bra eller blir svårt.
            - rubrik: Elevens plan
              text: Från pass 8 gör eleven en plan, och du får se den om eleven säger ja.
            - rubrik: Den som leder gruppen
              text: ""
mallar:
  - rubrik: "Nästa gång"
    typ: serie
    rutor: 2
    etiketter: ["Så kan det bli", "Så slutar det"]
    underrad: "Rita hur det kan bli i stället och hur det slutar."
