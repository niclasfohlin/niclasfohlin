film:
  sekunder: 29.8
  beskrivning: "Ebba berättar problemet med egna ord. Läraren frågar: ”Kan du berätta problemet med egna ord?” Ebba säger: ”Två sorters stakar, 187 ljus. Hur många av varje?” Läraren skriver det som gruppen säger. Ingen räknar än. Eleverna väljer sätt. Läraren frågar: ”Hur kan vi visa problemet?” Ali säger: ”Vi provar i en tabell!” Paret prövar i tabellen. Paret prövar sig fram: 187 ljus."
  rubrik: Förstå innan ni räknar
  ingress: Fyra bilder ur filmen om hur gruppen förstår och visar problemet innan någon räknar. Läraren frågar, en elev återberättar, läraren skriver det som gruppen säger, Ali vill pröva i en tabell, och paret prövar sig fram tills det stämmer. Filmen på metodens sida visar samma sak i rörelse.
  stillbilder:
    - text: Läraren frågar, och Ebba berättar med egna ord.
    - text: Gruppen ringar in frågan och säger vad den vet.
    - text: "Ingen räknar än: Ali vill pröva i en tabell."
    - text: "Paret prövar sig fram: 8 femarmade och 21 sjuarmade."
filmer:
  - nr: 2
    titel: Två lösningar
    sekunder: 28.81
    beskrivning: "Lösning B är täckt. Gruppen säger först vad lösning A gör. Läraren frågar: ”Vad gör eleven i lösning A?” Ebba säger: ”Byter tio i taget, sen en.” Gruppen ser bytena: tio byten ger 20 ljus, och ett byte ger 2. Sedan visar läraren lösning B. Läraren frågar: ”Var syns två ljus till i båda?” Varje byte ger 2 ljus till, i A och i B. Ebba säger: ”I båda: två ljus till!”"
    rubrik: "Två lösningar: samma tanke på två sätt"
    ingress: "Fyra bilder ur filmen om bladet Två lösningar i Jämföra. Lösning B är täckt tills gruppen har sagt vad lösning A gör, och sedan ser gruppen samma tanke i båda: varje byte ger två ljus till. Filmen på metodens sida visar samma sak i rörelse."
    stillbilder:
      - text: Gruppen säger vad lösning A gör medan B är täckt.
      - text: Gruppen ser att tio byten ger 20 ljus och ett byte 2.
      - text: Läraren frågar var två ljus till syns i båda.
      - text: "Gruppen ser samma tanke i båda: 42 / 2 = 21 sjuarmade."
    efter: steg 4
  - nr: 3
    titel: När paret kör fast
    sekunder: 28.48
    beskrivning: "Paret har prövat två antal och kör fast. Ali säger: ”Det går inte. Vi har testat.” Läraren frågar: ”Vad har ni gjort hittills?” Ebba säger: ”10 sjuarmade gav 165. 19 gav 183.” Läraren frågar: ”Varför gjorde ni så?” Ali säger: ”För att komma närmare 187.” Läraren tar upp det som paret sa. Läraren säger: ”Ni sa att 10 gav 165 och 19 gav 183. Försök använda det!” Ebba säger: ”9 byten gav 18 ljus. Ett byte ger 2!” Paret prövar vidare: 187 ljus."
    rubrik: "När paret kör fast: fråga först"
    ingress: Fyra bilder ur filmen om stödtrappan. Läraren frågar vad paret har gjort och varför, tar upp något som paret sa och går, och paret kommer vidare själv. Filmen på metodens sida visar samma sak i rörelse.
    stillbilder:
      - text: Paret har prövat 10 och 19 sjuarmade och kör fast.
      - text: Läraren frågar vad paret har gjort och varför.
      - text: "Läraren tar upp det paret sa: ”Försök använda det!”"
      - text: Läraren har gått, och paret ser vad ett byte ger.
    efter: "tabell: Var paret kör fast, och det du säger"
