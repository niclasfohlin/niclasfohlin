            - - I tre påsar finns röda och blå kulor. Påse A har 80 röda och 20 blå. Påse B har 30 röda och 10 blå. Påse C har 45 röda och 5 blå. Du tar en kula ur en påse utan att titta.
        - rubrik: Frågorna
          rader:
            - - Vilken påse ger störst chans att få en blå kula, och varför?
    - rubrik: "Två lösningar: Medel, problem 3, Kulpåsarna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Kulpåsarna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "Hur stor del av kulorna är blå? Påse A: 20 av 100, alltså 20 %. Påse B: 10 av 40, alltså 1/4 eller 25 %. Påse C: 5 av 50, alltså 10 %. Påse B har störst andel blå. För påse B räknade eleven 30 + 10 = 40 och 10 / 40 = 1/4 = 25/100."
              - "Röda på varje blå. Påse A: 80 / 20 = 4, alltså 4 röda på varje blå. Påse B: 30 / 10 = 3 röda på varje blå. Påse C: 45 / 5 = 9 röda på varje blå. Färre röda på varje blå ger större chans. Påse B är bäst."
        - rubrik: Frågorna
          rader:
            - - Vad räknar eleven ut för varje påse i lösning A?
            - - Varför delar eleven i lösning B de röda med de blå?
            - - Var syns det i båda lösningarna att påse B är bäst, fast påse A har fler blå?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja om talen inte gick att dela jämnt, och varför?
    - rubrik: "Lärarens sida: Medel, problem 4, Bollbytet"
      text:
        - "Problemet har flera svar, och båda bytena ska gå jämnt ut. Omar kan få 0, 10, 20, 30 eller 40 tennisbollar, med 91, 70, 49, 28 eller 7 pingisbollar. Eleverna arbetar systematiskt med multiplikation och division, så att inget svar saknas. Material: klossar eller kuber, 26 per par. Idén kommer ur Hagland, Hedrén och Taflin (2005)."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talen 26, 3, 5, 2 och 7, och orden byta och alla.
            - rubrik: Lyft ut
              text: |-
                Vi vet: 3 golfbollar ger 5 tennisbollar, 2 golfbollar ger 7 pingisbollar, Omar byter alla 26.
                Vi ska ta reda på: hur många av varje, och alla sätt.
            - rubrik: Ord och tal
              text: "Peka på bilden vid ordet byta. Fråga: Vad räknar 3, och vad räknar 5? Får Omar ta bara pingisbollar?"
            - rubrik: Förutse
              text: En tabell, bollar som ritas, eller alla till pingis först. Några hittar ett svar och slutar.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Välj hur många golfbollar Omar byter mot tennisbollar. Hur många blir kvar till pingis?
                Efter några försök: Berätta vad ni har gjort! Ni sa att det inte går med 23 kvar. Försök använda det!
            - rubrik: Säg inte
              text: Golfbollarna till tennis ökar med 6 åt gången. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: 10 golfbollar (0 tennis och 35 pingis, eller 10 och 14).
                Större: Kan Omar få lika många tennisbollar som pingisbollar? (Nej, inget av de fem sätten) Vad kan han få för 50 golfbollar? (9 sätt, från 0 och 175 till 80 och 7)
            - rubrik: Jämför
              text: Två treor är sex, och det som blir kvar ska gå att dela med 2. I A syns det i varannan rad, och i B när eleven flyttar 6 golfbollar.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att det går att byta 9 golfbollar mot tennisbollar. Hur kan ni kontrollera det mot problemet?
                ”Är det alla sätt?” Hur kan ni kontrollera att inget saknas?
    - rubrik: "Medel, problem 4: Bollbytet"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Bollbytet
          rader:
            - - Omar har 26 golfbollar och vill byta bort alla. Han kan byta 3 golfbollar mot 5 tennisbollar, och 2 golfbollar mot 7 pingisbollar.
        - rubrik: Frågorna
          rader:
            - - Hur många tennisbollar och pingisbollar kan Omar få?
