    - rubrik: "Två lösningar: Medel, problem 4, Bollbytet"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Bollbytet
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "En tabell med golfbollarna till tennis: 0, 3, 6 och så vidare. Det som blir kvar ska gå att dela med 2, och det går i varannan rad. Raden med 6: 6 / 3 = 2 och 2 · 5 = 10 tennis, 20 / 2 = 10 och 10 · 7 = 70 pingis. Fem sätt."
              - "Alla till pingis först: 26 / 2 = 13 och 13 · 7 = 91. Sedan går 6 golfbollar i taget till tennis, så att tre tvåor blir två treor. Det ger 21 pingis färre och 10 tennis fler. Pingis: 91, 70, 49, 28 och 7. Tennis: 0, 10, 20, 30 och 40."
        - rubrik: Frågorna
          rader:
            - - Hur väljer eleven raderna i lösning A, och varför går bara varannan rad?
            - - Varför flyttar eleven i lösning B 6 golfbollar i taget från pingis till tennis?
            - - Var syns det i båda lösningarna att golfbollarna till tennis ökar med 6 åt gången?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med 100 golfbollar, och varför?
    - rubrik: "Lärarens sida: Medel, problem 5, Tangrammet"
      text:
        - "Area som delar av en helhet. De stora trianglarna är 100 cm² var, den mellanstora, kvadraten och parallellogrammet 50 cm² och de små 25 cm². Eleverna lägger bitarna på varandra och ser att olika former kan ha samma area. Material: ett tangram per par, eller en kopia av bilden och en sax. Idén kommer ur Hagland, Hedrén och Taflin (2005)."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talet 400, och orden area, cm², kvadrat och parallellogram.
            - rubrik: Lyft ut
              text: |-
                Vi vet: sju bitar, och hela kvadraten har arean 400 cm².
                Vi ska ta reda på: arean av varje bit, och vilka som är lika stora.
            - rubrik: Ord och tal
              text: "Visa bilden och peka på bitarna. Fråga: Vad betyder area? Vad räknar 400, hela kvadraten eller en bit?"
            - rubrik: Förutse
              text: Bitar som läggs på varandra, rutor som ritas, eller halvor och fjärdedelar. Några räknar 400 / 7, som om alla bitar vore lika stora.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Klipp ut bitarna ur en kopia och lägg dem på varandra.
                Efter några försök: Berätta vad ni har gjort! Ni sa att två små täcker kvadraten. Försök använda det!
            - rubrik: Säg inte
              text: Dela hela kvadraten i 16 små trianglar. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Hela kvadraten är 16 cm² (små 1, stora 4 och de andra 2 cm²).
                Större: Lägg en figur med arean 300 cm². (Som alla utom en stor triangel) Ett annat tangram har ett parallellogram på 125 cm². Hur stort är hela? (1 000 cm²)
            - rubrik: Jämför
              text: Kvadraten, parallellogrammet och den mellanstora triangeln är två små trianglar var. Lyft fram att olika former kan ha samma area, som A visar och B räknar.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att kvadraten är större än parallellogrammet. Hur kan ni kontrollera det med bitarna?
                ”Blir summan 400?” Hur kan ni kontrollera att alla sju bitar är med?
    - rubrik: "Medel, problem 5: Tangrammet"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Tangrammet
          rader:
            - - "Ett tangram är ett pussel med sju bitar: fem trianglar, en kvadrat och ett parallellogram. Tillsammans bildar bitarna en stor kvadrat. Den stora kvadraten har arean 400 cm²."
        - rubrik: Frågorna
          rader:
            - - Hur stor area har varje bit?
            - - Vilka bitar har lika stor area?
    - rubrik: "Två lösningar: Medel, problem 5, Tangrammet"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Tangrammet
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "Bitarna på varandra. De två stora trianglarna är halva den stora kvadraten, så en stor är 400 / 4 = 100 cm². Den mellanstora täcker halva den stora: 100 / 2 = 50. De två små täcker den mellanstora: 50 / 2 = 25. De täcker också kvadraten och parallellogrammet: 2 · 25 = 50."
              - "Dela den stora kvadraten i 16 små trianglar och räkna dem i varje bit: 4 + 4 + 2 + 2 + 2 + 1 + 1 = 16. En liten är 400 / 16 = 25 cm². En stor är 4 · 25 = 100. Den mellanstora, kvadraten och parallellogrammet är 2 · 25 = 50."
        - rubrik: Frågorna
          rader:
            - - Vilka bitar lägger eleven på varandra i lösning A?
            - - Varför delar eleven i lösning B 400 med 16?
            - - Var syns det i båda lösningarna att kvadraten och parallellogrammet har samma area?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja om hela tangrammet var 1 000 cm², och varför?
    - rubrik: "Lärarens sida: Medel, problem 6, Skolan"
      text:
        - Problemet handlar om bråk, procent och delbarhet. Skolan kan ha 315, 330, 345, 360, 375 eller 390 elever, alltså ett antal som går att dela med 15. Eleverna prövar antal, ser att 20 % är 1/5 och letar efter alla svar. Idén kommer ur Hagland, Hedrén och Taflin (2005).
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talen 300, 400, 1/3 och 20 %, och orden exakt, ”fler än” och ”färre än”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: fler än 300 och färre än 400 elever, 1/3 går i årskurs 7, 20 % åker buss.
                Vi ska ta reda på: alla möjliga antal, och en regel.
            - rubrik: Ord och tal
              text: "Visa tallinjen. Fråga: Vad betyder exakt, och fler än 300? Kan en elev delas? Vad är 20 % som bråk?"
            - rubrik: Förutse
              text: Antal som prövas i en tabell, 10 % två gånger, eller delbart med 3 och 5. Några slutar vid första svaret.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Välj ett antal och räkna ut 1/3 och 20 % av det.
                Efter några försök: Berätta vad ni har gjort! Ni sa att 330 och 345 går. Försök använda det!
            - rubrik: Säg inte
              text: Antalet ska gå att dela med 15. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Fler än 20 och färre än 70 elever (30, 45 eller 60).
                Större: Vilka antal är möjliga om 1/4 går i årskurs 7 och 1/6 åker buss? (De som går att dela med 12: 312, 324 och så vidare till 396)
            - rubrik: Jämför
              text: 1/3 och 20 % går jämnt ut när antalet går att dela med 3 och med 5. I A syns det som 15 mellan svaren, och i B som 15-hopp.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att 350 går. Hur kan ni kontrollera det mot problemet?
                Ni har ett svar. Hur kan ni kontrollera om det finns fler?
    - rubrik: "Medel, problem 6: Skolan"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Skolan
          rader:
            - - På en skola går fler än 300 och färre än 400 elever. Exakt 1/3 av eleverna går i årskurs 7. Exakt 20 % av eleverna åker buss till skolan.
        - rubrik: Frågorna
          rader:
            - - Hur många elever kan det gå på skolan? Ge ett exempel.
            - - Hitta alla möjliga antal, och en regel för dem.
    - rubrik: "Två lösningar: Medel, problem 6, Skolan"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Skolan
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "Pröva i en tabell. 330 går: 1/3 är 110 och 20 % är 66. 340 går inte: 340 / 3 = 113 rest 1. 345 och 360 går. 20 % av 345: 10 % är 34,5 och 2 · 34,5 = 69. Svaren ligger 15 isär: 315, 330, 345, 360, 375 och 390."
              - "1/3 kräver att antalet går att dela med 3. 20 % är 1/5 och kräver att det går att dela med 5. Då går det att dela med 15. 300 / 15 = 20, men 300 är för få. 15-hopp från 300: 315, 330, 345, 360, 375 och 390."
        - rubrik: Frågorna
          rader:
            - - Vad prövar eleven för varje antal i lösning A?
            - - Varför hoppar eleven 15 i taget i lösning B?
            - - Var syns det i båda lösningarna att svaren ligger 15 isär?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja om skolan hade mellan 300 och 3 000 elever, och varför?
    - rubrik: "Lärarens sida: Medel, problem 7, Samlarbilderna"
      text:
        - Problemet handlar om medelvärde, median och typvärde och har flera svar. Ett svar är 10, 20, 20, 20 och 40, och det finns 14 svar om alla har minst en bild. Eleverna använder att summan är 5 · 22 = 110 och ordnar talen. Idén kommer ur Hagland, Hedrén och Taflin (2005).
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talen 40, 22 och 20, och orden flest, medelvärde, median och typvärde.
            - rubrik: Lyft ut
              text: |-
                Vi vet: fem elever, den som har flest har 40, medelvärdet 22, medianen 20, typvärdet 20.
                Vi ska ta reda på: hur många bilder var och en kan ha.
            - rubrik: Ord och tal
              text: "Visa rutorna på bilden. Fråga: Vad betyder median och typvärde? Vad räknar 22? Måste någon av eleverna ha 22 bilder?"
            - rubrik: Förutse
              text: Tal som prövas i rutorna, summan 110, eller 20 i mitten först. Några skriver inte talen i ordning.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Skriv fem tal i rutorna och räkna medelvärdet.
                Efter några försök: Berätta vad ni har gjort! Ni sa att summan måste bli 110. Försök använda det!
            - rubrik: Säg inte
              text: Sätt 20 i mitten och 40 sist, och summan är 110. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Den som har flest har 8, medelvärdet är 5, och medianen och typvärdet är 4 (3 svar).
                Större: Hitta alla svar, om alla har minst en bild. Hur vet ni att ni har alla? (14 svar, ordnade efter var det andra 20 står)
            - rubrik: Jämför
              text: Summan är 5 · 22 = 110, och 20 står minst två gånger. A prövar och räknar summan, och B börjar med de tal som måste stå.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att 15, 15, 20, 20 och 40 går. Hur kan ni kontrollera typvärdet mot problemet?
                ”Är medianen 20?” Hur kan ni kontrollera det?
    - rubrik: "Medel, problem 7: Samlarbilderna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Samlarbilderna
          rader:
            - - Fem elever samlar på bilder. Den som har flest har 40 bilder. Medelvärdet är 22 bilder. Medianen är 20 och typvärdet är 20.
        - rubrik: Frågorna
          rader:
            - - Hur många bilder kan var och en av de fem ha?
            - - Det finns flera svar. Hitta så många ni kan.
    - rubrik: "Två lösningar: Medel, problem 7, Samlarbilderna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Samlarbilderna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "Pröva fem tal i ordning. 15, 15, 20, 20 och 40 ger summan 110, men då är 15 också typvärde. 10, 20, 20, 20 och 40 går: 10 + 20 + 20 + 20 + 40 = 110, och 110 / 5 = 22. 14, 16, 20, 20 och 40 går också."
              - 20 står i mitten och 40 sist. Summan är 5 · 22 = 110, och 110 − 20 − 40 = 50 är kvar. Typvärdet kräver ett 20 till. På fjärde platsen ger det 30 till två rutor, som 10 och 20 eller 14 och 16. På andra platsen går till exempel 5 och 25.
        - rubrik: Frågorna
          rader:
            - - Vad prövar eleven för varje rad i lösning A?
            - - Varför räknar eleven i lösning B 110 − 20 − 40?
            - - Var syns det i båda lösningarna att summan måste vara 110?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja för att hitta alla svar, och varför?
    - rubrik: "Lärarens sida: Medel, problem 8, Klädaffären"
      text:
        - Problemet handlar om likheter i en kedja. Ali betalar mest och Cleo minst, och ordningen är Ali, Dan, Bea och Cleo. Eleverna räknar med proportioner i flera steg och väljer en enhet som de räknar om allt till, kepsar eller kronor. Idén kommer ur Känguru 2023, Benjamin nr 24.
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talen i de tre likheterna, och orden ”kostar lika mycket som”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: tre likheter mellan priser, och vad var och en köper.
                Vi ska ta reda på: vem som betalar mest, och ordningen.
            - rubrik: Ord och tal
              text: "Visa hatten, kjolen, tröjan och kepsen på bilden. Fråga: Vilken är dyrare, en kjol eller en tröja? Hur vet ni det?"
            - rubrik: Förutse
              text: Allt i kepsar, ett pris som väljs, eller sakerna som ritas. Några tror att en kjol kostar som 8 tröjor.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Leta efter en sak som ni kan räkna om allt till.
                Efter några försök: Berätta vad ni har gjort! Ni sa att en tröja kostar mer än en keps. Försök använda det!
            - rubrik: Säg inte
              text: Räkna om allt till kepsar, eller säg att en keps kostar 10 kr. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: En hatt kostar som 2 kjolar, och en kjol som 3 tröjor. Ordna 2 hattar, 3 kjolar och 10 tröjor (hattarna, tröjorna, kjolarna).
                Större: Hitta på ett köp som kostar lika mycket som Beas. (Som 28 kepsar, eller 2 hattar och 2 kjolar)
            - rubrik: Jämför
              text: Vi räknar om allt till samma enhet. En hatt är 10 kepsar i A och 100 kr i B, alltså 10 kepsar i båda. Lyft fram att enheten går att välja.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att Dan betalar mest, för han köper flest saker. Hur kan ni kontrollera det mot problemet?
                ”Är ordningen rätt?” Hur kan ni kontrollera den på ett annat sätt?
    - rubrik: "Medel, problem 8: Klädaffären"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Klädaffären
          rader:
            - - I en affär med begagnade kläder kostar 2 hattar lika mycket som 5 kjolar. Där kostar 3 kjolar lika mycket som 8 tröjor, och 2 tröjor kostar lika mycket som 3 kepsar.
            - - Fyra vänner handlar. Ali köper 3 hattar, Bea 7 kjolar, Cleo 18 tröjor och Dan 29 kepsar.
        - rubrik: Frågorna
          rader:
            - - Vem betalar mest?
            - - Ordna de fyra köpen från dyrast till billigast.
    - rubrik: "Två lösningar: Medel, problem 8, Klädaffären"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Klädaffären
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "Allt i kepsar. 2 tröjor kostar som 3 kepsar, så 8 tröjor, alltså 3 kjolar, är 4 · 3 = 12 kepsar. En kjol är 12 / 3 = 4, och 5 kjolar 5 · 4 = 20. En hatt är 20 / 2 = 10. Från dyrast: Ali 30, Dan 29, Bea 28 och Cleo 27 kepsar."
              - "Välj ett pris: en keps kostar 10 kr. En tröja: 3 · 10 / 2 = 15 kr. En kjol: 8 · 15 / 3 = 40 kr. En hatt: 5 · 40 / 2 = 100 kr. Från dyrast: Ali 3 · 100 = 300, Dan 29 · 10 = 290, Bea 7 · 40 = 280 och Cleo 18 · 15 = 270 kr."
        - rubrik: Frågorna
          rader:
            - - Hur räknar eleven i lösning A ut vad en kjol är i kepsar?
            - - Varför får eleven i lösning B välja att en keps kostar 10 kr?
            - - Var syns det i båda lösningarna att en hatt kostar som tio kepsar?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja om en sak till kom med, och varför?
    - rubrik: "Lärarens sida: Medel, problem 9, Pantpengarna"
      text:
        - Problemet handlar om bråk av det som finns kvar och om att räkna baklänges. Från början fanns 27 kr, och Saga tog 9 kr, Leo 6 kr och Mira 4 kr. Eleverna ser att 8 kr är 2/3 av det Mira hittade i asken och går bakåt ett steg i taget. Idén kommer ur Hagland, Hedrén och Taflin (2005).
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talen 1/3 och 8 kr, och orden ”det som finns kvar” och ”likadant”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: alla tar 1/3 av det som är kvar, och sist är 8 kr kvar.
                Vi ska ta reda på: pengarna från början, och vad var och en tog.
            - rubrik: Ord och tal
              text: "Visa stapeln på bilden. Fråga: Vad betyder ”det som finns kvar”? Är 8 kr Miras del eller det som blev kvar?"
            - rubrik: Förutse
              text: Staplar som delas, tal som prövas i en tabell, eller baklänges från 8 kr. Några tror att 8 kr är 1/3 i stället för 2/3.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Gissa hur mycket som fanns från början, och räkna vad var och en tar.
                Efter några försök: Berätta vad ni har gjort! Ni sa att Mira lämnar 2/3 kvar. Försök använda det!
            - rubrik: Säg inte
              text: 8 kr är 2/3 av det Mira hittade, så gå baklänges. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Två syskon gör likadant, och sist är 4 kr kvar (9 kr: Saga tog 3 kr och Leo 2 kr).
                Större: Fyra syskon gör likadant, och sist är 16 kr kvar. Hur mycket fanns från början? (81 kr)
            - rubrik: Jämför
              text: Varje gång blir 2/3 kvar. I A är 8 kr två tredjedelar, så en tredjedel är 4 kr. I B är det 18, 12 och 8 kr som blir kvar.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att Mira tog 8 kr. Hur kan ni kontrollera det mot problemet?
                ”Är det 27 kr?” Hur kan ni kontrollera att det blir 8 kr kvar?
    - rubrik: "Medel, problem 9: Pantpengarna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Pantpengarna
          rader:
            - - Tre syskon pantar burkar och lägger pengarna i en ask. Saga tar 1/3 av pengarna och går. Sedan kommer Leo. Han tror att ingen har tagit något och tar 1/3 av det som finns kvar. Sist kommer Mira och gör likadant. Då ligger 8 kr kvar i asken.
        - rubrik: Frågorna
          rader:
            - - Hur mycket pengar fick syskonen för burkarna?
            - - Hur mycket tog var och en?
    - rubrik: "Två lösningar: Medel, problem 9, Pantpengarna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Pantpengarna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "Baklänges med staplar. Mira tog 1/3, så 8 kr är 2/3 av det hon hittade. 8 / 2 = 4, och Mira hittade 3 · 4 = 12 kr. Leo lämnade också 2/3 kvar: 12 / 2 = 6 och 3 · 6 = 18. Saga gjorde likadant: 18 / 2 = 9 och 3 · 9 = 27 kr."
              - "Pröva och förbättra i en tabell. 30 går inte: Leo kan inte ta 1/3 av 20 kr i hela kronor. 81 ger 24 kr kvar, för mycket. 54 ger 16 kr kvar, dubbelt så mycket som 8 kr. Hälften, 27, ger 9, 6 och 4 kr, och 8 kr kvar."
        - rubrik: Frågorna
          rader:
            - - Varför börjar eleven i lösning A med den nedersta stapeln?
            - - Varför prövar eleven 27 efter 54 i lösning B?
            - - Var syns det i båda lösningarna att 2/3 blir kvar varje gång?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med fem syskon, och varför?
    - rubrik: "Lärarens sida: Medel, problem 10, Smörgåsarna"
      text:
        - "Problemet handlar om bråk och rättvis delning. Smörgåsarna är lika stora, och Kim betalar för det han får av var och en. Elsa ska få 5 kr och Jonas 20 kr, eftersom Elsa ger Kim 1/3 smörgås och Jonas 4/3. Material: fem pappersrektanglar per par att vika i tredjedelar. Idén kommer ur Nyman, Säfström och Taflin i Nämnaren 2016:3."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågan, talen 2, 3 och 25, och orden ”lika mycket” och ”rättvist”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: Elsa har 2 smörgåsar och Jonas 3, alla äter lika mycket, och Kim betalar 25 kr.
                Vi ska ta reda på: hur mycket Elsa och Jonas ska få.
            - rubrik: Ord och tal
              text: "Fråga: Vad betyder rättvist här? Betalar Kim för smörgåsarna Elsa och Jonas hade med sig, eller för det han äter?"
            - rubrik: Förutse
              text: Smörgåsar som ritas i tredjedelar, bråk, eller pengarna efter antalet smörgåsar. Några svarar då 10 och 15 kr.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Rita smörgåsarna och dela dem så att alla får lika.
                Efter några försök: Berätta vad ni har gjort! Ni sa att alla äter 5 tredjedelar. Försök använda det!
            - rubrik: Säg inte
              text: Elsa ger Kim 1/3 och Jonas ger 4/3. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Elsa har 1 smörgås och Jonas 2, och Kim betalar 10 kr (Elsa 0 kr och Jonas 10 kr).
                Större: Elsa har 3 smörgåsar och Jonas 5, och Kim betalar 40 kr. Hur ska de dela nu? (Elsa 5 kr och Jonas 35 kr)
            - rubrik: Jämför
              text: Kim betalar för det han får av var och en. I A syns det i bitarna med K, och i B i 2 − 5/3 och 3 − 5/3.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att Elsa ska ha 10 kr. Hur kan ni kontrollera det mot det hon gav Kim?
                ”Är 5 och 20 kr rättvist?” Hur kan ni kontrollera det?
    - rubrik: "Medel, problem 10: Smörgåsarna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Smörgåsarna
          rader:
            - - Elsa, Jonas och Kim är på utflykt. Elsa har med sig 2 smörgåsar och Jonas har 3. Kim har glömt sin matsäck. De delar de fem smörgåsarna så att alla tre äter lika mycket. Sedan ger Kim 25 kr till Elsa och Jonas för det han har ätit.
        - rubrik: Frågorna
          rader:
            - - Hur ska Elsa och Jonas dela de 25 kronorna, så att det blir rättvist?
    - rubrik: "Två lösningar: Medel, problem 10, Smörgåsarna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Smörgåsarna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - Rita smörgåsarna i tredjedelar. Var och en äter 5 av 15 tredjedelar. Elsa har 6 och ger Kim 1. Jonas har 9 och ger Kim 4. Kim betalar 25 kr för 5 tredjedelar, så en kostar 25 / 5 = 5 kr. Elsa får 5 kr och Jonas 4 · 5 = 20 kr.
              - Räkna med bråk. Var och en äter 5 / 3 = 5/3 smörgås. Elsa ger Kim 2 − 5/3 = 1/3, och Jonas ger 3 − 5/3 = 4/3. Kim får 1/3 + 4/3 = 5/3 för 25 kr, så 1/3 kostar 25 / 5 = 5 kr. Elsa får 5 kr och Jonas 4 · 5 = 20 kr.
        - rubrik: Frågorna
          rader:
            - - Hur visar eleven i lösning A vad Kim äter av Elsas och Jonas smörgåsar?
            - - Varför räknar eleven i lösning B 2 − 5/3?
            - - Var syns det i båda lösningarna att Jonas ger fyra gånger så mycket som Elsa?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med fyra personer, och varför?
    - rubrik: "Lärarens sidor: Avancerat"
      text:
        - Här står de tio problemen på nivån Avancerat, som ligger nära åk 8–9, i den ordning gruppen tar dem. Varje problem har lärarens sida, problemets sida och bladet Två lösningar.
