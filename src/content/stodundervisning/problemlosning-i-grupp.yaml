# Metod i stödundervisning. Modellen står i src/content.config.ts och mallen i _mall.yaml.
# Omarbetad 2026-09-24 efter Nämnaren-artikeln (underlag/metoder/namnaren-2026-09), besluten i NATTEN.md. Passet är 30
# minuter sedan 2026-10-07, på Niclas besked.
# Omtaget 2026-10-10 (intake/ARBETSORDER-problemlosning-2026-10-10.md, analysen i analys-omtag-2026-10.md): tio problem
# per nivå med lärarens sida, problemets sida med en svartvit bild och bladet Två lösningar (problemstandard.md), passet i
# fem delar, rutorna om gruppen och de tre sakerna, stödtrappan efter Umeå-guiden, kartläggningen och bladen Vår lösning
# och Våra sätt. Problemens ramar skrivs in ur problem/<nivå>.yaml med node build/problemkoll.mjs <slug> --yaml.
# De första rundorna 2026-10-10 inskrivna (out/problemlosning-i-grupp/beslut-forsta-rundorna-2026-10-10.md): passet 5,
# 2, 14, 7 och 2 minuter, paren berättar problemet för varandra och prövar olika sätt, kortet Våra sätt som kort, och
# kartläggningens blad med problemet och uppgifterna som listor.
titel: Problemlösning i grupp
undertitel: Lärarledd problemlösning och läsförståelse i liten grupp för åk 4–9, med rika problem på tre nivåer
ingress: Ett körschema för 30-minuterspass i liten grupp, där eleverna läser, tolkar och löser matematiska problem i text. Läraren leder och frågar i stället för att visa lösningen, och gruppen jämför två sätt att lösa varje problem. Metoden har tio problem på var och en av tre nivåer.
omrade: Matematik
arskurs:
  - 4-6
  - 7-9
taggar:
  - problemlosning
  - lasforstaelse
format:
  - liten grupp
  - par
tid: 30 minuter per pass, två till tre pass i veckan
period: Sex till åtta veckor
grupp: Två till åtta elever
material:
  - ett problem per pass
  - bladen Vår lösning och Två lösningar
  - konkret material
  - kortet Våra sätt
uppdaterad: 2026-10-10
relaterade:
  - fyra-raknesatten
  - antalsuppfattning-i-grupp
  - brakkurs-i-grupp
  - faktatextsamtal-i-grupp
utkast: false
nivaer:
  - { namn: Bas, farg: "4E7A43" }
  - { namn: Medel, farg: "A8742A" }
  - { namn: Avancerat, farg: "6E3450" }
inledning:
  - Problemlösning i grupp är en lärarledd insats för två till åtta elever i åk 4–9 som behöver stöd i att läsa, tolka och lösa matematiska problem i text. Varje pass har ett problem. På bordet ligger problemets sida med en svartvit bild och kortet Våra sätt, som har sätt att lösa problem och frågor som paren ställer sig. Innan någon räknar visar paren problemet med en bild, en tabell eller en tallinje på bladet Vår lösning eller en miniwhiteboard, eller så bygger de det med material.
  - "Passet är ett samtal i fem delar: Förstå, Planera, Lösa, Jämföra och Avsluta. I Förstå läser läraren problemet högt, paren berättar det för varandra, och gruppen ringar in frågan och säger vad den vet och vad den ska ta reda på. I Planera föreslår gruppen sätt att visa problemet, och i Lösa prövar paren olika sätt medan läraren går runt och frågar i stället för att visa. I Jämföra lägger läraren fram bladet Två lösningar, med två färdiga lösningar på samma problem. Gruppen ser vad som är lika i dem, och sedan lägger ett eller två par sina lösningar bredvid. I Avsluta sätter gruppen en bock på kortet Våra sätt vid det sätt som fungerade. Skillnaden mot vanligt grupparbete är att läraren leder, modellerar och stöttar. Att modellera är att tänka högt om hur man tar sig an problemet, som ”Jag vill rita det här för att se det framför mig”."
  - Metoden har tio problem på var och en av tre nivåer, Bas nära åk 4–5, Medel nära åk 6–7 och Avancerat nära åk 8–9. Till varje problem finns lärarens sida och bladet Två lösningar. Lärarens sida säger vad gruppen ringar in och lyfter ut, vad du säger när paret kör fast och vad svaret är. De tio problemen räcker till de första tre till fem veckorna, och sedan väljer du problem ur källorna och förbereder dem på samma sätt. Över veckorna tar eleverna över allt mer av arbetet, från att du tänker högt till att de leder delar av passet själva och använder sätten i klassens matematik.
upplagg:
  rubrik: Så fungerar insatsen
  text: "Två till åtta elever träffas två till tre gånger i veckan i sex till åtta veckor, 30 minuter per pass. Varje pass har ett problem och fem delar: Förstå, Planera, Lösa, Jämföra och Avsluta. Gruppen förstår problemet och föreslår sätt att visa det innan någon räknar, paren prövar, och i Jämföra lägger gruppen sina lösningar bredvid bladet Två lösningar. Metoden har tio problem på var och en av nivåerna Bas, Medel och Avancerat, med en sida för läraren till varje. Kartläggningen före och efter visar om eleven kan återberätta problemet, visa det, lösa det och pröva ett svar."
gruppen:
  rubrik: Så sätter du ihop gruppen
  text: Metoden är för elever som kan läsa ett problem med stöd och räkna talen i det, men som räknar med talen utan att se situationen, kör fast eller bara har ett sätt. Den som ännu inte löser textuppgifter i ett och två steg börjar med De fyra räknesätten i grupp. Förstår eleven inte problemet när du läser det högt, går du igenom ord, begrepp och sammanhang före passet, och den som inte kan läsa texten själv får den uppläst. Gruppen har två till åtta elever på samma nivå, som du väljer efter vad de kan läsa och räkna, oavsett årskurs. Eleverna arbetar i fasta par, och vid ett udda antal i en trio.
principer:
  rubrik: Tre saker att hålla fast vid
  text: Förstå innan ni räknar. Gruppen återberättar, ringar in frågan och säger vad den vet, eftersom ett fel svar kan vara en riktig lösning på ett problem som eleven har förstått på ett annat sätt. Fråga innan du visar. Börja med ”Vad har ni gjort hittills?” och ”Varför gjorde ni så?”, och ge sedan det minsta stöd som tar paret vidare. Jämför två sätt i varje pass. Bladet Två lösningar visar att samma idé kan visas på flera sätt, och paren ser vad deras lösning har gemensamt med en annan.
tabeller:
  - rubrik: Varför problemlösning blir svår, och vad metoden gör
    plats: efter-inledning
    text: Sex saker gör problem i text svåra för eleverna, och passet möter var och en av dem på ett eget ställe.
    kolumner:
      - Det som händer
      - Så kan det låta
      - Så gör metoden
    rader:
      - - Eleven räknar med talen utan att se situationen
        - ”Det står fler, då är det plus.”
        - Paren återberättar, och gruppen ringar in frågan och säger vad varje tal betyder.
      - - Elevens bild visar saker men inga samband
        - ”Vi har ritat alla stakarna.”
        - Problemets bild är schematisk, och gruppen visar problemet med tabell, tallinje, stapel eller material.
      - - Eleven kommer inte i gång
        - ”Jag fattar inte.” ”Ska man gångra?”
        - "Du frågar först vad paret har gjort och vad det ska ta reda på, och sedan tittar ni på kortet Våra sätt."
      - - Eleven prövar men ser inget samband
        - ”Det går inte, vi har testat.”
        - Paret berättar vad det har gjort, och du tar upp något som paret sa.
      - - Eleven prövar inte svaret mot frågan
        - ”Är det rätt?”
        - Paret kontrollerar svaret mot problemet, och i Jämföra prövar gruppen ett fel svar mot problemet.
      - - Eleven har bara ett sätt
        - ”Vi gjorde bara så.”
        - I varje pass lägger gruppen sina lösningar bredvid bladet Två lösningar.
  - rubrik: "Var paret kör fast, och det du säger"
    plats: efter-fastnar
    text: "Tabellen är det allmänna stödet, och Kör de fast på lärarens sida är stödet för problemet. Ge stödet på raden där paret är, och lämna paret när det är i gång igen."
    kolumner:
      - Där paret är
      - Så kan det låta
      - Så stöder du
    rader:
      - - Har inte förstått problemet
        - ”Jag fattar inte vad det står.”
        - "”Vad ska ni ta reda på? Vad får ni veta?” Förklara ett ord, men inte hur problemet löses."
      - - Har förstått men inte börjat
        - ”Vi vet inte hur vi ska börja.”
        - "”Vilka sätt att börja kan ni? Prova ett!” Räcker det inte, föreslår du ett sätt, som att rita eller pröva några tal."
      - - Har en bild som inte visar talen
        - ”Vi har ritat.”
        - ”Var i er bild syns talen som står under Vi vet?”
      - - Har prövat men ser inget samband
        - ”Det går inte, vi har testat.”
        - "”Berätta vad ni har gjort!” Ta upp något som paret sa: ”Försök använda det!”"
      - - Har en idé men kör fast i räkningen
        - ”Vi vet hur, men det blir för svårt att räkna.”
        - Ta fältet Mindre på lärarens sida, och låt idén vara parets.
      - - Har ett svar men är osäker
        - ”Är det rätt?”
        - "Upprepa parets svar och fråga: ”Hur kan ni kontrollera att det stämmer med problemet?”"
      - - Har ett fel men är säker efter kontrollen
        - ”Det är rätt, vi vet det.”
        - ”Ni har en bra lösning, men något stämmer inte. Försök hitta vad det är.”
      - - Har rätt och bra skäl men vill ha ett ja
        - ”Visst är det rätt?”
        - ”Ni har bra skäl för er lösning. Ni har övertygat mig.”
  - rubrik: Så skiljer sig nivåerna
    plats: efter-urval
    text: Nivåerna följer kursplanens centrala innehåll och ligger nära Kängurutävlingens klasser, som Ecolier och Benjamin. Välj nivå efter vad gruppen kan läsa och räkna.
    kolumner:
      - Det som skiljer
      - Bas
      - Medel
      - Avancerat
    rader:
      - - Årskurs
        - nära åk 4–5
        - nära åk 6–7
        - nära åk 8–9
      - - Talen
        - hela tal, enkel delning
        - bråk, decimaltal och procent
        - procent, kvadrater och potenser
      - - Sätten
        - rita eller bygg, tabell eller lista, mönster, räkna baklänges
        - rita eller bygg, tabell eller lista, pröva och förbättra, uttryck
        - tabell eller lista, mönster, uttryck eller ekvation
  - rubrik: Metodens byggstenar
    plats: efter-grund
    text: Tabellen visar var varje grepp kommer ifrån och var det syns i passet.
    kolumner:
      - Byggsten och källa
      - Så används den i metoden
    rader:
      - - |-
          Pólyas fyra faser
          (Pólya, 1945)
        - "Faserna blir passets fyra första delar, Förstå, Planera, Lösa och Jämföra."
      - - |-
          Fem undervisningspraktiker
          (Smith och Stein, 2014)
        - Du förutser och överblickar lösningarna, väljer ut och ordnar dem och kopplar ihop dem med bladet Två lösningar.
      - - |-
          Jämförelse av två lösningar
          (Rittle-Johnson och Star, 2007; Durkin, Star och Rittle-Johnson, 2017)
        - Bladet Två lösningar har lösningarna sida vid sida och frågor där eleverna jämför dem.
      - - |-
          Gradvis överlämnande av ansvar
          (Fisher och Frey, 2008)
        - "Läraren modellerar först, och eleverna leder efter hand fler delar och använder rutinen i ordinarie uppgifter."
      - - |-
          Reciprok undervisning
          (Palincsar och Brown, 1984)
        - Paren återberättar och reder ut ord, läraren tänker högt som modell, och efter hand leder en elev Förstå.
      - - |-
          Lärarguiden om elevers problemlösning
          (Säfström m.fl., 2024; Lithner m.fl., 2025)
        - Lyssna efter var paret har kört fast och rikta stödet dit, i stödtrappan, tabellen Var paret kör fast och lärarens sidor.
      - - |-
          Rika problem
          (Hagland, Hedrén och Taflin, 2005)
        - De trettio problemen följer sju kriterier för ett rikt problem, som att det går att lösa på flera sätt.
      - - |-
          Vägledning om problemlösning i åk 4–8
          (Woodward m.fl., 2012)
        - Starkt stöd för att visa problemet i en bild eller tabell och för att eleverna prövar sin lösning medan de arbetar. Det syns i sätten och kortets frågor.
passrutin:
  text: Varje pass har fem delar och samma rutin. Det gör insatsen lätt att leda, och eleverna känner sig trygga när de vet vad som ska hända.
  steg:
    - text: Läraren läser problemet högt. Paren berättar det för varandra, och en elev berättar för gruppen. Gruppen ringar in frågan, och läraren skriver det gruppen säger på tavlan, under Vi vet och Vi ska ta reda på.
      fas: Förstå
    - text: "Gruppen föreslår sätt att visa problemet, och paren får välja olika sätt. Varje par gissar ungefär vad svaret blir. Ingen räknar än."
      fas: Planera
    - text: Eleverna prövar i par. Läraren går runt, frågar och väljer en eller två lösningar till Jämföra.
      fas: Lösa
    - text: Gruppen pratar om bladet Två lösningar, och ett eller två par visar sina lösningar bredvid. Sist prövar gruppen ett fel svar mot problemet.
      fas: Jämföra
    - text: Läraren sätter ord på sättet som fungerade, och gruppen bockar för det på kortet Våra sätt.
      fas: Avsluta
  efterPasset: Läraren skriver en kort notering om vad eleverna klarade med stöd.
  kallas: delar
tidsschema:
  rubrik: Ett pass på 30 minuter
  text: Remsan visar hur de 30 minuterna fördelas mellan passets delar och när gruppen arbetar gemensamt och i par. Längst tid får eleverna för att pröva själva.
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: Ta nästa problem på gruppens nivå, läs lärarens sida och lös problemet på båda sätten. Kopiera problemets sida, Vår lösning och Två lösningar till varje par. Till ett eget problem ritar du A och B på ett papper, som du visar i Jämföra med B täckt.
    - tid: 0–5 min
      fas: Förstå
      vad: "Gemensamt. Lärarens sida: Ringa in · Lyft ut · Ord och tal."
    - tid: 5–7 min
      fas: Planera
      vad: "Gemensamt, med kortet Våra sätt. Lärarens sida: Förutse."
    - tid: 7–21 min
      fas: Lösa
      vad: "I par. Lärarens sida: Kör de fast · Säg inte · Mindre och större."
    - tid: 21–28 min
      fas: Jämföra
      vad: "Gemensamt igen, med bladet Två lösningar. Lärarens sida: Jämför · Fel eller osäker."
    - tid: 28–30 min
      fas: Avsluta
      vad: Gemensamt igen, med kortet Våra sätt.
  efter: "Gruppen tar ett problem per pass. Blir ett par klart tidigt, ställer du frågan under Större på lärarens sida eller ber paret lösa problemet på ett annat sätt."
steg:
  rubrik: Vad du gör och säger i varje del
  text: Passet har fem delar. De fyra första bygger på Pólyas faser, och i Avsluta sätter du ord på det ni tar med er. Fraserna hjälper dig att tänka högt och att fråga i stället för att tala om. Till Jämföra väljer du ett par vars lösning liknar A eller B, och ett par med ett annat sätt om det finns. Är gruppen bara ett par eller en trio, jämför ni deras lösning med A och B. Liknar ingen lösning A eller B, visar ett par sin lösning före bladet, och gruppen letar efter samma tanke i A.
  rader:
    - namn: Förstå
      fraga: Vad frågar problemet?
      gor: Läs högt. Paren berättar för varandra, en elev för gruppen. Red ut ord och ringa in frågan. Skriv på tavlan vad ni vet och ska ta reda på.
      fraser:
        - Kan du berätta problemet med egna ord?
        - Vilket ord är vi osäkra på?
        - Vad betyder talen i texten?
    - namn: Planera
      fraga: Hur kan vi tänka?
      gor: Gruppen föreslår sätt från kortet, och paren får välja olika sätt. Skriv parens gissningar under Vi tror. Ingen räknar än.
      fraser:
        - Hur kan vi visa problemet så att vi ser det framför oss?
        - Tänk om vi provar med mindre tal först.
        - Ungefär hur mycket tror ni att det blir?
    - namn: Lösa
      fraga: Hur prövar vi?
      gor: "Paren prövar på Vår lösning. Fråga först och lämna dem i gång. Halvvägs säger du två sätt du har sett, utan namn och svar. Välj lösningar till Jämföra."
      fraser:
        - Vad har ni gjort hittills? Varför gjorde ni så?
        - Försök använda det ni just sa!
        - Nu tror jag att ni kan prova själva.
    - namn: Jämföra
      fraga: Vad är lika?
      gor: "Dela ut Två lösningar med B täckt: vad gör A? Visa B och ställ fråga 3. De valda paren visar sina lösningar. Sist felet och idén i en mening."
      fraser:
        - Stämde det vi trodde?
        - Så här svarade en elev i en annan grupp. Vad skulle ni säga till hen?
        - Vilken fråga på kortet borde hen ha ställt sig?
    - namn: Avsluta
      fraga: Vad tar vi med oss?
      gor: Sätt ord på sättet som fungerade, och gruppen bockar för det på kortet. Efter passet skriver du vad varje elev kunde.
      fraser:
        - I dag gjorde vi en tabell och prövade och förbättrade.
        - Vi började med att förstå frågan innan vi räknade.
        - Vilket sätt skulle du välja nästa gång?
arbetsform:
  rubrik: "Arbetsform: gemensamt, i par, gemensamt igen"
  text: "Passet går från hela gruppen till paren och tillbaka. En i paret håller pennan, och halvvägs i Lösa byter de. Vid ett udda antal arbetar tre tillsammans. Det fungerar med två elever och med åtta, eftersom tänkandet sker i paren."
  delar:
    - rubrik: 1. Gemensamt
      text: läraren leder och modellerar
      faser:
        - Förstå
        - Planera
    - rubrik: 2. I par
      text: eleverna prövar, läraren går runt
      faser:
        - Lösa
    - rubrik: 3. Gemensamt igen
      text: hela gruppen med läraren
      faser:
        - Jämföra
        - Avsluta
exempel:
  valt:
    rubrik: Ljusstakarna, Bas, problem 5
    text: På ett slott finns 29 ljusstakar. Några av dem har plats för fem ljus, och några har plats för sju ljus. Sammanlagt behövs 187 ljus. Hur många ljusstakar finns det av varje sort?
  text:
    - "Ebba, Ali, Noor och Elias går i åk 5 och arbetar på nivån Bas, och det är vecka 2. Läraren vet att eleverna kan fastna i vad de två okända sakerna är. Hen läser problemet högt och pekar på bilden med den femarmade och den sjuarmade staken. Paren berättar problemet för varandra, och sedan berättar Ebba för gruppen: ”Två sorters stakar, 187 ljus. Hur många av varje?” Läraren frågar: ”Hur många stakar är det?” Ebba tittar i texten: ”29.” Gruppen ringar in frågan, och läraren skriver på tavlan: vi vet att det finns 29 ljusstakar och att det behövs 187 ljus, och vi ska ta reda på hur många som har fem ljus och hur många som har sju ljus."
    - "Sedan stannar läraren gruppen innan någon börjar räkna. ”Hur kan vi visa problemet så att vi ser det framför oss?” Eleverna tittar på kortet Våra sätt. Ebba och Ali vill pröva i en tabell, och Noor och Elias vill rita stakarna. Läraren väljer inte åt dem, men hjälper dem i gång: ”En tabell kan vara bra när vi behöver pröva olika antal. Vad kan rubrikerna vara?” Paren gissar hur många sjuarmade det är, och läraren skriver gissningarna under Vi tror."
    - "Paren skriver av tavlan och prövar. Ebba och Ali har prövat 10 sjuarmade, som gav 165 ljus, och 19 sjuarmade, som gav 183, och säger att det inte går. Läraren frågar: ”Vad har ni gjort hittills?” och sedan ”Varför gjorde ni så?” När paret har berättat säger läraren: ”Ni sa att 10 sjuarmade gav 165 ljus och 19 gav 183. Försök använda det!” Sedan går hen till Noor och Elias, som har ritat 29 stakar med fem ljus i varje. Halvvägs säger läraren två sätt som hen har sett, och paren byter penna."
    - "Efter knappt en kvart i par samlar läraren gruppen. Varje par får bladet Två lösningar med lösning B under ett papper, och gruppen säger vad eleven i lösning A gör från rad till rad. Sedan visar läraren lösning B, där eleven har tänkt: ”Om alla vore femarmade skulle det bli för få ljus.” Läraren frågar: ”Var syns det i båda lösningarna att en sjuarmad har två ljus mer än en femarmad?” Ebba och Ali visar sin tabell, som liknar A, och Noor och Elias sin teckning, som liknar B. Gruppen ser om gissningarna stämde. Sist skriver läraren ett svar från en annan grupp på tavlan, 26 sjuarmade och 1 femarmad, och Elias räknar: ”Bara 27 stakar.” Noor säger idén: ”Varje sjuarmad ger två ljus till, i tabellen och i teckningen.”"
    - "Passet avslutas med att läraren sätter ord på sättet: ”I dag gjorde vi en tabell och prövade och förbättrade. Vi började också med att förstå frågan innan vi räknade.” Ali bockar för Gör en tabell eller en lista på kortet. Efteråt skriver läraren en kort notering: Ebba glömde antalet stakar, Elias behövde stöd för att välja hur problemet skulle visas, Ebba och Ali kom vidare efter frågan om det de hade prövat, och Noor såg att teckningen hade samma tanke som B."
  tavla: true
  tavlaText: "Visa tabellen först och resonemanget ”om alla vore femarmade” sedan. I båda lösningarna ger varje byte från en femarmad till en sjuarmad stake två ljus till: i A ger tio byten 20 ljus, och i B är 42 / 2 = 21. Svaret är rimligt: 187 ligger närmare 29 · 7 = 203 än 29 · 5 = 145, så de sjuarmade är fler. Att översätta mellan två sätt att visa något är passets matematiska kärna."
fastnar:
  rubrik: När gruppen fastnar
  text: När eleverna kör fast är det lätt att lotsa dem direkt till svaret. Gör tvärtom. Fråga först vad paret har gjort och varför. Svaren visar var paret är, och efter det väljer du stödet. Ge paret tid att pröva innan du ger mer. Stödet följer en lärarguide från Umeå universitet (Lithner m.fl., 2025).
  fragaForst:
    - Vad har ni gjort hittills?
    - Varför gjorde ni så?
  trappaText: "Har paret ett svar, ger du steg 5. Har paret räknat fel och kört fast, tar du upp felet först. Har paret kört fast, kan du säga: ”Hur tror ni att ni skulle kunna komma vidare? Prova det!” Räcker det inte, ger du det steg i stödtrappan där paret är:"
  trappa:
    - "Fråga: Vad ska ni ta reda på? Vad får ni veta?"
    - "Fråga: Vilka sätt att börja kan ni? Prova ett!"
    - Föreslå ett sätt, som att rita, göra en tabell, ta fram material eller pröva med mindre tal.
    - "Be paret berätta, ta upp något som paret sa och säg: Försök använda det!"
    - "Fråga: Hur kan ni kontrollera att det stämmer med problemet?"
  motto: Läraren leder processen, men äger inte lösningen.
roll:
  rubrik: "Lärarens roll: leda utan att ta över"
  text: Läraren leder processen, men äger inte lösningen. I samma stund som du visar lösningen slutar uppgiften att vara ett problem. Eleverna behöver se processen, och den syns inte hos en perfekt räknare.
  gor:
    - Fråga innan du visar, och vänta ut tystnaden.
    - Låt eleverna förklara för varandra.
    - Lyft fram flera olika lösningar.
    - "Säg sätten med namnen på kortet. Ett sätt med ett namn går att använda igen."
    - Visa hur även du kan fastna och hitta vidare.
  undvik:
    - Att visa lösningen direkt.
    - Att ta pennan, avbryta eleven mitt i hens sätt eller ställa en rad frågor som leder fram till svaret.
    - Att jaga rätt svar i stället för att tänka.
    - Att läraren pratar mest.
    - Att godta vaga förklaringar eller ge för kort tid.
urval:
  rubrik: Var hittar du problemen?
  text:
    - Gör kartläggningen före på den nivå som ligger närmast elevernas årskurs, och välj sedan nivå efter vad kartläggningen visar. Börja med metodens tio problem på nivån, i ordning, ett per pass. De står under Problemen och räcker till de första tre till fem veckorna, med tre eller två pass i veckan. Kör gruppen fast på samma sak två pass i rad, tar ni ett problem som liknar det förra innan ni går vidare. När gruppen har löst de tio med lite stöd, kan den ta nästa nivå, om den kan räkna talen där.
    - Sedan väljer du problem i läromedlets problemlösningsavsnitt, i Skolverkets två problembanker för åk 4–6 och åk 7–9 på Lärportalen, i Nämnarens Problemavdelning och bland Kängurutävlingens tidigare problem, med lösningar och materialet Arbeta vidare, på NCM:s webbplats. Ta först problem som liknar något av de tio. Ett problem är en uppgift där eleven inte direkt vet hur den ska lösas (Skolverket, 2022). Varje problem du väljer förbereder du på bladet Lärarens sida för ett eget problem.
  kravText: "Välj ett problem per pass som är rikt men avgränsat och uppfyller tre krav:"
  krav:
    - rubrik: Matematiskt fokus
      text: Ett tydligt innehåll utan knep
    - rubrik: Textspråklig utmaning
      text: En läsförståelsedel som går att stötta
    - rubrik: Två sätt
      text: Går att lösa på två sätt, med bild, tabell, tallinje eller material
progression:
  text: Ansvaret flyttas gradvis till eleverna, i de fyra leden Jag gör, Vi gör, Ni gör tillsammans och Du gör själv. Byt led när noteringarna visar att gruppen klarar ledet med lite stöd. Låt insatsen gå sida vid sida med färdighetsträning, och berätta för klassläraren vilka sätt gruppen arbetar med.
  rader:
    - vecka: 1–2
      led: Jag gör
      fokus: "De första problemen. I första passet visar du kortet och bladen, och Planera tar längre tid."
      roll: Läraren tänker högt med kortets frågor, som ”Jag frågar mig vad vi ska ta reda på.”
    - vecka: 3–4
      led: Vi gör
      fokus: "Fler av de tio problemen. Paren ställer kortets frågor till varandra, och du lyssnar. En elev läser problemet högt och leder Förstå."
      roll: Läraren ger kortare stöd och frågar mer.
    - vecka: 5–6
      led: Ni gör tillsammans
      fokus: De sista av de tio, och problem ur källorna som liknar dem. Paren skriver Vi vet själva.
      roll: Läraren läser parens Vi vet först och följer upp sätt, lösning och rimlighet.
    - vecka: 7–8
      led: Du gör själv
      fokus: Var och en börjar själv i två minuter innan paret arbetar vidare, gärna med problem ur klassens läromedel.
      roll: Läraren ger klassläraren en kopia av kortet med gruppens sätt och följer upp dem i klassens matematik.
uppfoljning:
  text: Du behöver veta om passen ger effekt, och det räcker inte att de har blivit av. Kartläggningen har två blad per nivå, ett före och ett efter, med två sidor per elev. Båda bladen har samma fem uppgifter, och problemen är byggda på samma sätt. Kartläggningen före gör du innan det första passet, omkring tio minuter per elev eller par. Spara parens blad Vår lösning, eftersom bladen visar hur paren tänker.
  rader:
    - nar: Före insatsen
      vad: Eleven löser bladet Kartläggning före, och du skriver i protokollet vad hen säger och gör i varje uppgift och vilken hjälp hen behöver.
    - nar: Varje pass
      vad: Vad kunde varje elev återberätta, visa, jämföra och kontrollera, och med vilket stöd? Vad tas upp nästa gång?
    - nar: Efter sex till åtta veckor
      vad: Eleven löser bladet Kartläggning efter, och du jämför de två protokollen.
mal:
  punkter:
    - Återberätta ett problem med egna ord
    - Peka ut vad problemet frågar efter
    - Förklara vad talen betyder
    - Visa problemet med bild, tabell eller material
    - Jämföra två sätt och säga vad som är lika
    - Kontrollera om svaret är rimligt
snabbmall:
  rubrik: Lärarens sida för ett eget problem
  text: Bladet fyller du i när du förbereder ett eget problem, och det har samma fält som lärarens sidor till metodens problem. Efter passet fyller du i de två sista raderna.
  fore:
    - Problemet och svaret
    - Ringa in, lyfta ut och reda ut ord och tal
    - "Förutse: sätt som eleverna kan välja"
    - "Kör de fast och Säg inte: det jag säger, och ledtråden som skulle ta över tänkandet"
    - "Mindre och större: mindre tal och en större fråga"
    - "Jämför: lösning A och B, och det som är lika"
    - "Fel eller osäker: ett vanligt fel"
  efter:
    - Vad kunde varje elev återberätta, visa, jämföra och kontrollera, och med vilket stöd?
    - Vad tar ni upp nästa gång?
checklista:
  punkter:
    - Läst lärarens sida och löst problemet själv på båda sätten.
    - Tänkt igenom vilka ord och tal som behöver redas ut.
    - Bestämt de fasta paren (trio vid udda antal).
    - Kopierat problemets sida, Två lösningar och Vår lösning, eller ritat A och B på ett papper till ett eget problem.
    - Lagt fram materialet, kortet Våra sätt och per par en penna och ett papper som täcker B.
    - Läst vad jag säger när paret kör fast, och vad jag inte säger.
    - Tänkt igenom hur jag ska avsluta passet.
grund:
  text: "Problemlösning i grupp är inte uppfunnen från grunden. Jag har fogat ihop beprövade grepp till ett körschema: Pólyas faser ordnar passet, Smith och Steins fem undervisningspraktiker styr jämförelsen, du lämnar gradvis över ansvaret till eleverna, och från reciprok undervisning kommer återberättandet, att reda ut ord och att läraren tänker högt. Eftersom svårigheter med problem i text ofta hänger ihop med läsförståelse, stannar du i varje pass vid ord, samband och vad talen betyder. Frågorna när paret kör fast kommer ur en lärarguide som forskare vid Umeå universitet har utvecklat tillsammans med över femtio lärare (Lithner m.fl., 2025). Bladet Två lösningar bygger på studier om ekvationer och överslagsräkning, där elever i åk 5–8 som jämförde två lösningar sida vid sida blev bättre på att välja och använda lösningssätt än elever som läste lösningarna en i taget, och belägget är måttligt (Rittle-Johnson och Star, 2007; Star och Rittle-Johnson, 2009)."
  kallor: Bygger på Pólya (1945), Smith och Stein (2014), Fisher och Frey (2008), Palincsar och Brown (1984), Säfström m.fl. (2024), Lithner m.fl. (2025), Woodward m.fl. (2012), Rittle-Johnson och Star (2007), Star och Rittle-Johnson (2009), Durkin, Star och Rittle-Johnson (2017), Hagland, Hedrén och Taflin (2005) samt Skolverkets kommentarmaterial till kursplanen i matematik (2022).
