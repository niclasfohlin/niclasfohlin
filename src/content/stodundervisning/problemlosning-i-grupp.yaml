    - rubrik: "Lärarens sida: Avancerat, problem 1, Cykelförrådet"
      text:
        - Problemet handlar om två okända tal som hänger ihop, antalet tvåhjulingar och antalet trehjulingar, som i Ljusstakarna i Bas. Svaret är 6 tvåhjulingar och 5 trehjulingar. Eleverna går från en tabell till en ekvation och ser att en trehjuling har ett hjul mer än en tvåhjuling. Idén kommer ur Problembanken åk 7–9, problem 8.
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågan, talen 11 och 27, och orden tvåhjulingar och trehjulingar.
            - rubrik: Lyft ut
              text: |-
                Vi vet: 11 cyklar, 27 hjul, två eller tre hjul på varje cykel.
                Vi ska ta reda på: hur många av varje sort, två okända tal.
            - rubrik: Ord och tal
              text: "Peka på tvåhjulingen och trehjulingen i bilden. Fråga: Vad räknar 11, och vad räknar 27?"
            - rubrik: Förutse
              text: En tabell, cyklar som ritas och får hjul, två hjul på alla först, eller en ekvation. Några tar 9 trehjulingar och glömmer de 11 cyklarna.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Rita elva cyklar, eller pröva ett antal i en tabell.
                Efter några försök: Berätta vad ni har gjort! Ni sa att 8 tvåhjulingar och 3 trehjulingar gav 25 hjul. Försök använda det!
            - rubrik: Säg inte
              text: Ge alla cyklar två hjul och räkna hjulen som blir över. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: 5 cyklar och 12 hjul (3 tvåhjulingar och 2 trehjulingar).
                Större: Fasaner och kaniner på en gård har tillsammans 35 huvuden och 94 fötter. Hur många av varje? (23 fasaner och 12 kaniner) Kan 15 cyklar ha 50 hjul? (Nej, högst 15 · 3 = 45)
            - rubrik: Jämför
              text: En trehjuling har ett hjul mer. I A ger varje trehjuling 1 hjul till. I B är 22 hjulen om alla har två, och x de som blir över.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att 9 trehjulingar ger 27 hjul. Hur kan ni kontrollera att det stämmer med problemet?
                Ni säger att x = 5. Vad räknar x, och svarar det på frågan?
