            - rubrik: Lyft ut
              text: |-
                Vi vet: hur figur 1, 2 och 3 ser ut, ljusa i mitten och mörka runt.
                Vi ska ta reda på: antalet av varje slag i figur 5, 10 och n.
            - rubrik: Ord och tal
              text: "Peka på ramen och mitten i bilden. Fråga: Vad betyder figur 10, och vad står n för?"
            - rubrik: Förutse
              text: Figurer på rutat papper, en tabell, eller en regel ur figuren. Några tror att figur 10 har dubbelt så många som figur 5.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Rita figur 4 och skriv antalen i en tabell.
                Efter några försök: Berätta vad ni har gjort! Ni sa att de mörka blir 4 fler varje gång. Försök använda det!
            - rubrik: Säg inte
              text: Sidan i den ljusa kvadraten är figurens nummer. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Rita figur 4 och räkna båda slagen (16 ljusa och 20 mörka).
                Större: Vilken figur har 100 mörka plattor? (Figur 24) Från vilken figur är de ljusa fler än de mörka? (Figur 5)
            - rubrik: Jämför
              text: "De mörka ökar med 4, en på varje sida. I A syns det i tabellen, och i B i 4n: var och en av de fyra sidorna har n plattor."
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att figur 10 har 48 mörka. Hur kan ni kontrollera att det stämmer med bilden?
                ”Är regeln rätt?” Hur kan ni pröva den på figur 1, 2 och 3?
    - rubrik: "Avancerat, problem 3: Stenplattorna"
      text:
        - Läs problemet och visa hur ni löser det.
