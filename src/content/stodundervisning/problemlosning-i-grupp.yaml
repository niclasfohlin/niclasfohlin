            - "Pröva och förbättra: varje boll i en tabell"
            - medelvärdena på tallinjer
          - - 7. Kvadraten
            - algebra och area
            - "Pröva och förbättra: olika rektanglar"
            - sidan är halva omkretsen
          - - 8. De lutande kvadraterna
            - area och Pythagoras sats
            - "Rita eller bygg: rama in och dra bort"
            - Leta efter ett mönster i en tabell
          - - 9. Staketet
