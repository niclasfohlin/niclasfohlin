  pass:
    rubrik: "Vi kör ett pass: ljusstakarna på slottet"
    textRubrik: Problemet · Bas, problem 5
    text:
      - På ett slott finns 29 ljusstakar. Några av dem har plats för fem ljus, och några har plats för sju ljus. Sammanlagt behövs 187 ljus.
      - Hur många ljusstakar finns det av varje sort?
    repliker:
      - Kan du berätta problemet med egna ord?
      - Vad är det vi ska ta reda på?
      - Vad betyder talen i texten?
    forberett:
      rubrik: Det jag förberedde
      text:
        - "Läst var de kan fastna: i att hålla isär de två okända."
        - "Om ett par kör fast efter några försök: ”Ni sa att 10 sjuarmade gav 165 ljus och 19 gav 183. Försök använda det!”"
    klarTidigt: Kan 30 stakar ge 187 ljus? (Nej) Hur många lösningar finns det, om antalet stakar är fritt? (6)
    schema:
      rubrik: 30 minuter, del för del
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Läs lärarens sida och lös problemet på båda sätten. Kopiera problemets sida, Vår lösning och Två lösningar.
        - tid: 0–5
          fas: 1 · Förstå
          vad: Läs högt. Paren återberättar. Ringa in frågan och skriv på tavlan vad ni vet och ska ta reda på.
        - tid: 5–7
          fas: 2 · Planera
          vad: Paren väljer sätt och gissar svaret, och du skriver det under Vi tror. Ingen räknar än.
        - tid: 7–21
          fas: 3 · Lösa
          vad: Paren prövar och byter penna halvvägs. Du går runt, frågar först och väljer lösningar till Jämföra.
        - tid: 21–28
          fas: 4 · Jämföra
          vad: "Två lösningar, B täckt: vad gör A? Sedan B och parens. Sist felet: 26 sjuarmade och 1 femarmad. Idén i en mening."
        - tid: 28–30
          fas: 5 · Avsluta
          vad: Sätt ord på sättet som fungerade och bocka för det på Våra sätt.
  mall:
    rubrik: Så läste jag problemet med gruppen
    underrad: Tavlan efter passet
    block:
      - typ: tavla
        text: 29 ljusstakar. Några tar 5 ljus, några tar 7 ljus. Totalt 187 ljus.
        fraga: Hur många av varje sort?
        listor:
          - rubrik: Vi vet
            punkter:
              - 29 stakar totalt
              - femarmade och sjuarmade
              - 187 ljus ihop
          - rubrik: Vi ska ta reda på
            punkter:
              - antal femarmade
              - antal sjuarmade
              - = två okända!
          - rubrik: Vi tror
            punkter:
              - "Ebba och Ali: 15 sjuarmade"
              - "Noor och Elias: 20 sjuarmade"
          - rubrik: Samma tanke i båda
            punkter:
              - varje byte ger två ljus till
        tabell:
          rubrik: "Lösning A: en tabell"
          kolumner:
            - femarmade
            - sjuarmade
            - ljus ihop
          rader:
            - - "29"
              - "0"
              - 145, för få
            - - "19"
              - "10"
              - "165"
            - - "9"
              - "20"
              - 185, nästan!
            - - "8"
              - "21"
              - 187 ✓
        annat:
          rubrik: "Lösning B: om alla vore femarmade"
          rader:
            - "Om alla vore femarmade: 29 · 5 = 145"
            - "Saknas: 187 − 145 = 42"
            - Varje sjuarmad ger 2 ljus till → 42 / 2 = 21
            - 29 − 21 = 8 femarmade
            - "Kontroll: 8 · 5 + 21 · 7 = 187 ljus"
        svar: 8 femarmade och 21 sjuarmade
        citat:
          - Kan du berätta problemet med egna ord?
          - Vad betyder talen i texten?
          - Vad är lika i de här sätten? Stämde det vi trodde?
