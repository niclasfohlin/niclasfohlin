lathund:
  innehall: Ett problem per pass
  metoden:
    text:
      - Insatsen är lärarledd problemlösning i liten grupp för elever i åk 4–9 som behöver stöd i att läsa, tolka och lösa problem i text. Metoden har tio problem per nivå, Bas, Medel och Avancerat, med en sida för läraren till varje.
      - Skillnaden mot vanligt grupparbete är att läraren modellerar och frågar. Läraren leder processen, men äger inte lösningen. Gruppen jämför två sätt i varje pass, och över perioden tar eleverna över mer, från att läraren tänker högt till att var och en börjar själv.
    ruta:
      rubrik: "När paret kör fast: stödtrappan"
      inledning: "Fråga först: vad har ni gjort hittills, och varför gjorde ni så?"
      punkter:
        - text: 1 · Vad ska ni ta reda på?
        - text: 2 · Vilka sätt kan ni? Prova ett!
