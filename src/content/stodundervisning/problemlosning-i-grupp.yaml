    - rubrik: "Lärarens sida: Avancerat, problem 4, Udda eller jämnt"
      text:
        - "Sannolikhet med alla utfall: av 10 möjliga par ger 4 en jämn summa och 6 en udda. Spelet är inte rättvist, och chansen att vinna med jämn summa är 4 av 10. Eleverna listar systematiskt och resonerar med udda och jämnt. Material: fem lappar med talen 2 till 6 i en påse. Idén kommer ur nrich, Odds and Evens."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågan, talen på kulorna, och orden ”två kulor samtidigt”, jämnt, udda och rättvist.
            - rubrik: Lyft ut
              text: |-
                Vi vet: fem kulor, 2 till 6, två dras samtidigt, jämn summa vinner.
                Vi ska ta reda på: om båda har lika stor chans att vinna.
            - rubrik: Ord och tal
              text: "Fråga: Vad betyder rättvist, och vilka tal är jämna? Kan samma kula dras två gånger? Är 2 + 4 och 4 + 2 samma par?"
            - rubrik: Förutse
              text: En lista med alla par, en tabell, eller udda och jämnt. Några tror att jämnt vinner oftare, eftersom tre kulor är jämna.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Skriv alla par som kan dras, ett i taget.
                Efter några försök: Berätta vad ni har gjort! Ni sa att två udda tal ger en jämn summa. Försök använda det!
            - rubrik: Säg inte
              text: Jämn summa kräver två jämna eller två udda kulor. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Fyra kulor med talen 2, 3, 4 och 5 (inte rättvist, 2 av 6 par ger jämn summa).
                Större: Vilken kula kan ni ta bort så att spelet blir rättvist? (3 eller 5) Finns det fler svar än 3 och 5? (Nej)
            - rubrik: Jämför
              text: Jämn summa kommer från två jämna eller två udda. I A är det paren 2 + 4, 2 + 6, 4 + 6 och 3 + 5, och i B är det 3 + 1 par.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att det finns 25 par. Hur kan ni kontrollera att det stämmer med problemet?
                Hur vet ni att ni har alla par?
    - rubrik: "Avancerat, problem 4: Udda eller jämnt"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Udda eller jämnt
          rader:
            - - I en påse ligger fem kulor med talen 2, 3, 4, 5 och 6. Du drar två kulor samtidigt och lägger ihop talen. Blir summan ett jämnt tal vinner du. Blir summan ett udda tal vinner din kompis.
        - rubrik: Frågorna
          rader:
            - - Är spelet rättvist? Visa hur ni vet.
    - rubrik: "Två lösningar: Avancerat, problem 4, Udda eller jämnt"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Udda eller jämnt
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - En lista. Eleven skriver alla tio par med summan, från 2 + 3 till 5 + 6. Jämn summa blir det med 2 + 4, 2 + 6, 4 + 6 och 3 + 5. 4 par ger jämn summa och 6 udda, tillsammans 10 par. Spelet är inte rättvist.
              - "Jämnt + jämnt och udda + udda blir jämnt, och jämnt + udda blir udda. Kulorna 2, 4 och 6 är jämna, och 3 och 5 udda. En av varje: 3 · 2 = 6 par. Två jämna: 3. Två udda: 1. Jämn summa: 3 + 1 = 4 par, inte rättvist. Kontroll: 3 + 1 + 6 = 10."
        - rubrik: Frågorna
          rader:
            - - Hur gör eleven i lösning A för att få med alla par?
            - - Varför räknar eleven i lösning B 3 · 2 för en kula av varje slag?
            - - Var syns de fyra paren med jämn summa i båda lösningarna?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med 20 kulor, och varför?
    - rubrik: "Lärarens sida: Avancerat, problem 5, Svamparna"
      text:
        - "Problemet handlar om procent av en helhet som ändras, medan det torra i svamparna väger lika mycket. Vikten minskar med 75 %, så att en fjärdedel är kvar. Eleverna väljer en vikt att räkna med och följer det torra, med tal eller staplar. Material: rutat papper. Idén kommer ur Känguru 2024, Cadet nr 16."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågan, talen 80 % och 20 %, och orden färska, torkade och minskar.
            - rubrik: Lyft ut
              text: |-
                Vi vet: färska är 80 % vatten, torkade 20 % vatten, och bara vatten försvinner.
                Vi ska ta reda på: hur många procent vikten minskar.
            - rubrik: Ord och tal
              text: "Peka på stapelns två delar, vattnet och det torra. Fråga: 80 % av vad? Är helheten densamma för 80 % och 20 %?"
            - rubrik: Förutse
              text: Staplar eller rutor, procent direkt eller ett tal att börja med, som 100 g. Många svarar 60 %, eftersom 80 − 20 = 60.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Välj en vikt för de färska svamparna och räkna.
                Efter några försök: Berätta vad ni har gjort! Ni sa att 100 g färska svampar har 20 g torrt. Försök använda det!
            - rubrik: Säg inte
              text: Det torra väger lika mycket före och efter. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: 100 g svampar är 75 % vatten. De torkar tills de är 50 % vatten. Vad väger de nu? (50 g)
                Större: 100 kg gurkor är 99 % vatten. De torkar tills de är 98 % vatten. Vad väger de nu? (50 kg)
            - rubrik: Jämför
              text: Det torra väger lika mycket före och efter, 20 g i A och 4 rutor i B. Lyft fram att procenten räknas på olika helheter.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att vikten minskar med 60 %. Hur kan ni kontrollera att det stämmer med problemet?
                ”Är 25 g svaret?” Hur kan ni kontrollera att det svarar på frågan?
    - rubrik: "Avancerat, problem 5: Svamparna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Svamparna
          rader:
            - - Färska svampar består till 80 % av vatten. När svamparna torkar, försvinner en del av vattnet. Torkade svampar består till 20 % av vatten.
        - rubrik: Frågorna
          rader:
            - - Med hur många procent minskar vikten när svamparna torkas?
    - rubrik: "Två lösningar: Avancerat, problem 5, Svamparna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Svamparna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "100 g färska svampar är 80 g vatten och 20 g torrt. Det torra är kvar och är 80 % av de torkade. 10 % är 20 / 8 = 2,5 g, och 100 % är 2,5 · 10 = 25 g. 100 − 25 = 75 g mindre, alltså 75 %. Kontroll: 5 g vatten av 25 är 20 %."
              - "Staplar med rutor. De färska är 20 rutor, 16 vatten och 4 torra, alltså 20 % torrt. De 4 torra är 80 % av de torkade, så 1 ruta vatten är kvar. 5 av 20 rutor är kvar, en fjärdedel. Vikten minskar med 75 %. Kontroll: 1 av 5 är 20 %."
        - rubrik: Frågorna
          rader:
            - - Vad gör eleven i lösning A med de 20 g som inte är vatten?
            - - Varför är det 4 torra rutor i båda staplarna i lösning B?
            - - Var syns det i båda lösningarna att det torra väger lika mycket före och efter?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja om svamparna var 90 % vatten, och varför?
    - rubrik: "Lärarens sida: Avancerat, problem 6, Skålarna"
      text:
        - "Problemet handlar om medelvärdet som balanspunkt. En boll som är mindre än medelvärdet höjer det när den tas bort, och en som är större höjer det när den läggs till. Svaret är bollen 7. Eleverna prövar i en tabell och resonerar om medelvärdet. Material: lappar med bollarnas tal, i två högar. Idén kommer ur Känguru 2025, Cadet nr 17."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågan, talen på bollarna, och orden flytta, medelvärdet och ”båda skålarna”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: bollarna i varje skål, och att en boll flyttas från den röda skålen till den blå.
                Vi ska ta reda på: vilken boll som höjer båda medelvärdena.
            - rubrik: Ord och tal
              text: "Peka på skålarna. Fråga: Vad betyder medelvärde, och hur räknar man ut det? Vad händer med summan och antalet bollar när en boll flyttas?"
            - rubrik: Förutse
              text: En tabell där varje boll prövas, eller ett resonemang om medelvärdet. Några tror att det inte går, eftersom medelvärdet i den ena skålen måste minska.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Räkna ut medelvärdet i båda skålarna, och pröva att flytta en boll.
                Efter några försök: Berätta vad ni har gjort! Ni sa att om 11 flyttas blir medelvärdet i den röda mindre. Försök använda det!
            - rubrik: Säg inte
              text: Bollen ska vara mindre än 8 och större än 5. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Den röda skålen har 2, 5 och 11, och den blå 1 och 3 (flytta bollen 5).
                Större: Kan ni flytta en boll från blå till röd, så att båda medelvärdena ökar? Varför? (Nej: bollen skulle behöva vara under 5 och över 8)
            - rubrik: Jämför
              text: Bollen ska vara under det röda medelvärdet och över det blå. I A syns det i tabellen, och i B ligger 7 mellan 5 och 8.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att 3 ska flyttas. Hur kan ni kontrollera att det stämmer med problemet?
                Ni delar summan i den blå med 4. Hur många bollar ligger i den blå nu?
    - rubrik: "Avancerat, problem 6: Skålarna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Skålarna
          rader:
            - - I en röd skål ligger fem bollar med talen 3, 7, 9, 10 och 11. I en blå skål ligger fyra bollar med talen 2, 4, 6 och 8. Du ska flytta en av bollarna i den röda skålen till den blå.
        - rubrik: Frågorna
          rader:
            - - Vilken boll ska du flytta för att medelvärdet ska bli större i båda skålarna?
    - rubrik: "Två lösningar: Avancerat, problem 6, Skålarna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Skålarna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "En tabell. Medelvärdet nu: röd 40 / 5 = 8 och blå 20 / 4 = 5. Eleven prövar att flytta varje boll. Bollen 3 ger röd 9,25 men blå 4,6. Bollen 7 ger röd 33 / 4 = 8,25 och blå 27 / 5 = 5,4, båda större. Bollarna 9, 10 och 11 gör den röda mindre."
              - "Ett resonemang. Medelvärdena är 8 och 5. En boll under 8 som tas bort höjer medelvärdet i röd. En boll över 5 som läggs till höjer det i blå. Bollen ska ligga mellan 5 och 8, och bara 7 gör det. Kontroll: 33 / 4 = 8,25 och 27 / 5 = 5,4."
        - rubrik: Frågorna
          rader:
            - - Vad gör eleven i lösning A med varje boll?
            - - Varför ska bollen i lösning B vara mindre än 8 och större än 5?
            - - Var syns det i båda lösningarna att bollen ska ligga mellan de två medelvärdena?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med 50 bollar i varje skål, och varför?
    - rubrik: "Lärarens sida: Avancerat, problem 7, Kvadraten"
      text:
        - "Problemet handlar om ett samband mellan omkrets och area. Den stora kvadratens sida är rektangelns långa sida plus den korta, alltså halva rektangelns omkrets. Svaret är 400 cm², vilken rektangel det än är. Eleverna prövar med tal och generaliserar. Material: rutat papper och fyra likadana rektanglar av papper. Idén kommer ur Nämnaren 2014:4, Problemavdelningen nr 4123."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågan, talet 40, och orden likadana, omkretsen, area och ”den stora kvadraten”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: fyra likadana rektanglar, var och en med omkretsen 40 cm.
                Vi ska ta reda på: arean av den stora kvadraten.
            - rubrik: Ord och tal
              text: "Peka på en rektangel i bilden, och följ omkretsen runt den. Fråga: Vad mäter 40 cm? Vad är skillnaden på omkrets och area?"
            - rubrik: Förutse
              text: Olika rektanglar som prövas, en ritning, eller ett resonemang om sidan. Några säger att det inte går, eftersom rektangelns mått inte står i texten.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Hitta på en rektangel med omkretsen 40 cm och rita den.
                Efter några försök: Berätta vad ni har gjort! Ni sa att rektangeln 15 och 5 cm gav en stor kvadrat med sidan 20 cm. Försök använda det!
            - rubrik: Säg inte
              text: Den stora kvadratens sida är en lång plus en kort sida, halva omkretsen. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Rektanglarna är 7 cm långa och 3 cm breda (100 cm²).
                Större: Rektanglarna är 15 cm långa. Vilken area har den lilla kvadraten? (100 cm²) Kan den bli hur stor som helst? (Nej, den är alltid mindre än den stora, 400 cm²)
            - rubrik: Jämför
              text: Den stora kvadratens sida är en lång plus en kort sida, 20 cm. I A blir den 20 med varje rektangel, och i B är den 40 / 2.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att arean är 4 · 75 = 300 cm². Hur kan ni kontrollera att det stämmer med bilden?
                ”Gäller svaret för alla rektanglar?” Hur kan ni pröva det?
    - rubrik: "Avancerat, problem 7: Kvadraten"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Kvadraten
          rader:
            - - Fyra likadana rektanglar ligger runt en liten kvadrat. Rektanglarna och den lilla kvadraten bildar tillsammans en stor kvadrat, som på bilden. Varje rektangel har omkretsen 40 cm.
        - rubrik: Frågorna
          rader:
            - - Vilken area har den stora kvadraten?
    - rubrik: "Två lösningar: Avancerat, problem 7, Kvadraten"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Kvadraten
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - Olika rektanglar. En rektangel med sidorna 15 och 5 cm har omkretsen 15 + 5 + 15 + 5 = 40, och den stora kvadratens sida blir 15 + 5 = 20. 12 och 8 ger också 20, och 18 och 2 också. Arean blir 20 · 20 = 400 cm² varje gång.
              - "Ett resonemang. Den stora kvadratens sida är en lång och en kort sida. Omkretsen är två långa och två korta, 40 cm. En lång och en kort är hälften: 40 / 2 = 20 cm. Arean är 20 · 20 = 400 cm². Kontroll med 15 och 5: 15 + 5 = 20."
        - rubrik: Frågorna
          rader:
            - - Vad prövar eleven i lösning A, och vad händer med den stora kvadratens sida?
            - - Varför delar eleven i lösning B omkretsen med 2?
            - - Var syns det i båda lösningarna att den stora kvadratens sida är 20 cm?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja om omkretsen var 46 cm, och varför?
    - rubrik: "Lärarens sida: Avancerat, problem 8, De lutande kvadraterna"
      text:
        - "Problemet leder från area på prickpapper till Pythagoras sats. En kvadrat vars sida går a steg åt höger och b steg uppåt har arean a² + b². Kvadraten med 2 och 1 steg har arean 5, och den med 3 och 2 steg har 13. Eleverna ramar in, räknar och generaliserar. Material: prickpapper och linjal. Idén kommer ur nrich, Tilted Squares."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, stegen 2 och 1 i bilden och 3 och 2 i frågan, och orden lutar, area och ruta.
            - rubrik: Lyft ut
              text: |-
                Vi vet: hur kvadratens sida går, 2 steg åt höger och 1 upp, och vad en ruta är.
                Vi ska ta reda på: arean, och en regel för den.
            - rubrik: Ord och tal
              text: "Följ en sida i bilden, 2 steg åt höger och 1 upp. Fråga: Är kvadratens sida 3 steg lång? Vad mäter ni arean i?"
            - rubrik: Förutse
              text: Hela rutor och delar av rutor som sätts ihop, en ram runt kvadraten, eller en tabell. Några tror att arean är 3 · 3 = 9.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Rita in rutorna. Vilka delar av rutor kan ni sätta ihop till hela?
                Efter några försök: Berätta vad ni har gjort! Ni sa att en hel ruta ligger i mitten. Försök använda det!
            - rubrik: Säg inte
              text: Rita en kvadrat runt den som lutar och ta bort trianglarna i hörnen. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Sidan går 1 steg åt höger och 1 uppåt (2 rutor).
                Större: Vilka areor kan en kvadrat på prickpapper ha? (a² + b², som 1, 2, 4, 5, 8, 9, 10 och 13) Går det att rita en med arean 3? (Nej)
            - rubrik: Jämför
              text: Arean är a² + b², där a och b är stegen. I A är ramen minus trianglarna 25 − 12 = 13, och i B 3² + 2² = 9 + 4 = 13. Lyft fram Pythagoras sats.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att arean är 9 rutor. Hur kan ni kontrollera att det stämmer med bilden?
                ”Är regeln rätt?” Hur kan ni pröva den på en ny kvadrat?
    - rubrik: "Avancerat, problem 8: De lutande kvadraterna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: De lutande kvadraterna
          rader:
            - - På prickpapper går det att rita kvadrater som lutar. Kvadratens sida på bilden går 2 steg åt höger och 1 steg uppåt. Ni räknar arean i rutor, och en ruta är den minsta kvadraten mellan fyra prickar.
        - rubrik: Frågorna
          rader:
            - - Vilken area har kvadraten på bilden?
            - - Vilken area har en kvadrat vars sida går 3 steg åt höger och 2 steg uppåt? Finns det en regel?
    - rubrik: "Två lösningar: Avancerat, problem 8, De lutande kvadraterna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: De lutande kvadraterna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "En ram. Kvadraten med 2 och 1 steg får en ram på 3 · 3 = 9. I hörnen sitter fyra trianglar på 2 · 1 / 2 = 1 ruta var, och 9 − 4 = 5. Med 3 och 2 steg: ramen 5 · 5 = 25, trianglarna 4 · 3 · 2 / 2 = 12, och 25 − 12 = 13."
              - "En tabell. Arean för flera kvadrater: 1 och 1 steg ger 2, 2 och 1 ger 5, 3 och 1 ger 10, 2 och 2 ger 8. Arean är stegen i kvadrat lagda ihop, a² + b². 3 och 2 steg: 3² + 2² = 9 + 4 = 13. Kontroll: 2² + 1² = 5."
        - rubrik: Frågorna
          rader:
            - - Vad gör eleven i lösning A med ramen och trianglarna?
            - - Hur ser eleven i lösning B regeln i tabellen?
            - - Var syns det i båda lösningarna att kvadraten med 3 och 2 steg har arean 13?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med 7 och 4 steg, och varför?
    - rubrik: "Lärarens sida: Avancerat, problem 9, Staketet"
      text:
        - "Problemet handlar om största arean med 60 m staket. Hagen blir störst som en kvadrat, 15 · 15 = 225 m², och mot en vägg 15 · 30 = 450 m². Eleverna ritar, gör en tabell och ser arean som en funktion. Material: rutat papper och ett snöre på 60 cm. Idén kommer ur Problembanken åk 7–9, problem 9."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talet 60, och orden rektangulär, ”så stor som möjligt”, vägg och ”de tre andra”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: 60 m staket, en rektangel, och sedan en vägg som en sida.
                Vi ska ta reda på: måtten som ger störst area, båda gångerna.
            - rubrik: Ord och tal
              text: "Peka på väggen i bilden. Fråga: Vad mäter 60 m, omkretsen eller arean? Är det omkretsen också mot väggen? Vad betyder ”så stor som möjligt”?"
            - rubrik: Förutse
              text: Hagar som ritas på rutat papper, en tabell med sidorna, eller en formel och en graf. Mot väggen tror många att kvadraten är bäst igen.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Rita några hagar med 60 m staket och räkna arean.
                Efter några försök: Berätta vad ni har gjort! Ni sa att 10 och 20 m gav 200 m², och 12 och 18 gav mer. Försök använda det!
            - rubrik: Säg inte
              text: Kvadraten är störst, och mot väggen blir längden dubbelt så stor som bredden. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Pröva samma problem med 20 m staket, i hela meter (5 · 5 = 25 m², och mot väggen 5 · 10 = 50 m²).
                Större: Hagen ska ligga i ett hörn, med två väggar som sidor. Hur stor kan den bli nu? (30 och 30 m, 900 m²)
            - rubrik: Jämför
              text: Arean blir störst i mitten, där talen i tabellen vänder. I A syns det när bredden 14 och 16 ger samma area, och i B i grafens topp, mitt emellan b och 30 − b.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att en kvadrat med sidan 20 m är bäst mot väggen. Hur kan ni kontrollera att det stämmer med problemet?
                ”Är 15 m svaret?” Vilka är måtten, och hur stor blir hagen?
    - rubrik: "Avancerat, problem 9: Staketet"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Staketet
          rader:
            - - Ni har 60 m staket till en rektangulär hage för getter. Hagen ska bli så stor som möjligt. Sedan bygger ni hagen mot en lång vägg i stället, så att väggen blir en sida och staketet räcker till de tre andra.
        - rubrik: Frågorna
          rader:
            - - Vilka mått ger den största hagen med staket runt om, och hur stor blir den?
            - - Vilka mått ger den största hagen mot väggen, och hur stor blir den?
    - rubrik: "Två lösningar: Avancerat, problem 9, Staketet"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Staketet
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - Två tabeller. Runt om är bredden och längden tillsammans 30 m. 15 och 15 ger 225 m², och 14 och 16 ger 224. Mot väggen är två bredder och en längd 60 m. 15 och 30 ger 450, och 14 och 32 eller 16 och 28 ger 448.
              - "Ett uttryck och en graf. Arean b · (30 − b) är lika stor för b och 30 − b, så toppen ligger mitt emellan: 15 · 15 = 225 m². 14 · 16 = 224 och 13 · 17 = 221 är mindre. Mot väggen är arean b · (60 − 2b), dubbelt så stor, med toppen 15 · 30 = 450."
        - rubrik: Frågorna
          rader:
            - - Vad gör eleven i lösning A, och hur vet eleven att 15 är bäst?
            - - Varför är arean mot väggen dubbelt så stor som runt om i lösning B?
            - - Var syns det i båda lösningarna att arean är störst när bredden är 15 m?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med 50 m staket, och varför?
    - rubrik: "Lärarens sida: Avancerat, problem 10, Alla summor"
      text:
        - "Problemet handlar om kombinatorik och leder till potenser. Talet 4 kan skrivas som en summa på 8 sätt, 5 på 16 och 10 på 512, när ordningen räknas. Antalet fördubblas, och talet n ger 2 upphöjt till (n − 1). Eleverna listar systematiskt och förklarar mönstret med klossar. Material: tio klossar eller kuber. Idén kommer ur Problembanken åk 7–9, problem 15."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talen 4, 5 och 10, och orden summa, ”positiva heltal” och ”ordningen räknas”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: 3 kan skrivas på fyra sätt, och 2 + 1 och 1 + 2 är olika.
                Vi ska ta reda på: antalet sätt för 4, 5 och 10.
            - rubrik: Ord och tal
              text: "Fråga: Vad är ett positivt heltal? Varför är 2 + 1 och 1 + 2 två sätt? Räknas 0 + 3?"
            - rubrik: Förutse
              text: En lista ordnad efter första talet eller efter antalet tal, klossar eller ett mönster. Många missar sätt när de listar utan ordning.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Skriv alla sätt för 4 och ordna listan.
                Efter några försök: Berätta vad ni har gjort! Ni sa att talen 1, 2, 3 och 4 kan skrivas på 1, 2, 4 och 8 sätt. Försök använda det!
            - rubrik: Säg inte
              text: Varje lucka mellan klossarna får en avdelare eller inte. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Ta talen 1 och 2 först och sedan 4 (1, 2 och 8 sätt).
                Större: Om ordningen inte räknas, är 2 + 1 och 1 + 2 samma sätt. Hur många sätt finns det då för 4 och 5? (5 och 7 sätt)
            - rubrik: Jämför
              text: Antalet fördubblas när talet ökar med 1. I A syns det i tabellen, och i B ger varje ny lucka två val, 2 · 2 · 2 = 8 för 4.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att 4 kan skrivas på 5 sätt. Hur kan ni kontrollera att det stämmer med problemet?
                Hur vet ni att ni har alla sätt?
    - rubrik: "Avancerat, problem 10: Alla summor"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Alla summor
          rader:
            - - "Talet 3 kan skrivas som en summa av positiva heltal på fyra sätt, när ordningen räknas: 3, 2 + 1, 1 + 2 och 1 + 1 + 1. Talet själv räknas också som ett sätt."
        - rubrik: Frågorna
          rader:
            - - På hur många sätt kan talen 4 och 5 skrivas så?
            - - På hur många sätt kan 10 skrivas så? Förklara hur ni vet.
    - rubrik: "Två lösningar: Avancerat, problem 10, Alla summor"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Alla summor
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - En lista i ordning efter hur många tal summan har. För 4 blir det 1 + 3 + 3 + 1 = 8 sätt. Talen 1 till 5 ger 1, 2, 4, 8 och 16 sätt i en tabell. Antalet fördubblas, och för 10 blir det 16 · 2 · 2 · 2 · 2 · 2 = 512.
              - "Klossar på rad. 4 klossar har tre luckor, och varje lucka får en avdelare eller inte: 2 · 2 · 2 = 8 sätt. 5 klossar har fyra luckor: 16 sätt. 10 klossar har 9 luckor: 2 · 2 · 2 · 2 · 2 · 2 · 2 · 2 · 2 = 512. Kontroll: 3 ger 2 · 2 = 4 sätt."
        - rubrik: Frågorna
          rader:
            - - Hur ordnar eleven listan i lösning A så att inget sätt fattas?
            - - Varför ger varje lucka två val i lösning B?
            - - Var syns det i båda lösningarna att antalet fördubblas?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja för talet 20, och varför?
