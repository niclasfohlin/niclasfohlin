    - rubrik: "Två lösningar: Avancerat, problem 1, Cykelförrådet"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Cykelförrådet
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "En tabell. 11 tvåhjulingar och 0 trehjulingar ger 22 hjul, för få. 9 och 2 ger 24. 7 och 4 ger 26. 6 och 5 ger 27, som stämmer. Så räknade eleven raden 7 och 4: 7 · 2 = 14, 4 · 3 = 12 och 14 + 12 = 26."
              - "En ekvation. x är antalet trehjulingar och 11 − x antalet tvåhjulingar. 3x + 2(11 − x) = 27 blir 3x + 22 − 2x = 27 och x + 22 = 27, där 22 är hjulen om alla har två. x = 27 − 22 = 5 trehjulingar, och 11 − 5 = 6 tvåhjulingar. Kontroll: 5 · 3 + 6 · 2 = 27."
        - rubrik: Frågorna
          rader:
            - - Vad gör eleven i lösning A från rad till rad?
            - - Varför skriver eleven i lösning B 11 − x för tvåhjulingarna?
            - - Var syns det i båda lösningarna att en trehjuling har ett hjul mer än en tvåhjuling?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med 110 cyklar och 270 hjul, och varför?
    - rubrik: "Lärarens sida: Avancerat, problem 2, Glasstapeln"
      text:
        - "Ett linjärt samband: varje glas ger lika mycket till, men höjden är inte proportionell mot antalet glas. Svaret är 6 glas, en stapel på 34 cm. Eleverna tecknar ett uttryck, 10 + 4n, ur en tabell eller en bild och löser en ekvation. Material: muggar som går att stapla, och en linjal. Idén kommer ur Känguru 2022, Cadet nr 10."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågan, talen 36, 2, 18, 8 och 42, och orden ”staplas i varandra” och ”mellan hyllorna”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: 36 cm mellan hyllorna, 2 glas är 18 cm och 8 glas 42 cm.
                Vi ska ta reda på: hur många glas en stapel mellan hyllorna kan ha.
            - rubrik: Ord och tal
              text: "Visa bilden, eller ställ två muggar i varandra, så att eleverna ser vad staplas betyder. Fråga: Vad mäter 18, och vad mäter 36?"
            - rubrik: Förutse
              text: En tabell med ett glas i taget, en ritad stapel, eller ett uttryck. Några tror att ett glas är 9 cm, eftersom 2 glas är 18 cm.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Gör en tabell med antal glas och höjd.
                Efter några försök: Berätta vad ni har gjort! Ni sa att 6 glas till gav 24 cm till. Försök använda det!
            - rubrik: Säg inte
              text: Varje glas ger 4 cm till, och foten är 10 cm. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: 2 glas är 18 cm, 3 glas är 22 cm och det är 32 cm mellan hyllorna (5 glas, 30 cm).
                Större: Hur hög är en stapel med 20 glas? (90 cm) Hur många glas ryms under 1 m? (22)
            - rubrik: Jämför
              text: Varje glas ger 4 cm till. I A växer höjden med 4 cm per rad, och i B är det 4n. Lyft fram att foten, 10 cm, inte växer.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att 9 glas får plats. Hur kan ni kontrollera att det stämmer med problemet?
                Ni säger att det blir 6,5 glas. Hur kan ni kontrollera att det svarar på frågan?
    - rubrik: "Avancerat, problem 2: Glasstapeln"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Glasstapeln
          rader:
            - - I ett skåp är det 36 cm mellan två hyllor. Glasen i skåpet är likadana och staplas i varandra. En stapel med 2 glas är 18 cm hög. En stapel med 8 glas är 42 cm hög.
        - rubrik: Frågorna
          rader:
            - - Hur många glas kan stå i en stapel mellan hyllorna?
    - rubrik: "Två lösningar: Avancerat, problem 2, Glasstapeln"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Glasstapeln
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - En tabell. Från 2 till 8 glas är 8 − 2 = 6 glas mer och 42 − 18 = 24 cm mer, och 24 / 6 = 4 cm per glas. 3 glas 22 cm, 4 glas 26, 5 glas 30, 6 glas 34, som ryms, och 7 glas 38, för högt.
              - "En ekvation. Varje glas ger (42 − 18) / 6 = 4 cm till, och foten är 18 − 2 · 4 = 10 cm. n glas är 10 + 4n cm. 10 + 4n = 36 ger n = 26 / 4 = 6,5. Det blir 6 hela glas. Kontroll: 10 + 4 · 6 = 34 och 10 + 4 · 7 = 38."
        - rubrik: Frågorna
          rader:
            - - Vad gör eleven i lösning A från rad till rad?
            - - Varför räknar eleven i lösning B 18 − 2 · 4?
            - - Var syns det i båda lösningarna att varje glas ger 4 cm till?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja om hyllorna var 2 m isär, och varför?
    - rubrik: "Lärarens sida: Avancerat, problem 3, Stenplattorna"
      text:
        - "Ett mönster som växer: figur n har n² ljusa plattor och 4n + 4 mörka. Figur 5 har 25 ljusa och 24 mörka, och figur 10 har 100 och 44. Eleverna går från en tabell till en regel och ser figuren på två sätt. Material: rutat papper eller brickor. Idén kommer ur Hagland, Hedrén och Taflin (2005) och Lithner m.fl. (2025)."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
