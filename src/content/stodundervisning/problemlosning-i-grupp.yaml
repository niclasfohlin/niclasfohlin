    text: "Lösning B, ett uttryck och en graf. Arean b · (30 − b) är lika stor för b och 30 − b, så toppen ligger mitt emellan: 15 · 15 = 225 m². 14 · 16 = 224 och 13 · 17 = 221 är mindre. Mot väggen är arean b · (60 − 2b) = 2 · b · (30 − b), dubbelt så stor som runt om för varje b, med topp i 15: 15 · 30 = 450 m². Kontroll: 15 + 30 + 15 = 60."
    efter: "ram: Två lösningar: Avancerat, problem 9, Staketet"
  - nr: 88
    rubrik: Avancerat, problem 10 · Alla summor
    text: "De fyra sätten att skriva 3, ritade som klossar på rad: 3, 2 + 1, 1 + 2 och 1 + 1 + 1."
    efter: "ram: Avancerat, problem 10: Alla summor"
  - nr: 89
    rubrik: Avancerat, problem 10 · Lösning A
    text: "Lösning A, en lista. Sätten för 4 ordnade efter hur många tal summan har: 4, sedan 3 + 1, 1 + 3 och 2 + 2, sedan 2 + 1 + 1, 1 + 2 + 1 och 1 + 1 + 2, och sist 1 + 1 + 1 + 1. 1 + 3 + 3 + 1 = 8 sätt. Talen 1 till 5 ger 1, 2, 4, 8 och 16 sätt. Antalet fördubblas, och för 10 blir det 16 · 2 · 2 · 2 · 2 · 2 = 512."
    efter: "ram: Två lösningar: Avancerat, problem 10, Alla summor"
  - nr: 90
    rubrik: Avancerat, problem 10 · Lösning B
    text: "Lösning B, klossar på rad. 4 är fyra klossar med tre luckor. Varje lucka får en avdelare eller inte, och 1 | 3 är 1 + 3. Tre luckor med två val var ger 2 · 2 · 2 = 8 sätt. 10 klossar har 9 luckor: 2 · 2 · 2 · 2 · 2 · 2 · 2 · 2 · 2 = 512. Kontroll: 3 har två luckor och 2 · 2 = 4 sätt."
    efter: "ram: Två lösningar: Avancerat, problem 10, Alla summor"
ramar:
  rubrik: Problemen
  text:
    - "Problemen står nivå för nivå, och varje nivå börjar med en översikt över de tio problemen. Varje problem har tre sidor: lärarens sida, problemets sida med bilden och bladet Två lösningar. Sist står bladet Vår lösning, kortet Våra sätt och kartläggningen."
  ramar:
    - rubrik: "Lärarens sidor: Bas"
      text:
        - Här står de tio problemen på nivån Bas, som ligger nära åk 4–5, i den ordning gruppen tar dem.
      oversikt:
        kolumner:
          - Problemet
          - Matematiken
          - Lösning A
          - Lösning B
        rader:
          - - 1. Äpplena
            - räkna baklänges, del och helhet
            - "Gör en tabell: pröva 2, 3 och 4 ur varje"
            - Räkna baklänges från det som är kvar
          - - 2. Fiskebodarna
            - ett mönster som växer
            - "Gör en tabell: 4 stickor till per bod"
            - "Leta efter ett mönster: 1 sticka och 4 per bod"
          - - 3. Kexen
            - jämna ut, som ett medelvärde
            - "Rita eller bygg: jämna ut i staplar"
            - räkna alla kex och dela med 3
          - - 4. Chokladbollarna
            - proportionalitet
            - "Gör en tabell: 10, 20 och 30 bollar"
            - "Börja med mindre tal: 10 bollar tre gånger"
          - - 5. Ljusstakarna
            - två okända tal
            - Pröva och förbättra i en tabell
            - Tänk dig att alla är av samma sort
          - - 6. Tornet
            - ett mönster av kuber
            - "Leta efter ett mönster: lager för lager"
            - "Rita eller bygg: stolpen och fyra trappor"
          - - 7. Matcherna
            - kombinatorik
            - "Gör en lista: lag för lag i ordning"
            - "Rita eller bygg: prickar och streck"
          - - 8. Tärningarna
            - sannolikhet
            - kasta 36 gånger och sätt streck
            - "Gör en tabell: alla 36 utfall"
          - - 9. Parken
            - omkrets och varv
            - "Gör en tabell: meter efter varje varv"
            - "Rita eller bygg: hopp på tallinjer"
          - - 10. Vågen
            - likheter med tre okända
            - lägg ihop alla tre vågarna
            - jämför vågarna två och två
      delar:
        - rubrik: Så använder du problemen
          falt:
            - rubrik: Ordningen
              text: Ta problemen i ordning, ett per pass, och byt ordning när gruppen behöver arbeta med ett annat område eller ett problem som liknar det förra. De första är lättast att börja på.
            - rubrik: Kopiorna
              text: Kopiera problemets sida till varje par, eller visa den på tavlan. I Jämföra får varje par bladet Två lösningar, med B under ett papper tills gruppen har sagt vad A gör.
    - rubrik: "Lärarens sida: Bas, problem 1, Äpplena"
      text:
        - "Problemet handlar om del och helhet och om att räkna baklänges. Svaret är 4 äpplen ur varje påse, och påsarna hade 5, 6, 7 och 7. Eleverna lägger ihop, delar lika och ser att ett äpple mer ur varje påse ger fyra äpplen mer från början. Material: kuber, 25 per par. Idén kommer ur Känguru 2026, Ecolier nr 11."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, orden ”lika många” och ”kvar”, talet 25 och de fyra talen 1, 2, 3 och 3.
            - rubrik: Lyft ut
              text: |-
                Vi vet: 25 äpplen i fyra påsar, lika många ur varje, och 1, 2, 3 och 3 blir kvar.
                Vi ska ta reda på: hur många ur varje påse, och hur många från början.
            - rubrik: Ord och tal
              text: "Visa bilden: påsarna visar det som är kvar, rutorna det Elsa tar och klammern alla äpplen från början. Fråga: Vad räknar 25, och vad räknar 1, 2, 3 och 3?"
            - rubrik: Förutse
              text: Eleverna lägger kuber i fyra högar, prövar ett antal eller räknar det som är kvar först. Ofta svarar någon 9 eller 16.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Gissa hur många Elsa tog ur varje påse, och räkna hur många det blir från början.
                Efter några försök: Berätta vad ni har gjort! Ni sa att 3 ur varje påse gav 21 äpplen från början. Försök använda det!
            - rubrik: Säg inte
              text: Räkna först det som är kvar och dra bort det från 25. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: 13 äpplen, och 1, 2, 1 och 1 kvar (2 ur varje).
                Större: Kan det ha funnits 27 äpplen från början? (Nej: (27 − 9) / 4 går inte jämnt ut) Vilka antal äpplen går, om 1, 2, 3 och 3 blir kvar? (13, 17, 21 och så vidare)
            - rubrik: Jämför
              text: Det Elsa tar ur påsarna är fyra lika delar. I A växer summan med 4 från rad till rad, och i B delar eleven 16 i fyra lika delar.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att svaret är 9. Hur kan ni kontrollera att det svarar på frågan?
                Ni säger att påsarna hade lika många från början. Hur kan ni kontrollera det mot problemet?
    - rubrik: "Bas, problem 1: Äpplena"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Äpplena
          rader:
            - - Fyra påsar med äpplen står på bänken. I påsarna finns 25 äpplen tillsammans. Elsa tar lika många äpplen ur varje påse. Sedan finns det 1, 2, 3 och 3 äpplen kvar i påsarna.
        - rubrik: Frågorna
          rader:
            - - Hur många äpplen tog Elsa ur varje påse?
            - - Hur många äpplen fanns det i varje påse från början?
    - rubrik: "Två lösningar: Bas, problem 1, Äpplena"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Äpplena
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - En tabell. Med 2 ur varje påse hade påsarna 3, 4, 5 och 5 äpplen från början, 17 ihop, för få. Med 3 ur varje blir det 21, och med 4 ur varje 5 + 6 + 7 + 7 = 25. Summan växer med 4 från rad till rad.
              - "Räkna baklänges. Kvar är 1 + 2 + 3 + 3 = 9 äpplen. Elsa tog 25 − 9 = 16 äpplen. De delas i fyra lika delar: 16 / 4 = 4 ur varje påse. Kontroll: 5 + 6 + 7 + 7 = 25."
        - rubrik: Frågorna
          rader:
            - - Vad ändrar eleven i lösning A från rad till rad, och vad händer med summan?
            - - Varför räknar eleven i lösning B först de äpplen som är kvar?
            - - Var syns det i båda lösningarna att det Elsa tog är fyra lika delar?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med 10 påsar och 100 äpplen, och varför?
    - rubrik: "Lärarens sida: Bas, problem 2, Fiskebodarna"
      text:
        - "Problemet handlar om ett mönster som växer, där varje ny bod tar fyra stickor till. Svaret är 25 stickor till 6 bodar och 81 till 20 bodar. Eleverna bygger, för in i en tabell och beskriver mönstret med ord. Material: tändstickor eller glasspinnar, 30 per par. Idén kommer ur NCM:s Strävorna 4B/5B, Fiskebodar."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talen 6 och 20, och orden ”i rad” och ”delar på en vägg”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: en bod har fem stickor, och två bodar i rad delar på en vägg.
                Vi ska ta reda på: antalet stickor till 6 och till 20 bodar.
            - rubrik: Ord och tal
              text: "Peka på golvet, väggarna och taket, och på väggen som två bodar delar. Fråga: Vad räknar 6 och 20, och vad ska vi räkna?"
            - rubrik: Förutse
              text: Eleverna bygger bodar, gör en tabell där talen ökar med 4 eller räknar en sticka och 4 per bod. Någon räknar 6 · 5 = 30 och glömmer de delade väggarna.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Bygg 1, 2 och 3 bodar och räkna stickorna.
                Efter några försök: Berätta vad ni har gjort! Ni sa att varje ny bod tog 4 stickor. Försök använda det!
            - rubrik: Säg inte
              text: Börja med en sticka och lägg till fyra för varje bod. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: 4 bodar och 10 bodar (17 och 41 stickor).
                Större: Hur många stickor behövs till 99 bodar? (397) Skriv med ord en regel som gäller för alla bodar. (En sticka, och sedan 4 för varje bod)
            - rubrik: Jämför
              text: Varje ny bod tar 4 stickor till. I A ökar stickorna med 4 från rad till rad, och i B syns det i 6 · 4 och 20 · 4.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att det blir 30 stickor. Hur kan ni kontrollera att det stämmer med problemet?
                Ni säger att 20 bodar tar dubbelt så många som 10. Hur kan ni kontrollera det med 2 och 4 bodar?
    - rubrik: "Bas, problem 2: Fiskebodarna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Fiskebodarna
          rader:
            - - Lisa bygger fiskebodar av stickor. En bod har ett golv, två väggar och ett tak av två stickor. När bodarna står i rad, delar två bodar på en vägg. Bilden visar en bod och tre bodar i rad.
        - rubrik: Frågorna
          rader:
            - - Hur många stickor behövs till 6 bodar i rad?
            - - Hur många stickor behövs till 20 bodar i rad?
    - rubrik: "Två lösningar: Bas, problem 2, Fiskebodarna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Fiskebodarna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "En tabell. 1 bod har 5 stickor, 2 bodar 9 och 3 bodar 13. Varje ny bod tar 4 stickor till. Tabellen fortsätter: 6 bodar ger 25 stickor, 10 bodar 41 och 20 bodar 81."
              - "Se strukturen. Den första väggen är 1 sticka, och varje bod tar 4 stickor till: golvet, taket av två stickor och väggen till höger. 6 bodar: 1 + 6 · 4 = 25. 20 bodar: 1 + 20 · 4 = 81. Kontroll: 3 bodar ger 1 + 3 · 4 = 13, som på bilden."
        - rubrik: Frågorna
          rader:
            - - Hur fortsätter eleven tabellen i lösning A från rad till rad?
            - - Varför börjar eleven i lösning B med 1 sticka?
            - - Var syns det i båda lösningarna att varje ny bod tar 4 stickor till?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja för 99 bodar, och varför?
    - rubrik: "Lärarens sida: Bas, problem 3, Kexen"
      text:
        - "Problemet handlar om att dela lika när delarna är olika stora från början. Det är idén bakom medelvärdet. Svaret är 9 kex var, och från brickan får Omar 6, Saga 5 och Liam 4. Eleverna lägger ihop, delar lika och jämnar ut. Material: kuber eller kex, 32 per par. Idén kommer ur Känguru 2025, Ecolier nr 11."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talen 3, 4, 5 och 15, och orden ”lika många” och ”från brickan”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: faten har 3, 4 och 5 kex, brickan 15. Alla ska ha lika många.
                Vi ska ta reda på: hur många var och en har till slut och får från brickan.
            - rubrik: Ord och tal
              text: "Peka på faten, brickan och kexen på bilden. Fråga: Vad räknar 15? Betyder ”lika många” att alla får lika många från brickan?"
            - rubrik: Förutse
              text: Eleverna delar ut kex eller kuber, jämnar ut staplar eller räknar alla kex först. Någon delar 15 / 3 = 5.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Lägg ut kexen med kuber och dela ut från brickan.
                Efter några försök: Berätta vad ni har gjort! Ni sa att alla kan ha 5, som Liam. Försök använda det!
            - rubrik: Säg inte
              text: Lägg ihop alla kexen och dela med 3. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Faten har 1, 2 och 3 kex, och brickan 6 (4 var).
                Större: Ett fjärde barn kommer med 5 kex på sitt fat. Hur många får var och en från brickan nu? (Alla har 8: 5, 4, 3 och 3 från brickan)
            - rubrik: Jämför
              text: Den som har minst får mest från brickan, så att alla har 9. I A syns det i staplarna, och i B i uträkningarna 9 − 3, 9 − 4 och 9 − 5.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att alla får 5 från brickan. Hur kan ni kontrollera att det stämmer med problemet?
                ”Är svaret 9 kex från brickan?” Hur kan ni kontrollera att det svarar på frågan?
    - rubrik: "Bas, problem 3: Kexen"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Kexen
          rader:
            - - Tre barn har var sitt fat med kex. På Omars fat ligger 3 kex, på Sagas 4 och på Liams 5. På en bricka ligger 15 kex till. Barnen delar på kexen från brickan, så att alla tre har lika många kex till slut.
        - rubrik: Frågorna
          rader:
            - - Hur många kex har vart och ett av barnen till slut?
            - - Hur många kex från brickan får vart och ett av barnen?
    - rubrik: "Två lösningar: Bas, problem 3, Kexen"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Kexen
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "Jämna ut. Först får Omar 2 kex och Saga 1, så att alla har 5. Då är 15 − 3 = 12 kex kvar på brickan, och 12 / 3 = 4 var. Alla har 5 + 4 = 9. Från brickan: Omar 6, Saga 5 och Liam 4."
              - "Räkna alla kex. 3 + 4 + 5 + 15 = 27 kex, och 27 / 3 = 9 kex var. Från brickan: Omar 9 − 3 = 6, Saga 9 − 4 = 5 och Liam 9 − 5 = 4. Kontroll: 6 + 5 + 4 = 15."
        - rubrik: Frågorna
          rader:
            - - Varför ger eleven i lösning A först kex till Omar och Saga?
            - - Varför räknar eleven i lösning B alla kexen, också de på faten?
            - - Var syns det i båda lösningarna att den som har minst får mest från brickan?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med 10 barn, och varför?
    - rubrik: "Lärarens sida: Bas, problem 4, Chokladbollarna"
      text:
        - "Problemet handlar om proportionalitet: fler bollar kräver mer av allt, i samma förhållande. Svaret är 6 dl havregryn, 3 dl socker, 150 g smör och 3 msk kakao. Eleverna halverar receptet och lägger ihop, eller tar halva receptet tre gånger. Idén kommer ur Skolverkets Problembank för årskurs 4–6, Chokladbollar."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågan, talen 20 och 30 bollar, och receptets mått.
            - rubrik: Lyft ut
              text: |-
                Vi vet: receptet räcker till 20 bollar, med 4 dl havregryn, 2 dl socker, 100 g smör och 2 msk kakao.
                Vi ska ta reda på: måtten för 30 bollar.
            - rubrik: Ord och tal
              text: "Visa receptkortet och reda ut vad dl, g och msk betyder. Fråga: Vad räknar 20 och 30?"
            - rubrik: Förutse
              text: Eleverna gör en tabell med 10 bollar, tar halva receptet tre gånger eller räknar per boll. Någon lägger till 1 på varje mått och får 5 dl havregryn.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Prova ett enklare problem med färre bollar.
                Efter några försök: Berätta vad ni har gjort! Ni sa att 10 bollar är hälften av receptet. Försök använda det!
            - rubrik: Säg inte
              text: Räkna ut receptet för 10 bollar först. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Bara havregrynet, 2 dl till 10 bollar. Hur mycket till 15 bollar? (3 dl)
                Större: Hur mycket behövs till 50 bollar? (10 dl havregryn, 5 dl socker, 250 g smör och 5 msk kakao) Hur många bollar räcker 1 kg smör till? (200)
            - rubrik: Jämför
              text: Varje 10 bollar kräver en sats, alltså halva receptet. I A lägger eleven en sats till receptet för 20, och i B tar eleven satsen tre gånger.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att det blir 5 dl havregryn, en dl till. Hur kan ni kontrollera att det stämmer med problemet?
                ”Är svaret 6 dl havregryn?” Hur kan ni kontrollera att det svarar på frågan?
    - rubrik: "Bas, problem 4: Chokladbollarna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Chokladbollarna
          rader:
            - - Gruppen vill göra 30 chokladbollar till klassens fest. Receptet räcker till 20 bollar, och till dem behövs 4 dl havregryn, 2 dl socker, 100 g smör och 2 msk kakao.
        - rubrik: Frågorna
          rader:
            - - Hur mycket av varje sak behövs till 30 chokladbollar?
    - rubrik: "Två lösningar: Bas, problem 4, Chokladbollarna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Chokladbollarna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "En tabell. Först halva receptet, till 10 bollar: 2 dl, 1 dl, 50 g och 1 msk. Raden för 30 är raderna för 20 och 10 ihop: 4 + 2 = 6 dl havregryn, 2 + 1 = 3 dl socker, 100 + 50 = 150 g smör och 2 + 1 = 3 msk kakao."
              - "En sats för 10 bollar, tre gånger. Halva receptet är en sats för 10 bollar. 30 bollar är 3 satser: 3 · 2 = 6 dl havregryn, 3 · 1 = 3 dl socker, 3 · 50 = 150 g smör och 3 · 1 = 3 msk kakao. Kontroll: 2 · 2 = 4 dl till 20 bollar."
        - rubrik: Frågorna
          rader:
            - - Hur får eleven i lösning A raden för 30 bollar?
            - - Varför tar eleven i lösning B varje mått gånger 3?
            - - Var syns satsen för 10 bollar i båda lösningarna?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja för 70 bollar, och varför?
    - rubrik: "Lärarens sida: Bas, problem 5, Ljusstakarna"
      text:
        - Problemet handlar om två okända tal som hänger ihop, antalet femarmade och antalet sjuarmade. Svaret är 8 femarmade och 21 sjuarmade. Eleverna räknar med multiplikation och addition i flera steg och ser att varje byte från femarmad till sjuarmad ger två ljus till. Problemet kommer ur Lithner m.fl. (2025).
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågan, talen 29 och 187, och orden ”fem ljus” och ”sju ljus”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: 29 stakar, 187 ljus, fem eller sju ljus i varje.
                Vi ska ta reda på: hur många av varje sort, två okända tal.
            - rubrik: Ord och tal
              text: "Peka på bilden och reda ut femarmad och sjuarmad. Fråga: Vad räknar 29, och vad räknar 187?"
            - rubrik: Förutse
              text: Eleverna prövar antal, ritar stakar, gör en tabell eller tänker sig alla femarmade först. Ett vanligt fel är 26 sjuarmade och 1 femarmad, som bara är 27 stakar.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Prova hur många av varje sort det kan vara, och räkna ljusen.
                Efter några försök: Berätta vad ni har gjort! Ni sa att 10 sjuarmade gav 165 ljus och 19 gav 183. Försök använda det!
            - rubrik: Säg inte
              text: Börja med 29 femarmade och byt en i taget. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: 8 stakar och 46 ljus (3 sjuarmade).
                Större: Kan 30 stakar ge 187 ljus? (Nej: 187 − 150 = 37 är udda) Hur många lösningar finns det, om antalet stakar är fritt? (6: 1, 6, 11, 16, 21 eller 26 sjuarmade)
            - rubrik: Jämför
              text: En sjuarmad har två ljus mer än en femarmad. I A ger tio byten 20 ljus, och i B delar eleven de 42 ljusen med 2.
            - rubrik: Fel eller osäker
              text: |-
                En elev svarade 26 sjuarmade och 1 femarmad. Hur kan ni kontrollera det mot problemet?
                ”Är svaret 187?” Hur kan ni kontrollera att det svarar på frågan?
    - rubrik: "Bas, problem 5: Ljusstakarna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Ljusstakarna
          rader:
            - - På ett slott finns 29 ljusstakar. Några av dem har plats för fem ljus, och några har plats för sju ljus. Sammanlagt behövs 187 ljus.
        - rubrik: Frågorna
          rader:
            - - Hur många ljusstakar finns det av varje sort?
    - rubrik: "Två lösningar: Bas, problem 5, Ljusstakarna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Ljusstakarna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "En tabell med femarmade och sjuarmade. 29 och 0 ger 145 ljus, för få. 19 och 10 ger 165. 9 och 20 ger 185, nästan. 8 och 21 ger 187. Andra raden: 19 · 5 = 95, 10 · 7 = 70 och 95 + 70 = 165."
              - "Tänk dig att alla 29 är femarmade. Då blir det 29 · 5 = 145 ljus. Det saknas 187 − 145 = 42 ljus. En sjuarmad har två ljus till, så 42 / 2 = 21 sjuarmade, och 29 − 21 = 8 femarmade. Kontroll: 8 · 5 + 21 · 7 = 40 + 147 = 187."
        - rubrik: Frågorna
          rader:
            - - Vad gör eleven i lösning A från rad till rad?
            - - Varför räknar eleven i lösning B 187 − 145?
            - - Var syns det i båda lösningarna att en sjuarmad har två ljus mer än en femarmad?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja om det var många fler stakar, och varför?
    - rubrik: "Lärarens sida: Bas, problem 6, Tornet"
      text:
        - "Problemet handlar om att dela upp en figur av kuber, och om ett mönster som växer. Svaret är 28 kuber, och 45 när tornet är 5 kuber högt. Eleverna bygger, räknar lager för lager och ser en stolpe och fyra lika trappor. Material: multilinkkuber, 45 per par. Idén kommer ur Hagland, Hedrén och Taflin (2005) och Nämnaren 2024:2."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talen 4 och 5, och orden stolpe, trappa och ”åt fyra håll”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: stolpen i mitten är 4 kuber hög, och fyra trappor går åt var sitt håll.
                Vi ska ta reda på: antalet kuber, när tornet är 4 och 5 kuber högt.
            - rubrik: Ord och tal
              text: "Peka på stolpen och en trappa, och reda ut ”åt fyra håll”. Fråga: Vad räknar 4 och 5? Hur många trappor finns det?"
            - rubrik: Förutse
              text: Eleverna bygger med kuber, räknar lager eller räknar stolpen och trapporna var för sig. Någon räknar bara de kuber som syns.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Bygg tornet med kuber och dela upp det.
                Efter några försök: Berätta vad ni har gjort! Ni sa att alla fyra trapporna är lika. Försök använda det!
            - rubrik: Säg inte
              text: Räkna stolpen för sig, räkna en trappa och ta den fyra gånger. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Ett torn som är 2 kuber högt, och sedan 3 (6 och 15 kuber).
                Större: Hur många kuber behövs till ett torn som är 10 kuber högt? (190) Hur kan ni räkna utan att bygga? (Stolpen och fyra trappor med 45 kuber var: 10 + 4 · 45 = 190)
            - rubrik: Jämför
              text: De fyra trapporna är lika. I A har varje lager 4 kuber mer än lagret ovanför, en i varje trappa, och i B tar eleven en trappa 4 gånger.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att det blir 13 kuber. Hur kan ni kontrollera att det stämmer med problemet?
                Ni säger 4 · 10 = 40 kuber till tornet som är 5 högt. Hur kan ni kontrollera det med tornet ni har byggt?
    - rubrik: "Bas, problem 6: Tornet"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Tornet
          rader:
            - - Moa bygger ett torn av kuber. Tornet har en stolpe i mitten och en trappa åt fyra håll. Tornet på bilden är 4 kuber högt.
        - rubrik: Frågorna
          rader:
            - - Hur många kuber behövs till tornet på bilden?
            - - Hur många kuber behövs till ett torn som är 5 kuber högt?
    - rubrik: "Två lösningar: Bas, problem 6, Tornet"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Tornet
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "Lager för lager, uppifrån. Översta lagret har 1 kub, sedan 5, 9 och 13. Varje lager har 4 kuber mer än lagret ovanför. 1 + 5 + 9 + 13 = 28. Ett torn som är 5 högt har ett lager till längst ner, med 13 + 4 = 17 kuber: 28 + 17 = 45."
              - "Stolpen och fyra trappor. Stolpen har 4 kuber. En trappa har 1 + 2 + 3 = 6 kuber, och fyra trappor 4 · 6 = 24. Tornet har 4 + 24 = 28 kuber. Höjden 5: stolpen har 5 kuber och en trappa 1 + 2 + 3 + 4 = 10, så 5 + 4 · 10 = 45."
        - rubrik: Frågorna
          rader:
            - - Vad räknar eleven i lösning A i varje lager, och hur växer lagren?
            - - Varför räknar eleven i lösning B en trappa och tar den fyra gånger?
            - - Var syns det i båda lösningarna att de fyra trapporna är lika?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja för ett torn som är 10 kuber högt, och varför?
    - rubrik: "Lärarens sida: Bas, problem 7, Matcherna"
      text:
        - "Problemet handlar om kombinatorik: hur många par som går att bilda av några lag. Svaret är 6 matcher med 4 lag och 15 matcher med 6 lag. Eleverna listar i ordning, ritar och ser att samma match inte ska räknas två gånger. Idén kommer ur Skolverkets Problembank för årskurs 4–6, Bandy."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talen fyra och 6, och orden ”varje lag”, ”en match” och ”vart och ett”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: 4 lag, och varje lag spelar en match mot vart och ett av de andra lagen.
                Vi ska ta reda på: antalet matcher med 4 lag och med 6 lag.
            - rubrik: Ord och tal
              text: "Reda ut turnering och match. Peka på prickarna och strecket: varje prick är ett lag, och strecket en match. Fråga: Vad räknar 4 och 6?"
            - rubrik: Förutse
              text: Paren listar matcherna, ritar prickar med streck eller gör ett schema. Någon räknar lag A mot lag B och lag B mot lag A som två matcher.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Skriv upp matcherna i en ordning, så att ingen saknas.
                Efter några försök: Berätta vad ni har gjort! Ni sa att lag A spelar 3 matcher. Försök använda det!
            - rubrik: Säg inte
              text: Varje match räknas två gånger, så dela med 2. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: 3 lag, och sedan 4 lag (3 och 6 matcher).
                Större: Hur många matcher blir det med 10 lag? (45) Hur många lag är med, om det blir 28 matcher? (8)
            - rubrik: Jämför
              text: Varje match är ett par lag, som bara räknas en gång. I lösning A står varje par en gång i listan, och i lösning B delas 30 med 2.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att det blir 12 matcher. Hur kan ni kontrollera att det stämmer med problemet?
                Ni säger att ni har alla 15. Hur kan ni kontrollera att ingen match saknas?
    - rubrik: "Bas, problem 7: Matcherna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Matcherna
          rader:
            - - Fyra lag spelar bandy i en turnering. Varje lag spelar en match mot vart och ett av de andra lagen.
        - rubrik: Frågorna
          rader:
            - - Hur många matcher blir det i turneringen?
            - - Hur många matcher blir det, om 6 lag är med?
    - rubrik: "Två lösningar: Bas, problem 7, Matcherna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Matcherna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "En lista i ordning. Med 6 lag möter lag A lagen B, C, D, E och F, 5 matcher. Lag B möter C, D, E och F, 4 matcher. Sedan 3, 2 och 1. 5 + 4 + 3 + 2 + 1 = 15. Med 4 lag: 3 + 2 + 1 = 6."
              - "Prickar och streck. Från varje lag går 5 streck: 6 · 5 = 30. Då är varje streck räknat två gånger, en gång från varje lag, så 30 / 2 = 15 matcher. Med 4 lag: 4 · 3 = 12 och 12 / 2 = 6."
        - rubrik: Frågorna
          rader:
            - - Varför skriver eleven i lösning A en match mindre på varje rad?
            - - Varför delar eleven i lösning B 30 med 2?
            - - Var syns det i båda lösningarna att lag A mot lag B och B mot A är samma match?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med 10 lag, och varför?
    - rubrik: "Lärarens sida: Bas, problem 8, Tärningarna"
      text:
        - "Problemet handlar om chans: varför vissa summor kommer oftare än andra. Svaret är 7, som kommer i 6 av 36 utfall. Eleverna kastar, för streck och listar alla utfall, och ser att 3 + 4 och 4 + 3 är olika. Material: två tärningar i olika färg per par. Idén kommer ur Skolverkets Problembank för årskurs 4–6, Tärningar, och nrich."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna och orden ”två tärningar”, ”lägger ihop”, summa och oftast.
            - rubrik: Lyft ut
              text: |-
                Vi vet: två tärningar med 1 till 6 prickar, och summan är prickarna ihop.
                Vi ska ta reda på: vilken summa som kommer oftast, och varför.
            - rubrik: Ord och tal
              text: "Reda ut summa med kastet på bilden, och vad oftast betyder. Fråga: Vilka summor kan ni få? Vilken är minst och vilken störst?"
            - rubrik: Förutse
              text: Paren kastar och för streck, listar eller gör en tabell. Någon tror att alla summor är lika vanliga. I 36 kast får ofta en annan summa än 7 flest streck.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Kasta tärningarna och skriv upp summorna.
                Efter några försök: Berätta vad ni har gjort! Ni sa att 7 kan bli 1 + 6 och 2 + 5. Försök använda det!
            - rubrik: Säg inte
              text: 3 + 4 och 4 + 3 är olika kast, så räkna båda. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Två högar med korten 1, 2 och 3, och ett kort ur varje (4 är vanligast).
                Större: Vilka summor är lika vanliga? (Summor lika långt från 7, som 6 och 8) Vilken skillnad kommer oftast, det större talet minus det mindre? (1, i 10 av 36)
            - rubrik: Jämför
              text: 7 kan bli på flest sätt, 6 av 36 i B. Jämför kasten i A och gruppens kast med de 36 utfallen. Med fler kast får 7 oftast flest streck, men det är inte säkert.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att 6, 7 och 8 går på 3 sätt var. Hur kan ni kontrollera det med en vit och en grå tärning?
                ”Är 7 rätt?” Hur kan ni kontrollera det mot problemet?
    - rubrik: "Bas, problem 8: Tärningarna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Tärningarna
          rader:
            - - Sam och Ida kastar två vanliga tärningar, med 1 till 6 prickar. De lägger ihop prickarna och får kastets summa. Kastet på bilden har summan 4 + 6 = 10.
        - rubrik: Frågorna
          rader:
            - - Vilken summa kommer oftast, om de kastar många gånger?
            - - Hur kan ni visa att det är så?
    - rubrik: "Två lösningar: Bas, problem 8, Tärningarna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Tärningarna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "Kasta och sätt streck. Eleven kastar 36 gånger och sätter ett streck vid summan varje gång. I elevens 36 kast får summan 7 flest streck, sju stycken, och 2, 11 och 12 bara ett var. Kontroll: strecken är 36, lika många som kasten."
              - En tabell med alla 36 möjliga utfall. Den vita tärningen står till vänster och den grå överst, och det blir 6 · 6 = 36 rutor. 7 står sex gånger, i en sned rad. 6 och 8 står fem gånger var, och 2 och 12 bara en gång.
        - rubrik: Frågorna
          rader:
            - - Vad gör eleven i lösning A, och vad visar strecken?
            - - Varför står både 3 + 4 och 4 + 3 i tabellen i lösning B?
            - - Var syns det i båda lösningarna att 7 är vanligast, och vilken visar varför?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med tre tärningar, och varför?
    - rubrik: "Lärarens sida: Bas, problem 9, Parken"
      text:
        - Problemet handlar om omkrets och om när två varv av olika längd går jämnt ut, vilket är idén bakom gemensamma multiplar. Parkerna är 200 m och 300 m runt. De möts i A efter 600 m, när Nora har gått 3 varv och Elias 2. Eleverna räknar omkretsen och hoppar på tallinjer. Idén kommer ur Känguru 2022, Ecolier nr 22.
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, måtten 50 m och 100 m, och orden runt, samtidigt, ”lika fort” och ”i A igen”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: sidorna 50 m och 100 m, och att de går samtidigt och lika fort från A.
                Vi ska ta reda på: hur långt det är runt, och varven när de möts i A.
            - rubrik: Ord och tal
              text: "Reda ut runt, varv och samtidigt. Följ en park runt med fingret från A. Fråga: Vad står 50 och 100 för?"
            - rubrik: Förutse
              text: Paren räknar omkretsen först, gör en tabell med meter, följer bilden bit för bit eller hoppar på en tallinje. Någon svarar 2, som bara är Elias varv.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Följ parkerna på bilden, en bit i taget.
                Efter några försök: Berätta vad ni har gjort! Ni sa att Nora är tillbaka i A efter 200 m. Försök använda det!
            - rubrik: Säg inte
              text: De möts när båda har gått 600 m. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Parkerna är 20 m och 30 m runt (de möts efter 60 m, 3 och 2 varv).
                Större: Om Elias park är 150 m lång och 100 m bred, när möts de i A då? (Efter 1 000 m: 5 och 2 varv)
            - rubrik: Jämför
              text: De möts i punkten A när båda har gått hela varv och lika långt. I lösning A står 600 i båda kolumnerna, och i lösning B landar bådas hopp på 600.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att Noras park är 50 m runt. Hur kan ni kontrollera att det stämmer med problemet?
                ”Är svaret 2 varv?” Hur kan ni kontrollera att det svarar på frågan?
    - rubrik: "Bas, problem 9: Parken"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Parken
          rader:
            - - Nora och Elias går runt var sin park. Noras park är en kvadrat med sidan 50 m. Elias park är en rektangel som är 100 m lång och 50 m bred. De börjar samtidigt i punkten A, där parkerna möts, och går lika fort.
        - rubrik: Frågorna
          rader:
            - - Hur många meter är det runt varje park?
            - - Hur många varv har var och en gått, när de möts i A igen för första gången?
    - rubrik: "Två lösningar: Bas, problem 9, Parken"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Parken
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "En tabell. Först omkretsen: 50 + 50 + 50 + 50 = 200 m och 100 + 50 + 100 + 50 = 300 m. Sedan hur långt de har gått efter varje varv. Nora: 200, 400, 600. Elias: 300, 600. Båda har gått 600 m, Nora efter 3 varv och Elias efter 2."
              - "Hopp på tallinjer. Omkretsen: 4 · 50 = 200 m och 2 · 100 + 2 · 50 = 300 m. Nora hoppar 200 m i taget och Elias 300 m. 600 är det första talet där båda landar. Nora: 600 / 200 = 3 varv. Elias: 600 / 300 = 2 varv."
        - rubrik: Frågorna
          rader:
            - - Vad skriver eleven i lösning A på varje rad i tabellen?
            - - Varför letar eleven i lösning B efter det första talet där båda landar?
            - - Var syns 600 m i båda lösningarna, och varför möts de i A just då?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja om parkerna var 400 m och 600 m runt, och varför?
    - rubrik: "Lärarens sida: Bas, problem 10, Vågen"
      text:
        - "Problemet handlar om likheter: tre okända vikter som hänger ihop två och två. Svaret är 270 g, och rektangeln väger 170 g, cirkeln 30 g och triangeln 70 g. Eleverna lägger ihop och jämför vägningar, och ser att varje kloss står på två vågar. Idén kommer ur Känguru 2024, Ecolier nr 19."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talen 200, 100 och 240, och orden ”två i taget”, ”alla tre” och ”varje kloss”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: rektangel och cirkel 200 g, triangel och cirkel 100 g, rektangel och triangel 240 g.
                Vi ska ta reda på: alla tre ihop, och varje kloss.
            - rubrik: Ord och tal
              text: "Visa rektangeln, cirkeln och triangeln på bilden, och vågarna, som visar två klossar ihop. Fråga: Vad väger 200 g?"
            - rubrik: Förutse
              text: Paren prövar vikter, jämför vågarna två och två eller lägger ihop allt först. Någon svarar 540 g.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Gissa vad cirkeln väger, och pröva gissningen på vågarna.
                Efter några försök: Berätta vad ni har gjort! Ni sa att rektangeln väger 100 g mer än triangeln. Försök använda det!
            - rubrik: Säg inte
              text: Lägg ihop vågarna, så är varje kloss med två gånger. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Vågarna visar 50 g, 30 g och 60 g (70 g, rektangeln 40, cirkeln 10 och triangeln 20).
                Större: Vågarna visar 300 g, 200 g och 300 g. Vad väger alla tre, och varje kloss? (400 g, rektangeln 200 och de andra 100 var)
            - rubrik: Jämför
              text: Varje kloss står på två vågar. I A är därför 540 g två av varje kloss, och i B ger de två vågarna med cirkeln skillnaden 100 g.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att alla tre väger 540 g. Hur kan ni kontrollera att det stämmer med problemet?
                ”Väger cirkeln 30 g?” Hur kan ni kontrollera det på alla tre vågarna?
    - rubrik: "Bas, problem 10: Vågen"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Vågen
          rader:
            - - "Lina har tre klossar: en rektangel, en cirkel och en triangel. Hon väger två klossar i taget. Rektangeln och cirkeln väger 200 g. Triangeln och cirkeln väger 100 g. Rektangeln och triangeln väger 240 g."
        - rubrik: Frågorna
          rader:
            - - Hur mycket väger alla tre klossarna tillsammans?
            - - Hur mycket väger varje kloss?
    - rubrik: "Två lösningar: Bas, problem 10, Vågen"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Vågen
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "Lägg ihop alla tre vågarna: 200 + 100 + 240 = 540 g. Då är varje kloss med två gånger, så alla tre väger 540 / 2 = 270 g. Cirkeln: 270 − 240 = 30 g, triangeln 270 − 200 = 70 g och rektangeln 270 − 100 = 170 g."
              - "Jämför vågarna. Båda de första har cirkeln, så rektangeln väger 200 − 100 = 100 g mer än triangeln. 240 − 100 = 140 g är två trianglar, och 140 / 2 = 70 g. Rektangeln 70 + 100 = 170 g, cirkeln 100 − 70 = 30 g. Alla tre: 170 + 70 + 30 = 270 g."
        - rubrik: Frågorna
          rader:
            - - Vad lägger eleven ihop i lösning A, och vad är 540 g?
            - - Varför räknar eleven i lösning B 200 − 100?
            - - Var syns det i båda lösningarna att varje kloss står på två vågar?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med fyra klossar, och varför?
    - rubrik: "Lärarens sidor: Medel"
      text:
        - Här står de tio problemen på nivån Medel, som ligger nära åk 6–7, i den ordning gruppen tar dem. Varje problem har lärarens sida, problemets sida och bladet Två lösningar.
      oversikt:
        kolumner:
          - Problemet
          - Matematiken
          - Lösning A
          - Lösning B
        rader:
          - - 1. Glasspinnarna
            - trianglar, och att hitta alla
            - "Rita eller bygg: lägg och sortera trianglar"
            - Gör en lista efter benen
          - - 2. Borden
            - mönster och uttryck
            - "Gör en tabell: 4 platser till per bord"
            - "Skriv ett uttryck: 4 per bord och ändarna"
          - - 3. Kulpåsarna
            - chans som andel
            - andelen blå i varje påse
            - röda på varje blå
          - - 4. Bollbytet
            - proportionalitet, flera svar
            - "Gör en tabell: golfbollar som byts mot tennisbollar"
            - "Tänk dig att alla är av samma sort: byt allt mot pingis först"
          - - 5. Tangrammet
            - area och bråk
            - "Rita eller bygg: lägg bitarna på varandra"
            - "Rita eller bygg: 16 små trianglar"
          - - 6. Skolan
            - bråk, procent och delbarhet
            - Pröva och förbättra i en tabell
            - delbart med 3 och med 5, alltså med 15
          - - 7. Samlarbilderna
            - medelvärde, median och typvärde
            - "Pröva och förbättra: fem tal i ordning"
            - börja med de tal som måste stå
          - - 8. Klädaffären
            - likheter och byten
            - räkna allt i kepsar
            - välj ett pris på en keps
          - - 9. Pantpengarna
            - bråk av det som är kvar
            - Räkna baklänges med staplar
            - Pröva och förbättra i en tabell
          - - 10. Smörgåsarna
            - bråk och rättvis delning
            - "Rita eller bygg: smörgåsar i tredjedelar"
            - räkna med bråk
      delar:
        - rubrik: Så använder du problemen
          falt:
            - rubrik: Ordningen
              text: Ta problemen i ordning, ett per pass, och byt ordning när gruppen behöver arbeta med ett annat område eller ett problem som liknar det förra. De första är lättast att börja på.
            - rubrik: Kopiorna
              text: Kopiera problemets sida till varje par, eller visa den på tavlan. I Jämföra får varje par bladet Två lösningar, med B under ett papper tills gruppen har sagt vad A gör.
    - rubrik: "Lärarens sida: Medel, problem 1, Glasspinnarna"
      text:
        - "Problemet handlar om trianglar och om att veta att man har hittat alla. Svaret är 15 likbenta trianglar, och fyra av dem är liksidiga. Eleverna prövar när tre sidor går ihop till en triangel och ordnar sina trianglar så att ingen saknas eller räknas två gånger. Material: glasspinnar, 12 per par. Idén kommer ur Nämnaren 2025:4, problem 4490."
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talet 12, och orden likbent, liksidig, ”hela pinnar” och olika.
            - rubrik: Lyft ut
              text: |-
                Vi vet: 12 lika långa pinnar, minst två sidor lika långa, hela pinnar.
                Vi ska ta reda på: hur många olika trianglar, och hur vi vet att vi har alla.
            - rubrik: Ord och tal
              text: "Reda ut likbent, ben och bas med bilden, och visa den som inte går ihop. Fråga: Vad räknar 12? Är 3, 3, 2 och 2, 3, 3 olika?"
            - rubrik: Förutse
              text: Paren lägger och ritar pinnar, gör en lista utan ordning eller en tabell efter benen. Någon räknar 2, 2, 4, fast den blir platt.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Lägg en triangel och skriv upp sidorna.
                Efter några försök: Berätta vad ni har gjort! Ni sa att 2, 2, 4 blev platt. Försök använda det!
            - rubrik: Säg inte
              text: Gå igenom benen från 1 till 5, och låt basen vara kortare än benen tillsammans. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Högst 6 pinnar (3 trianglar).
                Större: Hur många trianglar går med högst 12 pinnar, om sidorna får vara olika långa? (18, de 15 likbenta och 3 till) Hur många likbenta går med högst 20 pinnar? (45)
            - rubrik: Jämför
              text: Basen är kortare än benen tillsammans, och pinnarna är högst 12. A hittar villkoren genom att bygga, och B skriver dem som en regel. Ordningen efter benen visar att ingen saknas.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att 3, 3, 2 och 2, 3, 3 är två trianglar. Hur kan ni kontrollera det med pinnarna?
                ”Är det alla nu?” Hur kan ni kontrollera att ingen saknas?
    - rubrik: "Medel, problem 1: Glasspinnarna"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Glasspinnarna
          rader:
            - - Lisa har 12 glasspinnar som är lika långa. Hon lägger likbenta trianglar på bordet, en i taget, och behöver inte använda alla pinnar. Varje sida är en eller flera hela pinnar. En liksidig triangel räknas också som likbent.
        - rubrik: Frågorna
          rader:
            - - Hur många olika likbenta trianglar kan Lisa lägga?
            - - Hur kan ni vara säkra på att ni har hittat alla?
    - rubrik: "Två lösningar: Medel, problem 1, Glasspinnarna"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Glasspinnarna
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "Bygg och sortera. Eleven lägger trianglar och ritar dem som går ihop. 2, 2, 4 blir platt, och 5, 5, 3 behöver 5 + 5 + 3 = 13 pinnar. Sedan sorterar eleven efter benen, från 1 till 5: 1 + 3 + 5 + 4 + 2 = 15."
              - "En lista efter benen. Basen ska vara kortare än benen tillsammans, och alla pinnar ihop högst 12. Ben 4: 4 + 4 = 8 och 12 − 8 = 4, så basen är högst 4. Ben 6: 6 + 6 = 12, och ingen pinne blir kvar till basen. 1 + 3 + 5 + 4 + 2 = 15."
        - rubrik: Frågorna
          rader:
            - - Hur sorterar eleven trianglarna i lösning A?
            - - Varför skriver eleven i lösning B att basen är högst 4 när benen är 4?
            - - Var syns det i båda lösningarna att basen måste vara kortare än benen tillsammans?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja med 30 pinnar, och varför?
    - rubrik: "Lärarens sida: Medel, problem 2, Borden"
      text:
        - Problemet handlar om ett mönster som växer lika mycket för varje bord. Vid 10 bord får 42 personer plats, och vid n bord 4 · n + 2. Eleverna ser mönstret i en tabell och i bilden och skriver en regel med ord eller med n. Idén kommer ur Nämnaren 2025:2, problem 4476.
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågorna, talet 10, och orden sexkantiga, ”delar en sida” och ”fri sida”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: sexkantiga bord i rad, två bord delar en sida, en person vid varje fri sida.
                Vi ska ta reda på: hur många vid 10 bord, och en regel.
            - rubrik: Ord och tal
              text: "Reda ut sexkantig och fri sida med bilden. Fråga: Vad räknar 10, och vad räknar prickarna?"
            - rubrik: Förutse
              text: Paren ritar bord, gör en tabell med 6, 10 och 14 eller ser 4 vid varje bord. Någon räknar 10 · 6 = 60 eller glömmer ändarna.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Rita platserna vid tre bord och räkna dem.
                Efter några försök: Berätta vad ni har gjort! Ni sa att det blir 4 fler för varje bord. Försök använda det!
            - rubrik: Säg inte
              text: Varje bord har fyra platser, och så kommer en i varje ände. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: 4 bord (18 personer).
                Större: Kan en rad bord ha exakt 100 platser? (Nej: 24 bord ger 98 och 25 bord 102) Hur många bord behövs för en klass med 27 elever? (7, eftersom 6 bord ger 26)
            - rubrik: Jämför
              text: Varje nytt bord ger fyra platser till, två uppe och två nere. I A syns det som +4 i tabellen, och i B som 4 vid varje bord.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att 10 bord ger dubbelt så många som 5 bord, alltså 44. Hur kan ni kontrollera det mot bilden?
                ”Stämmer regeln?” Hur kan ni kontrollera den med 3 bord?
    - rubrik: "Medel, problem 2: Borden"
      text:
        - Läs problemet och visa hur ni löser det.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Lärarens sida
              text: Den står före problemet, och bladet Två lösningar efter.
      listor:
        - rubrik: Borden
          rader:
            - - I matsalen står sexkantiga bord i en lång rad. Två bord som står bredvid varandra delar en sida. Vid varje fri sida får en person sitta.
        - rubrik: Frågorna
          rader:
            - - Hur många personer får plats vid 10 bord?
            - - Hitta en regel som gäller för alla antal bord.
    - rubrik: "Två lösningar: Medel, problem 2, Borden"
      text:
        - Två elever har löst problemet på olika sätt. Titta först på lösning A och sedan på B, och prata om frågorna.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: I passet
              text: Dela ut bladet i Jämföra, när paren har prövat. Lärarens sida säger vad som är lika i lösningarna.
      listor:
        - rubrik: Borden
          kolumner:
            - Lösning A
            - Lösning B
          rader:
            - - "En tabell. 1 bord ger 6, 2 bord 10, 3 bord 14 och 4 bord 18. Det blir 4 till för varje bord. Från 1 till 10 bord är det 9 steg: 6 + 9 · 4 = 42. Regeln i ord: 6, och sedan 4 till för varje nytt bord."
              - "Räkna platserna i bilden. Varje bord har fyra platser, två uppe och två nere. Till det kommer en plats i varje ände. 10 bord: 4 · 10 + 2 = 42. Regel: 4 · n + 2. Kontroll med 3 bord: 4 · 3 + 2 = 14, som i bilden."
        - rubrik: Frågorna
          rader:
            - - Vad gör eleven i lösning A från rad till rad?
            - - Varför lägger eleven i lösning B till 2 efter 4 · 10?
            - - Var syns det i båda lösningarna att varje nytt bord ger fyra platser till?
            - - Vilken lösning liknar er egen? Vilken skulle ni välja för 100 bord, och varför?
    - rubrik: "Lärarens sida: Medel, problem 3, Kulpåsarna"
      text:
        - Problemet handlar om chans som en andel av alla kulor. Svaret är påse B, där 1/4 av kulorna är blå. Eleverna jämför andelar som bråk eller procent, eller röda mot blå, och ser att flest blå inte ger störst chans. Idén kommer ur Problembanken åk 7–9, problem 11, Kulpåsen.
      delar:
        - rubrik: I passet
          falt:
            - rubrik: Ringa in
              text: Frågan, talen för varje påse, och orden chans och ”blå kula”.
            - rubrik: Lyft ut
              text: |-
                Vi vet: hur många röda och blå kulor det finns i varje påse.
                Vi ska ta reda på: vilken påse som ger störst chans för blå, och varför.
            - rubrik: Ord och tal
              text: "Visa bilden. Fråga: Vad betyder chans? Vad räknar 20 i påse A, och hur många kulor finns det i den?"
            - rubrik: Förutse
              text: Bråk eller procent av alla kulor, röda mot blå, eller kulor som ritas. Några väljer påse A, för den har flest blå.
            - rubrik: Kör de fast
              text: |-
                Föreslå: Gör en tabell med det ni vet om varje påse.
                Efter några försök: Berätta vad ni har gjort! Ni sa att A har 100 kulor och 20 blå. Försök använda det!
            - rubrik: Säg inte
              text: Räkna hur stor del av alla kulor som är blå. Det ger bort lösningen.
            - rubrik: Mindre och större
              text: |-
                Mindre: Påse A har 8 röda och 2 blå, påse B 3 och 1, och påse C 9 och 1 (påse B).
                Större: Hur många blå måste ni lägga i påse C för att den ska ge samma chans som påse B? (10, så att 15 av 60 är blå)
            - rubrik: Jämför
              text: Chansen beror på hur många röda det finns för varje blå. I A räknar eleven andelen av alla, i B röda på varje blå, och båda ger påse B.
            - rubrik: Fel eller osäker
              text: |-
                Ni säger att påse A är bäst, för den har flest blå. Hur kan ni kontrollera det mot problemet?
                Ni säger att påse B är bäst, för den har minst röda. Hur vet ni att det räcker?
    - rubrik: "Medel, problem 3: Kulpåsarna"
      text:
        - Läs problemet och visa hur ni löser det.
