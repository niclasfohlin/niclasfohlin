lathund:
  innehall: En kort text, samma hela passet
  metoden:
    text:
      - "Syftet är att eleven ska läsa med flyt och förstå det hen läser. Ditt uppdrag består av fyra saker. Eleverna läser samma text flera gånger, och du visar strategier i texten. Eleverna sätter ord på strategierna vid bordet, och du följer läsflytet på lästrappan."
      - "Insatsen är för elever som har knäckt läskoden men inte alltid hör vad de läser, eller tappar förståelsen när de läser. De står på steg 1–⁠3 i lästrappan, och målet är att de går upp några steg. Före och efter perioden läser eleven en ny text, och du fyller i protokollet Lästrappan före och efter."
    ruta:
      rubrik: "När eleven fastnar: stödtrappan"
      inledning: "Fråga alltid först: Vad kan du göra?"
      punkter:
        - text: "1 · Vänta tre sekunder. 2 · Be eleven läsa om meningen."
        - text: "3 · Peka på strategikortet. 4 · Visa strategin på ordet."
        - text: 5 · Säg ordet, och eleven läser om meningen.
      efter: "Läst fel? Vänta till punkten och fråga: Stämde det?"
    tabell:
      rubrik: Passet i fyra delar · vad du gör och säger
      kolumner:
        - Del
        - Exempelfraser
      rader:
        - - |-
            1 · Första läsningen
            0–⁠3 min. Du lyssnar.
          - ”Läs texten halvhögt för dig själv.”
        - - |-
            2 · Modellering
            3–⁠6 min. Du visar.
          - "”Lyssna när jag säger ljuden utan paus: sss-⁠t-⁠rrr-⁠aaa-⁠nnn-⁠d. Strand. Stranden.”"
        - - |-
            3 · Läs igen
            6–⁠14 min. Minst två omgångar.
          - |-
            ”Stämde det? Läs meningen igen.”
            ”Du sa ljuden utan paus och hörde ordet.”
        - - |-
            4 · Avslutning
            14–⁠15 min. Gemensamt.
          - |-
            ”Första gången ljudade ni strand. Sista gången läste ni ordet direkt.”
    not: "Eleverna läser igen i minst två omgångar, till exempel med ekoläsning, i kör, med dig, i par, med stöd och sedan utan, i läsröret eller för en ny lyssnare. Lyssna på varje elev för sig minst en gång. Har ni tio minuter får delarna 2, 2, 5 och 1 minut."
  pass:
    rubrik: "Vi kör ett pass: texten ”Sandslottet”"
    textRubrik: Gruppen · fyra elever i åk 2, andra passet med texten
    text:
      - "Texten är lästräningstext 6, Sandslottet. Alla läser texten utan stöd. Elias ljudar med pauser, ”/s/ /t/ /r/ /a/ /n/ /d/”, och Samir läser ”vågor”."
      - "Läraren läser högt ur texten med stöd och visar: ”Lyssna när jag säger ljuden utan paus: sss-⁠t-⁠rrr-⁠aaa-⁠nnn-⁠d. Strand. Stranden.” Sedan pekar läraren på bindestrecken i våg-⁠or-⁠na."
      - "Gruppen körläser texten med stöd och läser den sedan i par utan stöd. Samir läser ”vågor”, stannar och läser om. Läraren: ”Du märkte att det inte stämde och läste om.”"
      - "I avslutningen börjar läraren: ”Elias, första gången ljudade du ordet stranden med pauser. Nu läste du det direkt.” Elias: ”Jag sa ljuden utan paus.” Texten flyter för Nora och Wilma, som får ta hem den."
    forberett:
      rubrik: Det jag förberett
      text:
        - "Läst texten högt själv och tänkt ut vilka ord eleverna kan fastna på: stranden, vågorna och springer. Valt kör med stöd och par utan stöd. Kopierat texten till varje elev och till mig, och lagt ett strategikort och ett läsrör vid varje plats. Paren: Nora och Elias, Wilma och Samir."
    klarTidigt: Läs texten en gång till, i läsröret eller för en kamrat.
    schema:
      rubrik: 15 minuter, del för del
      rader:
        - tid: Före
          fas: Förberedelse
          vad: "Läs texten högt själv, bestäm hur ni läser igen och lägg fram strategikorten."
        - tid: 0–3
          fas: 1 · Första läsningen
          vad: Alla läser halvhögt. Du lyssnar på en i taget och noterar.
        - tid: 3–6
          fas: 2 · Modellering
          vad: Visa två eller tre svåra ord, med veckans strategi.
        - tid: 6–14
          fas: 3 · Läs igen
          vad: "Minst två omgångar. Du lyssnar på varje elev och ger konkret återkoppling."
        - tid: 14–15
          fas: 4 · Avslutning
          vad: Vilken strategi hjälpte? Vad handlar texten om?
  mall:
    rubrik: Mitt strategikort
    underrad: "Peka på kortet när du fastnar · Namn: ______________"
    block:
      - typ: tabell
        rubrik: Mina lässtrategier
        kolumner:
          - Strategi
          - Så här
        rader:
          - - Läs hela ordet
            - Peka under ordet.
          - - Säg ljuden utan paus
            - sss-⁠ooo-⁠lll → sol
          - - Låter det som ett ord?
            - huuund? → hund
          - - Dela ordet
            - ba-⁠nan och last-⁠bil
          - - Hitta ordet i ordet
            - hund-⁠ar-⁠na och sol-⁠en
          - - Stämde det?
            - Läs meningen igen.
          - - Läs som när du pratar
            - Stanna vid punkten.
  material:
    rubrik: Vad du behöver för ett pass
    kravEtikett: Textkrav
    var:
      rubrik: Var texterna och korten finns
      punkter:
        - fet: Lästräningstexterna.
          text: En för varje vecka, med och utan stöd, i planeringsmallarna (Word) och under Materialet på metodsidan.
        - fet: Lättlästa böcker.
          text: Samma slags texter som i TIL i grupp, till exempel Kiwi, Stjärnsvenska och Beta Pedagog. Skolbiblioteket hjälper dig.
        - fet: "Ljudenliga böcker för steg 1–⁠2 i lästrappan."
          text: "Till exempel Hegas Lästrädet eller Bågens miniböcker, eller ett eget läskort."
        - fet: "Strategikortet, lappen och protokollet."
          text: Strategikortet är sida 3 här. Lappen hem och protokollet finns i planeringsmallarna (Word) och under Materialet på metodsidan.
      efter: "Byt text när den flyter för de flesta. Läsröret är ett böjt rör från munnen till örat, som gör att eleven hör sin egen röst. Du kan köpa det som hörlur eller göra det av ett rör och två rörböjar. Det är frivilligt."
    bordet:
      - Texten, en kopia per elev och en till dig
      - Strategikortet vid varje plats
      - Läsrör, om ni har
      - Snabbmallen för noteringen efteråt, ur planeringsmallarna
    varjePass: Vilka ord fastnade, vilken strategi hjälpte, och kan texten gå hem?
