passrutin:
  text: "Varje pass går till på samma sätt. Eleverna läser, du visar, eleverna läser igen i minst två omgångar, och sedan avslutar ni. Hur eleverna läser igen väljer du efter vad de behöver. Varför den ordningen? När eleverna läser först hör du vilka ord, ljud och ändelser som fastnar, och i modelleringen visar du just det. Läser ni igen i kör får alla läsa orden rätt flera gånger utan att stå ensamma, och i par får eleverna läsa om många gånger med en kamrat som stöd. Samma text genom hela passet är själva poängen."
  steg:
    - text: Eleverna läser texten halvhögt var för sig, och du lyssnar och noterar vanliga läsfel.
      fas: Första läsningen
    - text: Du läser texten högt och visar det som var svårt, gärna med veckans strategi.
      fas: Modellering
    - text: "Eleverna läser texten igen i minst två omgångar, på de sätt du väljer efter vad de behöver. Du ger varje elev konkret återkoppling."
      fas: Läs igen
    - text: "Ni avslutar med frågan: vad lärde vi oss av att läsa samma text flera gånger? Eleverna säger vilken strategi som hjälpte."
      fas: Avslutning
  efterPasset: Efter passet gör du en kort notering om vilka ord som fastnade, vilken strategi som hjälpte och om texten flyter och kan gå hem.
  kallas: delar
tidsschema:
  rubrik: Ett pass på 15 minuter
  text: "Har ni bara tio minuter blir det två minuter var för första läsningen och modelleringen, fem för Läs igen och en för avslutningen. Då hinner du lyssna på varje elev om gruppen har högst fyra elever."
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: "Läs texten högt för dig själv och tänk ut vilka ord eleverna kan fastna på. Bestäm hur eleverna ska läsa igen. Kopiera texten till varje elev och till dig, och visa den gärna stor på tavlan. Lägg ett strategikort vid varje plats, och gärna ett läsrör."
    - tid: 0–3 min
      fas: Första läsningen
      vad: "Är texten ny, säg i en mening vad den handlar om. Alla läser halvhögt samtidigt, gärna i läsröret, och du lyssnar på en i taget. Du läser inte med och rättar inte här. Lyssna efter mönster: ord som gissas, ljud som tappas, ändelser som läses fel, långa ord som faller isär. Notera i din kopia det som återkommer hos flera elever, inte varje enskilt fel."
    - tid: 3–6 min
      fas: Modellering
      vad: "Läs texten högt i lugnt tempo och peka så att alla följer med i raden. Stanna vid orden du noterade och visa hur de läses: ljuda utan paus, dela ordet i delar, läs det igen som helhet. Tänk högt om det som gör ordet svårt: konsonantmötet, den långa vokalen, ändelsen. Läs meningen om från början när ordet är löst. Håll modelleringen kort och välj två eller tre saker av det du hörde."
    - tid: 6–14 min
      fas: Läs igen
      vad: "Välj sätten i tabellen Sätt att läsa igen. Låt eleverna gärna först läsa tillsammans med dig, till exempel i kör, och sedan själva, till exempel i par. I minst en omgång lyssnar du på varje elev för sig och ger konkret återkoppling. Är eleverna fler än fyra tar du hälften i varje omgång. Efter varje omgång säger eleverna vilken strategi som hjälpte."
    - tid: 14–15 min
      fas: Avslutning
      vad: "Börja själv och beskriv en eller två iakttagelser du gjort under passet, konkret och kort. Låt sedan eleverna fylla på med vad de märkte och vilken strategi som hjälpte, och be någon berätta vad texten handlar om."
  efter: Den som är klar före de andra läser texten en gång till, i läsröret eller för en kamrat.
steg:
  rubrik: Vad du gör och säger i varje del
  text: "Strategierna du visar står under Läsfelen och strategierna, med samma namn som på strategikortet."
  fraserRubrik: Exempelfraser
  rader:
    - namn: Första läsningen
      fraga: Var tar läsningen stopp?
      gor: "Lyssna på en i taget och notera läsfelen och när eleverna rättar sig själva. Den som är klar läser texten igen."
      fraser:
        - Texten handlar om barn som leker vid havet.
        - Läs texten halvhögt för dig själv.
        - Nu lyssnar jag på dig en stund.
    - namn: Modellering
      fraga: Hur läser man det svåra ordet?
      gor: "Visa veckans strategi på två eller tre ord som var svåra, och läs meningen om från början. Förklara ett ord som eleverna inte känner."
      fraser:
        - "Lyssna när jag säger ljuden utan paus: sss-⁠t-⁠rrr-⁠aaa-⁠nnn-⁠d. Strand. Stranden."
        - "Jag delar ordet: sand och slott. Sandslott."
        - Nu läser jag hela meningen igen, som när jag pratar.
    - namn: Läs igen
      fraga: Stämde det?
      gor: "Välj hur eleverna läser igen efter vad de behöver, och lyssna på varje elev för sig minst en gång. Vänta tre sekunder innan du hjälper, och säg vad eleven gjorde och vilken strategi som hjälpte."
      fraser:
        - Stämde det? Läs meningen igen.
        - Du sa ljuden utan paus och hörde ordet.
        - Vilken strategi på kortet hjälpte dig?
        - Läs så att du vet vad som händer i texten.
    - namn: Avslutning
      fraga: Vad lärde vi oss av att läsa samma text flera gånger?
      gor: Börja själv med en eller två iakttagelser, och låt eleverna fylla på och säga vilken strategi som hjälpte. Avslutningen tar en minut och hjälper eleverna att förstå varför de läser samma text flera gånger.
      fraser:
        - Första gången ljudade ni strand. Sista gången läste ni ordet direkt.
        - "Nu stannar ni vid punkten och läsningen låter som när man pratar."
        - När orden gick lätt kunde ni berätta vad texten handlade om.
arbetsform:
  rubrik: "Arbetsform: enskilt, läraren visar, växlande, gemensamt"
  text: "Först läser eleverna var för sig medan du lyssnar. Sedan visar du, och eleverna läser igen i minst två omgångar, tillsammans, i par eller själva. Sist samlas hela gruppen. Har du bara en elev arbetar ni en till en, och du är elevens par. Eleven läser för dig, du visar, och sedan läser ni igen tillsammans. Blir det en elev över läser tre tillsammans och turas om att läsa och peka. Har varje elev eller par en egen text sitter du hos en elev eller ett par i taget, med texten mellan er. Eleven läser, du visar, och sedan läser eleven igen med större flyt. De andra läser om sin text under tiden. Första passet berättar du för eleverna varför ni läser samma text flera gånger. Visa också parläsningen tillsammans med en elev framför gruppen. Den som pekar håller fingret under ordet, väntar tre sekunder och pekar på strategikortet innan hen säger ordet."
  delar:
    - rubrik: 1. Enskilt
      text: var och en läser, läraren lyssnar
      faser:
        - Första läsningen
    - rubrik: 2. Läraren visar
      text: eleverna lyssnar och följer med
      faser:
        - Modellering
    - rubrik: 3. Växlande
      text: i kör, i par eller själv
      faser:
        - Läs igen
    - rubrik: 4. Gemensamt
      text: läraren börjar, eleverna fyller på
      faser:
        - Avslutning
exempel:
  valt:
    rubrik: Gruppen
    text: "fyra elever i åk 2. De står på steg 2 och 3 i lästrappan. Texten är lästräningstext 6, Sandslottet, och det är andra passet med den. Veckans strategi är ”Säg ljuden utan paus”. Gruppen läser igen i två omgångar, först i kör med stöd och sedan i par utan stöd."
  text:
    - "Texten lyder: ”Vi bygger ett sandslott på stranden. Vi gräver en vallgrav runt slottet. Jag springer efter hinken och fyller den med vatten. Vågorna kommer närmare och närmare. Då kommer en stor våg. Nu är sandslottet en liten sandhög.” Alla läser texten utan stöd, halvhögt och samtidigt i sina läsrör, och läraren lyssnar på en i taget. Elias säger ljuden med pauser, ”/s/ /t/ /r/ /a/ /n/ /d/”, och stannar. Samir läser ”vågor” för ”vågorna”. Wilma läser ordet sandslott i två delar, med en paus emellan. Läraren antecknar men rättar inte."
    - "Läraren läser högt ur texten med stöd och pekar. Vid ordet stranden stannar läraren: ”Lyssna när jag säger ljuden utan paus: sss-⁠t-⁠rrr-⁠aaa-⁠nnn-⁠d. Strand. Stranden.” Vid ordet vågorna pekar läraren på bindestrecken: ”Här finns ordet våg. Våg-⁠or-⁠na.” Sedan läser läraren meningen om från början och följer bågarna."
    - "Första omgången körläser gruppen texten med stöd, i lärarens tempo, och väntar in varandra vid ordet närmare. Den meningen läser de en gång till, lite fortare."
    - "Andra omgången läser de samma text utan stöd, i par. Nora läser och Elias pekar, Wilma läser och Samir pekar. Sedan byter de. Samir läser ”vågor”, stannar och läser om: ”vågorna”. ”Du märkte att det inte stämde och läste om”, säger läraren. Samir fastnar på ordet springer, och Wilma pekar på strategikortet: ”Hitta ordet i ordet.” Samir läser först ”spring” och sedan ”springer”. När Elias tvekar på ordet närmare väntar läraren tre sekunder, och Elias säger ljuden utan paus och läser ordet själv. Till Nora säger läraren: ”Den meningen lät som när man pratar.” Till Wilma: ”Du läste sandslott i ett svep.”"
    - "I avslutningen frågar läraren vad de lärde sig av att läsa samma text flera gånger och börjar själv: ”Elias, första gången ljudade du ordet stranden med pauser. Nu läste du det direkt.” Elias säger: ”Jag sa ljuden utan paus.” Wilma säger: ”Jag stannade vid punkten.” Nora säger att vågorna förstör sandslottet. Efteråt noterar läraren: Elias hör ordet när ljuden kommer utan paus, och Samir läste ordet springer med hjälp av strategikortet. Texten flyter för Nora och Wilma, som får ta hem den. Gruppen läser den ett pass till, eftersom den ännu inte flyter för Elias och Samir."
fastnar:
  rubrik: När eleven fastnar på ett ord
  text: "Ge minsta möjliga stöd först. Har eleven läst fel, vänta tills meningen är slut och fråga: ”Stämde det?” I tabellen Läsfelen och strategierna ser du vilken strategi som hjälper vid varje läsfel."
  fragaForst:
    - Vad kan du göra?
  trappaText: "En stödtrappa att gå uppför i stunden. Ge inte nästa steg förrän eleven har prövat det föregående:"
  trappa:
    - Vänta tre sekunder, så att eleven hinner försöka själv.
    - Be eleven läsa om meningen från början.
    - Peka på strategikortet och fråga vilken strategi som kan hjälpa.
    - Visa strategin på ordet och låt eleven göra efter.
    - Säg ordet, låt eleven säga det och läsa om meningen.
  motto: "Till sist läser eleven ordet och meningen själv."
roll:
  rubrik: "Lärarens roll: lyssna, vänta och visa"
  text: "Du sitter nära eleven med texten mellan er och lutar dig fram mot texten. Eleven läser själv och följer med fingret under orden. Det är eleven som hittar ordet, med den strategi du har visat."
  gor:
    - Lyssna först, och välj två eller tre ord att visa.
    - Vänta tre sekunder innan du hjälper.
    - Ge varje elev konkret återkoppling under Läs igen.
    - "Beröm strategin eleven använder, och beröm när eleven rättar sig själv."
  undvik:
    - Att läsa med eller rätta i första läsningen.
    - Att säga ordet direkt när eleven tvekar.
    - Att be eleven gissa utifrån bilden.
    - Att byta text innan läsningen flyter.
urval:
  rubrik: Var hittar du texterna?
  text:
    - "Under Materialet finns en lästräningstext för varje vecka, en kort berättelse i två versioner. I texten med stöd delar bindestreck upp långa ord i delar som eleven känner igen, som våg-⁠or-⁠na och sand-⁠slott. En båge under orden visar vilka ord eleven läser i ett svep. Eleverna tränar först på texten med stöd och läser sedan samma text utan stöd. Texterna blir svårare vecka för vecka, från korta ljudenliga ord till repliker. I tabellen Lästräningstexterna vecka för vecka står veckans fokus och några ord ur varje text."
    - "Vid lästräningstexterna under Materialet står hur du gör ett eget läskort och var bågarna och bindestrecken ska sitta."
    - "Fler texter hittar du på samma sätt som i TIL i grupp. Välj lättlästa böcker på rätt nivå, gärna en bok ni redan läser. Nivåindelade serier som Kiwi, Stjärnsvenska och Beta Pedagog finns på många skolor för F–⁠3, och skolbiblioteket hjälper dig att hitta lättläst material. På steg 1 och 2 i lästrappan räcker fem till åtta korta meningar med ljudenliga ord, som i Hegas Lästrädet eller Bågens miniböcker. Byt text när den flyter för de flesta i gruppen och eleverna kan läsa orden också i en annan ordning."
  kravText: "Välj en text som uppfyller tre krav:"
  krav:
    - rubrik: Rätt nivå
      text: Varje elev läser minst nio ord av tio rätt första gången
    - rubrik: Kort
      text: "Fem till åtta korta meningar, på steg 3 högst en halv sida"
    - rubrik: Ord att öva på
      text: Ljudenliga ord först, sedan ord med ändelser eller två ord i ett
hem:
  rubrik: Hem och skola
  text:
    - "Läxan är frivillig. Den finns för att eleven ska läsa hemma också. När texten flyter i skolan får eleven ta hem en kopia och läsa den högt två eller tre gånger för någon hemma, med strategikortet. Första gången skickar du med lappen till vårdnadshavaren. Den finns under Materialet."
    - "Blir läxan ett bekymmer, till exempel för att ingen hemma kan lyssna, hoppar ni över den. Eleven får ändå läsa texten flera gånger med dig i skolan."
uppfoljning:
  text: "Före första passet och efter perioden läser eleven en ny text på samma nivå som i insatsen, en text ni inte har övat på. Använd protokollet Lästrappan före och efter, som finns under Materialet. Under perioden följer du eleven i första läsningen. Trappsteget stannar mellan dig och eleven. Visa det inte inför gruppen."
  rader:
    - nar: Före insatsen
      vad: Eleven läser en kort, ny text för dig. Fyll i protokollet Lästrappan före och efter.
    - nar: Varje vecka
      vad: "Skriv trappsteget i snabbmallen när eleven läser en ny text första gången. Står eleven kvar på samma steg i två veckor, byt veckans strategi eller ta en lättare text."
    - nar: Efter sex till åtta veckor
      vad: "Eleven läser en ny text som är lika lång och på samma nivå. Fyll i protokollet igen och jämför med starten. Berätta för eleven vad du har hört."
mal:
  text: "Efter perioden ska eleven ha gått upp några steg på lästrappan och oftare än förut:"
  punkter:
    - Säga ljuden utan paus och höra ordet
    - Dela långa ord i stavelser och orddelar
    - Märka när det inte stämmer och rätta sig själv
    - Läsa en text som när man pratar och berätta vad den handlar om
snabbmall:
  fore:
    - Dagens text och veckans strategi
    - Ord som eleverna kan fastna på
    - "Hur ni läser igen, och paren"
  efter:
    - Ord som fastnade, och strategin som hjälpte
    - Flyter texten? Går den hem?
    - Trappsteget för dem du lyssnade på
checklista:
  punkter:
    - Valt texten och läst den högt själv.
    - Kopierat texten till varje elev och till mig.
    - Lagt ett strategikort vid varje plats, och gärna ett läsrör.
    - "Bestämt hur eleverna ska läsa igen, och vilka som blir par."
    - Lagt fram snabbmallen för noteringen efteråt.
    - "Kopierat lappen hem, om eleven ska ta med sig texten."
grund:
  text: "Att läsa samma text flera gånger med en vuxen som lyssnar och ger återkoppling stärker ordläsningen och flytet (National Reading Panel, 2000; Therrien och Kubina, 2006). Två till fyra läsningar per pass räcker, gärna från eko och kör till par, och effekten blir störst när eleven får lyssna på texten innan hen läser den igen (Therrien, Gormley och Kubina, 2006; Kuhn, 2020; Lee och Yoon, 2017). Den amerikanska lärarguiden från IES rekommenderar att läraren väntar, ber eleven läsa om meningen och ger en strategi, och säger ordet först när det inte går att ljuda (Foorman m.fl., 2016). Att säga ljuden utan paus hjälper nybörjare att läsa nya ord (Gonzalez-Frey och Ehri, 2021), och undervisning om orddelar stärker avkodningen (Goodwin och Ahn, 2013). Upprepad läsning kompletterar strukturerad undervisning om ljud och bokstäver, och den undervisningen har starkast stöd vid dyslexi (SBU, 2014)."
  kallor: Bygger på National Reading Panel (2000), Therrien och Kubina (2006), Therrien, Gormley och Kubina (2006), Kuhn (2020), Lee och Yoon (2017), Foorman m.fl. (2016), Gonzalez-Frey och Ehri (2021), Goodwin och Ahn (2013) och SBU (2014).
ramar:
  rubrik: Materialet
  text:
    - "Här finns strategikortet, en lästräningstext för varje vecka, lappen hem och protokollet för lästrappan. Allt går att kopiera. Varje lästräningstext är en sida med två läskort, ett med stöd och ett med samma text utan stöd."
  ramar:
    - rubrik: Strategikortet
      text:
        - Varje elev har ett kort vid bordet och ett att ta med hem. Skriv ut kortet från lathundens tredje sida, och laminera gärna det som ligger i skolan.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så använder ni kortet
              text: "Visa en strategi i taget när du modellerar, och peka ut den på kortet. Elever på steg 1–⁠2 i lästrappan kan inte läsa kortet själva i början, så läs raden tillsammans med eleven och peka. Den som stöttar pekar på kortet innan någon säger ordet, och eleven säger vilken strategi som hjälpte."
      huvud:
        - rubrik: Namn
      listor:
        - rubrik: Mina lässtrategier
          rader:
            - - Läs hela ordet
              - Peka under ordet.
            - - Säg ljuden utan paus
              - sss-⁠ooo-⁠lll → sol
            - - Låter det som ett ord?
              - huuund? → hund
            - - Dela ordet
              - ba-⁠nan och last-⁠bil
            - - Hitta ordet i ordet
              - hund-⁠ar-⁠na och sol-⁠en
            - - Stämde det?
              - Läs meningen igen.
            - - Läs som när du pratar
              - Stanna vid punkten.
    - rubrik: Lästräningstexterna
      text:
        - "Det finns en sida för varje vecka, med två läskort som du klipper isär längs den streckade linjen. Eleven läser först texten med stöd och sedan samma text utan stöd."
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Så använder ni korten
              text: "Skriv ut veckans två kort till varje elev och laminera dem gärna. Eleven läser först texten med stöd och drar fingret längs bågarna. När det går lätt läser eleven samma text utan stöd. Veckans fokus och orden ur texten står i tabellen Lästräningstexterna vecka för vecka."
            - rubrik: Så gör du ett eget kort
              text: "Skriv fem till åtta korta meningar om något eleverna tycker om, med ord som de kan läsa. Skriv sedan samma text en gång till och lägg in bågar och bindestreck."
            - rubrik: Bågarna
              text: "En båge går under de ord som eleven läser i ett svep. Den börjar vid första bokstaven i det första ordet och slutar vid sista bokstaven i det sista. En båge har högst fyra ord, så en kort mening får en enda båge. En längre mening delar du där man pausar när man läser högt. Oftast är det efter ett komma, före och eller före ord som säger var, när eller hur, men det kan också vara mellan den som gör något och det hen gör. Har en del fortfarande mer än fyra ord delar du den igen. I ”Sam sover på en stol” går en båge under ”Sam sover” och en under ”på en stol”. Ett verb står ihop med sitt lilla ord, som i ”ropar på” och ”tittar upp”, och små ord följer med ordet de hör till, som i ”en ros” och ”på stranden”. Skiljetecken står utanför bågen."
            - rubrik: Bindestrecken
              text: "Dela ett sammansatt ord mellan orden, som sand-⁠slott och bak-⁠om. Dela substantiv och verb före ändelsen, som katt-⁠en, hund-⁠ar-⁠na och rop-⁠ar, men inte adjektiv, som bruna och hela. Är delen före ändelsen svår att säga delar du mellan stavelserna i stället, som vak-⁠nar och fåg-⁠lar. Andra ord med tre stavelser eller fler delar du mellan stavelserna, som när-⁠ma-⁠re. Namn och ord med en stavelse delar du inte, som Lisa, ser och snön."
