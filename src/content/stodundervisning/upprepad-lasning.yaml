    - rubrik: Lappen hem
      text:
        - "Skicka med lappen, texten och strategikortet första gången eleven tar med sig en text hem. Läxan är frivillig."
      huvud:
        - rubrik: Barnets namn
        - rubrik: Texten
      delar:
        - rubrik: Till vårdnadshavaren
          falt:
            - rubrik: Varför
              text: "Ditt barn övar på att läsa samma text flera gånger, tills orden går lätt och läsningen flyter. Barnet har redan läst texten flera gånger i skolan och får nu visa dig hur bra det går."
            - rubrik: Så gör ni
              text: Barnet läser texten högt för dig två eller tre gånger, gärna olika dagar. Sitt bredvid och följ med i texten. Prata gärna om vad texten handlar om.
            - rubrik: Om barnet fastnar
              text: "Vänta några sekunder. Peka på en strategi på strategikortet, till exempel ”Säg ljuden utan paus” eller ”Dela ordet”. Kommer ordet inte, säg det och låt barnet läsa om meningen. Säg vad barnet gjorde bra, till exempel: ”Du läste hela meningen själv.”"
            - rubrik: Om det inte passar
              text: Läxan är frivillig. Blir den ett bekymmer, hoppa över den och skriv gärna en rad till läraren.
