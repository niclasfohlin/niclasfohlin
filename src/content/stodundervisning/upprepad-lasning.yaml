# Metod i stödundervisning. Modellen står i src/content.config.ts och mallen i _mall.yaml.
titel: Upprepad läsning
undertitel: "Samma text flera gånger med lärarens nära stöd, en till en eller i grupp, för F–⁠3"
ingress: "I varje pass läser eleven en kort text flera gånger, på olika sätt. Läraren lyssnar och visar strategier för att läsa orden och förstå texten, och eleven sätter ord på dem. Det är en intensiv insats, en till en eller i grupp om högst sex, för elever i F–⁠3 som har knäckt läskoden men inte alltid hör vad de läser."
omrade: Läsning
arskurs:
  - F-3
taggar:
  - avkodning
  - lasflyt
  - intensivtraning
format:
  - enskilt
  - par
  - liten grupp
tid: 10–15 minuter per pass, tre till fem pass i veckan
period: Sex till åtta veckor
grupp: En till sex elever
material:
  - Veckans lästräningstext eller en annan kort text, en kopia per elev och en till dig
  - "Två strategikort per elev, ett vid bordet och ett att ta hem"
  - "Ett läsrör per elev om ni har, ett böjt rör från munnen till örat"
  - "Lappen hem, första gången eleven tar med sig en text"
  - Snabbmallen för noteringen efter passet
uppdaterad: 2026-09-27
relaterade:
  - til-i-grupp
  - laslistor-i-grupp
utkast: false
inledning:
  - "Upprepad läsning betyder att eleverna läser samma text flera gånger, tills orden går lätt och läsningen får flyt. Här arbetar ni utan tidtagning och diagram. I stället följer varje pass samma ordning: eleverna läser, läraren modellerar utifrån det hen har hört, och eleverna läser igen, till exempel i kör och i par. Texten är densamma genom hela passet."
  - "Syftet är att eleven ska läsa med flyt och förstå det hen läser. Då går orden lätt och läsningen låter som när man pratar, och när det tar stopp använder eleven en strategi på egen hand. Ditt uppdrag består av fyra saker. Eleverna läser samma text flera gånger, och du visar dem strategier i texten de läser. Eleverna sätter ord på strategierna vid bordet, och du följer läsflytet på lästrappan. Lästrappan har fem steg, från att gissa till att läsa med flyt, och målet är att eleven går upp några steg."
  - "Metoden är en intensiv insats för elever som har knäckt läskoden men inte alltid hör vad de läser, eller tappar förståelsen när de läser. Passen är korta, tre till fem gånger i veckan, och tränar flytet i läsningen. Upprepad läsning kompletterar undervisningen i ljud och bokstäver."
upplagg:
  rubrik: Så fungerar insatsen
  text: "Ett pass är tio till femton minuter och följer alltid samma fyra delar. Ni arbetar med en text per pass, eller med samma text under en hel vecka, tre till fem tillfällen i veckan. Insatsen pågår i sex till åtta veckor, och gruppen har en till sex elever. Välj en text som eleven klarar med visst stöd, gärna ur en bok ni redan läser. Byt text först när läsningen flyter. Metoden har också en färdig lästräningstext för varje vecka. Ni övar dessutom särskilt på en strategi i veckan. Den väljer du efter det du hör. Efter varje pass gör du en kort notering om vilka ord som fastnade och vilken strategi som hjälpte. När texten flyter får den gå hem, om det fungerar för eleven och familjen. Före första passet och efter perioden läser eleven en ny text för dig, och du ser på lästrappan hur långt eleven har kommit."
gruppen:
  rubrik: Så väljer du eleverna
  text: "Upprepad läsning är för elever i F–⁠3 som har knäckt läskoden men har problem med avkodningen. De har lärt sig den alfabetiska principen och kan läsa, men hör inte alltid vad de själva läser, eller så läser de på ett sätt som gör att de tappar förståelsen. De gissar efter första bokstaven, gör pauser mellan ljuden eller ljudar ihop orden men läser ord för ord, och de står på steg 1–⁠3 i lästrappan. Den som ännu inte säkert kopplar ljud till bokstav och binder ihop ljuden behöver den träningen först, till exempel med Läslistor i grupp. Före perioden läser varje elev en kort, ny text för dig, och du hör vilket steg eleven står på. Sätt ihop en grupp på en till sex elever som står på samma steg eller på två steg bredvid varandra, så att samma text passar alla. Står eleverna längre ifrån varandra, får varje elev eller par en egen text. Ordna eleverna från den säkraste läsaren till den minst säkra och dela listan på mitten. Den första i övre halvan läser med den första i nedre halvan, och så vidare. Med sex elever blir paren 1 och 4, 2 och 5 och 3 och 6. I varje par läser den säkrare först."
principer:
  rubrik: Fyra saker att hålla fast vid
  text: "Läs samma text hela passet, för det är omläsningen som ger flytet. Ta inte tid på läsningen. Lyssna efter om eleverna läser rätt, med flyt och med läsmelodi. Lyssna först och visa sedan, så att modelleringen bygger på det eleverna faktiskt gjorde i första läsningen. Låt alla pass gå till på samma sätt. När eleverna vet vad som ska hända kan de lägga kraften på läsningen."
tabeller:
  - rubrik: "Lästrappan: från att gissa till att läsa med flyt"
    plats: efter-inledning
    kolumner:
      - Trappsteg
      - Så läser eleven
      - "Så hjälper du eleven vidare"
    rader:
      - - "1 · Gissar"
        - Gissar ordet efter första bokstaven eller bilden, och känner igen några ord som ordbilder.
        - "”Läs hela ordet till slutet, med fingret under ordet.” ”Säg ljuden, inte bokstävernas namn.”"
      - - "2 · Ljudar med pauser"
        - Säger ljuden ett i taget med pauser, och hör inte alltid ordet.
        - "”Säg ljuden utan paus.” ”Låter det som ett ord du känner?”"
      - - "3 · Ljudar ihop"
        - Hör ordet när hen binder ihop ljuden, men läser ord för ord och ljudar också kända ord.
        - "”Dela långa ord i stavelser och orddelar.” ”Stämde det? Läs meningen igen.”"
      - - "4 · Läser i delar"
        - Läser långa ord i stavelser och orddelar, känner igen vanliga ord direkt och läser i korta fraser.
        - "”Läs som när du pratar och stanna vid punkten.” ”Rätta dig själv när det inte stämmer.”"
      - - "5 · Läser med flyt"
        - Läser de flesta ord direkt, i fraser med läsmelodi. Rättar sig själv och kan berätta vad texten handlar om.
        - "Ge eleven svårare texter och mycket läsning, också utanför insatsen."
    not: "Du hör flytet när eleven läser de flesta ord direkt och i fraser som hör ihop, när rösten går upp och ner och när eleven stannar vid punkten. Utan flyt läser eleven ord för ord, med pauser, omtag och jämn röst."
  - rubrik: Sätt att läsa igen
    plats: efter-tidsschema
    text: "Välj två eller fler sätt efter vad eleverna behöver och veckans fokus, gärna först ett där de läser tillsammans med dig och sedan ett där de läser själva. Fingret under orden gör att eleverna läser och inte bara härmar."
    kolumner:
      - Sättet och vad det är
      - Så går det till
      - Välj det när
    rader:
      - - |-
          Ekoläsning
          Eleverna läser efter dig, en bit i taget.
        - "Du läser en mening med läsmelodi, och eleverna läser den efter dig med fingret under orden. Ta längre bitar när det går, så att eleverna inte kan säga dem ur minnet."
        - "eleverna står på steg 1–⁠3 och behöver höra hur det låter först"
      - - |-
          Körläsning
          Alla läser samma text högt, samtidigt och med dig.
        - "Gruppen läser texten, eller de meningar som var svåra, tillsammans i ditt tempo medan du pekar. Börja långsamt, öka tempot när orden sitter och vänta in eleverna vid de svåra orden. Blir det många fel, modellera ordet igen och läs meningen i kör en gång till."
        - alla ska läsa orden rätt utan att stå ensamma, eller eleverna läser ord för ord
      - - |-
          Med dig eller för dig
          Du och eleven läser tillsammans, eller eleven läser för dig.
        - Ni läser tillsammans med texten mellan er, i elevens takt, och eleven knackar på bordet när hen vill läsa själv. Eller så läser eleven texten för dig, och du väntar, låter eleven rätta sig själv och ger återkoppling efteråt.
        - "eleven står på steg 1–⁠2, gissar eller ljudar och behöver höra orden läsas rätt eller få återkoppling på varje ord"
      - - |-
          Parläsning
          Två elever läser samma text för varandra och byter roller.
        - "En elev läser, den andra följer med i texten, pekar och peppar. Den som pekar ger stöd vid svåra ord: ljuda tillsammans, dela ordet i delar, läs meningen om från början. Efter en genomläsning byter de roller och läser samma text igen. Byt par mellan veckorna."
        - "eleverna står på steg 3–⁠5 och läser texten nästan själva, eller texten är bekant och kamraten kan rätta"
      - - |-
          Varannan mening
          Paret turas om, en mening var.
        - "Paret läser varannan mening, som en stafett, och den som lyssnar följer med fingret. Nästa gång börjar den andra i paret."
        - båda i paret ska läsa och följa med hela tiden
      - - |-
          Läsröret
          Eleven läser med låg röst i ett rör och hör sig själv.
        - "Alla läser med låg röst i sina läsrör samtidigt. Du knackar på en elevs text när du vill lyssna på just den eleven."
        - eleven behöver höra sin egen röst och sina fel, och du vill lyssna på en i taget
      - - |-
          Med stöd, sedan utan
          Eleven läser lästräningstexten med stöd och sedan samma text utan.
        - "Eleven drar fingret längs bågarna och läser orden under samma båge i ett svep. Bindestrecken visar delar som eleven känner igen i långa ord. När texten med stöd går lätt läser eleven samma text utan stöd."
        - "eleven står på steg 2–⁠4 och läser ord för ord eller fastnar i långa ord"
      - - |-
          Lästeater
          Eleverna läser en text med repliker, var och en sin roll.
        - "Välj en text med dialog och ge varje elev en roll. Du läser hela texten först, med olika röster. Eleverna övar sin replik med fingret under orden, och sedan läser ni texten tillsammans, var och en sin roll, för någon som lyssnar. Byt roller och läs igen."
        - "eleverna står på steg 3–⁠5 och texten har dialog och nästan flyter, till exempel sist i veckan"
      - - |-
          För en ny lyssnare
          Eleven läser texten för någon som inte har hört den.
        - Eleverna byter par på din signal och läser texten för en ny kamrat, två eller tre gånger. Eleven kan också läsa för en yngre elev eller ett gosedjur.
        - "eleverna står på steg 3–⁠5, texten nästan flyter och de behöver fler läsningar"
      - - |-
          Tyst läsning
          Eleven läser inne i huvudet, utan att säga orden.
        - "Eleven läser tyst med fingret under orden, sist i passet. Du kan inte höra om eleven läser fel."
        - "eleven står på steg 4–⁠5, avkodar säkert och texten flyter"
    not: "Läser ni samma text en hel vecka kan eleverna läsa mer på egen hand för varje pass som går. Börja med eko, gå sedan över till kör och par och sluta med en ny lyssnare eller lästeater. Stafettläsning i hela gruppen, där en läser och de andra väntar, ger lite läsning för var och en och gör många oroliga. Gör stafetten i par."
  - rubrik: Läsfelen och strategierna
    plats: efter-steg
    text: "Här står vanliga läsfel, från gissningar till att eleven inte hör sig själv, och den strategi som hjälper eleven vidare vid varje fel. Strategierna står med samma namn på elevens strategikort, och eleverna säger namnet när de använder strategin. Visa en strategi i taget, den som texten och eleven behöver."
    kolumner:
      - Läsfelet
      - Så låter det
      - Så lär du ut strategin
    rader:
      - - Gissar eller läser ur minnet
        - ”stora” för ”stranden”, eller orden rätt men fingret på fel ord
        - "”Läs hela ordet.” Täck bilden, för fingret under ordet och säg: ”Läs hela vägen till slutet.” Läser eleven ur minnet, peka på några ord i en annan ordning och fråga: ”Vilket ord står här?”"
      - - Gör pauser mellan ljuden och hör inte ordet
        - ”/t/ /a/ /k/”, sedan ”ka?”
        - "”Säg ljuden utan paus.” Dra ut s, l, m, r och vokalerna tills nästa ljud tar vid, som i sss-⁠ooo-⁠lll, sol. T, k och p går inte att dra ut. Säg dem kort och gå direkt vidare, som i taaak, tak. Hör eleven ändå inte ordet, backa till de två sista ljuden och bind ihop dem först. A och n blir an, och m och an blir man."
      - - Ljudar ihop till ett ord som inte finns
        - ”huuund”
        - "”Låter det som ett ord?” Fråga vilket ord det låter nästan som, och pröva kort eller lång vokal: hund. Känner eleven inte ordet, säg vad det betyder och låt eleven läsa om meningen."
      - - Långa ord faller isär
        - ”sand” och ”slott” med en paus emellan
        - "”Dela ordet.” Täck resten med fingret och läs en stavelse eller ett ord i taget, sedan hela ordet: ba-⁠nan, sand-⁠slott, last-⁠bil."
      - - Tappar eller byter ändelsen
        - ”hund” för ”hundarna”
        - "”Hitta ordet i ordet.” Ringa in ändelsen och visa grundordet: hund-⁠ar-⁠na, spring-⁠er, sol-⁠en."
      - - Läser ord för ord och förbi punkten
        - jämn röst, ingen paus vid punkten
        - "”Läs som när du pratar.” Läs meningen först med läsmelodi och låt eleven läsa efter. Peka på punkten och låt eleven svepa med fingret under hela frasen. När texten är bekant kan eleven sluta peka."
      - - Läser vidare fast det blev fel
        - ”Vi bygger ett sandslott på stanna.”
        - ”Stämde det?” Vänta tills meningen är slut, fråga om den stämde och låt eleven läsa om den. Beröm när eleven rättar sig själv.
      - - Hör inte sig själv
        - läser så tyst att felen går förbi, eller läser i kören utan att höra sin egen röst
        - Ge eleven ett läsrör att läsa halvhögt i, eller låt eleven spela in sin läsning och lyssna. Då hör eleven sin egen röst och sina egna fel.
    not: "”Säg ljuden utan paus” och ”Låter det som ett ord?” kan du använda redan i förskoleklass. Orddelarna tar ni upp när eleven binder ihop ljuden säkert, på steg 3 i lästrappan. Säg själv ord som inte låter som de stavas, till exempel ”jag” och ”de”, och låt eleven läsa om meningen."
  - rubrik: "Återkopplingen: vad du säger"
    plats: efter-fastnar
    text: "Ge varje elev konkret återkoppling minst en gång under Läs igen. Säg vad eleven gjorde och vilken strategi som hjälpte, så att eleven kan säga det själv vid bordet. Håll återkopplingen kort, ge den direkt och låt eleven göra jobbet. När eleven fastnar på ett ord följer du stödtrappan."
