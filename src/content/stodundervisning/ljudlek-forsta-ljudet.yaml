# Metod i stödundervisning. Modellen står i methods/_mall.yaml och docs/modell.md.
# En lektion i Ljudlek i grupp, skriven i lektionsskelettet: methods/ljudlek-i-grupp/_lektion.yaml.
titel: "Ljudlek: Första ljudet"
undertitel: "En lektion i Ljudlek i grupp: höra och säga första ljudet, känna det i munnen och skriva bokstaven, för F–⁠2"
ingress: "Eleverna säger det första ljudet i ord, känner det i munnen och sorterar bilder efter det. Sist skriver de bokstaven för ljudet själva. Lektionen hör till Ljudlek i grupp och har samma ljudstart och avslut som de andra lektionerna."
omrade: "Läsning"
arskurs:
  - "F-3"
arskursText: "F–2"
taggar:
  - "fonologisk-medvetenhet"
  - "bokstavskunskap"
  - "lasinlarning"
  - "intensivtraning"
format:
  - "liten grupp"
  - "par"
tid: "30 minuter per pass, tre till fem pass i veckan"
period: "Åtta till tolv pass i följd"
grupp: "2–12 elever"
material:
  - "Bildkorten under Materialet, två ark på en sida: arket för gruppens rad, ett per par och ett till dig, ditt gärna i A3"
  - "Bokstavskorten under Materialet och en spegel per par"
  - "En whiteboardtavla, en penna och en trasa per elev, eller papper och penna"
  - "Bokstavskartan i Ljudlek i grupp, en per par, till den som inte kan skriva bokstaven än"
  - "Snabbmallen före och efter passet"
uppdaterad: "2026-09-29"
utkast: false
serie: "ljudlek-i-grupp"
formaga: 3
tranar: "höra, säga och känna första ljudet, och koppla det till bokstaven"
inledning:
  - "I lektionen säger eleverna det första ljudet i ord, känner det i munnen och sorterar bilder efter det. Sist skriver de bokstaven för ljudet. Lektionen hjälper eleven med det som gör första ljudet svårt: ljuden i ett ord flyter ihop, så att eleven säger so för sol. Ibland kommer betydelsen, ett rim eller bokstavens namn i vägen."
  - "Syftet är att eleverna hör vilket ljud ett ord börjar med och vet vilken bokstav som står för ljudet, så att de kan börja skriva ord. Ditt uppdrag är att säga det första ljudet så att det hörs, att blanda korten så att eleverna lyssnar, och att koppla ljudet till bokstaven varje gång."
  - "Välj lektionen Första ljudet när fler än hälften av eleverna har färre än tre rätt av fyra på ljudkollens uppgift 3, första ljudet. Ljudkollen står i Ljudlek i grupp, och lektionen hör till förmåga 3, Första ljudet, i lektionsbanken där."
upplagg:
  rubrik: "Så används lektionen"
  text: "Passet har samma ram i alla lektioner: fem minuter ljudstart, 20 minuter lektion i fyra steg och fem minuter avslut. Ljudlek i grupp beskriver gruppen, dagens elever och ljudkollen. Lektionen går igenom raderna i Så blir lektionen svårare, oftast i åtta till tolv pass. Ta nästa rad när dagens elever säger första ljudet och visar rätt bokstav i minst fyra av sina fem ord i steg 4, två pass i följd. I trion räcker tre av fyra. Efter sista raden tar gruppen nästa lektion."
tabeller:
  - rubrik: "Så blir lektionen svårare"
    plats: "efter-inledning"
    kolumner:
      - "Ljuden"
      - "Så låter det"
      - "Så gör ni"
    rader:
      - - "Ljud att dra ut: s, r och m"
        - "sol: /s/. räv: /r/. mask: /m/."
        - "Dra ut det första ljudet och säg det sedan kort: sssol, /s/."
      - - "Vokal först: a, e, i och ö"
        - "apa: /a/. ekorre: /e/. is: /i/. öga: /ö/."
        - "Dra ut en lång vokal, aaapa, och säg en kort vokal kort: a, ananas. E låter olika i ekorre och i eld och elefant, men alla skrivs med e. Du räknar ä för eld och elefant som rätt."
      - - "Klusil först: t, p och k"
        - "tand: /t/. pil: /p/. ko: /k/."
        - "Säg klusilen kort och utan ö, och dra ut resten: p-⁠iiil, /p/."
      - - "Ljud som liknar varandra: v, f, p och b"
        - "våg: /v/. fisk: /f/. pannkaka: /p/. ben: /b/."
        - "Känn på halsen: vvv surrar, fff surrar inte. Känn luften mot handen vid /p/ men inte vid /b/."
      - - "Konsonantmöte först: s, t och b"
        - "sten: /s/. träd: /t/. bröd: /b/."
        - "Dra ut s:et, eller säg /t/ och /b/ korta, och sluta innan nästa ljud: sss, sten."
    not: "Varje rad har ett ark vikkort under Materialet. Nästa pass byter ni, så att korten från steg 1–⁠3 kommer i steg 4 och tvärtom. Är en av arkets bokstäver ny för gruppen, visar du den i steg 1, och i steg 4 pekar eleven ut den på bokstavskartan. Gruppen börjar i raden Ljud att dra ut. Hoppa över raden Ljud som liknar varandra när ljudkollens fel och steg 4 visar att ingen blandar ihop f och v eller p och b."
  - rubrik: "Ljudstarten: samma fem minuter varje pass"
    plats: "efter-tidsschema"
    text: "Alla svarar samtidigt. Vänd ansiktet mot eleverna, så att de ser din mun."
    kolumner:
      - "Moment"
      - "Så gör du"
    rader:
      - - "Dagens ljud"
        - "Visa bokstaven och säg ljudet. Alla säger efter, och någon säger ett ord på ljudet. Sist säger alla ljuden för några bokstäver ni har haft."
      - - "Sätt ihop"
        - "Dra ut fem ord utan paus, med handen från vänster till höger sett från eleverna. Räkna tyst till tre och knyt handen, så säger alla ordet. Sist säger en av dagens elever ett ord ensam."
      - - "Dela upp"
        - "Säg fyra ord med olika många ljud. Alla säger ordet och sedan ljuden, med ett finger för varje, och räknar fingrarna sist. I lektionerna före Räkna ljud i banken säger du ljuden först och gruppen efter."
    not: "Säg ljudet och inte bokstavens namn, och b, d, g, k, p och t korta och utan ö. Orden tar du ur Ordbanken, och i Dela upp blandar du in ord ur de lättare ordgrupperna, så att orden har olika många ljud. Dagens ljud, dina fraser och ordgrupperna står i Ljudlek i grupp. Gruppen behåller sin ordgrupp från lektion till lektion."
  - rubrik: "Lyssna efter"
    plats: "efter-steg"
    text: "Bekräfta först det som eleven gjorde rätt, och försök sedan igen tillsammans."
    kolumner:
      - "Eleven säger"
      - "Det som händer"
      - "Så gör du"
    rader:
      - - "”ess” för sol, ”tö” för tand"
        - "Eleven säger bokstavens namn, eller ett ö efter klusilen"
        - "”Ess är namnet. Ljudet är sss.” Säg /t/ kort och utan ö."
      - - "”so” för sol, ”st” för sten, ”br” för bröd"
        - "Eleven säger mer än det första ljudet"
        - "”Bara det första: sss.” Säg /b/ kort och sluta innan r:et."
      - - "”bol” eller ”varm” för sol"
        - "Eleven rimmar, eller tänker på vad ordet betyder"
        - "”Lyssna på hur ordet låter: sssol. Vad hör du först?”"
      - - "/v/ för fisk, /b/ för pannkaka, /j/ för /r/"
        - "Eleven blandar ihop ljud som liknar varandra, eller kan inte säga ljudet än"
        - "”Känn på halsen: fff surrar inte, vvv surrar.” Skriver eleven rätt bokstav eller pekar på den, räknar du kortet som rätt, också när eleven säger ljudet annorlunda."
      - - "skärm som ett ord på /s/"
        - "Ordet börjar på bokstaven men inte på ljudet"
        - "”Skärm börjar på ett annat ljud. Vi letar efter ord som börjar på sss.”"
      - - "”orm” om masken"
        - "Eleven kallar bilden något annat"
        - "”Det här är en mask. Vi säger mask: mmmask.”"
  - rubrik: "Varianter"
    plats: "efter-urval"
    text: "Byt till en variant när gruppen behöver något nytt, i samma steg."
    kolumner:
      - "Variant"
      - "Så gör ni"
      - "När den passar"
    rader:
      - - "Ett kort ut"
        - "Du lägger fram tre kort, och gruppen hittar det som börjar annorlunda."
        - "Steg 2, när gruppen sorterar säkert i steg 3"
      - - "Ljudsafari"
        - "Paret letar i rummet efter saker som börjar på arkets ljud och säger ordet och ljudet. Du skriver bokstaven på den stora tavlan och föreslår inga ord ur ljudkollen eller screeningen."
        - "Steg 3, när gruppen behöver röra sig"
      - - "Mitt ljud"
        - "Var och en säger första ljudet i sitt namn, som det låter: Hjalmar börjar med /j/. Var och en letar upp kort som börjar likadant, eller säger ett eget ord."
        - "Steg 2, första passet"
  - rubrik: "Ordbanken"
    plats: "efter-urval"
    text: "Här är orden till ljudstarten, i sex ordgrupper från lätt till svårt. Alla ord är ljudenliga, med ett ljud för varje bokstav."
    kolumner:
      - "Ordgrupp"
      - "Orden"
    rader:
      - - "Två ljud att dra ut"
        - "is, ål, se, le, ro, sy, nu, ny, så"
      - - "Tre ljud att dra ut"
        - "sol, lus, mus, mos, vas, mål, nål, mås, sås, räv, säl, hår"
      - - "Med klusil"
        - "mat, lök, nöt, pil, gås, kål, gul, bad, båt, tåg, duk, tak"
      - - "Två stavelser"
        - "sola, mosa, lera, rasa, mera, läsa, måla, leta, vila, bada, baka, kaka"
      - - "Konsonantmöte först"
        - "snö, blå, sko, bro, tre, grå, klo, stå, sten, stol, glas, svan, stor, smör"
      - - "Konsonantmöte sist"
        - "fisk, mask, hand, sand, hund, vind, land, hals, rund, tält"
    not: "Orden står i ordning, lättast först. Hur du säger orden och vilka ord som väntar står under Ordbanken i Ljudlek i grupp."
principer:
  rubrik: "Tre saker att hålla fast vid"
  text: "Säg ljudet och aldrig bokstavens namn: dra ut det som går att dra ut, sssol, och säg en klusil kort, /t/. Varje ark har tre eller fyra första ljud, med lika många kort för varje, så att eleverna lyssnar i stället för att gissa. Visa bokstaven varje gång: på bordet i steg 1 och 2, och på kortets baksida."
passrutin:
  text: "Lektionen går i fyra steg, från att du visar till att var och en gör själv."
  steg:
    - text: "Du visar första ljudet i munnen och lägger ett kort under varje bokstav."
      fas: "Ljudet i munnen"
    - text: "Gruppen säger ordet och det första ljudet och pekar på bokstaven samtidigt."
      fas: "Peka på bokstaven"
    - text: "Paret sorterar sex kort efter det första ljudet och vänder dem för att kontrollera."
      fas: "Sortera"
    - text: "Var och en skriver bokstaven för första ljudet, säger ljudet igen och vänder kortet."
      fas: "Skriv första ljudet"
  efterPasset: "Du noterar i snabbmallen vilka av dagens elever som sa första ljudet och visade rätt bokstav, vad som fastnade, och om gruppen tar samma rad, nästa rad eller nästa lektion."
tidsschema:
  rubrik: "Ett pass på 30 minuter"
  text: "Är passet bara 20 minuter blir ljudstarten tre minuter, lektionen 15 och avslutet två. Stegen får då två, fyra, fem och fyra minuter."
  rader:
    - tid: "Före passet"
      fas: "Förberedelse"
      vad: "Ta fram arken, bokstavskorten, bokstavskartan och speglarna, och en tavla, en penna och en trasa per elev. Med fler än sex elever skriver du arkets bokstäver på varje tavla. Välj orden till ljudstarten ur Ordbanken och två ord till steg 4, och skriv dem, paren och dagens elever i snabbmallen."
    - tid: "0–5 min"
      fas: "Ljudstart"
      vad: "Visa dagens ljud, sätt ihop fem ord och dela upp fyra, som i Ljudstarten. Alla svarar samtidigt."
    - tid: "5–9 min"
      fas: "Ljudet i munnen"
      vad: "Ta arkets bokstavskort och ett av de sex första korten till varje bokstav. Alla tittar i parets spegel."
    - tid: "9–15 min"
      fas: "Peka på bokstaven"
      vad: "Ta arkets sex första kort. Alla pekar samtidigt, och du ser varje elev."
    - tid: "15–20 min"
      fas: "Sortera"
      vad: "Paret tar arkets sex första kort och turas om. Du går mellan paren."
    - tid: "20–25 min"
      fas: "Skriv första ljudet"
      vad: "Paret delar arkets sex sista kort, tre var, och du säger två ord till. Du lyssnar på dagens elever."
    - tid: "25–30 min"
      fas: "Avslut"
      vad: "Var och en säger ett ord från dagens lek och vad hen gjorde med det. Du säger kort vad du hörde."
  efter: "Den som är klar före de andra viskar ett eget ord på samma ljud till sin kamrat."
steg:
  rubrik: "Vad du gör och säger i varje steg"
  text: "Här är lärarens ord, så att du kan säga dem som de står."
  fraserRubrik: "Exempelfraser"
  rader:
    - namn: "Ljudet i munnen"
      fraga: "Vilket ljud hör jag först?"
      gor: "Lägg arkets bokstavskort rättvända för eleverna. Första passet med ett nytt ark säger ni i kör vad arkets tolv bilder heter, och du förklarar nya ord. Ta ett kort till varje bokstav, säg ordet och sedan bara det första ljudet. Alla säger det och tittar i parets spegel. Lägg kortet under bokstaven och vänd det. Visa ett vanligt fel: ”So är för mycket. Bara sss.”"
      fraser:
        - "Sssol börjar med ssss."
        - "Känn läpparna vid /m/."
        - "Solen hamnar under /s/."
    - namn: "Peka på bokstaven"
      fraga: "Vilket ljud hör vi först?"
      gor: "Blanda arkets sex första kort och visa ett i taget. På ditt tecken säger alla ordet och det första ljudet och pekar på bokstaven, och en elev lägger kortet under den. Minska stödet efter hand: säg ordet utan att dra ut det, och låt alla peka innan ni säger ljudet. Med fler än sex elever pekar var och en på sin tavla, där arkets bokstäver står."
      fraser:
        - "Räv. Dra ut det första: rrräv."
        - "Vilket ljud? Peka, alla samtidigt."
        - "Rrr. Räven hamnar under /r/."
    - namn: "Sortera"
      fraga: "Vilket ljud hör du först?"
      gor: "Paret blandar korten. Den ena säger ordet och det första ljudet och lägger kortet i en hög för ljudet. Den andra säger efter och säger om det stämmer. Sedan byter de. Sist vänder de korten och ser om varje hög har samma första bokstav. Stämmer ett kort inte, säger de ordet igen eller lägger kortet åt sidan till dig."
      fraser:
        - "Säg ordet och det första ljudet."
        - "Börjar de likadant? Säg båda."
        - "Vänd korten. Samma bokstav först?"
    - namn: "Skriv första ljudet"
      fraga: "Kan du göra det själv?"
      gor: "Paret delar arkets sex sista kort, tre var. Trion tar två var. Var och en säger ordet och det första ljudet, skriver bokstaven, pekar på den, säger ljudet igen och vänder kortet. Den som inte kan skriva bokstaven än pekar ut den på bokstavskartan. Sist säger du två ord som börjar med arkets ljud men inte står på arket, och alla skriver bokstaven. Ta dem ur Ordbanken och aldrig ur ljudkollen. I raden Vokal först tar du arm och öken."
      fraser:
        - "Säg det första ljudet och skriv bokstaven."
        - "Du skrev /s/. Det är första ljudet i sol."
        - "Peka på din bokstav och säg ljudet."
arbetsform:
  rubrik: "Arbetsform: alla i kör, växlande, gemensamt"
  text: "I ljudstarten svarar alla samtidigt, och i lektionen går ni från att du visar till att var och en gör själv. Paren och trion sätter du ihop som i Ljudlek i grupp. Den som ännu inte hör det första ljudet säger orden med dig och blir dagens elev oftare."
  delar:
    - rubrik: "1. Alla i kör"
      text: "alla svarar"
      faser:
        - "Ljudstart"
    - rubrik: "2. Växlande"
      text: "du visar, tillsammans, i par, själv"
      faser:
        - "Ljudet i munnen"
        - "Peka på bokstaven"
        - "Sortera"
        - "Skriv första ljudet"
    - rubrik: "3. Gemensamt"
      text: "ett ord var"
      faser:
        - "Avslut"
exempel:
  valt:
    rubrik: "Gruppen"
    text: "sex elever i förskoleklass och åk 1, vecka 3, tre pass i veckan. Gruppen gör lektionen för första gången och står i raden Ljud att dra ut. Dagens ljud är /m/, och dagens elever är Leo och Elin."
  text:
    - "Ljudstarten. Läraren visar m, och alla säger mmm och känner läpparna. Elin säger ett ord på ljudet: ”mus”."
    - "Ljudet i munnen. Läraren lägger s, r och m på bordet, och gruppen säger vad arkets tolv bilder heter. Läraren tar solen: ”Sssol börjar med ssss.” Alla säger sss och tittar i spegeln. Sedan räv och myra."
    - "Peka på bokstaven. Läraren visar masken. Alla säger ”mmmask” och pekar på m. Vid raketen säger Leo ”ra”. Läraren säger: ”Rrraket. Bara det första: rrr.” Leo pekar på r."
    - "Sortera. Paren är Alva och Elin, Omar och Noah, Leo och Mira. Noah tar saltet och säger ”salt, sss”, och Omar säger efter. Sist vänder de korten i s-⁠högen: båda börjar med s."
    - "Skriv första ljudet. Läraren lyssnar på Leo och Elin. Elin säger ”mmmorot” och skriver m. Leo säger ”ess” om salladen. Läraren säger: ”Ess är namnet. Hur låter den?” Leo säger sss och pekar ut s på kartan. Sist säger läraren mås och ro, och alla skriver."
    - "Avslutet. Mira säger: ”Räka. Rrr.” Läraren säger: ”Ni hittade det första ljudet och bokstaven.”"
    - "Efteråt noterar läraren: Elin säger första ljudet och skriver bokstaven. Leo säger ibland bokstavens namn. Nästa pass tar gruppen samma rad, och dagens elever blir Alva och Omar."
fastnar:
  rubrik: "När eleven fastnar"
  text: "Vänta tre sekunder och ge minsta möjliga stöd först. Blir det många fel i gruppen, säg det i kör, låt sedan några elever säga det ensamma och ta samma ord minst tre gånger."
  fragaForst:
    - "Vad hör du?"
  trappaText: "Gå uppför stödtrappan i stunden. Ge inte nästa stöd förrän eleven har prövat det förra:"
  trappa:
    - "Säg det igen, långsamt: sssol. Säg sedan bara sss, eller säg /t/ kort i tand."
    - "Visa hur munnen gör. Eleven tittar i spegeln och känner efter: sss vid tänderna, läpparna ihop vid /m/ och /p/."
    - "Gör uppgiften mindre: två kort att välja mellan, börjar sol som säl eller som mask?"
    - "Visa med handen eller med något att flytta: en hand för sss och en för ol."
    - "Säg det tillsammans, och låt eleven säga det själv efteråt: sss, sol."
  motto: "Till sist hör eleven det första ljudet själv."
urval:
  rubrik: "Var hittar du orden och materialet?"
  text:
    - "Bildkorten står under Materialet, med ett ark för varje rad i Så blir lektionen svårare. Bokstavskartan står i Ljudlek i grupp och orden till ljudstarten i Ordbanken."
    - "Egna ord går också bra, utom orden i ljudkollen och i screeningens version B."
  kravText: "Tre krav gäller egna ord:"
  krav:
    - rubrik: "Kända ord"
      text: "Eleven vet vad ordet betyder"
    - rubrik: "Bokstaven stämmer"
      text: "Första bokstaven låter som första ljudet, och du visar en ny bokstav, som med arken"
    - rubrik: "Lika många"
      text: "Tre eller fyra första ljud på arket, lika många kort för varje"
uppfoljning:
  text: "Du ser i steg 4 vad eleverna klarar, och ljudkollen var tredje vecka visar samma sak för varje elev. Berätta konkret för eleven vad hen har lärt sig."
  rader:
    - nar: "Under passet"
      vad: "I steg 4 lyssnar du på dagens elever: säger eleven bara det första ljudet och inte bokstavens namn, och visar hen rätt bokstav?"
    - nar: "Efter varje pass"
      vad: "I snabbmallen noterar du dagens elever och det som fastnade."
    - nar: "Var tredje vecka"
      vad: "Du gör ljudkollens uppgift 3 om första ljudet och uppgift 4 om bokstävernas ljud."
mal:
  rubrik: "Mål: vad eleven ska kunna efter lektionen"
  text: "Efter lektionen ska eleven kunna:"
  punkter:
    - "säga det första ljudet i ord, också när det är en vokal eller en klusil"
    - "säga ljudet och inte bokstavens namn"
    - "skriva eller visa bokstaven för det första ljudet"
    - "höra det första ljudet också när ordet börjar med ett konsonantmöte, som i sten"
snabbmall:
  fore:
    - "Raden, arkets ljud och de sex korten i steg 4"
    - "Dagens ljud och orden ur Ordbanken"
    - "Paren och dagens elever"
  efter:
    - "Vilka av dagens elever sa första ljudet och visade rätt bokstav?"
    - "Ord och ljud som fastnade"
    - "Nästa pass: samma rad, nästa rad eller nästa lektion?"
grund:
  text: "Övningar i att höra när ord börjar likadant var lättare att genomföra än övningar i att dela upp ord, och flera barn förde över insikten till ljud som de inte hade övat (Byrne och Fielding-⁠Barnsley, 1990, i Murray, 1994). Undervisningen ger mer när bokstäverna är med och grupperna är små (National Reading Panel, 2000). Att se och känna hur munnen formar ljudet hjälpte eleverna att föra över ljudträningen till läsningen (Castiglioni-⁠Spalten och Ehri, 2003; Fälth m.fl., 2017)."
  kallor: "Bygger på Byrne och Fielding-⁠Barnsley (1990), Castiglioni-⁠Spalten och Ehri (2003), Fälth m.fl. (2017), Murray (1994) och National Reading Panel (2000)."
ramar:
  rubrik: "Materialet"
  text:
    - "Här finns bokstavskorten och bildkorten, med ett ark för varje rad i Så blir lektionen svårare. Bokstavskartan står i Ljudlek i grupp. Allt går att kopiera. Laminera bokstavskorten och bokstavskartorna, och bildkorten när de är vikta och limmade."
  ramar:
    - rubrik: "Bildkorten"
      text:
        - "Varje ark har tre eller fyra första ljud och lika många kort för varje, så att eleverna lyssnar i stället för att gissa. Arket står två gånger på sidan, så en sida räcker till två par, eller till ett par och dig. Skriv ut sidan för gruppens rad. Med tolv elever behöver du fyra sidor. Arket Konsonantmöte först har också ord utan konsonantmöte, så att sten hamnar hos sol."
      delar:
        - rubrik: "Till läraren"
          falt:
            - rubrik: "Så gör du"
              text: "Klipp längs strecken och vik varje kort längs den blå prickade linjen, så att bilden blir framsidan och ordet baksidan. Limma ihop halvorna och laminera sist. Vänd kortet som en sida i en bok, så står ordet rätt. Prickarna under ordet hör till Räkna ljud, och här tittar ni bara på den första bokstaven. Håll ihop arkets sex första kort för sig och de sex sista för sig, med var sitt gem. Ni tar de sex första i steg 1–⁠3 och de sex sista i steg 4, och nästa pass byter ni. Första passet med ett nytt ark säger ni i kör vad bilderna heter, och du säger vad orden betyder: ”Det här är en bäver. En bäver är ett djur som bygger dammar av pinnar.”"
      listor:
        - rubrik: "Bildkort · Ljud att dra ut: s, r och m"
          rader:
            - - "sol"
              - "myra"
              - "raket"
            - - "räv"
              - "salt"
              - "mask"
            - - "melon"
              - "säl"
              - "räka"
            - - "robot"
              - "morot"
              - "sallad"
        - rubrik: "Bildkort · Vokal först: a, e, i och ö"
