checklista:
  punkter:
    - Läst texten, lärarens sida och modellens sida.
    - Kopierat texten enkelsidigt till varje elev.
    - "Läspasset: pennor, post-it-lappar, kortet När det skaver och bladet Kärnorna på A3."
    - "Modellpasset: veckans modell på A3, exemplet om skolan, elevernas texter och bladet Kärnorna med lapparna."
    - Bestämt paren, och från vecka 3 vilka som börjar med jobbkorten.
grund:
  text: Metoden bygger på Collaborative Strategic Reading, där elever i små grupper förbereder läsningen, reder ut det som skaver, fångar kärnan och ställer frågor om det de har läst (Klingner och Vaughn, 1996, 1998). I helklass har arbetssättet gett små effekter på läsförståelsen i åk 6–8 (Boardman m.fl., 2015) och ingen säkerställd effekt i en stor studie i åk 5 (Hitchcock m.fl., 2011). I en studie i åk 4–5 syntes ingen effekt för eleverna som helhet, men en tydlig för eleverna med inlärningssvårigheter (Boardman m.fl., 2016). Årskurserna är de amerikanska, där eleverna är omkring ett år yngre än i svensk årskurs med samma nummer. Rutinen för kärnan, strecket under det som skaver och ringen runt vem eller vad kommer ur en amerikansk vägledning för läsinsatser i åk 4–9 (Vaughn m.fl., 2022). Frågorna om författarens val kommer ur Questioning the Author (Beck och McKeown, 2002). Att undervisa om hur faktatexter är byggda, med en grafisk modell, har stöd i två forskningsöversikter (Dexter och Hughes, 2011; Hebert m.fl., 2016), och rådet att ta en struktur i taget kommer ur Roehling m.fl. (2017). Sådan undervisning ger god effekt när den mäts med forskarnas egna prov och liten effekt på allmän läsförståelse, och effekten finns också för elever med inlärningssvårigheter. Eftersom effekten på allmän läsförståelse är liten slutar perioden med klassens texter, där eleverna använder modellerna i sin vanliga läsning.
  kallor: Bygger på Klingner och Vaughn (1996, 1998), Beck och McKeown (2002), Bremer m.fl. (2002), Hitchcock m.fl. (2011), Dexter och Hughes (2011), Meyer och Ray (2011), Boardman m.fl. (2015, 2016), Hebert m.fl. (2016), Roehling m.fl. (2017) och Vaughn m.fl. (2022).
lathund:
  innehall: En faktatext i veckan
  metoden:
    text:
      - Gruppen läser en faktatext i veckan, ett avsnitt i taget. Eleverna stryker under det som skaver, ni reder ut det, och gruppen skriver avsnittets kärna på en post-it-lapp, med högst tio ord.
      - "Varje text har två pass: läspasset och modellpasset. I modellpasset lägger gruppen lapparna i veckans modell, skriver dit textens ord för sambanden och svarar på textens fråga. Var och en säger sin sak till den bredvid innan någon säger den till gruppen."
    ruta:
      rubrik: Tre saker att hålla fast vid
      punkter:
        - fet: Kärnan är gruppens.
          text: Eleverna säger den med egna ord innan de skriver.
        - fet: Fråga hellre än förklara.
          text: ”Var skavde det?” ”Var står det?”
        - fet: Det som skaver är textens sak.
          text: Den som stannar har gjort det en god läsare gör.
    tabell:
      rubrik: Läspasset i tre delar
      kolumner:
        - Del
        - Exempelfraser
      rader:
        - - |-
            1 · Förbered
            Frågan, bilderna och orden
          - |-
            ”Vad tror ni?”
            ”Vad ser ni på bilderna?”
        - - |-
            2 · Läs och fånga
            Ett avsnitt i taget, i fyra steg
          - |-
            Läs: ”Stryk under det som skaver.”
            Red ut: ”Var skavde det?” ”Var i bilden är vi nu?”
            Kärnan: ”Vem eller vad? Vad är det viktigaste om det?”
            Lappen: ”Hur hänger det ihop med det vi läste innan?”
        - - |-
            3 · Avsluta
            Lapparna i följd
          - ”Vet vi mer nu?”
    not: "När det skaver: läs om, leta efter en ledtråd, dela ordet och fråga en kamrat. Sist förklarar du kort."
  pass:
    rubrik: Läspasset med Vattenplaneten
    textRubrik: Gruppen · fyra elever i åk 5 · nivån Bas · vecka 1
    titel: Vattenplaneten
    text:
      - "Texten ligger nedvänd. Läraren läser textens fråga: hur många av hundra hinkar vatten kan vi dricka ur? Alla gissar i par: femtio, tjugo, tio och åttio."
      - "Läraren läser det första avsnittet högt och tänker högt: var det skaver, vem eller vad avsnittet handlar om och det viktigaste om det. Läraren skriver den första post-it-lappen."
      - "Paren läser nästa avsnitt. ”Var skavde det?” Hugos kärna är ”Sötvatten är inte sött”. Läraren frågar var det mesta sötvattnet finns, och Amina säger: ”Det mesta sötvattnet är fruset.” Hugo väljer Aminas kärna, och gruppen skriver lappen."
      - De två sista avsnitten går likadant. Sist läser Amina de fyra lapparna, och Hugo ändrar sin gissning till en hink.
    forberett:
      rubrik: Det jag förberett
      text:
        - Läst texten och lärarens sida. Orden före läsningen är sötvatten och grundvatten. I avsnitt 1 lockar 71 procent, och kärnan behöver ha med ”nästan allt vatten” och salt.
    klarTidigt: Paret skriver på textens baksida en fråga som avsnittet svarar på.
    schema:
      rubrik: Läspasset på 40 minuter
      rader:
        - tid: Före
          fas: Förberedelse
          vad: Läs texten och lärarens sida. Lägg fram texterna, pennor, post-it-lappar, kortet När det skaver och bladet Kärnorna.
        - tid: 0–5
          fas: 1 · Förbered
          vad: Läs textens fråga med texten nedvänd. Alla gissar. Se på bilderna och rubrikerna, och red ut orden.
        - tid: 5–35
          fas: 2 · Läs och fånga
          vad: "Avsnitt 1 läser du (sex minuter), paren de andra (omkring åtta var). Läs: paret stryker under. Red ut: paret med kortet, sedan gruppen. Kärnan: alla ringar in vem eller vad och säger kärnan i paret, sedan gruppen. Lappen: gruppen."
        - tid: 35–40
          fas: 3 · Avsluta
          vad: En elev läser lapparna i följd. Var och en säger till den bredvid vad hen tror nu. ”Vet vi mer nu?”
  mall:
    rubrik: Modellpasset, modellerna och veckorna
    underrad: Textens andra pass · post-it-lapparna blir en bild av hela texten
    block:
      - typ: tabell
        rubrik: Modellpasset i fem delar
        kolumner:
          - Minut och del
          - Det ni gör
        rader:
          - - 0–6 · Fördjupningen
            - En elev läser lapparna, du läser fördjupningen, och gruppen skriver den femte lappen
          - - 6–18 · Modellen
            - "Du visar exemplet om skolan (vecka 1–5). Gruppen lägger lapparna: ”Var hör den här lappen hemma?”"
          - - 18–23 · Orden
            - "Paren skriver textens ord i flikarna: ”Vilket ord i texten visar det?”"
          - - 23–33 · Svaret
            - Var och en återger texten ur modellen, skriver svaret och läser det för den bredvid
          - - 33–40 · Samtala
            - "Rutan Visste du att: ”Håller svaret utan den?” ”Skrev författaren tydligt, eller saknas något?”"
      - typ: tabell
        rubrik: Vecka för vecka
        kolumner:
          - Vecka
          - Det som är nytt
        rader:
          - - "1"
            - Du tänker högt och lägger den första lappen
          - - "2"
            - Du tänker högt. Gruppen prövar en känd modell
          - - 3–4
            - Två elever i taget har jobbkorten, från avsnitt 2
          - - "5"
            - De med jobbkorten leder det sista avsnittet
          - - "6"
            - Klassens text. Du tänker högt och väljer modell
          - - 7–8
            - De med jobbkorten leder. Gruppen väljer modell
      - typ: tabell
        rubrik: De fem modellerna
        kolumner:
          - Modellens fråga
          - Modellen
          - Textens ord
        rader:
          - - Vad beskriver texten, och vilka delar har det?
            - Tankekartan
            - den största, en annan del, också
          - - Vad händer, och i vilken ordning?
            - Tidslinjen
            - först, sedan, till sist
          - - Vilka två saker jämförs, och vad är lika och vad är olika?
            - Venndiagrammet
            - båda, medan, men
          - - Vad händer, och vad leder det till?
            - Kedjan
            - därför, det gör att, eftersom
          - - Vad är problemet, och hur löses det?
            - Problem och lösning
            - problemet är, en lösning är
      - typ: not
        text: "I vecka 2–5 prövar gruppen först en modell den kan: ”Passar den här? Varför inte?” I vecka 6–8 börjar passet med att var och en återger en gammal text ur en sparad modell. Klassens text har ingen fördjupning och ingen ruta Visste du att: låt gruppen välja en detalj att pröva."
  material:
    rubrik: Vad du behöver för ett faktatextsamtal
    kravEtikett: Krav på egen text
    var:
      rubrik: Var materialet finns
      punkter:
        - fet: Texterna.
          text: Texterna i tre nivåer, med lärarens sida före varje.
        - fet: Modellerna.
          text: Fem modeller, med ett exempel och tre blad var.
        - fet: Bladen och korten.
          text: Kärnorna, När det skaver, Jobbkorten, Egen text och Kartläggningen.
      efter: Allt står under Texterna och materialet.
    bordet:
      - Veckans text, enkelsidig, en per elev
      - Pennor och post-it-lappar
      - Kortet När det skaver, ett per par
      - Bladet Kärnorna, på A3
      - "I modellpasset: veckans modell på A3 och exemplet om skolan"
      - "Gruppens sparade modeller: en i vecka 2–5, alla fem i vecka 6–8"
