    alt: "Eleven läser bladet Text 2, Björnens vinter, i kartläggningen efter åtta veckor. Bladet har en rad för namnet, och under rubriken står två rader till eleven: ”Läs meningarna först” och ”Läs sedan texten med en penna i handen, ett avsnitt i taget”. Under dem står de fyra meningarna om Elsa, i en ruta med frågan om något är konstigt. Sedan kommer texten i två avsnitt, Bär hela hösten och Vintern i idet. Sist står bilden av björnen på hösten och på vintern, med orden Bär, Myrstack och Ide."
