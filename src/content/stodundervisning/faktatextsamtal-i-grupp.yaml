  - rubrik: "Vecka 6–8: klassens texter"
    plats: efter-urval
    meny: true
    text: De sista veckorna läser gruppen det klassen läser, så att eleverna använder det de har lärt sig där de behöver det.
    kolumner:
      - Frågan
      - Svaret
    rader:
      - - Vilken text?
        - Den text klassen läser härnäst i SO eller NO, en till två sidor. Ni tar en ny text varje vecka. Fråga läraren i ämnet. Kommer eleverna ur flera klasser tar ni en text från en klass i taget.
      - - Hur förbereder du den?
        - "Med bladet Egen text, som blir lärarens sida till texten: dela texten i fyra avsnitt av nivåns längd, välj orden att reda ut, skriv textens fråga och välj modell. Det tar omkring tjugo minuter."
      - - Hur börjar modellpasset?
        - En elev läser lapparna. Sedan väljer var och en bland gruppens fem modeller från vecka 1–5 och återger på en minut den modellens text för den bredvid.
      - - Vilken modell?
        - Den som rymmer flest av lapparna. Ditt val står på bladet Egen text. Väljer gruppen en annan, ritar ni den på ett A3.
      - - Hur väljer gruppen?
        - "I vecka 6 visar du hur du väljer. I vecka 7 och 8 prövar paren med modellernas frågor: de pekar på en modell och visar ett ställe i texten som talar för den. När modellen är vald lägger du fram den tomma modellen."
      - - Vad blir annorlunda?
        - Klassens text har ingen fördjupning och ingen ruta Visste du att. Gruppen väljer därför själv en detalj och prövar om den är viktig eller intressant. I läspasset tänker du högt i avsnitt 1 i vecka 6, och två elever har jobbkorten från avsnitt 2.
    not: När klassen läser texten har gruppen redan läst den. Det ger eleverna ett försprång i lektionen. Läraren i ämnet får ett foto av gruppens modell efter veckan och är välkommen till ett modellpass.
  - rubrik: "Materialet: det du behöver, och när"
    plats: efter-grund
    kolumner:
      - Vad
      - Hur många, och hur
      - När
    rader:
      - - Veckans text
        - en per elev, enkelsidig och häftad, så att den kan ligga med baksidan upp. Har sista sidan bara rutan Läs mer räcker den i ett exemplar
        - läspasset, och den följer med till modellpasset
      - - Lärarens sida till texten
        - en
        - före veckan, och i handen i passen
      - - Bladet Kärnorna
        - ett per vecka, på A3
        - läspasset, och det följer med till modellpasset
      - - Post-it-lappar
        - ett block i vanlig storlek, 76 millimeter. De går att flytta runt och lyfta ut
        - läspasset och modellpasset
      - - Kortet När det skaver
        - ett per par, gärna inplastat
        - en gång, för hela perioden
      - - Veckans modell
        - "bladet som lärarens sida eller bladet Egen text säger, på A3. Lägg också fram gruppens sparade modeller: en i vecka 2–5 och alla fem i vecka 6–8"
        - modellpasset
      - - Modellens sida och exemplet om skolan
        - en av varje, exemplet gärna på A3
        - före modellpasset, och exemplet i modellpasset i vecka 1–5
      - - Jobbkorten
        - en uppsättning, två om ni är sju eller åtta
        - från vecka 3
      - - Bladet Egen text
        - ett per text
        - vecka 6–8
      - - Kartläggningen
        - elevens blad med texten och bilden och protokollet, ett av varje per elev
        - före och efter perioden
    not: "Till vecka 1 skriver du ut temats första text med lärarens sida, bladet Kärnorna, kortet När det skaver, tankekartans sida med exemplet och bladet, och kartläggningen med Bäverns damm och protokollet. Bladen är liggande A4: välj A3 när du skriver ut, eller förstora till 141 procent i kopiatorn. Saknar du A3 ritar du av bladet på ett blädderblocksark. Alla blad går att plasta in. Då sätter gruppen post-it-lapparna på plasten och skriver namnen och orden med whiteboardpenna. Spara modellen med lapparna kvar, eller fotografera den innan ni suddar."
exempel:
  valt:
    rubrik: Texten gruppen läser
    text: Vattenplaneten, den första texten på nivån Bas. Det är vecka 1 och textens läspass.
  text:
    - "Hugo, Amina, Vera och Malik går i åk 5 och har sitt första läspass. Före textens fråga säger läraren vad pennan är till för: ”När du inte förstår ett ord eller en mening skaver det. Stryk under det.”"
    - "Texten ligger nedvänd. Läraren läser textens fråga: ”Om allt vatten på jorden rymdes i hundra hinkar, hur många kunde vi dricka ur?” Var och en säger sin gissning till den bredvid, och läraren skriver gissningarna på bladet Kärnorna: femtio, tjugo, tio och åttio. Sedan vänder alla upp texten och ser på bilderna, och gruppen reder ut orden sötvatten, som inte betyder att vattnet är sött, och grundvatten."
    - "Eleverna följer med i texten med pennan i handen medan läraren läser ingressen och det första avsnittet högt och tänker högt: ”71 procent av ytan, och nästan allt vatten i haven. Är det samma sak? Jag läser om. Nej: det ena är ytan, det andra är var vattnet finns.” Vera har strukit under ”två tredjedelar”, och Malik säger att det är två av tre lika stora delar. Sedan säger läraren kärnan högt: ”Vem eller vad? Havet. Det viktigaste? Där finns nästan allt vatten, och det är salt. Det om törsten är spännande, men det står bara i sista meningen.” Läraren skriver kärnan på en post-it-lapp, läser den högt och sätter den på bladet Kärnorna."
    - "Nästa avsnitt läser paren själva. Hugo läser högt för Amina, som stryker under glaciärer. De läser meningen efter och hittar förklaringen där. Läraren samlar gruppen: ”Var skavde det?” Amina säger glaciärer. ”Ni läste meningen efter. Där stod det”, säger läraren. ”Vem eller vad handlar avsnittet om?” Sötvattnet, säger Vera. Hugo säger sin kärna till Amina: ”Sötvatten är inte sött.” Läraren frågar: ”Var finns det mesta sötvattnet?” Amina läser om och säger: ”Det mesta sötvattnet är fruset.” Läraren frågar Hugo: ”Vilken säger mest om hela avsnittet?” Hugo pekar i texten: ”Aminas. Min står bara i början.” Vera och Malik har samma kärna med andra ord. Gruppen skriver Aminas kärna på en lapp. Vera läser de två lapparna i följd, och läraren frågar hur de hänger ihop. Malik säger: ”Först det salta, sen det frusna. Inget av det går att dricka.” De två sista avsnitten går likadant."
    - "Sist läser Amina de fyra lapparna i följd. Var och en säger till den bredvid vad hen tror nu, och läraren frågar: ”Vet vi mer nu?” Hugo ändrar sin gissning från femtio hinkar till en. Läraren sparar bladet Kärnorna med lapparna till modellpasset. Efter passet skriver läraren på sin sida till texten: Hugo tog först det som lät roligast och valde sedan själv den kärna som sa mest. Jag frågar Hugo först nästa gång."
fastnar:
  rubrik: "När det skaver: stödtrappan"
  text: "När eleverna kör fast är det lätt att ge svaret direkt. Gör tvärtom. Fråga, lyssna och ge minsta möjliga stöd som tar dem ett steg längre fram. Stödtrappans fyra första steg har eleverna på kortet När det skaver, som fyra sätt. Har en elev inget understruket, pekar du i elevens text på ett ställe som raden Red ut på lärarens sida nämner och säger: ”Säg det med egna ord.” Går det inte, har eleven hittat något som skaver, och hen stryker under det. Fråga först de elever som varken såg det konstiga i meningarna eller strök under något i kartläggningen. Stryker någon under nästan allt, frågar du vad avsnittet handlar om i stort innan ni går in i detaljen. Händer det i flera pass läser eleven i par med en kamrat som läser högt. Gäller det flera i gruppen, läser ni veckans text på nivån under från och med nästa vecka. På Bas läser de i stället i par med en kamrat som läser högt."
  fragaForst:
    - Var skavde det?
    - Vad har ni prövat?
  trappa:
    - Läs om meningen och meningarna närmast före och efter.
    - "Leta efter en ledtråd: en ordförklaring i marginalen, en bild eller ett exempel."
    - Dela upp ordet, som vattentorn i vatten och torn.
    - Fråga en kamrat vad hen tror.
    - Sist förklarar du själv. Gör det kort, koppla till något eleverna redan vet och låt en elev säga det med egna ord.
  motto: Det är författarens jobb att skriva begripligt, inte elevens fel att texten är svår.
roll:
  rubrik: "Lärarens roll: leda utan att ge svaret"
  text: "Stötta tänkandet i stället för att ta över det. I samma stund som du ger den färdiga tolkningen slutar eleverna att bygga den själva. Visa hur du själv stannar, undrar och läser om. Eleverna behöver se processen, inte en perfekt läsare. Säg mindre för varje vecka: frågorna du ställde i vecka 1 ställer eleverna i vecka 8."
  gor:
    - Ställ frågor och vänta ut tystnaden.
    - Låt eleverna förklara för varandra.
    - Lyft fram flera tolkningar.
    - Skicka eleverna tillbaka till texten med ”Var står det?”
    - Koppla det de förstår till hur texten är byggd.
    - Håll tiden, så att ni hinner alla fyra avsnitten.
  undvik:
    - Att ge tolkningen direkt.
    - Att jaga ett rätt svar i stället för att tänka.
    - Att läraren pratar mest hela tiden.
    - Att godta vaga svar eller ge för kort tid.
    - Att skriva kärnan åt gruppen.
urval:
  rubrik: Var hittar du texterna och modellerna?
  text:
    - "Metodens texter står bland materialet, i teman på varje nivå, med lärarens sida före och den ifyllda modellen efter. Texterna finns också på sidan Ta fram en faktatext, ordnade efter nivå och tema, och där finns fler faktatexter i andra teman. Där visar du en text stort och skriver ut de texter du vill ha. Alla texterna har samma delar: en ingress som slutar med textens fråga, rutan Siffran, fyra avsnitt med ord förklarade i marginalen, bilder med avsnittens nummer, en faktaruta, en fördjupning som du läser högt i modellpasset och rutan Visste du att, som gruppen läser sist. Se filmerna under Läs mer innan du visar dem. Texterna är skrivna för metoden, och varje uppgift är prövad mot en källa. De är övningstexter och är inte sakgranskade som ett läromedel."
    - Varje modell har en sida, ett exempel om skolan och tre blad. Veckans blad skriver du ut på A3 till gruppen. Är ni bara ett par räcker A4, och då skriver paret i fälten, för hand eller på datorn.
  kravText: "En egen text i vecka 6–8 ska uppfylla tre krav:"
  krav:
    - rubrik: Tydligt byggd
      text: Det mesta av texten passar en av de fem modellerna
    - rubrik: Fyra avsnitt
      text: Mellanrubriker, eller stycken att dela texten vid
    - rubrik: Något att reda ut
      text: Ämnesord och samband som gruppen klarar med stöd
progression:
  text: Eleverna tar över en bit i taget, i läspasset och i modellpasset.
  rader:
    - vecka: "1"
      rubrik: "Gången och Tankekartan"
      fokus: "Gruppen lär sig gången: stryka under, reda ut, säga kärnan och lägga lapparna i modellen."
      roll: "Läspasset: du tänker högt i hela avsnitt 1. Modellpasset: du visar modellen och lägger den första lappen."
    - vecka: "2"
      rubrik: "En modell ni kan, och Tidslinjen"
      fokus: Gruppen prövar en modell som den redan kan mot veckans text och säger varför modellen inte räcker.
      roll: "Läspasset: du tänker högt i avsnitt 1 igen. Modellpasset: du lägger fram gruppens tankekarta före veckans modell."
    - vecka: 3–4
      rubrik: "Jobbkorten, Venndiagrammet och Kedjan"
      fokus: "Från avsnitt 2 har två elever i taget var sitt jobb: en håller kortet När det skaver, och en leder gruppen till kärnan. Eleverna byter jobb efter varje avsnitt."
      roll: "Läspasset: du läser avsnitt 1, och sedan lyssnar du, frågar och håller tiden. Modellpasset: du lägger först fram den sparade modell som lärarens sida säger."
    - vecka: "5"
      rubrik: "Jobbkorten i alla fyra stegen, Problem och lösning"
      fokus: De två som har jobbkorten i det sista avsnittet leder gruppen genom alla fyra stegen.
      roll: "Läspasset: i det sista avsnittet går du in först när något saknas. Modellpasset: du lägger först fram den sparade modell som lärarens sida säger. Fråga läraren i SO eller NO vilka texter klassen läser i vecka 6–8, och förbered texten till vecka 6 med bladet Egen text."
    - vecka: "6"
      rubrik: "Klassens text, och läraren väljer modell"
      fokus: Gruppen läser klassens text i SO eller NO, som ofta är byggd på flera sätt.
      roll: "Läspasset: du tänker högt i avsnitt 1 igen. Modellpasset: du prövar två av modellernas frågor högt, och paren de tre andra."
    - vecka: 7–8
      rubrik: "Klassens text, och gruppen väljer modell"
      fokus: De två med jobbkorten leder gruppen genom avsnitten som paren läser. Gruppen väljer modell bland sina fem. I vecka 7 väljer den tillsammans med dig, och i vecka 8 väljer paren först. I det sista passet säger var och en vad hen tar med sig från perioden.
      roll: "Läspasset: du inleder och avslutar passet. Efter varje avsnitt säger du en sak som de två som ledde gjorde. Modellpasset: du lyssnar när gruppen väljer och går in först när något saknas."
uppfoljning:
  text: Du behöver veta om passen ger effekt. Kartläggningen står bland materialet. Eleven läser en kort faktatext och gör fyra uppgifter, om det som skaver, kärnan, bilden och hur texten hänger ihop. Kartläggningen har inga poäng. Du jämför det eleven sa och gjorde före perioden med det hen säger och gör efter, och raderna Så kan det låta visar hur skillnaden kan låta. Under perioden har du gruppens lappar och elevens skrivna svar från varje vecka. I passen hör du hur eleven reder ut det som skaver, och i vecka 6–8 hur paren väljer modell. Efter perioden beslutar du för varje elev. Reder eleven ut det som skaver och säger kärnan med egna ord, också i klassens texter, avslutar du insatsen. Har eleven gått framåt men behöver fortfarande stöd i klassens texter, får eleven en period till med ett nytt tema. Den nya perioden börjar i vecka 1, med ett tema från sidan Ta fram en faktatext. Kartläggningen du nyss har gjort blir då kartläggningen före den nya perioden. Efter perioden gör du kartläggningen med Bäverns damm. Står inget under Det som har ändrats i protokollet, tar du det med elevhälsan.
  rader:
    - nar: Före perioden
      tid: "före"
      perElev: 15
      vad: Gör kartläggningen före första passet. Den tar omkring en kvart per elev och visar också vilken nivå som passar.
    - nar: Varje vecka
      tid: "varje vecka"
      vad: Vad strök eleverna under, hur redde de ut det, och hade kärnan på varje lapp med det viktiga? Spara gruppens modell och elevernas svar på textens fråga. Är svaret ordnat som modellen, eller är det en lista?
    - nar: Efter åtta veckor
      tid: "efter"
      perElev: 15
      vad: Gör kartläggningen igen med Björnens vinter och jämför före och efter i protokollet. Hur eleven klarar klassens texter ser du i vecka 6–8, och på Medel och Avancerat också i avsnittet ur klassens bok. Avslutar du insatsen, säger du till läraren i ämnet vilka modeller eleven kan använda i klassens texter.
