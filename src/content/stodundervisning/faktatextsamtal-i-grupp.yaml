    - rubrik: "Lärarens sida: Avancerat, text 2, Sjukdomen som försvann"
      text:
        - Smittkoppor dödade människor i minst 3 000 år, tills vaccinet från 1796 och WHO:s jakt från 1967 gjorde världen fri från sjukdomen 1980. Texten är byggd i tidsordning, och modellen är Tidslinjen, blad 2. I vecka 2 tänker du högt i avsnitt 1.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Hur många av människans sjukdomar har vi lyckats utrota helt, och hur gick det till?
            - rubrik: Ord före läsningen
              text: utrota (ta bort helt) · vaccin (skyddar, botar inte) · koppor (blåsor, inga koppar)
            - rubrik: Tänk högt
              kursiv: true
              text: ”Minst 3 000 år, och sedan mumier. Hur hänger det ihop? Jag läser om. Jo, utslagen på mumierna tyder på att sjukdomen är så gammal. Vem eller vad? Smittkopporna. Det viktigaste? De dödade människor i tusentals år, och ingen bot fanns. Det om mumierna är spännande, men de är tecknet och inte huvudsaken.”
            - rubrik: 1 Tre tusen år med koppor
              text: |-
                Red ut: ”Det tyder egyptiska mumier på”: ett tecken, inget bevis · ”fick klara saken” (utan hjälp)
                Lyssna efter: minst 3 000 år · många dog · ingen bot
                Lockar: mumierna. ”Hur länge fanns sjukdomen, och vad gjorde den?”
            - rubrik: "2 · 1796: pojken och mjölkerskan"
              text: |-
                Red ut: ”den milda”: kokoppor · ”den farliga”: smittkoppor · ”Nelmes hand”: mjölkerskans hand
                Lyssna efter: 1796 · kokoppor gav skydd · vaccination
                Lockar: ordet vacca. ”Vad gjorde Jenner, och vad hände med pojken?”
                Sambandet: ”År 1796”: nästa steg i tiden. ”Därför” binder idén till försöket
            - rubrik: "3 · 1967: jakten"
              text: |-
                Red ut: ”ändå kvar”: fast vaccinet fanns · ”omringad”: ringen i bilden
                Lyssna efter: 1967 · leta upp varje sjuk · vaccinera alla omkring
                Lockar: inga sjuka djur. ”Vad gjorde WHO mer än att vaccinera många?”
                Sambandet: ”171 år efter” och ”Därför”: vaccinet hade inte nått alla
            - rubrik: "4 · 1977 till 1980: slutet"
              text: |-
                Red ut: ”förklara” (meddela högtidligt, inte förklara varför) · ”på naturlig väg” (inte ur ett laboratorium)
                Lyssna efter: sista naturliga fallet 1977 · världen fri 1980 · den enda
                Lockar: Janet Parkers död. ”Vad hände 1977, och vad hände 1980?”
                Sambandet: ”Tio år senare”: jakten från 1967 når sitt mål
                Bilden: Merca i Somalia 1977 och England 1978 på kartan
            - rubrik: Om någon frågar
              text: Varför når stapeln för 1779 till 15 000 när texten säger 7 200? Stapeln är antalet döda, och texten räknar per miljon invånare. Sverige hade ungefär två miljoner invånare. Kom det fler epidemier i Sverige efter 1816? Ja, den sista stora kom 1874. Varför säger EU:s sida upp till hälften? Sjukdomen hade flera former. Texten har CDC:s genomsnitt.
        - rubrik: "Modellpasset: Tidslinjen för Sjukdomen som försvann"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: församling: prästens område · ”7 200 av varje miljon”: sju av tusen
                Lyssna efter: prästerna räknade · vaccinet 1801 och 1816 · färre dog
                Lockar: sju av tusen. ”Hur kan vi veta att vaccinet hjälpte i Sverige?”
                Sambandet: ”mellan Jenner och WHO”: mellan steg 2 och 3
                Bilden: Staplarna före och efter 1801 och 1816
            - rubrik: Modellen
              text: "Lägg först fram gruppens tankekarta från vecka 1 och fråga: ”Vad kommer först här?” Den visar delar men ingen ordning. Ta sedan fram Tidslinjen, blad 2. Gruppen lägger fördjupningens post-it-lapp på En lapp till, som får namnet I Sverige, och drar ett streck in mellan steg 2 och steg 3. Vaccinationen i Sverige 1801 och 1816 ligger mellan 1796 och 1967, och lappen visar vad vaccinet gjorde i ett land."
            - rubrik: Orden
              text: |-
                i minst 3 000 år (kopporna härjar) · 1796 (Jenners försök) · 1967 (jakten) · 1977 till 1980 (slutet)
                Tiden emellan: tusentals år · 171 år · 10 år fram till 1977
            - rubrik: Svaret
              text: |-
                Lyssna efter: en enda, smittkoppor · vaccinet 1796, och från 1967 en ring av vaccinerade runt varje sjuk · världen fri 1980
                Så kan det låta: ”En enda, smittkoppor. De fanns i minst 3 000 år. År 1796 kom vaccinet. Från 1967 letade WHO upp varje sjuk och vaccinerade alla runt omkring, och 1980 var världen fri.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för sjukdomen är utrotad fast viruset finns kvar."
            - rubrik: Samtala
              text: "Varför ger författaren pojken och kocken namn? Varför står årtalen i rubrikerna? Ett svar: människorna gör historien verklig, och årtalen visar ordningen."
    - rubrik: "Avancerat, text 2: Sjukdomen som försvann"
      tema: Smittor
      text:
        - Smittor · text 2 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Sjukdomen som försvann
          rader:
            - - Tänk dig en sjukdom som dödar ungefär tre av tio som blir sjuka. I tusentals år följde den människorna, och ingen kunde stoppa den. I dag har ingen människa på jorden den smittan. Hur många av människans sjukdomar har vi lyckats utrota helt, och hur gick det till?
        - rubrik: Siffran
          rader:
            - - 3 av 10
              - sjuka dog i smittkoppor, i genomsnitt.
        - rubrik: Tre tusen år med koppor
          rader:
            - - I minst 3 000 år följde smittkopporna människan. Det tyder egyptiska mumier på, för de har utslag som liknar koppor. Sjukdomen kom av ett virus som spreds från människa till människa, och den återkom gång på gång i **epidemier**.
            - - Den som blev sjuk fick feber och sedan utslag med blåsor, som kallades koppor. Ungefär tre av tio sjuka dog, och de som överlevde bar ofta ärr i ansiktet resten av livet. Mot själva sjukdomen fanns ingen bot, så kroppens eget försvar fick klara saken.
            - - "Men människor hade lagt märke till en sak. Den som hade haft smittkoppor och överlevt fick dem inte igen. Du som har läst om kroppens försvar vet varför: minnescellerna fanns kvar. På den tiden visste ingen något om minnesceller eller virus. Man såg bara att det var så, och det skulle bli början på ett skydd."
        - rubrik: Ord i texten
          rader:
            - - epidemier
              - när många blir sjuka på samma gång
        - rubrik: "1796: pojken och mjölkerskan"
          rader:
            - - År 1796 prövade den engelske läkaren Edward Jenner en idé. Han hade hört att mjölkerskor som hade haft kokoppor inte fick smittkoppor. Kokoppor var en mild sjukdom som smittade från kor och gav några blåsor på händerna. Kanske skyddade den milda sjukdomen mot den farliga.
            - - Därför tog Jenner vätska ur en kokoppsblåsa på mjölkerskan Sarah Nelmes hand och förde in den i armen på åttaårige James Phipps. Det kallas att **ympa**. Senare utsatte Jenner pojken för riktiga smittkoppor, och pojken blev inte sjuk. I dag vet vi varför det fungerade. De två virusen är så lika att antikroppar mot det ena också passar på det andra.
            - - Metoden fick namnet vaccination, efter vacca, som är latin för ko. Ett vaccin botar ingen som redan är sjuk. Det ger en frisk kropp minnesceller i förväg, så att försvaret är redo när smittan kommer. Eftersom metoden fungerade spreds den till land efter land.
        - rubrik: Ord i texten
          rader:
            - - ympa
              - föra in ett smittämne i kroppen med avsikt
        - rubrik: "1967: jakten"
          rader:
            - - År 1967, 171 år efter Jenners försök, fanns smittkopporna ändå kvar i delar av världen. Vaccinet hade funnits länge, men det hade inte nått alla människor, och människor dog fortfarande i koppor. Därför började Världshälsoorganisationen, WHO, det året en stor jakt med ett enda mål, att **utrota** sjukdomen.
            - - Att vaccinera så många som möjligt räckte inte där människor bodde tätt, så WHO arbetade också på ett annat sätt. Hälsoarbetare letade upp varje människa som hade fått koppor, och det kallas **smittspårning**. Sedan vaccinerade de alla i närheten, så att det blev en ring av skyddade människor runt den sjuke. Viruset fick inga nya människor att smitta, och där tog smittan slut.
            - - Metoden fungerade eftersom smittkoppor har två svagheter. Utslagen syns, så den som är sjuk går att hitta. Viruset sprids dessutom bara från människa till människa och finns inte hos djur. När varje sjuk var omringad av vaccinerade försvann smittan från det ena landet efter det andra.
        - rubrik: Ord i texten
          rader:
            - - utrota
              - få något att försvinna helt och för alltid
            - - smittspårning
              - leta upp de sjuka och dem de träffat
        - rubrik: "Bild: Ringen runt ett fall"
          rader:
            - - Ringen runt ett fall. Den sjuke står i mitten. Alla i närheten har fått vaccin, så viruset kommer inte vidare. Så gjorde WHO från 1967.
        - rubrik: "1977 till 1980: slutet"
          rader:
            - - Tio år senare, 1977, hittade hälsoarbetarna det sista naturliga **fallet**. Ali Maow Maalin var kock på ett sjukhus i Merca i Somalia. Han blev den sista människan som fick smittkoppor på naturlig väg, och han blev frisk. Smittan hade gått från människa till människa i minst 3 000 år, och nu tog den slut.
            - - Ändå dog en människa till. År 1978 smittades fotografen Janet Parker i England av virus från ett **laboratorium**, och hon dog den 11 september samma år. Viruset fanns inte längre ute bland människor, men forskare hade det kvar. Janet Parker blev den sista som dog av smittkoppor.
            - - Efter 1978 kom inga nya fall. Därför kunde WHO den 8 maj 1980 förklara att världen var fri från smittkoppor. Då hade det gått 13 år sedan jakten började och 184 år sedan Jenners försök. För första gången hade människan utrotat en av sina sjukdomar, och år 2026 är det fortfarande den enda.
        - rubrik: Ord i texten
          rader:
            - - fall
              - en människa som har fått sjukdomen
            - - laboratorium
              - lokal där forskare gör försök
        - rubrik: "Bild: De sista fallen"
          rader:
            - - De sista fallen. Det sista naturliga fallet kom i Merca i Somalia 1977. Den sista som dog smittades i England 1978.
        - rubrik: "Fördjupning: Prästerna som räknade de döda"
          rader:
            - - Vad vaccinet gjorde under åren mellan Jenner och WHO går att se i Sverige. Redan 1749 började prästerna räkna hur många som dog i varje församling och skriva upp vad de dog av. Siffrorna räknades ihop för hela landet. Därför vet vi hur många svenskar som dog i smittkoppor, år för år, redan innan det fanns något vaccin.
            - - Det var dystra tal. Värst var epidemin år 1779, då 7 200 av varje miljon invånare dog i smittkoppor. Ett sådant tal kallas dödlighet, och det säger hur stor del av befolkningen som dör under ett år. Här är det ungefär sju av tusen, som om sju människor i en stad med tusen invånare dog av samma sjukdom på ett enda år.
            - - År 1801 gjordes den första vaccinationen i Sverige, fem år efter Jenners försök. År 1816 blev vaccinet **obligatoriskt** för barn. Prästerna fortsatte att räkna, och i deras siffror syns vad som hände. När vaccinet hade kommit sjönk antalet döda i smittkoppor kraftigt. Utan prästernas räkning hade vi bara kunnat gissa, men med den kan vi visa det. Sverige var ändå bara ett land, och på andra håll i världen dröjde vaccinet. Därför behövdes jakten 1967.
        - rubrik: Ord i texten
          rader:
            - - obligatoriskt
              - något som alla måste göra
        - rubrik: "Fakta: Smittkopporna i Sverige"
          rader:
            - - "1749"
              - Prästerna börjar räkna de döda och skriva upp vad de dog av.
            - - "1779"
              - "En epidemi: 7 200 av en miljon invånare dör i smittkoppor."
            - - "1801"
              - Den första vaccinationen i Sverige.
            - - "1816"
              - Vaccinet blir obligatoriskt för barn.
            - - "1874"
              - "Den sista stora epidemin: 940 av en miljon invånare dör."
        - rubrik: "Bild: Döda i smittkoppor i Sverige"
          rader:
            - - Döda i smittkoppor i Sverige. Så många dog varje år. Strecken visar 1801, då vaccinet kom, och 1816, då det blev obligatoriskt.
        - rubrik: Visste du att …
          rader:
            - - 2 laboratorier
              - har smittkoppsviruset kvar, ett i USA och ett i Ryssland. Borde viruset sparas eller förstöras?
        - rubrik: Läs mer
          rader:
            - - SCB berättar om smittkopporna i Sverige och visar ett diagram över hur många som dog varje år.
              - https://www.scb.se/hitta-statistik/redaktionellt/nar-vaccinationerna-utrotade-smittkopporna/
            - - EU:s vaccinationsportal berättar vaccinernas historia på svenska, från smittkopporna till dagens vaccin, med en tidslinje.
              - https://vaccination-info.europa.eu/sv/om-vacciner/vaccinernas-historia
            - - CDC berättar smittkoppornas historia med bilder, från mumierna till det sista fallet. Sidan är på engelska.
              - https://www.cdc.gov/smallpox/about/history.html
    - rubrik: "Modellen: Avancerat, text 2, Sjukdomen som försvann"
      tema: Smittor
      text:
        - Tidslinjen, blad 2, ifylld för Sjukdomen som försvann.
      delar:
        - rubrik: Frågan och svaret
          falt:
            - rubrik: Textens fråga
              text: Hur många av människans sjukdomar har vi lyckats utrota helt, och hur gick det till?
            - rubrik: Lyssna efter
