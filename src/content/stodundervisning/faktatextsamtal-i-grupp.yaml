film:
  sekunder: 28.91
  beskrivning: "1 Läs med pennan i handen. Läraren säger: ”Stryk under det som skaver.” 2 Red ut: förklaringen står i nästa mening. Läraren frågar: ”Var skavde det?” Kamraten säger: ”Glaciärer. Vi läste meningen efter.” 3 Kärnan: paret ringar in sötvattnet. Läraren frågar: ”Vem eller vad handlar avsnittet om?” Kamraten säger till Eleven: ”Sötvatten är inte sött.” Läraren frågar: ”Var finns det mesta sötvattnet?” Eleven läser om. Eleven säger: ”Det mesta sötvattnet är fruset.” 4 Lappen: kärnan har högst tio ord. Gruppen skriver: ”Det mesta sötvattnet är fruset.”"
  rubrik: Ett avsnitt i fyra steg
  ingress: Fyra bilder ur filmen om avsnitt 2 i Vattenplaneten, i läspasset. Kortet visar avsnittets andra stycke, och den grå stapeln står för två meningar som inte visas. Filmen på metodens sida visar samma sak i rörelse.
  stillbilder:
    - text: "Läs: eleven stryker under ett ord i andra stycket."
    - text: "Red ut: kamraten läser meningen efter."
    - text: "Kärnan: läraren frågar var sötvattnet finns."
    - text: "Lappen: gruppen skriver på en post-it-lapp."
filmer:
  - nr: 2
    titel: Post-it-lapparna blir en modell
    sekunder: 26.11
    beskrivning: "Modellpasset: gruppen lägger en lapp i taget. Läraren frågar: ”Var hör den här lappen hemma?” Eleven säger: ”Den handlar om isen.” Platsen får ett namn. Läraren frågar: ”Vad ska platsen heta?” Gruppen skriver: ”Isen”. Gruppen letar upp ordet och skriver det i fliken. Läraren frågar: ”Vilket ord i texten visar det?” Gruppen skriver: ”det mesta”. Eleven återger texten, och kamraten pekar. Läraren säger: ”Berätta texten ur modellen.” Eleven säger: ”Nästan allt vatten finns i haven.”"
    rubrik: Post-it-lapparna blir en modell
    ingress: Fyra bilder ur filmen om modellpasset i vecka 1, där veckans post-it-lappar blir en tankekarta för Vattenplaneten. Filmen följer en lapp genom delarna Modellen och Orden. I passet lägger gruppen alla lapparna innan orden skrivs i flikarna. Filmen på metodens sida visar samma sak i rörelse.
    efter: "tabell: Modellpasset på 40 minuter"
    stillbilder:
      - text: Läraren frågar var lappen hör hemma i modellen.
      - text: Gruppen flyttar lappen och skriver platsens namn.
      - text: Gruppen hittar ordet i texten och skriver det i fliken.
      - text: Eleven återger texten ur modellen, och kamraten pekar.
