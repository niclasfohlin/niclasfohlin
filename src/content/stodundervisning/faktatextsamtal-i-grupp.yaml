    - rubrik: "Lärarens sida: Avancerat, text 5, Gåtan på sjukhuset"
      text:
        - Mödrar dog i barnsängsfeber eftersom läkarna bar med sig smitta från obduktionerna på händerna, handtvätt i klorlösning löste det, och ändå dröjde det innan andra läkare ändrade sig. Texten har ett problem och en lösning, och modellen är Problem och lösning, blad 1. I vecka 5 har två elever i taget jobbkorten från avsnitt 2, och de två som har dem i avsnitt 4 leder hela avsnittet.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Varför dog fler mödrar hos läkarna än hos barnmorskorna, och vad gjorde man åt det?
            - rubrik: Ord före läsningen
              text: förlösa (hjälpa den som föder, inte föda) · klinik (här en avdelning på sjukhuset) · barnmorska (hjälper till vid förlossningar, ingen läkare)
            - rubrik: 1 Problemet
              text: |-
                Red ut: ”det var den som måste ner”: dödligheten · ”gå efter”: utgå från
                Lyssna efter: mödrar dog i feber · ingen visste varför · på sjukhuset
                Lockar: detektiven som letar. ”Vad var det ingen visste?”
            - rubrik: 2 Ledtråden
              text: |-
                Red ut: ”ingenting sådant”: inget från de döda · födande: som föder
                Lyssna efter: fler dog hos läkarna · direkt från obduktionen · något följde med händerna
                Lockar: lukten på händerna. ”Vad gjorde läkarna som barnmorskorna inte gjorde?”
                Sambandet: ”En ledtråd till problemet”, alltså till febern i avsnitt 1
                Bilden: Pilen från obduktionssalen går bara till läkarnas klinik
            - rubrik: 3 Lösningen
              text: |-
                Red ut: ”läkare som studenter”: både läkare och studenter · ”klarat provet”: stämde
                Lyssna efter: läkarna måste tvätta i klorlösning · dödligheten sjönk kraftigt
                Lockar: att klor tar bort lukt. ”Vad ändrades i maj 1847, och vad hände sedan?”
                Sambandet: ”Om hypotesen stämde fanns det en lösning”, alltså hypotesen i avsnitt 2
                Bilden: Handtvätten, mellan obduktionssalen och läkarnas klinik
            - rubrik: 4 Motståndet
              text: |-
                Red ut: slår igenom: blir godtagen · ”fick liten verkan”: få lyssnade
                Lyssna efter: det fungerade · det dröjde · ingen såg smittan
                Lockar: Holmes år 1843. ”Varför ändrade sig andra läkare inte genast?”
                Sambandet: ”Resultatet var tydligt, men”, alltså trots att färre dog
            - rubrik: Om någon frågar
              text: "Varför står det andra tal på nätet? Källorna räknar olika år: hos läkarna dog 11 av 100 år 1846. Räcker tvål i dag? Hemma, ja. Vårdens personal desinfekterar händerna före och efter varje patient. Hur gick det för Semmelweis? Han dog 1865 på ett mentalsjukhus. Text 3 säger hundra miljarder. Varför? Två uppskattningar ur olika källor. Här räknas också virus."
        - rubrik: "Modellpasset: Problem och lösning för Gåtan på sjukhuset"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: spann: från ett tal till ett annat · karantän: misstänkt smittade hålls för sig
                Lyssna efter: mätningar i dag · handtvätt minskar sjukdom · han fick rätt
                Lockar: en miljon barn. ”Vad visar mätningarna om handtvätt i dag?”
                Sambandet: ”I dag”, alltså resultatet nu och inte på 1840-talet
                Bilden: Staplarna är spann: från det lägsta till det högsta talet
            - rubrik: Modellen
              text: "Lägg först fram gruppens kedja från vecka 4 och fråga: ”Var skriver vi det någon gör åt problemet?” Den visar vad som leder till vad, men inte vad någon gör åt problemet. Ta sedan fram Problem och lösning, blad 1. Gruppen lägger fördjupningens post-it-lapp på En lapp till, med ett streck till fältet Resultatet. Där ligger lappen om motståndet. Att färre dog står på lappen från avsnitt 3."
            - rubrik: Orden
              text: problemet var (febern) · berodde på (händerna) · en lösning (klorlösningen) · resultatet var tydligt, men (motståndet)
            - rubrik: Svaret
              text: |-
                Lyssna efter: från obduktionerna · något osynligt på händerna · klorlösningen tog bort det
                Så kan det låta: ”Läkarna kom direkt från obduktioner och bar något osynligt på händerna till kvinnorna. Barnmorskorna gjorde inga obduktioner. När läkarna tvättade händerna i klorlösning dog långt färre.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret håller utan biljonen, men den visar varför tvål behövs."
            - rubrik: Samtala
              text: "Varför berättar författaren om febern som en gåta? Varför får motståndet ett eget avsnitt? Ett svar: gåtan visar hur någon hittar en orsak, och motståndet visar att ett resultat inte räcker för att bli trodd."
    - rubrik: "Avancerat, text 5: Gåtan på sjukhuset"
      tema: Smittor
      text:
        - Smittor · text 5 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Gåtan på sjukhuset
          rader:
            - - "På Allmänna sjukhuset i Wien år 1846 hände det gång på gång: en kvinna hade just fött, febern steg, och snart var hon död. Sjukhuset hade två kliniker för förlossningar. På den ena förlöste läkare och på den andra barnmorskor, och hos barnmorskorna dog färre. Varför dog fler mödrar hos läkarna än hos barnmorskorna, och vad gjorde man åt det?"
        - rubrik: Siffran
          rader:
            - - 98 av 1 000
              - mödrar dog på läkarnas klinik i Wien åren 1840 till 1846. Det är nästan var tionde.
        - rubrik: Problemet med febern
          rader:
            - - "Sjukdomen kallades **barnsängsfeber**. Den drabbade kvinnor som nyss hade fött barn: först kom febern, och för en del slutade den med döden. Ett sjukhus skulle vara en trygg plats att föda på, och ändå dog mödrar där, den ena efter den andra. Andelen kvinnor som dog kallas dödlighet, och det var den som måste ner."
            - - Problemet var att ingen visste vad febern kom av. På 1840-talet var det inte känt att bakterier kan ge sjukdomar, så läkarna hade inget att gå efter. Så länge orsaken var okänd fanns det heller ingenting att göra åt saken.
            - - En av läkarna på sjukhuset hette Ignaz Semmelweis. År 1846 började han jämföra sjukhusets två kliniker för förlossningar, alltså de avdelningar där kvinnorna födde. Han letade efter något som skilde dem åt, på samma sätt som en detektiv letar efter det som inte stämmer. Det han såg blev den första ledtråden.
        - rubrik: Ord i texten
          rader:
            - - barnsängsfeber
              - feber hos en kvinna som nyss har fött
        - rubrik: Ledtråden från obduktionssalen
          rader:
            - - En ledtråd till problemet fanns i skillnaden mellan de två klinikerna. På den ena var det läkare och läkarstudenter som fick förlösa kvinnorna, alltså hjälpa dem att föda. På den andra gjorde barnmorskor samma arbete. Sjukdomen var densamma, men åren 1840 till 1846 dog 98 av 1 000 mödrar på läkarnas klinik och 36 av 1 000 på barnmorskornas.
            - - Semmelweis letade efter något som bara läkarna gjorde, och han fann det. Läkarna och studenterna gick direkt från en **obduktion** till kvinnorna som skulle föda. Händerna tvättade de med tvål och vatten, men lukten från de döda kropparna satt ändå kvar.
            - - "Lukten var nästa ledtråd. Om den satt kvar, kunde också något annat från de döda sitta kvar. Semmelweis **hypotes** var att febern berodde på just det: något osynligt följde med på läkarnas händer till de födande kvinnorna. Barnmorskorna gjorde inga obduktioner, och därför bar de ingenting sådant med sig."
        - rubrik: Ord i texten
          rader:
            - - obduktion
              - undersökning av en död människas kropp
            - - hypotes
              - en möjlig förklaring, som man sedan prövar
        - rubrik: "Fakta: Två kliniker"
          rader:
            - - Läkarnas klinik
              - Läkare och studenter förlöste. De gjorde också obduktioner. Av 1 000 mödrar dog 98.
            - - Barnmorskornas klinik
              - Barnmorskor förlöste. De gjorde inga obduktioner. Av 1 000 mödrar dog 36.
        - rubrik: Lösningen med klor
          rader:
            - - "Om hypotesen stämde fanns det en lösning: det som satt på händerna måste bort innan läkarna rörde vid kvinnorna. Tvål och vatten räckte inte, det visade lukten. Semmelweis valde därför en **klorlösning**, eftersom klor var känt för att ta bort lukt."
            - - "I maj 1847, året efter de första iakttagelserna, kom kravet. Läkare som studenter måste tvätta händerna i klorlösningen innan de gick in till kvinnorna, och sedan mellan patienterna. Det var ett försök i full skala: stämde hypotesen skulle färre mödrar dö, och stämde den inte skulle ingenting hända."
            - - Det ledde till att dödligheten på läkarnas klinik sjönk kraftigt. År 1848 dog 13 av 1 000 mödrar där, mot 98 av 1 000 åren före handtvätten. Nu var dödligheten ungefär lika låg som på barnmorskornas klinik samma år. Hypotesen hade klarat provet, fast ingen ännu kunde säga vad det osynliga på händerna var.
        - rubrik: Ord i texten
          rader:
            - - klorlösning
              - vatten blandat med klor
        - rubrik: "Bild: Vägen från obduktionssalen"
          rader:
            - - Vägen från obduktionssalen. Läkarna och studenterna gick från obduktionssalen till kvinnorna. Från maj 1847 tvättade de händerna i klorlösning på vägen. Siffrorna är avsnittens nummer.
        - rubrik: Motståndet mot det osynliga
          rader:
            - - Resultatet var tydligt, men det dröjde ändå innan andra läkare ändrade sig. Handtvätten hade fungerat på kliniken i Wien, och färre mödrar dog där än förut. En upptäckt slår dock inte igenom bara för att den är gjord.
            - - Ett hinder var att ingen kunde se smittan, varken läkarna eller Semmelweis själv. Han kunde visa att färre dog, men han kunde inte visa upp det som satt på händerna, och vad det var blev känt först många år senare. Dessutom väntade Semmelweis tretton år med att ge ut sin bok om upptäckten.
            - - Semmelweis var inte heller den förste som mötte det motståndet. Redan 1843 hade den amerikanske läkaren Oliver Wendell Holmes kommit fram till att barnsängsfebern fördes vidare av dem som vårdade kvinnorna, och hans råd fick liten verkan. Två läkare hade alltså sett samma sak, och båda fick vänta på att bli trodda.
        - rubrik: "Fördjupning: Det vi vet i dag"
          rader:
            - - I dag går det att mäta det som Semmelweis bara kunde ana. Det osynliga på läkarnas händer var bakterier, och nu vet vi att händer bär smittämnen från en människa till en annan. Handtvätt med tvål tar bort många av dem, och hur mycket det betyder har forskare räknat på.
            - - Den amerikanska myndigheten CDC samlade talen år 2024. Där människor får lära sig att tvätta händerna med tvål blir det 23 till 40 procent färre som får diarré. Luftvägsinfektioner som förkylningar blir 16 till 21 procent färre, och skolbarnens frånvaro för magsjuka minskar med 29 till 57 procent. Talen är spann, eftersom flera undersökningar har mätt samma sak och fått olika svar.
            - - Varför det spelar roll visar två faktablad som Världshälsoorganisationen, WHO, gav ut 2022 och 2024. Mer än en miljon barn under fem år dör varje år av diarré och lunginflammation, två sjukdomar som rena händer skyddar mot. Och när influensan spreds över världen år 1918 fanns varken vaccin mot influensan eller antibiotika mot de bakterieinfektioner som följde. Det som fanns att ta till var sådant som isolering, karantän och god hygien.
            - - "Semmelweis fick alltså rätt. På dagens sjukhus har arbetet med att hindra smitta ett eget namn, vårdhygien, och rena händer är en självklar del av det. Lösningen från maj 1847 gäller fortfarande: få bort det som ingen ser, innan det hinner vidare."
        - rubrik: "Bild: Handtvätt i dag"
          rader:
            - - Handtvätt i dag. Så mycket minskar sjukdom och frånvaro när människor får lära sig tvätta händerna med tvål. Varje stapel går från det lägsta till det högsta talet.
        - rubrik: Visste du att …
          rader:
            - - 1 biljon
              - smittämnen, alltså en miljon miljoner, kan finnas i ett enda gram avföring. Hur länge brukar du tvätta händerna?
        - rubrik: Läs mer
          rader:
            - - SO-rummet berättar om Semmelweis och om två andra som kämpade mot smittor, Jenner och Lister.
              - https://www.so-rummet.se/fakta-artiklar/jenner-semmelweis-och-lister-kampen-mot-smitta-och-infektioner
            - - 1177 visar hur du tvättar händerna så att de blir rena, och när det behövs.
              - https://www.1177.se/liv--halsa/sunda-vanor/sa-har-tvattar-du-handerna/
            - - Vårdhandboken visar hur vårdens personal håller händerna rena i dag. Sidan är skriven för vården.
              - https://www.vardhandboken.se/vardhygien-infektioner-och-smittspridning/vardhygien/basala-hygienrutiner/handhygien/
    - rubrik: "Modellen: Avancerat, text 5, Gåtan på sjukhuset"
      tema: Smittor
      text:
        - Problem och lösning, blad 1, ifylld för Gåtan på sjukhuset.
      delar:
        - rubrik: Frågan och svaret
          falt:
            - rubrik: Textens fråga
              text: Varför dog fler mödrar hos läkarna än hos barnmorskorna, och vad gjorde man åt det?
            - rubrik: Lyssna efter
              text: från obduktionerna · något osynligt på händerna · klorlösningen tog bort det
            - rubrik: Så kan svaret låta
              text: Läkarna kom direkt från obduktioner och bar något osynligt på händerna till kvinnorna. Barnmorskorna gjorde inga obduktioner. När läkarna tvättade händerna i klorlösning dog långt färre.
    - rubrik: "Modellen: Tankekartan"
      text:
        - "Till modellen hör exemplet om skolan och tre blad att skriva ut eller skriva i på dator. Skriv ut veckans blad på A3: lärarens sida säger vilket. Exemplet är en egen bild."
      delar:
        - rubrik: Modellen
          falt:
            - rubrik: Säg till gruppen
              text: ”En tankekarta visar en sak och vilka delar den har. Saken står i mitten, och varje del har ett eget fält.”
            - rubrik: Modellens fråga
              text: Vad beskriver texten, och vilka delar har det?
            - rubrik: Den passar
              text: när varje avsnitt handlar om en egen del av saken. Pröva om texten går att säga som ”saken har de här delarna”. Om texten berättar i tur och ordning passar tidslinjen, och om den jämför två saker passar venndiagrammet.
        - rubrik: Så läggs den
          falt:
            - rubrik: Första gången
              text: Visa exemplet om skolan och läs exemplets text högt, en mening i taget. Efter varje mening frågar du var den står i exemplet. Återge sedan texten ur exemplet, medan du pekar.
            - rubrik: Exemplets text
              text: |-
                Vår skola har fyra delar.
                Den största är klassrummen, där vi har lektioner.
                En annan del är matsalen, där alla äter lunch.
                Det finns också en idrottshall, med ett gym.
                Utanför ligger skolgården, där vi har rast.
                Många elever cyklar till skolan.
            - rubrik: Mitten och fälten
              text: Gruppen skriver saken i mitten, och varje fält får delens namn.
            - rubrik: En lapp till
              text: En post-it-lapp utöver delarna får platsen En lapp till, med ett namn som säger vart den hör. Fördjupningens lapp hör oftast till en del, och platsen heter då ”Hör till” och delens namn. I exemplet heter den ”Hör inte till delarna”.
            - rubrik: Strecken
              text: I fliken på strecket står textens ord för hur delen hör till saken, som ”den största”, ”en annan del” och ”också”.
            - rubrik: Återge texten
              text: Börja med saken och delarna, som ”Vår skola har fyra delar”, och ta sedan en mening för varje fält, med flikens ord.
            - rubrik: Se upp
              text: "Fältet har inget namn: ”Vad heter delen?” Ett tomt fält är inget fel."
            - rubrik: Bladen
              text: Blad 1 har fyra delar, blad 2 har delar med egna delar eller exempel, och blad 3 har sex delar.
    - rubrik: "Modellen: Tidslinjen"
      text:
        - "Till modellen hör exemplet om skolan, här en skoldag, och tre blad att skriva ut eller skriva i på dator. Skriv ut veckans blad på A3: lärarens sida säger vilket. Exemplet är en egen bild."
      delar:
        - rubrik: Modellen
          falt:
            - rubrik: Säg till gruppen
              text: ”En tidslinje visar det som händer i tur och ordning. Stegen står efter varandra längs linjen.”
            - rubrik: Modellens fråga
              text: Vad händer, och i vilken ordning?
            - rubrik: Den passar
              text: när texten berättar vad som händer i tur och ordning. Pröva om det finns ett först och ett sist i tiden. Om avsnitten beskriver delar av samma sak passar tankekartan, och om varje avsnitt förklarar nästa passar kedjan.
        - rubrik: Så läggs den
          falt:
            - rubrik: Första gången
              text: Visa exemplet om skolan och läs exemplets text högt, en mening i taget. Efter varje mening frågar du var den står i exemplet. Återge sedan texten ur exemplet, medan du pekar.
            - rubrik: Exemplets text
              text: |-
                En skoldag har sin ordning.
                Först har vi samling i klassrummet.
                Sedan har vi lektion.
                Efter det äter vi lunch i matsalen.
                Till sist går vi hem.
                Matsalen har nya bord.
            - rubrik: Linjen och stegen
              text: Gruppen skriver det texten handlar om där linjen börjar. Varje steg har en siffra på linjen och ett fält med sitt namn.
            - rubrik: En lapp till
              text: En post-it-lapp utöver stegen får platsen En lapp till, med ett namn, som ”Hör till” och stegets namn, eller ett streck till linjen. Är lappen ett eget steg drar ni linjen dit. I exemplet heter platsen ”Inget steg i dagen”.
            - rubrik: Flikarna
              text: I fliken När står textens ord för när steget kommer, som ”först”, ”sedan” och ”till sist”, eller ett årtal.
            - rubrik: Återge texten
              text: Börja med det texten handlar om, som ”En skoldag har sin ordning”, och ta sedan en mening för varje steg, med flikens ord först.
            - rubrik: Se upp
              text: "Två steg har bytt plats: ”Vilket kommer först? Visa var det står.” Ett tomt steg är inget fel."
            - rubrik: Bladen
              text: Blad 1 har fyra steg. Blad 2 har också flikar för tiden emellan, för en text med årtal, och blad 3 har sex steg.
    - rubrik: "Modellen: Venndiagrammet"
      text:
        - "Till modellen hör exemplet om skolan, här två rum, och tre blad att skriva ut eller skriva i på dator. Skriv ut veckans blad på A3: lärarens sida säger vilket. Exemplet är en egen bild."
      delar:
        - rubrik: Modellen
          falt:
            - rubrik: Säg till gruppen
              text: ”Ett venndiagram jämför två saker. Varje sak har en ring. Där ringarna går in i varandra står det som gäller båda.”
            - rubrik: Modellens fråga
              text: Vilka två saker jämförs, och vad är lika och vad är olika?
            - rubrik: Den passar
              text: när texten ställer två saker mot varandra. Pröva om texten säger vad som gäller båda och vad som bara gäller den ena. Om den handlar om en sak och sakens delar passar tankekartan.
        - rubrik: Så läggs den
          falt:
            - rubrik: Första gången
              text: Visa exemplet om skolan och läs exemplets text högt, en mening i taget. Efter varje mening frågar du var den står i exemplet. Återge sedan texten ur exemplet, medan du pekar.
            - rubrik: Exemplets text
              text: |-
                Matsalen och idrottshallen är skolans två största rum.
                Båda delas av alla klasser.
                I matsalen sitter vi stilla och äter, medan vi rör oss i idrottshallen.
                Idrottshallen har ribbstolar, men matsalen har bord.
                Vaktmästaren heter Sam.
            - rubrik: Ringarna
              text: Varje ring är en sak och får sakens namn. Det som gäller båda ligger i mitten. Ett avsnitt kan ge två post-it-lappar, en i var ring.
            - rubrik: En lapp till
              text: "En lapp utöver ringarna får platsen En lapp till, med ett namn som säger vart den hör: ”Hör till” och sakens namn, med ett streck till ringen. I exemplet heter platsen ”Hör inte till jämförelsen”."
            - rubrik: Flikarna
              text: I fliken på varje plats står textens ord för jämförelsen, som ”båda”, ”medan” och ”men”.
            - rubrik: Återge texten
              text: Säg de två sakerna, sedan mitten och sist ringarna, med flikarnas ord, som ”Båda delas av alla klasser”.
            - rubrik: Se upp
              text: "Lappen ligger fel: ”Gäller det båda?” En tom plats är inget fel."
            - rubrik: Bladen
              text: Blad 1 har två ringar, blad 2 tar en punkt i taget och har inga ringar, och blad 3 tar det lika före det olika.
    - rubrik: "Modellen: Kedjan"
      text:
        - "Till modellen hör exemplet om skolan, här en regnig dag, och tre blad att skriva ut eller skriva i på dator. Skriv ut veckans blad på A3: lärarens sida säger vilket. Exemplet är en egen bild."
      delar:
        - rubrik: Modellen
          falt:
            - rubrik: Säg till gruppen
              text: ”En kedja visar hur det ena leder till det andra. Varje led i kedjan är något som händer, och pilen visar vad det leder till.”
            - rubrik: Modellens fråga
              text: Vad händer, och vad leder det till?
            - rubrik: Den passar
              text: när varje avsnitt förklarar nästa. Pröva att fråga ”varför?” om ett avsnitt. Står svaret i avsnittet före? Om sakerna bara händer efter varandra passar tidslinjen, och om någon löser ett problem passar Problem och lösning.
        - rubrik: Så läggs den
          falt:
            - rubrik: Första gången
              text: Visa exemplet om skolan och läs exemplets text högt, en mening i taget. Efter varje mening frågar du var den står i exemplet. Återge sedan texten ur exemplet, medan du pekar.
            - rubrik: Exemplets text
              text: |-
                I dag regnar det.
                Därför är skolgården blöt.
                Det gör att vi har rast inne.
                Eftersom alla är inne blir det trångt i korridoren.
                Korridoren målades om i somras.
            - rubrik: Överst och leden
              text: Överst står det kedjan förklarar. I exemplet säger du det själv, eftersom ingen mening i texten gör det. Led 1 sätter i gång resten, och varje led får ett kort namn, som Regn.
            - rubrik: En lapp till
              text: En post-it-lapp som varken är orsak eller följd får platsen En lapp till. Ett namn eller ett streck till ett led visar vart den hör. I exemplet heter platsen ”Hör inte till kedjan”.
            - rubrik: Pilarna
              text: I fliken på pilen står textens ord för att det ena leder till det andra, som ”därför”, ”det gör att” och ”eftersom”.
            - rubrik: Återge texten
              text: "Börja i led 1 och följ pilarna: ”I dag regnar det. Därför är skolgården blöt.” Med ”eftersom” börjar meningen i orsaken: ”Eftersom alla är inne blir det trångt i korridoren.”"
            - rubrik: Se upp
              text: "Två led har bytt plats: ”Vilket leder till vilket?” Efter ”eftersom” och ”beror på” kommer orsaken, och den står i ledet före pilen. Ett tomt led sist är inget fel."
            - rubrik: Bladen
              text: Blad 1 har fyra led, blad 2 en orsak och tre följder bredvid varandra, och blad 3 tre orsaker och en följd.
    - rubrik: "Modellen: Problem och lösning"
      text:
        - "Till modellen hör exemplet om skolan, här matkön, och tre blad att skriva ut eller skriva i på dator. Skriv ut veckans blad på A3: lärarens sida säger vilket. Exemplet är en egen bild."
      delar:
        - rubrik: Modellen
          falt:
            - rubrik: Säg till gruppen
              text: ”Problem och lösning visar ett problem och hur någon löser det. Problemet står till vänster och lösningen till höger.”
            - rubrik: Modellens fråga
              text: Vad är problemet, och hur löses det?
            - rubrik: Den passar
              text: när texten börjar med något som är fel eller svårt och berättar hur någon löser det. Pröva om texten säger vad någon gör åt det. Om den bara förklarar varför något händer passar kedjan.
        - rubrik: Så läggs den
          falt:
            - rubrik: Första gången
              text: Visa exemplet om skolan och läs exemplets text högt, en mening i taget. Efter varje mening frågar du var den står i exemplet. Återge sedan texten ur exemplet, medan du pekar.
            - rubrik: Exemplets text
              text: |-
                Problemet är att matkön är för lång.
                Det beror på att alla kommer samtidigt.
                En lösning är att klasserna äter på olika tider.
                Det har lett till att kön är kort och att alla hinner äta.
                På fredagar är det pannkakor.
            - rubrik: Platserna
              text: Varje plats har sitt namn och sin fråga tryckta. Under dem skriver gruppen ett eget namn, som ”Lång kö”.
            - rubrik: En lapp till
              text: En post-it-lapp utöver platserna får platsen En lapp till. Ett namn eller ett streck till en plats visar vart den hör. I exemplet heter platsen ”Hör inte till någon plats”.
            - rubrik: Pilarna
              text: I fliken vid varje pil står textens ord för det som kommer efter pilen, som ”det beror på” och ”en lösning är”.
            - rubrik: Återge texten
              text: "Följ pilarna och ta en mening för varje plats, med flikens ord: ”Problemet är att matkön är för lång.”"
            - rubrik: Se upp
              text: "Lappen ligger fel: ”Svarar den på frågan?” En tom plats är inget fel."
            - rubrik: Bladen
              text: Blad 1 har en lösning och blad 2 två. Blad 3 har orsaker, följder och lösningar, med lösningarna under problemet och utan egna namn.
    - rubrik: Kärnorna
      text:
        - Bladet håller ihop textens två pass. Där står textens fråga och gruppens gissningar, och där sitter post-it-lapparna med avsnittens kärnor i textens ordning.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: När
              text: Bladet ligger på bordet i läspasset. Passet börjar vid bladet och slutar där, med frågan ”Vet vi mer nu?” Modellpasset börjar också vid bladet.
            - rubrik: Du skriver
              text: Före läsningen skriver du textens namn, textens fråga och gruppens gissningar.
            - rubrik: Gruppen
              text: Gruppen sätter varje ny lapp på sin plats och läser lapparna i följd. Den femte platsen är fördjupningens. I modellpasset flyttar gruppen lapparna till veckans modell.
            - rubrik: Utskrift
              text: Skriv ut bladet på A3, så att lapparna ryms. Är ni bara ett par räcker A4, och då skriver ni kärnorna direkt på bladet.
    - rubrik: När det skaver
      text:
        - Kortet är elevernas och till för den som läser ut orden rätt men inte förstår ett ord eller en mening.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: När
              text: Varje par har kortet mellan sig på bordet i läspasset. När en i paret säger var det skavde prövar paret det första sättet, och hjälper det inte prövar de nästa. Varje rad har sättet först och sedan hur det går till.
            - rubrik: Du förklarar sist
              text: Fråga ”Vad har ni prövat?” innan du säger något om ordet. När paret har prövat de fyra sätten förklarar du kort och kopplar till något eleverna redan vet, och en elev säger det med egna ord.
            - rubrik: Utskrift
              text: Bladet har två likadana kort, så ett blad räcker till två par. Klipp isär korten längs den streckade linjen och plasta gärna in dem.
    - rubrik: Jobbkorten
      text:
        - Med jobbkorten tar eleverna över dina frågor i avsnittets fyra steg, och den som har ett jobb läser upp en rad i taget.
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: När
              text: Från vecka 3 har två elever var sitt jobb i läspasset. Den ena håller kortet När det skaver och leder gruppen när ni reder ut det som skaver, och den andra leder gruppen till kärnan. Säg första gången att frågorna på jobbkorten är de som du har ställt i två veckor.
            - rubrik: Så byts jobben
              text: Du bestämmer före passet vilka som börjar. De två har jobbkorten från avsnitt 2, och efter varje avsnitt går korten vidare till två andra, så att alla får pröva båda jobben. Så gör ni också med klassens texter i vecka 6–8.
            - rubrik: Hela avsnittet
              text: I vecka 5 leder de två med jobbkorten gruppen genom alla fyra stegen i det sista avsnittet, och i vecka 7–8 i alla avsnitt som paren läser. Den som håller kortet När det skaver börjar avsnittet, och den som leder gruppen till kärnan avslutar det.
            - rubrik: Det du gör
              text: "I vecka 3–4 lyssnar du, frågar och håller tiden. Stannar samtalet pekar du på nästa rad på jobbkortet. Saknar kärnan det viktiga frågar du: ”Var står det?” När de två leder hela avsnittet går du in först när något saknas. Håller kärnan säger du vad den som ledde gjorde."
            - rubrik: Utskrift
              text: Bladet har båda jobbkorten. Skriv ut ett blad, eller två om ni är sju eller åtta. Klipp isär korten längs den streckade linjen och plasta gärna in dem.
    - rubrik: Egen text
      text:
        - Med bladet Egen text förbereder du en text som klassen läser i SO eller NO. Ifyllt är bladet lärarens sida till texten, och det följer samma två pass som metodens texter. Räkna med omkring tjugo minuter.
      delar:
        - rubrik: Så gör du
          falt:
            - rubrik: 1 Dela texten
              text: "Läs texten. Ett avsnitt får vara ungefär lika långt som metodens avsnitt på gruppens nivå: 60–100 ord på Bas, 100–130 på Medel och 130–160 på Avancerat. Är texten längre än fyra sådana avsnitt, väljer du först den del som gruppen hinner i ett läspass. Dela den i fyra avsnitt, vid mellanrubrikerna eller där texten börjar handla om något nytt. Skriv avsnittens nummer i elevernas kopior, också vid bilden som hör till avsnittet."
            - rubrik: 2 Textens fråga
              text: Skriv en fråga som hela texten svarar på och som eleverna kan gissa svaret på innan de har läst.
            - rubrik: 3 Läspasset
              text: "Välj två eller tre ord att reda ut före läsningen. Till vecka 6 skriver du också det du säger när du tänker högt i avsnitt 1. Fyll sedan i de tre raderna för varje avsnitt: det som kan skava under Red ut, stödord för kärnan under Lyssna efter och detaljen som lätt tar över under Lockar."
            - rubrik: 4 Modellen
              text: Välj den modell som passar det mesta av texten. Modellens fråga i tabellen De fem modellerna hjälper dig att välja. Säg för dig själv en kärna för varje avsnitt, och skriv var kärnorna hör hemma i modellen.
            - rubrik: 5 Orden, svaret och samtalet
              text: Skriv vilka ord i texten som visar sambanden, hur svaret på textens fråga kan låta och en fråga om författarens val. Saknar texten ett ord för ett samband skriver du det på bladet. I passet säger gruppen sambandet med egna ord och skriver det i fliken.
    - rubrik: Bladet Egen text
      text:
        - Du fyller i ett blad per text, för hand eller på dator. Ifyllt är det din lärarsida till klassens text.
