    text: Från vecka 3 har två elever var sitt jobbkort i läspasset, och efter varje avsnitt går korten vidare till två andra. Skriv ut ett blad, eller två när sju eller åtta elever arbetar i två halvor. Klipp isär korten och plasta gärna in dem.
    alt: "Bladet har de två jobbkorten att klippa isär. På det första, Du håller kortet När det skaver, står ”Stryk under det som skaver” vid steget Läs. Vid steget Red ut står ”Var skavde det?”, ”Vad har vi prövat?” och ”Läs nästa sätt på kortet”. På det andra, Du leder gruppen till kärnan, står fem rader vid steget Kärnan: ”Vem eller vad handlar det om?”, ”Vad är det viktigaste om det?”, ”Säg kärnan till den bredvid”, ”Vilken gäller hela avsnittet?” och ”Har den högst tio ord? Räkna”. Vid steget Lappen står ”Hur hänger lapparna ihop?”"
