            - rubrik: Så kan svaret låta
              text: En enda, smittkoppor. De fanns i minst 3 000 år. År 1796 kom vaccinet. Från 1967 letade WHO upp varje sjuk och vaccinerade alla runt omkring, och 1980 var världen fri.
    - rubrik: "Lärarens sida: Avancerat, text 3, Virus och bakterier"
      text:
        - Bakterier och virus kan ge samma tecken på sjukdom men är byggda och blir fler på olika sätt, och därför hjälper antibiotika bara mot bakterier. Texten jämför två saker, och modellen är Venndiagrammet, blad 1. I vecka 3 har två elever i taget jobbkorten från avsnitt 2.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Hjälper antibiotika mot en förkylning, och varför?
            - rubrik: Ord före läsningen
              text: antibiotika (en medicin utifrån, ingen antikropp) · virus (ingen liten bakterie) · smittämne (det som smittar och gör sjuk, som virus och en del bakterier)
            - rubrik: 1 Samma hosta, olika orsak
              text: |-
                Red ut: ”blotta ögat” (utan mikroskop) · ”det avgör”: hur de är byggda avgör hjälpen
                Lyssna efter: båda är smittämnen · samma tecken utanpå
                Lockar: de två som hostar. ”Vad är lika hos virus och bakterier?”
                Bilden: De två sida vid sida. Vad har båda? Arvsmassa
            - rubrik: 2 Bakterien
              text: |-
                Red ut: ”Har bakterierna värme” (om de har)
                Lyssna efter: en hel levande cell · delar sig på egen hand
                Lockar: två blir fyra, åtta. ”Vad klarar bakterien på egen hand?”
                Sambandet: ”Av de två”: bakterien och viruset, de två smittämnena i avsnitt 1
                Bilden: Bakteriens delar: cellväggen, arvsmassan och delarna som bygger nytt
            - rubrik: 3 Viruset
              text: |-
                Red ut: ”tar över” (styr cellen) · ”det är cellen som gör arbetet”: bygger virusen
                Lyssna efter: ingen cell · arvsmassa i ett skal · fler inne i celler
                Lockar: fabriken med ny ritning. ”Vad måste viruset ha för att bli fler?”
                Sambandet: ”däremot” och ”Medan”: viruset ställs mot bakterien
                Bilden: De fyra stegen: in i cellen, tar över, byggs, lämnar
            - rubrik: 4 Behandlingen
              text: |-
                Red ut: ”överhuvudtaget” (inte alls) · ”rubbar” (stör, sätter ur balans)
                Lyssna efter: antibiotika mot bakterier · ingenting mot virus · vaccin mot virus
                Lockar: citatet från 1177. ”Varför gör antibiotika ingenting mot ett virus?”
                Sambandet: ”så olika byggda”: hur de är byggda avgör behandlingen
                Bilden: Första bilden: bakterien har cellvägg, och viruset saknar den
            - rubrik: Om någon frågar
              text: Hur stora är de? En bakterie är några tusendels millimeter, och ett virus ungefär tusen gånger mindre, enligt Livsmedelsverket. Kan kroppen vänja sig vid antibiotika? Nej. Det är bakterierna som blir resistenta, och det handlar nästa text om.
        - rubrik: "Modellpasset: Venndiagrammet för Virus och bakterier"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: hekto: hundra gram · ”höll det gamla talet inte” (det stämde inte)
                Lyssna efter: nyttiga bakterier · lika många som cellerna
                Lockar: två hekto, en mobiltelefon. ”Vad gör bakterierna som alltid bor på dig?”
                Sambandet: ”Men långt ifrån alla”: bakterier som inte gör oss sjuka
            - rubrik: Modellen
              text: "Lägg först fram gruppens tankekarta från vecka 1 och fråga: ”Vad ska stå i mitten?” Texten jämför två saker, och kartan visar inte vad som är lika och olika. Ta sedan fram Venndiagrammet, blad 1. Avsnitt 4 ger två post-it-lappar: i modellpasset delar gruppen avsnittets kärna på två lappar, en för var sida. Gruppen lägger fördjupningens lapp på En lapp till, som får namnet Hör till bakterien. Normalfloran är bakterier, och texten nämner inga nyttiga virus."
            - rubrik: Orden
              text: |-
                båda (mitten) · av de två (bakterien) · däremot (viruset)
                Utan flik: gruppen skriver ”olika behandling” och ”däremot” vid lapparna från avsnitt 4.
            - rubrik: Svaret
              text: |-
                Lyssna efter: nej · förkylning kommer av virus · byggda olika: antibiotika slår bara mot bakterier
                Så kan det låta: ”Nej. En förkylning kommer av virus, och antibiotika slår mot delar som bakterier har och virus saknar. Mot virus gör den ingenting, men den rubbar kroppens egna bakterier.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret om antibiotika håller utan talet om avföring."
            - rubrik: Samtala
              text: "Varför börjar författaren med tabletterna i badrumsskåpet? Varför tar författaren samma punkter i samma ordning för bakterien och viruset? Ett svar: läsaren känner igen sig, och samma ordning gör skillnaderna lätta att se."
    - rubrik: "Avancerat, text 3: Virus och bakterier"
      tema: Smittor
      text:
        - Smittor · text 3 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Virus och bakterier
          rader:
            - - Halsen svider, näsan rinner och du orkar ingenting. I badrumsskåpet ligger några tabletter kvar sedan någon i familjen var sjuk förra året. Det är antibiotika, en medicin som kan bota allvarliga infektioner, så den borde väl klara lite snuva. Hjälper antibiotika mot en förkylning, och varför?
        - rubrik: Siffran
          rader:
            - - 38 biljoner
              - bakterier finns det i och på en man på 70 kilo, enligt en beräkning från 2016.
        - rubrik: Samma hosta, olika orsak
          rader:
            - - Två i samma klass ligger hemma med hosta och feber. Den ena har fått ett virus i kroppen, den andra en bakterie. Utanpå syns ingen skillnad, för hostan och febern är kroppens eget försvar, och det reagerar på liknande sätt hos de två.
            - - Virus och bakterier är båda smittämnen, alltså sådant som kan ta sig in i kroppen och göra oss sjuka. Båda är för små för att se med blotta ögat, och båda kan spridas från människa till människa. De kan till och med ge samma sjukdom, för en lunginflammation kan komma av en bakterie hos en människa och av ett virus hos en annan.
            - - Därför blandar många ihop dem. Men där tar likheterna slut. En bakterie och ett virus är byggda på olika sätt och blir fler på olika sätt, och det avgör vilken hjälp som finns. Ibland behöver läkaren ta ett prov för att veta vilket smittämne det är.
        - rubrik: "Bild: Bakterien och viruset"
          rader:
            - - Bakterien och viruset. Bilden visar båda i genomskärning. I verkligheten är viruset mycket mindre än i bilden. Siffrorna är avsnittens nummer.
        - rubrik: Bakterien klarar sig själv
          rader:
            - - Av de två är det bakterien som är en hel levande varelse, fast den består av en enda cell. Innanför **cellväggen** finns allt den behöver, både **arvsmassa** och egna delar som tar upp näring och bygger nytt. Bakterien klarar sig alltså själv, så länge den har näring.
            - - "Bakterien blir också fler på egen hand. Den tar upp näring, växer och delar sig i två, och de två blir fyra och sedan åtta. Har bakterierna värme och näring kan en enda snabbt bli väldigt många, eftersom varje ny bakterie också delar sig. Just det händer vid en infektion med bakterier: en skadlig sorts bakterier blir många på fel ställe i kroppen."
            - - En bakterie är mycket mindre än en av kroppens egna celler, men bredvid ett virus är den en jätte. Bakterier lever dessutom nästan överallt, också i och på en frisk kropp. De flesta är ofarliga, och många gör nytta.
        - rubrik: Ord i texten
          rader:
            - - cellväggen
              - ett stadigt lager runt bakterien
            - - arvsmassa
              - ritningen för hur något levande byggs
        - rubrik: Viruset behöver en cell
          rader:
            - - Ett virus är däremot ingen cell. Det är ett paket arvsmassa i ett skal, och inte mycket mer. Viruset kan inte ta upp näring, inte växa och inte dela sig, så utanför en cell kan det inte bli fler.
            - - För att bli fler måste viruset in i en av kroppens celler, en **värdcell**. Väl inne tar virusets arvsmassa över, ungefär som när en fabrik får en ny ritning. Cellens egna maskiner börjar då bygga nya virus, av cellens eget material. Till sist lämnar de nya virusen cellen, som ofta går sönder, och tar sig in i cellerna intill.
            - - Ett virus är alltså ingen liten bakterie. Det är byggt på ett helt annat sätt och är dessutom mycket mindre än bakterien. Det finns till och med virus som tar över bakterier. Medan bakterien delar sig själv blir viruset fler bara inne i en cell, och det är cellen som gör arbetet.
        - rubrik: Ord i texten
          rader:
            - - värdcell
              - cell som ett virus har tagit över
        - rubrik: "Bild: Så blir virus fler"
          rader:
            - - Så blir virus fler. Det sker i fyra steg, och cellen som viruset har tagit sig in i gör hela arbetet.
        - rubrik: Olika byggda, olika behandling
          rader:
            - - Eftersom bakterien och viruset är så olika byggda kräver de olika behandling. Mot bakterier finns antibiotika, en medicin som slår mot delar av bakterien, till exempel cellväggen. Kroppens celler saknar de delarna eller har dem byggda på ett annat sätt, och därför skadas bakterierna men sällan du.
            - - "Ett virus har däremot ingen cellvägg och inga av de andra delar som antibiotika slår mot. Därför gör antibiotika ingenting mot virus. På 1177, vårdens webbplats, står det: ”Mot virus hjälper inte antibiotika överhuvudtaget, det hjälper bara mot bakterier.” En förkylning kommer av virus, och kroppens försvar får klara den på egen hand. Mot en del andra virus finns vaccin, som skyddar i förväg, och i några fall läkemedel som bromsar viruset."
            - - Antibiotika i onödan kan dessutom göra skada. Medicinen rubbar också de bakterier som hör hemma i kroppen och gör nytta där. Den som tar antibiotika mot en förkylning får alltså nackdelarna utan nytta. Tabletterna i badrumsskåpet lämnar du in på apoteket.
        - rubrik: "Fakta: Sjukdomar och smittämnen"
          rader:
            - - Virus
              - förkylning, influensa, mässling, smittkoppor
            - - Bakterier
              - klamydia, borrelia, salmonella
            - - Virus eller bakterier
              - lunginflammation
        - rubrik: "Fördjupning: Du är till hälften bakterier"
          rader:
            - - Men långt ifrån alla bakterier är smittämnen. Du bär alltid på bakterier, i tarmen, på huden och i svalget. De hör till en frisk kropp. Tillsammans kallas de normalflora, och de hjälper dig att hålla dig frisk. Medicinen slår också mot dem, och därför gör antibiotika i onödan skada.
            - - Länge sa man att bakterierna i kroppen var tio gånger fler än kroppens egna celler. År 2016 räknade tre forskare om, och då höll det gamla talet inte. De kom fram till ungefär 38 biljoner bakterier och 30 biljoner egna celler hos en man på 70 kilo. En biljon är en miljon miljoner, så talet 38 biljoner skrivs med tolv nollor efter 38. Bakterierna är alltså ungefär lika många som cellerna, och räknar du på det sättet är du till hälften bakterier.
            - - Räknar du på vikten blir svaret ett annat. Bakterier är så små att alla 38 biljoner tillsammans väger ungefär två hekto, som en mobiltelefon. Det är en mycket liten del av kroppens vikt. Samma kropp ger alltså två olika svar, beroende på vad du räknar. Så är det ofta med tal. Den som vill förstå ett tal behöver veta hur det har räknats fram, och när.
        - rubrik: Visste du att …
          rader:
            - - 100 miljarder
              - bakterier finns det ungefär i ett enda gram avföring, enligt beräkningen från 2016. Är det ett skäl att tvätta händerna?
        - rubrik: Läs mer
          rader:
            - - 1177 berättar när antibiotika hjälper och när den inte gör det.
              - https://www.1177.se/undersokning-behandling/behandling-med-lakemedel/lakemedel-utifran-diagnos/antibiotika/
            - - 1177 förklarar vad en infektion är och hur virus och bakterier behandlas.
              - https://www.1177.se/sjukdomar--besvar/infektioner/infektion-och-inflammation/
            - - Folkhälsomyndigheten förklarar vad som händer när bakterier blir motståndskraftiga mot antibiotika.
              - https://www.folkhalsomyndigheten.se/vara-amnesomraden/antibiotika-och-antibiotikaresistens/om-antibiotikaresistens/
    - rubrik: "Modellen: Avancerat, text 3, Virus och bakterier"
      tema: Smittor
      text:
        - Venndiagrammet, blad 1, ifyllt för Virus och bakterier.
      delar:
        - rubrik: Frågan och svaret
          falt:
            - rubrik: Textens fråga
              text: Hjälper antibiotika mot en förkylning, och varför?
            - rubrik: Lyssna efter
              text: "nej · förkylning kommer av virus · byggda olika: antibiotika slår bara mot bakterier"
            - rubrik: Så kan svaret låta
              text: Nej. En förkylning kommer av virus, och antibiotika slår mot delar som bakterier har och virus saknar. Mot virus gör den ingenting, men den rubbar kroppens egna bakterier.
    - rubrik: "Lärarens sida: Avancerat, text 4, När medicinen sviker"
      text:
        - Bakterier blir resistenta genom slump och urval, resistensen sprids, och då blir infektioner och operationer farligare. Texten förklarar orsak och verkan, och modellen är Kedjan, blad 1. I vecka 4 har två elever i taget jobbkorten från avsnitt 2.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: "Vem är det som blir resistent: människan eller bakterien? Och hur går det till?"
            - rubrik: Ord före läsningen
              text: resistent (tål medicinen, inte immun) · antibiotika (inte mot virus) · infektion (inte inflammation)
            - rubrik: 1 Slumpen
              text: |-
                Red ut: ”biter”: verkar · växer till: blir fler · nitlott: lott utan vinst
                Lyssna efter: några få bakterier · tål lite mer · av en slump
                Lockar: miljarder lotter. ”Hur fick några bakterier sin mutation?”
                Bilden: Rutan Före: några få mörka bland alla ljusa
            - rubrik: 2 Urvalet
              text: |-
                Red ut: avkomman: de nya bakterierna · dosen: mängden medicin
                Lyssna efter: de känsliga dör · de tåliga blir kvar · tar över platsen
                Lockar: bakterier följer med till nästa människa. ”Vad gör antibiotikan med de känsliga och de tåliga?”
                Sambandet: ”Eftersom några tål mer”, alltså slumpen i avsnitt 1
                Bilden: Rutorna Under och Efter: de ljusa dör, de mörka fyller platsen
            - rubrik: 3 Spridningen
              text: |-
                Red ut: uppstod: blev till · ”Mottagaren”: bakterien som får arvsanlagen
                Lyssna efter: mellan bakterier · mellan människor · över hela världen
                Lockar: filen till en kompis. ”Vilka två vägar går spridningen?”
                Sambandet: ”det gör att”, alltså sprids också de resistenta
                Bilden: De två vägarna: bakterie till bakterie, människa till människa
            - rubrik: 4 Följderna
              text: |-
                Red ut: ”räknar med”: utgår från · ”kopplades till”: den döda hade resistenta bakterier
                Lyssna efter: infektioner svårare att bota · operationer och cancervård · farligare
                Lockar: 412 miljarder. ”Vad blir svårare och farligare när antibiotikan inte biter?”
                Sambandet: ”Därför”, alltså för att resistensen har spridits till många
            - rubrik: Om någon frågar
              text: "Varför får man inte antibiotika mot förkylning? Den beror på virus, och antibiotika hjälper bara mot bakterier. Blir jag resistent av många kurer? Nej, det är bakterierna som blir det. Dödar antibiotika också nyttiga bakterier? Ja, den rubbar normalfloran i tarmen, på huden och i svalget. Går det lika fort i kroppen? Det visar inte försöket: skålen är ingen kropp."
        - rubrik: "Modellpasset: Kedjan för När medicinen sviker"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: band: remsor tvärs över skålen · ”bröt igenom”: började växa i nästa band
                Lyssna efter: band med starkare antibiotika · en mutation bryter igenom · tusen gånger, tio dagar
                Lockar: skålen stor som ett skrivbord. ”Vad hände vid varje ny gräns i skålen?”
                Sambandet: ”Slumpen och urvalet”, alltså avsnitt 1 och 2 i ett försök
                Bilden: Banden i skålen: starkast i mitten, bakterierna växer inåt
            - rubrik: Modellen
              text: "Lägg först fram gruppens tidslinje från vecka 2 och fråga: ”Flikarna säger när. Var skriver vi varför?” Den visar när, men inte varför. Ta sedan fram Kedjan, blad 1. Gruppen lägger fördjupningens post-it-lapp på En lapp till, med streck till led 1 och led 2. Försöket visar slumpen och urvalet om och om igen och är inget femte led."
            - rubrik: Orden
              text: |-
                eftersom några tål mer (urvalet) · det gör att (spridningen) · därför (följderna)
                Utan flik: gruppen skriver ”av en slump” i led 1.
            - rubrik: Svaret
              text: |-
                Lyssna efter: bakterien · slump och urval · kroppen vänjer sig inte
                Så kan det låta: ”Det är bakterien. Några bakterier tål mer av en slump, och när antibiotikan dödar de andra tar de tåliga över. Sedan sprids de. Människan blir inte resistent men drabbas ändå.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret håller utan talet för den andra sortens antibiotika."
            - rubrik: Samtala
              text: "Varför börjar författaren med en ask tabletter? Varför jämför hen bakterierna med lotter? Ett svar: asken är det vi litar på, och lotterna visar att ingen bakterie väljer."
    - rubrik: "Avancerat, text 4: När medicinen sviker"
      tema: Smittor
      text:
        - Smittor · text 4 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: När medicinen sviker
          rader:
            - - "En ask tabletter, och snart är du frisk. Så har det varit sedan antibiotikan kom, för den botar infektioner som förr kunde vara dödliga. Men nu händer det allt oftare att medicinen inte biter, och då har något blivit resistent, alltså börjat tåla den. Vem är det som blir resistent: människan eller bakterien? Och hur går det till?"
        - rubrik: Siffran
          rader:
            - - 4,7 miljoner
              - dödsfall i världen år 2021 kopplades till resistenta bakterier.
        - rubrik: Slumpen bland miljarder bakterier
          rader:
            - - "**Antibiotika** är läkemedel som dödar bakterier eller hindrar dem från att bli fler. En bakterie är en levande cell, och den blir fler genom att dela sig: en blir två, och två blir fyra. När bakterier växer till i kroppen och gör dig sjuk har du en infektion, och då kan de vara miljarder."
            - - Varje gång en bakterie delar sig kopierar den sina arvsanlag, alltså ritningen för hur en ny bakterie ska byggas. Ibland blir kopian inte exakt lik originalet. En sådan slumpvis förändring kallas **mutation**. Den kan skada bakterien, sakna betydelse eller ge den en fördel.
            - - "Bland miljarder bakterier finns det därför ofta några som av en slump har fått en mutation som gör att de tål lite mer antibiotika än de andra. Ingen bakterie har valt det, och ingen har tränat. Det är som med lotter: nästan alla är nitlotter, men köper du miljarder lotter är några av dem nästan säkert vinster."
        - rubrik: Ord i texten
          rader:
            - - antibiotika
              - läkemedel mot bakterier, verkar inte mot virus
            - - mutation
              - en slumpvis förändring i arvsanlagen
        - rubrik: Urvalet när antibiotikan kommer
          rader:
            - - Eftersom några tål mer dör inte alla bakterier lika lätt när du tar antibiotika. De känsliga dör först, och kvar blir de få som tål mer. Plötsligt har de fått hela platsen för sig själva, och när de delar sig ärver avkomman samma mutation.
            - - Det här kallas **urval**. Antibiotikan har inte gjort någon enda bakterie tålig. Den har tagit bort de andra, så att de som redan var tåliga kunde ta över. Efter en tid tål nästan alla bakterierna dosen, och en bakterie som gör det kallas **resistent**.
            - - Lägg nu märke till vem det är som blir resistent. Det är bakterierna som blir resistenta. Människor och djur blir det inte, och kroppen vänjer sig inte vid antibiotika. Problemet sitter alltså i bakterierna, och bakterier kan följa med till nästa människa.
        - rubrik: Ord i texten
          rader:
            - - urval
              - när bara de som klarar sig blir fler
            - - resistent
              - tål ett läkemedel som brukar döda bakterier
        - rubrik: "Bild: Före, under och efter"
          rader:
            - - Före, under och efter. Bilden visar samma bakterier tre gånger, och de mörka tål mer antibiotika än de ljusa. Siffrorna är avsnittens nummer.
        - rubrik: Spridningen går två vägar
          rader:
            - - Bakterier sprids, och det gör att de resistenta inte stannar där de uppstod. Spridningen går två vägar.
            - - Den första vägen går mellan bakterier. En resistent bakterie kan ge en annan bakterie de arvsanlag som gör den resistent, ungefär som när du skickar en fil till en kompis. Mottagaren behöver alltså ingen egen mutation för att bli resistent.
            - - Den andra vägen går mellan människor. Bakterier följer med på händerna, och den som bär på resistenta bakterier kan lämna dem vidare till andra utan att själv vara sjuk. Sedan bär människor, djur och livsmedel bakterierna mellan länder och över hela världen. En resistent bakterie som uppstod i ett land kan därför dyka upp i ett helt annat, hos en människa som aldrig har tagit just den antibiotikan. Så blir en mutation i en enda bakterie till slut ett problem för många.
        - rubrik: "Bild: Två vägar"
          rader:
            - - Två vägar. Resistensen sprids från bakterie till bakterie, och med människor, djur och livsmedel över världen.
        - rubrik: Följderna i vården
          rader:
            - - Därför blir vanliga infektioner svårare att bota. När bakterierna är resistenta biter den vanliga antibiotikan inte längre, och en infektion som förr var lätt att bota kan bli farlig igen.
            - - Följderna når längre än så, eftersom en stor del av sjukvården räknar med att antibiotika fungerar. Den som opereras får ett sår, och den som behandlas för cancer har ofta ett svagare försvar mot smitta. I båda fallen skyddar antibiotika mot infektioner. Utan det skyddet blir vanliga operationer och cancervård farligare.
            - - År 2021 kopplades 4,7 miljoner dödsfall i världen till resistenta bakterier, enligt en beräkning som Världshälsoorganisationen WHO redovisar. WHO skriver också att vården av infektioner med resistenta bakterier väntas kosta 412 miljarder dollar om året fram till 2035, om världen fortsätter som nu. I Sverige fortsatte resistensen att öka år 2025. Allt börjar om varje gång antibiotika används, och därför är varje **kur** också ett nytt urval.
        - rubrik: Ord i texten
          rader:
            - - kur
              - en omgång medicin som läkaren har bestämt
        - rubrik: "Fördjupning: Evolution på tio dagar"
          rader:
            - - Slumpen och urvalet går att se med blotta ögat. Det visade forskare vid universiteten Harvard i USA och Technion i Israel år 2016. De byggde en odlingsskål som var 60 gånger 120 centimeter, ungefär som skivan på ett skrivbord, och fyllde den med 14 liter agar, en gelé som bakterier kan växa på. Skålen var indelad i band. Längst ut fanns ingen antibiotika alls. I nästa band fanns en liten dos, och sedan blev dosen tio gånger starkare för varje band mot mitten. I banden längst ut släppte forskarna ut bakterier av sorten E. coli, och sedan filmade de skålen uppifrån.
            - - Bakterierna växte tills de nådde det första bandet med antibiotika. Där tog det stopp, eftersom dosen var för stark för dem. Men efter en tid bröt små fläckar igenom gränsen. I varje fläck hade en bakterie av en slump fått en mutation som gjorde att den tålde dosen. Avkomman fyllde bandet och stannade vid nästa gräns, tills nya mutationer bröt igenom också där.
            - - Efter tio dagar växte bakterier i bandet i mitten. De tålde antibiotikan trimetoprim i en dos som var tusen gånger starkare än den som stoppade de första bakterierna. Ingen bakterie hade vant sig vid något. Slumpen gav mutationerna, och antibiotikan gjorde urvalet, band för band. Så går evolution till, och här tog den tio dagar.
        - rubrik: "Fakta: Försöket i tal"
          rader:
            - - Skålens mått
              - 60 × 120 centimeter
            - - Agar i skålen
              - 14 liter
            - - Tid
              - 10 dagar
            - - Dosen i mitten
              - 1 000 gånger den första dosen
        - rubrik: "Bild: Skålen med banden"
          rader:
            - - Skålen med banden. Ytterst finns ingen antibiotika, sedan en liten dos som blir tio gånger starkare för varje band mot mitten. Bakterierna växer inåt från båda ändarna.
        - rubrik: Visste du att …
          rader:
            - - 100 000
              - gånger starkare dos tålde bakterierna när forskarna bytte till en annan sorts antibiotika, ciprofloxacin. Vad hade du gissat?
        - rubrik: Läs mer
          rader:
            - - Folkhälsomyndigheten förklarar vad antibiotikaresistens är och vem det är som blir resistent.
              - https://www.folkhalsomyndigheten.se/vara-amnesomraden/antibiotika-och-antibiotikaresistens/om-antibiotikaresistens/
            - - 1177 svarar på vanliga frågor om antibiotika, till exempel om du själv kan bli resistent.
              - https://www.1177.se/Stockholm/undersokning-behandling/behandling-med-lakemedel/om-lakemedel/fragor-och-svar-om-antibiotika/
            - - Harvard visar filmen från försöket med skålen. Texten är på engelska.
              - https://hms.harvard.edu/news/bugs-screen
    - rubrik: "Modellen: Avancerat, text 4, När medicinen sviker"
      tema: Smittor
      text:
        - Kedjan, blad 1, ifylld för När medicinen sviker.
      delar:
