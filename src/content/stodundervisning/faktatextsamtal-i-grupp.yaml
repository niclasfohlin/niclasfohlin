    alt: "Eleven läser bladet Text 1, Bäverns damm, i kartläggningen före perioden. Bladet har en rad för namnet, och under rubriken står två rader till eleven: ”Läs meningarna först” och ”Läs sedan texten med en penna i handen, ett avsnitt i taget”. Under dem står de fyra meningarna om Samir, i en ruta med frågan om något är konstigt. Sedan kommer texten i två avsnitt, En damm i bäcken och Ingången under vattnet. Sist står bilden av bäverns damm och hydda, sedda från sidan, med orden Damm, Hydda och Ingång."
