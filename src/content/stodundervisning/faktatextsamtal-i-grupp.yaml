mal:
  overgripande: "kunna reda ut det som skaver i en faktatext och säga kärnan med egna ord."
  punkter:
    - Stanna och säga var det skaver
    - Reda ut ett ord eller en mening med hjälp av texten
    - Säga kärnan i ett avsnitt med egna ord
    - Skilja det viktiga från det intressanta
    - Säga hur två avsnitt hänger ihop
    - Välja modell efter hur texten är byggd
