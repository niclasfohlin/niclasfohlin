    - rubrik: "Lärarens sida: Bas, text 5, En kran åt alla"
      text:
        - En av fyra människor saknar rent vatten hemma, oftast för att vattnet är smutsigt eller långt borta, och brunnar, rör, rening och toaletter gör att fler får det för varje år. Texten har ett problem och en lösning, och modellen är Problem och lösning, blad 1. I vecka 5 har två elever i taget jobbkorten från avsnitt 2, och de två som har dem i avsnitt 4 leder hela avsnittet.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Varför har inte alla rent vatten hemma, och vad kan man göra åt det?
            - rubrik: Ord före läsningen
              text: miljard (tusen miljoner, inte en miljon) · rent vatten (går att dricka, inte bara klart) · landsbygd (utanför städerna, inget eget land)
            - rubrik: 1 Utan rent vatten hemma
              text: |-
                Red ut: ”Den fjärde”: en av de fyra · miljard, förklaras i meningen efter
                Lyssna efter: en av fyra · saknar rent vatten hemma
                Lockar: dricker direkt ur floder. ”Vad säger texten efter orden ’Problemet är’?”
            - rubrik: 2 Smutsigt eller långt borta
              text: |-
                Red ut: ”Vatten finns det ofta”: det finns ofta vatten · ”svårt sjuk”: mycket sjuk
                Lyssna efter: vatten finns ofta · smutsigt · långt borta
                Lockar: bajs i vattnet. ”Vilka två saker beror problemet oftast på?”
                Sambandet: ”Problemet beror oftast på”: orsaken till problemet i avsnitt 1
                Bilden: Floden ligger långt från husen
            - rubrik: 3 Brunnar, rör och toaletter
              text: |-
                Red ut: ”En annan lösning”: det finns flera · renas: göras rent
                Lyssna efter: brunn med pump · rör och rening · toaletter
                Lockar: talen från Indien. ”Vilka lösningar räknar avsnittet upp?”
                Sambandet: ”En lösning är”: svaret på smutsigt och långt borta
                Bilden: Pumpen står nära husen och når grundvattnet. Floden ligger långt borta
            - rubrik: 4 Fler får vatten varje år
              text: |-
                Red ut: sex av tio: på landsbygden · en av fyra: i hela världen
                Lyssna efter: fler för varje år · långt kvar till alla
                Lockar: år 2030. ”Vad hände mellan 2015 och 2024?”
                Sambandet: ”har lett till”: det som lösningarna har gett
                Bilden: Fem blå av tio år 2015, sex år 2024
            - rubrik: Om någon frågar
              text: Kan man dö av smutsigt vatten? Ja, diarré av smutsigt dricksvatten dödar ungefär 505 000 människor om året (WHO 2023). Vad räknas som rent vatten hemma? Vatten utan smitta och farliga ämnen, som finns när det behövs. Vad är en säker toalett? En egen, där bajset tas om hand. Hur mycket är 200 miljoner timmar? Tillsammans över 22 800 år.
        - rubrik: "Modellpasset: Problem och lösning för En kran åt alla"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: ”i snitt”: ibland kortare, ibland längre · Afrika söder om Sahara: länderna söder om öknen
                Lyssna efter: kvinnor och flickor bär · tiden tas från annat
                Lockar: 33 minuter per tur. ”Vem bär vattnet, och vad tas tiden från?”
                Sambandet: ”Problemet har en sida till”: tillbaka till problemet i avsnitt 1
            - rubrik: Modellen
              text: "Lägg först fram gruppens kedja från vecka 4 och fråga: ”Var skriver vi det någon gör åt problemet?” Den visar vad som leder till vad, men inte vad någon gör åt problemet. Ta sedan fram Problem och lösning, blad 1. Gruppen lägger fördjupningens post-it-lapp på En lapp till och drar ett streck till problemet. Lappen visar vad problemet kostar: tid, som ibland tas från skolan."
            - rubrik: Orden
              text: problemet är (en av fyra) · beror oftast på (smutsigt, långt borta) · en lösning är (brunn, rör, toalett) · har lett till (fler får vatten)
            - rubrik: Svaret
              text: |-
                Lyssna efter: smutsigt eller långt borta · brunnar, rör, rening och toaletter · fler får vatten, inte alla än
                Så kan det låta: ”En av fyra har inte rent vatten hemma. Vatten finns det ofta, men det är smutsigt eller långt borta. Brunnar, rör, rening och toaletter hjälper, och fler får vatten för varje år.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret håller utan timmarna, men rutan visar hur stor problemets andra sida är."
            - rubrik: Samtala
              text: "Varför börjar författaren vid din kran? Varför står det att lösningarna är samma som hos dig? Ett svar: för att läsaren ska se att problemet går att lösa."
    - rubrik: "Bas, text 5: En kran åt alla"
      tema: Vatten
      text:
        - Vatten · text 5 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: En kran åt alla
          rader:
            - - Du vrider på kranen, och vattnet kommer. Det är rent och kallt, och du tänker knappt på det. Så är det inte för alla. Varför har inte alla rent vatten hemma, och vad kan man göra åt det?
        - rubrik: Siffran
          rader:
            - - 1 av 4
              - människor i världen har inte rent vatten hemma, enligt siffror för år 2024.
        - rubrik: Utan rent vatten hemma
          rader:
            - - Tänk dig fyra människor på rad. Tre av dem har rent vatten hemma. Den fjärde har det inte.
            - - Så är det när man räknar alla människor i världen. Problemet är att en av fyra människor saknar rent dricksvatten hemma. Det är 2,1 miljarder människor, enligt FN:s siffror för år 2024. En miljard är tusen miljoner.
            - - Den som saknar rent vatten hemma får ta det som finns. I världen dricker 106 miljoner människor direkt ur sjöar och floder.
        - rubrik: "Fakta: Världen i siffror, år 2024"
          rader:
            - - Utan rent vatten hemma
              - 2,1 miljarder människor
            - - Dricker ur sjöar och floder
              - 106 miljoner
            - - Utan säker toalett
              - 3,4 miljarder
            - - Utan någon toalett alls
              - 354 miljoner
        - rubrik: Smutsigt eller långt borta
          rader:
            - - Problemet beror oftast på att vattnet är smutsigt eller ligger långt borta. Vatten finns det ofta.
            - - Smutsen syns inte alltid. Vatten kan se klart ut och ändå vara **förorenat**. Farligt blir det när bajs hamnar i vattnet, och det händer där det saknas toaletter. Den som dricker vattnet kan bli svårt sjuk.
            - - På andra ställen finns rent vatten, men långt från husen. Inga rör leder det hem. Då måste någon gå och bära vattnet, varje dag.
        - rubrik: Ord i texten
          rader:
            - - förorenat
              - smutsat av något som kan göra dig sjuk
        - rubrik: Brunnar, rör och toaletter
          rader:
            - - En lösning är att borra en brunn mitt i byn och sätta en pump på den. Då finns grundvattnet nära, och ingen behöver gå långt.
            - - En annan lösning är rör som leder vattnet ända fram till husen. Så har Indien gjort. År 2019 hade 17 av 100 hem på **landsbygden** en kran. År 2022 hade 49 av 100 hem en kran, enligt landets regering.
            - - Smutsigt vatten kan renas innan någon dricker det. Toaletter håller bajset borta från vattnet. Lösningarna är inte nya. Det är samma saker som ger dig rent vatten i kranen.
        - rubrik: Ord i texten
          rader:
            - - landsbygden
              - trakterna utanför städerna
        - rubrik: "Bild: Brunnen i byn"
          rader:
            - - Brunnen i byn. Du ser byn från sidan, ända ner i marken. Pumpen nära husen hämtar upp grundvattnet. Siffrorna är avsnittens nummer.
        - rubrik: Fler får vatten varje år
          rader:
            - - Lösningarna har lett till att fler får rent vatten för varje år. År 2015 hade fem av tio människor på världens landsbygd rent vatten hemma. År 2024 var det sex av tio.
            - - Men det är långt kvar. FN har som mål att alla människor ska ha rent vatten år 2030. Enligt siffrorna för 2024 saknar fortfarande en av fyra människor i världen rent vatten hemma.
            - - Lösningarna finns, och de fungerar. Nu gäller det att de når fram till alla.
        - rubrik: "Bild: Rent vatten på landsbygden"
          rader:
            - - Rent vatten på landsbygden. Varje rad är tio människor. De blå har rent vatten hemma. Målet för år 2030 är att alla ska vara blå.
        - rubrik: "Fördjupning: Vem bär vattnet?"
          rader:
            - - Problemet har en sida till. Där vattnet ligger långt borta måste någon gå och hämta det. Oftast är det kvinnor och flickor som bär hem vattnet. Så är det i de flesta länder som har räknat. En flicka i din ålder kan vara en av dem.
            - - På landsbygden i Afrika söder om Sahara tar en tur fram och tillbaka i snitt 33 minuter, enligt en räkning från 2016. Tiden tas från annat, ibland från skolan.
            - - Därför ger en pump i byn mer än vatten. Den ger också tid, till skolan och annat.
        - rubrik: Visste du att …
          rader:
            - - 200 miljoner
              - timmar om dagen gick tillsammans åt när kvinnor och flickor hämtade vatten, enligt en räkning från 2016. Vad skulle du göra med en timme extra varje dag?
        - rubrik: Läs mer
          rader:
            - - Globala målen berättar om mål 6, rent vatten, också på lättläst svenska.
              - https://www.globalamalen.se/om-globala-malen/mal-6-rent-vatten-och-sanitet/
