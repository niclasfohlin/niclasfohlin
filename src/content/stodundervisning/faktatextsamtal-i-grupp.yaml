    - rubrik: "Lärarens sida: Medel, text 5, Skräpet runt jorden"
      text:
        - Banorna närmast jorden är trånga, och skräpet där far så fort att en liten bit kan förstöra en satellit. Lösningarna, att väja, lämna banan och hämta skräpet, räcker inte än. Texten har ett problem och en lösning, och modellen är Problem och lösning, blad 2. I vecka 5 har två elever i taget jobbkorten från avsnitt 2, och de två som har dem i avsnitt 4 leder hela avsnittet.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Runt jorden far tiotusentals trasiga satelliter och bitar. Kan de krocka, och går det att städa bort dem?
            - rubrik: Ord före läsningen
              text: satellit (här en maskin, ingen måne) · bana (vägen runt jorden, ingen räls) · rymdskrot (trasiga saker i bana, inte sopor)
            - rubrik: 1 Trångt runt jorden
              text: |-
                Red ut: ”följdes”: någon håller reda på dem · ”resten”: 40 000 minus 11 000
                Lyssna efter: trånga banor nära jorden · skräp som ingen styr
                Lockar: 1,2 miljoner bitar. ”Vad är problemet, enligt sista stycket?”
                Bilden: De mörka prickarna är skräp. Tätast är det närmast jorden
            - rubrik: 2 Därför är det farligt
              text: |-
                Red ut: kilometer i sekunden: sträckan på en sekund · ”i bruk”: användes
                Lyssna efter: hög fart · liten bit förstör · krock ger nya bitar
                Lockar: krocken över Sibirien. ”Vad beror faran på, enligt första meningen?”
                Sambandet: ”beror på farten”: varför skräpet i avsnitt 1 är farligt
                Bilden: Krocken 2009. Banorna korsas, och efteråt far bitarna vidare
            - rubrik: 3 Väja och städa efter sig
              text: |-
                Red ut: ”städa efter sig” (ta ner sin satellit) · ”styrs undan” (flyttas åt sidan)
                Lyssna efter: satelliter väjer · lämna banan · inom fem år
                Lockar: tre gånger om dagen. ”Vilka två delar har lösningen?”
                Sambandet: ”En lösning är att”, från faran till det någon gör åt den
                Bilden: Vid de två treorna väjer en satellit, och en annan faller ner
            - rubrik: 4 Hämta skräpet
              text: |-
                Red ut: ”Någon”: farkosten i nästa stycke · ”lönar sig”: är värt besväret
                Lyssna efter: hämta gammalt skräp · farkoster byggs och prövas
                Lockar: bärgningsbilarna. ”Vad är lösningen, och hur långt har den kommit?”
                Sambandet: ”En annan lösning är att”: för skräpet som redan finns
                Bilden: Vid siffran 4 drar farkosten ner den gamla satelliten
            - rubrik: Om någon frågar
              text: Varför faller skräpet inte rakt ner? Det faller hela tiden, men så fort att det faller runt jorden. Kommer skräpet av annat än krockar? Ja, efter ett kinesiskt test 2007 gick 25 procent fler föremål att följa. Hur länge har det funnits satelliter? Sedan 1957, då Sputnik 1 sköts upp. Hur stor är rymdstationen ISS? 109 meter lång.
        - rubrik: "Modellpasset: Problem och lösning för Skräpet runt jorden"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: ”även om”: fast inget nytt kom dit · syndrom: här namnet på en fara
                Lyssna efter: räcker inte än · skräpet ökar ändå · krockar ger nya krockar
                Lockar: namnet Kesslersyndromet. ”Vad svarar texten på rubrikens fråga?”
                Sambandet: ”Hittills räcker lösningarna inte”: vad lösningarna har lett till
            - rubrik: Modellen
              text: "Lägg först fram gruppens kedja från vecka 4 och fråga: ”Var skriver vi det någon gör åt problemet?” Den visar vad som leder till vad, men inte vad någon gör åt problemet. Ta sedan fram Problem och lösning, blad 2. Gruppen lägger fördjupningens post-it-lapp på En lapp till, som får namnet Resultatet hittills. Lösningarna används, och skräpet ökar ändå. På blad 2 har resultatet ingen egen plats."
            - rubrik: Orden
              text: |-
                problemet är att (trånga banor) · beror på (farten) · en lösning är att (väja och städa) · en annan lösning är att (hämta)
                Utan flik: gruppen skriver ”hittills räcker lösningarna inte” vid En lapp till.
            - rubrik: Svaret
              text: |-
                Lyssna efter: ja, krocken 2009 och farten · väja, lämna banan och hämta · räcker inte än
                Så kan det låta: ”Ja. År 2009 krockade två satelliter, och farten gör även små bitar farliga. Satelliter väjer, ESA:s satelliter som är klara ska lämna de trånga banorna inom fem år, och ingenjörer prövar farkoster som ska hämta skräp. Det räcker inte än.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret håller utan astronauterna, men rutan förklarar varför inget ligger stilla."
            - rubrik: Samtala
              text: "Varför börjar författaren på en motorväg? Varför berättar hen om krocken 2009? Ett svar: alla känner igen en motorväg, och krocken visar att faran är verklig."
    - rubrik: "Medel, text 5: Skräpet runt jorden"
      tema: Rymden
      text:
        - Rymden · text 5 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Skräpet runt jorden
          rader:
            - - Tänk dig en motorväg där trasiga bilar aldrig hämtas, och där de rullar vidare i full fart utan förare. Så ser det ut högt över ditt huvud. Runt jorden far tiotusentals trasiga satelliter och bitar. Kan de krocka, och går det att städa bort dem?
        - rubrik: Siffran
          rader:
            - - 40 000
              - föremål i bana runt jorden följdes från marken i slutet av 2024.
        - rubrik: "Bild: Trängseln runt jorden"
          rader:
            - - "Trängseln runt jorden. Varje prick är tusen föremål som följdes 2024: elva ljusa för satelliter som fungerar, tjugonio mörka för skräp. Bilden visar inte rätt storlekar och avstånd."
        - rubrik: Trångt runt jorden
          rader:
            - - En satellit är en maskin som går runt jorden i en bana, varv efter varv. Satelliter hjälper oss med väderprognoser, kartan i mobilen och mycket annat. Men när en satellit slutar fungera kan den bli kvar där uppe i många år. Raketdelar och trasiga bitar kan också bli kvar. Allt det skräpet kallas rymdskrot.
            - - I slutet av 2024 följdes från marken omkring 40 000 föremål i bana. Bara omkring 11 000 av dem var satelliter som fungerade, och resten var skräp. Forskarna räknar med att mer än 1,2 miljoner bitar är större än en centimeter. De allra flesta är för små för att följas.
            - - Rymden är enorm, men banorna närmast jorden är trånga. Problemet är att skräpet far runt där, bland satelliterna som fungerar, och att ingen styr det.
        - rubrik: "Fakta: Runt jorden, slutet av 2024"
          rader:
            - - Föremål som följs från marken
              - omkring 40 000
            - - Satelliter som fungerar
              - omkring 11 000
            - - Skräp som följs
              - nästan 30 000
            - - Bitar större än en centimeter, beräknat
              - mer än 1,2 miljoner
        - rubrik: Därför är det farligt
          rader:
            - - Att skräpet är farligt beror på farten. Inget i bana runt jorden ligger stilla. Rymdstationen ISS hinner sexton varv runt jorden på ett dygn. I sådan fart kan en bit som ryms i din hand förstöra en hel satellit.
            - - Den 10 februari 2009 kom beviset. Två satelliter, Iridium 33 och Kosmos 2251, krockade 776 kilometer över Sibirien. Den ena var i bruk, men den andra hade slutat fungera och gick inte att styra. Farten när de möttes var 11,7 kilometer i sekunden. Med den farten tar det drygt två minuter att flyga längs hela Sverige, från söder till norr.
            - - Krocken gjorde två satelliter till mer än 2 300 bitar som går att följa. Varje bit far vidare i sin bana och kan träffa något annat.
        - rubrik: "Bild: Krocken 2009"
          rader:
            - - Krocken 2009. Två banor korsar varandra 776 kilometer över Sibirien. Efter krocken far mer än 2 300 bitar vidare längs banorna. Bilden visar inte rätt avstånd.
        - rubrik: Väja och städa efter sig
          rader:
            - - En lösning är att **väja**. Skräp som följs från marken går att se i förväg. När en bit ser ut att komma för nära styrs satelliten undan, och skräpet far förbi. Men bara satelliter som fungerar kan väja, och bara för skräp som någon följer.
            - - Till lösningen hör också att städa efter sig. Europas rymdorganisation ESA har sedan 2023 en regel för sina egna satelliter i de trånga banorna. En satellit som är klar med sitt jobb ska lämna banan inom fem år. Den äldre regeln sa 25 år.
            - - Att lämna banan betyder att falla ner mot jorden. Det mesta brinner upp på vägen ner genom luften. Redan 2024 föll en hel satellit eller en raketdel ner mer än tre gånger om dagen, i genomsnitt.
        - rubrik: Ord i texten
          rader:
            - - väja
              - flytta sig undan för att inte krocka
        - rubrik: Hämta skräpet
          rader:
            - - En annan lösning är att hämta det skräp som redan finns. En gammal satellit som inte går att styra kan varken väja eller ta sig ner själv. Någon måste åka dit.
            - - Därför bygger och prövar ingenjörer **farkoster** som ska fungera som bärgningsbilar i rymden. En sådan farkost ska flyga ikapp en trasig satellit, gripa tag i den och dra den ner mot jorden. Det är svårt, eftersom skräpet far fram i väldig fart och aldrig byggdes för att gripas.
            - - Krocken 2009 visar varför det lönar sig. Då blev två satelliter tusentals bitar. Om en stor sak hämtas i tid blir den alltså aldrig tusentals bitar. Än så länge byggs och prövas farkosterna.
        - rubrik: Ord i texten
          rader:
            - - farkoster
              - fordon, här sådana som flyger i rymden
        - rubrik: "Bild: Tre sätt att slippa krockar"
          rader:
            - - Tre sätt att slippa krockar. Satelliten väjer för skräpet. Den gamla satelliten faller ner mot jorden. Farkosten hämtar den satellit som inte går att styra. Siffrorna är avsnittens nummer.
        - rubrik: "Fördjupning: Räcker det?"
          rader:
            - - Hittills räcker lösningarna inte. Forskarna är överens om att skräpet skulle fortsätta att öka även om ingen sköt upp en enda satellit till. Det som redan finns där uppe krockar nämligen och går sönder, och då kommer nya bitar fortare än de gamla hinner falla ner.
            - - Blir bitarna tillräckligt många kan det sluta i en **kedjereaktion**. En krock ger bitar som orsakar nya krockar, som ger ännu fler bitar. Faran har ett namn, Kesslersyndromet. I värsta fall kan en bana bli så full av skräp att den inte går att använda.
            - - Lösningarna är ändå inte onödiga. Varje satellit som väjer eller tas ner i tid är en risk mindre. Men så länge det gamla skräpet finns kvar fortsätter bitarna att bli fler. Därför måste det också hämtas, och det arbetet har knappt börjat.
        - rubrik: Ord i texten
          rader:
            - - kedjereaktion
              - en händelse som startar nästa, gång på gång
        - rubrik: Visste du att …
          rader:
            - - 88,8 %
              - av tyngdkraften vid marken finns kvar på rymdstationens höjd, och astronauterna svävar för att de faller runt jorden hela tiden. Hur skulle det kännas att alltid falla?
        - rubrik: Läs mer
          rader:
            - - UR Play har en film på fem minuter om rymdskrot och hur det kan städas bort.
              - https://urplay.se/program/227499-kul-fakta-rymden-rymdskrot
            - - Rymdstyrelsen berättar om satelliter som har krockat, bland dem krocken 2009.
              - https://www.rymdstyrelsen.se/upptack-rymden/bloggen/2018/05/vad-hander-nar-satelliter-krockar
            - - ESA:s rapport från 2025 har talen om skräpet. Sidan är på engelska.
              - https://www.esa.int/Space_Safety/Space_Debris/ESA_Space_Environment_Report_2025
    - rubrik: "Modellen: Medel, text 5, Skräpet runt jorden"
      tema: Rymden
      text:
        - Problem och lösning, blad 2, ifylld för Skräpet runt jorden.
      delar:
        - rubrik: Frågan och svaret
          falt:
            - rubrik: Textens fråga
              text: Runt jorden far tiotusentals trasiga satelliter och bitar. Kan de krocka, och går det att städa bort dem?
            - rubrik: Lyssna efter
              text: ja, krocken 2009 och farten · väja, lämna banan och hämta · räcker inte än
            - rubrik: Så kan svaret låta
              text: Ja. År 2009 krockade två satelliter, och farten gör även små bitar farliga. Satelliter väjer, ESA:s satelliter som är klara ska lämna de trånga banorna inom fem år, och ingenjörer prövar farkoster som ska hämta skräp. Det räcker inte än.
    - rubrik: "Lärarhandledning: Avancerat, Smittor"
      tema: Smittor
      text:
        - Temat Smittor har en faktatext för var och en av de fem strukturerna, som brukar passa i åk 8–9. Varje vecka har klassen en läslektion och en modellektion om veckans text, så temat tar fem veckor. Varje elev har texten, en penna och papper till svaret. Du har tavlan, magneter, A4-ark och en tjock tuschpenna. Läs ett avsnitt till högt.
      delar:
        - rubrik: "1 Kroppens försvar: Tankekartan"
          falt:
            - rubrik: Frågan
              text: "Vem är det som ger dig feber: smittan eller din egen kropp? Och hur försvarar sig kroppen?"
            - rubrik: Ord före
              text: smittämne (det som smittar, inte själva sjukdomen) · inflammation (kroppens svar, inte infektion) · cell (kroppens minsta levande del, inget rum)
            - rubrik: Tänk högt
              kursiv: true
              text: ”Hud, tårar, saliv, slem, flimmerhår, magsyra. Det är mycket på en gång, och det skaver. Jag läser om. Vad har de gemensamt? Alla finns där kroppen möter världen utanför. Vem eller vad? Muren. Det viktigaste? Den hindrar smittämnen från att komma in. Det om att man sväljer slemmet är spännande, men det är en detalj.”
            - rubrik: Det brukar skava
              text: "”Blir larmet stort”: om larmet blir stort, så höjer kroppen själv värmen (avsnitt 2)"
            - rubrik: Modellen
              text: "muren: ”första del” · larmet och ätarna: ”andra del” · specialisterna: ”också” · minnet: ”blir kvar”. I mitten står kroppens försvar. Fördjupningens kärna hör till minnet, för vaccinet bygger minnet i förväg."
            - rubrik: Lyssna efter
              text: din egen kropp · febern hör till larmet · ett försvar i fyra delar
        - rubrik: "2 Sjukdomen som försvann: Tidslinjen"
          falt:
            - rubrik: Frågan
              text: Hur många av människans sjukdomar har vi lyckats utrota helt, och hur gick det till?
            - rubrik: Ord före
              text: utrota (ta bort helt) · vaccin (skyddar, botar inte) · koppor (blåsor, inga koppar)
            - rubrik: Tänk högt om
              text: "mumierna: ”Minst 3 000 år, och sedan mumier. Hur hänger det ihop? Jag läser om. Jo, utslagen på mumierna tyder på att sjukdomen är så gammal. Vem eller vad? Smittkopporna. Det viktigaste? De dödade människor i tusentals år.” (avsnitt 1)"
            - rubrik: Det brukar skava
              text: "”den milda” och ”den farliga”: kokoppor och smittkoppor (avsnitt 2)"
            - rubrik: Modellen
              text: "kopporna härjar: ”i minst 3 000 år” · Jenners försök: 1796 · jakten: 1967 · slutet: ”1977 till 1980”. Skriv tiden mellan stegen: tusentals år, 171 år och 10 år fram till 1977. Fördjupningens kärna om vaccinet i Sverige står mellan Jenners försök och jakten."
            - rubrik: Lyssna efter
              text: en enda, smittkoppor · vaccinet 1796, och från 1967 en ring av vaccinerade runt varje sjuk · världen fri 1980
        - rubrik: "3 Virus och bakterier: Venndiagrammet"
          falt:
            - rubrik: Frågan
              text: Hjälper antibiotika mot en förkylning, och varför?
            - rubrik: Ord före
              text: antibiotika (en medicin utifrån, ingen antikropp) · virus (ingen liten bakterie) · smittämne (det som smittar och gör sjuk, som virus och en del bakterier)
            - rubrik: Det brukar skava
              text: "”det är cellen som gör arbetet”: värdcellen bygger de nya virusen (avsnitt 3)"
            - rubrik: Modellen
              text: "mitten: ”båda” · bakterien: ”av de två” · viruset: ”däremot”. Kärnan från avsnitt 4 delar ni på två ark, ett för bakterien och ett för viruset, med orden ”olika behandling” och ”däremot”. Fördjupningens kärna hör till bakterien."
            - rubrik: Lyssna efter
              text: "nej · förkylning kommer av virus · byggda olika: antibiotika slår bara mot bakterier"
        - rubrik: "4 När medicinen sviker: Kedjan"
          falt:
            - rubrik: Frågan
              text: "Vem är det som blir resistent: människan eller bakterien? Och hur går det till?"
            - rubrik: Ord före
              text: resistent (tål medicinen, inte immun) · antibiotika (inte mot virus) · infektion (inte inflammation)
            - rubrik: Det brukar skava
              text: "urvalet: antibiotikan tar bort de känsliga, och de som redan var tåliga tar över (avsnitt 2)"
            - rubrik: Modellen
              text: "urvalet: ”eftersom några tål mer” · spridningen: ”det gör att” · följderna: ”därför”. Skriv ”av en slump” vid slumpen, det första ledet. Fördjupningens kärna visar slumpen och urvalet igen och står bredvid dem."
            - rubrik: Lyssna efter
              text: bakterien · slump och urval · kroppen vänjer sig inte
        - rubrik: "5 Gåtan på sjukhuset: Problem och lösning"
          falt:
            - rubrik: Frågan
              text: Varför dog fler mödrar hos läkarna än hos barnmorskorna, och vad gjorde man åt det?
            - rubrik: Ord före
              text: förlösa (hjälpa den som föder, inte föda) · klinik (här en avdelning på sjukhuset) · barnmorska (hjälper till vid förlossningar, ingen läkare)
            - rubrik: Det brukar skava
              text: "”Läkare som studenter”: både läkare och studenter (avsnitt 3)"
            - rubrik: Modellen
              text: "febern: ”problemet var” · händerna: ”berodde på” · klorlösningen: ”en lösning” · motståndet: ”resultatet var tydligt, men”. Fördjupningens kärna hör till resultatet och står bredvid kärnan om motståndet."
            - rubrik: Lyssna efter
              text: från obduktionerna · något osynligt på händerna · klorlösningen tog bort det
    - rubrik: "Lärarens sida: Avancerat, text 1, Kroppens försvar"
      text:
        - Kroppens försvar har fyra delar, och febern är ett tecken på att försvaret arbetar. Texten är en beskrivning, och modellen är Tankekartan, blad 2. I vecka 1 tänker du högt i avsnitt 1.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: "Vem är det som ger dig feber: smittan eller din egen kropp? Och hur försvarar sig kroppen?"
            - rubrik: Ord före läsningen
              text: smittämne (det som smittar, inte själva sjukdomen) · inflammation (kroppens svar, inte infektion) · cell (kroppens minsta levande del, inget rum)
            - rubrik: Tänk högt
              kursiv: true
              text: ”Hud, tårar, saliv, slem, flimmerhår, magsyra. Det är mycket på en gång, och det skaver. Jag läser om. Vad har de gemensamt? Alla finns där kroppen möter världen utanför. Vem eller vad? Muren. Det viktigaste? Den hindrar smittämnen från att komma in. Det om att man sväljer slemmet är spännande, men det är en detalj.”
            - rubrik: 1 Muren
              text: |-
                Red ut: ”dess första del”: immunförsvarets · ”i stället”: där ingen tjock hud finns
                Lyssna efter: håller smittämnen ute · hud och slemhinnor
                Lockar: att du sväljer slemmet. ”Vad har huden, tårarna och magsyran gemensamt?”
                Bilden: Vid siffran 1: huden, med smittämnena utanför
            - rubrik: 2 Larmet och ätarna
              text: |-
                Red ut: ”Blir larmet stort” (om larmet blir stort) · ”går på” (angriper)
                Lyssna efter: kroppen larmar med inflammation och feber · ätarceller äter
                Lockar: varet i såret. ”Vem höjer värmen i kroppen?”
                Sambandet: ”ändå igenom muren”: det som muren inte stoppade
                Bilden: Vid siffran 2: blodkärlet med mer blod, och ätarcellerna vid såret
            - rubrik: 3 Specialisterna
              text: |-
                Red ut: ”ett visst” (ett bestämt) · ”hålla emot” (bromsa smittan så länge)
                Lyssna efter: ett bestämt smittämne · antikroppar · dödar smittade celler
                Lockar: nyckeln i låset. ”Vad gör B-cellerna, och vad gör T-cellerna?”
                Sambandet: ”också en tredje del”: utöver ätarna i avsnitt 2
                Bilden: Vid siffran 3 i den stora bilden, och nyckeln i den lilla
            - rubrik: 4 Minnet
              text: |-
                Red ut: ”Kommer samma smittämne” (om det kommer) · ”börja om”: som första gången
                Lyssna efter: minnesceller blir kvar · snabbare nästa gång
                Lockar: förkylningarna. ”Vad händer när samma smittämne kommer en gång till?”
                Sambandet: ”När infektionen är över”: det som finns kvar efteråt
            - rubrik: Om någon frågar
              text: Finns det bakterier som inte gör oss sjuka? Ja, kroppen har ungefär lika många bakterier som egna celler, och det handlar text 3 om. Hjälper antibiotika mot virus? Nej, bara mot bakterier. Har vaccin fått någon sjukdom att försvinna? Ja, smittkoppor. WHO förklarade världen fri från dem 1980, och det handlar nästa text om.
        - rubrik: "Modellpasset: Tankekartan för Kroppens försvar"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: dos: en omgång vaccin · 86 av 100 är 86 procent
                Lyssna efter: vaccin · minne utan sjukdom
                Lockar: 18 smittade, 154 miljoner. ”Vad gör ett vaccin med försvarets minne?”
                Sambandet: ”i förväg”: minnet från avsnitt 4, utan sjukdomen
            - rubrik: Modellen
              text: Ta fram Tankekartan, blad 2. I vecka 1 lägger du den första post-it-lappen och skriver det första ordet. Nederst i varje fält har bladet rader med ledtexten Hit hör. Där skriver paren det som hör till delen, efter ordet i fliken. Ge då Orden två minuter till, och korta Samtala lika mycket. Gruppen lägger fördjupningens lapp på En lapp till, som får namnet Hör till minnet. Vaccinet bygger samma minne som avsnitt 4 beskriver.
            - rubrik: Orden
              text: första del (muren) · andra del (larmet och ätarna) · också (specialisterna) · blir kvar (minnet)
            - rubrik: Svaret
              text: |-
                Lyssna efter: din egen kropp · febern hör till larmet · ett försvar i fyra delar
                Så kan det låta: ”Min egen kropp. När något har tagit sig förbi muren larmar kroppen och höjer värmen. Då arbetar ätarna och specialisterna, och minnet gör att det går fortare nästa gång.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret om febern håller utan mässlingens två timmar."
            - rubrik: Samtala
              text: "Varför börjar författaren med din egen feber? Varför kallar författaren delarna mur, larm och minne? Ett svar: med bilder ur vardagen går det att se ett osynligt arbete framför sig."
    - rubrik: "Avancerat, text 1: Kroppens försvar"
      tema: Smittor
      text:
        - Smittor · text 1 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Kroppens försvar
          rader:
            - - "Du vaknar med ont i halsen, och pannan är het. Något har tagit sig in i dig, så mycket förstår du. Men värmen måste komma någonstans ifrån, och någon har skruvat upp den. Vem är det som ger dig feber: smittan eller din egen kropp? Och hur försvarar sig kroppen?"
        - rubrik: Siffran
          rader:
            - - 154 miljoner
              - liv har räddats av vaccin på 50 år, enligt en beräkning från WHO år 2024.
        - rubrik: "Bild: Försvaret i fyra lager"
          rader:
            - - Försvaret i fyra lager. Bilden visar huden i genomskärning vid ett litet sår. Siffrorna är avsnittens nummer och visar var varje del av försvaret arbetar.
        - rubrik: Muren runt kroppen
          rader:
            - - Kroppens skydd mot smitta kallas immunförsvaret, och dess första del är en mur. Det som syns av muren är huden, ett skyddande lager som hindrar **smittämnen** från att komma in i kroppen.
            - - Men kroppen har öppningar, och där finns ingen tjock hud. I näsa, mun och hals sitter i stället **slemhinnor**, och varje öppning har sitt eget skydd. Tårarna i ögonen och saliven i munnen innehåller ämnen som dödar bakterier. I näsan och luftvägarna fastnar damm och smittämnen i slem. Små flimmerhår flyttar sedan slemmet mot svalget, och där sväljer du det. Nere i magen finns magsyra, som dödar många av de bakterier du får i dig med maten.
            - - Tillsammans stoppar murens delar mycket av det som kan göra dig sjuk. Muren gör ingen skillnad på olika smittämnen, och den arbetar likadant varje dag, också när du är frisk. Därför märker du den knappast förrän den går sönder, som när du skrapar upp ett knä.
        - rubrik: Ord i texten
          rader:
            - - smittämnen
              - bakterier, virus och annat som ger sjukdom
            - - slemhinnor
              - fuktiga ytor inne i näsa, mun och hals
        - rubrik: Larmet och ätarna
          rader:
            - - Ibland tar sig smittämnen ändå igenom muren, till exempel genom ett sår. När de börjar bli fler i kroppen har du fått en infektion. Då går försvarets andra del i gång, och den börjar med ett larm.
            - - Där smittämnena finns släpper kroppens **celler** ut ämnen, och då strömmar mer blod dit. Därför blir det rött, varmt, svullet och ömt, och det kallas inflammation. En infektion är smittan, och en inflammation är kroppens svar. Blir larmet stort påverkar ämnena också den del av hjärnan som styr kroppens temperatur. Då höjer kroppen själv värmen, och du får feber. I värmen har virus och bakterier svårare att bli fler. Febern är alltså ett tecken på att försvaret arbetar.
            - - Med blodet kommer **vita blodkroppar**, och några av dem är stora ätarceller. En ätarcell dödar ett smittämne genom att äta upp det. Ätarna går på många olika smittämnen. Det gulvita varet i ett sår består av döda vita blodkroppar, döda bakterier och död vävnad.
        - rubrik: Ord i texten
          rader:
            - - celler
              - kroppens minsta levande delar
            - - vita blodkroppar
              - celler i blodet som hör till försvaret
        - rubrik: Specialisterna
          rader:
            - - Mot det som ätarna inte klarar har försvaret också en tredje del, specialisterna. De är vita blodkroppar av två slag, B-celler och T-celler, och en specialist går bara på ett bestämt smittämne.
            - - B-cellerna tillverkar antikroppar. Anti betyder mot, och en antikropp är ett litet ämne som kroppen själv gör mot ett visst smittämne. Blanda inte ihop ordet med antibiotika, som är en medicin mot bakterier och kommer utifrån. Antikroppen passar på sitt smittämne som en nyckel i ett lås, och när den har fastnat hittar ätarna lättare rätt. T-cellerna har andra uppgifter. En del av dem dödar de celler i kroppen som redan är smittade.
            - - Specialisterna har en svaghet. Första gången ett smittämne kommer måste de celler som passar dela sig och bli många fler. Det tar tid, och under tiden får larmet och ätarna hålla emot. Därför hinner du bli sjuk, och därför kan febern hålla i sig.
        - rubrik: "Fakta: Fyra ord att hålla isär"
          rader:
            - - infektion
              - smittämnen har tagit sig in och blir fler
            - - inflammation
              - "kroppens svar: rött, varmt, svullet och ömt"
            - - antikropp
              - kroppens eget ämne mot ett bestämt smittämne
            - - antibiotika
              - medicin utifrån, mot bakterier
        - rubrik: "Bild: Antikroppen passar som en nyckel"
          rader:
            - - Antikroppen passar som en nyckel. Den passar på ett bestämt kännetecken hos smittämnet, som nyckeln i sitt lås. På smittämnen utan det kännetecknet fastnar den inte.
        - rubrik: Försvarets minne
          rader:
            - - När infektionen är över har några av specialisterna förvandlats till minnesceller. De blir kvar i kroppen, långt efter att du har blivit frisk. De är försvarets fjärde del, och de kan finnas där i många år, ibland hela livet.
            - - En minnescell är en B-cell eller T-cell som passar just det smittämne kroppen har mött. Kommer samma smittämne en gång till, kanske flera år senare, behöver försvaret inte börja om från början. Minnescellerna känner igen det, och antikropparna kommer fortare än första gången. Då kan smittan vara borta innan du har hunnit bli sjuk, och kanske får du inte ens feber.
            - - Det är därför du oftast får vissa sjukdomar bara en gång i livet. Men minnet gäller ett smittämne i taget. Förkylningar får du om och om igen, eftersom de kommer av många olika virus, och minnet av ett virus hjälper bara mot virus som liknar det mycket.
        - rubrik: "Fördjupning: Att träna minnet"
          rader:
            - - Försvarets minne har en nackdel, för det kommer först efter sjukdomen. Men minnet går också att bygga upp i förväg, och det gör ett vaccin. Vaccinet innehåller något som liknar smittämnet men inte ger sjukdomen, till exempel ett försvagat virus eller bara bitar av det. B-cellerna och T-cellerna svarar som om smittan vore verklig, och kroppen bildar minnesceller. Ett vaccin botar därför ingen som redan är sjuk. Det förbereder den som är frisk. Armen kan ömma och du kan få lite feber efteråt, men det brukar gå över på några dagar.
            - - Mässling visar vad ett vaccin betyder. En enda person med mässling kan smitta upp till 18 andra, men mot mässling finns ett vaccin. År 2024 räknade Världshälsoorganisationen, WHO, ut att vaccin hade räddat ungefär 154 miljoner liv på 50 år. Det är sex liv i minuten. Mässlingsvaccinet ensamt stod för 60 procent av dem.
            - - Men inte alla barn får vaccinet. År 2019 fick 86 av 100 barn i världen en första dos mot mässling, och år 2025 var det 84 av 100. Skillnaden ser liten ut, men när färre är vaccinerade når viruset fler som saknar skydd. År 2024 dog ungefär 95 000 människor i mässling, och de flesta var barn under fem år.
        - rubrik: Visste du att …
          rader:
            - - 2 timmar
              - kan mässlingsviruset finnas kvar i luften, som längst. Vad betyder det för den som kommer in i rummet efteråt?
        - rubrik: Läs mer
          rader:
            - - 1177 förklarar hur immunförsvaret fungerar.
              - https://www.1177.se/liv--halsa/sa-fungerar-kroppen/immunforsvaret/
            - - 1177 förklarar vad ett vaccin innehåller och hur det skyddar.
              - https://www.1177.se/undersokning-behandling/vaccinationer/sa-fungerar-vaccin/
            - - "1177 berättar om mässling: hur den smittar, hur den känns och hur vaccinet skyddar."
              - https://www.1177.se/sjukdomar--besvar/hud-har-och-naglar/infektioner-pa-huden/massling/
    - rubrik: "Modellen: Avancerat, text 1, Kroppens försvar"
      tema: Smittor
      text:
        - Tankekartan, blad 2, ifylld för Kroppens försvar.
      delar:
        - rubrik: Frågan och svaret
          falt:
            - rubrik: Textens fråga
              text: "Vem är det som ger dig feber: smittan eller din egen kropp? Och hur försvarar sig kroppen?"
            - rubrik: Lyssna efter
