            - rubrik: Så kan svaret låta
              text: Det tog tolv år, från 1957 till 1969. Sedan år 2000 bor människor på rymdstationen hela tiden. År 2026 flög fyra astronauter runt månen igen, men de landade inte.
    - rubrik: "Lärarens sida: Medel, text 3, Jorden och Mars"
      text:
        - Jorden och Mars liknar varandra i dygn och årstider men skiljer sig i luft, värme och vatten, det som en människa behöver för att leva. Texten jämför två saker, och modellen är Venndiagrammet, blad 2. I vecka 3 har två elever i taget jobbkorten från avsnitt 2.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Skulle en människa kunna bo på Mars, och vad skiljer Mars från jorden?
            - rubrik: Ord före läsningen
              text: atmosfär (luften runt planeten, ingen stämning) · flytande (som rinner, inte som flyter) · dygn (ett varv, dag och natt)
            - rubrik: 1 Två grannar
              text: |-
                Red ut: räknat från solen: ordningen utåt · drygt hälften: lite mer än hälften
                Lyssna efter: grannar · båda stenplaneter · Mars hälften så bred
                Lockar: ljusets 13 minuter. ”Vad är lika, och hur olika stora är de?”
                Bilden: De två kloten i samma skala
            - rubrik: 2 Dygn och år
              text: |-
                Red ut: jorddygn: Mars år mätt i våra dygn · lutar: står snett, förklaras i nästa text
                Lyssna efter: dygnet nästan lika · året nästan dubbelt · båda har årstider
                Lockar: tolv år blir sex. ”Vad är nästan lika, och vad är mycket längre?”
                Sambandet: ”Båda planeterna”: samma två planeter, nu deras tid
                Bilden: Jorden går i den inre banan och Mars i den yttre
            - rubrik: 3 Luft och väder
              text: |-
                Red ut: atmosfär: lagret av gas, luften · täcke: liknelsen för luft som håller kvar värmen
                Lyssna efter: tät luft med syre · tunn luft på Mars · mycket kallt
                Lockar: minus 153 grader. ”Varför blir det så kallt på Mars?”
                Sambandet: ”Runt båda planeterna”: från tiden till luften omkring dem
                Bilden: Termometrarna: från 20 grader ner till minus 153
            - rubrik: 4 Mark och vatten
              text: |-
                Red ut: röd: marken har rostat, den är inte varm · spår av floder: märken efter vatten
                Lyssna efter: vatten på jordens yta · Mars torr · is under ytan
                Lockar: rosten, den röda färgen. ”Var finns vattnet på jorden, och var på Mars?”
                Sambandet: ”också olika”: en skillnad till, efter luften
                Bilden: Jorden är blå av vatten, Mars röd av rost
            - rubrik: Om någon frågar
              text: Hur hög är Olympus Mons? Omkring 22 kilometer över marken, enligt Rymdstyrelsen. Har någon människa varit på Mars? Nej, bara maskiner som rovern Perseverance. Varför är året längre på Mars? Mars har längre väg runt solen och rör sig långsammare. Finns det liv på Mars? Forskarna tror inte det. De letar efter spår av liv från förr.
        - rubrik: "Modellpasset: Venndiagrammet för Jorden och Mars"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: rover, i marginalen · instrument: en apparat, inget att spela på
                Lyssna efter: MOXIE · syre av marsluft · bara lite
                Lockar: hunden och tio timmar. ”Vad visade MOXIE, och varför räcker det inte?”
                Sambandet: ”luften där går inte att andas”: tillbaka till avsnitt 3
            - rubrik: Modellen
              text: "Lägg först fram gruppens tankekarta från vecka 1 och fråga: ”Vad ska stå i mitten?” Texten jämför två saker, och kartan visar inte vad som är lika och olika. Ta sedan fram Venndiagrammet, blad 2. Exemplet om skolan har ringar, men det här bladet har inga: varje avsnitt är en punkt, med en ruta för post-it-lappen och en för textens ord. På raderna A och B skriver en grupp som bara är ett par. Gruppen lägger fördjupningens lapp på En lapp till och kallar platsen Hör till luft och väder."
            - rubrik: Orden
              text: lika stora är de däremot inte (storlek och plats) · året är däremot mycket längre (dygn och år) · är däremot mycket tunn (luft och väder) · medan det på Mars ligger fruset (mark och vatten)
            - rubrik: Svaret
              text: |-
                Lyssna efter: inte utan hjälp · luften och kylan · vattnet är fruset
                Så kan det låta: ”Inte utan hjälp. Dygnet är nästan lika långt, men luften går inte att andas, det är mycket kallt och vattnet är fruset. Syre och vatten måste man ordna själv.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för vulkanen ändrar inte svaret."
            - rubrik: Samtala
              text: "Varför tar författaren jorden först i varje avsnitt? Varför slutar texten med en maskin? Ett svar: det kända gör Mars lättare att se, och MOXIE visar att svaret kan ändras."
    - rubrik: "Medel, text 3: Jorden och Mars"
      tema: Rymden
      text:
        - Rymden · text 3 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Jorden och Mars
          rader:
            - - Tänk dig att du vaknar en morgon på Mars. Solen går upp, och dygnet blir nästan lika långt som hemma. Ändå kan du inte bara öppna dörren och gå ut. Skulle en människa kunna bo på Mars, och vad skiljer Mars från jorden?
        - rubrik: Siffran
          rader:
            - - 24,6 timmar
              - är ett dygn på Mars, nästan som på jorden.
        - rubrik: "Bild: Jorden och Mars i samma skala"
          rader:
            - - Jorden och Mars i samma skala. Bara storleken stämmer. I verkligheten är avståndet mellan dem mycket större.
        - rubrik: Två grannar
          rader:
            - - Jorden och Mars är grannar i rymden, och på flera sätt liknar de varandra. Båda är stenplaneter, med fast mark att stå på, och båda går runt solen. Jorden är den tredje planeten räknat från solen, medan Mars är den fjärde och går längre ut.
            - - Lika stora är de däremot inte. Jorden är ungefär 12 700 kilometer bred, medan Mars är ungefär 6 800 kilometer bred. Mars är alltså bara drygt hälften så bred som jorden. Om du ställer två Mars bredvid varandra, blir de tillsammans lite bredare än jorden.
            - - Jorden ligger närmare solen, så dit hinner solens ljus fram först. Till Mars behöver ljuset 13 minuter.
        - rubrik: Dygn och år
          rader:
            - - Båda planeterna snurrar runt sig själva, och ett varv är ett dygn. På jorden tar det 24 timmar, och på Mars tar det 24,6 timmar. Det är bara drygt en halvtimme mer, så dygnen är nästan lika långa.
            - - Året är däremot mycket längre på Mars. Ett år är ett varv runt solen. Jorden behöver 365 dygn för sitt varv, medan Mars behöver 687 **jorddygn**, nästan dubbelt så lång tid. Den som har fyllt tolv år på jorden skulle bara ha fyllt sex på Mars.
            - - Båda planeterna har årstider, eftersom båda lutar ungefär lika mycket på sin väg runt solen. Eftersom året är längre varar varje årstid också längre på Mars.
        - rubrik: Ord i texten
          rader:
            - - jorddygn
              - ett dygn på jorden, 24 timmar
        - rubrik: "Bild: Ett varv runt solen"
          rader:
            - - Ett varv runt solen. Jorden hinner nästan två varv runt solen medan Mars går ett. Solen och planeterna är ritade för stora jämfört med banorna.
        - rubrik: Luft och väder
          rader:
            - - Runt båda planeterna finns ett lager av gas som kallas **atmosfär**. Jordens atmosfär är luften som vi andas varje dag. Den är tät och innehåller **syre**, och den håller kvar solens värme som ett täcke.
            - - Mars atmosfär är däremot mycket tunn, mycket tunnare än jordens. Den består mest av koldioxid, en gas som människor inte kan andas. Ett så tunt täcke håller inte kvar värmen, och därför blir det mycket kallt på Mars.
            - - Temperaturen på Mars växlar mycket. Som varmast blir det 20 grader, ungefär som en svensk sommardag. Som kallast blir det ungefär minus 153 grader. Så kallt blir det ingenstans på jorden, där köldrekordet är minus 89 grader, mätt i Antarktis år 1983.
        - rubrik: Ord i texten
          rader:
            - - atmosfär
              - lagret av gas runt en planet
            - - syre
              - den gas i luften som vi behöver andas
        - rubrik: "Bild: Från 20 till minus 153 grader"
          rader:
            - - Från 20 till minus 153 grader. Termometrarna visar temperaturen på Mars, från den varmaste till den kallaste. Vid det övre strecket fryser vatten till is. Det nedre är jordens köldrekord.
        - rubrik: Mark och vatten
          rader:
            - - Marken ser också olika ut på de två planeterna. På jorden täcker vatten 71 procent av ytan, i hav, sjöar och floder. På Mars kan **flytande** vatten däremot inte ligga kvar på ytan, och marken är torr och röd.
            - - Den röda färgen har ingenting med värme att göra. Den kommer av att järnet i marken har rostat. Mars är alltså en rostig planet, och en mycket kall sådan.
            - - Vatten finns ändå på Mars också. På ytan syns **spår** av floder som en gång har runnit där, och under ytan ligger vatten som har frusit till is. På jorden är det mesta av vattnet flytande, medan det på Mars ligger fruset i marken.
        - rubrik: Ord i texten
          rader:
            - - flytande
              - som rinner, varken is eller ånga
            - - spår
              - märken som något har lämnat efter sig
        - rubrik: "Fakta: Jorden och Mars i tal"
          rader:
            - - Bredd
              - jorden ungefär 12 700 kilometer, Mars ungefär 6 800
            - - Ett dygn
              - jorden 24 timmar, Mars 24,6 timmar
            - - Ett år
              - jorden 365 dygn, Mars 687 jorddygn
            - - Lutning
              - jorden 23,4 grader, Mars 25 grader
            - - Varmast och kallast på Mars
              - 20 grader och ungefär minus 153 grader
        - rubrik: "Fördjupning: Maskinen som gjorde luft"
          rader:
            - - Den som ska bo på Mars behöver syre, och luften där går inte att andas. Därför har forskare prövat om syret går att göra på plats.
            - - Till Mars skickades en **rover** som heter Perseverance, och ombord fanns ett instrument med namnet MOXIE. Det tog in den tunna marsluften och gjorde syre av koldioxiden i den. MOXIE var i gång 16 gånger och gjorde sammanlagt 122 gram syre, och som mest blev det 12 gram i timmen.
            - - Mycket syre är det inte, för alltihop skulle bara räcka åt en liten hund i tio timmar. Men när försöket var klart år 2023 hade MOXIE visat att det går att göra syre att andas på en annan planet. En människa behöver mycket mer, och därför krävs större maskiner innan någon kan flytta dit.
        - rubrik: Ord i texten
          rader:
            - - rover
              - förarlöst fordon som kör på en annan planet
        - rubrik: Visste du att …
          rader:
            - - Olympus Mons
              - heter solsystemets största vulkan, och den ligger på Mars. Vad skulle du vilja se först på en annan planet?
        - rubrik: Läs mer
          rader:
            - - Rymdstyrelsen har en egen sida om Mars.
              - https://www.rymdstyrelsen.se/upptack-rymden/solsystemet/planeterna/mars/
            - - Rymdstyrelsen visar hela solsystemet, planet för planet.
              - https://www.rymdstyrelsen.se/upptack-rymden/solsystemet/
            - - UR Play har en kort film om hur det vore att resa till Mars.
              - https://urplay.se/program/227505-kul-fakta-rymden-resan-till-mars
