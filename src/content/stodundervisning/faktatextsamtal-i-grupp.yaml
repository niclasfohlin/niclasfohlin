# Samlad av samla.mjs ur delar/, texter/, modeller/, material/ och pabordet/. Ändra där, inte här.
titel: Faktatextsamtal i grupp
undertitel: Ett avsnitt i taget och en modell för hela texten, för åk 4–9
ingress: En liten grupp i åk 4–9 läser en faktatext i veckan, ett avsnitt i taget. Eleverna reder ut det som skaver i texten, säger kärnan i varje avsnitt med högst tio ord och lägger kärnorna i en modell som visar hur texten är byggd. Metoden har faktatexter i teman på tre nivåer och fem modeller med blad.
omrade: Läsning
arskurs:
  - 4-6
  - 7-9
taggar:
  - lasforstaelse
  - textsamtal
  - ordforrad
  - textstruktur
  - lektionsupplagg
format:
  - liten grupp
  - par
  - helklass
tid: 40 minuter per pass, två pass i veckan
period: Åtta veckor
grupp: Två till åtta elever
material:
  - faktatexter i teman
  - fem modeller med blad
  - post-it-lappar
  - pennor
uppdaterad: 2026-10-26
relaterade:
  - boksamtal-i-grupp
  - problemlosning-i-grupp
  - textsamtal-i-grupp
utkast: false
radetiketter:
  - Red ut
