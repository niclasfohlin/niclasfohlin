    - rubrik: "Lärarens sida: Medel, text 4, Därför blir det sommar"
      text:
        - "Sommaren kommer av att jorden lutar: i juni är norra halvklotet vänt mot solen, solen står högre och lyser längre, och avståndet till solen är inte orsaken. Texten förklarar orsak och verkan, och modellen är Kedjan, blad 2. I vecka 4 har två elever i taget jobbkorten från avsnitt 2."
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: När är jorden närmast solen, i januari eller i juli, och vad beror sommaren på?
            - rubrik: Ord före läsningen
              text: omloppsbana (vägen runt solen, ingen räls) · jordaxel (en tänkt linje, ingen stång) · halvklot (halva jordklotet, norra eller södra)
            - rubrik: 1 Närmast i januari
              text: |-
                Red ut: lägerelden är solen · ”Men i januari”: vinter fast solen är närmast
                Lyssna efter: närmast i januari · liten skillnad · avståndet inte orsaken
                Lockar: talen i miljoner. ”Vad säger texten om avståndet och sommaren?”
                Bilden: Vid siffran 1, strax efter decemberläget, är jorden närmast solen
            - rubrik: 2 Jorden lutar
              text: |-
                Red ut: lutar (snett mot banan) · ”inte vickar” (axeln byter aldrig håll)
                Lyssna efter: jorden lutar · samma håll hela varvet
                Lockar: krocken med Theia. ”Åt vilket håll pekar axeln, enligt texten?”
                Sambandet: ”beror i stället på”, den riktiga orsaken efter den som inte höll
                Bilden: Axeln pekar åt samma håll i alla fyra lägena
            - rubrik: 3 Mot solen i juni
              text: |-
                Red ut: ”turas om” (ett halvklot i taget) · ”det” i december (norra halvklotet)
                Lyssna efter: norra halvklotet mot solen · solen högre · dagen längre
                Lockar: julen på sommaren. ”Vilka två saker händer när vi lutar mot solen?”
                Sambandet: ”Eftersom axeln pekar åt samma håll”, därför turas halvkloten om
                Bilden: I juni lutar norra halvklotet mot solen, i december bort från den
            - rubrik: 4 Mer ljus, mer värme
              text: |-
                Red ut: yta: en bit mark · ”samma ljus”: lampan lyser lika starkt
                Lyssna efter: ljuset träffar rakare · fler timmar · varmare
                Lockar: ficklampan på golvet. ”Vad får marken mer av när solen står högt?”
                Sambandet: ”gör att”: hög sol och lång dag ger marken värme
                Bilden: Rakt och snett. Samma ljus på en liten yta och en större
            - rubrik: Om någon frågar
              text: Är det kallast på årets kortaste dag? Nej, ofta flera veckor senare. När börjar sommaren enligt SMHI? När dygnets medeltemperatur är 10,0 grader eller högre fem dygn i rad. Har andra planeter årstider? Ja, Mars lutar 25 grader och har årstider. Hur mycket lutar Uranus? 97,77 grader, så den ligger på sidan.
        - rubrik: "Modellpasset: Kedjan för Därför blir det sommar"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: ”Vid midsommar”: i slutet av juni · följden: det lutningen leder till
                Lyssna efter: norr om polcirkeln · midnattssol och polarnatt · samma lutning
                Lockar: halvåret vid Nordpolen. ”Vad beror midnattssolen och polarnatten på?”
                Sambandet: ”Längst i norr märks lutningen”: samma orsak, större följd
                Bilden: Juniläget: området kring Nordpolen ligger i ljus hela dygnet
            - rubrik: Modellen
              text: "Lägg först fram gruppens tidslinje från vecka 2 och fråga: ”Flikarna säger när. Var skriver vi varför?” Den visar när, men inte varför. Ta sedan fram Kedjan, blad 2. Exemplet om skolan är en trappa, men det här bladet är det inte: orsaken står överst, med tre följder bredvid varandra. Post-it-lappen från avsnitt 1 hör hemma på En lapp till, som får namnet Avståndet. Mer värme följer av Mot solen: säg det när gruppen lägger lappen från avsnitt 4. Fördjupningens lapp hör hemma på Följd 3."
            - rubrik: Orden
              text: |-
                eftersom (mot solen) · gör att (mer värme) · beror alltså på (längst i norr)
                Utan flik: gruppen skriver ”kan alltså inte vara orsaken” vid En lapp till, och ”beror i stället på att” vid orsaken.
            - rubrik: Svaret
              text: |-
                Lyssna efter: i januari · jorden lutar · högre sol och längre dag
                Så kan det låta: ”I januari. Avståndet är alltså inte orsaken till sommaren. Jorden lutar, och i juni lutar norra halvklotet mot solen. Då står solen högre och lyser längre, så det blir varmare.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret håller utan Uranus."
            - rubrik: Samtala
              text: "Varför börjar författaren med en förklaring som är fel? Varför en ficklampa? Ett svar: många tror att avståndet är orsaken, så författaren prövar det först, och ficklampan kan läsaren pröva själv."
    - rubrik: "Medel, text 4: Därför blir det sommar"
      tema: Rymden
      text:
        - Rymden · text 4 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Därför blir det sommar
          rader:
            - - En varm dag i juli känns solen nära. Många tror att det blir sommar för att jorden är närmare solen då. Det låter klokt. När är jorden närmast solen, i januari eller i juli, och vad beror sommaren på?
        - rubrik: Siffran
          rader:
            - - 23,4 grader
              - lutar jordens axel.
        - rubrik: Närmast i januari
          rader:
            - - Jorden går ett varv runt solen varje år, och vägen den följer kallas omloppsbana. Banan är nästan rund, men inte helt. Därför är jorden ibland lite närmare solen och ibland lite längre bort.
            - - Närmast solen är jorden i januari. Då är avståndet omkring 147 miljoner kilometer. Längst bort är den i juli, omkring 152 miljoner kilometer från solen. Men i januari är det vinter i Sverige, och i juli är det sommar.
            - - Skillnaden är dessutom liten. Tänk dig att du står trettio steg från en lägereld och tar ett enda steg närmare. Så lite närmare solen är jorden i januari. Avståndet kan alltså inte vara orsaken till sommaren.
        - rubrik: "Fakta: Avståndet till solen"
          rader:
            - - I januari
              - omkring 147 miljoner kilometer
            - - I juli
              - omkring 152 miljoner kilometer
            - - Skillnaden
              - omkring 5 miljoner kilometer
        - rubrik: Jorden lutar
          rader:
            - - Sommaren beror i stället på att jorden lutar. Titta på en jordglob, så ser du att den sitter snett i sitt ställ. Så är den byggd eftersom jorden lutar på riktigt.
            - - Jorden snurrar runt sin **jordaxel**, en tänkt linje rakt genom klotet från Nordpolen till Sydpolen. Axeln lutar 23,4 grader. Det viktiga är att den pekar åt samma håll hela varvet runt solen och inte vickar fram och tillbaka. Bär en jordglob ett varv runt en lampa utan att vrida den. Då lutar globen hela tiden mot samma vägg i rummet.
            - - Lutningen kom troligen till när jorden var ung och något stort krockade med den. Det som krockade har fått namnet Theia, och de flesta forskare tror att månen bildades av resterna.
        - rubrik: Ord i texten
          rader:
            - - jordaxel
              - den tänkta linje som jorden snurrar runt
        - rubrik: "Bild: Jorden runt solen"
          rader:
            - - Jorden runt solen. Under året syns jorden i fyra lägen. Axeln pekar åt samma håll hela varvet. Bilden visar inte rätt storlekar och avstånd. Siffrorna är avsnittens nummer.
        - rubrik: Mot solen i juni
          rader:
            - - Eftersom axeln pekar åt samma håll turas jordens två **halvklot** om att vara vända mot solen. I juni lutar det norra halvklotet, där Sverige ligger, mot solen. Ett halvt varv senare, i december, lutar det i stället bort från solen.
            - - När vårt halvklot lutar mot solen händer två saker. Solen står högre på himlen mitt på dagen, och dagen blir längre. Det märker du i juni, när det är ljust långt in på kvällen.
            - - På södra halvklotet är det tvärtom. Där är juni en vintermånad, och julen kommer på sommaren. Det visar en gång till att avståndet inte kan vara orsaken, för båda halvkloten är lika nära solen samtidigt.
        - rubrik: Ord i texten
          rader:
            - - halvklot
              - halva jordklotet, den norra eller den södra
        - rubrik: Mer ljus, mer värme
          rader:
            - - Den höga solen och den långa dagen gör att marken får mer ljus och mer värme. Det går att pröva med en ficklampa. Lys rakt ner mot golvet, så får du en liten och stark ljusfläck. Luta sedan lampan, så blir fläcken större och svagare, eftersom samma ljus ska räcka till en större yta.
            - - Solljuset fungerar på samma sätt. På sommaren står solen högt, och ljuset träffar marken rakare, så att varje bit mark får mer ljus. På vintern står solen lågt, och samma ljus sprids ut över en större yta.
            - - Dessutom lyser sommarsolen under fler timmar varje dag. Marken får alltså både starkare ljus och ljus under längre tid. Därför blir det varmare, och därför blir det sommar.
        - rubrik: "Bild: Rakt och snett"
          rader:
            - - Rakt och snett. Samma ljus träffar marken på två sätt. Den sneda strålen sprids ut över en större yta, och varje bit mark får mindre ljus.
        - rubrik: "Fördjupning: Vid polcirkeln"
          rader:
            - - Längst i norr märks lutningen allra mest. Där ligger **polcirkeln**, som korsar norra Sverige. Vid midsommar lutar jorden så mycket mot solen att solen inte går ner norr om polcirkeln. Vid midnatt sjunker den mot **horisonten**, och sedan stiger den igen. Det kallas midnattssol, och då är det ljust nog att läsa utomhus mitt i natten.
            - - I slutet av december är det tvärtom. Då lutar norra halvklotet bort från solen, och norr om polcirkeln går solen inte upp. Det kallas polarnatt.
            - - Ju längre norrut du kommer, desto längre varar ljuset på sommaren och mörkret på vintern. Vid Nordpolen är solen uppe i ungefär ett halvår och sedan borta nästan lika länge. Midnattssol och polarnatt beror alltså på samma lutning som ger oss sommar och vinter. Längst i norr blir följden bara större.
        - rubrik: Ord i texten
          rader:
            - - polcirkeln
              - en tänkt linje runt jorden, långt i norr
            - - horisonten
              - linjen där himlen och marken möts
        - rubrik: Visste du att …
          rader:
            - - 21 år
              - varar vintern vid en av polerna på Uranus, som lutar så mycket att den ligger på sidan. Hur gammal skulle du vara när våren kom?
        - rubrik: Läs mer
          rader:
            - - SMHI berättar hur årstiderna räknas i Sverige, med temperaturen som mått.
              - https://www.smhi.se/kunskapsbanken/meteorologi/arstider
            - - SMHI skriver om avståndet mellan jorden och solen under året.
              - https://www.smhi.se/kunskapsbanken/meteorologi/solens-upp--och-nedgang/avstandet-mellan-jorden-och-solen
            - - UR Play har en film på en kvart om hur jordaxelns lutning ger årstiderna.
              - https://urplay.se/program/234841-no-naturligtvis-astronomi
    - rubrik: "Modellen: Medel, text 4, Därför blir det sommar"
      tema: Rymden
      text:
