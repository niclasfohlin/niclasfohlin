    - rubrik: "Modellen: Bas, text 5, En kran åt alla"
      tema: Vatten
      text:
        - Problem och lösning, blad 1, ifylld för En kran åt alla.
      delar:
        - rubrik: Frågan och svaret
          falt:
            - rubrik: Textens fråga
              text: Varför har inte alla rent vatten hemma, och vad kan man göra åt det?
            - rubrik: Lyssna efter
              text: smutsigt eller långt borta · brunnar, rör, rening och toaletter · fler får vatten, inte alla än
            - rubrik: Så kan svaret låta
              text: En av fyra har inte rent vatten hemma. Vatten finns det ofta, men det är smutsigt eller långt borta. Brunnar, rör, rening och toaletter hjälper, och fler får vatten för varje år.
    - rubrik: "Lärarhandledning: Medel, Rymden"
      tema: Rymden
      text:
        - Temat Rymden har en faktatext för var och en av de fem strukturerna, som brukar passa i åk 6–7. Varje vecka har klassen en läslektion och en modellektion om veckans text, så temat tar fem veckor. Varje elev har texten, en penna och papper till svaret. Du har tavlan, magneter, A4-ark och en tjock tuschpenna.
      delar:
        - rubrik: "1 Solens familj: Tankekartan"
          falt:
            - rubrik: Frågan
              text: Vilka hör till solens familj, och vilka är flest?
            - rubrik: Ord före
              text: omloppsbana (en väg, ingen räls) · dygn (varv runt sig själv) · år (varv runt solen)
            - rubrik: Tänk högt
              kursiv: true
              text: ”Solen håller kvar allt, och ändå går allt runt. Det skaver. Jag läser om. Den drar i planeterna, så de far inte iväg, de går i bana. Vem eller vad? Solen. Det viktigaste? En stjärna i mitten, och allt går runt den. Det om året är spännande, men det är en detalj.”
            - rubrik: Det brukar skava
              text: "jorddygn: Venus dygn och år räknas i våra dygn, och där är dygnet längre än året (avsnitt 2)"
            - rubrik: Modellen
              text: "solen: ”mitt i familjen” · stenplaneterna: ”närmast solen” · jättarna: ”längre ut” · småfolket: ”flest i familjen”. I mitten står solens familj, och solen är ett av fälten. Fördjupningens kärna, om Pluto, hör till småfolket."
            - rubrik: Lyssna efter
              text: solen i mitten · stenplaneterna och jättarna · småfolket är flest
        - rubrik: "2 Vägen ut i rymden: Tidslinjen"
          falt:
            - rubrik: Frågan
              text: Hur många år tog det från den första satelliten till människan på månen, och vad har hänt sedan dess?
            - rubrik: Ord före
              text: kapplöpning (en tävling, ingen springer) · Sovjetunionen (ett land som fanns då)
            - rubrik: Tänk högt om
              text: "satellit: ”Är inte en satellit en maskin? Jag läser vidare. En satellit går runt en planet, så månen är också en. Vem eller vad? Sputnik 1. Det viktigaste? Den första som människor byggt.” (avsnitt 1)"
            - rubrik: Det brukar skava
              text: "”den pipande bollen”: Sputnik 1, bollen som pep i första avsnittet (avsnitt 3)"
            - rubrik: Modellen
              text: "första satelliten: 1957 · första människan: 1961 · månen: 1969 · rymdstationen: 2000 · runt månen: 2026. Skriv tiden mellan stegen: 4, 8 och 31 år. Fördjupningens kärna, resan runt månen, blir steg 5."
            - rubrik: Lyssna efter
              text: tolv år, 1957 till 1969 · bor i rymden sedan 2000 · 2026 runt månen, ingen landning
        - rubrik: "3 Jorden och Mars: Venndiagrammet"
          falt:
            - rubrik: Frågan
              text: Skulle en människa kunna bo på Mars, och vad skiljer Mars från jorden?
            - rubrik: Ord före
              text: atmosfär (luften runt planeten, ingen stämning) · flytande (som rinner, inte som flyter) · dygn (ett varv, dag och natt)
            - rubrik: Det brukar skava
              text: "täcke: texten liknar luften vid ett täcke som håller kvar värmen (avsnitt 3)"
            - rubrik: Modellen
              text: "storlek och plats: ”lika stora är de däremot inte” · dygn och år: ”året är däremot mycket längre” · luft och väder: ”är däremot mycket tunn” · mark och vatten: ”medan det på Mars ligger fruset”. Här ritar du en ruta för varje avsnitt i stället för ringar, och klassen jämför jorden och Mars punkt för punkt. Fördjupningens kärna hör till luft och väder."
            - rubrik: Lyssna efter
              text: inte utan hjälp · luften och kylan · vattnet är fruset
        - rubrik: "4 Därför blir det sommar: Kedjan"
          falt:
            - rubrik: Frågan
              text: När är jorden närmast solen, i januari eller i juli, och vad beror sommaren på?
            - rubrik: Ord före
              text: omloppsbana (vägen runt solen, ingen räls) · jordaxel (en tänkt linje, ingen stång) · halvklot (halva jordklotet, norra eller södra)
            - rubrik: Det brukar skava
              text: "”inte vickar”: axeln byter aldrig håll (avsnitt 2)"
            - rubrik: Modellen
              text: "mot solen: ”eftersom” · mer värme: ”gör att” · längst i norr: ”beror alltså på”. Överst står orsaken, att jorden lutar, med ”beror i stället på att”, och under den de tre följderna. När du flyttar arket från avsnitt 4, säger du att mer värme följer av att vi lutar mot solen. Avståndet står utanför kedjan, med ”kan alltså inte vara orsaken”. Fördjupningens kärna blir den tredje följden."
            - rubrik: Lyssna efter
              text: i januari · jorden lutar · högre sol och längre dag
        - rubrik: "5 Skräpet runt jorden: Problem och lösning"
          falt:
            - rubrik: Frågan
              text: Runt jorden far tiotusentals trasiga satelliter och bitar. Kan de krocka, och går det att städa bort dem?
            - rubrik: Ord före
              text: satellit (här en maskin, ingen måne) · bana (vägen runt jorden, ingen räls) · rymdskrot (trasiga saker i bana, inte sopor)
            - rubrik: Det brukar skava
              text: "11,7 kilometer i sekunden: i den farten kommer man så långt på en enda sekund (avsnitt 2)"
            - rubrik: Modellen
              text: "trånga banor: ”problemet är att” · farten: ”beror på” · väja och städa: ”en lösning är att” · hämta: ”en annan lösning är att”. Fördjupningens kärna blir resultatet, med ”hittills räcker lösningarna inte”. Lösningarna används, men skräpet ökar ändå."
            - rubrik: Lyssna efter
              text: ja, krocken 2009 och farten · väja, lämna banan och hämta · räcker inte än
    - rubrik: "Lärarens sida: Medel, text 1, Solens familj"
      text:
        - "Solens familj är solen i mitten, fyra stenplaneter, fyra jättar och småfolket, som är flest: månar, dvärgplaneter, asteroider och kometer. Texten är en beskrivning, och modellen är Tankekartan, blad 2. I vecka 1 tänker du högt i avsnitt 1."
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Vilka hör till solens familj, och vilka är flest?
            - rubrik: Ord före läsningen
              text: omloppsbana (en väg, ingen räls) · dygn (varv runt sig själv) · år (varv runt solen)
            - rubrik: Tänk högt
              kursiv: true
              text: ”Solen håller kvar allt, och ändå går allt runt. Det skaver. Jag läser om. Den drar i planeterna, så de far inte iväg, de går i bana. Vem eller vad? Solen. Det viktigaste? En stjärna i mitten, och allt går runt den. Det om året är spännande, men det är en detalj.”
            - rubrik: 1 En stjärna i mitten
              text: |-
                Red ut: ”håller det kvar”: i banan, inte stilla · omloppsbana, i marginalen
                Lyssna efter: solen är en stjärna · i mitten · allt går runt den
                Lockar: året, 365 dygn. ”Vad gör solen med allt som finns omkring den?”
                Bilden: Solens kant längst till vänster, vid siffran 1
            - rubrik: 2 De fyra stenplaneterna
              text: |-
                Red ut: ”fast yta”: mark att stå på · jorddygn: Venus tid mätt i våra dygn
                Lyssna efter: fyra små planeter · närmast solen · fast yta
                Lockar: dygnet längre än året. ”Vad har de fyra planeterna gemensamt?”
                Sambandet: ”Närmast solen”: var de fyra går, räknat från solen
                Bilden: De fyra närmast solen, och Venus i Ett dygn och ett år
            - rubrik: 3 Jättarna
              text: |-
                Red ut: ”klot av gas”: ingen mark
                Lyssna efter: fyra jättar · gas och is · ringar och månar
                Lockar: Saturnus i badkaret. ”Vad är jättarna gjorda av?”
                Sambandet: ”Längre ut”: bortom stenplaneterna, räknat från solen
                Bilden: De fyra jättarna i Hela familjen. Vindruvan och basketbollen visar storleken
            - rubrik: 4 Småfolket
              text: |-
                Red ut: ”desto fler”: mycket fler än en · småfolket: alla fyra slagen tillsammans
                Lyssna efter: flest · månar och dvärgplaneter · asteroider och kometer
                Lockar: 274 månar runt Saturnus. ”Vilka fyra slag hör till de små?”
                Sambandet: ”Flest i familjen”: resten av familjen, fler än planeterna
                Bilden: De små runt och mellan planeterna i Hela familjen
            - rubrik: Om någon frågar
              text: Varför är Mars röd? Järnet i marken har rostat. Hur varmt är det på Venus? Ungefär 467 grader. Är isen i Uranus och Neptunus frusen? Nej, den är en het och tät vätska av vatten, metan och ammoniak, enligt NASA. Vad är Stora röda fläcken? En storm på Jupiter, dubbelt så bred som jorden.
        - rubrik: "Modellpasset: Tankekartan för Solens familj"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: ”rensat sin bana”: bestämmer där själv · himlakropp: allt som går runt solen
                Lyssna efter: Pluto · dvärgplanet sedan 2006 · banan inte rensad
                Lockar: 248 år för ett varv. ”Vilket krav klarade Pluto inte?”
                Sambandet: ”En av dvärgplaneterna”: Pluto hör till småfolket i avsnitt 4
            - rubrik: Modellen
              text: "Ta fram Tankekartan, blad 2. I vecka 1 lägger du den första post-it-lappen och skriver det första ordet. Nederst i varje fält har bladet rader med ledtexten Hit hör. Där skriver paren det som hör till delen, efter ordet i fliken. Ge då Orden två minuter till, och korta Samtala lika mycket. Gruppen lägger fördjupningens lapp på En lapp till, som får namnet Hör till småfolket: Pluto är en dvärgplanet."
            - rubrik: Orden
              text: mitt i familjen (solen) · närmast solen (stenplaneterna) · längre ut (jättarna) · flest i familjen (småfolket)
            - rubrik: Svaret
              text: |-
                Lyssna efter: solen i mitten · stenplaneterna och jättarna · småfolket är flest
                Så kan det låta: ”I mitten finns solen, som håller ihop allt. Närmast går fyra stenplaneter, och längre ut fyra jättar. Till familjen hör också månar, dvärgplaneter, asteroider och kometer, och de små är flest.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret håller utan att vi vet vem som gav Pluto namnet."
            - rubrik: Samtala
              text: "Varför kallar författaren solsystemet en familj? Varför får Pluto en egen fördjupning? Ett svar: familjen visar att allt hör ihop runt solen, och Pluto visar vad som krävs för att få kallas planet."
    - rubrik: "Medel, text 1: Solens familj"
      tema: Rymden
      text:
        - Rymden · text 1 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Solens familj
          rader:
            - - Om någon ber dig rita solsystemet, ritar du nog en sol och åtta planeter på rad. Då har du fått med de mest kända i familjen, men långt ifrån alla. Vilka hör till solens familj, och vilka är flest?
        - rubrik: Siffran
          rader:
            - - "8"
              - planeter går runt solen.
        - rubrik: "Bild: Hela familjen"
          rader:
            - - Hela familjen. Siffrorna är avsnittens nummer. Solen och planeterna har rätt storlek jämfört med varandra. I verkligheten står de inte alls så tätt.
        - rubrik: En stjärna i mitten
          rader:
            - - Mitt i familjen står solen. Den är en stjärna, precis som stjärnorna du ser på natthimlen. Den ser bara så mycket större ut eftersom den ligger så mycket närmare oss.
            - - Solen är också den som håller ihop familjen. Den drar i allt som finns omkring den och håller det kvar. Därför går planeterna och allt det andra runt solen, varv efter varv. Vägen runt kallas en **omloppsbana**.
            - - Ett varv runt solen är ett år. Jorden behöver 365 dygn för sitt varv, och därför är vårt år så långt. Andra planeter behöver längre eller kortare tid, så deras år är inte lika långa som vårt.
        - rubrik: Ord i texten
          rader:
            - - omloppsbana
              - vägen runt solen eller runt en planet
        - rubrik: De fyra stenplaneterna
          rader:
            - - Närmast solen går fyra små planeter. De heter Merkurius, Venus, jorden och Mars, och vår egen planet är alltså en av dem. De kallas stenplaneter, eftersom de har en fast yta av sten som det går att stå på.
            - - Lika är de ändå inte, och det märks tydligt på Venus. Alla planeter snurrar runt sig själva, och ett sådant varv är ett dygn. Jorden snurrar ett varv på 24 timmar, men Venus snurrar mycket långsammare.
            - - Ett dygn på Venus tar 243 **jorddygn**. Ett varv runt solen, alltså ett år, tar bara 225 jorddygn. På Venus är ett dygn därför längre än ett år.
        - rubrik: Ord i texten
          rader:
            - - jorddygn
              - ett dygn på jorden, 24 timmar
        - rubrik: "Bild: Ett dygn och ett år"
          rader:
            - - "Ett dygn och ett år. Den korta pilen är ett dygn: jorden snurrar ett varv runt sig själv. Den långa pilen är ett år: jorden går ett varv runt solen."
        - rubrik: Jättarna
          rader:
            - - Längre ut går fyra planeter av ett helt annat slag. De heter Jupiter, Saturnus, Uranus och Neptunus, och de är jättar jämfört med stenplaneterna. Störst är Jupiter, som är elva gånger så bred som jorden. Om jorden vore en vindruva, skulle Jupiter vara en basketboll.
            - - Till skillnad från stenplaneterna är jättarna **klot** av gas och is. Där finns ingen fast mark, så ingen skulle kunna landa och kliva ut. Runt alla fyra går dessutom ringar, och var och en har många månar.
            - - Saturnus är den enda planeten som är lättare än en lika stor boll av vatten. Om det fanns ett badkar som var stort nog, skulle hela Saturnus flyta i det.
        - rubrik: Ord i texten
          rader:
            - - klot
              - en rund kropp, som en boll
        - rubrik: "Bild: Vindruvan och basketbollen"
          rader:
            - - Vindruvan och basketbollen. Elva jordklot på rad når tvärs över Jupiter. Vindruvan är lika liten bredvid basketbollen som jorden är bredvid Jupiter.
        - rubrik: Småfolket
          rader:
            - - Flest i familjen är ändå de små, och de är av flera slag. Dit hör månarna, som går i bana runt en planet i stället för runt solen. Jorden har en enda måne, men jättarna har desto fler. I mars 2025 hade **astronomer** hittat 274 månar bara runt Saturnus.
            - - Dit hör också dvärgplaneterna. De är runda som planeter men mindre än var och en av de åtta planeterna.
            - - Kvar blir asteroiderna och kometerna. En asteroid är ett block av sten eller metall, och en komet är en klump av is, sten och damm. Både asteroider och kometer går i egna banor runt solen. Tillsammans är småfolket många gånger fler än de åtta planeterna.
        - rubrik: Ord i texten
          rader:
            - - astronomer
              - forskare som studerar rymden
        - rubrik: "Fakta: Solens familj i tal"
          rader:
            - - Stjärna
              - "1"
            - - Stenplaneter
              - "4"
            - - Jättar
              - "4"
            - - Månar runt jorden
              - "1"
            - - Månar runt Saturnus
              - 274 i mars 2025
        - rubrik: "Fördjupning: Varför åkte Pluto ut?"
          rader:
            - - En av dvärgplaneterna har en egen historia. Den heter Pluto, och länge räknades den som solens nionde planet. Ett enda varv runt solen tar 248 år för Pluto, så ingen människa hinner uppleva ett helt år där.
            - - Men år 2006 bestämde astronomerna vad som krävs för att få kallas planet. Ett av kraven är att planeten ska ha rensat sin bana. Det betyder att planeten bestämmer i sin egen bana. Den har dragit till sig eller slungat bort andra himlakroppar av liknande storlek.
            - - Det kravet klarade inte Pluto, som delar sin bana med många andra kroppar. Därför flyttades Pluto till gruppen dvärgplaneter, och solen fick åtta planeter i stället för nio. Själva Pluto har inte förändrats. Den går kvar i sin bana som förut, men vi kallar den något annat.
        - rubrik: Visste du att …
          rader:
            - - 11 år
              - var Venetia Burney från Oxford när hon gav Pluto dess namn. Vad skulle du kalla en ny planet?
        - rubrik: Läs mer
          rader:
            - - Rymdstyrelsen har en sida om varje planet i solsystemet.
              - https://www.rymdstyrelsen.se/upptack-rymden/solsystemet/
            - - Rymdstyrelsen förklarar vad en planet är, och varför Pluto inte räknas dit.
              - https://www.rymdstyrelsen.se/upptack-rymden/solsystemet/mer-om-solsystemet/vad-ar-en-planet/
            - - UR Play har korta filmer med kul fakta om rymden.
              - https://urplay.se/serie/227506-kul-fakta-rymden
