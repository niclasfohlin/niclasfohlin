  - Bilden
  - Så kan det låta
  - Utan flik
  - Tiden emellan
nivaer:
  - namn: Bas
    farg: 4E7A43
  - namn: Medel
    farg: A8742A
  - namn: Avancerat
    farg: "6E3450"
centrala:
  - id: faktatexter
    efterText: urval
inledning:
  - "Faktatextsamtal i grupp är en lärarledd insats där två till åtta elever i åk 4–9 läser en faktatext i veckan och samtalar om den. Den är för elever som läser orden men behöver stöd i att få ihop texten: de läser vidare fast de har slutat förstå, tar det roligaste för det viktigaste och läser varje avsnitt för sig. Eleven lär sig att stanna när det skaver, att säga det viktigaste i ett avsnitt med egna ord och att se hur en faktatext är byggd."
  - "Varje elev har en egen kopia av veckans text och en penna. Texten ser ut som ett kapitel i en faktabok, med fyra avsnitt, en fördjupning och bilder. På bordet ligger post-it-lappar och gruppens blad Kärnorna, där lapparna sitter mellan passen. Varje par har kortet När det skaver. I modellpasset ligger en tom modell i A3 mitt på bordet: en tankekarta, en tidslinje eller en annan av metodens fem modeller. Du har lärarens sida till texten, som säger var det brukar skava och vad du lyssnar efter."
  - En text tar två pass. I läspasset läser gruppen texten, ett avsnitt i taget. Eleverna stryker under det som skaver, ett ord eller en mening de inte förstår, och ni reder ut det. Sedan säger var och en kärnan, det viktigaste i avsnittet med högst tio ord, till den bredvid, och gruppen skriver sin kärna på en lapp. I modellpasset lägger gruppen lapparna i veckans modell, skriver dit textens ord för sambanden och återger hela texten med egna ord, med modellen framför sig. Varje text har en fråga, som gruppen gissar på före läsningen och svarar på i modellpasset.
  - "Perioden är åtta veckor. Metoden har tre nivåer, Bas, Medel och Avancerat, och varje nivå har texter om ett område: vatten, rymden eller smittor och epidemier. Varje text är byggd på sitt sätt och har sin modell. I vecka 1 visar du hur en läsare gör, och sedan tar eleverna över en bit i taget. I vecka 6–8 läser gruppen klassens texter i SO och NO på samma sätt, med de modeller den redan kan."
upplagg:
  rubrik: Så fungerar insatsen
  text: "Två till åtta elever har två pass i veckan i åtta veckor, 40 minuter per pass. Gruppen läser en faktatext i veckan, i ett läspass och ett modellpass. I läspasset läser gruppen ett avsnitt i taget, i fyra steg: Läs, Red ut, Kärnan och Lappen. I modellpasset lägger gruppen post-it-lapparna i en modell och svarar på textens fråga. Vecka 1–5 har ett temas texter, en i veckan, och vecka 6–8 klassens texter i SO och NO. Kartläggningen före och efter perioden, lapparna och elevens svar varje vecka visar om eleven hittar kärnan och ser hur texten hänger ihop."
gruppen:
  rubrik: Så sätter du ihop gruppen
  text: "Metoden är för elever som avkodar hjälpligt men inte får ihop en faktatext: de läser till slutet och kan inte säga vad den handlade om. Eleven behöver kunna förstå texten när någon läser den högt. Den som avkodar mödosamt kan vara med, eftersom du och kamraten läser högt. Hen tränar avkodningen vid sidan av. Gruppen har två till åtta elever som arbetar i par, och vid ett udda antal arbetar tre tillsammans. Sju eller åtta elever arbetar i två halvor, som det står under Arbetsform. Välj nivå efter elevernas läsning: kartläggningen före perioden visar vilken som passar."
principer:
  rubrik: Tre saker att hålla fast vid
  text: Kärnan är gruppens. Eleverna säger den med egna ord innan någon skriver den, och du skriver den inte åt dem. Fråga hellre än förklara. ”Var skavde det?”, ”Vem eller vad handlar det om?” och ”Var står det?” skickar eleverna tillbaka till texten. Låt det som skaver vara textens sak. Den som säger ”här förstår jag inte” har gjort det en god läsare gör, och det är författarens jobb att skriva begripligt.
passrutin:
  text: Läspasset har tre delar, och de flesta minuterna går till att läsa och fånga kärnan. Här lär sig eleven att stanna när det skaver och att säga det viktigaste i ett avsnitt. Passet börjar vid bladet Kärnorna och slutar där. Vad gruppen gör med varje avsnitt står under Ett avsnitt i fyra steg, och textens andra pass står under Modellpasset på 40 minuter.
  kallas: delar
  steg:
    - fas: Förbered
      text: Var och en säger sin gissning på textens fråga till den bredvid. Sedan ser gruppen på rubriken, bilderna och mellanrubrikerna.
    - fas: Läs och fånga
      text: "Gruppen läser de fyra avsnitten, ett i taget. Du läser det första högt, och paren läser de tre andra. Varje avsnitt som paren läser har fyra steg: Läs, Red ut, Kärnan och Lappen."
    - fas: Avsluta
      text: En elev läser lapparna i följd. Var och en säger till den bredvid vad hen tror nu, och gruppen prövar gissningarna mot lapparna.
  efterPasset: Efter läspasset sparar du bladet Kärnorna med lapparna till modellpasset, och efter modellpasset sparar du modellen med lapparna kvar. Se i elevernas texter vad de har strukit under, och skriv på lärarens sida det du såg och vem du frågar först nästa gång.
tidsschema:
  rubrik: Läspasset på 40 minuter
  rader:
    - tid: Före passet
      fas: Förberedelse
      vad: Läs texten och lärarens sida. Se efter var det brukar skava i avsnitten och vad en kärna behöver ha med. Lägg fram texterna, pennor, post-it-lappar, kortet När det skaver och bladet Kärnorna.
    - tid: 0–5 min
      fas: Förbered
      vad: "Läs textens fråga med texten nedvänd: ”Vad tror ni?” Gissningen väcker det eleverna redan vet. Skriv gissningarna på bladet Kärnorna. Vänd upp texten: ”Vad ser ni på bilderna och rubrikerna?” Red ut orden som står på lärarens sida."
    - tid: 5–35 min
      fas: Läs och fånga
      vad: "Läs ingressen och avsnitt 1 högt. Det tar omkring sex minuter. Paren läser de tre andra, omkring åtta minuter per avsnitt. Efter varje avsnitt samlar du gruppen: ”Var skavde det?” Blir tiden knapp läser du också det sista avsnittet högt, och gruppen säger kärnan direkt. I vecka 5 läser du avsnitt 3 i stället, eftersom de två eleverna med jobbkorten leder det sista avsnittet."
    - tid: 35–40 min
      fas: Avsluta
      vad: ”Vet vi mer nu?” En gissning som blev fel är lika mycket värd som en som blev rätt, för den gav gruppen något att läsa efter.
  efter: Tiderna är hållpunkter.
  varianter:
    - nar: första passet
      text: Delen Förbered tar längre tid, eftersom du först säger vad strecket betyder och visar kortet När det skaver. På Medel och Avancerat läser du också det sista avsnittet högt.
      delar:
        - { fas: Förbered, tid: "0–8 min" }
        - { fas: Läs och fånga, tid: "8–35 min" }
        - { fas: Avsluta, tid: "35–40 min" }
arbetsform:
  rubrik: "Arbetsform: gemensamt, i par, gemensamt igen"
  text: "Var och en säger sin sak till den bredvid innan någon säger den till gruppen. Det gäller gissningen, kärnan i de avsnitt paren läser och texten ur modellen. Är ni tre eller fem arbetar tre tillsammans: de turas om att läsa högt, och var och en säger sin sak till de två andra. Är ni sju eller åtta arbetar gruppen i två halvor i läspasset: varje halva skriver sin lapp, och gruppen väljer en av dem till bladet Kärnorna. Då sitter modellen på väggen i modellpasset."
  delar:
    - rubrik: 1. Gemensamt
      text: frågan, bilderna och orden
      faser:
        - Förbered
    - rubrik: 2. I par
      text: läser, prövar kortets sätt och säger kärnan
      faser:
        - Läs och fånga
    - rubrik: 3. Gemensamt
      text: post-it-lapparna i följd
      faser:
        - Avsluta
tabeller:
  - rubrik: "Två pass per text: läspasset och modellpasset"
    plats: efter-inledning
    meny: true
    text: Tabellen jämför de två passen. Lärarens sida till veckans text följer samma två pass, och klassens texter i vecka 6–8 får ett läspass och ett modellpass på samma sätt.
    kolumner:
      - Passet
      - Läspasset
      - Modellpasset
    rader:
      - - Tränar
        - att stanna när det skaver och säga det viktigaste i ett avsnitt
        - att se hur texten är byggd och återge hela texten
      - - Gruppen gör
        - "Gissar på textens fråga. Läser fyra avsnitt, ett i taget: Läs, Red ut, Kärnan och Lappen."
        - Lyssnar på fördjupningen, lägger lapparna i modellen, skriver textens ord, återger texten och skriver svaret.
      - - Du visar
        - "I vecka 1, 2 och 6 tänker du högt i avsnitt 1: var det skaver, och hur du hittar kärnan."
        - I vecka 1–5 visar du veckans modell med ett exempel om skolan, och i vecka 6 hur du väljer modell.
      - - Du frågar
        - ”Var skavde det?” ”Vem eller vad handlar avsnittet om? Vad är det viktigaste om det?”
        - ”Var hör den här lappen hemma?” ”Vilket ord i texten visar hur de hör ihop?”
      - - Efter passet finns
        - fyra post-it-lappar på bladet Kärnorna
        - modellen med lapparna, och ett svar från varje elev
    not: "Med tre pass i veckan blir perioden drygt fem veckor. Läs då vecka som text: vecka 3 är temats tredje text. Den som var borta i läspasset läser lapparna högt när modellpasset börjar. Faller ett pass bort tar ni det nästa gång."
  - rubrik: Varför en faktatext blir svår, och vad metoden gör
    plats: efter-inledning
    text: Sex saker gör en faktatext svår för elever som behöver stöd i läsförståelsen. Metoden möter var och en av de sex sakerna på ett bestämt ställe.
    kolumner:
      - Det som händer
      - Så märks det
      - Så gör metoden
    rader:
      - - Eleven märker inte att hen har slutat förstå
        - Läser vidare. Ingenting är understruket, eller nästan allt
        - Eleven läser med pennan i handen och stryker under det som skaver. Efter varje avsnitt frågar du ”Var skavde det?” Den som inte kan säga vad avsnittet handlade om har också hittat något som skaver.
      - - Eleven fastnar på ämnets ord och meningar
        - Läser ut grundvatten rätt men kan inte säga vad det är
        - Gruppen reder ut två eller tre ord före läsningen. Kortet När det skaver ger fyra sätt att reda ut resten.
      - - Det roliga tar över det viktiga
        - Kärnan är ett årtal, en rolig detalj eller en avskriven mening
        - Kärnan säger vem eller vad avsnittet handlar om och det viktigaste om det, med högst tio ord. Sist i modellpasset prövar gruppen om rutan Visste du att är viktig eller intressant.
      - - Texten blir en lista
        - ”Och sen, och sen.” Varje avsnitt blir en egen liten text
        - Veckans modell visar hur avsnitten hör ihop, med textens ord för sambanden. Den som ska svara på textens fråga behöver hela texten, och sist samtalar gruppen om varför författaren har byggt den så.
      - - Bilden blir oläst
        - Kan inte peka ut var i bilden avsnittet är
        - Avsnittens nummer står i bilden. ”Var i bilden är vi nu?”
      - - Tråden tappas mellan passen
        - ”Vad var det vi läste?”
        - Post-it-lapparna sitter kvar på bladet Kärnorna, och modellpasset börjar vid dem.
  - rubrik: Så visar du i läspasset
    plats: efter-tidsschema
    text: I vecka 1 ser eleverna hur en läsare gör. Du säger högt det du tänker i avsnitt 1, med orden under Tänk högt på lärarens sida, och sedan gör gruppen de andra avsnitten. I vecka 2 visar du en gång till. Från vecka 3 frågar du i stället, tills klassens text kommer i vecka 6.
    kolumner:
      - Det du visar
      - Så gör du
    rader:
      - - Första gången
        - "Före textens fråga säger du: ”När du inte förstår ett ord eller en mening skaver det. Stryk under det. Ett streck betyder att du läser noga, och det är författarens jobb att skriva begripligt.” Visa sedan kortet När det skaver, med fyra sätt att pröva."
      - - Det som skaver
        - "Du stannar vid ett ställe som skaver för dig och säger vad du prövar: ”Här förstår jag inte. Jag läser om.” Efter avsnittet frågar du dig själv högt: ”Vad handlade det om? Kan jag säga det?”"
      - - Kärnan och lappen
        - "Du säger högt hur du hittar kärnan: vem eller vad, det viktigaste om det och detaljen du väljer bort. Du skriver kärnan med högst tio ord på en post-it-lapp, läser den högt och sätter den på bladet Kärnorna. Det är den enda lapp du skriver i passet."
      - - Bilden
        - "Har avsnitt 1 en bild pekar du i den och säger var avsnittet är: ”Här är vi nu.”"
      - - Klassens text
        - "I vecka 6 tänker du högt i avsnitt 1 igen, om det som är nytt: texten har inga ordförklaringar i marginalen, så ledtråden är bilden, ett ord i fet stil eller meningen efter."
  - rubrik: "Ett avsnitt i fyra steg: Läs, Red ut, Kärnan och Lappen"
    plats: efter-tidsschema
    meny: true
    text: Avsnitt 1 läser du högt, och det tar omkring sex minuter. I vecka 1, 2 och 6 tänker du högt där. De andra veckorna samlar du gruppen direkt, och gruppen reder ut och säger kärnan utan att paren gör det först. Avsnitten som paren läser har alla samma fyra steg, och ett avsnitt tar omkring åtta minuter. Den som avkodar mödosamt följer med i texten, och kamraten eller du läser. På Avancerat är avsnitten längre. Räkna där med att läsa ett avsnitt till högt från vecka 3, och bestäm före passet vilket. I vecka 5 är det avsnitt 2.
    kolumner:
      - Steg
      - Eleverna gör
      - Du säger
    rader:
      - - 1 Läs
        - "I paret: en läser högt och den andra följer med, och de byter vid nästa avsnitt. Båda har en penna och stryker under det som skaver: ett ord, en mening eller ett ställe där de tappade tråden."
        - "”Stryk under det som skaver.” Till paret som är klart först: ”Skriv på textens baksida en fråga som avsnittet svarar på.”"
      - - 2 Red ut
        - |-
          I paret: prövar sätten på kortet När det skaver på det de har strukit under.
          I gruppen: paren säger var det skavde, och ni reder ut det som hindrar er från att förstå avsnittet. Resten lämnar ni.
        - "”Var skavde det?” ”Vad har ni prövat?” Säg vad paret gjorde som hjälpte: ”Ni läste meningen efter.” Har avsnittet en bild: ”Var i bilden är vi nu?”"
      - - 3 Kärnan
        - |-
          I paret: var och en ringar in vem eller vad avsnittet handlar om och säger kärnan till den bredvid, med högst tio ord. Paret väljer den som säger mest om hela avsnittet.
          I gruppen: eleverna väljer på samma sätt, eller fogar ihop två.
        - ”Vem eller vad handlar avsnittet om? Vad är det viktigaste om det?” ”Vilken säger mest om hela avsnittet? Varför?”
      - - 4 Lappen
        - "I gruppen: en elev skriver kärnan på en post-it-lapp och sätter den på bladet Kärnorna. En annan läser den förra lappen och den nya i följd."
        - ”Hur hänger det ihop med det vi läste innan?”
  - rubrik: "Kärnan: det viktigaste med högst tio ord"
    plats: efter-tidsschema
    kolumner:
      - Om kärnan
      - Så är det, och det du säger
    rader:
      - - Vad den är
        - Vem eller vad avsnittet handlar om, och det viktigaste om det. En mening på högst tio ord, med elevernas egna ord, så att gruppen måste välja.
      - - Någon kan inte säga en kärna
        - "Då skaver det någonstans: ”Var tappade du tråden?” Eleven stryker under där, och paret prövar sätten på kortet."
      - - Kärnan är för lång
        - ”Vad kan vi stryka och ändå förstå?”
      - - Kärnan är en rolig detalj
        - ”Är det viktigt eller intressant? Peka på meningarna som handlar om det.” Är de få, lämnar gruppen detaljen i texten och gör kärnan av det som de flesta meningarna handlar om.
      - - Kärnan är avskriven
        - ”Lägg texten med baksidan upp och säg det med egna ord.”
      - - Gruppen kommer inte fram till en kärna
        - "Säg två kärnor och låt gruppen välja: ”Vilken säger mest om hela avsnittet?” Stödorden på lärarens sida hjälper dig."
    not: Gruppens kärna behöver inte likna stödorden på lärarens sida. Handlar den om hela avsnittet, och har den med de flesta av stödorden, håller den.
  - rubrik: "Lärarens sida: det du har i handen"
    plats: efter-arbetsform
    text: Till varje text finns lärarens sida, ett stöd till dig på högst två A4. Den följer textens två pass. Avsnittens rader har numret och ett kort namn.
    kolumner:
      - Raden
      - Det den ger dig
    rader:
      - - Textens fråga
        - Frågan gruppen gissar på, med samma ord som sist i textens ingress
      - - Ord före läsningen
        - Två eller tre ord att reda ut först, och det eleverna lätt tar fel på
      - - Tänk högt
        - Dina ord när du visar avsnitt 1 i vecka 1 och 2
      - - Red ut
        - Det som brukar skava i avsnittet
      - - Lyssna efter
        - Det en kärna behöver ha med, som stödord. Gruppen säger det med egna ord
      - - Lockar
        - Detaljen som lätt tar över, och en fråga som skickar gruppen tillbaka till texten
      - - Sambandet
        - Textens ord som binder avsnittet till det förra
      - - Bilden
        - Det du pekar på när du frågar var i bilden ni är
      - - Om någon frågar
        - Svar på frågor som eleverna ofta ställer om texten
      - - Modellpasset
        - "Raderna Fördjupningen, Modellen, Orden, Svaret, Rutan och Samtala: modellen gruppen prövar först i vecka 2–5, var lapparna hör hemma, textens ord för sambanden och ett exempel på hur svaret kan låta"
    not: Sidan är ditt stöd för att lyssna och fråga. Gruppen ser den inte, och du läser inte upp den.
  - rubrik: Modellpasset på 40 minuter
    plats: efter-fastnar
    meny: true
    text: I textens andra pass blir post-it-lapparna en bild av hela texten. Här lär sig eleven att se hur texten är byggd och att återge hela texten. Den som skriver mödosamt säger svaret, och kamraten eller du skriver det med elevens ord.
    kolumner:
      - Del och tid
      - Det gruppen gör
      - Så leder du det
    rader:
      - - |-
          Förberedelse
          Före passet
        - Bladet Kärnorna med lapparna ligger mitt på bordet. Eleverna har sina texter framme.
        - Läs modellens sida och raderna under Modellpasset på lärarens sida. I vecka 1 lägger du också fram den tomma modellen på A3 och exemplet om skolan. I vecka 2–5 lägger du fram den sparade modell som lärarens sida säger. Exemplet och den tomma modellen tar du fram när gruppen har sagt varför den sparade modellen inte räcker. I vecka 6–8 ligger bladet Kärnorna med lapparna och gruppens fem modeller framme. Den tomma modellen har du då hos dig, så att den inte avslöjar valet.
      - - |-
          Fördjupningen
          0–⁠6 min
        - En elev läser lapparna högt i textens ordning. Gruppen lyssnar på fördjupningen och skriver en kärna till, den femte lappen.
        - ”Vad var det vi ville veta?” Läs fördjupningen högt, utan stopp, och fråga efter kärnan.
      - - |-
          Modellen
          6–⁠18 min
        - I vecka 1–5 ser gruppen exemplet om skolan och pekar ut var varje mening står. Sedan flyttar gruppen lapparna till veckans modell, en i taget, och säger varför lappen hör hemma där. Gruppen ger varje plats ett namn.
        - "I vecka 2–5 lägger du först fram en modell gruppen kan: ”Passar den här? Varför inte?” Läs exemplets text, och återge den sedan ur exemplet. ”Var hör den här lappen hemma? Vad ska platsen heta?” Låt gruppen pröva, också när lappen hamnar fel."
      - - |-
          Orden
          18–⁠23 min
        - Paren letar i texten efter orden som visar hur delarna hör ihop och skriver dem i modellens flikar, de små streckade rutorna. De delar flikarna mellan sig.
        - ”Vilket ord i texten visar det?” Orden står på lärarens sida.
      - - |-
          Svaret
          23–⁠33 min
        - Var och en återger hela texten ur modellen för den bredvid, som pekar på lapparna. Sedan skriver var och en sitt namn och sitt svar på textens fråga på baksidan av texten, två till fyra meningar, och läser svaret för den bredvid.
        - "”Berätta texten ur modellen.” Till den som pekar: ”Vilken lapp kom inte med?” Lyssna efter textens ord för sambanden, och säg vad du hörde: ”Du sa därför.” Saknar ett uppläst svar något: ”Vilken lapp svarar på det?”"
      - - |-
          Samtala
          33–⁠40 min
        - Läser rutan Visste du att och säger om den är viktig eller intressant. Samtalar om författarens val, och var och en säger en sak hen tar med sig.
        - "”Håller svaret utan den?” Välj en eller två frågor om författaren: ”Varför börjar författaren så?” ”Vad vill författaren att vi förstår?” ”Skrev författaren tydligt, eller saknas något?” Har ett par skrivit en egen fråga svarar gruppen på den ur modellen."
    not: Modellen är ett samtal, inte ett formulär att fylla i. Det viktiga är att gruppen säger varför lappen hör hemma där.
  - rubrik: Så visar du i modellpasset
    plats: efter-fastnar
    text: I vecka 1–5 är veckans modell ny för gruppen. Du visar den, och sedan lägger gruppen sina egna post-it-lappar. Visningen tar omkring fyra minuter av delen Modellen, och i vecka 2–5 omkring sex, eftersom gruppen då först prövar en modell den kan. Drar delen Modellen över tiden får frågorna om författaren i Samtala vänta.
    kolumner:
      - Det du visar
      - Så gör du
    rader:
      - - Veckans modell
        - Du visar exemplet om skolan och läser exemplets text högt, en mening i taget. Den står på modellens sida. Gruppen pekar ut var varje mening står. Sedan återger du texten ur exemplet, medan du pekar. Så ska gruppen sedan återge veckans text.
      - - Den första lappen och det första ordet
        - I vecka 1 lägger du veckans första lapp och säger varför den hör hemma där och vad platsen ska heta. Sedan lägger gruppen de andra lapparna. I delen Orden letar du upp det första ordet, visar var det står och skriver det i fliken.
      - - En modell gruppen kan
        - "I vecka 2–5 lägger du först fram en av gruppens sparade modeller: ”Passar den här? Varför inte?” Raden Modellen på lärarens sida säger vilken, med en fråga till. Gruppen säger varför den inte räcker."
      - - Valet av modell
        - "I vecka 6 ligger gruppens fem modeller framme. Du prövar två av modellernas frågor: ”Vad händer, och i vilken ordning? Här finns inget först och sist. Tidslinjen passar inte.” Paren prövar de tre andra, och du säger vilken som passar."
  - rubrik: "De fem modellerna: en för varje sätt att bygga en text"
    plats: efter-fastnar
    meny: true
    text: En faktatext är för det mesta byggd på ett av fem sätt, och varje sätt har sin modell. Modellens fråga hjälper gruppen att välja.
    kolumner:
      - Texten
      - Modellen
      - Modellens fråga
      - Textens ord
    rader:
      - - beskriver en sak och dess delar
        - Tankekartan
        - Vad beskriver texten, och vilka delar har det?
        - den största, en annan del, också
      - - berättar i tidsordning
        - Tidslinjen
        - Vad händer, och i vilken ordning?
        - först, sedan, till sist
      - - jämför två saker
        - Venndiagrammet
        - Vilka två saker jämförs, och vad är lika och vad är olika?
        - båda, medan, men
      - - förklarar orsak och verkan
        - Kedjan
        - Vad händer, och vad leder det till?
        - därför, det gör att, eftersom
      - - visar ett problem och en lösning
        - Problem och lösning
        - Vad är problemet, och hur löses det?
        - problemet är, en lösning är
    not: Orden är ledtrådar. Det som avgör är vad texten gör. Varje modell har en egen sida bland materialet, med ett exempel om skolan och tre blad att skriva ut eller skriva i på dator.
  - rubrik: Så skiljer sig nivåerna
    plats: efter-urval
