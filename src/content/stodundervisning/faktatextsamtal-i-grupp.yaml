    - rubrik: Kartläggningen
      text:
        - "Kartläggningen visar om passen ger effekt. Eleven läser en kort faktatext och gör fyra uppgifter: om det som skaver, om kärnan, om bilden och om hur texten hänger ihop. Du gör den med en elev i taget, före perioden med text 1 och efter åtta veckor med text 2. Texterna är byggda på samma sätt, så att du kan jämföra det eleven säger och gör före och efter."
        - Texterna är prövade mot Naturhistoriska riksmuseet, Skogsstyrelsen, SLU och länsstyrelserna.
      delar:
        - rubrik: Så gör du
          falt:
            - rubrik: Du behöver
              text: elevens blad med texten och bilden, en penna, protokollet och avsnitt 1 i nivåns första text. Räkna med omkring en kvart per elev.
            - rubrik: Eleven läser
              text: Eleven läser själv, tyst eller högt. Avkodar hen mödosamt läser du högt, och eleven följer med i texten med pennan. Gör likadant före och efter.
            - rubrik: Du skriver
              text: Skriv det eleven säger, med elevens egna ord, och det hen gör. Led inte eleven fram till svaret. Skriv elevens namn på bladet och spara det, för strecken i texten syns där.
            - rubrik: På Medel och Avancerat
              text: Låt eleven också läsa ett avsnitt ur klassens lärobok, ett nytt varje gång, och säga det viktigaste. Skriv det på protokollets baksida.
        - rubrik: "Uppgift 1: det som skaver"
          falt:
            - rubrik: Du säger
              text: "”Läs de fyra meningarna. Är det något som är konstigt?” Sedan: ”Läs avsnitt 1 med pennan i handen. Stryk under det som skaver: ord eller meningar som du inte förstår.”"
            - rubrik: Lyssna efter
              text: "Hittar eleven meningarna som inte går ihop? Vad stryker hen under: ingenting, enstaka ord, ord och meningar eller nästan allt? Den som inte ser något konstigt och inte stryker under något märker troligen inte när det skaver. Börja med den eleven i passen."
            - rubrik: I texterna
              text: "Den första och den tredje meningen går inte ihop: Samir har ingen cykel men tar sin cykel, och Elsa har aldrig åkt buss men tar bussen."
            - rubrik: Så kan det låta
              text: "Före: ”Nej, inget konstigt.” Ingenting är understruket. Efter: ”Det står att hon aldrig har åkt buss, men sedan tar hon bussen varje morgon.” Allätare och fettlager är understrukna."
        - rubrik: "Uppgift 2: kärnan"
          falt:
            - rubrik: Du säger
              text: "När eleven har läst avsnitt 1: ”Vad var det viktigaste i avsnittet?” Texten ligger kvar. Sedan läser eleven avsnitt 2 med pennan i handen."
            - rubrik: Lyssna efter
              text: Säger eleven huvudsaken eller en detalj? Säger hen det med egna ord, eller läser hen upp en mening ur texten?
            - rubrik: I texterna
              text: "Text 1: bävern bygger dammar, och vattnet stiger. Det som lockar är framtänderna och Sveriges största gnagare. Text 2: björnen äter mycket bär på hösten och bygger upp ett fettlager. Det som lockar är älgkalvarna och 300 kilo."
            - rubrik: Så kan det låta
              text: "Före: ”Att tänderna växer hela tiden.” Efter: ”Björnen äter mycket bär på hösten, så att den blir fet.”"
        - rubrik: "Uppgift 3: bilden"
          falt:
            - rubrik: Du säger
              text: "När eleven har läst avsnitt 2: ”Var i bilden är det som avsnitt 2 berättar om?” Och sedan: ”Vad ser du där?”"
            - rubrik: Lyssna efter
              text: Pekar eleven på rätt del av bilden? Säger hen vad bilden visar där, och tar hen med något ur texten?
            - rubrik: I texterna
              text: Rätt del av bilden är hyddans ingång under vattnet i text 1 och idet under myrstacken i text 2.
            - rubrik: Så kan det låta
              text: "Före: eleven pekar på bävern. ”Där är den.” Efter: eleven pekar på idet. ”Här är idet, under myrstacken. Där sover björnen hela vintern.”"
        - rubrik: "Uppgift 4: hur texten hänger ihop"
          falt:
            - rubrik: Du säger
              text: "Vänd på elevens blad. ”Berätta vad texten handlade om.” Tystnar eleven frågar du en gång: ”Var det något mer?” Efter åtta veckor frågar du sist: ”Vilken modell skulle du lägga texten i?”"
            - rubrik: Lyssna efter
              text: "Hänger det eleven berättar ihop, så att det ena leder till det andra, med ord som därför och ”så att”? Eller blir det en lista med ”och sen”? Säger eleven en modell efter åtta veckor, lyssna efter skälet: leder det ena till det andra?"
            - rubrik: I texterna
              text: "Text 1: dammen gör att vattnet stiger och ingången ligger under vattnet, och därför är bävern skyddad. Text 2: björnen bygger upp ett fettlager av höstens bär, och därför klarar den vintern i idet. Båda texterna passar i kedjan."
            - rubrik: Så kan det låta
              text: "Före: ”Den har stora tänder, och sen äter den bark, och sen bor den i en hydda.” Efter: ”Björnen äter bär hela hösten och blir fet. Därför klarar den vintern i idet.”"
        - rubrik: Nivån, före perioden
          falt:
            - rubrik: Börja med
              text: "den nivå som brukar passa årskursen: Bas i åk 4–5, Medel i åk 6–7 och Avancerat i åk 8–9."
            - rubrik: Eleven läser högt
              text: "Sist läser eleven det första avsnittet i nivåns första text högt: Vattenplaneten, Solens familj eller Kroppens försvar. Fråga sedan: ”Vad handlade avsnittet om?”"
            - rubrik: Välj nivån under
              text: "om eleven stannar vid fler än ett ord av tio, eller inte kan säga något om avsnittet. Det är fler än 6 ord i Vattenplaneten, fler än 10 i Solens familj och fler än 15 i Kroppens försvar. På Bas finns ingen nivå under: då läser eleven i par med en kamrat som läser högt."
            - rubrik: Gruppen
              text: Hela gruppen läser texter på samma nivå. Välj den som passar de flesta. Den som stannar vid många ord läser i par med en kamrat som läser högt.
    - rubrik: "Text 1: Bäverns damm"
      text:
        - På bladet har eleven fyra meningar, texten och bilden.
