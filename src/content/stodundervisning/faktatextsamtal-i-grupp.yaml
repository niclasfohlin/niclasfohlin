    - rubrik: "Lärarens sida: Medel, text 2, Vägen ut i rymden"
      text:
        - På tolv år gick människan från den första satelliten till månen, och sedan dess har hon lärt sig att bo i rymden och börjat resa mot månen igen. Texten är byggd i tidsordning, och modellen är Tidslinjen, blad 2. I vecka 2 tänker du högt i avsnitt 1.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Hur många år tog det från den första satelliten till människan på månen, och vad har hänt sedan dess?
            - rubrik: Ord före läsningen
              text: kapplöpning (en tävling, ingen springer) · Sovjetunionen (ett land som fanns då)
            - rubrik: Tänk högt
              kursiv: true
              text: "”En enda satellit, och det var månen. Det skaver: är inte en satellit en maskin? Jag läser vidare. Något som går runt en planet, månen också. Vem eller vad? Sputnik 1. Det viktigaste? Den första som människor byggt, och USA skyndade efter. Det om pipet är spännande, men det är en detalj.”"
            - rubrik: "1 · 1957: en pipande boll"
              text: |-
                Red ut: satellit: både måne och maskin · fick månen sällskap: en satellit till
                Lyssna efter: 1957 · första satelliten · USA skyndade efter
                Lockar: 58 centimeter och pipet. ”Vad var Sputnik 1 först med?”
                Bilden: Strecket längst till vänster, 1957. Sputnik 1 bredvid basketbollen
            - rubrik: "2 · 1961: den första människan"
              text: |-
                Red ut: kapsel och katapultstol, i marginalen · en gång till: som med Sputnik
                Lyssna efter: 1961 · Gagarin · första människan i rymden
                Lockar: katapultstolen och fallskärmen. ”Vad var Gagarin först med?”
                Sambandet: ”fyra år efter Sputnik” och ”Därför”: maskiner och hundar först
                Bilden: Strecket vid 1961, fyra små streck efter 1957
            - rubrik: "3 · 1969: månen"
              text: |-
                Red ut: himlakropp, i marginalen · den pipande bollen: Sputnik 1
                Lyssna efter: 1969 · människor på månen · tolv år efter Sputnik
                Lockar: landningen i havet. ”Hur lång tid hade gått sedan Sputnik?”
                Sambandet: ”åtta år efter Gagarins resa”: USA når målet från avsnitt 2
                Bilden: Strecket vid 1969, tolv små streck efter 1957
            - rubrik: "4 · 2000: ett hus i rymden"
              text: |-
                Red ut: utan avbrott: hela tiden · återvinnas och urin, i marginalen
                Lyssna efter: 2000 · bor i rymden · utan avbrott
                Lockar: dricksvatten av urin. ”Vad är nytt jämfört med resan till månen?”
                Sambandet: ”31 år efter månlandningen” och ”därför”: från besök till att bo
                Bilden: Tre streck tätt ihop, sedan långt till det fjärde
            - rubrik: Om någon frågar
              text: "Vilka var hundarna? Laika flög 1957 och dog där uppe. Belka och Strelka kom levande hem 1960. Varför svävar astronauterna? De faller runt jorden hela tiden. Har någon svensk varit i rymden? Ja, tre: Christer Fuglesang, Jessica Meir och Marcus Wandt. När landar människor på månen igen? År 2028, enligt NASA:s plan från 2026."
        - rubrik: "Modellpasset: Tidslinjen för Vägen ut i rymden"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: mot månen: runt den, inte ner på den · prov: resan prövade farkosten
                Lyssna efter: 2026 · runt månen · ingen landning
                Lockar: resans tid på minuten. ”Vad gjorde Artemis II, och vad gjorde den inte?”
                Sambandet: ”26 år efter att astronauter flyttade in”: nästa steg på linjen
            - rubrik: Modellen
              text: "Lägg först fram gruppens tankekarta från vecka 1 och fråga: ”Vad kommer först här?” Den visar delar men ingen ordning. Ta sedan fram Tidslinjen, blad 2. Gruppen lägger fördjupningens post-it-lapp på En lapp till och drar linjen dit. Resan blir steg 5, nästa steg i samma förlopp."
            - rubrik: Orden
              text: |-
                1957 (första satelliten) · 1961 (första människan) · 1969 (månen) · 2000 (rymdstationen) · 2026 (runt månen)
                Tiden emellan: 4 år · 8 år · 31 år
            - rubrik: Svaret
              text: |-
                Lyssna efter: tolv år, 1957 till 1969 · bor i rymden sedan 2000 · 2026 runt månen, ingen landning
                Så kan det låta: ”Det tog tolv år, från 1957 till 1969. Sedan år 2000 bor människor på rymdstationen hela tiden. År 2026 flög fyra astronauter runt månen igen, men de landade inte.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för linjens steg är desamma utan de sexton varven."
            - rubrik: Samtala
              text: "Varför står årtalet först i varje avsnitt? Varför slutar texten med en resa där ingen landade? Ett svar: åren visar ordningen och tiden emellan, och slutet visar att vägen fortsätter."
    - rubrik: "Medel, text 2: Vägen ut i rymden"
      tema: Rymden
      text:
        - Rymden · text 2 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Vägen ut i rymden
          rader:
            - - Titta upp mot himlen en klar kväll. Där uppe far tusentals satelliter runt jorden, men före 1957 hade människor inte skickat upp en enda. Hur många år tog det från den första satelliten till människan på månen, och vad har hänt sedan dess?
        - rubrik: Siffran
          rader:
            - - 58 cm
              - bred var den första satelliten, Sputnik 1.
        - rubrik: "Bild: Från 1957 till 2026"
          rader:
            - - Från 1957 till 2026. Åren i texten står på en linje, med rätt avstånd mellan dem. Siffrorna 1 till 4 är avsnittens nummer.
        - rubrik: "1957: en pipande boll"
          rader:
            - - År 1957 hade jorden en enda **satellit**, och det var månen. En satellit är något som går runt en planet, varv efter varv. Den 4 oktober fick månen sällskap. Då sköt Sovjetunionen upp Sputnik 1, den första satelliten som människor hade byggt.
            - - Sputnik 1 var en boll, 58 centimeter bred och 83,6 kilo tung. Den for ett varv runt hela jorden på ungefär en och en halv timme. Under tiden sände den ut en pipande signal som gick att höra i radio.
            - - Sovjetunionen hade alltså varit först med en satellit. Det kom som en chock i USA, och därför skyndade sig USA att skicka upp en egen satellit. En **kapplöpning** mellan de två länderna hade börjat.
        - rubrik: Ord i texten
          rader:
            - - satellit
              - måne eller maskin som går runt en planet
            - - kapplöpning
              - en tävling om att komma först
        - rubrik: "Bild: Sputnik 1 och basketbollen"
          rader:
            - - Sputnik 1 och basketbollen. Sputnik 1 var 58 centimeter bred. Det är mer än dubbelt så brett som en basketboll.
        - rubrik: "1961: den första människan"
          rader:
            - - År 1961, fyra år efter Sputnik, tog Sovjetunionen nästa steg i kapplöpningen. Maskiner hade klarat resan runt jorden, och hundar hade kommit levande hem. Därför var det nu dags att pröva med en människa.
            - - Den 12 april lyfte en raket med rymdskeppet Vostok 1. I skeppets **kapsel** satt Jurij Gagarin från Sovjetunionen. Han flög ett varv runt jorden och blev den första människan i rymden. På vägen ner lämnade han kapseln med en **katapultstol**. Den sista biten dalade han mot marken i sin egen fallskärm, medan kapseln landade för sig själv.
            - - Sovjetunionen hade alltså varit först en gång till. USA behövde ett mål där landet kunde bli först, och därför siktade USA nu på månen.
        - rubrik: Ord i texten
          rader:
            - - kapsel
              - den lilla del av rymdskeppet där människan sitter
            - - katapultstol
              - en stol som skjuter ut föraren ur kapseln
        - rubrik: "1969: månen"
          rader:
            - - År 1969, åtta år efter Gagarins resa, nådde USA sitt mål. Den 16 juli startade rymdskeppet Apollo 11 med astronauter ombord. Den här gången räckte det inte med ett varv runt jorden, för resan gick hela vägen till månen.
            - - Den 20 juli landade två astronauter där och gick omkring på ytan. Aldrig förr hade människor satt sin fot på en annan **himlakropp** än jorden. Den 24 juli landade Apollo 11 i havet, och astronauterna var hemma igen efter drygt en vecka.
            - - Då hade det bara gått tolv år sedan den pipande bollen. På den korta tiden hade människan lärt sig att resa till en annan värld och komma hem igen.
        - rubrik: Ord i texten
          rader:
            - - himlakropp
              - en planet, måne, stjärna eller annat i rymden
        - rubrik: "2000: ett hus i rymden"
          rader:
            - - År 2000, 31 år efter månlandningen, tog människan ett steg av ett annat slag. Resan till månen hade varit ett kort besök, och nästa mål blev därför att stanna kvar i rymden. Astronauter hade prövat det på rymdstationer sedan 1970-talet.
            - - I november 2000 flyttade astronauter in på den internationella rymdstationen, som förkortas ISS. Den är som ett hus som går runt jorden, 109 meter långt. Sedan dess har det funnits människor ombord utan avbrott.
            - - Att bo i rymden kräver nya lösningar. Dit upp går ingen vattenledning, och därför måste vattnet användas om och om igen. År 2023 visade rymdmyndigheten NASA att 98 procent av vattnet ombord kan **återvinnas**, också **urin** och svett. Enligt NASA blir det renare än vattnet vi dricker på jorden.
        - rubrik: Ord i texten
          rader:
            - - återvinnas
              - användas en gång till
            - - urin
              - kiss
        - rubrik: "Fakta: Från boll till hus"
          rader:
            - - Sputnik 1 var
              - 58 centimeter bred
            - - Sputnik 1 vägde
              - 83,6 kilo
            - - Rymdstationen är
              - 109 meter lång
            - - Rymdstationen väger
              - nästan 420 000 kilo
        - rubrik: "Fördjupning: 2026: tillbaka mot månen"
          rader:
            - - År 2026 var det dags för månen igen, 26 år efter att astronauter flyttade in på rymdstationen. Mer än femtio år hade då gått sedan människor senast reste dit. Den nya resan hette Artemis II.
            - - Den 1 april lyfte fyra astronauter från Florida i USA. Deras **farkost** flög runt månen och vände sedan hemåt, utan att landa. Den 10 april var astronauterna tillbaka efter 9 dagar, 1 timme och 32 minuter. Apollo 11 hade varit borta nästan lika länge, 57 år tidigare.
            - - Det fanns ett skäl till att ingen landade den här gången. Artemis II var ett prov, där farkosten för första gången flög med människor ombord. Först på en senare resa ska människor landa på månen. Vägen ut i rymden tas fortfarande ett steg i taget.
        - rubrik: Ord i texten
          rader:
            - - farkost
              - något man reser i, till exempel ett rymdskepp
        - rubrik: "Bild: Runt månen och hem"
          rader:
            - - Runt månen och hem. Artemis II flög från jorden, runt månen och hem igen, utan att landa. I bilden är avståndet hoptryckt.
        - rubrik: Visste du att …
          rader:
            - - 16 varv
              - går rymdstationen runt jorden varje dygn. Hur många gånger hinner solen gå upp för astronauterna på ett dygn?
        - rubrik: Läs mer
          rader:
            - - Rymdstyrelsen berättar om astronauter och om svenskarna som har varit i rymden.
              - https://www.rymdstyrelsen.se/upptack-rymden/astronauter/
            - - Rymdstyrelsen berättar om rymdstationerna, från Skylab och Mir till ISS.
              - https://www.rymdstyrelsen.se/upptack-rymden/astronauter/rymdstationer/
            - - Rymdstyrelsen berättar om hur Artemis II kom hem. På sidan heter resan Artemis 2.
              - https://www.rymdstyrelsen.se/upptack-rymden/bloggen/2026/04/artemis-2-ar-hemma-igen/
    - rubrik: "Modellen: Medel, text 2, Vägen ut i rymden"
