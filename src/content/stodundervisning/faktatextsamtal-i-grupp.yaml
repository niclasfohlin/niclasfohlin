    - rubrik: "Lärarens sida: Bas, text 4, Därför flyter is"
      text:
        - Vatten tar mer plats när det fryser, och därför flyter isen, lägger sig som ett lock över sjön och skyddar vattnet och djuren under. Texten förklarar orsak och verkan, och modellen är Kedjan, blad 1. I vecka 4 har två elever i taget jobbkorten från avsnitt 2.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Fryser en sjö från ytan eller från botten, och varför?
            - rubrik: Ord före läsningen
              text: ämne (det saker består av, inte skolämne) · stelna (bli fast, inte stel i kroppen) · lättare (lika stor bit väger mindre)
            - rubrik: 1 Vatten gör tvärtom
              text: |-
                Red ut: ”gör tvärtom”: mot de flesta ämnen · samma vatten, större som is
                Lyssna efter: vatten som fryser · tar mer plats
                Lockar: flaskan som spricker. ”Vad händer med vattnet när det fryser?”
            - rubrik: 2 Lättare än vatten
              text: |-
                Red ut: ”lättare än vatten”: en liter mot en liter · tiondel, i marginalen
                Lyssna efter: is är lättare · flyter
                Lockar: isberget, nio tiondelar gömda. ”Vad säger de två första styckena om is?”
                Sambandet: ”Därför”: mer plats ger mindre vikt per liter
                Bilden: Strecket är ytan. Den lilla delen över är en tiondel
            - rubrik: 3 Sjön får ett lock
              text: |-
                Red ut: ”det” i ”det gör att”: att is flyter · ”som ett lock”: isen täcker sjön
                Lyssna efter: isen blir kvar överst · som ett lock
                Lockar: is som sjunker som sten. ”Var blir isen kvar när sjön fryser?”
                Sambandet: ”det gör att”: is flyter, alltså blir den kvar överst
                Bilden: Isen ligger överst. Luften över den är kall
            - rubrik: 4 Livet under isen
              text: |-
                Red ut: ”Eftersom” först: orsaken står före följden · ”som tyngst”: allra tyngst
                Lyssna efter: vattnet under fryser inte · djuren klarar vintern
                Lockar: varmast vid botten. ”Vad säger första meningen om vattnet längre ner?”
                Sambandet: ”Eftersom”: locket gör att vattnet under inte fryser
                Bilden: Noll grader under isen, varmast vid botten, och fiskarna
            - rubrik: Om någon frågar
              text: Varför tar is mer plats? Vattnets minsta delar sitter glesare i is. Vad händer om all is på Antarktis smälter? Havet stiger ungefär 58 meter. Och om Grönlands is smälter? Drygt 7 meter. Hur högt ligger Little Dome C? 3 200 meter över havet.
        - rubrik: "Modellpasset: Kedjan för Därför flyter is"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: ”stängdes in”: luften blev kvar i isen · inlandsis, från text 1
                Lyssna efter: mycket gammal is · luftbubblor · hur luften var
                Lockar: över en miljon år. ”Vad finns i isen, och vad visar det?”
                Sambandet: ”också”: en sak till om is, utanför kedjan
            - rubrik: Modellen
              text: "Lägg först fram gruppens tidslinje från vecka 2 och fråga: ”Flikarna säger när. Var skriver vi varför?” Den visar när, men inte varför. Ta sedan fram Kedjan, blad 1. Gruppen lägger fördjupningens post-it-lapp på En lapp till, som får namnet Hör inte till kedjan. Lappen handlar om is men är inget led: sjön fryser från ytan också utan isen på Antarktis."
            - rubrik: Orden
              text: därför (lättare) · det gör att (locket) · eftersom (under isen)
            - rubrik: Svaret
              text: |-
                Lyssna efter: från ytan · is är lättare och flyter · locket skyddar vattnet under
                Så kan det låta: ”Från ytan. Vatten tar mer plats när det fryser, så en liter is väger mindre än en liter vatten, och isen flyter. Den lägger sig överst som ett lock, och därför fryser inte vattnet under.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret på textens fråga håller utan isen på Antarktis."
            - rubrik: Samtala
              text: "Varför börjar svaret i frysen? Varför står isberget med? Ett svar: frysen känner alla till, och isberget visar att isen bara är lite lättare."
    - rubrik: "Bas, text 4: Därför flyter is"
      tema: Vatten
      text:
        - Vatten · text 4 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Därför flyter is
          rader:
            - - I går kväll kluckade vattnet mot bryggan. I morse var sjön tyst och blank. Den hade frusit under natten. Fryser en sjö från ytan eller från botten, och varför?
        - rubrik: Siffran
          rader:
            - - 11 liter
              - Nästan så mycket is blir det när tio liter vatten fryser.
        - rubrik: Vatten gör tvärtom
          rader:
            - - Svaret börjar i frysen. En glasflaska som är full med vatten kan spricka där. Vattnet fryser till is, och isen får inte plats i flaskan.
            - - De flesta **ämnen** krymper när de **stelnar**. Vatten gör tvärtom. När vatten fryser tar det mer plats. Av tio liter vatten blir det nästan elva liter is.
            - - Det är samma vatten som förut. Det har inte blivit mer vatten. Isen väger lika mycket som vattnet gjorde, men den är större.
        - rubrik: Ord i texten
          rader:
            - - ämnen
              - det saker består av, som vatten och järn
            - - stelnar
              - blir fast och hård, som när vatten fryser
        - rubrik: Lättare än vatten
          rader:
            - - Därför väger en liter is mindre än en liter vatten. Is är alltså lättare än vatten, fast isen är hård.
            - - Det som är lättare än vatten flyter. Släpp en isbit i ett glas vatten, så ser du det. Isbiten guppar vid ytan.
            - - Men isen är bara lite lättare, så det mesta av den hamnar under ytan. Av ett **isberg** i havet syns ungefär en **tiondel**. Nio tiondelar ligger gömda under vattnet.
        - rubrik: Ord i texten
          rader:
            - - isberg
              - ett stort isblock som flyter i havet
            - - tiondel
              - en av tio lika stora delar
        - rubrik: "Bild: Isberget"
          rader:
            - - Isberget. Det flyter i havet. Ungefär en tiondel sticker upp över ytan. Resten ligger under.
        - rubrik: Sjön får ett lock
          rader:
            - - Is flyter, och det gör att den blir kvar överst när en sjö fryser. Den första isen bildas vid ytan, där vattnet möter den kalla luften. Den sjunker inte. Snart täcker den hela sjön som ett lock.
            - - Tänk om is sjönk som en sten. Då skulle den hamna på botten. Sjön skulle frysa från botten och inte få något lock.
            - - Locket gör nytta. Det skyddar vattnet under mot kylan, ungefär som ett täcke.
        - rubrik: "Bild: Sjön under isen"
          rader:
            - - Sjön under isen. Du ser sjön från sidan på vintern, också under isen. Siffrorna är avsnittens nummer.
        - rubrik: Livet under isen
          rader:
            - - Eftersom isen ligger som ett lock fryser inte vattnet längre ner. Under isen är sjön fortfarande en sjö.
            - - Kallast är vattnet precis under isen. Där är det noll grader. Varmast är det vid botten. Dit sjunker det tyngsta vattnet, och vatten är som tyngst vid ungefär fyra grader.
            - - Där nere klarar fiskarna och sjöns andra djur vintern. De har vatten att simma i, fast sjön ser frusen ut uppifrån.
        - rubrik: "Fakta: Vatten och is i siffror"
          rader:
            - - Vatten fryser
              - vid noll grader
            - - Vatten är som tyngst
              - vid ungefär fyra grader
            - - En liter is väger
              - ungefär 9 hekto. En liter vatten väger 10 hekto, alltså ett kilo.
            - - Av ett isberg syns
              - ungefär en tiondel
        - rubrik: "Fördjupning: Isen som minns"
          rader:
            - - Is kan också bli mycket gammal. På Antarktis har snö pressats ihop till is, lager på lager. Små bubblor av luft stängdes in när isen blev till.
            - - På en plats som heter Little Dome C har forskare borrat rakt ner i inlandsisen. Sverige är ett av länderna som är med i arbetet.
            - - I januari 2025 nådde de berget under isen, nästan tre kilometer ner. Den äldsta isen de fick upp är minst 1,2 miljoner år gammal. I bubblorna kan forskarna se hur luften var då. Isen minns, kan man säga.
        - rubrik: Visste du att …
          rader:
            - - Nästan 5 kilometer
              - tjock är isen på Antarktis där den är som tjockast. Hur lång tid tar det dig att gå så långt?
        - rubrik: Läs mer
          rader:
            - - SMHI berättar om isen på sjöar och älvar. Läs tillsammans med en vuxen.
              - https://www.smhi.se/kunskapsbanken/hydrologi/is-pa-sjoar-och-vattendrag
            - - Issäkerhetsrådet visar var isen är svag, och har fem frågor om is.
              - https://www.issakerhet.se/fakta-om-is/
            - - Stockholms universitet har bilder på isen som forskarna borrade upp. Texten är för vuxna.
              - https://www.su.se/nyheter/nyhetsartiklar/2026-04-28-12-miljoner-ar-gammal-is-analyseras-nu-i-europa
