ramar:
  rubrik: Texterna och materialet
  ovrigt: Bladen och korten
  vidEnheterna:
    - Kärnorna
  text:
    - Här står metodens texter, nivå för nivå, med lärarens sida före varje text och den ifyllda modellen efter. Varje tema börjar med en lärarhandledning, två sidor för den som vill läsa temats texter med hela klassen. Sedan kommer modellerna, var och en med en sida, ett exempel och tre blad, och sist bladen och korten.
  ramar:
    - rubrik: "Lärarhandledningarna: Så arbetar klassen med en text"
      text:
        - Den här sidan står först i varje lärarhandledning.
      delar:
        - rubrik: Läslektionen, omkring 40 minuter
          falt:
            - rubrik: Före lektionen
              text: Sätt ihop paren, så att den som läser mödosamt har en kamrat som kan läsa högt.
            - rubrik: |-
                Frågan
                0–⁠5 min
              text: "Första gången börjar du lektionen så här: ”När du inte förstår ett ord eller en mening skaver det. Stryk under det.” Läs sedan textens fråga medan eleverna har texten nedvänd. Var och en säger sin gissning till den bredvid, och du skriver några på tavlan. Eleverna vänder upp texten, och ni ser på rubriken, bilderna och mellanrubrikerna. Red ut orden före läsningen."
            - rubrik: |-
                Läs
                5–⁠35 min
              text: Du läser ingressen och avsnitt 1 högt. I de två första texterna tänker du högt där, med orden i raden Tänk högt, och säger kärnan själv och skriver den på ett ark. Paren läser sedan avsnitt 2, 3 och 4, ett i taget. En läser högt och den andra följer med i texten, och båda stryker under det som skaver. Vid nästa avsnitt byter de, men den som läser mödosamt följer med varje gång.
            - rubrik: Efter varje avsnitt
              text: "”Var skavde det?” och ”Vad har ni prövat?” Har avsnittet en bild: ”Var i bilden är vi nu?” Sedan säger var och en kärnan till den bredvid: vem eller vad avsnittet handlar om, och det viktigaste om det, med högst tio ord. Paret väljer den kärna som säger mest om hela avsnittet. Två eller tre par säger sin, klassen väljer en, och en elev skriver den på ett A4-ark som du sätter upp. Fråga: ”Hur hänger det ihop med det vi läste innan?” Blir tiden knapp läser du det sista avsnittet högt, och klassen säger kärnan direkt."
            - rubrik: |-
                Sist
                35–⁠40 min
              text: "En elev läser kärnorna i följd. Fråga: ”Vet vi mer nu?” Var och en säger till den bredvid vad hen nu tror är svaret, och ni jämför med gissningarna. Spara arken till modellektionen."
        - rubrik: Modellektionen, omkring 40 minuter
          falt:
            - rubrik: Före lektionen
              text: Rita textens modell tom på tavlan. Den ifyllda modellen vid texten visar ett möjligt resultat.
            - rubrik: |-
                Kärnorna
                0–⁠5 min
              text: Sätt upp arken i textens ordning, och en elev läser dem. Läs fördjupningen högt. Klassen säger fördjupningens kärna, och en elev skriver den på ett nytt ark.
            - rubrik: |-
                Modellen
                5–⁠20 min
              text: Modellen är ny, så du flyttar själv det första arket och säger varför. Sedan säger klassen var de andra hör hemma och varför, och du flyttar dem. Klassen namnger platserna, och raden Modellen har förslag.
            - rubrik: |-
                Orden
                20–⁠25 min
              text: Paren letar i texten efter orden som visar hur delarna hör ihop, och du skriver dem i modellen.
            - rubrik: |-
                Svaret
                25–⁠40 min
              text: "Var och en berättar texten ur modellen för den bredvid, som säger vilken kärna som inte kom med. Sedan skriver var och en två till fyra meningar som svar på textens fråga och läser dem för den bredvid. Raden Lyssna efter säger vad ett svar ska ha med. Saknas något: ”Vilken kärna svarar på det?”"
        - rubrik: De fem modellerna
          falt:
            - rubrik: Tankekartan
              text: Saken står i mitten, och varje del har ett eget fält.
            - rubrik: Tidslinjen
              text: Stegen står i tur och ordning längs en linje.
            - rubrik: Venndiagrammet
              text: Varje sak har en ring, och det som gäller båda står där ringarna går in i varandra. Handlar en kärna om en skillnad, gör ni två ark av den, ett i var ring.
            - rubrik: Kedjan
              text: Varje led är något som händer, och en pil visar vad det leder till.
            - rubrik: Problem och lösning
              text: Problemet och orsaken står till vänster, och lösningen och resultatet till höger.
        - rubrik: När det skaver
          falt:
            - rubrik: Ett sätt i taget
              text: "Skriv de fyra sätten på ett A4-ark första gången och låt det sitta uppe: läs om meningen och den före och efter; leta efter en ledtråd i marginalen, i bilden eller i ett exempel; dela ordet; fråga en kamrat. Paren prövar ett sätt i taget, uppifrån. Hjälper inget, förklarar du kort, och en elev säger det med egna ord."
            - rubrik: Inget understruket
              text: "Peka på ett ställe som brukar skava, som det i raden Det brukar skava, och säg: ”Säg det med egna ord.” Går det inte, har eleven hittat något som skaver, och hen stryker under det."
            - rubrik: Kärnan håller inte
              text: "Kan eleven inte säga den: ”Var tappade du tråden?” Är den för lång: ”Vad kan vi stryka och ändå förstå?” Är den en rolig detalj: ”Är det viktigt eller intressant? Peka på meningarna som handlar om det.”"
            - rubrik: Mer stöd
              text: Lyssna på några par i varje runda, och läs svaren. Den som inte förstår texten uppläst behöver annat stöd först. Den som förstår den uppläst men efter tre texter inte kan säga en kärna kan behöva Faktatextsamtal i grupp hos en speciallärare, också om hen läser orden mödosamt.
    - rubrik: "Lärarhandledning: Bas, Vatten"
      tema: Vatten
      text:
        - Temat Vatten har en faktatext för var och en av de fem strukturerna, som brukar passa i åk 4–5. Varje vecka har klassen en läslektion och en modellektion om veckans text, så temat tar fem veckor. Varje elev har texten, en penna och papper till svaret. Du har tavlan, magneter, A4-ark och en tjock tuschpenna.
      delar:
        - rubrik: "1 Vattenplaneten: Tankekartan"
          falt:
            - rubrik: Frågan
              text: Om allt vatten på jorden rymdes i hundra hinkar, hur många kunde vi dricka ur?
            - rubrik: Ord före
              text: sötvatten (inte salt, inte sött) · grundvatten (grund är marken, inte grunt)
            - rubrik: Tänk högt
              kursiv: true
              text: "”71 procent av ytan, och nästan allt vatten i haven. Är det samma sak? Jag läser om. Nej: det ena är ytan, det andra är var vattnet finns. Vem eller vad? Havet. Det viktigaste? Där finns nästan allt vatten, och det är salt. Det om törsten är spännande, men det står bara i sista meningen.”"
            - rubrik: Det brukar skava
              text: "”en blöt svamp”: grundvattnet fyller små hålrum i marken och är ingen sjö (avsnitt 3)"
            - rubrik: Modellen
              text: "havet: ”nästan allt” · isen: ”det mesta” · grundvattnet: ”nästan allt annat” · sjöar och floder: ”kvar blir”. I mitten står jordens vatten. Fördjupningens kärna blir ett femte fält, luften och det levande, med orden ”två ställen till”."
            - rubrik: Lyssna efter
              text: knappt en hink · det salta och det frusna går bort · det vi kan dricka finns i marken och i sjöar och floder
        - rubrik: "2 Från sjö till kran: Tidslinjen"
          falt:
            - rubrik: Frågan
              text: Vad händer med vattnet på vägen från sjön till din kran, och vart tar det vägen efteråt?
            - rubrik: Ord före
              text: "renas (görs rent, inte bara klart) · vattenverk (verk: där man gör något) · tryck (vattnet pressar, ingen knapp)"
            - rubrik: Tänk högt om
              text: "råvatten: ”Rå, som rå potatis? Jag läser vidare. Det är vatten som ingen har renat än. Vem eller vad? Vattnet. Det viktigaste? Det hämtas ur en sjö eller ur marken och är inte rent än.” (avsnitt 1)"
            - rubrik: Det brukar skava
              text: "”Det ger tryck”: ”Det” syftar på vattnet i tornet, som är tungt och pressar nedåt (avsnitt 3)"
            - rubrik: Modellen
              text: "råvattnet: ”först” · vattenverket: ”sedan” · tornet och rören: ”efter det” · efter kranen: ”till sist”. Fördjupningens kärna hör till vattenverket, för den visar vad som händer när ett steg i reningen saknas."
            - rubrik: Lyssna efter
              text: renas i vattenverket · tornet trycker ut det till kranen · avloppet, reningsverket och naturen igen
        - rubrik: "3 Snö och hagel: Venndiagrammet"
          falt:
            - rubrik: Frågan
              text: Vad har snö och hagel gemensamt, och vad skiljer dem åt?
            - rubrik: Ord före
              text: bymoln (by är en skur, ingen ort) · flytande (rinnande, inte som flyter ovanpå) · iskristall (en pytteliten isbit)
            - rubrik: Det brukar skava
              text: "”ändå flytande”: dropparna har inte frusit, fast de är kallare än noll grader (avsnitt 3)"
            - rubrik: Modellen
              text: "båda: ”både snö och hagel” · bara snö: ”men sedan blir de olika” · bara hagel: ”däremot”. Kärnan från avsnitt 4 delar ni på två ark, ett för snö och ett för hagel, med orden ”medan” och ”haglet behöver däremot”. Fördjupningens kärna hör till hagel."
            - rubrik: Lyssna efter
              text: båda börjar som iskristaller i moln · snön blir flingor, haglet växer i bymoln · snö på vintern, hagel mest vår och sommar
        - rubrik: "4 Därför flyter is: Kedjan"
          falt:
            - rubrik: Frågan
              text: Fryser en sjö från ytan eller från botten, och varför?
            - rubrik: Ord före
              text: ämne (det saker består av, inte skolämne) · stelna (bli fast, inte stel i kroppen) · lättare (lika stor bit väger mindre)
            - rubrik: Det brukar skava
              text: "”som tyngst”: vatten är allra tyngst vid fyra grader och sjunker, så botten blir varmast (avsnitt 4)"
            - rubrik: Modellen
              text: "lättare: ”därför” · locket: ”det gör att” · under isen: ”eftersom”. Kedjan börjar med mer plats, ur avsnitt 1. Fördjupningens kärna står bredvid kedjan, eftersom den handlar om is men inte är ett led."
            - rubrik: Lyssna efter
              text: från ytan · is är lättare och flyter · locket skyddar vattnet under
        - rubrik: "5 En kran åt alla: Problem och lösning"
          falt:
            - rubrik: Frågan
              text: Varför har inte alla rent vatten hemma, och vad kan man göra åt det?
            - rubrik: Ord före
              text: miljard (tusen miljoner, inte en miljon) · rent vatten (går att dricka, inte bara klart) · landsbygd (utanför städerna, inget eget land)
            - rubrik: Det brukar skava
              text: på landsbygden har ”sex av tio” rent vatten, men i hela världen saknar ”en av fyra” det (avsnitt 4)
            - rubrik: Modellen
              text: "en av fyra: ”problemet är” · smutsigt, långt borta: ”beror oftast på” · brunn, rör, toalett: ”en lösning är” · fler får vatten: ”har lett till”. Fördjupningens kärna visar att problemet kostar tid. Dra ett streck från den till problemet."
            - rubrik: Lyssna efter
              text: smutsigt eller långt borta · brunnar, rör, rening och toaletter · fler får vatten, inte alla än
    - rubrik: "Lärarens sida: Bas, text 1, Vattenplaneten"
      text:
        - Nästan allt vatten på jorden är salt eller fruset, och det vi kan dricka är en mycket liten del. Texten är en beskrivning, och modellen är Tankekartan, blad 1. I vecka 1 tänker du högt i avsnitt 1.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Om allt vatten på jorden rymdes i hundra hinkar, hur många kunde vi dricka ur?
            - rubrik: Ord före läsningen
              text: sötvatten (inte salt, inte sött) · grundvatten (grund är marken, inte grunt)
            - rubrik: Tänk högt
              kursiv: true
              text: "”71 procent av ytan, och nästan allt vatten i haven. Är det samma sak? Jag läser om. Nej: det ena är ytan, det andra är var vattnet finns. Vem eller vad? Havet. Det viktigaste? Där finns nästan allt vatten, och det är salt. Det om törsten är spännande, men det står bara i sista meningen.”"
            - rubrik: 1 Havet
              text: |-
                Red ut: två tredjedelar (två av tre lika stora delar, omkring 67 av 100) · ytan är en sak, mängden en annan
                Lyssna efter: nästan allt vatten · salt
                Lockar: 71 procent, törsten. ”Vad säger avsnittet om vattnet i haven?”
                Bilden: det blå på klotet. Bollen är allt vatten samlat
            - rubrik: 2 Isen
              text: |-
                Red ut: glaciär, som förklaras i nästa mening
                Lyssna efter: det mesta sötvattnet · fruset
                Lockar: att det inte är sött. ”Var finns det mesta sötvattnet?”
                Sambandet: ”inte heller”: går inte att dricka, som saltvattnet
                Bilden: de två ljusa hinkarna i Hundra hinkar
            - rubrik: 3 Grundvattnet
              text: |-
                Red ut: ”Borrar man” (om man borrar) · svampen: vatten i hålrummen
                Lyssna efter: resten av sötvattnet · nere i marken
                Lockar: en miljon människor med egen brunn. ”Var finns det sötvattnet?”
                Sambandet: ”Nästan allt annat sötvatten”, alltså det som inte är fruset
                Bilden: under den streckade linjen är hålrummen fyllda
            - rubrik: 4 Sjöar och floder
              text: |-
                Red ut: ”Bara i Sverige” (Sverige räknat för sig) · drygt och knappt
                Lyssna efter: vattnet vi ser · en mycket liten del
                Lockar: 100 000 sjöar. ”Vad säger texten efter ordet Men?”
                Sambandet: ”Kvar blir”, det som är över av sötvattnet
                Bilden: droppen sist i Hundra hinkar. Siffrorna är avsnittens nummer
            - rubrik: Om någon frågar
              text: Varför är bollen så liten? Havet är ett tunt lager mot jordens storlek. Blir man törstig av saltvatten? Ja, kroppen gör sig av med saltet och förlorar då mer vatten än man drack. Går isen att dricka om den smälter? Ja, den är sötvatten.
        - rubrik: "Modellpasset: Tankekartan för Vattenplaneten"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: ånga, i marginalen · ”till stor del” (mycket, inte allt)
                Lyssna efter: två ställen till · lite vatten
                Lockar: 60 procent, som gäller en kropp. ”Vilka två ställen?”
                Sambandet: ”på två ställen till”, luften och allt som lever
            - rubrik: Modellen
              text: "I vecka 1 lägger du den första post-it-lappen och skriver det första ordet. Tankekartan, blad 1. Fälten: havet, isen, grundvattnet, och sjöar och floder. Fråga var fördjupningens lapp hör hemma. Gruppen lägger den på En lapp till, som blir ett femte fält med namnet Luften och det levande."
            - rubrik: Orden
              text: |-
                nästan allt (havet) · det mesta (isen) · nästan allt annat (grundvattnet) · kvar blir (sjöar och floder)
                Utan flik: gruppen skriver ”två ställen till” vid En lapp till.
            - rubrik: Svaret
              text: |-
                Lyssna efter: knappt en hink · det salta och det frusna går bort · det vi kan dricka finns i marken och i sjöar och floder
                Så kan det låta: ”Knappt en. Nästan allt vatten är salt, och det mesta sötvattnet är is. Det vi kan dricka finns i marken och i sjöar och floder.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret håller utan sjöarna som saknar namn."
            - rubrik: Samtala
              text: "Varför börjar författaren i rymden? Varför räknar hen i hinkar? Ett svar: det blå lurar oss, och hinkarna visar hur lite av vattnet som går att dricka."
    - rubrik: "Bas, text 1: Vattenplaneten"
      tema: Vatten
      text:
        - Vatten · text 1 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Vattenplaneten
          rader:
            - - Från rymden lyser jorden blå. Det mesta av ytan är vatten, men det mesta av vattnet går inte att dricka. Om allt vatten på jorden rymdes i hundra hinkar, hur många kunde vi dricka ur?
        - rubrik: Siffran
          rader:
            - - 71 %
              - av jordens yta är täckt av vatten.
        - rubrik: "Bild: Jorden och allt dess vatten"
          rader:
            - - Jorden och allt dess vatten. Den lilla blå bollen är allt vatten på jorden. Den är 1 385 kilometer bred, lite kortare än Sverige är långt.
        - rubrik: Havet har nästan allt vatten
          rader:
            - - Snurra på en jordglob och sätt ner fingret. Oftast hamnar det i blått. Vatten täcker 71 **procent** av jordens yta. Det är mer än två tredjedelar.
            - - Nästan allt det blå är hav. I haven finns också nästan allt vatten som finns på jorden. Men havsvatten är **saltvatten**, och det går inte att dricka. Den som dricker saltvatten blir bara törstigare.
        - rubrik: Ord i texten
          rader:
            - - procent
              - "delar av hundra: 71 av 100"
            - - saltvatten
              - vatten med mycket salt i, som i havet
        - rubrik: Vattnet som har frusit
          rader:
            - - Vatten som inte är salt kallas **sötvatten**. Det smakar inte sött. Det heter så för att det inte är salt.
            - - Men det mesta sötvattnet kan du inte heller dricka. Det är fruset. På Antarktis, runt Sydpolen, och på Grönland ligger is som är flera kilometer tjock. Den kallas **inlandsis**. Högt uppe i bergen finns också glaciärer. Det är is som ligger kvar hela året.
        - rubrik: Ord i texten
          rader:
            - - sötvatten
              - vatten som inte är salt
            - - inlandsis
              - ett jättelikt täcke av is över land
        - rubrik: Vattnet under dina fötter
          rader:
            - - Nästan allt annat sötvatten finns där du aldrig ser det. Det ligger nere i marken och kallas **grundvatten**.
            - - När det regnar sjunker en del av vattnet ner genom marken. Längre ner fyller det alla små hålrum mellan sandkornen och alla sprickor i berget. Grundvatten är alltså ingen sjö under marken. Det liknar mer en blöt svamp.
            - - Borrar man en **brunn** kan man pumpa upp grundvattnet. I Sverige dricker mer än en miljon människor vatten ur en egen brunn.
        - rubrik: Ord i texten
          rader:
            - - grundvatten
              - vatten som fyller hålrummen nere i marken
            - - brunn
              - ett hål i marken där man hämtar upp vatten
        - rubrik: "Bild: Vatten i marken"
          rader:
            - - Vatten i marken. Under den streckade linjen är alla hålrum fyllda med vatten.
        - rubrik: Vattnet du ser
          rader:
            - - Kvar blir sjöarna och floderna. Det är det vattnet vi ser varje dag. Vi badar i det, och många städer hämtar sitt dricksvatten där. Därför är det lätt att tro att det finns mycket av det.
            - - Men sjöar och floder är en mycket liten del av jordens vatten. Bara i Sverige finns nära 100 000 sjöar. Ändå är alla sjöar i hela världen bara en droppe bredvid haven.
        - rubrik: "Fakta: Jordens vatten i 100 hinkar"
          rader:
            - - Saltvatten
              - drygt 97 hinkar
            - - Is
              - knappt 2 hinkar
            - - Grundvatten
              - knappt 1 hink
            - - Sjöar med sötvatten
              - mindre än ett halvt glas
            - - Floder
              - en halv tesked
        - rubrik: "Bild: Hundra hinkar"
          rader:
            - - Hundra hinkar. Ungefär så blir det om man häller allt vatten på jorden i hinkarna. Siffrorna är avsnittens nummer.
        - rubrik: "Fördjupning: Vatten i luften, och i dig"
          rader:
            - - Lite vatten finns på två ställen till. Det ena är luften. Där svävar vattnet som moln och som **ånga**. Av de hundra hinkarna skulle allt vatten i luften ändå inte fylla en matsked.
            - - Det andra stället är allt som lever. Växter, djur och människor består till stor del av vatten. En vuxen människa är upp till 60 procent vatten. Du bär alltså själv på en liten del av jordens vatten.
        - rubrik: Ord i texten
          rader:
            - - ånga
              - vatten som har blivit gas och svävar i luften
        - rubrik: Visste du att …
          rader:
            - - Nästan 40 000
              - sjöar i Sverige har inget namn. Vad skulle du döpa en av dem till?
        - rubrik: Läs mer
          rader:
            - - SGU berättar om vattnet i marken. Sidan finns också på lättläst svenska.
              - https://www.sgu.se/om-geologi/vatten/
            - - "SMHI har siffror om Sveriges sjöar: de största och de djupaste."
              - https://www.smhi.se/kunskapsbanken/hydrologi/sveriges-sjoar
            - - USGS visar vattnets kretslopp i en stor bild, med text på svenska.
              - https://www.usgs.gov/special-topics/water-science-school/science/vattnets-kretslopp-water-cycle-schools-swedish
    - rubrik: "Modellen: Bas, text 1, Vattenplaneten"
      tema: Vatten
      text:
        - Tankekartan, blad 1, ifylld för Vattenplaneten.
      delar:
        - rubrik: Frågan och svaret
          falt:
            - rubrik: Textens fråga
              text: Om allt vatten på jorden rymdes i hundra hinkar, hur många kunde vi dricka ur?
            - rubrik: Lyssna efter
              text: knappt en hink · det salta och det frusna går bort · det vi kan dricka finns i marken och i sjöar och floder
            - rubrik: Så kan svaret låta
              text: Knappt en. Nästan allt vatten är salt, och det mesta sötvattnet är is. Det vi kan dricka finns i marken och i sjöar och floder.
    - rubrik: "Lärarens sida: Bas, text 2, Från sjö till kran"
      text:
        - Vattnet hämtas i naturen, renas i vattenverket, trycks ut till kranen och renas en gång till innan det går tillbaka till naturen. Texten är byggd i tidsordning, och modellen är Tidslinjen, blad 1. I vecka 2 tänker du högt i avsnitt 1.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Vad händer med vattnet på vägen från sjön till din kran, och vart tar det vägen efteråt?
            - rubrik: Ord före läsningen
              text: "renas (görs rent, inte bara klart) · vattenverk (verk: där man gör något) · tryck (vattnet pressar, ingen knapp)"
            - rubrik: Tänk högt
              kursiv: true
              text: "”Råvatten. Rå, som rå potatis? Jag läser vidare: vatten som ingen har renat än. Men det kan se klart ut? Jag läser om. Bakterierna syns inte. Vem eller vad? Vattnet. Det viktigaste? Det hämtas ur en sjö eller ur marken och är inte rent än. Det om badsjön är spännande, men det är en detalj.”"
            - rubrik: 1 Råvattnet
              text: |-
                Red ut: ”orter” (platser där folk bor) · ”Ändå”: fast det ser klart ut
                Lyssna efter: ur sjö eller mark · inte renat än
                Lockar: sjön du badar i. ”Var hämtas vattnet, och vad kallas det då?”
                Bilden: Sjön i Vattnets väg, vid siffran 1
            - rubrik: 2 Vattenverket
              text: |-
                Red ut: ämne (något man blandar i, inte skolämne) · ”Det tar död på”: ljuset eller kloret
                Lyssna efter: vattenverket · renas i flera steg · blir dricksvatten
                Lockar: ljuset som dödar bakterier. ”Vad har vattnet blivit när stegen är klara?”
                Sambandet: ”Sedan”: efter att råvattnet har hämtats
                Bilden: Inne i vattenverket, klumparna som sjunker och sanden
            - rubrik: 3 Tornet och rören
              text: |-
                Red ut: ”Det ger tryck”: det tunga vattnet i tornet · ”resten” (att få fram vattnet)
                Lyssna efter: vattentornet · tryck i rören · fram till kranen
                Lockar: rören under gatan. ”Varför ska vattnet upp i ett torn?”
                Sambandet: ”Efter det”: när vattnet har blivit dricksvatten
                Bilden: I Vattnets väg står tornet högst, och rören går under gatan
            - rubrik: 4 Efter kranen
              text: |-
                Red ut: ”skilda från” (inte ihop med) · ”rent nog” (tillräckligt rent)
                Lyssna efter: avloppet · renas i reningsverket · tillbaka till naturen
                Lockar: det du spolar ner. ”Vart tar vattnet vägen efter reningsverket?”
                Sambandet: ”Till sist”: när du har använt vattnet
                Bilden: Avloppet och reningsverket i Vattnets väg, och pilen tillbaka
            - rubrik: Om någon frågar
              text: Vilket ljus är det? UV-ljus. Det steget sattes in i Östersund i december 2010. Vad hette parasiten? Cryptosporidium. Klor biter dåligt på den. Var avloppsvattnet renat? Troligen inte. Felkopplade rör och överfulla ledningar kan ha släppt ut orenat vatten. Varför säger bladet 200 liter? 140 liter är vattnet hemma. Med industrin och annat blir det omkring 190, enligt Svenskt Vatten.
        - rubrik: "Modellpasset: Tidslinjen för Från sjö till kran"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: ”just den” (den sortens parasit) · ”smittade” (fick parasiten i sig)
                Lyssna efter: ett steg saknades · parasiten kom igenom · många blev smittade
                Lockar: att alla kokade vattnet. ”Varför kom parasiten ända fram till kranarna?”
                Sambandet: ”varför varje steg behövs”: stegen i vattenverket, avsnitt 2
            - rubrik: Modellen
              text: "Lägg först fram gruppens tankekarta från vecka 1 och fråga: ”Vad kommer först här?” Den visar delar men ingen ordning. Ta sedan fram Tidslinjen, blad 1. Gruppen lägger fördjupningens post-it-lapp på En lapp till och kallar platsen Hör till vattenverket. Lappen visar vad som händer när ett steg i vattenverket saknas."
            - rubrik: Orden
              text: först (råvattnet) · sedan (vattenverket) · efter det (tornet och rören) · till sist (efter kranen)
            - rubrik: Svaret
              text: |-
                Lyssna efter: renas i vattenverket · tornet trycker ut det till kranen · avloppet, reningsverket och naturen igen
                Så kan det låta: ”Vattnet hämtas ur sjön och renas i vattenverket. Efter det pumpas det upp i vattentornet och trycks ut till kranen. Till sist rinner det ner i avloppet, renas igen och släpps ut i naturen.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret håller utan tandborstningen."
            - rubrik: Samtala
              text: "Varför börjar varje avsnitt med ett tidsord? Varför berättar författaren om Östersund? Ett svar: tidsorden håller ordning på vattnets väg, och Östersund visar varför inget steg i reningen får saknas."
    - rubrik: "Bas, text 2: Från sjö till kran"
      tema: Vatten
      text:
        - Vatten · text 2 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Från sjö till kran
          rader:
            - - Du vrider på kranen, och vattnet kommer direkt. Men bakom kranen finns en lång väg med flera stopp. Vad händer med vattnet på vägen från sjön till din kran, och vart tar det vägen efteråt?
        - rubrik: Siffran
          rader:
            - - 140 liter
              - Ungefär så mycket vatten använde en person i Sverige hemma varje dygn år 2022. Det är fjorton hinkar på tio liter.
        - rubrik: "Bild: Vattnets väg"
          rader:
            - - Vattnets väg. Följ vattnet från sjön till kranen och tillbaka. Siffrorna är avsnittens nummer.
        - rubrik: Ur sjön eller ur marken
          rader:
            - - Först hämtas vattnet i naturen. Många städer tar det ur en sjö. Kanske är det samma sjö som du badar i. Andra orter pumpar upp grundvatten ur marken.
            - - Vattnet kallas nu **råvatten**. Det är vatten som ingen har renat än.
            - - Råvatten kan se alldeles klart ut. Ändå kan det finnas bakterier i det. De är så små att du inte ser dem. Därför måste vattnet renas innan du dricker det.
        - rubrik: Ord i texten
          rader:
            - - råvatten
              - vatten som inte har renats än
        - rubrik: I vattenverket
          rader:
            - - Sedan kommer råvattnet till ett vattenverk. Där ska det bli dricksvatten, och det sker i flera steg. Vatten ur en sjö renas ofta så här.
            - - En sil fångar fiskar och växter. Nästa steg heter **fällning**. Då blandar man i ett ämne som får små korn av smuts att klumpa ihop sig. Klumparna blir tunga och sjunker till botten.
            - - Vattnet rinner vidare genom ett filter av sand, som fångar ännu mer smuts. Innan vattnet lämnar vattenverket lyser man på det med ett särskilt ljus, eller blandar i klor. Det tar död på bakterier som kan göra dig sjuk.
        - rubrik: Ord i texten
          rader:
            - - fällning
              - smuts klumpas ihop så att den sjunker
        - rubrik: "Bild: Inne i vattenverket"
          rader:
            - - Inne i vattenverket. Vattnet går från vänster till höger. Titta på klumparna som sjunker och på sanden som vattnet rinner igenom.
        - rubrik: Tornet och rören
          rader:
            - - Efter det pumpas dricksvattnet ofta upp i ett vattentorn. Många har sett ett sådant torn utan att veta vad det är. Där uppe står vattnet högre än hustaken.
            - - Allt vatten i tornet är tungt och pressar nedåt. Det ger **tryck** i rören. Rören ligger nere i marken, under gatan där du går. De leder fram till husen och ända till din kran.
            - - När du öppnar kranen pressar trycket ut vattnet. Du behöver bara vrida. Tornet gör resten.
        - rubrik: Ord i texten
          rader:
            - - tryck
              - hur hårt något pressar
        - rubrik: Efter kranen
          rader:
            - - Till sist rinner vattnet ner i avloppet. Det händer när du har duschat, diskat eller spolat i toaletten. Nu är vattnet smutsigt. Det går i egna rör, skilda från rören med dricksvatten.
            - - Avloppsrören leder till ett reningsverk. Där renas vattnet en gång till. När det är rent nog släpps det ut i naturen igen, till exempel i en sjö. Där kan resan börja om.
        - rubrik: "Fakta: Lätta att blanda ihop"
          rader:
            - - Vattenverket
              - gör råvatten till dricksvatten. Det kommer före kranen.
            - - Reningsverket
              - renar avloppsvatten. Det kommer efter kranen.
            - - Rören
              - Dricksvatten och avlopp har var sina rör.
        - rubrik: "Fördjupning: Vintern då Östersund kokade vattnet"
          rader:
            - - I november 2010 hände något i Östersund som visar varför varje steg behövs. En **parasit** hade troligen följt med avloppsvatten ut i Storsjön. Där hämtar staden sitt råvatten. Vattenverket saknade ett steg som kunde stoppa just den parasiten. Den kom med vattnet ända ut i kranarna.
            - - Omkring 27 000 människor blev smittade. Aldrig förr hade så många i Sverige blivit smittade av sitt dricksvatten. I tolv veckor fick alla i staden koka sitt vatten innan de drack det.
        - rubrik: Ord i texten
          rader:
            - - parasit
              - liten varelse som lever i andras kroppar
        - rubrik: Visste du att …
          rader:
            - - 100 liter
              - vatten om dagen kan en familj på fyra spara som mest, bara genom att stänga kranen medan de borstar tänderna. Hur gör du?
        - rubrik: Läs mer
          rader:
            - - Stockholm Vatten och Avfall har tecknade filmer om vattnets väg till kranen.
              - https://www.stockholmvattenochavfall.se/skolsajten/filmer-om-vatten-avlopp-och-sopor/
            - - Samma bolag har ett lättläst blad om kranvatten, för mellanstadiet.
              - https://www.stockholmvattenochavfall.se/globalassets/skolsajten/pdf/ak456/faktablad_vatten4-6.pdf
            - - Bladet om avloppsvatten följer vattnet från toaletten ut i havet.
              - https://www.stockholmvattenochavfall.se/globalassets/skolsajten/pdf/ak456/faktablad_avlopp4-6.pdf
