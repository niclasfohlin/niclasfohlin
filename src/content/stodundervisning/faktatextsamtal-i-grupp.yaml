    text: I läspassen har varje par kortet mellan sig. Ett blad räcker till två par under hela perioden. Klipp isär korten och plasta gärna in dem.
    alt: "Två likadana kort att klippa isär, ett till varje par. Kortet När det skaver har raden Pröva ett sätt i taget. Sedan kommer fyra sätt med en pil emellan, i den ordning paret prövar dem: Läs om (meningen, den före och efter), Leta efter en ledtråd (marginalen, bilden, ett exempel), Dela ordet (vatten + torn) och Fråga en kamrat (”Vad tror du?”)."
