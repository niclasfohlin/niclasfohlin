    - rubrik: "Lärarens sida: Bas, text 3, Snö och hagel"
      text:
        - Snö och hagel börjar båda som iskristaller i moln, men de bildas på olika sätt, ser olika ut och faller på olika årstider. Texten jämför två saker, och modellen är Venndiagrammet, blad 1. I vecka 3 har två elever i taget jobbkorten från avsnitt 2.
      delar:
        - rubrik: "Läspasset: de fyra avsnitten"
          falt:
            - rubrik: Textens fråga
              text: Vad har snö och hagel gemensamt, och vad skiljer dem åt?
            - rubrik: Ord före läsningen
              text: bymoln (by är en skur, ingen ort) · flytande (rinnande, inte som flyter ovanpå) · iskristall (en pytteliten isbit)
            - rubrik: 1 Båda börjar i ett moln
              text: |-
                Red ut: ”Samma sak” (också kornet smälter) · ”Den” i sista stycket: iskristallen
                Lyssna efter: fruset vatten · börjar som iskristall · i ett moln
                Lockar: sex kanter. ”Vad är lika för snö och hagel?”
                Bilden: Iskristallen i båda molnen, vid siffran 1
            - rubrik: 2 Så blir det snö
              text: |-
                Red ut: ”blir de olika”: snön och haglet · ”klumpar ihop sig” (fastnar i varandra)
                Lyssna efter: snöstjärnor · klumpar ihop sig · mjuk, lätt flinga
                Lockar: hundra snöstjärnor. ”Hur blir iskristallen till en snöflinga?”
                Sambandet: ”Men sedan blir de olika”: från det lika till skillnaderna
                Bilden: Det vänstra molnet, från kristall till snöflinga
            - rubrik: 3 Så blir det hagel
              text: |-
                Red ut: ”ändå flytande”: dropparna har inte frusit · ”Det” i tredje stycket: kornet
                Lyssna efter: bymoln med åska · droppar fryser fast · växer tills det faller
                Lockar: flytande under noll grader. ”Vad får kornet att växa i bymolnet?”
                Sambandet: ”däremot”: haglet ställs mot snön i avsnitt 2
                Bilden: I det högra molnet är pilarna uppåt vindarna, och kornet växer
            - rubrik: 4 När de faller
              text: |-
                Red ut: ”skiljer dem åt” (gör dem olika) · ”Sådana moln”: bymolnen
                Lyssna efter: snö på vintern, behöver kyla · hagel vår och sommar, behöver bymoln
                Lockar: flingor som blir regn. ”Vad behöver snön, och vad behöver haglet?”
                Sambandet: ”Också årstiden skiljer dem åt”: en skillnad till
            - rubrik: Om någon frågar
              text: Vad kallas droppar som är flytande under noll grader? Underkylda. Har bymolnet ett annat namn? Cumulonimbus. Hur kan det vara kallt i molnet på sommaren? Luften blir omkring 0,7 grader kallare för var hundrade meter uppåt. Var i Bangladesh föll det tyngsta kornet? I Gopalganj, den 14 april 1986.
        - rubrik: "Modellpasset: Venndiagrammet för Snö och hagel"
          falt:
            - rubrik: Fördjupningen
              text: |-
                Red ut: ”starka nog att bära” (orkar hålla uppe) · ”två hekto” (200 gram)
                Lyssna efter: ishagel, de stora · ovanliga i Sverige · kraftig åska
                Lockar: kornet stort som ett äpple. ”När kommer de riktigt stora hagelkornen?”
                Sambandet: ”än en snöflinga”: haglet jämförs med snön igen
                Bilden: Kornet från Ramnäs bredvid äpplet, i Så stora kan hagel bli
            - rubrik: Modellen
              text: "Lägg först fram gruppens tankekarta från vecka 1 och fråga: ”Vad ska stå i mitten?” Texten jämför två saker, och kartan visar inte vad som är lika och olika. Ta sedan fram Venndiagrammet, blad 1. Avsnitt 4 ger två post-it-lappar: i modellpasset delar gruppen avsnittets kärna på två lappar, en för var sida. Gruppen lägger fördjupningens lapp på En lapp till och kallar platsen Hör till hagel."
            - rubrik: Orden
              text: |-
                både snö och hagel (båda) · men sedan blir de olika (bara snö) · däremot (bara hagel)
                Utan flik: gruppen skriver ”medan” och ”haglet behöver däremot” vid lapparna från avsnitt 4.
            - rubrik: Svaret
              text: |-
                Lyssna efter: båda börjar som iskristaller i moln · snön blir flingor, haglet växer i bymoln · snö på vintern, hagel mest vår och sommar
                Så kan det låta: ”Båda är fruset vatten och börjar som iskristaller i ett moln. Snön klumpar ihop sig till flingor och faller på vintern, medan haglet växer i höga bymoln och faller mest på våren och sommaren.”
            - rubrik: Rutan
              text: "Visste du att: intressant, för svaret håller utan kilot i Bangladesh."
            - rubrik: Samtala
              text: "Varför börjar författaren med det som är lika? Varför har snö och hagel samma punkter i samma ordning? Ett svar: då syns skillnaderna mitt emot varandra."
    - rubrik: "Bas, text 3: Snö och hagel"
      tema: Vatten
      text:
        - Vatten · text 3 av 5
      delar:
        - rubrik: Till läraren
          falt:
            - rubrik: Hör till
              text: Lärarens sida till texten.
      listor:
        - rubrik: Snö och hagel
          rader:
            - - Det smattrar mot rutan, och vita iskulor studsar på marken. Hagel är is från himlen, precis som snö, men det ser helt annorlunda ut. Vad har snö och hagel gemensamt, och vad skiljer dem åt?
        - rubrik: Siffran
          rader:
            - - "100"
              - Ungefär så många snöstjärnor sitter ihop i en vanlig snöflinga.
        - rubrik: Båda börjar i ett moln
          rader:
            - - Fånga en snöflinga i handen, så smälter den till en droppe. Samma sak händer med ett hagelkorn. Både snö och hagel är fruset vatten.
            - - Båda börjar också på samma sätt. Högt uppe i ett moln är det kallt. Där bildas små **iskristaller**, och de har oftast sex kanter.
            - - En iskristall kan bli början till en snöflinga. Den kan också bli början till ett hagelkorn. Det beror på vad som händer med den i molnet.
        - rubrik: Ord i texten
          rader:
            - - iskristall
              - en pytteliten bit is, oftast med sex kanter
        - rubrik: "Bild: Snöns väg och haglets väg"
          rader:
            - - Snöns väg och haglets väg. Båda börjar som en iskristall. Till vänster blir den början till en snöflinga. Till höger virvlar den runt i bymolnet och blir ett hagelkorn.
        - rubrik: Så blir det snö
          rader:
            - - Men sedan blir de olika. Snö blir det när iskristallen växer till en liten **snöstjärna**. Den ser ut som en stjärna av is. Ibland landar en ensam snöstjärna på din vante.
            - - Snöstjärnorna klumpar ihop sig med varandra. Så bildas en snöflinga. I en vanlig snöflinga sitter omkring hundra snöstjärnor ihop.
            - - En snöflinga är mjuk och lätt. Den singlar sakta mot marken och landar utan ett ljud.
        - rubrik: Ord i texten
          rader:
            - - snöstjärna
              - en iskristall som har vuxit till en stjärna
        - rubrik: Så blir det hagel
          rader:
            - - Hagel bildas däremot i ett **bymoln**. Det är ett högt moln som också kan ge åska.
            - - I bymolnet finns vattendroppar som är kallare än noll grader men ändå flytande. När iskristallen krockar med en sådan droppe fryser droppen fast på den. Nu har kristallen blivit ett litet korn, och kornet växer för varje ny droppe.
            - - Starka vindar blåser uppåt i molnet och håller kornet svävande. Det virvlar upp och ner och blir större och större. Till slut är det för tungt. Då faller det som en kula av is.
        - rubrik: Ord i texten
          rader:
            - - bymoln
              - högt moln som kan ge åska och hagel
        - rubrik: När de faller
          rader:
            - - Också årstiden skiljer dem åt. Snö faller på vintern, medan hagel faller mest på våren och sommaren.
            - - Snön behöver kyla ända ner till marken. Annars smälter flingorna på vägen och blir regn.
            - - Haglet behöver däremot ett bymoln. Sådana moln växer oftast när solen har värmt marken och den varma luften stiger fort uppåt. Högst upp i molnet är det ändå kallt. Därför kan det hagla en varm sommardag.
        - rubrik: "Fakta: Tre slags hagel"
          rader:
            - - Snöhagel
              - små, vita korn som lätt går sönder. Faller mest på våren
            - - Småhagel
              - små, hårda korn av is. Faller mest på sommaren
            - - Ishagel
              - korn större än fem millimeter. Ovanligt i Sverige, kommer oftast vid kraftig åska
        - rubrik: "Bild: Så stora kan hagel bli"
          rader:
            - - Så stora kan hagel bli. Kornet från Ramnäs var 7 centimeter åt ena hållet och 8 åt det andra. Kornen i Näshulta var omkring 5 centimeter. Bilden är förminskad.
        - rubrik: "Fördjupning: De största hagelkornen"
          rader:
            - - Ett hagelkorn kan bli mycket tyngre än en snöflinga. Korn som är större än fem millimeter kallas ishagel. De är ovanliga i Sverige och kommer oftast när åskan är kraftig. Då är vindarna i molnet starka nog att bära tunga korn.
            - - Det största hagelkorn som någon har sett i Sverige föll i Ramnäs i Västmanland i juli 1953. Det vägde omkring två hekto och var stort som ett äpple. I Näshulta i Södermanland föll hagelkorn på omkring fem centimeter i augusti 2022. Båda gångerna var det sommar.
        - rubrik: Visste du att …
          rader:
            - - 1,02 kilo
              - vägde det tyngsta hagelkorn som någon har vägt, och det föll i Bangladesh 1986. Vad hemma hos dig väger ungefär ett kilo?
        - rubrik: Läs mer
          rader:
            - - SMHI berättar hur hagel bildas och hur stora hagelkorn kan bli.
              - https://www.smhi.se/kunskapsbanken/meteorologi/skyfall-och-hagel/hagel
            - - SMHI visar iskristaller, snöstjärnor och snöflingor, och hur de hänger ihop.
              - https://www.smhi.se/kunskapsbanken/meteorologi/sno/iskristaller-snostjarnor-snoflingor-och-frostrosor
            - - UR Play har en film på tre minuter om hur snöflingor blir till.
              - https://urplay.se/program/225993-visste-du-varje-snoflinga-ar-unik
    - rubrik: "Modellen: Bas, text 3, Snö och hagel"
      tema: Vatten
      text:
        - Venndiagrammet, blad 1, ifyllt för Snö och hagel.
      delar:
