ramar:
  rubrik: Materialet för klassen
  text: ["Utöver lektionskortet finns Affischen Fem former av värde och Affischen De värdeskapande frågorna, och bladen Möjlighetskartan, Kontaktkortet, Gruppens plan och Reflektionskortet. Sätt upp affischerna före första lektionen."]
  ramar:
    - rubrik: Affischen Fem former av värde
      text: ["Skriv ut affischen i A3 och sätt upp den där alla ser den, eller visa den på tavlan. Nära eleverna räcker A4. Peka på den när klassen väljer uppdrag och i Starten."]
    - rubrik: Affischen De värdeskapande frågorna
      text: ["Skriv ut affischen i A3 och sätt upp den bredvid Affischen Fem former av värde, eller visa den på tavlan. Nära eleverna räcker A4. Peka på den fråga som gäller nu, låt klassen tänka tillsammans och skriv svaren på tavlan."]
    - rubrik: Möjlighetskartan
      text: ["Skriv ut kartan i A3, en per grupp, eller i A4 när gruppen är två, i vecka 2 när klassen väljer uppdrag. Var och en tänker först själv, och sedan skriver gruppen tillsammans. Längst ned skriver gruppen vad den lär sig i ämnet nu."]
    - rubrik: Kontaktkortet
      text: ["Skriv ut ett A4 per grupp till lektionen när klassen väljer. Gruppen skriver sin pitch och övar den, och de som tar kontakten skriver svaret ordagrant."]
    - rubrik: Gruppens plan
      text: ["Skriv ut bladet i A3, ett per grupp, eller i A4 när gruppen är två, och skriv dina tre till fem rutor för ämnet innan du delar ut det. Gruppen skriver resten och bockar av en ruta i taget."]
    - rubrik: Reflektionskortet
      text: ["Skriv ut ett kort per elev och tillfälle, i A4. Var och en fyller i ett kort när mottagaren har svarat: i vecka 1, efter att mottagaren har prövat ett utkast och efter mötet."]
planeringsmall:
  text: "Fyll i före lektionen. Skriv mottagaren och dagens ruta först, och sist Lappens värdeskapande fråga."
  fore:
    - { etikett: "Mottagaren", rader: ["Vem:", "Värdet:", "Hen behöver:"], falt: [vem, vardet, behover] }
    - { etikett: "Ämnet i uppdraget", rader: ["Dagens ruta:", "Det som inte håller:"], falt: [ruta, felet] }
  delar:
    - { fas: Starten, skriv: "Mottagarens ord på tavlan:", hojd: 0.5 }
    - { fas: Det ni behöver kunna, skriv: "Exemplet och dagens ord:", hojd: 0.6 }
    - { fas: Arbetet, skriv: "Grupperna jag går till först:", not: "Första varvet en minut per grupp, ditt bord för dem där rutan inte syns, sedan andra varvet.", hojd: 0.7 }
    - { fas: Provet, skriv: "Vem prövar vems arbete:", hojd: 0.5 }
    - { fas: Lappen, skriv: "Den värdeskapande frågan:", hojd: 0.8 }
  beslut: { nastanAlla: "Nästa ruta:", deFlesta: ["Det ni behöver kunna igen:", "Sedan:"], halften: "Det nya exemplet:" }
  efter:
    text: Fyll i efter lektionen.
    kontrollen: "Lapparna: ___ som inte håller"
    hogar: "Lapparna i högar efter det som inte håller"
    sag: "Det jag såg i arbetet, med elevernas ord"
    nasta: "Nästa lektion börjar med"
    forst: "Jag går först till"
observation:
  fraga: Vem gör arbetet för mottagaren, och syns ämnet i det?
  text: "Skriv ut dubbelsidigt. Välj med läraren två elever som har det svårast, A och B, i olika grupper. Stå där du ser både tavlan och grupperna, och skriv numret på gruppen läraren går till. Strecken räknar gånger, och raderna med __ av __ räknar elever eller grupper. Fråga läraren före lektionen när ett svar på Lappen håller."
  fokus: Frågar jag innan jag hjälper, och lämnar jag tillbaka arbetet?
  huvud: ["Mottagaren och dagens ruta"]
  kolumner:
    - { namn: Läraren, text: "det läraren visar, frågar och säger", bredd: 35 }
    - { namn: Grupperna, text: "gruppen och det den gör", bredd: 25, elever: true }
    - { namn: I Provet, text: "var den som använder arbetet stannar", bredd: 21 }
  tecken: "R dagens ruta syns, M nämner mottagaren, V väntar på läraren och Ä skriver vad gruppen ändrar."
  delar:
    - { fas: Starten, rader: 1, rakna: "Elever du hörde som kunde säga mottagaren, behovet och värdet: __ av __" }
    - { fas: Det ni behöver kunna, rader: 1 }
    - { fas: Arbetet, rader: 3, rakna: "Grupper där dagens ruta syntes efter första varvet: __ av __" }
    - { fas: Provet, rader: 2, rakna: "Grupper som skrev vad de ändrar: __ av __" }
    - { fas: Lappen, rader: 1 }
  streck:
    - { etikett: Läraren, drag: ["Frågade var ämnet syns", "Frågade först", "Lämnade tillbaka", "Tog över arbetet"] }
    - { etikett: Grupperna, drag: ["Bockade av dagens ruta", "Väntade på läraren"] }
  rader:
    - "Elever du hörde som kunde säga för vem arbetet var, vad hen behövde och värdet: __ av __"
    - "Elever vars svar på Lappen höll för mottagaren: __ av __"
    - "Elever du frågade som kunde säga vad gruppen ändrar efter Provet och varför: __ av __"
    - "En lektion där mottagaren svarar: elever som jämförde svaret med det de väntade sig och sa eller skrev vad de lärde sig i ämnet: __ av __"

