progression:
  rubrik: De första veckorna
  text: "Metoden är ny för dig och för klassen. Kärnans tre första delar finns i varje lektion. Den fjärde, mötet och reflektionen, finns i de lektioner där mottagaren svarar. Hen svarar redan i vecka 1. Veckorna säger vad ni övar särskilt. Vecka 2–⁠5 är ett större uppdrag i ett arbetsområde, efter Flödet i ett uppdrag. I vecka 2 väljer ni uppdrag, pitchar idén för mottagaren och planerar. I vecka 3 och 4 gör och prövar ni, och i vecka 5 möter ni mottagaren och reflekterar. Behöver ett steg en vecka till, följer det med till nästa vecka, och mötet ligger kvar."
  rader:
    - { vecka: "1", led: Snabbt här och nu, rubrik: För vem?, fokus: "Klassen väljer mottagare och gör något litet med det den redan kan. I lektion 2 lämnar grupperna över arbetet och hör svaret.", roll: "Vänta tyst på elevernas förslag.", eleverna: "Att säga för vem arbetet är och vad hen behöver, svara på Lappen och skriva på Reflektionskortet.", vidare: "nästan alla du hör i Starten kan säga mottagaren och behovet", fraga: "Kan nästan alla du hör i Starten säga mottagaren och behovet?" }
    - { vecka: "2", led: Uppdraget, rubrik: Klassen väljer och frågar mottagaren, fokus: "Klassen väljer en av mottagarna du har frågat och pitchar idén för hen. Undervisningen i ämnet börjar samma vecka.", roll: "Låt alla idéer komma först, och välj sedan med klassen det uppdrag som bär ämnet.", eleverna: "Att fylla i Möjlighetskartan, välja uppdrag och pitcha idén för mottagaren med Kontaktkortet.", vidare: "klassen har mottagarens svar och Gruppens plan med dina rutor", fraga: "Har klassen mottagarens svar och Gruppens plan med dina rutor?" }
    - { vecka: "3", led: Uppdraget, rubrik: Dagens ruta och Provet, fokus: "Ämnet i arbetet, och arbetet prövat som mottagaren skulle.", roll: "Fråga först vid grupperna, i två varv.", eleverna: "Att föra in dagens ruta i arbetet och pröva en annan grupps arbete som mottagaren.", vidare: "dagens ruta syns hos nästan alla grupper, och de skriver vad de ändrar efter Provet", fraga: "Syns dagens ruta hos nästan alla grupper, och skriver de vad de ändrar efter Provet?" }
    - { vecka: "4", led: Uppdraget, rubrik: Mottagaren prövar ett utkast, fokus: "Mottagaren prövar, och grupperna ändrar efter svaret.", roll: "Låt eleverna ta kontakten och ordna prövningen själva.", eleverna: "Att be mottagaren pröva ett utkast, ändra efter svaret och ställa frågan För vem? i Starten.", vidare: "nästan alla klarar kontrollpunkten, och varje grupp har fått mottagarens svar på ett utkast", fraga: "Klarar nästan alla kontrollpunkten, och har varje grupp fått mottagarens svar på ett utkast?" }
    - { vecka: "5", led: Mötet, rubrik: Svaret och reflektionen, fokus: "Arbetet når mottagaren, och klassen säger vad den lärde sig.", roll: "Led reflektionen, och låt eleverna jämföra med det de väntade sig.", eleverna: "Att möta mottagaren, ställa klassens frågor och skriva vad de lärde sig i ämnet.", vidare: "nästan alla skriver vad de lärde sig i ämnet på Reflektionskortet", fraga: "Skriver nästan alla vad de lärde sig i ämnet på Reflektionskortet?" }
rutiner:
  rubrik: Rutinerna klassen lär sig
  rader:
    - namn: Frågan För vem?
      vecka: 1
      vad: I Starten och innan klassen gör något nytt tänker klassen tillsammans på vem arbetet är för och vad hen behöver, och svaren står på tavlan. Från vecka 4 ställer en elev frågan.
      forsta: Fråga ”Vem kan ha nytta av det vi har lärt oss?” om något klassen redan har gjort, vänta tyst tio sekunder och skriv alla svar på tavlan.
    - namn: Kontakten
      vecka: 2
      vad: Eleverna tar kontakten med mottagaren, pitchar idén och frågar vad hen behöver. Mötets dag bokar du. Kontakten och det som publiceras om eleverna följer skolans rutin.
      steg: ["Häng upp en kontaktlista med vem ni frågar, vem som tar kontakten och om svaret blev ja eller nej.", "Varje grupp skriver sin pitch på Kontaktkortet, som i Pitchen på en minut, och övar den i Provet.", "Två ur varje grupp frågar gruppens del av mottagaren, på plats, i telefon eller med mejl från skolans adress, och skriver svaret ordagrant på kortet och det hen behöver på Gruppens plan.", "Säger någon nej, tar ni nästa namn. Det är försöket som räknas."]
      forsta: Skriv en pitch tillsammans med klassen, och låt två elever spela upp kontakten medan klassen lyssnar. Sedan skriver grupperna sin.
    - namn: Provet
      vecka: 3
      vad: Efter Arbetet använder två ur en annan grupp det gruppen har gjort som mottagaren skulle, och gruppen säger inget och sätter streck. Hur det går till står i delen Provet.
      forsta: Visa med ditt eget arbete. Låt två elever använda det medan du sätter streck utan att säga något.
    - namn: Mötet och efteråt
      vecka: 5
      vad: Gruppernas arbete når mottagaren, klassen hör hens svar och var och en skriver på Reflektionskortet. Hur du förbereder mötet står i tabellen Mötet med mottagaren.
      forsta: Fyll i Reflektionskortet tillsammans med klassen i vecka 1 och tänk högt.
uppfoljning:
  text: Så ser du att metoden fungerar, i klassen och hos dig.
  rader:
    - { id: lektionen, nar: Varje lektion, tid: varje lektion, vad: "Räkna lapparna efter lektionen. Spara dem per elev, så att du ser vems svar två veckor i rad inte håller." }
    - { id: klassen, nar: Klassens arbete varje vecka, tid: varje vecka, vad: "Räkna hur många svar på Lappen som håller för mottagaren och hur många grupper som skriver vad de ändrar efter Provet." }
    - { id: lararen, nar: Dina kryss varje vecka, tid: varje vecka, vad: "Räkna i kryssen hur ofta varje del av kärnan fanns i veckans lektioner. Du följer dig själv, eftersom ämnet och reflektionen glider först." }
    - { id: observationerna, nar: Vecka 2 och 4, tid: vecka 2 och 4, vad: "I vecka 2 observerar specialläraren lektion 1 i uppdraget och läser svaren som inte höll. I vecka 4 observerar en kollega eller rektor en lektion utan mottagaren." }
    - { id: arbetslaget-fore, nar: Före första lektionen, tid: före, vad: "På arbetslagets första möte prövar ni varandras uppdrag två och två: märker mottagaren om ämnet inte håller?" }
    - { id: arbetslaget-efter, nar: Vecka 5, tid: vecka 5, vad: "Efter klassernas möten ses arbetslaget med lapparna, Reflektionskorten och kryssen." }
    - { id: vardagen, nar: I vardagen, tid: efter, vad: "Ställ frågan För vem? när klassen börjar något nytt, och ställ Lappens värdeskapande fråga. Börja nästa uppdrag inom sex veckor och sedan ett per termin. Däremellan går flödet snabbt här och nu." }
    - { id: stodet, nar: Varje månad, tid: efter, vad: "En kollega ser en lektion i månaden tills metoden sitter. Arbetslaget ses varje månad och prövar nästa uppdrag mot ämnet. Den vars svar två veckor i rad inte håller får stödundervisning." }
    - { id: sexveckor, nar: Sex skolveckor efter de första veckorna, tid: efter 6 veckor, vad: "En kollega ser en hel lektion i nästa uppdrag med observationsmallen, och ni jämför med observationen i vecka 4. Ett av besöken varje månad är en lektion där mottagaren svarar och klassen reflekterar." }
    - { id: nastatermin, nar: Nästa termin, tid: nästa termin, vad: "Räkna samma saker igen ur Så syns lärandet i klassen och dina kryss, och se om ni använder metoden i fler ämnen och med mottagare längre bort." }
    - { id: osaker, nar: Om du är osäker på metoden, tid: villkor, vad: "Står skattningen Hur säker är jag på metoden under 5 i två veckor i rad: ge veckans övning en vecka till, och be en kollega se en lektion." }
    - { id: klassenstar, nar: Om det inte fungerar, tid: villkor, vad: "Står skattningen Hur väl fungerar den i praktiken under 5 i två veckor i rad, eller håller minst hälften av svaren inte de veckorna: gör uppdraget mindre, och be specialläraren se en lektion." }
larandet:
  rubrik: Så syns lärandet i klassen
  omraden:
    - { omrade: amneskunskaper, syns: "Dagens ruta syns i arbetet, och elevernas svar på Lappen håller för mottagaren." }
    - { omrade: kommunikation, syns: "Eleverna anpassar arbetet efter mottagaren, frågar vad hen behöver och tar emot svaret." }
    - { omrade: skrivning, syns: "När arbetet är en text fungerar den för läsaren, och den som läser den i Provet stannar sällan." }
    - { omrade: socialt, syns: "Grupperna delar upp arbetet så att allas delar behövs i det färdiga, och de löser oenigheter själva." }
uppdrag:
  rubrik: Till arbetslaget
  text: "Ni prövar metoden tillsammans på två möten, i era klassrum de första veckorna och när ni besöker varandra. Det viktigaste ni gör ihop är att pröva varandras uppdrag."
  forbered:
    text: "Läs metoden och välj ett arbetsområde. På mötet, som tar en och en halv timme, prövar ni varandras uppdrag två och två och bestämmer vilka rutiner ni gör lika. Börja vecka 1 direkt och fyll i mallen Planera uppdraget före vecka 2."
    fragor: ["Vem ser det dina elever gör i dag, utom du?", "Vilket innehåll i ditt nästa arbetsområde kan vara värdefullt i dag, och för vem?", "Märker mottagaren i ditt uppdrag om ämnet inte håller?"]
  planera: "Fyll i planeringsmallen för första lektionen och mallen Planera uppdraget, och bestäm vilka mottagare i skolan ni frågar."
  genomfor: Var och en följer Lär dig metoden och skattar varje vecka, och ni hjälps åt att boka mötena med mottagarna.
  reflektera: ["Vem tog kontakten, eleverna eller du?", "Var syntes ämnet i det eleverna skapade, och var försvann det?", "Vad sa mottagaren, och vad lärde sig eleverna av det?", "Når klassen det som står under ”Gå vidare när”, och vad gör ni annars?"]
  taMed: "Ta med mallen Planera uppdraget, dina kryss, några lappar och Reflektionskort."

# ---------------------------------------------------------------------------------------------------------------------
# 4 Håll i
# ---------------------------------------------------------------------------------------------------------------------
lararensFragor:
  rubrik: Lärarens frågor
  fragor:
    - { fraga: "Får jag välja mottagaren åt eleverna?", svar: "Ja, eller låt dem välja bland några. Kvar står att mottagaren i ett större uppdrag finns utanför klassen och att klassen hör hens svar (Lackéus och Sävetun, 2016).", komponent: Mottagaren och värdet }
    - { fraga: "Får jag bedöma produkten?", svar: "Ja, bedöm kunskapen i ämnet, som den syns i arbetet och på lapparna. Mottagaren bedömer värdet, och det betygsätter du inte.", komponent: Ämnet bär uppdraget }
    - { fraga: "Hur gör jag när ämnet är något eleverna säger eller gör, som i engelska eller idrott?", svar: "Skriv dagens ruta som något mottagaren hör eller ser, till exempel att en yngre klass förstår elevernas engelska. Bocka för på klasslistan när du hör den, och låt eleverna välja eller skriva svaret på Lappen.", komponent: Ämnet bär uppdraget }
    - { fraga: "Får jag hoppa över reflektionen när tiden är knapp?", svar: "Nej, gör den kortare. Täta reflektioner gav mest (van Goethem m.fl., 2014), så fem minuter om ämnet efter varje svar från mottagaren är bättre än ett långt samtal sist.", komponent: Mötet och reflektionen }
    - { fraga: "Hur hinner jag kursen när uppdraget tar lektioner?", svar: "Lägg uppdraget på innehåll du ändå ska undervisa i, så att dagens ruta är kursens innehåll. Undervisa i resten av kursen som vanligt. Kontrollpunkten visar om ni ligger efter." }
    - { fraga: "Var hittar jag mottagare?", svar: "Börja i skolan: en annan klass, matsalen, elevrådet eller fritids. Låt eleverna leta, och be den som tackade förra gången komma tillbaka." }
hinder:
  rubrik: Det svåraste med metoden
  text: "Det svåraste är att uppdraget lossnar från ämnet. Produkten blir fin, men det eleverna skulle lära sig syns inte i den. I England, där innehållet blev ett tillägg, blev läsningen inte bättre (Menzies m.fl., 2016). I en lottad studie med effekt undervisade lärarna varje lektion i det som projektet krävde (Duke m.fl., 2021). Pröva uppdraget före start, och skriv dagens ruta varje lektion."
  kort: "Det som ofta glider är ämnet: produkten blir fin men innehållet saknas. Pröva om mottagaren märker när ämnet inte håller, och skriv dagens ruta varje lektion."
  komponent: Ämnet bär uppdraget
fallgropar:
  rubrik: Vanliga fallgropar
  rader:
    - { fallgrop: "Mottagaren nås aldrig", hander: "Arbetet når ingen som behöver det, eller mötet blir aldrig av, och eleverna märker det.", prova: "Boka mötet när klassen har valt, och låt mottagaren vara någon som behöver det klassen gör.", komponent: Mottagaren och värdet }
    - { fallgrop: "Formen tar över ämnet", hander: "Grupperna lägger tiden på färger och bilder, och ämnet syns inte i det de gör.", prova: "Skriv rutorna för ämnet på Gruppens plan, och börja Arbetet med dagens ruta.", komponent: Ämnet bär uppdraget }
    - { fallgrop: "Provet glider bort", hander: "Tiden tar slut, och grupperna prövar inte arbetet förrän mottagaren gör det.", prova: "Gör Provet till en omgång om tre minuter hellre än att stryka det, och låt gruppen ändra en sak.", komponent: Avstämning mot mottagaren }
    - { fallgrop: "Reflektionen hoppas över", hander: "Mötet blir slutet, och tiden tar slut innan någon har sagt vad hen lärde sig.", prova: "Boka femton minuter efter mötet för Reflektionskortet, eller ta det först nästa lektion.", komponent: Mötet och reflektionen }
    - { fallgrop: "Uppdraget blir för stort", hander: "Tiden tar slut, eller eleverna ser inte att det gör skillnad.", prova: "Gör uppdraget mindre och behåll ämnet och mottagaren. Börja med flödet snabbt här och nu." }
    - { fallgrop: "Mötet blir en uppvisning", hander: "Mottagaren säger ”bra jobbat”, och klassen får inget att lära av.", prova: "Ge mottagaren klassens frågor i förväg, och låt grupperna skriva vad de väntar sig att det ger." }
    - fallgrop: När en grupp står still
      moment: [Arbetet]
      hander: Gruppen pratar runt eller väntar på dig, och de andra arbetar vidare efter Gruppens plan.
      steg: ["Gå fram och fråga: ”Vad har ni gjort, och för vem?”", "Peka på dagens ruta på Gruppens plan.", "Ge gruppen en liten sak att göra på fem minuter.", "Säg att du kommer tillbaka, och gå vidare.", "Kom tillbaka och se vad som har hänt."]
    - fallgrop: När mottagaren säger nej eller inte svarar
      moment: [Arbetet]
      hander: Eleverna tappar lusten, och arbetet står utan mottagare.
      steg: ["Säg att det är försöket som räknas, och att ett nej hör till.", "Ta nästa namn på kontaktlistan samma dag.", "Låt eleverna skriva till den nya mottagaren med samma fråga.", "Svarar ingen, gör klassen arbetet för en mottagare i skolan."]
hallFast:
  rubrik: Fem saker att hålla fast vid
  rader:
    - { sak: "När arbetsområdet byts: fråga för vem kunskapen är värdefull", text: "Pröva sedan om mottagaren märker när ämnet inte håller. Då bär ämnet uppdraget." }
    - { sak: "När tiden är knapp: gör uppdraget mindre", text: "Behåll ämnet och mottagaren, och stryk hellre en del av produkten än Lappen eller reflektionen." }
    - { sak: "När det går bra: låt eleverna ta kontakten", text: "Tar du kontakten själv, blir uppdraget ditt i stället för elevernas." }
    - { sak: "När klassen har valt: boka mötet direkt", text: "Det som står i kalendern blir av, och klassen vet att någon väntar på arbetet." }
    - { sak: "När en mottagare har tackat: be hen komma tillbaka", text: "En mottagare som kommer igen gör nästa uppdrag lättare, och klassen får någon att göra mer för." }

