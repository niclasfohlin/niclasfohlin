# Värdeskapande lärande: undervisningsmetod för helklass, skriven 2026-11-15 ur analysen (analys.md, med den andra
# analysen efter förslagsgivaren), innehållsbankerna (innehall-praktiken.md, P; innehall-karnan.md, K), evidensen
# (evidensbank.md, adjudicering-evidensen.md, evidens.json) och Niclas helklasstext Metod: Värdeskapande skrivprojekt.
# Niclas beställning 2026-11-15 står i ARBETSORDER.md: formerna av värde som bas, de värdeskapande frågorna, struktur i
# ett uppdrag, hur läraren leder och ger respons medan eleverna arbetar, och mötet med mottagaren.
#   node build/sparrprov.mjs methods/vardeskapande-larande/metod.yaml --klar

titel: Värdeskapande lärande
undertitel: Så lär sig klassen ämnet genom att göra något för någon annan, F–⁠9
alternativaNamn: ["Värdeskapande pedagogik", "Value creation pedagogy"]
ingress: "Klassen lär sig ämnets innehåll genom ett uppdrag där eleverna använder det till något av värde för någon annan, som en karta åt förskoleklassen eller ett svar till en insändare. Du undervisar i det som uppdraget kräver, grupperna prövar arbetet som mottagaren skulle, och sist möter klassen mottagaren."
arskurs: ["F-3", "4-6", "7-9"]
arskursText: F–9
taggar: ["undervisningskvalitet", "demokratiuppdraget", "socialt-samspel", "vardeskapande-larande"]
slag: lektionsforlopp
syfte: [samarbeta, ova]
tid: 60 minuter per lektion, minst två lektioner i veckan
hurOftaSkal: "I en lottad studie i åk 2 hade klasserna på ett läsår i snitt 66 lektioner med projekt för en mottagare. Det är ungefär två i veckan (Duke m.fl., 2021)."
period: Fem veckor att komma igång
material:
  - Affischen Fem former av värde och Affischen De värdeskapande frågorna
  - Möjlighetskartan och Kontaktkortet till varje grupp
  - bladet Gruppens plan till varje grupp
  - Reflektionskortet till varje elev och lappar till Lappen
  - en klasslista på en skrivplatta
  - mallen Planera uppdraget
uppdaterad: 2026-11-15
publicerad: 2026-11-15
relaterade: ["kooperativt-larande", "explicit-undervisning", "formativ-bedomning", "skrivkurs-vardeskapande"]
utkast: false
film:
  sekunder: 27.2
  beskrivning: "Läraren frågar: ”För vem gör vi det här, och vad behöver hen?” En elev säger: ”Barnen vill hitta själva.” Läraren går ett första varv. Läraren säger: ”Visa mig dagens ruta i det ni gör.” En elev i grupp 2 säger: ”Lekplatsen står inte i förklaringen.” Grupp 3 säger inget och sätter ett streck. En elev ur grupp 4 frågar: ”Vilket tecken är lekplatsen?” Var och en får en lapp. Läraren frågar: ”På lappen: förstår barnen den här kartan?”"
  rubrik: "Klassen gör kartor åt förskoleklassen och prövar dem så som barnen skulle göra"
  ingress: "Filmen visar lektion 3 i SO i åk 3, där klassen gör kartor åt förskoleklassen. Barnens ord står på tavlan, läraren frågar efter dagens ruta, och två ur en annan grupp följer kartan med fingret."
  stillbilder:
    - text: "Läraren frågar för vem kartan är, och en elev svarar."
    - text: "Läraren frågar en grupp efter dagens ruta."
    - text: "Två ur en annan grupp följer kartan med fingret."
    - text: "Var och en svarar på en lapp."
filmer:
  - nr: 2
    titel: "Mötet med mottagaren"
    sekunder: 22.93
    beskrivning: "Barnen går själva med kartan, och gruppen går bakom. Läraren säger: ”Låt barnen visa vägen på kartan.” Ett barn följer kartan med fingret. Ett barn i förskoleklassen säger: ”Där är lekplatsen!” Var och en skriver på Reflektionskortet. Läraren frågar: ”Blev det som du tänkt? Vad lärde du dig om kartor?”"
    rubrik: "Förskoleklassen följer kartan, och klassen skriver vad den lärde sig"
    ingress: "Filmen visar mötet sist i uppdraget, i SO i åk 3. En grupp ur klassen går med en av förskoleklassens små grupper till parken, barnen hittar själva med kartan, och tillbaka i klassrummet skriver var och en på Reflektionskortet."
    efter: "steg 4"
    stillbilder:
      - text: "Barnen går själva med kartan, och gruppen går bakom."
      - text: "Ett barn följer kartan med fingret."
      - text: "Barnen hittar lekplatsen själva."
      - text: "Var och en skriver på Reflektionskortet."
  - nr: 3
    titel: "Lappen och beslutet"
    sekunder: 24.51
    beskrivning: "Efter lektionen läser läraren lapparna som mottagaren och sorterar dem. Läraren tänker: ”7 av 28 håller inte: de flesta kan.” Nästa lektion börjar med teckenförklaringen igen. Läraren säger: ”Här är tecknet för lekplatsen. Vad måste stå i förklaringen?” Läraren går först till de sju vars svar inte höll. Läraren frågar: ”Vilket tecken står inte i förklaringen?”"
    rubrik: "Läraren räknar lapparna och bestämmer hur nästa lektion börjar"
    ingress: "Filmen visar beslutet efter lektion 3 i SO i åk 3. Läraren läser lapparna som mottagaren, ser att 7 av 28 svar inte håller och börjar nästa lektion med teckenförklaringen igen."
    efter: "steg 5"
    stillbilder:
      - text: "Läraren läser lapparna som mottagaren och sorterar dem."
      - text: "Sju av 28 svar håller inte: de flesta kan."
      - text: "Nästa lektion börjar med Det ni behöver kunna igen."
      - text: "Läraren går först till dem vars svar inte höll."

profil:
  evidens:
    larande: { tillforlitlighet: lag, effekt: ingen, kort: "Betygen steg inte säkert i USA, men något i en stor studie i Europa.", motivering: "Låg tillförlitlighet, effekten är okänd. Betygssnittet steg inte säkert med service learning i USA (Filges m.fl., 2022), men i en stor lottad studie i Frankrike steg betygen något, också i ämnen där andra lärare satte dem (Briole m.fl., 2025).", kallor: [filges-m-fl-2022, briole-m-fl-2025, zhang-och-ma-2023, menzies-m-fl-2016] }
    lasning: { tillforlitlighet: mattlig, effekt: ingen, motivering: "Måttlig tillförlitlighet, ingen effekt. Resultaten i läsning blev inte säkert bättre med service learning i USA eller med projekt för en publik i åk 5–⁠6 i England (Filges m.fl., 2022; Menzies m.fl., 2016).", kallor: [filges-m-fl-2022, menzies-m-fl-2016, duke-m-fl-2021] }
    skrivning: { tillforlitlighet: lag, effekt: ingen, motivering: "Låg tillförlitlighet, effekten är okänd. En lottad studie i åk 2 med projekt för en mottagare i närområdet gav inte bättre faktatexter på forskarnas prov (Duke m.fl., 2021).", kallor: [duke-m-fl-2021] }
    matematik: { tillforlitlighet: lag, effekt: mattlig, motivering: "Låg tillförlitlighet, måttlig effekt. Underlaget är litet: i två amerikanska studier av service learning kopplad till undervisningen blev resultaten i matematik bättre (Filges m.fl., 2022).", kallor: [filges-m-fl-2022] }
    amnen: { tillforlitlighet: mattlig, effekt: liten, motivering: "Måttlig tillförlitlighet, liten effekt. Betygen i SO och NO steg något i en studie i USA (Filges m.fl., 2022), och lottade studier i åk 2–⁠4 gav mer på forskarnas prov (Duke m.fl., 2021; Rimm-Kaufman m.fl., 2021). Teknik saknar studier med kärnan.", kallor: [filges-m-fl-2022, duke-m-fl-2021, rimm-kaufman-m-fl-2021, krajcik-m-fl-2023] }
    socialt: { tillforlitlighet: lag, effekt: stor, motivering: "Låg tillförlitlighet, stor effekt. Projektarbete i grupp, oftast utan mottagare, gav bättre samarbete i skolan och högskolan (Zhang och Ma, 2023), och i en stor lottad studie fick eleverna fler vänner med annan bakgrund (Briole m.fl., 2025).", kallor: [zhang-och-ma-2023, briole-m-fl-2025, rimm-kaufman-m-fl-2021] }
  svarighet: { lara: 4, karnan: 3, stod: 4, tid: 4, motivering: "Du lär dig planera ett uppdrag och leda grupperna mot mottagaren och ämnet, och klassen lär sig ta kontakten. Det tar en termin, och i studierna med effekt fick lärarna fortbildning (Briole m.fl., 2025)." }
  kostnad: { kop: 2, timmar: 25, motivering: "Kopior och lappar räcker. Omkring 25 timmar per lärare första läsåret går till läsningen, arbetslagets möten, ett besök i månaden hos en kollega med samtalet efteråt och planeringen av kontakten och mötet." }
  urval:
    datum: 2026-11-15
    regel: "En studie räknas när eleverna i skolan skapar något för en verklig mottagare utanför den egna klassen och arbetet är kopplat till kursplanen: service learning i undervisningen, projekt där produkten går till en verklig mottagare och värdeskapande uppdrag. Projektbaserat lärande i allmänhet och samhällstjänst utan koppling till ämnet räknas och sänker tillförlitligheten för Indirekt. Räknas inte: högskolan, simulerade företag och tävlingar utan verklig mottagare, och studier utan jämförelsegrupp, som Lackéus egna. De bär metodens grund."
    text: "Vi sökte hos Skolverket, EEF, What Works Clearinghouse och Campbell, i ERIC och OpenAlex område för område, och följde referenserna i den nyaste sammanställningen om service learning i skolan. Sedan sökte vi igen efter starkare belägg i alla sex områden. Två granskare läste talen i källorna, och vi prövade dem igen i en källkoll. Under metodens eget namn finns ingen studie med jämförelsegrupp, så stödet kommer från service learning och projekt med en verklig mottagare. Högskolan och simulerade företag valde vi bort."
    slutsatser:
      oversikt: "Service learning i skolan i USA gav en säker effekt i matematik och små effekter i SO och NO, men inga säkra effekter på betygssnittet och läsningen (Filges m.fl., 2022). Program med reflektion gav större effekt än program utan, när studierna jämfördes (van Goethem m.fl., 2014). Projektbaserat lärande i allmänhet gav stora effekter, mest i studier där klasserna inte lottades (Zhang och Ma, 2023)."
      experiment: "I lottade studier i åk 2–⁠4 fick eleverna bättre resultat i SO och NO på forskarnas prov (Duke m.fl., 2021; Krajcik m.fl., 2023; Rimm-Kaufman m.fl., 2021). I 217 skolor i tre länder i Europa steg betygen något i Frankrike, och eleverna fick fler vänner med annan bakgrund (Briole m.fl., 2025). I EEF:s prövning i England blev läsningen inte bättre (Menzies m.fl., 2016)."
      annan: "Metoden kommer ur Lackéus forskning. I 19 svenska skolor beskrev elever och lärare mer motivation och meningsfullhet, men studien hade ingen jämförelsegrupp (Lackéus och Sävetun, 2016). Det svåra för läraren är att gå från att leda till att handleda och samtidigt hålla ämnet kvar (Condliffe m.fl., 2017; Diehl, 2017)."
    uteslutna:
      - { namn: "Yeager m.fl. (2014)", skal: "Eleverna får ett syfte för andra, men de skapar inget, så studien ligger långt från kärnan" }
      - { namn: "Owen (2024)", skal: "Inte fackgranskad, och grupperna skilde sig redan före försöket" }
      - { namn: "Rosendahl Huber m.fl. (2014)", skal: "Ett simulerat företag utan verklig mottagare" }
      - { namn: "Chen och Yang (2019)", skal: "Blandar skolan och högskolan, och skolans effekt syns inte i sammanfattningen" }
      - { namn: "Hattie (2009)", skal: "Översikt av metaanalyser" }

