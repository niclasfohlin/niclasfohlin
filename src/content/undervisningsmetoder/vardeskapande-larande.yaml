      datum: tors, vecka 3
      lektion: 3 av 7
      mal: rita karttecken och en teckenförklaring som en sexåring kan följa
      belagg: "Lappen, med en ny liten karta"
      blad: "Gruppens plan och kartorna, och en liten karta per elev till Lappen"
      forberett: "bilder av gungor, träd och vägar, och ordet teckenförklaring med bild till den som är ny i svenska"
      fore: { vem: "förskoleklassen, i sju små grupper", vardet: "socialt värde och glädje", behover: "en karta med bilder som de kan följa själva", ruta: "Varje tecken finns i teckenförklaringen", felet: "tecken som inte står i teckenförklaringen" }
      delar:
        - { fas: Starten, text: "Barnens ord: ”Vi vill hitta till lekplatsen själva.” Dagens ruta på tavlan." }
        - { fas: Det ni behöver kunna, text: "Teckenförklaringen på en karta över skolgården. Ordet med bild." }
