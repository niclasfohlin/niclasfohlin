tidsschema:
  rubrik: En lektion på 60 minuter
  rader:
    - { tid: Före lektionen, fas: Före lektionen, vad: "Skriv dagens ruta ur ämnet och Lappens värdeskapande fråga. Förbered Lappens nya exempel på tavlan eller på ett litet blad per elev. Ha Gruppens plan, mottagarens ord och klasslistan på skrivplattan framme." }
    - { tid: 0–⁠5 min, fas: Starten, form: Gemensamt, vad: "Klassen tänker tillsammans på vem arbetet är för, vad hen behöver och vilket värde det ger, och du skriver svaren på tavlan. Sedan säger du dagens ruta." }
    - { tid: 5–⁠15 min, fas: Det ni behöver kunna, form: Läraren visar, vad: "Du undervisar kort i det ämnesinnehåll dagens ruta kräver, och alla prövar det på en fråga om mottagaren." }
    - { tid: 15–⁠45 min, fas: Arbetet, form: I grupp, vad: "Var och en för in sin del av dagens ruta i arbetet. Du går ett kort varv, tar grupper till ditt bord och går ett andra varv." }
    - { tid: 45–⁠54 min, fas: Provet, form: I grupp, vad: "Två ur en annan grupp använder arbetet som mottagaren skulle, och gruppen säger inget och sätter streck. Sist skriver gruppen vad den ändrar." }
    - { tid: 54–⁠60 min, fas: Lappen, form: Enskilt, vad: "Var och en svarar på en av de värdeskapande frågorna om dagens ruta och visar hur hen tänker. När mottagaren har svarat, blir Lappen Reflektionskortet." }
    - { tid: Efter lektionen, fas: Efter lektionen, vad: "Läs lapparna som mottagaren, och sortera dem efter det som inte håller. Det avgör var nästa lektion börjar och vilka grupper du går till först." }
  varianter:
    - nar: första lektionen
      text: "Starten tar längre tid, eftersom klassen väljer mottagare. I Provet prövar en annan grupp det gruppen har gjort: ”Skulle hen vilja ha det, och var syns ämnet?”"
      delar:
        - { fas: Starten, tid: 0–⁠10 min, fraser: ["Vem kan ha glädje eller nytta av det vi har gjort?"] }
        - { fas: Det ni behöver kunna, tid: 10–⁠15 min }
        - { fas: Arbetet, tid: 15–⁠45 min }
        - { fas: Provet, tid: 45–⁠52 min, fraser: ["Skulle hen vilja ha det, och var syns ämnet?"] }
        - { fas: Lappen, tid: 52–⁠60 min }
    - nar: när klassen väljer uppdrag
