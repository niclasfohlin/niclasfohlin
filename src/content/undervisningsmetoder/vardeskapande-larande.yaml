passar:
  rubrik: När passar metoden?
  kort: "eleverna kan använda det de lär sig för någon annan. Är innehållet helt nytt, passar Explicit undervisning bättre."
  rader:
    - { fraga: "Vad ska eleverna lära sig?", metoden: "Innehåll som går att använda, förklara eller göra något med för någon annan.", annat: "Något helt nytt som först behöver visas steg för steg. Då passar Explicit undervisning." }
    - { fraga: "Hur mycket kan eleverna redan?", metoden: "Något, och resten lär de sig längs vägen, i Det ni behöver kunna.", annat: "Inget alls: börja med Explicit undervisning, och gör sedan något snabbt här och nu med det nya." }
    - { fraga: "Vad behöver klassen just nu?", metoden: "Ett skäl att lära sig, när eleverna frågar varför.", annat: "Att befästa fakta: Testbaserat lärande. Att samarbeta i strukturer: Kooperativt lärande." }
    - { fraga: "Hur mycket tid finns?", metoden: "Ett par lektioner i veckan i några veckor, eller en eller två lektioner snabbt här och nu.", annat: "Ingen tid för ett uppdrag. Välj en metod som ryms i lektionen, som Testbaserat lärande." }
    - { fraga: "Vad går oftast snett?", metoden: "Formen tar över ämnet, och Lappen håller ämnet kvar.", annat: "Klassen behöver mycket fasta ramar en period: Explicit undervisning eller Kooperativt lärande." }
  tumregel: "Välj metoden när eleverna kan använda det de lär sig för någon som behöver det, och undervisa det de behöver längs vägen. Tabellen är ett stöd för tanken och ingen regel."
  metoder: [explicit-undervisning, testbaserat-larande, kooperativt-larande]
invandningar:
  rubrik: Invändningar och nyanser
  fragor:
    - { fraga: "Är värdeskapande lärande prövat?", svar: "Inte under sitt eget namn: ingen studie med jämförelsegrupp finns. Stödet kommer från service learning, där eleverna gör något för samhället kopplat till kursplanen, och från projekt med en verklig mottagare. Effekten är oklar för betygen, liten för SO och NO och säker i matematik i två studier (Filges m.fl., 2022). I en stor lottad studie steg betygen något i Frankrike (Briole m.fl., 2025)." }
    - { fraga: "Tar inte uppdraget tid från kunskaperna?", svar: "Det kan det göra. Där innehållet blev ett tillägg blev läsningen inte bättre (Menzies m.fl., 2016). Där läraren undervisade varje lektion i det som projektet krävde, lärde sig eleverna mer SO (Duke m.fl., 2021). Därför har varje lektion Det ni behöver kunna och Lappen." }
    - { fraga: "Är det inte entreprenörskap, att starta företag?", svar: "Nej. I Lackéus jämförelse beskrev eleverna mest motivation i uppdrag för någon utanför klassen och minst i idéer och produkter som inte nådde någon (Lackéus, 2020). Pengar ryms i ett av de fem värdena, det ekonomiska, som var minst vanligt i svenska skolor (Lackéus och Sävetun, 2016)." }
    - { fraga: "Är det inte bara ett vanligt projekt?", svar: "Skillnaden är mottagaren, oftast utanför klassen, och hens svar, och att ämnet bär det klassen gör. Forskningen om projekt är lovande men inte säker, och mycket beror på hur läraren leder (Condliffe m.fl., 2017)." }
grund:
  rubrik: Det forskningen visar
  text:
    - "Värdeskapande lärande kommer ur Lackéus forskning om entreprenöriellt lärande vid Chalmers. I 19 svenska grundskolor beskrev elever och lärare mer meningsfullhet, motivation och självförtroende när eleverna skapade värde för någon utanför klassen. Studien hade ingen jämförelsegrupp, och glädje var det vanligaste värdet och pengar det minst vanliga (Lackéus och Sävetun, 2016). I en jämförelse av tre arbetssätt, med elevernas egna svar och utan kontrollgrupp, beskrev eleverna mest motivation i uppdrag som når någon utanför klassen och minst i idéer och produkter som inte når någon (Lackéus, 2020)."
    - "Lackéus fem värden heter glädjevärde, socialt eller relationellt värde, ekonomiskt värde, harmonivärde och inflytandevärde, och vart och ett kan skapas för en själv eller för andra (Lackéus och Sävetun, 2016). Metoden ger hans fem former korta namn, glädje, socialt, ekonomiskt, harmoni och inflytande, och tar förklaringarna ur hans Värdeblomma."
    - "Under metodens eget namn finns ingen studie med jämförelsegrupp. Närmast är service learning, där eleverna gör något för samhället kopplat till kursplanen. Den strängaste sammanställningen, med studier från USA, fann en säker effekt i matematik i två studier och små effekter i SO och NO i en studie, mest på gymnasiet, men inga säkra effekter på betyg och läsning (Filges m.fl., 2022). I en stor lottad studie i 217 skolor i tre länder i Europa steg betygen något i Frankrike, och eleverna fick fler vänner med annan bakgrund (Briole m.fl., 2025). Lottade studier i åk 2–⁠4 gav mer i SO och NO på forskarnas prov (Duke m.fl., 2021; Krajcik m.fl., 2023; Rimm-Kaufman m.fl., 2021). I EEF:s prövning i England, där innehållet ofta blev ett tillägg, blev läsningen inte bättre (Menzies m.fl., 2016)."
    - "Reflektionen är den del som är prövad: samhällstjänst med reflektion gav större effekt än utan, när 49 studier med elever från 12 till 20 år jämfördes (van Goethem m.fl., 2014), och program med fler av de rekommenderade delarna, som reflektion och koppling till kursplanen, gav mer i en sammanställning som mest gällde högskolan (Celio m.fl., 2011). Projektbaserat lärande i allmänhet gav stora effekter, mest i studier där klasserna inte lottades, och bättre samarbete (Zhang och Ma, 2023). I engelska som främmande språk gav projektarbete bättre texter, säkert i högskolan och osäkert i skolan (Cahyono m.fl., 2024). Lärarens svårighet är att gå från att leda till att handleda och att hålla ämnet kvar (Condliffe m.fl., 2017; Diehl, 2017), och stöttningen bygger på att läraren tar reda på var gruppen står innan hen hjälper (van de Pol m.fl., 2010)."
lasMer:
  - { kalla: lackeus-och-savetun-2016, text: "Rapporten för Skolverket om 19 svenska skolor, med de fem värdena och hur lärarna började." }
  - { slag: artikel, titel: "Knorra till undervisningen", upphov: "Martin Lackéus, vardeskapande.se", ar: 2019, adress: "https://vardeskapande.se/2019/02/28/knorra-till-undervisningen/", oppnad: 2026-11-15, text: "Hur du gör ett litet uppdrag av det du redan undervisar." }
  - { slag: artikel, titel: "Ta en prova på-lektion!", upphov: "vardeskapande.se", ar: 2016, adress: "https://vardeskapande.se/ta-en-prova-pa-lektion/", oppnad: 2026-11-15, text: "En första lektion där klassen svarar på insändare i lokaltidningen." }
  - { slag: bok, titel: "Den värdeskapande eleven", upphov: "Martin Lackéus", ar: 2022, isbn: "9789144153964", text: "Boken om metoden, med verktyg och exempel från lärare." }
  - { kalla: diehl-2017, text: "Hur lärare i åk 7–⁠9 leder entreprenöriellt lärande, och när de tar tillbaka styrningen." }

# ---------------------------------------------------------------------------------------------------------------------
# Lär dig metoden
# ---------------------------------------------------------------------------------------------------------------------
plan:
  passen:
    - { nar: första lektionen, text: "Första lektionen går flödet snabbt här och nu, på något klassen redan har gjort eller lär sig. Klassen väljer mottagare med handuppräckning: klasskamraterna eller någon i skolan som du har frågat. Varje grupp säger sin idé på en minut för gruppen bredvid och gör sedan något litet för mottagaren, som en skattjakt, ett tips eller en fråga ur ämnet. Gruppens plan börjar i vecka 2. Ni övar frågan För vem? i Starten och Lappen sist i lektionen. I lektion 2 gör grupperna klart och lämnar över det, och när mottagaren har svarat fyller var och en i Reflektionskortet med dig." }
  fore: ["Välj mottagare till första veckan: klasskamraterna, eller två eller tre i skolan som du frågar vad de behöver.", "Sätt upp Affischen Fem former av värde och Affischen De värdeskapande frågorna, och ha Reflektionskortet och lappar framme.", "Sätt ihop grupper om fyra, och ha en klasslista på en skrivplatta."]
  utvardering: ["En kollega ser en lektion i månaden tills metoden sitter. Arbetslaget ses varje månad och prövar nästa uppdrag mot ämnet. Den vars svar två veckor i rad inte håller får stödundervisning."]
  skattningar:
    - namn: Hur säker är jag på metoden?
      vem: lararen
      rad: lararen
      text: "Skatta i slutet av veckan. Tänk på kärnan: Sa klassen för vem, vad hen behövde och värdet? Undervisade du i dagens ruta, och syntes den? Prövade grupperna arbetet och skrev vad de skulle ändra? Hörde klassen svaret och sa eller skrev vad den lärde sig?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: osaker }
    - namn: Hur väl fungerar den i praktiken?
      vem: lararen
      rad: klassen
      text: "Tänk på det du ser i klassen: hur många svar på Lappen som håller, och hur många grupper som skriver vad de ändrar efter Provet."
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: klassenstar }

# ---------------------------------------------------------------------------------------------------------------------
# Lathunden
# ---------------------------------------------------------------------------------------------------------------------
lathund:
  metoden:
    text: ["Klassen lär sig ämnets innehåll genom att göra något av värde för någon annan än läraren. Flödet har sex steg: frågor och idéer, pitchen, arbetet i grupper, Provet, mottagaren och reflektionen.", "Du undervisar i det som uppdraget kräver, grupperna prövar arbetet som mottagaren skulle, och Lappen visar vem som har lärt sig ämnet. Sist möter klassen mottagaren och säger vad den lärde sig."]
  lektion:
    text: "Första lektionen går flödet snabbt här och nu, på något klassen har gjort. Klassen väljer mottagare i klassen eller skolan, och grupperna pitchar för gruppen bredvid och gör något litet som lämnas samma vecka. Starten tar tio minuter. Säg varför: ”I dag gör vi något som någon annan har glädje eller nytta av. Det är så vi lär oss det här.”"
  igang:
    rubrik: De första veckorna
