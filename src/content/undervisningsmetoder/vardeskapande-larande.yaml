steg:
  rader:
    - namn: Starten
      fraga: "För vem gör vi det här?"
      alla: Alla tänker först själva på mottagaren, behovet och värdet, och sedan pratar de två och två.
      titta: Står mottagaren, behovet och värdet i klassens svar med elevernas egna ord?
      beslut: "Gör de det, säger du dagens ruta. Annars läser ni mottagarens ord en gång till, och du frågar två som inte har svarat."
      gor:
        - "Peka på mottagarens ord överst på tavlan och på värdet på affischen: ”För vem gör vi det här, och vad behöver hen?”"
        - Låt alla tänka själva en stund och sedan prata två och två. Skriv svaren på tavlan under mottagarens ord.
        - "Säg dagens ruta och skriv den på tavlan: ”I dag får kartan en teckenförklaring.”"
      fraser: ["För vem gör vi det här, och vad behöver hen?"]
    - namn: Det ni behöver kunna
      fraga: "Kan alla det dagens ruta kräver?"
      alla: Alla svarar på en fråga om mottagaren på ett papper och håller upp det.
      titta: Hur många svar håller för mottagaren?
      beslut: "Håller nästan alla svar, går grupperna till Arbetet. Annars visar du ett exempel till."
      gor:
        - Visa det dagens ruta kräver med ett exempel ur uppdraget, och tänk högt.
        - "Skriv dagens ord med en bild, och förklara det så att mottagaren förstår: ”Teckenförklaringen säger vad bilderna betyder.”"
        - "Ställ en fråga om mottagaren som alla svarar på: ”Här är tecknet för lekplatsen. Vad måste stå i förklaringen?”"
      fraser: ["Hur skulle mottagaren förstå det här?"]
    - namn: Arbetet
      fraga: "Var syns ämnet i det gruppen gör?"
      alla: Gruppen bockar av dagens ruta på Gruppens plan när allas delar syns i arbetet.
      titta: Syns dagens ruta i varje grupps arbete efter första varvet?
      beslut: "Syns den inte, kommer gruppen till ditt bord. Saknas den hos minst hälften, visar du igen för alla från tavlan."
      gor:
        - "Första varvet, en minut per grupp: ”Visa mig dagens ruta i det ni gör.” Fråga den som inte har visat något."
        - Bocka för på klasslistan där dagens ruta syns. Ta de andra grupperna till ditt bord, visa ett nytt exempel och låt dem försöka.
        - I andra varvet går du först till dem du har talat minst med och följer Så stöttar du.
        - En grupp som är klar gör dagens ruta på ett nytt exempel. När du har sett att var och en kan den, tar gruppen nästa ruta.
        - Säg sist vilka grupper som prövar varandras arbete i Provet.
      fraser: ["Visa mig dagens ruta i det ni gör."]
    - namn: Provet
      fraga: "Håller arbetet för mottagaren?"
      alla: Två i varje grupp använder en annan grupps arbete som mottagaren skulle, och gruppen sätter streck.
      titta: Var stannar de som använder arbetet, och gäller det ämnet?
      beslut: "Stannar många vid samma sak i ämnet, tar du den först nästa lektion."
      gor:
        - Två blir kvar, och två går till gruppen till höger och använder arbetet som mottagaren. Den sista gruppen går till den första.
        - De som är kvar säger inget och sätter ett streck på arbetet där besökarna stannar eller frågar.
        - Efter tre minuter går besökarna tillbaka till sitt bord, och de andra två går till samma grupp.
        - Sist skriver gruppen på Gruppens plan vad den ändrar, och gör det i nästa Arbetet.
        - "I ett par eller en grupp om tre går en åt gången. Utan utkast pitchar gruppen idén, och besökarna svarar som mottagaren."
      fraser: ["Säg inget. Sätt ett streck där de stannar."]
    - namn: Lappen
      fraga: "Håller allas svar för mottagaren?"
      alla: Var och en svarar på en av de värdeskapande frågorna om dagens ruta och visar hur hen tänker.
      titta: Hur många svar håller inte för mottagaren?
      beslut: "Ett av tre utfall, nedan."
      gor:
        - "Ställ en av de värdeskapande frågorna om dagens ruta: ”Förstår barnen var lekplatsen är på den här nya kartan?”"
        - Var och en svarar på en lapp med namnet i hörnet.
        - "Samla lapparna, och läs dem efter lektionen som mottagaren: håller svaret för hen?"
      fraser: ["Förstår mottagaren det här? Var syns det vi lär oss?"]
      redo:
        nastanAlla: Högst 5 av 28 svar håller inte. Grupperna tar nästa ruta, och du går först till dem vars svar inte höll.
        deFlesta: 6–13 av 28 svar håller inte. Nästa lektion börjar med Det ni behöver kunna igen, med samma slags fråga.
        halften: 14 eller fler svar håller inte. Visa igen med ett nytt exempel, och låt grupperna pröva det innan de går vidare.
        tiden: "Räcker tiden inte ens med en kort omgång i Provet, tar ni Lappen före Starten nästa lektion, och du läser lapparna medan grupperna arbetar."
lektionskort:
  - { efter: klassen, text: "Lektionens fem delar står på lektionskortet, ett eget A4 att ha i handen under lektionen." }
fastnar:
  rubrik: Så stöttar du
  text: "Fråga först var gruppen står, och ge minsta möjliga stöd. Arbetet är gruppens, och det är stödet som ändras."
  trappa: ["Fråga: ”Vad har ni gjort, och för vem?”", "Ställ en riktad fråga: ”Hur skulle barnen förstå det här tecknet?”", "Visa en förebild, ett annat arbete eller ett exempel ur ämnet.", "Gör en bit tillsammans, och lämna tillbaka pennan.", "Kom tillbaka efter några minuter, och låt gruppen göra en ny liten del utan din hjälp, så att du ser om stödet räckte."]
  motto: Fråga först, lämna tillbaka arbetet.
amnesexempel:
  - amne: lasning
    arskurs: åk 4
    innehall: Läsa skönlitteratur och återge och värdera det lästa
    overst:
      egen: "Dagens ruta: tipset säger vem boken handlar om och vilket problem hen får. Det som inte håller: tipset berättar slutet."
      visar: Var och en skriver ett tips, och två ur en annan grupp läser det som en elev i åk 3.
    scen:
      - "Tänk dig en lektion i svenska i åk 4. Klassen skriver boktips åt åk 3, som har bett om tips på böcker att låna i skolbiblioteket. Deras ord står överst på tavlan: ”Vi vill veta om boken är spännande, men inte hur den slutar.”"
      - "I Det ni behöver kunna visar du skillnaden mellan att återge början och att avslöja slutet, med en bok alla har läst. I Provet läser två ur en annan grupp tipset som en elev i åk 3 och säger vad de nu vet om boken, och gruppen sätter ett streck där tipset berättar för mycket."
      - "På Lappen svarar alla på frågan ”Vill åk 3 läsa boken nu?” med två meningar om en bok klassen har läst: vem den handlar om och vilket problem hen får, utan slutet. 4 av 28 svar håller inte för åk 3."
    notera: "Notera vad som hände. Nästan alla kan, så grupperna gör tipsen klara nästa lektion, och du går först till de fyra som berättade slutet eller missade problemet."
  - amne: skrivning
    arskurs: åk 8
    innehall: Argumenterande text med skäl och motargument för en mottagare
    overst:
      egen: "Dagens ruta: svaret bemöter insändarens starkaste skäl. Det som inte håller: svaret upprepar bara klassens åsikt."
      visar: Var och en skriver hur hen bemöter ett skäl, så att skribenten förstår.
    scen:
      - "Tänk dig en lektion i svenska i åk 8. Klassen skriver svar på en insändare i lokaltidningen om att stänga ungdomsgården, och tidningen har lovat att ta in två svar. Insändarens starkaste skäl står överst på tavlan: ”Gården kostar för mycket för de få som går dit.”"
      - "I dag är rutan att bemöta insändarens starkaste skäl. I Provet läser två ur en annan grupp svaret som skribenten och säger vad de skulle invända, och gruppen sätter ett streck där svaret inte bemöter skälet."
      - "På Lappen svarar alla på frågan ”Skulle skribenten tänka om?” med en mening som bemöter ett annat av insändarens skäl. 15 av 28 upprepar bara klassens åsikt."
    notera: "Notera vad som hände. Med 15 svar som inte håller kan hälften eller färre, så nästa lektion visar du igen med ett nytt exempel, ett svar på ett annat skäl, och grupperna prövar det i sin text innan de går vidare."
  - amne: matematik
    arskurs: åk 6
    innehall: Tabeller, diagram och andelar i procent
    overst:
      egen: "Dagens ruta: diagrammet visar andelen i procent av hela klassen. Det som inte håller: 7 av 28 blir 7 procent."
      visar: Var och en förklarar för elevrådet hur många procent en andel är.
    scen:
      - "Tänk dig en lektion i matematik i åk 6. Elevrådet vill jämföra vad klasserna vill göra på friluftsdagen, och klasserna är olika stora, så elevrådet behöver andelarna. Varje grupp har frågat en klass och gör ett diagram åt elevrådet."
      - "I Det ni behöver kunna räknar ni andelar i procent av en hel klass. I första varvet ser du att två grupper har ritat stora, snygga staplar med antalet svar och ingen procent. De kommer till ditt bord och räknar om med ett nytt exempel. En elev som är ny i svenska har ordet andel med en bild och meningen: ”Andel är hur stor del av klassen.”"
      - "På Lappen förklarar alla hur många procent 7 av 28 är och svarar på frågan ”Förstår elevrådet hur stor del det är?” 8 av 28 svar håller inte."
    notera: "Notera vad som hände. Med 8 svar som inte håller kan de flesta, så nästa lektion börjar med andelar i procent en gång till, med samma slags fråga. Vid ditt bord rättade två grupper staplarna innan diagrammen var klara."
  - amne: so-no
    amnesnamn: SO
    arskurs: åk 3
    innehall: Kartan och dess symboler, och att hitta i närområdet med en karta
    huvud: true
    arbetsomradet:
      - "Vecka 2: kartan ritad uppifrån"
      - "Vecka 3: karttecken"
      - "Vecka 3: teckenförklaringen"
      - "Vecka 4: vägen, med kartan i handen"
      - "Vecka 4: barnen prövar utkasten"
      - "Vecka 5, lektion 6–⁠7: ändringarna och mötet"
    overst:
      visar: "Kartan med tecken och teckenförklaring. Pröva: hitta lekplatsen med fingret som en sexåring."
    plan:
