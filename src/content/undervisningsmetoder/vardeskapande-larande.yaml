# ---------------------------------------------------------------------------------------------------------------------
# 1 Metoden
# ---------------------------------------------------------------------------------------------------------------------
inledning:
  - "Värdeskapande lärande är ett sätt att undervisa där klassen lär sig ämnets innehåll genom att använda det till något av värde för någon annan än läraren, oftast någon utanför klassen. Lärandet är målet, och värdet är vägen dit. Entreprenöriellt lärande handlar ofta om ekonomiskt värde, som att starta ett företag. Här kan värdet vara glädje, socialt, ekonomiskt, harmoni eller inflytande, de fem former av värde som Martin Lackéus beskriver och tabellen Fem former av värde visar. Motivationen kommer av att eleverna känner sig viktiga när någon annan än de själva uppskattar det de gör och ser att de kan påverka världen. Ett uppdrag går i sex steg, som tabellen Flödet i ett uppdrag visar: frågor och idéer, pitchen, arbetet i grupper, Provet, mottagaren och reflektionen. Ämnet går genom hela flödet."
  - "Affischen Fem former av värde och Affischen De värdeskapande frågorna sitter på väggen. Överst på tavlan står mottagarens egna ord, det hen svarade när klassen frågade vad hen behöver. Varje grupp har bladet Gruppens plan, där du skriver kraven ur ämnet, en ruta för varje, och gruppen planerar arbetet. Varje lektion tar en av rutorna, dagens ruta, som du undervisar i och grupperna för in i arbetet. Varje lektion börjar med Starten, där klassen tänker tillsammans på frågan För vem? Du skriver svaren på tavlan. I Det ni behöver kunna undervisar du kort i dagens ruta, sedan arbetar grupperna, och i Provet använder två ur en annan grupp arbetet som mottagaren skulle. Sist svarar var och en på Lappen. Var och en skriver på Reflektionskortet i stället för Lappen när mottagaren har svarat: i vecka 1, när hen har prövat ett utkast och efter mötet."
  - "Lärandet går till så här. När någon väntar på arbetet behöver eleverna kunna ämnet, för annars håller det inte för mottagaren. Tänk dig en klass i åk 3 som gör kartor åt förskoleklassen, som ska gå till parken. Kartan måste vara ritad uppifrån och ha tecken som står i teckenförklaringen, för annars hittar barnen inte. När två ur en annan grupp följer kartan med fingret och stannar vid ett tecken de inte förstår, ser gruppen själv vad som saknas. Lappen visar en ny liten karta där ett tecken saknas i förklaringen, så att du ser vem som har lärt sig. Mötet visar om det höll, och reflektionen gör det klassen upplevde till kunskap."
  - "De första fem veckorna har ni minst två lektioner i veckan med metoden. Flödet finns i två storlekar. I vecka 1 går det snabbt här och nu, på en eller två lektioner om det klassen redan gör, och mottagaren kan vara klasskamraterna. Vecka 2–⁠5 är ett större uppdrag i ett arbetsområde. Klassen väljer en mottagare utanför klassen, pitchar sin idé för hen, arbetar och prövar och möter hen sist. Själv övar du att vänta på elevernas förslag, att fråga innan du hjälper och att låta eleverna ta kontakten. Efter veckorna ställer klassen frågan För vem? när den börjar något nytt, och mottagaren tar ett steg längre bort i taget."
karna:
  rubrik: "Kärnan: fast och fritt"
  text: "Effekten hänger på att du håller ihop ämnet och mottagaren. Mottagaren ger eleverna ett skäl att lära sig, och ämnet är det de lär sig. Avstämningen låter gruppen ändra arbetet i tid. Reflektionen gör upplevelsen till kunskap. Utan ämnet blir det ett trevligt projekt, och utan mottagaren en vanlig uppgift."
  grundregel: Det här är kärnan, och den håller du fast vid. Du får ändra vem mottagaren är, vilket värde och vilket innehåll ur kursplanen ni väljer, produkten och hur stort uppdraget är.
  varv: Klassen lär sig ämnet för någon som behöver det, prövar arbetet mot hen och hör sist vad det gav.
  komponenter:
    - namn: Mottagaren och värdet
      moment: [Starten, Provet]
      vad: Klassen tänker tillsammans på mottagaren och värdet, och gör något för någon annan än läraren.
      syns: Eleverna säger med egna ord för vem arbetet är, vad hen behöver och vilket värde det ger. Läraren hör det i Starten och ser det i Provet.
      varfor: "Utan någon som väntar blir arbetet en uppgift för läraren. I EEF:s prövning blev utställningen ibland bara en visning, och läsningen blev inte bättre (Menzies m.fl., 2016). Idéer och produkter som inte nådde någon beskrev eleverna som minst motiverande (Lackéus, 2020)."
      belagg: i-alla
      kallor: [menzies-m-fl-2016, lackeus-2020, filges-m-fl-2022]
      kvar: Klassen har en verklig mottagare, frågar vad hen behöver och säger värdet. I ett större uppdrag är hen utanför klassen.
      fritt: Vem mottagaren är och hur nära, också klasskamraterna när det går snabbt här och nu, vilket av de fem värdena och vem som väljer.
      kryss: Jag lät klassen säga för vem, vad hen behövde och värdet.
    - namn: Ämnet bär uppdraget
      moment: [Det ni behöver kunna, Arbetet, Lappen]
      vad: Det klassen skapar kräver ämnets innehåll, och du undervisar i det som uppdraget behöver medan arbetet pågår.
      syns: Var och en för in sin del av dagens ruta i arbetet och svarar på Lappen så att läraren ser hur hen tänker.
      varfor: "Uppdraget lossnar lätt från ämnet. I en lottad studie med effekt i SO undervisade läraren varje lektion i det som projektet krävde (Duke m.fl., 2021), och i EEF:s prövning, där ämnet ofta blev ett tillägg till projektet, blev läsningen inte bättre (Menzies m.fl., 2016)."
      belagg: i-alla
      kallor: [duke-m-fl-2021, menzies-m-fl-2016, celio-m-fl-2011]
      kvar: Produkten kräver ämnets innehåll, och du undervisar i det varje lektion.
      fritt: Vilken del av kursplanen, produkten, var i lektionen och hur länge du undervisar, och rutorna du skriver.
      kryss: Jag undervisade i dagens ruta, och den syntes i arbetet.
    - namn: Avstämning mot mottagaren
      moment: [Arbetet, Provet]
      vad: Gruppens arbete prövas mot mottagarens behov och ämnet medan det går att ändra, och gruppen ändrar då.
      syns: Grupperna skriver vad de ändrar efter Provet och kan säga varför, eller varför arbetet håller. Läraren frågar innan hen hjälper.
      varfor: "Utan avstämning möter arbetet mottagaren först när det är för sent att ändra. Läraren behöver ta reda på var gruppen står innan hen hjälper, och lämna över igen (van de Pol m.fl., 2010). När allt var löst inramat blev eleverna tidvis inaktiva (Diehl, 2017)."
      belagg: i-alla
      kallor: [duke-m-fl-2021, van-de-pol-m-fl-2010, diehl-2017]
      kvar: Varje grupps arbete prövas mot mottagarens behov och ämnet medan det går att ändra.
      fritt: Vem som prövar, Provets form, dina frågor och hur många varv du går.
      kryss: Jag lät grupperna pröva arbetet och skriva vad de ändrar.
    - namn: Mötet och reflektionen
      moment: [Lappen]
      vad: Arbetet når mottagaren, klassen hör hens svar, och var och en säger vad hen lärde sig i ämnet.
      syns: När mottagaren har svarat, jämför eleverna svaret med det de väntade sig och säger eller skriver vad de lärde sig i ämnet.
      varfor: "Lärandet sker i reflektionen efter mottagarens svar, och det är den delen som är prövad. När 49 studier jämfördes, gav program med reflektion större effekt än program utan, mest när eleverna reflekterade ofta (van Goethem m.fl., 2014)."
      belagg: provad
      kallor: [van-goethem-m-fl-2014, celio-m-fl-2011, lackeus-och-savetun-2016]
      kvar: Klassen hör mottagarens svar, och var och en säger eller skriver vad hen lärde sig i ämnet.
      fritt: Mötet på plats, digitalt eller som ett svar i efterhand, och reflektionen muntligt eller skriftligt.
      kryss: Klassen hörde svaret och sa eller skrev vad den lärde sig.
roll:
  rubrik: "Lärarens roll: du håller ihop ämnet och mottagaren"
  text: Du bjuder in klassen att tänka tillsammans, undervisar i det som uppdraget kräver, frågar innan du hjälper och leder reflektionen efter mötet. Eleverna tar kontakten och gör arbetet.
  fragor:
    - För vem gör vi det här, och vad behöver hen?
    - Var syns ämnet i det gruppen gör?
    - Vem gör arbetet, eleverna eller jag?
  fragornaText: Den första ställer du i Starten, den andra vid grupperna, och den tredje ställer du dig själv när du vill ta över.
tabeller:
  - rubrik: Flödet i ett uppdrag
    plats: efter-inledning
    meny: true
    text: "Flödet finns i två storlekar. Snabbt här och nu tar en eller två lektioner på det klassen redan gör. Pitchen är då en minut för gruppen bredvid, och mottagaren kan vara klasskamraterna, som när grupperna gör ett spel åt varandra. Ett större uppdrag tar några veckor, och mottagaren finns utanför klassen. Ämnet går genom hela flödet: varje lektion har dagens ruta ur ämnet, som du undervisar i och grupperna för in i arbetet."
    kolumner: [Steget, Det klassen gör, Mer i metoden]
    rader:
      - ["1 Frågor och idéer", "Klassen tänker tillsammans på vem som kan ha glädje eller nytta av det den lär sig, och väljer mottagare.", "Tabellerna Fem former av värde och De värdeskapande frågorna, och Möjlighetskartan"]
      - ["2 Pitchen", "Grupperna säger idén på en minut, först för en annan grupp och sedan för mottagaren.", "Tabellen Pitchen på en minut, Kontaktkortet och rutinen Kontakten"]
      - ["3 Arbetet i grupper", "Grupperna gör arbetet för mottagaren och för in dagens ruta ur ämnet varje lektion.", "Gruppens plan, lektionskortet och Arbetet i del 2"]
      - ["4 Provet", "Varje lektion använder två ur en annan grupp arbetet som mottagaren skulle, och gruppen ändrar.", "Provet i del 2 och Gruppens plan"]
      - ["5 Mottagaren", "Arbetet når mottagaren, och klassen hör hens svar.", "Tabellen Mötet med mottagaren och När mottagaren kommer i del 2"]
      - ["6 Reflektionen", "Var och en säger eller skriver vad hen lärde sig i ämnet och vad mottagaren fick.", "Reflektionskortet, och Lappen i del 2"]
  - rubrik: Fem former av värde
    plats: efter-inledning
    meny: true
    text: "Värdet är det mottagaren får, och det ska nå någon annan än gruppen själv. Martin Lackéus beskriver fem former av värde. Glädjen när arbetet flyter på är ett värde också för den som gör det. Ta glädje och socialt värde först, inflytande och harmoni när klassen är redo och ekonomiskt värde sist. Affischen Fem former av värde står i bilaga A."
    kolumner: [Värdet, Det betyder, Ett exempel]
    rader:
      - ["Glädje", "Något som är roligt eller vackert, och glädjen när arbetet flyter på.", "Dikter i matsalen, en skattjakt åt förskoleklassen"]
      - ["Socialt", "Att göra något för och med andra, så att någon får hjälp, lär sig något eller känner sig välkommen.", "En karta åt förskoleklassen, högläsning för en yngre klass"]
      - ["Ekonomiskt", "Att möta någons behov, så att pengar, tid eller saker räcker längre.", "En loppis för en insamling, en guide som sparar tid för nya elever"]
      - ["Harmoni", "Att göra något för miljön, rättvisan eller kulturen när något stör helheten i samhället.", "En kampanj mot matsvinn i matsalen"]
      - ["Inflytande", "Att göra skillnad, så att någon tänker om eller fattar ett beslut.", "Ett svar till en insändare, ett förslag till kommunen"]
  - rubrik: De värdeskapande frågorna
    plats: efter-inledning
    meny: true
    text: "Frågorna står i flödets ordning. Klassen ställer dem, och du ställer dem till klassen och på Lappen."
    kolumner: [När, Frågan]
    rader:
      - ["När klassen väljer", "Vem kan ha glädje eller nytta av vår kunskap? Vem vill vi glädja, hjälpa eller påverka på något sätt?"]
      - ["När klassen väljer", "Vad kan vi, och vad har vi som andra kan vilja ha?"]
      - ["Före arbetet", "Vad behöver mottagaren, och hur tar vi reda på det?"]
      - ["Under arbetet", "Förstår mottagaren det här? Var syns det vi lär oss?"]
      - ["Före mötet", "Vad väntar vi oss att hen får?"]
      - ["Efter mötet", "Blev det som jag tänkt? Varför, varför inte? Vad lärde vi oss?"]
      - ["Varje lektion, i Starten", "För vem gör vi det här, och vad behöver hen?"]
  - rubrik: Pitchen på en minut
    plats: efter-inledning
    meny: true
    text: "Pitchen är gruppens idé, sagd på en minut så att mottagaren vill lyssna och svara. Den prövar idén innan arbetet börjar, och eleverna övar att med få ord säga behovet, värdet och det de lär sig. I lektionen när klassen väljer skriver grupperna pitchen på Kontaktkortet. I Provet pitchar hälften av grupperna samtidigt för var sin besökande grupp, och besökarna svarar som mottagaren: ”Vill vi ha det, och vad saknas?” Sedan byter grupperna, och du går runt och lyssnar. Blir en grupp över, pitchar den för dig. Samma vecka pitchar två ur varje grupp för mottagaren. Blir svaret ljumt, tänker gruppen om."
    kolumner: [Delen, Gruppen säger, I exemplet]
    rader:
      - ["Vilka vi är", "Vilka ni är och vilken klass.", "”Hej! Vi går i trean.”"]
      - ["Väck intresset", "En fråga eller en bild ni visar, så att hen lyssnar.", "”Har ni gått till parken själva?”"]
      - ["Behovet", "Det ni tror att hen behöver, och varför.", "”Vi tror att ni behöver hitta vägen, för den har många svängar.”"]
      - ["Idén och värdet", "Det ni vill göra, vad det ger hen och vad ni lär er.", "”Vi gör en karta med bilder, så att ni hittar själva. Vi lär oss rita kartor.”"]
      - ["Frågan", "Be om något: ett ja eller ett svar.", "”Vill ni ha en karta? Vad behöver ni för att hitta själva?”"]
  - rubrik: Börja litet
    plats: efter-progression
    meny: true
    text: "Martin Lackéus kallar flödet snabbt här och nu att knorra till undervisningen, som en droppe färg i ett glas vatten: det mesta är som vanligt, och lektionen får ändå en ny färg. Ju längre bort mottagaren är, desto mer betyder uppdraget, och desto mer kräver kontakten. Ta nästa steg när klassen har klarat kontakten på steget före och uppdraget behöver en mottagare längre bort."
    kolumner: [Steget, Mottagaren, Tiden, Ett exempel]
    rader:
      - ["Snabbt här och nu", "Klasskamraterna eller någon i skolan", "En eller två lektioner, samma vecka", "Ett spel åt varandra, högläsning för en yngre klass eller en skattjakt åt förskoleklassen"]
      - ["Ett uppdrag i skolan", "En annan klass, matsalen eller elevrådet", "Några veckor", "Kartan till parken åt förskoleklassen"]
      - ["Ett uppdrag i närområdet", "En förening, ett äldreboende eller föräldrar som behöver det klassen gör", "Några veckor", "En guide till parken åt kommunens fritidsgård"]
      - ["Ett uppdrag i samhället", "Kommunen, en tidning eller ett företag", "Några veckor till en termin", "Ett svar till en insändare i lokaltidningen"]
  - rubrik: Mötet med mottagaren
    plats: efter-progression
    meny: true
    text: "Mötet är där arbetet når mottagaren och klassen hör hens svar. Det kan vara på plats, digitalt eller som ett svar i efterhand."
    kolumner: [Steget, Så gör du]
    rader:
      - ["Boka mötet först", "När klassen har valt, bestämmer du dagen med mottagaren och vilka vuxna som är med, så att mötet blir av."]
      - ["Förbered", "Lektionen före mötet skriver varje grupp en fråga till mottagaren och vad den väntar sig att det ger. Ge mottagaren frågorna i förväg."]
      - ["Mötet", "Eleverna lämnar över, visar eller leder, och mottagaren använder arbetet. Klassen ställer sina frågor."]
      - ["När ett möte inte går", "Mottagaren svarar i ett brev, ett mejl, en film eller en enkät."]
      - ["Efteråt", "Klassen talar om frågan ”Blev det som jag tänkt?” Du skriver svaren på tavlan. Sedan skriver var och en på Reflektionskortet."]
  - rubrik: Så bygger du ett värdeskapande uppdrag
    plats: efter-progression
    meny: true
    text: "Så planerar du ett större uppdrag. Sedan går klassen Flödet i ett uppdrag från arbetet i grupper till reflektionen. Pröva uppdraget innan det börjar: märker mottagaren om ämnet inte håller? Gör hen inte det, byt produkt eller mottagare och behåll ämnet. Mallen Planera uppdraget är planen att fylla i. Kontrollpunkten är lektionen innan mottagaren prövar ett utkast, och då frågar Lappen om alla rutorna."
    kolumner: [Steget, Så gör du]
    rader:
      - ["1 Börja i ämnet", "Välj det klassen ska lära sig ur kursplanen, och fråga för vem den kunskapen kan vara värdefull i dag."]
      - ["2 Välj uppdraget", "Fråga två eller tre mottagare om de vill ha något. Klassens idéer kommer först, och sedan väljer ni mottagare och värde där ämnet behövs."]
      - ["3 Fråga mottagaren", "Eleverna pitchar idén för mottagaren och frågar vad hen behöver. Du skriver svaret överst på tavlan och bokar mötet."]
      - ["4 Planera", "Skriv tre till fem rutor för ämnet på Gruppens plan. Grupperna skriver stegen och vem som gör vad."]
  - rubrik: Planera uppdraget
    plats: efter-progression
    meny: true
    text: "Mallen är din fil att skriva i när du planerar ett uppdrag. Börja i ämnet och sluta med frågan om mottagaren märker när ämnet inte håller. Exemplet är Kartan till parken i SO i åk 3."
    kolumner: [Planera uppdraget, I exemplet]
    rader:
      - ["Klass och ämne", "3B, SO"]
      - ["Det vi lär oss, ur kursplanen", "Kartan och dess symboler, och att hitta i närområdet med en karta"]
      - ["För vem är det värdefullt i dag?", "Förskoleklassen, som ska gå till parken nära skolan för första gången"]
      - ["Värdet", "Socialt värde och glädje: barnen hittar själva"]
      - ["Mottagaren behöver", "En karta med bilder som en sexåring kan följa"]
      - ["Rutorna för ämnet", "Kartan är ritad uppifrån. Minst fem tecken. Varje tecken finns i teckenförklaringen. Vägen från skolan till parken syns."]
      - ["Produkten", "En karta per grupp, åt en av förskoleklassens sju små grupper, så att barnen hittar själva"]
      - ["Kontrollpunkten", "Lektion 4: Lappen frågar om alla rutorna på en ny karta. Behövs mer tid, gör produkten mindre och behåll tiden att pröva och ändra före mötet"]
      - ["Mötets dag", "Torsdag vecka 5, bokad i vecka 2 med förskoleklassens lärare, som går med till parken"]
      - ["Märker mottagaren om ämnet inte håller?", "Ja: saknas ett tecken eller är kartan ritad från sidan, hittar barnen inte"]
  - rubrik: "Planera uppdraget: lektionerna"
    plats: efter-progression
    text: "Varje lektion har en rad med veckan, det du undervisar och dagens ruta. Vecka 1 går flödet snabbt här och nu, och vecka 2 börjar med lektionen där klassen väljer."
    kolumner: [Lektionen, Det ni behöver kunna, Dagens ruta]
    rader:
      - ["Valet, vecka 2", "Vad en karta visar. Klassen väljer uppdrag och frågar förskoleklassen", "Lappen: vad en karta hjälper någon att hitta"]
      - ["1, vecka 2", "Kartan ritad uppifrån, som bordet sett från taket", "Kartan är ritad uppifrån"]
      - ["2, vecka 3", "Karttecken: en bild som betyder något", "Minst fem tecken"]
      - ["3, vecka 3", "Teckenförklaringen", "Varje tecken finns i teckenförklaringen"]
      - ["4, vecka 4", "Att vända kartan rätt. Arbetet är promenaden till parken med kartan i handen, och Lappen är kontrollpunkten", "Vägen från skolan till parken syns, med det man ser i rätt ordning"]
      - ["5, vecka 4", "Rutorna igen, när förskoleklassen prövar utkasten", "Alla rutorna, prövade av barnen"]
      - ["6, vecka 5", "Det barnen stannade vid", "Alla rutorna, ändrade där barnen stannade"]
      - ["7, vecka 5", "Mötet: rutorna igen, innan barnen går", "Alla rutorna, på vägen till parken"]
  - rubrik: Utveckla metoden
    plats: efter-progression
    text: "När klassen har gjort några uppdrag kan du bygga på grunden."
    kolumner: [Det du bygger på, När]
    rader:
      - ["Grupperna gör olika delar av en gemensam produkt, med olika innehåll", "När du kan undervisa varje grupp i dess del"]
      - ["Två kolumner på väggen: Vet och Behöver veta", "När uppdraget är långt och frågorna många"]
      - ["Gruppen pitchar idén för en annan klass som spelar mottagaren", "Före en kontakt utanför skolan"]
      - ["Eleverna arbetar i en yrkesroll, som journalister, guider eller arkitekter", "När klassen har gjort några uppdrag"]

