        - { fas: Lappen, text: "Förstår barnen var lekplatsen är på den här nya kartan? Vad behöver stå i förklaringen?" }
      beslut: { elever: 28, nastanAlla: "vägen till parken", deFlesta: ["teckenförklaringen", "vägen till parken"], halften: "en karta över klassrummet med nya tecken" }
      efter: { kontrollen: "7 som inte håller: De flesta", hogar: "21 som håller, 5 som missar tecknet som saknar förklaring, 2 utan svar", sag: "”Om det inte står vad tecknet är, vet de inte att det är lekplatsen.”", kryss: [1, 2, 3], nasta: "teckenförklaringen igen", forst: "de fem som missade tecknet, och de två utan svar" }
    remsa:
      - "Förskoleklassen ska till parken, och barnen vill hitta till lekplatsen själva."
      - "Kartan kräver tecken, teckenförklaring och vägen, och dagens ruta är teckenförklaringen."
      - "Två ur en annan grupp följer kartan med fingret, och gruppen skriver vad den ändrar."
      - "Barnen går med kartan till parken, och klassen skriver vad den lärde sig."
    scen:
      - "Tänk dig lektion 3 av 7 i SO i åk 3. Klassen gör kartor åt förskoleklassen, som ska till parken för första gången. Varje grupp gör en karta för en av förskoleklassens små grupper, och barnens ord står överst på tavlan: ”Vi vill hitta till lekplatsen själva.”"
      - "I Det ni behöver kunna visar du teckenförklaringen på en karta över skolgården. I första varvet ser du att grupp 2 och 5 har ritat fina tecken som inte står i förklaringen, och de kommer till ditt bord. I Provet följer två ur grupp 4 kartan från grupp 3 med fingret och stannar vid ett tecken de inte förstår."
      - "På Lappen får alla en ny liten karta och frågan: ”Förstår barnen var lekplatsen är? Vad behöver stå i förklaringen?” 7 av 28 svar håller inte för barnen."
    notera: "Notera vad som hände. Grupp 2 och 5 rättade förklaringen vid ditt bord, och i Provet stannade de som följde grupp 3:s karta vid lekplatsen, så grupp 3 skrev att den ska in i förklaringen. Med 7 svar som inte håller kan de flesta, så nästa lektion börjar med teckenförklaringen igen. Med högst 5 hade grupperna gått vidare till vägen till parken, och med 14 eller fler hade du visat igen med en karta över klassrummet."
  - amne: praktisk-estetiska
    amnesnamn: Slöjd
    arskurs: åk 8
    innehall: Material, konstruktion och säkerhet i ett föremål för en mottagare
    overst:
      egen: "Dagens ruta: fogen håller när leksaken tappas. Det som inte håller: delar som lossnar."
      visar: Var och en förklarar för förskolans personal varför fogen håller.
    scen:
      - "Tänk dig en lektion i slöjd i åk 8. Klassen gör leksaker i trä åt förskolan bredvid, och personalen har skrivit sina krav: inga smådelar, rundade kanter och tål att tappas."
      - "I Det ni behöver kunna visar du två sätt att foga trä och hur du prövar att en del sitter fast. I Provet drar två ur en annan grupp i delarna och tappar leksaken på golvet, som ett barn skulle. Innan förskolan får en leksak prövar du den själv."
      - "På Lappen svarar alla på frågan ”Kan personalen lita på leksaken?” och förklarar varför fogen på en ny leksak håller. 3 av 28 svar håller inte."
    notera: "Notera vad som hände. I Provet prövade grupperna personalens krav. Nästan alla kan, så grupperna går vidare, och du går först till de tre."
