lararensFragor:
  rubrik: Lärarens frågor
  fragor:
    - { fraga: "Får jag dela klassen efter nivå, med olika texter?", svar: "Välj hellre samma text, och ge mer stöd i hur ni läser: högläsning, par och ord före. Då samtalar alla om samma sak.", komponent: Paren gör samma sak }
    - { fraga: "Får jag stryka Ni tar över när tiden är knapp?", svar: "Nej. Korta Jag tänker högt eller tavlan. En kort bit räcker, men paren behöver den i varje lektion. Det är den som faller bort: överlämningen syntes minst i ett stort försök (Torres Blas m.fl., 2026).", komponent: Eleverna tar över }
    - { fraga: "Måste jag alltid visa strategin först?", svar: "Nej. När klassen kan strategin får paren börja, och du ger återkoppling efter hand (Skolforskningsinstitutet, 2019). En ny strategi behöver eleverna höra först.", komponent: Läraren visar }
    - { fraga: "Hur hinner jag kursen när vi läser så lite?", svar: "I början hinner ni lite text, och farten kommer. Lägg samtalet på texter ni ändå läser. Har du få lektioner, dela veckans två med en kollega i svenska eller SO." }
    - { fraga: "Vad tänker jag högt om när jag redan kan texten?", svar: "Säg vad texten inte säger, och vad läsaren måste räkna ut: ”Här står inte varför. Hur kan en läsare veta det?” Stanna också där en elev kan ta fel.", komponent: Läraren visar }
    - { fraga: "Vad gör jag när klassen enas om något som är fel i ämnet?", svar: "Läs stället igen, låt eleverna pröva och säg sedan kort vad som stämmer. En berättelse får stå olöst, men i faktatext och matematik finns ett svar." }
hinder:
  rubrik: Det svåraste med metoden
  text: "Läraren tänker åt eleverna, också när alla delar är med. De hör dig tänka men får aldrig göra det själva, och du märker det sällan. I ett stort försök i riktade grupper sa 99 procent av de svarande att de följde materialet, men vid besöken syntes överlämningen minst, och effekten, 0,055, var inte säker (Torres Blas m.fl., 2026). Spela därför in fem minuter och räkna hur ofta en elev talar efter en annan. Bestäm före lektionen vad du inte gör, och var tyst medan två elever talar efter varandra."
  kort: "Det som faller bort är att eleverna tänker själva. Bestäm före lektionen vad du inte gör, och var tyst medan två elever talar efter varandra."
  komponent: Eleverna tar över
fallgropar:
  rubrik: Vanliga fallgropar
  rader:
    - { fallgrop: Strategierna blir en lista, hander: "Klassen går igenom de fyra strategierna i ordning, eller skriver samma slags mening vid varje stopp, fast texten ber om något annat.", prova: "Läs en bit, och låt texten avgöra vilken strategi ni tar.", komponent: De fyra tankestrategierna }
    - { fallgrop: Strategierna försvinner, hander: "Klassen samtalar om texten, men ingen vet längre vad som hjälpte, så eleverna kan inte göra om det själva.", prova: "Säg strategins namn när den har hjälpt, och fråga efteråt vad som tog er vidare.", komponent: De fyra tankestrategierna }
    - { fallgrop: Läraren spelar läsare, hander: "Du visar en färdig tolkning, och eleverna ser ingen som tvekar.", prova: "Stanna där du verkligen undrar, och säg vad du inte vet.", komponent: Läraren visar }
    - { fallgrop: Paren får en annan uppgift, hander: "Du tänker högt, men vid nästa stopp får paren en fråga som inte har med strategin att göra, så de får inte pröva själva.", prova: "Välj två stopp där samma strategi behövs, och säg: ”Nu gör ni som jag gjorde.”", komponent: Paren gör samma sak }
    - { fallgrop: Du lämnar aldrig över, hander: "Av oro för ordningen ger du paren ingen bit.", prova: "Ge paren en bit i varje lektion, och sitt hos ett par i taget.", komponent: Eleverna tar över }
    - fallgrop: När eleverna vill ha ditt svar
      moment: [Vi tänker tillsammans]
      hander: Eleverna frågar vad som är rätt, och samtalet stannar hos dig.
      steg: ["”Jag säger vad jag tror sist.”", "”Vad säger texten?”", "Låt en annan elev svara.", "Säg din tanke som en läsare, och fråga vad de säger."]
    - fallgrop: När ett par inte kommer igång eller har fastnat
      moment: [Vi tänker tillsammans, Ni tar över]
      hander: Paret tittar på dig, medan de andra paren arbetar.
      steg: ["Gå dit och lyssna en stund.", "”Var i texten är ni?”", "”Skriv ett ord du tänker på.”", "Tänk högt om en mening när det behövs.", "Säg vad de ska göra, och gå vidare."]
hallFast:
  rubrik: Fem saker att hålla fast vid
  rader:
    - { sak: "När tiden är knapp: gör samtalet kort och stryk det inte", text: "Lärare som stryker samtalet tappar det, och en kort bit i varje lektion håller vanan vid liv." }
    - { sak: "Före ett lov eller en provperiod: boka nästa lektion", text: "Det som inte är bokat kommer sällan tillbaka. Börja med parrutinen och en kort text." }
    - { sak: "När en kollega tar över: låt hen se en lektion först", text: "Kollegan ärver upplägget, men behöver se dig tänka högt. Gå igenom kärnan och Strategikorten, och ge hen texterna med stoppen." }
    - { sak: "När arbetsområdet byts: ta strategierna med dig", text: "Eleverna tar inte med sig strategierna själva, så de behöver möta dem med samma ord i nästa ämne." }
    - { sak: "När det går bra: ge klassen en svårare text", text: "Utan motstånd finns inget att reda ut." }

# ---------------------------------------------------------------------------------------------------------------------
# Bilaga A Att skriva ut
# ---------------------------------------------------------------------------------------------------------------------
ramar:
  rubrik: Materialet för klassen
  text: ["Utöver lektionskortet finns Strategikorten till klassen. De står på egna sidor."]
  ramar:
    - rubrik: Strategikorten
      text: ["Till varje tankestrategi finns ett kort i halvt A4. Eleverna håller korten i handen när de samtalar om texten. Framsidan säger när kortet behövs, och baksidan vad man kan säga och fråga. Skriv ut korten dubbelsidigt och vänd längs långsidan. Klipp på linjen, så ger två ark de fyra korten. Varje par har en uppsättning, och du har en likadan. Till 28 elever behöver du 15 ark med de två första sidorna med kort, Förutspå och Ställa frågor, och till vecka 3 lika många med de två sista, Reda ut och Sammanfatta. Den som är ny i svenska skriver kortets namn på raden På mitt språk."]
planeringsmall:
  text: "Skriv kort. Det grå är samma i varje lektion. Läs texten först och se var du stannar, för det avgör vilken tankestrategi du visar. Välj sedan ett stopp till där samma strategi behövs, och från lektion 4 ett tredje där paren väljer själva. Tabellen Så väljer du text och stopp visar hur."
  fore:
    - { etikett: "Stoppen i texten", rader: ["1", "2", "3"], falt: stopp, fot: "Tankestrategin jag visar:", fotFalt: undrar }
    - { etikett: "Det eleverna behöver", rader: ["Varför vi läser:", "De behöver veta:", "Ord att förbereda:", "Det jag inte gör i dag:"], falt: [varfor, veta, ord, inte] }
  delar:
    - { fas: Inför läsningen, skriv: "Frågan vi börjar med, eller skälet:", hojd: 0.6 }
    - { fas: Jag tänker högt, skriv: "Stället och det jag säger:", hojd: 0.8 }
    - { fas: Vi tänker tillsammans, skriv: "Min fråga, så att paren gör samma sak:", not: "Säg vad paren gjorde, och räkna två elever för varje par utan ledtråd.", hojd: 0.7 }
    - { fas: Ni tar över, skriv: "Biten och uppgiften till paren:", hojd: 0.7 }
    - { fas: Efter läsningen, not: "Tillbaka till gissningarna. Tavlan, vilken strategi som hjälpte och lappen. Lektion 1 och 2 utan lapp och utan kryss 4.", hojd: 0.5 }
  beslut: { nastanAlla: "Hos paren:", deFlesta: "Stoppet:", halften: "Stället:" }
  efter:
    text: "Fyll i efter lektionen."
    kontrollen: "Vi tänker tillsammans: ___ elever i par utan ledtråd"
    hogar: "Lappar med en egen tanke och en ledtråd: ___ av ___. Det olösta:"
    sag: "Det jag hörde, med elevernas ord"
    nasta: "Nästa lektion börjar med"
    forst: "Jag går först till"
observation:
  fraga: Vem tänker om texten, och när lämnar läraren över tänkandet?
  text: "Skriv ut dubbelsidigt. Välj med läraren två elever, A och B, gärna en som sällan talar. Sitt hela lektionen där du hör fyra par, och numrera eleverna i Vem talar efter vem. Skriv tre repliker ordagrant. Det paret gör räknas för båda, en fråga eller tanke för den som sa den. Av åtta elever: Nästan alla är 7–⁠8, De flesta 5–⁠6, Några 2–⁠4 och Få 0–1."
  fokus: Väljer paren strategi själva när de tar över?
  huvud: ["Texten och stoppen"]
  kolumner:
    - { namn: Läraren säger, text: det läraren säger och gör, bredd: 30 }
    - { namn: Eleverna säger, text: ordagrant, bredd: 30, elever: true }
    - { namn: Vem talar efter vem, text: nummer eller pil, bredd: 21 }
  tecken: "+ om texten, L ledtråd, k kamrats tanke, 0 inget, s sa det på sitt språk."
  delar:
    - { fas: Inför läsningen, rader: 1 }
    - { fas: Jag tänker högt, rader: 1 }
    - { fas: Vi tänker tillsammans, rader: 2, rakna: "Par utan ledtråd: __ av __  Läraren valde: egen bit · stopp · tänkte högt" }
    - { fas: Ni tar över, rader: 4, rakna: "Läraren satt hos: ___ par" }
    - { fas: Efter läsningen, rader: 1 }
  streck:
    - { etikett: Läraren, drag: ["Väntade", "Tog upp svaret", "Gav återkoppling", "Gav ordet vidare"] }
    - { etikett: Eleverna, drag: ["Valde strategi", "Tog upp tanke", "Egen fråga", "Sa: tog stopp"] }
  rader:
    - "Använde en tankestrategi där texten krävde det: __ av __. Sa vad som hjälpte: __ av __"
    - "Läraren tänkte högt med en tankestrategi vid ett verkligt stopp: ja · nej"
    - "Gjorde samma sak som läraren: __ av __. Tog upp en kamrats tanke: __ av __. Fick återkoppling: ja · nej"
    - "Stannade själva där det tog stopp: __ av __. Egen fråga: __ av __. Lappar med en egen tanke och en ledtråd: __ av __. Läraren talade mindre i slutet: ja · nej"

# ---------------------------------------------------------------------------------------------------------------------
# Bilaga B Valet och forskningen
# ---------------------------------------------------------------------------------------------------------------------
passar:
  rubrik: När passar metoden?
  kort: "ni läser en text som går att tolka och behöver tala om den. Ett nytt moment passar bättre med Explicit undervisning."
  rader:
    - { fraga: "Vad ska eleverna lära sig?", metoden: "Att förstå en text som går att tolka, eller ett problem som måste läsas noga.", annat: "Ett nytt moment med ett säkert svar. Välj Explicit undervisning." }
    - { fraga: "Vilken text har ni?", metoden: "Texten har något olöst, och den går att klara med stöd.", annat: "Texten är så lätt att inget behöver redas ut (Skolforskningsinstitutet, 2019), eller så svår att ni fastnar i orden." }
    - { fraga: "Hur läser eleverna?", metoden: "De flesta läser orden hyggligt, eller så läser du högt.", annat: "Många behöver mer än högläsning. Ta det med specialläraren." }
    - { fraga: "Vad ska eleverna kunna efteråt?", metoden: "Tänka kring en text, fråga och förklara hur de tänker.", annat: "Komma ihåg fakta. Välj Testbaserat lärande." }
    - { fraga: "Vad behöver klassen?", metoden: "Samtal om innehållet i en text.", annat: "Att samarbeta i sig. Välj Kooperativt lärande. En liten grupp behöver mycket stöd. Välj Textsamtal i grupp." }
  tumregel: Finns det något i texten att reda ut, och behöver eleverna tala om det, passar metoden. Valkartan är ett stöd för tanken och ingen regel.
  metoder: [explicit-undervisning, testbaserat-larande, kooperativt-larande]
invandningar:
  rubrik: Invändningar och nyanser
  fragor:
    - fraga: Fungerar metoden i en hel klass, eller bara i små grupper?
      svar: "Forskningsstödet är starkast i små grupper, och en översikt avråder från metoden i klass och för yngre elever (Hansford m.fl., 2026). I hela klasser i England gav metoden ingen effekt, medan riktade grupper gav 0,14 och 0,18 (O'Hare m.fl., 2023). I Sverige blev det 0,07 för klassen och 0,46 för dem med lägst förtest (Tengberg m.fl., 2015). Räkna inte med ett lyft på klassens läsprov. Effekten var störst för eleverna med lägst förtest, och här talar också de i par."
    - fraga: Blir det inte en checklista med fyra strategier?
      svar: "Det kan det bli. Strategier hjälper inte om de används mekaniskt, för det avgörande är hur och när (Skolforskningsinstitutet, 2019). Hos Palincsar och Brown (1984) kom varje strategi ur ett problem i texten, men samtalet gick i en fast rytm. Ingen studie har jämfört rytmen med att låta texten välja. När hela klasser i England lät texten välja gav det ingen effekt. Tiden räckte inte till alla fyra, särskilt inte frågorna (O'Hare m.fl., 2023). Här väljer texten strategin, men gången står kvar."
    - fraga: Ska eleverna inte hellre lära sig innehållet?
      svar: "Metoden går ut på att eleverna förstår texten. Ett svagt underlag om elever i lässvårigheter visar att strategier bara gav effekt tillsammans med undervisning i bakgrundskunskap (Peng m.fl., 2023). Strategierna hjälper eleven att använda det hen vet. Därför läser ni ämnets egna texter, och du säger det texten tar för givet innan ni läser."
    - fraga: Hjälper det verkligen att eleverna pratar mer?
      svar: "Inte av sig självt. I 72 klasser i England hängde samtalet mellan lärare och klass ihop med resultaten på de nationella proven när många deltog och utvecklade eller ifrågasatte det andra hade sagt (Howe m.fl., 2019). Det avgörande är vad eleverna gör med varandras tankar."
grund:
  rubrik: Det forskningen visar
  text:
    - "Reciprok undervisning kommer från Palincsar och Brown (1984), som lät lärare och elever turas om att leda samtalet om en text. Det mesta av stödet sedan dess gäller läsning, och främst små grupper med elever i lässvårigheter: en översikt gav 0,48 i fem jämförelser (Hansford m.fl., 2026). Försöken gäller mest åk 3–⁠8."
    - "I hela klasser är effekten mindre. En metaanalys, alltså en sammanställning av många studier, gav d = 0,19 på standardiserade prov och 0,79 på förmågan att använda strategierna (Okkinga m.fl., 2018). Den största prövningen i helklass gav ingen effekt, medan riktade grupper fick 0,14 på läsning och 0,18 på förståelse (O'Hare m.fl., 2023). Tre stora studier av en nära släkting, Collaborative Strategic Reading (CSR), gav 0,05 (Baye m.fl., 2019) och en stor prövning i riktade grupper 0,055 (Torres Blas m.fl., 2026), och skillnaderna var inte säkra. I svenska klasser gav metodens närmaste släkting 0,07 för alla, inte säkert, och 0,46 för eleverna med lägst förtest (Tengberg m.fl., 2015). Kooperativa grupper gav inget utöver strategierna (Klang m.fl., 2022)."
    - "Vilka delar bär effekten? Hos elever i lässvårigheter gav fler strategier inte större effekt, ingen enskild var bäst, och effekten krävde bakgrundskunskap (Peng m.fl., 2023). Ett mål för läsningen gav större effekt, men det visar få jämförelser (Okkinga m.fl., 2018). Effekten blev också större när eleverna fick följa och utvärdera sin läsning (Skolforskningsinstitutet, 2019). I en studie gav elevledda smågrupper mer än jämförelsegruppen, men det gjorde inte par (Skolforskningsinstitutet, 2019). Klassamtal hänger ihop med provresultaten när många deltar (Howe m.fl., 2019)."
    - "I NO, matematik och engelska som modersmål finns ett stort försök i England med dialogisk undervisning utan metodens strategier, och det gav positiva tal på ämnesprov (Jay m.fl., 2017). En uppföljning året efter fann ingen effekt på de nationella proven. Studierna med metoden i SO och NO mäter läsning. I matematik gav åtta små studier som kallar metoden Reciprocal Teaching stora tal (Laia och Dasari, 2025). Stödet i skrivning bygger på ett försök i Jordanien (Hamadneh och Kazem, 2016), och det sociala på ett försök från 1988 och en lärares berättelse (Gilbert, 2018). Metodkortet väger inte in dialogisk högläsning, eftersom ingen studie med jämförelsegrupp har prövat just de här dragen i en vanlig klass i F–⁠2. Liknande högläsning i hela klassen har stöd för ordförrådet, men förståelsen är inte visad."
lasMer:
  - { slag: text, titel: "Reciprok undervisning", upphov: "Reichenberg, Andersson och Berthén, Skolverket", ar: 2023, adress: "https://larportalen.skolverket.se/api/resource/P03WCPLAR177254", oppnad: 2026-11-07, text: "Metoden på svenska, med verkliga samtal i små grupper och hur läraren håller eleverna kvar i texten." }
  - { slag: text, titel: "Att läsa mellan och bortom raderna", upphov: "Reichenberg, Skolverket", ar: 2023, adress: "https://larportalen.skolverket.se/api/resource/P03WCPLAR177253", oppnad: 2026-11-07, text: "Vad en inferens är, med exempel på hur läraren tänker högt om varför-frågor." }
  - { slag: text, titel: "Textsamtal för lärande", upphov: "Körling, Skolverket", ar: 2018, adress: "https://larportalen.skolverket.se/api/resource/P03WCPLAR097639", oppnad: 2026-11-07, text: "Hur textsamtal blir ett arbetssätt i alla ämnen, också med läromedlets texter." }
  - { kalla: skolforskningsinstitutet-2019, text: "Vilka strategier som hjälper, och hur och när de hjälper, med en sammanfattning på sex sidor." }
  - { slag: text, titel: "Utforskande och fördjupande litteratursamtal", upphov: "Tengberg, Johansson, Sønneland m.fl., Karlstads universitet", adress: "https://www.kau.se/files/2024-12/L%C3%A4rarhandledning_UTFORSK.pdf", oppnad: 2026-11-07, text: "Hur du leder ett samtal i hela klassen om en svår text, med två utskrivna exempel." }
  - { slag: bok, titel: "Läsförståelse genom strukturerade textsamtal", upphov: "Reichenberg och Lundberg", ar: 2011, adress: "https://libris.kb.se/xg8930p82hh9mh4", oppnad: 2026-11-07, text: "Samtal som lärare och elever har haft, med metoden och mer stöd för den som behöver det." }
  - { slag: bok, titel: "Det flerstämmiga klassrummet", upphov: "Dysthe", ar: 1996, adress: "https://libris.kb.se/zg84xwh942z0", oppnad: 2026-11-07, text: "Varför elever lär sig av flera röster, som grund för det dialogiska." }

