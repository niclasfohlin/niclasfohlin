# Lathunden
# ---------------------------------------------------------------------------------------------------------------------
lathund:
  metoden:
    text:
      - "Eleverna lär sig fyra tankestrategier: förutspå, ställa frågor, reda ut och sammanfatta. Ledtråden är stället i texten som stöder tanken. På lappen står elevens egen tanke med en ledtråd."
      - Lärandet går till så här. En van läsare tänker tyst, så du visar en strategi högt. Paren gör samma sak, får återkoppling och gör det sedan själva. Så blir det elevens sätt att läsa.
  lektion:
    text: "Första lektionen lär sig klassen parrutinen, så Inför läsningen tar femton minuter. Sedan läser ni en kort text ur Ta fram en lästext. Vik undan frågorna under texten. Du tänker högt med Förutspå vid första stoppet, och paren gör samma sak vid det andra. Lektion 2 och 3 har egna tider. Från lektion 4 leder du med lektionskortet."
  igang:
    rubrik: De första fem veckorna
