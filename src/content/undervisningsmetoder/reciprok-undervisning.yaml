      - "Tänk dig en lektion i svenska i åk 5, där tankestrategin är Ställa frågor. Eleverna har skrivit en första version av en berättelse, och i dag läser en kamrat den som läsare."
      - "Du visar på tavlan en text som en elev har lånat ut, och tänker högt: ”Vem är han? Jag tror att det är brodern, men det står inte. Jag ställde en fråga till texten.”"
      - "I Vi tänker tillsammans byter paren texter: ”Nu gör ni som jag gjorde. Vad undrar ni?” De läser en bit i taget och sätter frågetecken. Du går runt och hör en kamrat säga: ”Vem är han? Jag trodde att det var pappan.” Då säger du: ”Du frågar om något som inte står.” Två par har bara rättat stavning, alltså 4 av 28 elever. Nästan alla kan, så paren fortsätter medan du sitter hos de två. Sist skriver varje författare en mening i sin text där kamraten stannade."
    notera: "Notera vad som hände. Författaren såg var läsaren stannade, och det ser man inte i sin egen text. Om sju par hade rättat stavning, hade du visat en gång till."
  - amne: matematik
    arskurs: åk 3
    innehall: Att reda ut en textuppgift med division och rest innan klassen räknar
    overst:
      egen: "Du stannar och läser om frågan, och paren gör samma sak. Felet: paren räknar innan de har läst."
      visar: "Vad svaret måste klara, och ledtråden understruken i problemet."
    scen:
      - "Tänk dig en lektion i matematik i åk 3, där tankestrategin är Reda ut. På papperet står: ”Grannklassen har 22 elever. De ska åka bil till simhallen, som öppnar klockan nio. Det får plats 4 elever i varje bil. Hur många bilar behövs?”"
      - "Du läser högt och stannar vid klockan nio: ”Behövs det? Jag läser frågan igen. Nej, den gäller bilar. Jag stannade och läste om.” Sedan säger du: ”Nu gör ni som jag gjorde. Vad måste svaret klara?” Paren skriver och stryker under ledtråden. Åtta par har redan räknat utan ledtråd, alltså 16 av 28 elever."
      - "Hälften eller färre kan, så du visar en gång till: ”Vad måste gälla för alla 22?” Paren skriver om, och du säger: ”Ni läste frågan före talen.” Du skriver svaren ”5 och 2 över” och ”6 bilar”. ”Vilket håller? Var ser du det?” Klassen säger att ingen får bli kvar. Paren läser ett nytt problem själva, och på lappen står vad svaret måste klara, med en ledtråd."
    notera: "Notera vad som hände. Texten sa inte att alla ska med, så eleverna fick tänka som i en berättelse. Frågan om vad som inte behövs tog bort simhallens tid. Med högst två par utan ledtråd hade paren räknat vidare själva."
  - amne: so-no
    amnesnamn: NO
    arskurs: åk 8
    innehall: Att sammanfatta ett stycke om kolets kretslopp i läroboken
    overst:
      egen: "Du sammanfattar stycket i en mening, och paren gör samma sak med nästa stycke. Felet: paren skriver av boken."
      visar: "En mening om stycket, och ledtråden med egna ord på ett papper, eftersom boken inte går att skriva i."
    scen:
      - "Tänk dig en lektion i NO i åk 8, där du visar Sammanfatta. Klassen läser om kolets kretslopp i läroboken, och du stannar efter första stycket: ”Det var mycket på en gång. Det här stycket handlar om hur växterna tar upp kol ur luften. Jag tog det viktigaste och lämnade resten.”"
      - "Nästa stycke heter Kolet kommer tillbaka. ”Nu gör ni som jag gjorde. Sammanfatta stycket i en mening.” Paren skriver meningen och visar ledtråden, det viktigaste stället. Du går runt och säger: ”Du tog med det viktigaste och lämnade resten.” Två par saknar en ledtråd, alltså 4 av 28 elever."
      - "Nästan alla kan, så paren läser nästa stycke själva medan du sitter hos de två. Ett par som har skrivit att kolet försvinner läser om stycket och ändrar meningen. En elev undrar varför kolet i olja inte kom tillbaka förrän vi började elda den. På lappen skriver alla en egen mening om stycket med ämnets ord och en ledtråd."
    notera: "Notera vad som hände. I faktatext finns ett svar, och paret ändrade sin mening själv när det prövade den mot texten. Frågan om oljan blev nästa lektions skäl att läsa. Med sju par utan ledtråd hade du visat en gång till."
  - amne: praktisk-estetiska
    amnesnamn: Hem- och konsumentkunskap
    arskurs: åk 7
    innehall: Att läsa ett recept före arbetet
    overst:
      egen: "Du ställer en fråga till receptet, och paren gör samma sak. Felet: paren börjar baka utan att ha läst."
      visar: "En mening om varför man vänder försiktigt, och steget i receptet."
    scen:
      - "Tänk dig en lektion i hem- och konsumentkunskap i åk 7, där klassen ska baka en sockerkaka. Inför läsningen säger du varför ni läser. Sedan tänker du högt: ”Varför står det vispa pösigt? Jag tror att det har med luften att göra, men jag är inte säker. Jag ställde en fråga till receptet.”"
      - "I Vi tänker tillsammans ber du paren läsa nästa steg: ”Nu gör ni som jag gjorde. Vad undrar ni om det?” De frågar varför man ska vända ner mjölet försiktigt, prövar ett svar, skriver det och visar steget i receptet. Du går runt och säger: ”Ni frågar varför det står så.” Tre par saknar en ledtråd, alltså 6 av 28 elever."
      - "De flesta kan, så paren läser nästa steg själva med ett stopp, där de visar sin ledtråd för paret bredvid. Du frågar: ”Vad gör luften i smeten?” En elev säger: ”Den lyfter kakan, så den får inte försvinna.” Sedan börjar klassen baka."
    notera: "Notera vad som hände. Du undrade varför, så eleverna läste receptet som en text med skäl. Med sju par utan ledtråd hade du visat en gång till."
stod:
  rubrik: Elever som behöver mer stöd
  rader:
    - { nar: Den som är ny i svenska, metoden: "Samma text och samma fråga som klassen, tyst stund innan paren talar, Strategikortens meningar att låna och en lapp med ledtråden avskriven och tanken på sitt språk eller som bild.", du: "Ge texten och tre ord med bild dagen före. Eleven pekar ut ledtråden och säger tanken på sitt språk eller med ett ord. Kamraten säger den på svenska och skriver den på lappen, och eleven upprepar den." }
    - { nar: Den som läser mödosamt, metoden: "Bit 1 och 2 läser du, så att alla kan tänka med, och den som vill slipper läsa högt.", du: "Kamraten läser bit 3, eller så lyssnar eleven på den inlästa texten. Eleven säger vad hen tänker, och kamraten skriver, också på lappen. Eleven pekar ut ledtråden och ställer frågan." }
    - { nar: Den som sällan säger något, metoden: "Tyst stund, par och en mening som du kan skriva på tavlan utan namn.", du: "Fråga eleven om du får skriva hens mening på tavlan. Låt eleven låna en mening från Strategikortet, och låt kamraten börja." }
    - { nar: När många behöver hjälp samtidigt, metoden: "Utfallet i Vi tänker tillsammans säger vad du gör.", du: "Visa en gång till: tänk högt om stället. Medan paren skriver om, hjälper du ett par i taget." }
    - { nar: När metoden inte räcker, metoden: "Lapparna visar det: samma elev saknar en egen tanke med en ledtråd två veckor i rad.", du: "Spara lapparna, och ta dem med till specialläraren: är det orden, läsningen eller förståelsen? Textsamtal i grupp är stödet för en liten grupp." }

