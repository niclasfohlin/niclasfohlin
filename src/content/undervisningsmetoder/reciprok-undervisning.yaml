tidsschema:
  rubrik: En lektion på 45 minuter
  rader:
    - { tid: Före lektionen, fas: Före lektionen, vad: "Välj en text med något olöst och läs den själv, för där du stannar ser du vilken tankestrategi du ska visa. Välj sedan tre stopp enligt tabellen Så väljer du text och stopp, och vik texten där. Förbered högst tre ord, och bestäm vad du inte gör i dag." }
    - { tid: 0–⁠7 min, fas: Inför läsningen, form: Gemensamt, vad: "Du säger varför ni läser och vad eleverna behöver veta. Paren förutspår vad texten handlar om." }
    - { tid: 7–⁠12 min, fas: Jag tänker högt, form: Läraren visar, vad: "Du läser bit 1, stannar där du undrar och tänker högt med en tankestrategi. Paren säger vad de tänker." }
    - { tid: 12–⁠26 min, fas: Vi tänker tillsammans, form: I par, vad: "Du läser bit 2, och paren använder samma strategi med din fråga som stöd. De skriver en mening och får återkoppling. Sedan prövar klassen två på tavlan." }
    - { tid: 26–⁠36 min, fas: Ni tar över, form: I par, vad: "Paren läser bit 3 växelvis, stannar själva där det tar stopp och väljer tankestrategi. Du sitter hos ett par i taget." }
    - { tid: 36–⁠45 min, fas: Efter läsningen, form: Gemensamt, vad: "Ni går tillbaka till gissningarna, samlar det ni vet och det som är olöst, och säger vilken strategi som tog er vidare. Alla skriver lappen." }
    - { tid: Efter lektionen, fas: Efter lektionen, vad: "Läs lapparna, och stryk under ledtråden när den stöder tanken. Välj en fråga ur det olösta till nästa lektion, och skriv ner två repliker du minns." }
  varianter:
    - nar: första lektionen
      text: Lektionskortet gäller från lektion 4, så håll lathundens sida 2 i handen.
      delar:
        - { fas: Inför läsningen, tid: 0–⁠15 min, fraser: ["Vi läser för att se om våra gissningar stämmer."] }
        - { fas: Jag tänker högt, tid: 15–⁠25 min, fraser: ["Jag tror att … men jag är inte säker.", "Det jag gjorde heter att förutspå."] }
        - { fas: Vi tänker tillsammans, tid: 25–⁠35 min, fraser: ["Nu gör ni som jag gjorde.", "Peka på ordet som fick dig att tänka så."] }
        - { fas: Ni tar över, tid: 35–⁠40 min, fraser: ["Läs resten växelvis. Stämde det?"] }
        - { fas: Efter läsningen, tid: 40–⁠45 min, fraser: ["Vad tog er vidare i texten?"] }
    - nar: lektion 2 och 3
      text: "Parrutinen tar fem minuter. Texten har två stopp, ett för dig och ett för paren. I lektion 2 sätter du ett frågetecken i din text där du stannar, så att paren ser hur de ska göra. De stryker också under ett ord som ledtråd. I lektion 3 skriver paren sin första mening, och alla skriver lappen för första gången. Från lektion 4 har texten tre stopp. Minuterna:"
      delar:
        - { fas: Inför läsningen, tid: 0–⁠10 min }
        - { fas: Jag tänker högt, tid: 10–⁠20 min }
        - { fas: Vi tänker tillsammans, tid: 20–⁠32 min }
        - { fas: Ni tar över, tid: 32–⁠38 min }
        - { fas: Efter läsningen, tid: 38–⁠45 min }
    - nar: från vecka 5
      text: Du behöver inte visa lika länge, så paren får mer tid själva.
      delar:
        - { fas: Inför läsningen, tid: 0–⁠7 min }
        - { fas: Jag tänker högt, tid: 7–⁠11 min }
        - { fas: Vi tänker tillsammans, tid: 11–⁠23 min }
        - { fas: Ni tar över, tid: 23–⁠36 min }
        - { fas: Efter läsningen, tid: 36–⁠45 min }
    - nar: en lektion i F–⁠2
      text: "Tre korta lektioner i veckan i stället för två långa. Du läser allt, och barnen talar med sin kompis, som tabellen Dialogisk högläsning i F–⁠2 visar."
      delar:
        - { fas: Inför läsningen, tid: 0–⁠3 min }
        - { fas: Jag tänker högt, tid: 3–⁠6 min }
        - { fas: Vi tänker tillsammans, tid: 6–⁠12 min }
        - { fas: Ni tar över, tid: 12–⁠15 min }
        - { fas: Efter läsningen, tid: 15–⁠20 min }
    - nar: tjugo minuter i veckan, efter vecka 12
      text: "En kort lektion på en text i ämnet kan hålla vanan vid liv. Paren skriver sin mening, och klassen prövar två på tavlan."
      delar:
        - { fas: Inför läsningen, tid: 0–⁠3 min }
        - { fas: Jag tänker högt, tid: 3–⁠6 min }
        - { fas: Vi tänker tillsammans, tid: 6–⁠14 min }
        - { fas: Ni tar över, tid: 14–⁠18 min }
        - { fas: Efter läsningen, tid: 18–⁠20 min }
