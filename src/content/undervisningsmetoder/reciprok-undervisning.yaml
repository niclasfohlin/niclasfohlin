# Lär dig metoden
# ---------------------------------------------------------------------------------------------------------------------
plan:
  passen:
    - { nar: första lektionen, text: "Först lär sig klassen parrutinen på något lätt. Sedan läser ni en kort text med två stopp, som Skrapet på dörren (Mellan, text 2) eller Dagen före (Avancerad, text 10) på sidan Ta fram en lästext. Vik undan frågorna under texten. I SO och NO tar du sju till tjugo meningar ur läroboken eller ur en faktatext. Vid det första stoppet tänker du högt med Förutspå, säger vad strategin heter och visar kortet ur Strategikorten. Vid det andra gör paren samma sak och pekar på ordet som fick dem att gissa. Lektionskortet gäller från lektion 4, så håll lathundens sida 2 i handen." }
  fore: ["Välj ämnet och minst två lektioner i veckan. I 7–⁠9 kan en vara i svenska och en i SO eller NO."]
  utvardering: ["Fortsätt två lektioner i veckan till vecka 12. En kollega ser en lektion i månaden: vem tänker? Läs lapparna från vecka 4 och 5 med specialläraren. Den som behöver mer stöd får Textsamtal i grupp."]
  skattningar:
    - namn: Hur säker är jag på metoden?
      vem: lararen
      rad: lararen
      text: "Skatta när veckan är slut. Tänk på kärnans fyra: Använde ni en tankestrategi där texten krävde det? Tänkte du högt med den vid ett verkligt stopp? Gjorde paren samma sak och fick återkoppling? Stannade paren själva och valde strategi?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: osaker }
    - namn: Hur väl fungerar den i praktiken?
      vem: lararen
      rad: klassen
      text: "Tänk på det du ser och hör i klassen: gör paren som du gjorde och visar en ledtråd i texten? Säger eleverna själva var det tar stopp? Tar de upp vad en kamrat sa?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: klassenstar }

