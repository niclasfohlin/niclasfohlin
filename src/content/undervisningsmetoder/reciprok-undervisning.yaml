# ---------------------------------------------------------------------------------------------------------------------
# 1 Metoden
# ---------------------------------------------------------------------------------------------------------------------
inledning:
  - "Reciprok undervisning är ett sätt att läsa och förstå texter tillsammans med klassen i alla ämnen. Metoden bygger på fyra tankestrategier: att förutspå vad som kommer, att ställa frågor till texten, att reda ut det man inte förstår och att sammanfatta det man har läst. Så tänker en van läsare, fast tyst och utan att någon ser det. Här tänker du högt i stället. Du stannar i texten och använder en av strategierna. Vid nästa stopp gör eleverna samma sak i par, med din fråga som stöd, och får återkoppling på hur de gjorde. Sedan använder de strategin själva när texten kräver det. Reciprok betyder ömsesidig: ni turas om att tänka högt och leda, tills samtalet är elevernas. Strategierna är ingen lista att beta av. De är verktyg som ni tar fram när ni är nyfikna på något i texten och vill höra hur andra tänker."
  - "På bänken ligger texten och en penna, och varje par har Strategikorten, ett kort för varje tankestrategi. Korten säger när strategin behövs och ger eleverna ord att börja med. Du läser högt och stannar där du själv undrar. När paren sedan gör samma sak säger båda sin tanke, skriver den i en mening och stryker under ledtråden, det ställe i texten som stöder tanken. Två av meningarna skriver du på tavlan, och klassen prövar dem mot texten: ”Vilken håller? Var ser du det?” Den sista biten läser paren själva. De stannar där det tar stopp och tar det kort de behöver, medan du sitter hos ett par i taget. Sist skriver alla en lapp med en egen tanke och en ledtråd."
  - "Lärandet går till så här. En text säger aldrig allt, eftersom författaren räknar med att läsaren fyller i resten med det hen redan vet. När det inte går tar det stopp, och då hjälper de fyra tankestrategierna läsaren vidare. Eleverna lär sig dem som man lär sig det mesta: de ser någon göra det, gör samma sak med stöd, får höra hur det gick och gör det till slut själva. Det är överlämningen, och på den hänger metoden. Det som först sker högt mellan er blir elevens eget sätt att läsa."
  - "De första fem veckorna har ni minst två lektioner i veckan. Under de fyra första lär sig klassen en tankestrategi i taget, och i den femte börjar eleverna ge ordet vidare till varandra i grupp. Själv övar du på att vänta och lyssna. Ni fortsätter till vecka 12, medan grupperna leder allt mer och korten behövs allt mindre. Sedan använder eleverna strategierna i alla ämnen, också på ett problem i matematiken och ett stycke i SO och NO. I F–⁠2 leder du dialogisk högläsning: du läser högt, och barnen talar."
karna:
  rubrik: "Kärnan: fast och fritt"
  text: Forskningsstödet är starkast i små grupper, så i en hel klass betyder hur du gör mer än namnet på metoden. Det avgörande är att du tänker högt på riktigt, att eleverna får göra samma sak med stöd och att de till slut tar över.
  grundregel: Det här är kärnan, och den håller du fast vid. Texten, ämnet, vilken tankestrategi ni tar i dag och hur ni sitter får du ändra.
  varv: Du visar en tankestrategi, paren gör samma sak och får återkoppling, och sedan gör de det själva.
  komponenter:
    - namn: De fyra tankestrategierna
      moment: [Inför läsningen, Jag tänker högt, Vi tänker tillsammans, Ni tar över, Efter läsningen]
      vad: Eleverna lär sig förutspå, ställa frågor, reda ut och sammanfatta när texten kräver det.
      syns: Eleverna stannar där det tar stopp och gissar, frågar, reder ut eller sammanfattar. De visar stället i texten och kan säga vad som hjälpte.
      varfor: "En text säger aldrig allt, och utan ett sätt att komma vidare läser eleven bara för att bli klar. Komponenten bygger på att varje strategi svarar på ett problem i texten (Palincsar och Brown, 1984). Ingen enskild strategi är bäst (Peng m.fl., 2023), så texten får avgöra vilken ni tar."
      belagg: i-alla
      kallor: [palincsar-och-brown-1984, peng-m-fl-2023]
      kvar: Eleverna möter alla fyra strategierna, använder den som texten kräver och säger vad som hjälpte.
      fritt: "Vilken strategi ni tar i dag, hur många och i vilken ordning de första veckorna."
      kryss: Vi använde en tankestrategi där texten krävde det.
    - namn: Läraren visar
      moment: [Jag tänker högt]
      vad: Du stannar vid ett verkligt stopp, tänker högt med en strategi och säger vad du gjorde.
      syns: Eleverna hör läraren tveka, tänka och säga vad hen gjorde. Sedan gör de samma sak vid nästa stopp.
      varfor: "Det en van läsare gör sker tyst, och den som inte har sett det vet inte att det går. Komponenten bygger på att eleverna hör det. Den hänger ihop med bättre förmåga att använda strategierna, men inte säkert med bättre resultat på läsprov (Okkinga m.fl., 2018)."
      belagg: i-alla
      kallor: [okkinga-m-fl-2018]
      kvar: Eleverna hör dig använda en ny tankestrategi i en riktig text, vid ett verkligt stopp, innan de gör det själva.
      fritt: Vilken strategi du visar, hur många stopp och dina ord. När eleverna är redo tänker de högt i gruppen, och själv tänker du högt där du stannar.
      kryss: Jag tänkte högt med en tankestrategi vid ett verkligt stopp.
      raknas: false
    - namn: Paren gör samma sak
      moment: [Vi tänker tillsammans]
      vad: Vid nästa stopp gör paren som du gjorde, med din fråga som stöd, och får återkoppling på hur de tänkte.
      syns: Paren använder strategin som läraren visade, säger sin tanke och visar stället i texten. Läraren säger vad hen hör, och klassen prövar tankarna.
      varfor: "Eleven behöver pröva strategin själv medan stödet finns kvar och få veta om tanken höll. Hos Palincsar och Brown (1984) ger läraren återkoppling efter elevens nivå, och effekten blev större när eleverna lärde sig märka om de förstod och ge varandra återkoppling (Skolforskningsinstitutet, 2019)."
      belagg: provad
      kallor: [palincsar-och-brown-1984, skolforskningsinstitutet-2019]
      kvar: Paren använder strategin med stöd, säger sin tanke till varandra och får återkoppling på hur de gjorde.
      fritt: "Din fråga, och om eleverna sitter i par eller grupp. Återkopplingen får komma från dig, från en kamrat eller från klassen."
      kryss: Paren gjorde samma sak och fick återkoppling.
    - namn: Eleverna tar över
      moment: [Ni tar över, Efter läsningen]
      vad: Paren stannar själva och väljer tankestrategi, och för varje vecka gör de mer av det du gjorde förut.
      syns: Eleverna stannar själva, ställer frågan och avgör om svaret håller. I grupp väljer de vem som svarar. Läraren talar mindre i slutet av lektionen än i början.
      varfor: "Den som bara lyssnar hör hur andra tänker men tänker inte själv. Elevledda grupper gav mer än lärarledda i en studie (Skolforskningsinstitutet, 2019). Men i ett stort försök syntes överlämningen minst (Torres Blas m.fl., 2026), och i Sverige gav grupper inget utöver strategierna (Klang m.fl., 2022)."
      belagg: provad
      kallor: [skolforskningsinstitutet-2019, torres-blas-m-fl-2026, klang-m-fl-2022]
      kvar: Varje lektion gör eleverna själva något som du gjorde förut. Senast vecka 8 turas de om att leda en bit i gruppen.
      fritt: "Vad du lämnar över först, som frågan, och takten. Par eller grupp före vecka 8. De yngsta frågar med dig bredvid. Ledningen får du ta tillbaka."
      kryss: Paren stannade själva och valde tankestrategi.
roll:
  rubrik: "Lärarens roll: en läsare bland andra"
  text: "Du tänker med klassen som en läsare bland andra, och i huvudet har du hela tiden två saker: eleverna ska förstå texten, och tänkandet ska bli deras."
  fragor:
    - Vilken tankestrategi kräver texten här?
    - Vem tänker just nu, jag eller de?
    - Vad kan jag lämna över nu?
  fragornaText: "Du har dem med dig i varje del av lektionen."
tabeller:
  - rubrik: De fyra tankestrategierna
    plats: efter-inledning
    meny: true
    text: "En tankestrategi är ett sätt att komma vidare i en text, och eleverna ska lära sig använda de här fyra. I alla fyra räknar läsaren ut sådant som inte står. Ni tar fram den strategi texten kräver, så en lektion behöver sällan mer än en eller två. I forskningen heter tankestrategierna lässtrategier, och reda ut heter klargöra."
    kolumner: [Strategin, Läsaren frågar sig, När texten kräver det, Vad den gör]
    rader:
      - ["Förutspå", "”Vad tror jag händer nu?”", "Titeln, en bild eller en vändpunkt ger ledtrådar om vad som kommer.", "Läsaren hämtar fram det hen vet och prövar gissningen mot nästa bit. I faktatext blir frågan vad nästa stycke svarar på."]
      - ["Ställa frågor", "”Vad undrar jag?”", "Något är oklart, eller gör läsaren nyfiken.", "Läsaren stannar vid det viktiga och ser vad hen har förstått."]
      - ["Reda ut", "”Var tog det stopp?”", "Läsaren förstår inte ett ord, ett uttryck eller en mening.", "Läsaren tar sig förbi det som stoppar läsningen."]
      - ["Sammanfatta", "”Vad har jag förstått?”", "En bit är slut, eller det är mycket att hålla ihop.", "Läsaren ser om hen har förstått. Går det inte att sammanfatta biten, läser hen om."]
  - rubrik: "Överlämningen: så blir en tankestrategi elevens"
    plats: efter-inledning
    meny: true
    text: "Att höra dig tänka räcker inte. Eleverna behöver göra samma sak själva, först med din fråga som stöd, och få höra hur det gick. Det är överlämningen: du lämnar över tänkandet ett stopp i taget. Den kallas ofta Jag gör, Vi gör, Ni gör, Du gör, och i lektionen heter delarna Jag tänker högt, Vi tänker tillsammans och Ni tar över. Så här går det till när en klass i åk 4 läser Någon har varit här och du visar Ställa frågor."
    kolumner: [Steget, Det som händer, Så låter det]
    rader:
      - ["1 Du visar", "Du stannar efter bit 1, tänker högt med strategin och säger vad du gjorde.", "”Vänta. Varför tittar mamma på taket? Det står inte. Jag tror att hon inte tror på magontet, men jag är inte säker. Jag stannade och ställde en fråga till texten.”"]
      - ["2 Paren gör samma sak", "Du läser till nästa stopp och ber paren göra som du gjorde. Din fråga är stödet.", "”Nu gör ni som jag gjorde. Vad undrar ni om Emelie? Säg det till din kamrat, och skriv frågan.” Ett par skriver: ”Varför har hon glitter på kinden?”"]
      - ["3 Paren får återkoppling", "Du säger vad du hör, och klassen prövar två frågor mot texten.", "”Ni frågar om något som inte står. Så gör en läsare.” ”Vilken fråga tar oss vidare? Var ser du det?”"]
      - ["4 Paren gör det själva", "Paren läser nästa bit, stannar där det tar stopp och väljer själva tankestrategi.", "En elev säger till sin kamrat: ”Jag undrar vad skölden är till.”"]
      - ["5 Eleven gör det ensam", "Med tiden använder eleven strategin när hen läser själv, också i andra ämnen.", "På lappen står en egen fråga: ”Varför bad Ruben inte om hjälp?”"]
  - rubrik: Så låter det med varje tankestrategi
    plats: efter-inledning
    meny: true
    text: "Gången är densamma för alla fyra. Du visar strategin och säger vad du gjorde, och vid nästa stopp ber du paren göra samma sak. Återkopplingen säger vad eleven gjorde, så att hen kan göra det igen. ”Bra” säger inte det."
    kolumner: [Strategin, Du visar, Du ber paren, Du säger vad du hörde]
    rader:
      - ["Förutspå", "”Jag tror att … för att …”", "”Vad tror ni händer nu? Säg varför.”", "”Du tänkte framåt utifrån det som står.”"]
      - ["Ställa frågor", "”Jag undrar varför …”", "”Vad undrar ni här?”", "”Du frågar om något som inte står.”"]
      - ["Reda ut", "”Nu förstod jag inte. Jag läser igen … kan det vara så här?”", "”Var tar det stopp? Läs stället igen. Vad kan det betyda?”", "”Du märkte att du inte förstod, och du läste om.”"]
      - ["Sammanfatta", "”Den här biten handlar om …”", "”Säg i en mening vad biten handlar om.”", "”Du tog med det viktigaste och lämnade resten.”"]
  - rubrik: Din uppgift inför, under och efter läsningen
    plats: efter-inledning
    text: "Under lektionen går du från att tala till att lyssna."
    kolumner: [När, Det du gör, Det eleverna gör]
    rader:
      - ["Inför läsningen", "Före lektionen väljer du texten, stoppen och tankestrategin du ska visa. I klassen ger du ett skäl att läsa och säger det texten tar för givet.", "Förutspår vad texten handlar om och säger varför."]
      - ["Under tiden ni läser, tänker och samtalar", "Du tänker högt med strategin, ber paren göra samma sak och säger vad du hör. Sedan lämnar du över och lyssnar.", "Gör samma sak i par och prövar tankarna mot texten och mot varandra. Sedan leder de en bit själva."]
      - ["Efter läsningen", "Du läser tavlan och säger vilken strategi som hjälpte och vad du hörde.", "Säger vad som tog dem vidare och skriver en lapp."]
  - rubrik: Så väljer du text och stopp
    plats: efter-inledning
    meny: true
    text: "Välj en text med något olöst. Sju till tjugo meningar räcker. Läs den själv först och lägg märke till var du stannar och vad du gör där, för det är den tankestrategi du ska visa. De första fyra veckorna väljer du en text där veckans strategi behövs. Välj sedan ett stopp till där samma strategi behövs, så att paren kan göra som du gjorde, och ett tredje där de väljer själva. Det kan vara textens slut. Vik texten vid stoppen, så att ingen läser före. Kan paren behöva stanna mitt i sista biten, viker du där också. Går det inte att skriva i texten, som i en lärobok, skriver paren ledtråden med egna ord på ett papper."
    kolumner: [Bra stopp, Tankestrategin]
    rader:
      - ["En vändpunkt, ett öppet slut eller en ny rubrik", "Förutspå"]
      - ["Något som väcker en fråga", "Ställa frågor"]
      - ["Ett nytt ord, eller där en elev kan ta fel", "Reda ut"]
      - ["Slutet på ett tätt stycke", "Sammanfatta"]
  - rubrik: De tre dragen
    plats: efter-progression
    meny: true
    text: "Det är dina svar som håller samtalet igång. Med tre enkla drag låter du elevernas tankar ta samtalet vidare, i hela klassen och när du sitter hos ett par. Det gör metoden dialogisk. Vecka 2 till 4 övar du ett drag i taget."
    kolumner: [Draget, Så kan det låta]
    rader:
      - ["Fråga det du själv undrar", "”Jag undrar varför hon stängde dörren så snabbt.”"]
      - ["Ta upp det eleven sa", "”Du sa att hon har bråttom. Vad i texten får dig att säga det?”"]
      - ["Låt en kamrat pröva tanken", "”Vad säger du om det Ali sa? Var ser du det?”"]
  - rubrik: Vägen till vecka 12
    plats: efter-progression
    meny: true
    text: "Nu lämnar du över mer, och texterna kräver mer. Strategikorten tar du bort ett i taget, när eleverna har slutat titta på dem."
    kolumner: [Veckorna, Klassen, Du, Gå vidare när]
    rader:
      - ["6–⁠7: Bygga vidare", "Eleverna tar upp varandras tankar och lägger ihop två ställen i texten. Den som läser tänker högt med en strategi där det tar stopp.", "Du tänker högt där du stannar, gärna om två ställen: ”Här står … och här står … Då …” Sedan väntar du långt bak i rummet.", "samtalet fortsätter utan dig i de flesta grupper"]
      - ["8–⁠9: Grupperna leder", "Två elever leder var sin bit, som rutinen säger.", "Du viker också texten mitt i bit 3, lyssnar och säger vad du hörde.", "nästan alla har lett en bit två gånger"]
      - ["10–12: Egen läsning", "Var och en läser en bit själv i sin egen kopia av texten, använder de strategier som behövs och sätter ett frågetecken där det tar stopp. Eleven tar frågan till gruppen, och lappen gäller den biten.", "Du flyttar arbetet till ämnets texter.", "nästan alla sätter ett frågetecken utan att du säger till"]
  - rubrik: Dialogisk högläsning i F–⁠2
    plats: efter-progression
    meny: true
    text: "I F–⁠2 läser du högt, och barnen talar. Barn förstår mer när de lyssnar än när de läser själva, så klassen kan samtala om en krävande text långt innan barnen kan läsa den. Tankestrategierna och gången är desamma: du visar, och barnen gör samma sak med sin kompis."
    kolumner: [Det som ändras, I F–⁠2]
    rader:
      - ["Tiden", "Tjugo minuter tre gånger i veckan. Räkna med fler veckor än för de äldre."]
      - ["Texten", "Välj en berättelse där orden berättar mer än bilderna."]
      - ["Bilden", "Håll den dold vid ett stopp om förståelsen, tills barnen har svarat. Vid ett stopp om språk och ord får den stå framme."]
      - ["Barnets minnen", "Välkomna när de förklarar texten. Led tillbaka: ”Tack. Vad sa boken om grannen?”"]
      - ["Orden", "Ta två till fyra ord efter berättelsen, och sätt ett streck på tavlan när ordet hörs i veckan."]
      - ["Strategikort och lapp", "Barnen har inga."]
      - ["Det du räknar", "Lyssna hos samma fyra kompispar varje vecka: hur många par säger ett skäl ur det ni hört?"]
      - ["Beslutet", "Fyra par: gå vidare, och från vecka 5 ställer ett barn nästa fråga. Tre par: ställ frågan en gång till. Två eller färre: tänk högt om stället, och läs det igen."]
      - ["Det barnen tar över", "Frågan: du viskar den till ett barn, som säger den högt. Från vecka 8 ställer barnet frågan utan att du viskar."]
      - ["Veckorna", "1 Förutspå: gissa med ett skäl. 2 Ställa frågor: egna frågor. 3 Reda ut: nya ord. 4 Sammanfatta: vad som hände först, sedan och sist. 5 Den viskade frågan."]
  - rubrik: Dragen i dialogisk högläsning
    plats: efter-progression
    meny: true
    kolumner: [Draget, Så gör du, Så kan det låta]
    rader:
      - ["Uppmana", "Be barnet berätta, och fråga om det som för berättelsen vidare.", "”Vad händer nu? Säg det till din kompis.”"]
      - ["Ta upp", "Upprepa det barnet sa, och fråga vidare.", "”Du sa att hon tar bollarna. Varför gör hon det?”"]
      - ["Bygga ut", "Lägg till ett ord, eller fråga efter det.", "”Var finns bollen? Kan vi få med det?”"]
      - ["Låta barnet säga om", "Barnet säger den längre meningen själv, eller säger vad kompisen tänkte.", "”Säg hela meningen.”"]
      - ["När svaret blir ett ord", "Upprepa ordet, läs om stycket och ställ samma fråga en gång till.", "”Tar. Jag läser igen. Vad gör grannen?”"]
  - rubrik: Andra ämnen
    plats: efter-progression
    meny: true
    text: "De fyra tankestrategierna går att använda på allt som måste läsas noga. Gången är densamma: du visar, och eleverna gör samma sak. Sidorna Ta fram en faktatext och Ta fram ett matteproblem ger texter att börja med. Forskningen ger mest stöd för att eleverna läser ämnets texter bättre, och svagt stöd för att de kan mer av ämnet."
    kolumner: [Ämnet, Texten, Så använder ni strategierna]
    rader:
      - ["Matematik", "En textuppgift", "Läs tre gånger: vad handlar det om, vad ska vi ta reda på och vad behövs? Reda ut det som är oklart, och pröva svaret mot problemet."]
      - ["NO och teknik", "Ett stycke i läroboken", "Förutspå vad nästa stycke svarar på. Reda ut de ord texten tar för givet."]
      - ["SO", "En källa, en karta eller en artikel", "Förutspå vad nästa stycke svarar på. Ställ frågor till källan: vem gjorde den, och när? Reda ut en karta eller ett begrepp."]
      - ["Engelska, moderna språk", "En text på språket, gärna under elevernas nivå", "Ett stopp kan vara ett ord som ni reder ut. Ni får samtala på svenska, och paren skriver på det språk de klarar."]
      - ["Hem- och konsumentkunskap, slöjd", "Ett recept eller en beskrivning", "Paren sammanfattar stegen före arbetet och förutspår vad som händer om de hoppar över ett."]
      - ["Idrott och hälsa", "En regel eller en instruktion", "Paren sammanfattar regeln i en mening, prövar den i rörelse och skriver meningen efteråt."]
  - rubrik: Orden
    plats: efter-grund
    text: Några ord kommer tillbaka i forskningen och i samtal med kollegor.
    kolumner: [Ordet, Vad det betyder, Så kan det låta]
    rader:
      - ["Tankestrategi", "Ett medvetet sätt att komma vidare i en text. Forskningen säger lässtrategi.", "”Här tog det stopp, så jag läser om.”"]
      - ["Överlämning", "Du visar och eleverna gör samma sak, först med stöd och till slut själva. Forskningen säger gradual release of responsibility, GRR.", "”Nu gör ni som jag gjorde.”"]
      - ["Inferens, att läsa mellan raderna", "Att räkna ut det som inte står, genom att lägga ihop ledtrådar i texten med det man redan vet.", "”Hon har glitter på kinden, så hon har nog klippt i silverpappret.”"]
      - ["Textkoppling", "Att koppla texten till sig själv, till en annan text eller till världen. Fråga efteråt om kopplingen hjälper er att förstå.", "”Det här påminner om när … Därför tror jag att Ruben är orolig.”"]
      - ["Förkunskaper", "Det eleven redan vet om ämnet, orden och världen, och som texten tar för givet.", "”Ni behöver veta att riddare hade sköld och hjälm.”"]
      - ["Att övervaka sin förståelse", "Att märka om man förstår medan man läser, och göra något när det tar stopp.", "”Vänta, det här förstår jag inte. Jag läser om det igen.”"]
      - ["Inre bild av texten", "Den bild läsaren gör sig av vad som händer och ändrar när något nytt kommer. Forskningen säger mental modell.", "”Först såg jag henne stjäla. Nu ser jag något annat.”"]
      - ["Stöttning", "Tillfällig hjälp som är lagom stor just nu och blir mindre när eleven klarar mer. Uppgiften är lika stor, och det är hjälpen som ändras.", "”Läs den här meningen igen. Vad säger den?”"]
      - ["Att tänka högt", "Att säga sina tankar medan man läser, så att andra hör hur en läsare gör. Forskningen säger modellera.", "”Jag tror att … men jag är inte säker.”"]
      - ["Dialogisk undervisning", "Ett samtal där elevernas tankar tar undervisningen vidare. Det gör du med de tre dragen.", "”Vad säger du om det?”"]
  - rubrik: Tre textsamtal
    plats: efter-grund
    meny: true
    text: "Metoden passar alla slags texter. Här är tre textsamtal, ett på varje nivå. Varje samtal har tre stopp och visar en tankestrategi. De passar från lektion 4, när klassen har rutinerna, och i F–⁠2 från vecka 5. På sidan Ta fram en lästext väljer du nivå och skriver ut texten. Under texten står frågor. Vik undan dem till efter lektionen, för här ställer eleverna egna frågor. Till varje text finns Lärarens sida, med ett stopp, ledtrådar och en tanke att pröva. Stoppen i de tre samtalen står i tabellerna här. Till en annan text tar du hjälp av tabellen Så väljer du text och stopp. Läs texten själv först och öppna Lärarens sida sedan, så att du stannar där du själv undrar och tänker högt med egna ord."
    kolumner: [Årskurs, Texten, Nivån, Tankestrategin, Fler texter]
    rader:
      - ["F–⁠2", "Över häcken", "Lättläst, text 24", "Förutspå: vad händer sedan?", "Tackfisken (20), Skeden (19), Hinken (22), Ingen såg (25)"]
      - ["3–⁠5", "Någon har varit här", "Mellan, text 15", "Ställa frågor: läsaren förstår mer än Ruben", "Skrapet på dörren (2), Kartongen (7), Hinken i hallen (9), Snöret (12)"]
