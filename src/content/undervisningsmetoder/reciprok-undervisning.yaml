checklista:
  rubrik: Före första lektionen
  punkter:
    - Träffa arbetslaget, eller en kollega om du börjar ensam, och bestäm signalen att sluta.
    - Välj ämnet och minst två lektioner i veckan. I 7–⁠9 kan en vara i svenska och en i SO eller NO.
    - Välj fyra till sex texter i ett arbetsområde, till exempel ur tabellen Tre textsamtal i bilaga A.
    - Planera första lektionen i planeringsmallen, och skriv varför ni läser så här.
    - Skriv ut lathunden, en text per par och Strategikorten Förutspå och Ställa frågor, ett ark per par och ett åt dig.
    - Bestäm paren, och ställ bänkarna så att paren ser varandra och alla ser tavlan.
    - Boka specialläraren till sista lektionen i vecka 2 och en kollega i vecka 4.
klassen:
  rubrik: Så ordnar du klassen
  text: "Eleverna sitter i fasta par, som du bestämmer de första veckorna. Kamrat 1 och kamrat 2 turas om att börja och att skriva, och varje par har en text, så att paret tänker på samma papper. Den som läser mödosamt sitter bredvid en kamrat som gärna hjälper, och den som är ny i svenska bredvid en kamrat som har kommit längre, gärna med samma språk. Blir en elev över, sitter hen med paret bredvid, som en trio. Från vecka 5 sitter två par ihop i Ni tar över, läser växelvis och skriver en gemensam mening. I Vi tänker tillsammans sitter eleverna kvar i sina par."
forsta:
  rubrik: Första lektionen
  text:
    - "Först lär sig klassen parrutinen på något lätt. Sedan läser ni en kort text med två stopp, som Skrapet på dörren (Mellan, text 2) eller Dagen före (Avancerad, text 10) på sidan Ta fram en lästext. Vik undan frågorna under texten. I SO och NO tar du sju till tjugo meningar ur läroboken eller ur en faktatext. Vid det första stoppet tänker du högt med Förutspå, säger vad strategin heter och visar kortet ur Strategikorten. Vid det andra gör paren samma sak och pekar på ordet som fick dem att gissa."
    - "Säg varför ni läser så här: ”Vi tänker tillsammans om texten. Jag läser högt och stannar, så att ni hör hur jag tänker. Sedan gör ni samma sak två och två.” Säg också att du inte har något facit."
  plan:
    amne: Svenska
    klass: 4B
    datum: mån 9/11
    lektion: 1 av 6
    mal: förutspå med ett skäl, och lyssna
    belagg: ordet paren pekar på
    blad: Skrapet på dörren, en per par
    forberett: Bild på sågspån, till alla
    fore: { stopp: ["”låset”: jag gissar vad som kommer.", "”klibbig”: paren gissar vad vi får veta."], undrar: "Förutspå", varfor: "Se om våra gissningar stämmer", veta: "Vad sågspån är", ord: "sågspån", inte: "Jag säger inte var katten har varit." }
    delar:
      - { fas: Inför läsningen, text: "Parrutinen, femton minuter: vad åt du till lunch? Sedan: ”Vi läser för att se om våra gissningar stämmer.”" }
      - { fas: Jag tänker högt, text: "”Något skrapar, och Elias säger tre dagar. Jag tror att någon kommer hem nu, men jag är inte säker. Det jag gjorde heter att förutspå.”" }
      - { fas: Vi tänker tillsammans, text: "”Nu gör ni som jag gjorde. Vad tror ni att vi får veta nu? Peka på ordet som fick dig att tänka så.” Säg vad du hörde: ”Ni gissade med ett skäl.”" }
      - { fas: Ni tar över, text: "”Läs resten växelvis. Stämde det?”" }
      - { fas: Efter läsningen, text: "”Stämde det vi trodde? Vad tog er vidare i texten?”" }
    beslut: { elever: 28, nastanAlla: "par som inte pekar", deFlesta: "”målarburk”", halften: "den blå fläcken" }
    efter: { kontrollen: "___ elever i par utan ledtråd", hogar: "Ingen lapp i dag. Olöst:" }
rutiner:
  rubrik: Rutinerna klassen lär sig
  rader:
    - namn: Parrutinen
      vecka: 1
      vad: "Så talar alla. Kamrat 1 svarar med en till två meningar, kamrat 2 lyssnar utan att avbryta, och sedan byter de. Två regler står på tavlan: vi lyssnar färdigt, och vi prövar tanken och inte personen. Skrattar någon åt ett svar, stanna och säg regeln."
      steg: ["Ställ en kort fråga, och vänta en stund.", "”Kamrat 1 börjar.”", "”Byt.”", "Ge signalen att sluta, till exempel en hand i luften, och be en elev säga vad kamraten sa."]
      forsta: Visa med två elever framme, på något lätt som vad ni åt till lunch. Byt vem som börjar, och öva tills det sitter.
    - namn: Meningen på tavlan
      vecka: 2
      vad: "Så syns hela klassens tänkande. Paren skriver på sitt papper, och du skriver två meningar på tavlan utan namn."
      steg: ["Läs vad paren skriver, och vänta en stund.", "Välj två meningar som skiljer sig åt. Har paren skrivit frågor, skriver du två av dem och frågar: ”Vilken fråga tar oss vidare? Var ser du det?” Har de sammanfattat biten, frågar du: ”Vilken säger det viktigaste till den som inte har läst?” Har alla par skrivit samma sak, skriver du en mening och en fråga.", "”Säg det till din kamrat.” Fråga sedan en elev.", "Skriv det ni vet under Det vet vi nu och resten under Det är olöst, och spara spalterna till nästa lektion."]
      forsta: "Rutinen börjar i lektion 3. Skriv själv en mening om en bit ni har läst, stryk under ledtråden och låt klassen säga varför just de orden stöder meningen. Ta sedan två meningar från paren. I Någon har varit här får ”Emelie gör något hemligt” stöd av ”stängde dörren snabbare än vanligt” men inte av ”Tejpen var borta”, eftersom de orden bara säger att något saknas. Ledtråden till en fråga är stället som fick paret att undra, och ledtråden till en sammanfattning är meningen som säger det viktigaste. Visa en lapp som räknas: ”Emelie gör en sköld åt Ruben. Det står ’Skölden är klar’. Olöst: varför bad han inte om hjälp?” Vecka 4 visar du Sammanfatta på bit 1, och paren gör samma sak med bit 2."
    - namn: Nya ord
      vecka: 3
      vad: Fråga efter nya ord, aldrig svåra. Skriv orden på tavlan när eleverna säger dem, och reda ut dem ur meningen före och efter. Ordboken tar ni sist.
      forsta: "Säg själv ett nytt ord ur texten: ”Det här ordet kan vara nytt för någon. Vad säger meningen före?” Skriv det på tavlan."
    - namn: Fråga, avgör, lämna över
      vecka: 5
      vad: "Eleven ställer en fråga till en kamrat och avgör om svaret håller, och sedan ställer kamraten nästa fråga. I grupp säger du: ”Du väljer vem som fortsätter.” Från vecka 8 leder en elev hela biten: hen väljer strategi, frågar, avgör om svaret håller och säger sist vad gruppen förstod. Nästa elev leder nästa bit. Den som behöver det leder med Strategikortet och kamraten bredvid."
      forsta: Led själv först, och låt eleverna välja vem som får frågan. Lämna sedan över frågan till dem. Vecka 8 leder en grupp en bit framför klassen, och klassen säger vad ledaren gjorde.
