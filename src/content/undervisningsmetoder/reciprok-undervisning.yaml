# Reciprok undervisning: undervisningsmetod för helklass, skriven 2026-11-06 ur analysen (analys.md), innehållsbankerna
# (innehall-praktiken.md, P; innehall-karnan.md, K) och evidensen (evidensbank.md, adjudicering-evidensen.md, evidens.json).
# Centrum är Niclas: man tänker tillsammans om en text, nyfiket och lyssnande, och strategierna kommer när texten behöver dem.
#   node build/sparrprov.mjs methods/reciprok-undervisning/metod.yaml --klar

titel: Reciprok undervisning
undertitel: Så tänker du och klassen tillsammans om en text, F–⁠9
alternativaNamn: ["Reciprocal teaching", "RU"]
ingress: "Eleverna lär sig fyra tankestrategier för att förstå en text: att förutspå, ställa frågor, reda ut och sammanfatta. Vid ett stopp i texten visar du hur du själv använder en strategi, och vid nästa gör eleverna samma sak i par och får återkoppling. Bit för bit lämnar du över tänkandet, tills de läser så på egen hand."
arskurs: ["F-3", "4-6", "7-9"]
arskursText: F–9
taggar: ["textsamtal", "lasforstaelse"]
slag: lektionsforlopp
syfte: [tanka]
tid: 45 minuter per lektion, minst två lektioner i veckan
hurOftaSkal: "Två stora studier hade två tillfällen i veckan i minst 12 veckor (Tengberg m.fl., 2015; Torres Blas m.fl., 2026)."
period: Fem veckor att komma igång
material:
  - en text med två eller tre stopp
  - två till fyra Strategikort per par
  - tavlan
  - pennor och lappar
  - planeringsmallen
uppdaterad: 2026-11-07
publicerad: 2026-11-07
relaterade: ["textsamtal-i-grupp", "faktatextsamtal-i-grupp", "boksamtal-i-grupp", "kooperativt-larande", "explicit-undervisning"]
utkast: false
film:
  sekunder: 29.73
  beskrivning: "Läraren frågar: ”Varför tittar mamma på taket?” Läraren säger: ”Jag tror att hon tvivlar, men jag är inte säker. Jag ställde en fråga till texten.” Läraren läser nästa bit. Läraren säger: ”Nu gör ni som jag gjorde.” Paren skriver, och läraren läser. Läraren säger: ”Ni frågar om något som inte står.” Läraren frågar: ”Vilken fråga tar oss vidare?” Eleven säger: ”Hon stänger dörren snabbt.” En kamrat säger: ”Då gör hon kanske något där inne.” Läraren tänker: ”Nu tänker de själva.”"
  rubrik: "Så lämnar läraren över: hen visar, och paren gör samma sak"
  ingress: "Filmen visar en lektion i svenska i åk 4, där klassen läser Någon har varit här. Läraren visar Ställa frågor vid ett stopp, och vid nästa gör paren samma sak. Läraren säger vad hen hör, och klassen prövar två frågor på tavlan. Medan två elever talar efter varandra är läraren tyst."
  stillbilder:
    - text: "Läraren stannar och ställer en fråga till texten."
    - text: "Paren gör samma sak och skriver en fråga."
    - text: "Läraren säger vad paret gjorde."
    - text: "En kamrat tar upp tanken, och läraren är tyst."
filmer:
  - nr: 2
    titel: "Paren tar över"
    sekunder: 27.26
    beskrivning: "Läraren tänker: ”Nästan alla par har en ledtråd.” Läraren säger: ”Stanna där det tar stopp. Ta det kort ni behöver.” Eleven frågar: ”Hela eftermiddagen? Vad menas med det?” Kamraten frågar: ”Vad står före och efter?” Läraren tänker: ”Jag lyssnar.” Eleven säger: ”Henry är lugn fast det är bråttom!” Läraren säger: ”Ni stannade själva och läste om.”"
    rubrik: "Paren tar över, och läraren sätter sig, lyssnar och går vidare"
    ingress: "Filmen visar en lektion i vecka 4, där nästan alla par hade en ledtråd. Paren läser sista biten växelvis, och ett par stannar vid ett uttryck de inte förstår. Strategikortet ger dem något att säga, läraren lyssnar utan att ge svaret, och paret kommer vidare själva."
    efter: "steg 4"
    stillbilder:
      - text: "Nästan alla par har en ledtråd, så läraren lämnar över."
      - text: "Paret stannar och tar fram Strategikortet Reda ut."
      - text: "Läraren sätter sig hos paret och lyssnar."
      - text: "Läraren säger vad paret gjorde och går till nästa par."

profil:
  evidens:
    larande: { tillforlitlighet: lag, effekt: mattlig, kort: "Starkast i läsning, där effekten är liten i hela klasser.", motivering: "Låg tillförlitlighet, måttlig effekt. Ingen studie väger ihop områdena, så raden är en sammanvägning: visst stöd i läsning och svagt i skrivning, matematik och ämnen (Okkinga m.fl., 2018; Jay m.fl., 2017).", kallor: [okkinga-m-fl-2018, hamadneh-och-kazem-2016, laia-och-dasari-2025, jay-m-fl-2017] }
    lasning: { tillforlitlighet: mattlig, effekt: liten, motivering: "Måttlig tillförlitlighet, liten effekt. I hela klasser gav undervisning i lässtrategier, i många former, d = 0,19 i 52 jämförelser (Okkinga m.fl., 2018). Stora försök med metoden gav mindre, och det största i hela klasser 0,00 (O'Hare m.fl., 2023).", kallor: [okkinga-m-fl-2018, o-hare-m-fl-2023, baye-m-fl-2019, hansford-m-fl-2026] }
    skrivning: { tillforlitlighet: lag, effekt: liten, motivering: "Låg tillförlitlighet, liten effekt. Ett försök i åk 7 i Jordanien gav en säker skillnad på forskarnas eget prov, 80 mot 64 poäng. Skillnaden är orimligt stor, och källan ger ingen effektstorlek, så den räknas som liten (Hamadneh och Kazem, 2016).", kallor: [hamadneh-och-kazem-2016] }
    matematik: { tillforlitlighet: lag, effekt: stor, motivering: "Låg tillförlitlighet, stor effekt. Åtta små studier på högstadiet i Indonesien gav g = 1,07 under namnet Reciprocal Teaching (Laia och Dasari, 2025). Dialogisk undervisning utan metodens strategier gav 0,09, inte säkert (Jay m.fl., 2017).", kallor: [laia-och-dasari-2025, jay-m-fl-2017] }
    amnen: { tillforlitlighet: lag, effekt: mattlig, motivering: "Låg tillförlitlighet, måttlig effekt. I ett stort försök i hela klasser i åk 4 gav dialogisk undervisning utan metodens strategier 0,12 i NO (Jay m.fl., 2017). I SO är resultaten blandade, och teknik är inte studerat.", kallor: [jay-m-fl-2017] }
    socialt: { tillforlitlighet: lag, effekt: liten, motivering: "Låg tillförlitlighet, liten effekt. Ett lottat försök från 1988 med 64 elever i tre klasser i åk 7 gav bättre uppförande. En lärare beskriver en vänligare stämning, men också att grupper stördes (Gilbert, 2018).", kallor: [gilbert-2018] }
  svarighet: { lara: 3, karnan: 3, stod: 3, tid: 4, motivering: "Läraren övar att tänka högt och lämna över samtalet, och klassen övar nya rutiner. Lärarna i studierna fick två till tre dagars utbildning och stöd i skolan, vilket hade räknats som Svårt." }
  kostnad: { kop: 2, timmar: 14, motivering: "Skolan står för kopiorna. Omkring 14 timmar per lärare första läsåret går till läsning, två möten, en halvtimme i vecka 11, planering och fyra samtal efter besök. Besökaren lägger en timme per besök. Studiernas program hade licenser och kostade mer." }
  urval:
    datum: 2026-11-06
    regel: "Undervisning räknas när läraren visar sitt tänkande, eleverna använder flera läsförståelsestrategier, bland dem minst tre av förutspå, ställa frågor, reda ut och sammanfatta, i samtal med varandra om textens innehåll, och läraren lämnar över till eleverna. Det gäller Reciprocal Teaching (Palincsar och Brown), Reciprocal Reading (Fischer Family Trust), LIT (Hackney Learning Trust), Dialogic Strategy Instruction (Tengberg och Olin-Scheller), Collaborative Strategic Reading, CSR (Klingner och Vaughn) och Transactional Strategies Instruction (Pressley m.fl.). Indirekt underlag sänker tillförlitligheten ett steg: samma program i riktade grupper, dialogisk undervisning i ämnets lektioner och om ämnets innehåll utan läsförståelsestrategierna, och undervisning i läsförståelsestrategier utan samtal. Räknas inte: Philosophy for Children, en egen lektion med filosofiska frågor utan läsförståelsestrategierna; allmän undervisning i lärstrategier över ämnen, som Donker m.fl. (2014) och de Boer m.fl. (2018); Reciprocal Peer Tutoring; Mosstons reciprocal style; och metoden på nätet utan samtal."
    text: "Vi sökte hos Skolforskningsinstitutet, EEF, What Works Clearinghouse och Best Evidence Encyclopedia, i OpenAlex och ERIC, område för område, och i Google Scholar, och följde referenserna i en översikt från 2025. Sedan sökte vi igen efter starkare belägg, och två granskare läste talen i källorna. Sökningen gav över hundra källor, och listan har de femton som metoden bygger på, med de stora försöken och de svenska studierna. Hatties översikt använde vi inte."
    slutsatser:
      oversikt: "Strategier i hela klasser ger en liten, säker effekt på standardprov (Okkinga m.fl., 2018). Tre stora studier av CSR gav 0,05, inte säkert (Baye m.fl., 2019). I små grupper med elever i lässvårigheter är talet större, 0,48 (Hansford m.fl., 2026), och i matematik bygger g = 1,07 på åtta små studier (Laia och Dasari, 2025). Ingen enskild strategi är bäst, och hos elever i lässvårigheter krävde effekten bakgrundskunskap (Peng m.fl., 2023)."
      experiment: "I helklass gav Reciprocal Reading ingen effekt på läsprovet, medan riktade grupper med elever som behöver stöd i förståelsen gav 0,14 på läsning och 0,18 på förståelse (O'Hare m.fl., 2023). En större prövning av dem gav 0,055, inte säkert (Torres Blas m.fl., 2026). De två svenska försöken gav ingen säker effekt för hela klassen (Tengberg m.fl., 2015; Klang m.fl., 2022), men i det första gick eleverna med lägst förtest framåt mer än de med lägst förtest i jämförelsegruppen."
      annan: "Metoden kommer ur ett samtal där lärare och elever turas om att leda (Palincsar och Brown, 1984). Skolforskningsinstitutet (2019) säger att inte alla former av strategiundervisning höjer läsförståelsen, och att hur och när strategin används avgör vad den ger."
    uteslutna:
      - { namn: "Gorard m.fl. (2015) och Lord m.fl. (2021)", skal: "En egen lektion utan läsförståelsestrategierna (Philosophy for Children). Den gav 0,03 i skrivning och ingen påvisad effekt på sociala färdigheter" }
      - { namn: "WWC (2010)", skal: "Proven är gjorda för metoden" }
      - { namn: "Rosenshine och Meister (1994) och Miller m.fl. (1988)", skal: "Från före 2000. Försöket från 1988 nämns ändå under Socialt" }
      - { namn: "Murphy m.fl. (2009)", skal: "Handlar om samtal utan strategierna, och vi har inte läst talen" }
      - { namn: "Vaughn m.fl. (2022)", skal: "Bara en av 34 studier gäller metoden" }
      - { namn: "Donker m.fl. (2014) och de Boer m.fl. (2018)", skal: "Allmän undervisning i lärstrategier över ämnen, utan metodens kärna" }
      - { namn: "Hattie (2009)", skal: "Översikt av metaanalyser" }

