uppdrag:
  rubrik: Till arbetslaget
  text: "Metoden sätter sig när ni hör varandra. De fyra tankestrategierna gäller i alla ämnen, så ta med ämneslärarna och använd samma ord. Bjud in specialläraren till möte 1, och be rektor säga ja till samtal där det skriftliga är lappen. Utse också en lärare som håller i arbetet till nästa termin."
  forbered:
    text: Läs metoden, titta på filmen och tänk igenom frågorna. På mötet väljer ni texter och bestämmer signalen och vem som besöker vem. Sedan visar ni en tankestrategi för varandra i fem minuter. Till sist leder en av er ett textsamtal i fem minuter och lämnar över, medan de andra antecknar i observationsmallen vem som talar efter vem. Delar ni en klass, bestäm vem som läser lapparna.
    fragor: ["Vem tänker i dina textsamtal, du eller eleverna?", "Vad gör eleverna direkt efter att du har tänkt högt: gör de samma sak?", "Vilken text vågar du ta som du inte har svaret på?", "Titta på huvudfilmen: när tystnar läraren, och vem talar efter vem sedan?"]
  planera: Planera en lektion i planeringsmallen, eller gör huvudexemplet till ditt eget. Spara texterna med stoppen i en gemensam mapp.
  genomfor: Var och en följer Lär dig metoden vecka för vecka. Den som blir besökt ger besökaren texten och planeringen dagen före, och ni väljer de två eleverna i observationsmallen bland de fyra paren närmast besökaren.
  reflektera: ["Vilka frågor öppnade samtalet?", "Vem talade efter vem i din inspelning från vecka 5, och vad förvånade dig?", "När gjorde eleverna som du utan din fråga, och hur märkte du det?", "Vilken av kärnans fyra kryssade du minst, och vad prövar du nu?"]
  taMed: Ta med din planering med dina kryss och två repliker, gärna ur observationsmallen.

