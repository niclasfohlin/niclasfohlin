    - { vecka: "3", led: Tankestrategierna, rubrik: Reda ut, fokus: "Du visar Reda ut, och klassen lär sig rutinen Nya ord.", eleverna: "Att hitta nya ord och reda ut dem. Paren får Strategikorten Reda ut och Sammanfatta, så skriv ut dem.", roll: "Att ta upp det eleven sa, och välja utfall.", vidare: "de flesta par har satt ett frågetecken vid ett nytt ord och skrivit vad det kan betyda", fraga: "Har de flesta par satt ett frågetecken vid ett nytt ord och skrivit vad det kan betyda?" }
