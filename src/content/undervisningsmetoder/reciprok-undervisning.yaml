steg:
  rader:
    - namn: Inför läsningen
      fraga: "Varför läser vi, och vad tror vi?"
      alla: Var och en säger till sin kamrat vad klassen ska ta reda på, och vad hen tror.
      titta: Kan eleverna säga vad ni ska ta reda på?
      beslut: "Saknas något eleverna behöver veta, så säg det kort nu. Annars börjar ni läsa."
      gor:
        - "Börja med det olösta: ”Det här undrade någon förra gången.” Passar det inte nästa text, gör det till en fråga om hur man läser."
        - "Säg varför ni läser: ”Vi läser för att ta reda på …” Skriv orden du valde på tavlan."
        - Ge tillbaka lapparna och dela ut en text per par, med de Strategikort ni har.
        - "Läs titeln, och låt paren förutspå: ”Vad tror du, och varför?”"
        - Skriv en gissning på tavlan.
      fraser: ["Vi läser för att ta reda på …", "Vad tror du? Vad fick dig att tänka så?"]
    - namn: Jag tänker högt
      fraga: "Hur tänker jag här?"
      alla: Paren följer med pennan och sätter ett frågetecken där de själva stannar.
      titta: Följer pennorna texten, och vem ser ut att undra?
      beslut: "Tappar du klassen, gör det kortare och låt paren tala."
      gor:
        - "Läs bit 1 och stanna där du själv undrar. Visa stället i texten."
        - "Tänk högt med strategin och låna orden ur tabellen Så låter det med varje tankestrategi: ”Jag undrar varför … Jag tror att …”"
        - "Säg vad du gjorde: ”Jag ställde en fråga till texten.” Är strategin ny, säger du vad den heter och visar kortet."
        - "Låt paren berätta: ”Var satte ni frågetecknet? Säg det till din kamrat.” Paren talar en minut."
      fraser: ["Jag tror att … men jag är inte säker.", "Det jag gjorde heter …"]
    - namn: Vi tänker tillsammans
      fraga: "Kan ni göra som jag gjorde?"
      alla: Båda säger sin tanke. Kamrat 1 skriver meningen, kamrat 2 stryker under ledtråden och säger varför.
      titta: Hur många par har gjort något annat, eller saknar en ledtråd?
      beslut: "Ett av tre utfall, nedan."
      gor:
        - "Läs bit 2. ”Nu gör ni som jag gjorde.” Ställ strategins fråga, till exempel ”Vad undrar ni?” Paren tänker tyst, talar och skriver."
        - "Gå runt och säg vad paren gjorde: ”Du frågar om något som inte står.” Räkna eleverna i par utan ledtråd och välj utfall."
        - "Skriv två olika meningar på tavlan, som i rutinen Meningen på tavlan, och fråga: ”Vilken håller? Var ser du det?”"
        - "Låt en kamrat pröva tanken: ”Vad säger du om det Ali sa?” Var tyst medan två elever talar efter varandra."
        - "Låt paren pröva sin mening: ”Titta på er egen mening. Håller den? Ändra den, eller stryk under en annan ledtråd.”"
      fraser: ["Nu gör ni som jag gjorde.", "Vilken håller? Var ser du det?"]
      redo:
        nastanAlla: "Högst 5 av 28 elever i par utan ledtråd, alltså högst två par. Paren tar nästa bit själva, och du sätter dig hos paren utan ledtråd, ett i taget."
        deFlesta: "6–13 av 28 elever i par utan ledtråd, alltså tre till sex par. Paren tar nästa bit med ett stopp mitt i, där varje par visar sin ledtråd för paret bredvid."
        halften: "14 eller fler av 28 elever i par utan ledtråd, alltså sju par eller fler. Visa en gång till, så gör paren om. Läs sedan nästa bit, så samtalar paren."
        tiden: "Räcker inte tiden, var kort vid tavlan, ge paren en kortare bit och skriv upp det olösta. Nästa lektion börjar där."
    - namn: Ni tar över
      vem: "i par, sedan i grupp"
      fraga: "Vem tänker nu?"
      alla: Paren stannar där det tar stopp, väljer tankestrategi och skriver en mening med en ledtråd.
      titta: Tar paren ett kort själva, eller väntar de på dig?
      beslut: "Sitt hos det par som behöver dig, och gå när samtalet är igång."
      gor:
        - "Peka ut biten och säg hur länge: ”Läs växelvis, och stanna där det tar stopp. Ta det kort ni behöver.”"
        - "Ge paren uppgiften: ”Den som läste frågar kamraten. Skriv sedan en mening. Är ni klara, fråga varandra om ett nytt ställe.”"
        - "Sitt hos ett par i taget, och stå långt bak när du byter par."
        - "Säg vad paret gjorde: ”Ni stannade själva och läste om.” Väntar paret på dig, säg: ”Fråga din kamrat först.”"
        - Hör du något klassen behöver, skriv det på tavlan utan att värdera det.
      fraser: ["Stanna där det tar stopp.", "Fråga din kamrat först."]
    - namn: Efter läsningen
      fraga: "Vad vet vi nu, och vad hjälpte?"
      alla: Var och en skriver en egen tanke som inte står på tavlan, en ledtråd och en sak som är olöst.
      titta: Kan eleverna säga vilken strategi som tog dem vidare?
      beslut: "Det olösta och lapparna avgör var nästa lektion börjar."
      gor:
        - "Gå tillbaka till början av lektionen: ”Fick vi reda på det vi ville? Stämde det vi trodde?”"
        - Läs tavlan, och låt eleverna rätta dig.
        - "Fråga vad som hjälpte: ”Vilken tankestrategi tog er vidare i dag? Säg till din kamrat vad hen gjorde som hjälpte.”"
        - Säg vad du hörde, och vilken strategi som hjälpte.
      fraser: ["Fick vi reda på det vi ville?", "Vilken tankestrategi tog er vidare i dag?"]
