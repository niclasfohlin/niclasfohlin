planeringsmall:
  text: "Planeringsmallen är ingen ny planering. Före lektionen räcker fyra rader på din egen: det som ska sitta, lektionens fråga med svaret i en mening, två gamla frågor och vad du gör om i dag. Resten fyller du i efter lektionen."
  fore:
    - { etikett: "Innehållet först", rader: ["Begreppet eller sambandet:", "Lektionens fråga:", "Svaret i en mening:"], falt: [sitta, fragan, svaret] }
    - { etikett: "Tillbaka i dag", rader: ["Förra veckan:", "Förra månaden:"], falt: [veckan, manaden], fot: "Så många tror jag har fel:", fotFalt: tror }
  delar:
    - { fas: Start, skriv: "Ledtråden efter en minut:", not: "Böckerna stängda, sedan svaret och färgpennan.", hojd: 0.6 }
    - { fas: Lektionens fråga, not: "Läs frågan högt. Alla gissar. Rätta ingen gissning." }
    - { fas: Din planering, skriv: "Det jag gör om, och var:", not: "Ett exempel, en bild eller en blandad rad, bara när innehållet behöver det.", hojd: 1.2 }
    - { fas: Avslut, skriv: "Avslut börjar kl.", not: "Boken stängd, grannen frågar varför, sedan svaret och färgpennan.", hojd: 0.6 }
  beslut: { nastanAlla: "Kommer tillbaka om:", deFlesta: ["Nästa gång:", "Ledtråden:"], halften: "Jag undervisar igen:" }
  efter:
    text: "Fyll i direkt efter lektionen, och skriv det som ska komma tillbaka på återkomstlistan."
    kontrollen: "Frågan med flest fel: ___ av ___ med fel"
    hogar: "Jag trodde: ___, och det blev ___"
    sag: "Det eleverna sa till grannen"
    nasta: "Förväxlade slag, och vem som klarar sig själv"
    forst: "På återkomstlistan:"
  overst: ["Det som ska sitta om en månad"]
  kolumner: ["Vad jag gör och vad eleverna gör"]
  sist: ["Efter lektionen: frågan med flest fel och när den kommer tillbaka", Återkomstlistan]
observation:
  fraga: Vad gör eleverna i huvudet, strategi för strategi?
  text: "Skriv ut dubbelsidigt. Välj med läraren två elever att följa, A och B, gärna en som brukar fastna. Säg till varandra hur ni tror att de svarar. Stå där du ser deras skrivböcker och tavlan."
  fokus: Hur många tog fram något ur minnet innan svaret visades?
  huvud: ["Klassens strategier"]
  kolumner:
    - { namn: Frågan eller uppgiften, text: "ordagrant, och hur gammalt innehållet är", bredd: 30 }
    - { namn: Eleverna, text: "tar fram · tittar · tomt · säger · väljer slag", bredd: 17, elever: true }
    - { namn: Läraren, text: "svaret, pekfingret, stödet, återkomstlistan", bredd: 30 }
  tecken: "+ tar fram ur minnet, t tittar i boken, 0 tomt, s säger sambandet, v väljer slag först."
  delar:
    - { fas: Start, rader: 3, rakna: "Tog fram ur minnet: ___ av ___   Höll sig inom fem minuter: ja · nej   Äldre innehåll: ja · nej" }
    - { fas: Lektionens fråga, rader: 1, rakna: "Skrev en gissning: ___ av ___" }
    - { fas: Din planering, rader: 3, rakna: "Verktyget: exempel · bild · rad   Slaget först: ___ av ___   Stödet bort när de kunde: ja · nej" }
    - { fas: Avslut, rader: 2, rakna: "Svarade ur minnet: ___ av ___   Sa sambandet med ämnets ord: ___ av ___" }
  streck:
    - { etikett: Svaret, drag: ["Alla svarade själva före svaret", "Undervisade igen i starten"] }
    - { etikett: Bilden, drag: ["Pekade när hen talade", "Läste upp text i bilden"] }
    - { etikett: Stödet och raden, drag: ["Facit när raden var klar", "Tog bort ett steg i stödet"] }
  rader:
    - "Elever som tog fram ur minnet innan svaret visades: __ av __. En fråga om varför: ja · nej"
    - "Elever som tog fram innehåll från förra veckan eller månaden: __ av __. Från återkomstlistan: ja · nej"
    - "Elever som löste uppgiften efter exemplet: __ av __. Stödet bort när de kunde: ja · nej"
    - "Elever som förklarade sambandet med bilden, också ur minnet: __ av __"
    - "Elever som valde rätt slag innan de löste: __ av __"

# ---------------------------------------------------------------------------------------------------------------------
# Bilaga B Valet och forskningen
# ---------------------------------------------------------------------------------------------------------------------
passar:
  rubrik: När passar metoden?
  kort: "klassen ska förstå och minnas ett innehåll över tid."
  rader:
    - { fraga: "Vad ska eleverna lära sig?", metoden: "Ett innehåll i ämnet som ska förstås, minnas och användas igen.", annat: "Något nytt steg för steg: Explicit undervisning. Att samarbeta: Kooperativt lärande. Testbaserat lärande ger korta prov över terminen, och Formativ bedömning visar var klassen är i dag." }
    - { fraga: "Hur mycket kan eleverna redan?", metoden: "Lite. Ta Avlasta minnet och Ord och bild, och öva ett slag i taget. Kan de mer, minska stödet, blanda och låt framplockningen bli friare.", annat: "Kan de redan innehållet säkert och använder det varje dag, behövs strategierna mindre, och tiden kan gå till något nytt." }
    - { fraga: "Kommer innehållet tillbaka av sig självt?", metoden: "Nej. Då behövs Sprid ut, med återkomstlistan.", annat: "Ja, varje dag, som additionen i åk 2. Då sprids det ut ändå (Pashler m.fl., 2007)." }
    - { fraga: "Förväxlar eleverna slag?", metoden: "Ja, och de klarar slagen var för sig. Då passar Blanda uppgifter.", annat: "Nej. Blanda inte för omväxlingens skull." }
    - { fraga: "Har innehållet en form som en bild kan visa?", metoden: "En process, ett samband eller en ordning i tid och rum. Då passar Ord och bild.", annat: "I skapande ämnen är ord och bild mindre prövat (CESE, 2018). Låt eleverna visa och göra." }
    - { fraga: "Vad går oftast snett?", metoden: "Eleverna minns orden men inte sambanden, eller har glömt arbetsområdet en månad senare.", annat: "Eleverna klarar inte stegen i något nytt. Då passar Explicit undervisning." }
  tumregel: "Välj först vad eleverna ska lära sig och varför, och sedan de verktyg som hjälper dem att förstå och minnas det. Valkartan är ett stöd för tanken och ingen regel."
  metoder: [explicit-undervisning, testbaserat-larande, formativ-bedomning, kooperativt-larande]
invandningar:
  rubrik: Invändningar och nyanser
  fragor:
    - { fraga: "Blir det inte en massa lösryckta strategier?", svar: "Risken finns. Strategierna samverkar och ska inte ses var för sig (EEF, 2021), och program med flera strategier gav mindre effekter (Perry m.fl., 2021; Kramer m.fl., 2024). Därför lär du dig en strategi i taget, och varje strategi är till för ett innehåll som du redan har valt." }
    - { fraga: "Är inte lärande mer än att minnas?", svar: "Jo. Framplockningen befäster det eleven har förstått men bygger inte förståelsen (Ruitenburg m.fl., 2026), och det sociala och känslomässiga i lärandet är inte jämfört med strategierna (Perry m.fl., 2021). Förståelsen, meningen och nyfikenheten bygger du i din undervisning. Ett begrepp är mer än ett ord. Därför gäller en fråga i starten ett varför, och Avslut svarar på lektionens fråga." }
    - { fraga: "Är det inte samma sak som Testbaserat lärande och Explicit undervisning?", svar: "De bygger delvis på samma forskning. I Testbaserat lärande blir framplockningen och spridningen korta prov och en plan för terminen, och i Explicit undervisning finns genomgången ett steg i taget. Här står varje strategi som en tanke att förstå och bygga in i din egen lektion, och ingen annan metod har hela Ord och bild eller Avlasta minnet. Starten har samma rutin som provet i Testbaserat lärande. Strategierna är inte nya, och metoden ger ett gemensamt språk för dem (Perry m.fl., 2021)." }
    - { fraga: "Är inte forskningen mest från laboratoriet och högskolan?", svar: "Mycket av den är det, och effekterna krymper i skolan. Det starkaste underlaget i skolan gäller framplockning, och det svagaste gäller helheten och de yngsta (Ruitenburg m.fl., 2026; Perry m.fl., 2021). Därför säger metodkortet vad som gäller i varje område, och kärnan säger var varje strategi är prövad." }
grund:
  rubrik: Det forskningen visar
  text:
    - "Metoden bygger på forskningen om framplockning (retrieval practice), spridning (spaced practice), blandning (interleaving), ord och bild (dual coding) och lösta exempel som minskar belastningen (cognitive load, worked examples). I skolan är varje strategi prövad för sig, mot undervisning utan den. I 53 studier i vanliga klassrum gav framplockning 0,37, spridning 0,20 och blandning 0,40 (Ruitenburg m.fl., 2026), och mot inget prov alls gav korta prov 0,22 (Dietrichson m.fl., 2026)."
    - "Ord och bild gav 0,47 i 56 lottade studier i skolan, 0,21 från förskolan till åk 5 och 0,74 från åk 6 till gymnasiet. Två av tre studier pågick en enda lektion, och skillnaderna mellan studierna förklarades inte. Efter två veckor eller mer var effekten inte säker i de sju studier som mätte så sent. När elevernas egen lärare ledde var effekten 0,35, inte säkert (Banks m.fl., 2026). I 11 studier i åk 1–⁠6 gav bilder till texten 0,27 i läsförståelse (Guo m.fl., 2020)."
    - "EEF:s systematiska översikt ger underlaget för lösta exempel i matematik och NO för åldrarna 11–⁠18 måttlig tillförlitlighet och för de flesta andra former låg (Perry m.fl., 2021). I 55 skolor gav lösta exempel i skrivning inget mer än diskuterade exempel, och elever med lägre resultat tryckte in mönstren i texten utan att förstå varför (Aston m.fl., 2025). Blandning är nästan bara prövad i matematik, där ett stort försök i åk 7 gav 61 mot 38 procent rätt en månad senare (Rohrer m.fl., 2020)."
    - "Helheten ger mindre effekter. Program som byggde in flera strategier gav från −0,13 till 0,62 med låg tillförlitlighet (Perry m.fl., 2021), och den största studien, 20 591 elever i 89 skolor, gav 0,16 i NO, mest för elever med högre tidigare resultat (Kramer m.fl., 2024). Med ett prov som inte gjordes för försöket gav en omgjord kurs i matematik 0,12, inte säkert (Davenport m.fl., 2020), och ett quiz i starten gav ingen skillnad mot en diskussion i 15 skolor (Roy m.fl., 2023)."
    - "EEF:s vägledning säger att det är svårare att tillämpa strategierna än att känna till dem, och att de lätt glider mot tomma rutiner (EEF, 2021). IES gav starkt stöd för att låta eleverna ta fram ur minnet och svara på frågor om varför, och måttligt stöd för att sprida ut övningen och kombinera ord och bild (Pashler m.fl., 2007). Det eleven redan kan avgör vilket stöd som hjälper (Sweller m.fl., 2019), och underlaget för att blanda olika ämnen är tunt (Weinstein m.fl., 2018). Ingen studie av strategierna har mätt studiero eller samarbete."
