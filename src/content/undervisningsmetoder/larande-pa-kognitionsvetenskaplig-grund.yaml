progression:
  rubrik: De första veckorna
  text: "Metoden är ny för dig och för klassen. Ni lär er en strategi i taget, två veckor var. Starten, lektionens fråga och Avslut finns i varje lektion från vecka 1. I vecka 3–⁠4 får varje rad på återkomstlistan tre datum, och det som satt får vänta längre. I vecka 5–⁠6, 7–⁠8 och 9–⁠10 hittar du tre lektioner i din planering med nya steg, ett samband eller slag som förväxlas, och tar veckans verktyg där. Har arbetsområdet inget sådant, tar du verktyget på något klassen har haft. Från vecka 7 väljer du också själv bland verktygen ni kan: före veckan ser du var i dina lektioner innehållet behöver dem. Blanda uppgifter kommer sist, eftersom eleverna först behöver kunna slagen var för sig. En ny strategi går ofta sämre de första gångerna. En blandad rad ger fler fel i övningen, men det sitter bättre en månad senare. Ge en strategi två veckor till när den inte sitter."
  rader:
    - { vecka: "1", led: Ramen, stallen: [Start, Lektionens fråga, Avslut], rubrik: "Plocka fram", eleverna: "Att stänga boken, skriva det de minns, förklara för grannen och fylla i med färgpennan.", roll: "Att ställa frågor som går att klara till en del, en om varför, och skriva frågan med flest fel på återkomstlistan.", vidare: "nästan alla skriver ur minnet, och en fråga har krävt ett varför", fraga: "Skriver nästan alla ur minnet, och har en fråga krävt ett varför?" }
    - { vecka: "3", led: Ramen, stallen: [Start, Lektionens fråga, Avslut], rubrik: "Sprid ut", eleverna: "Att svara på äldre frågor, också när det känns svårt.", roll: "Att ge tre till fem rader på återkomstlistan tre datum och låta det som satt vänta längre. Vecka 4 även i läxan.", vidare: "nästan alla klarar frågor som har kommit tillbaka två gånger", fraga: "Klarar nästan alla frågor som har kommit tillbaka två gånger?" }
    - { vecka: "5", led: Verktygen, stallen: [Start, Lektionens fråga, Avslut, Avlasta minnet], rubrik: "Avlasta minnet", eleverna: "Att lösa en liknande uppgift efter exemplet, med rutinen Exemplet först, sedan själv.", roll: "Att varva löst exempel och uppgift i tre lektioner med nya steg. Vecka 6 ett steg mindre löst.", vidare: "de flesta klarar en uppgift utan exemplet", fraga: "Klarar de flesta en uppgift utan exemplet?" }
    - { vecka: "7", led: Verktygen, stallen: [Start, Lektionens fråga, Avslut, Ord och bild], rubrik: "Ord och bild", eleverna: "Att peka och säga sambandet i din bild, och sedan rutinen Rita ur minnet.", roll: "Att i tre lektioner rita en enkel bild en del i taget och peka. Vecka 8 kommer bilden tillbaka i starten.", vidare: "nästan alla säger sambandet med ämnets ord och bilden", fraga: "Säger nästan alla sambandet med ämnets ord och bilden?" }
    - { vecka: "9", led: Verktygen, stallen: [Start, Lektionens fråga, Avslut, Blanda uppgifter], rubrik: "Blanda uppgifter", eleverna: "Att skriva vilket slag uppgiften är innan de löser den, med rutinen Slaget först.", roll: "Att blanda dina uppgifter av slag som klassen kan var för sig. Vecka 10 de som förväxlas.", vidare: "de flesta skriver rätt slag innan de löser", fraga: "Skriver de flesta rätt slag innan de löser?" }
uppfoljning:
  text: Du ser om metoden fungerar på händerna i starten, i svaren i Avslut och på återkomstlistan.
  rader:
    - { id: lektionen, nar: Varje lektion, tid: varje lektion, vad: "Läs några svar från Avslut, och skriv namnen på dem som saknade sambandet. Har samma elev fel flera gånger, läser du svaren med specialläraren." }
    - { id: klassen, nar: Klassens svar varje vecka, tid: varje vecka, vad: "Räkna hur många som klarar frågan från förra månaden i starten, och hur många som förklarar varför i svaret." }
    - { id: lararen, nar: Dina kryss varje vecka, tid: varje vecka, vad: "Se i veckans kryss om ramen fanns i varje lektion och om verktygen kom när innehållet behövde dem. En strategi glider mot en tom rutin utan att det märks i en enskild lektion." }
    - { id: observationerna, nar: Vecka 2 och 8, tid: vecka 2 och 8, vad: "Specialläraren besöker en lektion i vecka 2 och läser skrivböckerna efteråt. En kollega besöker en lektion i vecka 8 och läser återkomstlistan." }
    - { id: arbetslaget-fore, nar: Före första lektionen, tid: före, vad: "Arbetslaget ses före första lektionen och bestämmer vad ni gör lika." }
    - { id: arbetslaget-efter, nar: Vecka 10, tid: vecka 10, vad: "Ni ses i slutet av vecka 10 med återkomstlistorna och bestämmer hur ni fortsätter." }
    - { id: stodet, nar: Efter de första veckorna, tid: efter, vad: "En kvart i månaden tar arbetslaget upp en strategi. Ta med återkomstlistan och två elevers skrivböcker: vad gjorde de i huvudet? Den som inte lär sig innehållet tar du upp med specialläraren." }
    - { id: sexveckor, nar: Sex veckor efter de första veckorna, tid: efter 6 veckor, vad: "Räkna samma saker som varje vecka, och be en kollega se en lektion. Finns ramen, och kommer verktygen när innehållet behöver dem?" }
    - { id: nastatermin, nar: Nästa termin, tid: nästa termin, vad: "Första veckan efter lovet har starten frågor från förra terminen. Räkna hur många som klarar dem. Från nu besöker ni varandra en lektion varje termin med observationsmallen." }
    - { id: osaker, nar: Om du är osäker på metoden, tid: villkor, vad: "Står skattningen ”Hur säker är jag på metoden?” under 5 i två veckor i rad, ge strategin två veckor till och be en kollega se en lektion." }
    - { id: klassenstar, nar: Om det inte fungerar, tid: villkor, vad: "Står skattningen ”Hur väl fungerar den i praktiken?” under 5 i två veckor i rad, ta färre och lättare frågor i starten och be specialläraren läsa svaren från Avslut." }
checklista:
  rubrik: Före första lektionen
  punkter:
    - Välj ämnet, klassen och de två lektioner i veckan där du börjar.
    - Skriv det eleverna ska minnas om en månad på återkomstlistan i bilaga A. Varför är det värt att kunna?
    - Sätt upp Strategibladet och kortet Plocka fram där alla ser dem, och se till att väggen inte är full.
    - Bestäm grannarna och var den som är ny i svenska sitter. Lägg fram färgpennor, och skriv ut frågekartan till F–⁠3.
    - Boka observationerna, en av dem med specialläraren.
    - "Bestäm med arbetslaget vad ni gör lika: strategiernas namn, färgpennan och att böckerna är stängda."
    - "Säg till klassen varför det ska kännas lite svårt: det som känns lätt är inte det som sitter."
    - Berätta för hemmen att svaren ur minnet inte påverkar betyget.
klassen:
  rubrik: Så ordnar du klassen
  text: "Under starten och i Avslut ligger böckerna undan och färgpennan framme. Eleverna skriver på en ny sida i skrivboken, och på tavlan står bara frågorna. Varje elev har en bestämd granne att förklara för i Avslut, och den som är ny i svenska sitter där hen ser bilden på tavlan. Den som blir klar tidigt täcker sina gamla svar och svarar på startfrågorna igen, eller skriver en egen uppgift av ett annat slag än dagens."
forsta:
  rubrik: Första lektionen
  text:
    - "I första lektionen är tre saker nya: starten, lektionens fråga och Avslut. I starten ställer du två frågor om något klassen redan kan, så att eleverna kan tänka på rutinen Boken stängd och färgpennan. Lektionens fråga står där du säger vad ni ska lära er, och Avslut svarar på den. Frågan ska gå att gissa på utifrån det klassen redan vet, men bara dagens innehåll ska svara helt på den. Resten av lektionen gör du som vanligt."
    - "Du säger: ”Det här samlas inte in. Det du inte minns är det vi övar på. Det ska kännas lite svårt.”"
  plan:
    amne: Biologi
    klass: 8C
    datum: mån 31/8
    lektion: 1 av 8
    mal: "förklara hur maten blir näring som blodet för till cellerna"
    belagg: "svaret på lektionens fråga, sist och ur minnet"
    blad: "två frågor på tavlan och svaren"
    forberett: "orden med bild till studiehandledaren"
    fore: { sitta: "Att maten bryts ned och tas upp av blodet i tunntarmen", fragan: "Vart tar frukosten vägen?", svaret: "Den bryts ned i magsäcken och tunntarmen, och blodet tar upp näringen.", veckan: "Vad finns i en cell?", manaden: "Varför behöver cellerna näring?", tror: "6 på fråga 2" }
    delar:
      - { fas: Start, text: "En tom bild av en cell" }
      - { fas: Din planering, text: "Inget i genomgången om magsäcken och tunntarmen eller i övningen med boken öppen" }
      - { fas: Avslut, text: "10.39. En rad" }
    beslut: { elever: 28, nastanAlla: "fyra veckor", deFlesta: ["nästa vecka", "en tom bild av en cell"], halften: "när genomgången börjar på onsdag" }
rutiner:
  rubrik: Rutinerna klassen lär sig
  rader:
    - namn: Boken stängd och färgpennan
      vecka: 1
      stalle: Start
      vad: "Eleverna tar fram det de minns med boken stängd, ser svaret och fyller i det som saknades med färgpennan, utan att sudda. Klassen gör rutinen i starten och i Avslut, också när det gamla kommer tillbaka."
      steg: ["Stäng boken, och vänd blad i skrivboken.", "Skriv det du minns.", "Titta på svaret och fyll i det som saknas med färgpennan."]
      forsta: "Ta två frågor om något klassen redan kan, och säg varför ni gör det."
    - namn: Exemplet först, sedan själv
      vecka: 5
      stalle: Din planering
      vad: "I din genomgång visar du ett löst exempel steg för steg, och eleverna löser direkt en liknande uppgift. De yngsta följer exemplet med fingret."
      steg: ["Följ exemplet steg för steg.", "Lös den liknande uppgiften.", "Säg varför du gör steget."]
      forsta: "Ta ett exempel som klassen nästan kan. Låt alla lösa den liknande uppgiften och sedan säga varför det första steget görs."
    - namn: Rita ur minnet
      vecka: 7
      stalle: Avslut
      vad: "I Avslut ritar eleverna sambandet ur minnet med rutor, pilar och ämnets ord i ungefär två minuter och förklarar för grannen, som frågar: ”Varför?” När du har sagt svaret, lägger de till det som saknades med färgpennan."
      steg: ["Stäng boken och rita i två minuter.", "Förklara bilden för grannen.", "Lyssna på lärarens svar och fyll i med färgpennan."]
      forsta: "Låt först några elever peka i din bild: ”Kom och peka, och säg vad som händer här.” Visa sedan hur en skiss ser ut: ”Den ska inte vara fin, den ska vara rätt.”"
    - namn: Slaget först
      vecka: 9
      stalle: Din planering
      vad: "I en blandad rad i din övning skriver eleven först vilket slag uppgiften är och löser den sedan. Facit kommer när raden är klar."
      steg: ["Läs uppgiften och skriv slaget.", "Lös uppgiften.", "Rätta när raden är klar."]
      forsta: "Ta två slag som klassen kan var för sig, och visa en uppgift av varje bredvid varandra: ”Vad skiljer dem?”"
larandet:
  rubrik: Så syns lärandet i klassen
  omraden:
    - { omrade: amneskunskaper, syns: "I startens fråga från förra månaden tar eleverna fram ämnets begrepp och samband ur minnet och förklarar varför." }
    - { omrade: sprak, syns: "Eleverna pekar på bilden eller sin egen skiss och förklarar sambandet med ämnets ord." }
uppdrag:
  rubrik: Till arbetslaget
  text: "Arbets- eller ämneslaget prövar metoden tillsammans och tar en strategi i taget i tio veckor. Ni har två möten och två besök de första veckorna. Besöken gäller vad eleverna gör i huvudet mer än vad läraren gör, och samtalet hålls samma dag eller nästa."
  taMed: "Ta med dina återkomstlistor, dina kryss och observationsmallarna."
  forbered:
    text: Läs metoden och strategikorten, och tänk igenom frågorna före första mötet.
    fragor:
      - Vilken av de fem strategierna använder du redan, och vad gör eleverna i huvudet då?
      - Vad i ditt nästa arbetsområde vill du att eleverna ska minnas om en månad?
      - Var i dina lektioner plockar eleverna fram själva, och var läser de bara om eller ser dig svara?
  planera: "Dela startfrågorna och exemplen i ämneslaget, och gör tillsammans om ett material ni har. Skriv upp det som inte får ändras: tankearbetet i varje strategi."
  genomfor: Ta en strategi i taget i två veckor, och följ Lär dig metoden på metodens sida.
  reflektera:
    - Svarade de två elever ni följde som ni trodde?
    - Vad gick framåt, och var gled strategin mot en tom rutin?
    - Var i ert nästa arbetsområde behöver innehållet ett exempel, en bild eller en blandad rad?

# ---------------------------------------------------------------------------------------------------------------------
# 4 Håll i
# ---------------------------------------------------------------------------------------------------------------------
lararensFragor:
  rubrik: Lärarens frågor
  fragor:
    - { fraga: "Får jag hoppa över framplockningen i starten när tiden är knapp?", svar: "Ja, om du tar en gammal fråga om varför i Avslut i stället. Det som står kvar är att alla svarar själva innan svaret visas, att en fråga gäller ett varför och att svaret kommer samma lektion.", komponent: Plocka fram }
    - { fraga: "Får jag använda flera strategier i samma lektion?", svar: "Ja. Ramen finns i varje lektion, och verktygen tar du när innehållet behöver dem. Strategierna samverkar (EEF, 2021). I program med flera var effekterna mindre och berodde på hur väl de genomfördes (Perry m.fl., 2021)." }
    - { fraga: "Får jag blanda olika ämnen eller hela arbetsområden?", svar: "Nej. Blanda korta uppgifter i samma ämne, av slag som eleverna lätt förväxlar. Underlaget för att blanda skolämnen är tunt (Weinstein m.fl., 2018).", komponent: Blanda uppgifter }
    - { fraga: "Vad gör jag om eleverna inte räcker upp handen när de hade fel?", svar: "Titta i fem skrivböcker: stämmer färgpennan med händerna? Säg mottot igen, ”Det du inte minns är det vi övar på”, och att händerna inte påverkar betyget.", komponent: Plocka fram }
    - { fraga: "Hur hinner jag med kursen och materialet?", svar: "Ersätt i stället för att lägga till: starten tar platsen för återblicken och Avslut för din sammanfattning. Du kan göra en blandad rad ur bokens olika avsnitt. Dela frågorna och exemplen i ämneslaget." }
hinder:
  rubrik: Det svåraste med metoden
  text: "Det svåraste är att strategin blir målet: ”nu ska jag få in Sprid ut” och inte ”hur lär sig eleverna mer av boken?”. Då blir strategierna aktiviteter som läraren bockar av utan att veta varför (Perry m.fl., 2021). Bilderna blir pynt, och de lösta exemplen känns inklämda (EEF, 2021; Aston m.fl., 2025). Börja i vad eleverna ska lära sig och varför, och se efter i starten. Uteblir frågan från förra månaden, har strategin fallit bort. Får frågan svar utan varför, har strategin blivit en tom rutin."
  kort: "Ofta blir strategin målet och görs utan det tankearbete den kräver. Börja i vad eleverna ska lära sig, och se i starten om frågan från förra månaden kommer och om svaren säger varför."
  komponent: Sprid ut
fallgropar:
  rubrik: Vanliga fallgropar
  rader:
    - { fallgrop: "Starten frågar bara efter fakta", hander: "Frågorna gäller ord och definitioner, böckerna ligger framme, samma elever svarar, och starten växer till en ny genomgång.", prova: "Alla skriver ur minnet med boken stängd, svaret kommer direkt, en fråga gäller ett varför, och starten tar fem minuter.", komponent: Plocka fram }
    - { fallgrop: "Vi går igenom det igen", hander: "Du undervisar det gamla en gång till, eller så kommer bara lösryckta ord tillbaka. Eleverna lyssnar, men ingen tar fram något själv.", prova: "Låt eleverna ta fram det viktigaste med dagar och veckor emellan, och justera efter svaren.", komponent: Sprid ut }
    - { fallgrop: "Avlastningen blir att aldrig utmana", hander: "Du förenklar uppgifterna, stödet ligger kvar och alla får samma mall, också den som redan kan.", prova: "Ta bort det onödiga, behåll det svåra, och ta bort stödet efter det eleverna visar.", komponent: Avlasta minnet }
    - { fallgrop: "Bilden blir pynt", hander: "Bildstödet för dagen kallas Ord och bild, en ikon står vid varje rubrik, du läser upp texten i bilden, eller eleverna färglägger en bild.", prova: "Kan du peka på bilden och säga sambandet med ämnets ord? Låt eleverna rita ur minnet och jämföra med din bild.", komponent: Ord och bild }
    - { fallgrop: "Blandningen blir omväxling", hander: "Du byter aktiviteter eller hela arbetsområden, eller blandar raden innan eleverna kan slagen, och de fastnar.", prova: "Blanda korta uppgifter av slag som förväxlas och har övats var för sig, och visa facit när raden är klar.", komponent: Blanda uppgifter }
    - { fallgrop: "Alla strategier på en gång", hander: "Strategierna blir en lista som syns men inte förstås, och eleverna gör inte det tankearbete de kräver.", prova: "Ta en i taget. Ramen står kvar, och verktygen tar du vid behov." }
    - fallgrop: När blandningen blir för svår
      moment: [Din planering]
      hander: Eleverna fastnar på varannan uppgift, gissar slag eller tappar lusten.
      steg:
        - Ge några uppgifter av ett slag i taget före raden.
        - Blanda bara två slag.
        - Låt eleverna säga slaget först och lösa sedan.
        - Låt eleverna lösa raden i par.
        - Visa facit när raden är klar.
hallFast:
  rubrik: Fem saker att hålla fast vid
  rader:
    - { sak: "Efter ett lov: börja med det från före lovet", text: "Det som har glömts lärs om fortare än första gången, och starten efter lovet visar vad som behöver komma tillbaka." }
    - { sak: "När arbetsområdet byts: flytta återkomsterna med", text: "Läroboken och planeringen går i block, och det gamla kommer inte tillbaka av sig självt. Återkomstlistan följer med in i nästa arbetsområde." }
    - { sak: "När eleverna säger att de kan: ta upp det ändå", text: "Det som går lätt under övningen är ett dåligt mått på det som sitter om en månad." }
    - { sak: "När det går bra: be ändå om ett besök", text: "En kollega ser det du inte ser i din egen lektion, också när det går bra. Samtalen i arbetslaget ebbar lätt ut när de första veckorna är slut." }
    - { sak: "När en kollega tar över: ge strategikorten och ett exempel", text: "Ett kort med det ni gör och hur det ser ut i klassrummet håller liv i arbetet, också när du inte är där." }

# ---------------------------------------------------------------------------------------------------------------------
# Bilaga A Att skriva ut
# ---------------------------------------------------------------------------------------------------------------------
strategikort:
  text: "De fem kognitionsvetenskapliga strategierna finns som kort, ett halvt A4 per strategi, på niclasfohlin.se/strategier. Framsidan är för klassen, med strategin i en bild och en mening, och baksidan för dig, med tanken och Så gör du. Sätt upp Strategibladet mitt på en vägg och korten runt det, ett i taget när ni börjar med strategin. Plocka fram och Sprid ut är ramen i varje lektion, och de tre andra är verktyg du tar när innehållet behöver dem."
  strategier:
    - plocka-fram
    - sprid-ut
    - avlasta-minnet
    - ord-och-bild
    - blanda-uppgifter
  blad: Strategibladet
ramar:
  rubrik: Materialet för klassen
  text: ["Utöver lektionskortet och strategikorten finns frågekartan för de yngsta. Återkomstlistan för dig och ämneslaget är en mall att skriva i, och den står sist i bilaga A."]
  ramar:
    - rubrik: Frågekartan
      text: ["Skriv arbetsområdets namn i mitten och fem frågor runt omkring, en av dem om varför. Kopiera två blad i A4 per elev, eller visa bladet på tavlan. Under din övning fyller eleverna i det första bladet med boken öppen. I Avslut lägger de undan bok och blad och fyller i det andra ur minnet, först lektionens fråga och sedan så många av kartans frågor som de hinner. I starten veckan efter fyller de i ett nytt med boken stängd. Bladet passar F–⁠3 och den som är ny i svenska."]
tabeller:
  - rubrik: Ett arbetsområde med strategierna
    plats: efter-progression
    meny: true
    text: "Efter de tio veckorna tar du två till fem strategier i ett arbetsområde: ramen i varje lektion och de verktyg innehållet behöver. Exemplet är vattnets kretslopp, fyra veckor i NO i åk 5, och återkomstlistans ifyllda exempel är samma arbetsområde. Tabellen visar när verktygen kommer in och när det gamla kommer tillbaka."
    kolumner: [Arbetsområdets vecka, Strategierna, Så gör du]
    rader:
      - ["Vecka 1", "Ord och bild", "Du ritar kretsloppet enkelt, en del i taget, och pekar och säger. Eleverna ritar det ur minnet sist."]
      - ["Vecka 2", "Ord och bild i starten", "Ledtråden efter en minut är en tom bild av kretsloppet, och eleverna fyller i ord och pilar ur minnet."]
      - ["Vecka 3", "Blanda uppgifter", "Eleverna får dagg på gräset, tvätt som torkar och imma på spegeln blandat: vad heter det, och från vilken form till vilken?"]
      - ["Vecka 1–⁠4, och en månad senare", "Sprid ut, Plocka fram", "Frågorna från vecka 1 och 2 kommer tillbaka i starten, och samma frågor en månad senare."]
  - rubrik: Utveckla metoden
    plats: efter-progression
    meny: true
    text: "Du behöver inget av det här för att börja. När ramen och verktygen sitter kan du lägga till en sak i taget."
    kolumner: [Det du bygger på, Så gör du, Tanken]
    rader:
      - ["Ja eller nej först", "I starten skriver eleverna först ja eller nej på om de kan. Efter facit räcker de som skrev ja men hade fel upp handen.", "Eleverna ser att känslan av att kunna lurar."]
      - ["Här använde vi den", "När ni har använt en strategi i ett ämne, sätter klassen upp en lapp med ämnet under kortet.", "Klassen ser att strategin hör till flera ämnen."]
      - ["Elevernas egen plan", "Eleverna skriver hur de använder en strategi när de pluggar hemma inför ett prov.", "Eleven gör strategin till sin egen."]
      - ["En strategi till", "Ta en strategi till när de fem sitter, och ge den två veckor.", "Ni lär er den nya som de fem."]
  - rubrik: Återkomstlistan
    text: "Återkomstlistan är din plan för vad som ska komma tillbaka i ett arbetsområde och när. Skriv det som ska sitta innan arbetsområdet börjar, och fyll på efter varje lektion. Efter en månad frågar du om samma samband i ett nytt fall. Kopiera den tomma mallen till Google Dokument eller Word, och dela den med ämneslaget."
    kolumner: [Arbetsområdet, I exemplet]
    rader:
      - ["Klass och ämne", "5A, NO"]
      - ["Arbetsområdet och veckorna", "Vattnets kretslopp, fyra veckor i mars"]
      - ["Lektionerna med strategierna", "Tisdag och torsdag"]
      - ["Ämneslaget", "NO-lärarna i åk 4–⁠6, med en delad mapp"]
  - rubrik: "Återkomstlistan: det som ska sitta"
    text: "Skriv en rad för varje begrepp eller samband som ska sitta om en månad, och för startens fråga med flest fel. Under Tillbaka står datumen efter några dagar, veckor och en månad. Från Ord och bild skriver du bilden, och från Blanda uppgifter det som förväxlas."
    kolumner: [Det som ska sitta, Lärt, Tillbaka, Satt det?, Bilden, Förväxlas med]
    rader:
      - ["Avdunstning: solen värmer vattnet, som blir vattenånga", "3/3", "5/3, 12/3, 2/4", "2/4: 3 av 26 med fel", "Pilen upp från sjön", "Kokning"]
      - ["Kondensation: vattenångan kyls och blir små droppar i molnen", "5/3", "10/3, 17/3, 7/4", "7/4: 5 av 26 med fel", "Molnet med droppar", "Avdunstning"]
      - ["Nederbörd: dropparna eller iskristallerna blir tunga och faller som regn eller snö", "5/3", "10/3, 17/3, 7/4", "7/4: 2 av 26 med fel", "Pilen ned från molnet", "Inget"]
      - ["Avrinning: vattnet rinner till sjöar och hav", "10/3", "12/3, 19/3, 9/4", "9/4: 4 av 26 med fel", "Pilen längs marken", "Grundvatten"]
