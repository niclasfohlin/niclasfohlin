plan:
  passen:
    - { nar: första lektionen, kort: Boken stängd och färgpennan, text: "I första lektionen är tre saker nya: starten, lektionens fråga och Avslut. I starten ställer du två frågor om något klassen redan kan, så att eleverna kan tänka på rutinen Boken stängd och färgpennan. Lektionens fråga står där du säger vad ni ska lära er, och Avslut svarar på den. Frågan ska gå att gissa på utifrån det klassen redan vet, men bara dagens innehåll ska svara helt på den. Resten av lektionen gör du som vanligt." }
  fore: ["Välj ämnet, klassen och de två lektioner i veckan där du börjar."]
  utvardering: ["En kvart i månaden tar arbetslaget upp en strategi. Ta med återkomstlistan och två elevers skrivböcker: vad gjorde de i huvudet? Den som inte lär sig innehållet tar du upp med specialläraren."]
  skattningar:
    - namn: Hur säker är jag på metoden?
      vem: lararen
      rad: lararen
      text: "Skatta i slutet av veckan. Tänk på ramen och de verktyg du använde: Tog alla fram ur minnet före svaret, med en fråga om varför? Tog eleverna fram något från förra veckan eller månaden? I vilka av dina lektioner kom veckans verktyg in? Löste alla en liknande efter exemplet, och minskade stödet när de kunde? Förklarade klassen sambandet med bilden, också ur minnet? Valde eleverna slag i en blandad rad?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: osaker }
    - namn: Hur väl fungerar den i praktiken?
      vem: lararen
      rad: klassen
      text: "Tänk på det du ser i klassen: Klarar fler än förut frågan från förra månaden? Förklarar eleverna varför, och säger de sambandet med ämnets ord?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: klassenstar }

# ---------------------------------------------------------------------------------------------------------------------
# Lathunden Att komma igång
# ---------------------------------------------------------------------------------------------------------------------
lathund:
  metoden:
    text:
      - "Du lär dig fem kognitionsvetenskapliga strategier, en i taget. Två är ramen, 9–⁠12 minuter i varje lektion, och tre är verktyg i din genomgång och övning. Vad klassen ska lära sig väljer du först."
      - "Lärandet går till så här. Eleverna minns det de tänker på, och lektionens fråga gör dem nyfikna på det. De plockar fram det, möter det igen, ser ett löst exempel, förklarar med en bild och väljer sätt."
  lektion:
    text: "Tre saker är nya: starten, lektionens fråga och Avslut. I dag tar de 15 minuter, och resten är din lektion. Med boken stängd svarar alla på två frågor om något de kan. Du visar svaret, och de fyller i med färgpennan. Fel är när det du stryker under saknas. Lektionens fråga står där du säger vad ni ska lära er, och Avslut svarar på den."
  igang:
    rubrik: De första veckorna
