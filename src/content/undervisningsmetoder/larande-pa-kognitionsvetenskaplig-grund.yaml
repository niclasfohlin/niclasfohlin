# Lärande på kognitionsvetenskaplig grund, en undervisningsmetod för helklass av slaget strategier. Skriven 2026-11-03
# ur methods/_mall-undervisningsmetod.yaml, efter analysen (analys.md) med den andra analysen, riggens beslut
# (analys-beslut.md, adjudicering-bank.md), innehållsbankerna (innehall-praktiken.md P1–P198 och innehall-karnan.md
# K1–K117) och facit evidens.json. Testbaserat lärande och förlagan Explicit undervisning är lästa för form och ton.
# Strategierna står som kort i sajtens verktyg Strategier och importeras med fältet strategikort (sajtens K-699).
# Fälten film och filmer skrivs ur de ritade filmerna (film.yaml och film-2.yaml) med node build/filmfalt.mjs <slug>.
#   node build/sparrprov.mjs methods/larande-pa-kognitionsvetenskaplig-grund/metod.yaml --klar

titel: Lärande på kognitionsvetenskaplig grund
undertitel: "Så bygger du in fem kognitionsvetenskapliga strategier i dina lektioner, F–⁠9"
alternativaNamn: ["Science of learning", "Undervisning på kognitionsvetenskaplig grund"]
ingress: "Du bygger in fem kognitionsvetenskapliga strategier i dina lektioner, principer som gör att vi förstår, tolkar och minns det vi lär oss. Du väljer först vad klassen ska förstå och varför. Plocka fram och Sprid ut är en ram på 9–⁠12 minuter. Avlasta minnet, Ord och bild och Blanda uppgifter är verktyg vid behov."
arskurs: ["F-3", "4-6", "7-9"]
arskursText: F–9
taggar: ["evidens", "undervisningskvalitet"]
slag: strategier
syfte: [ova, nytt]
tid: "9–⁠12 min i din lektion, minst två lektioner i veckan"
hurOftaSkal: "Ett försök i 55 skolor hade två tillfällen i veckan i tio veckor (Aston m.fl., 2025)."
period: Tio veckor att komma igång
material:
  - lektionskortet
  - Strategibladet
  - strategikorten
  - färgpennor
  - återkomstlistan
  - frågekartan
uppdaterad: 2026-11-08
publicerad: 2026-11-03
relaterade: ["testbaserat-larande", "explicit-undervisning", "formativ-bedomning", "kooperativt-larande"]
utkast: false
film:
  sekunder: 29.43
  beskrivning: "Läraren säger: ”Skriv en gissning. Det får vi svar på i dag.” I genomgången ritar läraren en slinga i taget och pekar. Läraren säger: ”Titta här. Här hämtar blodet syre.” I Avslut suddar läraren bilden. Läraren säger: ”Svara ur minnet. Grannen frågar: Varför?” Grannen frågar: ”Varför?” Eleven säger: ”Musklerna behöver mer syre, därför andas jag fortare.” Läraren säger: ”Blodet hämtar syret i lungorna.”"
  rubrik: "Frågan, bilden och svaret ur minnet"
  ingress: "Filmen visar lektionens fråga, ”Varför blir du andfådd när du springer?”, bilden i lärarens genomgång och Avslut i biologi i åk 8. Läraren ritar blodomloppet en slinga i taget, och med boken stängd svarar eleverna på frågan och förklarar för grannen."
  stillbilder:
    - text: "Lektionens fråga: alla skriver en gissning."
    - text: "I genomgången ritar läraren en slinga i taget."
    - text: "Avslut: med boken stängd svarar alla ur minnet."
    - text: "Eleven förklarar, läraren ger svaret, paret fyller i."
filmer:
  - nr: 2
    titel: "Det som kommer tillbaka"
    sekunder: 27.79
    beskrivning: "Starten har frågor från förra veckan och förra månaden. Läraren säger: ”Böckerna stängda. Skriv det du minns.” Läraren visar svaret och stryker under det viktigaste. Alla fyller i med färgpennan. Läraren säger: ”Räck upp handen om du hade fel på fråga 1.” Läraren tänker: ”4 av 28.” Läraren frågar: ”Och fråga 2?” Läraren tänker: ”9 av 28. Jag trodde 5.” De flesta kan, och fråga 2 kommer tillbaka med en ledtråd. Läraren skriver: ”9 av 28 fel”. Läraren skriver: ”20/1 med ledtråd”."
    rubrik: "Det som kommer tillbaka"
    ingress: "Filmen visar starten i samma lektion i biologi i åk 8, med sex av klassens 28 elever i bild. Frågorna är från förra veckan och förra månaden. Efter facit räcker de som hade fel upp handen, fråga för fråga. Läraren räknar händerna mot det hen trodde och skriver på återkomstlistan när frågan ska komma tillbaka."
    efter: "steg 1"
    stillbilder:
      - text: "Med boken stängd svarar alla på två gamla frågor."
      - text: "Fyra av 28 hade fel på fråga 1 och räcker upp handen."
      - text: "På fråga 2 hade 9 av 28 fel, och läraren trodde 5."
      - text: "De flesta kan, så fråga 2 kommer tillbaka med ledtråd."

profil:
  evidens:
    larande:    { tillforlitlighet: mattlig, effekt: mattlig, kort: "Var för sig hjälper strategierna eleverna att minnas, mest i korta försök.", motivering: "Måttlig tillförlitlighet, måttlig effekt. Strategierna hjälper var för sig, mest i korta försök: ord och bild gav 0,47 i 56 studier (Banks m.fl., 2026). I stora försök gav ett quiz i starten ingen skillnad mot en diskussion (Roy m.fl., 2023).", kallor: [banks-m-fl-2026, roy-m-fl-2023] }
    lasning:    { tillforlitlighet: lag, effekt: mattlig, motivering: "Låg tillförlitlighet, måttlig effekt. Ord och bild, med bilder till texten, gav 0,27 i läsförståelse i 11 studier i åk 1–⁠6 (Guo m.fl., 2020). Inget strängt försök har mätt läsning, och de andra strategierna är knappt prövade där.", kallor: [guo-m-fl-2020] }
    skrivning:  { tillforlitlighet: lag, effekt: mattlig, motivering: "Låg tillförlitlighet, måttlig effekt. Framplockning i språk, mest stavning, gav 0,23, inte säkert, i 8 små studier (Ruitenburg m.fl., 2026). I 55 skolor gav lösta exempel i textskrivning inget mer än diskuterade exempel (Aston m.fl., 2025).", kallor: [ruitenburg-m-fl-2026, aston-m-fl-2025] }
    matematik:  { tillforlitlighet: mattlig, effekt: mattlig, motivering: "Måttlig tillförlitlighet, måttlig effekt. I klassrum gav framplockning 0,35, inte säkert, och blandade uppgifter 0,54 (Ruitenburg m.fl., 2026). En omgjord kurs i åk 7 gav 0,12, inte säkert, på ett befintligt prov (Davenport m.fl., 2020).", kallor: [ruitenburg-m-fl-2026, davenport-m-fl-2020] }
    amnen:      { tillforlitlighet: mattlig, effekt: liten, motivering: "Måttlig tillförlitlighet, liten effekt. Ord och bild gav 0,74 i NO och teknik och 0,33, inte säkert, i SO, mest i korta försök (Banks m.fl., 2026). I NO i 15 skolor gav ett quiz i starten ingen skillnad mot en diskussion (Roy m.fl., 2023).", kallor: [banks-m-fl-2026, roy-m-fl-2023] }
    socialt:    { tillforlitlighet: lag, effekt: ingen, motivering: "Låg tillförlitlighet, ingen effekt. Ingen studie med jämförelsegrupp har mätt studiero eller samarbete. En lärare tyckte att klassen var lugnast med quiz, och andra att exempel som var för svåra gav oro i klassen (Roy m.fl., 2023; Aston m.fl., 2025).", kallor: [roy-m-fl-2023, aston-m-fl-2025] }
  svarighet: { lara: 3, karnan: 3, stod: 3, tid: 4, motivering: "Strategierna glider lätt mot rutiner utan elevernas tankearbete, och tio veckor är längre än vanligt. I studierna med effekt fick lärarna mer stöd, 18 timmars fortbildning och 16 timmar med kollegor per arbetsområde (Kramer m.fl., 2024)." }
  kostnad:   { kop: 2, timmar: 22, motivering: "Skolan köper färgpennor och kopierar korten och frågekartan. Omkring 22 timmar första läsåret går till att läsa metoden, två möten, fyra besök med samtal, en timmes extra planering i veckan i tio veckor och en kvart i månaden i arbetslaget." }
  urval:
    datum: 2026-11-03
    regel: "En studie räknas när minst en av de fem strategierna byggs in i vanlig undervisning i grundskolan med skolans innehåll, av läraren eller i materialet: eleverna plockar fram ur minnet, övningen kommer tillbaka över dagar och veckor, uppgifterna blandar slag som förväxlas, ord och en bild av innehållet samverkar, eller det som tynger utan att lära tas bort med lösta exempel, samlat material och stöd som tonas ut. Program som bygger in flera av strategierna räknas. Jämförelsen är vanlig undervisning eller samma innehåll utan strategin. Räknas inte: laboratoriet med konstruerat material, högskolan, förskolan och gymnasiet utom i en sammanställning där minst hälften gäller grundskolan, stödundervisning i liten grupp, arbetsminnesträning, lärstilar, spridda genomgångar utan framplockning, datorprogram som lär ut en lässtrategi, modellering av skrivstrategier, fortbildning i bara ämnesinnehåll och strategier utanför de fem."
    text: "Vi sökte 2026-11-03 i ERIC och OpenAlex och följde referenserna bakåt och framåt från ett stort försök från 2024. Sammanställningarna om vanliga klassrum går före studierna i laboratoriet och på högskolan, och inget område sänks för att en studie gäller en enda strategi. De flesta studierna gäller en strategi i taget, ofta i korta försök och på forskarnas egna prov. De stora försöken med flera strategier och med skolans egna prov gav mindre effekter eller ingen."
    slutsatser:
      oversikt: "Strategierna hjälper var för sig i skolan. Framplockning gav 0,37, spridning 0,20 och blandning 0,40 i vanliga klassrum (Ruitenburg m.fl., 2026), och korta prov 0,22 mot inget prov (Dietrichson m.fl., 2026). Ord och bild gav 0,47 i 56 lottade studier, mest i enstaka lektioner, men 0,21 från förskolan till åk 5 (Banks m.fl., 2026), och bilder till texten 0,27 i läsförståelse (Guo m.fl., 2020). EEF:s systematiska översikt ger underlaget för lösta exempel måttlig tillförlitlighet och för det mesta andra låg (Perry m.fl., 2021)."
      experiment: "De stora försöken i vanliga skolor visar mindre än sammanställningarna. Flera strategier i samma arbetsområde gav 0,16 i NO (Kramer m.fl., 2024), och en omgjord kurs i matematik 0,12, inte säkert, på ett prov som inte gjordes för den (Davenport m.fl., 2020). Ett quiz i starten gav ingen skillnad mot en diskussion (Roy m.fl., 2023), och lösta exempel i skrivning gav inget mer än diskuterade exempel (Aston m.fl., 2025). Undantaget är blandade uppgifter, som gav 61 mot 38 procent rätt i åk 7 (Rohrer m.fl., 2020)."
      annan: "Vägledningarna råder lärarna att låta eleverna ta fram ur minnet, sprida ut det viktiga, kombinera ord och bild och visa lösta exempel (Pashler m.fl., 2007). De säger också att det är svårare att tillämpa principerna än att känna till dem, och att strategierna glider mot tomma rutiner (EEF, 2021). Det eleven redan kan avgör vilket stöd som hjälper (Sweller m.fl., 2019), och underlaget är tunt för blandning av olika ämnen (Weinstein m.fl., 2018)."
    uteslutna:
      - { namn: "Desimone och Hill (2017)", skal: "Lärarna knöt arbetsron i klassrummet till läromedlets lektionsföljd och inte till strategierna" }
      - { namn: "Hodgen m.fl. (2023)", skal: "Spridda genomgångar där eleverna inte plockar fram själva" }
      - { namn: "Wijekumar m.fl. (2014)", skal: "Ett datorprogram som lär ut en lässtrategi, utanför de fem" }
      - { namn: "Hattie (2009)", skal: "Översikt av metaanalyser, bara använd för att hitta dem" }

# ---------------------------------------------------------------------------------------------------------------------
# 1 Metoden
# ---------------------------------------------------------------------------------------------------------------------
inledning:
  - "Lärande på kognitionsvetenskaplig grund bygger på science of learning, ett tvärvetenskapligt forskningsfält där kognitiv psykologi, neurovetenskap och pedagogik studerar hur vi lär oss. Fältet har prövat principer som gör att vi förstår, tolkar och minns det vi lär oss, och många av dem finns redan i ämnesdidaktiken. Här lyfts fem av dem fram som kognitionsvetenskapliga strategier: Plocka fram, Sprid ut, Avlasta minnet, Ord och bild och Blanda uppgifter. Du integrerar dem i din undervisning. Hjärnträning, lärstilar och lektioner om hjärnans delar hör inte hit. Strategierna är inget mål i sig. Hur mycket de hjälper beror på ämnet, innehållet och eleverna (Perry m.fl., 2021; EEF, 2021). Undervisningen börjar därför i vad eleverna ska lära sig, varför det är viktigt och vilka mål det gäller, och det kommer från dig, kursplanen och läromedlet. Strategierna stöder hur ni arbetar. Frågan är hur eleverna lär sig mer av högläsningsboken, temat eller arbetsområdet, och inte hur du får in Sprid ut. Lärandet börjar i ett innehåll som väcker nyfikenhet. Strategierna hjälper eleverna att förstå och minnas det."
  - "Strategierna blir ett lager över din egen planering, och lagrets 9–⁠12 minuter tar platsen för sådant du redan gör. I starten, där du annars frågar vad ni gjorde förra lektionen, svarar alla ur minnet med boken stängd på äldre frågor, och en av dem gäller varför. Där du brukar säga vad ni ska lära er i dag, ställer du lektionens fråga, en fråga som väcker nyfikenhet och som lektionen svarar på. Eleverna skriver en gissning. I Avslut, i stället för din sammanfattning, svarar de på frågan ur minnet och förklarar för grannen. Efter lektionen skriver du på återkomstlistan det som ska komma tillbaka. Verktygen tar du i Din planering, din genomgång och övning, när innehållet behöver dem: ett löst exempel vid nya steg, en enkel bild vid ett samband och en blandad rad när slag förväxlas. På bänken ligger skrivboken och en färgpenna att fylla i det som saknades med, så att det syns vad eleven mindes själv. På väggen sitter Strategibladet, en affisch med alla fem strategierna, och runt bladet strategikorten för dem ni har börjat med. Återkomstlistan och frågekartan för de yngsta finns i bilaga A, och bladet och korten finns på metodens sida."
  - "Lärandet går till så här. Eleverna minns det de tänker på, och ett meningsfullt innehåll gör att de tänker på rätt sak. Arbetsminnet rymmer lite åt gången, och det eleverna redan kan gör det nya lättare. Det som känns lätt under övningen är inte alltid det som sitter. Därför tar eleverna fram innehållet själva, möter det igen efter dagar och veckor, ser ett löst exempel före eget arbete, förklarar med en bild och väljer sätt i en blandad rad."
  - "Du och klassen lär er en strategi i taget, två veckor var, i tio veckor: du lär dig tanken, och klassen lär sig rutinen. Ramen kommer först, i vecka 1 och 3, och verktygen i vecka 5, 7 och 9. Starten, lektionens fråga och Avslut finns från första lektionen. Resten av lektionen gör du som vanligt. Efter tio veckor är ramen fast och verktygen fria, och i ett arbetsområde använder ni två till fem strategier. Strategierna finns också i Testbaserat lärande, Explicit undervisning, Formativ bedömning och Kooperativt lärande. Här lär du dig tanken bakom greppen, så att du kan bygga egna i ditt ämne."
karna:
  rubrik: "Kärnan: fast och fritt"
  text: "Varje strategi sätter i gång ett tankearbete som bara eleven kan göra: att ta fram ur minnet, att möta det igen efter ett uppehåll, att lägga kraften på det som ska läras, att foga ihop ord och bild och att välja sätt. Effekten kommer bara när eleven gör det tankearbetet. Därför står tankearbetet kvar, och formen är fri. Plocka fram och Sprid ut är ramen i varje lektion, och de tre andra är verktyg som du tar när innehållet behöver dem. Strategierna samverkar och tjänar ett innehåll som du redan har valt. I studierna beskriver lärare hur en strategi glider mot en rutin när eleverna inte gör det tankearbete den kräver."
  grundregel: "Plocka fram och Sprid ut är ramen i varje lektion, också vid knapp tid: alla svarar ur minnet på en gammal fråga om varför före facit. De tre andra är verktyg vid behov. Del 4 säger vad som står kvar."
  varv: Det nya kommer in med ord, bild och exempel, ut ur minnet, tillbaka efter dagar och veckor, blandat när slagen sitter.
  komponenter:
    - namn: Plocka fram
      moment: [Start, Avslut]
      vad: Eleverna tar fram det de har lärt sig ur minnet, utan att titta, och ser sedan det rätta.
      syns: Varje elev skriver, ritar eller säger det hen minns med boken stängd innan något svar visas, svarar på ett varför och rättar sedan mot svaret.
      varfor: "Det eleven bara läser om kan kännas bekant utan att gå att ta fram. När eleven själv tar fram det och ser svaret, sitter det bättre: studier i klassrum visar 0,37, mest för fakta, mot andra sätt att öva som att läsa om, och 0,22 mot inget prov (Ruitenburg m.fl., 2026; Dietrichson m.fl., 2026)."
      belagg: provad
      kallor: [ruitenburg-m-fl-2026, dietrichson-m-fl-2026, pashler-m-fl-2007]
      kvar: Alla elever tar fram svaret själva innan de ser det, svarar på en fråga om varför och får det rätta samma lektion.
      fritt: "Att skriva, rita, visa med kroppen eller tänka själv och sedan säga svaret till grannen, en frågekarta och ledtrådar för de yngsta, och i början eller slutet av lektionen."
      kryss: Alla tog fram ur minnet före svaret, också ett varför
    - namn: Sprid ut
      moment: [Start, Efter lektionen]
      vad: Det som ska sitta kommer tillbaka efter dagar och veckor, och eleverna tar fram det igen.
      syns: Eleverna tar fram innehåll från förra veckan eller förra månaden, och läraren kan säga hur gammalt det är och när det kommer igen.
      varfor: "Eleven glömmer fort det hen övar klart vid ett tillfälle, fast det känns som att hen kan. När det kommer tillbaka efter dagar och veckor, sitter det längre: studier i skolan visar 0,20, och 0,39 för samma övning spridd mot samlad, mest på forskarnas prov (Ruitenburg m.fl., 2026)."
      belagg: provad
      kallor: [ruitenburg-m-fl-2026, perry-m-fl-2021, pashler-m-fl-2007]
      kvar: Eleverna tar fram det de ska kunna minst två gånger till, med dagar och veckor emellan.
      fritt: "När och i vilken form, som i starten, i slutet eller i läxan, och hur långa uppehållen är. Inget schema är bättre belagt än ett annat."
      kryss: Eleverna tog fram något från förra veckan eller månaden
    - namn: Avlasta minnet
      moment: [Din planering]
      vad: Du tar bort det som tynger i onödan, visar ett löst exempel och minskar sedan stödet steg för steg.
      syns: Efter exemplet löser eleverna en liknande uppgift utan att leta i materialet och säger varför de gör steget. De som kan arbetar utan stödet.
      varfor: "Den som är ny i innehållet lägger kraften på att leta och pröva, och det nya sitter inte. Ett löst exempel före eget arbete ger kraften åt innehållet: studier visar det med måttlig tillförlitlighet i matematik och NO för 11–⁠18 år (Perry m.fl., 2021). Sedan tar du bort stödet (Sweller m.fl., 2019)."
      belagg: provad
      kallor: [perry-m-fl-2021, sweller-m-fl-2019, cese-2018]
      kvar: De som är nya i innehållet ser ett löst exempel, löser en liknande och får mindre stöd när de kan.
      fritt: "Exemplet på tavlan, på bladet eller som en rörelse du visar, med texten samlad vid bilden, och om uppgiften efter är delvis löst."
      kryss: Alla löste en liknande, och stödet minskade när de kunde
    - namn: Ord och bild
      moment: [Din planering, Avslut]
      vad: Du förklarar och pekar i en enkel bild av sambandet, och eleverna ritar och förklarar den själva.
      syns: Eleverna förklarar sambandet med ämnets ord, med fingret på bilden eller på sin egen skiss.
      varfor: "Ett samband är svårt att förstå med bara ord. En enkel bild som läraren pekar i ger två vägar till samma innehåll: studier visar 0,47 i skolan och 0,21 från förskolan till åk 5, men ingen säker effekt efter två veckor eller mer (Banks m.fl., 2026). Därför ritar eleverna bilden ur minnet igen senare."
      belagg: provad
      kallor: [banks-m-fl-2026, guo-m-fl-2020, pashler-m-fl-2007]
      kvar: Du pekar i en bild av sambandet medan du förklarar, och eleverna förklarar den, också ur minnet när den kommer tillbaka.
      fritt: "Rutor, pilar och ord i ett flödesschema, en tidslinje, en blockmodell, en karta eller elevens egen skiss."
      kryss: Klassen förklarade sambandet med bilden, också ur minnet
    - namn: Blanda uppgifter
      moment: [Din planering]
      vad: Uppgifter av de slag eleverna förväxlar står om vartannat, så att eleven väljer sätt först.
      syns: Eleven säger eller skriver vilket slag uppgiften är innan hen löser den, i en rad där slagen inte kommer i en ordning som går att gissa.
      varfor: "En rad med uppgifter av samma slag väljer sättet åt eleven, men på provet måste eleven välja själv. Blandade uppgifter övar valet: studier visar 0,54 i matematik i vanliga klassrum (Ruitenburg m.fl., 2026) och 61 mot 38 procent rätt i åk 7 (Rohrer m.fl., 2020). Nästan alla studier gäller matematik."
      belagg: provad
      kallor: [ruitenburg-m-fl-2026, rohrer-m-fl-2020]
      kvar: I en blandad rad av slag de kan men förväxlar säger eleverna slaget först och ser facit när raden är klar.
      fritt: "Ämnet, hur många slag, en rad ur bokens olika avsnitt, kort att sortera, bilder eller textutdrag, och hur stor del som blandas, som en tredjedel."
      kryss: Eleverna valde slag i en blandad rad
roll:
  rubrik: "Lärarens roll: innehållet först"
  text: Före lektionen skriver du vad som ska sitta om en månad och lektionens fråga. Ramen gör du varje gång, och verktygen tar du när de hjälper eleverna att förstå och minnas just det.
  fragor:
    - Väcker lektionens fråga nyfikenhet?
    - Visar eleverna sambandet eller bara ordet?
    - När kommer det här tillbaka?
  fragornaText: "Den första ställer du när du skriver lektionens fråga, den andra när du läser svaren och skisserna i Avslut och den tredje när du räknar hur många som hade fel i starten."

# ---------------------------------------------------------------------------------------------------------------------
# 2 Lektionen: ramen och verktygen i din lektion
# ---------------------------------------------------------------------------------------------------------------------
tidsschema:
  rubrik: Lagret i din lektion
  minuter: 45
  rader:
    - { tid: Före lektionen, fas: Före lektionen, vad: "Skriv det som ska sitta om en månad, lektionens fråga med svaret i en mening och två eller tre frågor ur återkomstlistan, en om varför. Hur många tror du har fel?" }
    - { tid: 3–⁠5 min, fas: Start, var: i början, form: Enskilt, vad: "I stället för att du frågar vad ni gjorde förra lektionen, stänger alla boken och svarar ur minnet på frågor från förra veckan och månaden, en om varför." }
    - { tid: 1 min, fas: Lektionens fråga, var: i början, form: Enskilt, vad: "Där du säger vad ni ska lära er i dag, står lektionens fråga på tavlan, och alla skriver en gissning." }
    - { tid: 30 min eller mer, fas: Din planering, ram: true, grepp: [Avlasta minnet, Ord och bild, Blanda uppgifter], vad: "Du har din genomgång och övning som planerat. Du gör om ett exempel vid nya steg, en bild vid ett samband och ordningen när slag förväxlas." }
    - { tid: 5–⁠6 min, fas: Avslut, var: i slutet, form: Enskilt, vad: "I stället för att du sammanfattar, stänger alla boken, svarar ur minnet på lektionens fråga och förklarar för grannen, som frågar varför." }
    - { tid: Efter lektionen, fas: Efter lektionen, vad: "Skriv på återkomstlistan frågan med flest fel, dagens nya, en bild om ni hade en, och när de kommer tillbaka. Lektionens fråga blir startens varför-fråga veckan efter." }
  varianter:
    - nar: första lektionen
      text: "I dag tar lagret 15 minuter. Starten får ta åtta minuter och frågar om något klassen redan kan. När ni ska öva, säger du: ”Nu får ni öppna boken.” I Avslut säger du: ”Svara på frågan ur minnet. Grannen frågar: Varför?”"
      delar:
        - { fas: Start, tid: 0–⁠8 min, fraser: ["Det här samlas inte in.", "Det du inte minns är det vi övar på."] }
        - { fas: Lektionens fråga, tid: 8–⁠9 min, fraser: ["Skriv en gissning på en minut.", "Det får vi svar på i dag."] }
        - { fas: Din planering, tid: 9–⁠39 min, fraser: ["Nu får ni öppna boken."] }
        - { fas: Avslut, tid: 39–⁠45 min, fraser: ["Stäng boken, och vänd blad.", "Svara på frågan ur minnet. Grannen frågar: Varför?"] }
    - nar: en lektion på 60 minuter
      text: "Starten, lektionens fråga och Avslut behåller sina minuter, och Din planering får resten."
      delar:
        - { fas: Start, tid: 0–⁠5 min }
        - { fas: Lektionens fråga, tid: 5–⁠6 min }
        - { fas: Din planering, tid: 6–⁠54 min }
        - { fas: Avslut, tid: 54–⁠60 min }
  efter: "Lagret tar 9–⁠12 minuter, och de flesta har du redan: återblicken, målet och sammanfattningen. Verktygen tar inga egna minuter, och Avslut behåller sina. Är tiden knapp, stryker du först att läsa tre svar högt i Avslut, sedan startens frågor utom förra månadens. Det minsta är en gammal fråga om varför ur minnet med boken stängd, sedan svaret och färgpennan, i starten eller i Avslut. Ryms bara en fråga i Avslut, tar du den gamla."
steg:
  rader:
    - namn: Start
      vem: i början, var och en
      fraga: "Vilken fråga hade flest fel, och hur många?"
      alla: Skriver ett eget svar innan svaret visas, och räcker upp handen för frågorna de hade fel på.
      titta: Skriver alla, och hur många händer det blir mot det du trodde?
      beslut: "Frågan med flest fel avgör när den kommer tillbaka. Skriv datumet på återkomstlistan nu eller efter lektionen. Fel är när det viktigaste saknas, som ett varför."
      gor:
        - "Säg: ”Böckerna stängda. Skriv det du minns.” Efter en minut får de som har tomt en ledtråd, på tavlan om de är många."
        - Visa svaret senast efter tre minuter, och stryk under det viktigaste i varför-svaret. Eleverna fyller i med färgpennan.
        - "Säg: ”Räck upp handen om du hade fel på fråga 1. Fel är när det understrukna saknas.” Undervisa inte igen."
      fraser: ["Böckerna stängda. Skriv det du minns.", "Räck upp handen om du hade fel på fråga 1."]
      redo:
        nastanAlla: Högst 5 av 28 med fel. Frågan kommer tillbaka om några veckor, och de med fel får den i läxa.
        deFlesta: 6–⁠13 av 28 med fel. Frågan kommer tillbaka nästa lektion eller nästa vecka, med en ledtråd.
        halften: 14 eller fler av 28 med fel. Förklara det igen med en bild eller ett löst exempel när din genomgång börjar.
        tiden: "Räcker inte tiden i starten, visar du svaret ändå, och nästa lektion börjar med frågan."
    - namn: Lektionens fråga
      vem: där det nya börjar, alla
      fraga: "Väcker lektionens fråga nyfikenhet?"
      alla: Skriver en gissning på en minut.
      titta: Har alla skrivit något, och går frågan att gissa på?
      beslut: "Kan bara några gissa, ger du en ledtråd ur det klassen redan kan. Svaret kommer i din genomgång och i Avslut."
      gor:
        - "Läs upp frågan och säg: ”Skriv en gissning på en minut. Det får vi svar på i dag.” Rätta ingen gissning."
        - Frågan du valde före lektionen går att gissa på utifrån det klassen vet, men bara dagens innehåll svarar helt på den.
      fraser: ["Skriv en gissning på en minut.", "Det får vi svar på i dag."]
    - namn: Din planering
      vem: som du har planerat
      fraga: "Vad i min planering gör jag om i dag?"
      alla: "Löser en uppgift efter exemplet, förklarar bilden eller skriver slaget först, som du planerat."
      titta: Hur många har fel efter bilden eller exemplet, och väljer de rätt slag?
      beslut: "Har många fel efter bilden eller exemplet, visar du det igen i lugnare takt. Väljer många fel slag, ger du några uppgifter av ett slag i taget."
      gor:
        - "Vid nya steg, eller när några är nya i innehållet, varvar du lösta exempel och liknande uppgifter, ett steg mindre löst i taget."
        - "Vid ett samband ritar du en enkel bild en del i taget, i stället för den du tänkt visa, och pekar på delen: ”Titta här.”"
        - "Förväxlas slag, tar du dina uppgifter i en annan ordning, med några ur förra avsnittet: ”Skriv först vilket slag det är.”"
        - Efter bilden förklarar eleverna en av delarna för grannen. Stödet minskar när de visar att de kan, och facit kommer sist.
      fraser: ["Titta här.", "Skriv först vilket slag det är, och lös sedan."]
    - namn: Avslut
      vem: i slutet, var och en
      fraga: "Säger svaret sambandet eller bara ordet?"
      alla: Varje elev har ett eget svar i skrivboken innan grannen frågar.
      titta: Säger svaret sambandet, och förklarar eleverna varför med ämnets ord?
      beslut: "Skriv det som saknas på återkomstlistan. Säger svaren bara ordet, börjar nästa genomgång med en bild, och fastnade många i stegen, med ett löst exempel."
      gor:
        - "Sudda tavlan utom frågan. ”Stäng boken, och vänd blad. Svara på frågan ur minnet, med en rad eller en skiss.” Ge två minuter."
        - "Säg: ”Förklara för grannen. Grannen frågar: Varför?” Efter en bild förklarar eleven med skissen. Sedan byter de."
        - Läs tre svar högt om tiden räcker, och säg svaret på lektionens fråga i en mening med dagens samband.
        - Alla lägger till det som saknades med färgpennan och sätter en bock vid gissningen om den höll.
      fraser: ["Svara på frågan ur minnet, med en rad eller en skiss.", "Grannen frågar: Varför?"]
lektionskort:
  - { efter: klassen, text: "Lektionskortet är lagret i din lektion på ett A4: delarna och verktygen, det du säger, beslutet i starten och Så rättar du. Ha det i handen." }
fastnar:
  rubrik: Så rättar du
  text: "Frågorna ska kännas lite svåra, men ungefär åtta av tio i klassen ska ha rätt på varje fråga. Ledtråden kommer när många rader är tomma efter en minut, som i starten, så att den som kan har plockat fram själv och den som inte minns något har något att utgå från. Har eleven valt fel slag, ställer du uppgiften bredvid en som ser likadan ut men kräver något annat och frågar: ”Varför löses de olika?” Har eleven kört fast efter ett exempel, går ni tillbaka till exemplet med ett steg mer löst."
  trappa:
    - "En minut själv: ”Skriv det du minns.”"
    - Är många rader tomma, skriver du en ledtråd på tavlan, som den tomma bilden, det första ordet eller tre ord att välja bland.
    - "Är många rader tomma ändå, säger du: ”Säg ett ord du minns till grannen. Nu skriver alla.”"
    - Visa svaret, och eleverna fyller i med färgpennan.
    - Ta tillbaka samma fråga senare, från återkomstlistan.
  motto: Det du inte minns är det vi övar på.
amnesexempel:
  - amne: lasning
    arskurs: åk 4
    innehall: "Klassens högläsningsbok: vad som hände och varför"
    overst:
      egen: "Två saker som hände i förra kapitlet och ett varför. Felet: att minnas händelserna men inte orsaken."
      visar: Alla skriver själva ur minnet och fyller sedan i med färgpennan.
    scen:
      - "Tänk dig en lektion i svenska i åk 4. Du läser en bok högt för klassen, och förra veckan läste du kapitlet där huvudpersonen ljuger för sin bästa vän. Boken är stängd. På tavlan står: ”Skriv två saker som hände i kapitlet. Skriv sedan varför hon ljög.”"
      - "Alla skriver i tre minuter. Efter en minut är många rader tomma, så du skriver tre ord på tavlan att välja bland. Sedan säger du varför hon ljög, och de fyller i med färgpennan."
      - "Du räknar händerna på varför-frågan: 3 av 25 har fel. Nästan alla kan. Två av dem skrev vad som hände men inte varför. Frågan får vänta några veckor."
    notera: "Notera vad som hände. Varför-frågan visade vem som mindes händelserna utan orsaken. Den var lektionens fråga förra veckan: ”Varför ljög hon för sin bästa vän?”"
  - amne: skrivning
    arskurs: åk 3
    innehall: "Stavning: kort och lång vokal och dubbelteckning"
    overst:
      egen: "Orden har kort vokal före två konsonantbokstäver, lång före en. Felet: att dubbla i varje ord efter den senaste regeln."
      visar: Alla skriver först L eller K och sedan ordet i skrivboken.
    scen:
      - "Tänk dig en lektion i svenska i åk 3. Klassen har övat ord med kort och med lång vokal var för sig i två veckor. Nu läser du upp tio ord i en ordning som inte går par för par: tak, hatt, full, glas, vila, tack, hat, villa, glass, ful."
      - "Vid varje ord säger du: ”Lyssna på vokalen. Lång eller kort? Skriv ordet.” Eleverna skriver L eller K först och sedan ordet. Facit kommer när listan är klar, och då ställer du lektionens fråga igen: ”Hur hör du om ordet ska ha dubbel konsonant?”"
      - "Du går runt och ser en elev som dubblar i varje ord, också tak och ful. Eleverna rättar med färgpennan, och du räknar händerna på ordet med flest fel, ful: 8 av 27. De flesta kan. Orden kommer tillbaka nästa vecka i en ny ordning, och eleven som dubblade får jämföra två ord i taget, tak och tack."
    notera: "Notera vad som hände. Blandningen visade vem som valde efter vokalen och vem som dubblade i varje ord. Lektionens fråga var: ”Hur hör du om ordet ska ha dubbel konsonant?”"
  - amne: matematik
    arskurs: åk 5
    innehall: "Division, decimaltal som bråk och tid, från förra området"
    overst:
      egen: "Tre uppgifter från förra området och ett varför. Felet: att räkna 2,5 timmar som 250 minuter."
      visar: Alla löser i skrivboken med boken stängd och räcker upp handen för det de hade fel på.
    scen:
      - "Tänk dig en lektion i matematik i åk 5. Klassen arbetar med geometri, och för en månad sedan avslutade ni ett område om division, bråk och tid. På tavlan står tre frågor: ”Räkna 84 / 4. Skriv 0,35 som bråk. Hur många minuter är 2,5 timmar, och varför?”"
      - "Du säger: ”Det här hade vi för en månad sedan. Det får kännas svårt.” Efter tre minuter visar du svaren: 21, 35/100 = 7/20 och 150 minuter, eftersom en timme är 60 minuter och en halvtimme 30. Eleverna rättar med färgpennan."
      - "Du räknar händerna: frågan om tid har flest fel, 14 av 26, och många har skrivit 250 minuter. Hälften eller färre kan. Nästa lektion undervisar du om tid igen när din genomgång börjar, med en klocka där timmen är 60 minuter och halvtimmen 30. På återkomstlistan skriver du frågan om tid till nästa vecka och veckan efter, och läxan får två uppgifter om tid."
    notera: "Notera vad som hände. Tre gamla uppgifter i starten visade vad som inte satt efter en månad. Lektionens fråga var: ”Hur kan två rum ha samma omkrets men olika stort golv?”"
  - amne: so-no
    amnesnamn: Biologi
    arskurs: åk 8
    innehall: "Blodomloppet: hjärtat, lungorna och kroppens två kretslopp"
    huvud: true
    overst:
      egen: "Två kretslopp, det lilla genom lungorna och det stora genom kroppen. Felet: att tro att alla artärer har syrerikt blod."
      visar: Alla ritar ur minnet med pilar och fem ord, och förklarar för grannen.
    plan:
      amne: Biologi
      klass: 8C
      datum: ons 13/1
      lektion: 4 av 8
      mal: "förklara varför blodet går genom hjärtat två gånger"
      belagg: "skissen ur minnet med båda slingorna, och svaret på lektionens fråga"
      blad: "bilden med två slingor, frågorna och facit"
      forberett: "bilden med orden till studiehandledaren i förväg"
      fore: { sitta: "Två kretslopp, och att blodet hämtar syre i lungorna", fragan: "Varför blir du andfådd när du springer?", svaret: "Musklerna behöver mer syre, och blodet hämtar det i lungorna och går genom hjärtat två gånger.", veckan: "Vad gör de röda blodkropparna?", manaden: "Varför behöver cellerna syre?", tror: "5 på förra månadens fråga" }
      delar:
        - { fas: Start, text: "En tom bild av en cell" }
        - { fas: Din planering, text: "Två slingor i bilden och en blodkropp från tån i genomgången om kretsloppen, och fyra kärl blandade i övningen" }
        - { fas: Avslut, text: "9.39. Blodomloppet med pilar och fem ord, eller svaret i en rad" }
      beslut: { elever: 28, nastanAlla: "fyra veckor", deFlesta: ["nästa onsdag", "en tom bild av en cell"], halften: "när genomgången börjar på fredag" }
      efter: { kontrollen: "fråga 2, 9 av 28 med fel", hogar: "5, och det blev 9", sag: "”Musklerna behöver mer syre, därför andas jag fortare.”", kryss: [1, 2, 3, 4, 5], nasta: "lungartären förväxlades med lungvenerna, och fem klarade sig utan bilden", forst: "lungartären till nästa vecka, och cellerna med en ledtråd" }
      lagg: ["Lägg märke till: skissen sist visar om eleverna kan följa blodet från kroppen till hjärtat, lungorna, hjärtat och ut igen, och säga var det hämtar syret. Låt eleverna jämföra den med din bild."]
    remsa:
      - Starten hade två frågor ur minnet med boken stängd, och skissen kom ur minnet sist.
      - Frågan om cellerna kom från förra månaden, och du skrev lungartären på återkomstlistan.
      - Du följde en blodkropp från tån steg för steg, och alla följde en från hjärnan själva.
      - Du ritade slingorna en i taget och pekade medan du sa vad blodet bär.
      - Raden blandade fyra kärl, och eleven skrev först kretsloppet och sedan syrehalten.
    scen:
      - "Tänk dig en lektion i biologi i åk 8. Starten på fem minuter har två frågor: ”Vad gör de röda blodkropparna?” från förra veckan och ”Varför behöver cellerna syre?” från förra månaden. Du trodde att 5 hade fel på den andra, men händerna visar 9 av 28. De flesta kan, så frågan kommer tillbaka nästa vecka."
      - "Lektionens fråga, ”Varför blir du andfådd när du springer?”, tar en minut: alla skriver en gissning. I genomgången ritar du det stora kretsloppet bredvid det lilla, en slinga i taget, och pekar medan du följer en blodkropp från tån. Alla följer en från hjärnan. Övningen har tre uppgifter om det stora och, när det sitter, en blandad rad med fyra kärl: vilket kretslopp, och syrerikt eller syrefattigt?"
      - "I Avslut på sex minuter stänger alla boken och ritar blodomloppet med pilar och fem ord. Grannen frågar ”Varför?”, och en elev svarar: ”Musklerna behöver mer syre, därför andas jag fortare.”"
    notera: "Notera vad som hände. Du sa svaret: ”Musklerna behöver mer syre. Du andas fortare för att blodet ska hämta mer syre i lungorna, och hjärtat pumpar det fortare ut till musklerna.” Den blandade raden visade vem som tror att alla artärer har syrerikt blod, och lungartären hade flest fel. Blodomloppet är ett samband i flera steg, med kärl som förväxlas, så lektionen tog alla tre verktygen. Veckan efter är andfåddheten startens varför-fråga."
  - amne: praktisk-estetiska
    amnesnamn: Hem- och konsumentkunskap
    arskurs: åk 7
    innehall: "Bakning efter ett recept med många steg"
    overst:
      egen: "Receptets steg i ordning, ett i taget med en bild. Felet: att stödet ligger kvar fast eleverna kan stegen."
      visar: Paren säger nästa steg till varandra innan de vänder kortet.
    scen:
      - "Tänk dig en lektion i hem- och konsumentkunskap i åk 7. Klassen bakar bullar för tredje gången. Första gången låg receptet på ett kort vid varje arbetsplats, med en enkel bild vid varje steg, och på tavlan stod bara det steg ni var på. Ett helt recept på en sida hade fått eleverna att leta och tappa bort sig."
      - "I starten svarar alla ur minnet på frågan ”Varför ska degen jäsa innan den går in i ugnen?” 4 av 24 har fel. Nästan alla kan. I dag visar du först hur du knådar degen, och en elev gör efter dig."
      - "Sedan lägger paren kortet med baksidan upp och säger nästa steg till varandra innan de tittar. Paren som säger alla steg rätt bakar med bara mängderna kvar på kortet, och du står vid de tre par som fortfarande behöver hela kortet."
    notera: "Notera vad som hände. Du tog bort stödet efter det paren visade, och inte efter ett schema. Lektionens fråga var: ”Varför knådar vi degen så länge?”"
stod:
  rubrik: Elever som behöver mer stöd
  rader:
    - { nar: Den som är ny i svenska, metoden: "Du läser startens frågor för eleven, som svarar muntligt eller ritar. Ämnesordet står vid bildens del, och eleven pekar och säger det.", du: "Ge studiehandledaren startens frågor, återkomstlistans rader och bilden att gå igenom med eleven i förväg. I Avslut har eleven ämnesorden på bänken, men sambandet tar hen fram själv." }
    - { nar: "De yngsta, i F–⁠3", metoden: "Eleverna ritar, visar eller säger svaret till grannen, och frågekartan och bilder gör att de kan ta fram ur minnet utan att skriva.", du: "Ställ bestämda frågor i stället för ”Skriv allt du minns”, och ta dem i korta stunder flera gånger om dagen. Blanda högst två slag, och visa ordet före bilden när eleverna lär sig läsa." }
    - { nar: Den som har det svårast i ämnet, metoden: "Ledtråden efter en minut och svaret samma lektion ger eleven något att utgå från.", du: "Ge fler uppgifter av ett slag i taget och fler lösta exempel före blandningen. Är elevens rad tom efter ledtråden, ställer du en snävare fråga bara till hen." }
    - { nar: Den som redan kan, metoden: "Varför-frågan och skissen ger något att arbeta med.", du: "Ta bort stödet tidigare, ge äldre frågor och delvis lösta exempel, och låt eleven rita sin egen bild av sambanden." }
    - { nar: När många behöver hjälp samtidigt, metoden: "Starten och uppgiften efter exemplet visar vem som kan gå vidare själv.", du: "Låt dem som kan börja på uppgiften medan du visar exemplet för de andra, och låt eleverna lösa en blandad rad i par." }
    - { nar: När metoden inte räcker, metoden: "Svaren i Avslut visar vem som inte lär sig innehållet trots strategierna.", du: "Läs svaren från Avslut med specialläraren. Har eleven samma fel efter flera återkomster, ta det med elevhälsan." }

