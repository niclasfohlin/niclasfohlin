progression:
  rubrik: De första veckorna
  text: "Metoden är troligen ny för dig och för klassen. Ordningen och takten är förslag. Ni börjar med kamraten och T-kortet, och sedan kommer Ping-pong-prat. Därefter lär sig klassen en färdighet och en struktur i veckan, som i tabellen, medan du övar ett drag. Färdigheterna står efter veckorna och på bladet Samarbetsfärdigheterna. Gå vidare när veckans färdighet syns hos nästan alla. Syns den inte, stanna kvar och gör om veckan en eller två gånger, så att den sitter för klassen och för dig. Besöken och mötet flyttar med. Alla fem principerna finns med från det första samarbetet, men du kan öva på en sak i taget: välj en färdighet eller ett av besluten före lektionen, och håll fast vid det i några veckor."
  rader:
    - { vecka: "1", led: Klimatet, rubrik: "Kamraten, T-kortet och Ping-pong-prat", eleverna: "Att lyssna aktivt: vända sig mot kamraten, vänta på sin tur och tacka.", roll: "Att visa strukturen med en elev, tänka högt om det eleverna ska tänka på i samtalet och säga vad du såg.", vidare: "nästan alla par turas om och tackar", fraga: "Turas nästan alla par om och tackar?" }
    - { vecka: "2", led: Samtalet, rubrik: "EPA och signalen", eleverna: "Att tänka högt: tänka själv först och säga sin tanke till kamraten, och att följa signalen.", roll: "Att ge tanketid och lyssna efter om båda säger något eget.", vidare: "båda i nästan alla par säger något eget", fraga: "Säger båda i nästan alla par något eget?" }
    - { vecka: "3", led: Paret, rubrik: Turas om, eleverna: "Att ställa frågor: fråga kompisen först och hjälpa utan att säga svaret.", roll: "Att fråga paret i stället för att ge svaret.", vidare: "båda i nästan alla par du lyssnar på kan förklara parets lösningar", fraga: "Kan båda i nästan alla par du lyssnar på förklara parets lösningar?" }
    - { vecka: "4", led: Grupperna, rubrik: Bordsön och Huvuden ihop, eleverna: "Att kolla att alla kan, och att enas vid bordsön om ett svar som alla kan ge.", roll: "Att dra en symbol ur skålen och låta bordsön hjälpa den som har symbolen att bli redo.", vidare: "de du frågar kan svara för gruppen vid nästan alla bordsöar", fraga: "Kan de du frågar svara för gruppen vid nästan alla bordsöar?" }
    - { vecka: "5", led: Grupperna, rubrik: "Gruppen och Mötas på mitten", eleverna: "Att bygga vidare på kamratens idé och ge gruppen namn och kontrakt.", roll: "Att säga vad varje elev bidrog med.", vidare: "nästan alla grupper visar hur de byggde vidare och säger vad de ska göra bättre", fraga: "Visar nästan alla grupper hur de byggde vidare och säger vad de ska göra bättre?" }
uppfoljning:
  text: Du ser om metoden fungerar i elevernas egna uppgifter, i klassens samarbete och i dina kryss.
  rader:
    - { id: lektionen, nar: Varje lektion, tid: varje lektion, vad: "Den egna uppgiften och dina anteckningar visar vad paren kunde förklara och vad du tar upp nästa lektion." }
    - { id: klassen, nar: Klassens arbete varje vecka, tid: varje vecka, vad: "Räkna hur många som klarar veckans sista egna uppgift och hur många par som använder färdigheterna på T-korten utan påminnelse." }
    - { id: lararen, nar: Dina kryss i planeringsmallen, tid: varje vecka, vad: "Räkna hur ofta varje princip fanns i veckans lektioner. Det som oftast faller bort är färdigheten, eget ansvar och reflektionen, och det du gör själv märker du sist." }
    - { id: observationerna, nar: "Vecka 2 eller 3, och vecka 4", tid: vecka 2 och 4, vad: "Specialläraren ser den första hela lektionen och de egna uppgifterna i vecka 2 eller 3, och en kollega eller rektor i vecka 4." }
    - { id: arbetslaget-fore, nar: Före första lektionen, tid: före, vad: "På arbetslagets första möte bestämmer ni signalen, planerar första hela lektionen och bokar besöken." }
    - { id: arbetslaget-efter, nar: Vecka 5, tid: vecka 5, vad: "I slutet av de första veckorna ses ni igen, reflekterar och bestämmer hur ni fortsätter." }
    - { id: stodet, nar: Efter de första veckorna, tid: efter, vad: "En kollega besöker en lektion i månaden, fyra gånger. Du läser dina anteckningar om elevernas egna uppgifter med specialläraren, och de som inte lär sig innehållet får stödundervisning." }
    - { id: sexveckor, nar: Sex skolveckor efter de första veckorna, tid: efter 6 veckor, vad: "Räkna samma saker som varje vecka, så att du ser om metoden sitter kvar." }
    - { id: nastatermin, nar: Nästa termin, tid: nästa termin, vad: "Räkna igen, och se om ni använder metoden i fler ämnen." }
    - { id: osaker, nar: Om du är osäker på metoden, tid: villkor, vad: "Står skattningen ”Hur säker är jag på metoden?” under 5 i två veckor i rad, gör om veckan och be en kollega se ett samarbete." }
    - { id: klassenstar, nar: Om det inte fungerar, tid: villkor, vad: "Står skattningen ”Hur väl fungerar den i praktiken?” under 5 i två veckor i rad, gör samarbetet kortare och be specialläraren se en lektion. Likaså när hälften eller färre kan den egna uppgiften." }
checklista:
  rubrik: Före första lektionen
  punkter:
    - Planera den första veckans två eller tre korta samarbeten och den första hela lektionen.
    - Sätt ihop paren och bordsöarna så att olika elever möts, och lägg en symbol på varje plats.
    - Skriv ut bladet Samarbetsfärdigheterna, och förbered T-kortet för den första färdigheten, lyssna aktivt.
    - Skriv ut lektionskortet, symbolerna, fraserna att låna och veckans strukturkort, och ta fram skålen med symbolerna.
    - Boka besöken, ett av dem med specialläraren.
    - Bestäm signalen med arbetslaget, eller med en kollega om du börjar ensam.
klassen:
  rubrik: Så ordnar du klassen
  text: Eleverna sitter vid bordsöar om fyra, på runda bord eller fyrkantiga där ingen sitter på kortsidan, och borden står så att grupperna inte stör varandra. Du sätter ihop grupperna så att olika elever möts, och den som behöver mest stöd sitter snett emot den som kan mest, bredvid en kamrat det fungerar med. Blir det elever över, blir en eller flera bordsöar trior. Var och en har sin symbol på bordet, och axelkompisen och ögonkompisen är paren. Paren och bordsöarna står kvar i några veckor. När du byter, säger du vad paren gjorde bra, och de tackar varandra innan ni börjar om med samma rutiner. Fungerar ett par inte, byter du, och vid kränkning följer du skolans rutin. I förskoleklass och åk 1 sitter paren bredvid varandra också i samlingen.
forsta:
  rubrik: Första veckan
  text:
    - "Den första veckan gör ni två eller tre korta samarbeten i vanliga lektioner, på något paren redan kan. I det första kan paren leta efter tre saker de har gemensamt, och den första färdigheten är att lyssna aktivt: vända sig mot kamraten, vänta på sin tur och tacka. Ni fyller i T-kortet tillsammans, och du visar signalen och symbolerna, som rutinerna säger."
    - "Sedan kommer Ping-pong-prat, och i slutet av veckan gärna EPA (enskilt, par, alla). Huvudfilmen visar ett samarbete med Ping-pong-prat. Du visar strukturen med en elev och tänker högt om det eleverna ska tänka på i samtalet. Säg varför: ni lär er mer av varandra, och det viktiga är att hjälpa varandra att lära er så mycket som möjligt."
  plan:
    klass: 4B
    datum: tis 10/11
    lektion: "1"
    mal: "förklara olika sätt att få samma tal, med multiplikation och addition"
    belagg: "36 på två sätt, ett med gånger, på minitavlan"
    blad: "T-kortet, EPA och minitavlor"
    forberett: "en trygg kamrat till den som behöver det, och ”Jag tänker … därför att …” på tavlan"
    fore: { fardigheten: "Tänka högt: tänka själv först och säga sin tanke", ogat: "tummen upp, sedan knä mot knä", orat: "Jag tänker … därför att …", strukturen: "EPA", malet: "båda kan förklara tre sätt att få 24", visar: "en symbol och den egna uppgiften", felet: "adderar talen, så att 30 · 6 blir 36" }
    delar:
      - { fas: Start, text: "Paren hälsar. Visa färdigheten med en elev: tänk först, säg sedan" }
      - { fas: Genomgång, text: "Visa att 3 · 4 och 10 + 2 ger 12. Visa EPA med en elev. Säg målet och att du drar en symbol" }
      - { fas: Samarbetet, text: "”Tänk själv på ett sätt att få 24. Säg ditt, och lyssna på kompisens. Hitta ett tredje tillsammans.” Säg vad du hör" }
      - { fas: Var och en visar, text: "En symbol, två förklarar parets sätt. Alla gör 36 på två sätt, ett med gånger" }
      - { fas: Avslut, text: "Vad hjälpte er att lära er? Vad gör ni bättre nästa gång?" }
    beslut: { elever: 28, nastanAlla: "dem som adderade talen", deFlesta: ["30 + 6 mot 30 · 6", "sina sätt"], halften: "fyra grupper med sex, med materialet" }
rutiner:
  rubrik: Rutinerna klassen lär sig
  rader:
    - namn: T-kortet
      vecka: 1
      vad: "Överst på T-kortet, ovanför taket på T:et, står samarbetsfärdigheten. Under ögat står vad ni vill se när färdigheten används, och under örat vad ni vill höra. Då är det tydligt hur ni ska samarbeta, och efteråt kan ni fråga er om ni såg och hörde det."
      steg: ["Skriv veckans färdighet överst, ovanför taket på T:et.", "Skriv med elevernas ord under ögat vad ni vill se och under örat vad ni vill höra när färdigheten används.", "Visa färdigheten med en elev, och låt alla göra likadant i tio sekunder.", "Peka på kortet när du ser och hör färdigheten, och fråga efteråt: Såg och hörde vi det som står på kortet?"]
      forsta: Fyll i kortet med klassen för den första färdigheten, och låt paren pröva den i en kort uppgift.
    - namn: Signalen
      vecka: 2
      vad: Signalen är ett tecken som betyder att alla tystnar och vänder sig mot dig, också mitt i ett livligt samtal.
      steg: ["Ge tecknet, som handen upp, och vänta.", "Tacka när alla är med."]
      forsta: Visa tecknet i det första samarbetet, och öva det när paren letar efter tre saker de har gemensamt. I vecka 2 övar ni tills alla tystnar inom fem sekunder.
    - namn: Fråga kompisen först
      vecka: 3
      vad: Den som fastnar frågar kompisen eller gruppen först. Vet ingen, räcker hela gruppen upp handen.
      steg: ["Fråga kompisen: Kan du hjälpa mig?", "Fråga ett annat par vid bordet.", "Vet ingen: alla räcker upp handen."]
      forsta: Säg rutinen när du ger instruktionen, och låt klassen säga stegen efter dig.
    - namn: Bordsön och symbolerna
      vecka: 4
      vad: Fyra elever sitter vid ett bord, var och en med sin symbol. Symbolen väljer vem som svarar, får en roll eller byter grupp. Materialet ligger i en låda på bordsön, och cirkeln hämtar och lämnar den.
      steg: ["Sätt dig där din symbol ligger.", "Axelkompisen och ögonkompisen är paren vid bordet.", "Läraren drar en symbol ur skålen, och ni får en stund till att hjälpa den som har symbolen att bli redo. Alla med symbolen ställer sig upp, och läraren frågar en eller två.", "Saknas någon, blir ni en trio: rollerna går runt, och en av er tar också den saknade symbolen."]
      forsta: Visa symbolerna i det första samarbetet med en lätt fråga, så att alla ser hur dragningen går till. Fram till vecka 4 hjälper paret den som har symbolen att bli redo, och sedan gör bordsön det.
larandet:
  rubrik: Så syns lärandet i klassen
  omraden:
    - { omrade: amneskunskaper, syns: "I den egna uppgiften efteråt gör eleverna själva det paret arbetade med och kan förklara hur de tänkte." }
    - { omrade: kommunikation, syns: "Eleverna förklarar hur de tänker, med ”Jag tänker … därför att …”, och ställer frågor till kamraten." }
    - { omrade: socialt, syns: "Eleverna använder veckans färdighet utan påminnelse och arbetar med fler kamrater i klassen." }
    - { omrade: sprak, syns: Eleverna använder ämnets ord när de förklarar för kamraten. }
uppdrag:
  rubrik: Till arbetslaget
  text: Ni samarbetar som klassen. Ni planerar i par, och var och en prövar något litet flera gånger. Ni har två möten på en och en halv timme var, där ni reflekterar i EPA. Den som får besök visar sin planering före lektionen och tar med den till det andra mötet.
  forbered:
    text: Läs metoden, och tänk igenom frågorna före mötet. På mötet bestämmer ni signalen, planerar den första hela lektionen och bokar besöken.
    fragor:
      - Vem pratar i dina lektioner, när och om vad, och vilka elever kommer till tals?
      - Vad gör du redan nu för att lära ut hur man samarbetar?
      - Behöver dina elever varandra när de arbetar ihop, och syns vad var och en kan?
      - "Titta på huvudfilmen: vad gör läraren när hen går mellan paren?"
  planera: Planera nästa samarbete i planeringsmallen, med en färdighet och ett mål som kräver båda. Ni som har samma klass säger varje vecka till varandra vilken färdighet klassen övar.
  genomfor: Pröva gärna veckans struktur i ett ämne till, följ Lär dig metoden på metodens sida och be en kollega se ett samarbete.
  reflektera: ["Hur fungerade det för dig och för eleverna?", "Hur påverkades elevernas lärande?", "När syntes varje elevs bidrag, och när vilade någon?", "Vad gjorde du för att stötta samtalen?"]

