# ---------------------------------------------------------------------------------------------------------------------
# Lär dig metoden
# ---------------------------------------------------------------------------------------------------------------------
plan:
  passen:
    - { nar: första lektionen, kort: Rutinerna, text: "Den första veckan gör ni två eller tre samarbeten på tio minuter i vanliga lektioner, på något paren redan kan." }
  fore: ["Planera den första veckans två eller tre korta samarbeten och den första hela lektionen."]
  utvardering: ["En kollega besöker en lektion i månaden, fyra gånger. Du läser dina anteckningar om elevernas egna uppgifter med specialläraren, och de som inte lär sig innehållet får stödundervisning."]
  skattningar:
    - namn: Hur säker är jag på metoden?
      vem: lararen
      rad: lararen
      text: "Skatta i slutet av veckan. Tänk på de fem principerna: Visade du färdigheten, och övade klassen den? Gav du ett mål som krävde alla? Sa du hur var och en visar, och visade alla? Fick alla tänka själva och få sin tur? Reflekterade paren, och sa du konkret vad du såg?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: osaker }
    - namn: Hur väl fungerar den i praktiken?
      vem: lararen
      rad: klassen
      text: "Tänk på det du ser i klasserna: Gör eleverna på egen hand det de arbetade med i paret? Förklarar de för kamraten hur de tänker? Använder de veckans färdighet utan påminnelse?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: klassenstar }

# ---------------------------------------------------------------------------------------------------------------------
# Lathunden Att komma igång
# ---------------------------------------------------------------------------------------------------------------------
lathund:
  metoden:
    text:
      - Paren och bordsöarna lär sig ämnet i strukturer där alla behövs och var och en kan visa vad hen kan. Du lär ut samarbetet lika medvetet som ämnet.
      - Lärandet går till så här. När eleverna förklarar för varandra hör både de själva och du hur de tänker. När vem som helst kan få svara, lönar det sig att förklara tills alla kan.
  lektion:
    text: "Den första veckan gör ni två eller tre korta samarbeten. I det första kan paren leta efter tre saker de har gemensamt, och ni fyller i T-kortet för den första färdigheten, lyssna aktivt: vända sig mot kamraten, vänta på sin tur och tacka. Sedan kommer Ping-pong-prat. Den första hela lektionen, i vecka 2 eller 3, står på lektionskortet."
  igang:
    rubrik: De första veckorna
