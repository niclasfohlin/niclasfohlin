# Bilaga B Valet och forskningen
# ---------------------------------------------------------------------------------------------------------------------
passar:
  rubrik: När passar metoden?
  kort: "eleverna ska förstå och förklara något tillsammans. Möter de något nytt, börjar du med explicit undervisning."
  rader:
    - { fraga: "Vad ska eleverna lära sig?", metoden: "Att förstå, förklara och resonera om något de har mött, och att befästa det.", annat: "Något nytt där det finns ett rätt sätt att göra. Då passar explicit undervisning, och kooperativt lärande efter genomgången." }
    - { fraga: "Hur mycket kan eleverna redan?", metoden: "Tillräckligt för att ha något att tänka tillsammans om.", annat: "Nästan inget om innehållet. Börja med explicit undervisning, och samarbeta sedan." }
    - { fraga: "Vad ska eleverna kunna efteråt?", metoden: "Förklara hur de tänkte, och göra det själva.", annat: "Ett snabbt och säkert svar utan förklaring. Då kan övning på egen hand räcka." }
    - { fraga: "Vad behöver eleverna innan de gör själva?", metoden: "En kamrat att pröva tanken med, och någon som kollar att de kan.", annat: "Ett exempel steg för steg, som i explicit undervisning." }
    - { fraga: "Vad går oftast snett?", metoden: "Färdigheten lärs inte ut: visa den med T-kortet, låt klassen öva och säg vad du hörde.", annat: "Grupparbete utan gruppmål och utan att var och en visar vad hen kan ger sällan bättre resultat (Slavin, 1991)." }
  tumregel: Lägg samarbetet efter genomgången, när eleverna har något att samtala om. Tabellen är ett stöd för tanken och ingen regel.
  metoder: [explicit-undervisning]
invandningar:
  rubrik: Invändningar och nyanser
  fragor:
    - { fraga: "Är inte kooperativt lärande bara grupparbete?", svar: "Nej. Grupparbete utan mål som kräver alla och utan att var och en visar vad hen kan ger sällan bättre resultat. Pussel utan gruppmål fick inte stöd i studierna, men med gruppmål och eget ansvar gav det effekt, liksom de flesta jämförelser med båda villkoren (Slavin, 1991). En struktur som Pussel ger alltså inget av sig själv." }
    - { fraga: "Gör inte de duktiga allt arbete?", svar: "Det gör de när alla vet att den som kan mest svarar för gruppen. Med eget ansvar kan vem som helst få förklara, och då lönar det sig för gruppen att förklara för den som inte kan. Eget ansvar är ett av villkoren för att samarbetet ska ge resultat (Slavin, 1991), och därför hör slumpen och den egna uppgiften till varje lektion." }
    - { fraga: "Tar inte samarbetet tid från kunskaperna?", svar: "Kunskaperna och relationerna växer i samma undervisning: elever lärde sig mer och fick bättre kamratrelationer med gemensamma mål än med tävling eller eget arbete (Roseth m.fl., 2008). Samarbetet är oftast korta moment i ämnets lektion, efter genomgången." }
grund:
  rubrik: Det forskningen visar
  text:
    - "Kooperativt lärande är ett av skolans mest undersökta arbetssätt. I en översikt av 148 studier lärde sig elever i åk 6–⁠9 mer och fick bättre kamratrelationer med gemensamma mål än med tävling eller eget arbete (Roseth m.fl., 2008). Studierna är mest gjorda i USA, och översikten säger inte vilka studier som hade eget ansvar. Få studier om kooperativt lärande gäller förskoleklass och åk 1."
    - "I det stränga underlaget, där bara studier med jämförbara grupper och oberoende prov räknas, blir talen mindre. I matematik från åk 6 till gymnasiet gav STAD 0,42 i fyra studier (Slavin, Lake och Groff, 2009). I läsning gav program med kooperativt lärande, mest CIRC, 0,21 i tio studier i åk 2–⁠5 (Slavin, Lake, Chambers m.fl., 2009). I skrivning blev texterna bättre med program där eleverna skriver i lag, mest med Student Team Writing, som gav 0,38 i åk 6–⁠8. I två stora försök med Writing Wings var skillnaden mindre (Slavin m.fl., 2019). I NO gav träning i grupparbete bättre resultat för 8–10-åringar i England (Baines m.fl., 2007; Slavin m.fl., 2014)."
    - "Strukturen ensam räcker inte. Pussel utan gruppmål fick inte stöd i studierna, men Pussel med gruppmål och eget ansvar gav effekt. Det är de två villkoren som skiljer samarbete som ger resultat från grupparbete (Slavin, 1991). Lärarna som genomförde arbetssättet bäst lärde ut färdigheterna (Veldman m.fl., 2020). Av trettio lektioner som lärare själva kallade kooperativa hade bara två alla de fyra kännetecken som forskarna mätte (Adl-Amini m.fl., 2024)."
    - "I de stora försöken syns både det sociala och lärandet. I en stor randomiserad studie i åk 7 fick eleverna färre emotionella problem, och elever med lågt engagemang sa att de mobbades mindre (Van Ryzin och Roseth, 2018). I ett randomiserat försök i åk 6 läste eleverna bättre när de arbetade i lag (Slavin, Chamberlain m.fl., 2009). I den svenska studien i åk 5 ökade den sociala acceptansen något (Klang m.fl., 2020), men läsförståelsen blev inte säkert bättre (Klang m.fl., 2022). Niclas Fohlin är medförfattare till artikeln från 2020."
