# 2 Lektionen
# ---------------------------------------------------------------------------------------------------------------------
tidsschema:
  rubrik: En lektion på 45 minuter
  rader:
    - { tid: Före lektionen, fas: Före lektionen, vad: "Välj strukturen och fatta fyra beslut: färdigheten, målet, hur var och en visar och frågorna till reflektionen. Kan en elev lösa uppgiften ensam? Ändra den då." }
    - { tid: 0–⁠5 min, fas: Start, form: I par, vad: "Paren vänder sig mot varandra och hälsar, och du visar veckans färdighet med T-kortet: hur den ser ut och hur den låter." }
    - { tid: 5–⁠15 min, fas: Genomgång, form: Läraren visar, vad: "Du går igenom innehållet, visar strukturen med en elev och säger målet och hur var och en kommer att visa." }
    - { tid: 15–⁠32 min, fas: Samarbetet, form: I par, vad: "Alla tänker först, och sedan arbetar paren i strukturen medan du går mellan dem, lyssnar efter färdigheten och felet och säger vad du hör." }
    - { tid: 32–⁠40 min, fas: Var och en visar, form: Enskilt, vad: "Paret, från vecka 4 bordsön, gör alla redo. Du drar en symbol, och en eller två svarar för gruppen. Sedan gör alla en egen uppgift och håller upp den." }
    - { tid: 40–⁠45 min, fas: Avslut, form: I par, vad: "Paren säger vad som hjälpte dem att lära sig och en sak de ska göra bättre. Du säger vad du såg, och sist tackar paren varandra." }
    - { tid: Efter lektionen, fas: Efter lektionen, vad: "Sortera de egna uppgifterna i kan, nästan och inte än, och läs dina anteckningar om färdigheten och felet. Välj utifrån dem vad nästa samarbete börjar med och vem du går till först." }
  varianter:
    - nar: första lektionen
      text: "Den första hela lektionen, i vecka 2 eller 3, har ett innehåll klassen kan."
      delar:
        - { fas: Start, tid: 0–⁠5 min }
        - { fas: Genomgång, tid: 5–⁠15 min }
        - { fas: Samarbetet, tid: 15–⁠32 min }
        - { fas: Var och en visar, tid: 32–⁠40 min }
        - { fas: Avslut, tid: 40–⁠45 min }
    - nar: ett samarbete i en vanlig lektion
      text: "Samarbetet tar tio minuter av ämnets lektion. I Start säger du färdigheten, målet och hur var och en visar. Du drar en symbol och frågar en elev med den. Den egna uppgiften är den uppgift eleverna sedan gör själva i lektionen. Börja nästa samarbete med att säga vad eleverna kunde i den."
      delar:
        - { fas: Start, tid: 0–⁠2 min }
        - { fas: Samarbetet, tid: 2–⁠6 min }
        - { fas: Var och en visar, tid: 6–⁠8 min }
        - { fas: Avslut, tid: 8–⁠10 min }
  efter: Minuterna är hållpunkter. Turas om fyller hela samarbetet, och med en kort struktur, som Ping-pong-prat, gör paren först strukturen och sedan en uppgift mot målet.
steg:
  rader:
    - namn: Start
      fraga: "Sitter alla nära och vända mot kamraten?"
      alla: Varje par säger frasen under örat på T-kortet till varandra.
      titta: "Sitter alla nära och vända mot kamraten?"
      beslut: "Sitter några långt ifrån: be dem flytta närmare innan ni börjar."
      gor:
        - "Ge signalen, och säg: ”Vänd er mot er kompis och säg hej med namnet.”"
        - "Peka på ögat och örat på T-kortet: ”Jag vill se … Jag vill höra …”"
        - Visa färdigheten med kropp och röst tillsammans med en elev, och låt paren säga frasen till varandra.
      fraser: ["Vänd er mot er kompis och säg hej med namnet.", "Jag vill se … Jag vill höra …"]
    - namn: Genomgång
      fraga: "Vet varje par vad de ska göra och vem som börjar?"
      alla: Varje par säger till varandra vad de ska göra först.
      titta: "Vet varje par vad de ska göra och vem som börjar?"
      beslut: "Är flera osäkra: låt ett par visa stegen för klassen innan ni börjar."
      gor:
        - Gå igenom innehållet kort, med ett exempel på det nya, så att paren har något att tänka tillsammans om.
        - Visa strukturens steg med en elev, och säg högt vad du gör.
        - "Skriv målet på tavlan: ”Ni är klara när båda kan förklara …”"
        - "Säg hur var och en visar: ”Sedan drar jag en symbol ur skålen.”"
      fraser: ["Ni är klara när båda kan förklara …", "Sedan drar jag en symbol ur skålen."]
    - namn: Samarbetet
      vem: "i par, bordsön i vecka 4–⁠5"
      fraga: "Säger båda något eget, och hör jag felet?"
      alla: Båda i paret talar om innehållet och gör det som står på T-kortet.
      titta: "Säger båda något eget, och tar de upp det kamraten sa?"
      beslut: "Ett par fastnar: fråga paret först, som i Så stöttar du. Samma fel i flera par: stoppa klassen och visa igen."
      gor:
        - "Ge tanketid: ”Tänk själv en stund. Tummen upp när du har något.”"
        - Ta inga frågor de första tjugo sekunderna efter instruktionen, och peka mot kompisen när någon frågar dig.
        - "Gå först till dem som hade fel förra gången, sedan mellan paren. Anteckna färdigheten, felet och något intressant ur innehållet."
        - "Säg vad du hör med T-kortets ord: ”Jag hör att ni frågar varandra: Hur tänkte du?”"
        - "Stoppa halvvägs och fråga om färdigheten: ”Kan vi se och höra att den används? Kan båda förklara? Viska till varandra.”"
      fraser: ["Tänk själv en stund.", "Jag hör att ni frågar varandra: Hur tänkte du?"]
    - namn: Var och en visar
      fraga: "Kan var och en göra det själv?"
      alla: En eller två med symbolen förklarar gruppens svar, och alla håller upp sin egen uppgift.
      titta: "Kan de du frågar förklara, och syns hur alla tänkte?"
      beslut: Ett av tre utfall, nedan.
      gor:
        - "Säg: ”Ni har en minut att göra alla redo. Skriv eller rita tre stödord på lappen, gärna ämnets ord.”"
        - Dra en symbol ur skålen och ge grupperna en stund till, så att svaret blir gruppens.
        - "Be alla med symbolen ställa sig upp, och fråga en eller två: ”Alla trianglar, ställ er upp. Vad kom ni fram till?”"
        - "Ge en ny uppgift av samma slag, där felet du lyssnar efter syns. Var och en gör den på minitavlan. Säg sedan: ”Håll upp!”"
        - Räkna eleverna med fel, och skriv upp deras namn.
      fraser: ["Ni har en minut att göra alla redo.", "Alla trianglar, ställ er upp."]
      redo:
        nastanAlla: Högst 5 av 28 med fel. Gå till Avslutet. I nästa samarbete sätter du dig först med dem som inte kunde.
        deFlesta: 6–13 av 28 med fel. Paren visar varandra sina lösningar och förklarar, och du lyfter ett vanligt missförstånd.
        halften: 14 eller fler av 28 med fel. Stanna och visa igen, och låt paren göra en uppgift till tillsammans.
        tiden: "Räcker tiden inte: korta Avslutet till tacket, och låt paren börja nästa samarbete med samma slags uppgift. Gå först till dem som hade fel."
    - namn: Avslut
      fraga: "Kan paren säga vad som hjälpte dem att lära sig?"
      alla: Varje par säger med T-kortets ord vad som hjälpte och vad de gör bättre. Sedan tackar de varandra.
      titta: "Säger paren vad de gjorde, eller bara att det gick bra?"
      beslut: "Säger de bara att det gick bra, fråga om färdigheten: ”Kan vi se och höra att den används?” Nästa gång säger du reflektionens frågor före samarbetet."
      gor:
        - "Ställ reflektionens frågor: ”Vad hjälpte er att lära er? Vad gör ni bättre nästa gång? Viska till varandra.”"
        - "Säg vad du såg och hörde, om innehållet och om färdigheten: ”Jag hörde … och i den egna uppgiften kunde båda …”"
        - "Säg vad du vill se och höra mer av nästa gång: ”Jag vill höra fler …”"
        - "Låt paren tacka varandra: ”Tacka din kompis för något bestämt hen gjorde.”"
      fraser: ["Vad hjälpte er att lära er? Vad gör ni bättre nästa gång?", "Tacka din kompis för något bestämt hen gjorde."]
lektionskort:
  - { efter: klassen, text: "Lektionen står på lektionskortet och strukturerna på strukturkorten. Slumpas någon fram i strukturen, gör du det med dragningen av en symbol i Var och en visar, och du drar bara en gång." }
fastnar:
  rubrik: Så stöttar du
  text: När ett par fastnar, i innehållet eller i samarbetet, lyssnar du först och frågar hela paret. Ansvaret för att båda förstår ligger kvar hos paret.
  trappa:
    - "Lyssna i ögonhöjd: ”Vad gör ni nu? Hur tänkte ni?”"
    - "Ge paret ansvaret: ”Hur kan ni se till att båda förstår?”"
    - "Ge dem en kort stund att hitta en väg, och kom tillbaka. Står de still, visa ett första steg."
    - "Har flera par samma problem, stoppa klassen, visa igen och låt dem fortsätta."
  motto: Du hjälper paret att hjälpa varandra. Målet är deras.
amnesexempel:
  - amne: lasning
    arskurs: åk 5
    innehall: "Läsförståelse: att dra slutsatser om en person i en berättelse"
    overst:
      egen: "Frågan har många svar: Varför gör hon så? Felet: att svara med en händelse i stället för ett skäl."
      visar: Två med symbolen säger gruppens skäl ur texten, och alla skriver ett skäl till en ny fråga på minitavlan.
    scen:
      - Tänk dig en lektion i svenska i åk 5. Klassen har läst kapitel fyra i högläsningsboken, där huvudpersonen ljuger för sin bästa vän. Veckans färdighet är att kolla att alla kan, och på T-kortet står ”Kan du säga det?”
      - "Du frågar: ”Varför ljuger hon, tror ni?” Alla tänker en halv minut, och du säger: ”Huvuden ihop!” Vid ett bord hör du: ”Hon vill inte att vännen ska bli ledsen.” ”Hur vet du det?” ”Hon säger ju att hon är rädd att förlora henne.”"
      - "Efter en minut drar du stjärnan ur skålen, och grupperna får en stund till att göra sin stjärna redo. Alla stjärnor ställer sig upp, och två av dem tittar på stödorden och säger skälet med egna ord. Sedan frågar du: ”Varför går vännen därifrån?” Alla skriver ett skäl ur texten på sin minitavla och håller upp den. Två av 27 skriver bara vad som händer. Nästan alla kan, och i nästa samarbete sätter du dig först med de två."
    notera: Notera vad som hände. Stödorden på lappen gjorde att de du frågade kunde svara. Hade hälften skrivit en händelse utan skäl, hade du visat skillnaden med ett eget exempel och låtit grupperna försöka igen.
  - amne: skrivning
    arskurs: åk 2
    innehall: Att skriva en kort text om ett tema, med ord man har samlat
    overst:
      egen: "Ord om hur något ser ut, låter och känns. Felet: att bara säga ord för saker, som löv och svamp."
      visar: Paren säger ord i tur och ordning, och alla skriver en mening med ett ord ur samtalet.
    scen:
      - Tänk dig en lektion i svenska i åk 2. Klassen ska skriva om höstskogen, och veckans färdighet är att lyssna aktivt och vänta på sin tur.
      - "Du visar en bild av skogen och säger: ”Vi letar ord för hur det ser ut, låter och känns. Ni är klara när båda har ett sådant ord.” Alla tänker en stund, och sedan gör paren en high five och börjar: ”Löv.” ”Prassel.” ”Svamp.” ”Blött.” Den som inte kommer på något säger pass, och kompisen fortsätter. Efter två minuter bryter du."
      - "Du drar en symbol, och två elever med den säger ett ord paret tyckte om. Sedan skriver alla var sin mening med ett ord ur samtalet för hur det låter eller känns, och kompisen läser den. Du går längs borden och läser: 10 av 26 har bara ord för saker. De flesta kan. Du visar hur ”löv” kan bli ”löven prasslar”, och var och en skriver om sin mening med kompisens hjälp."
    notera: Notera vad som hände. Ping-pong-prat gav alla ord att skriva med. Hade hälften eller fler bara haft ord för saker, hade du stannat och samlat ord för ljud och känsla på tavlan med klassen.
  - amne: matematik
    arskurs: åk 3
    innehall: Multiplikation som lika stora grupper och som upprepad addition
    huvud: true
    arbetsomradet:
      - "Lektion 1–⁠2: lika stora grupper med material, och upprepad addition"
      - "Lektion 3–⁠4: multiplikationstecknet, 3 · 4 som tre grupper med fyra"
      - "Lektion 5–⁠6: tvåans, femmans och tians tabell, med bild och tal"
      - "Lektion 7–⁠8: textuppgifter där eleverna väljer räknesätt"
    overst:
      egen: "Tre grupper med fyra är 3 · 4 och 4 + 4 + 4. Felet: att addera talen, så att 3 · 4 blir 7."
      visar: Paret förklarar med ”Jag tänker … därför att …”, och alla visar den egna uppgiften med en bild och ett tal.
    plan:
      klass: 3B
      datum: ons 18/11
      lektion: 3 av 8
      mal: förklara multiplikation som lika stora grupper och som upprepad addition
      belagg: 2 · 5 med bild och tal på minitavlan
      blad: ett uppgiftsblad per par, minitavlor och facit
      forberett: material att bygga med, och en trygg kamrat till den som behöver det
      fore: { fardigheten: "Ställa frågor i stället för att säga svaret", ogat: "pekar på materialet och väntar", orat: "Hur tänkte du? Prova att lägga upp det.", strukturen: "Turas om", malet: "båda kan förklara 3 · 4 på två sätt", visar: "en symbol och den egna uppgiften", felet: "adderar talen, så att 3 · 4 blir 7" }
      delar:
        - { fas: Start, text: "Visa färdigheten med en elev: peka, vänta och fråga" }
        - { fas: Genomgång, text: "2 · 4 som två grupper med fyra, med material, och som 4 + 4" }
        - { fas: Samarbetet, text: "3 · 4, 2 · 3, 3 · 3 och 2 · 6, varannan var. Stopp efter två uppgifter, i alla par" }
        - { fas: Var och en visar, text: "En symbol, två svarar. 2 · 5 med bild och tal" }
        - { fas: Avslut, text: "Vad hjälpte er att lära er? Vad gör ni bättre nästa gång?" }
      beslut: { elever: 27, nastanAlla: "dem som skrev 7", deFlesta: ["att addera talen", "2 + 5 med 5 + 5"], halften: "tre grupper med fyra, med materialet" }
      efter: { kontrollen: "8 med fel", hogar: "Kan 19 · Nästan 5 · Inte än 3", sag: "”Hur tänkte du?” vid sex bord", kryss: [1, 2, 3, 4, 5], nasta: "3 · 5 och 4 · 2", forst: "bord 2 och 6" }
      lagg: ["Lägg märke till: målet kräver två sätt, så att paret inte kan klara uppgiften med ett svar."]
    remsa:
      - Färdigheten att ställa frågor visades med kropp och röst, och T-kortet hängde uppe.
      - Målet var att båda kunde förklara 3 · 4 på två sätt, med ett blad mellan dem.
      - Du drog en symbol, och två svarade. Alla gjorde 2 · 5 själva på minitavlan.
      - "Paren turades om: en löste och tänkte högt, en stöttade, och sedan bytte de."
      - Du sa vad du hörde, och paren sa vad som hjälpte dem att lära sig.
    scen:
      - Tänk dig lektion 3 av 8 i matematik i åk 3. Det är vecka 3, och i dag kommer multiplikationstecknet. Veckans färdighet är att ställa frågor.
      - "Du visar 2 · 4 som två grupper med fyra och som 4 + 4. Du visar rollerna med en elev: hen bygger, och du pekar, väntar och frågar: ”Hur tänkte du?” På tavlan står målet: ”Ni är klara när båda kan förklara 3 · 4 på två sätt.” Paren turas om. Vid ett bord säger en elev: ”Jag lägger tre grupper med fyra. Då blir det 4 + 4 + 4, tolv.”"
      - "I ett par säger en elev 7. Kamraten säger inte svaret: ”Prova att lägga upp det.” Du stoppar halvvägs och låter paren viska om färdigheten."
      - "Paren gör alla redo. Du drar triangeln, och två trianglar förklarar. Sedan gör alla 2 · 5 och håller upp minitavlan: 8 av 27 har fel, och flera har skrivit 7. De flesta kan. Paren jämför 2 + 5 med 5 + 5 och visar varandra sina bilder, och du lyfter felet för klassen."
    notera: Notera vad som hände. Felet syntes i den egna uppgiften. De som skrev 7 hade adderat talen, och det hade flera par inte märkt. Hade högst fem haft fel, hade du börjat nästa samarbete hos dem. Hade hälften haft fel, hade du och klassen lagt tre grupper med fyra med materialet igen.
  - amne: so-no
    amnesnamn: Biologi
    arskurs: åk 8
    innehall: "Fotosyntesen: vad växten tar in och vad den bildar"
    overst:
      egen: "I fotosyntesen bildar växten socker och syre av koldioxid och vatten. Felet: att den tar in syre, som i cellandningen."
      visar: Två med symbolen förklarar gruppens svar, och alla ritar vad en växt i en sluten burk tar in och bildar i fotosyntesen.
    scen:
      - Tänk dig en lektion i biologi i åk 8. Klassen har sett en film om fotosyntesen, och veckans färdighet är att kolla att alla kan. Bordsöarna har sina symboler.
      - "Du frågar: ”Vad tar växten in i fotosyntesen, och vad bildar den?” Efter tanketiden säger du: ”Huvuden ihop!” Vid ett bord hör du: ”Den tar in syre och släpper ut koldioxid.” ”Nej, det är andningen. I fotosyntesen är det tvärtom.” Du antecknar felet."
      - "Du drar kvadraten, och alla kvadrater ställer sig upp. Den första du frågar förklarar rätt, och den andra säger att fotosyntesen tar in syre. Alla ritar med pilar på minitavlan vad en växt i en sluten burk tar in och bildar i fotosyntesen, och håller upp den. Du går längs borden och räknar: 15 av 28 har pilarna fel. Hälften eller färre kan, och du stannar och visar igen."
    notera: Notera vad som hände. Felet spreds till flera bord, eftersom det lät rätt. Därför visade du igen, med fotosyntesen och cellandningen bredvid varandra. Hade de flesta kunnat, hade paren jämfört sina bilder.
  - amne: praktisk-estetiska
    amnesnamn: Textilslöjd
    arskurs: åk 5
    innehall: Att trä symaskinen och sy en rak söm
    overst:
      egen: "Trädningen i ordning: trådrullen, trådspänningen, trådtilldragaren och nålen. Felet: att hoppa över trådspänningen."
      visar: Var och en trär maskinen själv och syr fem centimeter rakt, medan du går runt.
    scen:
      - Tänk dig en lektion i textilslöjd i åk 5. Paren ska lära sig trä symaskinen, och veckans färdighet är att uppmuntra med ord som säger vad kamraten gjorde.
      - "Den ena trär och förklarar: ”Tråden går runt här, annars blir den lös.” Den andra följer stegen på bladet och uppmuntrar: ”Bra, du kollade spänningen.” Sedan byter de. Du stannar vid paren och säger vad du hör: ”Jag hör att du säger precis vad hon gjorde.”"
      - Efter samarbetet turas paret om vid maskinen. Var och en trär den själv och syr fem centimeter, och du går runt och räknar. Tre av 24 hoppar över trådspänningen. Nästan alla kan, och i nästa samarbete sätter du dig först med de tre.
    notera: Notera vad som hände. När paren uppmuntrade med ord om vad kamraten gjorde, mindes de också stegen. Hade fler hoppat över spänningen, hade paren visat varandra just det steget en gång till.
stod:
  rubrik: Elever som behöver mer stöd
  rader:
    - { nar: Den som är ny i svenska, metoden: "Paret ger ett litet sammanhang att tala i, och temat kan vara en bild. Hen kan visa, rita eller peka i samma uppgift som de andra, också när hens symbol dras.", du: "Lägg fraserna att låna och ämnets ord med en bild på bordet, och rita instruktionen på tavlan. Har paret ett starkare språk gemensamt, får det första samtalet vara på det." }
    - { nar: När många behöver hjälp samtidigt, metoden: "Paren frågar varandra och ett annat par först, och när båda kan går paret vidare till en uppgift till.", du: "Gå först till dem du skrev upp, och ha en svårare uppgift på bladet för par som är klara." }
    - { nar: Den som de andra sällan lyssnar på, metoden: "Strukturen ger hen en tur, och slumpen kan låta hen svara för gruppen.", du: "Säg högt vad hen bidrog med och vad det ledde till för gruppen, och ge hen en roll som kräver ett bidrag." }
    - { nar: Den som inte vill delta, metoden: "Hen kan delta genom att visa, peka eller rita, och paret är det minsta sammanhanget.", du: "Ge hen en roll i parets uppgift, och låt hen börja med den kamrat det redan fungerar med." }
    - { nar: Den som behöver förutsägbarhet, metoden: "Strukturens steg står likadant på tavlan varje gång, så att eleven vet vad som ska hända.", du: "Låt hen ha cirkelns plats, så att hen varje gång hämtar och lämnar lådan med materialet. Ge korta uppgifter som går att lyckas med." }
    - { nar: När metoden inte räcker, metoden: "En del elever lär sig inte färdigheten i klassen, och det är väntat.", du: "Träna färdigheten med eleven i korta stunder vid sidan av, och ta det med specialläraren. Räcker inte det, ta det med elevhälsan." }

