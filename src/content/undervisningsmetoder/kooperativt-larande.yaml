    titel: "Turas om i paret"
    sekunder: 28.2
    beskrivning: "Läraren visar de två rollerna. Läraren säger: ”Den ena löser och tänker högt.” Läraren säger: ”Den andra hjälper utan att säga svaret.” Cirkeln säger: ”Tre och fyra. Sju.” Stjärnan säger: ”Prova att lägga upp det.” Cirkeln säger: ”Tre grupper med fyra. Tolv!” Stjärnan säger: ”Min tur. Två grupper med tre.” Cirkeln frågar: ”Kan du visa ett sätt till?” Stjärnan säger: ”Tre och tre. Sex.” Paret kollar att båda kan förklara. Cirkeln frågar: ”Kan du förklara 3 · 4 på två sätt?” Stjärnan säger: ”Tre grupper med fyra. Och 4 + 4 + 4.”"
    rubrik: "Turas om i paret"
    ingress: "I en lektion i matematik i åk 3 löser den ena och tänker högt, och kompisen hjälper utan att säga svaret. Sedan byter de, och paret kollar att båda kan förklara."
    efter: "steg 3"
    stillbilder:
      - text: "Läraren ger uppgiften och visar de två rollerna."
      - text: "Cirkeln säger 7. Stjärnan hjälper utan svaret."
      - text: "Paret byter roller vid nästa uppgift."
      - text: "Paret kollar att båda kan förklara."
  - nr: 3
    titel: "Var och en visar"
    sekunder: 27.39
    beskrivning: "Paren gör alla redo på en minut. Läraren säger: ”Ni har en minut att göra alla redo.” Stjärnan frågar: ”Hur tänkte du?” Läraren drar en symbol ur skålen. Läraren säger: ”Alla trianglar, ställ er upp. Vad kom ni fram till?” En triangel säger: ”Vi tänker tre grupper med fyra. Tolv.” Läraren säger: ”Nu gör alla 2 · 5 själva. Håll upp!” Alla håller upp sin egen uppgift. Läraren räknar: 8 av 27 har fel. Läraren säger: ”Jämför 2 + 5 och 5 + 5 med din kompis.”"
    rubrik: "Var och en visar: läraren ser om klassen är redo"
    ingress: "I samma lektion i matematik i åk 3 gör paren alla redo, och läraren drar en symbol ur skålen. Sedan gör alla en egen uppgift och håller upp den, och läraren räknar eleverna med fel och väljer vad klassen gör."
    efter: "steg 4"
    stillbilder:
      - text: "Paren gör alla redo på en minut."
      - text: "Läraren drar triangeln, och en triangel förklarar."
      - text: "Alla håller upp, och läraren räknar eleverna med fel."
      - text: "De flesta kan. Paren jämför 2 + 5 och 5 + 5."

