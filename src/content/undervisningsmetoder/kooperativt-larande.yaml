observation:
  fraga: Behöver eleverna varandra, och syns vad var och en kan?
  text: "Skriv ut dubbelsidigt, och välj med läraren två elever att följa, A och B, gärna en som brukar vara tyst. Stå hela lektionen där du hör två bordsöar, och räkna hur många elever som sitter vid dem. När alla håller upp minitavlan, räknar du hur många i hela klassen som har fel. Symbolen visar elevens plats vid bordsön. Går läraren till ett bord du inte hör, skriv bordets nummer och det du ser."
  fokus: Säger båda i varje par något eget, och vad säger jag när jag går förbi?
  huvud: ["Färdigheten och målet"]
  kolumner:
    - { namn: Vid tavlan, text: det läraren visar och säger, bredd: 25 }
    - { namn: Paren, text: "+ eget · t tar upp kamratens · 0 tyst · g gör allt", bredd: 17, elever: true }
    - { namn: Vid paren, text: "det läraren hör, säger och gör, och det paren säger", bredd: 39 }
  tecken: "+ eget bidrag i ord, bild eller pekning, t tar upp kamratens, 0 tyst, g gör allt. Ring in tecknet när läraren talar med paret."
  delar:
    - { fas: Start, rader: 1, rakna: "Färdigheten visad: ja · nej   Övad i paren: ja · nej" }
    - { fas: Genomgång, rader: 1, rakna: "Målet sagt: ja · nej   Hur var och en visar sagt: ja · nej" }
    - { fas: Samarbetet, rader: 3, rakna: "Elever med ett eget bidrag: ___ av ___   Med färdigheten: ___ av ___" }
    - { fas: Var och en visar, rader: 2, rakna: "Med fel: ___ av ___   Utfallet: Nästan alla · De flesta · Hälften eller färre" }
    - { fas: Avslut, rader: 1, rakna: "Paren sa vad som hjälpte, i stoppet eller sist: ja · nej" }
  streck:
    - { etikett: Återkoppling, drag: ["Säger vad hen ser och hör", "Berömmer allmänt, som bra", "Frågar paret först", "Ger svaret"] }
    - { etikett: Var och en, drag: ["Slumpar inför klassen", "Frågar den som räcker upp handen"] }
  rader:
    - "Färdigheten visad och övad: ja · nej. Elever med färdigheten: __ av __"
    - "Målet krävde alla: ja · nej. Par som kollade att båda kunde innan de var klara: __ av __"
    - "De läraren frågade förklarade som målet säger: __ av __. Utan fel i den egna uppgiften: __ av __"
    - "Elever med ett eget bidrag: __ av __. A och B tysta hela samarbetet: __ av 2"
    - "Elever som sa eller skrev vad som hjälpte: __ av __. Läraren sa konkret vad hen såg: ja · nej"

