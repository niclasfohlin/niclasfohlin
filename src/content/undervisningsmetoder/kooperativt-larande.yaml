    amnen:      { tillforlitlighet: mattlig, effekt: mattlig, motivering: "Måttlig tillförlitlighet, måttlig effekt. Träning i grupparbete gav 0,21 i NO för 8–10-åringar i England (Baines m.fl., 2007; Slavin m.fl., 2014).", kallor: [slavin-m-fl-2014, baines-m-fl-2007] }
    socialt:    { tillforlitlighet: mattlig, effekt: mattlig, motivering: "Måttlig tillförlitlighet, måttlig effekt. I åk 6–⁠9 blev kamratrelationerna bättre med gruppmål, 0,48 mot tävling och 0,42 mot eget arbete (Roseth m.fl., 2008). Stora försök gav en liten skillnad (Van Ryzin och Roseth, 2018; Klang m.fl., 2020).", kallor: [roseth-m-fl-2008, van-ryzin-och-roseth-2018, klang-m-fl-2020] }
  svarighet: { lara: 4, karnan: 3, stod: 4, tid: 4, motivering: "Du ändrar hur du leder samarbetet, och klassen lär sig ett nytt sätt att arbeta. Det tar en termin eller mer med kollegor, och en kollega ser när eget ansvar eller reflektionen saknas." }
  kostnad:   { kop: 2, timmar: 14, motivering: "Skolan har kort och kopior. Omkring 14 timmar första läsåret går till läsningen, två möten, sex samtal efter besök och en timmes extra planering i veckan de fem första veckorna. Besökarens tid räknas inte." }
  urval:
    datum: 2026-10-30
    regel: "Insatser räknas när eleverna i vanliga klasser arbetar i par eller små grupper mot ett gemensamt mål där alla behövs, med eget ansvar, i ett upplägg som läraren leder: Learning Together, STAD och CIRC, Kagans strukturer, Pussel med gruppmål, Complex Instruction och SPRinG. Räknas inte: grupparbete utan gruppmål eller eget ansvar, som CSR och Pussel utan gruppmål, kamratlärande med fasta roller, samarbete på nätet och i högskolan och översikter av metaanalyser."
    text: "Sökningen började i Niclas bok Grundbok i kooperativt lärande och gick sedan till sammanställningar, stora försök och studier utan effekt. Bara insatser med gemensamt mål och eget ansvar räknas. Sexton källor valdes, och fyra valdes bort. Niclas Fohlin är medförfattare till en av de femton, Klang m.fl. (2020)."
    slutsatser:
      oversikt: "Elever lär sig mer med gemensamma mål, och kamratrelationerna blir bättre i samma undervisning (Roseth m.fl., 2008). Med oberoende prov blir talen mindre. De är störst i matematik (Slavin, Lake och Groff, 2009) och skrivning (Slavin m.fl., 2019), och mindre i NO (Slavin m.fl., 2014) och läsning (Slavin, Lake, Chambers m.fl., 2009)."
      experiment: "I de stora försöken syns både det sociala och lärandet. Elever med lågt engagemang sa att de mobbades mindre (Van Ryzin och Roseth, 2018), och den sociala acceptansen i åk 5 blev något bättre (Klang m.fl., 2020). I ett randomiserat försök i åk 6 läste eleverna bättre. De arbetade i lag med gemensamma mål, och läraren slumpade fram den som svarade för laget (Slavin, Chamberlain m.fl., 2009). Träning i grupparbete gav bättre resultat i NO (Baines m.fl., 2007), men i den svenska studien blev läsförståelsen inte säkert bättre (Klang m.fl., 2022)."
      annan: "Villkoren för att samarbetet ska ge resultat är gruppmål och eget ansvar (Slavin, 1991), och de fem grundelementen bygger på teorin om ömsesidigt beroende (Johnson och Johnson, 2009). Lärarens tal blir elevernas modell (Webb, 2009), och lärarna som genomförde arbetssättet bäst lärde ut färdigheterna (Veldman m.fl., 2020). Av trettio lektioner som lärare kallade kooperativa hade bara två alla de fyra kännetecken som forskarna mätte (Adl-Amini m.fl., 2024)."
    uteslutna:
      - { namn: "Güngör m.fl. (2026)", skal: "Översikt av metaanalyser, som standarden inte räknar" }
      - { namn: "Cheung m.fl. (2021)", skal: "Ett program, Success for All, där gruppmål och eget ansvar inte beskrivs" }
      - { namn: "Tenenbaum m.fl. (2020)", skal: "Kamratinteraktion i vid mening, mest uppgifter i labb" }
      - { namn: "Hattie (2009)", skal: "Översikt av metaanalyser, bara pekare" }

# ---------------------------------------------------------------------------------------------------------------------
# 1 Metoden
# ---------------------------------------------------------------------------------------------------------------------
inledning:
  - "I kooperativt lärande lär sig eleverna ämnet i par och små grupper. Alla behövs för ett gemensamt mål, och var och en ska kunna visa vad hen har lärt sig. Du lär ut hur man samarbetar, lika medvetet som du lär ut ämnet, eftersom grupper och färdiga strukturer inte räcker på egen hand."
  - I klassrummet sitter eleverna vid bordsöar om fyra, med var sin symbol, och paren är axelkompisar bredvid eller ögonkompisar mitt emot. På väggen hänger veckans T-kort, som visar hur färdigheten ser ut och låter. Du går igenom innehållet, och sedan arbetar paren i en struktur, ett fast mönster där alla får en tur, medan du går mellan dem och lyssnar. Efter samarbetet gör paret eller bordsön alla redo att svara. Du drar en symbol ur en skål, alla med den symbolen ställer sig upp, och en eller två förklarar gruppens svar. Sedan gör alla en egen uppgift.
  - Lärandet går till så här. När eleverna förklarar för varandra hör både de själva och du hur de tänker. När målet kräver båda och vem som helst kan få visa, lönar det sig för paret att förklara tills båda kan. Då kommer också de som annars är tysta till tals. Eleverna lär sig att deras tankar kan hjälpa en kamrat framåt, och klassen går från ett jag till ett vi.
  - "De första veckorna lär sig klassen en färdighet och en struktur i taget, och du övar ett drag i veckan, som att ge tanketid eller att slumpa på riktigt. Strukturerna är en enkel väg in: eleverna får mer tid att tänka och prata, och du lär dig att ordna hur de arbetar tillsammans. Den första veckan gör ni två eller tre korta samarbeten med kamraten och T-kortet, och den första hela lektionen kommer i vecka 2 eller 3. Sedan kommer samtalet, paret och bordsön, och sist gruppens namn och kontrakt. Efter de första veckorna samarbetar klassen oftast i korta moment i ämnets lektioner, och du väljer strukturen efter uppgiften. Läs del 1 till 3 och Det svåraste i del 4 innan du börjar."
karna:
  rubrik: "Kärnan: fast och fritt"
  text: "Kärnan är de fem grundprinciperna i Grundbok i kooperativt lärande: samarbetsfärdigheter, positivt ömsesidigt beroende, eget ansvar, delaktighet och stödjande interaktion, och sist återkoppling och reflektion. Principerna bygger på grundelementen hos Johnson och Johnson (2009). Två av dem, ett mål som kräver alla och eget ansvar, finns i varje beskrivning av kooperativt lärande och är prövade för sig (Slavin, 1991). Färdigheterna och reflektionen är också prövade för sig (Baines m.fl., 2007; Johnson och Johnson, 2009), och dem lär du ut och leder. Strukturen är formen som ger alla en tur, och den väljer du fritt."
  grundregel: De fem principerna är kärnan, och dem håller du fast vid i varje samarbete. Strukturen, ämnet, paren, grupperna och materialet väljer du själv.
  varv: Du visar färdigheten, ger paret ett mål som kräver båda, lyssnar, låter var och en visa och säger vad du såg.
  komponenter:
    - namn: Samarbetsfärdigheter
      moment: [Start, Samarbetet, Avslut]
      vad: "Du lär ut en färdighet i taget: du visar hur den ser ut och låter, och klassen övar den."
      syns: Eleverna använder veckans färdighet i ord och handling, som att vända sig mot kamraten och fråga hur hen tänkte.
      varfor: "Utan färdigheten talar eleverna i munnen på varandra eller inte alls. Studier visar att grupper som hade tränat samarbete fick bättre resultat i NO (Baines m.fl., 2007), och lärarna som genomförde arbetssättet bäst lärde ut färdigheterna (Veldman m.fl., 2020)."
      belagg: provad
      kallor: [baines-m-fl-2007, veldman-m-fl-2020]
      kvar: Klassen lär sig en samarbetsfärdighet i taget, ser och hör hur den går till och övar den i ämnets uppgifter.
      fritt: "Vilken färdighet och hur länge, T-kort eller Y-kort med hjärtat, fraser eller ett foto av ett par, och om klassen väljer färdigheten."
      kryss: Jag visade färdigheten, och klassen övade den.
    - namn: Positivt ömsesidigt beroende
      moment: [Genomgång, Samarbetet]
      vad: Paret eller gruppen har ett mål som de når först när alla kan, och de behöver varandra för det.
      syns: "Paret arbetar mot målet läraren har sagt, som ”Ni är klara när båda kan förklara …”, och kollar att båda kan innan de säger att de är klara."
      varfor: "Med egna mål arbetar eleverna bredvid varandra, eller så gör den snabbaste uppgiften. Studier visar att elever med gemensamma mål lärde sig mer än med tävling eller eget arbete (Roseth m.fl., 2008), och mest när målet är att var och en lär sig (Slavin, 1991)."
      belagg: provad
      kallor: [roseth-m-fl-2008, slavin-1991]
      kvar: Alla i paret eller gruppen behöver varandra för att nå målet.
      fritt: "Målets ord, roller, ett delat material eller delad information, gruppens namn, och om målet gäller paret, bordsön eller klassen."
      kryss: Jag gav ett gemensamt mål som krävde alla.
    - namn: Eget ansvar
      moment: [Genomgång, Var och en visar]
      vad: "Vem som helst kan få förklara gruppens svar, och sedan gör varje elev en egen uppgift."
      syns: De elever läraren slumpar fram förklarar gruppens svar med egna ord, och varje elev gör en egen uppgift där det syns hur hen tänkte.
      varfor: "Utan eget ansvar är det den som redan kan som gör arbetet, och de andra vilar. Studier visar att 37 av 44 jämförelser med gruppmål och eget ansvar var positiva, mot 4 av 23 utan dem (Slavin, 1991)."
      belagg: provad
      kallor: [slavin-1991, adl-amini-m-fl-2024]
      kvar: Eleverna vet i förväg att var och en kan få visa, och du låter någon visa i varje lektion.
      fritt: "Hur du väljer den som förklarar gruppens svar, som symbolen eller ett nummer, och hur var och en visar själv: en egen uppgift, redovisning för en ny kamrat eller en egen förklaring i ord eller bild."
      kryss: Jag sa hur var och en visar, och alla visade.
    - namn: Delaktighet och stödjande interaktion
      moment: [Samarbetet]
      vad: Alla tänker först själva och deltar sedan samtidigt och på lika villkor. Strukturen ger alla en tur.
      syns: Var och en i paret bidrar med något eget, i ord, med en bild eller genom att peka, och bygger vidare på kamratens bidrag. Alla par arbetar samtidigt.
      varfor: "När en elev i taget svarar i helklass kan de andra sluta lyssna, och du ser inte vad alla tänker. Principen vilar på att eleverna lär sig mer när de förklarar och bygger vidare på varandras tankar än när de bara får ett svar (Webb, 2009)."
      belagg: teori
      kallor: [webb-2009]
      kvar: Alla elever tänker själva först, och ingen hoppas över i paret eller gruppen.
      fritt: "Strukturen, par eller bordsö, tanketidens längd, vem som börjar, att visa, rita eller peka i stället för att tala, och att låna kamratens tanke när man inte har någon egen."
      kryss: Jag gav alla tanketid och en tur.
    - namn: Återkoppling och reflektion
      moment: [Samarbetet, Avslut]
      vad: "Paret eller gruppen reflekterar, och du ger återkoppling: du säger konkret vad du såg och hörde."
      syns: "Paret säger med T-kortets ord vad som hjälpte dem att lära sig och en sak de ska göra bättre, och läraren säger vad hen såg hos klassen, gruppen eller en elev."
      varfor: "Eleverna ser sällan vad de själva gör i gruppen, och det de inte ser kan de inte ändra. I ett litet försök fick några grupper tala om hur de hade arbetat, och de lärde sig mer än de andra (Johnson och Johnson, 2009). Allmänna frågor som ”Går det bra?” ändrade inget (Webb, 2009)."
      belagg: provad
      kallor: [johnson-och-johnson-2009, webb-2009]
      kvar: Paret eller gruppen säger varje lektion vad som hjälpte och vad de gör bättre, och du säger vad du ser när de arbetar.
      fritt: "När reflektionen kommer, mitt i eller sist, formen, som tummen med ett skäl, två stjärnor och en önskan eller loggboken, och om en elev observerar."
      kryss: Paren reflekterade, och jag sa konkret vad jag såg.
roll:
  rubrik: "Lärarens roll: modellen för samarbetet"
  text: Du visar färdigheten med kropp och röst, följer hur eleverna använder den och säger till klassen, gruppen och den enskilda eleven vad du såg.
  fragor:
    - Vad ser och hör jag när de använder färdigheten?
    - Behöver de varandra, och kan var och en förklara?
    - "Vem säger jag det till nu: klassen, gruppen eller en elev?"
  fragornaText: "Till en elev kan du säga: ”Jag ser att du väntade och tittade på din kompis när hen pratade”, och till klassen: ”Jag hör att ni tackar efter samtalet.”"

