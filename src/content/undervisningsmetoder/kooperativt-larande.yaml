lararensFragor:
  rubrik: Lärarens frågor
  fragor:
    - { fraga: "Får jag använda strukturerna utan att lära ut en färdighet?", svar: "Nej. Strukturen är bara formen och räcker inte ensam. Ge varje struktur en färdighet på T-kortet.", komponent: Samarbetsfärdigheter }
    - { fraga: "Får jag hoppa över reflektionen när tiden är knapp?", svar: "Nej. Gör den kort i stoppet halvvägs i Samarbetet. I den svenska studien var reflektionen en av de delar lärarna oftast inte gjorde fullt ut (Klang m.fl., 2020).", komponent: Återkoppling och reflektion }
    - { fraga: "Får jag ge båda i paret varsitt papper?", svar: "Ja, med stopp där de jämför och förklarar hur de tänkt. Ett gemensamt papper och roller ger mer samarbete, och varsitt papper utan stopp blir ofta arbete bredvid varandra.", komponent: Positivt ömsesidigt beroende }
    - { fraga: "Får jag ta en annan struktur än de sex?", svar: "Ja, om den ger var och en sin tur. Fler strukturer finns på sidan Strukturer. Fatta samma fyra beslut som i Före lektionen. Pröva en ny struktur i taget, först på känt innehåll.", komponent: Delaktighet och stödjande interaktion }
    - { fraga: "Hur hinner jag kursen när samarbetet tar tid?", svar: "Lägg korta samarbeten i ämnets lektion, som varianten på tio minuter, och låt paren förklara uppgiften för varandra innan de börjar. Då räcker färre upp handen, och du hinner till dem som behöver dig." }
    - { fraga: "Hur bedömer jag varje elev när eleverna arbetar ihop?", svar: "Bedöm den egna uppgiften efter samarbetet och gruppens arbete var för sig. Bedöm båda mot det eleverna ska kunna, och jämför inte eleverna med varandra." }
hinder:
  rubrik: Det svåraste med metoden
  text: "Det som ofta faller bort är att du lär ut färdigheten: du ber om samarbete men visar aldrig hur det ser ut och låter. Lärarna som genomförde arbetssättet bäst lärde ut färdigheterna (Veldman m.fl., 2020). Av trettio lektioner som lärare kallade kooperativa hade bara två alla de fyra kännetecken som forskarna mätte (Adl-Amini m.fl., 2024). Visa färdigheten med T-kortet, låt klassen öva den, lyssna efter den i samarbetet och säg vad du hörde."
  kort: Det som ofta faller bort är att du lär ut färdigheten. Visa den med T-kortet, låt klassen öva, lyssna efter den och säg vad du hörde.
  komponent: Samarbetsfärdigheter
fallgropar:
  rubrik: Vanliga fallgropar
  rader:
    - { fallgrop: "Du ber om färdigheten men visar den inte", hander: "Du säger ”Samarbeta och hjälp varandra”, och eleverna talar i munnen på varandra eller inte alls.", prova: "Namnge en färdighet i taget och visa hur den låter. Fyll i T-kortet med klassen, och säg efteråt vad du såg.", komponent: Samarbetsfärdigheter }
    - { fallgrop: "Uppgiften går att lösa ensam", hander: "Eleverna delar upp arbetet och sätter ihop delarna på slutet, eller den snabbaste gör allt.", prova: "Skriv om frågan så att svaret kräver allas delar, eller dela materialet så att var och en bär en del.", komponent: Positivt ömsesidigt beroende }
    - { fallgrop: "Slumpen blir inte av", hander: "Du säger att du ska slumpa, men du vill inte att eleven står tom inför klassen, så du frågar den som räcker upp handen.", prova: "Tre stödord på lappen och en stund till efter dragningen gör att de som står kan svara. Dra symbolen inför klassen.", komponent: Eget ansvar }
    - { fallgrop: "Två av fyra pratar", hander: "Samma två talar vid bordet, och de andra sitter tysta.", prova: "Ge var och en ett talkort, som ett gem. Den som har talat lägger det i mitten, och ingen talar igen förrän alla har lagt sitt.", komponent: Delaktighet och stödjande interaktion }
    - { fallgrop: "Reflektionen hinns inte med", hander: "Lektionen tar slut, och paren går utan att ha talat om samarbetet.", prova: "Stoppa halvvägs, som i Samarbetet, och fråga om färdigheten: Kan vi se och höra att den används?", komponent: Återkoppling och reflektion }
    - fallgrop: När den du frågar inte kan svara
      moment: [Var och en visar]
      hander: Den du frågar tystnar inför klassen, och du vill fråga någon annan.
      steg: ["Vänta lugnt en stund.", "Låt gruppen påminna om vad de sa, utan att svara åt hen.", "Ge gruppen en minut till, och kom tillbaka till samma elev.", "Tacka eleven och gruppen för svaret."]
    - fallgrop: När en gör allt och kamraten tittar på
      moment: [Samarbetet]
      hander: En elev svarar och gör uppgifterna, och kamraten sitter bredvid och tittar.
      steg: ["Gå dit och lyssna en stund.", "Säg vad du hör, utan kritik: ”Jag har hört dig svara på alla uppgifter.”", "Ge paret ansvaret: ”Hur ser ni till att båda får vara med?”", "Låt dem byta roll, eller ge kamraten en roll.", "Kom tillbaka och säg vad du ser nu."]
hallFast:
  rubrik: Fem saker att hålla fast vid
  rader:
    - { sak: "Efter ett lov: öva en känd struktur med T-kortet", text: "Rutinerna och färdigheterna glider under ett lov. Med T-kortet uppe och en struktur som klassen kan hittar klassen tillbaka." }
    - { sak: "När det går bra: slumpa ändå", text: "När paren arbetar bra är det lätt att låta bli att slumpa, och då ser du inte längre den som vilar." }
    - { sak: "När tiden är knapp: skydda den egna uppgiften", text: "Det som ligger sist faller bort först. Reflektera i stoppet halvvägs, och bryt samarbetet i tid så att alla gör den egna uppgiften." }
    - { sak: "Nytt arbetsområde: välj färdigheten ur uppgiften", text: "Efter de första veckorna kräver nytt innehåll egna färdigheter, som att fråga varför, säga emot vänligt och ändå enas om ett svar. Välj färdigheten ur det paren ska göra." }
    - { sak: "Inför prov: behåll paren före och efter eget arbete", text: "Inför ett prov glider arbetssättet lätt över i eget arbete. Behåll paren före och efter det egna arbetet, och slumpa som vanligt." }

