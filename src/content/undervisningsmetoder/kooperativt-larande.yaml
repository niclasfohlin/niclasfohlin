strukturkort:
  text: "Här är de sex strukturerna att komma igång med, som kort på ett halvt A4: framsidan med bilden visar du för klassen, och baksidan har stegen. De fem första är strukturerna i De första veckorna, en i veckan, och Rondellen tar ni när bordsöarna har lärt sig Huvuden ihop och Mötas på mitten. Skriv ut korten och ha dem till hands, gärna också fler från sidan Strukturer. En struktur är ett hjälpmedel, och lektionens syfte är det viktiga: ta en struktur när den hjälper eleverna att lära sig det lektionen handlar om. Strukturen gör samarbetet snabbare att komma igång med och låter eleverna lägga kraften på lärandet, särskilt när de känner igen den från förut."
  strukturer: [ping-pong-prat, epa, turas-om, huvuden-ihop, motas-pa-mitten, rondellen]
ramar:
  rubrik: Materialet för klassen
  text: ["Utöver lektionskortet och strukturkorten finns stödmaterialet för klassen: samarbetsfärdigheterna, T-kortet, symbolerna, fraserna att låna, gruppkontraktet och bladet till Mötas på mitten. Varje blad står på en egen sida."]
  ramar:
    - rubrik: Samarbetsfärdigheterna
      text: ["Skriv ut bladet till dig själv när du planerar veckan, och sätt gärna upp det förstorat till A3 som affisch. Klassen lär sig de tre första, en i veckan. De andra väljer du när du ser att klassen behöver dem."]
    - rubrik: T-kortet
      text: ["Skriv ut kortet som affisch, gärna förstorat till A3. Skriv veckans färdighet överst, och fyll i med klassen under ögat vad ni vill se och under örat vad ni vill höra. Kortet hänger uppe under veckan och får sedan hänga kvar. Vill ni också säga hur färdigheten känns, rita ett Y-kort på tavlan med ett hjärta i det tredje fältet."]
    - rubrik: Symbolerna
      text: ["Skriv ut ett blad per bordsö och ett blad till, och klipp isär de fyra korten på varje blad. Lägg korten på platserna, så att varje elev har sin symbol, och lägg korten från det extra bladet i skålen som du drar ur."]
    - rubrik: Fraserna att låna
      text: ["Lägg ett blad mitt på varje bordsö. Säg fraserna i kör med klassen innan paren börjar, och peka på den du vill höra."]
    - rubrik: Gruppkontraktet
      text: ["Varje bordsö fyller i ett blad i den första lektionen i vecka 5. Gruppen väljer ett namn, en färdighet de ska öva på och tre sätt att göra den, och var och en skriver sitt namn vid sin symbol. I varje Avslut efter det tar gruppen fram kontraktet: Hur kan vi stötta varandra på bästa sätt nästa gång vi samarbetar?"]
    - rubrik: Bladet till Mötas på mitten
      text: ["Skriv ut ett blad per bordsö, gärna förstorat till A3. Var och en skriver eller ritar i rutan vid sin symbol, och bordsön fyller i mitten tillsammans. De yngsta gör det i par, med två rutor och en mitt på ett A4 som du delar in själv."]
# Samarbetsfärdigheterna efter De första veckorna (Niclas 2026-11-01: ”Först tre viktiga. Sedan andra lämpliga.”).
# De tre första följer veckorna 1–3, och de andra är Niclas lista i Text 3, ordnad efter det läraren ser i samarbetet.
tabeller:
  - rubrik: Samarbetsfärdigheterna
    plats: efter-progression
    text: "För effektiva samarbeten krävs att eleverna kan lyssna aktivt, tänka högt och ställa relevanta frågor till varandra, och det tar tid att lära sig. Klassen lär sig en av dem i veckan, i den här ordningen, och övar den i ämnets uppgifter. Visa färdigheten med kropp och röst, och skriv på T-kortet vad ni vill se och höra."
    kolumner: [Färdigheten, Så ser det ut, Så låter det]
    rader:
      - ["Vecka 1: Lyssna aktivt", "Du lutar dig mot kamraten och nickar.", "”Du sa att …” ”Hur menar du?”"]
      - ["Vecka 2: Tänka högt", "Du pekar och visar medan du förklarar.", "”Jag tänker … därför att …”"]
      - ["Vecka 3: Ställa frågor", "Du ser på kamraten och väntar på svaret.", "”Vad tänker du?” ”Varför tänker du det?”"]
  - rubrik: Fler samarbetsfärdigheter, när klassen behöver dem
    plats: efter-progression
    text: "Efter de tre första väljer du nästa färdighet utifrån det du ser i samarbetet. Äldre elever och klasser som har arbetat med kooperativt lärande en tid kan vara med och välja. En färdighet i taget, och på T-kortet står vad ni vill se och höra."
    kolumner: [När, Färdigheterna]
    rader:
      - ["Vecka 4 och 5", "Kolla att alla kan. Bygga vidare på kamratens idé."]
      - ["När någon inte kommer till tals", "Låta alla tala färdigt. Ta egen plats i gruppen. Be om hjälp. Våga säga vad man tycker."]
      - ["När tonen hårdnar", "Reagera vänligt på varandra. Uppmuntra varandra. Använda varandras namn. Prata lugnt."]
      - ["När arbetet spretar", "Planera arbetet tillsammans. Hålla fokus på målet. Stanna i sin grupp. Fortsätta med uppgiften tills den är klar."]
      - ["När tänkandet ska gå djupare", "Ge varandra tanketid. Ta in varandras idéer. Slå ihop flera idéer till en lösning."]
planeringsmall:
  text: "Det grå gör du i varje lektion. Börja med färdigheten och målet, och skriv felet du lyssnar efter. Pröva i förväg: kan en elev lösa uppgiften ensam? Bygg uppgiften så att varje elev behövs och gruppen är klar först när alla kan innehållet."
  fore:
    - { etikett: "Färdigheten på T-kortet", rader: ["Färdigheten:", "Ögat:", "Örat:"], falt: [fardigheten, ogat, orat] }
    - { etikett: "Målet och hur var och en visar", rader: ["Strukturen:", "Ni är klara när:", "Var och en visar:", "Felet jag lyssnar efter:"], falt: [strukturen, malet, visar, felet] }
  delar:
    - { fas: Start, skriv: "Färdigheten och det jag visar:", hojd: 0.6 }
    - { fas: Genomgång, skriv: "Innehållet och strukturens steg:", hojd: 0.9 }
    - { fas: Samarbetet, skriv: "Uppgiften, eller en fråga med många svar:", not: "Ge tanketid först. Lyssna efter färdigheten och felet, säg vad du hör och stoppa halvvägs.", hojd: 1.1 }
    - { fas: Var och en visar, skriv: "Den egna uppgiften, där felet syns:", not: "Dra en symbol och fråga en eller två. Räkna eleverna med fel.", hojd: 0.8 }
    - { fas: Avslut, skriv: "Frågorna till reflektionen:", not: "Vad hjälpte er att lära er? Vad gör ni bättre nästa gång?", hojd: 0.6 }
  beslut: { nastanAlla: "Jag sätter mig först med:", deFlesta: ["Missförståndet jag lyfter:", "Paren jämför:"], halften: "Det jag visar igen:" }
  efter:
    text: "Fyll i efter lektionen, ur dina anteckningar."
