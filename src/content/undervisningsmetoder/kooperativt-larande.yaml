titel: Kooperativt lärande
undertitel: Så lär du klassen att lära av varandra, F–⁠9
alternativaNamn: ["Samarbetslärande"]
ingress: "Eleverna lär sig ämnet i par och små grupper, där alla behövs och var och en kan visa vad hen har lärt sig. Du lär ut samarbetet lika medvetet som ämnet: du visar en färdighet, följer hur paren använder den och säger vad du såg."
arskurs: ["F-3", "4-6", "7-9"]
arskursText: F–9
taggar: ["kooperativt-larande", "socialt-samspel", "tillganglig-undervisning"]
slag: strukturer
syfte: [samarbeta, tanka]
tid: 45 minuter per lektion, minst tre lektioner i veckan
hurOftaSkal: "I den svenska studien samarbetade de flesta klasserna tre till fyra lektioner i veckan (Klang m.fl., 2020). Minst tre samarbeten i veckan, korta eller hela lektioner, ger rutinerna tid att sitta."
period: Fem veckor att komma igång
material:
  - samarbetsfärdigheterna
  - T-kortet
  - symbolerna till bordsöarna och en skål
  - fraserna att låna
  - minitavlor och pennor
  - lappar till stödorden
