  svarighet: { lara: 3, karnan: 3, stod: 3, tid: 3, motivering: "Klassen lär sig att skriva utan rättning, och du lär dig ställa frågan och använda texten. Kärnan glider lätt mot ifyllnad och en bok som ingen öppnar, men en kollega kan se det." }
  kostnad:   { kop: 2, timmar: 14, motivering: "Skolan har skrivböcker och pennor. Omkring 14 timmar första läsåret går till att läsa metoden, fyra möten, samtalen efter besöken och en timme i veckan för frågorna de fem första veckorna." }
  urval:
    datum: 2026-11-07
    regel: "Insatser räknas när eleverna skriver om ämnets innehåll eller en läst text för att lära sig innehållet, mot en grupp som inte skriver om det eller skriver mindre. Program där skrivandet är en del räknas också, som Science Writing Heuristic och MORE. I Skrivning räknas också program där eleverna skriver om lästa källor, som CRWP och Pathway. Utvecklarna är Hand, Nückles, Collins, Kim, Berge, Olson och National Writing Project. Räknas inte: undervisning i att skriva utan ämnesinnehåll, expressivt skrivande och skrivande om egna värderingar, högskolestudier och automatisk återkoppling."
    text: "Vi sökte 2026-11-07 i sammanställningar, följde referenserna i Graham m.fl. (2020), sökte i ERIC område för område och gjorde enkla sökningar på webben. Skrivandet fick en egen sökning, eftersom den första frågade om ämneskunskaper. Vi valde femton källor, de som varje område vilar på, och två granskare prövade urvalet."
    slutsatser:
      oversikt: "Elever 6–17 år som skriver om ett innehåll i NO, SO och matematik lär sig mer om det, och effekten är omkring 0,2–0,3 (Graham m.fl., 2020; Graham och Perin, 2007). Att skriva om lästa texter lyfter läsförståelsen (Graham och Hebert, 2010). Uppgifter med analys och reflektion ger ofta mer, men det är inte säkert. Program där eleverna skriver om lästa källor gav bättre skrivande på oberoende prov (Slavin m.fl., 2019). Ingen översikt mäter om texten delades eller användes."
      experiment: "Skrivande med undervisning i ämnet gav bättre skrivande i åk 1–⁠2 (Kim m.fl., 2021) och i åk 3 (Berge m.fl., 2019), men inte säkert i åk 6. Mer skrivande utan undervisning gav ingen säker skillnad (Skar m.fl., 2024), och ett program i NO gav ingen säker effekt på NO-proven (Hand m.fl., 2018). Med kamrater eller yngre som läsare förstod eleverna mer än med läraren (Gunel m.fl., 2009)."
      annan: "Frågor i lärjournaler hjälper lärandet, och det är mest visat på högskolan (Nückles m.fl., 2020). Eleverna skriver mest korta texter för läraren (Sturk, 2022). I tio klasser blev texterna i skrivböcker utan svar inte bättre under året (Ruiz-Primo m.fl., 2002). Lärare ser fler delta när klassen använder texterna (Lützen och Nielsen, 2025). Skolforskningsinstitutet (2022) ger forskningen på svenska."
    uteslutna:
      - { namn: "Yu m.fl. (2021)", skal: "Jämförelsegruppen skrev också, så studien prövar inte metoden" }
      - { namn: "Graham m.fl. (2023)", skal: "Metaanalys av skrivundervisning, annat innehåll" }
      - { namn: "Wu m.fl. (2021)", skal: "Skrivande om värderingar, annan insats" }
      - { namn: "Hattie (2009)", skal: "En översikt av metaanalyser, som inte räknas för nivån" }

# ---------------------------------------------------------------------------------------------------------------------
# 1 Metoden
# ---------------------------------------------------------------------------------------------------------------------
inledning:
  - "Skriva för att lära handlar om att skrivande är ett sätt att tänka. I din vanliga lektion skriver eleverna några minuter på de ställen där det hjälper dem: Skriv först i början för att tänka, Stanna och skriv mitt i för att reda ut det ni arbetar med, och loggen sist för att samla det viktigaste. Texten kan bli en lista, några tankar eller en skiss. Mitt i läser någon texten, och det eleverna skrev tar lektionen vidare. Metoden är ingen skrivkurs och ingen ny planering, bara ett lager över den du har. Vad eleverna ska lära sig kommer från dig och kursplanen, och skrivandet är ett sätt att ta sig dit. Det räcker inte att eleverna skriver, för en text som ingen läser och ingen använder blir lätt ren rutin."
  - "I vilket ämne som helst står din planering kvar: en genomgång, ett försök eller något eleverna skapar. Skrivandet tar några minuter av den på ett eller två ställen och ibland tre. I Skriv först skriver alla två minuter vad de tror om något som lektionen sedan svarar på, och varför. I Stanna och skriv mitt i fyller du i Rutan på tavlan: ”Skriv för att”, hur länge, vem som läser och vad som händer sedan. Frågan står redan på tavlan, och första minuten skriver du själv och tänker högt. Varje elev skriver med egna ord i sin skrivbok tills klockan ringer, och du läser över axeln. Sedan läser någon texten, ofta axelkompisen, och du säger vad du läste och vad ni gör nu. I loggen sist läser eleverna sin text och skriver i annan färg det viktigaste nu. Ofta räcker en fråga hela lektionen: först vad tror du, sedan vad såg vi och varför, sist vad tänker du nu."
  - "Eleven lär sig av det hen gör med innehållet. Den som måste förklara, jämföra eller ta ställning med egna ord märker vad hen förstår och vad som saknas, och svaret går inte att skriva av. Därför kommer frågan först, och du visar hur ett svar kan se ut. Ingen rättar, eftersom tanken får vara på väg. Någon läser, eftersom ord betyder mer när de används. I loggen samlar eleven det viktigaste och ser hur tanken har ändrats sedan början. När en elevs rad blir klassens nästa fråga märker eleverna att deras tankar färgar lektionen och att ord kan göra något. Skrivandet blir ett verktyg för tanken och ett sätt att delta."
  - "De första veckorna skriver klassen minst två lektioner i veckan och lägger till ett ställe eller en sak i taget. Vecka 1 stannar ni en gång mitt i lektionen, och alla läser en mening för axelkompisen. Vecka 2 visar du två egna texter bredvid varandra, så att eleverna ser vad en förklaring gör, och du byter frågan tills den kräver mer än att återge. Vecka 3 prövar ni loggen och vecka 4 Skriv först, och sedan väljer du när de hjälper eleverna. Vecka 5 byter eleverna böcker och svarar varandra skriftligt. Då är skrivandet något klassen gör för att tänka. En gång per arbetsområde skickar ni en text till någon utanför klassen som har lovat svara."
karna:
  rubrik: "Kärnan: fast och fritt"
  text: "Du lägger lagret över din egen planering, och kärnans fyra delar håller ihop det i hela lektionen. Grundidén är att eleven lär sig när hen själv bearbetar innehållet med egna ord, och att en text som någon läser och använder ger mer än en text i en låda. Den första halvan har studier bakom sig. Den andra bygger mest på praktiken och på en liten studie om läsaren. Mer skrivande räcker inte. Studierna pekar på frågan och att du visar hur. Praktiken pekar på att eleven får svar och skriver vidare i sin text."
  grundregel: De fyra är kärnan, och dem håller du fast vid. Rutan på tavlan håller dem framme. Ämnet, formen, ställena, tiden och hur texten används väljer du själv, men varje vecka läser en kamrat.
  varv: Du frågar, alla skriver, någon läser, och texten tar lektionen vidare.
  komponenter:
    - namn: En fråga som kräver tänkande
      moment: [Skriv först, Stanna och skriv, Loggen]
      vad: "Frågan får alla att förklara, jämföra, ta ställning, välja det viktigaste eller säga vad de inte förstår."
      syns: Eleverna skriver med egna ord om ett varför eller ett val, som en förklaring i NO, och svaret kräver mer än att återge.
      raknas: false
      varfor: "Uppgifter med analys gav 0,36 mot 0,18 för återgivning, och frågor om den egna förståelsen 0,40 mot 0,15 utan dem, men skillnaderna är inte säkra (Graham m.fl., 2020). Frågor som bad eleven ordna det viktigaste och ge exempel gav mer lärande i lärjournaler, mest på högskolan (Nückles m.fl., 2020)."
      belagg: provad
      kallor: [graham-m-fl-2020, n-ckles-m-fl-2020]
      kvar: Frågan kräver mer än att skriva av eller berätta vad ni gjorde, och eleverna har sett hur ett svar kan se ut.
      fritt: "Ämnet, formen (lista, tankar eller skiss) och stöd som en mening att börja med."
      kryss: Frågan krävde mer än att återge, och jag hade visat hur.
    - namn: Alla skriver för att tänka
      moment: [Skriv först, Stanna och skriv, Loggen]
      vad: Alla skriver samtidigt med egna ord, och ingen rättar.
      syns: "Efteråt har varje elev egna ord i sin text, som en mening, en lista eller en skiss med ord, och alla skriver tills tiden är slut."
      varfor: "I klassens samtal deltar få (Lützen och Nielsen, 2025). Komponenten finns i studierna med effekt, där eleverna själva skrev om innehållet (Graham m.fl., 2020), och bygger på att en text utan krav på form lämnar kraft åt tanken (Nückles m.fl., 2020)."
      belagg: i-alla
      kallor: [graham-m-fl-2020, l-tzen-och-nielsen-2025, n-ckles-m-fl-2020]
      kvar: Alla formulerar sig med egna ord, och ingen rättar texten.
      fritt: "Tiden, oftast två till fem minuter. Papper, skrivbok eller skärm. Språket, en skiss med ord, och att eleven säger och någon skriver."
      kryss: Alla skrev med egna ord, och jag rättade inget.
    - namn: Eleven vet vem som läser
      moment: [Skriv först, Stanna och skriv, Loggen]
      vad: "Före skrivandet säger du vem som läser: eleven själv, en kamrat, klassen eller någon utanför."
      syns: Eleverna kan säga vem som läser, och läsaren läser för att förstå, som en kamrat som svarar på tanken.
      varfor: "Den som bara skriver för läraren skriver för att visa vad hen kan (Sturk, 2022). I en studie förstod gymnasieelever begreppen bättre när de skrev för kamrater eller yngre elever än för läraren eller föräldrarna (Gunel m.fl., 2009)."
      belagg: provad
      kallor: [gunel-m-fl-2009, sturk-2022]
      kvar: Du säger i förväg vem som läser, varje vecka läser en kamrat, och ingen delar en text utan att eleven vet det.
      fritt: "Vem som läser, också eleven själv, och om namnet står med."
      kryss: Jag sa i förväg vem som läser.
    - namn: Texten tar lektionen vidare
      moment: [Skriv först, Stanna och skriv, Loggen]
      vad: "Elevernas meningar ändrar vad ni gör mitt i lektionen, och i loggen och nästa lektion bygger ni vidare på dem."
      syns: Klassen använder elevernas meningar i lektionen eller nästa lektion, och varje vecka skriver alla en rad i annan färg.
      raknas: false
      varfor: "Texter som ingen svarar på kan bli ren rutin: i tio klasser i åk 5 blev texterna inte bättre, och fyra lärare svarade (Ruiz-Primo m.fl., 2002). Komponenten bygger på praktiken (Lützen och Nielsen, 2025) och på att eleven lär sig när hen läser om, får svar och skriver vidare (van Dijk m.fl., 2022)."
      belagg: teori
      kallor: [ruiz-primo-m-fl-2002, l-tzen-och-nielsen-2025, van-dijk-m-fl-2022]
      kvar: Texten ändrar lektionen eller nästa, så som du bestämde, och från vecka 3 skriver alla en rad i annan färg varje vecka.
      fritt: "Vägen: samtalet, tavlan, nästa skrivfråga eller nästa lektions start. Raden i annan färg kan stå i loggen, efter rundan eller ett svar. I F–⁠1 räcker ett ord eller en bild."
      kryss: Texten tog lektionen vidare, i dag eller nästa lektion.
roll:
  rubrik: "Lärarens roll: du läser vad texten säger"
  text: Före lektionen noterar du på din planering var eleverna skriver, vad du frågar och vem som läser. I lektionen rättar du inte texterna. Du läser vad de säger och låter det ta lektionen vidare.
  fragor:
    - Vad skriver alla?
    - Vad säger texterna?
    - Vad händer med dem nu?
  fragornaText: "Den sista frågan svarar du på högt: ”Jag läste … Därför …”, eller med en elevs rad på tavlan."

