      - "Du fyller i rutan: Skriv för att visa hur du tänker. Tid fyra minuter. Vem läser: din axelkompis. Sedan: ni jämför. ”Har du hittat alla lösningar? Hur kan du vara säker på det?” I rundan läser du sex böcker: fyra har bara svaret. Det är tre eller fler. Paren läser och jämför. Lektionen har tid, så du visar genast hur."
      - "Du skriver två egna texter bredvid varandra om ett annat problem, en med bara svaret och en som säger hur du vet. ”Vad gör den andra texten?” Paren svarar, klassen skriver en mening ihop, och alla skriver igen om hjulen."
