progression:
  rubrik: De första veckorna
  text: "Metoden är troligen ny för eleverna i ditt ämne. Kärnans alla delar finns i liten skala från första lektionen, och varje vecka lägger ni till ett ställe eller en sak: mitten, frågan, loggen, Skriv först och sist svaren. Syns det nya inte än, ta en vecka till. Har du klassen en gång i veckan, får det nya två lektioner. Har klassen två gånger klarat sig utan ett ord att låna, suddar du det. Loggens fråga suddar du när loggarna har ett varför utan den. När klassen kan rutan fyller eleverna själva i Vem läser. I F–⁠1 räknas en bild med ord eller en muntlig förklaring som ett svar, och paren svarar varandra muntligt. Klassen skriver loggen ihop: du skriver en mening på ett stort papper, och nästa lektion läser ni den igen. Efter veckorna väljer du ställena själv, och en gång per arbetsområde går en text till en läsare utanför klassen. Du frågar först om mottagaren kan svara, och klassen läser svaret tillsammans."
  rader:
    - { vecka: "1", stallen: [Stanna och skriv], led: Alla skriver, rubrik: "Stanna, skriv och läs en mening", eleverna: "Att börja skriva direkt, skriva tills klockan ringer, läsa en mening för axelkompisen och tacka.", roll: "Att stanna en gång, skriva själv första minuten, gå runt utan att rätta och säga vad du läste.", vidare: "nästan alla skriver tills klockan ringer och läser en mening", fraga: "Skrev nästan alla tills klockan ringde, och läste de en mening för kamraten?" }
    - { vecka: "2", stallen: [Stanna och skriv], led: Frågan, rubrik: Frågan som kräver tänkande, eleverna: "Att skriva om innehållet med egna ord, ge ett skäl och låna ord från tavlan.", roll: "Att visa två egna texter, byta frågan om den går att återge, gärna ur Skrivfrågor att låna, och pröva sex böcker mot utfallen.", vidare: "nästan alla skriver mer än det ni gjorde", fraga: "Stod det mer än det ni gjorde i nästan alla av de sex böckerna?" }
