      - "Alla skriver vad de tycker, varför, och vad någon som inte håller med skulle säga. Du har frågat elevrådet: ”Kan ni svara med en mening på fredag, och ställa en fråga tillbaka?”"
      - "Böckerna går två steg åt höger, och alla läser. Sedan sätter klassen ihop en text av raderna med stjärna. Innan ni skickar texten frågar du: ”Vad vet vi säkert? Vad vill vi att de ska svara på?”"
      - "På fredag läser du svaret högt: ”Vad ska kortas i stället?” Klassen skriver en rad till."
