progression:
  rubrik: De första veckorna
  text: "Metoden är troligen ny för eleverna i ditt ämne. Kärnans alla delar finns i liten skala från första lektionen, och varje vecka lägger ni till en sak. Syns den inte än, ta en vecka till. Har klassen två gånger klarat sig utan ett ord att låna, suddar du det. När klassen kan rutan fyller eleverna själva i Vem läser. I F–⁠1 är vecka 3 och 5 muntliga: paren berättar om sina bilder för varandra. Efter veckorna går en text till en läsare utanför klassen en gång per arbetsområde. Du frågar först om mottagaren kan svara, och klassen läser svaret tillsammans."
  rader:
    - { vecka: "1", led: Alla skriver, rubrik: "Stanna, skriv och läs en mening", eleverna: "Att börja skriva direkt, skriva tills klockan ringer, läsa en mening för axelkompisen och tacka.", roll: "Att skriva själv första minuten, gå runt utan att rätta och säga vad du läste.", vidare: "nästan alla skriver tills klockan ringer och läser en mening", fraga: "Skrev nästan alla tills klockan ringde, och läste de en mening för kamraten?" }
    - { vecka: "2", led: Frågan, rubrik: Frågan som kräver tänkande, eleverna: "Att skriva om innehållet med egna ord, ge ett skäl och låna ord från tavlan.", roll: "Att visa två egna texter, byta frågan om den går att återge, gärna ur Skrivfrågor att låna, och pröva sex böcker mot utfallen.", vidare: "nästan alla skriver mer än det ni gjorde", fraga: "Stod det mer än det ni gjorde i nästan alla av de sex böckerna?" }
    - { vecka: "3", led: Någon läser, rubrik: "Byt böcker, och en rad till", eleverna: "Att byta böcker, läsa tyst, säga vad de läste och skriva en rad till i annan färg.", roll: "Att visa en rad till på din egen text, och läsa raderna i annan färg i rundan.", vidare: "nästan alla säger vad de läste, och raden i annan färg säger något nytt", fraga: "Sa nästan alla vad de läste, och sa raden i annan färg något nytt?" }
    - { vecka: "4", led: Texten går vidare, rubrik: Elevens rad blir nästa fråga, eleverna: "Att sätta en stjärna vid en vald rad, och skriva utifrån en kamrats rad.", roll: "Att läsa fem böcker på fem minuter, och börja nästa lektion med en rad på tavlan.", vidare: "en lektion i veckan börjar med en elevs rad, och nästan alla skriver mer än att de håller med", fraga: "Började en lektion med en elevs rad, och skrev nästan alla mer än att de höll med?" }
    - { vecka: "5", led: Någon svarar, rubrik: Svara skriftligt, eleverna: "Att skriva ett svar på en kamrats rad med kortet Så svarar vi.", roll: "Att visa svar på din text, och låta eleven välja vad hen gör med svaret.", vidare: "nästan alla svar säger något om innehållet", fraga: "Sa nästan alla svar något om innehållet?" }
uppfoljning:
  text: Du ser om metoden fungerar på det eleverna skriver och på vad som händer med texterna.
  rader:
    - { id: lektionen, nar: Varje lektion, tid: varje lektion, vad: "Det du läser över axeln avgör Nästa steg. En gång i veckan avgör fem böcker hur nästa lektion börjar." }
    - { id: klassen, nar: Klassens texter varje vecka, tid: varje vecka, vad: "Räkna hur många av sex böcker som saknar ett svar som håller. Bocka av på klasslistan vems bok du läste och vems rad som stod på tavlan." }
    - { id: lararen, nar: Dina kryss varje vecka, tid: varje vecka, vad: "Räkna på din planering hur ofta kärnans fyra delar fanns. Den som föll bort visar vad du ska öva." }
    - { id: observationerna, nar: "Vecka 2 och 4", tid: vecka 2 och 4, vad: "Specialläraren ser en lektion i vecka 2 och läser böckerna från dem som inte kommer igång. I vecka 4 ser en kollega eller rektor en lektion som börjar med en elevs rad." }
    - { id: arbetslaget-fore, nar: Före första lektionen, tid: före, vad: "På första mötet tar ni varsin lektion och byter frågan tills den inte går att återge." }
    - { id: arbetslaget-efter, nar: Vecka 5, tid: vecka 5, vad: "I slutet av vecka 5 ses ni med tre elevtexter utan namn och bestämmer hur ni går vidare." }
    - { id: idekorten, nar: Efter de fem veckorna, tid: efter, vad: "Ta fram Idékorten. Välj ett kort efter det klassen ska tänka, och läs ett uppslag högt innan ni stannar." }
    - { id: stodet, nar: Efter de första veckorna, tid: efter, vad: "Ni ses två gånger till under läsåret med tre texter utan namn. Elever som inte kommer igång eller bara återger trots stödet får stödundervisning. Läs deras skrivböcker med specialläraren." }
    - { id: sexveckor, nar: Sex skolveckor efter vecka 5, tid: efter 6 veckor, vad: "Räkna som varje vecka. En kollega läser raderna i annan färg i sex böcker på måfå, och klassen vet det. Har alla fått välja en rad att dela?" }
    - { id: nastatermin, nar: Nästa termin, tid: nästa termin, vad: "Räkna som varje vecka, och se om ni skriver för att tänka i fler ämnen. Går eleverna tillbaka till sina texter utan att du säger till? Bestäm med rektor hur ni går vidare." }
    - { id: osaker, nar: Om du är osäker på metoden, tid: villkor, vad: "Står skattningen ”Hur säker är jag på metoden?” under 5 i två veckor i rad, gör om veckan och be en kollega läsa din fråga." }
    - { id: klassenstar, nar: Om det inte fungerar, tid: villkor, vad: "Står skattningen ”Hur väl fungerar den i praktiken?” under 5 i två veckor i rad, gå tillbaka till en mening för axelkompisen och be specialläraren se en lektion." }
checklista:
  rubrik: Före första lektionen
  punkter:
    - Välj ämnet och lektionerna i veckan där klassen skriver.
    - Ge varje elev en skrivbok och en penna att ha framme, och från vecka 3 en penna i annan färg.
    - Skriv ut Rutan på tavlan och När jag fastnar, i A3 eller A4.
    - Ta fram ett skrivkort till första lektionen och pröva frågan själv i två minuter.
    - Bestäm paren, och var du börjar din runda.
    - Säg till rektor, vårdnadshavare och klassen att du inte rättar böckerna, och varför.
    - Boka observationerna, en av dem med specialläraren.
    - Bestäm med arbetslaget vad ni gör lika, som rutan och stjärnan.
klassen:
  rubrik: Så ordnar du klassen
  text: "Du bestämmer paren före lektionen, och de sitter nära varandra med skrivboken framme. Den som brukar bli sittande sitter där du börjar din runda, bredvid en trygg kamrat. Klassen kan gärna skriva några egna regler, som ”Vi lyssnar när någon läser”, och gå tillbaka till dem. En bok per elev räcker hos klassläraren, och hos ämnesläraren en bok per ämne eller ett häfte för arbetsområdet."
forsta:
  rubrik: Första lektionen
  text:
    - "Du håller din lektion, och sista kvarten övar ni rutinen Stanna och skriv på ett skrivkort, en bild att skriva om. Då tänker klassen på rutinen, och inget kan bli fel. Visa kortet, fyll i rutan, skriv själv en minut och tänk högt. Alla skriver tre minuter och läser en mening för axelkompisen, som tackar. Säg vad du läste, och skriv en elevs mening på tavlan om hen säger ja. I dag räknar du bara tomma böcker. Nästa lektion stannar du en gång: ”Skriv tre ord från i dag. Välj ett och förklara varför det är viktigt.”"
    - "Du säger: ”Vi skriver för att ta reda på vad vi tänker. Jag vill se hur du tänker, och det här rättas inte. Jag läser över axeln, och ibland läser vi en mening för varandra.”"
  plan:
    klass: 5B
    amne: NO
    datum: mån 2/11
    lektion: 1 av 10
    mal: skriva tre minuter och läsa en mening för en kamrat
    belagg: "Vad händer på bilden, och hur vet du det?"
    blad: "ett skrivkort, skrivböcker och klockan"
    forberett: "en mening att låna till den som behöver"
    fore: { syfte: "komma igång", fragan: "Vad händer på bilden, och hur vet du det?", lasare: "axelkompisen", sedan: "en mening på tavlan" }
    delar:
      - { fas: Din planering, text: "Genomgång om vattnets tre former, stopp efter 30 min" }
      - { fas: Stanna och skriv, text: "Skrivkortet, tre minuter" }
      - { fas: Läsaren, text: "En mening till axelkompisen" }
      - { fas: Nästa steg, text: "Jag läste … och en mening på tavlan" }
    beslut: { elever: 28, deFlesta: "en mening som jag läser högt", halften: "min text om kortet och meningen vi skriver ihop" }
rutiner:
  rubrik: Rutinerna klassen lär sig
  rader:
    - namn: Stanna och skriv
      vecka: 1
      vad: "Tanken är att alla tänker med pennan innan någon annan har sagt något. Du stannar, alla skriver till klockan ringer, och var och en läser en mening för axelkompisen."
      steg: ["Öppna boken och titta på rutan.", "Klockan går, och alla skriver.", "Skriv vidare, och stryk över fel.", "Välj en mening, och läs den för axelkompisen.", "Du som lyssnar säger: ”Tack för att du läste.”"]
      forsta: "Ta ett skrivkort från sidan Ta fram ett skrivkort. Skriv själv och tänk högt en minut, så att klassen ser att det får gå fort och att du stryker över."
    - namn: Två texter
      vecka: 2
      vad: "Tanken är att eleverna ser vad en förklaring gör innan de skriver själva. Välj ett syfte som håller hela arbetsområdet, till exempel förklara varför i NO eller jämföra i SO. En gång per arbetsområde visar du två egna texter."
      steg: ["Skriv två egna korta texter bredvid varandra.", "”Vad gör den andra texten som den första inte gör?”", "Paren säger det, och du skriver deras ord. De blir klassens ord att låna.", "Klassen skriver ihop en mening om något nytt.", "Alla skriver själva om dagens fråga."]
      forsta: "Ta något annat än dagens fråga, som en pöl som fryser: ”Det var kallt. Pölen frös.” och ”Pölen frös för att det var under noll grader.” Använd aldrig en elevs text som det svaga exemplet."
    - namn: Byt böcker
      vecka: 3
      vad: "Tanken är att varje text får en läsare samma lektion, och att eleven får veta vad texten redan gör. Läsaren rättar inget och drar en linje där texten gör det rutan säger. Sedan tar eleven en annan penna och skriver en rad till. Saknas linjen, ska raden göra det rutan säger."
      steg: ["Byt bok med din axelkompis.", "Läs tyst, och dra en linje där texten gör det rutan säger.", "Säg: ”Jag läste att du …”", "Ta tillbaka din bok.", "Ta en annan penna, och skriv en rad till: det som saknas, eller ”Nu tänker jag …”"]
      forsta: "Öva på en text ni redan har skrivit. Visa först på din egen: en elev säger vad hen läste, och du skriver en rad till. Säg att handstilen behöver gå att läsa, och att den som vill ha något för sig själv får vika sidan."
    - namn: Stjärnan
      vecka: 4
      vad: "Tanken är att eleven väljer vad som går vidare, och att du slipper leta i hela texten. Stjärnan betyder att du får använda raden i klassen, med namn. En ring runt stjärnan betyder utan namn, och utan stjärna stannar raden hos eleven."
      steg: ["Läs din text.", "Sätt en stjärna vid raden du vill ta med.", "Ring runt stjärnan om du vill vara utan namn.", "Lämna boken uppslagen på bänken."]
      forsta: "Visa först din egen stjärna, och läs raden högt. Säg vad stjärnan betyder: ”En rad med stjärna kan bli klassens nästa fråga.”"
    - namn: Svara skriftligt
      vecka: 5
      vad: "Tanken är att eleverna skriver för att ge svar, och att svaret gäller innehållet. Eleven läser en kamrats rad och skriver en rad under. Skribenten väljer själv vad hen gör med svaret."
      steg: ["Läs kamratens rad.", "Skriv: ”Jag läser att …”", "Skriv: ”Jag undrar …”", "Lämna tillbaka boken.", "Läs svaret, och skriv en rad till eller låt texten stå."]
      forsta: "Låt alla svara på en text du har skrivit själv, så att ingen blir bedömd. Säg vad du gör med svaren. Sedan svarar de varandra."
larandet:
  rubrik: Så syns lärandet i klassen
  omraden:
    - { omrade: amneskunskaper, syns: "Fler elever förklarar ett varför eller ett samband med egna ord och använder ämnets ord rätt." }
    - { omrade: skrivning, syns: "Fler elever skriver med ett syfte, och texterna säger mer än det ni gjorde." }
    - { omrade: sprak, syns: "Fler elever använder på egen hand formuleringar som ”det beror på” och ”en möjlig förklaring är”." }
    - { omrade: kommunikation, syns: "Fler elever läser vad en kamrat har skrivit och svarar på innehållet." }
uppdrag:
  rubrik: Till arbetslaget
  text: "Arbeta helst i ämnesgrupper, där ni talar om undervisningen och inte om enskilda elever. Ni ses två gånger de första veckorna, och mellan mötena prövar ni metoden i era klassrum och besöker varandra. De första försöken misslyckas ofta, och en del behöver längre tid. Be rektor säga ja till att de här texterna inte rättas."
  forbered:
    text: Läs lathundens sida 1 och 2, och tänk igenom frågorna före mötet. Ta med en lektion du redan har planerat.
    fragor:
      - Tänk på den senaste skrivuppgiften du gav. Vem var egentligen läsaren, och vad hände med texten?
      - Vilket slags tänkande ska skrivandet hjälpa eleverna med i ditt ämne?
      - När tror du att samtalet når fler än skrivandet, och vilka deltar då?
      - "Titta på huvudfilmen: vad händer med det eleverna skrev?"
  planera: "Skriv tre rader på lektionen du tog med, och gör om frågan tillsammans med en kollega tills svaret inte går att återge."
  genomfor: Pröva veckans sak flera gånger med en klass innan du lägger till nästa, och skatta i slutet av veckan.
  reflektera: ["Vad hände med elevernas vilja att dela?", "Vilken text ändrade din nästa lektion?", "Vilken fråga fick dem att tänka, och på vilken räckte det att återge?", "Vad är klokt för dig att göra nu?"]
  taMed: "Ta med din planering med dina kryss och tre elevtexter utan namn: en där eleven tänker, en där hen återger och en du inte vet vad du gör med."

# ---------------------------------------------------------------------------------------------------------------------
# 4 Håll i
# ---------------------------------------------------------------------------------------------------------------------
lararensFragor:
  rubrik: Lärarens frågor
  fragor:
    - { fraga: "Får jag rätta stavningen?", svar: "Inte i de här texterna. De bedöms inte, och när du rättar går elevens tanke till stavningen. Ser du samma fel hos många tar du det med klassen en annan gång.", komponent: Alla skriver för att tänka }
    - { fraga: "Får jag låta texten stanna hos eleven?", svar: "Ja, ibland. Säg det i förväg. Minst en gång i veckan läser någon annan.", komponent: Eleven vet vem som läser }
    - { fraga: "Måste jag göra något med alla texter?", svar: "Nej. Du väljer en väg varje gång: en rad till, en rad på tavlan eller nästa lektions fråga. Från vecka 3 skriver alla en rad till varje vecka.", komponent: Texten tar lektionen vidare }
    - { fraga: "Hur hinner jag läsa 28 texter?", svar: "Du läser inte alla. Du läser sex i rundan, kamraten de flesta, och från vecka 4 fem böcker i veckan på fem minuter. Du tar inget hem." }
    - { fraga: "Hur hinner jag kursen?", svar: "Lagret tar omkring tolv minuter och ersätter en del av genomgången. Eleverna skriver om ditt innehåll, och då lär de sig det bättre (Skolforskningsinstitutet, 2022)." }
    - { fraga: "Jag är ingen svensklärare. Kan jag ändå?", svar: "Ja. Du svarar på innehållet, och det kan du. Studierna gäller NO, SO och matematik (Skolforskningsinstitutet, 2022)." }
hinder:
  rubrik: Det svåraste med metoden
  text: "Det svåraste är att använda texten också när tiden är knapp. Utan det blir skrivandet en bok som ingen öppnar: i tio klasser i åk 5 var uppgifterna ofta enkla, resultaten steg inte under året, och fyra av tio lärare svarade (Ruiz-Primo m.fl., 2002). I svenska klassrum skriver eleverna mest för läraren (Sturk, 2022). Bestäm före skrivandet vem som läser och vad som händer sedan, och låt eleverna vara läsare de flesta gånger. När tiden tar slut börjar nästa lektion med texten."
  kort: "Det som oftast försvinner är att någon använder texten. Bestäm före skrivandet vem som läser och vad som händer sedan."
  komponent: Texten tar lektionen vidare
fallgropar:
  rubrik: Vanliga fallgropar
  rader:
    - { fallgrop: "Skriv vad du lärde dig", hander: "Eleverna skriver vad de gjorde, eller ingenting.", prova: "Be om ett varför eller ett val. Går svaret att återge, byt frågan.", komponent: En fråga som kräver tänkande }
    - { fallgrop: "Du rättar i stunden", hander: "Eleverna frågar om längd och stavning och slutar skriva. En elev som får höra att inledningen är för personlig suddar ut den.", prova: "Bestäm först vad du svarar på, och säg vad du läser.", komponent: Alla skriver för att tänka }
    - { fallgrop: "Du är den enda läsaren", hander: "Eleverna skriver för att visa vad de kan, och du får 28 texter att läsa.", prova: "Fyll i Vem läser, och låt kamraten läsa de flesta gånger.", komponent: Eleven vet vem som läser }
    - { fallgrop: "Lådan", hander: "Eleverna stänger boken och märker att ingen läser.", prova: "Bestäm fortsättningen innan pennan rör sig. En rad till räcker.", komponent: Texten tar lektionen vidare }
    - { fallgrop: "Skrivkortet blir kvar", hander: "Kortet blir en startuppgift utan ämne. Eleverna skriver mer, och ämnet står stilla.", prova: "Använd kortet första lektionen. Sedan skriver ni om ämnet, och kortet kommer tillbaka med en fråga om det." }
    - fallgrop: När en elev inte skriver
      moment: [Stanna och skriv]
      hander: Eleven sitter med pennan stilla, och de andra skriver.
      steg: ["Gå fram och tala lågt: ”Vad tänker du på?”", "Skriv elevens ord som första rad: ”Det är dina ord.”", "Säger eleven inget, ge en mening att låna. En skiss eller några ord räcker.", "Kom tillbaka efter en minut."]
    - fallgrop: När en elev inte vill läsa
      moment: [Läsaren]
      hander: Eleven lägger armen över texten och vill inte visa den.
      steg: ["Låt eleven välja vem som får läsa.", "Säg att ett ord räcker.", "Låt en kamrat läsa upp.", "Säg inget om eleven står över."]
    - fallgrop: När något inte går att dela
      moment: [Läsaren]
      hander: En text berättar något allvarligt, eller något som kan såra någon.
      steg: ["Låt texten stanna hos eleven: ”Den här går inte vidare till kamraten.”", "Tala enskilt med eleven.", "Lova aldrig att ingen läser.", "Följ skolans rutin om en elev far illa."]
hallFast:
  rubrik: Fem saker att hålla fast vid
  rader:
    - { sak: "När provet närmar sig: låt eleverna förklara", text: "Inför ett prov återger eleverna lätt. Låt dem förklara, jämföra eller motivera också när provet frågar efter fakta." }
    - { sak: "Efter ett lov: börja med skrivboken", text: "Samma plats i lektionen och samma första uppgift gör att ni slipper lära om. Eleverna läser en gammal text och skriver en rad till." }
    - { sak: "När en kollega tar över: lämna rutan", text: "Utan dig skriver få elever. Med rutan och frågan på tavlan går rutinen ändå." }
    - { sak: "När arbetsområdet byts: skriv igen, och byt fråga", text: "Eleven läser en gammal text och skriver igen om samma fråga. Sedan byter du frågorna, eftersom gamla frågor slits ut på en termin och lånade ord som står kvar blir ifyllnad." }
    - { sak: "När du inte hinner läsa: håll i de fem minuterna", text: "Att ändra lektionen efter elevernas texter är det som faller bort först. Skriv in fem minuter i veckan i kalendern." }

# ---------------------------------------------------------------------------------------------------------------------
# Bilaga A Att skriva ut
# ---------------------------------------------------------------------------------------------------------------------
ramar:
  rubrik: Materialet för klassen
  text: ["Utöver lektionskortet finns Rutan på tavlan, affischen När jag fastnar, kortet Så svarar vi och sex idékort. Skrivkorten hämtar du på sidan Ta fram ett skrivkort."]
  ramar:
    - rubrik: Rutan på tavlan
      text: ["Skriv ut Rutan på tavlan i A3 eller A4 och sätt upp den vid tavlan, eller rita den där. Fyll i den varje gång ni stannar, med tuschpenna på plast eller på tavlan bredvid."]
    - rubrik: När jag fastnar
      text: ["Skriv ut affischen i A3 eller A4 och sätt upp den där alla ser den. Peka på den när en elev frågar vad hen ska göra. Klassen kan skriva om den med egna ord."]
    - rubrik: Så svarar vi
      text: ["Skriv ut kortet och klipp isär det, ett kort per par från vecka 5. Korten är ett lån: orden ska bli elevernas egna, och när klassen klarar sig tar du bort dem."]
    - rubrik: Idékorten
      text: ["Skriv ut korten dubbelsidigt, vänd längs långsidan, och klipp på linjen, så får du sex halvkort. Skriv kortets ord i rutan, eller ett skarpare verb som förklara varför, och läs uppslaget på baksidan högt för klassen. Ta fram korten när de fem veckorna är gjorda."]
tabeller:
  - rubrik: Vad händer sedan
    plats: efter-inledning
    meny: true
    text: "Fältet Sedan i rutan säger vad som händer med texten. Välj innan pennan rör sig. Det första sättet räcker ibland, och du behöver inte gå längre ned i listan."
    kolumner: [Sättet, Så gör ni, Tid]
    rader:
      - ["Eleven läser sin egen text", "Eleven läser texten igen, stryker under en rad och skriver en rad till.", "1 min"]
      - ["En mening till axelkompisen", "Eleven väljer en mening och läser den. Kamraten tackar.", "2 min"]
      - ["Byt böcker", "Eleverna läser tyst, drar en linje och säger vad de läste.", "3 min"]
      - ["Svara skriftligt", "Eleven svarar: ”Jag läser att … Jag undrar …”", "3 min"]
      - ["Du lyfter två rader", "Du frågar om du får ta raderna och skriver dem på tavlan.", "2 min"]
      - ["En elevs rad blir frågan", "Nästa lektion står raden på tavlan, och alla skriver två minuter om den.", "3–⁠5 min"]
      - ["Till den som var borta", "Paren skriver en lapp och förklarar lektionen för någon som inte var här.", "3 min"]
      - ["En läsare utanför klassen", "Texten går till någon som har lovat svara.", "En gång per arbetsområde"]
      - ["Skriv igen", "Eleven läser en gammal text och skriver igen om samma fråga: ”Vad tänker du nu?”", "5 min, en gång per arbetsområde"]
  - rubrik: Tanken bakom greppen
    plats: efter-inledning
    text: "Vet du varför du använder ett grepp, kan du ändra formen och ändå behålla tanken."
    kolumner: [Greppet, Det ger dig, Det ger eleven]
    rader:
      - ["Rutan på tavlan", "Du bestämmer vem som läser och vad som händer innan pennan rör sig.", "Eleven vet vad texten är till för och vem som läser."]
      - ["Du skriver första minuten", "Du visar att det får gå fort.", "Eleven ser hur en tanke blir text."]
      - ["Två texter bredvid varandra", "Du slipper förklara vad en förklaring är.", "Eleven ser vad texten behöver göra innan hen skriver."]
      - ["Läsa över axeln", "Du ser vad klassen tänker medan du hinner ändra något.", "Eleven märker att någon vill veta vad som står."]
      - ["En rad till i annan färg", "Du ser vad som ändrades, och läser bara den raden.", "Eleven ser att hen har tänkt vidare, och att det räknas att ändra sig."]
      - ["Stjärnan", "Du läser en rad i stället för en text.", "Eleven väljer själv vad som går vidare."]
      - ["Elevens rad som fråga", "Du får en färdig fråga och klassen med dig.", "Eleven ser sin tanke bli det hela klassen tänker på."]
  - rubrik: Skriv för att
    plats: efter-progression
    text: "Fältet Skriv för att säger vad texten är till för. Varje rad är ett av idékorten i Materialet, med sex sätt att skriva och dela på baksidan. Det är frågan som avgör vad eleverna lär sig. Skriv och säg en egen mening först, så att eleverna hör hur det låter. Orden är ett lån, och de ska bort när klassen klarar sig."
    kolumner: [Skriv för att, Du visar hur man, Ord att låna]
    rader:
      - ["väcka tankar", "skriver vad man vet och undrar, innan svaret finns", "jag tror att, jag undrar, tänk om"]
      - ["minnas", "sammanfattar med egna ord, med boken stängd", "det hänger ihop med, det viktigaste är, med andra ord"]
      - ["resonera", "förklarar, jämför eller tar ställning, och ger ett skäl", "därför att, det beror på, å andra sidan"]
      - ["se vad du förstår", "säger vad man förstår, och var det tar stopp", "jag förstår att, men inte varför, nästa gång"]
      - ["ge respons", "säger vad man läser i kamratens text, och frågar", "jag läser att, jag undrar, du får mig att tänka på"]
      - ["delta", "skriver till någon som ska svara eller göra något", "vi föreslår, vi vill veta, därför tycker vi"]
  - rubrik: Skrivfrågor att låna
    plats: efter-progression
    meny: true
    text: "Pröva så här: går det att svara genom att skriva av eller berätta vad ni gjorde? Byt då frågan, och be om ett varför, ett val eller ett eget exempel."
    kolumner: [Ämnet, Svaret går att återge, Kräver tänkande]
    rader:
      - ["Läsning", "Vad handlade det om?", "Vilken mening fastnade du för, och varför?"]
      - ["Svenska", "Vad är en insändare?", "Vad tycker du, och vad skulle någon som inte håller med säga?"]
      - ["Matematik", "Räkna ut svaret.", "Förklara din strategi så att en kamrat kan följa den."]
      - ["NO", "Vad heter det när vatten blir ånga?", "Vart tog vattnet vägen? Skriv vad vi såg och varför."]
      - ["SO", "När var vikingatiden?", "Varför tror du att folk flyttade till Birka?"]
      - ["Engelska och moderna språk", "Översätt orden.", "Vilket ord behöver du mest i dag, och varför? Skriv på svenska eller på språket."]
      - ["Idrott och hälsa", "Vilka regler gäller?", "Vad hände med din puls, och vad kan det bero på?"]
      - ["Bild, slöjd och musik", "Vad heter tekniken?", "Vilket val gjorde du, och varför?"]
      - ["Alla ämnen", "Skriv vad vi gjorde.", "Vad förstår du inte än, och hur kan du ta reda på det?"]
  - rubrik: Att skriva för att delta
    plats: efter-progression
    text: "Skrivande är ett verktyg för tanken och ett sätt att delta demokratiskt. När eleven ser sin tanke på tavlan, får svar eller vet att någon läser, märker hen att ord kan göra något och får färga världen med sina tankar. Börja nära, med en rad som klassen tänker på och sedan en läsare på skolan. Fråga först om mottagaren kan svara: ett litet ja från vaktmästaren ger mer än ett uteblivet svar från kommunhuset. Innan ni skickar texten frågar ni er: Vad vet vi säkert? Vem ska läsa, och vad behöver hen förstå? Vad vill vi att hen ska göra eller svara på?"
    kolumner: [Nivån, Så kan det se ut, Vem svarar]
    rader:
      - ["I klassen", "En elevs rad blir klassens fråga.", "Klassen"]
      - ["I skolan", "Ett förslag om skolgården, matsalen eller biblioteket.", "Elevrådet, vaktmästaren eller rektor"]
      - ["Hemma och i närheten", "Ett brev hem, eller en förklaring till en yngre klass.", "Någon hemma eller den andra klassen"]
      - ["Utanför skolan", "En insändare eller en fråga till en politiker.", "Någon som har lovat svara"]
  - rubrik: Utveckla metoden
    plats: efter-grund
    text: "När grunden sitter kan du bygga på med en sak i taget. Lektionens innehåll går först, och greppet är ett hjälpmedel."
    kolumner: [Det du bygger på, Så gör du]
    rader:
      - ["Idékorten", "Ta fram ett kort i taget och pröva ett uppslag i veckan. Kortet ger fältet Skriv för att, och uppslaget säger hur texten delas. I F–⁠3 passar tärningarna om ämnet, Frågetärningen och Vems ögon."]
      - ["Klassen väljer med pennan", "Böckerna går två platser åt höger, uppslagna vid raden med stjärna, och eleverna drar ett streck i kanten om de vill tänka på raden. Läsaren läser upp raden med streck, och du väljer en."]
      - ["Kan vi stanna och skriva?", "En elev får be om ett stopp, en gång per lektion."]
      - ["Frågelappar som flyttas", "Eleverna sätter sina frågor på tavlan, och klassen flyttar upp lappen när den kan visa svaret."]
      - ["Tänka, samtala, skriva", "Klassen samtalar, du bygger en tankebank på tavlan, och var och en skriver sin text. Det tar omkring 20 minuter."]
planeringsmall:
  bladEtikett: Material
  text: "Planeringsmallen är ingen ny planering. Skriv på den du har, eller på bladet när du vill. Det räcker med tre rader: var du stannar, frågan, och vem som läser och vad som händer sedan."
  fore:
    - { etikett: "Skrivfrågan", rader: ["Skriv för att:", "Ordagrant:"], falt: [syfte, fragan] }
    - { etikett: "Efter skrivandet", rader: ["Vem läser:", "Vad händer sedan:"], falt: [lasare, sedan] }
  delar:
    - { fas: Tillbaka till texten, skriv: "Elevens rad:", hojd: 0.7 }
    - { fas: Din planering, skriv: "En rad om det jag har planerat, och var jag stannar:", hojd: 0.8 }
    - { fas: Stanna och skriv, skriv: "Minuter:", not: "Skriv första minuten, gå rundan, läs sex böcker och räkna tomt, bara det ni gjorde eller fel i sak. Första lektionen: bara tomt.", hojd: 0.9 }
    - { fas: Läsaren, skriv: "Så läser vi:", hojd: 0.7 }
