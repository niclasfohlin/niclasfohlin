plan:
  passen:
    - { nar: första lektionen, kort: Stanna och skriv, text: "Du håller din lektion, och sista kvarten övar ni rutinen Stanna och skriv med ett skrivkort. Alla skriver tre minuter och läser en mening för axelkompisen, och du skriver en mening på tavlan. Nästa lektion stannar du och ställer en fråga om innehållet." }
  fore: ["Välj ämnet och lektionerna i veckan där klassen skriver."]
  utvardering: ["Ni ses två gånger till under läsåret med tre texter utan namn. Elever som inte kommer igång eller bara återger trots stödet får stödundervisning. Läs deras skrivböcker med specialläraren."]
  skattningar:
    - namn: Hur säker är jag på metoden?
      vem: lararen
      rad: lararen
      text: "Skatta i slutet av veckan. Tänk på kärnan: Krävde frågan tänkande, och hade du visat hur? Skrev alla med egna ord, och lät du bli att rätta? Sa du innan eleverna började att någon annan än du läser? Gjorde de något med texten?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: osaker }
    - namn: Hur väl fungerar den i praktiken?
      vem: lararen
      rad: klassen
      text: "Tänk på det du ser i klasserna: Förklarar fler elever ett varför med egna ord? Läser fler vad en kamrat skrev och svarar på innehållet?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: klassenstar }

# ---------------------------------------------------------------------------------------------------------------------
# Lathunden Att komma igång
# ---------------------------------------------------------------------------------------------------------------------
lathund:
  metoden:
    text:
      - Du stannar i din vanliga lektion och ställer en fråga, alla skriver några minuter för att ta reda på vad de tänker, någon läser, och det de skrev tar lektionen vidare.
      - Så går lärandet till. Den som måste förklara eller ta ställning med egna ord märker vad hen förstår, och den som får en läsare ser att orden betyder något.
  lektion:
    text: "Sista kvarten övar ni med ett skrivkort, en bild att skriva om. Säg: ”Vi skriver för att ta reda på vad vi tänker. Jag vill se hur du tänker, och det här rättas inte.” Skriv själv en minut och tänk högt. Alla skriver tre minuter och läser en mening för axelkompisen. Skriv en elevs mening på tavlan, om hen säger ja."
  igang:
    rubrik: De första veckorna
