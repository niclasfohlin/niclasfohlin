titel: Skriva för att lära
undertitel: Så låter du alla elever tänka med pennan i dina vanliga lektioner, F–⁠9
alternativaNamn: ["Writing to learn", "Skriva för att tänka"]
ingress: "Skriva för att lära är ingen skrivkurs. Eleverna lär sig ämnet genom att skriva. I din vanliga lektion skriver alla några minuter där det hjälper dem att tänka: i början, mitt i eller i slutet. Mitt i läser någon texten, och du bygger vidare på det de skrev. Ingen rättar texten, och den hamnar inte i en låda."
arskurs: ["F-3", "4-6", "7-9"]
arskursText: F–9
taggar: ["undervisningskvalitet", "skrivstrategier"]
slag: strategier
syfte: [tanka, ova]
tid: 2–⁠12 min i din lektion, minst två lektioner i veckan
hurOftaSkal: "I försöken med lärjournaler skrev eleverna en gång i veckan (Nückles m.fl., 2020). Två lektioner i veckan ger en rutin. Har du klassen en gång i veckan, skriv på två eller tre ställen."
period: Fem veckor att komma igång
material:
  - en skrivbok och en penna per elev
  - lektionskortet
  - bladen Rutan på tavlan och När jag fastnar
  - en klocka som alla ser
  - en penna i annan färg per elev
  - ett skrivkort i reserv
uppdaterad: 2026-11-08
publicerad: 2026-11-08
relaterade: ["formativ-bedomning", "testbaserat-larande", "reciprok-undervisning", "kooperativt-larande", "kortskrivning-skriv-varje-dag", "skrivkurs-vardeskapande"]
