# Lathunden Att komma igång
# ---------------------------------------------------------------------------------------------------------------------
lathund:
  metoden:
    text:
      - "I din vanliga lektion skriver alla några minuter där det hjälper dem att tänka: i början, mitt i eller i slutet. Mitt i läser någon, och det de skrev tar lektionen vidare."
      - Så går lärandet till. Den som måste förklara eller ta ställning med egna ord märker vad hen förstår, och den som får en läsare ser att orden betyder något.
  lektion:
    text: "Stanna en gång mitt i lektionen. Säg: ”Vi skriver för att ta reda på vad vi tänker, och det här rättas inte.” Fråga: ”Skriv tre ord från i dag. Välj ett och förklara det med ett eget exempel.” Skriv själv en minut. Alla skriver tre minuter och läser en mening för axelkompisen. Säg sedan: ”Jag läste … Därför …”"
  igang:
    rubrik: De första veckorna
