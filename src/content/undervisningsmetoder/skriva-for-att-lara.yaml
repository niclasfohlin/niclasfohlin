      vem: lararen
      rad: lararen
      text: "Skatta i slutet av veckan. Tänk på kärnan: Krävde frågan tänkande, och hade du visat hur? Skrev alla med egna ord, och lät du bli att rätta? Sa du i förväg vem som läser, och läste en kamrat? Tog texten lektionen vidare?"
