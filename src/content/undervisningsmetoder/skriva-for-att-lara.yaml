      - "Rutan sa att axelkompisen läste. Paren bytte böcker och drog en linje där sambandet syntes."
      - "Sagas rad blev nästa lektions fråga, och alla skrev en rad till."
    scen:
      - "Tänk dig en lektion i NO i åk 5, vecka 4. Klassen har kokat vatten och sett en pöl torka i solen, och du har visat två egna texter om en pöl som fryser. Nu fyller du i rutan: Skriv för att förklara varför. Fyra minuter. Vem läser: din axelkompis. Sedan: en rad till."
      - "”Vart tog vattnet vägen? Skriv vad vi såg och varför.” Du skriver första minuten, ser till två elever och läser sex böcker. Två har bara det ni gjorde: ”Vi kokade vatten. Det försvann.” Det är utfallet De flesta kan. Du frågar Saga lågt om du får läsa upp raden."
      - "Paren byter böcker. I Nästa steg säger du: ”Jag läste att många skriver vad vi gjorde. Saga skrev: När vattnet blir varmt blir det vattenånga i luften. Vattnet är alltså kvar. Därför skriver alla en rad till: varför?” Alla skriver i annan färg. Sist sätter de en stjärna."
      - "Nästa lektion står Sagas rad på tavlan: ”Håller du med? Hur skulle du pröva det?” Två minuter."
    notera: "Notera vad som hände. Frågan visade vem som tänkte och vem som återgav, och texten fick en läsare direkt. Du rättade inget, och det tog fyra minuter att se vad klassen behövde. Hade högst en av sex återgett, hade du bara lyft två rader. Hade tre gjort det, hade du visat två texter igen och låtit alla skriva om."
  - amne: praktisk-estetiska
    amnesnamn: Slöjd
    arskurs: åk 7
    innehall: Att välja material och teknik och motivera sina val
    overst:
      egen: "Skriv vilket val du gjorde och varför. Felet: loggen sist på lektionen, med bara vad eleven gjorde."
      visar: Alla skriver två minuter mitt i arbetet, med boken vid bänken.
    scen:
      - "Tänk dig en lektion i slöjd i åk 7. Du har klassen en gång i veckan, så du stannar två gånger. Efter 20 minuter fyller du i rutan: Skriv för att motivera. Tid två minuter. Vem läser: din bänkgranne. Sedan: visa ditt arbete."
      - "”Vilket val gjorde du nyss, och varför?” Eleverna skriver med sågspånet kvar på händerna. Noah skriver: ”Jag tog tunnare trä för att lådan inte ska väga mycket.” Grannen läser, tittar på lådan och frågar: ”Håller den då?”"
      - "Noah skriver en rad till i annan färg och prövar på en spillbit. I Nästa steg, sist på lektionen, stannar du igen: ”Skriv en fråga du har till nästa gång.” Nästa vecka börjar med de frågorna."
    notera: "Notera vad som hände. Eleverna skrev mitt i arbetet, så texten handlade om valet. Hade loggen kommit sist, hade Noah skrivit: ”Jag sågade.”"
stod:
  rubrik: Elever som behöver mer stöd
  rader:
    - { nar: Den som är ny i svenska, metoden: "Samma fråga som de andra, och formen är fri.", du: "Ge eleven ämnets ord med bild före lektionen. Hen skriver första tanken på sitt starkaste språk. I Läsaren visar eleven tanken med skiss och de ord hen kan, och paret skriver en rad på svenska ihop. Där sätter hen stjärnan." }
    - { nar: Den yngsta som inte skriver än, metoden: "Bild och ord räknas som text.", du: "Eleven ritar och berättar, och du skriver orden under bilden, läser upp dem och följer med fingret. Klassen kan skriva en mening ihop med dig och läsa den igen nästa dag." }
    - { nar: Den vars hand eller stavning tar all kraft, metoden: "Kort tid, och ingen rättar.", du: "Eleven säger och du eller kamraten skriver, eller eleven använder diktering och talsyntes. Eleven säger sin första tanke till kamraten innan hen skriver." }
    - { nar: Den som inte vågar dela, metoden: "Eleven väljer själv meningen.", du: "Ta små steg: eleven lyssnar, delar ett ord, läser en vald mening eller låter en kamrat läsa upp. Eleven väljer själv sin läsare." }
    - { nar: Den som skriver men bara återger, metoden: "Samma fråga, och texten står kvar.", du: "Säg: ”Här har du skrivit vad som hände. Nu saknas varför.” Skriv första ordet tillsammans. Peka på affischen När jag fastnar, och på orden att låna på tavlan." }
    - { nar: När metoden inte räcker, metoden: "Texten visar tidigt vem som fastnar.", du: "Kommer eleven inte igång eller återger bara efter veckorna, trots stödet? Läs texterna med specialläraren, se var tanken stannar, och pröva Kortskrivning eller Säg, skriv och läs i Stödundervisning." }

