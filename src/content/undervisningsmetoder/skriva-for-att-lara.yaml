    - { id: nastatermin, nar: Nästa termin, tid: nästa termin, vad: "Räkna som varje vecka, och se om ni skriver för att tänka i fler ämnen. Går eleverna tillbaka till sina texter utan att du säger till? Bestäm med rektor hur ni går vidare." }
    - { id: osaker, nar: Om du är osäker på metoden, tid: villkor, vad: "Står skattningen ”Hur säker är jag på metoden?” under 5 i två veckor i rad, be en kollega leda Stanna och skriv i din klass medan du ser på, och gör sedan om veckan." }
    - { id: klassenstar, nar: Om det inte fungerar, tid: villkor, vad: "Står skattningen ”Hur väl fungerar den i praktiken?” under 5 i två veckor i rad, gå tillbaka till en mening för axelkompisen och be specialläraren se en lektion." }
checklista:
  rubrik: Före första lektionen
  punkter:
    - Välj ämnet och lektionerna i veckan där klassen skriver.
    - Ge varje elev en skrivbok och en penna att ha framme, och från vecka 3 en penna i annan färg.
    - Skriv ut Rutan på tavlan och När jag fastnar, i A3 eller i A4 nära eleverna.
    - Skriv frågan till första lektionen, och pröva den själv i två minuter.
    - Bestäm paren, och var du börjar din runda.
    - Säg till rektor, vårdnadshavare och klassen att du inte rättar böckerna, och varför.
    - Boka observationerna, en av dem med specialläraren.
    - Bestäm med arbetslaget vad ni gör lika, som rutan och stjärnan.
klassen:
  rubrik: Så ordnar du klassen
  text: "Du bestämmer paren före lektionen, och de sitter nära varandra med skrivboken framme. Den som brukar bli sittande sitter där du börjar din runda, bredvid en trygg kamrat. Klassen kan gärna skriva några egna regler, som ”Vi lyssnar när någon läser”, och gå tillbaka till dem. En bok per elev räcker hos klassläraren, och hos ämnesläraren en bok per ämne eller ett häfte för arbetsområdet."
forsta:
  rubrik: Första lektionen
  text:
    - "Du håller din lektion och stannar en gång mitt i, efter 20 minuter, och övar Stanna och skriv på dagens ämne. Fyll i rutan och skriv frågan på tavlan: ”Skriv tre ord från i dag. Välj ett och förklara det med ett eget exempel.” Skriv själv en minut medan du tänker högt. Starta sedan klockan: alla skriver tre minuter och läser en mening för axelkompisen. Säg vad du läste och vad ni gör nu: ”Jag läste … Därför …” Skriv en elevs mening på tavlan om hen säger ja, och säg: ”Nu fortsätter vi med det ni skrev.” I dag räknar du bara tomma böcker."
    - "Du säger: ”Vi skriver för att ta reda på vad vi tänker. Det här rättas inte. Jag läser över axeln, och ibland läser vi en mening för varandra.”"
  plan:
    klass: 5B
    amne: NO
    datum: mån 2/11
    lektion: 1 av 10
    mal: förklara en av vattnets tre former med ett eget exempel
    belagg: "Skriv tre ord från i dag. Välj ett och förklara det med ett eget exempel."
    blad: "Rutan på tavlan, skrivböcker och klockan"
    forberett: "en mening att låna till den som behöver"
    fore: { syfte: "förklara", fragan: "Skriv tre ord från i dag. Välj ett och förklara det med ett eget exempel.", lasare: "axelkompisen", sedan: "en mening på tavlan" }
    delar:
      - { fas: Din planering, text: "Genomgång om vattnets tre former, stopp efter 20 min" }
      - { fas: Stanna och skriv, text: "Tre minuter. En mening till axelkompisen" }
    beslut: { elever: 28, deFlesta: "en mening som jag läser högt", halften: "meningen vi skriver ihop, och ett skrivkort nästa gång" }
rutiner:
  rubrik: Rutinerna klassen lär sig
  rader:
    - namn: Stanna och skriv
      vecka: 1
      stalle: Stanna och skriv
      vad: "Tanken är att alla tänker med pennan innan någon annan har sagt något. Mitt i lektionen stannar du, alla skriver till klockan ringer, och var och en läser en mening för axelkompisen."
      steg: ["Öppna boken och titta på rutan.", "Klockan går, och alla skriver.", "Skriv vidare, och stryk över fel.", "Välj en mening, och läs den för axelkompisen.", "Du som lyssnar säger: ”Tack för att du läste.”"]
      forsta: "Skriv själv en minut om dagens fråga och tänk högt, så att klassen ser att det får gå fort och att du stryker över."
    - namn: Två texter
      vecka: 2
      stalle: Stanna och skriv
      vad: "Tanken är att eleverna ser vad en förklaring gör innan de skriver själva. Välj ett syfte som håller hela arbetsområdet, till exempel förklara varför i NO eller jämföra i SO. En gång per arbetsområde visar du två egna texter."
      steg: ["Skriv två egna korta texter bredvid varandra.", "”Vad gör den andra texten som den första inte gör?”", "Paren säger det, och du skriver deras ord. De blir klassens ord att låna.", "Klassen skriver ihop en mening om något nytt.", "Alla skriver själva om dagens fråga."]
      forsta: "Ta något annat än dagens fråga, som en pöl som fryser: ”Det var kallt. Pölen frös.” och ”Pölen frös för att det var under noll grader.” Använd aldrig en elevs text som det svaga exemplet."
    - namn: Loggen
      vecka: 3
      stalle: Loggen
      vad: "Tanken är att eleven samlar det viktigaste med egna ord och ser att hen har tänkt vidare. Du samlar in en exit-lapp, men loggen stannar i boken och ingen rättar den. Med en stjärna får du använda raden i klassen med namn, och med en ring runt stjärnan utan namn."
      steg: ["Läs det du skrev i dag, om du har skrivit något.", "Ta en annan färg.", "Skriv vad du tänker nu, vad som är viktigast och varför.", "Vill du ta med en rad, sätt en stjärna vid den. Ring in stjärnan om du vill vara utan namn."]
      forsta: "Visa din egen logg om dagens lektion, och läs raden med stjärna högt. Säg: ”En rad med stjärna kan bli klassens nästa fråga. Utan stjärna stannar raden hos dig.”"
    - namn: Skriv först
      vecka: 4
      stalle: Skriv först
      vad: "Tanken är att alla tänker själva innan du undervisar, och att lektionen kan utgå från det eleverna skrev. Frågan gäller något som lektionen svarar på. Är innehållet nytt, skriver eleven två minuter vad hen tror och varför. Bygger lektionen på förra, tar du en elevs rad med stjärna. Texten stannar hos eleven, som ofta läser den igen i loggen."
      steg: ["Öppna boken och skriv dagens datum.", "Läs frågan eller raden på tavlan.", "Skriv i två minuter vad du tror och varför.", "Låt texten stå. När svaret kommer, läs din gissning. Stämde den?"]
      forsta: "Skriv en rad med stjärna på tavlan, med namn, och fråga: ”Stämmer det? Hur vet du?” En rad med fel i sak, eller med ring runt stjärnan, tar du upp utan namn."
    - namn: Byt böcker och svara
      vecka: 5
      stalle: Stanna och skriv
      vad: "Tanken är att texten får en läsare som svarar på tanken. Läsaren rättar inget, drar en linje där texten gör det rutan säger och skriver ett svar. Skribenten väljer själv vad hen gör med svaret."
      steg: ["Byt bok med din axelkompis.", "Läs tyst, och dra en linje där texten gör det rutan säger.", "Skriv: ”Jag läser att … Jag undrar …”", "Lämna tillbaka boken.", "Läs svaret, och skriv en rad till i annan färg i loggen eller nästa lektion."]
      forsta: "Låt alla svara på en text du har skrivit själv, så att ingen blir bedömd. Säg att handstilen behöver gå att läsa, och att den som vill ha något för sig själv får vika sidan."
larandet:
  rubrik: Så syns lärandet i klassen
  omraden:
    - { omrade: amneskunskaper, syns: "Fler elever förklarar ett varför eller ett samband med egna ord och använder ämnets ord rätt." }
    - { omrade: skrivning, syns: "Fler elever skriver med ett syfte, och texterna säger mer än det ni gjorde." }
    - { omrade: sprak, syns: "Fler elever använder på egen hand formuleringar som ”det beror på” och ”en möjlig förklaring är”." }
    - { omrade: kommunikation, syns: "Fler elever läser vad en kamrat har skrivit och svarar på innehållet." }
uppdrag:
  rubrik: Till arbetslaget
  text: "Arbeta helst i ämnesgrupper, där ni talar om undervisningen och inte om enskilda elever. Ni ses två gånger de första veckorna, och mellan mötena prövar ni metoden i era klassrum och besöker varandra. De första försöken misslyckas ofta, och en del behöver längre tid. Be rektor säga ja till att de här texterna inte rättas."
  forbered:
    text: Läs lathundens sida 1 och 2, och tänk igenom frågorna före mötet. Ta med en lektion du redan har planerat.
    fragor:
      - Tänk på den senaste skrivuppgiften du gav. Vem var egentligen läsaren, och vad hände med texten?
      - Vilket slags tänkande ska skrivandet hjälpa eleverna med i ditt ämne?
      - När tror du att samtalet når fler än skrivandet, och vilka deltar då?
      - "Titta på huvudfilmen: vad händer med det eleverna skrev?"
  planera: "Skriv på din planering var eleverna skriver och vad du frågar. Gör om frågan mitt i med en kollega tills svaret inte går att återge."
  genomfor: Pröva veckans sak flera gånger med en klass innan du lägger till nästa, och skatta i slutet av veckan.
  reflektera: ["Vad hände med elevernas vilja att dela?", "Vilken text ändrade din nästa lektion?", "Vilken fråga fick dem att tänka, och på vilken räckte det att återge?", "Vad är klokt för dig att göra nu?"]
  taMed: "Ta med din planering med dina kryss och tre elevtexter utan namn: en där eleven tänker, en där hen återger och en du inte vet vad du gör med."

# ---------------------------------------------------------------------------------------------------------------------
# 4 Håll i
# ---------------------------------------------------------------------------------------------------------------------
lararensFragor:
  rubrik: Lärarens frågor
  fragor:
    - { fraga: "Får jag rätta stavningen?", svar: "Inte i de här texterna. De bedöms inte, och när du rättar går elevens tanke till stavningen. Ser du samma fel hos många tar du det med klassen en annan gång.", komponent: Alla skriver för att tänka }
    - { fraga: "Får jag låta texten stanna hos eleven?", svar: "Ja. I Skriv först och loggen gör den oftast det. Säg det i förväg. Minst en gång i veckan läser en kamrat i Stanna och skriv.", komponent: Eleven vet vem som läser }
    - { fraga: "Måste jag göra något med alla texter?", svar: "Nej. Du väljer en väg varje gång: en rad på tavlan, loggen eller nästa lektions fråga. Från vecka 3 skriver alla en rad i annan färg varje vecka, oftast i loggen.", komponent: Texten tar lektionen vidare }
    - { fraga: "Hur hinner jag läsa 28 texter?", svar: "Du läser inte alla. Du läser sex i rundan, kamraten de flesta, och från vecka 4 fem böcker i veckan på fem minuter. Du tar inget hem." }
    - { fraga: "Hur hinner jag kursen?", svar: "Skrivandet tar 2–12 minuter av lektionen, på de ställen du väljer, och ersätter en del av genomgången. Eleverna skriver om ditt innehåll, och då lär de sig det bättre (Skolforskningsinstitutet, 2022)." }
    - { fraga: "Jag är ingen svensklärare. Kan jag ändå?", svar: "Ja. Du svarar på innehållet, och det kan du. Studierna gäller NO, SO och matematik (Skolforskningsinstitutet, 2022)." }
hinder:
  rubrik: Det svåraste med metoden
  text: "Det svåraste är att använda texten också när tiden är knapp. Utan det blir skrivandet en bok som ingen öppnar: i tio klasser i åk 5 var uppgifterna ofta enkla, resultaten steg inte under året, och fyra av tio lärare svarade (Ruiz-Primo m.fl., 2002). I svenska klassrum skriver eleverna mest för läraren (Sturk, 2022). Bestäm före skrivandet vem som läser och vad som händer sedan, och låt eleverna vara läsare de flesta gånger. När tiden tar slut börjar nästa lektion med texten."
  kort: "Det som oftast försvinner är att någon använder texten. Bestäm före skrivandet vem som läser och vad som händer sedan."
  komponent: Texten tar lektionen vidare
fallgropar:
  rubrik: Vanliga fallgropar
  rader:
    - { fallgrop: "Skriv vad du lärde dig", hander: "Eleverna skriver vad de gjorde, eller ingenting. I loggen blir det lätt ”Vi gjorde …”.", prova: "Be om ett varför eller ett val, också i loggen. Går svaret att återge, byt frågan.", komponent: En fråga som kräver tänkande }
    - { fallgrop: "Du rättar i stunden", hander: "Eleverna frågar om längd och stavning och slutar skriva. En elev som får höra att inledningen är för personlig suddar ut den.", prova: "Bestäm först vad du svarar på, och säg vad du läser.", komponent: Alla skriver för att tänka }
    - { fallgrop: "Du är den enda läsaren", hander: "Eleverna skriver för att visa vad de kan, och du får 28 texter att läsa.", prova: "Fyll i Vem läser, och låt kamraten läsa de flesta gånger.", komponent: Eleven vet vem som läser }
    - { fallgrop: "Lådan", hander: "Eleverna stänger boken och märker att ingen läser. Det händer också när du bara tar Skriv först och loggen.", prova: "Bestäm fortsättningen innan pennan rör sig, och ta Stanna och skriv med en läsare varje vecka.", komponent: Texten tar lektionen vidare }
    - { fallgrop: "Skrivandet tar över", hander: "Klassen skriver på alla ställen varje lektion, och skrivandet blir längre än tanken behöver. Din undervisning krymper.", prova: "Välj ett eller två ställen i lektionen. Stanna och skriv räcker ofta, och loggen tar du när det viktigaste behöver samlas." }
    - fallgrop: När en elev inte skriver
      moment: [Stanna och skriv]
      hander: Eleven sitter med pennan stilla, och de andra skriver.
      steg: ["Gå fram och tala lågt: ”Vad tänker du på?”", "Skriv elevens ord som första rad: ”Det är dina ord.”", "Säger eleven inget, ge en mening att låna. En skiss eller några ord räcker.", "Kom tillbaka efter en minut."]
    - fallgrop: När en elev inte vill läsa
      moment: [Stanna och skriv]
      hander: Eleven lägger armen över texten och vill inte visa den.
      steg: ["Låt eleven välja vem som får läsa.", "Säg att ett ord räcker.", "Låt en kamrat läsa upp.", "Säg inget om eleven står över."]
    - fallgrop: När något inte går att dela
      moment: [Stanna och skriv]
      hander: En text berättar något allvarligt, eller något som kan såra någon.
      steg: ["Låt texten stanna hos eleven: ”Den här går inte vidare till kamraten.”", "Tala enskilt med eleven.", "Lova aldrig att ingen läser.", "Följ skolans rutin om en elev far illa."]
hallFast:
  rubrik: Fem saker att hålla fast vid
  rader:
    - { sak: "När provet närmar sig: låt eleverna förklara", text: "Inför ett prov återger eleverna lätt. Låt dem förklara, jämföra eller motivera också när provet frågar efter fakta." }
    - { sak: "Efter ett lov: börja med Skriv först", text: "Samma plats i lektionen och samma första uppgift gör att ni slipper lära om. Eleverna läser sin senaste logg och skriver en rad till." }
    - { sak: "När en kollega tar över: lämna rutan", text: "Utan dig skriver få elever. Med rutan och frågan på tavlan går rutinen ändå." }
    - { sak: "När arbetsområdet byts: skriv igen, och byt fråga", text: "Eleven läser en gammal text och skriver igen om samma fråga. Sedan byter du frågorna och tar bort de lånade orden när eleverna klarar sig, eftersom orden annars blir ifyllnad." }
    - { sak: "När du inte hinner läsa: håll i de fem minuterna", text: "Att ändra lektionen efter elevernas texter är det som faller bort först. Skriv in fem minuter i veckan i kalendern." }

# ---------------------------------------------------------------------------------------------------------------------
# Bilaga A Att skriva ut
# ---------------------------------------------------------------------------------------------------------------------
ramar:
  rubrik: Materialet för klassen
  text: ["Utöver lektionskortet finns Rutan på tavlan, affischen När jag fastnar, kortet Så svarar vi och sex idékort. Skrivkorten hämtar du på sidan Ta fram ett skrivkort."]
  ramar:
    - rubrik: Rutan på tavlan
      text: ["Skriv ut Rutan på tavlan i A3 och sätt upp den vid tavlan, eller rita den stort där. Nära eleverna räcker A4. Fyll i den när ni stannar och skriver mitt i, med tuschpenna på plast eller på tavlan bredvid."]
    - rubrik: När jag fastnar
      text: ["Skriv ut affischen i A3 och sätt upp den där alla ser den. Nära eleverna räcker A4. Peka på den när en elev frågar vad hen ska göra. Klassen kan skriva om den med egna ord."]
    - rubrik: Så svarar vi
      text: ["Skriv ut kortet och klipp isär det, ett kort per par från vecka 5. Korten är ett lån: orden ska bli elevernas egna, och när klassen klarar sig tar du bort dem."]
    - rubrik: Idékorten
      text: ["Skriv ut korten dubbelsidigt, vänd längs långsidan, och klipp på linjen, så får du sex halvkort. Skriv kortets ord i rutan, eller ett skarpare verb som förklara varför, och läs uppslaget på baksidan högt för klassen. Ta fram korten när de fem veckorna är gjorda."]
tabeller:
  - rubrik: Vad händer sedan
    plats: efter-inledning
    meny: true
    text: "Fältet Sedan i rutan säger vad som händer med texten. Välj innan pennan rör sig."
    kolumner: [Sättet, Så gör ni, Tid]
    rader:
      - ["En mening till axelkompisen", "Eleven väljer en mening och läser den. Kamraten tackar.", "2 min"]
      - ["Byt böcker och svara", "Eleverna läser tyst, drar en linje och svarar: ”Jag läser att … Jag undrar …”", "4 min"]
      - ["Loggen", "Eleven läser dagens text och skriver det viktigaste i annan färg.", "3 min"]
      - ["Du lyfter två rader", "Du frågar om du får ta raderna och skriver dem på tavlan.", "2 min"]
      - ["En elevs rad blir frågan", "Nästa lektion står raden på tavlan i Skriv först, och alla skriver två minuter om den.", "2 min"]
      - ["Till den som var borta", "Paren skriver en lapp och förklarar lektionen för någon som inte var här.", "3 min"]
      - ["En läsare utanför klassen", "Texten går till någon som har lovat svara.", "En gång per arbetsområde"]
      - ["Skriv igen", "Eleven läser en gammal text och skriver igen om samma fråga: ”Vad tänker du nu?”", "5 min, en gång per arbetsområde"]
  - rubrik: Tanken bakom greppen
    plats: efter-inledning
    text: "Vet du varför du använder ett grepp, kan du ändra formen och ändå behålla tanken."
    kolumner: [Greppet, Det ger dig, Det ger eleven]
    rader:
      - ["Rutan på tavlan", "Du bestämmer vem som läser och vad som händer innan pennan rör sig.", "Eleven vet vad texten är till för och vem som läser."]
      - ["Du skriver första minuten", "Du visar att det får gå fort.", "Eleven ser hur en tanke blir text."]
      - ["Två texter bredvid varandra", "Du slipper förklara vad en förklaring är.", "Eleven ser vad texten behöver göra innan hen skriver."]
      - ["Läsa över axeln", "Du ser vad klassen tänker medan du hinner ändra något.", "Eleven märker att någon vill veta vad som står."]
      - ["Skriv först", "Du ser vad klassen redan tänker och kan börja där.", "Eleven har en egen tanke innan någon har sagt något."]
      - ["Loggen i annan färg", "Du ser vad som ändrades, och läser bara de raderna.", "Eleven samlar det viktigaste och ser att hen har tänkt vidare."]
      - ["Stjärnan", "Du läser en rad i stället för en text och får en färdig fråga.", "Eleven väljer själv vad som går vidare och ser sin tanke bli klassens."]
  - rubrik: Skriv för att
    plats: efter-progression
    text: "Fältet Skriv för att säger vad texten är till för. Varje rad är ett idékort i Materialet, och baksidan har sex sätt att skriva och dela. I Skriv först passar ofta väcka tankar, i loggen minnas och se vad du förstår, och i Stanna och skriv de andra. Ett uppslag där en kamrat läser hör till Stanna och skriv. Skriv och säg en egen mening först, så att eleverna hör hur det låter. Orden är ett lån, och de ska bort när klassen klarar sig."
    kolumner: [Skriv för att, Du visar hur man, Ord att låna]
    rader:
      - ["väcka tankar", "skriver vad man vet och undrar, innan svaret finns", "jag tror att, jag undrar, tänk om"]
      - ["minnas", "sammanfattar det viktigaste med egna ord", "det hänger ihop med, det viktigaste är, med andra ord"]
      - ["resonera", "förklarar, jämför eller tar ställning, och ger ett skäl", "därför att, det beror på, å andra sidan"]
      - ["se vad du förstår", "säger vad man förstår, och var det tar stopp", "jag förstår att, men inte varför, nästa gång"]
      - ["ge respons", "säger vad man läser i kamratens text, och frågar", "jag läser att, jag undrar, du får mig att tänka på"]
      - ["delta", "skriver till någon som ska svara eller göra något", "vi föreslår, vi vill veta, därför tycker vi"]
  - rubrik: Skrivfrågor att låna
    plats: efter-progression
    meny: true
    text: "Pröva så här: går det att svara genom att skriva av eller berätta vad ni gjorde? Byt då frågan, och be om ett varför, ett val eller ett eget exempel."
    kolumner: [Ämnet, Svaret går att återge, Kräver tänkande]
    rader:
      - ["Läsning", "Vad handlade det om?", "Vilken mening fastnade du för, och varför?"]
      - ["Svenska", "Vad är en insändare?", "Vad tycker du, och vad säger den som inte håller med?"]
      - ["Matematik", "Räkna ut svaret.", "Förklara din strategi så att en kamrat kan följa den."]
      - ["NO", "Vad heter det när vatten blir ånga?", "Vart tog vattnet vägen? Skriv vad vi såg och varför."]
      - ["SO", "När var vikingatiden?", "Varför tror du att folk flyttade till Birka?"]
      - ["Engelska och moderna språk", "Översätt orden.", "Vilket ord behöver du mest i dag, och varför? Skriv på svenska eller på språket."]
      - ["Idrott och hälsa", "Vilka regler gäller?", "Vad hände med din puls, och vad kan det bero på?"]
      - ["Bild, slöjd och musik", "Vad heter tekniken?", "Vilket val gjorde du, och varför?"]
      - ["Alla ämnen", "Skriv vad vi gjorde.", "Vad förstår du inte än, och hur kan du ta reda på det?"]
      - ["Skriv först, alla ämnen", "Vad hette det vi läste om sist?", "Vad tror du händer, och varför?"]
      - ["Loggen, alla ämnen", "Vad gjorde vi i dag?", "Läs det du skrev i dag. Vad är viktigast nu, och varför?"]
  - rubrik: Att skriva för att delta
    plats: efter-progression
    text: "Skrivande är ett verktyg för tanken och ett sätt att delta demokratiskt. När eleven ser sin tanke på tavlan, får svar eller vet att någon läser, märker hen att ord kan göra något och får färga världen med sina tankar. Börja nära, med en rad som klassen tänker på och sedan en läsare på skolan. Fråga först om mottagaren kan svara: ett litet ja från vaktmästaren ger mer än ett uteblivet svar från kommunhuset. Innan ni skickar texten frågar ni er: Vad vet vi säkert? Vem ska läsa, och vad behöver hen förstå? Vad vill vi att hen ska göra eller svara på?"
    kolumner: [Nivån, Så kan det se ut, Vem svarar]
    rader:
      - ["I klassen", "En elevs rad blir klassens fråga.", "Klassen"]
      - ["I skolan", "Ett förslag om skolgården, matsalen eller biblioteket.", "Elevrådet, vaktmästaren eller rektor"]
      - ["Hemma och i närheten", "Ett brev hem, eller en förklaring till en yngre klass.", "Någon hemma eller den andra klassen"]
      - ["Utanför skolan", "En insändare eller en fråga till en politiker.", "Någon som har lovat svara"]
  - rubrik: Utveckla metoden
    plats: efter-progression
    text: "När grunden sitter kan du bygga på med en sak i taget. Lektionens innehåll går först, och greppet är ett hjälpmedel."
    kolumner: [Det du bygger på, Så gör du]
    rader:
      - ["Idékorten", "Ta fram ett kort i taget och pröva ett uppslag i veckan. Kortet ger fältet Skriv för att, och uppslaget säger hur texten delas. I F–⁠3 passar tärningarna om ämnet, Frågetärningen och Vems ögon."]
      - ["Klassen väljer med pennan", "Böckerna går två platser åt höger, uppslagna vid raden med stjärna, och eleverna drar ett streck i kanten om de vill tänka på raden. Läsaren läser upp raden med streck, och du väljer en."]
      - ["Kan vi stanna och skriva?", "En elev får be om ett stopp, en gång per lektion."]
      - ["Frågelappar som flyttas", "Eleverna sätter sina frågor på tavlan, och klassen flyttar upp lappen när den kan visa svaret."]
      - ["Tänka, samtala, skriva", "Klassen samtalar och bygger en tankebank. Alla skriver en text som en kamrat läser: 20 minuter i stället för ställena."]
planeringsmall:
  bladEtikett: Material
  text: "Planeringsmallen är ingen ny planering. Skriv på den du har, eller på bladet när du vill. Det räcker med några rader: var eleverna skriver, vem som läser mitt i och frågan, som ofta räcker till alla ställena."
  fore:
    - { etikett: "Stanna och skriv", rader: ["Skriv för att:", "Ordagrant:"], falt: [syfte, fragan] }
    - { etikett: "Efter skrivandet", rader: ["Vem läser:", "Vad händer sedan:"], falt: [lasare, sedan] }
  delar:
    - { fas: Skriv först, skriv: "Frågan eller en elevs rad:", not: "Från vecka 4.", hojd: 0.8 }
    - { fas: Din planering, skriv: "En rad om det jag har planerat, och var jag stannar:", not: "Välj dagens ställen. Ni skriver högst omkring tolv minuter.", hojd: 0.9 }
    - { fas: Stanna och skriv, skriv: "Minuter. Så läser vi:", not: "Skriv första minuten, gå rundan, läs sex böcker och räkna tomt, bara det ni gjorde eller fel i sak. Första lektionen: bara tomt. Säg: Jag läste … Därför …", hojd: 1.1 }
    - { fas: Loggen, skriv: "Frågan:", not: "Från vecka 3: alla läser dagens text, skriver i annan färg och kan sätta stjärna.", hojd: 0.8 }
  beslut: { deFlesta: "Raderna jag lyfter:", halften: "Mina två texter:" }
  efter:
    text: "Fyll i samma dag, och en gång i veckan efter de fem böckerna."
    kontrollen: "Utan ett svar som håller: ___"
    hogar: "Böckerna jag läste: ___"
    sag: "Elevernas ord"
    nasta: "Nästa lektion börjar med"
    forst: "Jag går först till"
  overst: ["Frågorna och vem som läser"]
  kolumner: ["Vad jag gör och vad eleverna skriver"]
  sist: ["Efter lektionen: det jag läste, med elevernas ord", Nästa lektion]
observation:
  fraga: Vem läser texten, och vad händer sedan?
  text: "Skriv ut dubbelsidigt, och välj med läraren två elever att följa, A och B, gärna en som brukar bli sittande. Stå där du ser böckerna. Skriv ner frågorna och en elevmening ordagrant, och räkna hur många som kommer igång i Stanna och skriv. Fråga två elever vem som läser. Efteråt läser du sex böcker, och eleverna vet det."
  fokus: Krävde min fråga mer än att återge?
  huvud: ["Vem läser, och vad händer sedan"]
  kolumner:
    - { namn: Läraren frågar och säger, text: "frågan ordagrant, och det läraren säger", bredd: 30 }
    - { namn: Alla skriver, text: "skriver · tomt · annat", bredd: 13, elever: true }
    - { namn: Med texten, text: "vem som läser, och vad som händer med det som står", bredd: 34 }
  tecken: "+ skriver egna ord, 0 tomt, g bara det de gjorde, s skriver av."
  delar:
    - { fas: Skriv först, rader: 2, rakna: "Lektionen började med skrivande: ja · nej   Med en elevs rad: ja · nej" }
    - { fas: Din planering, rader: 1, rakna: "Ställen där eleverna skrev i lektionen: ___   Skrivminuter i hela lektionen: ___" }
    - { fas: Stanna och skriv, rader: 3, rakna: "Minuter: ___   Igång inom en minut: ___ av ___   Utan ett svar som håller: ___ av ___   Utfallet av sex böcker: högst 1 · 2 · 3 eller fler" }
    - { fas: Loggen, rader: 2, rakna: "Skrev det viktigaste med ett varför: ___ av ___   Rad i annan färg: ___ av ___" }
  streck:
    - { etikett: Medan eleverna skriver, drag: ["Läraren svarar på innehållet", "Läraren svarar på form, längd eller stavning", "Läraren hjälper en elev igång", "Läraren skriver själv"] }
  rader:
    - "Frågan krävde tänkande: ja · nej. Läraren hade visat ett svar: ja · nej. Gjorde det frågan bad om: __ av __"
    - "Skrev med egna ord: __ av __. Skriv en mening ordagrant"
    - "Eleverna kunde säga vem som läser: __ av __. Läste eller fick sin text läst: __ av __. Läsaren svarade på tanken: ja · nej"
    - "Skriv vad som hände med texterna. Böcker med en rad i annan färg i veckan, från vecka 3: __ av 6"

# ---------------------------------------------------------------------------------------------------------------------
# Bilaga B Valet och forskningen
# ---------------------------------------------------------------------------------------------------------------------
passar:
  rubrik: När passar metoden?
  kort: "eleverna ska reda ut ett innehåll med egna ord. Ska de minnas det säkert, välj Testbaserat lärande."
  rader:
    - { fraga: "Vad ska eleverna göra med innehållet?", metoden: "Reda ut, förklara, jämföra eller ta ställning.", annat: "Minnas det säkert. Då passar Testbaserat lärande, där eleverna svarar ur minnet och får ett facit." }
    - { fraga: "Vad vill du se?", metoden: "Hur de tänker, och att texten lever vidare.", annat: "Rätt eller fel på en minut. Då passar Formativ bedömning." }
    - { fraga: "Är innehållet nytt?", metoden: "Klassen skriver först vad den tror och reder ut det efter en genomgång, en text eller ett försök.", annat: "Ett nytt steg eller en procedur. Då passar Explicit undervisning, och eleverna skriver sedan." }
    - { fraga: "Vad ska ni läsa?", metoden: "Elevernas egna texter.", annat: "En svår text. Då passar Reciprok undervisning." }
    - { fraga: "Vill du ha fler med i samtalet?", metoden: "Skriv före samtalet, så att alla har något att säga.", annat: "Strukturer fördelar turerna i Kooperativt lärande, och metoderna går ihop." }
    - { fraga: "Är det skrivförmågan du vill utveckla?", metoden: "Målet ligger i ämnet, och skrivandet är ett verktyg.", annat: "Kortskrivning ger skrivflyt och mod i en grupp, och skrivkurserna i Stödundervisning ger texttyper." }
  tumregel: Fråga dig vem som läser och vad som händer sedan. Har du inget svar, är det något annat du behöver. Tabellen är ett stöd för tanken och ingen regel.
  metoder: [testbaserat-larande, formativ-bedomning, explicit-undervisning, reciprok-undervisning, kooperativt-larande]
invandningar:
  rubrik: Invändningar och nyanser
  fragor:
    - { fraga: "Lär man sig verkligen något av att skriva, eller blir det bara mer text?", svar: "Ja, i genomsnitt: eleverna lärde sig mer i 56 studier (Graham m.fl., 2020). Skrivandet gör det inte av sig självt, och omkring var femte studie gav ingen vinst (van Dijk m.fl., 2022). Det eleven gör med innehållet verkar avgöra. För att bli bättre på att skriva räcker det inte heller att bara skriva mer (Skar m.fl., 2024). Därför kommer skrivfrågan först, och därför visar du hur." }
    - { fraga: "Vidgar det inte klyftan när alla ska skriva själva?", svar: "Det kan det göra. Elever som behöver stöd fick stor effekt i tolv studier, men ingen effekt när ingen visade dem hur (Graham och Hebert, 2010). Därför visar du först, och den som behöver det får säga sin tanke innan hen skriver." }
    - { fraga: "Är inte loggen bara en exit-lapp?", svar: "Nej. Exit-lappen i Formativ bedömning skrivs med boken stängd, på en lapp som du samlar in och lägger i högar. Eleven läser först det hen skrev tidigare i lektionen och skriver loggen under det i boken. Ingen samlar in den, och en rad med stjärna kan bli nästa lektions fråga. I en lektion räcker en av dem: exit-lappen när du behöver veta vad klassen kan, och loggen när eleven behöver se vad hen tänker nu." }
    - { fraga: "Vad gör jag med AI?", svar: "Eleverna skriver på lektionen, för hand eller på sin skärm, så att tanken är deras. Använder ni AI gäller ordningen: eleven först, AI sedan, eleven sist." }
grund:
  rubrik: Det forskningen visar
  text:
    - "Elever som skriver om ett innehåll lär sig det bättre. I 56 studier, de flesta i USA, skrev elever 6–17 år i NO, SO och matematik. Effekten var g = 0,30, och 0,21 i de lottade studierna (Graham m.fl., 2020). Omkring var femte studie gav ingen vinst (van Dijk m.fl., 2022). Effekten skiljer sig inte säkert mellan ämnena och åldrarna, och är 0,29 för 6–10 år (Skolforskningsinstitutet, 2022). Att skriva om lästa texter gav 0,40 på normerade läsprov i åk 2–12 (Graham och Hebert, 2010)."
    - "Det är inte vilket skrivande som helst. Uppgifter där eleverna analyserar, tolkar och tänker över sin egen förståelse brukar ge mer än uppgifter där de återger, men skillnaderna mellan studier är inte säkra (Graham m.fl., 2020). Experiment med lärjournaler, mest på högskolan, visar att frågor ger mer lärande (Nückles m.fl., 2020). Ingen studie i skolan har prövat några minuter på valda ställen i lektionen flera gånger i veckan."
    - "Eleverna utvecklar sitt skrivande när de skriver om det de läser och lär sig, och när läraren också undervisar i skrivande. Program där eleverna i åk 6–12 skriver om lästa källor gav 0,10–0,53 på oberoende skrivprov (Slavin m.fl., 2019). I åk 1–⁠2 gav undervisning i NO och SO 0,24 och 0,44 på argumenterande skrivande (Kim m.fl., 2021), och i Norge gav skrivande i alla ämnen en säker effekt med start i åk 3 men inte med start i åk 6 (Berge m.fl., 2019). Mer skrivande för verkliga syften utan undervisning gav ingen säker skillnad i åk 1–⁠2 (Skar m.fl., 2024)."
    - "Att skriva för en läsare är prövat i en liten studie (Gunel m.fl., 2009). Ingen studie har prövat om eleverna lär sig mer när läraren använder texten. Tanken bygger på praktiken och på böcker utan svar (Ruiz-Primo m.fl., 2002). Skolforskningsinstitutet (2022) hittade ingen mer omfattande svensk interventionsstudie. I praktisk-estetiska ämnen finns ingen studie med jämförelsegrupp, och svenska ingår inte i Graham m.fl. (2020). Att eleverna deltar genom sina texter bygger på läroplanen och är inte mätt."
