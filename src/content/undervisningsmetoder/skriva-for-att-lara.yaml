titel: Skriva för att lära
undertitel: Så låter du alla elever tänka med pennan i dina vanliga lektioner, F–⁠9
alternativaNamn: ["Writing to learn", "Skriva för att tänka"]
ingress: "Skriva för att lära är ingen skrivkurs. Eleverna lär sig ämnet genom att skriva. Du stannar mitt i din vanliga lektion och ställer en fråga, och alla skriver några minuter för att reda ut sina tankar. Någon läser, och du bygger vidare på det de skrev. Ingen rättar texten, och den hamnar inte i en låda."
arskurs: ["F-3", "4-6", "7-9"]
arskursText: F–9
taggar: ["undervisningskvalitet", "skrivstrategier"]
slag: strategier
syfte: [tanka, ova]
tid: Din lektion, 45 minuter, minst två lektioner i veckan
hurOftaSkal: "I försöken med lärjournaler skrev eleverna en gång i veckan (Nückles m.fl., 2020). Två lektioner i veckan ger en rutin. Har du klassen en gång i veckan, stanna två gånger under lektionen."
period: Fem veckor att komma igång
material:
  - en skrivbok och en penna per elev
  - lektionskortet
  - bladen Rutan på tavlan och När jag fastnar
  - en klocka som alla ser
  - en penna i annan färg per elev
  - ett skrivkort första lektionen
uppdaterad: 2026-11-08
publicerad: 2026-11-08
