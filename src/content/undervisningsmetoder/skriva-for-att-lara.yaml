# 2 Lektionen
# ---------------------------------------------------------------------------------------------------------------------
tidsschema:
  rubrik: Lagret i din lektion
  minuter: 45
  rader:
    - { tid: Före lektionen, fas: Före lektionen, vad: "Skriv på tavlan en fråga som lektionen svarar på. Ofta räcker den till alla ställen du väljer. Bestäm vem som läser mitt i." }
    - { tid: 2 min, fas: Skriv först, form: Enskilt, var: i början, vad: "Där du vill, ofta före något nytt, skriver alla vad de tror och varför. Texten stannar hos eleven." }
    - { tid: 30 min eller mer, fas: Din planering, form: Läraren visar, ram: true, vad: "Du undervisar som du har planerat, och ställena ligger i din lektion." }
    - { tid: 5–⁠7 min, fas: Stanna och skriv, form: Enskilt, var: mitt i, vad: "Mitt i, när eleverna har något att reda ut, fyller du i rutan. Alla skriver, och den du skrev i rutan läser. Sedan säger du vad du läste och vad ni gör nu." }
    - { tid: 3 min, fas: Loggen, form: Enskilt, var: i slutet, vad: "I slutet, när något ska med till nästa gång, läser alla dagens text och skriver i annan färg det viktigaste nu, och varför." }
    - { tid: Efter lektionen, fas: Efter lektionen, vad: "Från vecka 4 läser du fem böcker per klass i veckan, på fem minuter. Läs raden i annan färg först, och dra en linje i kanten utan ord. Skriv en rad om hur nästa lektion börjar." }
  varianter:
    - nar: första lektionen
      text: "Ni stannar en gång mitt i och skriver tre minuter om dagens ämne. Loggen och Skriv först kommer senare."
      redo:
        nastanAlla: "Högst 5 av 28 tomma böcker, i rundan högst en av sex. Läs två meningar högt, och skriv en av dem på tavlan om eleven säger ja."
        deFlesta: "6–13 av 28, i rundan två av sex. Läs en mening högt och skriv den på tavlan, så att den som inte kom igång kan låna den."
        halften: "14 eller fler av 28, i rundan tre eller fler av sex. Skriv en mening ihop, och alla skriver en till. Nästa lektion övar ni en gång med ett skrivkort."
      delar:
        - { fas: Din planering, tid: 0–⁠20 min }
        - { fas: Stanna och skriv, tid: 20–⁠27 min, fraser: ["Vi skriver för att ta reda på vad vi tänker.", "Det här rättas inte.", "Jag läste … Därför …"] }
        - { fas: Din planering, tid: 27–⁠45 min, fraser: ["Nu fortsätter vi med det ni skrev."] }
    - nar: en lektion på 60 minuter eller mer
      text: "Ta gärna alla tre ställena, med Stanna och skriv efter ett försök eller något praktiskt eleverna har gjort."
      delar:
        - { fas: Skriv först, tid: 0–⁠2 min }
        - { fas: Din planering, tid: 2–⁠25 min }
        - { fas: Stanna och skriv, tid: 25–⁠32 min }
        - { fas: Din planering, tid: 32–⁠57 min }
        - { fas: Loggen, tid: 57–⁠60 min }
    - nar: i idrottshallen
      text: "Ha skrivböckerna i en back vid väggen. Stanna när klassen samlas: eleverna skriver två minuter med boken i knät, eller säger tanken till axelkompisen och skriver en rad när ni är tillbaka."
      delar:
        - { fas: Din planering, tid: 0–⁠25 min }
        - { fas: Stanna och skriv, tid: 25–⁠31 min }
        - { fas: Din planering, tid: 31–⁠45 min }
  efter: "Skrivandet tar högst omkring tolv minuter av lektionen, på de ställen du väljer. Bara Stanna och skriv har hela varvet med läsaren, och det gör ni minst en gång i veckan."
steg:
  rader:
    - namn: Skriv först
      vem: i början, från vecka 4
      fraga: "Vad tänker de innan jag har sagt något?"
      alla: Skriver en gissning med ett varför, eller svarar på en kamrats rad.
      titta: "Vem har börjat? Vad tror klassen redan?"
      beslut: Börja undervisa i en tanke du läste. Tar ni inte loggen i dag, kom tillbaka till gissningen när svaret kommer.
      gor:
        - "Skriv frågan på tavlan, som ”Vad händer med vattnet när det kokar? Vad tror du, och varför?”"
        - "Bygger lektionen på förra, skriv en rad med stjärna, med namn om ringen saknas: ”Elias skrev …” ”Stämmer det? Hur vet du?”"
