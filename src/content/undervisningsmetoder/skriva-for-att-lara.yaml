    - { vecka: "5", stallen: [Skriv först, Stanna och skriv, Loggen], led: Någon svarar, rubrik: Byt böcker och svara, eleverna: "Att byta böcker, dra en linje där texten gör det rutan säger och svara med kortet Så svarar vi.", roll: "Att visa svar på din text, och låta eleven välja vad hen gör med svaret.", vidare: "nästan alla svar säger något om innehållet", fraga: "Sa nästan alla svar något om innehållet?" }
