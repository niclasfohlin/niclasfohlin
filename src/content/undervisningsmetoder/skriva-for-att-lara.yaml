profil:
  evidens:
    larande:    { tillforlitlighet: mattlig, effekt: mattlig, kort: "Att skriva om innehållet ger ämneskunskaper. Att använda texten är inte prövat.", motivering: "Måttlig tillförlitlighet, måttlig effekt. Elever 6–17 år skrev om innehållet i NO, SO och matematik: g = 0,30 i 56 studier och 0,21 i de lottade. Spridningen är stor, och läsaren och hur texten används är inte mätta (Graham m.fl., 2020).", kallor: [graham-m-fl-2020, graham-och-perin-2007] }
    lasning:    { tillforlitlighet: hog, effekt: mattlig, motivering: "Hög tillförlitlighet, måttlig effekt. Att skriva om lästa texter gav 0,40 på normerade prov i 11 studier, åk 2–12 (Graham och Hebert, 2010), men ett program i åk 1–⁠2 gav ingen effekt på läsprovet i 30 skolor (Kim m.fl., 2021).", kallor: [graham-och-hebert-2010, kim-m-fl-2021] }
    skrivning:  { tillforlitlighet: mattlig, effekt: mattlig, motivering: "Måttlig tillförlitlighet, måttlig effekt. Stödet gäller program i åk 6–12 där eleverna skriver om lästa källor: 0,10–0,53 på oberoende prov (Slavin m.fl., 2019). Mer skrivande utan undervisning gav ingen säker skillnad i åk 1–⁠2 (Skar m.fl., 2024).", kallor: [slavin-m-fl-2019, kim-m-fl-2021, berge-m-fl-2019, skar-m-fl-2024] }
    matematik:  { tillforlitlighet: lag, effekt: mattlig, motivering: "Låg tillförlitlighet, måttlig effekt. Skrivande om matematiken gav g = 0,32 i 21 studier, åk 1–12, mest i USA. Ingen stor lottad studie finns, och det går inte att se hur många studier som var lottade (Graham m.fl., 2020).", kallor: [graham-m-fl-2020] }
    amnen:      { tillforlitlighet: mattlig, effekt: liten, motivering: "Måttlig tillförlitlighet, liten effekt. NO gav 0,31 i 26 studier och SO 0,31 i 8 (Graham m.fl., 2020), men ingen säker effekt på NO-proven i 48 skolor (Hand m.fl., 2018). Teknik är inte redovisat för sig.", kallor: [graham-m-fl-2020, hand-m-fl-2018] }
    socialt:    { tillforlitlighet: lag, effekt: ingen, motivering: "Låg tillförlitlighet, ingen effekt. Ingen studie med jämförelsegrupp. I ett danskt projekt såg lärarna att nästan alla deltog när eleverna hade skrivit först (Lützen och Nielsen, 2025).", kallor: [l-tzen-och-nielsen-2025] }
  svarighet: { lara: 3, karnan: 3, stod: 3, tid: 3, motivering: "Klassen lär sig att skriva utan rättning, och du lär dig ställa frågan och använda texten. Kärnan glider lätt mot ifyllnad och en bok som ingen öppnar, men en kollega kan se det." }
  kostnad:   { kop: 2, timmar: 14, motivering: "Skolan har skrivböcker och pennor. Omkring 14 timmar första läsåret går till att läsa metoden, fyra möten, samtalen efter besöken och en timme i veckan för frågorna de fem första veckorna." }
  urval:
    datum: 2026-11-07
    regel: "Insatser räknas när eleverna skriver om ämnets innehåll eller en läst text för att lära sig innehållet, mot en grupp som inte skriver om det eller skriver mindre. Program där skrivandet är en del räknas också, som Science Writing Heuristic och MORE. I Skrivning räknas också program där eleverna skriver om lästa källor, som CRWP och Pathway. Utvecklarna är Hand, Nückles, Collins, Kim, Berge, Olson och National Writing Project. Räknas inte: undervisning i att skriva utan ämnesinnehåll, expressivt skrivande och skrivande om egna värderingar, högskolestudier och automatisk återkoppling."
    text: "Vi sökte 2026-11-07 i sammanställningar, följde referenserna i Graham m.fl. (2020), sökte i ERIC område för område och gjorde enkla sökningar på webben. Skrivandet fick en egen sökning, eftersom den första frågade om ämneskunskaper. Vi valde femton källor, de som varje område vilar på, och två granskare prövade urvalet."
    slutsatser:
      oversikt: "Att skriva om ett innehåll ger mer kunskap om det i NO, SO och matematik i alla åldrar, och effekten är omkring 0,2–0,3 (Graham m.fl., 2020; Graham och Perin, 2007). Att skriva om lästa texter lyfter läsförståelsen (Graham och Hebert, 2010). Uppgifter med analys och reflektion ger ofta mer, men det är inte säkert. Program där eleverna skriver om lästa källor gav bättre skrivande på oberoende prov (Slavin m.fl., 2019). Ingen översikt mäter om texten delades eller användes."
      experiment: "Skrivande med undervisning i ämnet gav bättre skrivande i åk 1–⁠2 (Kim m.fl., 2021) och i åk 3 (Berge m.fl., 2019), men inte säkert i åk 6. Mer skrivande utan undervisning gav ingen säker skillnad (Skar m.fl., 2024), och ett program i NO gav ingen säker effekt på NO-proven (Hand m.fl., 2018). Med kamrater eller yngre som läsare förstod eleverna mer än med läraren (Gunel m.fl., 2009)."
      annan: "Frågor i lärjournaler hjälper lärandet, och det är mest visat på högskolan (Nückles m.fl., 2020). Eleverna skriver mest korta texter för läraren (Sturk, 2022), och skrivböcker utan svar utvecklar inte eleverna (Ruiz-Primo m.fl., 2002). Lärare ser fler delta när klassen använder texterna (Lützen och Nielsen, 2025). Skolforskningsinstitutet (2022) ger forskningen på svenska."
    uteslutna:
      - { namn: "Yu m.fl. (2021)", skal: "Jämförelsegruppen skrev också, så studien prövar inte metoden" }
      - { namn: "Graham m.fl. (2023)", skal: "Metaanalys av skrivundervisning, annat innehåll" }
      - { namn: "Wu m.fl. (2021)", skal: "Skrivande om värderingar, annan insats" }
      - { namn: "Hattie (2009)", skal: "En översikt av metaanalyser, som inte räknas för nivån" }

# ---------------------------------------------------------------------------------------------------------------------
# 1 Metoden
# ---------------------------------------------------------------------------------------------------------------------
inledning:
  - "Skriva för att lära handlar om att skrivande är ett sätt att tänka. Du stannar mitt i din vanliga lektion och ställer en fråga, och alla skriver några minuter för att ta reda på vad de tänker. Det kan bli en logg, en lista eller några tankar. Någon läser, och det eleverna skrev tar lektionen vidare. Metoden är ingen skrivkurs och ingen ny planering, bara ett lager över den du har. Vad eleverna ska lära sig kommer från dig och kursplanen, och skrivandet är ett sätt att ta sig dit. Det räcker inte att eleverna skriver, för en text som ingen läser och ingen använder blir lätt ren rutin."
  - "I vilket ämne som helst står din planering kvar: en genomgång, ett försök eller något eleverna skapar. På ett ställe stannar du och fyller i Rutan på tavlan: ”Skriv för att”, hur länge, vem som läser och vad som händer sedan. Du skriver frågan på tavlan, och första minuten skriver du själv. Varje elev har sin skrivbok framme och skriver med egna ord tills klockan ringer, och du läser över axeln. Sedan läser någon texten, ofta axelkompisen. Du säger vad du läste och skriver elevernas ord på tavlan."
  - "Eleven lär sig av det hen gör med innehållet. Den som måste förklara, jämföra eller ta ställning med egna ord märker vad hen förstår och vad som saknas, och svaret går inte att skriva av. Därför kommer frågan först, och du visar hur ett svar kan se ut. Ingen rättar, eftersom tanken får vara på väg. Någon läser, eftersom ord betyder mer när de används. Sedan skriver eleven en rad till och kommer vidare i tanken. När en elevs rad blir klassens nästa fråga märker eleverna att deras tankar färgar lektionen och att ord kan göra något. Skrivandet blir ett verktyg för tanken och ett sätt att delta."
  - "De första veckorna stannar du minst två gånger i veckan och lägger till en sak i taget. Vecka 1 börjar ni med ett skrivkort, en bild att skriva om, så att inget kan bli fel. Alla läser en mening för axelkompisen. Vecka 2 visar du två texter bredvid varandra, så att eleverna ser vad en förklaring gör, och du byter frågan tills den kräver mer än att återge. Vecka 3 byter eleverna böcker och skriver en rad till. Vecka 4 börjar en lektion med en elevs rad, och du läser fem böcker i veckan på fem minuter. Vecka 5 svarar eleverna varandra skriftligt. Sedan är skrivandet något klassen gör för att tänka. En gång per arbetsområde skickar ni en text till någon utanför klassen som har lovat svara."
karna:
  rubrik: "Kärnan: fast och fritt"
  text: "Du lägger lagret över din egen planering, och kärnans fyra delar håller ihop det. Grundidén är att eleven lär sig när hen själv bearbetar innehållet med egna ord, och att en text som någon läser och använder ger mer än en text i en låda. Den första halvan har studier bakom sig. Den andra bygger mest på praktiken och på en liten studie om läsaren. Mer skrivande räcker inte: studierna pekar på frågan, på att du visar hur, och på att eleven får svar och skriver vidare i sin text."
  grundregel: De fyra är kärnan, och dem håller du fast vid. Rutans fält håller dem framme. Ämnet, formen, tiden, vem läsaren är och hur texten används väljer du själv.
  varv: Du frågar, alla skriver, någon läser, och texten tar lektionen vidare.
  komponenter:
    - namn: En fråga som kräver tänkande
      moment: [Stanna och skriv]
      vad: "Frågan får alla att bearbeta innehållet: förklara, jämföra, ta ställning eller säga vad de inte förstår."
      syns: Eleverna skriver med egna ord om ett varför eller ett val, som en förklaring i NO, och svaret kräver mer än att återge.
      raknas: false
      varfor: "Den som bara återger bearbetar lite. Uppgifter med analys gav 0,36 mot 0,18 för återgivning, och frågor om den egna förståelsen 0,40 mot 0,15, men skillnaderna mellan studier är inte säkra (Graham m.fl., 2020). I experiment lärde sig studenter mer med frågor (Nückles m.fl., 2020)."
      belagg: provad
      kallor: [graham-m-fl-2020, n-ckles-m-fl-2020]
      kvar: Frågan kräver mer än att skriva av eller berätta vad ni gjorde, och eleverna har sett hur ett svar kan se ut.
      fritt: "Ämnet, formen (logg, lista eller tankar) och stöd som en mening att börja med."
      kryss: Frågan krävde mer än att återge, och jag hade visat hur.
    - namn: Alla skriver för att tänka
      moment: [Stanna och skriv]
      vad: Alla skriver samtidigt med egna ord, och ingen rättar.
      syns: "Efteråt har varje elev egna ord i sin text, som en mening, en lista eller en skiss med ord, och alla skriver tills tiden är slut."
      varfor: "I klassens samtal deltar få (Lützen och Nielsen, 2025). Komponenten finns i studierna med effekt, där eleverna själva skrev om innehållet (Graham m.fl., 2020), och bygger på att en text utan krav på form lämnar kraft åt tanken (Nückles m.fl., 2020)."
      belagg: i-alla
      kallor: [graham-m-fl-2020, l-tzen-och-nielsen-2025, n-ckles-m-fl-2020]
      kvar: Alla formulerar sig med egna ord, och ingen rättar texten.
      fritt: "Tiden, oftast två till fem minuter. Papper, skrivbok eller skärm. Språket, en skiss med ord, och att eleven säger och någon skriver."
      kryss: Alla skrev med egna ord, och jag rättade inget.
    - namn: Eleven vet vem som läser
      moment: [Stanna och skriv, Läsaren]
      vad: "Före skrivandet säger du vem som läser: eleven själv, en kamrat, klassen eller någon utanför."
      syns: Eleverna kan säga vem som läser, och läsaren läser för att förstå, som en kamrat som svarar på tanken.
      varfor: "Den som bara skriver för läraren skriver för att visa vad hen kan (Sturk, 2022). En studie visar bättre begreppsförståelse när elever skrev för kamrater eller yngre elever än för läraren eller föräldrarna (Gunel m.fl., 2009)."
      belagg: provad
      kallor: [gunel-m-fl-2009, sturk-2022]
      kvar: Du säger vem som läser innan eleverna skriver, ofta en annan än du, och ingen delar en text utan att eleven vet det.
      fritt: "Vem som läser, också eleven själv, och om namnet står med."
      kryss: Jag sa i förväg vem som läser, och fler än jag läste.
    - namn: Texten tar lektionen vidare
      moment: [Läsaren, Tillbaka till texten, Nästa steg]
      vad: "Elevernas meningar blir lektionens stoff: samtalet, nästa fråga eller elevens egen text bygger på dem."
      syns: Klassen använder elevernas meningar i lektionen eller nästa lektion, och varje vecka skriver alla en rad i annan färg.
      raknas: false
      varfor: "Texter som ingen svarar på kan bli ren rutin: i tio klasser i åk 5 blev texterna inte bättre, och fyra lärare svarade (Ruiz-Primo m.fl., 2002). Komponenten bygger på praktiken (Lützen och Nielsen, 2025) och på att eleven lär sig när hen läser om, får svar och skriver vidare (van Dijk m.fl., 2022)."
      belagg: teori
      kallor: [ruiz-primo-m-fl-2002, l-tzen-och-nielsen-2025, van-dijk-m-fl-2022]
      kvar: Eleverna gör något med texten, så som du bestämde, och från vecka 3 skriver alla en rad till varje vecka.
      fritt: "Vägen: samtalet, tavlan, nästa skrivfråga eller nästa lektions start. Raden kan följa ett svar, en rad på tavlan eller din linje. I F–⁠1 räcker ett ord eller en bild."
      kryss: Eleverna gjorde något med texten, i dag eller nästa lektion.
roll:
  rubrik: "Lärarens roll: du läser vad texten säger"
  text: Före lektionen skriver du tre rader på din planering. I lektionen rättar du inte texterna. Du läser vad de säger och låter det ta lektionen vidare.
  fragor:
    - Vad skriver alla?
    - Vad säger texterna?
    - Vad händer med dem nu?
  fragornaText: "Den sista frågan svarar du på högt: ”Jag läste … Därför …”, eller med en elevs rad på tavlan."

# ---------------------------------------------------------------------------------------------------------------------
# 2 Lektionen
# ---------------------------------------------------------------------------------------------------------------------
tidsschema:
  rubrik: Lagret i din lektion
  rader:
    - { tid: Före lektionen, fas: Före lektionen, vad: "Skriv tre rader på din planering: var ni stannar, frågan, och vem som läser och vad som händer sedan. Ta gärna en ur Skrivfrågor att låna, och svara själv på den." }
    - { tid: 3–⁠5 min, fas: Tillbaka till texten, form: Gemensamt, vad: "Från vecka 4 börjar en lektion i veckan med det ni skrev: en elevs rad blir klassens fråga, och alla skriver två minuter." }
    - { tid: 10 min eller mer, fas: Din planering, form: Läraren visar, vad: "Du undervisar som du har planerat, och stannar där eleverna behöver reda ut något. En gång per arbetsområde visar du två egna texter innan ni stannar." }
    - { tid: 2–⁠5 min, fas: Stanna och skriv, form: Enskilt, vad: "Du fyller i Rutan på tavlan och skriver frågan, alla skriver till klockan ringer, och du läser över axeln." }
    - { tid: 2–⁠5 min, fas: Läsaren, form: I par, vad: "Den du sa läser texten: eleven själv, axelkompisen eller någon annan." }
    - { tid: 1 min och sedan vägen, fas: Nästa steg, form: Gemensamt, vad: "Du säger vad du läste och vad ni gör nu, och skriver elevernas ord på tavlan. Sedan fortsätter du din lektion med det de skrev." }
    - { tid: Efter lektionen, fas: Efter lektionen, vad: "Från vecka 4 läser du fem böcker per klass i veckan, på fem minuter. Läs raden i annan färg först, och dra en linje i kanten utan ord. Skriv en rad om hur nästa lektion börjar." }
  varianter:
    - nar: första lektionen
      text: "Sista kvarten går till skrivkortet."
      redo:
        nastanAlla: "Högst 5 av 28 tomma böcker, i rundan högst en av sex. Läs två meningar högt, och skriv en av dem på tavlan om eleven säger ja."
        deFlesta: "6–13 av 28, i rundan två av sex. Läs en mening högt och skriv den på tavlan, så att den som inte kom igång kan låna den."
        halften: "14 eller fler av 28, i rundan tre eller fler av sex. Visa din text om kortet, och skriv en mening ihop på tavlan som alla får låna. Alla skriver en mening till."
      delar:
        - { fas: Din planering, tid: 0–⁠30 min }
        - { fas: Stanna och skriv, tid: 30–⁠37 min, fraser: ["Vi skriver för att ta reda på vad vi tänker.", "Det här rättas inte."] }
        - { fas: Läsaren, tid: 37–⁠42 min, fraser: ["Tack för att du läste."] }
        - { fas: Nästa steg, tid: 42–⁠45 min, fraser: ["Jag läste … Därför …"] }
    - nar: en lektion på 60 minuter eller mer
      text: "Stanna gärna två gånger, och låt en av gångerna följa ett försök eller något praktiskt eleverna har gjort. Den andra gången räcker en rad till."
      delar:
        - { fas: Din planering, tid: 0–⁠40 min }
        - { fas: Stanna och skriv, tid: 40–⁠45 min }
        - { fas: Läsaren, tid: 45–⁠50 min }
        - { fas: Nästa steg, tid: 50–⁠52 min }
  efter: "Lagret tar omkring tolv minuter, men du använder inte alla ställen varje gång. Tillbaka till texten kommer från vecka 4, en gång i veckan. Ibland stannar texten hos eleven, och det säger du i förväg. Ett svar som håller svarar på frågan och stämmer."
steg:
  rader:
    - namn: Tillbaka till texten
      fraga: "Vilken rad är värd att tänka på?"
      alla: Skriver två minuter om en kamrats rad, eller läser sin egen rad och skriver en rad till.
      titta: "Har tanken flyttat sig? Vem håller med, och vem prövar raden?"
      beslut: Ta upp en sak, och gå till din planering inom fem minuter.
      gor:
        - "Skriv en rad med stjärna och elevens namn på tavlan. ”Elias skrev: Antalet trehjulingar måste vara udda.”"
        - "Stjärnan är elevens ja. En ring runt stjärnan betyder utan namn, och fel i sak tar du upp utan namn."
        - "Fråga: ”Stämmer det? Hur vet du?” Alla skriver två minuter."
        - "Låt dem läsa en mening för axelkompisen. Lyssna på två par, och gå till din planering."
      fraser: ["Elias skrev …", "Stämmer det? Hur vet du?"]
    - namn: Din planering
      vem: som du har planerat
      fraga: "Var behöver de reda ut något?"
      alla: Lyssnar, läser, tittar eller arbetar och har skrivboken framme.
      titta: "När har de något att säga?"
      beslut: Stanna där du bestämde, eller senare om begreppet är för nytt. Korta genomgången om tiden är knapp.
      gor:
        - "Stanna efter ett avsnitt, en bild eller ett försök, oftast efter tio till tolv minuter. Två egna texter visar du först."
        - "Säg gärna: ”Snart stannar vi och skriver.”"
        - "Stanna före ett samtal, så att alla har något att säga."
      fraser: ["Snart stannar vi och skriver."]
    - namn: Stanna och skriv
      fraga: "Går svaret att återge? Vem kommer inte igång?"
      alla: Skriver med egna ord till klockan ringer.
      titta: "Vem har inte börjat? Står det vad ni gjorde, eller varför?"
      beslut: Välj en eller två rader att lyfta, och fråga lågt om du får använda dem. Är det tomt hos många, gå till Nästa steg.
      gor:
        - "Fyll i rutan: Skriv för att (förklara, jämföra, ta ställning), Tid, Vem läser, Sedan. Skriv frågan och tre ämnesord på tavlan."
        - "Starta klockan och skriv själv första minuten vid bänken där du börjar rundan. Fastnar du själv, säg en mening högt."
        - "Gå rundan, och stanna först kort hos de två du vill hjälpa."
        - "Läs sedan sex böcker, också medan paren läser. Räkna dem utan ett svar som håller: tomt, bara det ni gjorde eller fel i sak."
        - "Säg inget om stavning eller längd, bara: ”Skriv tills klockan ringer.” Den som är klar lägger till varför eller skriver en fråga."
      fraser: ["Vi skriver för att ta reda på vad vi tänker.", "Jag vill se hur du tänker.", "Det här rättas inte.", "Skriv tills klockan ringer."]
    - namn: Läsaren
      fraga: "Läser de det som står?"
      alla: Läser, lyssnar och tackar, säger vad de läste eller skriver en rad till.
      titta: "Talar paren om innehållet? Vem står över?"
      beslut: Vill någon inte läsa, gå vidare utan att säga något. Lyssna gärna på två par.
      gor:
        - "Vecka 1–⁠2: be dem läsa en mening för axelkompisen. Den som lyssnar tackar."
        - "Från vecka 3: låt dem byta böcker, läsa tyst, dra en linje där texten gör det rutan säger, och säga vad de läste."
        - "Från vecka 3, varje vecka: be alla ta en annan penna och skriva en rad till med det som saknas, eller ”Nu tänker jag …”"
        - "Från vecka 5: låt dem svara kamraten med en rad: ”Jag läser att … Jag undrar …”"
      fraser: ["Tack för att du läste.", "Byt böcker. Läs tyst."]
    - namn: Nästa steg
      vem: "alla, sedan var och en"
      fraga: "Vad ändrar texterna i det jag gör nu?"
      alla: Hör vad du läste och vad ni gör nu, och ser sina egna ord på tavlan.
      titta: "Följer nästa steg det du läste? Är det elevernas ord som står på tavlan?"
      beslut: Ett av tre utfall, nedan. Talen är hållpunkter.
      gor:
        - "Säg på en halv minut: ”Jag läste … Därför …”"
        - Skriv elevernas ord på tavlan, så att ingen behöver hålla dem i huvudet.
        - "Från vecka 4, sista minuten i lektionen: ”Sätt en stjärna vid raden du vill ta med.”"
      fraser: ["Jag läste … Därför …", "Sätt en stjärna."]
      redo:
        nastanAlla: "Högst 5 av 28 utan ett svar som håller, i rundan högst en av sex. Läs två rader högt, och gör det du skrev i rutan."
        deFlesta: "6–13 av 28, i rundan två av sex. Läs en eller två rader, säg vad raden gör och vad som stämmer. Alla läser sin text och skriver en rad till."
        halften: "14 eller fler av 28, i rundan tre eller fler av sex. Visa två egna texter om något annat, och alla skriver igen."
        tiden: "Tiden räcker inte: böckerna ligger kvar, och nästa lektion börjar där. Blir det hälften igen, byt frågan eller vänta med skrivandet."
lektionskort:
  - { efter: klassen, text: "Lektionskortet är ett eget A4 att ha i handen, med det du gör på varje ställe i din lektion." }
fastnar:
  rubrik: Så stöttar du
  text: Du rättar inte texten. I rundan säger du en sak, och resten tar du med hela klassen.
  trappa:
    - "Säg vad du läser: ”Jag läser att du tänker …”"
    - Dra en rak linje vid raden som håller.
    - "Fråga efter det eleven nästan har skrivit: ”Berätta mer om …”, ”Hur vet du?”"
    - Står det fel i sak, säg i Nästa steg vad som stämmer, utan namn, och låt alla skriva en rad till.
  motto: Du läser vad texten säger.
amnesexempel:
  - amne: lasning
    arskurs: åk 2
    innehall: Att läsa en berättelse och förutspå vad som händer
    overst:
      egen: "Skriv vad du tror händer nu, och varför. Felet: en gissning utan något ur berättelsen."
      visar: Eleverna ritar och skriver ord i skrivboken och läser för axelkompisen.
    scen:
      - "Tänk dig högläsningen i åk 2. Mitt i kapitlet stannar du. Pojken har gömt nyckeln, och du fyller i rutan: Skriv för att gissa och säga varför. Tid tre minuter. Vem läser: din axelkompis. Sedan läser vi vidare."
      - "”Vad tror du händer nu? Rita och skriv ord. Skriv varför.” Du skriver själv första minuten och går sedan runt. Fyra av 26 har bara en bild, och du skriver deras ord under bilden. Tuva har skrivit: ”dom kommer inte in för nykeln är borta”. Du frågar lågt om du får läsa upp den."
      - "Paren läser. I Nästa steg lyfter du Tuvas rad: ”Jag läste att Tuva tror att de inte kommer in. Därför lyssnar vi efter nyckeln.” Du läser vidare, och klassen hör hur det går."
    notera: "Notera vad som hände. Stavningen fick stå som den var, och ingen rättade. Hade fler bara ritat, hade du skrivit en mening ihop med klassen först."
  - amne: skrivning
    arskurs: åk 8
    innehall: Att argumentera för något som angår en, med skäl och motskäl
    overst:
      egen: "Ska lunchrasten bli längre? Felet: en åsikt utan skäl, eller bara den egna sidan."
      visar: Alla skriver ett skäl och ett motskäl i skrivboken, och raderna blir en gemensam text.
    scen:
      - "Tänk dig en lektion i svenska i åk 8. Elevrådet ska tycka till om lunchrasten, och du fyller i rutan: Skriv för att ta ställning. Tid fyra minuter. Vem läser: en kamrat, och sedan elevrådet med klassens text. Sedan: svar på fredag."
      - "Alla skriver vad de tycker, varför, och vad någon som inte håller med skulle säga. Du har frågat elevrådet: ”Kan ni svara med en mening på fredag, och ställa en fråga tillbaka?”"
      - "Böckerna går två steg åt höger, och alla läser. I Nästa steg sätter klassen ihop en text av raderna med stjärna. Innan ni skickar texten frågar du: ”Vad vet vi säkert? Vad vill vi att de ska svara på?”"
      - "På fredag läser du svaret högt: ”Vad ska kortas i stället?” Klassen skriver en rad till."
    notera: "Notera vad som hände. Du hade beställt svaret, så det kom. Eleverna såg att deras ord gjorde något, och frågan tillbaka blev nästa skrivfråga."
  - amne: matematik
    arskurs: åk 4
    innehall: Att lösa problem och resonera om sin lösning
    overst:
      egen: "Tvåhjulingar och trehjulingar, 21 hjul. Felet: en lösning, utan att visa att det inte finns fler."
      visar: Alla skriver hur de vet, och paren jämför sina texter.
    scen:
      - "Tänk dig en lektion i matematik i åk 4. På parkeringen står tvåhjulingar och trehjulingar, och tillsammans har de 21 hjul. Eleverna har hittat 9 tvåhjulingar och 1 trehjuling, 6 och 3, eller 3 och 5."
      - "Du fyller i rutan: Skriv för att visa hur du tänker. Tid fyra minuter. Vem läser: din axelkompis. Sedan: ni jämför. ”Har du hittat alla lösningar? Hur kan du vara säker på det?” I rundan läser du sex böcker: fyra har bara svaret. Det är tre eller fler. Paren läser och jämför, och i Nästa steg visar du hur."
      - "Du skriver två egna texter bredvid varandra om ett annat problem, en med bara svaret och en som säger hur du vet. ”Vad gör den andra texten?” Paren svarar, klassen skriver en mening ihop, och alla skriver igen om hjulen."
    notera: "Notera vad som hände. Klassen hade inte sett en förklaring i matematik. Nästa lektion börjar med Elias rad: ”Antalet trehjulingar måste vara udda.” Hur många kan det vara som mest? Då hittar klassen 7, utan tvåhjulingar."
  - amne: so-no
    amnesnamn: NO
    arskurs: åk 5
    innehall: Avdunstning, och att skilja på vad vi gjorde, vad vi såg och varför
    huvud: true
    overst:
      mal: förklara vart vattnet tar vägen när det avdunstar
      belagg: "Vart tog vattnet vägen? Skriv vad vi såg och varför."
      forberett: två egna texter om en pöl som fryser, och ord med bild
      redo: I rundan räknar jag böcker utan ett svar som håller
      egen: "Vad vi gjorde, vad vi såg och varför. Felet: Vi kokade vatten. Det försvann."
      visar: Alla skriver i skrivboken, och kamraten drar en linje där sambandet syns.
    delar:
      - { fas: Före lektionen, celler: ["Rutan: förklara varför, fyra minuter, axelkompisen, sedan en rad till"] }
      - { fas: Tillbaka till texten, celler: ["Inget i dag"] }
      - { fas: Din planering, celler: ["Försöket med kastrullen och pölen i solen"] }
      - { fas: Stanna och skriv, celler: ["Vart tog vattnet vägen? Skriv vad vi såg och varför."] }
      - { fas: Läsaren, celler: ["Byt böcker. Dra en linje där sambandet syns."] }
