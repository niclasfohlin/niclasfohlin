passar:
  rubrik: När passar metoden?
  kort: "innehållet går att bygga i små steg från det eleverna kan. Är det helt nytt, passar Explicit undervisning bättre."
  rader:
    - { fraga: "Vad ska eleverna lära sig?", metoden: "Något som går att bygga i små steg från det de redan kan, som ett mönster, en regel eller ett begrepp.", annat: "Något helt nytt, som de inte har något att bygga på. Då passar Explicit undervisning." }
    - { fraga: "Hur unga är eleverna?", metoden: "Från F–⁠3, med par, A3 på väggen och korta uppgifter.", annat: "För elever i åk 2–⁠5 gick trenden mot genomgång först (Sinha och Kapur, 2021). Är innehållet helt nytt för dem, visa ett exempel först och låt grupperna ta uppgifterna sedan." }
    - { fraga: "Vad ska klassen öva?", metoden: "Att tänka och resonera tillsammans och att pröva sina svar.", annat: "Samarbete med roller och strukturer. Då passar Kooperativt lärande." }
    - { fraga: "Hur många elever är det?", metoden: "Hela klassen, med en tavla per grupp om tre.", annat: "En liten grupp som jämför två lösningar av ett rikt problem: Problemlösning i grupp i Stödundervisning." }
  tumregel: "Välj tänkande klassrum när eleverna kan börja själva och innehållet går att bygga i små steg. Ska de lära sig något helt nytt, visa först. Valkartan är ett stöd för tanken och ingen regel."
  metoder: [explicit-undervisning, kooperativt-larande]
invandningar:
  rubrik: Invändningar och nyanser
  fragor:
    - { fraga: "Är det bevisat att eleverna lär sig mer?", svar: "Nej. Ingen studie med jämförelsegrupp i grundskolan har mätt det. Delar av metoden har stöd var för sig. I ett skoldistrikt och i en lärares klasser gick eleverna mer framåt, men det kan bero på lärarna (Haber, 2024; Doblar, 2024). En studie i åk 6 prövade en del av metoden, gruppdiskussion med helklassdiskussion, och fann ingen säker skillnad mot genomgång (Göteborgs universitet, 2026)." }
    - { fraga: "Är det inte bara whiteboards och lottade grupper?", svar: "Grupperna och tavlan får alla att tänka, men utan den stegrande svårighetsgraden, dina drag och konsolideringen blir det aktivitet. Liljedahl mätte engagemang och inte lärande (Liljedahl, 2016)." }
    - { fraga: "Ska inte eleverna få se hur man gör först?", svar: "Problem före genomgång gav mer förståelse men inte bättre procedurer, och för de yngsta gick trenden åt andra hållet (Sinha och Kapur, 2021). Därför börjar uppgifterna där alla kan, och konsolideringen visar sättet." }
    - { fraga: "Gör inte en elev allt?", svar: "Det kan hända, också vid tavlan (Håll, 2026). Därför byter pennan hand vid varje ruta, och i konsolideringen förklarar en elev från en annan grupp." }
grund:
  rubrik: Det forskningen visar
  text:
    - "Metoden kommer ur femton års designforskning i kanadensiska klassrum, där Liljedahl ändrade ett grepp i taget och behöll det som fick fler elever att tänka längre. Lodräta tavlor gav mer iver, samtal och uthållighet än papper vid bänken, och synligt lottade grupper ändrade samarbetet på två till tre veckor. Men det som mättes var engagemang i gymnasiet och inte vad eleverna lärde sig (Liljedahl, 2016)."
    - "Ingen studie med jämförelsegrupp i grundskolan har mätt metoden med dess kärna. I ett skoldistrikt gick eleverna mer framåt på ett prov hos lärare som använde metoden (Haber, 2024), och en lärare i USA redovisade sina klasser i åk 6 i två läsår på delstatsprovet och en klass i åk 5 en termin på ett annat prov, och eleverna gick mer framåt än väntat (Doblar, 2024). Skillnaderna kan bero på lärarna, och Doblars elever hade första året också extra tid varje dag. En svensk lottad studie i åk 6 prövade gruppdiskussion med helklassdiskussion ur gruppernas resonemang och fann ingen säker skillnad mot genomgång (Göteborgs universitet, 2026)."
    - "Delar av metoden har stöd var för sig, och den stegrande svårighetsgraden och lärarens drag bygger på teori. Problem före genomgång gav en måttlig effekt på förståelse och på nya uppgifter, men inte på procedurer, och för elever i åk 2–⁠5 gick trenden åt andra hållet (Sinha och Kapur, 2021). Det hjälper när genomgången bygger på elevernas lösningar (Loibl m.fl., 2017). Samtal i helklass engagerar eleverna när läraren ställer öppna frågor och tar tillvara deras idéer (Skolforskningsinstitutet, 2017). Elever som lottades att sitta bredvid varandra blev oftare vänner (Rohrer m.fl., 2021), men i en liten studie gav lärarens blandade grupper bättre lektionens slutuppgift än lottade (Fletcher och Dise, 2025)."
    - "I två studier i åk 3 och från åk 5 till gymnasiet säger eleverna att de samarbetar mer och lär känna fler vid tavlorna (Håll, 2026; Jones, 2026). I åk 3 tog en elev ibland över medan de andra blev passiva. Om lärandet var elevernas kommentarer blandade."
