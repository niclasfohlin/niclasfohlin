checklista:
  rubrik: Före första lektionen
  punkter:
    - Välj ämnet, minst två lektioner i veckan, och vilket problem varje lektion i arbetsområdet tar.
    - Sätt upp en tavla per grupp, som fönster, whiteboardark eller laminerat A3, och numrera dem. Se Material att köpa.
    - "Välj till första lektionen en fyrfältare en nivå under klassens, eller Bas i åk 4–⁠5."
    - Skriv ut Fyrfältaren, ett blad per grupp, med Baksidan på andra sidan, och Mina anteckningar.
    - Ta fram en kortlek med en valör per grupp, och lägg post-it-lappar och Mina anteckningar vid bänkarna.
    - Bestäm vad du säger till klassen om varför ni arbetar vid tavlorna.
    - Boka två observationer, en med specialläraren.
    - Bestäm med arbetslaget vilka fyrfältare ni prövar, och när ni gör en egen ur kapitlet.
klassen:
  rubrik: Så ordnar du klassen
  text: "Eleverna arbetar i grupper om tre, som du lottar inför klassen varje lektion med kortleken. Blir en elev över blir det två par, och blir två över ett par. Tavlorna sitter längs väggarna, så att du ser alla från mitten av rummet och grupperna ser varandras tavlor. Rummet har ingen framsida, och eleverna står. Den som behöver sitta får en stol vid tavlan. Två elever som inte kan vara i samma grupp får kort i olika valörer innan du blandar. Den som är ny i svenska hamnar i en grupp som alla andra, och kamraterna hjälper med orden. I F–⁠3 räcker ofta par och ett A3 på väggen."
forsta:
  rubrik: Första lektionen
  text:
    - "Första lektionen övar klassen rutinerna på innehåll som alla kan. Ta en fyrfältare en nivå under klassens, eller Bas i åk 4–⁠5, så att alla grupper klarar ruta 1 och 2. Lotta med kortleken, ge ruta 1 muntligt och låt grupperna gå till tavlorna. Konsolidera vid två tavlor och håll anteckningarna korta."
    - "Säg till klassen varför ni gör så här: ”Ni ska tänka tillsammans med alla i klassen. Ruta 1 är lätt med flit, för det ni gör där behöver ni i nästa ruta. Det är tillåtet att titta på andra tavlor, och en fel idé hjälper oss framåt.”"
  plan:
    klass: 6A
    datum: mån 23/11
    lektion: 1 av 6
    mal: lösa ett problem i steg vid tavlan och förklara en annan grupps tavla
    belagg: lapparna på dörren, stickorna till 8 bodar
    blad: Fyrfältaren Fiskebodarna, en per grupp, och Mina anteckningar
    forberett: bilder av bodarna till den som är ny i svenska
    fore: { skivor: ["En bod", "Två och tre bodar i rad", "En bod till, och 5 bodar", "6 och 20 bodar"], ord: "mönster, regel", med: ["en bod tar fem stickor", "varje ny bod tar fyra", "en sticka och fyra per bod"], felet: "6 · 5 = 30" }
    delar:
      - { fas: Starten, text: "Rutinen Lottningen och tavlan. Fiskebodarna, ruta 1 muntligt." }
      - { fas: Vid tavlorna, text: "Grupperna tar ruta 1–⁠3 själva, och pennan byter hand. Ruta 4 när en elev kan säga vad ruta 3 lärde gruppen." }
      - { fas: Konsolideringen, text: "A: en ritning. B: en tabell. Spader förklarar, hjärter svarar. Ordet mönster stort." }
      - { fas: Anteckningarna, text: "Kort: två ord och ett eget exempel." }
      - { fas: På egen hand, text: "Stickorna till 8 bodar." }
    beslut: { elever: 28, nastanAlla: "en egen fyrfältare om mönster", deFlesta: ["tavla B", "en egen fyrfältare om mönster"], halften: "4 och 5 bodar" }
progression:
  rubrik: De första veckorna
  text: "Metoden är ny för dig och för klassen. Alla delar av kärnan finns från första lektionen, och veckorna säger vad ni övar särskilt. Den första egna fyrfältaren ur klassens kapitel gör ni på arbetslagets första möte, med tabellen Så skivar du ett problem och mallen Din fyrfältare, och sedan en i taget i arbetslaget veckan före."
  rader:
    - { vecka: "1", led: Grupperna vid tavlan, rubrik: Lottningen och tavlan, fokus: "Rutinen på innehåll som alla kan.", roll: "Starten tar högst fem minuter, och eleverna står.", eleverna: "Att gå direkt till sin tavla när kortet är draget och börja skriva.", vidare: "nästan alla grupper skriver inom en minut", fraga: "Skriver nästan alla grupper inom en minut efter lottningen?" }
    - { vecka: "2", led: Grupperna vid tavlan, rubrik: Pennan, fokus: "Alla håller pennan.", roll: "Fråga grupp för grupp ”Hur kan ni kontrollera det?”, och visa hur när gruppen inte vet.", eleverna: "Att låta pennan byta hand vid varje ruta, och att den som har den skriver de andras idéer.", vidare: "pennan byter hand i nästan alla grupper", fraga: "Byter pennan hand i nästan alla grupper?" }
    - { vecka: "3", led: Uppgifterna, rubrik: Pröva svaret och andra tavlor, fokus: "Grupperna går vidare själva och hämtar hjälp hos de andra.", roll: "Få igång, håll igång och vik upp ruta 4 grupp för grupp. Skicka grupper som fastnar till en annan tavla.", eleverna: "Att pröva svaret innan nästa ruta, och att gå till en annan tavla när gruppen har fastnat.", vidare: "nästan alla grupper prövar svaret innan de frågar dig", fraga: "Prövar nästan alla grupper svaret innan de frågar dig?" }
    - { vecka: "4", led: Konsolideringen, rubrik: Förklara en annan grupps tavla, fokus: "Klassen förklarar varandras tavlor.", roll: "Följ tabellen Så konsoliderar du nerifrån.", eleverna: "Att förklara en annan grupps tavla.", vidare: "nästan alla kan säga vad tavlan de står vid visar", fraga: "Kan nästan alla säga vad tavlan de står vid visar?" }
    - { vecka: "5", led: Konsolideringen, rubrik: Mina anteckningar, fokus: "Var och en gör idén till sin.", roll: "Gör en egen fyrfältare ur kapitlet.", eleverna: "Att skriva till sig själv i alla fyra fälten.", vidare: "nästan alla skriver vilken ruta som hjälpte och varför", fraga: "Skriver nästan alla vilken ruta som hjälpte och varför?" }
rutiner:
  rubrik: Rutinerna klassen lär sig
  rader:
    - namn: Lottningen och tavlan
      vecka: 1
      vad: I början av lektionen lottar du grupperna inför klassen med kortleken, och varje grupp går direkt till sin tavla.
      steg: ["Räkna eleverna som är här och dela med tre. Blir två över blir det ett par, och blir en över två par.", "Ta en valör per grupp från ess och uppåt: hjärter, spader och klöver till en grupp om tre, och bara hjärter och spader till ett par. Med 28 elever blir det ess till 8 i tre färger och 9 och 10 i två.", "Blanda, och låt var och en dra ett kort. Samma valör är en grupp och tavlans nummer. Hjärter är representanten, och spader skriver först.", "Grupperna går till sin tavla och skriver inom en minut."]
      forsta: Visa korten och tavlorna, säg att alla grupper lottas varje lektion, och låt klassen pröva två gånger.
    - namn: Pennan
      vecka: 2
      vad: Gruppen har en penna, och den byter hand vid varje ny ruta. Den som skriver skriver de andras idéer.
      steg: ["Spader skriver ruta 1.", "Vid varje ny ruta går pennan till den som inte har skrivit än.", "I ruta 4 byter ni när en idé är skriven."]
      forsta: Visa med en grupp vid en tavla, och säg regeln högt vid varje ny ruta den första lektionen.
    - namn: Pröva svaret och andra tavlor
      vecka: 3
      vad: Gruppen prövar svaret innan den tar nästa ruta, och en grupp som har fastnat hämtar en idé vid en annan tavla.
      steg: ["Pröva svaret: rita eller räkna med små tal, räkna tillbaka från svaret, eller ställ en fråga till svaret.", "Stämmer det, säg vad ni tar med er och ta nästa ruta.", "Har ni fastnat, läs en tavla som har kommit en bit, utan att sudda där, och pröva idén hos er."]
      forsta: Pröva själv svaret i ruta 1 högt vid en tavla. Skicka sedan en grupp till en annan tavla, och säg att det är så man gör i ett tänkande klassrum.
    - namn: Förklara en annan grupps tavla
      vecka: 4
      vad: I konsolideringen förklarar spader ur en annan grupp tavlan, och gruppen som skrev den säger om det var så de tänkte.
      steg: ["Alla läser tavlan tyst en halv minut.", "Spader säger vad gruppen gjorde: ”Gruppen har …, och sedan …”", "Räcker inte orden, ritar spader på tavlan.", "Gruppens hjärter svarar på ”Var det så ni tänkte?”"]
      forsta: Förklara själv den första tavlan högt, och låt sedan spader ur en annan grupp ta nästa.
    - namn: Mina anteckningar
      vecka: 5
      vad: Efter konsolideringen skriver var och en till sig själv på bladet Mina anteckningar, med hjälp av tavlorna.
      steg: ["Skriv två ord från tavlan, de som läraren skrev i sin färg.", "Skriv av ett exempel från en tavla och ring in det nya.", "Skriv vilken ruta som gjorde att du förstod, och varför.", "Gör ett eget exempel med egna tal."]
      forsta: Första lektionen skriver du anteckningen ur en tavla med klassen och tänker högt. I vecka 1–⁠4 skriver eleverna två ord och ett eget exempel, fält 1 och 4, och i vecka 5 alla fyra fälten.
uppfoljning:
  text: Så ser du att metoden fungerar, i klassen och hos dig.
  rader:
    - { id: lektionen, nar: Varje lektion, tid: varje lektion, vad: "Lapparna på dörren visar hur många som har fel, och vilket fel. Det avgör var nästa lektion börjar." }
    - { id: klassen, nar: Klassens arbete varje vecka, tid: varje vecka, vad: "Räkna hur många som löser lappens uppgift och skriver en anteckning med ett eget exempel, ur Så syns lärandet i klassen." }
    - { id: lararen, nar: Dina kryss varje vecka, tid: varje vecka, vad: "Hur ofta varje del av kärnan fanns i veckans lektioner, ur kryssen. Du följer dig själv, eftersom konsolideringen och dina svar glider först." }
    - { id: observationerna, nar: Vecka 2 och 4, tid: vecka 2 och 4, vad: "Först observerar specialläraren och läser lapparna med fel, sedan en kollega eller rektor." }
    - { id: arbetslaget-fore, nar: Före första lektionen, tid: före, vad: "På arbetslagets första möte löser ni en fyrfältare stående vid tavlor i lottade grupper och gör den första egna ur kapitlet." }
    - { id: arbetslaget-efter, nar: Vecka 5, tid: vecka 5, vad: "Arbetslaget ses i slutet av de första veckorna, med egna fyrfältare och lapparna." }
    - { id: vardagen, nar: I vardagen, tid: efter, vad: "Du växlar mellan metoden och dina vanliga lektioner. Ha minst en lektion i veckan med stegrande svårighetsgrad och konsolidering vid tavlorna, så att rutinerna sitter kvar." }
    - { id: stodet, nar: Efter de första veckorna, tid: efter, vad: "Arbetslaget ses varje månad läsåret ut och skivar nästa kapitels problem, och före mötet ser en kollega tio minuter av din konsolidering. Den som länge har fel på lapparna får stöd av specialläraren." }
    - { id: sexveckor, nar: Sex skolveckor efter de första veckorna, tid: efter 6 veckor, vad: "En kollega ser en hel lektion med observationsmallen, och ni jämför med vecka 4: sitter konsolideringen och lottningen kvar?" }
    - { id: nastatermin, nar: Nästa termin, tid: nästa termin, vad: "Frågorna under Så syns lärandet i klassen och dina kryss för kärnan, och om ni använder metoden i fler ämnen och arbetsområden." }
    - { id: osaker, nar: Om du är osäker på metoden, tid: villkor, vad: "Står skattningen Hur säker är jag på metoden under 5 i två veckor i rad: ge steget en vecka till." }
    - { id: klassenstar, nar: Om det inte fungerar, tid: villkor, vad: "Står skattningen Hur väl fungerar den i praktiken under 5 i två veckor i rad, eller har hälften eller fler fel på lapparna: gör stegen mellan uppgifterna mindre, och be specialläraren se en lektion." }
larandet:
  rubrik: Så syns lärandet i klassen
  omraden:
    - { omrade: amneskunskaper, syns: "Grupperna kommer långt i uppgifterna, och eleverna löser lappens uppgift på egen hand efter konsolideringen." }
    - { omrade: kommunikation, syns: "Eleverna förklarar en annan grupps tavla med ämnets ord och skriver anteckningar med ett eget exempel." }
    - { omrade: socialt, syns: "Grupperna kommer igång utan att klaga på lottningen, hämtar hjälp vid andra tavlor, och de tysta säger något vid tavlan." }
uppdrag:
  rubrik: Till arbetslaget
  text: "Ni prövar metoden tillsammans: två möten, de första veckorna i era klassrum och besöken. Det viktigaste ni gör ihop är att skiva problem."
  forbered:
    text: "Läs metoden och lös en fyrfältare själv. På mötet, en och en halv timme, löser ni en annan fyrfältare stående vid tavlor i lottade grupper, övar konsolideringen nerifrån vid era tavlor och gör den första egna ur nästa kapitel."
    fragor: ["Vem tänker i dina lektioner, och när får eleverna tänka innan du har visat?", "Vilket problem i ert nästa kapitel kan bli en fyrfältare, och var är golvet?", "Hur avslutar du en lektion i dag, och vad skulle konsolidering nerifrån ändra?"]
  planera: "Planera första lektionen i planeringsmallen, och bestäm vilka fyrfältare ni prövar och vilka rutiner ni gör lika, som kortleken och pennan."
  genomfor: Var och en följer Lär dig metoden och skattar varje vecka, och ni gör nästa fyrfältare ur kapitlet tillsammans veckan före, en halvtimme.
  reflektera: ["Vem tänkte vid tavlorna, och vem tog över?", "Vad tog grupperna med sig från ruta till ruta?", "Vilken tavla tog klassen vidare i konsolideringen, och varför?", "Når klassen det som står under Gå vidare när, och vad gör ni annars?"]
  taMed: "Ta med en egen fyrfältare, dina kryss och några lappar från dörren."

