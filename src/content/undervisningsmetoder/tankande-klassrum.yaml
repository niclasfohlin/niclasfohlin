tidsschema:
  rubrik: En lektion på 60 minuter
  rader:
    - { tid: Före lektionen, fas: Före lektionen, vad: "Välj ett problem och skiva det bakåt till något alla kan, eller ta en färdig fyrfältare. Pröva att varje ruta ändrar en sak. Vik fyrfältaren så att ruta 4 är dold, fäst en vid varje tavla och lägg fram kortleken." }
    - { tid: 0–⁠5 min, fas: Starten, form: Gemensamt, vad: "Eleverna står runt dig. Du berättar kort om problemet, ger ruta 1 muntligt och lottar grupperna." }
    - { tid: 5–⁠38 min, fas: Vid tavlorna, form: I grupp, vad: "Grupperna går själva från ruta 1 till 3 och prövar varje svar. Du får igång grupperna, håller dem igång, väljer tavlorna och ger ruta 4 grupp för grupp." }
    - { tid: 38–⁠48 min, fas: Konsolideringen, form: Gemensamt, vad: "Klassen går mellan två eller tre tavlor, från den alla förstår och uppåt, och ser felet. En elev ur en annan grupp förklarar, och du sätter ord på idén sist." }
    - { tid: 48–⁠55 min, fas: Anteckningarna, form: Enskilt, vad: "Var och en skriver på bladet Mina anteckningar ur tavlorna: två ord och ett eget exempel, och från vecka 5 alla fyra fälten." }
    - { tid: 55–⁠60 min, fas: På egen hand, form: Enskilt, vad: "Var och en löser en uppgift av samma slag på en post-it och sätter den på dörren när hen går." }
    - { tid: Efter lektionen, fas: Efter lektionen, vad: "Räkna lapparna med fel och sortera dem i högar efter felet. Fota tavlorna, och spara lapparna till nästa lektion och arbetslaget." }
  varianter:
    - nar: första lektionen
      text: "Starten tar längre tid, eftersom klassen prövar lottningen två gånger. Konsolideringen tar två tavlor, och anteckningarna är korta."
      delar:
        - { fas: Starten, tid: 0–⁠8 min, fraser: ["Samma valör är en grupp, och valören är er tavla."] }
        - { fas: Vid tavlorna, tid: 8–⁠38 min, fraser: ["Vad vet ni?"] }
        - { fas: Konsolideringen, tid: 38–⁠50 min }
        - { fas: Anteckningarna, tid: 50–⁠55 min }
        - { fas: På egen hand, tid: 55–⁠60 min }
    - nar: en lektion på 45 minuter
      text: "Grupperna får kortare tid vid tavlorna, och konsolideringen blir kortare. Du kan också dela lektionen på två: fota tavlorna, och nästa lektion börjar med fem minuter vid tavlorna och sedan konsolideringen."
      delar:
        - { fas: Starten, tid: 0–⁠4 min }
        - { fas: Vid tavlorna, tid: 4–⁠26 min }
        - { fas: Konsolideringen, tid: 26–⁠35 min }
        - { fas: Anteckningarna, tid: 35–⁠40 min }
        - { fas: På egen hand, tid: 40–⁠45 min }
  efter: "Minuterna är hållpunkter. Ruta 2 ska alla klara: när varje grupp har klarat den och energin börjar sjunka går ni till konsolideringen, senast vid 38 minuter. En omstart tar de första fem minuterna, före uppgiften."
steg:
  rader:
    - namn: Starten
      fraga: "Vet alla vad vi ska ta reda på?"
      alla: Alla står runt dig och kan säga problemet med egna ord till den som står bredvid.
      titta: Står alla nära, och kan de säga problemet?
      beslut: "Kan de säga problemet, lottar du. Annars berättar du det en gång till, med bilden."
      gor:
        - Samla eleverna stående runt dig, utan papper och penna.
        - "Berätta problemet kort, med en bild eller något att visa: ”I matsalen står borden i en lång rad.”"
        - Ge ruta 1 muntligt, så att alla kan börja.
        - "Låt var och en dra ett kort: ”Samma valör är en grupp, och valören är er tavla. Hjärter svarar för gruppen.”"
      fraser: ["Samma valör är en grupp, och valören är er tavla."]
    - namn: Vid tavlorna
      fraga: "Vad behöver den här gruppen härnäst?"
      alla: Varje grupp skriver rutans nummer överst, prövar svaret och tar nästa ruta själv.
      titta: Numren överst, och vem som håller pennan.
      beslut: "När varje grupp har klarat ruta 2 och energin sjunker går ni till konsolideringen, senast vid 38 minuter. En grupp som inte klarat ruta 2 får en ledtråd först."
      gor:
        - "Få igång: gå till tavlor där inget står efter en minut, och till elever som inte har hållit pennan. Fråga: ”Vad vet ni?”"
        - Håll igång med din penna i en egen färg. Stanna en minut per grupp, fråga vad förra rutan lärde gruppen, och gå vidare.
        - "Ruta 4 när en elev du väljer kan säga vad ruta 3 lärde gruppen: ”Vad lärde ruta 3 er?” En grupp som väntar skriver det."
        - Ge ledtråd till den som har gett upp, en uppgift av samma slag till den som inte kan säga hur, och baksidan till den som är klar.
        - "Välj tavlorna i din färg: A den alla kan gå in i, B samma idé ett steg längre och C längst. Ring in felet du letar efter."
      fraser: ["Vad vet ni?", "Vad lärde ruta 3 er?"]
    - namn: Konsolideringen
      fraga: "Vad vet vi nu, och hur hänger det ihop?"
      alla: Alla står vid tavlan och kan säga till den bredvid vad tavlan visar.
      titta: Kan eleverna säga vad som är nytt på varje tavla?
      beslut: "Kan klassen säga idén, skriver du den. Annars stannar ni längre vid tavlan och frågar igen."
      gor:
        - "Gå med klassen till tavla A, den alla kan gå in i: ”Ni andra ska försöka förstå förklaringen.”"
        - "Spader ur en annan grupp förklarar tavlan, och hjärter i gruppen svarar på ”Var det så ni tänkte?”"
        - "Gå vidare till B och C: ”Vad är nytt här?” Alla säger det till den bredvid. Visa felet: ”Varför stämmer inte det här?”"
        - "Säg idén med ämnets ord, och skriv orden stort i din färg: ”Vem kan säga det med egna ord?”"
      fraser: ["Ni andra ska försöka förstå förklaringen.", "Vad är nytt här?"]
    - namn: Anteckningarna
      fraga: "Vad vill eleverna minnas?"
      alla: Var och en skriver Mina anteckningar med två ord från tavlan och ett eget exempel.
      titta: Har anteckningarna ett eget exempel, eller skriver eleverna av?
      beslut: "Skriver många av, ge dem ett exempel från tavlan att göra om med egna tal."
      gor:
        - Dela ut Mina anteckningar.
        - "Säg vad anteckningen är till: ”Skriv så du minns det om en vecka.”"
        - Låt eleverna gå till tavlorna och hämta det de behöver.
      fraser: ["Skriv så du minns det om en vecka."]
    - namn: På egen hand
      fraga: "Kan var och en det här nu?"
      alla: Var och en löser uppgiften på en post-it och visar hur hen tänker.
      titta: Hur många lappar har fel?
      beslut: "Ett av tre utfall, nedan."
      gor:
        - Skriv uppgiften på en tavla alla ser, med samma idé och nya tal.
        - Var och en löser den på en post-it med namnet i hörnet och sätter lappen på dörren när hen går.
        - Räkna lapparna efter lektionen.
      fraser: ["Lös den här själv, och visa hur du tänker."]
      redo:
        nastanAlla: Högst 5 av 28 med fel. Nästa lektion går vidare, och du går först till dem med fel och visar lappen.
        deFlesta: "6–13 av 28 med fel. Nästa lektion börjar med fem minuter vid fotot av tavlan med steget som felen gällde, och en uppgift av samma slag."
        halften: 14 eller fler med fel. Nästa lektion tar samma idé med fler uppgifter, och konsolideringen börjar lägre.
        tiden: "Räcker inte tiden, fota tavlorna. Nästa lektion börjar med fem minuter vid tavlorna, sedan konsolideringen vid fotona, sist anteckningarna och lappen."
