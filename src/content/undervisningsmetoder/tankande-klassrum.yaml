# ---------------------------------------------------------------------------------------------------------------------
# 1 Metoden
# ---------------------------------------------------------------------------------------------------------------------
inledning:
  - "Tänkande klassrum är ett sätt att undervisa där eleverna tänker sig fram själva i ämnet, i stället för att göra efter det du just har visat. Klassen löser uppgifter stående i lottade grupper om tre, vid tavlor som går att sudda. Uppgifterna har stegrande svårighetsgrad, på engelska thin slicing: den första uppgiften är något alla kan, varje ny uppgift ändrar en sak, och uppgifterna leder fram till problemet. Att göra en sådan följd ur ett problem kallas att skiva det. Grupperna prövar svaret och tar nästa uppgift själva, och du ger dem problemet, en ledtråd eller en utvidgning, grupp för grupp. Sist samlar ni i en konsolidering den idé grupperna kom fram till. Klassen går från tavlan som alla kan förstå till tavlan som kom längst, och sedan skriver var och en sina egna anteckningar. Tabellen Så konsoliderar du nerifrån visar stegen. Metoden är inget sätt att få eleverna att röra på sig. Den står och faller med att tänkandet vid tavlorna blir kunskap i konsolideringen."
  - "Rummet har en tavla per grupp längs väggarna: en whiteboard, ett fönster, ett whiteboardark eller ett laminerat A3. Enkla sätt att skaffa dem står i Material att köpa. I början av lektionen står klassen runt dig, och du berättar problemet kort. Sedan drar var och en ett kort ur kortleken, och samma valör blir en grupp och tavlans nummer. Vid varje tavla sitter Fyrfältaren: uppgiftspappret med tre uppgifter och problemet i ruta 4. Femton färdiga står i bilaga A, och tabellen Så skivar du ett problem visar hur du gör en egen. Gruppen har en penna som byter hand vid varje ruta, skriver rutans nummer överst på tavlan och prövar svaret innan den tar nästa ruta. Ruta 4 är dold tills gruppen kan säga vad ruta 3 lärde den. Du går runt med en penna i en annan färg och ringar in det klassen ska se. Efter konsolideringen skriver var och en på bladet Mina anteckningar, och sist löser alla en uppgift på en post-it, som de sätter på dörren när de går."
  - "Lärandet går till så här. Alla kommer igång, eftersom alla kan den första uppgiften. När bara en sak ändras ser eleverna just den, och det gruppen hittade i en ruta behöver den i nästa. Gruppen prövar själv om svaret håller, och en grupp som fastnar tittar på en annan grupps tavla. Tänk på borden i matsalen. I ruta 1 räknar gruppen platserna vid ett, två och tre bord och ser att det blir två till för varje bord. I ruta 2 räknar den ut tio bord och gör en regel för alla antal. I ruta 3 räknar den ett, två och tre bord igen, men nu sexkantiga, och ser att det blir fyra till för varje bord medan ändarna står kvar. Ruta 4 gör samma sak som ruta 2 med de sexkantiga borden. I konsolideringen går klassen samma väg nerifrån, så att också den som kom kortast kan följa med, och i anteckningarna gör var och en idén till sin."
  - "De första fem veckorna har ni minst två lektioner i veckan med metoden. Alla delar finns med från första lektionen, och veckorna säger vad ni övar särskilt. Först övar klassen lottningen, tavlan och pennan på uppgifter som alla kan, sedan att pröva svaret och hämta hjälp vid andra tavlor, och sist konsolideringen och anteckningarna. Själv övar du att skiva problem, att svara utan att ta över och att leda konsolideringen nerifrån. Efter veckorna använder ni metoden i det arbetsområde klassen har, i matematik och i andra ämnen."
karna:
  rubrik: "Kärnan: fast och fritt"
  text: "Effekten hänger på att eleverna tänker själva och att tänkandet blir klassens. Grupperna och tavlan får alla att tänka, uppgifterna med stegrande svårighetsgrad för dem framåt, dina drag håller dem i arbete och konsolideringen gör det de fann till kunskap. Utan konsolideringen blir det aktivitet utan lärande."
  grundregel: Det här är kärnan, och den håller du fast vid. Ämnet, vilka uppgifter och hur många, hur du lottar och var tavlorna sitter får du ändra.
  varv: Grupperna tänker vid tavlan uppgift för uppgift, du håller tänkandet igång, och klassen samlar idén nerifrån.
  komponenter:
    - namn: Lottade grupper vid tavlan
      moment: [Starten, Vid tavlorna, Konsolideringen]
      vad: Grupper om tre eller två lottas inför klassen varje lektion och tänker stående vid en tavla som går att sudda.
      syns: Alla grupper står vid sin tavla och skriver inom en minut, och pennan byter hand. Läraren ser varje grupps tänkande på väggen.
      varfor: "När eleverna väljer grupp, väljer de efter kamrater. Lodräta tavlor gav mer iver och samtal än papper vid bänken, och synligt lottade grupper ändrade samarbetet (Liljedahl, 2016). I en liten studie klarade elever i lärarens blandade grupper slutuppgiften bättre (Fletcher och Dise, 2025)."
      belagg: provad
      kallor: [liljedahl-2016, rohrer-m-fl-2021, fletcher-och-dise-2025]
      kvar: Grupperna lottas inför klassen varje lektion, och de tänker stående vid en yta som går att sudda.
      fritt: Hur du lottar, grupper om två eller tre, vilken yta det är och pennans regler.
      kryss: Grupperna lottades inför klassen och stod vid tavlan.
    - namn: Uppgifter med stegrande svårighetsgrad
      moment: [Starten, Vid tavlorna]
      vad: Uppgifterna kommer i en följd där den första är något alla kan och varje ny uppgift ändrar en sak.
      syns: Grupperna skriver rutans nummer överst, prövar svaret och tar nästa. Läraren ser på numren hur långt varje grupp har kommit.
      varfor: "Ett stort steg döljer det som skulle läras. När en sak ändras och resten står kvar syns just den, och det gruppen fann i en uppgift blir verktyget i nästa (Frazee m.fl., 2023). Utmaningen kan växa i takt med vad gruppen klarar (Liljedahl, 2016)."
      belagg: teori
      kallor: [frazee-m-fl-2023, liljedahl-2016]
      kvar: Första uppgiften kan alla, varje ny uppgift ändrar en sak, och det gruppen hittar i en ruta behövs i nästa.
      fritt: Ämnet, antalet uppgifter, fyrfältaren eller uppgifter du säger muntligt, och om följden kommer ur ett problem eller ur läroboken.
      kryss: Uppgifterna steg i svårighet, och varje ny ändrade en sak.
    - namn: Läraren håller grupperna tänkande
      moment: [Vid tavlorna]
      vad: Du ger problemet, en ledtråd eller en utvidgning grupp för grupp när gruppen behöver det, men aldrig svaret.
      syns: Grupperna prövar svaret och tar nästa ruta själva, och hämtar hjälp vid andra tavlor. Läraren frågar mer än hen förklarar och går vidare.
      varfor: "Svarar läraren på ”Är det rätt?” slutar gruppen tänka. Ledtrådar och utvidgningar håller utmaningen i balans med förmågan (Liljedahl, 2016). Att lära eleverna att pröva sin lösning har för sig starkt stöd i problemlösning i åk 4–⁠8 (Woodward m.fl., 2012)."
      belagg: teori
      kallor: [liljedahl-2016, woodward-m-fl-2012]
      kvar: Varje grupp prövar sitt svar själv och får nästa steg när den behöver det, och ingen grupp får svaret av dig.
      fritt: Dina frågor, vilket slags ledtråd, om du skickar gruppen till en annan tavla, och pennan i din egen färg.
      kryss: Jag gav nästa steg grupp för grupp utan att ge svaret.
      raknas: false
    - namn: Konsolidering nerifrån
      moment: [Vid tavlorna, Konsolideringen, Anteckningarna]
      vad: Klassen går från tavlan alla förstår till den som kom längst, och sedan antecknar var och en.
      syns: Klassen förklarar en grupps tavla och säger vad som är nytt på nästa. Alla skriver en anteckning med ett eget exempel.
      varfor: "Utan konsolidering stannar det grupperna fann på väggen. Problem före genomgång gav mer förståelse men inte bättre procedurer (Sinha och Kapur, 2021), när genomgången jämförde elevernas lösningar, också de som inte höll, med den som gäller (Loibl m.fl., 2017)."
      belagg: teori
      kallor: [sinha-och-kapur-2021, loibl-m-fl-2017, skolforskningsinstitutet-2017, goteborgs-universitet-2026, star-m-fl-2015]
      kvar: Klassen bygger idén med gruppernas tavlor, från det alla nådde och uppåt, och sedan antecknar var och en.
      fritt: Vilka tavlor och hur många, vem som förklarar, om ni konsoliderar mitt i eller sist, och anteckningarnas form.
      kryss: Vi gick från tavla A uppåt, och alla skrev en anteckning.
roll:
  rubrik: "Lärarens roll: du ger inte svaret"
  text: Du väljer uppgifterna, ser vad grupperna gör och bestämmer vad varje grupp får härnäst. Sist gör du deras tankar till klassens.
  fragor:
    - Vem tänker vid tavlan just nu?
    - Vad behöver den här gruppen härnäst?
    - Vilken tavla hjälper klassen vidare?
  fragornaText: Den första och den andra bär du med dig vid tavlorna, och den tredje i konsolideringen.
tabeller:
  - rubrik: Så skivar du ett problem
    plats: efter-inledning
    meny: true
    text: "Att skiva ett problem betyder att skapa stegrande svårighetsgrad, på engelska thin slicing: du delar upp problemet bakåt i små steg, så att den första uppgiften är något alla kan och den sista är problemet. Gör så här när du skivar ett problem ur problembanken eller läroboken. Fyrfältaren har en uppgift i ruta 1, 2 och 3 och problemet i ruta 4. Fyrfältarna i bilaga A är skivade på det här sättet."
    kolumner: [Steget, Så gör du]
    rader:
      - ["1 Välj idén", "Lös problemet själv. Vad måste eleverna förstå för att klara det? Det är idén, och den säger du inte."]
      - ["2 Hitta golvet", "Gör problemet så litet att alla kan börja: små tal, en sak i taget och problemets eget sammanhang. Det blir ruta 1."]
      - ["3 Ändra en sak i taget", "Varje uppgift ändrar en sak, som talet, formen, ett led till eller ett villkor. Kommer något nytt in, som en ny form, börjar du med små tal igen, som ruta 3 i Borden. Ändras två saker, ser eleverna inte vilken som räknas."]
      - ["4 Problemets form i mindre skala", "Uppgiften före problemet har problemets struktur med andra tal, så att gruppen hittar sättet själv."]
      - ["5 Fråga, men säg inte", "En uppgift får fråga efter det som löser problemet, men aldrig säga det."]
      - ["6 Ha fler uppgifter i fickan", "En uppgift av samma slag för gruppen som behöver öva steget igen, och en utvidgning för gruppen som är klar."]
  - rubrik: Så konsoliderar du nerifrån
    plats: efter-inledning
    meny: true
    text: "I konsolideringen blir det grupperna har kommit fram till klassens kunskap. Här befästs det matematiska innehållet: idén du valde när du skivade problemet, orden och sättet att lösa. Den tar omkring tio minuter. Förklaringen börjar där alla är med och går uppåt, så att ingen hoppar över ett steg och den som kom kortast vet var hen ska fortsätta. Problem före genomgång hjälper när genomgången bygger på elevernas lösningar, också de som inte höll (Loibl m.fl., 2017). Extrafilmen Konsolidering nerifrån visar en konsolidering i ett klassrum."
    kolumner: [Steget, Så gör du]
    rader:
      - ["1 Välj tavlorna medan grupperna arbetar", "Märk två eller tre tavlor i din färg, där varje tar ett steg från den förra: A den alla kan gå in i, B samma idé ett steg längre och C den som kom längst. Ring in felet du letar efter."]
      - ["2 Börja där alla är med", "Gå med klassen till tavla A: ”Ni andra ska försöka förstå förklaringen.” Alla läser tavlan tyst en halv minut. Spader ur en annan grupp förklarar, och hjärter i gruppen svarar på ”Var det så ni tänkte?” De första gångerna förklarar du tavla A själv."]
      - ["3 Ett steg uppåt i taget", "Vid B och C frågar du: ”Vad är nytt här?” Alla säger det till den bredvid innan någon svarar högt."]
      - ["4 Ta upp felet", "Visa felet du ringade in, eller skriv upp det själv om gruppen har suddat det, som felet under På lappen i fyrfältarens ram: ”Varför stämmer inte det här?”"]
      - ["5 Befäst innehållet", "Säg idén med ämnets ord och skriv orden stort i din färg. Fråga: ”Vem kan säga det med egna ord?”"]
      - ["6 Var och en gör idén till sin", "Eleverna skriver Mina anteckningar med tavlorna kvar, och sist löser alla uppgiften på lappen."]
  - rubrik: Material att köpa
    plats: efter-progression
    meny: true
    text: "Det som kostar är främst tavlorna, och ett fönster eller ett laminerat A3 räcker. Priserna ändras."
    kolumner: [Det du behöver, Ett enkelt sätt, Var du köper]
    rader:
      - ["Tavlor i morgon", "Ett fönster, eller två laminerade A3 bredvid varandra på väggen. Whiteboardpennor går att sudda på båda.", "Det skolan har"]
      - ["Tavlor på väggen, en per grupp", "Whiteboardark i 60 × 80 cm som fäster utan lim på vägg och glas och går att flytta. 25 ark räcker till tio grupper och några i reserv.", "[Magic-Chart whiteboardfilm, Lär & Lek](https://www.lar-lek.se/product/magic-chart-whiteboardfilm-60x80cm)"]
      - ["En tavla som sitter kvar", "Självhäftande whiteboardfolie i 60 × 120 cm för en slät vägg, en dörr eller ett skåp.", "[d-⁠c-⁠fix whiteboardfolie, Hornbach](https://www.hornbach.se/p/whiteboardfolie-d-c-fix-60x120cm/10157385/)"]
      - ["Pennor till grupperna", "Svarta pennor med smal, tålig spets, en per grupp och några i reserv.", "[Dobell svart, Lär & Lek](https://www.lar-lek.se/product/whiteboardpennor-dobell-svart-med-smal-spets)"]
      - ["Din penna", "En penna i en annan färg med rund spets, så att klassen ser det du ringar in och skriver stort.", "[Centropen röd, Lär & Lek](https://www.lar-lek.se/product/whiteboardpenna-centropen-rund-rod-10-pack)"]
      - ["Pennor och dukar till alla", "Ett kit med 30 små tavlor i A4, whiteboardpennor och mikrofiberdukar, så att alla har penna och duk.", "[Kit med tavlor, pennor och dukar, Lär & Lek](https://www.lar-lek.se/product/skrivtavla-a4-blank-whiteboardpennor-mikrofiberdukar-30-pack)"]
      - ["Att sudda med", "Mikrofiberdukar, en per tavla. Dukarna går att tvätta i maskin.", "[Mikrofiberduk, Lär & Lek](https://www.lar-lek.se/product/mikrofiberduk-till-whiteboard)"]
  - rubrik: Fyrfältarna
    plats: efter-progression
    meny: true
    text: "Femton problem ur problembanken på sajten, fem på varje nivå och ett ur varje del av kursplanen i matematik. Ruta 4 är bankens problem, och ruta 1–⁠3 är skivade bakåt från det. Bas passar ungefär åk 4–⁠5, Medel åk 6–⁠7 och Avancerat åk 8–⁠9, men välj efter vad klassen kan, och första lektionen gärna en nivå under. I F–⁠3 tar du ruta 1–⁠3 ur Bas eller gör en egen, och i andra ämnen skivar du ett eget problem i mallen Din fyrfältare. Varje fyrfältare har en ram i bilaga A med det du behöver vid tavlorna."
    kolumner: [Nivån, Problemet, Innehållet, Ordet]
    rader:
      - ["Bas", "Äpplena", "Taluppfattning", "del och helhet, räkna baklänges"]
      - ["Bas", "Fiskebodarna", "Algebra", "mönster, regel"]
      - ["Bas", "Chokladbollarna", "Samband och förändring", "dubbelt, hälften, samma förhållande"]
      - ["Bas", "Tärningarna", "Sannolikhet och statistik", "utfall, chans"]
      - ["Bas", "Parken", "Geometri", "omkrets, gemensam multipel"]
      - ["Medel", "Borden", "Algebra", "mönster, regel, variabel"]
      - ["Medel", "Kulpåsarna", "Sannolikhet och statistik", "andel, sannolikhet"]
      - ["Medel", "Tangrammet", "Geometri", "area, del av en helhet"]
      - ["Medel", "Pantpengarna", "Taluppfattning", "bråk, del av det som är kvar"]
      - ["Medel", "Bowlingkalaset", "Samband och förändring", "fast pris, pris per person"]
      - ["Avancerat", "Stenplattorna", "Algebra", "kvadrattal, uttryck med n"]
      - ["Avancerat", "Udda eller jämnt", "Sannolikhet och statistik", "utfall, rättvist spel"]
      - ["Avancerat", "Svamparna", "Samband och förändring", "procent, andel av en helhet"]
      - ["Avancerat", "Kvadraten", "Geometri", "omkrets, area"]
      - ["Avancerat", "Popcornskålen", "Taluppfattning", "del per minut, takt"]
  - rubrik: Din fyrfältare
    plats: efter-progression
    meny: true
    text: "Mallen är din fil att skriva i när du skivar ett problem ur kapitlet. Skriv idén och ordet först, sedan problemet i ruta 4, och skiva det bakåt till uppgifter med stegrande svårighetsgrad i ruta 1–⁠3. Skriv sist vad gruppen tar med sig från ruta till ruta. Exemplet är triangelns area i åk 6, och exemplen i svenska, fysik och musik visar uppgifter i andra ämnen."
    kolumner: [Fyrfältaren, I exemplet]
    rader:
      - ["Klass och ämne", "6A, matematik"]
      - ["Arbetsområdet", "Area av trianglar"]
      - ["Idén", "Triangelns area är basen gånger höjden delat med två, var toppen än ligger."]
      - ["Ordet", "bas, höjd och area"]
  - rubrik: "Din fyrfältare: rutorna"
    plats: efter-progression
    text: "Varje ruta ändrar en sak från den förra. Skriv uppgifterna för hand på den tomma fyrfältaren i bilaga A, ett blad per grupp."
    kolumner: [Rutan, Uppgiften, Svaret, Det gruppen tar med sig]
    rader:
      - ["Ruta 1", "En rektangel är 6 cm lång och 4 cm bred. Vilken area har den?", "24 cm²", "Arean är längden gånger bredden."]
      - ["Ruta 2", "Rita en diagonal i rektangeln. Vilken area har en av trianglarna?", "12 cm²", "Diagonalen delar rektangeln i två lika stora delar."]
      - ["Ruta 3", "En triangel har basen 6 cm, och toppen ligger 4 cm rakt ovanför basens mitt. Rita en rektangel runt den. Vilken area har triangeln?", "12 cm²", "Triangelns area är basen gånger höjden delat med två."]
      - ["Ruta 4", "En triangel har basen 6 cm, och toppen ligger 4 cm ovanför basen men 2 cm utanför dess ena ände. Vilken area har den?", "12 cm²", "Samma regel gäller var toppen än ligger, fast triangeln inte är halva rektangeln runt den."]
  - rubrik: "Din fyrfältare: vid tavlorna"
    plats: efter-progression
    text: "Det här har du i fickan medan grupperna arbetar."
    kolumner: [Det du har med dig, I exemplet]
    rader:
      - ["Ledtråden", "”Rita en rektangel runt triangeln. Vilka delar är inte triangeln?”"]
      - ["En uppgift av samma slag", "En triangel har basen 8 cm och höjden 5 cm, med toppen ovanför basens mitt. Svar: 20 cm²."]
      - ["Utvidgningen", "Rita tre olika trianglar med arean 12 cm²."]
      - ["Uppgiften på lappen", "En triangel har basen 10 cm och höjden 5 cm. Vilken area har den? Svar: 25 cm²."]
      - ["Felet på lappen", "50 cm², där basen gånger höjden inte har delats med två."]

