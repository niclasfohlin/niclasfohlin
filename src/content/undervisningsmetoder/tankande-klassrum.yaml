# Tänkande klassrum: undervisningsmetod för helklass, skriven 2026-11-14 ur analysen (analys.md), innehållsbankerna
# (innehall-praktiken.md, P; innehall-karnan.md, K), evidensen (evidensbank.md, adjudicering-evidensen.md, evidens.json)
# och fyrfältarna (fyrfaltare.yaml, som ger ramarna Fyrfältaren och bladen i pabordet.yaml).
# Niclas beställning 2026-11-13 står i ARBETSORDER.md: thin slicing förklarat, lärarens roll medan grupperna löser,
# konsolideringen och hur läraren lyfter gruppernas tavlor, hantverket och femton fyrfältare ur problembanken.
#   node build/sparrprov.mjs methods/tankande-klassrum/metod.yaml --klar

titel: Tänkande klassrum
undertitel: Så tänker eleverna sig fram i små steg vid tavlan, F–⁠9
alternativaNamn: ["Building Thinking Classrooms", "Thinking Classrooms", "BTC"]
ingress: "Klassen löser uppgifter stående i lottade grupper om tre, vid tavlor som går att sudda. Uppgifterna har stegrande svårighetsgrad, och varje ny uppgift ändrar en sak, så att eleverna bygger idén själva. Sist går klassen från tavlan alla förstår till tavlan som kom längst, och var och en skriver egna anteckningar."
arskurs: ["F-3", "4-6", "7-9"]
arskursText: F–9
taggar: ["problemlosning", "undervisningskvalitet"]
slag: lektionsforlopp
syfte: [tanka, samarbeta]
tid: 60 minuter per lektion, minst två lektioner i veckan
hurOftaSkal: "Ingen studie med effekt anger hur ofta. Grupper som lottades synligt varje lektion ändrade samarbetet på två till tre veckor (Liljedahl, 2016)."
period: Fem veckor att komma igång
material:
  - en tavla per grupp
  - en kortlek
  - en penna per grupp och en i din färg
  - Fyrfältaren till varje grupp
  - Mina anteckningar
  - post-it-lappar
uppdaterad: 2026-11-14
publicerad: 2026-11-14
relaterade: ["problemlosning-i-grupp", "kooperativt-larande", "explicit-undervisning"]
utkast: false
film:
  sekunder: 26.79
  beskrivning: "Var och en drar ett kort ur kortleken. Läraren säger: ”Samma valör är en grupp, och valören är er tavla.” Grupperna skriver rutans nummer överst. Läraren går grupp för grupp. Läraren frågar: ”Vad lärde ruta 3 er?” En elev i grupp 7 säger: ”Fyra till för varje bord.” Läraren har märkt tavlorna med A, B och C. Klassen samlas vid A. Läraren säger: ”Ni andra ska försöka förstå förklaringen.”"
  rubrik: "Grupperna tänker vid tavlan, och läraren viker upp ruta 4"
  ingress: "Filmen visar lektion 3 i matematik i åk 6, med problemet Borden. Läraren lottar grupperna med en kortlek, grupperna skriver vid tavlorna, och läraren viker upp ruta 4 grupp för grupp."
  stillbilder:
    - text: "Klassen står runt läraren och drar var sitt kort."
    - text: "Numret överst visar var varje grupp är."
    - text: "Gruppen svarar, och läraren viker upp ruta 4."
    - text: "Klassen samlas vid tavla A och går sedan till B."
filmer:
  - nr: 2
    titel: "Konsolidering nerifrån"
    sekunder: 27.15
    beskrivning: "Klassen står vid tavla A. Läraren säger: ”Ni andra ska försöka förstå förklaringen.” En elev ur en annan grupp förklarar. En elev i grupp 3 säger: ”Två till för varje bord.” En elev i grupp 2 säger: ”Ja, och två i ändarna.” Klassen går till tavla B. Läraren frågar: ”Vad är nytt här?” En elev säger: ”10 · 2 i stället för 10 + 10.” Vid tavla C skriver läraren regeln stort. En elev säger: ”Sexkantiga bord ger fyra till för varje.” Läraren säger: ”Vi skriver det som en regel.” Läraren skriver: ”regel 4 · n + 2”."
    rubrik: "Konsolidering nerifrån: från tavla A till tavla C"
    ingress: "Filmen visar konsolideringen i lektion 3 i matematik i åk 6, med problemet Borden. Klassen börjar vid tavla A, där en elev ur en annan grupp förklarar. Vid tavla B säger klassen vad som är nytt, och vid tavla C skriver läraren regeln stort."
    efter: "steg 3"
    stillbilder:
      - text: "Klassen samlas vid tavla A, den alla kan förstå."
      - text: "En elev ur en annan grupp förklarar tavla A."
      - text: "Vid tavla B säger klassen vad som är nytt."
      - text: "Vid tavla C: fyra till för varje bord, och regeln."

profil:
  evidens:
    larande: { niva: inte-sammanvagt, kort: "Lärandet är inte mätt med jämförelsegrupp. I matematik är stödet anekdotiskt.", motivering: "Ingen sammanställning väger ihop ämnena med metodens kärna. Bara matematiken är studerad, och där är stödet anekdotiskt." }
    lasning: { niva: inte-studerat, motivering: "Ingen källa har mätt läsningen med metoden, inte heller fallstudier eller lärares rapporter." }
    skrivning: { niva: inte-studerat, motivering: "Ingen källa har mätt skrivandet med metoden, inte heller fallstudier eller lärares rapporter." }
    matematik: { niva: anekdotiskt, motivering: "Ingen studie med jämförelsegrupp. I ett skoldistrikt gick eleverna mer framåt hos lärare som använde metoden (Haber, 2024), och en lärares klasser i åk 5–⁠6 gick mer framåt än väntat i två läsår och en termin (Doblar, 2024). Båda kan bero på lärarna.", kallor: [haber-2024, doblar-2024] }
    amnen: { niva: inte-studerat, motivering: "Ingen källa har mätt kunskaperna i SO, NO eller teknik med metodens kärna. Lärare använder metoden i NO och SO, men det är inte mätt." }
    socialt: { niva: anekdotiskt, motivering: "Ingen studie med jämförelsegrupp. Elever i åk 3 och från åk 5 till gymnasiet säger att de lär känna fler och samarbetar mer vid tavlorna, men i åk 3 tog en elev ibland över (Håll, 2026; Jones, 2026).", kallor: [hall-2026, jones-2026] }
  svarighet: { lara: 4, karnan: 3, stod: 4, tid: 4, motivering: "Du lär dig skiva problem, svara utan att ta över och leda konsolideringen nerifrån. Det tar en termin, och lärarna i studierna fick fortbildning i ett halvår till två läsår." }
  kostnad: { kop: 2, timmar: 21, motivering: "Fönster, whiteboardark eller laminerat A3 räcker som tavlor. Omkring 21 timmar per lärare första läsåret går till läsning, arbetslagets möten före och efter veckorna och en gång i månaden, att skiva problem, en kollegas besök och samtalen efter dem." }
  urval:
    datum: 2026-11-14
    regel: "Undervisning räknas när klassen löser uppgifter i lottade grupper vid ytor som går att sudda, med uppgifter i en följd av små steg, en lärare som ger nästa steg utan att ge lösningen, och en konsolidering ur gruppernas arbete. En källa som saknar en av de fyra delarna räknas och sänker tillförlitligheten för Indirekt. Räknas inte: högskolan, en enda studie i gymnasiet, program som bygger på samma idéer utan kärnan, som Thinking Maths, och studier av en del för sig, som problem före genomgång, jämförelse av lösningar och lottade platser. De bär kärnans Varför."
    text: "Vi sökte hos Skolforskningsinstitutet, Skolverket, NCM, EEF och What Works Clearinghouse, i ERIC och OpenAlex område för område, och gick igenom de 40 studierna och uppsatserna på metodens webbplats, buildingthinkingclassrooms.com. Sedan sökte vi igen efter starkare belägg, och två granskare läste talen i källorna. Ingen studie med jämförelsegrupp i grundskolan har mätt metoden med dess kärna. Listan har sammanställningar och lottade studier om metodens delar, och klassrumsstudier om metoden. Högskolan och enskilda studier i gymnasiet valde vi bort."
    slutsatser:
      oversikt: "Problem före genomgång ger en måttlig effekt på förståelse och på nya uppgifter, men inte på procedurer, och för elever i åk 2–⁠5 gick trenden åt andra hållet (Sinha och Kapur, 2021). Det hjälper när genomgången bygger på elevernas lösningar (Loibl m.fl., 2017). Samtal i helklass engagerar eleverna när läraren ställer öppna frågor och tar tillvara deras idéer (Skolforskningsinstitutet, 2017)."
      experiment: "Ingen studie prövar metoden med jämförelsegrupp. I åk 6 gav gruppdiskussion med helklassdiskussion ingen säker skillnad mot genomgång (Göteborgs universitet, 2026), och att jämföra lösningar gav ingen effekt när lärarna använde det för lite (Star m.fl., 2015). Elever som lottades att sitta bredvid varandra blev oftare vänner (Rohrer m.fl., 2021), men elever i lärarens blandade grupper klarade lektionens slutuppgift bättre än i lottade (Fletcher och Dise, 2025)."
      annan: "Metoden kommer ur Liljedahls designforskning, där lodräta tavlor och synligt lottade grupper gav mer engagemang (Liljedahl, 2016). I två studier i åk 3 och från åk 5 till gymnasiet säger eleverna att de samarbetar mer och lär känna fler, och i åk 3 tog en elev ibland över (Håll, 2026; Jones, 2026). I en lärares klasser i åk 5–⁠6 och i ett skoldistrikt gick eleverna mer framåt i matematik, men det kan bero på lärarna (Doblar, 2024; Haber, 2024)."
    uteslutna:
      - { namn: "Aldefors m.fl. (2025) och Lundkvist och Larsson (2024)", skal: "Svenska klassrumsstudier utan hela kärnan. De står i Läs mer" }
      - { namn: "Jonsson m.fl. (2020)", skal: "Gymnasiet och enskilt arbete" }
      - { namn: "Rittle-Johnson och Star (2007)", skal: "Läst bara som sammanfattning, utan effektstorlek" }
      - { namn: "Resanovich (2025) och Mauricio (2026)", skal: "En eller två av metodens fyra delar" }
      - { namn: "Pershan (2023)", skal: "En blogg. Kritiken står i invändningarna" }
      - { namn: "Kara och Kılıç (2025)", skal: "Mätte attityd till att formulera problem, och tabellerna går inte ihop" }
      - { namn: "Valbekmo och Bjuland (2023)", skal: "Fallstudie av par som valdes för att de kunde samarbeta, så den visar ingen förändring" }
      - { namn: "Hattie (2009)", skal: "Översikt av metaanalyser" }

