fastnar:
  rubrik: Så stöttar du
  text: "Ge minsta möjliga stöd. Fråga först vad gruppen har gjort, och vänta. Kravet står kvar: gruppen löser uppgiften, och det är stödet som ändras."
  trappa: ["Säg: ”Berätta vad ni har gjort.”", "Bygg på det de sa: ”Ni sa … Försök använda det.”", "Peka på en annan tavla: ”Titta på tavla 4.”", "Är gruppen frustrerad, ge en lättare uppgift eller skriv första steget på tavlan.", "Gå därifrån och kom tillbaka om några minuter."]
  motto: Tänkandet stannar hos gruppen, också när du hjälper.
amnesexempel:
  - amne: lasning
    arskurs: åk 3
    innehall: Ord som säger hur någon pratar, ordnade efter hur starka de är
    overst:
      egen: "Uppgifterna: två ord, tre ord, fyra ord och ett eget ord. Felet: orden ordnas efter längd."
      visar: "Orden på en linje på tavlan, och en mening med varje ord. Pröva: visa stället i texten."
    scen:
      - "Tänk dig en lektion i svenska i åk 3. Klassen läser en berättelse där personerna viskar, säger och skriker."
      - "Ruta 1 är viska och skrika: vilket är tystast? Ruta 2 lägger till säga. Ruta 3 ger fyra ord: viska, säga, ropa och skrika. Grupperna lägger orden på en linje på tavlan och skriver en mening med varje ord. En grupp har fastnat, och du pekar på tavla 6: ”Titta hur de gjorde.”"
      - "Klassen börjar vid tavla 3, som har tre ord, och slutar vid tavla 6, där gruppen har lagt till vråla. På egen hand lägger alla orden mumla, prata och vråla i ordning på en lapp, och 7 av 28 har fel."
    notera: "Notera vad som hände. Varje uppgift lade till ord, och eleverna såg att orden skiljer sig i hur starka de är och inte i hur långa. Med 7 lappar med fel kan de flesta, och nästa lektion börjar med en omstart vid tavla 6."
  - amne: skrivning
    arskurs: åk 8
    innehall: Ett argument med skäl och motargument
    overst:
      egen: "Uppgifterna: ett påstående, ett skäl, ett motargument och ett svar på det. Felet: skälet upprepar påståendet."
      visar: Stycket på tavlan, med skälet och motargumentet i olika färg.
    scen:
      - "Tänk dig en lektion i svenska i åk 8, där klassen skriver argumenterande text. Frågan är om skoldagen ska börja klockan nio."
      - "Ruta 1 ber om ett påstående, ruta 2 om ett skäl som säger något nytt och ruta 3 om ett motargument. I ruta 4 svarar gruppen på det i ett stycke. Grupperna prövar sina skäl: säger skälet något mer än påståendet?"
      - "Klassen börjar vid en tavla med ett påstående och ett skäl, och slutar vid stycket som bemöter motargumentet. På egen hand skriver alla ett skäl till ett nytt påstående på en lapp, och 4 av 28 upprepar påståendet."
    notera: "Notera vad som hände. Uppgifterna byggde stycket en del i taget, och konsolideringen visade hur delarna hänger ihop. Nästan alla kan, så nästa lektion skriver var och en ett eget stycke."
  - amne: matematik
    arskurs: åk 6
    innehall: Mönster som växer, och en regel för alla antal
    huvud: true
    arbetsomradet:
      - "Lektion 1: mönster som växer, med Fiskebodarna"
      - "Lektion 2: samma idé i en egen fyrfältare ur kapitlet"
      - "Lektion 3: en regel för alla antal, med Borden"
      - "Lektion 4: två mönster i samma figur, med Stenplattorna"
      - "Lektion 5–⁠6: en regel med n, i egna fyrfältare ur kapitlet"
    overst:
      visar: "Platserna i en ritning eller en tabell, och regeln med ord eller med n. Pröva: rita tre bord."
    plan:
      klass: 6A
      datum: tis 1/12
      lektion: 3 av 6
      mal: beskriva ett mönster som växer med en regel för alla antal
      belagg: lappen på dörren, platserna vid 20 sexkantiga bord
      blad: Fyrfältaren Borden, ett per grupp, och Mina anteckningar
      forberett: en uppgift med 4 bord, och bilder av borden till den som är ny i svenska
      fore: { skivor: ["Fyrkantiga bord: 1, 2 och 3", "10 fyrkantiga bord och en regel", "Sexkantiga bord: 1, 2 och 3", "10 sexkantiga bord och en regel"], ord: "regel, variabel", med: ["två till för varje bord", "2 · n + 2, och ändarna står kvar", "4 · n + 2 för alla antal"], felet: "10 · 6 = 60" }
      delar:
        - { fas: Starten, text: "Borden i matsalen. Lottning, och ruta 1 muntligt." }
        - { fas: Vid tavlorna, text: "Ruta 4 grupp för grupp. Jag märker tre sätt att räkna med A, B och C." }
        - { fas: Konsolideringen, text: "A: 10 + 10 + 2. B: 10 · 2 + 2. C: 4 · 10 + 2 = 42. Felet 10 · 6 = 60. Sist 4 · n + 2 och ordet regel stort." }
        - { fas: Anteckningarna, text: "Två ord, regel och variabel, och ett eget exempel." }
        - { fas: På egen hand, text: "Platserna vid 20 sexkantiga bord." }
      beslut: { elever: 28, nastanAlla: "Stenplattorna", deFlesta: ["tavla B", "Stenplattorna"], halften: "fyrkantiga bord med 4, 5 och 6" }
      efter: { kontrollen: "7 med fel: De flesta", hogar: "21 rätt, 4 med 20 · 6 och 3 utan regel", sag: "”Det blir fyra till för varje bord, och två på kanterna.”", kryss: [1, 2, 3, 4], nasta: "en omstart vid tavla B", forst: "de fyra som räknade 20 · 6" }
    remsa:
      - "Kortleken ger åtta grupper om tre och två par, och varje grupp står vid sin tavla."
      - "Ruta 1 ger två till för varje bord, och ruta 3 byter bordets form. Ruta 4 är bankens problem."
      - "”Hur kan ni kontrollera det?” Grupp 4 ritar tre bord och ser felet själv."
      - "Tavla A, B och C nerifrån, och 4 · n + 2 stort sist."
    scen:
      - "Tänk dig lektion 3 i matematik i åk 6. Klassen arbetar med mönster, och Fyrfältaren Borden sitter vikt vid varje tavla. Du berättar om borden i matsalen, ger ruta 1 muntligt och lottar."
      - "I ruta 2 skriver grupp 2 talen 10 + 10 + 2, och grupp 5 skriver 10 · 2 + 2. Grupp 4 frågar om tio sexkantiga bord ger 60. Du frågar: ”Hur kan ni kontrollera det?” De ritar tre bord och ser att två bord delar en sida. Grupp 7 säger vad ruta 3 lärde dem, och du viker upp ruta 4. Sist märker du tavla 2, 5 och 7 med A, B och C."
      - "En elev från grupp 3 förklarar tavla A: två till för varje bord. Vid B säger klassen vad som är nytt. Vid C frågar du varför grupp 4:s första svar, 60, inte stämde, och skriver 4 · n + 2 stort bredvid grupp 7:s ord. På egen hand löser alla platserna vid 20 sexkantiga bord på en lapp, och 7 av 28 har fel."
    notera: "Notera vad som hände. Det grupperna tog med sig från ruta 1, två till för varje bord, blev verktyget i ruta 3 och klassens första stopp. Med 7 fel kan de flesta, och nästa lektion börjar med en omstart vid tavla B. Med högst 5 fel hade klassen gått vidare till Stenplattorna, och med 14 eller fler hade den tagit fler uppgifter med fyrkantiga bord."
  - amne: so-no
    amnesnamn: Fysik
    arskurs: åk 5
    innehall: Månens faser
    overst:
      egen: "Uppgifterna: bollen mot lampan, bollen på fyra platser runt huvudet, månens faser. Felet: jordens skugga gör faserna."
      visar: "En ritning med solen, jorden och månen på fyra platser. Pröva: övertyga en annan grupp."
    scen:
      - "Tänk dig en lektion i fysik i åk 5 om månens faser. En lampa lyser i mitten av rummet, och varje grupp har en boll på en pinne vid sin tavla."
      - "Ruta 1: Håll bollen mot lampan. Hur mycket av bollen lyser? Ruta 2: Håll bollen framför dig och vrid dig ett kvarts varv i taget. Hur mycket av den ljusa sidan ser du på fyra platser? Ruta 3: Rita solen, jorden och månen när månen är halv. Alla grupper fastnar på ruta 3. Du stoppar klassen vid tavla 4, där gruppen har ritat månen på fyra platser, och ger alla samma uppgift: var står månen vid fullmåne?"
      - "Sist går klassen från tavla 4 till tavla 7 och säger var månen står vid halvmåne och fullmåne. På egen hand ritar alla månen vid nymåne på en lapp, och 3 av 28 ritar jordens skugga."
    notera: "Notera vad som hände. När alla grupper fastnade på samma uppgift stoppade du klassen vid en tavla som hade kommit en bit, i stället för att förklara. Nästan alla kan, så nästa lektion går vidare."
  - amne: praktisk-estetiska
    amnesnamn: Musik
    arskurs: åk 2
    innehall: Rytmer i en takt med fjärdedelar och åttondelar
    overst:
      egen: "Uppgifterna: fyra ta, en ti-⁠ti, två ti-⁠ti och en egen takt. Felet: varje ti klappas lika långt som en ta."
      visar: Takten skriven på tavlan med streck, och gruppen klappar den.
    scen:
      - "Tänk dig en lektion i musik i åk 2. Grupperna har ett A3 på väggen och en penna."
      - "Ruta 1: klappa ta ta ta ta och skriv det. Ruta 2: byt en ta mot ti-⁠ti. Ruta 3: byt två. Ruta 4: hitta på en takt som en annan grupp ska klappa. Pennan byter hand vid varje ruta, och den som skriver skriver det de andra klappar."
      - "Sist klappar klassen tre gruppers takter, från den enklaste. På egen hand skriver alla en takt med streck på en lapp, och 5 av 28 skriver fel."
    notera: "Notera vad som hände. När pennan bytte hand vid varje ruta fick alla skriva. Nästan alla kan, så nästa lektion tar takter med paus."
stod:
  rubrik: Elever som behöver mer stöd
  rader:
    - { nar: Den som är ny i svenska, metoden: "Problemet berättas muntligt med en bild eller något att visa, och rutorna läses högt i gruppen. Gruppen ritar och skriver tal innan orden finns, och kamraterna hjälper med orden.", du: "Visa bilden och förklara problemets ord före lektionen, och ge eleven pennan i ruta 1, före kortets ordning. I konsolideringen frågar du: ”Vilka ord ur ämnet använde ni?”" }
    - { nar: Den som har det svårt i ämnet, metoden: "Första uppgiften kan alla, och kamraterna i gruppen och de andra tavlorna visar vägen.", du: "Lär klassen att räcka över pennan och be om en förklaring. Ge en uppgift av samma slag i stället för nästa." }
    - { nar: I F–⁠3, metoden: "Samma delar, i kortare tid.", du: "Lotta par med hjärter och spader i varje valör. Sätt upp A3, ta fram bilder och saker att räkna med, och ge uppgifterna muntligt. I matematik passar ruta 1–⁠3 i Bas, som Äpplena. Anteckningen är en teckning med en mening som du skriver." }
    - { nar: Den som redan kan, metoden: "Baksidan och utvidgningen i varje fyrfältare.", du: "Be gruppen motivera, skriva en regel eller göra en ruta 5 åt en annan grupp." }
    - { nar: När många grupper har fastnat på samma steg, metoden: "Stoppa klassen vid en tavla som har kommit en bit, som i fallgropen När alla grupper har fastnat.", du: "Visa tavlan kort, ge alla samma uppgift och skicka tillbaka grupperna." }
    - { nar: När metoden inte räcker, metoden: "Lapparna på dörren visar det: samma elev har fel två veckor i rad.", du: "Ta lapparna och anteckningarna till specialläraren. Eleven kan behöva se sättet visas först, i en liten grupp." }

