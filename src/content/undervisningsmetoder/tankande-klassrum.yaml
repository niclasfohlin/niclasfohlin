  passen:
    - { nar: första lektionen, text: "Första lektionen övar klassen rutinerna på innehåll som alla kan. Ta en fyrfältare en nivå under klassens, eller Bas i åk 4–⁠5, så att alla grupper klarar ruta 1 och 2. Lotta med kortleken, ge ruta 1 muntligt och låt grupperna gå till tavlorna. Konsolidera vid två tavlor och håll anteckningarna korta." }
  fore: ["Sätt upp en tavla per grupp, som whiteboard, fönster, whiteboardark eller laminerat A3, och numrera dem.", "Välj till första lektionen en fyrfältare en nivå under klassens, eller Bas i åk 4–⁠5.", "Ta fram en kortlek med en valör per grupp, och lägg post-it-lappar och Mina anteckningar vid bänkarna."]
  utvardering: ["Arbetslaget ses varje månad läsåret ut och skivar nästa kapitels problem, och före mötet ser en kollega tio minuter av din konsolidering. Den som länge har fel på lapparna får stöd av specialläraren."]
  skattningar:
    - namn: Hur säker är jag på metoden?
      vem: lararen
      rad: lararen
      text: "Tänk på kärnan: grupperna lottades inför klassen och stod vid tavlan, uppgifterna steg i svårighet, du gav nästa steg utan att ge svaret, och ni konsoliderade nerifrån."
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: osaker }
    - namn: Hur väl fungerar den i praktiken?
      vem: lararen
      rad: klassen
      text: "Tänk på det du ser i klassen: hur långt grupperna kommer i uppgifterna, och hur många som löser lappens uppgift på egen hand."
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: klassenstar }

# ---------------------------------------------------------------------------------------------------------------------
# Lathunden
# ---------------------------------------------------------------------------------------------------------------------
lathund:
  metoden:
    text: ["Klassen löser uppgifter stående i lottade grupper om tre, vid tavlor som går att sudda. Uppgifterna har stegrande svårighetsgrad, där varje ny uppgift ändrar en sak.", "Varje ny uppgift ändrar en sak, så eleverna ser just den, och i konsolideringen ser klassen hur uppgifterna hängde ihop. Du ger nästa steg men aldrig svaret."]
  lektion:
    text: "Första lektionen övar klassen rutinerna på en fyrfältare en nivå under klassens, eller Bas i åk 4–⁠5. Starten tar åtta minuter, eftersom klassen prövar lottningen två gånger. Konsolidera vid två tavlor och håll anteckningarna korta. Säg varför: alla ska tänka tillsammans, och det är tillåtet att titta på andra tavlor."
  igang:
    rubrik: De första veckorna
