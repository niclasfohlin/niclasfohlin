  text: "Skriv ut dubbelsidigt. Välj med läraren två elever som har det svårast, A och B, i olika grupper. Stå i mitten av rummet och skriv tavlans och rutans nummer när läraren kommer till en grupp. Strecken räknar gånger, och raderna räknar det de säger, elever eller grupper."
  fokus: Ger läraren nästa steg utan att ge svaret?
  huvud: ["Problemet och uppgifterna"]
