lararensFragor:
  rubrik: Lärarens frågor
  fragor:
    - { fraga: "Får jag sätta ihop grupperna själv när klassen har kommit igång?", svar: "Nej. Lärare som slutade lotta fick tillbaka de gamla mönstren (Liljedahl, 2016). Lottningen bygger samarbetet, fast lärarens grupper klarade slutuppgiften bättre i en liten studie (Fletcher och Dise, 2025).", komponent: Lottade grupper vid tavlan }
    - { fraga: "Får jag hoppa över konsolideringen när tiden tar slut?", svar: "Nej. Fota tavlorna, och börja nästa lektion med fem minuter vid tavlorna och sedan konsolideringen. Utan den stannar det grupperna fann på väggen (Loibl m.fl., 2017).", komponent: Konsolidering nerifrån }
    - { fraga: "Hur prövar grupperna svaret, när jag undervisar i ett ämne utan tal?", svar: "Skriv en fråga på bladet som gruppen ställer till sitt svar, som ”Leder varje led till nästa?” i historia eller ”Klappar alla samma takt?” i musik. Felet du letar efter är det svaret då saknar.", komponent: Läraren håller grupperna tänkande }
    - { fraga: "Får jag visa hur man gör först, när innehållet är nytt?", svar: "Börja hellre med en uppgift alla kan. Har klassen inget att bygga på, passar Explicit undervisning bättre den lektionen.", komponent: Uppgifter med stegrande svårighetsgrad }
    - { fraga: "Var hittar jag problemen?", svar: "I problembanken och i läroboken. Skiva ett problem ur kapitlet bakåt med tabellen Så skivar du ett problem, och skriv det i mallen Din fyrfältare." }
    - { fraga: "Hur ser jag vad varje elev kan, när tavlan visar gruppen?", svar: "På lapparna på dörren och i Mina anteckningar. Där arbetar var och en själv, och du räknar lapparna." }
hinder:
  rubrik: Det svåraste med metoden
  text: "Det svåraste är konsolideringen. Den faller bort när tiden tar slut, eller blir en genomgång av den bästa tavlan, och då stannar tänkandet på väggen. Problem före genomgång hjälper när genomgången bygger på elevernas lösningar (Loibl m.fl., 2017), och lärare använder jämförelserna mindre än tänkt (Star m.fl., 2015). Gå till konsolideringen när alla har klarat ruta 2 och energin sjunker, och följ Så konsoliderar du nerifrån."
  kort: "Konsolideringen faller ofta bort eller börjar med den bästa tavlan. När alla klarat ruta 2 och energin sjunker, samla klassen vid tavlan alla kan förstå."
  komponent: Konsolidering nerifrån
fallgropar:
  rubrik: Vanliga fallgropar
  rader:
    - { fallgrop: "Grupperna väljs igen", hander: "När det går bra sätter du ihop grupperna själv, och samma elever tänker åt de andra igen.", prova: "Lotta inför klassen varje lektion, och säg varför: alla ska kunna arbeta med alla.", komponent: Lottade grupper vid tavlan }
    - { fallgrop: "Uppgifterna ändrar flera saker", hander: "Steget blir för stort, och grupperna fastnar eller ser inte vad som var nytt.", prova: "Pröva varje ruta före lektionen: vad är det enda som ändras? Där två saker ändras, dela steget i två uppgifter.", komponent: Uppgifter med stegrande svårighetsgrad }
    - { fallgrop: "Du svarar på ”Är det rätt?”", hander: "Grupperna väntar på dig, och du blir den som rättar.", prova: "Fråga ”Hur kan ni kontrollera det?”, och låt gruppen ta nästa ruta själv.", komponent: Läraren håller grupperna tänkande }
    - { fallgrop: "Konsolideringen börjar uppifrån", hander: "Du visar den bästa tavlan, eller låter grupperna redovisa i tur och ordning, och de som inte kom långt tappar tråden.", prova: "Börja vid tavla A, den alla kan gå in i, och gå uppåt en tavla i taget, som i Så konsoliderar du nerifrån.", komponent: Konsolidering nerifrån }
    - { fallgrop: "Introduktionen växer", hander: "Du förklarar och frågar länge, och eleverna sätter sig.", prova: "Högst fem minuter, med eleverna stående och utan papper. Ruta 1 muntligt." }
    - { fallgrop: "Metoden står i vägen för ämnet", hander: "Lottningen och tavlorna tar mest tid, och innehållet blir tunt.", prova: "Låt varje lektion ha ett mål ur arbetsområdet, och välj uppgifter som leder dit." }
    - fallgrop: När alla grupper har fastnat
      moment: [Vid tavlorna]
      hander: Samma steg stoppar varje grupp, och energin sjunker.
      steg: ["Stoppa klassen med er vanliga signal.", "Samla alla vid en tavla som har kommit en bit.", "Låt gruppen visa, eller ta upp ett begrepp kort.", "Ge alla samma uppgift och skicka tillbaka grupperna."]
hallFast:
  rubrik: Fem saker att hålla fast vid
  rader:
    - { sak: "När det går bra: fortsätt lotta", text: "Lärarens grupper och lottning i smyg tar bort det som får alla att bidra." }
    - { sak: "När tiden är knapp: dela lektionen på två", text: "Fota tavlorna, börja nästa lektion vid dem och fortsätt med konsolideringen, hellre än att stryka den." }
    - { sak: "När arbetsområdet byts: gör nya fyrfältare", text: "Bygg en ny fyrfältare ur kapitlets uppgifter, och pröva vad som ändras från ruta till ruta." }
    - { sak: "Efter ett lov: börja som första lektionen", text: "Rutinerna glider under ett lov. En fyrfältare en nivå under och lottningen inför klassen ger tillbaka dem." }
    - { sak: "När du skivar ensam: gör det i laget", text: "Gör fyrfältarna tillsammans och dela på dem. Hinner du inte göra en fyrfältare, lägg kapitlets uppgifter i en följd där varje uppgift ändrar en sak." }

