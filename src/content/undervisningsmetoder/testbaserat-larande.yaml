# Testbaserat lärande, en undervisningsmetod för helklass av slaget strategier. Skriven 2026-11-02 ur
# methods/_mall-undervisningsmetod.yaml, efter analysen (analys.md) och den andra analysen, innehållsbankerna
# (innehall-praktiken.md P1–P141 och innehall-karnan.md K1–K56) och facit evidens.json. Formativ bedömning är läst för
# form och ton, och förlagan Explicit undervisning för formen. Fälten film och filmer skrivs om ur de ritade filmerna i
# steg 7 (node build/filmfalt.mjs testbaserat-larande).

titel: Testbaserat lärande
undertitel: "Så hjälper du klassen att minnas det den har lärt sig, F–⁠9"
alternativaNamn: ["Retrieval practice", "Test-enhanced learning", "Successive relearning"]
ingress: "Testbaserat lärande är korta prov ur minnet som inte bedöms och inte blir betygsunderlag. Syftet är lärandet: eleverna plockar själva fram det klassen har förstått, ser det rätta samma lektion och jämför två svar. Varje område kommer tillbaka efter veckor och månader, i dina vanliga lektioner."
arskurs: ["F-3", "4-6", "7-9"]
arskursText: F–9
taggar: ["undervisningskvalitet", "evidens"]
slag: strategier
syfte: [ova]
tid: "12 minuter i din lektion, minst två lektioner i veckan"
hurOftaSkal: "Få studier jämför hur ofta proven ges, och antalet gjorde nästan ingen skillnad (Dietrichson m.fl., 2026). Två lektioner i veckan ger provet tid att bli en rutin."
period: Fem veckor att komma igång
material:
  - lektionskortet
  - provbladet längst bak i skrivboken
  - färgpennor
  - grovplaneringen
  - affischen Så gör vi provet
uppdaterad: 2026-11-04
publicerad: 2026-11-02
relaterade: ["explicit-undervisning", "kooperativt-larande", "formativ-bedomning"]
utkast: false
film:
  sekunder: 28.44
  beskrivning: "Alla skriver själva, med boken stängd. Läraren säger: ”Skriv det du minns. Det räknas inte.” Läraren säger: ”Ta färgpennan. Ordet ensamt ger ingen bock. Räck upp handen om du hade fel på fråga 2.” Läraren tänker: ”16 av 28 har bara ordet.” Läraren frågar: ”Vad visar svar B som svar A inte visar?” Läraren säger: ”En minut själv, en minut i par.” Eleven säger: ”B förklarar vad som händer.” Läraren säger: ”Exoterm betyder att energi avges.”"
  rubrik: "Provet, facit och kontrasten i en lektion i kemi"
  ingress: "Filmen visar början av en lektion i kemi i åk 8. Alla svarar ur minnet med boken stängd och rättar mot facit med två meningar att bocka. 16 av 28 har bara ordet exoterm, och läraren visar det bredvid förklaringen."
  stillbilder:
    - text: "Läraren frågar. Alla skriver ur minnet, boken stängd."
    - text: "Läraren räknar händerna: 16 av 28 har bara ordet."
    - text: "Läraren visar ordet bredvid förklaringen och frågar."
    - text: "Paren säger vad svar B visar. Läraren förklarar igen."
filmer:
  - nr: 2
    titel: "Tillbaka efter några veckor"
    sekunder: 23.09
    beskrivning: "Grovplaneringen säger när området kommer tillbaka. Fem veckor senare frågar läraren om en ny reaktion. Läraren säger: ”Skriv det du minns. Det räknas inte.” Läraren säger: ”Pennan ner. Ta färgpennan.” Fler skriver rätt: nu har 4 av 28 fel. Läraren tänker: ”4 av 28 har fel. Vidare.” Läraren säger: ”Räck upp handen om du hade fel förra gången och rätt i dag.”"
    rubrik: "Tillbaka efter några veckor"
    ingress: "Filmen visar samma klass i kemi i åk 8. Grovplaneringen säger att området reaktioner kommer tillbaka i vecka 37, 41 och 46. I vecka 46 kommer frågan tillbaka igen, med en ny reaktion. Fler skriver rätt, och de som hade fel förra gången och rätt i dag räcker upp handen."
    efter: "steg 4"
    stillbilder:
      - text: "Läraren ser i grovplaneringen vad som kommer tillbaka."
      - text: "Fem veckor senare frågar läraren om en ny reaktion."
      - text: "Läraren ser 4 av 28 med fel och går vidare."
      - text: "Fel förra gången och rätt i dag: handen upp."

profil:
  evidens:
    larande:    { tillforlitlighet: mattlig, effekt: liten, kort: "Korta prov hjälper eleverna att minnas, mest fakta, men effekten är liten.", motivering: "Måttlig tillförlitlighet, liten effekt. Korta prov gav 0,22 mot inget prov i 38 studier, mest mätt med forskarnas prov inom en vecka. Mot en startdiskussion gav ett startprov ingen skillnad på skolans prov (Dietrichson m.fl., 2026; Roy m.fl., 2023).", kallor: [dietrichson-m-fl-2026, roy-m-fl-2023] }
    lasning:    { tillforlitlighet: lag, effekt: ingen, motivering: "Låg tillförlitlighet, ingen effekt. Bara ordförråd är studerat, i små studier som ger olika svar. Studien närmast vanliga lektioner, i åk 2–⁠6, fann ingen nytta (Goossens m.fl., 2016). Läsförståelse är inte studerad.", kallor: [goossens-m-fl-2016, ruitenburg-m-fl-2026] }
    skrivning:  { tillforlitlighet: lag, effekt: mattlig, motivering: "Låg tillförlitlighet, måttlig effekt. Bara stavning är studerad, i små studier där de flesta visar effekt, och den största fann ingen säker skillnad (Ruitenburg m.fl., 2026; Bouwmeester och Verkoeijen, 2011). Textskrivning är inte studerad.", kallor: [ruitenburg-m-fl-2026, bouwmeester-och-verkoeijen-2011] }
    matematik:  { tillforlitlighet: lag, effekt: mattlig, motivering: "Låg tillförlitlighet, måttlig effekt. Framplockning gav 0,35 i 10 små studier, men talet är osäkert, och blandade uppgifter gav 0,54 (Ruitenburg m.fl., 2026). Ett läsår i Nigeria gav ingen säker effekt på årsprovet (van der Haar m.fl., 2023).", kallor: [ruitenburg-m-fl-2026, rohrer-m-fl-2020, van-der-haar-m-fl-2023] }
    amnen:      { tillforlitlighet: mattlig, effekt: mattlig, motivering: "Måttlig tillförlitlighet, måttlig effekt. Framplockning gav 0,51 i 9 små studier i NO, mest faktakunskap, och 0,45 i 4 i SO, ett osäkert tal. Ett startprov i NO gav ingen skillnad mot en startdiskussion (Ruitenburg m.fl., 2026; Roy m.fl., 2023).", kallor: [ruitenburg-m-fl-2026, roy-m-fl-2023] }
    socialt:    { tillforlitlighet: lag, effekt: ingen, motivering: "Låg tillförlitlighet, ingen effekt. Ingen studie med jämförelsegrupp har mätt studiero eller samarbete. Lärare i ett försök tyckte att lektionerna blev lugnare med prov i starten (Roy m.fl., 2023).", kallor: [roy-m-fl-2023] }
  svarighet: { lara: 2, karnan: 3, stod: 3, tid: 3, motivering: "Proven liknar det du redan gör, men kärnan glider lätt mot frågor om fakta utan återkomst. Lärarna behövde en fast rutin och stöd under året för att använda kontrasten (Rittle-Johnson m.fl., 2020)." }
  kostnad:   { kop: 2, timmar: 14, motivering: "Skolan köper färgpennor och kopierar provbladet. Omkring 14 timmar första läsåret går till läsningen, två möten, två samtal efter besök, ett besök per termin, grovplaneringen, en kvart i månaden i ämneslaget och planering de första veckorna." }
  urval:
    datum: 2026-11-02
    regel: "Studier räknas när eleverna plockar fram skolans innehåll ur minnet i prov utan betyg, när framplockningen eller övningen sprids över dagar och veckor, eller när uppgifter av olika slag blandas så att eleven väljer metod. De jämförs med att läsa om, samla övningen, öva en sorts uppgift i taget, inte repetera alls eller undervisa som vanligt. Räknas inte: spridd genomgång där eleverna inte plockar fram själva, prov med betyg, laboratoriestudier med konstruerat material, förprov och högskola. Studier om kontrasten räknas inte."
    text: "Vi sökte 2026-11-02 i sammanställningar om skolan, följde referenserna bakåt och framåt i en metaanalys om skolan, sökte i ERIC område för område och en gång till i varje område med svagt stöd. Vi valde sammanställningar om skolan före dem om högskolan och laboratoriet. De flesta studier mätte med forskarnas egna prov inom en vecka, och den enda stora studien med skolans egna prov fann ingen skillnad mot en startdiskussion. Vi valde femton källor."
    slutsatser:
      oversikt: "Fem sammanställningar pekar åt samma håll: korta prov utan betyg ger bättre minne av det som övades. I skolan gav framplockning 0,37, spridning 0,20 och blandning 0,40 (Ruitenburg m.fl., 2026), och proven 0,22 mot inget prov (Dietrichson m.fl., 2026). Effekten gäller mest fakta, mätt inom några dagar, och större tal kommer mest från högskolan (Yang m.fl., 2021)."
      experiment: "De största försöken med effekt gäller matematik med blandade uppgifter: i åk 7 gav de 0,83 på forskarnas prov en månad senare (Rohrer m.fl., 2020). Ett läsår i Nigeria gav 0,29 på terminsproven men ingen säker effekt på årsprovet (van der Haar m.fl., 2023). I 15 engelska skolor gav ett startprov i NO ingen skillnad mot en startdiskussion (Roy m.fl., 2023), och en studie av ordförråd i vanliga lektioner i åk 2–⁠6 fann ingen nytta (Goossens m.fl., 2016). I stavning blev det ingen säker skillnad (Bouwmeester och Verkoeijen, 2011)."
      annan: "De två vägledningarna ger samma råd: sprid det viktiga över veckor, låt alla plocka fram ur minnet, visa det rätta och planera hela kursen (Pashler m.fl., 2007; EEF, 2021). Effekten minskar när innehållet har många delar som hänger ihop (Van Gog och Sweller, 2015), och att jämföra lösningar stöder förståelsen (Rittle-Johnson m.fl., 2020). Kristiansson och Swärd (2025) visar hur proven och facit kan se ut i svenska klasser i åk 5–⁠6."
    uteslutna:
      - { namn: "Agarwal m.fl. (2021)", skal: "Översikt som ingen nivå bygger på, och Churches m.fl. fick platsen i listan" }
      - { namn: "Molin m.fl. (2021)", skal: "Mätte provängslan, som inte räknas till Socialt" }
      - { namn: "Murray m.fl. (2025)", skal: "Sammanställning med mest studier från högskolan" }
      - { namn: "Mawson och Kang (2025)", skal: "Blandar in högskolan och spridd omläsning" }

# ---------------------------------------------------------------------------------------------------------------------
# 1 Metoden
# ---------------------------------------------------------------------------------------------------------------------
inledning:
  - "Testbaserat lärande är två lager över din undervisning, ett kort prov i dina lektioner och en grovplanering för terminen, så att det klassen har förstått sitter kvar efter veckor och månader. I början av två eller tre lektioner i veckan gör eleverna ett kort prov ur minnet med minst ett varför, ser det rätta samma lektion och jämför två svar. Provet räknas inte. Det är själva övningen och ingen mätning, och det visar eleverna vad de kan och dig vad undervisningen behöver mer av."
  - "På bänken ligger elevens skrivbok, med provbladet inklistrat längst bak. Eleven skriver svaren på sidorna närmast bladet och rättar dem med en färgpenna. På provbladet skriver hen en rad per prov med det hen hade fel på. Frågorna står på tavlan, och affischen Så gör vi provet sitter på väggen. Din grovplanering, som du gör med ämneslaget, säger vecka för vecka vad som kommer tillbaka i provet."
  - "Lärandet går till så här. Den som läser om känner att hen kan, medan den som själv plockar fram stärker minnet och ser vad som inte satt. Facit samma lektion gör att felet inte sitter kvar. När två svar står bredvid varandra ser eleven vad det ena visar som det andra inte visar, som skillnaden mellan att kunna ett ord och att förstå ett begrepp. Det som kommer tillbaka efter ett uppehåll måste plockas fram igen, och då sitter det längre."
  - "Alla fem delarna av kärnan finns i liten form från första lektionen, och veckorna säger vad ni övar särskilt. Vecka 1 har provet två frågor om förra lektionen, den andra ett varför, och en lätt fråga från förra terminen. Vecka 2 övar ni facit och färgpennan, vecka 3 frågor från olika tider och vecka 4 kontrasten. Vecka 5 kommer området från vecka 1 tillbaka med nya tal eller ett nytt exempel, och eleverna ser på provbladet vad som satt. Efter fem veckor är provet en rutin, och i grovplaneringen står det som ska komma tillbaka resten av terminen."
karna:
  rubrik: "Kärnan: fast och fritt"
  text: "Proven hjälper när eleverna gör det som ger effekten: alla plockar fram själva, ser det rätta samma lektion och möter innehållet igen efter ett uppehåll. Frågorna och kontrasten gör att eleverna också prövar förståelsen bakom orden. Därför är frågorna en egen del av kärnan. Det är där metoden skiljer sig från mekanisk minnesträning."
  grundregel: De fem är kärnan, och den håller du fast vid. Proven gäller det klassen har förstått, och frågorna, svarsformen och ämnet väljer du.
  varv: Fråga om det som ska sitta, låt alla svara ur minnet, visa facit, räkna felen, jämför två svar och ta frågan igen.
  komponenter:
    - namn: Frågor om det som ska sitta
      moment: [Provet]
      vad: Minst en fråga kräver ett varför, ett exempel eller en metod.
      syns: "Eleverna förklarar varför, ger ett exempel eller väljer metod på minst en av provets frågor, utöver frågorna om ord och fakta."
      raknas: false
      varfor: "Eleven blir bäst på det slag av frågor hen övar på. Jämför man studier, gav proven 0,53 för fakta men ingen säker vinst för förståelse och överföring (Ruitenburg m.fl., 2026). Den amerikanska IES-vägledningen bedömde stödet för varför-frågor som starkt (Pashler m.fl., 2007)."
      belagg: provad
      kallor: [ruitenburg-m-fl-2026, pashler-m-fl-2007]
      kvar: Du frågar om det eleverna ska kunna om en månad, och minst en fråga gäller ett varför, ett exempel eller en metod.
      fritt: "Antalet frågor, flerval eller kort svar, frågor ur läromedlet eller från ämneslaget, vilken fråga som kräver en förklaring, och i moderna språk varför-frågan på svenska."
      kryss: Minst en fråga krävde ett varför, ett exempel eller en metod
    - namn: Alla svarar ur minnet
      moment: [Provet]
      vad: Varje elev svarar själv ur minnet, innan något svar visas.
      syns: Alla elever skriver samtidigt med stängd bok, och läraren ser ett svar från varje elev innan facit kommer.
      varfor: "Att läsa om ger en känsla av att kunna. Att själv plocka fram stärker minnet och visar vad som inte satt. Det gav 0,37 mot att läsa om eller sammanfatta i 31 studier i skolan (Ruitenburg m.fl., 2026), och 0,22 mot inget prov (Dietrichson m.fl., 2026)."
      belagg: provad
      kallor: [ruitenburg-m-fl-2026, dietrichson-m-fl-2026]
      kvar: Varje elev svarar själv ur minnet innan hen ser svaret, och provet räknas inte till något betyg.
      fritt: "Papper, minitavla, kort, muntligt eller att visa med kroppen, när alla svarar först. Ledtrådar och bilder för de yngsta."
      kryss: Alla svarade själva innan svaret visades
    - namn: Det rätta samma lektion
      moment: [Facit]
      vad: När alla har svarat visar du det rätta, och varje elev rättar sitt svar.
      syns: Eleverna rättar sina svar med färgpennan mot facit innan lektionen går vidare, och markerar det de inte kunde.
      varfor: "Utan facit sitter felen kvar till nästa prov (Pashler m.fl., 2007). Jämför man studier, gav prov med facit 0,54 och prov utan 0,37 (Yang m.fl., 2021), men två nyare översikter fann ingen säker skillnad (Ruitenburg m.fl., 2026; Dietrichson m.fl., 2026)."
      belagg: provad
      kallor: [pashler-m-fl-2007, yang-m-fl-2021, ruitenburg-m-fl-2026, dietrichson-m-fl-2026]
      kvar: Du visar det rätta samma lektion när alla har svarat, och varje elev rättar sitt eget svar.
      fritt: "Facit på tavlan eller på ett blad, färgpenna eller bock, och eleven rättar själv eller i par. Provbladet stannar hos eleven."
      kryss: Eleverna rättade mot facit samma lektion
    - namn: Två svar bredvid varandra
      moment: [Kontrasten]
      vad: Två svar står bredvid varandra, och klassen säger vad som skiljer.
      syns: "Eleverna säger eller skriver vad det ena svaret visar som det andra inte visar, först själva och sedan i par."
      varfor: "Ett prov befäster det eleven har förstått men ger ingen säker vinst för förståelsen (Ruitenburg m.fl., 2026). Komponenten bygger på att två lösningar sida vid sida lär eleven välja mellan sätt, och att fel bredvid rätt gav mer förståelse i en studie (Rittle-Johnson m.fl., 2020)."
      belagg: teori
      kallor: [ruitenburg-m-fl-2026, rittle-johnson-m-fl-2020, pashler-m-fl-2007]
      kvar: Du ställer två svar bredvid varandra, eleverna säger vad som skiljer dem, och du säger vilket som håller.
      fritt: "Två eller tre svar: felet eller ordet bredvid ett svar som håller, och två rätta sätt när nästan alla kan, på tavlan eller på papper."
      kryss: Klassen jämförde två svar och sa vad som skilde dem
    - namn: Tillbaka efter några veckor
      moment: [Provet]
      vad: Varje område kommer tillbaka efter en vecka, veckor och månader.
      syns: Provet har frågor från förra veckan, förra området och förra terminen, och i matematik en uppgift som inte säger vilken metod den kräver.
      raknas: false
      varfor: "Det som övas vid ett tillfälle glöms fort. Spridd övning gav 0,39 mot samma övning samlad, mest när uppehållet mellan övningarna var minst en tiondel av tiden fram till provet, och blandade uppgifter gav 0,54 i matematik (Ruitenburg m.fl., 2026). I åk 7 gav de 0,83 (Rohrer m.fl., 2020)."
      belagg: provad
      kallor: [ruitenburg-m-fl-2026, pashler-m-fl-2007, rohrer-m-fl-2020]
      kvar: Eleverna tar fram det viktiga minst två gånger till med veckor emellan och väljer metod i matematikens blandade rader.
      fritt: "Hur många veckor emellan och vilka områden, provet igen med nya tal, en uppgift i ett nytt sammanhang och läxan."
      kryss: Provet hade en fråga från ett äldre område
roll:
  rubrik: "Lärarens roll: du frågar om det som varit och låter det komma tillbaka"
  text: Du leder provet och facit, låter klassen tänka själv i kontrasten och ser till att det som ska sitta kommer tillbaka efter några veckor.
  fragor:
    - Vad ska sitta om en månad?
    - Vad visar svaren om hur de tänker?
    - När kommer det här tillbaka?
  fragornaText: "Du har dem med dig i varje del: när du väljer frågorna, när du läser svaren vid facit och kontrasten, och när du räknar felen och bestämmer när frågan kommer tillbaka."

# ---------------------------------------------------------------------------------------------------------------------
# 2 Lektionen: lagret i din lektion
# ---------------------------------------------------------------------------------------------------------------------
tidsschema:
  rubrik: Provet i din lektion
  rader:
    - { tid: Före lektionen, fas: Före lektionen, vad: "Välj tre till fem frågor efter grovplaneringen: en lätt om förra veckan först, varför-frågan som nummer två och en om ett äldre område. Skriv dem på tavlan, och skriv facit till varför-frågan med två eller tre meningar att bocka." }
    - { tid: 5 min, fas: Provet, form: Enskilt, vad: "Alla svarar ur minnet i skrivboken, med böckerna stängda, på frågor från olika tider." }
    - { tid: 4 min, fas: Facit, form: Enskilt, vad: "Du visar facit, eleverna rättar med färgpennan och skriver en rad på provbladet, och du räknar eleverna med fel på frågan med flest fel." }
    - { tid: 3 min, fas: Kontrasten, form: Gemensamt, vad: "Två svar på samma fråga står bredvid varandra, och eleverna säger vad som skiljer dem, först själva och sedan i par. Sist svarar alla på en följdfråga." }
    - { tid: 30 min eller mer, fas: Din lektion, form: Läraren visar, vad: "Resten av lektionen undervisar du som du har planerat." }
    - { tid: Efter lektionen, fas: Efter lektionen, vad: "Skriv frågan med flest fel i grovplaneringen, i den vecka den kommer tillbaka, med de två svar ni jämförde eller vill jämföra." }
  varianter:
    - nar: första lektionen
      text: "Provet har två frågor om förra lektionen, den andra ett varför, och en lätt fråga från förra terminen. Kontrasten tar två minuter: du tänker högt om två svar på varför-frågan, och paren säger efter dig vad svar B visar."
      delar:
        - { fas: Provet, tid: 0–⁠5 min }
        - { fas: Facit, tid: 5–⁠9 min }
        - { fas: Kontrasten, tid: 9–⁠11 min, fraser: ["Svar A säger bara ordet. Svar B säger vad man gör.", "Säg till din kamrat vad svar B visar."] }
        - { fas: Din lektion, tid: 11–⁠45 min }
    - nar: när provet ligger senare i lektionen
      text: "I idrott och hälsa, slöjd eller hem- och konsumentkunskap kan provet komma när klassen samlas efter uppvärmningen eller i en paus i arbetet. Eleverna svarar muntligt eller visar med kroppen, och facit kommer direkt efter. Raden på provbladet skriver de nästa gång de har skrivboken."
      delar:
        - { fas: Din lektion, tid: 0–⁠20 min }
        - { fas: Provet, tid: 20–⁠25 min }
        - { fas: Facit, tid: 25–⁠29 min }
        - { fas: Kontrasten, tid: 29–⁠32 min }
  efter: "Kontrasten gör ni när fler än var femte har fel, och minst en gång i veckan. När hälften eller fler har fel, förklarar du dessutom igen med ett nytt exempel när din lektion börjar. De andra dagarna går minuterna till din lektion, och det som ska komma tillbaka står i grovplaneringen."
steg:
  rader:
    - namn: Provet
      fraga: "Plockar alla fram själva?"
      alla: Skriver sitt eget svar i skrivboken i tystnad, med boken stängd, innan något svar visas.
      titta: Tomma rader, och den som tittar hos grannen eller skriver snabbt men fel.
      beslut: "Om fler än var femte har tomma rader eller tittar i boken, är frågorna för svåra. Ta en lättare fråga först nästa gång, och ge en ledtråd till den som behöver."
      gor:
        - Frågorna står på tavlan när eleverna kommer in. Läs dem högt när provet börjar, så att den som läser långsamt hinner.
        - "”Läroböckerna stängda. Skriv det du minns. Det räknas inte.”"
        - Ställ en klocka på fem minuter som alla ser, och gå runt utan att hjälpa till med svaren. Leta efter två svar till kontrasten.
        - "Säg efter tre minuter: ”Gå vidare till fråga 3.” Den som blir klar tidigt svarar på extrafrågan, en svårare fråga sist på tavlan."
        - "Säg ”Pennan ner”, också om några inte är klara."
      fraser: ["Skriv det du minns. Det räknas inte.", "Pennan ner. Facit."]
    - namn: Facit
      fraga: "Vilken fråga hade flest fel, och hur många?"
      alla: Rättar med färgpennan, räcker upp handen för det de hade fel på och skriver en rad på provbladet.
      titta: Frågan med flest fel, och felet som kommer igen.
      beslut: "Räkna eleverna med fel på frågan med flest fel, efter händerna och det du såg under provet. Saknas en enda bock på varför-frågan, är svaret fel. Talet avgör."
      gor:
        - "”Pennan ner. Ta färgpennan, och sudda inte.” Visa facit, i matematik med uträkningen, och varför-frågans två eller tre meningar."
        - "”En bock för varje mening du har med. Ordet ensamt ger ingen bock.”"
        - "”Räck upp handen om du hade fel på fråga 2.” Räkna händerna fråga för fråga, och se vilken som hade flest fel."
        - "”Skriv en rad på provbladet.” Kommer en fråga tillbaka: ”Räck upp handen om du hade fel förra gången och rätt i dag.”"
        - Gå bara igenom frågan med flest fel. Gör ni ingen kontrast, säg kort varför det rätta svaret håller.
      fraser: ["Pennan ner. Ta färgpennan.", "Räck upp handen om du hade fel på fråga 2."]
      redo:
        nastanAlla: Högst 5 av 28 med fel. Gå vidare, och ge dem med fel en ny uppgift av samma slag när klassen arbetar. Frågan kommer tillbaka om några veckor.
        deFlesta: 6–13 av 28 med fel. Gör kontrasten och ställ en följdfråga till alla. Ta frågan igen nästa vecka.
        halften: 14 eller fler av 28 med fel. Gör kontrasten, och förklara igen med ett nytt exempel när din lektion börjar. Frågan kommer tillbaka nästa lektion.
        tiden: "Räcker tiden inte till kontrasten, börjar ni nästa lektion med de två svaren. Skriv frågan i grovplaneringen."
    - namn: Kontrasten
      fraga: "Vad visar det ena svaret som det andra inte visar?"
      alla: Säger vad som skiljer de två svaren, först själva och sedan i par, och svarar själva på följdfrågan.
      titta: Att paren talar om innehållet och inte om vem som skrev.
      beslut: "Säg själv vad som håller när klassen har jämfört. Såg klassen inte skillnaden, visa ett eget svar bredvid de två."
      gor:
        - Ta de två svaren ur din planering, eller två du såg under provet. Skriv av svaren utan namn, som svar A och svar B.
        - Grundformen är ett fel eller ett svar med bara ordet, bredvid ett svar som håller. När nästan alla kan, passar två rätta sätt.
        - "”Vad visar svar B som svar A inte visar? En minut själv, en minut i par.” Skriv på tavlan: ”Svar B visar …”"
        - Peka växelvis på svaren och ringa in det som skiljer. Säg sist i en mening vad som håller, och skriv den bredvid svaren.
        - Ställ en följdfråga om samma sak i ny form. Alla svarar i färg under sitt eget svar, och du ser vem som har felet kvar.
      fraser: ["Vad visar svar B som svar A inte visar?", "En minut själv, en minut i par."]
    - namn: Din lektion
      vem: som du har planerat
      fraga: "Vad från i dag ska komma tillbaka senare?"
      alla: Arbetar med dagens innehåll, som du har planerat.
      titta: Det i dagens lektion som är värt att minnas om en månad.
      beslut: Skriv det i grovplaneringen efter lektionen, så att det kommer tillbaka första gången om ungefär en vecka.
      gor:
        - Undervisa som du har planerat. Frågor om det dagens lektion bygger på ställer du här, och inte i provet.
        - Är frågan med flest fel en förkunskap till i dag, börja lektionen där.
      fraser: ["Det här ska ni kunna om en månad."]
lektionskort:
  - { efter: klassen, text: "Lektionskortet är lektionen på ett A4: kärnan, provet, facit och kontrasten med det du säger, de tre utfallen och trappan. Skriv ut det och ha det i handen." }
fastnar:
  rubrik: Så rättar du
  text: "Du rättar inte i efterhand. Eleven rättar sitt eget svar mot facit samma lektion, och du går bara igenom frågan med flest fel. Varför-frågan rättar eleven mot meningarna i facit, en bock per mening."
  trappa:
    - "Visa facit: ”Pennan ner. Ta färgpennan.”"
    - Säg kort varför svaret håller.
    - Visa två svar bredvid varandra när svaren skilde sig.
    - Ge dem med fel samma slags uppgift samma lektion, med nya tal eller ett nytt exempel.
    - Ta frågan igen i ett senare prov.
  motto: Felet visar vad vi ska öva på.
amnesexempel:
  - amne: lasning
    arskurs: åk 2
    innehall: "Faktatext om grodan: ord och innehåll en vecka senare"
    overst:
      egen: "Bestämda frågor om förra veckans faktatext, och ett varför. Att skriva allt man minns ger för lite hos de yngsta."
      visar: Alla ritar eller skriver ett ord på minitavlan och visar på signalen.
    scen:
      - "Tänk dig en lektion i svenska i åk 2. För en vecka sedan läste klassen en faktatext om grodan. Boken är stängd. Du läser tre frågor högt och visar en bild till varje: ”Var lägger grodan sina ägg? Vad kallas ungarna? Varför kan grodynglet inte leva på land?”"
      - "Alla tänker tyst, ritar eller skriver ett ord på minitavlan och visar på din signal. Du läser facit och visar bilden ur boken. Fråga 3 har flest fel: 4 av 26. Nästan alla kan. Du säger: ”Grodynglet andas med gälar, som en fisk.” Frågan kommer tillbaka om några veckor."
    notera: "Notera vad som hände. Bestämda frågor och bilder gav alla något att plocka fram utan att skriva mycket. Hade fler än fem haft fel, hade du visat två svar bredvid varandra: ”Det kan inte gå” och ”Det andas med gälar”."
  - amne: skrivning
    arskurs: åk 9
    innehall: "Argumenterande text: ett argument och en förklaring i samma stycke"
    overst:
      egen: "Ett stycke har ett argument och en förklaring. Felet: att kunna regeln men skriva argumentet utan förklaring."
      visar: Alla skriver i skrivboken, och skriver om sin mening i färg efter kontrasten.
    scen:
      - "Tänk dig en lektion i svenska i åk 9. För fyra veckor sedan skrev klassen insändare, och fråga 2 i provet är: ”Skriv ett stycke om mobilfria skolor, med ett argument och en förklaring.”"
      - "Facit har två meningar att bocka: ett argument och en förklaring av varför det håller. 11 av 28 har bara argumentet. De flesta kan. Du skriver två elevsvar bredvid varandra, utan namn. Svar A: ”Mobilen stör i klassrummet.” Svar B: ”Mobilen stör, eftersom den som får ett meddelande tappar tråden.” Du frågar: ”Vad visar svar B som svar A inte visar?”"
      - "Paren säger att svar B förklarar. Alla skriver om sin egen mening i färg med ett eftersom, och du läser några högt."
    notera: "Notera vad som hände. Regeln satt, men den syntes inte i texterna förrän två meningar stod bredvid varandra. Hade högst fem haft fel, hade frågan kommit tillbaka i ett prov om några veckor."
  - amne: matematik
    arskurs: åk 6
    innehall: "Omkrets och area hos rektanglar, och skala från förra området"
    huvud: true
    overst:
      egen: "Omkrets och area är olika saker, och samma omkrets kan ge olika area."
      visar: Alla skriver i skrivboken och räcker efter facit upp handen för de frågor de hade fel på.
    plan:
      klass: 6B
      datum: ons 9/9
      lektion: 2 av 12
      mal: "räkna ut 10 % och 25 % av ett belopp"
      belagg: "25 % av 60 kr sist i lektionen"
      blad: "frågorna på tavlan och facit med tre meningar"
      forberett: "frågorna uppläsda, och rutpapper till den som vill rita"
      fore: { veckan: "Staketet runt en rabatt som är 8 m och 3 m", omradet: "Skala 1:1 000, 3 cm på kartan", terminen: "Inget i dag", varfor: "Två rektanglar med omkretsen 18 cm: samma area?", svarA: "”5 och 4, 6 och 3. Samma omkrets, samma area.”", svarB: "”5 och 4 är 20 rutor, 6 och 3 är 18. Olika area.”", fragan: "Vad visar svar B som svar A inte visar?" }
      delar:
        - { fas: Provet, text: "Rita en kvadrat med omkretsen 20 cm. Hur stor är arean?" }
        - { fas: Facit, text: "Två rektanglar, arean för båda, och att den kan skilja sig" }
        - { fas: Kontrasten, text: "Omkretsen är kanten, arean är rutorna innanför." }
        - { fas: Din lektion, text: "Procent: 10 % och 25 % av ett belopp" }
      beslut: { elever: 28, nastanAlla: "om tre veckor, med omkretsen 24 cm", deFlesta: ["svar A bredvid svar B", "7 och 2 har också omkretsen 18 cm. Hur stor är arean?"], halften: "rutpapper: rita och räkna rutorna" }
      efter: { kontrollen: "fråga 2, 9 av 28 med fel", hogar: "ett svar som räknade omkretsen i stället för arean", sag: "”B räknade rutorna, och det gjorde inte A.”", kryss: [1, 2, 3, 4, 5], nasta: "arean med omkretsen 24 cm, och 25 % av 60 kr", forst: "omkrets och area igen om tre veckor" }
      lagg: ["Lägg märke till: båda svaren har rätt rektanglar, och bara svar B räknar arean."]
    remsa:
      - "Fråga 2 krävde en förklaring av omkrets och area, och ett tal räckte inte."
      - Alla 28 skrev ur minnet i skrivboken, med böckerna stängda.
      - Samma lektion rättade alla med färgpennan mot facit, med tre meningar att bocka.
      - "Svar A stod bredvid svar B: samma rektanglar, men bara B räknade arean."
      - Skala kom från förra området, och arean kommer tillbaka nästa vecka med omkretsen 24 cm.
    scen:
      - "Tänk dig en lektion i matematik i åk 6. Omkrets och area var förra veckan, och skala förra området. På tavlan står: ”1 En rektangulär rabatt är 8 m och 3 m. Hur långt staket behövs runt den? 2 Rita två rektanglar som båda har omkretsen 18 cm. Har de samma area? Förklara. 3 En karta har skalan 1:1 000. Hur långt är 3 cm på kartan i verkligheten?”"
      - "Efter fem minuter visar du facit, och för fråga 2 tre meningar att bocka."
      - "Fråga 2 har flest fel: 9 av 28 svarade att arean blir lika. De flesta kan. Du visar två svar. Svar A: ”5 och 4, 6 och 3. Samma omkrets, samma area.” Svar B: ”5 och 4 är 20 rutor, 6 och 3 är 18. Olika area.” Du frågar: ”Vad visar svar B som svar A inte visar?” Paren räknar rutorna. Du säger: ”Omkretsen är kanten, arean är rutorna innanför.” Alla svarar i färg på följdfrågan: ”7 och 2 har också omkretsen 18 cm. Hur stor är arean?”"
    notera: "Notera vad som hände. Fråga 1 sa inte omkrets, så eleverna valde metod själva. Facit med meningarna lät eleverna rätta varför-frågan själva, svar B visade det som svar A bara hade gissat, och följdfrågan visade vem som hade felet kvar. Med högst fem fel hade frågan väntat tre veckor, och med 14 eller fler hade du förklarat igen med rutpapper. Nu kommer den tillbaka nästa vecka med omkretsen 24 cm, och om tre veckor i ett nytt sammanhang."
  - amne: so-no
    amnesnamn: Kemi
    arskurs: åk 8
    innehall: "Kemiska reaktioner och energi: vad som händer vid en exoterm reaktion"
    overst:
      egen: "Vid en exoterm reaktion avges energi, ofta som värme. Felet: att kunna ordet exoterm utan att kunna säga vad som händer."
      visar: Alla skriver i skrivboken och rättar mot facit med två meningar att bocka.
    scen:
      - "Tänk dig en lektion i kemi i åk 8. Klassen arbetade med kemiska reaktioner för fem veckor sedan, och frågan kommer från grovplaneringen: ”Vad händer vid en exoterm reaktion? Förklara med egna ord.”"
      - "Facit har två meningar att bocka: ämnena reagerar och bildar nya ämnen, och energi avges, ofta som värme. Ordet ensamt ger ingen bock. 16 av 28 har bara skrivit ”Det är en exoterm reaktion”. Hälften eller färre kan."
      - "Du visar två svar bredvid varandra. Svar A: ”Det är en exoterm reaktion.” Svar B: ”Två ämnen reagerar och blir ett nytt ämne, och då blir det varmt. Värme går ut.” Du frågar: ”Vad visar svar B som svar A inte visar?” Sedan förklarar du igen med stålull som brinner, där värmen känns. Frågan kommer tillbaka nästa lektion."
    notera: "Notera vad som hände. Facit med meningarna gjorde att ordet ensamt inte räckte, och kontrasten visade varför. Hade högst fem haft fel, hade frågan kommit tillbaka om en månad med en ny reaktion."
  - amne: praktisk-estetiska
    amnesnamn: Idrott och hälsa
    arskurs: åk 5
    innehall: "Taktik i lagspel: att spela sig fri och skapa en tom yta i anfall"
    overst:
      egen: "Den som inte har bollen rör sig bort från försvararen, mot en tom yta. Felet: att alla springer mot bollen."
      visar: Alla ställer sig på planen där de skulle vara, och säger sitt varför till en kamrat.
    scen:
      - "Tänk dig en lektion i idrott och hälsa i åk 5. För tre veckor sedan spelade klassen basket och övade att spela sig fri. Provet kommer efter uppvärmningen, när klassen samlas i mittcirkeln."
      - "Du ritar en situation i anfall på en whiteboard: ”Din lagkamrat har bollen vid sidlinjen, och en försvarare står framför dig. Vart springer du, och varför?” Alla tänker tyst och ställer sig på din signal där de skulle vara. Sedan säger var och en sitt varför till en kamrat."
      - "Du visar facit: bort från försvararen, ut mot en tom yta, så att bollen kan spelas fram. 3 av 24 springer mot bollen. Nästan alla kan. Klassen spelar, och du går först till de tre."
    notera: "Notera vad som hände. Provet kom senare i lektionen och var muntligt och med kroppen, och alla svarade själva innan facit. Hade fler än fyra sprungit mot bollen, hade du visat två placeringar bredvid varandra först."
stod:
  rubrik: Elever som behöver mer stöd
  rader:
    - { nar: Den som är ny i svenska, metoden: "Du läser frågorna högt, och eleven svarar med ett ord, en bild, en siffra eller genom att peka. Varför-frågan kan hen besvara med en bild eller muntligt.", du: "Visa ämnets ord med bild före lektionen, och låt bild och ord stå kvar vid facit och kontrasten. Ge instruktionen på modersmålet när det går." }
    - { nar: Den yngsta, metoden: "Bestämda frågor, bilder och muntliga svar gör att eleven kan plocka fram utan att skriva allt.", du: "I F–⁠4: ställ bestämda frågor, som ”Var lägger grodan sina ägg?”, läs upp facit och ha en eller två korta meningar att bocka. Ge en ledtråd, som första ljudet, till den som behöver den." }
    - { nar: Den som ofta har fel, metoden: "Provet räknas inte, frågorna går att svara på delvis, och facit kommer direkt.", du: "Börja med en fråga som de flesta klarar, och ge en ledtråd bara till hen. Visa vid facit vad hen hade rätt på, och gå först till hen i din lektion med en ny uppgift av samma slag." }
    - { nar: Den som redan kan, metoden: "Varför-frågan och frågorna från äldre områden ger något att arbeta med.", du: "Ge extrafrågan eller en uppgift i ett nytt sammanhang, eller be eleven skriva en fråga med facit till ett senare prov." }
    - { nar: När många behöver hjälp samtidigt, metoden: "I kontrasten arbetar hela klassen med frågan med flest fel på en gång.", du: "Visa två svar bredvid varandra och ställ en följdfråga som alla svarar på, i stället för att gå runt till var och en. De som är klara gör extrafrågan." }
    - { nar: När metoden inte räcker, metoden: "Provbladet visar om eleven har fel på samma slags fråga gång på gång.", du: "Har eleven samma fel efter kontrasten och ett nytt exempel, visa hens provblad för specialläraren. Räcker inte det, ta det med elevhälsan." }

