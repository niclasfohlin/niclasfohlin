# 4 Håll i
# ---------------------------------------------------------------------------------------------------------------------
lararensFragor:
  rubrik: Lärarens frågor
  fragor:
    - { fraga: "Får jag sätta poäng på provet?", svar: "Nej. Provet räknas inte, och då vågar eleverna svara fel. Slutprovet i arbetsområdet bedömer du som vanligt. Prov utan betyg kändes mindre pressande (Yang m.fl., 2023).", komponent: Alla svarar ur minnet }
    - { fraga: "Får jag hoppa över facit när tiden är knapp?", svar: "Nej. Ta hellre tre frågor och facit, och gå bara igenom frågan med flest fel. Utan facit står felen kvar till nästa prov (Pashler m.fl., 2007).", komponent: Det rätta samma lektion }
    - { fraga: "Eleverna har glömt nästan allt. Har jag misslyckats?", svar: "Nej. Glömskan är väntad vid den första återkomsten, och det eleverna lär om går fortare än första gången (Pashler m.fl., 2007). Säg det till dem, och ta frågan igen nästa lektion.", komponent: Tillbaka efter några veckor }
    - { fraga: "Får jag hoppa över kontrasten?", svar: "När nästan alla kan, ja, och minuterna går till din lektion. Gör den ändå minst en gång i veckan. Det är där klassen ser vad som skiljer ett ord från ett begrepp.", komponent: Två svar bredvid varandra }
    - { fraga: "Får jag behålla min vanliga start på lektionen?", svar: "Ja, om den blir provet. Ett quiz utan poäng går bra. Ett startprov om tidigare innehåll gav inte mer än en startdiskussion i 15 skolor (Roy m.fl., 2023). Låt därför frågorna återkomma efter veckor, med ett varför.", komponent: Tillbaka efter några veckor }
    - { fraga: "Hur hinner jag kursen när det gamla ska komma tillbaka?", svar: "Provet ersätter din egen repetition och en del av bokens uppgifter, och lagret tar tolv minuter två eller tre gånger i veckan. Lägg några av återkomsterna i läxan, så får lektionen mer tid (Pashler m.fl., 2007)." }
hinder:
  rubrik: Det svåraste med metoden
  text: "Det svåraste är att låta innehållet komma tillbaka när klassen har gått vidare. Stoffet tränger på, läroboken går framåt, och provet krymper till en fråga om förra lektionen. Då försvinner det som får kunskapen att hålla över veckor, och återkomsterna kräver att du planerar hela kursen (EEF, 2021). Skriv därför in dem i grovplaneringen, helst innan terminen börjar och senast före den tredje veckan med provet, och hämta provets frågor därifrån (Pashler m.fl., 2007)."
  kort: "Det som ofta faller bort är att innehållet kommer tillbaka när klassen har gått vidare. Skriv in återkomsterna i grovplaneringen senast före den tredje veckan med provet, och ta provets frågor därifrån."
  komponent: Tillbaka efter några veckor
fallgropar:
  rubrik: Vanliga fallgropar
  rader:
    - { fallgrop: "Frågorna prövar bara ordet", hander: "Provet frågar efter namn, ord och årtal. Eleverna kan ordet men känner inte igen begreppet i en ny mening eller uppgift.", prova: "Byt en faktafråga mot ”Förklara varför” eller ”Ge ett exempel”, och i matematik mot en blandad uppgift.", komponent: Frågor om det som ska sitta }
    - { fallgrop: "Svaren kommer från någon annan", hander: "Svaren ropas ut, paret svarar direkt eller eleverna tittar i boken. De som väntar känner igen svaret utan att ha plockat fram det.", prova: "Lägg undan böckerna. Alla skriver ett eget svar innan någon säger något, och sedan kommer facit.", komponent: Alla svarar ur minnet }
    - { fallgrop: "Facit kommer senare", hander: "Du samlar in och rättar senare. Felen står kvar till nästa prov, eleven vet inte vad hen kan, och rättningen tar dina kvällar.", prova: "Visa facit samma lektion, och eleverna rättar själva med färgpennan.", komponent: Det rätta samma lektion }
    - { fallgrop: "Kontrasten blir en uppvisning", hander: "Elev efter elev visar hur hen gjorde, och samtalet handlar om vem som skrev. Eller så visar du bara det rätta, och klassen ser inte varför.", prova: "Välj två svar medan eleverna skriver, visa dem utan namn och fråga vad det ena visar som det andra inte visar.", komponent: Två svar bredvid varandra }
    - { fallgrop: "Inget kommer tillbaka", hander: "Provet gäller bara förra lektionen, och området bockas av när det är klart. Efter en månad har klassen glömt det mesta.", prova: "Ta en fråga från ett äldre område i varje prov, och välj den ur grovplaneringen.", komponent: Tillbaka efter några veckor }
    - fallgrop: När eleverna tittar i boken eller hos grannen
      moment: [Provet]
      hander: Några tittar i boken eller hos grannen, och svaren visar inte vad var och en minns.
      steg:
        - Lägg undan böckerna innan du läser frågorna, och stå där du ser skrivböckerna.
        - "Säg lugnt: ”Det du inte minns är det vi ska öva på.”"
        - Ställ dig bredvid den som tittar, utan att säga något mer.
        - Säg vid facit att ett tomt svar visar vad klassen ska öva på.
        - Ta en lättare första fråga nästa gång.
    - fallgrop: När en elev blir orolig
      moment: [Provet]
      hander: En elev säger att hen inte kan något, låser sig eller lämnar raderna tomma.
      steg:
        - Gå fram och tala lågt.
        - "Säg: ”Skriv det lilla du minns. Det du inte minns ska vi öva på.”"
        - Ge en bestämd fråga eller de första bokstäverna, bara till eleven.
        - Påminn om att provet inte samlas in.
        - Kom tillbaka vid facit och visa vad hen hade rätt på.
    - fallgrop: När provet tar för lång tid
      moment: [Provet, Facit]
      hander: Provet växer till tio minuter och mer, och din lektion krymper.
      steg:
        - Ställ en klocka på fem minuter för hela provet, så att alla ser den.
        - "Säg ”Pennan ner” när tiden är slut, också om några inte är klara."
        - Visa facit och låt eleverna rätta själva.
        - Gå bara igenom frågan med flest fel.
        - Ta färre frågor nästa gång.
hallFast:
  rubrik: Fem saker att hålla fast vid
  rader:
    - { sak: "När arbetsområdet byts: för in det förra i grovplaneringen", text: "Annars bockas kunskaperna av som en lista när området är klart, och det som skulle komma tillbaka kommer inte." }
    - { sak: "Efter ett lov: börja med frågor från före lovet", text: "Glömskan efter ett lov är väntad, och det som lärs om går fortare än första gången. Säg det till eleverna." }
    - { sak: "När provet har blivit en vana: läs en veckas frågor", text: "Frågorna glider lätt mot ord och fakta, och utan facit och kontrast blir provet en kul start. Byt en faktafråga mot ett varför." }
    - { sak: "Inför ett stort prov: fortsätt med de korta proven", text: "Spridd övning ger mer än samma övning samlad, och de korta proven är redan repetitionen." }
    - { sak: "När en kollega tar över: lämna över grovplaneringen", text: "Det som står i den delade grovplaneringen blir kvar när någon slutar, och kollegan ser där vad som ska komma tillbaka." }

