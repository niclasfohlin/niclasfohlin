# ---------------------------------------------------------------------------------------------------------------------
# Lär dig metoden
# ---------------------------------------------------------------------------------------------------------------------
plan:
  passen:
    - { nar: första lektionen, kort: Provet, text: "Första gången är provet två frågor om förra lektionen, den andra ett varför, och en lätt fråga från förra terminen, på något klassen kan. Facit och kontrasten visar du själv." }
  fore: ["Välj ämnet och de två eller tre lektioner i veckan där provet ligger."]
  utvardering: ["Ämneslaget går igenom grovplaneringarna en gång i månaden: vad kom tillbaka, och vad föll bort? En kollega är med vid ett prov per termin. Elever med samma fel kvar får stödundervisning."]
  skattningar:
    - namn: Hur säker är jag på metoden?
      vem: lararen
      rad: lararen
      text: "Skatta i slutet av veckan. Tänk på kärnan: Krävde en fråga ett varför? Svarade alla själva? Rättade de mot facit samma lektion? Jämförde ni två svar? Kom en fråga från ett äldre område?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: osaker }
    - namn: Hur väl fungerar den i praktiken?
      vem: lararen
      rad: klassen
      text: "Tänk på det du ser i klasserna: Klarar fler än förut frågan från ett äldre område? Förklarar de varför med egna ord, också när de saknar fackordet?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: klassenstar }

# ---------------------------------------------------------------------------------------------------------------------
# Lathunden Att komma igång
# ---------------------------------------------------------------------------------------------------------------------
lathund:
  metoden:
    text:
      - "Ett kort prov ur minnet i början av två eller tre lektioner i veckan, med facit samma lektion. Det räknas inte, och det klassen har lärt sig kommer tillbaka efter veckor och månader."
      - "Lärandet går till så här. Eleverna plockar fram själva, ser det rätta och jämför två svar, och det som kommer tillbaka efter ett uppehåll sitter längre."
  lektion:
    text: "Provet har två frågor om förra lektionen, den andra ett varför, och en lätt fråga från förra terminen. Säg: ”Det här är ett prov som inte räknas. Det hjälper er att minnas.” Alla skriver, och du visar facit samma lektion. Kontrasten tar två minuter: du tänker högt om två svar på varför-frågan."
  igang:
    rubrik: De första veckorna
