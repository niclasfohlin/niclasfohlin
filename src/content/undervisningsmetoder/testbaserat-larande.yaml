rutiner:
  rubrik: Rutinerna klassen lär sig
  rader:
    - namn: Provet
      vecka: 1
      vad: "Provet är tre till fem frågor ur minnet i högst fem minuter när lektionen börjar, med böckerna stängda. Det räknas inte, och eleverna skriver svaren längst bak i skrivboken. Stegen står på affischen Så gör vi provet. Den som blir klar tidigt svarar på extrafrågan."
      steg: ["Läs frågorna på tavlan när du kommer in.", "Stäng läroboken och svara själv, i tystnad.", "Pennan ner när de fem minuterna är slut."]
      forsta: "Öva med två frågor om förra lektionen och en lätt från förra terminen. Säg varför ni gör provet och att det ska kännas lite svårt, och peka på affischen."
    - namn: Facit och färgpennan
      vecka: 2
      vad: "Eleverna rättar sitt eget svar mot facit samma lektion, i en annan färg och utan att sudda. De räcker upp handen för det de hade fel på och skriver en rad på provbladet. Du samlar inte in."
      steg: ["Ta färgpennan, och sudda inte.", "Rätta ditt eget svar mot facit, bocka varje mening du har med och skriv det rätta bredvid felet.", "Räck upp handen för det du hade fel på.", "Skriv på provbladet det du hade fel på, och det som var fel förut och är rätt nu."]
      forsta: "Facit finns från första lektionen. De första gångerna rättar ni varför-frågan högt tillsammans, en bock per mening, och du visar ett provblad med ett fel i färg: ”Det här är det vi ska öva på.” I vecka 2 rättar eleverna själva."
    - namn: Kontrasten
      vecka: 4
      vad: "Du visar två svar på samma fråga bredvid varandra, utan namn, och klassen säger vad som skiljer dem. Grundformen är felet eller ordet bredvid ett svar som håller. Två rätta sätt passar när nästan alla kan."
      steg: ["Titta på svar A och svar B.", "En minut själv: vad visar det ena som det andra inte visar?", "En minut i par.", "Läraren säger vad som håller.", "Svara själv på följdfrågan, i färg."]
      forsta: "Kontrasten finns från första lektionen. De första gångerna jämför du själv: ta två svar på en fråga alla känner igen, peka mellan svaren och tänk högt, och låt paren säga efter dig vad svar B visar. I vecka 4 säger paren det först."
larandet:
  rubrik: Så syns lärandet i klassen
  omraden:
    - { omrade: amneskunskaper, syns: "Fler svarar rätt på frågor om det ni gick igenom för veckor sedan, och förklarar varför i stället för att bara ge ordet." }
    - { omrade: sprak, syns: "Eleverna förklarar ämnets begrepp med egna ord och exempel, också när de saknar ordet." }
uppdrag:
  rubrik: Till arbetslaget
  text: "Ämneslaget gör grovplaneringen och delar frågorna, så att återkomsterna står i den gemensamma planeringen och följer med när någon slutar. Ni har två möten på en timme var och två besök de första veckorna. Sedan tar ni en kvart på ämneslagets möte en gång i månaden, med grovplaneringarna och två elevsvar bredvid varandra. En gång per termin sitter ni med vid varandras prov. Har skolan inget ämneslag i ämnet, gör du grovplaneringen med en kollega i samma årskurs."
  taMed: "Ta med grovplaneringarna, dina kryss och observationsmallarna."
  forbered:
    text: Läs metoden och lathunden, och tänk igenom frågorna före första mötet.
    fragor:
      - Vad i ditt arbetsområde är värt att minnas om ett år?
      - Var i dina lektioner berättar du vad ni gjorde förra gången, och var plockar eleverna fram det själva?
      - Ta två elevsvar på samma fråga i ditt ämne. Vad kan den ena eleven, och vad kan den andra?
      - "Titta på huvudfilmen: vad gör eleverna innan läraren visar facit?"
  planera: "Skriv in återkomsterna för nästa arbetsområde i grovplaneringen tillsammans, och samla frågorna med två elevsvar till varje i ämneslagets mapp. Jämför två elevsvar på samma fråga tillsammans, som en kontrast för er själva."
  genomfor: Gör provet två gånger i veckan i tre veckor innan du bedömer hur det går, och följ Lär dig metoden på metodens sida.
  reflektera:
    - Vilken fråga kom tillbaka efter några veckor, och hur många kunde den då?
    - Vilka två svar visade du bredvid varandra, och vad sa eleverna?
    - Vad bytte du ut för att få tid, och vad saknade du?
    - Vad i grovplaneringen kom inte tillbaka, och varför?

