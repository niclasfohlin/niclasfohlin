progression:
  rubrik: De första veckorna
  text: "Metoden är ny för dig och för klassen. Alla fem delarna av kärnan finns från första lektionen i liten form, och veckorna säger vad ni övar särskilt. I vecka 5 kommer området från vecka 1 tillbaka, med nya tal eller ett nytt exempel. Upprepa en vecka tills rutinen sitter."
  rader:
    - { vecka: "1", led: I liten form, rubrik: Provet ur minnet, eleverna: "Att svara själv ur minnet, med boken stängd, innan svaret visas.", roll: "Att fråga bakåt, läsa frågorna högt och vänta med facit till ”Pennan ner”.", vidare: "nästan alla skriver ett eget svar innan facit visas", fraga: "Skriver nästan alla ett eget svar innan facit visas?" }
    - { vecka: "2", led: I liten form, rubrik: Facit och färgpennan, eleverna: "Att rätta sitt eget svar med färgpennan och skriva en rad på provbladet.", roll: "Att räkna eleverna med fel på frågan med flest fel och välja utfall efter talet.", vidare: "nästan alla rättar sitt eget svar, och du väljer utfall efter talet", fraga: "Rättar nästan alla sitt eget svar, och väljer du utfall efter talet?" }
    - { vecka: "3", led: I liten form, rubrik: Frågor från olika tider, eleverna: "Att svara på frågor om förra veckan och förra området.", roll: "Att välja frågorna efter grovplaneringen, med en varför-fråga i varje prov.", vidare: "de flesta svarar på frågan från förra området och varför-frågan", fraga: "Hade varje prov en fråga från förra området och ett varför, och svarade de flesta på dem?" }
    - { vecka: "4", led: Hela varvet, rubrik: Kontrasten, eleverna: "Att hitta vad som skiljer två svar, själv och i par, och svara på följdfrågan.", roll: "Att välja två svar under provet, vänta på paren och säga sist vad som håller.", vidare: "de flesta svarar rätt på följdfrågan efter kontrasten", fraga: "Säger nästan alla vad som skiljer svaren, och svarar de flesta rätt på följdfrågan?" }
    - { vecka: "5", led: Hela varvet, rubrik: Tillbaka efter några veckor, eleverna: "Att skriva det som blev rätt sedan vecka 1 under Fel förut, rätt nu.", roll: "Att visa var eleverna skriver det som blev rätt, och räkna händerna för fel då och rätt i dag.", vidare: "nästan alla hittar raden från vecka 1 på provbladet", fraga: "Hittar nästan alla raden från vecka 1, och vet du hur många som hade fel då och rätt nu?" }
uppfoljning:
  text: Du ser om metoden fungerar på frågan med flest fel, på frågorna från äldre områden och i grovplaneringen.
  rader:
    - { id: lektionen, nar: Varje lektion, tid: varje lektion, vad: "Räkna felen på frågan med flest fel, och skriv i grovplaneringen när den kommer tillbaka: nästa lektion, nästa vecka eller om några veckor." }
    - { id: klassen, nar: Klassens svar varje vecka, tid: varje vecka, vad: "Räkna hur många som klarar frågan från ett äldre område. Det är där återkomsten syns, och talet växer långsamt." }
    - { id: lararen, nar: Dina kryss varje vecka, tid: varje vecka, vad: "Räkna hur ofta kärnans fem delar fanns i veckans lektioner. Kärnan glider lätt mot frågor om fakta utan återkomst, och det märks inte i en lektion." }
    - { id: observationerna, nar: Vecka 2 och 5, tid: vecka 2 och 5, vad: "Specialläraren besöker klassen i vecka 2 och läser provbladen hos dem som ofta har fel. En kollega eller rektor besöker klassen i vecka 5 och läser grovplaneringen." }
    - { id: arbetslaget-fore, nar: Före första lektionen, tid: före, vad: "Ämneslaget skriver in återkomsterna i grovplaneringen före den tredje veckan med provet och bokar besöken." }
    - { id: arbetslaget-efter, nar: Vecka 5, tid: vecka 5, vad: "Ni ses igen i slutet av vecka 5 med grovplaneringarna och bestämmer hur ni fortsätter." }
    - { id: stodet, nar: Efter de första veckorna, tid: efter, vad: "Ämneslaget går igenom grovplaneringarna en gång i månaden: vad kom tillbaka, och vad föll bort? En kollega är med vid ett prov per termin. Elever med samma fel kvar får stödundervisning." }
    - { id: sexveckor, nar: Sex veckor efter de första veckorna, tid: efter 6 veckor, vad: "Räkna samma saker som varje vecka, och be en kollega se ett prov. Kommer frågorna från äldre områden fortfarande tillbaka?" }
    - { id: nastatermin, nar: Nästa termin, tid: nästa termin, vad: "Första veckan efter lovet har provet frågor från förra terminen. Räkna hur många som klarar dem, och se om ni använder metoden i fler ämnen." }
    - { id: osaker, nar: Om du är osäker på metoden, tid: villkor, vad: "Står skattningen ”Hur säker är jag på metoden?” under 5 i två veckor i rad, gör om veckan och be en kollega se ett prov och facit." }
    - { id: klassenstar, nar: Om det inte fungerar, tid: villkor, vad: "Står skattningen ”Hur väl fungerar den i praktiken?” under 5 i två veckor i rad, ta färre och lättare frågor och be specialläraren läsa provbladen." }
checklista:
  rubrik: Före första lektionen
  punkter:
    - Välj ämnet och de två eller tre lektioner i veckan där provet ligger.
    - "Skriv upp det som är värt att minnas i arbetsområdet: begreppen och de uppgifter eleverna ska klara."
    - "Kopiera den tomma grovplaneringen i bilaga A och skriv in återkomsterna före den tredje veckan med provet."
    - Klistra in provbladet längst bak i varje elevs skrivbok, och lägg fram färgpennor.
    - Skriv ut affischen Så gör vi provet, och sätt upp den där alla ser den.
    - Boka observationerna, en av dem med specialläraren.
    - Bestäm med ämneslaget vilka frågor och vilken grovplanering ni delar.
    - Säg till klassen och vårdnadshavarna att proven inte räknas, och varför ni gör dem.
klassen:
  rubrik: Så ordnar du klassen
  text: "Under provet ligger läroböckerna undan och skrivboken uppslagen längst bak, med färgpennan framme. Varje elev har en bestämd kamrat bredvid sig för kontrasten. Den som behöver en ledtråd sitter där du kan ge den utan att stoppa klassen, och den som är ny i svenska sitter där hen ser bilderna på tavlan."
forsta:
  rubrik: Första lektionen
  text:
    - "Första gången är provet två frågor om förra lektionen och en lätt fråga från förra terminen, på något klassen kan, så att alla svarar på något. Den andra frågan om förra lektionen är ett varför. Facit och kontrasten visar du själv: ni rättar varför-frågan högt tillsammans, och du tänker högt om två svar medan du pekar mellan dem: ”Svar A säger bara ordet. Svar B säger vad man gör.” Sedan: ”Säg till din kamrat vad svar B visar.” Ni övar rutinen Provet."
    - "Du säger: ”Det här är ett prov som inte räknas. Det samlas inte in. Det hjälper er att minnas, och det ni inte minns är det vi ska öva på.” Säg också att det ska kännas lite svårt."
  plan:
    amne: Matematik
    klass: 6B
    datum: mån 31/8
    lektion: "4 av 6"
    mal: "räkna ut omkretsen och arean av en rektangel"
    belagg: "en rektangel med omkretsen 20 cm sist i lektionen"
