      - ["51", "Repetition", "Blandat från hela terminen", ""]
  - rubrik: "Grovplaneringen: frågorna"
    text: "Frågorna med facit samlar ni område för område, när ni har gått igenom området. Till varje återkomst gör ni samma slags fråga med nya tal eller ett nytt exempel, så att eleverna inte lär sig svaret utantill. Varför-frågan börjar ofta med Varför, Förklara, ”Ge ett exempel” eller ”Vad skiljer”, och facit har två eller tre meningar, en för varje sak svaret ska visa. I matematik säger minst en fråga inte vilken metod den kräver, som staketet runt rabatten. Skriv två svar att visa bredvid frågan, så att kontrasten kommer tillbaka med den. Exemplet är området Omkrets och area."
    kolumner: [Frågan, "Facit, det som ska bockas", Två svar att visa, Slaget och veckan]
    rader:
      - ["Hur stor är omkretsen av en rektangel som är 7 cm och 2 cm?", "7 + 2 + 7 + 2 = 18 cm", "A: 7 + 2 + 7 + 2\nB: (7 + 2) · 2", "Minns, 36"]
      - ["En rektangulär rabatt är 8 m och 3 m. Hur långt staket behövs runt den?", "8 + 3 + 8 + 3 = 22 m. Staketet går runt, och 24 m² är arean", "A: 8 · 3 = 24\nB: 8 + 3 + 8 + 3 = 22 m", "Välj metod, 37"]
      - ["Rita två rektanglar som båda har omkretsen 18 cm. Har de samma area? Förklara.", "Två rektanglar med omkretsen 18 cm. Arean räknad för båda. Arean kan skilja sig", "A: 5 och 4, 6 och 3, samma area\nB: 20 och 18 rutor", "Varför, 37"]
      - ["Rita två rektanglar som båda har omkretsen 24 cm. Har de samma area? Förklara.", "Till exempel 8 och 4 cm, 32 cm², och 6 och 6 cm, 36 cm². Arean kan skilja sig", "A: 8 och 4, 6 och 6, samma area\nB: 32 cm² och 36 cm²", "Varför, nya tal, 38"]
      - ["En rektangulär hage ska ha 24 m staket. Vilka mått ger störst yta? Förklara.", "6 m och 6 m ger 36 m². Ju smalare hagen är, desto mindre yta", "A: 8 m och 4 m\nB: 6 m och 6 m, 36 m²", "Nytt sammanhang, 40"]
      - ["En kvadrat och en annan rektangel har båda omkretsen 16 cm. Vilken har störst area? Förklara.", "Kvadraten, 4 och 4 cm, har 16 cm². En rektangel som är 6 och 2 cm har 12 cm²", "A: Lika stora\nB: 16 cm² och 12 cm²", "Varför, nytt exempel, 48"]
  - rubrik: "Grovplaneringen: till nästa termin"
    text: "Den här delen skriver ni i ämneslaget sist på terminen. Det som ska fortsätta komma tillbaka står först i nästa termins grovplanering. Första veckan efter lovet har provet frågor från förra terminen."
    kolumner: [Det som kommer tillbaka, Vecka i vår, Det ni såg i höst]
    rader:
      - ["Sannolikhet", "2 och 6", "Det sista området, med en återkomst i höst"]
      - ["Statistik", "3", "Medianen satt, men medelvärdet hade flest fel i vecka 47"]
      - ["Bråk", "5", "Att jämföra bråk med olika nämnare hade flest fel"]
      - ["Procent", "8", "Satt efter tre återkomster, så det räcker med en"]
planeringsmall:
  text: "Skriv på din egen planering eller på bladet, och välj frågorna efter grovplaneringen."
  fore:
    - { etikett: "Frågorna i provet", rader: ["Förra veckan:", "Varför-frågan:", "Förra området:", "Förra terminen:"], falt: [veckan, varfor, omradet, terminen] }
    - { etikett: "Kontrasten jag kan visa", rader: ["Svar A:", "Svar B:", "Frågan till klassen:"], falt: [svarA, svarB, fragan] }
  delar:
    - { fas: Provet, skriv: "Extrafrågan:", not: "Den som blir klar tidigt svarar på en svårare fråga sist på tavlan.", hojd: 0.9 }
    - { fas: Facit, skriv: "Meningarna att bocka:", not: "Saknas en enda bock på varför-frågan, är det fel.", hojd: 1.0 }
    - { fas: Kontrasten, skriv: "Det jag säger sist:", hojd: 0.7 }
    - { fas: Din lektion, skriv: "Lektionen:", hojd: 0.6 }
  beslut: { nastanAlla: "Kommer tillbaka:", deFlesta: ["Två svar:", "Följdfrågan:"], halften: "Det nya exemplet:" }
  efter:
    text: "Fyll i direkt efter lektionen. Det tar en minut."
    kontrollen: "Frågan med flest fel: ___ av ___ med fel"
    hogar: "Svaren jag sparar till nästa kontrast"
    sag: "Det eleverna sa om de två svaren"
    nasta: "I nästa prov tar jag med"
    forst: "I grovplaneringen:"
  overst: ["Det som ska sitta om en månad"]
  kolumner: ["Vad jag gör och vad eleverna gör"]
  sist: ["Efter lektionen: frågan med flest fel och när den kommer tillbaka", Nästa prov]
observation:
  fraga: Plockar alla fram själva innan facit visas, och vad gör läraren och klassen med svaren?
  text: "Skriv ut dubbelsidigt, och välj med läraren två elever att följa, A och B, gärna en som ofta har fel. Stå där du ser deras skrivböcker. Skriv frågornas början och hur långt tillbaka de går, räkna hur många som skriver ett eget svar och skriv vad läraren gör efter facit."
  fokus: Hur många skrev ett eget svar innan facit?
  huvud: ["Frågorna i dag och hur långt tillbaka de går"]
  kolumner:
    - { namn: Frågan, text: "början av frågan, och hur långt tillbaka den går", bredd: 30 }
    - { namn: Alla svarar, text: "eget svar · tomt · tittar", bredd: 17, elever: true }
    - { namn: Efter svaren, text: "facit, kontrasten och beslutet", bredd: 30 }
  tecken: "+ eget svar ur minnet, t tittar i boken eller hos grannen, 0 tomt, h handen upp vid facit, s säger något i kontrasten."
  delar:
    - { fas: Provet, rader: 4, rakna: "Skrev ett eget svar: ___ av ___   Frågor från ett äldre område: ___   Ett varför: ja · nej" }
    - { fas: Facit, rader: 2, rakna: "Rättade sitt eget svar: ___ av ___   Frågan med flest fel: ___ med fel" }
    - { fas: Kontrasten, rader: 2, rakna: "Två svar bredvid varandra: ja · nej   Sa vad som skilde svaren: ___ av ___" }
  streck:
    - { etikett: Frågorna, drag: ["En fråga om något från veckor sedan", "En fråga med ett varför eller en metod"] }
    - { etikett: Efter svaren, drag: ["Facit samma lektion", "Två svar bredvid varandra", "Sparar frågan till senare"] }
  rader:
    - "Frågor som krävde ett varför, ett exempel eller en metod: __ av __"
    - "Elever som skrev ett eget svar innan facit: __ av __"
    - "Elever som rättade sitt eget svar samma lektion: __ av __"
    - "Elever som sa något om vad som skilde de två svaren: __ av __"
    - "Frågor från ett äldre område: __ av __. Frågan med flest fel i grovplaneringen: ja · nej"

# ---------------------------------------------------------------------------------------------------------------------
# Bilaga B Valet och forskningen
# ---------------------------------------------------------------------------------------------------------------------
passar:
  rubrik: När passar metoden?
  kort: "klassen har förstått något som ska sitta länge. Är innehållet nytt, passar Explicit undervisning bättre."
  rader:
    - { fraga: "Vad ska eleverna lära sig?", metoden: "Det som ska sitta länge och användas igen: begrepp, fakta och färdigheter som ämnet bygger på.", annat: "Något nytt som klassen inte har mött. Då passar Explicit undervisning, och det nya kommer med i provet senare." }
    - { fraga: "Hur mycket kan eleverna redan?", metoden: "De har mött och förstått innehållet, och nu ska det hålla.", annat: "De har inte förstått det än. Undervisa först, och låt det komma tillbaka sedan." }
    - { fraga: "Hur hänger innehållet ihop?", metoden: "Delar som går att plocka fram och sedan använda i större uppgifter.", annat: "Många delar som hänger ihop för en nybörjare. Börja med lösta exempel och genomgång, eftersom effekten av proven då minskar (Van Gog och Sweller, 2015)." }
    - { fraga: "Vad vill du veta efter provet?", metoden: "Vad klassen minns efter veckor, och vad som ska komma tillbaka.", annat: "Var klassen är i dag, för att välja nästa steg i lektionen. Då passar Formativ bedömning." }
    - { fraga: "Vad går oftast snett?", metoden: "Eleverna klarar provet i arbetsområdet och har glömt innehållet en månad senare.", annat: "Eleverna samarbetar inte, och samtalen kommer inte igång. Då passar Kooperativt lärande, och ni kan göra kontrasten i en struktur." }
  tumregel: "Har klassen förstått något som ska sitta länge, låt det komma tillbaka i korta prov. Har den inte förstått det än, undervisa först. Valkartan är ett stöd för tanken och ingen regel."
  metoder: [explicit-undervisning, formativ-bedomning, kooperativt-larande]
invandningar:
  rubrik: Invändningar och nyanser
  fragor:
    - { fraga: "Blir det inte mekanisk minnesträning?", svar: "Risken finns. Framplockningen hjälper mest med det som saknar sammanhang (Van Gog och Sweller, 2015). I skolan gav den 0,53 för fakta och ingen säker vinst för förståelse eller överföring (Ruitenburg m.fl., 2026). En lärare invänder i Nämnaren att elever som ser mening behöver mindre repetition, och texten står i Läs mer. Därför gäller frågorna det ämnet bygger på, eleverna förklarar, och klassen jämför två sätt att tänka. Proven gäller det klassen redan har förstått." }
    - { fraga: "Blir eleverna inte stressade av fler prov?", svar: "Prov ur minnet minskade provängslan i 24 studier (Yang m.fl., 2023). Samma översikt varnar för att själva provet kan kännas pressande, och lätta prov minskade ängslan mest. Därför räknas proven inte, första frågan är lätt, och felen visar vad klassen ska öva på." }
    - { fraga: "Är det inte formativ bedömning med ett annat namn?", svar: "Nej. Här lär sig eleverna av själva framplockningen. IES bedömde stödet för prov ur minnet som starkt, och stödet för prov som visar vad eleverna behöver lära sig som lågt (Pashler m.fl., 2007). Du använder svaren, men effekten kommer av att alla plockar fram och att innehållet kommer tillbaka över veckorna. Metoderna går bra ihop." }
    - { fraga: "Fungerar det i matematik, eller bara för glosor och fakta?", svar: "I matematik är det blandningen som hjälper mest. Blandade uppgifter där eleven väljer metod gav 0,54, och de gav också säkra vinster för förståelse och överföring (Ruitenburg m.fl., 2026). Blandade uppgiftsblad i åk 7 gav 0,83 på forskarnas prov efter en månad (Rohrer m.fl., 2020), men ett läsår med blandade uppgifter i Nigeria gav ingen säker effekt på årsprovet (van der Haar m.fl., 2023). Att bara plocka fram en räknemetod har osäkrare stöd." }
grund:
  rubrik: Det forskningen visar
  text:
    - "Det metoden bygger på heter i forskningen framplockning (retrieval practice), spridning (spaced practice) och blandning (interleaved practice). De studeras oftast var för sig men hänger ihop: spridningen verkar genom att eleven plockar fram, och blandningen är alltid spridd. I 53 studier i grundskolans och gymnasiets klassrum gav framplockning 0,37, spridning 0,20 och blandning 0,40, jämfört med att läsa om, samla övningen eller öva en sorts uppgift i taget (Ruitenburg m.fl., 2026). Spridningen jämfördes med samlad eller mindre spridd övning, och mot mindre spridd blev det ingen säker skillnad."
    - "Mot inget prov alls gav korta prov utan betyg 0,22 i 38 studier från åk 3 till gymnasiet, och 0,46 när samma elever övade både med och utan prov (Dietrichson m.fl., 2026). Nästan alla prov var korta och utan betyg, och resultatet mättes inom en vecka, oftast på forskarnas egna prov. Antalet prov gjorde nästan ingen skillnad. Små försök som lärare i engelska skolor själva ledde gav 0,30 (Churches m.fl., 2020)."
    - "Proven gav 0,53 för fakta, men ingen säker vinst för begrepp, förståelse och överföring (Ruitenburg m.fl., 2026). Effekten minskar när innehållet har många delar som hänger ihop (Van Gog och Sweller, 2015), och den är mindre mot lösta exempel och andra aktiva arbetssätt än mot att läsa om (Dietrichson m.fl., 2026). Därför låter metoden eleverna förklara och jämföra svar, och proven gäller det klassen redan har förstått."
    - "I matematik hjälper blandningen mest. Uppgifter av olika slag där eleven väljer metod gav 0,54, och också säkra vinster för förståelse och överföring (Ruitenburg m.fl., 2026). I den största studien i matematik, 787 elever i 54 klasser i åk 7, hade eleverna med blandade uppgifter 61 procent rätt mot 38 på ett prov en månad senare (Rohrer m.fl., 2020). Ett läsår i Nigeria gav en effekt på terminsproven men ingen säker effekt på årsprovet (van der Haar m.fl., 2023)."
    - "I den enda stora studien med skolornas egna prov fick 1 074 elever i 15 engelska skolor ett startprov eller en startdiskussion i NO, och det blev ingen skillnad (Roy m.fl., 2023). Spridningen hjälpte mest när uppehållet var minst en tiondel av tiden till slutprovet, och det viktiga bör komma tillbaka minst två gånger med veckor emellan (Ruitenburg m.fl., 2026; Pashler m.fl., 2007). Om facit gör skillnad är inte avgjort: en stor översikt fann större effekt med facit, och två nyare fann ingen säker skillnad (Yang m.fl., 2021; Ruitenburg m.fl., 2026; Dietrichson m.fl., 2026)."
    - "Proven minskade provängslan i 24 studier (Yang m.fl., 2023). I ordförråd fann den studie som låg närmast vanliga lektioner ingen nytta (Goossens m.fl., 2016). I stavning blev det ingen säker skillnad i den största studien (Bouwmeester och Verkoeijen, 2011). Att jämföra lösningar sida vid sida har stöd i forskning om matematik (Rittle-Johnson m.fl., 2020). Läsförståelse, textskrivning, teknik och studiero är inte studerade."
