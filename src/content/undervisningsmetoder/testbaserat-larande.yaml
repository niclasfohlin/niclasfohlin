strukturkort:
  text: "Två strukturkort ur verktyget Strukturer passar metoden när grunden sitter. Med strukturen Kontraster söker eleverna själva upp någon som har tänkt annorlunda, och med Provet två gånger gör de ett större prov enskilt och sedan i små grupper. Det viktiga är lektionens syfte, och strukturen är ett hjälpmedel. Den hör till metoden när eleverna först plockar fram själva och sedan jämför."
  strukturer: [kontraster, provet-tva-ganger]
ramar:
  rubrik: Materialet för klassen
  text: ["Utöver lektionskortet och strukturkorten finns två blad: provbladet för eleverna och affischen Så gör vi provet. Varje blad står på en egen sida. Grovplaneringen för dig och ämneslaget är en mall att skriva i, och den står sist i bilaga A."]
  ramar:
    - rubrik: Provbladet
      text: ["Skriv ut liggande och klipp isär, så att varje elev får ett A5. Eleven klistrar in det längst bak i skrivboken och skriver svaren på sidorna närmast bladet. Efter varje prov skriver eleven en rad med datumet och det hen hade fel på, med ord och inte frågans nummer. Svarar eleven rätt när en sådan fråga kommer tillbaka, skriver hen den under Fel förut, rätt nu. Har du klassen i flera ämnen, får varje skrivbok sitt blad. I F–⁠2 skriver du klassens rad på tavlan i stället."]
    - rubrik: Så gör vi provet
      text: ["Skriv ut affischen i A3 och sätt upp den vid tavlan, eller visa den på skärmen. De första veckorna pekar du på stegen när klassen övar provet och facit."]
tabeller:
  - rubrik: Veckans träning
    plats: efter-progression
    meny: true
    text: "När provet har blivit en rutin kan du ge eleverna 30 till 60 minuter i veckan att träna på det deras prov visade. Det passar när ni har prov ofta, eleverna skriver sina fel på provbladet och du har material att träna med, som grovplaneringens frågor med facit och bokens uppgifter av samma slag. När eleven vet vad hen kan och inte kan, är det lättare för er båda att lägga övningen där den behövs. Ingen blir ensam med det som är svårt."
    kolumner: [Formen, Så gör ni, Tanken]
    rader:
      - ["Vid ett bord", "Elever med samma slags fel sitter vid ett bord med material till just det: uppgifter med facit och ett exempel som är löst steg för steg. Du sitter med vid det bord som behöver dig mest.", "Eleverna samlas kring det de har svårt med, och du ser var många fastnar."]
      - ["I par", "Den ena berättar vad hen hade svårt med, de läser materialet tillsammans, och den andra förhör. Sedan byter de.", "Eleven förklarar och övar med någon, och blir inte ensam med det svåra."]
      - ["Sist, i båda formerna", "Var och en svarar ur minnet på en fråga om det hen tränade och rättar mot facit. Är svaret rätt, skriver eleven det under Fel förut, rätt nu.", "Träningen slutar med att eleven plockar fram själv, och provbladet visar vad som sitter."]
  - rubrik: Utveckla metoden
    plats: efter-progression
    meny: true
    text: "Du behöver inget av det här för att börja. När provet, facit, kontrasten och grovplaneringen sitter, kan du lägga till en sak i taget. Till två av raderna finns strukturkort, som du skriver ut från metodens sida."
    kolumner: [Det du bygger på, Så gör du, Tanken]
    rader:
      - ["Kontraster", "Du ställer en öppen fråga, och eleverna skriver sitt svar. De går runt, letar upp någon som har tänkt annorlunda och berättar vad de tänkt och varför. Sist skriver var och en vad hen tycker nu.", "Eleven söker själv upp ett annat sätt att tänka."]
      - ["Provet två gånger", "Eleverna skriver ett större prov enskilt och behåller en kopia av svaren. Sedan gör de provet en gång till i små grupper, en fråga i taget, och var och en förklarar hur hen tänkte.", "Provet blir undervisning, och alla kan förklara svaret innan gruppen går vidare."]
      - ["Mellanprovet", "Halvvägs i ett arbetsområde får eleverna samma uppgifter som i början, med nya tal, och ser på provbladet vad de hade fel på då.", "Eleven ser vad som har satt sig sedan början."]
      - ["Frågeburken", "Skriv frågor med facit på lappar, och dra några till varje prov. Eleverna kan skriva egna frågor till burken.", "Frågorna finns kvar till nästa återkomst."]
      - ["Egna frågor", "Eleverna skriver frågor med facit efter regler: sant eller falskt kräver en förklaring, och högst två frågor i rad får bara be om ett namn.", "Eleven tänker igenom vad som är värt att minnas."]
      - ["Rösta två gånger", "Alla väljer ett svar, pratar med någon som valde ett annat, och väljer igen innan facit.", "Eleven prövar sitt svar mot ett annat."]
      - ["Läxa med äldre uppgifter", "Lägg några uppgifter från en eller två månader tillbaka i läxan, och ta upp dem i nästa prov.", "Återkomsten får mer tid utan att lektionen krymper."]
      - ["Felsvar bland svaren", "I en fråga med svar att välja mellan bygger du felsvaren på vanliga fel.", "Felsvaret eleven väljer visar vilket fel hen gör."]
  - rubrik: Grovplaneringen
    text: "Grovplaneringen är terminens plan för provet: vad som ska sitta i varje område och vilka veckor det kommer tillbaka. Ni gör den på en timme i ämneslaget före terminen, och du fyller på efter lektionerna. Kopiera den tomma mallen till Google Dokument eller Word, och dela den med ämneslaget. Exemplet är 6B i matematik under en hösttermin."
