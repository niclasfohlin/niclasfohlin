# Formativ bedömning, en undervisningsmetod för helklass och den första av slaget strategier. Skriven 2026-11-01 ur
# methods/_mall-undervisningsmetod.yaml, efter analysen (analys.md) och den andra analysen. Niclas material:
# Lärarhandledning formativa metoder, 2026-05-13 (intake/formativ-bedomning.md). Förlagan Explicit undervisning är läst för form och ton.

titel: Formativ bedömning
undertitel: Ett lager över din egen planering, så att du ser vad klassen har förstått och kan ändra lektionen, F–⁠9
alternativaNamn: ["Formativa metoder", "Bedömning för lärande", "BFL"]
ingress: "Formativ bedömning är ingen lektion du planerar. Det är ett lager över din egen planering, så att du ser vad alla elever har förstått medan du kan göra något åt det. Du ställer en fråga, alla visar sitt svar, du väljer vad ni gör, och efter en ändring visar alla igen. Varje grepp har en tanke, för dig och för eleven."
arskurs: ["F-3", "4-6", "7-9"]
arskursText: F–9
taggar: ["formativ-bedomning", "undervisningskvalitet"]
slag: strategier
syfte: [se]
tid: Din lektion, 45 minuter, minst tre lektioner i veckan
hurOftaSkal: "I studierna med effekt visade eleverna sitt kunnande från två gånger i veckan till varje lektion (Klute m.fl., 2017). Minst tre i veckan ger greppen tid att bli en rutin."
period: Fem veckor att komma igång
material:
  - lektionskortet
  - affischen Så visar vi
  - exit-lappen
  - miniwhiteboards och pennor från vecka 3
  - färgkortet från vecka 5
uppdaterad: 2026-11-02
publicerad: 2026-11-02
relaterade: ["explicit-undervisning", "kooperativt-larande"]
utkast: false
film:
  sekunder: 29.63
  beskrivning: "Läraren frågar hela klassen. Läraren säger: ”Tänk själv. Håll svaret nere.” Alla visar samtidigt. Läraren säger: ”1, 2, 3, visa!” Läraren räknar: 6 av 24 har samma fel. Läraren skriver felet bredvid det rätta, utan namn. Läraren säger: ”Jag såg samma fel. Därför frågar jag: vad skiljer dem?” Läraren visar skillnaden. Nu en ny fråga. Alla visar igen. Nu har 1 av 24 fel. Läraren säger: ”1, 2, 3, visa!” Läraren säger: ”Det rätta är 4/5. Har du något annat?”"
  rubrik: "Så ser läraren vad klassen förstod: frågan, beslutet och en ny fråga"
  ingress: "Filmen visar lagret på en vanlig lektion i matematik i åk 5, där klassen förkortar bråk. Alla visar sitt svar samtidigt, läraren ser att 6 av 24 har samma fel och sätter felet bredvid det rätta, och alla svarar på en ny fråga."
  stillbilder:
    - text: "Läraren frågar, och alla tänker själva."
    - text: "Alla visar, och 6 av 24 har samma fel."
    - text: "Läraren säger vad hen såg, med felet bredvid det rätta."
    - text: "Alla svarar på en ny fråga, och nu har 1 av 24 fel."
filmer:
  - nr: 2
    titel: "När klassen är delad"
    sekunder: 29.76
    beskrivning: "Läraren läser upp ett påstående med ett vanligt fel. Läraren säger: ”Tänk själv.” Alla visar samtidigt, och klassen är delad. Läraren säger: ”1, 2, 3, visa!” Läraren säger inte svaret än. Läraren säger: ”Jag ser olika svar. Säg till din kompis varför.” Eleven säger: ”Regeringen bestämmer ju.” Eleven säger: ”Men riksdagen röstar.” Alla visar igen, och nu har fler rätt. Läraren säger: ”1, 2, 3, visa!” Först nu säger läraren vad som stämmer. Läraren säger: ”Det är riksdagen som stiftar lagarna.”"
    rubrik: "När klassen är delad"
    ingress: "På en lektion i samhällskunskap i åk 8 svarar alla med tummen på ett påstående, och klassen är delad. Läraren säger inte svaret än. Paren förklarar sina svar, alla visar igen, och först då säger läraren vad som stämmer."
    efter: "steg 4"
    stillbilder:
      - text: "Den som håller med visar tumme upp, annars stopphand."
      - text: "Läraren väntar med svaret, och paren förklarar."
      - text: "Alla visar igen, och nu har fler rätt."
      - text: "Först nu säger läraren vad som stämmer, och varför."
  - nr: 3
    titel: "Tre högar och nästa lektion"
    sekunder: 29.69
    beskrivning: "Sist i lektionen skriver alla på en lapp. Läraren säger: ”Ett svar och ett skäl. Det här är inget betyg.” Efter lektionen lägger läraren tre högar på fem minuter. Nästa lektion börjar med det läraren såg. Läraren säger: ”Ni skrev, så jag ändrade. Nio av er satte punkt bara sist.” Alla svarar på en ny fråga om felet. Läraren säger: ”1, 2, 3, visa!” Eleven säger: ”Två meningar! Punkt efter sov.” Eleverna ser att deras svar ändrade lektionen."
    rubrik: "Tre högar och nästa lektion"
    ingress: "På en lektion i svenska i åk 2 skriver alla på en exit-lapp. Efter lektionen lägger läraren lapparna i tre högar på fem minuter, och nästa lektion börjar med det läraren såg."
    efter: "steg 5"
    stillbilder:
      - text: "Alla skriver sitt svar på exit-lappen."
      - text: "Läraren lägger tre högar: rätt, felet och något annat."
      - text: "Nästa lektion börjar med det läraren såg."
      - text: "Eleverna ser att deras svar ändrade lektionen."

