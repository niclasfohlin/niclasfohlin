    matematik:  { tillforlitlighet: mattlig, effekt: mattlig, motivering: "Måttlig tillförlitlighet, måttlig effekt. Stödet gäller åk 2–⁠8, mest självbedömning, kort i par och program: 0,36 i sex studier (Klute m.fl., 2017). Stora försök går från noll (Wiggins m.fl., 2017) till 0,66 på eget prov (Andersson och Palm, 2017).", kallor: [klute-m-fl-2017, kingston-och-nash-2011, wiggins-m-fl-2017, anders-m-fl-2022, andersson-och-palm-2017, bostrom-och-palm-2023] }
    amnen:      { tillforlitlighet: mattlig, effekt: liten, motivering: "Måttlig tillförlitlighet, liten effekt. I NO blir det 0,19 i 17 effekter (Kingston och Nash, 2011, rättad 2015), och i 121 skolor gav metoden 0,17 på oberoende prov för 9–10-åringar (Mujtaba m.fl., 2022). SO är knappt studerat och teknik inte alls.", kallor: [kingston-och-nash-2011, mujtaba-m-fl-2022, anders-m-fl-2022] }
    socialt:    { niva: anekdotiskt, motivering: "Ingen studie med jämförelsegrupp. I upprepade mätningar minskade svarskort tiden då eleverna gjorde annat (Marsh m.fl., 2023), och lärare i en engelsk prövning rapporterade bättre uppförande (Speckesser m.fl., 2018).", kallor: [marsh-m-fl-2023, speckesser-m-fl-2018] }
  svarighet: { lara: 3, karnan: 3, stod: 3, tid: 3, motivering: "Du övar nya drag och klassen nya rutiner, och kärnan glider lätt mot det du redan gör. Studierna med effekt hade allt från en dags fortbildning (Lichtenberger m.fl., 2025) till 144 mötestimmar (Andersson och Palm, 2017)." }
  kostnad:   { kop: 2, timmar: 14, motivering: "Skolan har miniwhiteboards, lappar och kopior. Omkring 14 timmar första läsåret går till läsningen, sex möten, fyra korta samtal efter besök och en timmes extra planering i veckan de fem första veckorna." }
  urval:
    datum: 2026-11-01
    regel: "Arbetssätt räknas när läraren under undervisningen tar reda på vad eleverna kan och ändrar undervisningen efter det eller ger återkoppling som för lärandet framåt. Också svar från alla räknas, och täta mätningar där en regel säger vad läraren gör. Utvecklare är Fuchs (täta mätningar), Graham och Harris (självreglering), Abrami och Meyer (ePEARL) och Ysseldyke (Accelerated Math). Räknas inte: prov, betyg, avstämningsprov och reformer utan ändring i klassrummet, översikter om bara återkoppling och översikter av metaanalyser."
    text: "Vi sökte 2026-11-01 i sammanställningar, följde referenserna i Yao m.fl. (2024), sökte i ERIC område för område och prövade med enkla sökningar på webben. En sökning till gav ett stort försök i NO. Vi valde femton källor."
    slutsatser:
      oversikt: "Klutes urval ger 0,26, mest i åk 1–⁠6, och över hälften av studierna gäller elevgrupper med specialundervisning eller låga resultat (Klute m.fl., 2017). En större metaanalys ger 0,25 (Yao m.fl., 2024). Mellan studier i läsning gav metoden 0,24 när läraren anpassade undervisningen och 0,05 utan (Xuan m.fl., 2022). I skrivning ger återkopplingen mer än uppföljningen (Graham m.fl., 2015). NO har 0,19 (Kingston och Nash, 2011), SO är knappt studerat och teknik inte alls."
      experiment: "Försöken går från ingen skillnad till en stor effekt, och de ger inget samlat tal. På oberoende prov i England gav hela arbetssättet 0,09, inte säkert (Anders m.fl., 2022), digitala svarsdosor ingen skillnad (Wiggins m.fl., 2017) och metoden i NO för 9–10-åringar 0,17 (Mujtaba m.fl., 2022). På forskarnas prov gav metoden 0,66 i svensk åk 4 (Andersson och Palm, 2017) och ingen skillnad i svensk åk 7 (Boström och Palm, 2023)."
      annan: "Det formativa sitter i att resultaten används för att ändra undervisningen (Black och Wiliam, 1998). I fysik på gymnasiet gav fortbildning med kamratsamtal mer än samma frågor, där läraren själv valde vad hen gjorde med svaren (Lichtenberger m.fl., 2025). Svenska matematiklärare samlade sällan in svar från alla (Andersson m.fl., 2017). Att alla visar samtidigt ger mer deltagande i små studier (Marsh m.fl., 2023), och i England var klassrumsbesöken svårast (Speckesser m.fl., 2018)."
    uteslutna:
      - { namn: "Sortwell m.fl. (2024)", skal: "Översikt av metaanalyser" }
      - { namn: "West m.fl. (2016)", skal: "Avstämningsprov utan ändring i klassrummet" }
      - { namn: "Hattie (2009)", skal: "Översikt av metaanalyser" }
      - { namn: "Konstantopoulos m.fl. (2013)", skal: "Avstämningsprov utan ändring i klassrummet" }

# ---------------------------------------------------------------------------------------------------------------------
# 1 Metoden
# ---------------------------------------------------------------------------------------------------------------------
inledning:
  - "Formativ bedömning är ingen lektion du planerar. Det är ett lager du lägger över din egen planering, så att du får veta vad alla elever har förstått medan du fortfarande kan göra något åt det. Ju snabbare du vet, desto snabbare kan du agera. Det är inget prov och ingen betygssättning, och det är mer än elevaktivitet: en fråga eller en exit-lapp blir formativ först när du eller eleven ändrar något efter svaren."
  - "I vilket ämne som helst står din planering kvar: en genomgång, en text, en film eller en laboration. Du lägger lagret på några ställen i den. På ett ställe stannar du och ställer en fråga, och alla visar sitt svar samtidigt på din signal, med tummen, fingrarna eller en miniwhiteboard. Handuppräckningen ger dig svaret från de tre snabbaste, och det är ofta de som redan kan. Nu ser du hela klassen. Du räknar hur många som har fel, säger vad du såg och vad ni gör nu: ni går vidare, eleverna förklarar sitt svar för axelkompisen eller du visar på ett nytt sätt."
  - "Varje grepp har en tanke, något det ska ge dig och elevens lärande. För dig är det att se vad alla har förstått. För eleven är det att ta ställning: Vad tänker jag? Vad tror jag är rätt? När eleverna måste välja i stället för att bara lyssna, fastnar innehållet på ett annat sätt. Du ser vad som hindrar dem från att förstå, och de märker att deras svar ändrar lektionen."
  - "De första veckorna lägger du till en liten sak i taget. Vecka 1 säger du ett vanligt fel som ett påstående, och alla visar med tummen, utan material. Är klassen delad säger de varför till axelkompisen och visar igen. Vecka 2 säger paren efter en instruktion till varandra vad de ska göra, och du hör vad som gick fram. Samma vecka avgör exit-lappen Starten, alltså hur nästa lektion börjar. Vecka 3 kommer miniwhiteboarden. Vecka 4 ställer du frågor med felen bland svaren och väver in det du hör från paren. Vecka 5 börjar eleverna bedöma sitt eget arbete: de vänder ett färgkort på bänken och rättar i annan färg. Efter fem veckor kan eleverna visa och förklara sina svar och säga hur långt de har kommit, och du kan ändra lektionen efter det du ser."
karna:
  rubrik: "Kärnan: fast och fritt"
  text: "Du lägger lagret på din egen planering, och kärnans fyra delar håller ihop det. Grundidén är att du ändrar undervisningen och eleverna ändrar sitt eget arbete efter det de visar, mitt i lektionen och mellan lektionerna. Mål och kriterier, återkoppling och eleverna som resurser hör också till formativ bedömning, och du möter dem i frågan, i beslutet, när alla visar igen och i det eleverna börjar göra själva vecka 2 och 5."
  grundregel: De fyra är kärnan, och dem håller du fast vid. Din planering, frågan, svarsformen och vad du gör vid varje utfall väljer du själv.
  varv: Du frågar, alla visar, du väljer vad ni gör, och efter en ändring visar alla igen.
  komponenter:
    - namn: En fråga som säger något
      moment: [Alla visar, Exit-lappen]
      vad: Du ställer en fråga där rätt och fel tänkande ger olika svar, och du vet vilket fel du letar efter.
      syns: Eleverna svarar på en fråga där svaren skiljer sig efter hur de har tänkt, och läraren kan säga vilket fel hen letade efter.
      raknas: false
      varfor: "Frågor där alla svar är lika rimliga säger inget om vad eleverna har förstått. Komponenten bygger på att felsvaren visar hur eleverna tänker (Lichtenberger m.fl., 2025). I svensk åk 7 blev det ingen skillnad, kanske för att en del lärare mest ställde frågor om baskunskaper (Boström och Palm, 2023)."
      belagg: teori
      kallor: [lichtenberger-m-fl-2025, bostrom-och-palm-2023, andersson-m-fl-2017]
      kvar: Du kan säga vilket fel du letar efter innan du frågar.
      fritt: "Ett påstående, svar att välja mellan, en uppgift, en bild eller ett påhittat elevsvar, muntligt eller skriftligt. Frågan får vara din egen eller lånad."
      kryss: Jag ställde en fråga som skilde rätt tänkande från fel.
    - namn: Alla visar samtidigt
      moment: [Alla visar]
      vad: Alla tänker först själva och visar sedan samtidigt, så att du ser hela klassen på en gång.
      syns: "På lärarens signal visar varje elev sitt svar med handen eller på miniwhiteboard."
      varfor: "Den som räcker upp handen är ofta den som redan kan. Svenska matematiklärare i en kommun samlade sällan in svar från alla (Andersson m.fl., 2017). Med svarskort deltar eleverna mer (Marsh m.fl., 2023), men i 97 engelska skolor gav svarsdosor ingen skillnad på proven (Wiggins m.fl., 2017)."
      belagg: provad
      kallor: [marsh-m-fl-2023, andersson-m-fl-2017, wiggins-m-fl-2017]
      kvar: Alla tänker själva och visar samtidigt, innan någon säger svaret högt, och lappen ersätter inte frågan mitt i lektionen.
      fritt: "Tumme, fingrar eller miniwhiteboard, öppet för klassen eller synligt bara för dig. Parsamtalet visar dig hur eleverna tänker, men inte allas svar."
      kryss: Alla visade samtidigt, och jag såg dem.
    - namn: Beslutet
      moment: [Starten, Beslutet]
      vad: Före frågan har du tänkt igenom vad du gör vid varje utfall, och nästa steg följer det du såg.
      syns: "Läraren gör olika efter vad klassen visade. Hen går vidare, låter paren förklara sina svar eller visar på ett nytt sätt, och säger vad hen såg."
      raknas: false
      varfor: "Utan beslutet går lektionen vidare som om eleverna inte hade svarat. Det formativa sitter i att svaren används (Black och Wiliam, 1998). Jämför man studier i läsning, gav metoden 0,24 när läraren anpassade undervisningen, 0,05 utan och 0,36 med bara självbedömning (Xuan m.fl., 2022)."
      belagg: provad
      kallor: [xuan-m-fl-2022, klute-m-fl-2017, black-och-wiliam-1998]
      kvar: Det du såg förklarar vägen du tar, och du valde den före frågan.
      fritt: "Vad du gör vid varje utfall, när det sker och för vilka. Ett oväntat fel får ändra planen."
      kryss: Jag valde nästa steg efter det jag såg.
    - namn: Alla visar igen
      moment: [Starten, Beslutet]
      vad: Efter en ändring visar alla igen, så att ni ser om det hjälpte.
      syns: Eleverna visar igen efter lärarens ändring, ser det rätta svaret och jämför med sitt eget, och läraren räknar hur många som nu har rätt.
      varfor: "Utan en ny visning vet varken du eller eleven om ändringen hjälpte. Komponenten bygger på en ny uppgift när läraren har undervisat igen (Klute m.fl., 2017) och på att alla svarade igen efter parsamtalet, såg det rätta svaret och skrev upp om deras eget stämde (Lichtenberger m.fl., 2025)."
      belagg: teori
      kallor: [klute-m-fl-2017, lichtenberger-m-fl-2025]
      kvar: Alla visar igen och ser det rätta svaret, så att var och en vet om det hjälpte.
      fritt: "När bara paren har pratat ställer du samma fråga och ser vad samtalet gav. När du själv har visat ställer du en ny och ser vad var och en kan."
      kryss: Alla visade igen efter ändringen och såg det rätta.
roll:
  rubrik: "Lärarens roll: du låter svaren styra"
  text: Du planerar och undervisar som du brukar, stannar där det är avgörande, ser vad alla har förstått och låter det ändra nästa steg.
  fragor:
    - Vad såg jag hos eleverna?
    - Vad hörde jag dem säga?
    - Vad gör jag som lärare nu?
  fragornaText: "Den sista frågan svarar du på högt: ”Jag såg … Därför …”"

# ---------------------------------------------------------------------------------------------------------------------
# 2 Lektionen
# ---------------------------------------------------------------------------------------------------------------------
tidsschema:
  rubrik: Lagret i din lektion
  rader:
    - { tid: Före lektionen, fas: Före lektionen, vad: "Ta din planering och skriv tre rader på den: frågan, felet du letar efter och vad du gör om många har fel. Då vet du vad du tittar efter." }
    - { tid: 5 min, fas: Starten, form: Gemensamt, vad: "Utan namn börjar du med det du såg förra gången, på lapparna eller när alla visade." }
    - { tid: 10 min eller mer, fas: Din planering, form: Läraren visar, vad: "En genomgång, en text, en film, en laboration eller något skapande. Stanna före det som bygger på det ni just gjorde. I en längre lektion stannar du två gånger." }
    - { tid: 5 min, fas: Alla visar, form: Enskilt, vad: "Du ställer frågan, alla tänker och visar samtidigt, och du räknar eleverna med fel." }
    - { tid: 1 min och sedan vägen, fas: Beslutet, form: Enskilt, vad: "Du säger vad du såg och vilken väg ni tar." }
    - { tid: 5 min, fas: Exit-lappen, form: Enskilt, vad: "En eller två gånger i veckan svarar alla med ett skäl på en fråga om det viktigaste." }
    - { tid: Efter lektionen, fas: Efter lektionen, vad: "Med lappar: tre högar på fem minuter, rätt, felet och något annat, efter första svaret. Läs de två sista, rätta inget, och skriv hur nästa lektion börjar." }
  varianter:
    - nar: första lektionen
      text: "Starten och exit-lappen kommer i vecka 2. Du övar signalen på något klassen kan och tar sedan ett påstående på dagens innehåll."
      delar:
        - { fas: Din planering, tid: 0–⁠15 min }
        - { fas: Alla visar, tid: 15–⁠25 min }
        - { fas: Beslutet, tid: 25–⁠45 min }
  efter: "Du använder inte alla ställen varje gång: vecka 1 lägger du bara till Alla visar och Beslutet, och från vecka 2 Starten och exit-lappen en eller två gånger i veckan."
steg:
  rader:
    - namn: Starten
      fraga: "Sitter felet från förra lektionen kvar?"
      alla: Svarar på en ny fråga om felet du såg, eller om det ni gjorde för en vecka sedan.
      titta: "Hur många har felet kvar?"
      beslut: "Har 6 eller fler av 28 felet kvar, ta det nu och korta din planering. Annars går ni vidare till det nya."
      gor:
        - "”Ni skrev, så jag ändrade.” Skriv felet på tavlan, utan namn. ”Tre av er skrev att 10/14 blir 5/14.”"
        - "Utan lappar: ”Ni visade, så jag ändrade.”"
        - "”Ni ville göra det enklare, och det är rätt tanke. Vad hände med nämnaren? Prata en halv minut.”"
        - "”Förkorta 4/14. 1, 2, 3, visa!” Skriv 2/7 på tavlan. ”Har du något annat? Vad ändrar du?”"
      fraser: ["Ni skrev, så jag ändrade.", "1, 2, 3, visa!"]
    - namn: Din planering
      vem: som du har planerat
      fraga: "Vad säger de när jag stannar?"
      alla: Från vecka 2 säger de till axelkompisen vad de ska göra, och från vecka 4 sitt svar.
      titta: "Vilket steg fattas? Vilken tanke kommer igen?"
      beslut: Väv in det du hörde direkt, eller byt nästa exempel.
      gor:
        - "Säg gärna: ”Snart kommer en fråga.”"
        - "Från vecka 2, efter en instruktion: ”Säg till din kompis vad ni ska göra och i vilken ordning.”"
        - "Från vecka 4 stannar du också för ett parsamtal där du har planerat: ”Stopp. Vilket steg gör jag först, och varför?”"
        - Gå runt och lyssna i högst en minut.
        - "”Jag hörde att flera av er tänkte att …”"
      fraser: ["Snart kommer en fråga."]
    - namn: Alla visar
      fraga: "Hur många har fel, och är det samma fel?"
      alla: "Visar mot dig på signalen, med tummen, fingrarna eller en miniwhiteboard, eller går till ett hörn."
      titta: "Hur många har fel, och är det felet du letade efter?"
      beslut: Räkna färdigt innan du säger något. Du har redan tänkt igenom vad du gör.
      gor:
        - "Ställ frågan och skriv den på tavlan. ”Tänk själv. Håll svaret nere.”"
        - "Vänta från 15 sekunder för tummen till två minuter för en uträkning. Ingen räcker upp handen."
        - "”1, 2, 3, visa!”"
        - "Gå samma väg över rummet varje gång, och räkna en sak: hur många har fel? Vickande hand, frågetecken och tomt räknas som fel."
        - "Är det samma fel? Skriv upp några som har fel."
      fraser: ["Tänk själv. Håll svaret nere.", "1, 2, 3, visa!"]
    - namn: Beslutet
      vem: "alla, sedan var och en"
      fraga: "Vilken väg tar vi, och höll ändringen?"
      alla: "Arbetar själva, säger varför till axelkompisen eller följer dig."
      titta: "Höll det du ändrade? Vilket fel står kvar?"
      beslut: Ett av tre utfall, nedan. Talen är hållpunkter. Efter en ändring visar alla igen innan eleverna arbetar.
      gor:
        - "Säg på en halv minut, också när ni går vidare: ”Jag såg … Därför …”"
        - Ta den väg du tänkte igenom. Ett oväntat fel får ändra planen.
        - "Har många valt två olika svar är klassen delad: ”Jag ser olika svar.” Samma fel i stegen ser du på miniwhiteboarden och i texter."
        - "Efter en ändring: ”1, 2, 3, visa!” Säg antalet och det rätta: ”Först sex. Nu en. Har du något annat? Vad ändrar du?”"
        - När eleverna arbetar går du först till dem du skrev upp. Från vecka 5 går du sedan till dem med rött.
      fraser: ["Jag såg … Därför …", "1, 2, 3, visa!"]
      redo:
        nastanAlla: "Högst 5 av 28 med fel. Visa det rätta och varför. Eleverna arbetar direkt, gärna på en högre nivå: ”Hur vet du?” Du går först till dem du skrev upp."
        deFlesta: "6–13 av 28 med fel. Delad klass: paren säger varför, alla visar igen, du säger svaret. Samma fel i stegen: felet bredvid det rätta, och en ny fråga."
        halften: "14 eller fler av 28 med fel. Delad klass: paren först. Annars ett nytt sätt: en bild eller ett nytt exempel. Spridda fel: bryt ner steget. Alla visar igen."
        tiden: "Tiden räcker inte: ställ den nya frågan i nästa lektion, och låt lappen vänta. Det höll inte: samla dem med fel, de andra arbetar, och börja nästa lektion där."
    - namn: Exit-lappen
      fraga: "Vad tar de med sig, och vad börjar jag med nästa gång?"
      alla: Skriver ett svar och ett skäl på lappen.
      titta: "Rätt, felet du letade efter eller något annat?"
      beslut: Efter lektionen gör du tre högar och skriver en mening om hur nästa lektion börjar. Dem i högen Något annat skriver du upp.
      gor:
        - Visa frågan och ge tanketid.
        - "Ge två minuter med klockan synlig: ”Ett svar och ett skäl. Det här är inget betyg.”"
        - "Ge en minut till: ”Säg det till din kompis. Ändra i annan färg om du vill.”"
        - Den som inte vet skriver ett frågetecken och vad hen tänker. Samla in lapparna.
      fraser: ["Ett svar och ett skäl.", "Det här är inget betyg."]
lektionskort:
  - { efter: klassen, text: "Lektionskortet är ett eget A4 att ha i handen, med det du gör på varje ställe i din lektion." }
fastnar:
  rubrik: Så rättar du
  text: Det här gäller en elev. Har många samma fel hör det till Beslutet, och då lyfter du felet utan namn.
  trappa:
    - "Säg: ”Berätta hur du tänkte.”"
    - "Är det slarv, säg var och inte vad: ”Det är fel på en av de här raderna. Hitta den.”"
    - Har eleven tänkt fel, ge en ledtråd eller visa steget.
    - Låt eleven rätta i annan färg medan du går till nästa.
    - Kom tillbaka med en ny fråga av samma slag, och se att det håller.
  motto: Det viktigaste lärtillfället ligger ofta i det som var nästan rätt.
amnesexempel:
  - amne: lasning
    arskurs: förskoleklass
    innehall: "Rim och ljud: att höra att två ord slutar lika"
    overst:
      egen: "Vilken bild rimmar på hus? Hund kan visa att eleven lyssnar på första ljudet, och dörr att hen tänker på betydelsen."
      visar: Tre bilder med nummer. Alla håller handen mot bröstet och visar bildens nummer med fingrarna.
    scen:
      - "Tänk dig en lektion i förskoleklassen. Klassen har arbetat med rim. Du håller upp tre bilder med nummer, 1 mus, 2 hund och 3 dörr, och säger: ”Vilken rimmar på hus? Tänk. Håll handen mot bröstet.”"
      - "”1, 2, 3, visa!” Fingrarna kommer upp, och du går över rummet. Fyra av 28 visar något annat än ett finger. Tre visar hund och lyssnar kanske på första ljudet, och en visar dörr och tänker kanske på vad orden betyder."
      - "Det är högst fem. Du säger: ”Jag såg att nästan alla hör rimmet: hus och mus slutar lika. Därför går vi vidare.” Klassen arbetar med sina rimbilder, och du går först till de fyra: ”Lyssna på slutet: hus, hund. Låter de lika?”"
    notera: "Notera vad som hände. Svaren sa olika saker utan att någon behövde skriva. Hade tio visat hund, hade ni lekt med hur orden slutar, och du hade frågat igen vilken som rimmar på hatt: katt, höna eller mössa."
  - amne: skrivning
    arskurs: åk 7
    innehall: Att skriva argumenterande text, med skäl som förklarar
    overst:
      egen: "Ett påstående och ett skäl som förklarar varför. Felet: att påstå något utan att förklara."
      visar: Alla lämnar en text, och du läser texterna utan att skriva i dem.
    scen:
      - Tänk dig en lektion i svenska i åk 7, när klassen har skrivit insändare om skoldagens längd. Du har Helklassbladet utskrivet bredvid dig och läser de 28 texterna på en kvart, letar efter en enda sak och skriver inget i dem.
      - "12 av 28 påstår utan att förklara: ”Skoldagen är för lång, och många tycker det.” På bladet skriver du meningen utan namn, en mening som förklarar och fyra elever att tala med."
      - "Nästa lektion börjar du: ”Jag läste era texter. Jag såg att många påstår något utan att säga varför. Därför gör vi det här.” Du sätter de två meningarna bredvid varandra. ”Vad skiljer dem?” Paren säger det, och alla letar upp en mening i sin egen text och skriver om den i annan färg, medan du går till de fyra. I nästa text letar du efter samma sak, och då ser du om det höll."
    notera: "Notera vad som hände. Eleverna fick något att göra, och du skrev inga kommentarer. Hade högst fem påstått utan att förklara, hade du bara talat med dem. Hade hälften eller fler gjort det, hade du visat skillnaden först."
  - amne: matematik
    arskurs: åk 5
    innehall: "Bråk: att förkorta genom att dividera täljare och nämnare med samma tal"
    huvud: true
    overst:
      egen: "Dividera täljare och nämnare med samma tal. Felet: att bara dividera täljaren, så att 4/6 blir 2/6."
      visar: Två bråk på miniwhiteboarden, och alla håller upp svaren samtidigt.
    plan:
      klass: 5A
      datum: tors 19/11
      lektion: 4 av 5
      mal: förkorta bråk genom att dividera täljare och nämnare med samma tal
      belagg: "förkorta 10/14 så långt det går"
      blad: "miniwhiteboards och exit-lappar"
      forberett: "bilder av bråken till den som behöver se dem"
      fore: { fragan: "Förkorta 4/6 och 6/10", svaret: "2/3 och 3/5", felet: "bara täljaren: 2/6 och 3/10", nya: "8/10 och 6/15" }
      delar:
        - { fas: Starten, text: "Förra lappen, att förlänga: 2/3 blev 2/15" }
        - { fas: Din planering, text: "Som jag har planerat: 6/8 blir 3/4, och två exempel till" }
        - { fas: Alla visar, text: "Miniwhiteboard: 4/6 och 6/10" }
        - { fas: Beslutet, text: "Uppgifterna på sidan 43 i boken" }
        - { fas: Exit-lappen, text: "Förkorta 10/14, och skriv varför du gjorde så" }
      beslut: { elever: 24, deFlesta: "2/6 bredvid 2/3", halften: "bråken som bilder" }
      efter: { kontrollen: "6 med fel", hogar: "Rätt 19 · Felet 3 · Annat 2", sag: "”Man delar det som är uppe.” Felet bredvid det rätta hjälpte", kryss: [1, 2, 3, 4], nasta: "5/14 på tavlan, och vad som hände med nämnaren", forst: "de två i högen Något annat" }
      lagg: ["Lägg märke till: den nya frågan har andra tal, så att eleven måste tänka igen."]
    remsa:
      - "Förkorta 4/6 och 6/10. Du letade efter felet att bara dividera täljaren."
      - 24 miniwhiteboards gick upp på signalen, och du såg stegen.
      - "Sex hade samma fel, så du stannade och satte felet bredvid det rätta."
      - "Två nya bråk: 23 av 24 hade rätt, och eleverna arbetade själva."
    scen:
      - "Tänk dig en lektion i matematik i åk 5. Du undervisar som planerat och visar att 6/8 kan förkortas till 3/4 om man dividerar täljaren och nämnaren med samma tal. Du skriver 4/6 och 6/10 på tavlan: ”Förkorta så långt det går.” Två minuter senare säger du ”1, 2, 3, visa!”, och tjugofyra miniwhiteboards går upp samtidigt."
      - "Sex har samma fel: de har dividerat bara täljaren, så att 4/6 blev 2/6. Du stannar: ”Jag såg att några av er har gjort på ett sätt som är värt att titta på.” Du skriver 2/6 bredvid 2/3, utan namn. ”Vad skiljer dem?” Paren pratar, och du lyssnar. Du tänker högt: ”Nämnaren säger hur stora delarna är. 2/6 är bara hälften av 4/6, men i 2/3 är delarna dubbelt så stora.”"
      - "Du ställer en ny fråga: 8/10 och 6/15. ”1, 2, 3, visa!” 23 av 24 har rätt. Du skriver 4/5 och 2/5 på tavlan: ”Har du något annat, vad ändrar du?” Eleverna arbetar själva, och du går först till den som kämpar."
    notera: "Notera vad som hände. Frågan var mer än en kontroll: det eleverna hade förstått styrde ditt nästa beslut. Hade högst fyra haft fel, hade du gått vidare och hjälpt dem under övningen. Hade hälften eller fler haft samma fel, hade du tagit om genomgången på ett nytt sätt. Nästa vecka ställer du samma slags fråga i Starten, och några har felet igen. Det hör till."
  - amne: so-no
    amnesnamn: Fysik
    arskurs: åk 8
    innehall: Krafter och jämvikt, när något ligger still
    overst:
      egen: "Krafterna på något som ligger still tar ut varandra. Felet: att inga krafter verkar, eller att bordet inte trycker."
      visar: Fyra svar på tavlan. Alla håller handen mot bröstet och visar svarets nummer med fingrarna.
    scen:
      - "Tänk dig en lektion i fysik i åk 8. En bok ligger på bordet. ”Varför faller den inte? 1 Inga krafter verkar på den. 2 Tyngdkraften drar, och bordet är bara i vägen. 3 Bordet trycker upp lika mycket som tyngdkraften drar ned. 4 Boken är för lätt.”"
      - "”1, 2, 3, visa!” 19 av 28 har fel: 15 visar två fingrar och 4 visar ett. Klassen är delad på 2 och 3, och du stannar: ”Jag såg att många väljer 2. Därför gör vi det här. Säg till din kompis på en halv minut: hur kan någon ha tänkt som valde 2?” Du lägger boken på handen. ”Vad gör min hand?” Handen måste trycka upp, och det gör bordet också."
      - "En ny fråga: ”En lampa hänger still i sin sladd. Varför faller den inte? 1 Sladden drar upp lika mycket som tyngdkraften drar ned. 2 Inga krafter. 3 Tyngdkraften drar, och sladden är bara i vägen. 4 Lampan är för lätt.” 4 av 28 har fel. Du visar det rätta, och klassen arbetar medan du går till de fyra."
    notera: "Notera vad som hände. Svar 2 bestämde vad du gjorde: paren fick resonera om det, och du behövde bara visa bordets kraft. Hade felen varit spridda på alla svar, hade du brutit ner steget."
  - amne: praktisk-estetiska
    amnesnamn: Bild
    arskurs: åk 3
    innehall: Att skapa djup i en bild, med något nära och något långt bort
    overst:
      egen: "På marken blir det som är långt bort mindre och högre upp. Felet: att eleven ritar allt lika stort, på samma linje."
      visar: Tre skisser på tavlan, och alla visar skissens nummer med fingrarna.
    scen:
      - "Tänk dig en lektion i bild i åk 3. Klassen ska rita ett landskap. Du sätter upp tre skisser: i den första är huset lika stort som trädet längst fram, i den andra är huset litet och högre upp, och i den tredje är huset stort och längst ned. ”Vilken gör att huset ser ut att vara långt bort? Det handlar inte om vilken som är finast.”"
      - "”1, 2, 3, visa!” 9 av 26 har fel, och de flesta av dem visar ett finger. Klassen är delad. Du säger inte svaret än: ”Säg till din kompis varför du valde den.” Paren pratar en halv minut, och du lyssnar: ”Den är ju finast.” ”Men huset är lika stort som trädet.” Du frågar igen om samma skisser: ”1, 2, 3, visa!” Tre av 26 har fel."
      - "Du säger varför skiss 2 fungerar, och alla ritar. Du går först till de tre."
    notera: "Notera vad som hände. Frågan gällde det ni tränar på, och inte smaken. Hade nästan alla valt rätt, hade alla börjat rita direkt. Hade hälften eller fler valt fel, hade du ritat huset på tavlan, litet och högt upp."
stod:
  rubrik: Elever som behöver mer stöd
  rader:
    - { nar: Den som är ny i svenska, metoden: "Eleven visar med fingrarna, en bild, ett tal eller ett ord, i samma uppgift som de andra. Du ser först efter om hen har förstått innehållet. Ämnets ord står på tavlan, och resten säger du enklare.", du: "Skriv frågan på tavlan, ha bild vid svaren och låt eleven prata med axelkompisen på det språk hen väljer. Skälet på lappen får vara en uträkning, en bild eller ett ord." }
    - { nar: När många behöver hjälp samtidigt, metoden: "Det är ett utfall och inget problem: du lyfter felet, och de som är klara arbetar vidare.", du: "De som är klara svarar på ”Hur vet du?” på sin miniwhiteboard medan du lyfter felet. Alla visar igen, och du går först till dem du skrev upp." }
    - { nar: Den som behöver stöd för att komma med, metoden: "Alla svarar, så eleven som sällan räcker upp handen kommer med.", du: "Börja med två alternativ, gärna med bild. Visa hur man svarar, ge tanketid och följ hens svar. Hen kan visa i stället för att säga." }
    - { nar: Den som inte skriver än, metoden: "Tummen, fingrarna och bilder räcker, och exit-lappen kan vara en bild eleven ringar in.", du: "Ge återkopplingen muntligt medan eleven arbetar, och låt hen använda den genast." }
    - { nar: Den som redan kan, metoden: "Eleven får en fråga till: varför är de andra svaren fel?", du: "”Övertyga mig: varför är de andra svaren fel?” ”Skriv en egen fråga med två felsvar.”" }
    - { nar: När metoden inte räcker, metoden: "Exit-lapparna visar vem som har samma fel kvar, om du sparar dem en månad.", du: "Gör eleven samma fel tre gånger på samma slags fråga, läs hens lappar med specialläraren. Räcker inte det, ta det med elevhälsan." }

