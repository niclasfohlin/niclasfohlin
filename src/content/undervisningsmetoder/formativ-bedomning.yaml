strukturkort:
  text: "Här är fyra strukturer att bygga på när grunden sitter. Du behöver dem inte för att börja. Lektionens syfte är det viktiga, och strukturen är ett hjälpmedel. Den blir formativ först när du tar reda på vad eleverna tänker och gör något med det. Utan det blir den bara en aktivitet."
  strukturer: [epa, lyssna-och-skriv, vad-undrar-jag, kims-prov]
ramar:
  rubrik: Materialet för klassen
  text: ["Utöver lektionskortet och strukturkorten finns affischen Så visar vi, exit-lappen och färgkortet för klassen, och Helklassbladet för dig. Varje blad står på en egen sida."]
  ramar:
    - rubrik: Så visar vi
      text: ["Skriv ut affischen i A3 och sätt upp den där alla ser den, eller visa den på tavlan. De första veckorna pekar du på den, när ni övar rutinen Tänk och visa."]
    - rubrik: Exit-lappen
      text: ["Skriv ut och klipp isär de fyra lapparna, eller använd vanliga lappar. Skriv frågan på tavlan. Eleverna skriver ett svar och ett skäl."]
    - rubrik: Färgkortet
      text: ["Skriv ut i färg, klipp ut en remsa per elev, vik längs strecken och tejpa fliken, så att kortet står på bänken. Har du ingen färgskrivare, ta tre muggar eller skriv ut i svartvitt, eftersom orden står kvar. Eleven vänder färgen och orden mot dig."]
    - rubrik: Helklassbladet
      text: ["Bladet är ditt, och du tar det när du vill. Raden Helklassbladet i Utveckla metoden säger hur."]
tabeller:
  - rubrik: Samma varv vid två tillfällen
    plats: efter-inledning
    text: "I lagret gör du samma varv vid två tillfällen."
    kolumner: [När, Frågan, Alla visar, Beslutet, Alla visar igen]
    rader:
      - ["Mitt i lektionen", "När du stannar", "Tumme, fingrar eller miniwhiteboard", "”Jag såg … Därför …”", "Efter en ändring"]
      - ["Mellan lektionerna", "På en lapp eller i ett arbete", "Alla lämnar sitt svar", "Tre högar och en mening", "I Starten, nästa lektion"]
  - rubrik: Tanken bakom greppen
    plats: efter-inledning
    text: "Vet du varför du gör ett grepp, är det lättare att ändra formen utan att tappa tanken."
    kolumner: [Greppet, Det ger dig, Det ger eleven]
    rader:
      - ["Tummen på ett påstående", "Du ser hela klassen på en gång.", "Eleven tar ställning själv före de andra."]
      - ["Säg varför till kompisen", "Du hör hur de tänker.", "Eleven sätter ord på sin tanke och hör kompisens."]
      - ["Säg instruktionen", "Du hör vad som gick fram, och färre frågar vad de ska göra.", "Eleven sätter ord på vad hen ska göra, och kompisen fyller i det som fattas."]
      - ["Jag såg … Därför …", "Du måste välja och kan inte glida vidare.", "Eleven hör vilket fel du såg och att svaren räknas."]
      - ["Alla visar igen", "Du ser om ändringen hjälpte.", "Eleven ser det rätta bredvid sitt svar och vet om hen har kommit vidare."]
      - ["Exit-lappen och tre högar", "På fem minuter vet du var klassen står inför nästa lektion.", "Eleven hämtar det viktigaste ur minnet, och den som har felet möter det igen."]
      - ["Starten med det du såg", "Du ser om felet sitter kvar.", "Eleven prövar igen efter ett uppehåll och märker att svaren ändrade lektionen."]
      - ["Miniwhiteboarden", "Du ser stegen och var det blev fel.", "Eleven ser sina steg bredvid det rätta och kan sudda och pröva igen."]
      - ["Frågan ur felet", "Felsvaren säger vad du ska ändra.", "Eleven måste skilja felet från det rätta."]
      - ["Färgkortet", "Du ser var du behövs.", "Eleven tar ställning till sitt eget lärande, och prövar om färgen stämde."]
      - ["Rätta själv", "Du skriver färre kommentarer.", "Eleven använder återkopplingen."]
  - rubrik: Frågor att låna
    plats: efter-progression
    meny: true
    text: "Vecka 1 tar du ett felsvar här och säger det som en mening, som ”Allt som rör sig lever.” Från vecka 4 lånar du frågan, eller skriver en egen: ta ett vanligt fel, gör det till ett av svaren, och låt det rätta svaret byta plats från fråga till fråga. Numrera svaren på tavlan, så att eleverna visar numret och inte talet. Kan en elev få rätt med felet kvar, ändra frågan. Hittar du inget fel, titta i förra provet eller fråga en kollega vad eleverna brukar svara."
    kolumner: [Ämne och årskurs, Frågan, Rätt svar och vad felen kan säga]
    rader:
      - ["Svenska, förskoleklass", "Vilken bild rimmar på hus? Mus, hund eller dörr.", "Mus. Hund: lyssnar på första ljudet. Dörr: tänker på vad orden betyder."]
      - ["Matematik, åk 1", "10 − 3 = 7, 13 eller 8?", "7. 13: adderar. 8: räknar 10 som första steget bakåt."]
      - ["Matematik, åk 2–⁠3", "34 + 8 = 42, 312, 41 eller 26?", "42. 312: ingen växling. 41: räknar 34 som första steget. 26: subtraherar."]
      - ["NO, åk 1–⁠3", "Vad lever? Bilen, trädet, molnet eller stenen.", "Trädet. Bilen eller molnet: det som rör sig lever. Stenen: gissar."]
      - ["Svenska, åk 4–⁠6", "Maja smällde igen dörren och svarade inte. Vilket svar har bäst stöd i texten? 1 Arg, det står i texten. 2 Arg, hon smäller och svarar inte. 3 Trött, jag svarar inte när jag är trött.", "Rätt: 2. Väljer 1: tror att det står utskrivet. Väljer 3: utgår från sig själv."]
      - ["SO, åk 4–⁠6", "Vem stiftar Sveriges lagar? Regeringen, kungen, riksdagen eller EU-kommissionen.", "Riksdagen. Regeringen: blandar stifta och styra. Kungen: blandar statschef och makt. EU-kommissionen: drar EU:s roll för långt."]
      - ["Musik, åk 4–⁠6", "Spela något. Två- eller tretakt? Fingrar på signalen, två omgångar.", "Fel antal: kan ha svårt att höra betoningen. En omgång räcker inte, eftersom hälften kan gissa rätt."]
      - ["Engelska, åk 4–⁠6", "Yesterday I ___ to school. Go, goed eller went?", "Went. Go: tänker inte på tiden. Goed: använder -ed på allt."]
      - ["Slöjd, åk 4–⁠6", "I vilken riktning slipar du trä? Tvärs över, längs fibrerna eller runt runt. Visa med handen på din bit.", "Längs fibrerna. Tvärs över: kan tänka att snabbare är bättre. Runt runt: tänker inte på riktningen."]
      - ["Matematik, åk 5–⁠9", "(3 + 2 · 4) + (9 − 3 + 1) = 27, 18, 16 eller 25?", "18. 27: räknar från vänster. 16: tar 3 + 1 först. 25: båda felen."]
      - ["Historia, åk 7–⁠9", "Varför kunde ett skott i Sarajevo bli ett världskrig? 1 Franz Ferdinand sköts av en nationalist. 2 Länderna hade lovat att hjälpa varandra, så fler drogs in. 3 Miljontals soldater dog.", "Rätt: 2. Väljer 1: återger händelsen. Väljer 3: ger en följd."]
      - ["Idrott och hälsa, åk 7–⁠9", "Du ska springa 1 500 meter och orka hela vägen. Visa med fingrarna, och gå sedan till hörnet med ditt nummer: 1 Börja så snabbt du orkar. 2 Håll samma tempo hela vägen. 3 Börja sakta och spara allt till slutet.", "Rätt: 2. Väljer 1: tror att försprång räcker. Väljer 3: sparar för mycket."]
  - rubrik: Utveckla metoden
    plats: efter-progression
    meny: true
    text: "Inget av det här behövs för att börja. Formativ bedömning brukar beskrivas med fem strategier, och de finns redan i liten form i lagret: mål och kriterier, frågor som visar var eleverna står, återkoppling, eleverna som resurser för varandra och eleverna som resurser för sig själva. Efter de fem första veckorna har en vanlig vecka en fråga i varje lektion och en fråga ur felet. Lappen och Starten tar du en eller två gånger, Säg instruktionen före arbetet, färgkortet när eleverna arbetar och Rätta själv när klassen har lämnat ett arbete. När den veckan sitter kan du bygga på, en sak i taget. Till fyra av raderna finns strukturkort, som du skriver ut från metodens sida."
    kolumner: [Det du bygger på, Så gör du, Tanken]
    rader:
      - ["Två exempel före arbetet", "När eleverna inte vet vad som är bra: visa två lösningar eller texter. ”Vilken skulle du visa en kompis, och varför?” Klassen skriver två saker att titta efter.", "Eleven ser vad som är bra innan hen börjar, och du slipper förklara det efteråt."]
      - ["Kims prov", "Efter en uppgift eller ett prov visar du elevsvar utan namn, och eleverna säger vad som är bra och var det blev fel.", "Eleven känner först igen felet hos någon annan, och du ser vilka fel klassen ser."]
      - ["En sak att titta efter", "När klassen har övat Rätta själv: paren läser varandras arbete och tittar efter en enda sak, och var och en säger vad hen gör härnäst.", "En kompis hjälper eleven vidare, och du behöver inte nå alla."]
      - ["Klädnypan på stegen", "Skriv tre steg i arbetsområdet på en remsa, med elevens ord. Eleven flyttar en klädnypa på remsan före och efter arbetet. ”Visa mig var det syns.”", "Eleven ser var hen är, och du ser vilka som står kvar."]
      - ["Gå till exemplet", "Du sätter upp tre exempel på olika nivå i rummet. Eleven ställer sig vid det som liknar det egna arbetet mest och säger vad nästa steg är.", "Eleven bedömer sitt arbete och hittar nästa steg, och du ser spridningen på en gång."]
      - ["Kompisen signerar", "Innan eleven lämnar in läser en kompis arbetet med kraven bredvid och signerar när allt finns med.", "Båda läser kraven en gång till, och du slipper påpeka det som saknas."]
      - ["Helklassbladet", "När klassen har lämnat in ett arbete: läs det med bladet bredvid, skriv inget i böckerna, och visa ett starkt exempel och ett vanligt fel.", "Du skriver färre kommentarer, och alla rättar sitt eget."]
      - ["Eleven skriver frågan", "När klassen är van vid frågor ur felet: ”Skriv en egen fråga med två felsvar.”", "Du ser vad eleven tror att felen är, och eleven tänker igenom innehållet."]
      - ["EPA", "Vid ett samtal tänker var och en först, sedan pratar de i par och till sist hela klassen.", "Alla får tänka först, och du hör vad paren säger."]
      - ["Lyssna och skriv", "När du har en text, en film eller en längre genomgång skriver eleverna nyckelord efter varje del och jämför dem i grupper om tre till fyra. Gå runt och läs orden.", "Du ser vad som gick fram, och eleven hämtar det ur minnet."]
      - ["Vad undrar jag?", "När du vill se kopplingar och luckor skriver eleverna på var sin lapp vad de undrar över. I grupper drar de en lapp i taget och pratar om frågan. Sedan sorterar du frågorna inför nästa genomgång.", "Du ser luckorna, och eleven säger vad hen inte förstår."]
      - ["Fråga, pausa, nedslag och studs", "När klassen är trygg: ingen räcker upp handen, och du väntar. Du väljer en elev, som svarar eller säger pass, och nästa elev bygger vidare.", "Samtalet går djupare, och alla är beredda på att svara."]
planeringsmall:
  text: "Planeringsmallen är ingen ny planering: skriv det här på den du har, eller på bladet när du vill. Det räcker med frågan, felet och vad du gör om många har fel. Tänk igenom vad du letar efter och vad du gör vid varje utfall innan du står framför eleverna."
  fore:
    - { etikett: "Frågan och svaret", rader: ["Ordagrant:", "Det rätta svaret:"], falt: [fragan, svaret] }
    - { etikett: "Felet och den nya frågan", rader: ["Felet jag letar efter:", "Den nya frågan:"], falt: [felet, nya] }
  delar:
    - { fas: Starten, skriv: "Det jag såg sist:", hojd: 0.7 }
    - { fas: Din planering, skriv: "En rad om det jag har planerat, och var jag stannar:", hojd: 0.8 }
    - { fas: Alla visar, skriv: "Tummen, fingrarna eller miniwhiteboarden:", not: "Räkna hur många som har fel. Vickande hand, frågetecken och tomt räknas som fel.", hojd: 0.9 }
    - { fas: Beslutet, skriv: "Sedan arbetar eleverna med:", not: "Säg: Jag såg … Därför … Efter en ändring visar alla igen.", hojd: 1.0 }
    - { fas: Exit-lappen, skriv: "Frågan på lappen:", hojd: 0.8 }
  beslut: { deFlesta: "Det jag lyfter:", halften: "Det nya sättet:" }
  efter:
    text: "Fyll i samma dag, också lapparna när du har dem."
    kontrollen: "Alla visar: ___ med fel"
    hogar: "Lapparna: rätt ___ felet ___ annat ___"
    sag: "Felet, med elevernas ord, och det som hjälpte"
    nasta: "Nästa lektion börjar med"
    forst: "Jag går först till"
  overst: ["Felet jag letar efter, och vad jag gör"]
  kolumner: ["Vad jag gör och vad eleverna visar"]
  sist: ["Efter lektionen: rätt, felet och något annat", Nästa lektion]
observation:
  fraga: Vad ändrade läraren i lektionen efter det eleverna visade?
  text: "Skriv ut dubbelsidigt, och välj med läraren två elever att följa, A och B, gärna en som brukar ha det svårt. Stå där du ser svaren. Skriv frågan ordagrant, räkna hur många som har fel och skriv vad läraren säger och gör direkt efter. Tio minuter runt frågan räcker, och det du inte ser får stå tomt."
  fokus: Vad gjorde jag direkt efter att alla hade visat?
  huvud: ["Felet läraren letar efter"]
  kolumner:
    - { namn: Läraren frågar och säger, text: "frågan ordagrant, och det läraren säger", bredd: 30 }
    - { namn: Alla visar, text: "rätt · fel · tomt", bredd: 13, elever: true }
    - { namn: Direkt efter, text: "det läraren säger och gör, och vad eleverna gör då", bredd: 34 }
  tecken: "+ rätt, f fel, ? frågetecken eller vickande hand, 0 visar inget. Allt utom + räknas som fel."
  delar:
    - { fas: Starten, rader: 1, rakna: "Började med det läraren såg: ja · nej   Med fel: ___ av ___" }
    - { fas: Din planering, rader: 2, rakna: "Stannade: ___ gånger   Vävde in det hen hörde: ja · nej   Paren sa instruktionen: ja · nej" }
    - { fas: Alla visar, rader: 2, rakna: "Visade på signalen: ___ av ___   Med fel: ___ av ___" }
    - { fas: Beslutet, rader: 3, rakna: "Med fel när alla visade igen: ___ av ___   Utfallet: Nästan alla · De flesta · Hälften eller färre" }
    - { fas: Exit-lappen, rader: 1, rakna: "Frågan gällde det viktigaste: ja · nej   Lämnade lapp: ___ av ___" }
  streck:
    - { etikett: Efter visningen, drag: ["Säger vad hen såg", "Går vidare som planerat", "Paren säger varför", "Sätter felet bredvid det rätta", "Visar på ett nytt sätt", "Alla visar igen"] }
  rader:
    - "Frågan skilde rätt tänkande från fel: ja · nej. Elever med felet läraren letade efter: __ av __"
