lararensFragor:
  rubrik: Lärarens frågor
  fragor:
    - { fraga: "Får jag hoppa över beslutet när tiden är knapp?", svar: "Nej. Lägg mindre tid på frågan, och ta beslutet i Starten om tiden tar slut. Frågorna ensamma, utan fortbildning i att använda svaren, gav ingen säker vinst i fysik på gymnasiet (Lichtenberger m.fl., 2025).", komponent: Beslutet }
    - { fraga: "Får jag låta eleverna räcka upp handen ibland?", svar: "Ja, när du vill höra en tanke. När du ska avgöra vad ni gör härnäst behöver du allas svar, eftersom ändringar annars bygger på några få (Andersson m.fl., 2017).", komponent: Alla visar samtidigt }
    - { fraga: "Får jag använda en vanlig uppgift i stället för en fråga med svar att välja mellan?", svar: "Ja, från vecka 3, när eleverna har miniwhiteboarden. Svaren på en vanlig uppgift visar också felen, om stegen syns. Frågor ur felet kommer i vecka 4.", komponent: En fråga som säger något }
    - { fraga: "Måste jag låta alla visa igen varje gång?", svar: "Efter en ändring, ja. Hinner du inte, visar de igen först i nästa lektion. Går ni vidare utan ändring behövs ingen ny visning.", komponent: Alla visar igen }
    - { fraga: "Hur hinner jag kursen?", svar: "Lagret tar omkring tio minuter, 15–20 en dag med lapp och ändring. Stryk en övning eller en del av genomgången. I fysik på gymnasiet tog metoden fyra av fjorton lektioner (Lichtenberger m.fl., 2025)." }
    - { fraga: "Vad gör jag när jag inte vet vad felet betyder?", svar: "Fråga eleven: ”Hur fick du det?” Är det språket, läs frågan högt eller rita. Visa sedan felet för en kollega i samma ämne, som kan känna igen det." }
hinder:
  rubrik: Det svåraste med metoden
  text: "Det som ofta försvinner är beslutet: alla visar, men nästa steg är detsamma som innan du frågade. Du märker det sällan själv: i England ändrade många skolor programmet och sa ändå att de följde andan i det (Speckesser m.fl., 2018). I svensk åk 7, där metoden inte gav någon skillnad, använde nästan alla lärare lappar, men bara hälften lät alla visa varje dag och ändrade direkt (Boström och Palm, 2023). Tänk igenom före frågan vad du gör, säg högt vad du såg, och be en kollega se vad som följer."
  kort: "Det som ofta försvinner är beslutet: alla visar, men nästa steg är detsamma som innan du frågade. Tänk igenom före frågan vad du gör vid varje utfall, och säg högt vad du såg."
  komponent: Beslutet
fallgropar:
  rubrik: Vanliga fallgropar
  rader:
    - { fallgrop: "Frågan säger inget", hander: "Du frågar ”Vad tänker ni om det här?” eller ”Förstår alla?” Svaren säger inget, eller så går det att få rätt med felet kvar.", prova: "Fråga om det man måste förstå, som ”Vilket steg gör jag först, och varför?” Utgå från felet, och ibland från det svåra.", komponent: En fråga som säger något }
    - { fallgrop: "Handen går upp igen", hander: "En pressad vecka frågar du klassen, och de tre snabbaste svarar.", prova: "Börja om med tummen en vecka, och säg varför.", komponent: Alla visar samtidigt }
    - { fallgrop: "Alla visar, och planen rullar vidare", hander: "Du säger ”bra”, och lektionen går som du tänkte.", prova: "Säg efter varje visning, också när ni går vidare: ”Jag såg … Därför …”", komponent: Beslutet }
    - { fallgrop: "Lapparna blir liggande", hander: "Högen ligger kvar till nästa vecka, och nästa lektion blir som planerat.", prova: "Ta färre lappar: en fråga, tre högar samma dag och en mening. Du rättar dem inte.", komponent: Beslutet }
    - { fallgrop: "Du ändrade, men frågade inte igen", hander: "Du förklarar igen och går vidare, och vet inte om det hjälpte. Eleverna vet det inte heller.", prova: "Låt alla visa igen: samma fråga när bara paren har pratat, en ny när du har visat. Förklara inte samma sak högre.", komponent: Alla visar igen }
    - fallgrop: När klassen är delad
      moment: [Beslutet]
      hander: Klassen har valt två olika svar, och det är lätt att säga svaret direkt.
      steg: ["Håll masken: ”Jag ser olika svar. Bra, då har vi något att reda ut.”", "”Har ni olika svar, övertyga varandra. Har ni samma, hur tänkte de andra?”", "Gå runt en halv minut, och lyssna efter det vanligaste skälet.", "”1, 2, 3, visa!” på samma fråga, eftersom bara paren har pratat.", "Säg nu vad som stämmer, och varför."]
    - fallgrop: När många har fel
      moment: [Beslutet]
      hander: Planen spricker, och det är lätt att gå vidare ändå.
      steg: ["Säg: ”Jag såg att många gör så här. Därför gör vi det här.”", "Skriv felet bredvid det rätta, utan namn. ”Vad skiljer dem?”", "Tänk högt om skillnaden, med ett nytt exempel, en bild eller ett föremål.", "Är felen spridda, ta i stället ett steg i taget och fråga efter varje.", "”1, 2, 3, visa!” på en ny fråga, och visa det rätta."]
    - fallgrop: När någon inte visar
      moment: [Alla visar, Beslutet]
      hander: Eleven har handen nere eller miniwhiteboarden tom, eller någon skrattar åt ett svar.
      steg: ["Säg i förväg: ”Vet du inte, visa vickande hand eller skriv ett frågetecken.”", "Ropar eller skrattar någon, ta det genast: ”Jag behöver alla svar.”", "Har någon ropat svaret, ta en ny fråga av samma slag.", "Säg inget högt om eleven. Gå dit när de andra arbetar eller pratar.", "Fråga tyst: ”Vad är det första du kan säga om det här?”", "Har eleven inte börjat, gör första uppgiften ihop och kom tillbaka."]
hallFast:
  rubrik: Fem saker att hålla fast vid
  rader:
    - { sak: "När arbetslagets möte hotas: behåll tiden", text: "Det som har bokad tid sitter kvar, också när skolan får en ny satsning. Boka nästa möte innan ni går. Är tiden kort, ta bara vad var och en ändrade och vad hen gör härnäst." }
    - { sak: "När tiden är knapp: ställ frågan före genomgången", text: "Då ser du vad du kan hoppa över, och du går igenom det eleverna hade fel på. Det gäller innehåll klassen har mött. Nytt innehåll går du igenom först." }
    - { sak: "När arbetsområdet byts: ta fram felen först", text: "Varje område har sina fel. Spara till nästa år det du skrev om felet och det som hjälpte." }
    - { sak: "När det rullar på: gissa före frågan", text: "Skriv hur många du tror har fel, och jämför med det du räknar. Den egna känslan säger lite, och därför kommer kollegan på besök också när det går bra." }
    - { sak: "När klassen är van: ge eleverna en del av jobbet", text: "Låt dem skriva en fråga med felsvar eller titta efter en sak i kompisens arbete. Fler grepp står i Utveckla metoden." }

