# ---------------------------------------------------------------------------------------------------------------------
# Lär dig metoden
# ---------------------------------------------------------------------------------------------------------------------
plan:
  passen:
    - { nar: första lektionen, kort: Tänk och visa, text: "Du håller din egen lektion och lägger till ett påstående." }
  fore: ["Välj den klass och det ämne där du redan vet vilka fel eleverna gör."]
  utvardering: ["Ni ses fyra gånger efter de första veckorna, med frågorna från mötet i vecka 5, och var och en skriver vad hen prövar. Elever som har samma fel kvar får stödundervisning, med lapparna som underlag."]
  skattningar:
    - namn: Hur säker är jag på metoden?
      vem: lararen
      rad: lararen
      text: "Skatta i slutet av veckan. Tänk på kärnan: Skilde din fråga rätt tänkande från fel? Visade alla samtidigt, och såg du dem? Följde nästa steg det du såg? Visade alla igen efter ändringen, och såg de det rätta?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: osaker }
    - namn: Hur väl fungerar den i praktiken?
      vem: lararen
      rad: klassen
      text: "Tänk på det du ser i klasserna: Har fler rätt än första gången när alla visar igen? Säger de hur de tänkte? Från vecka 5: Klarar de samma slags fråga en vecka senare, och stämmer färgen med svaret?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: klassenstar }

# ---------------------------------------------------------------------------------------------------------------------
# Lathunden Att komma igång
# ---------------------------------------------------------------------------------------------------------------------
lathund:
  metoden:
    text:
      - Du lägger ett lager över din egen planering, så att du får veta vad alla har förstått medan du kan göra något åt det. Det du ser avgör nästa steg.
      - Lärandet går till så här. Eleverna tar ställning, du får veta vad som hindrar dem, och de märker att deras svar ändrar lektionen.
  lektion:
    text: "Du håller din egen lektion och lägger till ett påstående. Tre rader räcker: frågan, felet och vad du gör om många har fel. Säg: ”Jag behöver veta vad ni har förstått. Det är inget prov.” Öva signalen först. Säg sedan ett vanligt fel, ibland något sant. Är klassen delad säger paren varför, alla visar igen, och du säger svaret."
  igang:
    rubrik: De första veckorna
