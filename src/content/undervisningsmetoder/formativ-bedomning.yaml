progression:
  rubrik: De första veckorna
  text: "Metoden är troligen lika ny för dig som för eleverna. Gör varje grepp flera gånger tills det blir en rutin, och lägg till ett i taget. Du behöver ingen ny planering. De tre första veckorna lägger du små saker ovanpå den du har. Du börjar med tre rader på den: frågan, felet och vad du gör om många har fel. Vecka 2 kommer först Säg instruktionen och sedan frågan på lappen, och vecka 3 den nya frågan. De första veckorna ser du fler fel än du är van vid. Felen fanns där förut, och nu går det att göra något åt dem. Alla fyra delarna av kärnan finns från första lektionen. Ordningen och takten är förslag: gör om en vecka tills greppet sitter, och ta ett annat grepp först om det passar dig bättre, så länge de fyra delarna finns."
  rader:
    - { vecka: "1", led: Små saker, rubrik: Tummen och ett påstående, eleverna: "Att tänka tyst, visa på signalen och säga varför till axelkompisen.", roll: "Att skriva ett vanligt fel som en mening, ibland något sant, välja väg före frågan, räkna felen och säga vad du såg.", vidare: "nästan alla visar på signalen, och nästa steg följer det du såg", fraga: "Visar nästan alla på signalen, och följer nästa steg det du såg?" }
    - { vecka: "2", led: Små saker, rubrik: Instruktionen och exit-lappen, eleverna: "Att säga till kompisen vad de ska göra, och att svara med ett skäl.", roll: "Att lyssna på paren, lägga lapparna i högarna Rätt, Felet och Något annat, och börja nästa lektion med det du såg.", vidare: "nästa lektion börjar med det du såg på lapparna", fraga: "Började nästa lektion med det du såg på lapparna?" }
    - { vecka: "3", led: Små saker, rubrik: Miniwhiteboarden och en ny fråga, eleverna: "Att skriva stort, hålla svaret nere och skriva ett frågetecken när de inte vet.", roll: "Att läsa stegen, sätta felet bredvid det rätta och ställa en ny fråga, som du skriver på din planering.", vidare: "du ser felet, ställer en ny fråga och säger antalet före och efter", fraga: "Såg du vilket fel det var, och sa du hur många som hade fel före och efter den nya frågan?" }
    - { vecka: "4", led: Lite mer, rubrik: Frågan ur felet och Jag hörde, eleverna: "Att visa svaret med fingrarna och på en minut säga varför till axelkompisen med ämnets ord.", roll: "Att ställa minst en fråga i veckan ur ett väntat fel, ta samma slags fråga i Starten veckan efter och väva in det du hör.", vidare: "du ställer en fråga ur ett väntat fel och väver in det du hör", fraga: "Ställde du en fråga ur ett väntat fel, och vävde du in det du hörde?" }
    - { vecka: "5", led: Lite mer, rubrik: Eleven bedömer sitt eget, eleverna: "Att vända färgkortet efter vad de kan visa, ringa in var det syns och rätta sitt eget i annan färg.", roll: "Att gå till dem du skrev upp, sedan till rött, fråga ”Hur vet du?” vid grönt och räkna hur många med grönt som har fel.", vidare: "eleverna vänder kortet själva, och grönt stämmer oftare på den nya frågan", fraga: "Vänder eleverna kortet själva, och stämmer grönt oftare på den nya frågan?" }
uppfoljning:
  text: Du ser om metoden fungerar i det eleverna visar, på lapparna och i det du ändrade.
  rader:
    - { id: lektionen, nar: Varje lektion, tid: varje lektion, vad: "Det alla visade säger vad du gör nu. De dagar du har lappar säger högarna vad nästa lektion börjar med." }
    - { id: klassen, nar: Klassens svar varje vecka, tid: varje vecka, vad: "Räkna hur många som har rätt på den andra visningen och på samma slags fråga en vecka senare." }
    - { id: lararen, nar: Dina kryss varje vecka, tid: varje vecka, vad: "Räkna hur ofta kärnans fyra delar fanns, och vilken som föll bort. Ett kryss på din planering räcker." }
    - { id: observationerna, nar: "Vecka 2 och 4", tid: vecka 2 och 4, vad: "Specialläraren ser dig ställa en fråga och läser lapparna i vecka 2, och en kollega eller rektor ser hela varvet i vecka 4. Tio minuter räcker." }
    - { id: arbetslaget-fore, nar: Före första lektionen, tid: före, vad: "På arbetslagets första möte skriver ni varsitt fel som en mening, bestämmer signalen och bokar besöken och de fyra mötena efter vecka 5." }
    - { id: arbetslaget-efter, nar: Vecka 5, tid: vecka 5, vad: "I slutet av vecka 5 ses ni igen och bestämmer hur ni fortsätter." }
    - { id: stodet, nar: Varje månad, tid: efter, vad: "Ni ses fyra gånger efter de första veckorna, med frågorna från mötet i vecka 5, och var och en skriver vad hen prövar. Elever som har samma fel kvar får stödundervisning, med lapparna som underlag." }
    - { id: sexveckor, nar: Sex skolveckor efter vecka 5, tid: efter 6 veckor, vad: "Räkna samma saker som varje vecka, och be en kollega se vad du ändrar efter en fråga. Går inte besöket, berätta om frågan, talet och vad du gjorde. Efter ett lov börjar du om med tummen en vecka." }
    - { id: nastatermin, nar: Nästa termin, tid: efter 16 veckor, vad: "Räkna igen, be en kollega se dig fråga och se om ni använder metoden i fler ämnen. Sedan frågar ni ”Vad ändrade du efter det eleverna visade?” på arbetslagets vanliga möten." }
    - { id: osaker, nar: Om du är osäker på metoden, tid: villkor, vad: "Står skattningen ”Hur säker är jag på metoden?” under 5 i två veckor i rad, gör om veckan och be en kollega se dig fråga." }
    - { id: klassenstar, nar: Om det inte fungerar, tid: villkor, vad: "Står skattningen ”Hur väl fungerar den i praktiken?” under 5 i två veckor i rad, gå tillbaka till tummen och be specialläraren se en lektion." }
checklista:
  rubrik: Före första lektionen
  punkter:
    - Läs lathundens sida 1–⁠2 och lektionskortet, och se huvudfilmen. Under vecka 1 läser du Metoden, Lagret och Kom igång.
    - Välj den klass och det ämne där du redan vet vilka fel eleverna gör.
    - Välj vad du gör mindre av, till exempel en övning, så att du hinner stanna.
    - Skriv ett vanligt fel som en mening till varje lektion vecka 1. Ta gärna ett ur Frågor att låna i Kom igång.
    - "Skriv gärna ut: vecka 1 affischen Så visar vi, vecka 2 exit-lappar, vecka 5 färgkort. Vecka 3: miniwhiteboards."
    - Boka besöken i vecka 2 och 4, ett av dem med specialläraren.
    - "Bestäm signalen med arbetslaget. Börjar du ensam är signalen ”1, 2, 3, visa!”"
    - Läs under Första lektionen vad du säger till klassen.
klassen:
  rubrik: Så ordnar du klassen
  text: Du ser alla, och alla kan visa mot dig utan att vända sig om. Var och en har en axelkompis att prata med. Eleverna vänder miniwhiteboarden och handen mot dig, så att de jämför sig mindre med varandra. Den som behöver stöd sitter först på din bana genom rummet. Den som är ny i svenska sitter bredvid någon som har samma språk eller gärna hjälper.
forsta:
  rubrik: Första lektionen
  text:
    - "Du håller din egen lektion och lägger till ett påstående. Du säger: ”Jag behöver veta vad ni har förstått, så att jag vet vad jag ska göra härnäst. Det är inget prov. Fel svar hjälper mig mest.” När du stannar övar ni rutinen Tänk och visa."
    - "Sedan tar du ett påstående om dagens innehåll: ett fel elever brukar göra, skrivet som en mening, och ibland något sant. Är klassen delad säger du inte svaret än. Paren säger varför, alla visar igen, och först då säger du vad som stämmer."
    - "Så kan tre rader se ut. Frågan: Det är regeringen som stiftar Sveriges lagar. Felet: blandar stifta och styra. Om många har fel: paren säger varför, alla visar igen, och jag ritar två kolumner."
  plan:
    amne: Samhällskunskap
    klass: 7B
    datum: mån 9/11
    lektion: "1"
    mal: förklara vad riksdagen och regeringen gör
    belagg: "tummen på påståendet"
    blad: "inget, bara händerna"
    forberett: "påståendet på tavlan, till den som behöver läsa det"
    fore: { fragan: "Det är regeringen som stiftar Sveriges lagar.", svaret: "falskt, riksdagen stiftar", felet: "blandar stifta och styra", nya: "samma, eller en ny om jag har visat" }
    delar:
      - { fas: Starten, text: "Inget än. Starten kommer i vecka 2" }
      - { fas: Din planering, text: "Min genomgång om riksdag och regering" }
      - { fas: Alla visar, text: "Först på något alla kan. Sedan: Det är regeringen som stiftar Sveriges lagar" }
      - { fas: Beslutet, text: "Uppgiften om lagens väg" }
      - { fas: Exit-lappen, text: "Ingen än. Lappen kommer i vecka 2" }
    beslut: { elever: 28, deFlesta: "två kolumner, stifta och styra", halften: "en lag från förslag till beslut, på tavlan" }
rutiner:
  rubrik: Rutinerna klassen lär sig
  rader:
    - namn: Tänk och visa
      vecka: 1
      vad: "Tanken är att du ser hela klassen på en gång och varje elev tar ställning innan någon annan har svarat. Det kallas multisvar. Tumme upp betyder att eleven håller med, stopphand att hen inte håller med och vickande hand att hen är osäker. Från vecka 4 visar eleverna svarets nummer med fingrarna och handen mot bröstet. I idrott, bild, musik och slöjd kan de visa med kroppen, i ett hörn eller i sitt arbete. Stegen står på affischen Så visar vi."
      steg: ["Lyssna på påståendet, och tänk tyst med händerna på bänken.", "”1, 2, 3, visa!” Visa mot läraren, och håll handen stilla.", "Ser läraren olika svar, säg till din kompis varför. Har ni olika svar, övertyga varandra. Har ni samma, hur tänkte den som valde något annat?", "”1, 2, 3, visa!” igen. Lyssna på vad som stämmer, och tänk: vad ändrar jag?"]
      forsta: "Öva på något lätt där inget står på spel, och gör om tills signalen och visningen går på 15 sekunder. Visa sedan parsamtalet med en elev: ”Jag tror … eftersom …” Båda säger något, en i taget. Ta ibland ett sant påstående om samma sak, eftersom svaret annars går att gissa."
    - namn: Säg instruktionen
      vecka: 2
      vad: "Tanken är att eleverna blir resurser för varandra och kommer igång själva, och att du hör vad som gick fram innan de börjar. Efter en instruktion säger eleverna till sin axelkompis vad de ska göra och i vilken ordning. Det tar en halv minut och kräver ingen förberedelse."
      steg: ["Lyssna på instruktionen.", "Säg till din kompis vad ni ska göra och i vilken ordning.", "Lyssna på kompisen, och lägg till det som fattas.", "Vet ni inte, fråga ett annat par. Börja sedan."]
      forsta: "Visa rutinen med en elev, och säg ett steg fel med flit, så att klassen ser att kompisen får rätta. Säg vem som börjar, och byt nästa gång. Gå runt och lyssna. Saknar flera samma steg, säg det en gång till, och skriv stegen på tavlan."
    - namn: Exit-lappen
      vecka: 2
      vad: "Tanken är att du vet före nästa lektion var klassen står, och att eleven hämtar det viktigaste ur minnet, säger det och gör svaret bättre. Ta exit-lappen när Säg instruktionen sitter, de dagar du hinner läsa svaren och ändra nästa lektion. En eller två gånger i veckan räcker. Möter du klassen en gång i veckan, läs lapparna samma dag och skriv direkt hur nästa lektion börjar. Ibland ställer du i stället tre andra frågor: Vad tycker du var det viktigaste du lärde dig? Vad var svårast eller mest förvirrande? Vad har du för frågor kvar? Då ser du hur lektionen kändes, men mindre av vad eleverna kan."
      steg: ["Stäng boken. Läs frågan på tavlan.", "Skriv ett svar och ett skäl på två minuter. Inget betyg.", "Säg det till din kompis. Ändra i annan färg om du vill.", "Skriv ditt namn, och lämna lappen när tiden är slut. En elev per bord samlar in."]
      forsta: "Tänk högt om en påhittad lapp på tavlan: vilken hög hör den till? Spara ett felsvar, utan namn, till Starten. Nästa lektion börjar du med: ”Ni skrev, så jag ändrade.” Då förstår klassen vad lappen är till för. Den första Starten är ett nytt påstående med tummen."
    - namn: Miniwhiteboarden
      vecka: 3
      vad: Tanken är att du ser stegen och var det blev fel, och att eleven visar hur hen tänkte och kan sudda och pröva igen. Den passar till svar som är en uträkning, en mening eller en skiss. Miniwhiteboard och penna ligger i en låda på varje bord, och du har extra pennor.
      steg: ["Skriv stort. Vet du inte, skriv ett frågetecken.", "Håll den nere.", "”1, 2, 3, visa!” Håll den stilla mot läraren.", "Titta på det rätta, och ändra ditt svar. Sudda, stapla och lägg tillbaka pennorna."]
      forsta: "Låt alla rita fritt en minut, så blir det inte lika lockande nästa gång. Öva med en vanlig uppgift, tills miniwhiteboarden är framme på 15 sekunder. Har ni inga än, ta fingrar, papper eller A4 i plastfickor. Den som inte är klar visar det hen har."
    - namn: Färgkortet
      vecka: 5
      vad: "Tanken är att eleven tar ställning till sitt eget lärande, och att du ser var du behövs. Utgå från felet du letar efter, och säg först vad som ska synas i arbetet: ”Grönt i dag: du kan visa var du dividerade täljaren och nämnaren med samma tal, och säga varför.” Medan eleverna arbetar står kortet på bänken med färgen mot dig: grönt om eleven kan visa och förklara, gult om hen är på väg och rött om hen har fastnat. Färgen säger vad eleven tror, så kompisen och du prövar den med ”Hur vet du?”, och du ställer en ny fråga. Visar många rött: stanna, och låt alla visa sitt svar."
      steg: ["Vänd kortet efter det du kan visa.", "Grönt: ring in eller visa var det syns. Hittar du inget, gör det som fattas eller vänd till gult.", "Visa din kompis. Kompisen frågar: ”Hur vet du?” Rött: fråga din kompis, sedan ett annat par, och arbeta vidare med det du kan.", "Läraren ställer en ny fråga. Stämde din färg? Säg till kompisen: ”Jag såg … Därför …” Vänd kortet igen."]
      forsta: "Öva på något klassen kan, och säg: ”Gult är ett bra svar. Då vet jag var jag behövs. Färgen gäller just nu och är inget betyg.” Tänk högt om ett påhittat arbete: ”Jag satte grönt, men jag hittar inte var det syns. Då är det gult.” Ta färgkortet när du hinner gå runt, eftersom eleven med rött annars bara blir frustrerad. Vill eleven inte att klassen ser färgen, kan hen ha kortet i knät, vänt mot dig."
    - namn: Rätta själv
      vecka: 5
      vad: Tanken är att eleven använder återkopplingen och tänker om själv, och att du skriver färre kommentarer. Eleven får tid i lektionen att hitta sitt fel och rätta det i annan färg. Ta rutinen när färgkortet sitter, eller när klassen har lämnat ett arbete.
      steg: ["Titta på det rätta på tavlan.", "Hitta ditt fel och rätta i annan färg.", "Säg till din kompis vad du ändrade: ”Jag såg … Därför …”", "Gör en ny uppgift av samma slag."]
      forsta: "Rätta ett påhittat arbete högt, och säg att det rätta kommer på tavlan och varför eleverna rättar själva. Börja med en uppgift som går att rätta på några minuter."
larandet:
  rubrik: Så syns lärandet i klassen
  omraden:
    - { omrade: amneskunskaper, syns: "På den nya frågan har fler rätt än på den första, och i Starten eller på lappen veckan efter klarar eleverna samma slags fråga." }
    - { omrade: kommunikation, syns: "Eleverna säger till axelkompisen hur de tänkte, och förklarar sitt svar med egna ord när du frågar." }
    - { omrade: sprak, syns: "Eleverna använder ämnets ord när de förklarar, också när du lyssnar på paren." }
uppdrag:
  rubrik: Till arbetslaget
  text: "Välj ut ett grepp tillsammans, planera hur ni vill pröva det, gör det i era egna klassrum och kom tillbaka och prata om vad ni såg. Det är när ni jämför era erfarenheter som metoden sätter sig på riktigt. Den som har prövat ett grepp tre gånger med en klass har alltid något att berätta. Ni har två möten på en timme var och två korta besök de första veckorna, och sedan fortsätter ni enligt uppföljningen."
  forbered:
    text: Läs lathundens sida 1 och 2, och tänk igenom frågorna före mötet. På mötet väljer ni vilket grepp ni börjar med, skriver varsitt fel som en mening, bestämmer signalen och bokar besöken och de fyra mötena efter vecka 5.
    fragor:
      - När visste du senast, mitt i en lektion, vad alla elever hade förstått?
      - Vilket fel ser du varje år i det du undervisar om nu?
      - Vad gjorde du sist när svaren inte var de du väntade dig?
      - "Titta på huvudfilmen: vad gör läraren direkt efter att alla har visat?"
  planera: "Planera för fel: välj ett moment, och fråga er var eleverna gör fel, varför och vad ni gör åt det. Var och en skriver tre rader på sin planering inför nästa lektion."
  genomfor: Pröva varje grepp flera gånger med en klass innan du lägger till nästa. Lappen har du bara en eller två gånger i veckan, så den får två veckor och fortsätter när miniwhiteboarden kommer. Följ Lär dig metoden på metodens sida.
  reflektera: ["Vad såg du som du inte hade sett med handuppräckning?", "När ändrade du något, och vad?", "Vilken fråga sa mest, och vilken sa inget?", "Märkte eleverna att deras svar ändrade lektionen, och stämde färgen med svaret på den nya frågan?", "Vilket fel såg du, och vad hjälpte? Spara det till nästa år."]

