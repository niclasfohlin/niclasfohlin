passar:
  rubrik: När passar metoden?
  kort: "du vill veta vad eleverna har förstått medan du kan göra något åt det, med vilket innehåll som helst."
  rader:
    - { fraga: "Vad vill du veta?", metoden: "Vad klassen har förstått just nu, medan du kan ändra nästa steg.", annat: "Vad var och en kan efter ett arbetsområde. Då behövs en enskild bedömning, som ett prov, och den kan du också använda formativt efteråt." }
    - { fraga: "Kan svaret ändra det du gör?", metoden: "Du vet vad du gör vid varje utfall.", annat: "Du går vidare vad svaren än blir. Ställ då inte frågan." }
    - { fraga: "Är innehållet helt nytt?", metoden: "Du har redan en genomgång, och greppen visar om den gick fram.", annat: "Du behöver bygga lektionen steg för steg. Då passar explicit undervisning, och en fråga som säger något kan stå i den." }
    - { fraga: "Ska eleverna samarbeta?", metoden: "Parsamtalet är kort, och du lyssnar efter hur de tänker.", annat: "Eleverna ska lära genom samarbete, med gemensamma mål och eget ansvar. Då passar kooperativt lärande, och du kan lyssna på samma sätt." }
    - { fraga: "Gäller det hela klassen?", metoden: "I stunden tar du ett beslut för klassen eller för några.", annat: "En elev står kvar i samma fel vecka efter vecka. Då behöver hen stödundervisning, med lapparna som underlag." }
  tumregel: Fråga när svaret kan ändra vad du gör härnäst. Metoden går ihop med de andra metoderna, och tabellen är ett stöd för tanken och ingen regel.
  metoder: [explicit-undervisning, kooperativt-larande]

invandningar:
  rubrik: Invändningar och nyanser
  fragor:
    - { fraga: "Är det inte bara prov?", svar: "Nej. Ett prov eller en lapp blir formativt när någon använder resultatet för att ändra undervisningen eller lärandet (Black och Wiliam, 1998). Det mesta gör du medan du undervisar: en fråga, alla visar, och du väljer nästa steg. Det eleverna visar blir inget betyg." }
    - { fraga: "Är det inte bara det vi redan gör?", svar: "Delvis. I England sa 31 av 40 ansvariga lärare att arbetssättet liknade det skolan redan gjorde, och på några skolor blev det en ny rättningspolicy (Speckesser m.fl., 2018). I Sverige samlade 38 matematiklärare sällan in svar från alla (Andersson m.fl., 2017). Metoden lägger till att alla svarar samtidigt, och att nästa steg följer det du såg. Det är ingen garanti: i svensk åk 7 samlade lärarna oftare in svar från alla och ändrade oftare, men det gav ingen skillnad (Boström och Palm, 2023)." }
    - { fraga: "Stämmer de stora effekttalen?", svar: "De som brukar nämnas kan du inte räkna med. Talen 0,4–0,7 kommer ur en berättande översikt (Black och Wiliam, 1998), och en senare genomgång av 13 studier gav omkring 0,20 (Kingston och Nash, 2011). Sammanställningar med jämförelsegrupp ger 0,19–0,26 (Xuan m.fl., 2022; Klute m.fl., 2017), och ett försök i 140 engelska skolor 0,09 (Anders m.fl., 2022). Effekten är måttlig, och den beror på hur du använder metoden." }
    - { fraga: "Är det inte bara explicit undervisning med miniwhiteboards?", svar: "Båda metoderna låter alla visa samtidigt, och de går bra ihop. Explicit undervisning är ett förlopp för hela lektionen, och för många fel betyder att du visar igen. Det här är ett lager över din egen planering, som ett samtal, en text eller en laboration, och det fortsätter till nästa lektion. Du skriver frågan så att felsvaren säger något, och beslutet har flera vägar, till exempel att eleverna övertygar varandra." }
grund:
  rubrik: Det forskningen visar
  text:
    - "Forskningen om formativ bedömning ger en måttlig effekt. I ett urval efter strikta krav är effekten 0,26 i 19 studier. De flesta gäller åk 1–⁠6, och över hälften gäller elevgrupper med specialundervisning eller låga resultat (Klute m.fl., 2017). En större metaanalys över grund- och gymnasieskolan ger 0,25 (Yao m.fl., 2024), och 48 studier i läsning 0,19 (Xuan m.fl., 2022). I skrivning ger återkoppling på texten mer än att läraren bara följer elevernas framsteg (Graham m.fl., 2015)."
    - "I stora försök i vanliga skolor blir effekten mindre och resultaten mer blandade. I 140 engelska skolor med 25 393 elever gav hela arbetssättet 0,09 på nationella prov, och skillnaden var inte säker. Lärarna valde greppen själva (Anders m.fl., 2022). I 97 engelska skolor svarade alla på digitala svarsdosor, och det gav ingen skillnad i läsning eller matematik. Rapporten visar inte hur mycket lärarna ändrade undervisningen (Wiggins m.fl., 2017). I NO för 9–10-åringar i 121 engelska skolor gav metoden 0,17 på ett oberoende prov (Mujtaba m.fl., 2022)."
    - "I svensk matematik står två försök bredvid varandra. I åk 4 gav en fortbildning med 144 mötestimmar 0,66, räknat på klassernas medelvärden och på ett prov som forskarna hade gjort (Andersson och Palm, 2017). I åk 7, med samma upplägg och 96 mötestimmar, blev det ingen skillnad, fast lärarna samlade in svar från alla oftare och ändrade oftare. Lärarna lade till 3–19 nya aktiviteter, och antalet hängde inte säkert ihop med resultaten. Författarna förklarar det med att en del lärare mest ställde frågor om baskunskaper, att bara hälften använde miniwhiteboards varje dag och ändrade direkt och att eleverna hade en liten roll. Förklaringen är inte prövad (Boström och Palm, 2023)."
    - "Mycket talar för att kopplingen mellan det eleverna visar och det läraren gör sedan spelar roll, men den är inte prövad för sig. Jämför man studier i läsning, gav metoden 0,24 när läraren anpassade undervisningen och 0,05 utan, men nästan alla studier med anpassning hade också fortbildning (Xuan m.fl., 2022). I fysik på schweiziska gymnasier fick en del lärare en dags fortbildning och ett paket till fyra av fjorton lektioner. Andra ställde samma frågor och valde själva vad de gjorde med svaren. Mot dem gav paketet 0,37 på ett begreppsprov, och effekten stod kvar efter tre månader. Frågorna ensamma gav ingen säker skillnad mot vanlig undervisning, och på ett räkneprov fann försöket ingen säker skillnad. I paketet ingick också kamratsamtal och elevens egen uppföljning (Lichtenberger m.fl., 2025). I små studier deltar eleverna mer när alla visar samtidigt (Marsh m.fl., 2023)."
    - "Eleverna kan göra en del av jobbet. I läsning gav lärare och elever tillsammans mer än läraren ensam (Xuan m.fl., 2022). I matematik i åk 5–⁠6 fick eleven fem minuter sist i lektionen att skriva vad hen hade lärt sig, prata med en kamrat och skriva om. Det gav 0,49, utan att lärarna ändrade något (Klute m.fl., 2017). I matematik gav Klutes urval 0,36, till stor del med självbedömning (Klute m.fl., 2017). I läsning gav studier med bara självbedömning 0,36 mot 0,24 när läraren anpassade undervisningen, en skillnad som inte är säker (Xuan m.fl., 2022). Elevstyrda grepp i läsning gav däremot −0,15 i två små studier (Klute m.fl., 2017)."
    - "Mycket är inte studerat. Klutes urval har inga studier i NO eller SO (Klute m.fl., 2017). SO är knappt studerat och teknik inte alls. I vårt urval har ingen studie med jämförelsegrupp mätt det sociala, och ingen har prövat hur ofta metoden behövs eller om kortare varv ger mer."
