    - Planera första lektionen i planeringsmallen.
    - Skriv ut lektionskortet, och sätt upp lektionens delar, affischen Så visar du och bladet Stegen.
    - Lägg miniwhiteboards eller A4 i plastfickor, pennor, sudd, exit-lappar och uppgifterna till Du gör i en back per rad.
    - "Ordna rummet: alla ser tavlan, du når varje bänk, och ett bord står fritt."
    - Boka specialläraren i vecka 2 och en kollega i vecka 4.
