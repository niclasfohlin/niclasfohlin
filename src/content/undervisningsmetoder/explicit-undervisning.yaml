    - { fas: Kontrollera, skriv: "Två nya uppgifter där felet kan synas.", not: "Rätt är båda med alla steg. Räkna eleverna med fel.", hojd: 0.7 }
    - { fas: Du gör, skriv: "Uppgifterna · De fyra som alla gör · Till den som är klar", hojd: 0.8 }
    - { fas: Avslut, not: "Exit-lappens uppgift står överst, i Så ser jag att de kan.", hojd: 0.5 }
  beslut: { nastanAlla: "Vid bordet:", deFlesta: "Varvet och ny kontroll:", halften: "Det nya exemplet:" }
  efter:
    text: "Fyll i när lapparna är sorterade i kan, nästan och inte än."
    kontrollen: "Kontrollen: ___ med fel"
    hogar: "Exit-lapparna: Kan   Nästan   Inte än"
    sag: "Det jag såg, med elevernas tal eller ord"
    nasta: "Nästa lektion: två snabba"
    forst: "I Vi gör går jag först till"
