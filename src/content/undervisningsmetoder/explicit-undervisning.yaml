tidsschema:
  rubrik: En lektion på 40 minuter
  rader:
    - { tid: Före lektionen, fas: Före lektionen, vad: "Dela upp det nya i steg, bestäm orden och formen eleverna skriver stegen i, och välj exemplen, kontrollens uppgifter och exit-lappen." }
    - { tid: 0–⁠6 min, fas: Start, form: Gemensamt, vad: "Två snabba på det lektionen bygger på, och målet i en mening, med varför det är bra att kunna." }
    - { tid: 6–⁠12 min, fas: Jag gör, form: Läraren visar, vad: "Du visar ett steg, och alla skriver det på miniwhiteboarden direkt. Sedan nästa steg. Sist ett helt exempel och ett felaktigt svar." }
    - { tid: 12–⁠22 min, fas: Vi gör, form: Gemensamt, vad: "Många korta uppgifter i rask takt. Alla prövar och visar stegen, och du går mellan tavlan och deras arbete tills nästan alla kan." }
    - { tid: 22–⁠26 min, fas: Kontrollera, form: Enskilt, vad: "Alla gör två uppgifter själva och visar stegen, och du räknar eleverna med fel." }
    - { tid: 26–⁠35 min, fas: Du gör, form: Enskilt, vad: "Samma sorts uppgifter tills det går rätt och säkert. Var och en skriver sina steg, själv och från vecka 4 i par." }
    - { tid: 35–⁠40 min, fas: Avslut, form: Gemensamt, vad: "Tillbaka till målet: klassen säger stegen tillsammans. Sedan visar alla vad de kan nu, på exit-lappen." }
    - { tid: Efter lektionen, fas: Efter lektionen, vad: "Sortera exit-lapparna i tre högar: kan (rätt med stegen), nästan (rätt steg med ett räknefel, eller rätt svar utan steg) och inte än (fel steg). Högarna avgör nästa lektions två snabba och vem du går till först i Vi gör." }
  varianter:
    - nar: första lektionen
      text: "Starten blir signalen och miniwhiteboarden på något alla kan, och Jag gör visar något lätt."
      delar:
        - { fas: Start, tid: 0–⁠10 min }
        - { fas: Jag gör, tid: 10–⁠14 min }
        - { fas: Vi gör, tid: 14–⁠23 min }
        - { fas: Kontrollera, tid: 23–⁠26 min }
        - { fas: Du gör, tid: 26–⁠35 min }
        - { fas: Avslut, tid: 35–⁠40 min }
    - nar: en lektion på 60 minuter
      text: Vi gör och Du gör blir längre.
      delar:
        - { fas: Start, tid: 0–⁠7 min }
        - { fas: Jag gör, tid: 7–⁠15 min }
        - { fas: Vi gör, tid: 15–⁠30 min }
        - { fas: Kontrollera, tid: 30–⁠34 min }
        - { fas: Du gör, tid: 34–⁠55 min }
        - { fas: Avslut, tid: 55–⁠60 min }
  efter: "Tiderna är ungefärliga. På lågstadiet kan en lektion rymma två korta varv av Jag gör, Vi gör, kontrollen och Du gör i stället för ett långt. Att gå tillbaka en del när eleverna behöver det är också att följa metoden."
steg:
  # Varje del i kompendiets form (Niclas kompendium om formativa metoder, 2026-10-29): det alla elever visar, det du
  # tittar efter och beslutet, och sedan det du gör i ordning, med det du säger. Fraserna står kvar för kortet och planen.
  rader:
    - namn: Start
      fraga: "Vad bygger lektionen på?"
      alla: Svaren på två snabba uppgifter, på signalen.
      titta: Kan alla det som det nya bygger på?
      beslut: "Fler än en av fem med fel: visa det igen innan det nya. Annars Jag gör."
      gor:
        - "Två snabba uppgifter med det som det nya bygger på, som 40 + 30 före plus med tiotal: ”Två snabba. 1, 2, 3, visa!”"
        - Säg målet i en mening, och varför det är bra att kunna.
      fraser: ["Två snabba. 1, 2, 3, visa!"]
    - namn: Jag gör
      fraga: "Vilket är nästa lilla steg?"
      alla: Varje steg på miniwhiteboarden, direkt efter att du har visat det.
      titta: Skriver alla steget, med samma ord?
      beslut: "Nästa steg när alla har skrivit. Tappar många ett steg: visa det igen."
      gor:
        - "Säg stegets ord, gör steget vid tavlan och tänk högt, med ett enkelt exempel som följer stegen: ”Min tur. Först tiotalen …”"
        - Alla skriver steget innan du visar nästa.
        - "Sist ett helt exempel och ett fel med stegen: ”Här har någon räknat så. I vilket steg blev det fel? Visa med fingrarna.”"
      fraser: ["Min tur.", "Först tiotalen …", "I vilket steg blev det fel? Visa med fingrarna."]
    - namn: Vi gör
      fraga: "Kan alla göra steget med mig?"
      alla: Alla steg på signalen. Den som har fel rättar sitt steg.
      titta: Steget där felet brukar sitta, hos alla.
      beslut: "Enstaka fel eller frågetecken: gå dit medan nästa uppgift står uppe. Tre med samma fel: stanna klassen och visa igen. Nästan alla rätt: kontrollen."
      gor:
        - "Många korta uppgifter, de första ett steg i taget och sedan hela: ”Tillsammans. Vad gör vi först?”"
        - "Alla skriver och visar: ”Skriv. Vänd. 1, 2, 3, visa!”"
        - Läs miniwhiteboards, be en elev du inte har hört säga sitt steg, och skriv det rätta steget på tavlan.
        - Gå till en eller två medan nästa uppgift står uppe, och tillbaka till tavlan.
      fraser: ["Tillsammans. Vad gör vi först?", "Skriv. Vänd. 1, 2, 3, visa!"]
    - namn: Kontrollera
      fraga: "Kan de det här nu?"
      alla: Båda uppgifterna med alla steg, var och en själv.
      titta: "Kan de det här nu? Rätt är båda med alla steg, och ett frågetecken är fel."
      beslut: "Ett av tre utfall, nedan: Du gör, ett varv till eller Jag gör igen."
      gor:
        - "Två uppgifter som alla gör själva: ”Din tur. Gör de här två. Visa när jag säger till.”"
        - "Läs bänkrad för bänkrad: först svaret, sedan att alla steg står där. Sätt ett streck för varje elev med fel."
        - Visa facit med stegen, och gör det utfallet säger.
      fraser: ["Din tur. Gör de här två. Visa när jag säger till."]
      redo:
        nastanAlla: "Högst 5 av 28 med fel. Du gör, och de med fel börjar vid bordet med dig."
        deFlesta: "6–13 av 28 med fel. Ett kort varv till med hela klassen och ett nytt exempel, och sedan en ny kontroll. Tiden tas från Du gör."
        halften: "14 eller fler med fel. Jag gör igen med ett nytt exempel, och Vi gör till avslutet. Ingen Du gör i dag."
        tiden: "Ingen tid till en ny kontroll, eller fler än 5 av 28 med fel också i den: Vi gör till avslutet, exit-lappen, och nästa lektion börjar med samma steg."
    - namn: Du gör
      vem: själv, i par från vecka 4
      fraga: "Sitter det?"
      alla: Sina steg på varje uppgift. I par från vecka 4 säger den ena stegen, och den andra följer med.
      titta: Uppgift 2 och 3 hos alla. Stanna bara vid fel, högst en halv minut.
      beslut: "Fel i ett steg: min tur, tillsammans, din tur. Samma fel hos tre: samla dem vid bordet."
      gor:
        - "Uppgift 1 med hela klassen vid tavlan: ”Gör 2, 3 och 4. Jag kommer och tittar.”"
        - Bordet, med dem som hade fel i kontrollen. Titta på vägen dit till dem som brukar ha svårt att komma igång.
        - Sedan en runda bland bänkarna. Alla gör de fyra första.
      fraser: ["Gör 2, 3 och 4. Jag kommer och tittar."]
    - namn: Avslut
      fraga: "Vad kan klassen nu?"
      alla: En uppgift på exit-lappen, med stegen.
      titta: Kan klassen säga stegen? Står stegen med på lappen, eller bara svaret?
      beslut: Lapparna sorterar du efter lektionen.
      gor:
        - "Miniwhiteboards i backen. Tillbaka till målet: klassen säger stegen tillsammans."
        - "En uppgift av samma sort på exit-lappen: ”Skriv stegen på lappen.”"
      fraser: ["Skriv stegen på lappen."]
fastnar:
  rubrik: Så rättar du
  text: När en elev svarar fel rättar du direkt, vid tavlan eller vid bänken, medan uppgiften pågår. Säg först vad som stämmer, och sedan vad som ska rättas.
  trappa:
    - "Säg vad som stämmer, och visa det rätta: ”Tiotalen stämmer. Min tur. Entalen: 7 plus 8 är 15.”"
    - "Gör det tillsammans med eleven: ”Tillsammans.”"
    - "Låt eleven göra det själv: ”Din tur.”"
    - Kom tillbaka till samma slags uppgift en stund senare och se att det sitter.
  motto: Rättningen går fort, sker vänligt och utan att lektionen stannar. Eleven får öva det rätta i stället för att bära med sig det felaktiga.
stod:
  rubrik: Elever som behöver mer stöd
  rader:
    - { nar: Den som är ny i svenska, metoden: "Samma ord varje gång, exemplen på tavlan visar det orden säger, och på miniwhiteboarden kan hen svara med ett tal, en bild eller ett ord i samma uppgift som de andra.", du: "Bladet Stegen med en bild vid varje steg, före lektionen, med dig eller studiehandledaren. Uppgiften i skrift på tavlan innan du säger den, och stegen till grannen först. En ram när hen förklarar: Först … Sedan … Sist …" }
    - { nar: När många behöver hjälp samtidigt, metoden: "Kontrollen visar det.", du: "Ett varv till med hela klassen i stället för att hjälpa en i taget. Ingen väntar, eftersom alla gör varvet." }
    - { nar: Den som har fel i kontrollen, metoden: "Bordet, där du visar steget igen och eleven gör det rätta själv.", du: "Konkret material vid bordet, som tiotalsstavar och entalskuber, och färre uppgifter med samma steg." }
    - { nar: Den som har svårt att hålla uppmärksamheten, metoden: "Högt tempo, korta uppgifter och många tillfällen att svara.", du: "En plats nära tavlan, där du går förbi ofta. Börja med en mycket lätt fråga när miniwhiteboards ska upp, så ser du om hen är med. Låt hen flytta pilen på lektionens delar." }
    - { nar: "Den som har varit borta, eller sitter vid bordet tre lektioner i rad", metoden: "Exit-lapparna visar det tidigt.", du: "Stegen och första exemplet före nästa lektion. Sitter hen vid bordet igen: läs hens exit-lappar med specialläraren, och efter tre veckor med elevhälsan." }
    - { nar: Den som redan kan, metoden: "Du gör har samma steg.", du: "En svårare uppgift med samma steg, eller byt ett tal och fråga vad som händer. Den som är klar skriver en uppgift till grannen." }

karna:
  rubrik: "Kärnan: fast och fritt"
  text: Kärnan är de fyra korten i del 1. Här står vad forskningen säger om var och en, vad som måste stå kvar och vad du får ändra. Allt annat i metoden, som minuterna och exemplen, är förslag.
  # Rörelsen i Metoden i korthet, som Grundmetodiken i Niclas kompendium om formativa metoder (2026-10-29, helheten).
  grundregel: De fyra är kärnan, och den håller du fast vid. Minuterna, exemplen och formerna får du ändra, och del 4 säger hur.
  varv: Från tavlan till elevernas arbete och tillbaka, varv efter varv, tills nästan alla kan.
  komponenter:
    - namn: Visa ett steg i taget
      moment: [Jag gör]
      vad: Du visar det nya ett steg i taget, med samma ord varje gång, och säger högt hur du tänker.
      syns: Eleverna prövar varje steg direkt efter att läraren har visat det, med stegens ord.
      raknas: false
      varfor: "Arbetsminnet är litet, och för den som är ny i ett innehåll tar varje steg plats. Utan små steg gissar eleverna och bygger egna regler. I 42 av 43 studier i matematik byggdes det nya upp steg för steg (Fuchs m.fl., 2021), men ingen har prövat små steg för sig (Hughes m.fl., 2017)."
      belagg: i-alla
      kallor: [fuchs-m-fl-2021, hughes-m-fl-2017]
      kvar: Du visar ett steg i taget med samma ord, och eleverna prövar varje steg.
      fritt: Antalet steg, exemplen, stegens språk i ett språkämne, och om du visar på tavlan, med material eller med kroppen.
      kryss: Jag visade steg för steg, och alla prövade.
    - namn: Alla prövar och visar hur de tänker
      moment: [Vi gör, Kontrollera]
      vad: Alla gör uppgiften samtidigt och visar hur de gjorde, och du ser allas svar innan du går vidare.
      syns: Varje elev visar på lärarens signal sitt svar med stegen, på miniwhiteboarden eller i ord, så att det syns var det blev fel.
      varfor: "Utan svar från alla ser läraren inte vem som har tappat, och de andra övar inte. Resultaten och arbetsron blir bättre när alla svarar samtidigt (MacSuga-Gage och Simonsen, 2015), och för elever i matematiksvårigheter hängde framstegen ihop med hur ofta var och en fick svara (Doabler m.fl., 2019)."
      belagg: provad
      kallor: [macsuga-gage-och-simonsen-2015, doabler-m-fl-2019]
      kvar: Alla elever svarar samtidigt, och du ser varje elevs steg och var det blev fel.
      fritt: Miniwhiteboard, fingrar, en provlapp eller kroppen som stannar i ett steg, och kör för korta svar.
      kryss: Alla visade stegen samtidigt, och jag såg dem.
    - namn: Återkoppling på plats
      moment: [Vi gör, Du gör]
      vad: Du går till elevernas arbete och svarar på det du ser, och eleven gör det rätta själv innan ni går vidare.
      syns: Den som visade fel gör samma slags uppgift rätt en stund senare, efter att läraren har varit hos hen eller visat igen för klassen.
      varfor: "Den som övar på ett felaktigt sätt övar in felet, och en rättning efteråt kommer när felet redan är övat. Återkoppling direkt fanns i 42 av 43 studier i matematik, och den hänger så nära ihop med elevernas övning att de inte går att skilja åt (Fuchs m.fl., 2021; Doabler m.fl., 2019)."
      belagg: i-alla
      kallor: [fuchs-m-fl-2021, doabler-m-fl-2019, hughes-m-fl-2017]
      kvar: Du svarar på det du ser medan eleverna arbetar, och eleven gör om det rätt själv.
      fritt: Till hela klassen eller till en elev, i ord eller genom att visa.
      kryss: Jag rättade på plats, och eleven gjorde rätt.
    - namn: Nästan alla kan innan eget arbete
      moment: [Kontrollera]
      vad: Alla gör ett par uppgifter själva och visar, och eget arbete börjar först när nästan alla kan.
      syns: Eleverna löser kontrollens uppgifter själva och visar dem, och läraren räknar dem med fel och följer utfallet innan någon övar på egen hand.
      varfor: "Den som övar själv innan hen kan övar in fel eller väntar på hjälp. Hos de mest framgångsrika lärarna var ungefär åtta av tio svar rätt under den gemensamma övningen, mot sju av tio hos de minst framgångsrika, och det verkar vara den bästa andelen (Rosenshine, 2012)."
      belagg: teori
      kallor: [rosenshine-2012]
      kvar: Du har sett att nästan alla elever kan innan de övar själva.
      fritt: Hur många uppgifter, och om eleverna sedan övar enskilt eller i par.
      kryss: Jag räknade dem med fel och följde utfallet.
lararensFragor:
  rubrik: Lärarens frågor
  fragor:
    - { fraga: "Får jag hoppa över kontrollen när tiden är knapp?", svar: "Nej. Gör Du gör kortare i stället. De mest framgångsrika lärarna lade dubbelt så lång tid på att visa och öva med klassen, och eleverna gjorde färre fel när de övade själva (Rosenshine, 2012).", komponent: Nästan alla kan innan eget arbete }
    - { fraga: "Får jag låta klassen svara i kör?", svar: "Ja, för korta svar, som vad ni gör först, och på din signal. Stegen skriver alla på miniwhiteboarden, eftersom kören inte visar vem som kan. Be också enskilda elever säga sitt steg (Doabler m.fl., 2019).", komponent: Alla prövar och visar hur de tänker }
    - { fraga: "Får jag gå vidare när de flesta kan?", svar: "Nej. Gör det utfallet De flesta säger: ett kort varv till och en ny kontroll. Den som övar själv innan hen kan övar in fel eller väntar på hjälp.", komponent: Nästan alla kan innan eget arbete }
    - { fraga: "Hur hinner jag kursen om vi går vidare först när nästan alla kan?", svar: "Låt exit-lapparna välja nästa lektions start, så att ni inte övar det klassen redan kan. Den som måste förklara länge vid bänkarna har gett den gemensamma övningen för kort tid (Rosenshine, 2012)." }
    - { fraga: "Får jag ge läxa?", svar: "Ja, med samma slags uppgifter som eleven redan gör rätt själv på exit-lappen, med stegen. Då övar läxan det som redan sitter." }
    - { fraga: "Hur hinner jag planera stegen till varje lektion?", svar: "Dela upp arbetsområdet en gång, före första lektionen, och låt varje lektion ta en eller två delar av det. Planera i arbetslaget, och använd huvudexemplet som förlaga." }

amnesexempel:
  # Varje exempel visar hela rörelsen som en kort berättelse i du-form, som ”Så här kan det se ut i klassrummet” i Niclas
  # kompendium om formativa metoder: stegen och felet, hur alla visar, berättelsen med talen och beslutet, och Notera
  # vad som hände (Niclas 2026-10-29: ”hur gick det med att beskriva metoden i olika ämnen på ett lärarnära sätt?”).
  - amne: lasning
    arskurs: åk 1
    innehall: Att läsa ord med det nya ljudet m genom att dra ihop ljuden
    overst:
      egen: "Fingret under. Dra ut ljuden. Säg ordet. Felet: paus mellan ljuden, så att det inte blir ett ord."
      visar: "Fingret under ordet på remsan, paren som läser för varandra, och i kontrollen bildens nummer på fingrarna."
    scen:
      - "Tänk dig en lektion i läsning i åk 1. Klassen har haft s, o, l, a och r, och i dag är m nytt."
      - "Du skriver mos på tavlan. ”Min tur. Fingret under.” Alla sätter fingret under mos på sin remsa. ”Dra ut: mmmooosss.” Alla drar ut med dig. ”Säg ordet: mos.” Sist visar du felet: ”m, o, s. Med paus blir det inget ord.”"
      - "”Tillsammans.” Ni läser mor i kör, med fingret under ordet. Sedan läser paren remsan för varandra, och du går längs bänkraderna och lyssnar. Fem gör paus mellan ljuden i mal. Vid tavlan: ”Min tur: mmmaaalll, mal. Tillsammans. Din tur.” Vid nästa ord lyssnar du först på de fem."
      - "Kontrollen: två nya ord, mosa och mala, och fyra bilder. Alla läser tyst och visar bildens nummer med fingrarna, och de fem som pausade läser orden högt för dig. 24 av 28 visar rätt bild båda gångerna, och de fem läser utan paus. Paren läser remsan för varandra, och de fyra med fel börjar vid bordet med dig."
    notera: "Notera vad som hände. I kören lät det rätt, och pauserna hördes först när var och en läste för sin granne. Bilden visar inte en paus, så de fem läste högt i kontrollen. Med fler än fem fel hade ni läst ett varv till."
  - amne: skrivning
    arskurs: åk 4
    innehall: Dubbelteckning efter kort vokal, som i glass och hatt
    overst:
      egen: "Säg ordet. Kort eller lång vokal: K eller L. Kort, och ett konsonantljud efter: dubbla det. Felet: glas för glass."
      visar: "K eller L före ordet på miniwhiteboarden, som K glass."
    scen:
      - "Tänk dig en lektion i svenska i åk 4. Klassen skriver ofta glas när de menar glass, och du vill se varför."
      - "”Min tur.” Du säger hat och drar ut vokalen: ”Lång vokal, L, ett t.” Sedan hatt: ”Kort vokal, K, dubbla t.” Alla skriver K eller L och ordet efter varje steg."
      - "”Tillsammans.” Ni skriver ful, full, tal och tall. Vid full har sex skrivit L. Du går tillbaka till tavlan och säger ful och full igen, långsamt: ”Hör ni skillnaden? Tillsammans.”"
