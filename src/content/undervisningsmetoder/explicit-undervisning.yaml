invandningar:
  rubrik: Invändningar och nyanser
  fragor:
    - fraga: Är inte explicit undervisning bara katederundervisning?
      svar: "Nej. I en föreläsning lyssnar eleverna. Här svarar de många gånger under genomgången, och du justerar efter svaren. De mest framgångsrika lärarna lade mer tid på genomgången och fyllde den med exempel och med frågor som visade om eleverna förstod (Rosenshine, 2012). Engelmanns program bygger på färdiga manus, och metoden här föreslår inga. Det är principerna som räknas: små steg, svar från alla och en kontroll innan eleverna övar själva."
    - fraga: Ska inte eleverna få upptäcka själva?
      svar: "Viljan att låta eleverna tänka själva är riktig, och metoden slutar just där, när eleverna gör själva. Frågan är när. I NO lärde sig elever i åk 5–⁠6 att göra undersökningar bättre med explicit undervisning än genom att bara undersöka, också i ett ämne de inte kände (Kruit m.fl., 2018). När grunden finns kan gradvis överlämnande passa bättre."
    - fraga: Blir inte alla lektioner likadana?
      svar: "Formen är densamma, och innehållet byts. En gemensam form ger ett gemensamt språk: eleverna vet vad Vi gör betyder, och kollegor som besöker varandra vet vad de ska titta efter. Den som följer delarna utan att titta på eleverna har missat poängen."
    - fraga: Ger metoden effekt i en vanlig skola, eller bara i forskarnas studier?
      svar: "Inte alltid, och inte av sig själv. Av de fyra stora studierna i vanliga klasser med standardiserade prov gav en av dem en säker effekt (Jitendra m.fl., 2019), och de tre andra gav ingen säker skillnad (Clarke m.fl., 2015; Jitendra m.fl., 2015; Torgerson m.fl., 2018). I den stora studien i förskoleklass hängde framstegen ihop med hur ofta eleverna fick svara, och därför följer du upp kärnan varje vecka."

grund:
  rubrik: Det forskningen visar
  text:
    - Den största delen av forskningen om explicit undervisning gäller Engelmanns program Direct Instruction, med färdiga manus, som på svenska också kallas direktinstruktion. I en metaanalys av 328 studier, mest i USA och i F–⁠3, blev effekten 0,54, och den var ungefär lika stor i alla elevgrupper (Stockard m.fl., 2018). Metoden här har inga manus, och metodkortet säger vid Lärande totalt att stödet mest kommer därifrån.
    - I det stränga underlaget, där bara studier med jämförbara grupper och oberoende prov räknas, blir effekterna mindre. I läsning i F–⁠3 gav Engelmanns program 0,10 i tre studier (Slavin m.fl., 2010). Elever i F–⁠6 som behöver stöd i matematik fick explicit undervisning i grupper om två till sex, och i 14 studier gav den 0,31 i allmän matematik. Omedelbar återkoppling fanns i nästan alla studierna (Fuchs m.fl., 2021).
    - I hela klasser är bilden blandad. I en stor studie i 129 förskoleklasser i USA blev skillnaden på ett standardiserat matematikprov 0,108 och inte säker, och den berodde på elevernas förkunskaper (Clarke m.fl., 2015). I åk 7 gav explicit strategiundervisning i en första studie bättre resultat på forskarnas prov men inte på ett standardiserat prov (Jitendra m.fl., 2015). I en andra studie, med 1 492 elever, gav den en säker skillnad också på det standardiserade provet (Jitendra m.fl., 2019). I skrivning gav strategiundervisning efter SRSD ofta stor effekt på textens kvalitet i små studier med forskarnas prov, mest i små grupper i åk 2–⁠6 (Graham, Bollinger m.fl., 2012). Med oberoende prov var effekten 0,22 i två studier i England, och skillnaden var inte säker. Den mindre studien gav stor effekt, och den stora, i 84 skolor, gav ingen effekt (Slavin m.fl., 2019; Torgerson m.fl., 2018).
    - I den stora studien i förskoleklass var det elevernas egna svar som skilde klassrummen åt. Framstegen för eleverna i matematiksvårigheter hängde ihop med hur ofta enskilda elever fick öva och svara, i de bästa klassrummen omkring en gång i minuten (Doabler m.fl., 2019). När alla svarade samtidigt, på små tavlor, kort eller i kör, blev resultaten och arbetsron bättre än när en elev i taget svarade, i små studier där de flesta följde några få elever (MacSuga-Gage och Simonsen, 2015). Att ungefär åtta av tio svar är rätt innan eget arbete kommer ur klassrumsstudier av framgångsrika lärare och är inte prövat för sig (Rosenshine, 2012).
    - I NO fick elever i åk 5–⁠6 explicit undervisning i hur man gör en undersökning, i åtta lektioner. Mot vanlig undervisning gav den 0,66 på ett praktiskt prov och 0,48 när eleverna undersökte ett ämne de inte kände, men ingen säker skillnad på ett skriftligt prov (Kruit m.fl., 2018). Proven var forskarnas egna.
    - I urvalet har ingen studie mätt metoden utan manus i läsning i helklass, och ingen studie med jämförelsegrupp har mätt SO, teknik eller samarbete. Sökningen hittade ingen nordisk studie i helklass.

