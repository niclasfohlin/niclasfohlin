    - { id: observationerna, nar: Vecka 2 och 4, tid: vecka 2 och 4, vad: "Vecka 2 besöker specialläraren en lektion, från Jag gör till fem minuter in i Du gör, räknar hur många som visar stegen och läser exit-lapparna. Vecka 4 ser en kollega eller rektor samma delar." }
