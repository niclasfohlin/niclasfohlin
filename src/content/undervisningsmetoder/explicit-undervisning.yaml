# ---------------------------------------------------------------------------------------------------------------------
# 3. Det som avgör effekten
# ---------------------------------------------------------------------------------------------------------------------
hinder:
  rubrik: Det svåraste med metoden
  kort: "Det som ofta försvinner är att varje elev visar hur hen tänker. Låt alla skriva stegen varje varv, läs dem, och be enskilda elever säga sitt steg."
  text: "Det som ofta försvinner är att varje elev visar hur hen tänker, så att du ser vem som kan. I 129 klassrum hängde framstegen för eleverna i matematiksvårigheter ihop med hur ofta enskilda elever fick svara (Doabler m.fl., 2019), och i en fallstudie slutade läraren be eleverna visa vad de hade förstått, och frågorna kom inte tillbaka trots coachning (Baco m.fl., 2023). Låt alla skriva stegen varje varv, läs dem, och be enskilda elever säga sitt steg."
  komponent: Alla prövar och visar hur de tänker
fallgropar:
  rubrik: Vanliga fallgropar
  rader:
    - { fallgrop: Genomgången blir en föreläsning, hander: "Eleverna lyssnar länge utan att svara, och du vet inte vad som gått fram.", prova: "Små steg, och låt alla pröva och visa efter varje steg.", komponent: Visa ett steg i taget }
    - { fallgrop: Bara svaret syns, hander: "Alla skriver 83, och du ser inte vem som räknade ett och ett eller gissade.", prova: "Låt alla skriva stegen i den form du visade, och läs det steg där felet brukar sitta.", komponent: Alla prövar och visar hur de tänker }
    - { fallgrop: Rättningen kommer efteråt, hander: "Du ser felen först på exit-lapparna, och eleverna har redan övat in dem under lektionen.", prova: "Gå till elevernas arbete medan de skriver och rätta där, och eleven gör det rätta själv. Exit-lappen säger var nästa lektion börjar.", komponent: Återkoppling på plats }
    - { fallgrop: Kontrollen hoppas över, hander: "Eleverna nickar på ”Hänger ni med?”, och felen syns först när de arbetar själva. De övar in fel eller sitter och väntar på hjälp.", prova: "Två planerade uppgifter som alla löser och visar, och utfallet bestämt före lektionen.", komponent: Nästan alla kan innan eget arbete }
    - { fallgrop: Frågor till dem som räcker upp handen, hander: "Du får en för ljus bild av vad klassen kan.", prova: "Låt alla visa sina steg på signalen, och följ ett fel med en fråga till den eleven.", komponent: Alla prövar och visar hur de tänker }
    - { fallgrop: Modellen som checklista, hander: "Delarna bockas av oavsett vad eleverna visar.", prova: "Följ eleverna, och gå tillbaka en del när det behövs." }
    - fallgrop: När många har samma fel
      moment: [Vi gör]
      hander: Tre eller fler elever har samma fel i Vi gör, och du hinner inte till alla.
      steg: ["Stanna klassen med signalen.", "Visa felet på tavlan, utan namn.", "Visa steget igen, på ett nytt sätt eller med ett nytt exempel.", "Gör en uppgift till tillsammans, och läs miniwhiteboards.", "Låt klassen fortsätta, och gå först till dem som hade felet."]
    - fallgrop: När en elev inte kommer igång
      moment: [Du gör]
      hander: Eleven sitter still med uppgiften i Du gör, medan de andra arbetar.
      steg: ["Gå fram till eleven, och tala lågt.", "Fråga om hen vill göra den första uppgiften med dig.", "Gör den tillsammans, med stegens ord.", "Säg att du kommer tillbaka, och gå vidare.", "Kom tillbaka, och säg vad eleven har klarat."]
hallFast:
  rubrik: Fem saker att hålla fast vid
  rader:
    - { sak: "När nästan alla alltid klarar kontrollen: gör den svårare", text: "Kontrollen ska kunna visa felet du letar efter. Är uppgifterna för lätta ser du inte vem som behöver bordet, och klassen går vidare för tidigt." }
    - { sak: "När det går bra: låt alla visa ändå", text: "När klassen kan mycket är det lätt att fråga dem som räcker upp handen, och då ser du inte längre den som har tappat." }
    - { sak: "Efter ett lov: öva signalen och miniwhiteboarden igen", text: "Rutinerna glider under ett lov. En lektion med känt innehåll, som den första, ger tillbaka dem." }
    - { sak: "När arbetsområdet byts: dela upp det i nya steg", text: "Behåll formen och byt innehållet. Stegen från förra arbetsområdet passar inte det nya, som behöver egna små steg och egna ord." }
    - { sak: "Efter en termin: be en kollega räkna elevernas svar", text: "Det du gör själv märker du sist. En kollega som räknar hur många som visade stegen i Vi gör och kontrollen ser om kärnan finns kvar." }

