ramar:
  rubrik: Materialet för klassen
  text: ["Utöver lektionskortet finns stödmaterialet för klassen: lektionens delar, affischen Så visar du och bladet Stegen. Varje blad står på en egen sida."]
  ramar:
    - rubrik: Lektionens delar
      text: ["Sätt de sex korten med bild i rad på tavlan, och flytta pilen när ni går vidare. Skriv ut på A4 eller A3 och klipp isär. Gå igenom korten första lektionen, och låt en elev flytta pilen."]
