# Explicit undervisning: den första undervisningsmetoden, piloten för standarden (docs/undervisningsmetoder/standarden.md).
# Skriven 2026-10-29 ur skelettet, analysen (analys.md), innehållsbankerna (innehall-praktiken.md, P; innehall-karnan.md,
# K) och evidensen (evidensbank.md, adjudicering-evidensen.md, evidens.json). Centrum är Niclas: rörelsen mellan tavlan
# och elevernas arbete, återkopplingen på plats och att eleverna visar hur de tänker.
#   node build/sparrprov.mjs methods/explicit-undervisning/metod.yaml

titel: Explicit undervisning
undertitel: Så leder du en lektion i helklass, F–⁠9
alternativaNamn: ["Direktinstruktion", "Strukturerad undervisning", "Explicit instruction"]
ingress: När klassen ska lära sig något nytt där det finns ett rätt sätt att göra, visar du det vid tavlan, ett steg i taget, och alla elever prövar och visar hur de tänker. Du går till deras arbete och rättar felen på plats, varv efter varv, tills nästan alla kan. Först då övar eleverna själva eller i par.
arskurs: ["F-3", "4-6", "7-9"]
arskursText: F–9
taggar: ["undervisningskvalitet", "formativ-bedomning", "tillganglig-undervisning"]
slag: lektionsforlopp
syfte: [nytt]
tid: 40 minuter per lektion, minst tre lektioner i veckan
hurOftaSkal: "I studierna med effekt hade klasserna metoden från en lektion i veckan (Kruit m.fl., 2018) till varje dag (Stockard m.fl., 2018). Metoden föreslår minst tre i veckan, så att rutinerna hinner sitta."
period: Fyra veckor att komma igång
material:
  - miniwhiteboards
  - exit-lappar
  - lektionens delar
  - affischen Så visar du
  - bladet Stegen
  - material vid bordet
uppdaterad: 2026-11-04
publicerad: 2026-10-29
relaterade: ["fyra-raknesatten", "formativ-bedomning", "testbaserat-larande"]
utkast: false
film:
  sekunder: 29.3
  beskrivning: "Läraren visar 47 + 38 vid tavlan med stegens ord. Alla räknar 44 + 38 och visar stegen på miniwhiteboarden. Läraren ser att en elev har tappat tiotalet i 12, går dit och rättar steget med ”Min tur”, ”Tillsammans” och ”Din tur”, och går tillbaka till tavlan. I kontrollen, 36 + 47, kan nästan alla, och klassen övar själv."
  rubrik: "Så leder läraren: från tavlan till elevernas arbete och tillbaka"
  ingress: "Filmen visar en lektion i matematik i åk 2–⁠3, där klassen räknar plus med växling. En kontroll visar att nästan alla kan, och först då övar klassen själv."
  stillbilder:
    - text: "Läraren visar stegen med samma ord."
    - text: "Läraren läser stegen på fyra elevers miniwhiteboards."
    - text: "Läraren rättar på plats: min tur, tillsammans, din tur."
    - text: "I kontrollen kan nästan alla, och klassen övar själv."
# Extrafilmen efter Kontrollera (film-2.yaml), i stödundervisningens form, så att sidan kan visa den (sajten 2026-10-30).
filmer:
  - nr: 2
    titel: "Kontrollen, bordet och avslutet"
    sekunder: 29.95
    beskrivning: "Läraren räknar eleverna med fel. Läraren säger: ”1, 2, 3, visa!” Läraren säger: ”Nästan alla kan.” Läraren säger: ”Nu övar ni själva.” Läraren säger: ”Ni med fel, kom till bordet.” Läraren säger: ”Min tur. Tio kuber blir en stav.” Läraren säger: ”Din tur.” Eleven säger: ”70 + 13 = 83”. Läraren säger: ”Det stämmer. Fortsätt.” Läraren säger: ”Målet: säg stegen tillsammans.” Läraren säger: ”Skriv stegen på lappen.” Efter lektionen sorterar läraren lapparna."
    rubrik: "Kontrollen, bordet och avslutet"
    ingress: "I samma lektion har fem av 28 fel i kontrollen. Läraren räknar dem, låter klassen öva och tar de fem vid bordet. Lektionen slutar med exit-lappen, och efteråt sorterar läraren lapparna."
    efter: "steg 4"
    stillbilder:
      - text: "Läraren räknar: 5 av 28 har fel, så nästan alla kan."
      - text: "Vid bordet visar läraren steget, och eleven gör rätt."
      - text: "Sedan går läraren en runda bland bänkarna."
      - text: "Alla skriver en exit-lapp, och läraren sorterar dem."

profil:
  evidens:
    larande:    { tillforlitlighet: mattlig, effekt: mattlig, kort: "Mest program med manus i F–⁠3. I vanliga klasser var effekten mindre.", motivering: "Måttlig tillförlitlighet, måttlig effekt. Stödet bygger mest på program med manus i F–⁠3: 0,54 i 328 studier (Stockard m.fl., 2018). I stora studier i vanliga klasser var effekten mindre eller inte säker (Clarke m.fl., 2015; Torgerson m.fl., 2018).", kallor: [stockard-m-fl-2018, clarke-m-fl-2015, torgerson-m-fl-2018] }
    lasning:    { tillforlitlighet: lag, effekt: ingen, motivering: "Låg tillförlitlighet, ingen effekt. Engelmanns program med manus gav 0,10 i tre studier med oberoende prov i F–⁠3, och resultatet var inte säkert (Slavin m.fl., 2010). Det finns ingen stor studie av metoden i helklass.", kallor: [slavin-m-fl-2010, stockard-m-fl-2018] }
    skrivning:  { tillforlitlighet: mattlig, effekt: liten, motivering: "Måttlig tillförlitlighet, liten effekt. SRSD gav stor effekt i små studier med forskarnas prov (Graham, Bollinger m.fl., 2012). Med oberoende prov blev det 0,22 i två studier och ingen effekt i 84 skolor (Slavin m.fl., 2019; Torgerson m.fl., 2018).", kallor: [graham-bollinger-m-fl-2012, slavin-m-fl-2019, torgerson-m-fl-2018] }
    matematik:  { tillforlitlighet: mattlig, effekt: mattlig, motivering: "Måttlig tillförlitlighet, måttlig effekt. Stödet gäller mest små grupper med elever i matematiksvårigheter: 0,31 i 14 studier (Fuchs m.fl., 2021). I hela klasser gav en av tre stora studier en säker effekt, och den var liten (Jitendra m.fl., 2019).", kallor: [fuchs-m-fl-2021, jitendra-m-fl-2019, clarke-m-fl-2015, jitendra-m-fl-2015] }
    amnen:      { tillforlitlighet: lag, effekt: stor, motivering: "Låg tillförlitlighet, stor effekt. I NO i åk 5–⁠6 gav explicit undervisning i hur man gör en undersökning stor effekt på forskarnas prov jämfört med vanlig undervisning (Kruit m.fl., 2018). SO och teknik är inte studerade.", kallor: [kruit-m-fl-2018] }
    socialt:    { tillforlitlighet: lag, effekt: ingen, motivering: "Låg tillförlitlighet, ingen effekt. Ingen studie med jämförelsegrupp har mätt arbetsron, och de små studierna räcker inte för att säga något. Svar från alla samtidigt gav bättre arbetsro i några av dem (MacSuga-Gage och Simonsen, 2015).", kallor: [macsuga-gage-och-simonsen-2015] }
  svarighet: { lara: 3, karnan: 3, stod: 3, tid: 3, motivering: "Läraren övar nya drag: att visa ett steg i taget, gå mellan tavlan och elevernas arbete och vänta med elevernas eget arbete tills nästan alla kan. Kärnan glider lätt när tiden är knapp." }
  kostnad:   { kop: 2, timmar: 13, motivering: "Skolan köper miniwhiteboards och exit-lappar. De 13 timmarna per lärare första läsåret går till läsningen, två möten i arbetslaget, samtalen efter observationerna och en timme i veckan för stegen de första veckorna." }
  urval:
    datum: 2026-10-30
    regel: "Insatser räknas när läraren visar en färdighet eller strategi i små steg, eleverna övar med läraren och svarar ofta, återkopplingen kommer direkt och eget arbete kommer efteråt, i helklass och i grupp: Engelmanns program, läromedel som ELM och strategiundervisning som SRSD. Räknas inte: studier utan jämförelsegrupp, översikter av metaanalyser, undervisning en och en, och program där kärnan inte syns i källan."
    text: "Vi sökte 2026-10-29 hos Skolforskningsinstitutet, Skolverket, EEF, What Works Clearinghouse och Best Evidence Encyclopedia, i ERIC och OpenAlex, och följde referenserna i en översikt från 2024. När ett område fick svagt stöd eller inte var studerat, sökte vi igen efter starkare belägg, i skrivning 2026-10-30. Vi valde sammanställningar med oberoende prov och stora studier, också de utan effekt. Hatties översikt, undervisning en och en och program där kärnan inte syns valde vi bort."
    # Slutsatsen för varje grupp i referensbladet, riggens, ur källorna som de står här (Niclas 2026-10-29).
    slutsatser:
      oversikt: "Program med manus och små steg ger stor effekt i många studier, mest i F–⁠3 (Stockard m.fl., 2018). I matematik är effekten måttlig för elever som behöver stöd och undervisas i små grupper (Fuchs m.fl., 2021). I läsning är den måttlig i tre studier av Engelmanns program med oberoende prov (Slavin m.fl., 2010). I skrivning ger strategiundervisning efter SRSD ofta stor effekt i små studier med forskarnas prov (Graham, Bollinger m.fl., 2012) och en mindre med oberoende prov (Slavin m.fl., 2019). Ju strängare urvalet är, desto mindre blir talen."
      experiment: "Fyra stora försök prövade explicit undervisning i vanliga klasser med standardiserade prov. Ett av dem gav en säker effekt, och den var liten (Jitendra m.fl., 2019). I de andra tre var effekten inte säker, i matematik i förskoleklass och i åk 7 och i skrivning i England (Clarke m.fl., 2015; Jitendra m.fl., 2015; Torgerson m.fl., 2018). Ett mindre försök i NO i åk 5–⁠6 gav stor effekt på ett praktiskt prov som forskarna hade gjort (Kruit m.fl., 2018). I vanliga klasser är effekten alltså mindre än i sammanställningarna."
      annan: "Artiklarna och klassrumsstudierna beskriver kärnans fyra delar: små steg, svar från alla och från var och en, återkoppling direkt och en kontroll innan eleverna övar själva (Hughes m.fl., 2017; Rosenshine, 2012). I en studie hängde de egna svaren ihop med framstegen för elever i matematiksvårigheter (Doabler m.fl., 2019). När alla svarade samtidigt blev det fler svar och bättre arbetsro än när en elev i taget svarade, i små studier (MacSuga-Gage och Simonsen, 2015). Det som ofta försvinner är att eleverna visar hur de tänker: i en fallstudie kom kontrollen av förståelsen inte tillbaka trots coachning (Baco m.fl., 2023)."
    uteslutna:
      - { namn: "Benner och Zeng (2017)", skal: "Liten studie i förskoleklass där bara sammanfattningen gick att läsa, och där det inte går att se om grupperna var lika före" }
      - { namn: "Lane m.fl. (2011)", skal: "Undervisning en och en" }
      - { namn: "Stockard (2021)", skal: "Författarens redovisning av samma metaanalys, utan egen sökning" }
      - { namn: "Borman m.fl. (2008)", skal: "Open Court Reading, där metodens kärna inte syns i källan" }
      - { namn: "Hattie (2009)", skal: "Översikt av metaanalyser, bara använd för att hitta dem" }
      - { namn: "Graham, McKeown m.fl. (2012)", skal: "Metaanalys där vi bara har läst sammanfattningen, och vägledningen för samma årskurser har studierna en och en" }
      - { namn: "Alfieri m.fl. (2011)", skal: "Gäller barn och vuxna, och bär ingen rad i metodkortet" }
      - { namn: "Doabler m.fl. (2021)", skal: "Liten studie i NO, där vi bara har läst sammanfattningen" }
      - { namn: "Okkinga m.fl. (2018)", skal: "Strategiundervisning i läsning, där kärnan inte redovisas för sig" }
      - { namn: "Lindström-Sandahl m.fl. (2024)", skal: "Undervisning en och en" }
      - { namn: "AERO (2024)", skal: "Sidan gick inte att öppna" }

