# ---------------------------------------------------------------------------------------------------------------------
# 1. Förstå metoden
# ---------------------------------------------------------------------------------------------------------------------
inledning:
  - Explicit undervisning är ett sätt att lära klassen något nytt där det finns ett rätt sätt att göra, som ljud och bokstäver, skriftlig huvudräkning eller en stavningsregel. Före lektionen delar du upp det nya i steg och bestämmer stegens ord. Du visar det nya vid tavlan, ett steg i taget och med samma ord varje gång. Sedan gör klassen det med dig, steg för steg, och alla visar hur de gjorde. Du går till deras arbete, rättar det som är fel på plats och går tillbaka till tavlan, varv efter varv, tills nästan alla kan. Först då övar eleverna själva eller i par. Det är ingen föreläsning, eftersom eleverna visar hur de tänker många gånger medan du undervisar.
  - "På varje bänk ligger en miniwhiteboard och en penna, och på tavlan sitter lektionens delar med en bild till varje. Delarna heter efter vem som gör: i Jag gör visar du, i Vi gör gör klassen det med dig, och i Du gör övar eleverna själva. På din signal håller alla upp miniwhiteboarden med stegen, och du ser på några sekunder vem som har förstått och var det blev fel. Du ger återkopplingen där eleverna sitter, medan de arbetar. Ett bord står fritt, där du samlar dem som hade fel i kontrollen."
  - Lärandet går till så här. Arbetsminnet är litet, så det nya kommer i lagom stora bitar. Med samma ord varje gång lägger eleverna kraften på innehållet. När alla visar hur de tänker ser du felet innan eleverna har övat in det, och den du rättar direkt övar det rätta i stället för det felaktiga.
  - "De första fyra veckorna lär sig klassen tre rutiner: signalen och miniwhiteboarden, bordet och paret. Du övar på att visa ett steg i taget, gå mellan tavlan och elevernas arbete och vänta med elevernas eget arbete tills nästan alla kan. Sedan arbetar ni så när klassen ska lära sig något nytt."

klassen:
  rubrik: Så ordnar du klassen
  text: Alla ser tavlan, och du når snabbt varje bänk, så att du kan gå mellan tavlan och elevernas arbete. Var och en har en miniwhiteboard, en penna och en granne att säga stegen till och öva med. Mellan lektionerna ligger miniwhiteboards i en back per rad. Den som behöver stöd sitter nära tavlan, där du går förbi ofta. Ett bord står fritt, så att du kan samla några där efter kontrollen.

lektionskort:
  - { efter: klassen, text: "Hela lektionen står på lektionskortet, ett eget A4 att ha i handen under lektionen." }

roll:
  rubrik: "Lärarens roll: du leder hela tiden"
  text: Du visar vid tavlan, ser allas arbete och bestämmer när klassen går vidare. Det du ser bestämmer vad ni gör sedan, också när planen säger något annat.
  # Niclas kompendium om formativa metoder: Tre frågor att bära med sig som lärare (2026-10-29, helheten).
  fragor:
    - Vad ser och hör jag hos alla?
    - I vilket steg sitter felet, och hos hur många?
    - "Vad gör jag nu: går vidare, går dit eller visar igen?"
  fragornaText: "Frågorna är de tre rutorna i varje del av lektionen: det alla visar, det du tittar efter och beslutet."

passar:
  rubrik: När passar metoden?
  kort: "eleverna ska kunna något säkert. Ska de ta över ett tänkande, passar gradvis överlämnande bättre."
  rader:
    - { fraga: "Vad ska eleverna lära sig?", metoden: "En avgränsad kunskap eller färdighet med ett tydligt rätt sätt, som ljud och bokstäver, skriftlig huvudräkning och en stavningsregel, eller en strategi med fasta steg.", annat: "En strategi eller förmåga som ska användas på nya sätt: förstå en text, skriva en berättelse, lösa problem, resonera. Välj gradvis överlämnande (GRR), där eleverna tar över tänkandet steg för steg." }
    - { fraga: "Hur mycket kan eleverna redan?", metoden: "Lite. Innehållet är nytt, och det är lätt att öva in fel sätt.", annat: "En del. Grunden finns och ska nu användas och fördjupas." }
    - { fraga: "Vad ska eleverna kunna när lektionen är slut?", metoden: "Göra rätt och säkert, allt snabbare och utan att tänka på varje steg.", annat: "Göra det själva i en ny situation och förklara hur de tänkte." }
    - { fraga: "Hur mycket behöver eleverna prata?", metoden: "Lite. Korta svar räcker, gärna alla samtidigt.", annat: "Mycket. Eleverna behöver pröva sina tankar i ord med varandra. Välj kooperativt lärande." }
    - { fraga: "Vad behöver eleverna innan de gör själva?", metoden: "Att ha gjort rätt tillräckligt många gånger. Då behövs kontrollen.", annat: "Att ha prövat sina tankar med någon annan. Då behövs samarbetet." }
    - { fraga: "Vad går oftast snett?", metoden: "Eleverna vet inte hur de ska börja, eller övar in ett felaktigt sätt.", annat: "Eleverna klarar det när du visar, men inte utan dig." }
  tumregel: Finns det ett rätt sätt som eleverna ska kunna säkert, välj explicit undervisning, och ska de ta över ett tänkande med många bra svar, välj GRR. Metoderna kan följa på varandra, och valkartan är ett stöd för tanken och ingen regel.
  metoder: [kooperativt-larande]

larandet:
  rubrik: Så syns lärandet i klassen
  omraden:
    - { omrade: amneskunskaper, syns: "Eleverna gör det nya på egen hand på exit-lappen, med stegen, och gör det rätt också när det kommer tillbaka i starten veckor senare." }
    - { omrade: sprak, syns: "Eleverna använder ämnets ord och stegens ord när de visar och säger hur de gjorde." }
    - { omrade: kommunikation, syns: "Eleverna visar hur de tänkte, med stegen på miniwhiteboarden eller i ord till grannen, och inte bara svaret." }

