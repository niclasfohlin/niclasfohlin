  # Lär dig metoden (Niclas 2026-10-30, genom sajten): två skattningar från 1 till 10 i samma form som Lärarens skattning i
  # Gruppstärkande aktiviteter. Stödet vid frågorna är kärnans kryss och Så syns lärandet i klassen, och gränsen 5 i två
