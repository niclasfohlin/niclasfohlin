    - { vecka: "3", led: Vi gör, rubrik: Utfallen och bordet, fokus: "Kontrollens utfall, och bordet som klassen går till själv.", eleverna: "Att gå till bordet när kontrollen visar fel, och att börja Du gör själv.", roll: "Att räkna eleverna med fel och följa utfallet, också när det betyder ett varv till.", vidare: "de som har fel går till bordet utan att du säger det", fraga: "Går de som har fel till bordet utan att du säger det?" }
    - { vecka: "4", led: Du gör, rubrik: Paret, fokus: "Du gör i par, med egna steg.", eleverna: "Att öva i par efter kontrollen och säga stegen till varandra.", roll: "Att sätta ihop paren och gå mellan bordet och paren.", vidare: "paren säger stegen till varandra utan att du påminner", fraga: "Säger paren stegen till varandra utan att du påminner?" }
