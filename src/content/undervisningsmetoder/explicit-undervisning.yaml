  text: "Skriv kort. Det grå gör du i varje lektion. Börja med målet och exit-lappen. Stegen får du när du löser en uppgift själv, i tre till fem korta steg."
  # Bladet i tre zoner (Niclas 2026-10-29: ”ändamålsenlig för en lärare som planerar”, och Opus förslag i omgång 2).
