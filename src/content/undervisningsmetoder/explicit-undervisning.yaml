uppdrag:
  rubrik: Till arbetslaget
  text: "Det är när ni jämför vad ni såg som metoden sätter sig. Prövar ni två och två, berätta för varandra efter varje vecka vad ni såg. Den som blir besökt delar sin planering i förväg. Är du ensam, be en kollega se din lektion från Jag gör till fem minuter in i Du gör, i vecka 2 eller vecka 4."
  forbered:
    text: "Läs metoden, titta på filmen och tänk igenom frågorna. På mötet bestämmer ni vilka rutiner ni gör lika, som signalen och delarnas namn, och var och en planerar sin första lektion i planeringsmallen."
    fragor:
      - Vilka delar har dina lektioner oftast, och vilken del får minst tid?
      - Hur vet du under en lektion att eleverna är redo att arbeta på egen hand?
      - "När ser du elevernas arbete i dina lektioner: medan de arbetar, eller när du rättar efteråt?"
      - "Titta på huvudfilmen: när går läraren från tavlan till elevernas arbete, och vad gör hen när hen kommer tillbaka?"
  planera: Planera en lektion i planeringsmallen, eller gör huvudexemplet till ditt eget.
  genomfor: Var och en följer Lär dig metoden och skattar varje vecka.
  reflektera:
    - Hur fungerade det för dig, och vilka effekter såg du på eleverna?
    - När var eleverna redo att öva själva, och hur märkte du det?
    - Varför tror du att det blev som det blev?
    - Vad har du lärt dig?
    - Vad är klokt för dig att göra nu?

