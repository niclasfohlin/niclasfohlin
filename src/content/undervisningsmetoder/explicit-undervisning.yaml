lathund:
  metoden:
    text:
      - Du visar det nya vid tavlan, ett steg i taget, och alla prövar och visar hur de tänker. Du går till deras arbete, rättar på plats och går tillbaka till tavlan.
      - Lärandet går till så här. Det nya kommer i steg som arbetsminnet klarar, och när alla visar hur de tänker ser du felet innan det övas in. Ingen övar på egen hand förrän du har sett att nästan alla kan.
  lektion:
    text: "Första lektionen lär sig klassen signalen och miniwhiteboarden på något alla kan, tills alla visar samtidigt, och starten blir tio minuter. Gå igenom delarna på tavlan, och säg varför alla visar: du vill se hur alla tänker. Du gör är enskilt, och bordet är för alla som vill ha ett exempel till. Lektionen står annars på lektionskortet."
  igang:
    rubrik: De första veckorna
