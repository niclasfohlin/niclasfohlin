      vem: lararen
      rad: lararen
      text: "Skatta i slutet av veckan. Tänk på kärnans fyra: Visade du ett steg i taget, och prövade alla? Visade alla stegen samtidigt, och såg du dem? Rättade du på plats, och gjorde eleven rätt själv? Räknade du eleverna med fel i kontrollen och gjorde det som utfallet sa?"
      skala: { fran: 1, till: 10 }
      regler:
        - { om: under 5 i 2 veckor i rad, rad: osaker }
    - namn: Hur väl fungerar den i praktiken?
      vem: lararen
      rad: klassen
      text: "Tänk på det du ser i klasserna: gör eleverna det nya på egen hand på exit-lappen, med stegen? Använder de stegens ord? Visar de hur de tänkte, och inte bara svaret?"
      skala: { fran: 1, till: 10 }
      regler:
