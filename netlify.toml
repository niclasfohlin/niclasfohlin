# Byggkonfiguration för Netlify. Repot kopplas med "netlify init".

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Serverfunktioner (t.ex. prenumeration) ligger i netlify/functions.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Kommentarerna (Waline) läser sina egna filer från disken när de startar, så paketet följer med
# funktionen som det är i stället för att packas ihop. Se DRIFT.md under Kommentarer.
[functions.kommentarer]
  external_node_modules = ["@waline/vercel"]

# Korta adresser till kommentarernas panel och till registreringen av administratören.
[[redirects]]
  from = "/kommentarer/admin"
  to = "/.netlify/functions/kommentarer/ui"
  status = 302
  force = true

[[redirects]]
  from = "/kommentarer/registrera"
  to = "/.netlify/functions/kommentarer/registrera"
  status = 302
  force = true

# Grundläggande säkerhetsrubriker för alla sidor.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache i webbläsarna och hos dem som visar delade länkar (Niclas 2026-09-27). Med Netlifys förval,
# max-age=0, hämtade Facebook delningsbilden 6 131 gånger på ett dygn, drygt hälften av sajtens bandbredd.
# Filerna under /_astro/ och delningskorten har en kontrollsumma i namnet och ändras aldrig: ett år. Bilderna
# och ikonen byts sällan: en vecka. Typsnitten: 30 dagar. Sidorna och nedladdningarna behåller förvalet, så att
# en ändring syns direkt. Hur trafiken mäts står i DRIFT.md under Krediter.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/delning/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Bildkortens bilder (Fluent Emoji, public/bildbank/) byts sällan: en vecka, som bilderna.
[[headers]]
  for = "/bildbank/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Ikonerna som webbläsare och iPhone frågar efter (gjorda ur favicon.svg av scripts/bilder.mjs).
[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Nedladdningarna (Word, PowerPoint och pdf). Facebooks hämtare laddar ner dem när någon delar en direktlänk,
# ungefär hälften av alla hämtningar 2026-09-27, hela filen varje gång. En dags cache gör att den inte hämtar om
# dem hela tiden. En ändrad metod når alla direkt från Netlify; bara en fil som redan ligger i läsarens egen
# webbläsare kan vara upp till ett dygn gammal.
[[headers]]
  for = "/stodundervisning/*.docx"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/stodundervisning/*.pptx"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/stodundervisning/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# iPhone och iPad frågar efter ikonens varianter under egna namn; de får samma ikon.
[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon-120x120.png"
  to = "/apple-touch-icon.png"
  status = 200

[[redirects]]
  from = "/apple-touch-icon-120x120-precomposed.png"
  to = "/apple-touch-icon.png"
  status = 200

# www och Netlifys egen underdomän skickas till huvuddomänen, så att varje sida bara har en adress.
[[redirects]]
  from = "https://www.niclasfohlin.se/*"
  to = "https://niclasfohlin.se/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://niclasfohlin.netlify.app/*"
  to = "https://niclasfohlin.se/:splat"
  status = 301
  force = true

# Mejlar prenumeranterna om nytt innehåll efter varje lyckad produktionsdeploy. Se utskick/README.md.
[[plugins]]
  package = "./netlify/plugins/utskick"
