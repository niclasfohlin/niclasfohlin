# Byggkonfiguration för Netlify. Repot kopplas med "netlify init".

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Serverfunktioner (t.ex. prenumeration) ligger i netlify/functions.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Grundläggande säkerhetsrubriker för alla sidor.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
