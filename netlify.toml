# Byggkonfiguration för Netlify. Repot kopplas med "netlify init".

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Serverfunktioner (t.ex. prenumeration) ligger i netlify/functions.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Kommentarerna (Waline) läser sina egna filer från disken när de startar, så paketet följer med
# funktionen som det är i stället för att packas ihop. Se DRIFT.md under Kommentarer.
[functions.kommentarer]
  external_node_modules = ["@waline/vercel"]

# Korta adresser till kommentarernas panel och till registreringen av administratören.
[[redirects]]
  from = "/kommentarer/admin"
  to = "/.netlify/functions/kommentarer/ui"
  status = 302
  force = true

[[redirects]]
  from = "/kommentarer/registrera"
  to = "/.netlify/functions/kommentarer/registrera"
  status = 302
  force = true

# Grundläggande säkerhetsrubriker för alla sidor.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# www och Netlifys egen underdomän skickas till huvuddomänen, så att varje sida bara har en adress.
[[redirects]]
  from = "https://www.niclasfohlin.se/*"
  to = "https://niclasfohlin.se/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://niclasfohlin.netlify.app/*"
  to = "https://niclasfohlin.se/:splat"
  status = 301
  force = true

# Mejlar prenumeranterna om nytt innehåll efter varje lyckad produktionsdeploy. Se utskick/README.md.
[[plugins]]
  package = "./netlify/plugins/utskick"
