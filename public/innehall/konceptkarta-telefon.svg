<svg xmlns="http://www.w3.org/2000/svg"
     width="650" height="2440" viewBox="0 0 650 2440"
     role="img" aria-labelledby="titel beskrivning"
     font-family="Arial, Helvetica, sans-serif"
     style="display:block;max-width:100%;height:auto">
  <!-- Verktyget Innehåll, konceptkartan för telefonen: samma innehåll, ord och färger som material/innehall-konceptkarta.svg,
       omritad i en spalt på 650 bildpunkter med samma textstorlekar, så att den minsta texten går att läsa i telefonens
       spalt. Sajten bad om den 2026-11-15 natt (out/FRAN-SAJTEN.md, Innehåll, tillägget), Codex ritade den efter riggens
       uppdrag (out/material/innehall/konceptkarta/uppdrag-telefon.md), och den stora kartan står kvar bakom Visa stort. -->
  <title id="titel">Innehåll: vad är värt att lära?</title>
  <desc id="beskrivning">
    Läraren tänker till om innehållet före arbetet, märker under arbetet
    om innehållet träffar eleven och frågar och lyssnar på elevens tankar
    och känslor i början och slutet. Innehållet öppnar en större fråga
    som driver arbetet, börjar för alla i det kända, griper tag i eleven
    och leder till det nya. Eleven sätter ord på tankar och känslor,
    som ändrar nästa steg i innehållet. Läraren väljer metoden sist.
    Metoden hjälper eleven att förstå innehållet och skapa mening.
  </desc>

  <defs>
    <marker id="pil-bla"
            markerWidth="12" markerHeight="12"
            refX="12" refY="6" orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#2e75b6"/>
    </marker>
    <marker id="pil-brun"
            markerWidth="12" markerHeight="12"
            refX="12" refY="6" orient="auto"
            markerUnits="userSpaceOnUse">
      <path d="M0 0L12 6L0 12Z" fill="#8a5a1e"/>
    </marker>
  </defs>

  <rect width="650" height="2440" fill="#ffffff"/>

  <!-- Blå samband. Varje pil har sin egen väg. -->
  <g fill="none" stroke="#2e75b6" stroke-width="3.2"
     stroke-linecap="round" stroke-linejoin="round"
     marker-end="url(#pil-bla)">
    <!-- Innehållet öppnar en större fråga. -->
    <path d="M265 460V575"/>

    <!-- Innehållet börjar för alla i det kända. -->
    <path d="M200 425H140Q120 425 120 445V800
             Q120 820 140 820H185Q205 820 205 840V970"/>

    <!-- Innehållet leder till det nya. -->
    <path d="M450 425H500Q520 425 520 445V800
             Q520 820 500 820H465Q445 820 445 840V970"/>

    <!-- Innehållet griper tag i eleven. -->
    <path d="M400 460V795Q400 820 375 820H350
             Q325 820 325 845V1370"/>

    <!-- Eleven sätter ord på tankar och känslor. -->
    <path d="M250 1470V1500Q250 1520 230 1520H200
             Q180 1520 180 1540V1795
             Q180 1810 195 1810H200"/>

    <!-- Läraren väljer metoden sist. -->
    <path d="M175 75H45Q25 75 25 95V1930
             Q25 1950 45 1950H305
             Q325 1950 325 1970V2070"/>

    <!-- Metoden hjälper eleven att förstå och skapa mening. -->
    <path d="M325 2170V2290"/>
  </g>

  <!-- Kärnans tre delar och återkopplingen till innehållet. -->
  <g fill="none" stroke="#8a5a1e" stroke-width="3.6"
     stroke-linecap="round" stroke-linejoin="round"
     marker-end="url(#pil-brun)">
    <path d="M325 130V350"/>

    <path d="M475 105H565Q585 105 585 125V1100
             Q585 1120 565 1120H470
             Q450 1120 450 1140V1370"/>

    <path d="M475 65H605Q625 65 625 85V1520
             Q625 1540 605 1540H470
             Q450 1540 450 1560V1770"/>

    <path d="M200 1850H90Q70 1850 70 1830V405
             Q70 385 90 385H200"/>
  </g>

  <!-- Ljusa bottnar håller länkorden fria från linjer. -->
  <g fill="#ffffff">
    <rect x="215" y="237" width="220" height="44" rx="8"/>
    <rect x="205" y="498" width="120" height="44" rx="8"/>
    <rect x="125" y="840" width="160" height="78" rx="8"/>
    <rect x="365" y="860" width="160" height="44" rx="8"/>
    <rect x="360" y="1200" width="180" height="112" rx="8"/>
    <rect x="235" y="1315" width="180" height="44" rx="8"/>
    <rect x="35" y="1340" width="110" height="112" rx="8"/>
    <rect x="110" y="1610" width="140" height="82" rx="8"/>
    <rect x="355" y="1635" width="190" height="80" rx="8"/>
    <rect x="235" y="1988" width="180" height="44" rx="8"/>
    <rect x="190" y="2205" width="270" height="44" rx="8"/>
  </g>

  <g text-anchor="middle" font-size="28" fill="#555555">
    <text x="265" y="528">öppnar</text>
    <text x="205" y="870">
      <tspan x="205">börjar för</tspan>
      <tspan x="205" dy="34">alla i</tspan>
    </text>
    <text x="445" y="891">leder till</text>
    <text x="325" y="1345">griper tag i</text>
    <text x="180" y="1640">
      <tspan x="180">sätter</tspan>
      <tspan x="180" dy="34">ord på</tspan>
    </text>
    <text x="325" y="2018">väljer sist</text>
    <text x="325" y="2236">hjälper eleven att</text>
  </g>

  <g text-anchor="middle" font-size="28" fill="#8a5a1e">
    <text x="325" y="267">tänker till om</text>
    <text x="450" y="1229">
      <tspan x="450">märker om</tspan>
      <tspan x="450" dy="34">innehållet</tspan>
      <tspan x="450" dy="34">träffar</tspan>
    </text>
    <text x="90" y="1370">
      <tspan x="90">ändrar</tspan>
      <tspan x="90" dy="34">nästa</tspan>
      <tspan x="90" dy="34">steg i</tspan>
    </text>
    <text x="450" y="1664">
      <tspan x="450">frågar och</tspan>
      <tspan x="450" dy="34">lyssnar på</tspan>
    </text>
  </g>

  <!-- Märkena hör till lärarens handlingar. -->
  <g fill="#fbf3e4" stroke="#8a5a1e" stroke-width="1.5">
    <rect x="235" y="170" width="180" height="46" rx="23"/>
    <rect x="355" y="1140" width="190" height="46" rx="23"/>
    <rect x="295" y="1575" width="310" height="46" rx="23"/>
  </g>
  <g text-anchor="middle" font-weight="700" fill="#8a5a1e">
    <text x="325" y="202" font-size="28">1 · Före</text>
    <text x="450" y="1172" font-size="28">2 · Under</text>
    <text x="450" y="1607" font-size="26">3 · Början och slut</text>
  </g>

  <!-- Begreppsrutorna. -->
  <g fill="#1f5c99">
    <rect x="175" y="40" width="300" height="90" rx="18"/>
    <rect x="200" y="350" width="250" height="110" rx="18"/>
    <rect x="175" y="1370" width="300" height="100" rx="18"/>
    <rect x="175" y="2070" width="300" height="100" rx="18"/>
  </g>

  <g fill="#ebf4fb" stroke="#d6e4f0" stroke-width="2">
    <rect x="100" y="970" width="210" height="110" rx="18"/>
    <rect x="340" y="970" width="210" height="110" rx="18"/>
    <rect x="115" y="2290" width="420" height="110" rx="18"/>
  </g>

  <g fill="#f8fbfd" stroke="#d6e4f0" stroke-width="2">
    <rect x="155" y="575" width="220" height="190" rx="18"/>
    <rect x="200" y="1770" width="300" height="120" rx="18"/>
  </g>

  <g text-anchor="middle" fill="#ffffff">
    <text x="325" y="98" font-size="36" font-weight="700">Läraren</text>
    <text x="325" y="395" font-size="36" font-weight="700">Innehållet</text>
    <text x="325" y="437" font-size="28">Vad och varför</text>
    <text x="325" y="1432" font-size="36" font-weight="700">Eleven</text>
    <text x="325" y="2114" font-size="36" font-weight="700">Metoden</text>
    <text x="325" y="2153" font-size="28">Hur</text>
  </g>

  <g text-anchor="middle">
    <text x="265" y="618" font-size="32" fill="#1a1a1a">
      <tspan x="265">En större</tspan>
      <tspan x="265" dy="38">fråga</tspan>
    </text>
    <text x="265" y="701" font-size="28" fill="#555555">
      <tspan x="265">som driver</tspan>
      <tspan x="265" dy="37">arbetet</tspan>
    </text>

    <text x="205" y="1017" font-size="34"
          font-weight="700" fill="#1f5c99">Det kända</text>
    <text x="205" y="1057" font-size="30" fill="#555555">Spegel</text>

    <text x="445" y="1017" font-size="34"
          font-weight="700" fill="#1f5c99">Det nya</text>
    <text x="445" y="1057" font-size="30" fill="#555555">Fönster</text>

    <text x="350" y="1818" font-size="32" fill="#1a1a1a">
      <tspan x="350">Tankar och</tspan>
      <tspan x="350" dy="38">känslor</tspan>
    </text>

    <text x="325" y="2335" font-size="34"
          font-weight="700" fill="#1f5c99">
      <tspan x="325">Förstå innehållet</tspan>
      <tspan x="325" dy="42">och skapa mening</tspan>
    </text>
  </g>
</svg>
