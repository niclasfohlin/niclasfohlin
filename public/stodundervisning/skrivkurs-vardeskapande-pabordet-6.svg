<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Guideboken vecka 1 · Platsen. Två texter om parken står på tavlan, med orden för alla parker och det som bara finns där."><title>Guideboken vecka 1 · Platsen</title><rect width="960" height="540" fill="#f5f3ee"/><rect x="20" y="16" width="920" height="508" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><rect x="40" y="36" width="420" height="300" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="60" y="70" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den första texten</text><text x="60" y="108" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">Parken är fin och mysig.</text><text x="60" y="136" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">Där finns stora träd och bänkar</text><text x="60" y="164" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">att sitta på. Det finns en</text><text x="60" y="192" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">lekplats och en damm. På sommaren</text><text x="60" y="220" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">är det skönt att vara där.</text><line x1="158" y1="106" x2="264" y2="106" stroke="#1f3a5f" stroke-width="2" stroke-linecap="round"/><rect x="480" y="36" width="440" height="300" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="500" y="70" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den andra texten</text><text x="500" y="108" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">I parken står en ek som är så tjock</text><text x="500" y="136" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">att tre barn inte når runt den.</text><text x="500" y="164" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">Bänken under eken har ett hjärta</text><text x="500" y="192" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">inristat i ryggen. Bakom lekplatsen</text><text x="500" y="220" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">ligger en damm, där änderna simmar</text><text x="500" y="248" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">fram så fort någon prasslar</text><text x="500" y="276" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">med en påse.</text><line x1="496" y1="116" x2="496" y2="146" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><line x1="496" y1="172" x2="496" y2="202" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><line x1="496" y1="228" x2="496" y2="286" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><path d="M0 0m240 1170q0 225 92 338q91 112 253 112q121 0 220-70l-45-160q-81 60-175 60q-78 0-119-56q-41-56-41-184q0-32 0-105q0-73 0-165q0-93 0-184q0-92 0-163q0-71 0-99q0-145 7-280q7-135 23-214h-215q0 140 0 294q0 154 0 302q0 147 0 271q0 123 0 204q0 81 0 99zm-200-320v145h655v-145zM750 0m175 1020h200q0-136 0-272q0-136 0-273q0-64 3-155q2-92 7-179q4-87 10-141h-205q0 72 0 169q0 97 0 194q0 96 0 167q0 146-2 279q-3 132-13 211zm-20 325q0 56 35 96q35 39 90 39q5