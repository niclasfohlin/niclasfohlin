 hon ha en riktigt stor nöt.</text><line x1="488" y1="130" x2="848" y2="130" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><text x="490" y="154" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Längst ut på en tunn gren satt en stor nöt.</text><text x="490" y="186" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Grenen var för tunn för att bära ekorren.</text><text x="490" y="218" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Då gnagde ekorren av grenen.</text><text x="490" y="250" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Till slut satt ekorren i sitt bo med nöten.</text><g transform="translate(60 300) scale(0.0547 -0.0547)" fill="#1f3a5f"><use xlink:href="#g0"/><use xlink:href="#g1" x="341"/><use xlink:href="#g2" x="629"/><use xlink:href="#g3" x="1065"/><use xlink:href="#g4" x="1333"/><use xlink:href="#g5" x="1474"/><use xlink:href="#g5" x="1615"/><use xlink:href="#g6" x="1894"/><use xlink:href="#g7" x="2188"/><use xlink:href="#g8" x="2473"/><use xlink:href="#g9" x="2769"/></g><g transform="translate(760 300) scale(0.0625 -0.0625)" fill="#1f3a5f"><use xlink:href="#ga"/><use xlink:href="#g8" x="285"/><use xlink:href="#gb" x="581"/><use xlink:href="#gc" x="822"/><use xlink:href="#g1" x="1081"/><use xlink:href="#g8" x="1369"/><use xlink:href="#gd" x="1665"/></g><line x1="880" y1="276" x2="880" y2="140" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><path d="M888 154L880 140L872 154" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linejoin="round"/><svg x="78" y="398" width="64" height="64" viewBox="0 0 32 32">
