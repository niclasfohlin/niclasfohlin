<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Vecka 1 · Sagorna. Två sagor om ekorren på tavlan, med önskan understruken, och sagans väg i fyra steg under."><title>Vecka 1 · Sagorna</title><rect width="960" height="540" fill="#f5f3ee"/><rect x="20" y="16" width="920" height="330" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="40" y="54" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#5d6b7a">Den första sagan</text><text x="40" y="90" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Det var en gång en ekorre som bodde i ett hasselträd.</text><text x="40" y="122" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Längst ut på en tunn gren satt en stor nöt.</text><text x="40" y="154" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Grenen var för tunn för att bära ekorren.</text><text x="40" y="186" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Då gnagde ekorren av grenen.</text><text x="40" y="218" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Till slut satt ekorren i sitt bo med nöten.</text><text x="490" y="54" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#5d6b7a">Den andra sagan</text><text x="490" y="90" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Det var en gång en ekorre som bodde i ett hasselträd.</text><text x="490" y="122" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Mest av allt ville hon ha en riktigt stor nöt.</text><line x1="488" y1="130" x2="848" y2="130" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><text x="490" y="154" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Längst ut på en tunn gren satt en stor nöt.</text><text x="490" y="186" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Grenen var för tunn för att bära ekorren.</text><text x="490" y="218" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Då gnagde ekorren av grenen.</text><text x="490" y="250" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5d6b7a">Till slut satt ekorren i sitt bo med nöten.</text><path d="M0 0m1095 1460h215q-27-61-58-140q-31-79-82-225l-385-1095h-225l-390 1095q-52 145-81 225q-29 79-54 140h215l422-1265zM1365 0m1055 0h-175q-14 32-24 94q-11 61-16 127q-5 65-5 109v80q-39-103-100-203q-61-101-143-166q-82-66-187-66q-126 0-213 112q-87 111-87 323q0 119 32 232q32 112 98 202q66 90 168 143q102 53 242 53q97 0 183-12q86-13 162-33v-465q0-189 18-317q18-129 47-213zm-250 735v127q-25 6-62 12q-38 6-113 6q-130 0-204-67q-75-68-105-175q-31-107-31-228q0-116 43-190q43-75 102-75q53 0 106 47q53 46 101 120q47 73 84 155q36 81 58 153q21 72 21 115zM2515 0m1030 1600v-1070q0-189 22-317q21-129 53-213h-180q-11 26-26 78q-16 52-29 107q-71-101-163-155q-92-55-202-55q-122 0-212 60q-90 60-139 170q-49 109-49 255q0 177 63 307q63 130 171 202q107 71 241 71q64 0 136-26q71-26 129-59v280q0 120-5 211q-6 91-20 154zm-185-1200v395q-74 40-131 58q-58 17-134 17q-76 0-142-45q-66-46-107-131q-41-85-41-204q0-174 60-264q60-91 190-91q61 0 121 39q59 38 108 99q49 61 76 127zM4255 0m840 1020h210q-28-57-58-124q-30-68-55-129q-26-62-42-102q-14-3