<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Avancerat, problem 2 · Lösning B. Lösning B, uttrycket 10 + 4n. Varje glas ger (42 − 18) / 6 = 4 cm till, så stapeln är ett glas utan kant och en kant på 4 cm för varje glas. Glaset utan kanten är 18 − 2 · 4 = 10 cm, och n glas är 10 + 4n cm. 10 + 4n = 36 ger n = 26 / 4 = 6,5. Ett halvt glas går inte, så 6 glas. Kontroll: 10 + 4 · 6 = 34 och 10 + 4 · 7 = 38. Till vänster är en stapel med 3 glas ritad: 10 + 3 · 4 = 22."><title>Avancerat, problem 2 · Lösning B</title><defs><path id="g0" d="m55 0v43h79v272l-75-43l-6 45l86 53h42v-327h79v-43z"/><path id="g1" d="m228 179q0 55-9 88q-9 33-26 47q-18 15-43 15q-36 0-57-33q-20-33-20-110q0-55 9-88q9-32 26-47q17-15 42-15q36 0 57 33q21 34 21 110zm50 6q0-55-10-92q-10-37-28-59q-18-21-42-31q-23-9-50-9q-36 0-65 17q-28 17-44 58q-16 40-16 111q0 71 17 112q18 42 47 61q29 18 66 18q36 0 64-18q28-18 44-59q17-41 17-109z"/><path id="g2" d="m231 21q-19-14-38-21q-20-6-48-6q-33 0-61 15q-27 16-44 45q-16 29-16 69q0 37 16 69q16 31 45 49q29 19 69 19q25 0 43-6q18-6 32-15l-9-45q-17 12-34 19q-17 6-36 6q-33 0-56-25q-23-25-23-69q0-40 22-65q21-25 57-25q23 0 41 8q19 8 35 22z"/><path id="g3" d="m236 165v-165h-46v143q0 31-3 46q-3 16-11 22q-8 5-22 5q-18 0-36-14q-18-14-28-37v-165h-46v154q0 37-4 62q-5 26-9 39h45q3-8 5-19q2-11 3-20q23 27 43 35q20 9 42 9q24 0 40-13q15-12 21-29q24 25 45 34q20 8 40 8q38 0 53-24q15-25 15-71v-165h-47v138q0 32-3 49q-3 17-11 23q-8 6-22 6q-18 0-35-14q-18-13-29-37z"/><path id="g4" d="m281 99h-47v-99h-48v99h-163v39l163 232h48v-232h47zm-95 210l-120-171h120z"/><path id="g5" d="m131 295h38v-224h-38zm-92-130v38h222v-38z"/><path id="g6" d="m103 218h17q25 0 46 8q21 9 34 23q13 14 13 30q0 17-10 28q-10 10-25 15q-15 6-30 6q-29 0-51-9q-22-8-43-30l-9 42q15 17 42 29q27 11 58 11q31 0 57-10q26-10 42-30q16-19 16-46q0-23-13-41q-12-17-31-29q-18-11-36-15q13-2 29-9q16-6 31-18q14-11 23-29q10-18 10-43q0-22-11-4