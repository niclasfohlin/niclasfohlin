<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Del 5 · Faran och valet. Två texter om hopptornet, med kroppens ord markerade i den andra."><title>Del 5 · Faran och valet</title><rect width="960" height="540" fill="#f5f3ee"/><rect x="20" y="16" width="920" height="508" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><rect x="40" y="36" width="420" height="250" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="60" y="68" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den första texten</text><text x="60" y="104" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag stod högst upp i hopptornet.</text><text x="60" y="130" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Det var jättehögt. Jag blev jätterädd</text><text x="60" y="156" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">och ville inte hoppa.</text><text x="60" y="182" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Alla tittade på mig. Jag var så rädd.</text><text x="60" y="208" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Men till slut hoppade jag ändå,</text><text x="60" y="234" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">och det gick bra.</text><rect x="480" y="36" width="440" height="300" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="520" y="68" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den andra texten</text><text x="520" y="104" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag stod högst upp i hopptornet.</text><text x="520" y="130" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Vattnet var så långt ner att</text><text x="520" y="156" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">människorna såg små ut. Benen darrade,</text><text x="520" y="182" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">och jag höll så hårt i räcket att</text><text x="520" y="208" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">fingrarna blev vita. Alla tittade på mig.</text><text x="520" y="234" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag tog ett steg bakåt. Sedan tänkte</text><text x="520" y="260" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">jag på Mira, som väntade i vattnet.</text><text x="520" y="286" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag blundade och hoppade.</text><line x1="504" y1="146" x2="504" y2="216" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><line x1="504" y1="226" x2="504" y2="296" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><path d="M0 0m1095 1460h215q-27-61-58-140q-31-79-82-225l-385-1095h-225l-390 1095q-52 145-81 225q-29 79-54 140h215l422-1265zM1365 0m1055 0h-175q-14 32-24 94q-11 61-16 127q-5 65-5 109v80q-39-103-100-203q-61-101-143-166q-82-66-187-66q-126 0-213 112q-87 111-87 323q0 119 32 232q32 112 98 