44-20 69q-20 25-52 25q-31 0-52-25q-21-25-21-69z"/><path id="gd" d="m26 255h45q3-6 6-18q3-12 4-29q18 23 42 37q23 15 51 15q28 0 50-16q21-16 33-45q12-28 12-65q0-43-16-74q-15-32-41-49q-25-17-57-17q-20 0-36 7q-16 8-34 20v-58q0-30 2-50q1-19 4-35h-52q0 31 0 68q0 37 0 72q0 35 0 62q0 28 0 41q0 47-2 80q-2 33-11 54zm59-111v-79q17-12 29-18q11-7 20-9q10-3 21-3q18 0 33 11q16 11 25 32q10 20 10 48q0 42-16 67q-15 25-42 25q-21 0-44-19q-22-19-36-55z"/><path id="ge" d="m263 0h-47q0 17 0 37q0 20 0 39q0 20 0 36q0 16 0 26q0 31-5 48q-6 17-17 24q-11 6-28 6q-18 0-34-10q-17-11-29-28q-12-16-18-33v-145h-46q0 23 0 52q0 29 0 57q0 27 0 45q0 37-4 62q-4 26-9 39h45q2-5 4-14q2-10 4-19q2-10 2-16q24 29 48 41q25 13 51 13q40 0 61-26q22-26 22-78q0-11 0-30q0-18 0-41q0-22 0-44q0-22 0-41z"/><path id="gf" d="m210 255h53q-7-14-15-31q-7-17-14-32q-6-16-10-26q-4-8-11-27q-8-19-17-43q-10-24-20-49q-10-25-18-47h-48q-8 21-18 45q-9 24-19 48q-9 24-17 43q-8 20-12 30q-4 11-11 26q-6 15-14 32q-7 17-14 31h53l76-205z"/><path id="gg" d="m94 400v-281q0-16 0-39q1-23 2-44q1-22 3-36h-51v283q0 73-5 117z"/></defs><rect width="960" height="540" fill="#f5f3ee"/><rect x="20" y="16" width="920" height="508" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><rect x="40" y="36" width="420" height="250" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="60" y="68" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den första texten</text><text x="60" y="104" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag stod högst upp i hopptornet.</text><text x="60" y="130" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Det var jättehögt. Jag blev jätterädd</text><text x="60" y="156" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">och ville inte hoppa.</text><text x="60" y="182" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Alla tittade på mig. Jag var så rädd.</text><text x="60" y="208" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Men till slut hoppade jag ändå,</text><text x="60" y="234" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">och det gick bra.</text><rect x="480" y="36" width="440" height="300" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="520" y="68" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den andra texten</text><text x="520" y="104" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag stod högst upp i hopptornet.</text><text x="520" y="130" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Vattnet var så långt ner att</text><text x="520" y="156" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">människorna såg små ut. Benen darrade,</text><text x="520" y="182" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">och jag höll så hårt i räcket att</text><text x="520" y="208" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">fingrarna blev vita. Alla tittade på mig.</text><text x="520" y="234" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag tog ett steg bakåt. Sedan tänkte</text><text x="520" y="260" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">jag på Mira, som väntade i vattnet.</text><text x="520" y="286" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag blundade och hoppade.</text><line x1="504" y1="146" x2="504" y2="216" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><line x1="504" y1="226" x2="504" y2="296" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><g transform="translate(54 352) scale(0.0625 -0.0625)" fill="#1f3a5f"><use xlink:href="#g0"/><use xlink:href="#g1" x="341"/><use xlink:href="#g2" x="629"/><use xlink:href="#g3" x="990"/><use xlink:href="#g4" x="1411"/><use xlink:href="#g2" x="1699"/><use xlink:href="#g5" x="1922"/><use xlink:href="#g6" x="2181"/><use xlink:href="#g2" x="2455"/><use xlink:href="#g7" x="2816"/><use xlink:href="#g8" x="3114"/><use xlink:href="#g7" x="3548"/><use xlink:href="#g6" x="3846"/><use xlink:href="#g9" x="4120"/><use xlink:href="#ga" x="4329"/></g><g transform="translate(54 410) scale(0.0547 -0.0547)" fill="#1f3a5f"><use xlink:href="#gb"/><use xlink:href="#g5" x="279"/><use xlink:href="#g2" x="538"/><use xlink:href="#gc" x="761"/><use xlink:href="#gd" x="1046"/><use xlink:href="#gd" x="1339"/><use xlink:href="#g6" x="1632"/><use xlink:href="#ge" x="1906"/></g><line x1="200" y1="400" x2="494" y2="182" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><path d="M487.5 196.8L494 182L478 183.9" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linejoin="round"/><g transform="translate(54 470) scale(0.0547 -0.0547)" fill="#1f3a5f"><use xlink:href="#gf"/><use xlink:href="#g1" x="268"/><use xlink:href="#gg" x="556"/><use xlink:href="#g6" x="697"/><use xlink:href="#g9" x="971"/><use xlink:href="#g9" x="1318"/><use xlink:href="#g1" x="1527"/><use xlink:href="#g2" x="1815"/><use xlink:href="#g9" x="2176"/><use xlink:href="#gb" x="2385"/><use xlink:href="#g7" x="2526"/></g><line x1="250" y1="460" x2="494" y2="262" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><path d="M488.2 277L494 262L478.1 264.6" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linejoin="round"/></svg>