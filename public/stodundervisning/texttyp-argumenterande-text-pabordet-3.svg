<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Vecka 3 · Gruppens text. Tavlan i pass 6: de två texterna, det du markerade, läsarens fråga och vad förklaringen gör."><title>Vecka 3 · Gruppens text</title><rect width="960" height="540" fill="#f5f3ee"/><rect x="20" y="16" width="920" height="508" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><rect x="40" y="36" width="400" height="136" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="62" y="68" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den första texten</text><text x="62" y="106" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">Skolan borde ha fler rörelsepauser,</text><text x="62" y="132" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">för elever lär sig bättre då.</text><rect x="470" y="36" width="450" height="372" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="520" y="68" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den andra texten</text><text x="520" y="106" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">Skolan borde ha fler rörelsepauser,</text><text x="520" y="132" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">för elever lär sig bättre då.</text><text x="520" y="180" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">När elever får röra på sig en kort stund</text><text x="520" y="206" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">kan de komma tillbaka till arbetet</text><text x="520" y="232" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">med mer fokus.</text><text x="520" y="280" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">Det kan räcka med två minuter där</text><text x="520" y="306" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">klassen sträcker på sig, byter plats</text><text x="520" y="332" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">eller gör en enkel rörelseövning</text><text x="520" y="358" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">innan arbetet fortsätter.</text><line x1="504" y1="162" x2="504" y2="238" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><line x1="504" y1="262" x2="504" y2="364" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><path d="M0 0m1290 0h-205v675h-720v-675h-205q11 60 13 174q2 113 2 261v590q0 148-2 262q-2 113-13 173h205v-625h720v625h205q-11-60-13-173q-2-114-2-262v-590q0-148 2-261q2-114 13-174zM1475 0m1090 0h-170q-14 35-30 90q-17 54-25 110q-91-110-188-167q-97-58-202-58q-320 0-320 430q0 7 0 50q0 43 0 98q0 54 0 97q0 43 0 50q0 95-3 163q-3 67-17 157h205v-555q0-170 38-247q37-78 132-78q59 0 126 45q66 44 122 109q56 65 82 126v280q0 66-1 115q-1 49-5 97q-5 47-14 108h205v-570q0-145 17-255q17-111 48-195zM2660 0m340 0h-185v615q0 147-16 250q-17 103-34 155h180q8-21 16-58q7-37 14-75q7-38 10-62q73 104 165 160q92 55 160 55q84 0 135-47q50-48 73-124q22-76 22-164l-160-35q0 75-28 133q-28 57-87 57q-42 0-95-41q-54-42-101-106q-47-65-69-133zM4100 0m945 660v-660h-185v570q0 124-13 188q-13 63-44 85q-32 22-88 22q-73 0-144-57q-71-58-111-148v-660h-185