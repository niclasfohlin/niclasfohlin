<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Bas, problem 6 · Lösning B. Lösning B, stolpen och fyra trappor. Stolpen har 4 kuber. En trappa har 1 + 2 + 3 = 6 kuber, och fyra trappor 4 · 6 = 24. Tornet har 4 + 24 = 28 kuber. Är tornet 5 högt, har stolpen 5 kuber och en trappa 1 + 2 + 3 + 4 = 10, och 5 + 4 · 10 = 45. Till vänster står stolpen och en trappa ritade framifrån."><title>Bas, problem 6 · Lösning B</title><defs><path id="g0" d="m209 240l-9-44q-12 8-31 16q-19 8-43 8q-27 0-38-11q-10-10-10-21q0-9 4-15q4-6 17-12q12-5 39-11q22-5 41-14q19-9 30-24q11-15 11-38q0-23-13-41q-13-18-34-29q-22-10-49-10q-30 0-56 8q-26 9-40 21l12 45q17-16 41-25q24-9 44-9q22 0 36 10q14 11 14 24q0 9-5 17q-6 8-21 15q-15 7-43 14q-30 7-46 18q-16 11-22 24q-5 14-5 29q0 9 4 21q5 13 15 25q11 13 30 21q18 8 47 8q27 0 47-6q20-7 33-14z"/><path id="g1" d="m190 54v-40q-17-11-33-16q-16-4-29-4q-19 0-35 6q-16 7-26 23q-9 16-9 45q0 9 0 29q0 21 0 48q0 28 0 60q0 32 0 64q0 33 0 61h46q0-32 0-68q0-37 0-71q0-34 0-59q0-25 0-34q0-26 3-40q4-13 11-18q7-5 18-5q20 0 54 19zm-5 159h-177v36h177z"/><path id="g2" d="m24 126q0 43 16 73q17 30 45 46q27 15 60 15q35 0 61-15q26-16 41-46q14-30 14-73q0-43-16-72q-17-30-44-45q-28-15-61-15q-34 0-60 15q-27 15-41 45q-15 29-15 72zm46 0q0-43 20-68q20-24 53-24q30 0 51 24q21 25 21 68q0 44-20 69q-20 25-52 25q-31 0-52-25q-21-25-21-69z"/><path id="g3" d="m94 400v-281q0-16 0-39q1-23 2-44q1-22 3-36h-51v283q0 73-5 117z"/><path id="g4" d="m26 255h45q3-6 6-18q3-12 4-29q18 23 42 37q23 15 51 15q28 0 50-16q21-16 33-45q12-28 12-65q0-43-16-74q-15-32-41-49q-25-17-57-17q-20 0-36 7q-16 8-34 20v-58q0-30 2-50q1-19 4-35h-52q0 31 0 68q0 37 0 72q0 35 0 62q0 28 0 41q0 47-2 80q-2 33-11 54zm59-111v-79q17-12 29-18q11-7 20-9q10-3 21-3q18 0 33 11q16 11 25 32q10 20 10 48q0 42-16 67q-15 25-42 25q-21 0-44-19q-22-19-36-55z"/><path id="g5" d="m247 121h-186v35h142q0 33-18 50q-18 17-45 17q-33 0-51-24q-19-23-19-73q0-46 2