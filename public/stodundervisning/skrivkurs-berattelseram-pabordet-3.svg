="600" fill="#5d6b7a">Där, i stenen, satt ett handtag</text><text x="50" y="194" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">av rost.</text><text x="50" y="228" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">Jag hade gått förbi hundra gånger.</text><text x="50" y="262" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#5d6b7a">Det hade aldrig funnits där.</text><line x1="34" y1="44" x2="34" y2="144" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><line x1="34" y1="240" x2="34" y2="272" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><g transform="translate(50 352) scale(0.0586 -0.0586)" fill="#1f3a5f"><use xlink:href="#g0"/><use xlink:href="#g1" x="259"/><use xlink:href="#g2" x="544"/><use xlink:href="#g3" x="767"/><use xlink:href="#g4" x="976"/><use xlink:href="#g5" x="1402"/><use xlink:href="#g6" x="1823"/><use xlink:href="#g7" x="2097"/><use xlink:href="#g8" x="2393"/><use xlink:href="#g7" x="2534"/><use xlink:href="#g9" x="2830"/><use xlink:href="#g4" x="3111"/><use xlink:href="#g2" x="3399"/></g><g transform="translate(50 410) scale(0.0586 -0.0586)" fill="#1f3a5f"><use xlink:href="#ga"/><use xlink:href="#gb" x="241"/><use xlink:href="#g9" x="529"/><use xlink:href="#g8" x="948"/><use xlink:href="#g7" x="1089"/><use xlink:href="#g3" x="1385"/><use xlink:href="#g6" x="1594"/><use xlink:href="#g4" x="2006"/><use xlink:href="#gc" x="2294"/><use xlink:href="#gc" x="2435"/><use xlink:href="#g3" x="2576"/></g><g transform="translate(50 468) scale(0.0586 -0.0586)" fill="#1f3a5f"><use xlink:href="#g8"/><use xlink:href="#g7" x="141"/><use xlink:href="#g3" x="437"/><use xlink:href="#g6" x="646"/><use xlink:href="#g1" x="1058"/><use xlink:href="#g2" x="1343"/><use xlink:href="#gd" x="1566"/><use xlink:href="#g6" x="1864"/><use xlink: