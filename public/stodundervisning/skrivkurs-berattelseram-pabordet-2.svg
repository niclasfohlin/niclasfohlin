<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Del 1 · Personen. Två texter om Amir på tavlan, med det gruppen hittade i den andra."><title>Del 1 · Personen</title><rect width="960" height="540" fill="#f5f3ee"/><rect x="20" y="16" width="920" height="508" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><rect x="40" y="36" width="420" height="250" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="60" y="68" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den första texten</text><text x="60" y="104" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag heter Amir och jag är tio år.</text><text x="60" y="130" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag har svart hår och en blå jacka.</text><text x="60" y="156" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag är snabb, och jag är bra på fotboll.</text><text x="60" y="182" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Min bästa kompis heter Lisa.</text><text x="60" y="208" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Hon tycker också om fotboll.</text><text x="60" y="234" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag är rädd för mörker.</text><rect x="480" y="36" width="440" height="300" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="520" y="68" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den andra texten</text><text x="520" y="104" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag heter Amir och jag är tio år.</text><text x="520" y="130" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">På rasten är jag först ut på planen</text><text x="520" y="156" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">i min blå jacka, och jag har gjort mål</text><text x="520" y="182" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">innan de andra har hittat sina mössor.</text><text x="520" y="208" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Lisa, min bästa kompis, säger att</text><text x="520" y="234" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">jag har motor i benen. Men när lampan</text><text x="520" y="260" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">slocknar i trapphuset står jag</text><text x="520" y="286" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">alldeles stilla.</text><line x1="504" y1="118" x2="504" y2="190" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><line x1="504" y1="226" x2="504" y2="292" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><path d="M0 0m1290 0h-205v675h-720v-675h-205q11 60 13 174q2 113 2 261v590q0 148-2 262q-2 113-13 173h205v-625h720v625h205q-11-60-13-173q-2-114-2-262v-590q0-148 2-261q2-114 13-174zM1475 0m1090 0h-170q-14 35-30 90q-17 54-25 110q-91-110-188-167q-97-58-202-58q-320 0-320 430q0 7 0 50q0 43 0 98q0 54