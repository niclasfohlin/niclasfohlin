19 32z"/><path id="gb" d="m60 293q0 56 23 84q23 28 63 28q31 0 55-17l-11-40q-20 15-44 15q-19 0-29-14q-11-14-11-46q0-8 0-27q0-18 0-41q0-23 0-46q0-23 0-41q0-17 0-24q0-37 2-70q2-34 6-54h-54q0 35 0 74q0 38 0 75q0 37 0 68q0 31 0 51q0 20 0 25zm-50-80v36h164v-36z"/><path id="gc" d="m24 126q0 43 16 73q17 30 45 46q27 15 60 15q35 0 61-15q26-16 41-46q14-30 14-73q0-43-16-72q-17-30-44-45q-28-15-61-15q-34 0-60 15q-27 15-41 45q-15 29-15 72zm46 0q0-43 20-68q20-24 53-24q30 0 51 24q21 25 21 68q0 44-20 69q-20 25-52 25q-31 0-52-25q-21-25-21-69zm93 210q0 14 9 24q9 10 23 10q14 0 23-10q10-10 10-24q0-13-10-23q-9-10-23-10q-14 0-23 10q-9 10-9 23zm-105 0q0 14 9 24q9 10 23 10q14 0 23-10q10-10 10-24q0-13-10-23q-9-10-23-10q-14 0-23 10q-9 10-9 23z"/><path id="gd" d="m236 165v-165h-46v143q0 31-3 46q-3 16-11 22q-8 5-22 5q-18 0-36-14q-18-14-28-37v-165h-46v154q0 37-4 62q-5 26-9 39h45q3-8 5-19q2-11 3-20q23 27 43 35q20 9 42 9q24 0 40-13q15-12 21-29q24 25 45 34q20 8 40 8q38 0 53-24q15-25 15-71v-165h-47v138q0 32-3 49q-3 17-11 23q-8 6-22 6q-18 0-35-14q-18-13-29-37z"/><path id="ge" d="m83 0h-47q0 30 0 64q0 35 0 69q0 34 0 64q0 30 0 52q0 23 0 34q0 40 0 70q-1 31-3 47h50zm101 255h62l-137-124l-39 7zm-108-117l27 27l151-165h-61z"/><path id="gf" d="m247 121h-186v35h142q0 33-18 50q-18 17-45 17q-33 0-51-24q-19-23-19-73q0-46 23-68q22-23 57-23q24 0 48 6q23 5 46 19l5-41q-27-14-51-20q-25-5-54-5q-32 0-59 15q-28 14-44 43q-17 29-17 72q0 41 14 72q15 30 42 47q27 17 64 17q31 0 51-10q20-11 32-28q11-18 16-39q5-21 5-42q0-3 0-10q0-6-1-10z"/></defs><rect width="960" height="540" fill="#f5f3ee"/><rect x="20" y="16" width="920" height="508" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><rect x="40" y="36" width="420" height="250" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="60" y="68" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den första texten</text><text x="60" y="104" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag heter Amir och jag är tio år.</text><text x="60" y="130" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag har svart hår och en blå jacka.</text><text x="60" y="156" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag är snabb, och jag är bra på fotboll.</text><text x="60" y="182" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Min bästa kompis heter Lisa.</text><text x="60" y="208" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Hon tycker också om fotboll.</text><text x="60" y="234" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag är rädd för mörker.</text><rect x="480" y="36" width="440" height="300" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="520" y="68" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Den andra texten</text><text x="520" y="104" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Jag heter Amir och jag är tio år.</text><text x="520" y="130" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">På rasten är jag först ut på planen</text><text x="520" y="156" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">i min blå jacka, och jag har gjort mål</text><text x="520" y="182" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">innan de andra har hittat sina mössor.</text><text x="520" y="208" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">Lisa, min bästa kompis, säger att</text><text x="520" y="234" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">jag har motor i benen. Men när lampan</text><text x="520" y="260" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">slocknar i trapphuset står jag</text><text x="520" y="286" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#5d6b7a">alldeles stilla.</text><line x1="504" y1="118" x2="504" y2="190" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><line x1="504" y1="226" x2="504" y2="292" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><g transform="translate(54 352) scale(0.0625 -0.0625)" fill="#1f3a5f"><use xlink:href="#g0"/><use xlink:href="#g1" x="369"/><use xlink:href="#g2" x="665"/><use xlink:href="#g3" x="1026"/><use xlink:href="#g2" x="1314"/><use xlink:href="#g4" x="1675"/><use xlink:href="#g5" x="1969"/><use xlink:href="#g6" x="2257"/><use xlink:href="#g7" x="2553"/></g><g transform="translate(54 410) scale(0.0508 -0.0508)" fill="#1f3a5f"><use xlink:href="#g4"/><use xlink:href="#g5" x="294"/><use xlink:href="#g6" x="582"/><use xlink:href="#g3" x="1016"/><use xlink:href="#g2" x="1304"/><use xlink:href="#g8" x="1665"/><use xlink:href="#g6" x="1906"/><use xlink:href="#g5" x="2202"/><use xlink:href="#g9" x="2490"/><use xlink:href="#g9" x="2779"/></g><line x1="230" y1="400" x2="494" y2="160" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><path d="M489 175.3L494 160L478.3 163.5" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linejoin="round"/><g transform="translate(54 470) scale(0.0508 -0.0508)" fill="#1f3a5f"><use xlink:href="#g4"/><use xlink:href="#g5" x="294"/><use xlink:href="#g6" x="582"/><use xlink:href="#g3" x="1016"/><use xlink:href="#g2" x="1304"/><use xlink:href="#g2" x="1665"/><use xlink:href="#g3" x="1888"/><use xlink:href="#ga" x="2176"/><use xlink:href="#ga" x="2474"/><use xlink:href="#gb" x="2910"/><use xlink:href="#gc" x="3098"/><use xlink:href="#g2" x="3383"/><use xlink:href="#gd" x="3744"/><use xlink:href="#gc" x="4165"/><use xlink:href="#g2" x="4450"/><use xlink:href="#ge" x="4673"/><use xlink:href="#gf" x="4932"/><use xlink:href="#g2" x="5206"/></g><line x1="340" y1="462" x2="494" y2="264" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round"/><path d="M491.7 280L494 264L479.1 270.1" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linejoin="round"/></svg>