<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500"><rect width="960" height="500" fill="#f5f3ee"/><g transform="translate(0 0) scale(1 1)" opacity="1"><rect x="8" y="8" width="560" height="130" rx="12" fill="#fff" stroke="#8a95a1" stroke-width="5"/><text x="24" y="42" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#1f3a5f">Skrivfokus: miljö med sinnena</text></g><text x="28" y="112" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#1f3a5f">se · höra · känna · lukta</text><g transform="translate(0 0) scale(1 1)" opacity="1"><rect x="8" y="150" width="944" height="250" rx="10" fill="#fffdf6" stroke="#9aa5b1" stroke-width="2.5"/><text x="28" y="200" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#1b1b1b">Min bok · Del 3</text></g><g transform="translate(0 0) scale(1 1)" opacity="1"><text x="28" y="250" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="36" font-weight="400" fill="#1f3a5f">Jag hörde ett brus långt bort.</text><text x="28" y="314" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="36" font-weight="400" fill="#1f3a5f">Marken var konstig.</text></g><g transform="translate(0 0) scale(1 1)" opacity="0"><line x1="154" y1="302" x2="352" y2="302" stroke="#1f3a5f" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(0 0) scale(1 1)" opacity="0"><text x="368" y="314" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="36" font-weight="400" fill="#1f3a5f">gungade som en säng.</text></g><g transform="translate(480 452) scale(1 1)" opacity="1"><path d="M-374 -22.7H-14L-7 -42.7L5 -22.7H374Q394 -22.7 394 -2.7V2.7Q394 22.7 374 22.7H-374Q-394 22.7 -394 2.7V-2.7Q-394 -22.7 -374 -22.7Z" fill="#e8f1fb" stroke="#8fb3d9" stroke-width="3" stroke-linejoin="round"/><text text-anchor="middle" y="11.2" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="32" fill="#1f3a5f">Här använder du örat. Det är dagens skrivfokus.</text></g><g transform="translate(480 452) scale(1 1)" opacity="0"><path d="M-430 -22.7H-14L-7 -42.7L5 -22.7H430Q450 -22.7 450 -2.7V2.7Q450 22.7 430 22.7H-430Q-450 22.7 -450 2.7V-2.7Q-450 -22.7 -430 -22.7Z" fill="#e8f1fb" stroke="#8fb3d9" stroke-width="3" stroke-linejoin="round"/><text text-anchor="middle" y="11.2" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="32" fill="#1f3a5f">Du skriver att marken var konstig. Vad kände fötterna?</text></g><g transform="translate(480 452) scale(1 1)" opacity="0"><path d="M-230 -22.7H-14L-7 -42.7L5 -22.7H230Q250 -22.7 250 -2.7V2.7Q250 22.7 230 22.7H-230Q-250 22.7 -250 2.7V-2.7Q-250 -22.7 -230 -22.7Z" fill="#e8f1fb" stroke="#8fb3d9" stroke-width="3" stroke-linejoin="round"/><text text-anchor="middle" y="11.2" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="32" fill="#1f3a5f">Läs den meningen för oss sen.</text></g><g transform="translate(498 250) scale(1 1)" opacity="1"><svg x="-6.2" y="-44.7" width="104" height="104" viewBox="0 0 32 32">
