t-size="18" font-weight="600" fill="#5d6b7a">Del 1</text><text x="60" y="110" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">Jag är den enda i</text><text x="60" y="138" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">klassen som vågar</text><text x="60" y="166" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">klättra högst upp</text><text x="60" y="194" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">i kastanjen.</text><ellipse cx="138" cy="192" rx="54" ry="14" fill="none" stroke="#2b6cb0" stroke-width="3"/><rect x="345" y="40" width="270" height="230" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="365" y="72" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">Del 3</text><text x="365" y="110" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">De var silver, och</text><text x="365" y="138" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">när jag rörde ett</text><text x="365" y="166" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">klingade det som en</text><text x="365" y="194" text-anchor="start" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5d6b7a">liten klocka.</text><ellipse cx="454" cy="108" rx="30" ry="14" fill="none" stroke="#2b6cb0" stroke-width="3"/><rect x="650" y="40" width="270" height="230" rx="8" fill="#fff" stroke="#8a95a1" stroke-width="3"/><text x="670" y="72" text-anchor="start" font-f