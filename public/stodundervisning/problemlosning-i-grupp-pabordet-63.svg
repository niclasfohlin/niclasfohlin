<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Avancerat, problem 1 · Lösning B. Lösning B, att kalla trehjulingarna x. Antalet trehjulingar är x, och antalet tvåhjulingar är 11 − x. 3x + 2(11 − x) = 27 blir 3x + 22 − 2x = 27 och x + 22 = 27, där 2 · 11 = 22 är hjulen om alla har två. Då är x = 27 − 22 = 5 trehjulingar, och 11 − 5 = 6 tvåhjulingar. Kontroll: 5 · 3 + 6 · 2 = 15 + 12 = 27."><title>Avancerat, problem 1 · Lösning B</title><defs><path id="g0" d="m201 0l-133 188q-9 11-16 20q-6 9-15 20q-8 11-22 27h58l135-187q9-13 15-21q7-9 15-19q8-10 21-28zm-79 154l17-53l-70-101h-56q13 18 21 29q9 11 15 19q6 9 14 20zm24-53l-16 53l69 101h56q-13-16-21-27q-8-11-14-20q-7-9-15-20z"/><path id="g1" d="m30 120v38h240v-38zm0 88v37h240v-37z"/><path id="g2" d="m264 0h-44q-3 8-6 23q-3 16-4 32q-1 17-1 28v20q-10-26-25-51q-15-25-36-42q-20-16-47-16q-31 0-53 28q-22 28-22 81q0 29 8 57q8 29 25 51q16 23 42 36q25 13 60 13q25 0 46-3q22-3 41-8v-116q0-48 4-80q5-32 12-53zm-63 184v32q-6 1-15 3q-10 1-28 1q-33 0-52-17q-18-17-26-43q-7-27-7-57q0-29 10-48q11-19 26-19q13 0 26 12q14 12 25 30q12 18 21 39q10 20 15 38q5 18 5 29z"/><path id="g3" d="m263 0h-47q0 17 0 37q0 20 0 39q0 20 0 36q0 16 0 26q0 31-5 48q-6 17-17 24q-11 6-28 6q-18 0-34-10q-17-11-29-28q-12-16-18-33v-145h-46q0 23 0 52q0 29 0 57q0 27 0 45q0 37-4 62q-4 26-9 39h45q2-5 4-14q2-10 4-19q2-10 2-16q24 29 48 41q25 13 51 13q40 0 61-26q22-26 22-78q0-11 0-30q0-18 0-41q0-22 0-44q0-22 0-41z"/><path id="g4" d="m190 54v-40q-17-11-33-16q-16-4-29-4q-19 0-35 6q-16 7-26 23q-9 16-9 45q0 9 0 29q0 21 0 48q0 28 0 60q0 32 0 64q0 33 0 61h46q0-32 0-68q0-37 0-71q0-34 0-59q0-25 0-34q0-26 3-40q4-13 11-18q7-5 18-5q20 0 54 19zm-5 159h-177v36h177z"/><path id="g5" d="m94 400v-281q0-16 0-39q1-23 2-44q1-22 3-36h-51v283q0 73-5 117z"/><path id="g6" d="m247 121h-186v35h142q0 33-18 50q-18 17-45 17q-33 0-51-24q-19-23-19-73q0-46 23-68q22-23 57-23q24 0 48 6q23 5 46 19l5-41q-27-14-