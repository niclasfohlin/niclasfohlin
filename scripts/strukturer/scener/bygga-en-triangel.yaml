# Bygga en triangel: gruppen har satt upp begreppskorten i en triangel på tavlan, med det viktigaste överst, och står
# runt den. En pekar på kortet i toppen och säger varför det är viktigast, och en annan pekar dit och frågar varför.
# Triangeln står upp på väggen och inte platt på ett bord, så att den inte förväxlas med 5-3-1:s tratt på bordet
# (granskningen av arket, tredje varvet), och ingen håller upp ett kort.
id: bygga-en-triangel
skala: 70
djup: false
luft: 0.06
fokus: toppen
delar:
  - tavla: { x: 450, y: 300, b: 290, h: 236 }
  - papper: { x: 366, y: 362, b: 48, h: 32, vinkel: -2, rader: 2 }
  - papper: { x: 422, y: 362, b: 48, h: 32, vinkel: 2, rader: 2 }
  - papper: { x: 478, y: 362, b: 48, h: 32, vinkel: -1, rader: 2 }
  - papper: { x: 534, y: 362, b: 48, h: 32, vinkel: 3, rader: 2 }
  - papper: { x: 394, y: 316, b: 48, h: 32, vinkel: 1, rader: 2 }
  - papper: { x: 450, y: 316, b: 48, h: 32, vinkel: -3, rader: 2 }
  - papper: { x: 506, y: 316, b: 48, h: 32, vinkel: 2, rader: 2 }
  - papper: { x: 422, y: 270, b: 48, h: 32, vinkel: -2, rader: 2 }
  - papper: { x: 478, y: 270, b: 48, h: 32, vinkel: 2, rader: 2 }
  - papper: { namn: toppen, x: 450, y: 222, b: 52, h: 34, vinkel: -1, rader: 0, symbol: stjarna, symbolPlats: [0, 0], symbolStorlek: 0.36 }
  - figur: { namn: bredvidV, x: 186, y: 520, trojan: gul, ansikte: glad, tittar: toppen, lutar: toppen }
  - figur: { namn: forklarar, x: 270, y: 526, trojan: gron, ansikte: prata, tittar: fragar, lutar: toppen, pekar: { mal: toppen, dx: -18, dy: 4 } }
  - figur: { namn: fragar, x: 632, y: 526, trojan: rosa, ansikte: glad, tittar: forklarar, lutar: toppen, pekar: { mal: toppen, dx: 20, dy: 6 } }
  - figur: { namn: bredvidH, x: 716, y: 520, trojan: ljusbla, ansikte: tanka, tittar: toppen, lutar: toppen }
  - bubbla: { till: forklarar, dx: -40, dy: 40, symboler: [stjarna], visar: "Den som pekar på kortet i toppen säger varför det är viktigast" }
  - bubbla: { till: fragar, dx: 40, dy: 40, symboler: [fraga], visar: "En annan frågar varför: gruppen måste kunna motivera ordningen" }
