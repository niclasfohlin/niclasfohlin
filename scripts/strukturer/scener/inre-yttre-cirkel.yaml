# Inre–yttre cirkel: två ringar, de inre vända utåt mot en partner i den yttre. I paret närmast frågar den yttre och den
# inre svarar, och den yttre ringen flyttar ett steg till nästa fråga. Fyra par snett fram och bak, så att varje par
# möts ansikte mot ansikte och inget par står bakom ett annat.
